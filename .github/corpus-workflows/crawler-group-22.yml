name: Crawler Group 22 (sparse cross-repo execution)
run-name: crawler-generation-${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}-group-22
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Generation correlation token <run_id>-<run_attempt>; leave empty on a manual dispatch to derive it from this run
        required: false
        default: ""
        type: string
      site_code_commit:
        description: Full immutable site commit used by this generation (empty keeps legacy main)
        required: false
        default: ""
        type: string
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
concurrency:
  group: jobs-crawler-group-22
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_22:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      AI_CACHE_PATH: .cache/jobs-ai-cache.json
    steps:
      - name: Checkout frontaliere-si-o-no (attempt 1/2, sparse)
        id: site_checkout_primary
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          persist-credentials: false
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Backoff 30s before checkout retry
        if: steps.site_checkout_primary.outcome == 'failure'
        run: |-
          echo "First sparse checkout failed; retrying in 30s"
          sleep 30
      - name: Checkout frontaliere-si-o-no (attempt 2/2, sparse)
        id: site_checkout_retry
        if: steps.site_checkout_primary.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          persist-credentials: false
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Report exhausted site checkout
        if: always() && steps.site_checkout_primary.outcome == 'failure' && steps.site_checkout_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Workflow Failure: Crawler Group 22 (sparse cross-repo execution)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          message="Both sparse checkout attempts failed before crawler/translation logic started. Run: ${RUN_URL}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$message"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$message"
          fi
      - name: Confirm site checkout succeeded
        id: checkout
        if: always() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        run: "true"
      - name: Validate crawler generation token before crawling
        run: node scripts/check-crawler-generation-token.mjs
      - name: Restore crawler AI cache
        id: restore_crawler_ai_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-22-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-ai-cache-v1-crawler-group-22-${{ github.repository }}-${{ runner.os }}-
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/crawler-retry-cmd.sh npm ci
      - name: Restore per-company translation cache
        id: translation_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-22-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-cache-v1-crawler-group-22-
      - name: Prepare per-company translation cache
        if: always()
        env:
          TRANSLATION_CACHE_MATCHED_KEY: ${{ steps.translation_cache_restore.outputs.cache-matched-key }}
        run: |-
          mkdir -p data/translation-cache
          if [ -n "$TRANSLATION_CACHE_MATCHED_KEY" ]; then
            echo "✅ Per-company translation cache restored: $TRANSLATION_CACHE_MATCHED_KEY"
            echo "translation-cache: hit ($TRANSLATION_CACHE_MATCHED_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Per-company translation cache miss; translations will repopulate it."
            echo "translation-cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Playwright browsers
        run: bash scripts/ci/crawler-retry-cmd.sh npx playwright install --with-deps chromium
      - name: Prepare Firebase credentials and global data lease
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to acquire the global data pipeline lease; refusing to continue to shared crawler commits."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          echo "DATA_PIPELINE_LEASE=1" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 31 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-22.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: ./.github/actions/setup-omniroute
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Report shared setup failure to GitHub Issues
        if: failure() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        uses: ./.github/actions/report-failure
        with:
          title: "Workflow Failure: Crawler Group 22 (sparse cross-repo execution)"
          closed-by: close-recovered-failure-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow-name: Crawler Group 22 (sparse cross-repo execution)
          workflow-file: .github/corpus-workflows/crawler-group-22.yml
          priority: "2"
      - name: Launch rittmeyer
        id: crawler-launch-rittmeyer
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-rittmeyer.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_RITTMEYER_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: rittmeyer-ag
          JOBS_SLICE_FILE: data/jobs/by-crawler/rittmeyer-ag.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-22"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/rittmeyer.sh"
          launcher_path="$state_dir/rittmeyer.launcher.sh"
          worker_path="$state_dir/rittmeyer.worker.sh"
          log_path="$state_dir/rittmeyer.log"
          pid_path="$state_dir/rittmeyer.pid"
          status_path="$state_dir/rittmeyer.status"
          started_path="$state_dir/rittmeyer.started"
          watchdog_path="$state_dir/rittmeyer-ag.watchdog"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$state_dir/rittmeyer-ag.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e

          npm run jobs:update:rittmeyer
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::rittmeyer: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          report_exit=0

          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💧 Auto-update Rittmeyer jobs (dedicated crawler)"'\''
            git_commit_exit=$?
          fi

          if (( (crawler_exit != 0 && crawler_exit != 143) || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
              --title "Crawler Failure: Run rittmeyer" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run rittmeyer"
            report_exit=$?; [ "$report_exit" -eq 0 ] || echo "::error::alert reporter failed rittmeyer"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::rittmeyer: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ rittmeyer: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::rittmeyer: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ rittmeyer: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::rittmeyer: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ rittmeyer: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::rittmeyer: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ rittmeyer: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi

          (( git_commit_exit == 45 )) && exit 45
          if (( (crawler_exit != 0 && crawler_exit != 143) || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 44 && git_commit_exit != 143) )) || (( report_exit != 0 )); then
            exit 1
          fi
          exit 0' > "$script_path"
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.sh"
          worker_status_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.worker.status"
          worker_status_tmp="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.worker.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.started"
          export CRAWLER_MEMBER_CRAWL_EXIT_FILE="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer-ag.crawl-exit"
          export CRAWLER_MEMBER_LOG_FILE="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.log"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$worker_status_tmp"
          mv -f "$worker_status_tmp" "$worker_status_file"
          exit "$crawler_exit"' > "$worker_path"
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-22"
          worker_path="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.status.tmp.$$"
          worker_status_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.worker.status"
          started_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer.started"
          watchdog_file="$RUNNER_TEMP/crawler-generation/group-22/rittmeyer-ag.watchdog"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-169}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 169)"
            worker_watchdog_minutes=169
          fi
          resolveCrawlerTerminalStatus() {
            local wrapper_exit="$1"
            local worker_status=""
            local terminal_exit="$wrapper_exit"
            local watchdog_marker=1
            if [[ "$wrapper_exit" =~ ^[0-9]+$ ]] && { [ "$wrapper_exit" -eq 124 ] || [ "$wrapper_exit" -eq 137 ]; }; then
              terminal_exit="$wrapper_exit"
              if [ -s "$worker_status_file" ]; then
                worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
                if [ "$worker_status" -eq 1 ] 2>/dev/null || [ "$worker_status" -eq 124 ] 2>/dev/null; then watchdog_marker=0; fi
              fi
            elif [ -s "$worker_status_file" ]; then
              worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
              if [[ "$worker_status" =~ ^[0-9]+$ ]]; then terminal_exit="$worker_status"; else terminal_exit=1; fi
            else
              if ! [[ "$terminal_exit" =~ ^[0-9]+$ ]]; then terminal_exit=143; fi
              if [ -e "$started_file" ] && [ "$terminal_exit" -eq 0 ]; then terminal_exit=143; fi
            fi
            if [ "$watchdog_marker" -eq 1 ]; then
              if [ "$terminal_exit" -eq 124 ] || [ "$terminal_exit" -eq 137 ]; then printf '\''%s\n'\'' "$worker_watchdog_minutes" > "$watchdog_file"; fi
            fi
            if ! { printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp" && mv -f "$status_tmp" "$status_file"; } 2>/dev/null; then
              echo "::error::could not publish the crawler terminal status" >&2
              return 1
            fi
            printf '\''%s\n'\'' "$terminal_exit"
          }
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            terminal_exit="$(resolveCrawlerTerminalStatus 1)"
            exit "$terminal_exit"
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            terminal_exit="$(resolveCrawlerTerminalStatus 127)"
            exit "$terminal_exit"
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -s "$worker_status_file" ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -e "$started_file" ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch saint-gobain-weber-isover
        id: crawler-launch-saint-gobain-weber-isover
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-saint-gobain-weber-isover.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_SAINT_GOBAIN_WEBER_ISOVER_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: saint-gobain-weber-isover
          JOBS_SLICE_FILE: data/jobs/by-crawler/saint-gobain-weber-isover.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-22"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/saint-gobain-weber-isover.sh"
          launcher_path="$state_dir/saint-gobain-weber-isover.launcher.sh"
          worker_path="$state_dir/saint-gobain-weber-isover.worker.sh"
          log_path="$state_dir/saint-gobain-weber-isover.log"
          pid_path="$state_dir/saint-gobain-weber-isover.pid"
          status_path="$state_dir/saint-gobain-weber-isover.status"
          started_path="$state_dir/saint-gobain-weber-isover.started"
          watchdog_path="$state_dir/saint-gobain-weber-isover.watchdog"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$state_dir/saint-gobain-weber-isover.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e

          node scripts/update-saint-gobain-weber-isover-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
