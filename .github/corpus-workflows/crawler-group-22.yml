          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ steps.crawler_aggregate.outputs.wait_outcome || 'failure' }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"alcon","primarySlice":"data/jobs/by-crawler/alcon.json"},{"crawlerId":"ariston-group","primarySlice":"data/jobs/by-crawler/ariston-group.json"},{"crawlerId":"bachtelen","primarySlice":"data/jobs/by-crawler/bachtelen.json"},{"crawlerId":"bossard","primarySlice":"data/jobs/by-crawler/bossard.json"},{"crawlerId":"clinica-holistica-engiadina","primarySlice":"data/jobs/by-crawler/clinica-holistica-engiadina.json"},{"crawlerId":"corner-banca","primarySlice":"data/jobs/by-crawler/corner-banca.json"},{"crawlerId":"eth-zurich","primarySlice":"data/jobs/by-crawler/eth-zurich.json"},{"crawlerId":"ferring","primarySlice":"data/jobs/by-crawler/ferring.json"},{"crawlerId":"giardino","primarySlice":"data/jobs/by-crawler/giardino.json"},{"crawlerId":"heineken-ch","primarySlice":"data/jobs/by-crawler/heineken-ch.json"},{"crawlerId":"huntsman","primarySlice":"data/jobs/by-crawler/huntsman.json"},{"crawlerId":"klinik-seeschau","primarySlice":"data/jobs/by-crawler/klinik-seeschau.json"},{"crawlerId":"kudelski-nagra","primarySlice":"data/jobs/by-crawler/kudelski-nagra.json"},{"crawlerId":"lindenhofgruppe","primarySlice":"data/jobs/by-crawler/lindenhofgruppe.json"},{"crawlerId":"med-ipersonal","primarySlice":"data/jobs/by-crawler/med-ipersonal.json"},{"crawlerId":"mistral-ai","primarySlice":"data/jobs/by-crawler/mistral-ai.json"},{"crawlerId":"mks-pamp","primarySlice":"data/jobs/by-crawler/mks-pamp.json"},{"crawlerId":"oerlikon","primarySlice":"data/jobs/by-crawler/oerlikon.json"},{"crawlerId":"otis","primarySlice":"data/jobs/by-crawler/otis.json"},{"crawlerId":"pks-bewerbung-ch","primarySlice":"data/jobs/by-crawler/pks-bewerbung-ch.json"},{"crawlerId":"project-interim","primarySlice":"data/jobs/by-crawler/project-interim.json"},{"crawlerId":"reha-bellikon","primarySlice":"data/jobs/by-crawler/reha-bellikon.json"},{"crawlerId":"rh-expert-ch","primarySlice":"data/jobs/by-crawler/rh-expert-ch.json"},{"crawlerId":"rittmeyer-ag","primarySlice":"data/jobs/by-crawler/rittmeyer-ag.json"},{"crawlerId":"saint-gobain-weber-isover","primarySlice":"data/jobs/by-crawler/saint-gobain-weber-isover.json"},{"crawlerId":"scandit","primarySlice":"data/jobs/by-crawler/scandit.json"},{"crawlerId":"spital-davos","primarySlice":"data/jobs/by-crawler/spital-davos.json"},{"crawlerId":"spital-thusis","primarySlice":"data/jobs/by-crawler/spital-thusis.json"},{"crawlerId":"stadt-zuerich","primarySlice":"data/jobs/by-crawler/stadt-zuerich.json"},{"crawlerId":"tl-lausanne","primarySlice":"data/jobs/by-crawler/tl-lausanne.json"},{"crawlerId":"yellowshark","primarySlice":"data/jobs/by-crawler/yellowshark.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-22-terminal.json
          CRAWLER_GENERATION_LEDGER_PATH: data/crawler-generation-ledger.jsonl
        run: node scripts/crawler-group-generation-finalizer.mjs
      - name: Report crawler generation finalizer failure
        if: always() && steps.crawler-generation-finalizer.outcome == 'failure'
        continue-on-error: true
        run: |-
          echo "::error::crawler generation finalizer failed; ledger persistence skipped so a missing/partial manifest cannot be recorded as success"
          echo "❌ crawler generation finalizer failed; ledger persistence skipped (no false-success ledger entry)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Persist crawler generation ledger
        if: always() && steps.crawler-generation-finalizer.outcome == 'success'
        env:
          CRAWLER_GENERATION_RECEIPT_DIR: ""
          SKIP_AI_TRANSLATION: "1"
        run: |-
          set +e
          commit_attempt=1
          commit_max_attempts=3
          while true; do
            if ! node scripts/ci/validate-workflow-data.mjs --kind crawler-generation-ledger --file data/crawler-generation-ledger.jsonl; then
              echo "::error::crawler generation ledger validation failed; data/crawler-generation-ledger.jsonl was not committed"
              echo "❌ crawler generation ledger validation failed; data/crawler-generation-ledger.jsonl was not committed" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            bash scripts/lib/git-commit-data.sh --extra-only "Record crawler generation ledger" data/crawler-generation-ledger.jsonl
            git_commit_exit=$?
            if [ "$git_commit_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 46 ]; then
              if [ "$git_commit_exit" -eq 43 ]; then
                echo "::error::crawler generation ledger: shared deferred-commit precondition failed (exit 43)"
                echo "❌ crawler generation ledger: shared deferred-commit precondition failed (exit 43)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::crawler generation ledger persistence failed (exit $git_commit_exit)"
                echo "❌ crawler generation ledger persistence failed (exit $git_commit_exit)" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit "$git_commit_exit"
            fi
            if [ "$commit_attempt" -ge "$commit_max_attempts" ]; then
              echo "::error::crawler generation ledger: same-generation retry budget exhausted after $commit_attempt/$commit_max_attempts attempts (exit $git_commit_exit)"
              echo "❌ crawler generation ledger: same-generation retry budget exhausted (exit $git_commit_exit); group remains failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            retry_delay=$((commit_attempt * 15))
            echo "::warning::crawler generation ledger: retryable commit exit $git_commit_exit; retrying the same generation in $retry_delay seconds (attempt $commit_attempt/$commit_max_attempts)"
            echo "⚠️ crawler generation ledger: retrying the same generation after exit $git_commit_exit in $retry_delay seconds" >> "$GITHUB_STEP_SUMMARY"
            sleep "$retry_delay"
            commit_attempt=$((commit_attempt + 1))
          done
      - name: Upload crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-22-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-22-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Fail crawler group after all member outcomes
        if: always()
        env:
          CRAWLER_AGGREGATE_OUTCOME: ${{ steps.crawler_aggregate.outcome }}
          CRAWLER_AGGREGATE_SUCCESS: ${{ steps.crawler_aggregate.outputs.success_count || 'invalid' }}
          CRAWLER_AGGREGATE_FAILURES: ${{ steps.crawler_aggregate.outputs.failure_count || 'invalid' }}
          CRAWLER_AGGREGATE_MISSING: ${{ steps.crawler_aggregate.outputs.missing_count || 'invalid' }}
          CRAWLER_AGGREGATE_SYSTEMIC: ${{ steps.crawler_aggregate.outputs.systemic_count || '0' }}
        run: |-
          set -euo pipefail
          aggregate_outcome="${CRAWLER_AGGREGATE_OUTCOME:-failure}"
          success_count="${CRAWLER_AGGREGATE_SUCCESS:-invalid}"
          failure_count="${CRAWLER_AGGREGATE_FAILURES:-invalid}"
          missing_count="${CRAWLER_AGGREGATE_MISSING:-invalid}"
          systemic_count="${CRAWLER_AGGREGATE_SYSTEMIC:-0}"
          if [ "$aggregate_outcome" != "success" ]; then
            echo "::error::crawler aggregate step did not complete; group failed after preserving already-running siblings"
            exit 1
          fi
          for count in "$success_count" "$failure_count" "$missing_count" "$systemic_count"; do
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::crawler aggregate produced an invalid count: $count"
              exit 1
            fi
          done
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ]; then
            echo "::error::crawler group completed with $success_count succeeded, $failure_count failed, $missing_count missing, $systemic_count systemic; healthy siblings were preserved, but the group remains failed until incomplete crawlers are recovered"
            exit 1
          fi
          if [ "$systemic_count" -gt 0 ]; then
            echo "::error::crawler group interrupted: $systemic_count member(s) stopped by a runner shutdown (exit 143) before completing; $success_count succeeded and were preserved, no per-crawler issue filed (systemic class), and the interrupted crawlers keep their previous data until the next wave"
            exit 1
          fi
          echo "✅ all $success_count crawler members completed successfully; $systemic_count systemic outcomes recorded"
      - name: Release cross-entry crawler live-run lease
        if: always() && env.CRAWLER_GROUP_LIVE_LEASE_OWNED == '1'
        continue-on-error: true
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-22.yml --release
