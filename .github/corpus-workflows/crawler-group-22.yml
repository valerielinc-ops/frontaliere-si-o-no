          aggregate_crawler_member() {
            slug="$1"
            crawler_id="${2:-$slug}"
            status_file="$state_dir/$slug.status"
            if [ ! -s "$status_file" ]; then
              echo "::warning::$slug: no terminal status was published"
              printf '%s\n' "| $slug | missing status |" >> "$summary_file"
              missing_count=$((missing_count + 1))
            else
              status="$(cat "$status_file" 2>/dev/null || true)"
              if ! [[ "$status" =~ ^[0-9]+$ ]]; then
                echo "::error::$slug: invalid terminal status: $status"
                printf '%s\n' "| $slug | invalid status |" >> "$summary_file"
                failure_count=$((failure_count + 1))
              elif [ "$status" -eq 45 ]; then
                echo "::error::$slug: global data-pipeline lease hit consecutive transient Firestore errors (exit 45); this generation will not retry and no per-crawler issue will be filed (systemic class)"
                printf '%s\n' "| $slug | global lease transient error (45) |" >> "$summary_file"
                failure_count=$((failure_count + 1))
              elif [ "$status" -eq 124 ]; then
                echo "::error::$slug: target timeout recorded as an actionable failure (exit 124)"
                printf '%s\n' "| $slug | target timeout (124) |" >> "$summary_file"
                failure_count=$((failure_count + 1))
              elif [ "$status" -eq 143 ]; then
                echo "::warning::$slug: runner shutdown recorded as systemic outcome (exit 143); no per-crawler issue filed"
                printf '%s\n' "| $slug | systemic runner shutdown (143) |" >> "$summary_file"
                systemic_count=$((systemic_count + 1))
              elif [ "$status" -eq 0 ]; then
                printf '%s\n' "| $slug | success |" >> "$summary_file"
                success_count=$((success_count + 1))
              else
                echo "::error::$slug: crawler exited with status $status"
                printf '| %s | failed (%s) |\n' "$slug" "$status" >> "$summary_file"
                failure_count=$((failure_count + 1))
              fi
            fi
            watchdog_file="$state_dir/$crawler_id.watchdog"
            watchdog_status="$(cat "$state_dir/$slug.status" 2>/dev/null || true)"
            if [ -e "$watchdog_file" ] && { [ "$watchdog_status" = "124" ] || [ "$watchdog_status" = "137" ]; }; then
              watchdog_minutes="$(cat "$watchdog_file" 2>/dev/null || true)"
              echo "::error::$slug: the worker watchdog stopped the crawler after ${watchdog_minutes:-?} minutes, before its own failure reporter could run; filing the per-crawler issue from the aggregate"
              watchdog_description="$(printf '%s\n' '## Crawler fallito' "**Causa:** il watchdog del worker ha fermato il crawler dopo ${watchdog_minutes:-?} minuti (exit ${watchdog_status}), prima che potesse segnalare il fallimento." "**Run:** https://github.com/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}" "**Branch:** ${GITHUB_REF_NAME:-}" "**Trigger:** ${GITHUB_EVENT_NAME:-}")"
              if ! node scripts/lib/github-issue-creator.mjs --title "Crawler Failure: Run $slug" --description "$watchdog_description" --log-excerpt-file "$state_dir/$slug.log" --priority 2 --label Bug --workflow "Run $slug" --require-persisted; then
                echo "::error::$slug: the watchdog-timeout issue could not be filed; failing the group verdict"
                failure_count=$((failure_count + 1))
              fi
            fi
          }
          aggregate_crawler_member 'rittmeyer' 'rittmeyer-ag'
          aggregate_crawler_member 'saint-gobain-weber-isover'
          aggregate_crawler_member 'spital-davos'
          aggregate_crawler_member 'lindenhofgruppe'
          aggregate_crawler_member 'scandit'
          aggregate_crawler_member 'spital-thusis'
          aggregate_crawler_member 'reha-bellikon'
          aggregate_crawler_member 'heineken-ch'
          aggregate_crawler_member 'mkspamp' 'mks-pamp'
          aggregate_crawler_member 'ferring'
          aggregate_crawler_member 'mistral-ai'
          aggregate_crawler_member 'stadt-zuerich'
          aggregate_crawler_member 'klinik-seeschau'
          aggregate_crawler_member 'huntsman'
          aggregate_crawler_member 'med-ipersonal'
          aggregate_crawler_member 'kudelski-nagra'
          aggregate_crawler_member 'tl-lausanne'
          aggregate_crawler_member 'otis'
          aggregate_crawler_member 'oerlikon'
          aggregate_crawler_member 'corner' 'corner-banca'
          aggregate_crawler_member 'eth-zurich'
          aggregate_crawler_member 'giardino'
          aggregate_crawler_member 'bossard'
          aggregate_crawler_member 'clinica-holistica-engiadina'
          aggregate_crawler_member 'ariston' 'ariston-group'
          aggregate_crawler_member 'bachtelen'
          aggregate_crawler_member 'alcon'
          aggregate_crawler_member 'yellowshark'
          aggregate_crawler_member 'rh-expert-ch'
          aggregate_crawler_member 'project-interim'
          aggregate_crawler_member 'pks-bewerbung-ch'
          printf '%s\n' "**Summary:** $success_count succeeded, $failure_count failed, $missing_count missing, $systemic_count systemic." >> "$summary_file"
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ] || [ "$systemic_count" -gt 0 ]; then
            wait_outcome=failure
          else
            wait_outcome=success
          fi
          printf '%s\n' "success_count=$success_count" "failure_count=$failure_count" "missing_count=$missing_count" "systemic_count=$systemic_count" "wait_outcome=$wait_outcome" >> "$output_file"
          exit 0
      - name: Commit crawler group data atomically
        if: always() && job.status == 'success' && steps.crawler_group_setup.outcome == 'success' && steps.crawler_aggregate.outcome == 'success'
        run: |-
          set +e
          commit_attempt=1
          commit_max_attempts=3
          while true; do
            bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 22 jobs"
            git_commit_exit=$?
            if [ "$git_commit_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$git_commit_exit" -eq 46 ] && bash scripts/lib/git-commit-data.sh --group-receipt-repair "Repair crawler group 22 delivery receipts"; then exit 0; fi
            if [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 46 ]; then
            echo "::error::group commit failed (exit $git_commit_exit); token-bound output was not published"
            echo "❌ group commit failed (exit $git_commit_exit)" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            if [ "$commit_attempt" -ge "$commit_max_attempts" ]; then
              echo "::error::group commit: same-generation retry budget exhausted after $commit_attempt/$commit_max_attempts attempts (exit $git_commit_exit)"
              echo "❌ group commit: same-generation retry budget exhausted (exit $git_commit_exit); group remains failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            retry_delay=$((commit_attempt * 15))
            echo "::warning::group commit: retryable commit exit $git_commit_exit; retrying the same generation in $retry_delay seconds (attempt $commit_attempt/$commit_max_attempts)"
            echo "⚠️ group commit: retrying the same generation after exit $git_commit_exit in $retry_delay seconds" >> "$GITHUB_STEP_SUMMARY"
            sleep "$retry_delay"
            commit_attempt=$((commit_attempt + 1))
          done
      - name: Save crawler AI cache
        if: always() && hashFiles('.cache/jobs-ai-cache.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-22-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save per-company translation cache
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-22-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then exit 0; fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Finalize crawler generation manifest (shadow)
