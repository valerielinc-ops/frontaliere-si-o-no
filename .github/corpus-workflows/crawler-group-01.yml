name: Crawler Group 01 (sparse cross-repo execution)
run-name: crawler-generation-${{ inputs.generation_token }}-group-01
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: false
        default: ""
        type: string
      site_code_commit:
        description: Full immutable site commit used by this generation (empty keeps legacy main)
        required: false
        default: ""
        type: string
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (1=yes)
        required: false
        default: "1"
        type: string
concurrency:
  group: jobs-crawler-group-01
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_01:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
    steps:
      - name: Checkout frontaliere-si-o-no (attempt 1/2, sparse)
        id: site_checkout_primary
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Backoff 30s before checkout retry
        if: steps.site_checkout_primary.outcome == 'failure'
        run: |-
          echo "First sparse checkout failed; retrying in 30s"
          sleep 30
      - name: Checkout frontaliere-si-o-no (attempt 2/2, sparse)
        id: site_checkout_retry
        if: steps.site_checkout_primary.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Report exhausted site checkout
        if: always() && steps.site_checkout_primary.outcome == 'failure' && steps.site_checkout_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Workflow Failure: Crawler Group 01 (sparse cross-repo execution)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          message="Both sparse checkout attempts failed before crawler/translation logic started. Run: ${RUN_URL}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$message"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$message"
          fi
      - name: Confirm site checkout succeeded
        id: checkout
        if: always() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        run: "true"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/crawler-retry-cmd.sh npm ci
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 1 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-01.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: ./.github/actions/setup-omniroute
      - uses: ./.github/actions/setup-claude-haiku-fallback
      - name: Report shared setup failure to GitHub Issues
        if: failure() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        uses: ./.github/actions/report-failure
        with:
          title: "Workflow Failure: Crawler Group 01 (sparse cross-repo execution)"
          closed-by: close-recovered-failure-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow-name: Crawler Group 01 (sparse cross-repo execution)
          workflow-file: .github/corpus-workflows/crawler-group-01.yml
          priority: "2"
      - name: Run coop
        id: crawler-coop
        background: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-coop.txt
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOBS_CRAWLER_TIMEOUT_MS: ${{ github.event.inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_COOP_STRICT: ${{ github.event.inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '1' }}
          JOBS_HOUSEKEEPING_SCOPE: coop-ticino
          JOBS_SLICE_FILE: data/jobs/by-crawler/coop-ticino.json
        run: |-
          set -uo pipefail
          set +e

          # ---- coop: run crawler (verbatim from original workflow) ----
          npm run jobs:update:coop
          crawler_exit=$?
          git_commit_exit=0

          # ---- coop: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- coop: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c 'bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Coop jobs (dedicated crawler)"'
            git_commit_exit=$?
          fi

          # ---- coop: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run coop" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run coop"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::coop: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ coop: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            exit 1
          fi
          exit 0
      - name: Wait for all crawlers in this group
        wait-all: true
      - name: Commit crawler group data atomically
        if: always()
        run: bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 01 jobs"
      - name: Finalize crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        env:
          CRAWLER_GENERATION_GROUP: "01"
          CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token }}
          CRAWLER_GENERATION_CALLER_REPOSITORY: ${{ github.repository }}
          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ job.status }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"coop-ticino","primarySlice":"data/jobs/by-crawler/coop-ticino.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-01-terminal.json
        run: node scripts/crawler-group-generation-finalizer.mjs
      - name: Upload crawler generation manifest (shadow)
        if: always()
