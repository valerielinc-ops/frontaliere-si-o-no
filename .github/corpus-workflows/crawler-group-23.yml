name: Crawler Group 23 (sparse cross-repo execution)
run-name: crawler-generation-${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}-group-23
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Generation correlation token <run_id>-<run_attempt>; leave empty on a manual dispatch to derive it from this run
        required: false
        default: ""
        type: string
      site_code_commit:
        description: Full immutable site commit used by this generation (empty keeps legacy main)
        required: false
        default: ""
        type: string
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
concurrency:
  group: jobs-crawler-group-23
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_23:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      AI_CACHE_PATH: .cache/jobs-ai-cache.json
    steps:
      - name: Configure shared Workday egress state
        shell: bash
        run: echo "WORKDAY_EGRESS_STATE_DIR=$RUNNER_TEMP/crawler-generation/workday-egress" >> "$GITHUB_ENV"

      - name: Cleanup stale crawler generation state
        run: |-
          set -uo pipefail
          runner_temp="${RUNNER_TEMP:-}"
          runner_temp="${runner_temp%/}"
          case "$runner_temp" in /*[!/]*) ;; *)
            echo "::warning::crawler generation cleanup skipped: RUNNER_TEMP is unavailable or unsafe"
            exit 0
            ;;
          esac
          generation_dir="$runner_temp/crawler-generation"
          if [ -L "$generation_dir" ]; then
            echo "::warning::crawler generation cleanup refused a symlinked generation directory"
            exit 1
          fi
          state_dir="$generation_dir/group-23"
          if [ ! -d "$state_dir" ]; then exit 0; fi
          if [ -L "$state_dir" ]; then
            echo "::warning::crawler generation cleanup refused a symlinked state directory"
            exit 1
          fi
          cleanupCrawlerGenerationState() {
            local own_pgid process_listing process_groups process_states active_groups pgid active
            own_pgid="$(ps -o pgid= -p "$$" 2>/dev/null | tr -d '[:space:]')"
            if ! [[ "$own_pgid" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::crawler generation cleanup could not identify its own process group"
              return 1
            fi
            if ! process_listing="$(ps -ww -eo pgid=,comm=,args= 2>/dev/null)"; then
              echo "::warning::crawler generation cleanup could not inspect runner processes"
              return 1
            fi
            process_groups="$(printf '%s\n' "$process_listing" | awk -v target="$state_dir/" '$2 ~ /^(bash|timeout|flock|nohup|setsid)$/ && index($0, target) > 0 { print $1 }' | sort -nu)"
            for pgid in $process_groups; do
              if ! [[ "$pgid" =~ ^[1-9][0-9]*$ ]] || [ "$pgid" -le 1 ] || [ "$pgid" = "$own_pgid" ]; then
                echo "::warning::crawler generation cleanup refused an unsafe process group: $pgid"
                return 1
              fi
            done
            for pgid in $process_groups; do kill -TERM -- "-$pgid" 2>/dev/null || true; done
            active=0
            for _ in 1 2 3 4 5; do
              if ! process_states="$(ps -ww -eo pgid=,stat= 2>/dev/null)"; then
                echo "::warning::crawler generation cleanup could not verify terminated workers"
                return 1
              fi
              active_groups="$(printf '%s\n' "$process_states" | awk '$2 !~ /^Z/ { print $1 }' | sort -nu)"
              active=0
              for pgid in $process_groups; do
                case " $active_groups " in *" $pgid "*) active=1 ;; esac
              done
              [ "$active" -eq 1 ] || break
              sleep 1
            done
            if [ "$active" -eq 1 ]; then
              for pgid in $process_groups; do
                case " $active_groups " in *" $pgid "*) kill -KILL -- "-$pgid" 2>/dev/null || true ;; esac
              done
              for _ in 1 2 3; do
                if ! process_states="$(ps -ww -eo pgid=,stat= 2>/dev/null)"; then
                  echo "::warning::crawler generation cleanup could not verify killed workers"
                  return 1
                fi
                active_groups="$(printf '%s\n' "$process_states" | awk '$2 !~ /^Z/ { print $1 }' | sort -nu)"
                active=0
                for pgid in $process_groups; do
                  case " $active_groups " in *" $pgid "*) active=1 ;; esac
                done
                [ "$active" -eq 1 ] || break
                sleep 1
              done
            fi
            if [ "$active" -eq 1 ]; then
              echo "::warning::crawler generation cleanup left state intact because a worker is still running"
              return 1
            fi
            if ! rm -rf "$state_dir"; then
              echo "::warning::crawler generation cleanup could not remove the state directory"
              return 1
            fi
            echo "🧹 Removed crawler generation temporary files and slot locks."
          }
          cleanupCrawlerGenerationState
      - name: Checkout frontaliere-si-o-no (attempt 1/2, sparse)
        id: site_checkout_primary
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          persist-credentials: false
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
            /data/crawler-generation-ledger.jsonl
          sparse-checkout-cone-mode: false
      - name: Backoff 30s before checkout retry
        if: steps.site_checkout_primary.outcome == 'failure'
        run: |-
          echo "First sparse checkout failed; retrying in 30s"
          sleep 30
      - name: Reset sparse checkout state before retry
        id: site_checkout_retry_prepare
        if: steps.site_checkout_primary.outcome == 'failure'
        run: |-
          set -euo pipefail
          cleanWorkspaceBeforeRetry() {
            local workspace="${GITHUB_WORKSPACE:-}"
            if [ -z "$workspace" ] || [ "$workspace" = "/" ] || [ ! -d "$workspace" ]; then
              echo "::error::GITHUB_WORKSPACE is empty, unsafe, or not a directory; refusing workspace cleanup" >&2
              return 1
            fi
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          }
          retrySparseCheckout() {
            local workspace="${GITHUB_WORKSPACE:-}"
            if [ -z "$workspace" ] || [ "$workspace" = "/" ]; then
              echo "::error::GITHUB_WORKSPACE is empty or unsafe; refusing sparse checkout retry" >&2
              return 1
            fi
            if [ ! -e "$workspace/.git" ]; then
              cleanWorkspaceBeforeRetry
              echo "No partial Git metadata found; starting the retry from an empty workspace"
              return 0
            fi
            local git_dir common_git_dir
            if ! git_dir="$(git -C "$workspace" rev-parse --absolute-git-dir 2>/dev/null)" || ! common_git_dir="$(git -C "$workspace" rev-parse --path-format=absolute --git-common-dir 2>/dev/null)"; then
              echo "::error::Sparse checkout retry found unreadable Git metadata; refusing to reuse the workspace" >&2
              return 1
            fi
            isSafeGitDir() {
              local workspace="$1" git_dir="$2" common_git_dir="$3"
              [ -n "$git_dir" ] && [ -n "$common_git_dir" ] && [ "$workspace" != "/" ] && [ -d "$workspace" ] && [ -d "$git_dir" ] && [ -d "$common_git_dir" ] && [ ! -L "$workspace/.git" ] && [ ! -L "$git_dir" ] && [ ! -L "$common_git_dir" ] || return 1
              git_dir="$(realpath "$git_dir" 2>/dev/null)" || return 1
              common_git_dir="$(realpath "$common_git_dir" 2>/dev/null)" || return 1
              if [ -d "$workspace/.git" ]; then [ "$git_dir" = "$(realpath "$workspace/.git" 2>/dev/null)" ] && [ "$common_git_dir" = "$git_dir" ]; return; fi
              [ -f "$workspace/.git" ] && [ "$git_dir" != "$common_git_dir" ] && [ "$(dirname "$git_dir")" = "$common_git_dir/worktrees" ] || return 1
              [ -d "$common_git_dir/worktrees" ] && [ ! -L "$common_git_dir/worktrees" ] && [ -f "$git_dir/gitdir" ] && [ ! -L "$git_dir/gitdir" ] || return 1
              [ "$(realpath "$(cat "$git_dir/gitdir" 2>/dev/null)" 2>/dev/null)" = "$(realpath "$workspace/.git" 2>/dev/null)" ]
            }
            if ! isSafeGitDir "$workspace" "$git_dir" "$common_git_dir"; then
              echo "::error::Sparse checkout retry found unsafe Git metadata; refusing to reuse the workspace" >&2
              return 1
            fi
            git_dir="$(realpath "$git_dir")"
            common_git_dir="$(realpath "$common_git_dir")"
            [ "$common_git_dir" = "$git_dir" ] && common_git_dir=""
            while IFS= read -r -d "" lock_file; do
              rm -f -- "$lock_file"
            done < <(find "$git_dir" -path "$git_dir/worktrees" -prune -o -type f -name "*.lock" -print0; [ -z "$common_git_dir" ] || find "$common_git_dir" -path "$common_git_dir/worktrees" -prune -o -type f -name "*.lock" -print0)
            if ! git -C "$workspace" rev-parse --verify HEAD >/dev/null 2>&1; then
              rm -rf -- "$workspace/.git"
              echo "Discarded incomplete Git metadata; the retry will initialize a clean sparse checkout"
              return 0
            fi
            git -C "$workspace" reset --hard HEAD
            git -C "$workspace" clean -ffdx
            # Keep sparse mode enabled: disabling it would materialize the full repository.
            # The second actions/checkout invocation replaces the sparse patterns atomically.
          }
          retrySparseCheckout
      - name: Checkout frontaliere-si-o-no (attempt 2/2, sparse)
        id: site_checkout_retry
        if: steps.site_checkout_primary.outcome == 'failure' && steps.site_checkout_retry_prepare.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          persist-credentials: false
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
            /data/crawler-generation-ledger.jsonl
          sparse-checkout-cone-mode: false
      - name: Report exhausted site checkout
        if: always() && steps.site_checkout_primary.outcome == 'failure' && (steps.site_checkout_retry.outcome == 'failure' || steps.site_checkout_retry_prepare.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Workflow Failure: Crawler Group 23 (sparse cross-repo execution)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          message="Both sparse checkout attempts failed before crawler/translation logic started. Run: ${RUN_URL}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$message"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$message"
          fi
      - name: Confirm site checkout succeeded
        id: checkout
        if: always() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        run: "true"
      - name: Abort without a valid site checkout
        id: checkout_abort
        if: always() && steps.checkout.outcome != 'success'
        run: |-
          echo "::error::Neither sparse checkout attempt produced a valid site workspace; refusing to start crawler logic"
          exit 1
      - name: Validate crawler generation token before crawling
        run: node scripts/check-crawler-generation-token.mjs
      - name: Restore crawler AI cache
        id: restore_crawler_ai_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-23-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-ai-cache-v1-crawler-group-23-${{ github.repository }}-${{ runner.os }}-
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/crawler-retry-cmd.sh npm ci --ignore-scripts
      - name: Restore per-company translation cache
        id: translation_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-23-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-cache-v1-crawler-group-23-
      - name: Prepare per-company translation cache
        if: always()
        env:
          TRANSLATION_CACHE_MATCHED_KEY: ${{ steps.translation_cache_restore.outputs.cache-matched-key }}
        run: |-
          mkdir -p data/translation-cache
          if [ -n "$TRANSLATION_CACHE_MATCHED_KEY" ]; then
            echo "✅ Per-company translation cache restored: $TRANSLATION_CACHE_MATCHED_KEY"
            echo "translation-cache: hit ($TRANSLATION_CACHE_MATCHED_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Per-company translation cache miss; translations will repopulate it."
            echo "translation-cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Firebase credentials and global data lease
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to acquire the global data pipeline lease; refusing to continue to shared crawler commits."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          echo "DATA_PIPELINE_LEASE=1" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 31 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-23.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: ./.github/actions/setup-omniroute
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Report shared setup failure to GitHub Issues
        if: failure() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        uses: ./.github/actions/report-failure
        with:
          title: "Workflow Failure: Crawler Group 23 (sparse cross-repo execution)"
          closed-by: close-recovered-failure-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow-name: Crawler Group 23 (sparse cross-repo execution)
          workflow-file: .github/corpus-workflows/crawler-group-23.yml
          priority: "2"
      - name: Launch albergo-gardenia
        id: crawler-launch-albergo-gardenia
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-albergo-gardenia.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_ALBERGO_GARDENIA_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: albergo-gardenia
          JOBS_SLICE_FILE: data/jobs/by-crawler/albergo-gardenia.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          s='albergo-gardenia'
          d="$RUNNER_TEMP/crawler-generation/group-23"
          mkdir -p "$d/slots"
          script_path="$d/$s.sh"
          launcher_path="$d/$s.launcher.sh"
          worker_path="$d/$s.worker.sh"
          log_path="$d/$s.log"
          pid_path="$d/$s.pid"
          status_path="$d/$s.status"
          started_path="$d/$s.started"
          watchdog_path="$d/albergo-gardenia.watchdog"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$d/albergo-gardenia.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e
          node scripts/update-albergo-gardenia-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::albergo-gardenia: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          housekeeping_exit=0
          report_exit=0
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs)
            housekeeping_exit=$?
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Albergo Gardenia jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
              --title "Crawler Failure: Run albergo-gardenia" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run albergo-gardenia"
            report_exit=$?; [ "$report_exit" -eq 0 ] || echo "::error::alert reporter failed albergo-gardenia"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::albergo-gardenia: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::albergo-gardenia: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::albergo-gardenia: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ albergo-gardenia: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::albergo-gardenia: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi
          (( git_commit_exit == 45 )) && exit 45
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 44 && git_commit_exit != 143) )) || (( report_exit != 0 )); then
            exit 1
          fi
          exit 0' > "$script_path"
          printf '%s\n' 'set +e
          s='\''albergo-gardenia'\''
          d="$RUNNER_TEMP/crawler-generation/group-23"
          script_path="$d/$s.sh"
          worker_status_file="$d/$s.worker.status"
