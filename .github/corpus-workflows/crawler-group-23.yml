      - name: Upload crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-23-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-23-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Fail crawler group after all member outcomes
        if: always()
        env:
