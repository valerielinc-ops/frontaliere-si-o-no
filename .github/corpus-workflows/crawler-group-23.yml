      - name: Commit crawler group data atomically
        if: always() && inputs.generation_token != '' && job.status == 'success' && steps.crawler_group_setup.outcome == 'success' && steps.crawler_aggregate.outcome == 'success' && steps.crawler_aggregate.outputs.wait_outcome == 'success'
        run: |-
          set +e
          bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 23 jobs"
          git_commit_exit=$?
          if [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::group commit: push lost the ref race after all retries (contention) on the final aggregated commit. Cycle lost, self-heals next scheduled run — group not failed (systemic class)."
            echo "⚠️ group commit: push contention loss (exit 42) — crawl data was fine, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::group commit: global data-pipeline lease is busy (exit 44); no group data was staged and the next scheduled cycle will retry — group not failed (systemic class)."
            echo "⚠️ group commit: global data-pipeline lease busy (exit 44) — group data not staged, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$git_commit_exit"
      - name: Save crawler AI cache
        if: always() && hashFiles('.cache/jobs-ai-cache.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-23-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then exit 0; fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Finalize crawler generation manifest (shadow)
        id: crawler-generation-finalizer
        if: always()
        continue-on-error: true
        env:
          CRAWLER_GENERATION_GROUP: "23"
          CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
          CRAWLER_GENERATION_CALLER_REPOSITORY: ${{ github.repository }}
          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ steps.crawler_aggregate.outputs.wait_outcome || 'failure' }}
