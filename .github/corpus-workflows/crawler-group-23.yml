          watchdog_path="$d/frutiger-com.watchdog"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$d/frutiger-com.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e
          node scripts/update-frutiger-com-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::frutiger-com: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          housekeeping_exit=0
          report_exit=0
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs)
            housekeeping_exit=$?
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Frutiger AG jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
              --title "Crawler Failure: Run frutiger-com" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run frutiger-com"
            report_exit=$?; [ "$report_exit" -eq 0 ] || echo "::error::alert reporter failed frutiger-com"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::frutiger-com: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ frutiger-com: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::frutiger-com: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ frutiger-com: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::frutiger-com: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ frutiger-com: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::frutiger-com: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ frutiger-com: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi
          (( git_commit_exit == 45 )) && exit 45
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 44 && git_commit_exit != 143) )) || (( report_exit != 0 )); then
            exit 1
          fi
          exit 0' > "$script_path"
          printf '%s\n' 'set +e
          s='\''frutiger-com'\''
          d="$RUNNER_TEMP/crawler-generation/group-23"
          script_path="$d/$s.sh"
          worker_status_file="$d/$s.worker.status"
          worker_status_tmp="$d/$s.worker.status.tmp.$$"
          started_file="$d/$s.started"
          export CRAWLER_MEMBER_CRAWL_EXIT_FILE="$d/frutiger-com.crawl-exit"
          export CRAWLER_MEMBER_LOG_FILE="$d/$s.log"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$worker_status_tmp"
          mv -f "$worker_status_tmp" "$worker_status_file"
          exit "$crawler_exit"' > "$worker_path"
          validateGeneratedWorkerScript() { [ -s "$1" ] && bash -n "$1"; }
          validateGeneratedWorkerScript "$worker_path" || exit 1
          printf '%s\n' 'set +e
          s='\''frutiger-com'\''
          d="$RUNNER_TEMP/crawler-generation/group-23"
          worker_path="$d/$s.worker.sh"
          status_file="$d/$s.status"
          status_tmp="$d/$s.status.tmp.$$"
          worker_status_file="$d/$s.worker.status"
          started_file="$d/$s.started"
          watchdog_file="$d/frutiger-com.watchdog"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-74}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 74)"
            worker_watchdog_minutes=74
          fi
          classifyCrawlerTimeoutRace() {
            if [ "$1" = 124 ] || [ "$1" = 137 ]; then
              printf '\''%s\n'\'' "$1"
            elif [ -s "$worker_status_file" ]; then
              worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
              if [[ "$worker_status" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$worker_status"; else printf '\''%s\n'\'' 1; fi
            elif [ -e "$started_file" ]; then
              printf '\''%s\n'\'' 143
            elif [ "$1" = 0 ]; then
              printf '\''%s\n'\'' 1
            else
              if [[ "$1" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$1"; else printf '\''%s\n'\'' 143; fi
            fi
          }
          resolveCrawlerTerminalStatus() {
            local wrapper_exit="$1"
            local worker_status=""
            local terminal_exit=""
            local watchdog_marker=1
            [ -s "$worker_status_file" ] && worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
            terminal_exit="$(classifyCrawlerTimeoutRace "$wrapper_exit")"
            if { [ "$wrapper_exit" = 124 ] || [ "$wrapper_exit" = 137 ]; } && { [ "$worker_status" = 1 ] || [ "$worker_status" = 124 ]; }; then watchdog_marker=0; fi
            if [ "$watchdog_marker" -eq 1 ]; then
              if [ "$terminal_exit" -eq 124 ] || [ "$terminal_exit" -eq 137 ]; then printf '\''%s\n'\'' "$worker_watchdog_minutes" > "$watchdog_file"; fi
            fi
            if ! { printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp" && mv -f "$status_tmp" "$status_file"; } 2>/dev/null; then
              echo "::error::could not publish the crawler terminal status" >&2
              return 1
            fi
            printf '\''%s\n'\'' "$terminal_exit"
          }
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            terminal_exit="$(resolveCrawlerTerminalStatus 1)"
            exit "$terminal_exit"
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            terminal_exit="$(resolveCrawlerTerminalStatus 127)"
            exit "$terminal_exit"
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$d/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -s "$worker_status_file" ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -e "$started_file" ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Run albergo-gardenia
        id: crawler-albergo-gardenia
        if: always()
        continue-on-error: true
        env:
          CRAWLER_LAUNCH_OUTCOME: ${{ steps['crawler-launch-albergo-gardenia'].outcome }}
          CRAWLER_MEMBER_SLUG: albergo-gardenia
        run: |-
          set -uo pipefail
          s="$CRAWLER_MEMBER_SLUG"
          d="$RUNNER_TEMP/crawler-generation/group-23"
          f="$d/$s.status"
          p="$d/$s.pid"
          l="$d/$s.log"
          o="${CRAWLER_LAUNCH_OUTCOME:-unknown}"
          if [ "$o" != "success" ]; then
            echo "::error::$s: launch step outcome is $o; detached crawler was not started"
            exit 1
          fi
          if [ ! -s "$f" ] && [ ! -s "$p" ]; then
            echo "::error::$s: launch step succeeded but published neither status nor PID; refusing to wait for the group budget"
            exit 1
          fi
          e=$((SECONDS + 340 * 60))
          while [ ! -s "$f" ]; do
            if [ "$SECONDS" -ge "$e" ]; then
              echo "::error::$s: detached crawler did not publish a status before the 340 minute group budget"
              exit 1
            fi
            if [ -s "$p" ]; then
              i="$(cat "$p" 2>/dev/null || true)"
              if ! [[ "$i" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::$s: invalid detached crawler PID: $i"
                exit 1
              fi
              if [ -n "$i" ] && ! kill -0 "$i" 2>/dev/null; then
                sleep 1
                if [ ! -s "$f" ]; then
                  echo "::error::$s: detached crawler exited without publishing its status"
                  exit 1
                fi
              fi
            fi
            sleep 2
          done
          if [ -f "$l" ]; then
            cat "$l"
          else
            echo "::error::$s: crawler log is missing"
            exit 1
          fi
          v="$(cat "$f" 2>/dev/null || true)"
          if ! [[ "$v" =~ ^[0-9]+$ ]]; then
            echo "::error::$s: invalid crawler status: $v"
            exit 1
          fi
          exit "$v"
