          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ steps.crawler_aggregate.outputs.wait_outcome || 'failure' }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"albergo-gardenia","primarySlice":"data/jobs/by-crawler/albergo-gardenia.json"},{"crawlerId":"anicura","primarySlice":"data/jobs/by-crawler/anicura.json"},{"crawlerId":"artificialy","primarySlice":"data/jobs/by-crawler/artificialy.json"},{"crawlerId":"brefispersonal","primarySlice":"data/jobs/by-crawler/brefispersonal.json"},{"crawlerId":"capri-holdings","primarySlice":"data/jobs/by-crawler/capri-holdings.json"},{"crawlerId":"christinavassalli","primarySlice":"data/jobs/by-crawler/christinavassalli.json"},{"crawlerId":"confederazione-ticino","primarySlice":"data/jobs/by-crawler/confederazione-ticino.json"},{"crawlerId":"csd-engineers","primarySlice":"data/jobs/by-crawler/csd-engineers.json"},{"crawlerId":"ecam","primarySlice":"data/jobs/by-crawler/ecam.json"},{"crawlerId":"elektriker-elektromonteur-jobs-ch","primarySlice":"data/jobs/by-crawler/elektriker-elektromonteur-jobs-ch.json"},{"crawlerId":"fachkraft","primarySlice":"data/jobs/by-crawler/fachkraft.json"},{"crawlerId":"fisba","primarySlice":"data/jobs/by-crawler/fisba.json"},{"crawlerId":"frutiger-com","primarySlice":"data/jobs/by-crawler/frutiger-com.json"},{"crawlerId":"fust","primarySlice":"data/jobs/by-crawler/fust.json"},{"crawlerId":"hugo-boss","primarySlice":"data/jobs/by-crawler/hugo-boss.json"},{"crawlerId":"lidl-svizzera","primarySlice":"data/jobs/by-crawler/lidl-svizzera.json"},{"crawlerId":"mcdonald-s-switzerland","primarySlice":"data/jobs/by-crawler/mcdonald-s-switzerland.json"},{"crawlerId":"mediamarkt","primarySlice":"data/jobs/by-crawler/mediamarkt.json"},{"crawlerId":"migros-hq","primarySlice":"data/jobs/by-crawler/migros-hq.json"},{"crawlerId":"my","primarySlice":"data/jobs/by-crawler/my.json"},{"crawlerId":"nestle","primarySlice":"data/jobs/by-crawler/nestle.json"},{"crawlerId":"pantr-ch","primarySlice":"data/jobs/by-crawler/pantr-ch.json"},{"crawlerId":"physioswiss","primarySlice":"data/jobs/by-crawler/physioswiss.json"},{"crawlerId":"pianorm","primarySlice":"data/jobs/by-crawler/pianorm.json"},{"crawlerId":"posta-svizzera-centro-regionale","primarySlice":"data/jobs/by-crawler/posta-svizzera-centro-regionale.json"},{"crawlerId":"postauto","primarySlice":"data/jobs/by-crawler/postauto.json"},{"crawlerId":"postfinance","primarySlice":"data/jobs/by-crawler/postfinance.json"},{"crawlerId":"premiumpflege24","primarySlice":"data/jobs/by-crawler/premiumpflege24.json"},{"crawlerId":"rehaklinik-seewis","primarySlice":"data/jobs/by-crawler/rehaklinik-seewis.json"},{"crawlerId":"tsmg","primarySlice":"data/jobs/by-crawler/tsmg.json"},{"crawlerId":"zaugg","primarySlice":"data/jobs/by-crawler/zaugg.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-23-terminal.json
