          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/translate-recovery-successor-guard.mjs
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/crawler-retry-cmd.sh npm ci
      - name: Restore per-company translation cache
        id: translation_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-translate-pending-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-cache-v1-translate-pending-
      - name: Prepare per-company translation cache
        if: always() && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          TRANSLATION_CACHE_MATCHED_KEY: ${{ steps.translation_cache_restore.outputs.cache-matched-key }}
        run: |
          mkdir -p data/translation-cache
          if [ -n "$TRANSLATION_CACHE_MATCHED_KEY" ]; then
            echo "✅ Per-company translation cache restored: $TRANSLATION_CACHE_MATCHED_KEY"
            echo "translation-cache: hit ($TRANSLATION_CACHE_MATCHED_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Per-company translation cache miss; translations will repopulate it."
            echo "translation-cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Cache local MT models (Opus-MT + e5 semantic judge)
        uses: actions/cache@v6
        with:
          path: .cache/transformers
          key: local-mt-models-v2-opus-e5
          restore-keys: |
            local-mt-models-
            opus-mt-models-
      - name: Cache Argos Translate models
        uses: actions/cache@v6
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-translate-models-v1
          restore-keys: argos-translate-models-
      - name: Restore Argos unit cache
        id: local_mt_unit_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/local-mt-units
          key: local-mt-units-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: local-mt-units-v1-
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs
      - name: Probe translation provider readiness
        id: provider_readiness
        continue-on-error: true
        run: node scripts/translation-provider-readiness.mjs --summary --json "$RUNNER_TEMP/translation-provider-readiness.json"
      - name: Resolve Codex reserve budget
        if: inputs.skip_translate != true
        env:
          FREE_TRANSLATE_CODEX_MAX_CALLS_REPO: ${{ vars.FREE_TRANSLATE_CODEX_MAX_CALLS }}
        run: |
          if [ -n "${FREE_TRANSLATE_CODEX_MAX_CALLS:-}" ]; then
            echo "FREE_TRANSLATE_CODEX_MAX_CALLS already set; preserving effective setting"
          elif [ -n "$FREE_TRANSLATE_CODEX_MAX_CALLS_REPO" ]; then
            printf 'FREE_TRANSLATE_CODEX_MAX_CALLS=%s\n' "$FREE_TRANSLATE_CODEX_MAX_CALLS_REPO" >> "$GITHUB_ENV"
          else
            printf 'FREE_TRANSLATE_CODEX_MAX_CALLS=30\n' >> "$GITHUB_ENV"
          fi
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push translated job data to valerielinc-ops/frontaliere-si-o-no or file pipeline-failure issues there. Aborting before any phase runs so this fails loud, not as a silent partial-run data loss."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: Install Argos Translate (local MT engine)
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --upgrade pip==26.2.1
          python3 -m pip install --quiet argostranslate==1.11.0
          python3 scripts/local-mt-translate.py --install
      - name: Initialize translation run clock
        if: inputs.skip_translate != true
        run: |
          node --input-type=module <<'NODE'
          import { markRunStart, readRunStartMs } from './scripts/lib/translate-run-clock.mjs';

          markRunStart(Date.now());
          const startMs = readRunStartMs();
          if (startMs === null) {
            console.error('::error::translate-pending run-start marker could not be initialized');
            process.exit(1);
          }
          console.log(`Translation run clock initialized at ${startMs}.`);
          NODE
      - name: Assemble dataset
        if: inputs.skip_translate != true
        env:
          JOBS_SKIP_RECONCILIATION: ${{ vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1' && '1' || '0' }}
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Record translation rollout context
        env:
          ROLLOUT_REPOSITORY: ${{ github.repository }}
          ROLLOUT_SWITCH: ${{ vars.LOCAL_MT_LANG_AWARE_OVERWRITE || '1' }}
          SEMANTIC_MAX_OVERWRITES: ${{ vars.LOCAL_MT_SEMANTIC_MAX_OVERWRITES || '100' }}
          OPUSMT_RESCUE_SWITCH: ${{ vars.LOCAL_MT_OPUSMT_RESCUE || '0' }}
        run: |
          echo "Translation rollout repository=$ROLLOUT_REPOSITORY"
          echo "LOCAL_MT_LANG_AWARE_OVERWRITE=$ROLLOUT_SWITCH"
          echo "LOCAL_MT_SEMANTIC_MAX_OVERWRITES=$SEMANTIC_MAX_OVERWRITES"
          echo "LOCAL_MT_OPUSMT_RESCUE=$OPUSMT_RESCUE_SWITCH"
      - name: Log translation stats (before)
        if: inputs.skip_translate != true
        run: node scripts/log-translation-stats.mjs before
      - name: "Phase 2a: Local MT bulk translate (Argos)"
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        continue-on-error: true
        env:
          LOCAL_MT_TIME_BUDGET_MS: "4500000"
          LOCAL_MT_UNIT_CACHE: .cache/local-mt-units/units.jsonl
          LOCAL_MT_MOPUP_DEADLINE_MS: "12600000"
          LOCAL_MT_LANG_AWARE_OVERWRITE: ${{ vars.LOCAL_MT_LANG_AWARE_OVERWRITE || '1' }}
          LOCAL_MT_SEMANTIC_MAX_OVERWRITES: ${{ vars.LOCAL_MT_SEMANTIC_MAX_OVERWRITES || '100' }}
          LOCAL_MT_SEMANTIC_TELEMETRY_PATH: ${{ runner.temp }}/local-mt-semantic-telemetry-phase-2a.json
          LOCAL_MT_OPUSMT_RESCUE: ${{ vars.LOCAL_MT_OPUSMT_RESCUE || '0' }}
          MT_LOCAL_OPUSMT: "1"
          TRANSFORMERS_CACHE: .cache/transformers
          INPUT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
        run: node scripts/local-mt-mopup.mjs --max-jobs "$INPUT_MOPUP_MAX_JOBS"
      - name: "Phase 2a.2: Fix untranslated titles (free cascade, before descriptions)"
        id: title_cascade_before_descriptions
        if: inputs.skip_translate != true && inputs.dry_run != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        continue-on-error: true
        env:
          UNTRANSLATED_TITLE_FIX_DEADLINE_MS: "6600000"
          UNTRANSLATED_TITLE_FIX_WINDOW_MS: "1500000"
        run: node scripts/fix-untranslated-titles.mjs
      - name: Re-assemble dataset after Argos bulk
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        env:
          JOBS_SKIP_RECONCILIATION: "1"
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Commit Argos translations before cascade
        id: commit_argos_translations
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && inputs.dry_run != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          SKIP_AI_TRANSLATION: "1"
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "🌐 Auto-translate pending jobs (Argos bulk)" data/jobs/by-crawler/ data/translation-cache/ data/local-mt-negative-cache.json data/translation-title-fix-attempts.json
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: "Phase 2 pre: Flag locale-mismatched job descriptions"
        if: inputs.skip_translate != true
        continue-on-error: true
        run: node scripts/mark-locale-mismatched-jobs.mjs
      - name: "Phase 2 pre: Flag wrong-language job titles"
        if: inputs.skip_translate != true
        continue-on-error: true
        env:
          TITLE_MISTRANSLATION_MARK_CAP: ${{ vars.TITLE_MISTRANSLATION_MARK_CAP || '100' }}
          TITLE_MISTRANSLATION_QUEUE_CEILING: ${{ vars.TITLE_MISTRANSLATION_QUEUE_CEILING || '2000' }}
        run: node scripts/mark-mistranslated-jobs.mjs
      - name: Capture translation observability baseline
        id: translation_observability_before
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: |
          test -f data/jobs.json
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/collect-translation-observability.mjs \
            --mode start --jobs data/jobs.json \
            --output "$RUNNER_TEMP/translation-observability-before.json" \
            --now "$started_at"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - id: setup_claude_haiku_fallback
        if: inputs.skip_translate != true && inputs.dry_run != true
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          broker_idle_ttl_ms: "12600000"
      - name: "Phase 2b: Translate pending jobs (cascade top-up)"
        id: translation_shadow_preflight_v2_decision
        if: inputs.skip_translate != true
        env:
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_CASCADE_DEADLINE_MS: ${{ vars.TRANSLATE_ARGOS_FIRST_DISABLE == '1' && '15000000' || '9000000' }}
          JOBS_CASCADE_WINDOW_MS: ${{ vars.TRANSLATE_ARGOS_FIRST_DISABLE == '1' && '0' || '1800000' }}
          AZURE_TRANSLATOR_KEY: ""
          AZURE_TRANSLATOR_KEY_2: ""
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          FREE_TRANSLATE_CODEX_CALL_TIMEOUT_MS: "480000"
          FREE_TRANSLATE_CODEX_MAX_MS: "900000"
          TRANSLATE_CODEX_RESERVE_DIR: ${{ runner.temp }}/translation-codex-reserve
          MT_LOCAL_OPUSMT: "1"
          TRANSFORMERS_CACHE: .cache/transformers
          INPUT_MAX_JOBS: ${{ inputs.max_jobs || '900' }}
          INPUT_COMPANY_KEY: ${{ inputs.company_key }}
          SHADOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHADOW_RUN_ID: ${{ github.run_id }}
          SHADOW_SOURCE_REPOSITORY: ${{ github.repository }}
          SHADOW_SOURCE_WORKFLOW: ${{ github.workflow_ref }}
          SHADOW_WORKFLOW_BLOB_SHA: ${{ github.workflow_sha }}
        run: |
          ARGS=(--max-jobs "$INPUT_MAX_JOBS")
          if [ -n "$INPUT_COMPANY_KEY" ]; then
            ARGS+=(--company-key "$INPUT_COMPANY_KEY")
          fi
          # Hash-bind the runtime library in the generated cross-repo contract:
          # scripts/lib/translation-shadow-preflight-v2.mjs
          ARGS+=(
            --shadow-preflight-v2-output "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json"
            --shadow-preflight-v2-baseline-main-sha "${{ steps.translation_observability_before.outputs.source_commit }}"
            --shadow-preflight-v2-runner-temp "$RUNNER_TEMP"
            --shadow-preflight-v2-repository "$SHADOW_SOURCE_REPOSITORY"
            --shadow-preflight-v2-workflow "$SHADOW_SOURCE_WORKFLOW"
            --shadow-preflight-v2-run-id "$SHADOW_RUN_ID"
            --shadow-preflight-v2-run-attempt "$SHADOW_RUN_ATTEMPT"
            --shadow-preflight-v2-workflow-blob-sha "$SHADOW_WORKFLOW_BLOB_SHA"
          )
          set +e
          node scripts/relocalize-pending-jobs.mjs "${ARGS[@]}"
          legacy_status=$?
          set -e
          expected_decision_digest=''
          expected_contract_digest=''
          while IFS= read -r binding; do
            if [[ "$binding" =~ ^expected_decision_digest=sha256:[a-f0-9]{64}$ ]]; then
              expected_decision_digest="${binding#*=}"
            elif [[ "$binding" =~ ^expected_contract_digest=sha256:[a-f0-9]{64}$ ]]; then
              expected_contract_digest="${binding#*=}"
            fi
          done < <(node scripts/translation-shadow-preflight-v2.mjs \
            --mode capture \
            --decision "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json" 2>/dev/null || true)
          # Emit both declared step outputs on every path. An empty value is
          # intentionally still an unbound proof and the observer keeps it
          # missing/unmeasurable; the explicit keys make the conditional
          # producer visible to the workflow contract audit.
          printf 'expected_decision_digest=%s\n' "$expected_decision_digest" >> "$GITHUB_OUTPUT"
          printf 'expected_contract_digest=%s\n' "$expected_contract_digest" >> "$GITHUB_OUTPUT"
          exit "$legacy_status"
      - name: Scatter changes back to per-crawler slices
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: node scripts/scatter-jobs-to-slices.mjs
      - name: "Phase 2c mop-up: local MT (Argos Translate, in-process)"
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        env:
          LOCAL_MT_TIME_BUDGET_MS: "9000000"
          LOCAL_MT_UNIT_CACHE: .cache/local-mt-units/units.jsonl
          LOCAL_MT_MOPUP_DEADLINE_MS: "10200000"
          LOCAL_MT_LANG_AWARE_OVERWRITE: ${{ vars.LOCAL_MT_LANG_AWARE_OVERWRITE || '1' }}
          LOCAL_MT_SEMANTIC_MAX_OVERWRITES: ${{ vars.LOCAL_MT_SEMANTIC_MAX_OVERWRITES || '100' }}
          LOCAL_MT_SEMANTIC_TELEMETRY_PATH: ${{ runner.temp }}/local-mt-semantic-telemetry-phase-2c.json
          LOCAL_MT_OPUSMT_RESCUE: ${{ vars.LOCAL_MT_OPUSMT_RESCUE || '0' }}
          MT_LOCAL_OPUSMT: "1"
          TRANSFORMERS_CACHE: .cache/transformers
          INPUT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
        run: node scripts/local-mt-mopup.mjs --max-jobs "$INPUT_MOPUP_MAX_JOBS"
      - name: Re-assemble dataset after Phase 2c mop-up
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          JOBS_SKIP_RECONCILIATION: "1"
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Commit translations
        id: commit_translations
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          SKIP_AI_TRANSLATION: "1"
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "🌐 Auto-translate pending jobs" data/jobs/by-crawler/ data/translation-cache/ data/local-mt-negative-cache.json data/jobs-crawler-config.json data/slug-registry.json data/translation-stats-history.json data/cascade-company-skip.json
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: Gate Phase 2d/2e repair lanes on remaining run budget
        id: repair_lane_budget
        if: github.event_name == 'schedule' && inputs.skip_translate != true && inputs.dry_run != true
        env:
          REPAIR_LANE_DEADLINE_MS: "12600000"
          REPAIR_LANE_MIN_REMAINING_MS: "900000"
        run: node scripts/translate-repair-lane-gate.mjs
      - name: "Phase 2d: Fix untranslated titles (free cascade)"
        if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && inputs.skip_translate != true && inputs.dry_run != true && steps.repair_lane_budget.outputs.run == 'true'
        env:
          UNTRANSLATED_TITLE_FIX_DEADLINE_MS: "12600000"
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          FREE_TRANSLATE_CODEX_CALL_TIMEOUT_MS: "480000"
          FREE_TRANSLATE_CODEX_MAX_MS: "900000"
          TRANSLATE_CODEX_RESERVE_DIR: ${{ runner.temp }}/translation-codex-reserve
        run: node scripts/fix-untranslated-titles.mjs
      - name: Commit title fixes
        id: commit_title_fixes
        if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && inputs.skip_translate != true && inputs.dry_run != true && steps.repair_lane_budget.outputs.run == 'true'
        env:
          SKIP_AI_TRANSLATION: "1"
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "🔤 Fix untranslated titles (free cascade)" data/jobs/by-crawler/ data/translation-cache/ data/translation-title-fix-attempts.json
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: "Phase 2e: Fix untranslated descriptions (free cascade)"
        if: github.event_name == 'schedule' && github.event.schedule != '0 7 * * *' && inputs.skip_translate != true && inputs.dry_run != true && steps.repair_lane_budget.outputs.run == 'true'
        env:
          UNTRANSLATED_DESCRIPTION_FIX_DEADLINE_MS: "12600000"
          UNTRANSLATED_DESCRIPTION_FIX_MAX: ${{ vars.UNTRANSLATED_DESCRIPTION_FIX_MAX || '2000' }}
          AZURE_TRANSLATOR_KEY: ""
          AZURE_TRANSLATOR_KEY_2: ""
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          FREE_TRANSLATE_CODEX_CALL_TIMEOUT_MS: "480000"
          FREE_TRANSLATE_CODEX_MAX_MS: "900000"
          TRANSLATE_CODEX_RESERVE_DIR: ${{ runner.temp }}/translation-codex-reserve
        run: node scripts/fix-untranslated-descriptions.mjs --max "$UNTRANSLATED_DESCRIPTION_FIX_MAX"
      - name: Commit description fixes
        id: commit_description_fixes
        if: github.event_name == 'schedule' && github.event.schedule != '0 7 * * *' && inputs.skip_translate != true && inputs.dry_run != true && steps.repair_lane_budget.outputs.run == 'true'
        env:
          SKIP_AI_TRANSLATION: "1"
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "📝 Fix untranslated descriptions (free cascade)"
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then exit 0; fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Alert on rejected translation credentials (dedup, zero-Claude)
        if: always() && steps.provider_readiness.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/translation-provider-readiness.mjs \
            --alert-from "$RUNNER_TEMP/translation-provider-readiness.json" \
            --codex-reserve-dir "$RUNNER_TEMP/translation-codex-reserve" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Re-assemble true-final translation dataset
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          JOBS_SKIP_RECONCILIATION: "1"
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Log translation stats (after)
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          TRANSLATE_CODEX_RESERVE_DIR: ${{ runner.temp }}/translation-codex-reserve
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/log-translation-stats.mjs after
          else
            SKIP_AI_TRANSLATION=1 TRANSLATION_STATS_AFTER_TREE=1 bash scripts/lib/git-commit-data.sh --slice-only "📊 Translation stats (after)" data/translation-stats-history.json
          fi
      - name: Capture final translation observability (shadow)
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          OBSERVABILITY_OUTCOME: ${{ job.status }}
        run: |
          node scripts/collect-translation-observability.mjs \
            --mode finish --jobs data/jobs.json \
            --before "$RUNNER_TEMP/translation-observability-before.json" \
            --state data/translation-observability-state.json \
            --state-output data/translation-observability-state.json \
            --advance-state "${{ job.status == 'success' && inputs.dry_run != true }}" \
            --output "$RUNNER_TEMP/translation-observability.json" \
            --run-id "${{ github.run_id }}" \
            --started-at "${{ steps.translation_observability_before.outputs.started_at }}" \
            --source-commit "${{ steps.translation_observability_before.outputs.source_commit }}" --outcome "$OBSERVABILITY_OUTCOME"
      - name: Finalize translation observability report
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: |
          node scripts/collect-translation-observability.mjs \
            --mode finalize --report "$RUNNER_TEMP/translation-observability.json" \
            --output "$RUNNER_TEMP/translation-observability.json" \
            --final-commit "${{ steps.commit_description_fixes.outputs.final_commit || steps.commit_title_fixes.outputs.final_commit || steps.commit_translations.outputs.final_commit }}"
      - name: Finalize translation shadow preflight v2 observation
        id: translation_shadow_preflight_v2_finalize
        if: always() && steps.checkout.outcome == 'success' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        env:
          SHADOW_DEFAULT_COMPANY_KEY: ${{ inputs.company_key }}
          SHADOW_DEFAULT_DRY_RUN: ${{ inputs.dry_run }}
          SHADOW_DEFAULT_MAX_JOBS: ${{ inputs.max_jobs || '900' }}
          SHADOW_DEFAULT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
          SHADOW_DEFAULT_SKIP_HOUSEKEEPING: ${{ inputs.skip_housekeeping }}
          SHADOW_DEFAULT_SKIP_TRANSLATE: ${{ inputs.skip_translate }}
          SHADOW_EVENT_ACTION: ${{ github.event.action }}
          SHADOW_EVENT_NAME: ${{ github.event_name }}
          SHADOW_EXPECTED_CONTRACT_DIGEST: ${{ steps.translation_shadow_preflight_v2_decision.outputs.expected_contract_digest }}
          SHADOW_EXPECTED_DECISION_DIGEST: ${{ steps.translation_shadow_preflight_v2_decision.outputs.expected_decision_digest }}
          SHADOW_FINAL_TRANSLATION_COMMIT: ${{ steps.commit_description_fixes.outputs.final_commit || steps.commit_title_fixes.outputs.final_commit || steps.commit_translations.outputs.final_commit }}
          SHADOW_OBSERVED_JOB_STATUS: ${{ job.status }}
          SHADOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHADOW_RUN_ID: ${{ github.run_id }}
          SHADOW_SOURCE_COMMIT: ${{ steps.translation_observability_before.outputs.source_commit }}
          SHADOW_SOURCE_REPOSITORY: ${{ github.repository }}
          SHADOW_SOURCE_WORKFLOW: ${{ github.workflow_ref }}
          SHADOW_WORKFLOW_BLOB_SHA: ${{ github.workflow_sha }}
        run: |
          node scripts/translation-shadow-preflight-v2.mjs \
            --mode observe \
            --decision "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json" \
            --output "$RUNNER_TEMP/translation-shadow-preflight-v2-observation.json" \
            --expected-decision-digest "$SHADOW_EXPECTED_DECISION_DIGEST" \
            --expected-contract-digest "$SHADOW_EXPECTED_CONTRACT_DIGEST" \
            --event-name "$SHADOW_EVENT_NAME" \
            --event-action "$SHADOW_EVENT_ACTION" \
            --run-id "$SHADOW_RUN_ID" \
            --run-attempt "$SHADOW_RUN_ATTEMPT" \
            --default-max-jobs "$SHADOW_DEFAULT_MAX_JOBS" \
            --default-mopup-max-jobs "$SHADOW_DEFAULT_MOPUP_MAX_JOBS" \
            --default-company-key "$SHADOW_DEFAULT_COMPANY_KEY" \
            --default-skip-housekeeping "$SHADOW_DEFAULT_SKIP_HOUSEKEEPING" \
            --default-skip-translate "$SHADOW_DEFAULT_SKIP_TRANSLATE" \
            --default-dry-run "$SHADOW_DEFAULT_DRY_RUN" \
            --source-repository "$SHADOW_SOURCE_REPOSITORY" \
            --source-workflow "$SHADOW_SOURCE_WORKFLOW" \
            --source-commit "$SHADOW_SOURCE_COMMIT" \
            --workflow-blob-sha "$SHADOW_WORKFLOW_BLOB_SHA" \
            --final-translation-commit "$SHADOW_FINAL_TRANSLATION_COMMIT" \
            --observed-job-status "$SHADOW_OBSERVED_JOB_STATUS"
      - name: Upload translation shadow preflight v2 artifacts
        if: always() && steps.translation_shadow_preflight_v2_finalize.outcome != 'skipped' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-shadow-preflight-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/translation-shadow-preflight-v2-decision.json
            ${{ runner.temp }}/translation-shadow-preflight-v2-observation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Roll up translation observability history
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: node scripts/rollup-translation-observability.mjs "$RUNNER_TEMP/translation-observability.json" data/translation-observability-history.json
      - name: Upload cascade company rows
        if: always() && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-cascade-companies-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/translation-cascade-companies.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload translation thinking A/B observations
        if: always() && inputs.collect_company_served == true && inputs.skip_translate != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-thinking-ab-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/translation-thinking-ab.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload Argos semantic telemetry
        if: always() && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-mt-semantic-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-mt-semantic-telemetry-*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit translation observability history
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          SKIP_AI_TRANSLATION: "1"
        run: |
          telemetry_paths=(data/translation-observability-history.json)
          if [ -f data/translation-observability-state.json ]; then
            telemetry_paths+=(data/translation-observability-state.json)
          fi
          bash scripts/lib/git-commit-data.sh --slice-only "📊 Roll up translation observability" "${telemetry_paths[@]}"
      - name: Upload translation observability report
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-observability-${{ github.run_id }}
          path: ${{ runner.temp }}/translation-observability.json
          retention-days: 14
          if-no-files-found: error
      - name: Release translated agency jobs held for translation
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        run: node scripts/release-translation-holds.mjs
      - name: "Phase 3: Regenerate locale slugs"
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: node scripts/regenerate-slugs-by-locale.mjs
      - name: Commit slug regeneration
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        env:
          SKIP_AI_TRANSLATION: "1"
        run: bash scripts/lib/git-commit-data.sh --slice-only "🔗 Regenerate locale slugs (post-translation)"
      - name: Save per-company translation cache
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-translate-pending-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Argos unit cache
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && hashFiles('.cache/local-mt-units/units.jsonl') != '' && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/local-mt-units
          key: local-mt-units-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Trigger deploy
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true && (github.run_attempt == 1 || steps.recovery_guard.outcome == 'success')
        run: |
          if node scripts/validate-translation-completeness.mjs 2>/dev/null; then
            echo "✅ All translations complete — triggering deploy"
            # Hard-fail by design (no `|| true`, #6936): a failed dispatch
            # here fails the job, caught by "Report failure to GitHub Issues"
            # below — that GitHub issue IS this caller's recovery net
            # (auto-triage picks it up), so silencing it would just hide a
            # real deploy gap.
            GITHUB_REPOSITORY=valerielinc-ops/frontaliere-si-o-no bash scripts/lib/trigger-deploy.sh
          else
            echo "⏳ Some translations still incomplete — skipping deploy trigger"
            echo "   The next cron run will retry and trigger deploy once all jobs are translated."
          fi
      - name: Report failure to GitHub Issues
        if: failure() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        uses: ./.github/actions/report-failure
        with:
          title: "Workflow Failure: Translate Pending Jobs (sparse cross-repo execution)"
          closed-by: close-recovered-failure-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow-name: Translate Pending Jobs (sparse cross-repo execution)
          workflow-file: .github/corpus-workflows/translate-pending.yml
          priority: "2"
          labels: Bug
          context: "La pipeline di traduzione è a fasi (fetch → translate → verify → commit): lo step fallito qui sopra dice a quale fase si è fermata, e i job non tradotti restano in coda per il prossimo cron."
    needs: translate_queue_guard
    if: needs.translate_queue_guard.outputs.run == 'true'
    concurrency:
      group: jobs-data-pipeline
      cancel-in-progress: false
      queue: max
