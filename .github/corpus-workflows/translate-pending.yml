# AUTO-GENERATED by frontaliere-si-o-no/scripts/generate-crawler-group-workflows.mjs — DO NOT EDIT.
# Source logic stays in the site repo; this standalone artifact runs on the corpus pool.
# Only pre-logic checkout/install setup is retryable, so a partial crawl is never replayed.

name: Translate Pending Jobs (sparse cross-repo execution)
on:
  schedule:
    - cron: 0 7 * * *
    - cron: 0 13 * * *
    - cron: 0 1 * * *
    - cron: 20 1 * * *
    - cron: 20 4 * * *
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Max jobs for the cascade. Wall-clock-bound, not quota-bound — the 90min cascade deadline stops it first.
        type: string
        default: "900"
      mopup_max_jobs:
        description: Max jobs for the local-MT (Argos) mop-up — free + unlimited, drain the whole backlog
        type: string
        default: "6000"
      company_key:
        description: Single company key to translate (e.g. a-group). Leave empty for all.
        type: string
        default: ""
      skip_housekeeping:
        description: Skip housekeeping (URL validation, expired pruning)
        type: boolean
        default: false
      skip_translate:
        description: Skip translations (only housekeeping + slug hardening)
        type: boolean
        default: false
      dry_run:
        description: Dry run (no commit)
        type: boolean
        default: false
concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false
  queue: max
permissions:
  actions: read
  contents: read
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169 --max-old-space-size=12288
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout frontaliere-si-o-no (attempt 1/2, sparse)
        id: site_checkout_primary
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          ref: main
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Backoff 30s before checkout retry
        if: steps.site_checkout_primary.outcome == 'failure'
        run: |-
          echo "First sparse checkout failed; retrying in 30s"
          sleep 30
      - name: Checkout frontaliere-si-o-no (attempt 2/2, sparse)
        id: site_checkout_retry
        if: steps.site_checkout_primary.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          ref: main
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
      - name: Report exhausted site checkout
        if: always() && steps.site_checkout_primary.outcome == 'failure' && steps.site_checkout_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Workflow Failure: Translate Pending Jobs (sparse cross-repo execution)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          message="Both sparse checkout attempts failed before crawler/translation logic started. Run: ${RUN_URL}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$message"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$message"
          fi
      - name: Confirm site checkout succeeded
        id: checkout
        if: always() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        run: "true"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/crawler-retry-cmd.sh npm ci
      - name: Cache Opus-MT models
        uses: actions/cache@v5
        with:
          path: .cache/transformers
          key: opus-mt-models-v1
          restore-keys: opus-mt-models-
      - name: Cache Argos Translate models
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-translate-models-v1
          restore-keys: argos-translate-models-
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push translated job data to valerielinc-ops/frontaliere-si-o-no or file pipeline-failure issues there. Aborting before any phase runs so this fails loud, not as a silent partial-run data loss."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-claude-haiku-fallback
      - name: Check if housekeeping should run
        id: hk
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "🧹 Daily 07:00 UTC — housekeeping enabled"
          elif [ "${{ inputs.skip_housekeeping }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Housekeeping skipped (user input)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Housekeeping skipped (not daily cron)"
          fi
      - name: "Phase 1: Housekeeping"
        if: steps.hk.outputs.run == 'true'
        env:
          JOBS_SKIP_LOCALE_HARDENING: "1"
        run: |
          echo "🧹 Running housekeeping (no slug hardening — deferred to Phase 3)..."
          for slice in data/jobs/by-crawler/*.json; do
            [ -f "$slice" ] || continue
            JOBS_SLICE_FILE="$slice" node scripts/cleanup-jobs.mjs || true
          done
          echo "✅ Housekeeping complete"
      - name: Commit housekeeping
        if: always() && steps.checkout.outcome == 'success' && steps.hk.outputs.run == 'true' && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🧹 Housekeeping — prune expired + validate URLs"
      - name: Install Argos Translate (local MT engine)
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet argostranslate
          python3 scripts/local-mt-translate.py --install
      - name: Assemble dataset
        if: inputs.skip_translate != true
        run: node scripts/assemble-jobs-dataset.mjs
      - name: "Phase 2a: Local MT bulk translate (Argos)"
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        continue-on-error: true
        env:
          LOCAL_MT_TIME_BUDGET_MS: "9000000"
          INPUT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
        run: node scripts/local-mt-mopup.mjs --max-jobs "$INPUT_MOPUP_MAX_JOBS"
      - name: Re-assemble dataset after Argos bulk
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        run: node scripts/assemble-jobs-dataset.mjs
      - name: "Phase 2 pre: Flag locale-mismatched job descriptions"
        if: inputs.skip_translate != true
        continue-on-error: true
        run: node scripts/mark-locale-mismatched-jobs.mjs
      - name: "Phase 2 pre: Flag wrong-language job titles"
        if: inputs.skip_translate != true
        continue-on-error: true
        env:
          TITLE_MISTRANSLATION_MARK_CAP: ${{ vars.TITLE_MISTRANSLATION_MARK_CAP || '100' }}
          TITLE_MISTRANSLATION_QUEUE_CEILING: ${{ vars.TITLE_MISTRANSLATION_QUEUE_CEILING || '2000' }}
        run: node scripts/mark-mistranslated-jobs.mjs
      - name: Log translation stats (before)
        if: inputs.skip_translate != true
        run: node scripts/log-translation-stats.mjs before
      - name: Capture translation observability baseline
        id: translation_observability_before
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: |
          test -f data/jobs.json
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/collect-translation-observability.mjs \
            --mode start --jobs data/jobs.json \
            --output "$RUNNER_TEMP/translation-observability-before.json" \
            --now "$started_at"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: "Phase 2b: Translate pending jobs (cascade top-up)"
        id: translation_shadow_preflight_v2_decision
        if: inputs.skip_translate != true
        env:
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_MODELS_PREFER: claude-cli/haiku
          CLAUDE_CLI_MAX_CALLS_PER_RUN: "300"
          JOBS_CASCADE_DEADLINE_MS: ${{ vars.TRANSLATE_ARGOS_FIRST_DISABLE == '1' && '15000000' || '5400000' }}
          MT_LOCAL_OPUSMT: "1"
          TRANSFORMERS_CACHE: .cache/transformers
          INPUT_MAX_JOBS: ${{ inputs.max_jobs || '900' }}
          INPUT_COMPANY_KEY: ${{ inputs.company_key }}
          SHADOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHADOW_RUN_ID: ${{ github.run_id }}
          SHADOW_SOURCE_REPOSITORY: ${{ github.repository }}
          SHADOW_SOURCE_WORKFLOW: ${{ github.workflow_ref }}
          SHADOW_WORKFLOW_BLOB_SHA: ${{ github.workflow_sha }}
        run: |
          ARGS=(--max-jobs "$INPUT_MAX_JOBS")
          if [ -n "$INPUT_COMPANY_KEY" ]; then
            ARGS+=(--company-key "$INPUT_COMPANY_KEY")
          fi
          # Hash-bind the runtime library in the generated cross-repo contract:
          # scripts/lib/translation-shadow-preflight-v2.mjs
          ARGS+=(
            --shadow-preflight-v2-output "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json"
            --shadow-preflight-v2-baseline-main-sha "${{ steps.translation_observability_before.outputs.source_commit }}"
            --shadow-preflight-v2-runner-temp "$RUNNER_TEMP"
            --shadow-preflight-v2-repository "$SHADOW_SOURCE_REPOSITORY"
            --shadow-preflight-v2-workflow "$SHADOW_SOURCE_WORKFLOW"
            --shadow-preflight-v2-run-id "$SHADOW_RUN_ID"
            --shadow-preflight-v2-run-attempt "$SHADOW_RUN_ATTEMPT"
            --shadow-preflight-v2-workflow-blob-sha "$SHADOW_WORKFLOW_BLOB_SHA"
          )
          set +e
          node scripts/relocalize-pending-jobs.mjs "${ARGS[@]}"
          legacy_status=$?
          set -e
          while IFS= read -r binding; do
            if [[ "$binding" =~ ^expected_(decision|contract)_digest=sha256:[a-f0-9]{64}$ ]]; then
              echo "$binding" >> "$GITHUB_OUTPUT"
            fi
          done < <(node scripts/translation-shadow-preflight-v2.mjs \
            --mode capture \
            --decision "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json" 2>/dev/null || true)
          exit "$legacy_status"
      - name: Log translation stats (after)
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/log-translation-stats.mjs after
      - name: Scatter changes back to per-crawler slices
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/scatter-jobs-to-slices.mjs
      - name: "Phase 2c mop-up: local MT (Argos Translate, in-process)"
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1'
        continue-on-error: true
        env:
          LOCAL_MT_TIME_BUDGET_MS: "9000000"
          INPUT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
        run: node scripts/local-mt-mopup.mjs --max-jobs "$INPUT_MOPUP_MAX_JOBS"
      - name: Re-assemble dataset after Phase 2c mop-up
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Commit translations
        id: commit_translations
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && inputs.dry_run != true
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "🌐 Auto-translate pending jobs" data/jobs/by-crawler/ data/translation-cache/ data/jobs-crawler-config.json data/slug-registry.json data/translation-stats-history.json
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: "Phase 2d: Fix untranslated titles (free cascade)"
        if: steps.hk.outputs.run == 'true' && inputs.dry_run != true
        run: node scripts/fix-untranslated-titles.mjs
      - name: Commit title fixes
        id: commit_title_fixes
        if: steps.hk.outputs.run == 'true' && inputs.dry_run != true
        run: |
          before="$(git rev-parse HEAD)"
          bash scripts/lib/git-commit-data.sh --slice-only "🔤 Fix untranslated titles (free cascade)"
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then echo "final_commit=$after" >> "$GITHUB_OUTPUT"; fi
      - name: Re-assemble true-final translation dataset
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/assemble-jobs-dataset.mjs
      - name: Capture final translation observability (shadow)
        if: always() && steps.translation_observability_before.outputs.ready == 'true'
        env:
          OBSERVABILITY_OUTCOME: ${{ job.status }}
        run: |
          node scripts/collect-translation-observability.mjs \
            --mode finish --jobs data/jobs.json \
            --before "$RUNNER_TEMP/translation-observability-before.json" \
            --state data/translation-observability-state.json \
            --state-output data/translation-observability-state.json \
            --advance-state "${{ job.status == 'success' && inputs.dry_run != true }}" \
            --output "$RUNNER_TEMP/translation-observability.json" \
            --run-id "${{ github.run_id }}" \
            --started-at "${{ steps.translation_observability_before.outputs.started_at }}" \
            --source-commit "${{ steps.translation_observability_before.outputs.source_commit }}" --outcome "$OBSERVABILITY_OUTCOME"
      - name: Finalize translation observability report
        if: always() && steps.translation_observability_before.outputs.ready == 'true'
        run: |
          node scripts/collect-translation-observability.mjs \
            --mode finalize --report "$RUNNER_TEMP/translation-observability.json" \
            --output "$RUNNER_TEMP/translation-observability.json" \
            --final-commit "${{ steps.commit_title_fixes.outputs.final_commit || steps.commit_translations.outputs.final_commit }}"
      - name: Finalize translation shadow preflight v2 observation
        id: translation_shadow_preflight_v2_finalize
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          SHADOW_DEFAULT_COMPANY_KEY: ${{ inputs.company_key }}
          SHADOW_DEFAULT_DRY_RUN: ${{ inputs.dry_run }}
          SHADOW_DEFAULT_MAX_JOBS: ${{ inputs.max_jobs || '900' }}
          SHADOW_DEFAULT_MOPUP_MAX_JOBS: ${{ inputs.mopup_max_jobs || '6000' }}
          SHADOW_DEFAULT_SKIP_HOUSEKEEPING: ${{ inputs.skip_housekeeping }}
          SHADOW_DEFAULT_SKIP_TRANSLATE: ${{ inputs.skip_translate }}
          SHADOW_EVENT_ACTION: ${{ github.event.action }}
          SHADOW_EVENT_NAME: ${{ github.event_name }}
          SHADOW_EXPECTED_CONTRACT_DIGEST: ${{ steps.translation_shadow_preflight_v2_decision.outputs.expected_contract_digest }}
          SHADOW_EXPECTED_DECISION_DIGEST: ${{ steps.translation_shadow_preflight_v2_decision.outputs.expected_decision_digest }}
          SHADOW_FINAL_TRANSLATION_COMMIT: ${{ steps.commit_title_fixes.outputs.final_commit || steps.commit_translations.outputs.final_commit }}
          SHADOW_OBSERVED_JOB_STATUS: ${{ job.status }}
          SHADOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHADOW_RUN_ID: ${{ github.run_id }}
          SHADOW_SOURCE_COMMIT: ${{ steps.translation_observability_before.outputs.source_commit }}
          SHADOW_SOURCE_REPOSITORY: ${{ github.repository }}
          SHADOW_SOURCE_WORKFLOW: ${{ github.workflow_ref }}
          SHADOW_WORKFLOW_BLOB_SHA: ${{ github.workflow_sha }}
        run: |
          node scripts/translation-shadow-preflight-v2.mjs \
            --mode observe \
            --decision "$RUNNER_TEMP/translation-shadow-preflight-v2-decision.json" \
            --output "$RUNNER_TEMP/translation-shadow-preflight-v2-observation.json" \
            --expected-decision-digest "$SHADOW_EXPECTED_DECISION_DIGEST" \
            --expected-contract-digest "$SHADOW_EXPECTED_CONTRACT_DIGEST" \
            --event-name "$SHADOW_EVENT_NAME" \
            --event-action "$SHADOW_EVENT_ACTION" \
            --run-id "$SHADOW_RUN_ID" \
            --run-attempt "$SHADOW_RUN_ATTEMPT" \
            --default-max-jobs "$SHADOW_DEFAULT_MAX_JOBS" \
            --default-mopup-max-jobs "$SHADOW_DEFAULT_MOPUP_MAX_JOBS" \
            --default-company-key "$SHADOW_DEFAULT_COMPANY_KEY" \
            --default-skip-housekeeping "$SHADOW_DEFAULT_SKIP_HOUSEKEEPING" \
            --default-skip-translate "$SHADOW_DEFAULT_SKIP_TRANSLATE" \
            --default-dry-run "$SHADOW_DEFAULT_DRY_RUN" \
            --source-repository "$SHADOW_SOURCE_REPOSITORY" \
            --source-workflow "$SHADOW_SOURCE_WORKFLOW" \
            --source-commit "$SHADOW_SOURCE_COMMIT" \
            --workflow-blob-sha "$SHADOW_WORKFLOW_BLOB_SHA" \
            --final-translation-commit "$SHADOW_FINAL_TRANSLATION_COMMIT" \
            --observed-job-status "$SHADOW_OBSERVED_JOB_STATUS"
      - name: Upload translation shadow preflight v2 artifacts
        if: always() && steps.translation_shadow_preflight_v2_finalize.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-shadow-preflight-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/translation-shadow-preflight-v2-decision.json
            ${{ runner.temp }}/translation-shadow-preflight-v2-observation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Roll up translation observability history
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && inputs.dry_run != true
        run: node scripts/rollup-translation-observability.mjs "$RUNNER_TEMP/translation-observability.json" data/translation-observability-history.json
      - name: Commit translation observability history
        if: always() && steps.translation_observability_before.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          telemetry_paths=(data/translation-observability-history.json)
          if [ -f data/translation-observability-state.json ]; then
            telemetry_paths+=(data/translation-observability-state.json)
          fi
          bash scripts/lib/git-commit-data.sh --slice-only "📊 Roll up translation observability" "${telemetry_paths[@]}"
      - name: Upload translation observability report
        if: always() && steps.translation_observability_before.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-observability-${{ github.run_id }}
          path: ${{ runner.temp }}/translation-observability.json
          retention-days: 14
          if-no-files-found: error
      - name: "Phase 3: Regenerate locale slugs"
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: node scripts/regenerate-slugs-by-locale.mjs
      - name: Commit slug regeneration
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🔗 Regenerate locale slugs (post-translation)"
      - name: Trigger deploy
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: |
          if node scripts/validate-translation-completeness.mjs 2>/dev/null; then
            echo "✅ All translations complete — triggering deploy"
            # Hard-fail by design (no `|| true`, #6936): a failed dispatch
            # here fails the job, caught by "Report failure to GitHub Issues"
            # below — that GitHub issue IS this caller's recovery net
            # (auto-triage picks it up), so silencing it would just hide a
            # real deploy gap.
            GITHUB_REPOSITORY=valerielinc-ops/frontaliere-si-o-no bash scripts/lib/trigger-deploy.sh
          else
            echo "⏳ Some translations still incomplete — skipping deploy trigger"
            echo "   The next cron run will retry and trigger deploy once all jobs are translated."
          fi
      - name: Report failure to GitHub Issues
        if: failure() && (steps.site_checkout_primary.outcome == 'success' || steps.site_checkout_retry.outcome == 'success')
        uses: ./.github/actions/report-failure
        with:
          title: "Workflow Failure: Translate Pending Jobs (sparse cross-repo execution)"
          closed-by: close-recovered-failure-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow-name: Translate Pending Jobs (sparse cross-repo execution)
          workflow-file: .github/corpus-workflows/translate-pending.yml
          priority: "2"
          labels: Bug
          context: "La pipeline di traduzione è a fasi (fetch → translate → verify → commit): lo step fallito qui sopra dice a quale fase si è fermata, e i job non tradotti restano in coda per il prossimo cron."
