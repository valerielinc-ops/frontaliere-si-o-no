            echo "::warning::anybotics: no terminal status was published"
            printf '%s\n' '| anybotics | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::anybotics: invalid terminal status: $status"
              printf '%s\n' '| anybotics | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| anybotics | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::anybotics: crawler exited with status $status"
              printf '| anybotics | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          status_file="$state_dir/aarreha-schinznach.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::aarreha-schinznach: no terminal status was published"
            printf '%s\n' '| aarreha-schinznach | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::aarreha-schinznach: invalid terminal status: $status"
              printf '%s\n' '| aarreha-schinznach | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| aarreha-schinznach | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::aarreha-schinznach: crawler exited with status $status"
              printf '| aarreha-schinznach | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          printf '%s\n' "**Summary:** $success_count succeeded, $failure_count failed, $missing_count missing." >> "$summary_file"
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ]; then
            wait_outcome=failure
          else
            wait_outcome=success
          fi
          printf '%s\n' "success_count=$success_count" "failure_count=$failure_count" "missing_count=$missing_count" "wait_outcome=$wait_outcome" >> "$output_file"
          exit 0
      - name: Commit crawler group data atomically
        if: always() && inputs.generation_token != '' && job.status == 'success' && steps.crawler_group_setup.outcome == 'success'
        run: |-
          set +e
          bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 04 jobs"
          git_commit_exit=$?
          if [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::group commit: push lost the ref race after all retries (contention) on the final aggregated commit. Cycle lost, self-heals next scheduled run — group not failed (systemic class)."
            echo "⚠️ group commit: push contention loss (exit 42) — crawl data was fine, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::group commit: global data-pipeline lease is busy (exit 44); no group data was staged and the next scheduled cycle will retry — group not failed (systemic class)."
            echo "⚠️ group commit: global data-pipeline lease busy (exit 44) — group data not staged, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$git_commit_exit"
      - name: Cleanup Codex auth broker
        if: always()
