        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-15"
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          output_file="${GITHUB_OUTPUT:-/dev/null}"
          success_count=0
          failure_count=0
          missing_count=0
          printf '%s\n' '### Crawler group 15 outcome' >> "$summary_file"
          printf '%s\n' '| Crawler | Outcome |' '| --- | --- |' >> "$summary_file"
          status_file="$state_dir/kronenhof.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::kronenhof: no terminal status was published"
            printf '%s\n' '| kronenhof | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::kronenhof: invalid terminal status: $status"
              printf '%s\n' '| kronenhof | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| kronenhof | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::kronenhof: crawler exited with status $status"
              printf '| kronenhof | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          status_file="$state_dir/spital-affoltern.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::spital-affoltern: no terminal status was published"
            printf '%s\n' '| spital-affoltern | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
