      - name: Aggregate crawler outcomes
        id: crawler_aggregate
        if: always()
        continue-on-error: true
        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-11"
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          output_file="${GITHUB_OUTPUT:-/dev/null}"
          success_count=0
          failure_count=0
          missing_count=0
          systemic_count=0
          printf '%s\n' '### Crawler group 11 outcome' >> "$summary_file"
          printf '%s\n' '| Crawler | Outcome |' '| --- | --- |' >> "$summary_file"
          status_file="$state_dir/rehab-basel.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::rehab-basel: no terminal status was published"
            printf '%s\n' '| rehab-basel | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::rehab-basel: invalid terminal status: $status"
              printf '%s\n' '| rehab-basel | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 143 ]; then
              echo "::warning::rehab-basel: runner shutdown recorded as systemic outcome (exit 143); no per-crawler issue filed"
              printf '%s\n' '| rehab-basel | systemic runner shutdown (143) |' >> "$summary_file"
              systemic_count=$((systemic_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| rehab-basel | success |' >> "$summary_file"
              success_count=$((success_count + 1))
