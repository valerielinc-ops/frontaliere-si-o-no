          fetch-depth: 50
          ref: main
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
