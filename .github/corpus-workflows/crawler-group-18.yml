              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::protectas: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          housekeeping_exit=0
          report_exit=0
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs)
            housekeeping_exit=$?
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Protectas SA jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
              --title "Crawler Failure: Run protectas" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run protectas"
            report_exit=$?; [ "$report_exit" -eq 0 ] || echo "::error::alert reporter failed protectas"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::protectas: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ protectas: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::protectas: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ protectas: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::protectas: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ protectas: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::protectas: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ protectas: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi
          (( git_commit_exit == 45 )) && exit 45
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 44 && git_commit_exit != 143) )) || (( report_exit != 0 )); then
            exit 1
          fi
          exit 0' > "$script_path"
          printf '%s\n' 'set +e
          s='\''protectas'\''
          d="$RUNNER_TEMP/crawler-generation/group-18"
          script_path="$d/$s.sh"
          worker_status_file="$d/$s.worker.status"
          worker_status_tmp="$d/$s.worker.status.tmp.$$"
          started_file="$d/$s.started"
          export CRAWLER_MEMBER_CRAWL_EXIT_FILE="$d/protectas.crawl-exit"
          export CRAWLER_MEMBER_LOG_FILE="$d/$s.log"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$worker_status_tmp"
          mv -f "$worker_status_tmp" "$worker_status_file"
          exit "$crawler_exit"' > "$worker_path"
          validateGeneratedWorkerScript() { [ -s "$1" ] && bash -n "$1"; }
          validateGeneratedWorkerScript "$worker_path" || exit 1
          printf '%s\n' 'set +e
          s='\''protectas'\''
          d="$RUNNER_TEMP/crawler-generation/group-18"
          worker_path="$d/$s.worker.sh"
          status_file="$d/$s.status"
          status_tmp="$d/$s.status.tmp.$$"
          worker_status_file="$d/$s.worker.status"
          started_file="$d/$s.started"
          watchdog_file="$d/protectas.watchdog"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-74}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 74)"
            worker_watchdog_minutes=74
          fi
          classifyCrawlerTimeoutRace() {
            if [ "$1" = 124 ] || [ "$1" = 137 ]; then
              printf '\''%s\n'\'' "$1"
            elif [ -s "$worker_status_file" ]; then
              worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
              if [[ "$worker_status" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$worker_status"; else printf '\''%s\n'\'' 1; fi
            elif [ -e "$started_file" ]; then
              printf '\''%s\n'\'' 143
            elif [ "$1" = 0 ]; then
              printf '\''%s\n'\'' 1
            else
              if [[ "$1" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$1"; else printf '\''%s\n'\'' 143; fi
            fi
          }
          resolveCrawlerTerminalStatus() {
            local wrapper_exit="$1"
            local worker_status=""
            local terminal_exit=""
            local watchdog_marker=1
            [ -s "$worker_status_file" ] && worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
            terminal_exit="$(classifyCrawlerTimeoutRace "$wrapper_exit")"
            if { [ "$wrapper_exit" = 124 ] || [ "$wrapper_exit" = 137 ]; } && { [ "$worker_status" = 1 ] || [ "$worker_status" = 124 ]; }; then watchdog_marker=0; fi
            if [ "$watchdog_marker" -eq 1 ]; then
              if [ "$terminal_exit" -eq 124 ] || [ "$terminal_exit" -eq 137 ]; then printf '\''%s\n'\'' "$worker_watchdog_minutes" > "$watchdog_file"; fi
            fi
            if ! { printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp" && mv -f "$status_tmp" "$status_file"; } 2>/dev/null; then
