        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          ref: ${{ inputs.site_code_commit || 'main' }}
          clean: true
          sparse-checkout: |-
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
