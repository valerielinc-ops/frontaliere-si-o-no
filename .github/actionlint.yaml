# GitHub Actions supports `concurrency.queue` (`single` or `max`), but the
# actionlint version used by the repository action predates that schema field.
# Ignore only its stale unknown-key diagnostic for the workflows that use the
# documented queue policy; all other syntax, expression and shell diagnostics
# remain enabled.
paths:
  .github/workflows/backfill-expired-from-history.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/cleanup-stale-jobs.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/reconcile-expired-route-duplicates.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/sync-gsc-orphans.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/translate-pending.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/corpus-workflows/translate-pending.yml:
    ignore:
      - 'unexpected key "queue"'
