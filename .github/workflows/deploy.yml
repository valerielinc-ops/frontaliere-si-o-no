name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # paths-ignore è una DENYLIST applicata solo se TUTTI i file del push
    # matchano (un push misto docs+codice deploya comunque). Sicuro per
    # definizione: un path dimenticato deploya, non viene saltato.
    # Obiettivo: non bruciare un build SEO da ~25min su merge che NON cambiano
    # il dist deployato (deploy-starvation: build lungo vs merge ~5min via
    # auto-merge PAT). I path sotto non sono letti dalla build del dist:
    #   - docs/markdown, file CI/workflow, test, config agent: nessun output dist.
    # NON ignorati (toccano il dist): build-plugins/, services/, components/,
    # scripts/ (assemble-jobs gira a build-time), data/jobs*, vite/index/package.
    # NB: usiamo `*.md` (root) + `docs/**`, NON `**/*.md`: `public/**/*.md`
    # (es. press-kit) è copiato verbatim da Vite (publicDir) nel dist → resta
    # dist-bound e deve poter deployare.
    #
    # ⚠️ NON allargare questa lista per curare la "deploy starvation" — è la
    # leva sbagliata, misurato il 2026-08-06 sulle ultime 48h (#5251):
    #   - 141 run di deploy: 121 cancellati, 10 success, 8 failure, 2 attivi.
    #   - `paths-ignore` NON si applica a `workflow_dispatch`, e 40 dei 141 run
    #     (28%) arrivano proprio da lì: 15 workflow di dati chiamano
    #     scripts/lib/trigger-deploy.sh dopo aver committato (i push fatti con
    #     GITHUB_TOKEN non innescano workflow, quindi dispatchano a mano).
    #     Publisher jobs sync, Auto-translate, prezzi carburante, newsletter QA,
    #     ALTEN, 404 sweep — sono TUTTI di quella famiglia. Allargare la
    #     denylist ne intercetta zero.
    #   - Dei 101 run da `push`, solo 2 hanno un commit di dati automatico:
    #     su quel canale questa lista sta già facendo il suo lavoro.
    #   - E i 121 run cancellati sono GRATIS: verificati uno per uno via REST,
    #     121 su 121 avevano zero job avviati (cancellati mentre erano ancora
    #     `pending`). Zero minuti-runner, e newest-wins garantisce che il build
    #     successivo contenga comunque ogni commit superato.
    # Il limite vero è la durata del build: mediana 130 min, e mediana del
    # divario fra due build che PARTONO 128 min — la coda è satura, non affamata.
    paths-ignore:
      - 'data/border-wait-current.json'
      # Browser-servable copy of the same file (services/borderWaitCurrentService.ts,
      # issue #4892), written in the SAME commit/call as data/border-wait-current.json
      # by scripts/snapshot-border-wait-history.mjs. Ignored for the same reason as
      # the line above: traffic-scheduler.yml commits it up to every 30 min, and a
      # full SEO deploy per commit would be a deploy-storm. Accepted tradeoff:
      # freshness = as fresh as the next deploy triggered by something else (same
      # contract already accepted for data/border-wait-current.json's SSG usage).
      - 'public/data/border-wait-current.json'
      - 'data/border-wait-history/**'
      - 'data/border-wait-averages.json'
      - 'data/weather-snapshot.json'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Optional article id to verify live metadata and post to Facebook after deploy'
        required: false
        type: string
      article_url:
        description: 'Optional live article URL for post-deploy metadata verification'
        required: false
        type: string
      og_title:
        description: 'Optional expected OG title for the deployed article'
        required: false
        type: string
      og_description:
        description: 'Optional OG description for the Facebook post copy'
        required: false
        type: string
      og_image:
        description: 'Optional expected OG image for the deployed article'
        required: false
        type: string
      article_category:
        description: 'Optional article category used for Facebook hashtags'
        required: false
        type: string
      profile_sequential:
        description: 'Investigation-only run: same sequential build as production (now the default), but skips deploy/validate/upload steps. Use to inspect [profile-detail] timings without consuming a deploy slot.'
        required: false
        type: boolean
        default: false
      profile_jobs_seo:
        description: 'Compatibility no-op: jobsSeoPagesPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      profile_related_compare:
        description: 'Investigation-only: when jobs SEO profiling is enabled, compare legacy related-job filtering against the pre-indexed related-job pool and emit before/after profiler rows.'
        required: false
        type: boolean
        default: false
      profile_weekly_employers:
        description: 'Compatibility no-op: weeklyEmployersPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      write_collision_dump:
        description: 'Investigation-only: dump every unique-by-hash content claim() to dist/.write-collisions-data/ for triaging colliding paths. Off by default — adds ~200k synchronous writeFileSync calls during build (~100-200s overhead) that get pruned at end. The collisions JSON report is emitted regardless; only enable this when you need the actual HTML payload of a colliding path.'
        required: false
        type: boolean
        default: false
      publish_branch_test:
        description: 'EXPERIMENT (reversible): after build, orphan force-push dist/ to the `gh-pages-test` branch instead of (not in addition to) the normal artifact deploy. Validates whether a ~13 GB site survives a git push to GitHub — the prerequisite for switching off the actions/deploy-pages path (10-min artifact-polling cap that has failed every recent deploy). Does NOT touch the live Pages source or the production gh-pages branch; nothing is published. Off by default.'
        required: false
        type: boolean
        default: false
      parallel_plugins:
        description: 'Force parallel closeBundle even when profile_sequential=true. Default (off) means parallel for production, sequential only for clean profile dispatch runs. Set this to true when you want to dispatch a profile run AND keep the parallel scheduling — useful for measuring parallel build behavior without cron-storm cancellation.'
        required: false
        type: boolean
        default: false

permissions:
  # This workflow only needs repository read access: the previous-slug winners
  # sync moved to post-deploy-validation.yml, while the deploy itself only
  # uploads artifacts and publishes to GitHub Pages.
  contents: read
  pages: write
  id-token: write
  issues: write     # for github-issue-creator on build/deploy failure

# Workflow-level serialisation of the BUILD block (matrix-setup → prep →
# build-locale ×4). Exactly one build run is active at a time; newer pushes
# queue as pending and, on the 1-running-+-1-pending cap, the superseded middle
# run is dropped (newest-wins — correct for a cumulative cron-driven site where
# the latest build already contains the intermediate commits).
#
# Crucially, this run now ENDS at the build: deploy / validate / publish moved to
# the separate `deploy-publish.yml` workflow (triggered by this run's success via
# `workflow_run`). So the lock is released the moment the build finishes — the
# next queued build starts immediately, while the prior build's deploy/validate/
# publish tail proceeds independently in deploy-publish.yml (its own `pages-deploy`
# lock). This gives "one build at a time, next starts when the build — not the
# whole deploy cycle — is done", without the ~1h idle a whole-run lock caused.
#
# Because one build runs at a time, the per-locale `build-locale` legs of a run
# never race another run's same-locale CDN / frontaliere-<loc> force-push target,
# so no per-job concurrency group is needed on build-locale anymore.
concurrency:
  group: pages-build-run
  cancel-in-progress: false

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      build_id: ${{ steps.build_id.outputs.build_id }}
    steps:
      - name: Build locale matrix
        id: build
        run: |
          set -eo pipefail
          # Canonical locale set, fixed order, de-duplicated (same node one-liner
          # as deploy-matrix-experiment.yml). Production always builds all four.
          JSON=$(node -e '
            const all = ["it","en","de","fr"];
            process.stdout.write(JSON.stringify(all));
          ')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Locale matrix: $JSON"
      - name: Mint shared digits-only build id
        id: build_id
        run: |
          # Single canonical DEPLOY_BUILD_ID for every shard so each shard's
          # build-plugins/constants.ts BUILD_ID (DEPLOY_BUILD_ID-aware) emits an
          # identical dist/build-id.txt — validate-live's propagation check keys
          # on that file, so all shards must agree.
          echo "build_id=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  # ── Shared prep: assemble the dataset ONCE → atomic snapshot artifact. ──
  # Removes the ×4 duplicated data-prep from the locale shards and guarantees
  # every shard builds from the IDENTICAL job snapshot (no crawler-commit-window
  # divergence). Mirrors deploy-matrix-experiment.yml's prep VERBATIM, plus the
  # monolith's Active-jobs regression check + SEO position tracking.
  prep:
    needs: matrix-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
      - name: Cache assemble-jobs output
        uses: actions/cache@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ hashFiles('scripts/assemble-jobs-dataset.mjs', 'scripts/lib/parse-job-slices-worker.mjs', 'data/jobs/by-crawler/**/*.json', 'data/jobs/expired/by-crawler/**/*.json', 'data/jobs-crawler-summaries/by-crawler/**/*.json') }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-
      - name: Assemble jobs dataset from per-crawler slices
        run: node scripts/assemble-jobs-dataset.mjs --stats
      - name: Active-jobs regression check
        # Block deploy if active jobs dropped >25% vs baseline. Catches mass
        # job loss that slips past the assemble hard-fail (crawler outages,
        # over-eager housekeeping prunes, expired-jobs leaks). Baseline at
        # data/active-jobs-baseline.json auto-ratchets UP only — manual
        # commit required to lower (see CLAUDE.md rule #1).
        run: npm run audit:active-jobs-regression
      - name: SEO position tracking (non-blocking)
        # Refresh the 7-day GSC avg-position snapshot for status visibility and
        # PRINT where it stands. NON-BLOCKING by design (owner decision
        # 2026-06-24): the former SEO-landing moratorium was downgraded from a
        # deploy gate to a tracker. Losing real SEO traffic / serving users 404s
        # (e.g. ~14k/day indexed ricerca-stipendio-* pages going 404) outweighs
        # the avg-position vanity metric, so position is monitored but never
        # blocks a deploy. check-seo-moratorium.mjs reports only (always exit 0).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # OAuth2 path (currently not set; SA fallback in
          # refresh-gsc-position-rolling.mjs uses GOOGLE_APPLICATION_CREDENTIALS
          # exported by the Prepare Firebase credentials step above — the
          # Firebase SA also has GSC permissions per memory
          # `reference_firebase_sa_doubles_as_gsc`).
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          node scripts/refresh-gsc-position-rolling.mjs
          node scripts/check-seo-moratorium.mjs
      - name: Housekeeping (cross-crawler dedup + locale hardening)
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: node scripts/cleanup-jobs.mjs
      - name: Refresh weekly-employers footer link list
        run: node scripts/refresh-weekly-employers-top-pairs.mjs
      - name: Mine all job slugs for 404 coverage
        run: node scripts/mine-all-job-slugs.mjs
      - name: Canton-aware migration of slug registry
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs
      - name: Generate responsive image thumbnails
        run: node scripts/generate-image-thumbnails.mjs
      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs
      - name: Pack prepared snapshot (generated data + thumbnails)
        run: |
          set -eo pipefail
          # public/data holds the assemble-generated, GITIGNORED runtime JSON
          # (jobs.json, jobs-stats.json, expired-jobs.json) that Vite copies into
          # dist/data. A fresh shard checkout does NOT have them (gitignored) and
          # they are not regenerated per-shard (assemble runs only here in prep),
          # so they MUST travel in the snapshot — otherwise dist/data/jobs-stats.json
          # is missing on the IT shard (validate-critical-dist-pages fail) and the
          # SPA's /data/jobs.json 404s live. (fuel-prices/health-premiums/etc. are
          # CDN-managed by their own crons, not produced by the deploy.)
          tar -czf /tmp/prepared-snapshot.tgz \
            data \
            public/data \
            public/images/blog/thumbnails public/images/places/thumbnails 2>/dev/null || \
            tar -czf /tmp/prepared-snapshot.tgz data public/data
          ls -lh /tmp/prepared-snapshot.tgz
      - name: Upload prepared snapshot
        uses: actions/upload-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/prepared-snapshot.tgz
          retention-days: 1

  # ── Matrix build: one runner per locale. IT serves Pages + uploads the same
  # artifacts as the monolith; en/de/fr push to their frontaliere-<loc> shards.
  build-locale:
    needs: [matrix-setup, prep]
    runs-on: ubuntu-latest
    # No per-job concurrency: the workflow-level `pages-build-run` group already
    # guarantees a single build run at a time, so this run's 4 legs never race
    # another run's same-locale CDN / frontaliere-<loc> force-push target.
    # shard-secrets-overflow: repo-level Actions secrets hit GitHub's 100/repo
    # cap (89 section-shard deploy keys already used the quota). Environment
    # secrets are a separate 100-slot pool that GitHub merges into the same
    # `secrets.*` context when a job declares `environment:` — no change
    # needed to how existing repo-level SHARD_*_DEPLOY_KEY secrets are read.
    # No protection rules on this environment (see `gh api .../environments`).
    environment: shard-secrets-overflow
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      # #5331: the CDN ordering gate reads THIS run's job list to tell "the IT
      # leg has not published the marker YET" apart from "the IT leg is over and
      # failed, so it never will". Read-only, and the gate degrades to its old
      # blind 2700s wait if the scope is ever missing — never to an early
      # publish.
      actions: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      # Mirrors the monolith Build step env. Profile-bound knobs that map to
      # workflow_dispatch inputs irrelevant to the matrix path are dropped;
      # SEQUENTIAL_PROFILE is forced on (always sequential on the GH runner).
      BUILD_PROFILE: '1'
      ASSET_CDN: 'https://cdn.frontaliereticino.ch'
      # Restored to 2 (#4959 §4): the post-walk worker no longer imports the
      # site-shell graph. injectContextualLinks moved to a leaf module with
      # type-only imports, so plain Node ESM inside the worker resolves it —
      # verified directly: the leaf loads, the old plugin path still fails with
      # ERR_MODULE_NOT_FOUND on siteShell.
      POST_WALK_WORKERS: '2'
      SEQUENTIAL_PROFILE: '1'
      JOBS_SEO_PROFILE_PHASES: '1'
      WEEKLY_EMPLOYERS_PROFILE: ''
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
      RELATED_SEARCH_PREPASS_CONCURRENCY: '1'
      DEPLOY_CONTENT_MANIFEST: '1'
      # Runner-level OOM mitigation (run 30274470672, 2026-07-27): IT build
      # got host-killed ("runner has received a shutdown signal") mid
      # related-search-clusters at rss_mb=11848 while heapTotal was only
      # ~5.1GB — the gap is glibc malloc arenas never returned to the OS,
      # not V8 heap (jobsSeoPagesPlugin/staticPagesPlugin/etc. already gc()
      # between phases — see profilePlugin.ts — so V8-side reclaim is not
      # the gap). postWalkCoordinatorPlugin.ts spawns POST_WALK_WORKERS
      # worker_threads earlier in the build; each worker's glibc arenas can
      # outlive the thread and pin RSS for the rest of closeBundle, which
      # matches the ~9.8GB pinned-RSS pattern already logged in past
      # investigations. Capping arenas makes glibc trim more aggressively.
      # Revert trigger: if a build still OOMs at/above this same RSS after
      # this lands, this wasn't the (whole) cause — pursue reducing the
      # related-search-clusters candidate set instead, don't re-try this knob.
      MALLOC_ARENA_MAX: '2'
      # Per-locale emit filter + shared canonical build id (identical
      # dist/build-id.txt across all shards).
      BUILD_LOCALE: ${{ matrix.locale }}
      DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
      # Build-time article emit skip (issue #4881 Fase 5). Read by
      # ogPagesPlugin.ts's closeBundle (renderArticlePages) and
      # seoHubsPlugin.ts's emitSeoHubs (renderArticleHubPagesCore) — see
      # those files' docblocks. Repo variables, same per-section convention
      # as <SECTION>_SHARD_LIVE; default (unset) = unchanged legacy
      # behavior (both sections keep emitting into the monolith build).
      # MUST stay in lockstep with the push-loop exclusion below — never
      # flip one true without the other in the SAME deploy.
      ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
      ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
    steps:
      # #7106 — anchors the CDN gate's job-deadline safety margin (see "WHY A
      # THIRD CLOCK" in scripts/lib/wait-cdn-build-id.sh) to this leg's REAL
      # start, not the "Wait for IT CDN push" step's start. That is what lets
      # the gate self-adjust for however long Build+shard-push (T1) actually
      # took on THIS run instead of assuming a fixed T1. First step so no
      # earlier step's variance is left out of the clock.
      - name: Record job start (#7106 CDN gate job-deadline safety margin)
        run: echo "CDN_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5

      # I build-locale morivano exit 134 sul muro V8 (12288 MB) con l'host
      # ancora largo (~2 GB MemAvailable, ~3 GB SwapFree — run 32319344037):
      # il tetto V8 e' salito a 14336 (package.json build:ci) e regge solo
      # con capacita' di evizione in piu'. Lo swapfile, i suoi numeri e il
      # razionale stanno in UN posto solo: scripts/ci/grow-build-swap.sh
      # (review di #6150 — la copia inline era duplicata 3 volte e ha
      # lasciato scoperti 2 workflow). Il ramo fail-open dello script e'
      # coperto dal preflight di buildMemoryGuard, che ferma in 5 secondi
      # qualunque build:ci parta col tetto alzato senza questo swap.
      # Revert-trigger: se un leg muore host-kill (step in_progress senza
      # exit code) o il wall-time dello step Build cresce >20% con lo swap
      # attivo, togliere script e rialzo del tetto V8 insieme, e riaprire
      # l'indagine retention (issue #6134).
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash scripts/ci/grow-build-swap.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # Consume the shared atomic snapshot from the prep job instead of
      # re-running assemble/cleanup/mine/migrate/thumbnails per shard.
      - name: Download prepared snapshot
        uses: actions/download-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/snapshot
      - name: Restore prepared snapshot (data + thumbnails)
        run: |
          set -eo pipefail
          tar -xzf /tmp/snapshot/prepared-snapshot.tgz -C .
          test -f data/jobs.json && echo "✓ data/jobs.json restored ($(wc -c < data/jobs.json) bytes)" || { echo "✖ data/jobs.json missing after restore"; exit 1; }

      - name: Cache per-job OG images
        uses: actions/cache@v5
        with:
          path: .cache/og-jobs
          key: og-jobs-${{ runner.os }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}
          restore-keys: |
            og-jobs-${{ runner.os }}-

      # IT-only: restore + stash the previous deploy content manifest so the
      # IT shard's deploy-file-delta can diff in-place HTML changes (the IT
      # shard is the one that runs deploy-it-pages-prep.sh).
      - name: Restore previous deploy content manifest
        if: matrix.locale == 'it'
        uses: actions/cache@v5
        with:
          path: content-manifest.tsv
          key: deploy-content-manifest-${{ github.run_id }}
          restore-keys: |
            deploy-content-manifest-

      - name: Stash previous content manifest before build overwrites it
        if: matrix.locale == 'it'
        run: |
          if [ -f content-manifest.tsv ]; then
            mv content-manifest.tsv prev-content-manifest.tsv
            echo "[file-delta] previous manifest stashed ($(wc -l < prev-content-manifest.tsv) lines)"
          else
            echo "[file-delta] no previous manifest (first run after enabling / cache miss)"
          fi

      - name: Build (BUILD_LOCALE=${{ matrix.locale }})
        id: build_step
        shell: bash
        env:
          # Redundant with the job-level `MALLOC_ARENA_MAX` above, which has
          # been in place since 2026-07-27 — kept only so this step is
          # self-contained if it is ever lifted out. It is NOT the fix for the
          # current SIGTERMs: the job-level setting was already active in every
          # run that died, which is precisely the revert trigger the job-level
          # comment documents. See that comment for where to look instead.
          MALLOC_ARENA_MAX: '2'
        run: |
          set -o pipefail

          # Host-memory sampler. The builds that die report only
          # "The runner has received a shutdown signal" and exit 143, which
          # names no cause, and every theory read off the build's OWN numbers
          # has been falsified by the last SUCCESSFUL run (15922, 2026-08-03):
          # it peaked at rss 12643 MB — HIGHER than the 12203 MB of a run the
          # host killed — and finished. Disk is not it either: all three runs
          # report an identical 108 G free. What no log carries is the figure
          # that would actually settle it, the HOST's free memory at the
          # moment of death. This samples it every 10 s so the next failure is
          # a measurement instead of another guess.
          #
          # `MemAvailable` is the number that matters (free + reclaimable),
          # not `MemFree`. A run killed by the host will show it collapsing
          # toward zero in the seconds before the log stops; one that stays
          # comfortable rules host memory out and sends the search elsewhere.
          #
          # Run against a real shell before landing, which caught two defects
          # that would have made this silently useless: piping the loop through
          # `sed` to add the prefix emitted NOTHING (sed block-buffers when
          # stdout is not a tty, so a sampler this sparse never flushed), and
          # `$!` then held the PID of the pipeline's last element rather than
          # the loop, so the trap left the sampler running. The prefix is
          # printed inline and there is no pipe.
          #
          # The 4-hour bound is a backstop, not the mechanism: the trap below
          # is what normally stops it. It exists so a sampler can never be what
          # keeps a runner alive if the trap is ever bypassed.
          ( end=$(( $(date +%s) + 14400 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              printf '[hostmem] '
              awk '/^(MemTotal|MemAvailable|MemFree|SwapFree|Dirty):/ {sub(/:/,"",$1); printf "%s=%dMB ", $1, $2/1024}' /proc/meminfo
              printf 'topRSS=%dMB\n' "$(ps -eo rss= --sort=-rss | head -1 | awk '{print int($1/1024)}')"
              sleep 10
            done ) &
          sampler=$!
          # Never let the sampler outlive the step, whatever the build does.
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          npm run build:ci 2>&1 | tee /tmp/build.log
          build_exit="${PIPESTATUS[0]}"
          # Wall-time del leg (SECONDS e' un builtin bash, azzerato a inizio
          # step): serve al follow-up #6174 item 1 per accumulare storia
          # comparabile, per ora scritta qui e persistita dallo step
          # "Append build memory history row" sotto. Va dopo la build, non
          # prima dell'exit, cosi' viene emesso anche sui leg che falliscono
          # (host-kill escluso: quello termina il processo prima di questa
          # riga, e non produce mai il referto memguard letto sotto).
          echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$build_exit"

      # Legge il referto che `buildMemoryGuardPlugin` scrive SEMPRE (verde o
      # rosso) in /tmp/build-memory-peak.json, e lo espone come output. Sta
      # subito dopo il build e gira `always()` perche' il caso che conta e'
      # proprio quello in cui il build e' rosso.
      #
      # `breach` vuoto = il build e' fallito per altro (o non e' fallito): in
      # quel caso lo step di report qui sotto NON parte, altrimenti qualunque
      # rosso aprirebbe una issue di memoria e il titolo perderebbe significato.
      - name: Read build memory report
        id: memguard
        if: always()
        shell: bash
        run: |
          set -o pipefail
          breach=''
          peak=''
          peak_anon=''
          avail=''
          swap_free=''
          if [ -f /tmp/build-memory-peak.json ]; then
            breach=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.breach??""))' || true)
            peak=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakRssMb??""))' || true)
            peak_anon=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakAnonMb??""))' || true)
            avail=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minHostAvailMb??""))' || true)
            swap_free=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minSwapFreeMb??""))' || true)
            cat /tmp/build-memory-peak.json
          else
            echo "[memguard] nessun referto: il processo di build non ha mai chiuso (host-kill) o il guard non era armato"
          fi
          {
            echo "breach=$breach"
            echo "peak_rss_mb=$peak"
            echo "peak_anon_mb=$peak_anon"
            echo "min_host_avail_mb=$avail"
            echo "min_swap_free_mb=$swap_free"
          } >> "$GITHUB_OUTPUT"

      - name: Verify critical dist pages before upload
        if: matrix.locale == 'it'
        run: node scripts/validate-critical-dist-pages.mjs

      - name: Verify build profile markers before upload
        if: matrix.locale == 'it'
        run: node scripts/validate-build-profile-markers.mjs /tmp/build.log

      # The in-build BUILD_LOCALE filter only gates WriteCollector writes;
      # direct-fs.writeFileSync emitters (redirect/bridge/weather/alias) still
      # write every locale. This removes the non-owned locale output the same
      # way deploy.yml copies only dist/<locale> to each shard repo.
      - name: Prune to locale shard
        run: node scripts/ci/prune-locale-shard.mjs dist

      - name: Validate locale shard output
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      # ── CDN payload FIRST, before anything publishes (#2569 margin) ───────
      # This is ONLY the "Push generated assets to CDN repo" phase of
      # deploy-it-pages-prep.sh, hoisted out of that script and run here. The
      # rest of the prep (offload / prune / drop-assets / tar / audit) still
      # runs in "Deploy prep (IT → Pages + CDN)" below, in its original order —
      # in particular the IT offload still runs AFTER the section pushes, which
      # is the ordering the section-shard comment below depends on.
      #
      # WHY THE HOIST. The #2569 gate ("Wait for IT CDN push" on the en/de/fr
      # legs) polls cdn-build-id.txt for THIS build's id. The marker only turns
      # when the IT leg reaches its CDN push — and until now that was ~40min
      # after the IT build ended, behind 31min of section-shard pushes, 5min of
      # packing, 1min of uploads and 4min of strip. Measured on run 31076991699
      # (a run that SUCCEEDED): the de leg waited 2714s against a 2700s budget
      # and matched on the LAST of its 181 polls. Zero margin. The same
      # structure timed all three non-IT legs out on run 31062047677.
      #
      # Nothing between here and the old call site writes any of the paths the
      # CDN payload is staged from (dist/og, dist/data, dist/assets,
      # dist/job-canon, dist/images/events/catalog, public/images/*):
      #   - push-section-shard.sh copies dist/<sub> into $RUNNER_TEMP and runs
      #     the offload there with cwd=$RUNNER_TEMP/... — and
      #     offload-generated-images-cdn.mjs resolves its dist as
      #     path.resolve(process.cwd(), 'dist'), so it can only touch the
      #     staged subtree;
      #   - "Pack section shard dist" / "Upload shard batch N" only read;
      #   - strip-section-subtree.sh only `rm -rf`s dist/<sub>.
      # So the bytes published here are identical to the bytes the old call
      # site would have published. The gate predicate is UNCHANGED
      # (cdn-build-id.txt == DEPLOY_BUILD_ID, marker written last, in the same
      # atomic publish as the payload) — it is simply satisfied ~40min earlier.
      #
      # #2569 is not weakened, it is EXTENDED: the 25 IT section shards pushed
      # by the next step used to go live BEFORE this build's CDN payload
      # existed (they run the same CDN offload on their staged copy — see
      # CDN_BASE_FIXED in push-section-shard.sh — but were never gated). After
      # the hoist they publish after it.
      #
      # continue-on-error + the CDN_BASE handshake: on success the script
      # exports CDN_BASE into $GITHUB_ENV, and "Deploy prep" then SKIPS its own
      # CDN push. If this fails, CDN_BASE stays unset and "Deploy prep" runs
      # the push exactly where it always did — so the failure path is
      # byte-identical to the pre-hoist behaviour, plus one free retry.
      - name: Push generated assets to CDN (early — ahead of the shard pushes)
        id: cdn-push-early
        if: matrix.locale == 'it'
        continue-on-error: true
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
          DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
          # Runs ONLY step_push_cdn (+ nothing else) and returns.
          DEPLOY_CDN_PUSH_ONLY: '1'
        run: bash scripts/lib/deploy-it-pages-prep.sh

      # Persiste peak_anon_mb/peak_rss_mb/wall_seconds per-leg cross-run:
      # senza questo, il referto letto da "Read build memory report" e'
      # ephemeral (/tmp, sparisce a fine job) e non esiste storia su cui
      # calibrare il detector automatico dei revert-trigger a tempo (oggi
      # manuali, vedi "Grow swap" sopra) — vedi follow-up #6174 item 1. Riusa
      # lo STESSO pattern gia' in produzione per data/dist-size-history.jsonl
      # (append JSONL + merge=union in .gitattributes + retry-con-rebase):
      # coi 4 leg del matrix che scrivono in concorrenza, un push diretto
      # senza rebase-retry wedgerebbe come gia' successo prima che quel
      # pattern esistesse.
      #
      # Deliberatamente DOPO "Push generated assets to CDN (early…)" sopra,
      # non subito dopo "Read build memory report": il gate #2569 sull'IT leg
      # ha gia' margine zero (de leg atteso 2714s su budget 2700s, run
      # 31076991699, un run RIUSCITO — vedi commento sopra). Uno step con
      # fino a 5 retry a backoff 5/10/15/25/40s (~95s worst-case) PRIMA della
      # CDN push avrebbe eroso quel margine; qui non ritarda piu' nulla che
      # gli altri leg stiano aspettando.
      - name: Append build memory history row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          ROW_BREACH: ${{ steps.memguard.outputs.breach }}
          ROW_PEAK_ANON: ${{ steps.memguard.outputs.peak_anon_mb }}
          ROW_PEAK_RSS: ${{ steps.memguard.outputs.peak_rss_mb }}
          ROW_AVAIL: ${{ steps.memguard.outputs.min_host_avail_mb }}
          ROW_SWAP: ${{ steps.memguard.outputs.min_swap_free_mb }}
          ROW_WALL: ${{ steps.build_step.outputs.wall_seconds }}
        run: |
          set -o pipefail
          if [ -z "$ROW_PEAK_ANON" ]; then
            echo "[build-history] nessun referto memguard (host-kill o guard mai armato), niente da appendere"
            exit 0
          fi
          mkdir -p data/build-history
          node -e '
            const fs = require("fs");
            const num = (v) => (v === undefined || v === "" ? null : Number(v));
            const row = {
              ts: new Date().toISOString(),
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              breach: process.env.ROW_BREACH || null,
              peak_anon_mb: num(process.env.ROW_PEAK_ANON),
              peak_rss_mb: num(process.env.ROW_PEAK_RSS),
              min_host_avail_mb: num(process.env.ROW_AVAIL),
              min_swap_free_mb: num(process.env.ROW_SWAP),
              wall_seconds: num(process.env.ROW_WALL),
            };
            fs.appendFileSync("data/build-history/memory-peaks.jsonl", JSON.stringify(row) + "\n");
          '
          git config user.name "build-history-bot"
          git config user.email "build-history-bot@frontaliereticino.ch"
          git add data/build-history/memory-peaks.jsonl
          git commit -m "chore(build-history): append ${ROW_LOCALE} leg run ${ROW_RUN_ID}"
          bash scripts/lib/configure-main-push-auth.sh
          # Stesso retry-con-rebase di "Commit dist-size-history row" sopra
          # (5 tentativi, backoff 5/10/15/25/40s): 4 leg concorrenti + gli
          # altri produttori su main (crawlers/thin-promotions/fuel/weather)
          # regolarmente out-race una finestra piu' corta.
          for i in 1 2 3 4 5; do
            if git -c rebase.autoStash=true -c rebase.backend=merge \
                pull --rebase origin main \
                && git push origin HEAD:main; then
              echo "[build-history] pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            case "$i" in
              1) sleep 5 ;;
              2) sleep 10 ;;
              3) sleep 15 ;;
              4) sleep 25 ;;
              5) sleep 40 ;;
            esac
          done
          echo "::warning::[build-history] push failed after 5 attempts — this leg's memory-peak row will not be in history"

      # ── Section shards (keep the IT apex under the 10 GB Pages cap) ────────
      # Push each oversized job-board section (ticino/svizzera/zurigo) to its
      # OWN per-locale Pages repo (frontaliere-<section>-it, several GB each)
      # and strip it from dist BEFORE deploy-it-pages-prep packs the artifact,
      # so the IT github-pages artifact drops below the actions/deploy-pages
      # 10 GB cap. One repo PER (section, locale) — a single combined repo per
      # section would itself exceed the cap. Runs BEFORE the IT offload
      # (inside deploy-it-pages-prep) so each push-section-shard.sh invocation
      # offloads its own staged copy exactly once. Push gates on the deploy
      # key; strip additionally gates on <SECTION>_SHARD_LIVE + the push
      # ok-marker (populate-then-strip) → a full no-op until the owner
      # provisions + flips a given section's split. See
      # docs/TICINO-SHARD-RUNBOOK.md for the mechanism (written for the first
      # section, ticino; svizzera/zurigo reuse it via
      # scripts/lib/section-shard-slugs.json).
      - name: Push section shards (IT → frontaliere-<section>-it)
        id: push-section-shards-it
        if: matrix.locale == 'it'
        # A push failure must never block the apex publish: the strip then no-ops
        # (no ok-marker) so that section stays in the apex (>10 GB, deploy fails —
        # but never UNSERVED). The shard otherwise keeps serving its previous build.
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          SHARD_SVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_IT_DEPLOY_KEY }}
          SHARD_SVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_EN_DEPLOY_KEY }}
          SHARD_SVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_DE_DEPLOY_KEY }}
          SHARD_SVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_FR_DEPLOY_KEY }}
          SHARD_ZURIGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_IT_DEPLOY_KEY }}
          SHARD_ZURIGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_EN_DEPLOY_KEY }}
          SHARD_ZURIGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_DE_DEPLOY_KEY }}
          SHARD_ZURIGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_FR_DEPLOY_KEY }}
          SHARD_ARGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_IT_DEPLOY_KEY }}
          SHARD_ARGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_EN_DEPLOY_KEY }}
          SHARD_ARGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_DE_DEPLOY_KEY }}
          SHARD_ARGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_FR_DEPLOY_KEY }}
          SHARD_APPENZELLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_IT_DEPLOY_KEY }}
          SHARD_APPENZELLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_EN_DEPLOY_KEY }}
          SHARD_APPENZELLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_DE_DEPLOY_KEY }}
          SHARD_APPENZELLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_FR_DEPLOY_KEY }}
          SHARD_BASILEA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_IT_DEPLOY_KEY }}
          SHARD_BASILEA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_EN_DEPLOY_KEY }}
          SHARD_BASILEA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_DE_DEPLOY_KEY }}
          SHARD_BASILEA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_FR_DEPLOY_KEY }}
          SHARD_BERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_IT_DEPLOY_KEY }}
          SHARD_BERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_EN_DEPLOY_KEY }}
          SHARD_BERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_DE_DEPLOY_KEY }}
          SHARD_BERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_FR_DEPLOY_KEY }}
          SHARD_FRIBURGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_IT_DEPLOY_KEY }}
          SHARD_FRIBURGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_EN_DEPLOY_KEY }}
          SHARD_FRIBURGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_DE_DEPLOY_KEY }}
          SHARD_FRIBURGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_FR_DEPLOY_KEY }}
          SHARD_GINEVRA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_IT_DEPLOY_KEY }}
          SHARD_GINEVRA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_EN_DEPLOY_KEY }}
          SHARD_GINEVRA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_DE_DEPLOY_KEY }}
          SHARD_GINEVRA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_FR_DEPLOY_KEY }}
          SHARD_GLARONA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_IT_DEPLOY_KEY }}
          SHARD_GLARONA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_EN_DEPLOY_KEY }}
          SHARD_GLARONA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_DE_DEPLOY_KEY }}
          SHARD_GLARONA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_FR_DEPLOY_KEY }}
          SHARD_GRIGIONI_IT_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_IT_DEPLOY_KEY }}
          SHARD_GRIGIONI_EN_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_EN_DEPLOY_KEY }}
          SHARD_GRIGIONI_DE_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_DE_DEPLOY_KEY }}
          SHARD_GRIGIONI_FR_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_FR_DEPLOY_KEY }}
          SHARD_GIURA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_IT_DEPLOY_KEY }}
          SHARD_GIURA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_EN_DEPLOY_KEY }}
          SHARD_GIURA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_DE_DEPLOY_KEY }}
          SHARD_GIURA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_FR_DEPLOY_KEY }}
          SHARD_LUCERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_IT_DEPLOY_KEY }}
          SHARD_LUCERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_EN_DEPLOY_KEY }}
          SHARD_LUCERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_DE_DEPLOY_KEY }}
          SHARD_LUCERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_FR_DEPLOY_KEY }}
          SHARD_NEUCHATEL_IT_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_IT_DEPLOY_KEY }}
          SHARD_NEUCHATEL_EN_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_EN_DEPLOY_KEY }}
          SHARD_NEUCHATEL_DE_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_DE_DEPLOY_KEY }}
          SHARD_NEUCHATEL_FR_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_FR_DEPLOY_KEY }}
          SHARD_NIDVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_IT_DEPLOY_KEY }}
          SHARD_NIDVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_EN_DEPLOY_KEY }}
          SHARD_NIDVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_DE_DEPLOY_KEY }}
