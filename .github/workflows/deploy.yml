name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # paths-ignore è una DENYLIST applicata solo se TUTTI i file del push
    # matchano (un push misto docs+codice deploya comunque). Sicuro per
    # definizione: un path dimenticato deploya, non viene saltato.
    # Obiettivo: non bruciare un build SEO da ~25min su merge che NON cambiano
    # il dist deployato (deploy-starvation: build lungo vs merge ~5min via
    # auto-merge PAT). I path sotto non sono letti dalla build del dist:
    #   - docs/markdown, file CI/workflow, test, config agent: nessun output dist.
    # NON ignorati (toccano il dist): build-plugins/, services/, components/,
    # scripts/ (assemble-jobs gira a build-time), data/jobs*, vite/index/package.
    # NB: usiamo `*.md` (root) + `docs/**`, NON `**/*.md`: `public/**/*.md`
    # (es. press-kit) è copiato verbatim da Vite (publicDir) nel dist → resta
    # dist-bound e deve poter deployare.
    paths-ignore:
      - 'data/border-wait-current.json'
      - 'data/border-wait-history/**'
      - 'data/border-wait-averages.json'
      - 'data/weather-snapshot.json'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Optional article id to verify live metadata and post to Facebook after deploy'
        required: false
        type: string
      article_url:
        description: 'Optional live article URL for post-deploy metadata verification'
        required: false
        type: string
      og_title:
        description: 'Optional expected OG title for the deployed article'
        required: false
        type: string
      og_description:
        description: 'Optional OG description for the Facebook post copy'
        required: false
        type: string
      og_image:
        description: 'Optional expected OG image for the deployed article'
        required: false
        type: string
      article_category:
        description: 'Optional article category used for Facebook hashtags'
        required: false
        type: string
      profile_sequential:
        description: 'Investigation-only run: same sequential build as production (now the default), but skips deploy/validate/upload steps. Use to inspect [profile-detail] timings without consuming a deploy slot.'
        required: false
        type: boolean
        default: false
      profile_jobs_seo:
        description: 'Compatibility no-op: jobsSeoPagesPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      profile_related_compare:
        description: 'Investigation-only: when jobs SEO profiling is enabled, compare legacy related-job filtering against the pre-indexed related-job pool and emit before/after profiler rows.'
        required: false
        type: boolean
        default: false
      profile_weekly_employers:
        description: 'Compatibility no-op: weeklyEmployersPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      write_collision_dump:
        description: 'Investigation-only: dump every unique-by-hash content claim() to dist/.write-collisions-data/ for triaging colliding paths. Off by default — adds ~200k synchronous writeFileSync calls during build (~100-200s overhead) that get pruned at end. The collisions JSON report is emitted regardless; only enable this when you need the actual HTML payload of a colliding path.'
        required: false
        type: boolean
        default: false
      publish_branch_test:
        description: 'EXPERIMENT (reversible): after build, orphan force-push dist/ to the `gh-pages-test` branch instead of (not in addition to) the normal artifact deploy. Validates whether a ~13 GB site survives a git push to GitHub — the prerequisite for switching off the actions/deploy-pages path (10-min artifact-polling cap that has failed every recent deploy). Does NOT touch the live Pages source or the production gh-pages branch; nothing is published. Off by default.'
        required: false
        type: boolean
        default: false
      parallel_plugins:
        description: 'Force parallel closeBundle even when profile_sequential=true. Default (off) means parallel for production, sequential only for clean profile dispatch runs. Set this to true when you want to dispatch a profile run AND keep the parallel scheduling — useful for measuring parallel build behavior without cron-storm cancellation.'
        required: false
        type: boolean
        default: false

permissions:
  # This workflow only needs repository read access: the previous-slug winners
  # sync moved to post-deploy-validation.yml, while the deploy itself only
  # uploads artifacts and publishes to GitHub Pages.
  contents: read
  pages: write
  id-token: write
  issues: write     # for github-issue-creator on build/deploy failure

# Workflow-level serialisation of the BUILD block (matrix-setup → prep →
# build-locale ×4). Exactly one build run is active at a time; newer pushes
# queue as pending and, on the 1-running-+-1-pending cap, the superseded middle
# run is dropped (newest-wins — correct for a cumulative cron-driven site where
# the latest build already contains the intermediate commits).
#
# Crucially, this run now ENDS at the build: deploy / validate / publish moved to
# the separate `deploy-publish.yml` workflow (triggered by this run's success via
# `workflow_run`). So the lock is released the moment the build finishes — the
# next queued build starts immediately, while the prior build's deploy/validate/
# publish tail proceeds independently in deploy-publish.yml (its own `pages-deploy`
# lock). This gives "one build at a time, next starts when the build — not the
# whole deploy cycle — is done", without the ~1h idle a whole-run lock caused.
#
# Because one build runs at a time, the per-locale `build-locale` legs of a run
# never race another run's same-locale CDN / frontaliere-<loc> force-push target,
# so no per-job concurrency group is needed on build-locale anymore.
concurrency:
  group: pages-build-run
  cancel-in-progress: false

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      build_id: ${{ steps.build_id.outputs.build_id }}
    steps:
      - name: Build locale matrix
        id: build
        run: |
          set -eo pipefail
          # Canonical locale set, fixed order, de-duplicated (same node one-liner
          # as deploy-matrix-experiment.yml). Production always builds all four.
          JSON=$(node -e '
            const all = ["it","en","de","fr"];
            process.stdout.write(JSON.stringify(all));
          ')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Locale matrix: $JSON"
      - name: Mint shared digits-only build id
        id: build_id
        run: |
          # Single canonical DEPLOY_BUILD_ID for every shard so each shard's
          # build-plugins/constants.ts BUILD_ID (DEPLOY_BUILD_ID-aware) emits an
          # identical dist/build-id.txt — validate-live's propagation check keys
          # on that file, so all shards must agree.
          echo "build_id=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  # ── Shared prep: assemble the dataset ONCE → atomic snapshot artifact. ──
  # Removes the ×4 duplicated data-prep from the locale shards and guarantees
  # every shard builds from the IDENTICAL job snapshot (no crawler-commit-window
  # divergence). Mirrors deploy-matrix-experiment.yml's prep VERBATIM, plus the
  # monolith's Active-jobs regression check + SEO position tracking.
  prep:
    needs: matrix-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
      - name: Cache assemble-jobs output
        uses: actions/cache@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ hashFiles('scripts/assemble-jobs-dataset.mjs', 'scripts/lib/parse-job-slices-worker.mjs', 'data/jobs/by-crawler/**/*.json', 'data/jobs/expired/by-crawler/**/*.json', 'data/jobs-crawler-summaries/by-crawler/**/*.json') }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-
      - name: Assemble jobs dataset from per-crawler slices
        run: node scripts/assemble-jobs-dataset.mjs --stats
      - name: Active-jobs regression check
        # Block deploy if active jobs dropped >25% vs baseline. Catches mass
        # job loss that slips past the assemble hard-fail (crawler outages,
        # over-eager housekeeping prunes, expired-jobs leaks). Baseline at
        # data/active-jobs-baseline.json auto-ratchets UP only — manual
        # commit required to lower (see CLAUDE.md rule #1).
        run: npm run audit:active-jobs-regression
      - name: SEO position tracking (non-blocking)
        # Refresh the 7-day GSC avg-position snapshot for status visibility and
        # PRINT where it stands. NON-BLOCKING by design (owner decision
        # 2026-06-24): the former SEO-landing moratorium was downgraded from a
        # deploy gate to a tracker. Losing real SEO traffic / serving users 404s
        # (e.g. ~14k/day indexed ricerca-stipendio-* pages going 404) outweighs
        # the avg-position vanity metric, so position is monitored but never
        # blocks a deploy. check-seo-moratorium.mjs reports only (always exit 0).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # OAuth2 path (currently not set; SA fallback in
          # refresh-gsc-position-rolling.mjs uses GOOGLE_APPLICATION_CREDENTIALS
          # exported by the Prepare Firebase credentials step above — the
          # Firebase SA also has GSC permissions per memory
          # `reference_firebase_sa_doubles_as_gsc`).
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          node scripts/refresh-gsc-position-rolling.mjs
          node scripts/check-seo-moratorium.mjs
      - name: Housekeeping (cross-crawler dedup + locale hardening)
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: node scripts/cleanup-jobs.mjs
      - name: Refresh weekly-employers footer link list
        run: node scripts/refresh-weekly-employers-top-pairs.mjs
      - name: Mine all job slugs for 404 coverage
        run: node scripts/mine-all-job-slugs.mjs
      - name: Canton-aware migration of slug registry
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs
      - name: Generate responsive image thumbnails
        run: node scripts/generate-image-thumbnails.mjs
      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs
      - name: Pack prepared snapshot (generated data + thumbnails)
        run: |
          set -eo pipefail
          # public/data holds the assemble-generated, GITIGNORED runtime JSON
          # (jobs.json, jobs-stats.json, expired-jobs.json) that Vite copies into
          # dist/data. A fresh shard checkout does NOT have them (gitignored) and
          # they are not regenerated per-shard (assemble runs only here in prep),
          # so they MUST travel in the snapshot — otherwise dist/data/jobs-stats.json
          # is missing on the IT shard (validate-critical-dist-pages fail) and the
          # SPA's /data/jobs.json 404s live. (fuel-prices/health-premiums/etc. are
          # CDN-managed by their own crons, not produced by the deploy.)
          tar -czf /tmp/prepared-snapshot.tgz \
            data \
            public/data \
            public/images/blog/thumbnails public/images/places/thumbnails 2>/dev/null || \
            tar -czf /tmp/prepared-snapshot.tgz data public/data
          ls -lh /tmp/prepared-snapshot.tgz
      - name: Upload prepared snapshot
        uses: actions/upload-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/prepared-snapshot.tgz
          retention-days: 1

  # ── Matrix build: one runner per locale. IT serves Pages + uploads the same
  # artifacts as the monolith; en/de/fr push to their frontaliere-<loc> shards.
  build-locale:
    needs: [matrix-setup, prep]
    runs-on: ubuntu-latest
    # No per-job concurrency: the workflow-level `pages-build-run` group already
    # guarantees a single build run at a time, so this run's 4 legs never race
    # another run's same-locale CDN / frontaliere-<loc> force-push target.
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      # Mirrors the monolith Build step env. Profile-bound knobs that map to
      # workflow_dispatch inputs irrelevant to the matrix path are dropped;
      # SEQUENTIAL_PROFILE is forced on (always sequential on the GH runner).
      BUILD_PROFILE: '1'
      ASSET_CDN: 'https://cdn.frontaliereticino.ch'
      POST_WALK_WORKERS: '2'
      SEQUENTIAL_PROFILE: '1'
      JOBS_SEO_PROFILE_PHASES: '1'
      WEEKLY_EMPLOYERS_PROFILE: ''
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
      RELATED_SEARCH_PREPASS_CONCURRENCY: '1'
      DEPLOY_CONTENT_MANIFEST: '1'
      # Per-locale emit filter + shared canonical build id (identical
      # dist/build-id.txt across all shards).
      BUILD_LOCALE: ${{ matrix.locale }}
      DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
    steps:
      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # Consume the shared atomic snapshot from the prep job instead of
      # re-running assemble/cleanup/mine/migrate/thumbnails per shard.
      - name: Download prepared snapshot
        uses: actions/download-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/snapshot
      - name: Restore prepared snapshot (data + thumbnails)
        run: |
          set -eo pipefail
          tar -xzf /tmp/snapshot/prepared-snapshot.tgz -C .
          test -f data/jobs.json && echo "✓ data/jobs.json restored ($(wc -c < data/jobs.json) bytes)" || { echo "✖ data/jobs.json missing after restore"; exit 1; }

      - name: Cache per-job OG images
        uses: actions/cache@v5
        with:
          path: .cache/og-jobs
          key: og-jobs-${{ runner.os }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}
          restore-keys: |
            og-jobs-${{ runner.os }}-

      # IT-only: restore + stash the previous deploy content manifest so the
      # IT shard's deploy-file-delta can diff in-place HTML changes (the IT
      # shard is the one that runs deploy-it-pages-prep.sh).
      - name: Restore previous deploy content manifest
        if: matrix.locale == 'it'
        uses: actions/cache@v5
        with:
          path: content-manifest.tsv
          key: deploy-content-manifest-${{ github.run_id }}
          restore-keys: |
            deploy-content-manifest-

      - name: Stash previous content manifest before build overwrites it
        if: matrix.locale == 'it'
        run: |
          if [ -f content-manifest.tsv ]; then
            mv content-manifest.tsv prev-content-manifest.tsv
            echo "[file-delta] previous manifest stashed ($(wc -l < prev-content-manifest.tsv) lines)"
          else
            echo "[file-delta] no previous manifest (first run after enabling / cache miss)"
          fi

      - name: Build (BUILD_LOCALE=${{ matrix.locale }})
        shell: bash
        run: |
          set -o pipefail
          npm run build:ci 2>&1 | tee /tmp/build.log

      - name: Verify critical dist pages before upload
        if: matrix.locale == 'it'
        run: node scripts/validate-critical-dist-pages.mjs

      - name: Verify build profile markers before upload
        if: matrix.locale == 'it'
        run: node scripts/validate-build-profile-markers.mjs /tmp/build.log

      # The in-build BUILD_LOCALE filter only gates WriteCollector writes;
      # direct-fs.writeFileSync emitters (redirect/bridge/weather/alias) still
      # write every locale. This removes the non-owned locale output the same
      # way deploy.yml copies only dist/<locale> to each shard repo.
      - name: Prune to locale shard
        run: node scripts/ci/prune-locale-shard.mjs dist

      - name: Validate locale shard output
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      # ── Ticino shard (keeps the IT apex under the 10 GB Pages cap) ──────────
      # Push dist/cerca-lavoro-ticino to its OWN Pages repo (frontaliere-ticino-it,
      # ~4 GB) and strip it from dist BEFORE deploy-it-pages-prep packs the
      # artifact, so the IT github-pages artifact drops below the
      # actions/deploy-pages 10 GB cap (the limit that failed the 2026-06-30
      # deploy). One repo PER LOCALE — a single combined Ticino repo would be
      # ~16 GB, over the cap itself. Runs BEFORE the IT offload (inside
      # deploy-it-pages-prep) so push-ticino-shard offloads its own staged copy
      # exactly once. Push gates on the deploy key; strip additionally gates on
      # TICINO_SHARD_LIVE + the push ok-marker (populate-then-strip) → a full no-op
      # until the owner provisions + flips the split.
      - name: Push Ticino shard (IT → frontaliere-ticino-it)
        if: matrix.locale == 'it'
        # A push failure must never block the apex publish: the strip then no-ops
        # (no ok-marker) so Ticino stays in the apex (>10 GB, deploy fails — but
        # never UNSERVED). The shard otherwise keeps serving its previous build.
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/lib/push-ticino-shard.sh it dist

      # Same-run tar artifact for post-deploy-validate-dist's Ticino rehydrate
      # fast path — mirrors "Pack locale shard dist (tar)" below. Previously
      # validate-dist rehydrated each Ticino subtree by `git clone --depth 1`
      # of the ~4 GB shard repo, one locale at a time (~12min wall on run
      # 28564001685). push-ticino-shard.sh already builds an offloaded staged
      # copy at $RUNNER_TEMP/ticino-src-it/dist/$sub (byte-identical to what it
      # just force-pushed) and now leaves it in place instead of deleting it —
      # pack that into one tar (same stack-overflow-avoidance reason as the
      # locale tar: upload-artifact enumerates every file, so a raw ~220k-file
      # tree would fail the same way). validate-dist still falls back to the
      # git clone when this artifact is missing/corrupt.
      - name: Pack Ticino shard dist (tar) for post-deploy validation
        if: matrix.locale == 'it' && vars.TICINO_SHARD_LIVE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          sub="cerca-lavoro-ticino"
          src="$RUNNER_TEMP/ticino-src-it/dist"
          if [ ! -d "$src/$sub" ]; then
            echo "no staged ticino-it subtree (push skipped/failed) — validate-dist will fall back to git clone"
            exit 0
          fi
          tar -C "$src" -cf "$RUNNER_TEMP/ticino-dist-it.tar" "$sub"
          ls -lh "$RUNNER_TEMP/ticino-dist-it.tar"
          rm -rf "$src"
      - name: Upload Ticino shard dist for post-deploy validation
        if: matrix.locale == 'it' && vars.TICINO_SHARD_LIVE == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ticino-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/ticino-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore

      - name: Strip Ticino subtree (IT)
        if: matrix.locale == 'it'
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
        run: bash scripts/lib/strip-ticino-subtree.sh it dist

      # ── IT shard → GitHub Pages + CDN (Pages-serving shard) ──────────────
      # deploy-it-pages-prep.sh runs the monolith's post-build bash IN ORDER:
      # SPA fallback, CDN push (exports CDN_BASE), offload, prune-cdn, drop
      # dist/assets, capture sitemaps, pack new sitemap urls, stage bundle,
      # pack tar (exports TAR_BYTES), audit bytes, file delta, refresh
      # url-first-seen. It does NOT commit dist-history (that stays YAML below).
      - name: Deploy prep (IT → Pages + CDN)
        if: matrix.locale == 'it'
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          # CDN publish target: 'pages' (legacy git force-push, default) or 'r2'
          # (Cloudflare R2 S3 sync — instant publish, kills the #2569 gate wait).
          # Flip by setting the repo variable CDN_TARGET=r2 (no code change). R2_*
          # creds are hydrated from Remote Config by the earlier load-rc-env step.
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
        run: bash scripts/lib/deploy-it-pages-prep.sh

      - name: Upload Pages artifact (compression-level 9)
        if: matrix.locale == 'it'
        id: upload-pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          # Level 9 = max deflate compression on the zip envelope. Pages
          # backend extracts the zip first, so our content gets the best
          # compression ratio in transit (~970 MB vs ~1.21 GB at level 6).
          compression-level: 9

      # Register this run's deploy metadata (sha, trigger, optional article_*
      # dispatch inputs) keyed by THIS build run's id. deploy-publish.yml reads
      # it back via `deploy-registry.mjs get --run-id=<this run>` (= the
      # workflow_run.id it is triggered by) to drive the LinkedIn/Reddit article
      # posting gate + live-meta wait. It lived in the deploy job before the
      # build/publish split — but only the BUILD run sees the workflow_dispatch
      # article inputs, so it is saved here (the workflow_run-triggered publish
      # run cannot read them).
      - name: Save deploy metadata to Firestore
        if: matrix.locale == 'it' && success()
        continue-on-error: true
        env:
          ARTICLE_ID: ${{ github.event.inputs.article_id }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          OG_TITLE: ${{ github.event.inputs.og_title }}
          OG_DESCRIPTION: ${{ github.event.inputs.og_description }}
          OG_IMAGE: ${{ github.event.inputs.og_image }}
          ARTICLE_CATEGORY: ${{ github.event.inputs.article_category }}
        run: |
          node scripts/deploy-registry.mjs save \
            --run-id="${{ github.run_id }}" \
            --sha="${{ github.sha }}" \
            --trigger="${{ github.event_name }}" \
            --article-id="${ARTICLE_ID}" \
            --article-url="${ARTICLE_URL}" \
            --og-title="${OG_TITLE}" \
            --og-description="${OG_DESCRIPTION}" \
            --og-image="${OG_IMAGE}" \
            --article-category="${ARTICLE_CATEGORY}"

      # Single small artifact (~tens of KB) consumed by validate-live for
      # IndexNow / Google Indexing diff. Lets validate-live skip the
      # 1.5 GB github-pages artifact entirely.
      - name: Upload sitemaps bundle artifact
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-${{ github.run_id }}
          path: /tmp/sitemaps-bundle/
          retention-days: 1
          if-no-files-found: ignore

      # Master source data for post-deploy validators (jobs.json +
      # jobs-crawler-summaries.json). Downloaded back into data/ by
      # post-deploy-validate-dist.
      - name: Upload master source data for post-deploy validators
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-master-${{ github.run_id }}
          path: |
            data/jobs.json
            data/jobs-crawler-summaries.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload pre-deploy snapshot for post-deploy validation
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-snapshot-${{ github.run_id }}
          path: /tmp/pre-deploy-sitemap-urls.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload write-collisions analysis
        if: always() && matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Detect previous-slug winners changes
        if: matrix.locale == 'it'
        id: winners_changed
        run: |
          if git diff --quiet -- data/previous-slug-winners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous-slug winners for post-deploy validation
        if: matrix.locale == 'it' && steps.winners_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winners-${{ github.run_id }}
          path: data/previous-slug-winners.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit dist-size-history row + url-first-seen updates
        if: matrix.locale == 'it'
        continue-on-error: true
        run: |
          if git diff --quiet -- data/dist-size-history.jsonl data/url-first-seen.json; then
            echo "[dist-history] no diff to commit"
            exit 0
          fi
          git config user.name "dist-history-bot"
          git config user.email "dist-history-bot@frontaliereticino.ch"
          # Wire up the custom merge driver declared in .gitattributes for
          # data/url-first-seen.json (`merge=json-first-seen`). Without this
          # config the attribute is inert and git falls back to a 3-way text
          # merge → the very CONFLICT that wedged this loop. The driver unions
          # the two URL→date maps keeping the earliest first-seen, so the
          # rebase below auto-resolves instead of aborting.
          git config merge.json-first-seen.driver \
            'node scripts/ci/merge-json-first-seen.mjs %O %A %B'
          git add data/dist-size-history.jsonl data/url-first-seen.json
          git commit -m "chore(dist-history): append run ${GITHUB_RUN_ID} (${GITHUB_SHA::8})"
          # The build job leaves dist/ and other generated files dirty
          # in the working tree. `git pull --rebase` refuses to run
          # while unstaged changes exist (`cannot pull with rebase: You
          # have unstaged changes`), so we ran the retry loop three
          # times for nothing on every deploy and the url-first-seen
          # update never landed on origin. `rebase.autoStash=true`
          # stashes those untracked/unstaged files before rebase and
          # pops them back after — purely scoped to this command, no
          # leftover stash state.
          # Bumped 3 → 5 attempts + geometric-ish backoff
          # (5/10/15/25/40 s) after annotation on run 26604491084 (and
          # every prior deploy): `[dist-history] push failed after 3
          # attempts`. Concurrent producers on main (crawlers +
          # thin-promotions + fuel + weather + post-merge auto-commits)
          # regularly out-race a 3×5 s window. The extended budget hits
          # a ~95 s total wait before giving up, which empirically
          # covers every observed conflict cluster on the main branch.
          # Both committed files now auto-resolve during the rebase via
          # .gitattributes merge drivers: `merge=union` for the JSONL append
          # log, and `merge=json-first-seen` (configured above) for the
          # url-first-seen.json map. Historically url-first-seen.json had NO
          # driver, so a concurrent producer touching nearby lines left the
          # tree mid-rebase; without aborting, every later attempt died on
          # "Pulling is not possible because you have unmerged files" and the
          # loop wedged until the job was canceled (run 27976954013, and again
          # run 28142157430 where all 5 attempts CONFLICTed). The `--abort`
          # below stays as a belt-and-braces recovery for any unexpected
          # mid-rebase state; it is a safe no-op when no rebase is in progress
          # (e.g. a plain push-rejected race).
          for i in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main \
                && git push origin HEAD:main; then
              echo "[dist-history] pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            case "$i" in
              1) sleep 5 ;;
              2) sleep 10 ;;
              3) sleep 15 ;;
              4) sleep 25 ;;
              5) sleep 40 ;;
            esac
          done
          echo "::warning::[dist-history] push failed after 5 attempts — url-first-seen.json will not be available to the next build's grace-window check"

      # ── NON-IT shards (en/de/fr) → frontaliere-<loc> shard repos ─────────
      # Ticino shard push FIRST (before the offload below) so push-ticino-shard
      # stages the RAW subtree (find-jobs-ticino / jobs-im-tessin /
      # trouver-emploi-tessin) and offloads its own copy exactly once; then strip
      # it so the locale shard drops below the 10 GB Pages cap. One repo PER LOCALE
      # (frontaliere-ticino-<loc>). Push gates on the deploy key; strip on
      # TICINO_SHARD_LIVE + the push ok-marker.
      - name: Push Ticino shard (non-IT → frontaliere-ticino-<loc>)
        if: matrix.locale != 'it'
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/lib/push-ticino-shard.sh "${{ matrix.locale }}" dist

      # Same-run tar artifact for post-deploy-validate-dist's Ticino rehydrate
      # fast path — see the IT leg's "Pack Ticino shard dist" step above for
      # the full rationale (git-clone fallback was ~12min wall across the 4
      # legs combined, run 28564001685).
      - name: Pack Ticino shard dist (tar) for post-deploy validation
        if: matrix.locale != 'it' && vars.TICINO_SHARD_LIVE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          case "${{ matrix.locale }}" in
            en) sub="en/find-jobs-ticino" ;;
            de) sub="de/jobs-im-tessin" ;;
            fr) sub="fr/trouver-emploi-tessin" ;;
            *) echo "::error::unsupported locale '${{ matrix.locale }}'"; exit 1 ;;
          esac
          src="$RUNNER_TEMP/ticino-src-${{ matrix.locale }}/dist"
          if [ ! -d "$src/$sub" ]; then
            echo "no staged ticino-${{ matrix.locale }} subtree (push skipped/failed) — validate-dist will fall back to git clone"
            exit 0
          fi
          tar -C "$src" -cf "$RUNNER_TEMP/ticino-dist-${{ matrix.locale }}.tar" "$sub"
          ls -lh "$RUNNER_TEMP/ticino-dist-${{ matrix.locale }}.tar"
          rm -rf "$src"
      - name: Upload Ticino shard dist for post-deploy validation
        if: matrix.locale != 'it' && vars.TICINO_SHARD_LIVE == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ticino-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ticino-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore

      - name: Strip Ticino subtree (non-IT)
        if: matrix.locale != 'it'
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
        run: bash scripts/lib/strip-ticino-subtree.sh "${{ matrix.locale }}" dist

      - name: Offload shard refs to CDN
        if: matrix.locale != 'it'
        continue-on-error: true
        # offload-generated-images-cdn.mjs rewrites HTML asset/data refs to the CDN
        # and injects window.__CDN_DATA_BASE__. It reads CDN_BASE from the env and
        # NO-OPs when unset. In the monolith a single offload runs after the CDN
        # push (which exports CDN_BASE) and rewrites every locale; here en/de/fr run
        # on separate runners that never push the CDN, so CDN_BASE must be supplied
        # explicitly (it's the fixed CDN-repo Pages origin, == ASSET_CDN). Without
        # it the shard HTML would keep same-origin /data refs → 404 live (the shard
        # repos don't host /data; it's CDN-offloaded). The actual CDN content is
        # pushed by the IT shard's deploy-it-pages-prep, which runs in parallel and
        # completes before validate-dist/validate-live.
        env:
          CDN_BASE: 'https://cdn.frontaliereticino.ch'
        run: node scripts/offload-generated-images-cdn.mjs

      # Same-run shard-dist artifact for post-deploy-validate-dist rehydrate.
      # validate-dist previously rehydrated each en/de/fr subtree by
      # `git clone --depth 1` of the shard repo (~14min wall, serial). The pruned
      # dist here — dist/<locale> + dist/<locale>.html — is byte-for-byte what
      # push-locale-shard.sh force-pushes next, so uploading it lets validate-dist
      # fetch it via `gh run download` (same-run, no API lag) instead of cloning.
      # Uploaded AFTER "Offload shard refs to CDN" so the HTML carries the same
      # CDN-rewritten /data refs the pushed shard serves (the clone-rehydrate it
      # replaces consumed post-offload content) — keeps the rehydrated dist
      # byte-identical to the git-clone path. validate-dist still falls back to the
      # git clone when this artifact is missing (e.g. a failed shard push/upload),
      # so a locale is NEVER silently un-validated. IT/main shard untouched
      # (`matrix.locale != 'it'`) → matrix-equivalence sha256 intact.
      #
      # PACK INTO ONE TAR FIRST. The previous version uploaded the raw
      # `dist/<loc>` tree (~410k loose files) directly. actions/upload-artifact@v7
      # enumerates every file before upload and STACK-OVERFLOWED on that count —
      # "##[error]Maximum call stack size exceeded" — so the upload silently
      # failed (continue-on-error → step shows green, no artifact produced). The
      # fast path was therefore DEAD on every deploy: validate-dist's rehydrate
      # always fell through to the ~675s git-clone fallback. Packing the subtree
      # into a single artifact.tar (exactly how the github-pages artifact is
      # shipped) makes upload enumerate ONE file → no stack overflow, and the
      # validate-dist side untars it straight into dist/ (no extra cp copy).
      - name: Pack locale shard dist (tar) for post-deploy validation
        if: matrix.locale != 'it'
        # continue-on-error for the same reason as the upload+push steps: a pack
        # failure must degrade to validate-dist's git-clone fallback, never flip
        # build-locale.result→failure (which would block the Pages publish).
        continue-on-error: true
        run: |
          set -euo pipefail
          members=( "${{ matrix.locale }}" )
          # dist/<loc>.html (= the /{loc} homepage) is normally present; guard so
          # a future strip that drops it can't make tar exit non-zero. NB: use a
          # full `if` — `[ -f ] && members+=()` would itself exit non-zero (and
          # abort the step under set -e) when the homepage is absent.
          if [ -f "dist/${{ matrix.locale }}.html" ]; then
            members+=( "${{ matrix.locale }}.html" )
          fi
          tar -C dist -cf "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar" "${members[@]}"
          ls -lh "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar"
      - name: Upload locale shard dist for post-deploy validation
        if: matrix.locale != 'it'
        # MUST stay continue-on-error: this is a non-essential speedup artifact.
        # deploy + validate-dist gate on `needs.build-locale.result == 'success'`
        # (in matrix mode `build` is skipped), and build-locale has
        # fail-fast: false, so a single leg failing here would make
        # build-locale.result == failure → deploy blocked = no Pages publish.
        # A transient artifact-service error or an empty dist/<loc> must instead
        # degrade gracefully: validate-dist's git-clone fallback then rehydrates
        # the locale (the documented resilience path). Mirrors the adjacent
        # `Push locale shard` step, which is continue-on-error for the same reason.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: locale-dist-${{ matrix.locale }}-${{ github.run_id }}
          # Single tar (see "Pack locale shard dist" above) — NOT the ~410k-file
          # tree, which overflows the action's file enumerator.
          path: ${{ runner.temp }}/locale-dist-${{ matrix.locale }}.tar
          # compression-level 1: the tar is mostly HTML (very compressible) and
          # this step gates the Pages publish, so favour a fast upload over a few
          # extra MB. validate-dist downloads it over GitHub's internal network.
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      # ── Cross-shard CDN-push ordering guard (#2569 atomicity) ────────────
      # The non-IT shard HTML was rewritten to reference cdn.frontaliereticino.ch
      # for /data + /assets (the "Offload shard refs to CDN" step above). The IT
      # shard pushes THIS build's CDN payload (data/assets) from a SEPARATE
      # parallel matrix runner with no ordering vs this leg. Publishing this
      # shard BEFORE the IT CDN push lands this build's payload would put the
      # live locale ahead of the CDN (refs 404 / serve a prior build's data).
      # deploy-it-pages-prep.sh stamps DEPLOY_BUILD_ID into the CDN's
      # cdn-build-id.txt in the SAME force-push as the payload, so this gate —
      # polling that marker until it equals THIS build's id — only unblocks once
      # the IT CDN push has atomically published this build. continue-on-error so
      # a timeout never flips build-locale.result→failure (that would block the
      # whole Pages publish); instead the gate's outcome gates the publish step
      # below, so a stuck/failed IT CDN push leaves this shard UNPUBLISHED
      # (stale, surfaced by the #2658 path) rather than published-ahead.
      - name: Wait for IT CDN push (cross-shard ordering guard)
        id: cdn-gate
        if: matrix.locale != 'it'
        continue-on-error: true
        env:
          DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
          # The non-IT gate must out-wait TWO serial delays before the marker
          # turns: (1) the IT leg reaching its CDN force-push, and (2) — the real
          # bottleneck — GitHub Pages PUBLISHING that push on the frontaliere-cdn
          # repo. The CDN payload is now ~1.27 GB (all ACTIVE content: 11.6k stable
          # JS/CSS chunks + offloaded /data JSON + og images; the assets/ janitor
          # finds 0 orphans → nothing to prune), OVER the Pages ~1 GB soft limit, so
          # the Pages publish latency has ballooned: the git push lands fast but the
          # live marker lags it by ~22min while Pages rebuilds the oversized site.
          # #2872 measured: gate started 10:36:28, IT push succeeded 10:45:38, marker
          # went live 11:07:42 — a 31min gate-start→publish window. The prior 1800s
          # (30min) budget expired 11:06:34, just 68s SHORT of the marker, timing out
          # ALL THREE non-IT shards (en/de/fr) into stale-live. This was NOT a
          # transient/expired-key failure (the earlier theory in #2786/#2806/#2807):
          # it is structural Pages-publish latency on the >1 GB CDN. 2700s (45min)
          # restores margin over the measured 31min; the gate still exits the instant
          # the marker matches, so the budget is a ceiling, not a fixed wait.
          # STOPGAP: as the CDN keeps growing, publish latency grows with it — the
          # durable fix is to get the CDN off GitHub Pages' 1 GB-limited, slow-publish
          # path (e.g. Cloudflare R2: no size limit, instant PUT, marker visible in
          # seconds) or split it back under 1 GB. Tracked for #2872 follow-up.
          CDN_WAIT_TIMEOUT_S: 2700
          # When CDN_TARGET=r2 the marker is published to R2 (no-store); the gate
          # then cache-busts each poll so it sees R2's strong read-after-write id
          # immediately — the 2700s budget becomes a near-no-op (match in seconds).
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
        run: bash scripts/lib/wait-cdn-build-id.sh "${DEPLOY_BUILD_ID}"

      - name: Push locale shard
        id: push-shard
        # Only publish once the ordering guard confirmed the IT CDN push landed
        # THIS build (steps.cdn-gate.outcome == 'success'). On a gate timeout the
        # shard is skipped (NOT pushed ahead of the CDN); the stale-shard
        # surfacing step below fires on skip|failure so the unpublished locale is
        # never shipped silently. (cdn-gate is itself a no-op exit-0 when
        # DEPLOY_BUILD_ID is unset, so non-matrix/local paths are unaffected.)
        if: matrix.locale != 'it' && steps.cdn-gate.outcome == 'success'
        # Stays continue-on-error (transient shard-repo/network errors must NOT
        # block the whole Pages publish — build-locale has fail-fast:false, a
        # hard failure here would flip build-locale.result→failure→no publish).
        # The PREVIOUS gap (#2658): a failed push then shipped a STALE live
        # locale SILENTLY (deploy green, no signal). The surfacing step below
        # closes that — keeps the resilience, removes the silence.
        continue-on-error: true
        env:
          SHARD_EN_DEPLOY_KEY: ${{ secrets.SHARD_EN_DEPLOY_KEY }}
          SHARD_DE_DEPLOY_KEY: ${{ secrets.SHARD_DE_DEPLOY_KEY }}
          SHARD_FR_DEPLOY_KEY: ${{ secrets.SHARD_FR_DEPLOY_KEY }}
        run: bash scripts/lib/push-locale-shard.sh ${{ matrix.locale }} dist

      - name: Surface a stale-locale shard push failure (#2658)
        # A push failure leaves the live ${{ matrix.locale }} shard serving STALE
        # content while the deploy still goes green. Don't fail the deploy (the
        # continue-on-error resilience is deliberate) — but make it LOUD: warning
        # annotation + a deduped tracking issue so the stale locale is never
        # shipped silently. Self-resolves on the next green push (reopen-within).
        # Also fires when the #2569 CDN ordering guard timed out (cdn-gate
        # failure → push-shard SKIPPED): the shard is intentionally NOT published
        # ahead of the IT CDN push, so the live locale stays stale and must be
        # surfaced the same way.
        if: matrix.locale != 'it' && (steps.push-shard.outcome == 'failure' || steps.cdn-gate.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning title=Stale locale shard::Push of the ${{ matrix.locale }} shard did not publish (push failure, or the #2569 CDN ordering guard timed out waiting for the IT CDN push) — the live ${{ matrix.locale }} pages serve STALE content until the next successful deploy. Deploy stays green by design (transient-tolerant); investigate the shard repo / deploy key / IT CDN push."
          node scripts/lib/github-issue-creator.mjs \
            --title "Deploy: ${{ matrix.locale }} locale shard push failed (stale live locale)" \
            --description "## Push locale shard fallito — locale live STALE
          Il push dello shard \`${{ matrix.locale }}\` è fallito: le pagine live di quel locale servono contenuto **stale** finché un deploy successivo non ripush con successo. Il deploy resta verde per design (resilienza a errori transienti dello shard-repo), ma la mancata propagazione è ora segnalata.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Locale:** ${{ matrix.locale }}
          **Branch:** ${{ github.ref_name }}
          Probabili cause: errore transiente di rete/artifact-service, conflitto di push, deploy key shard scaduta." \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve stale-locale shard issue on successful push (#2658)
        # Mirror of the surfacing step: a green push closes the canonical
        # stale-locale issue if open (close↔reopen on ONE issue, no per-run storm).
        if: matrix.locale != 'it' && steps.push-shard.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "Deploy: ${{ matrix.locale }} locale shard push failed (stale live locale)" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure to GitHub Issues (build)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --description "## Build fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve build GitHub Issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build succeeded → close the canonical "CI Failure (build)" issue if
          # open. Paired with --reopen-within-hours 6 on the reporter above so the
          # close↔reopen cycle stays on ONE canonical issue (no per-run storm,
          # no stale issue while green). Idempotent no-op when nothing is open.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
