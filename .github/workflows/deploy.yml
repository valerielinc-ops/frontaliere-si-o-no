      - name: Append build memory history row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HISTORY_STAGE_DIR: ${{ runner.temp }}/build-history-rows
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          ROW_BREACH: ${{ steps.memguard.outputs.breach }}
          ROW_PEAK_ANON: ${{ steps.memguard.outputs.peak_anon_mb }}
          ROW_PEAK_RSS: ${{ steps.memguard.outputs.peak_rss_mb }}
          ROW_AVAIL: ${{ steps.memguard.outputs.min_host_avail_mb }}
          ROW_HEADROOM: ${{ steps.memguard.outputs.min_host_headroom_mb }}
          ROW_SWAP: ${{ steps.memguard.outputs.min_swap_free_mb }}
          ROW_WALL: ${{ steps.build_step.outputs.wall_seconds }}
        run: |
          set -o pipefail
          if [ -z "$ROW_PEAK_ANON" ]; then
            echo "[build-history] nessun referto memguard (host-kill o guard mai armato), niente da appendere"
            exit 0
          fi
          # Lo staging sta in uno script condiviso dai tre produttori di righe
          # (memoria, "Append post-build phase timings row" #7301, manifest
          # shadow): la validazione della riga ha un solo posto in cui cambiare.
          node -e '
            const num = (v) => (v === undefined || v === "" ? null : Number(v));
            const row = {
              ts: new Date().toISOString(),
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              breach: process.env.ROW_BREACH || null,
              peak_anon_mb: num(process.env.ROW_PEAK_ANON),
              peak_rss_mb: num(process.env.ROW_PEAK_RSS),
              min_host_avail_mb: num(process.env.ROW_AVAIL),
              min_host_headroom_mb: num(process.env.ROW_HEADROOM),
              min_swap_free_mb: num(process.env.ROW_SWAP),
              wall_seconds: num(process.env.ROW_WALL),
            };
            process.stdout.write(JSON.stringify(row));
          ' | HISTORY_LABEL=build-history \
              bash scripts/lib/append-build-history-row.sh

      # Read-only follow-up for PR #17670: the first comparable post-merge
      # deploy must expose the full-corpus memory/duration result instead of
      # leaving the archive-sweep optimization with only a prose revert plan.
      # The fixed reference is the pre-change peak anon baseline from run
      # 42466783158 (20.002 MB). This observer never changes the memory gate or
      # the publish path; missing outputs stay explicitly non-comparable.
      - name: Observe expired archive memory delta
        id: expired_archive_memory_delta
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPIRED_ARCHIVE_BASELINE_PEAK_ANON_MB: '20002'
          EXPIRED_ARCHIVE_BREACH: ${{ steps.memguard.outputs.breach }}
          EXPIRED_ARCHIVE_PEAK_ANON_MB: ${{ steps.memguard.outputs.peak_anon_mb }}
          EXPIRED_ARCHIVE_PEAK_RSS_MB: ${{ steps.memguard.outputs.peak_rss_mb }}
          EXPIRED_ARCHIVE_WALL_SECONDS: ${{ steps.build_step.outputs.wall_seconds }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const numericMetric = (value) => {
            const text = String(value ?? '').trim();
            return /^\d+$/.test(text) ? Number(text) : null;
          };

          const markdownCell = (value) => String(value ?? 'unknown').replaceAll('|', '\\|');

          function expiredArchiveMemoryDeltaObserved() {
            const baseline = numericMetric(process.env.EXPIRED_ARCHIVE_BASELINE_PEAK_ANON_MB);
            const anon = numericMetric(process.env.EXPIRED_ARCHIVE_PEAK_ANON_MB);
            const rss = numericMetric(process.env.EXPIRED_ARCHIVE_PEAK_RSS_MB);
            const wall = numericMetric(process.env.EXPIRED_ARCHIVE_WALL_SECONDS);
            const breach = String(process.env.EXPIRED_ARCHIVE_BREACH ?? '').trim();
            let anonDelta = null;
            let revertTrigger = 'not-comparable: complete post-merge measurement unavailable';

            if (anon !== null && baseline !== null) {
              anonDelta = anon - baseline;
              if (breach) {
                revertTrigger = `revert: dynamic memory threshold breached (${breach})`;
              } else if (anon >= baseline) {
                revertTrigger = 'revert: peak_anon_mb did not fall below 20.002 MB baseline';
              } else {
                revertTrigger = 'not-triggered: peak_anon_mb fell below 20.002 MB baseline';
              }
            } else if (breach) {
              revertTrigger = `revert: dynamic memory threshold breached (${breach}); anon peak unavailable`;
            }

            const summary = [
              '### Expired archive memory delta (advisory)',
              '',
              'The first complete post-merge deploy on the same corpus is the comparison point for PR #17670.',
              '',
              '| metric | observed | reference | delta |',
              '| --- | ---: | ---: | ---: |',
              `| peak_anon_mb | \`${markdownCell(anon)}\` | \`${markdownCell(baseline)}\` (20.002 MB) | \`${markdownCell(anonDelta)}\` |`,
              `| peak_rss_mb | \`${markdownCell(rss)}\` | no fixed pre-merge value | n/a |`,
              `| wall_seconds | \`${markdownCell(wall)}\` | no fixed pre-merge value | n/a |`,
              `| dynamic threshold breach | \`${markdownCell(breach || 'none')}\` | empty | n/a |`,
              `| revert trigger | \`${markdownCell(revertTrigger)}\` | see PR #17670 | n/a |`,
              '',
            ].join('\n');

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) fs.appendFileSync(summaryPath, summary);
            else process.stdout.write(summary);
            console.log(
              `[expired-archive-memory] peak_anon_mb=${anon ?? 'unknown'} peak_rss_mb=${rss ?? 'unknown'} ` +
              `wall_seconds=${wall ?? 'unknown'} delta_anon_mb=${anonDelta ?? 'unknown'} trigger=${revertTrigger}`,
            );
          }

          expiredArchiveMemoryDeltaObserved();
          NODE

      # ── Section shards (keep the IT apex under the 10 GB Pages cap) ────────
      # Push each oversized job-board section (ticino/svizzera/zurigo) to its
      # OWN per-locale Pages repo (frontaliere-<section>-it, several GB each)
      # and strip it from dist BEFORE deploy-it-pages-prep packs the artifact,
      # so the IT github-pages artifact drops below the actions/deploy-pages
      # 10 GB cap. One repo PER (section, locale) — a single combined repo per
      # section would itself exceed the cap. Runs BEFORE the IT offload
      # (inside deploy-it-pages-prep) so each push-section-shard.sh invocation
      # offloads its own staged copy exactly once. Push gates on the deploy
      # key (with the Remote-Config PAT as a safety-net when a key is missing);
      # strip additionally gates on <SECTION>_SHARD_LIVE + the push ok-marker
      # (populate-then-strip) → a full no-op until the owner flips a given
      # section's split. See
      # docs/TICINO-SHARD-RUNBOOK.md for the mechanism (written for the first
      # section, ticino; svizzera/zurigo reuse it via
      # scripts/lib/section-shard-slugs.json).
      - name: Upload master source data for post-deploy validators
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-master-${{ github.run_id }}
          path: |
            data/jobs.json
            data/jobs-crawler-summaries.json
          # The weekly full audit selects this source artifact by run id.
          retention-days: 8
          if-no-files-found: error

      - name: Upload write-collisions analysis
        id: write_collisions_analysis
        if: always() && matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Retry write-collisions analysis upload
        if: always() && matrix.locale == 'it' && steps.write_collisions_analysis.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true

      - name: Detect previous-slug winners changes
        if: matrix.locale == 'it'
        id: winners_changed
        run: |
          if git diff --quiet -- data/previous-slug-winners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous-slug winners for post-deploy validation
        if: matrix.locale == 'it' && steps.winners_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winners-${{ github.run_id }}
          path: data/previous-slug-winners.json
          retention-days: 7
          if-no-files-found: ignore

      # The two accumulators go to the build-history-commit job as an
      # artifact; its commit + push to main (5 attempts with rebase, ~6 min on
      # deploy 39917633944, mostly a fetch + autostash of this big dirty
      # checkout) no longer sits between the IT build and `rearm`, i.e. on the
      # critical path to the publish. The commit itself is unchanged: same two
      # paths, same accumulator assertions, same merge drivers, same helper.
      - name: Report failure to GitHub Issues (build)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound as env, not interpolated into the script text (repo rule:
          # inputs reach the shell as DATA). The TITLE stays the literal
          # "CI Failure (build): <workflow>" inside the script — the 4-locale
          # matrix collapsing onto ONE canonical issue is load-bearing (#5121).
          RUN_ID: ${{ github.run_id }}
          JOB_KEY: ${{ github.job }}
          LOCALE: ${{ matrix.locale }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # #5414 Parte B: stesso titolo/dedup di prima, description arricchita
          # con job+locale e primo step fallito (via jobs API — il log del job
          # ancora in corso non è scaricabile, quindi l'estratto arriva solo
          # dal diag file /tmp/build-failure-diag.txt se uno step lo scrive).
          node scripts/ci/report-validate-dist-failure.mjs --mode report --scope build

      # ── Il gate di memoria della build (#5369 §7) ────────────────────────
      #
      # Titolo DEDICATO e non `CI Failure (build)`: sono due guasti diversi e
      # collassarli sulla stessa issue perderebbe l'unica cosa che serve
      # sapere, cioe' che a rompere e' stata la crescita del picco e non un
      # test. La condizione su `steps.memguard.outputs.breach` e' cio' che
      # tiene il titolo onesto: senza, ogni build rossa aprirebbe questa issue.
      #
      # CHI CHIUDE: lo step gemello "Resolve build memory issue on green" del
      # job `resolve-build-alarm` in fondo al file, con `mode: resolve` e il
      # TITOLO IDENTICO — e' il modello `sibling-resolve-step`. Sta li' e non in
      # questa gamba perche' il titolo e' lo stesso per le quattro gambe: uno
      # step `if: success()` di una gamba verde chiudeva la issue aperta da una
      # gamba rossa della stessa run. Il reconciler centrale NON copre questo titolo
      # (non matcha il suo `TITLE_RE`, `Workflow|Crawler|CI Failure: `), quindi
      # quella meta' locale e' l'unica che c'e'. Cambiare il titolo qui senza
      # cambiarlo la' lascia la issue aperta per sempre: e' il guasto di #5470,
      # e `tests/build-memory-guard.test.ts` confronta le due occorrenze.
      - name: Report build memory breach to GitHub Issues
        if: failure() && steps.memguard.outputs.breach != ''
        uses: ./.github/actions/report-failure
        with:
          title: 'il picco di memoria della build risale sopra la soglia'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '1'
          labels: Bug
          entity: ${{ matrix.locale }}
          diag-file: /tmp/build-failure-diag.txt
          context: |
            - **Soglia sfondata:** `${{ steps.memguard.outputs.breach }}`
            - **Picco del footprint anonimo (RSS+VmSwap):** ${{ steps.memguard.outputs.peak_anon_mb }} MB
            - **Picco RSS del processo di build:** ${{ steps.memguard.outputs.peak_rss_mb }} MB
            - **MemAvailable minimo dell'host:** ${{ steps.memguard.outputs.min_host_avail_mb }} MB
            - **Headroom anonimo minimo dell'host** (MemAvailable + evizione
              accreditata, è la quantità che il pavimento host confronta):
              ${{ steps.memguard.outputs.min_host_headroom_mb }} MB
            - **SwapFree minimo dell'host:** ${{ steps.memguard.outputs.min_swap_free_mb }} MB
            - Il build è stato fermato di proposito **prima** che l'host lo uccidesse.
              Un kill dell'host lascia lo step su `in_progress` senza exit code, e in
              quello stato nessuno step `if: failure()` viene valutato — è così che il
              leg IT del run 31672320271 è sparito senza aprire nulla, bloccando gli
              shard de/fr/en (#5773 / #5772 / #5771).
            - Profilo di riferimento (run 31747139648, 2026-08-13, verde 4/4): ~7,7 GB di
              RSS e ~4,1 GB di heap **vivo** sono già residenti quando parte il primo
              plugin di `closeBundle`; altri +4,3 GB di heap vivo li aggiunge una fase
              sola, fra le milestone `[mem] jobsSeoPages: collector created` e
              `[mem] jobsSeoPages: after company-landing`. Grep sul log del run:
              `[mem] `, `[profile-mem] `, `[hostmem] `.
            - Le soglie e la loro derivazione stanno in
              `build-plugins/shared/buildMemoryGuard.ts`. **Non alzarle**: il tetto è
              una frazione della capacità anonima dell'host (RAM+swap, credito cappato)
              confrontata col footprint RSS+VmSwap del processo, il pavimento host
              guarda l'headroom anonimo (MemAvailable + evizione accreditata, non la
              sola RAM libera — #5899) e quello su SwapFree presidia lo spazio di
              evizione: insieme sono l'ultima linea prima del kill opaco. Se questa
              issue è aperta, la strada è ridurre la retention (vedi i checkpoint
              `[mem]` di jobsSeoPagesPlugin), non allargare le soglie.

      # ── La misura full-corpus del build jobs SEO (#9618) ─────────────────
      #
      # L'allarme dello step "Validate full-corpus jobs SEO evidence", che NON
      # blocca il deploy (il perche' e' nel commento di quello step). Senza
      # questa coppia il `continue-on-error` renderebbe muto un FAIL: il run
      # resterebbe verde e la misura incompleta non la vedrebbe nessuno.
      #
      # `steps.build_step.outcome == 'success'` tiene il titolo onesto: su una
      # build rossa i marker mancano per forza, e quel guasto lo apre gia'
      # "CI Failure (build)". Qui arriva solo il caso "sito pubblicato, misura
      # non verificabile".
      #
      # CHI CHIUDE: lo step gemello qui sotto, col TITOLO IDENTICO, appena una
      # run IT ha la misura completa (`sibling-resolve-step`; il test
      # tests/failure-issue-closers.test.ts verifica l'accoppiamento).
      #
      # `continue-on-error` anche qui: l'action esce 0 per contratto, ma se il
      # reporting stesso si rompesse (API, checkout parziale) il job diventerebbe
      # rosso e `deploy-publish.yml` non pubblicherebbe, cioe' il blocco che lo
      # step di misura ha appena smesso di causare.
      - name: Report jobs SEO full-corpus evidence gap to GitHub Issues
        if: always() && matrix.locale == 'it' && steps.build_step.outcome == 'success' && steps.jobs_seo_evidence.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          title: 'la misura full-corpus del build jobs SEO non è verificabile'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '3'
          labels: Bug
          entity: ${{ matrix.locale }}
          diag-file: ${{ runner.temp }}/jobs-seo-evidence-diag.txt
          context: |
            - **Il deploy NON è stato bloccato**: la build è verde e il sito è
              proseguito verso la pubblicazione. A fallire è la verifica della
              MISURA (`scripts/ci/report-jobs-seo-build-metrics.mjs
              --require-full-corpus`), cioè i marker `[mem] jobsSeoPages` e
              `[jobs-seo-profile]` che #9618 usa come prova.
            - L'estratto qui sotto elenca le invarianti fallite. Il summary del
              job e l'artifact `jobs-seo-full-corpus-markers-<run_id>` hanno i
              marker completi.
            - **Prima di correggere il produttore**, chiediti se è l'invariante
              a essere sbagliata: #9754 pretendeva `previousSlugEntries > 0`,
              che in produzione vale 0 per scelta (#9773). Riproduci in locale
              con `node scripts/ci/report-jobs-seo-build-metrics.mjs
              <jobs-seo-markers.txt> --require-full-corpus`.
            - Se la produzione ha ragione, aggiungi l'artifact di questa run a
              `tests/fixtures/jobs-seo-full-corpus-markers/` insieme alla
              correzione del validatore: è il replay che impedisce all'errore
              di tornare.

      - name: Resolve jobs SEO full-corpus evidence issue on pass
        if: always() && matrix.locale == 'it' && steps.jobs_seo_evidence.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          mode: resolve
          title: 'la misura full-corpus del build jobs SEO non è verificabile'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # La chiusura di "CI Failure (build)" NON sta più qui: la fa il job
      # `resolve-build-alarm` in fondo al file, solo quando TUTTE le gambe
      # della run sono verdi. Uno step `if: success()` di una gamba vede solo la
      # propria gamba: il 2026-09-25 la gamba fr della run 36077807468 ha chiuso
      # #9179 alle 04:53 mentre la gamba it della STESSA run era rossa.

      # Marker del profilo + wall-time delle fasi POST-build del leg (#7301).
      # I marker finiscono nella stessa riga bounded del JSONL per permettere
      # confronti tra run con jq, invece di lasciare il dato solo nel log.
      # Queste metriche non possono essere chiavi della riga di
      # "Append build memory history row": quello step sta
      # a meta' job, e push shard + pack tar finiscono molto dopo — sul run
      # 33833300860 valgono 23 min + 5 min dei 130 min totali del leg IT. Senza
      # questa riga l'unica fonte su quelle fasi e' l'API Actions run-per-run,
      # soggetta a retention e ai run cancellati, quindi nessuna ottimizzazione
      # del leg IT ha una misura prima/dopo verificabile dal repo.
      #
      # In fondo al job, non subito dopo il tar: e' strumentazione. Come la
      # riga di memoria, va solo in staging; il commit lo fa
      # build-history-commit, fuori dal percorso critico della gamba (#9247).
      #
      # Riga SEPARATA nello stesso JSONL, non uno schema unico: le due righe
      # hanno produttori e momenti diversi, e le 294 righe gia' committate non
      # avranno mai queste chiavi. Chi legge il file discrimina sulla presenza
      # della chiave. `profile` e `phases` sono limitati a 25 elementi ciascuno
      # dal parser; i campi post-build restano per compatibilita' con jq.
      - name: Append post-build phase timings row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HISTORY_STAGE_DIR: ${{ runner.temp }}/build-history-rows
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          ROW_BUILD_STATUS: ${{ job.status }}
          # All locale publishing tails now run in deploy-publish.yml.
          ROW_PUSH_SHARDS_IT: ''
          ROW_PACK_TAR_IT: ''
          ROW_PACK_LOCALE_SOURCE: ${{ steps.pack-locale-source.outputs.wall_seconds }}
        run: |
          set -o pipefail
          marker_json='{"profile":[],"phases":[]}'
          if [ -f /tmp/build.log ]; then
            marker_json="$(node scripts/ci/parse-build-profile-markers.mjs /tmp/build.log)"
          fi
          ROW_MARKERS="$marker_json" node -e '
            const pick = (...names) => {
              const v = names.map((n) => process.env[n]).find((x) => x);
              return v === undefined ? null : Number(v);
            };
            const postBuild = {
              push_shards_seconds: pick("ROW_PUSH_SHARDS_IT"),
              pack_tar_seconds: pick("ROW_PACK_TAR_IT"),
              pack_locale_source_seconds: pick("ROW_PACK_LOCALE_SOURCE"),
            };
            const markers = JSON.parse(process.env.ROW_MARKERS || "{}");
            const profile = Array.isArray(markers.profile) ? markers.profile : [];
            const phases = Array.isArray(markers.phases) ? markers.phases : [];
            // Tutte assenti = nessuna fase post-build ha girato su questo leg
            // e nessun marker nel log (shard non provisionati, o job morto
            // prima). Riga vuota = rumore nella storia: meglio niente.
            if (Object.values(postBuild).every((v) => v === null)
                && profile.length === 0 && phases.length === 0) process.exit(0);
            process.stdout.write(JSON.stringify({
              ts: new Date().toISOString(),
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              build_status: process.env.ROW_BUILD_STATUS || null,
              kind: "build-profile",
              profile,
              phases,
              ...postBuild,
            }));
          ' | HISTORY_LABEL=build-history-profile \
              bash scripts/lib/append-build-history-row.sh

      - name: Append incremental manifest history row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HISTORY_STAGE_DIR: ${{ runner.temp }}/build-history-rows
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          MANIFEST_PREVIOUS: .cache/incremental-manifest-prev/${{ matrix.locale }}.jsonl
          MANIFEST_CURRENT: .cache/incremental-manifest/${{ matrix.locale }}.jsonl
        run: |
          set -o pipefail
          if [ ! -f "$MANIFEST_CURRENT" ]; then
            echo "[build-history-manifest] current manifest missing; niente da appendere"
            exit 0
          fi
          ROW_PREVIOUS="$MANIFEST_PREVIOUS" ROW_CURRENT="$MANIFEST_CURRENT" node --input-type=module -e '
            import fs from "node:fs";
            import { PAGE_KINDS } from "./build-plugins/shared/incrementalManifest.mjs";
            import { loadManifest } from "./scripts/ci/incremental-manifest-report.mjs";

            const previousPath = process.env.ROW_PREVIOUS;
            const currentPath = process.env.ROW_CURRENT;
            const current = await loadManifest(currentPath);
            const previous = fs.existsSync(previousPath) ? await loadManifest(previousPath) : null;
            const byKind = Object.fromEntries(PAGE_KINDS.map((kind) => [kind, {
              current: current.data.counts.byKind[kind] ?? 0,
              hits: previous ? 0 : null,
              misses: previous ? 0 : null,
              added: previous ? 0 : null,
              removed: previous ? 0 : null,
            }]));
            const totals = {
              current: current.data.counts.total,
              previous: previous ? previous.data.counts.total : null,
              hits: previous ? 0 : null,
              misses: previous ? 0 : null,
              added: previous ? 0 : null,
              removed: previous ? 0 : null,
            };

            if (previous) {
              for (const [pagePath, currentEntry] of current.entries) {
                const stats = byKind[currentEntry.kind];
                const previousEntry = previous.entries.get(pagePath);
                if (!previousEntry) {
                  stats.added += 1;
                  totals.added += 1;
                } else if (previousEntry.inputHash === currentEntry.inputHash) {
                  stats.hits += 1;
                  totals.hits += 1;
                } else {
                  stats.misses += 1;
                  totals.misses += 1;
                }
              }
              for (const [pagePath, previousEntry] of previous.entries) {
                if (current.entries.has(pagePath)) continue;
                byKind[previousEntry.kind].removed += 1;
                totals.removed += 1;
              }
            }

            process.stdout.write(JSON.stringify({
              ts: new Date().toISOString(),
              kind: "incremental-manifest",
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              previous: previous ? {
                total: previous.data.counts.total,
                by_kind: previous.data.counts.byKind,
              } : null,
              current: {
                total: current.data.counts.total,
                by_kind: current.data.counts.byKind,
              },
              totals,
              by_kind: byKind,
              file_size_bytes: fs.statSync(currentPath).size,
            }));
          ' | HISTORY_LABEL=build-history-manifest \
              bash scripts/lib/append-build-history-row.sh

      # Le righe in staging dei tre produttori sopra lasciano la gamba come
      # artifact; le committa UNA volta per run il job build-history-commit
      # (#9247). Il nome porta run_attempt: il rerun di una gamba non collide
      # con l'artifact del tentativo precedente, e le righe gia' committate
      # le scarta il dedup del job di commit.
      - name: Upload build-history rows
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-history-rows-${{ matrix.locale }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-history-rows/
          if-no-files-found: ignore
          retention-days: 3

      # Non-IT page manifests bind to their source shard artifact here. The IT
      # page manifest is bound in deploy-publish after the Pages, sitemap, and
      # post-push section artifacts have their final digests.
      - name: Bind sitemap page manifest to uploaded artifact digests
        if: >-
          always() &&
          matrix.locale != 'it' &&
          steps.validate-owned-sitemap-pages.outcome == 'success' &&
          steps.upload-locale-source.outcome == 'success'
        id: bind-sitemap-page-manifest
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_ARTIFACT_NAME: ${{ format('locale-shard-source-{0}-{1}', matrix.locale, github.run_id) }}
          BASE_ARTIFACT_DIGEST: ${{ steps.upload-locale-source.outputs.artifact-digest }}
          SITEMAPS_ARTIFACT_NAME: ''
          SITEMAPS_ARTIFACT_DIGEST: ''
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/locale-sitemap-manifest-${BUILD_LOCALE}.json"
          output="$RUNNER_TEMP/sitemap-page-manifest-${BUILD_LOCALE}.json"
          node scripts/ci/shard-content-manifest.mjs bind-page \
            --input "$input" \
            --out "$output" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --artifact-run-id "$SOURCE_RUN_ID" \
            --base-artifact-name "$BASE_ARTIFACT_NAME" \
            --base-artifact-digest "$BASE_ARTIFACT_DIGEST" \
            --sitemaps-artifact-name "$SITEMAPS_ARTIFACT_NAME" \
            --sitemaps-artifact-digest "$SITEMAPS_ARTIFACT_DIGEST" \
            --manifest-artifact-name "sitemap-page-manifest-${BUILD_LOCALE}-${SOURCE_RUN_ID}"

      - name: Upload sitemap page manifest for publisher gate
        if: always() && steps.bind-sitemap-page-manifest.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sitemap-page-manifest-${{ matrix.locale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sitemap-page-manifest-${{ matrix.locale }}.json
          retention-days: 8
          if-no-files-found: error

      - name: Write locale publish provenance
        if: always()
        id: write-locale-provenance
        env:
          PROVENANCE_BUILD_OUTCOME: ${{ steps.build_step.outcome }}
          PROVENANCE_VALIDATE_OUTCOME: ${{ steps.validate-locale-shard.outcome }}
          PROVENANCE_IT_PREP_OUTCOME: deferred
          PROVENANCE_PAGES_ARTIFACT_OUTCOME: deferred
          PROVENANCE_SOURCE_ARTIFACT_OUTCOME: ${{ matrix.locale == 'it' && (steps.package-it-publish-source.outcome == 'success' && steps.upload-it-publish-root.outcome == 'success' && steps.upload-it-shard-source-plan.outcome == 'success' && steps.upload-it-shard-source-zurigo.outcome == 'success' && steps.upload-it-shard-source-svizzera.outcome == 'success' && steps.upload-it-shard-source-small-1.outcome == 'success' && steps.upload-it-shard-source-small-2.outcome == 'success' && steps.upload-it-shard-source-small-3.outcome == 'success' && steps.upload-it-shard-source-small-4.outcome == 'success' && 'success' || 'failure') || (steps.pack-locale-source.outcome == 'success' && steps.upload-locale-source.outcome == 'success' && 'success' || 'failure') }}
          PROVENANCE_OFFLOAD_OUTCOME: deferred
          PROVENANCE_SECTION_PUSH_OUTCOME: deferred
          PROVENANCE_CDN_GATE_OUTCOME: deferred
          PROVENANCE_LOCALE_PUSH_OUTCOME: deferred
          PROVENANCE_LOCALE_PACK_OUTCOME: deferred
          PROVENANCE_LOCALE_ARTIFACT_OUTCOME: deferred
          # Version of the build -> publisher artifact contract this build
          # packs against. deploy-publish.yml runs its toolchain at ITS dispatch
          # SHA and accepts {N, N-1} (PUBLISH_CONTRACT_VERSION in
          # scripts/ci/locale-publish-provenance.mjs): bump both together when
          # the layout of the source artifacts, the IT plan or the receipts
          # changes. tests/deploy-publish-pinned-toolchain.test.ts keeps them
          # equal.
          PROVENANCE_PUBLISH_CONTRACT_VERSION: '1'
        run: |
          node scripts/ci/locale-publish-provenance.mjs \
            --output "$RUNNER_TEMP/locale-publish-provenance/${BUILD_LOCALE}.json" \
            --dist-dir dist

      # This source receipt is only a source-ready handoff. The publisher
      # writes a second complete receipt after all IT side effects succeed.
      - name: Upload locale publish provenance
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: locale-publish-provenance-${{ matrix.locale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/locale-publish-provenance/${{ matrix.locale }}.json
          retention-days: 8
          if-no-files-found: error

      # Telemetry only. It sits just BEFORE the incremental-manifest save, which must
      # stay the final step of the job (tests/deploy-workflow.test.ts), so the figure
      # excludes this leg's own new manifest entry (a few MB).
      # The 10 GiB pool evicts the least recently used entry, and on 2026-11-14
      # (9.73 GB in 93 entries) that regularly removed `incremental-manifest-*`,
      # `og-jobs-*` and `deploy-content-manifest-*` before the next build. Without
      # a per-build measurement the eviction is only visible as a warning on the
      # leg that already lost its cache. This writes the occupancy per key family
      # to the summary, so a trend (and who fills the pool) is readable per build.
      # It changes no build outcome: continue-on-error, 3 minutes, read-only API.
      - name: Cache pool occupancy (per key family)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          usage="$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            --jq '[.active_caches_size_in_bytes, .active_caches_count] | @tsv')" || exit 0
          used_bytes="${usage%%$'\t'*}"; count="${usage##*$'\t'}"
          used_gib="$(awk -v b="$used_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"
          table="$(gh api --paginate --slurp -X GET "repos/${GITHUB_REPOSITORY}/actions/caches" -f per_page=100 \
            | jq -r '[.[].actions_caches[]]
                | map({family: (.key | sub("-([0-9a-f]{7,}|[0-9]+)(-.*)?$"; "")),
                       scope: (if (.ref | startswith("refs/pull/")) then "pull-request" else "main/branch" end),
                       size: .size_in_bytes})
                | group_by([.family, .scope])
                | map({family: .[0].family, scope: .[0].scope, n: length, mib: ((map(.size) | add) / 1048576 | floor)})
                | sort_by(-.mib)[:15][]
                | "| `\(.family)` | \(.scope) | \(.n) | \(.mib) |"')" || table=""
          {
            echo "### Actions cache pool after build-locale (${{ matrix.locale }})"
            echo "${used_gib} GiB of 10 GiB used in ${count} entries."
            if [ -n "$table" ]; then
              echo
              echo "| key family | scope | entries | MiB |"
              echo "|---|---|---|---|"
              echo "$table"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v b="$used_bytes" 'BEGIN { exit !(b / 1073741824 >= 9.0) }'; then
            echo "::warning title=Cache pool near the 10 GiB ceiling (${{ matrix.locale }})::${used_gib} GiB in ${count} entries: least recently used entries (incremental-manifest-*, og-jobs-*) are about to be evicted."
          fi

      # Save the current shadow snapshot only after the report and history row:
      # the run-specific key is unique, while restore-keys above picks the
      # newest prior snapshot on the next run for this locale. Keep this as the
      # final step in the job: provenance has already captured every
      # publish-critical outcome, while this cache is only a later-run hint.
      - name: Save incremental manifest cache
        if: always() && hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-manifest
          key: incremental-manifest-${{ matrix.locale }}-${{ github.run_id }}

  # ───────────────────────────────────────────────────────────────────────
  # build-history-commit: l'UNICO scrittore di
  # data/build-history/memory-peaks.jsonl per run (#9247).
  #
  # Le gambe di build-locale mettono le righe in staging e le caricano come
  # artifact build-history-rows-<locale>-<attempt>; questo job, dopo TUTTE le
  # gambe, fa un solo commit e un solo push. Prima erano dodici push per run
  # dentro le gambe, in gara fra loro: fino a 37,8 min di rebase sul percorso
  # critico (run 37107091990) e righe perse in silenzio.
  #
  # Telemetria, mai un gate: continue-on-error, nessun job lo mette in
  # `needs` (non entra nel percorso di publish), timeout corto. Una run
  # cancellata a meta' committa le righe che ha; il log del commit elenca le
  # righe per file, quindi una gamba mancante si vede.
  # ───────────────────────────────────────────────────────────────────────
  build-history-commit:
    needs: [build-locale]
    # always(): anche con gambe fallite o una run cancellata ci sono righe da
    # salvare. Ma se build-locale e' stato saltato (run non ammessa, prep
    # fallito) non esiste nessuna riga: niente runner ne' segreti caricati.
    if: ${{ github.event_name != 'schedule' && always() && needs.build-locale.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      # Il push usa GITHUB_PAT/APP_TOKEN da Remote Config
      # (configure-main-push-auth.sh): il GITHUB_TOKEN serve solo a leggere
      # il repo e gli artifact della run.
      contents: read
      actions: read
      issues: write
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout build-history writer
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /.gitattributes
            /data/build-history/
            /data/dist-size-history.jsonl
            /data/url-first-seen.json
            /scripts/lib/
            /scripts/ci/assert-accumulator-write.mjs
            /scripts/ci/merge-json-first-seen.mjs
            /scripts/ci/phase-timing-observer.mjs
            /scripts/load-rc-env.mjs
            /scripts/lib/remote-config-template-url.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Nessun npm ci: load-rc-env.mjs ripiega sul percorso REST senza
      # dipendenze (#4837) e carica GITHUB_PAT per il push su main.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # Senza merge-multiple: ogni artifact nella sua sottocartella, cosi' i
      # file omonimi di due tentativi della stessa gamba non si sovrascrivono.
      # continue-on-error: se nessuna gamba ha caricato righe (prep rossa, run
      # cancellata presto) lo step di commit lo dichiara da se'.
      - name: Download build-history rows
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: build-history-rows-*
          path: ${{ runner.temp }}/build-history-rows

      - name: Commit build-history rows (one commit per run)
        env:
          HISTORY_ROWS_DIR: ${{ runner.temp }}/build-history-rows
          HISTORY_COMMIT_MSG: 'chore(build-history): append rows run ${{ github.run_id }}'
        run: bash scripts/lib/commit-build-history-rows.sh



      # The matrix legs may observe independently; resolve only after every
      # locale is green AND three consecutive deploy runs have complete phase
      # measurements below the +30% boundary. The Actions run list is needed
      # because a cancelled run can stop before writing a history row.
      - name: Resolve build phase timing regression issue on green
        if: always() && needs.build-locale.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PHASE_TIMING_HISTORY: data/build-history/memory-peaks.jsonl
          PHASE_TIMING_RUNS_FILE: ${{ runner.temp }}/phase-timing-runs.json
          PHASE_TIMING_RUN_ID: ${{ github.run_id }}
          PHASE_TIMING_REQUIRED_LOCALES: it,en,de,fr
          PHASE_TIMING_RECOVERY_RUNS: '3'
        run: |
          set -euo pipefail
          # A `--branch` run listing without `--created` can come back frozen
          # weeks in the past (scripts/ci/lib/run-listing-window.mjs): the
          # recovery check would then not find the current run and never
          # close. Seven days cover the three consecutive deploys it needs
          # with a wide margin; the observer orders the runs by id itself.
          CREATED_SINCE="$(jq -rn 'now - (7 * 86400) | strftime("%Y-%m-%d")')"
          gh run list \
            --repo "$GH_REPO" \
            --workflow deploy.yml \
            --branch main \
            --created ">=$CREATED_SINCE" \
            --limit 20 \
            --json databaseId,status,conclusion \
            > "$PHASE_TIMING_RUNS_FILE"
          recovery=$(node scripts/ci/phase-timing-observer.mjs --recovery-ready)
          echo "[phase-timing] recovery-ready=$recovery (runs=$PHASE_TIMING_RECOVERY_RUNS)"
          if [ "$recovery" != 'true' ]; then
            exit 0
          fi
          node scripts/lib/github-issue-creator.mjs \
            --title "Build phase timing regression (+30% median)" \
            --resolve \
            --workflow "$WORKFLOW_NAME" \
            --run-url "$RUN_URL"

  # ───────────────────────────────────────────────────────────────────────
  # rearm: make "every HEAD eventually gets a successful build" an invariant
  # rather than a hope (#5349).
  #
  # THE HOLE. `pages-build-run` keeps 1 running + 1 pending and drops the
  # superseded middle. That is newest-wins and it is correct — on a linear
  # `main` the newer build already contains what it superseded. But nothing in
  # the old design restarted the pipeline when it reached a terminal state with
  # NOTHING queued behind it. Measured across the 100 runs from 2026-08-06T12:37Z to
  # 2026-08-08T05:58Z (~41 h): 82 cancelled, 10 success, 6 failure, and exactly
  # ONE such moment — a run ended `failure` at 2026-08-06T16:27:57Z and the
  # pipeline sat idle for 412 minutes until a human pushed. Same order as the
  # 638-minute publish lag that filed #5349.
  #
  # WHY HERE and not on a schedule. A debounce (schedule + dispatch instead of
  # push) removes the queue by removing events: it makes every urgent merge pay
  # the debounce interval, and at 16:27 the queue was not overfull, it was
  # EMPTY — a debounce fixes nothing there. This job adds the missing edge
  # instead, at the exact moment the information is available: the build just
  # ended, so "is anything still queued?" is answerable now.
  #
  # WHY `if: always()` AND THE CANCELLATION COVER. GitHub evaluates this final
  # job after failed and cancelled dependencies when the run is still executing.
  # A run cancelled while PENDING can be removed before this job is scheduled;
  # the schedule-reconcile job and deploy-stalled-watchdog.yml are the explicit
  # rescues for that documented platform edge. They exit after the same
  # queue/HEAD check, so they cannot add a duplicate while another build is
  # queued, running, or already green.
  #
  # RECURSION and STORM are closed in scripts/ci/rearm-deploy-build.mjs — the
  # cap is per-SHA (so each re-arm strictly consumes budget and the chain ends
  # after one retry) and the decision is taken for the current HEAD only, never
  # once per superseded commit. A canonical-regression status can override a
  # green-build shortcut exactly once for that SHA; see the queue helper and
  # that file's header for the full argument.
  # ───────────────────────────────────────────────────────────────────────
  rearm:
    needs: [validate-promotion-trigger, matrix-setup, prep, build-locale]
    # `always()` bypasses the implicit needs-success gate, so admission is
    # evaluated here even after a failed/cancelled build. The resolver allows
    # only a translation-handoff failure through; every other promotion-gate
    # failure remains fail-closed before it can add work.
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      github.ref == 'refs/heads/main'
    # Same durable admission claim as schedule-reconcile. The final rearm
    # keeps it until its queue recheck and any workflow_dispatch have returned.
    concurrency:
      group: deploy-rearm-dispatch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # read this workflow's run list + POST /dispatches
      statuses: read   # read the durable canonical-regression queue
      issues: write    # one "Deploy build blocked" issue per failure signature
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Re-arm the build pipeline after the terminal run
        # A first green run also dispatches one bounded successor: build-history
        # and other bot commits can advance main after this run's queue snapshot.
        # The per-SHA cap in rearm-deploy-build.mjs prevents a success loop.
        # Never fail the deploy over this. A red job here would be a second
        # failure stacked on the one that stopped the pipeline, and
        # deploy-stalled-watchdog.yml remains the backstop either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # At most this many build attempts per commit. The caller's own run
          # counts, so the default of 2 means exactly ONE automatic retry: a
          # commit whose build is genuinely broken is retried once and then left
          # to the "CI Failure (build)" issue this workflow already files.
          REARM_MAX_BUILDS_PER_SHA: '2'
          REARM_SELF_CONCLUSION: ${{ needs.build-locale.result == 'success' && 'success' || 'failure' }}
          REARM_PROMOTION_RESULT: ${{ needs.validate-promotion-trigger.result }}
          REARM_TRANSLATION_RESULT: ${{ needs.validate-promotion-trigger.outputs.translation_handoff_result }}
          REARM_SOURCE_RESULT: ${{ needs.validate-promotion-trigger.outputs.source_promotion_result }}
          # A confirmed host-loss/timeout in one matrix leg gets exactly one
          # job-level rerun. The rerun reuses this run's SHA and prepared
          # snapshot artifact; it must never fan out into a second full matrix.
          REARM_MAX_LOCALE_RECOVERY_ATTEMPTS: '1'
          # The failure circuit breaker (backoff + 6/12 h budget) also files and
          # closes the single "Deploy build blocked: <signature>" issue; only
          # this job has `issues: write`, the resolvers just write the summary.
          REARM_ISSUE_UPDATE: '1'
        run: node scripts/ci/rearm-deploy-build.mjs

      # This dispatch is deliberately at the end of the build workflow. The
      # publisher waits for this source run to become terminal before admitting
      # its artifacts, so the direct GITHUB_TOKEN dispatch is safe even though
      # GitHub does not emit a reliable workflow_run event for token-triggered
      # runs. The status-based receipt in deploy-publish makes this idempotent.
      - name: Start Pages publisher for this build
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.build-locale.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml" --jq '.id')
          gh workflow run deploy-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_run_id=$SOURCE_RUN_ID" \
            -f "source_sha=$SOURCE_SHA" \
            -f 'source_conclusion=success' \
            -f 'source_branch=main' \
            -f "source_event_name=$SOURCE_EVENT_NAME" \
            -f 'source_workflow=Deploy to GitHub Pages' \
            -f 'source_workflow_path=.github/workflows/deploy.yml' \
            -f "source_workflow_id=$workflow_id"

  # ───────────────────────────────────────────────────────────────────────
  # resolve-build-alarm: gli allarmi di build con un titolo UNICO per tutte le
  # gambe ("CI Failure (build)" e il gate di memoria) si chiudono solo a run
  # TUTTA verde. Quelli per-locale (shard, guard CDN) restano nella gamba: il
  # locale è nel titolo, quindi ogni gamba chiude solo il proprio.
  #
  # Prima la chiusura era uno step `if: success()` dentro ogni gamba di
  # `build-locale`, e uno step vede solo la propria gamba. Il 2026-09-25 la
  # gamba it della run 36077807468 ha riaperto #9179 e alle 04:53 una gamba
  # verde della STESSA run l'ha chiusa come «tornata verde»: la produzione era
  # rossa e l'allarme spento. `needs.build-locale.result` è l'esito aggregato
  # della matrice, cioè `success` solo se le quattro gambe lo sono.
  #
  # NON può rendere rossa una run verde: `continue-on-error` a livello di job.
  # Una run rossa per colpa di questo job non avvierebbe la pubblicazione
  # (`workflow_run` con conclusion success), e un guasto del reporter non deve
  # mai costare un deploy. Gira in parallelo a `rearm`, quindi non allunga la
  # tenuta del lock di concorrenza del build.
  # ───────────────────────────────────────────────────────────────────────
  resolve-build-alarm:
    name: close the build alarm when every leg is green
    needs: [build-locale]
    if: github.event_name != 'schedule' && needs.build-locale.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve build GitHub Issue on success
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tutte le gambe verdi → chiude la issue canonica "CI Failure (build)"
          # se è aperta. Il reporter di ogni gamba la riapre entro 720h invece
          # di coniarne una nuova: la coppia riapri↔chiudi resta su UNA issue
          # canonica. No-op se non c'è niente di aperto. Il TITOLO deve restare
          # identico a quello del reporter.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Stesso difetto, stesso rimedio: il titolo del gate di memoria è unico
      # per le quattro gambe (l'`entity` va nel body, non nel titolo), quindi
      # lo chiude solo una run in cui nessuna gamba è rossa.
      - name: Resolve build memory issue on green
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          mode: resolve
          title: 'il picco di memoria della build risale sopra la soglia'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────
  # in-run-alarm: la seconda rete dell'allarme di deploy, per le run che
  # l'osservatore esterno non può vedere.
  #
  # IL BUCO. `deploy-failure-alarm.yml` parte su `workflow_run: completed` di
  # questo workflow, e GitHub NON emette quell'evento per una run avviata con il
  # GITHUB_TOKEN (actor `github-actions[bot]`): è la regola anti-ricorsione già
  # descritta nel job `rearm` qui sopra. La run 36065965021 del 2026-09-24,
  # dispatchata da `rearm` col token interno, è fallita nel leg it e
  # l'osservatore esterno non è mai partito. #9715 fa dispatchare `rearm` col
  # token dell'App, ma il ripiego sul GITHUB_TOKEN resta quando l'App non dà un
  # token con `actions: write`: dal 2026-09-18 ci sono state 15 run così.
  #
  # PERCHÉ SOLO QUELLE RUN. Una run avviata da un utente, da un PAT o dall'App
  # emette `workflow_run`, e l'osservatore esterno la vede a run CONCLUSA, con
  # la conclusion vera. Accendere anche questo job per quelle run non aggiunge
  # copertura: aggiunge un secondo commento 🔁 sulla stessa issue per ogni
  # guasto. Con il filtro sull'actor ogni run rossa è vista da UN osservatore.
  # `triggering_actor` copre un re-run lanciato col GITHUB_TOKEN; `actor` il
  # dispatch originale. Se capitassero tutti e due (un re-run manuale di una
  # run del bot), il titolo è IDENTICO a quello dell'osservatore esterno e il
  # dedup del creator li collassa sulla stessa issue: al peggio un commento in
  # più, mai una issue doppia.
  #
  # PERCHÉ `!cancelled()` E NON `always()`. Serve partire anche quando i job
  # osservati sono falliti, ma non su una run cancellata: le cancellazioni
  # newest-wins avvengono in coda e non avviano nessun job, una cancellazione a
  # metà run è un'azione deliberata, e l'osservatore esterno tace sulle
  # `cancelled` per la stessa ragione. `contains(..., 'failure')` esclude anche
  # i job `cancelled` e `skipped`.
  #
  # NON è un gate: gira dopo il verdetto dei job osservati, il suo esito non
  # conta per la run (`continue-on-error`), e scrive solo una issue.
  # ───────────────────────────────────────────────────────────────────────
  in-run-alarm:
    name: in-run deploy alarm (run without workflow_run)
    needs: [validate-promotion-trigger, matrix-setup, prep, build-locale]
    if: >-
      ${{ github.event_name != 'schedule' && !cancelled() && github.ref == 'refs/heads/main' &&
          (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]') &&
          contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      # Senza questa riga la Jobs API risponde 403 e il body degrada a «job non
      # attribuito» in silenzio: un blocco `permissions:` esplicito azzera gli
      # scope non elencati.
      actions: read
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Digest the failing deploy run
        id: digest
        # Lo script esce 0 per contratto; `continue-on-error` copre il crash
        # imprevisto, perché lo step successivo deve partire comunque: senza
        # body usa il testo di ripiego invece di tacere.
        continue-on-error: true
        env:
          # Tutti gli input passano da env, mai come testo di script.
          ALARM_WORKFLOW_NAME: ${{ github.workflow }}
          ALARM_REPO: ${{ github.repository }}
          ALARM_RUN_ID: ${{ github.run_id }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # La run è ancora in corso, quindi non ha una conclusion da leggere:
          # il `failure` l'ha già provato l'`if:` del job su `needs.*.result`.
          ALARM_RUN_CONCLUSION: failure
          ALARM_OBSERVER: in-run
          ALARM_DESCRIPTION_FILE: alarm-description.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/report-deploy-run-failure.mjs --mode report
      - name: Open or update the deploy alarm issue
        id: open
        # Ogni job di `needs:` è elencato per esteso: è la forma che
        # `isFailureGated` (scripts/ci/failure-issue-inventory.mjs) riconosce,
        # così il gate di accoppiamento verifica che qualcuno chiuda questo
        # titolo. `tests/deploy-in-run-alarm.test.ts` pretende che l'elenco
        # copra tutti i `needs:` del job.
        if: >-
          needs.validate-promotion-trigger.result == 'failure' ||
          needs.matrix-setup.result == 'failure' ||
          needs.prep.result == 'failure' ||
          needs.build-locale.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Se il digest non ha potuto scrivere il body (Jobs API 403, rete),
          # l'allarme suona lo stesso con meno dettaglio.
          if [ ! -s alarm-description.md ]; then
            cat > alarm-description.md <<'FALLBACK'
          Il deploy e' rosso su main in una run avviata dal token interno di
          GitHub Actions, che l'osservatore esterno non vede, e il digest della
          run non e' stato leggibile. Il guasto resta: apri la run e leggi il
          primo job rosso.
          FALLBACK
          fi
          # Titolo IDENTICO a quello dell'osservatore esterno: una sola issue
          # canonica per il deploy rosso, chiusa al primo verde dall'osservatore
          # esterno o dal reconciler orario.
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description-file alarm-description.md \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}" \
            --run-url "${ALARM_RUN_URL}"
      - name: Open the deploy alarm without the checkout (fallback)
        # Lo step sopra ha il `success()` implicito: se il checkout o il setup di
        # Node falliscono, salta, e per una run del bot non c'è un osservatore
        # esterno che rimedi. Questo parte comunque (`always()`), tranne su
        # una run cancellata, che non allarma come nel resto del job,
        # solo quando lo step sopra non ha scritto. Il creator non ha dipendenze
        # oltre ai moduli di Node: se il checkout manca lo scarica con `gh`
        # allo SHA della run e lo esegue col Node di sistema del runner, quindi
        # dedup, riapertura e titolo restano quelli canonici.
        if: >-
          always() && !cancelled() && steps.open.outcome != 'success' &&
          (needs.validate-promotion-trigger.result == 'failure' ||
           needs.matrix-setup.result == 'failure' ||
           needs.prep.result == 'failure' ||
           needs.build-locale.result == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Senza checkout la cwd non è un repo git: `gh` deve sapere dove scrivere.
          GH_REPO: ${{ github.repository }}
          ALARM_SHA: ${{ github.sha }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          creator=scripts/lib/github-issue-creator.mjs
          if [ ! -s "$creator" ]; then
            creator="$RUNNER_TEMP/github-issue-creator.mjs"
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/lib/github-issue-creator.mjs?ref=${ALARM_SHA}" \
              > "$creator" || true
          fi
          if [ ! -s "$creator" ]; then
            echo "::error title=Deploy alarm not written::il creator delle issue non è leggibile né dal checkout né via API; apri a mano ${ALARM_RUN_URL}"
            exit 0
          fi
          node "$creator" \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "Il deploy e' rosso su main in una run avviata dal token interno di GitHub Actions, che l'osservatore esterno non vede. Il job di allarme interno non ha potuto preparare il digest (checkout o setup falliti): apri la run e leggi il primo job rosso." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}" \
            --run-url "${ALARM_RUN_URL}" \
            || echo "::error title=Deploy alarm not written::il creator è uscito non-zero; apri a mano ${ALARM_RUN_URL}"
