name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # paths-ignore è una DENYLIST applicata solo se TUTTI i file del push
    # matchano (un push misto docs+codice deploya comunque). Sicuro per
    # definizione: un path dimenticato deploya, non viene saltato.
    # Obiettivo: non bruciare un build SEO da ~25min su merge che NON cambiano
    # il dist deployato (deploy-starvation: build lungo vs merge ~5min via
    # auto-merge PAT). I path sotto non sono letti dalla build del dist:
    #   - docs/markdown, file CI/workflow, test, config agent: nessun output dist.
    # NON ignorati (toccano il dist): build-plugins/, services/, components/,
    # scripts/ (assemble-jobs gira a build-time), data/jobs*, vite/index/package.
    # NB: usiamo `*.md` (root) + `docs/**`, NON `**/*.md`: `public/**/*.md`
    # (es. press-kit) è copiato verbatim da Vite (publicDir) nel dist → resta
    # dist-bound e deve poter deployare.
    paths-ignore:
      - 'data/border-wait-current.json'
      - 'data/border-wait-history/**'
      - 'data/border-wait-averages.json'
      - 'data/weather-snapshot.json'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Optional article id to verify live metadata and post to Facebook after deploy'
        required: false
        type: string
      article_url:
        description: 'Optional live article URL for post-deploy metadata verification'
        required: false
        type: string
      og_title:
        description: 'Optional expected OG title for the deployed article'
        required: false
        type: string
      og_description:
        description: 'Optional OG description for the Facebook post copy'
        required: false
        type: string
      og_image:
        description: 'Optional expected OG image for the deployed article'
        required: false
        type: string
      article_category:
        description: 'Optional article category used for Facebook hashtags'
        required: false
        type: string
      profile_sequential:
        description: 'Investigation-only run: same sequential build as production (now the default), but skips deploy/validate/upload steps. Use to inspect [profile-detail] timings without consuming a deploy slot.'
        required: false
        type: boolean
        default: false
      profile_jobs_seo:
        description: 'Compatibility no-op: jobsSeoPagesPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      profile_related_compare:
        description: 'Investigation-only: when jobs SEO profiling is enabled, compare legacy related-job filtering against the pre-indexed related-job pool and emit before/after profiler rows.'
        required: false
        type: boolean
        default: false
      profile_weekly_employers:
        description: 'Compatibility no-op: weeklyEmployersPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      write_collision_dump:
        description: 'Investigation-only: dump every unique-by-hash content claim() to dist/.write-collisions-data/ for triaging colliding paths. Off by default — adds ~200k synchronous writeFileSync calls during build (~100-200s overhead) that get pruned at end. The collisions JSON report is emitted regardless; only enable this when you need the actual HTML payload of a colliding path.'
        required: false
        type: boolean
        default: false
      publish_branch_test:
        description: 'EXPERIMENT (reversible): after build, orphan force-push dist/ to the `gh-pages-test` branch instead of (not in addition to) the normal artifact deploy. Validates whether a ~13 GB site survives a git push to GitHub — the prerequisite for switching off the actions/deploy-pages path (10-min artifact-polling cap that has failed every recent deploy). Does NOT touch the live Pages source or the production gh-pages branch; nothing is published. Off by default.'
        required: false
        type: boolean
        default: false
      parallel_plugins:
        description: 'Force parallel closeBundle even when profile_sequential=true. Default (off) means parallel for production, sequential only for clean profile dispatch runs. Set this to true when you want to dispatch a profile run AND keep the parallel scheduling — useful for measuring parallel build behavior without cron-storm cancellation.'
        required: false
        type: boolean
        default: false

permissions:
  # This workflow only needs repository read access: the previous-slug winners
  # sync moved to post-deploy-validation.yml, while the deploy itself only
  # uploads artifacts and publishes to GitHub Pages.
  contents: read
  pages: write
  id-token: write
  issues: write     # for github-issue-creator on build/deploy failure

jobs:
  build:
    # `pages-build` concurrency group with cancel-in-progress: FALSE.
    # Builds are 12-15 min of heavy CPU each. We need:
    #   1. NOT to run 5+ builds in parallel for stale cron commits
    #      (each will be obsoleted by the next cron)
    #   2. NOT to cancel a build in-flight at the 14-minute mark just
    #      because a new cron landed (wasting all that CPU). Run
    #      25428278837 was killed this way: build started 09:51:34,
    #      cron 827241b2 landed at 10:08:30 (8 SECONDS before the
    #      build would have completed), cancel-in-progress: true
    #      killed it at 10:08:38.
    #
    # cancel-in-progress: false gives both:
    #   - in-flight build finishes normally (no wasted CPU)
    #   - new cron arrivals enter the queue as pending; if a third
    #     pending lands, GitHub's 1+1 cap drops the MIDDLE one. This
    #     is fine: every cron commit is cumulative (it includes all
    #     prior cron commits in main), so the LAST entry in the queue
    #     is always a superset of the dropped middles.
    #
    # Why a SEPARATE group from `deploy`'s `pages-deploy`:
    #   With both jobs sharing one group, every cron commit landing
    #   while a deploy was queued cancelled the previously-queued
    #   deploy of a still-valid earlier run (run 25425625029.deploy
    #   was killed this way). Splitting:
    #     - `pages-build`  serializes builds  (1+1, last-wins on overflow)
    #     - `pages-deploy` serializes deploys (1+1, last-wins on overflow)
    #   keeps each group lightly populated.
    #
    # Profile-only runs (profile_sequential=true) use a per-run group
    # so the long sequential profile can complete without being
    # cancelled by the next push to main.
    concurrency:
      group: ${{ github.event.inputs.profile_sequential == 'true' && format('pages-build-profile-{0}', github.run_id) || 'pages-build' }}
      cancel-in-progress: false
    # contents: write is needed only by the opt-in publish_branch_test step
    # (orphan force-push of dist/ to gh-pages-test). Mirrors the workflow-level
    # block otherwise; the bump from read→write also lets the existing
    # dist-history `git push origin HEAD:main` land (it had been failing on
    # the inherited contents:read).
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    runs-on: ubuntu-latest
    # GitHub free runners cap at 360 min — match it explicitly so cold-start
    # builds (e.g. first run with a heavy plugin like jobOgImagesPlugin
    # rendering ~2100 PNGs from scratch) don't fail on the default 6 h
    # ceiling and the failure mode is obvious in the logs if it happens.
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_first.outputs.page_url }}
    steps:
      # Free ~25-30 GB on the ubuntu-latest runner before any cache restore
      # or build output lands on disk. Without this the runner ships with
      # only ~14 GB free on / and the build crashes mid-Vite-emit with
      # "No space left on device" — the build step's log file goes missing
      # from the run archive entirely because the worker dies before logs
      # flush. We delete only toolchains this repo never uses (Android SDK,
      # .NET, Haskell, CodeQL, Swift, Boost). Node 22, npm cache, and
      # Python tooling stay intact.
      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Record build job start time
        # Captured here (immediately after disk cleanup, before any cache
        # restore) so the wall-clock total emitted by the `Build profile
        # summary` step reflects the full job duration. Used to detect
        # CI-level regressions (cache restore slowdowns, runner queue,
        # plugin emit growth) without needing to query the GH API.
        shell: bash
        run: echo "$(date +%s)" > /tmp/job-start.txt

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # cache: 'npm' rimosso — gestiamo node_modules direttamente sotto

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
              # Nessun restore-keys intenzionalmente: node_modules parziali = dipendenze
              # fantasma. Se package-lock.json cambia, si reinstalla tutto da zero.

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        # 0-tolerance gate: blocks the deploy if any tracked file contains
        # unresolved <<<<<<< / ======= / >>>>>>> markers. Added after the
        # 2026-05-21 incident where a concurrent cron committed 92 job slice
        # files with raw `git stash pop` conflicts. assemble-jobs-dataset.mjs
        # silently skipped them and production shipped with 2603 jobs
        # instead of 5922 (-57%). Runs ~3s, fails fast before any expensive
        # build step.
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi
          if [ -f /tmp/firebase-sa.json ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: SEO moratorium check (CLAUDE.md #19)
        # Block new build-plugin-emitted SEO landings while the 7-day GSC
        # avg position is > 7.5. Long-tail dilution from 50+ SEO PRs in
        # 10 days drove avg position 5.7 → 8.62. Re-enable when ≤ 7.5.
        # Only runs on pull_request events — main pushes have already passed
        # the gate, and workflow_dispatch is exempt so we can manually deploy
        # fixes/refactors that happen to add a file matching the pattern.
        if: github.event_name == 'pull_request'
        env:
          # OAuth2 path (currently not set; SA fallback in
          # refresh-gsc-position-rolling.mjs uses GOOGLE_APPLICATION_CREDENTIALS
          # exported by the Prepare Firebase credentials step above — the
          # Firebase SA also has GSC permissions per memory
          # `reference_firebase_sa_doubles_as_gsc`).
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          node scripts/refresh-gsc-position-rolling.mjs
          node scripts/check-seo-moratorium.mjs

      - name: Cache assemble-jobs output
        uses: actions/cache@v5
        with:
          path: .cache/assemble-jobs
          # Hash inputs cover ALL slice files plus the assembler itself. When
          # slice bytes or output logic changes, the primary key misses. The
          # script also versions its internal cache key, so restore-key hits
          # cannot replay stale jobs.json across assembly behavior changes.
          key: assemble-jobs-${{ runner.os }}-${{ hashFiles('scripts/assemble-jobs-dataset.mjs', 'scripts/lib/parse-job-slices-worker.mjs', 'data/jobs/by-crawler/**/*.json', 'data/jobs/expired/by-crawler/**/*.json', 'data/jobs-crawler-summaries/by-crawler/**/*.json') }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-

      - name: Cache per-job OG images
        uses: actions/cache@v5
        with:
          path: .cache/og-jobs
          # Invalidate the FULL cache (forcing all 2100 cards to re-render)
          # only when the design changes: plugin source, fonts, or the logo
          # manifest (visual content). New jobs hit the restore-keys cascade
          # and get their PNG rendered on-demand without invalidating the
          # rest. The restore-keys ensure we always start with the most
          # recent OS-matching cache when the exact key misses.
          key: og-jobs-${{ runner.os }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}
          restore-keys: |
            og-jobs-${{ runner.os }}-

      - name: Assemble jobs dataset from per-crawler slices
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Active-jobs regression check
        # Block deploy if active jobs dropped >25% vs baseline. Catches mass
        # job loss that slips past the assemble hard-fail (crawler outages,
        # over-eager housekeeping prunes, expired-jobs leaks). Baseline at
        # data/active-jobs-baseline.json auto-ratchets UP only — manual
        # commit required to lower (see CLAUDE.md rule #1).
        run: npm run audit:active-jobs-regression

      - name: Housekeeping (cross-crawler dedup + locale hardening)
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: node scripts/cleanup-jobs.mjs

      - name: Refresh weekly-employers footer link list (F5 link-graph closer)
        # Regenerates data/weekly-employers-top-pairs.json from current jobs
        # using the SAME logic the build plugin uses to materialise pages.
        # Guarantees footer hrefs in WeeklyEmployersTeaser always point at
        # static pages that exist in dist/, eliminating SPA-shell 404s.
        run: node scripts/refresh-weekly-employers-top-pairs.mjs

      - name: Mine all job slugs for comprehensive 404 coverage
        run: node scripts/mine-all-job-slugs.mjs

      # Cluster-pages cache REMOVED (2026-05-09).
      # Build instrumentation on 5 recent deploys showed:
      #   - cache MISS (4/5 runs, jobs.json invalidates daily via cron):
      #       restore 265s + plugin re-emit 652s + Post Cache tar+zstd
      #       of ~106k files → 844 MB compressed = ~1020s
      #       → ~21 min cache overhead to save ~0s of work
      #   - cache HIT (1/5 runs, blog/code-only push):
      #       ~3 min cache I/O to save ~10 min of plugin emit (net positive)
      #   - HIT-rate ≈ 20%; expected build saving = 0.2×10.5 - 0.8×21.4
      #       = -15.6 min/build (negative)
      # Plus a structural bug: saveToCache() wipes only the same-key subdir,
      # so prior runs' subdirs accumulate under .cache/related-search-clusters/
      # and inflate the tarball indefinitely.
      # Same anti-pattern documented in docs/CACHE-EXPERIMENT.md for the
      # plugin-level cache removed 2026-05-04.
      # Plugin's internal cache (saveToCache/tryRestoreFromCache) is disabled
      # at runtime via RELATED_SEARCH_CLUSTERS_NO_CACHE=1 in the Build env
      # below — without the GH cache wrapper, the .cache/ directory on the
      # ephemeral runner is throwaway, so internal save is wasted I/O.

      # Job popularity is refreshed once a day by refresh-job-popularity.yml
      # and committed to data/job-popularity.json. The build reads the file
      # directly — no Firestore read on every push.

      - name: Cache responsive image thumbnails
        id: thumb-cache
        uses: actions/cache@v5
        with:
          path: |
            public/images/blog/thumbnails
            public/images/places/thumbnails
          key: thumbnails-v2-${{ github.run_id }}
          restore-keys: |
            thumbnails-v2-

      - name: Generate responsive image thumbnails
        run: node scripts/generate-image-thumbnails.mjs

      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs

      - name: Cleanup stale job HTML (orphans from prior incremental builds)
        # vite.config.ts uses emptyOutDir:false to preserve admin data,
        # but that leaves orphan job HTML from prior builds
        # on disk when a slug is renamed/removed. The title-uniqueness audit
        # then flags those orphans as duplicates of the freshly-emitted
        # canonical pages. Wipe the per-locale job-detail trees before build
        # so jobsSeoPagesPlugin re-emits a clean set every run.
        run: |
          rm -rf dist/cerca-lavoro-ticino \
                 dist/en/find-jobs-ticino \
                 dist/de/jobs-im-tessin \
                 dist/fr/trouver-emploi-tessin \
                 dist/cerca-lavoro-ticino.html \
                 dist/en/find-jobs-ticino.html \
                 dist/de/jobs-im-tessin.html \
                 dist/fr/trouver-emploi-tessin.html

      - name: Cache Vite optimized deps + AST cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.vite
            .vite-cache
          # Hash MUST include every source path Vite/Rollup compile into the
          # SPA bundle, otherwise stale optimized deps + AST cache produce
          # the same chunk content-hash for new source (visible 2026-05-20:
          # PR #380/#404 edits to components/community/JobBoard.tsx and
          # services/router.ts kept emitting `JobBoard-lT8fKnYe.js` with
          # pre-PR-380 content, so the SPA's bridge cross-canton lazy-fetch
          # never landed despite being merged + redeployed multiple times).
          # Add components/ + services/ + hooks/ + App.tsx + index.html so
          # any source change invalidates the cache and forces a clean
          # bundle pass.
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts', 'build-plugins/**/*.ts', 'components/**/*.{ts,tsx}', 'services/**/*.{ts,tsx}', 'hooks/**/*.{ts,tsx}', 'App.tsx', 'index.html') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # Cache PDF whitepapers. The pdfWhitepapersPlugin generates 4 large
      # PDFs every build (~480s total in deploy run #25039504369). Source
      # content lives under services/locales/blog-body/it/*.ts and changes
      # rarely, so most builds can short-circuit by reading the cached PDF.
      #
      # The plugin maintains `.build-cache/pdf-manifest.json` keyed by
      # filename → sha256(markdown + render-version). On cache restore the
      # cached PDFs land back in `.build-cache/pdf-cache/` and the plugin
      # skip path copies them straight into dist/guides/.
      #
      # Cache key inputs:
      #   - the plugin source (any rendering change must invalidate)
      #   - the 4 blog-body files the GUIDES array points at
      - name: Cache PDF whitepapers
        uses: actions/cache@v5
        with:
          path: |
            .build-cache/pdf-manifest.json
            .build-cache/pdf-cache/**/*.pdf
            dist/guides/**/*.pdf
          key: pdf-${{ runner.os }}-${{ hashFiles('build-plugins/pdfWhitepapersPlugin.ts', 'services/locales/blog-body/it/guida-completa-frontaliere.ts', 'services/locales/blog-body/it/permesso-g-vantaggi-svantaggi.ts', 'services/locales/blog-body/it/lamal-vs-ssn-decisione.ts', 'services/locales/blog-body/it/trovare-lavoro-ticino.ts') }}
          restore-keys: |
            pdf-${{ runner.os }}-

      # Plugin-level build cache REMOVED (commit TBD).
      # See docs/CACHE-EXPERIMENT.md for the data: caching the per-plugin
      # output cost ~11 min per deploy more than just regenerating, because
      # (a) the 982 MB tarball Post Cache step took ~6 min, and (b) restore
      # I/O for the two big plugins (salary-hub 3,473 files, jobs-seo 204k
      # files) was slower than fresh generation.
      # `data/jobs.json` assembly cache (next step above) stays — it's net
      # positive (~60s saved, ~28 MB tarball).

      - name: Build
        env:
          # UV_THREADPOOL_SIZE=64 was tested in commit 119475af96 (run
          # 25610456421, profile_sequential): jobs-seo-pages flush stayed
          # 143.8s → 141.9s (~0% change), and post-walk-coordinator
          # REGRESSED 69s → 83s (+14s) — likely thread-contention on the
          # 4-vCPU runner. The flush bottleneck is NOT libuv threadpool;
          # the actual hot path is CPU-bound (content-hash sha256 +
          # sharedWriteRegistry claim()). Knob removed; investigate the
          # real bottleneck instead. See data/build-perf-history.md.
          BUILD_PROFILE: '1'
          # Emit absolute CDN URLs for all bundler assets (JS/CSS/chunks) via
          # vite.config experimental.renderBuiltUrl, so dist/assets can be
          # offloaded to the frontaliere-cdn Pages site. The post-build steps push
          # dist/assets there and (after verifying they serve) delete them from the
          # artifact. NOTE: this bakes the CDN URL into HTML/JS — if the CDN push
          # or verify fails, the deploy is FAILED (last good stays live), since
          # there is no same-origin fallback for boot-critical assets.
          ASSET_CDN: 'https://cdn.frontaliereticino.ch'
          # Cap the post-walk worker pool so it doesn't structured-clone the full
          # ~247K-path list into cpus()-many workers at once (memory headroom for
          # the build OOM, #1290). Output-identical — only fewer parallel workers.
          POST_WALK_WORKERS: '2'
          # ALWAYS sequential on the GH free-tier runner (2 vCPU / 7 GB).
          # Empirical comparison on the same source tree (2026-05-07):
          #   sequential build job: 12m41s, peak heap ~max(single plugin)
          #   parallel   build job: 17m48s, peak heap Σ(overlap) → OOM at
          #     18k cluster pages (run a7f28ce129) and 60k+ soft-landings
          #     (run e9c8ba70bb).
          # The runner has too few cores / too little RAM for parallel
          # closeBundle to win: every plugin's wall is INFLATED by
          # CPU+memory+disk contention with peer plugins, sometimes by
          # 3-5×. Forcing sequential gives faster builds AND eliminates
          # the OOM risk that was blocking MIN_JOB_COUNT=1 (50k cluster
          # pages). The original `profile_sequential` workflow_dispatch
          # input now only controls whether the deploy steps are skipped
          # (for profile-only investigation runs).
          #
          # PARALLEL was the default 2026-05-10 → 2026-05-12 after run
          # 25612758703 measured build job wall 716s → 634s = -82s
          # / -11.5% with NO OOM. The May 9-10 memory optimizations
          # (inverted index in cluster plugin, bridge-direct emit
          # cluster + jobs-seo, auto-flush 5000) cap per-plugin peak
          # heap at ~150 MB so 4-5 concurrent closeBundle hooks stayed
          # well under the 7 GB ubuntu-latest budget at that scale.
          #
          # FLIPPED BACK TO SEQUENTIAL 2026-05-12 (run 25737586562 +
          # 25733510850, docs/PROFILE-MAY12.md). Post-cathedral-expansion
          # the build crossed the contention crossover point:
          #   parallel build job:   1631s (run 25733510850, 2026-05-12)
          #   sequential build job: 1180s (run 25737586562, 2026-05-12)
          #   Δ = -451s = -28% wall, sequential WINS.
          # Cause: cathedral added ~16k new SEO pages + heavier per-canton
          # work; job-og-images's 4-worker pool now degrades 15× in
          # parallel (903s vs 61s sequential, [profile-detail] confirms
          # cpu_s=231 → 4-worker @ 96% efficiency in sequential, vs
          # event-loop starvation in parallel). The ~12-plugin "cluster
          # at 350s wall" was pure starvation: cpu_s = 0.12-3.16 for
          # plugins reporting 350s — they were waiting, not working.
          # Sequential build also restores the silent-tail signal:
          # jobs-seo Flushed→profile gap goes from 38s parallel to 0s
          # sequential.
          #
          # Parallel mode is opt-in via `parallel_plugins=true` dispatch
          # input for A/B testing or measuring how the crossover moves
          # as build scale changes. `profile_sequential=true` still gates
          # the deploy-step skips for investigation-only runs (it no
          # longer needs to toggle SEQUENTIAL_PROFILE — that's now on
          # by default).
          #
          # Logic: parallel ONLY when parallel_plugins=true explicitly.
          # Everything else (push, cron, bare dispatch, profile dispatch)
          # gets sequential.
          SEQUENTIAL_PROFILE: ${{ github.event.inputs.parallel_plugins == 'true' && '' || '1' }}
          # jobsSeoPagesPlugin per-category profiler. Default-on when
          # BUILD_PROFILE=1; set JOBS_SEO_PROFILE=0 locally to opt out. The
          # workflow_dispatch input remains as a compatibility force-on flag.
          JOBS_SEO_PROFILE: ${{ github.event.inputs.profile_jobs_seo == 'true' && '1' || '' }}
          # Phase-level instrumentation inside the active-job per-page render
          # (sub-categories: ph:title, ph:canonical-fallback, ph:related-pool,
          # ph:summary-html, ph:jsonld, ph:prose, ph:template-render,
          # ph:minify-write, ph:per-job-invariants). Enabled by default on the
          # remote workflow so every deploy emits the phase breakdown for
          # optimization work; opt-out is `JOBS_SEO_PROFILE_PHASES=0`. Overhead
          # is ~9 hrtime.bigint() calls per active-job page × ~23k pages, well
          # under 1 s on the GH runner.
          JOBS_SEO_PROFILE_PHASES: '1'
          # Investigation-only before/after timing for the active-job related
          # pool change. When enabled, jobsSeoPagesPlugin computes the legacy
          # validJobs.filter(...) pool alongside the pre-indexed pool, records
          # both profiler rows, and fails if the ordered pools diverge.
          JOBS_SEO_PROFILE_COMPARE_RELATED: ${{ github.event.inputs.profile_related_compare == 'true' && '1' || '' }}
          # weeklyEmployersPlugin per-category profiler. Default-on when
          # BUILD_PROFILE=1; set WEEKLY_EMPLOYERS_PROFILE=0 locally to opt out.
          # The workflow_dispatch input remains as a compatibility force-on flag.
          WEEKLY_EMPLOYERS_PROFILE: ${{ github.event.inputs.profile_weekly_employers == 'true' && '1' || '' }}
          # Disable the plugin-internal save/restore for related-search-clusters
          # since the GH Actions cache wrapper around .cache/related-search-clusters/
          # was removed (see comment in cluster-pages cache section above). On the
          # ephemeral CI runner the .cache/ directory is throwaway, so writing
          # ~106k cached HTML copies via fs.copyFileSync is pure waste (~50s/build).
          # The plugin still emits to dist/ as normal — only the disk-side cache
          # path is short-circuited. Keeps local dev paths (where the cache IS
          # persisted) unchanged: unset this flag locally to re-enable.
          RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
          # POST_WALK_WORKERS rollback removed (commit 4b412bc8a + 36dfd0e9c
          # added explicit `.ts` extensions to the two extension-less local
          # imports the worker tree pulled in — `./blogContextualLinksData`
          # and `./shared/hreflangGuard`). Workers now resolve cleanly under
          # tsx 4.x `--import`. Default = max(availableParallelism, cpus.length).
          #
          # WRITE_COLLISION_DUMP gated to workflow_dispatch input
          # `write_collision_dump` (default false). When enabled,
          # sharedWriteRegistry dumps every unique-by-hash content claim()'d
          # during the build to `dist/.write-collisions-data/<hash>.html`
          # — that's ~200k synchronous writeFileSync calls per build,
          # 99.8% of which are pruned at end (only ~330 referenced by
          # colliding paths survive). The collisions JSON report is
          # emitted unconditionally, so push deploys still surface paths
          # + plugins + callsites of every collision; only the raw HTML
          # payload requires the dump dir. Flip on via
          # `gh workflow run deploy.yml -f write_collision_dump=true`
          # when triaging a specific collision and you need the rendered
          # HTML. Saves ~100-200s/build on push events.
          WRITE_COLLISION_DUMP: ${{ github.event.inputs.write_collision_dump == 'true' && '1' || '' }}
        shell: bash
        run: |
          set -o pipefail
          npm run build:ci 2>&1 | tee /tmp/build.log

      - name: Verify critical dist pages before upload
        run: node scripts/validate-critical-dist-pages.mjs

      - name: Verify build profile markers before upload
        run: node scripts/validate-build-profile-markers.mjs /tmp/build.log

      - name: Build profile summary
        if: always()
        shell: bash
        run: |
          # Total job wall-clock: emitted first so it shows at the top of
          # the summary even when the profile log is missing or partial.
          if [ -f /tmp/job-start.txt ]; then
            START_TS="$(cat /tmp/job-start.txt)"
            NOW_TS="$(date +%s)"
            ELAPSED_S=$((NOW_TS - START_TS))
            ELAPSED_M=$((ELAPSED_S / 60))
            ELAPSED_R=$((ELAPSED_S % 60))
            {
              echo "## Build job wall-clock"
              echo ""
              echo "**${ELAPSED_S}s** (${ELAPSED_M}m ${ELAPSED_R}s) from job start to profile summary."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -f /tmp/build.log ]; then
            echo "Build log not found — profiling skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Build profile (per-plugin closeBundle time)"
            echo ""
            echo "| Plugin | Time (s) |"
            echo "|---|---:|"
            grep -E '^\[profile\]' /tmp/build.log \
              | sed -E 's/^\[profile\] +//; s/ +([0-9.]+)s$/|\1/' \
              | awk -F'|' '{printf "| %s | %s |\n", $1, $2}' \
              | sort -t'|' -k3 -nr
            echo ""
            grep -E '^\[profile-total\]' /tmp/build.log | sed 's/^\[profile-total\] /**/' || true
            # Detailed per-plugin wall+CPU table is emitted whenever
            # SEQUENTIAL_PROFILE=1 is set in the Build step env (which
            # is now the always-on default — see comment there). The
            # [profile-detail] marker is emitted alongside the [profile]
            # line by profilePlugin.ts; per-plugin wall is now reliable
            # because plugins no longer overlap.
            if grep -qE '^\[profile-detail\]' /tmp/build.log; then
              echo ""
              echo "## Build profile — sequential, per-plugin wall + CPU"
              echo ""
              echo "| Plugin | Wall (s) | CPU (s) |"
              echo "|---|---:|---:|"
              # [profile-detail] <name padded> wall_s=N.NN cpu_s=N.NN
              grep -E '^\[profile-detail\]' /tmp/build.log \
                | sed -E 's/^\[profile-detail\] +//' \
                | awk '{
                    name=""; for(i=1;i<=NF-2;i++) name = name (i>1?" ":"") $i;
                    wall=$(NF-1); cpu=$NF;
                    sub(/wall_s=/, "", wall); sub(/cpu_s=/, "", cpu);
                    printf "| %s | %s | %s |\n", name, wall, cpu
                  }' \
                | sort -t'|' -k3 -nr
            fi
            for marker in jobs-seo-profile weekly-employers-profile related-search-profile post-walk-profile; do
              if grep -qE "^\[$marker\]" /tmp/build.log; then
                echo ""
                case "$marker" in
                  jobs-seo-profile) echo "## jobsSeoPagesPlugin internal profile" ;;
                  weekly-employers-profile) echo "## weeklyEmployersPlugin internal profile" ;;
                  related-search-profile) echo "## relatedSearchClustersPlugin internal profile" ;;
                  post-walk-profile) echo "## postWalkCoordinatorPlugin internal profile" ;;
                esac
                echo ""
                echo '```text'
                # Top-level emit categories (active-job, expired-soft-landing, ...).
                # Excludes `ph:*` sub-rows so the headline table stays uncluttered;
                # phase breakdown renders in its own sub-section below.
                grep -E "^\[$marker\]" /tmp/build.log | grep -vE "^\[$marker\] ph:" | sed -E "s/^\[$marker\] //"
                echo '```'
                # active-job per-page render phase breakdown (only emitted when
                # JOBS_SEO_PROFILE_PHASES=1, set by default in this workflow).
                # Categories: ph:title, ph:canonical-fallback, ph:related-pool,
                # ph:summary-html, ph:jsonld, ph:prose, ph:template-render,
                # ph:minify-write, ph:per-job-invariants. Use this table to see
                # which slice of the per-page render dominates the wall clock.
                if [ "$marker" = "jobs-seo-profile" ] && grep -qE "^\[$marker\] ph:" /tmp/build.log; then
                  echo ""
                  echo "### active-job per-page render phases"
                  echo ""
                  echo '```text'
                  grep -E "^\[$marker\] ph:" /tmp/build.log | sed -E "s/^\[$marker\] //"
                  echo '```'
                fi
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SPA fallback (GitHub Pages serves 404.html for unknown paths)
        run: cp dist/index.html dist/404.html

      # ── Static-asset offload to CDN repo ──────────────────────────────────
      # Push build-generated, NOT-git-tracked static to the dedicated CDN repo
      # `valerielinc-ops/frontaliere-cdn` (its own GitHub Pages site, Fastly edge):
      #   • dist/og     — per-job OG cards; og:image refs in HTML rewritten to
      #                   ${CDN_BASE}/og by the offload script (non-fatal).
      #   • dist/data   — ALL runtime-fetched JSON (job-detail, jobs-<locale>,
      #                   indexes, slug-map, stats, fuel, health, …). Every fetch
      #                   site routes through services/cdnDataBase.ts → cdnDataUrl;
      #                   the script injects window.__CDN_DATA_BASE__=${CDN_BASE}
      #                   and deletes the cdn-only files (keeps any /data/ path
      #                   referenced same-origin in HTML/XML) (non-fatal).
      #   • dist/assets — JS/CSS bundle. ASSET_CDN/renderBuiltUrl already rebased
      #                   its URLs to the CDN at build time; the verify step below
      #                   deletes dist/assets only after confirming the CDN serves
      #                   them AND no same-origin ref survives (FAIL-SAFE).
      # GitHub Pages (NOT raw / NOT jsDelivr): raw is rate-limited + serves JSON as
      # text/plain; jsDelivr 403/502s on fresh orphan refs. The CDN repo's Pages
      # site serves every file via Fastly with the correct Content-Type and
      # `access-control-allow-origin: *`, STABLE URLs (no SHA pin), and its own
      # ~1 GB / 100 GB-month quota (doubles headroom vs the main artifact).
      #
      # The push + the og/data offload script are continue-on-error / internally
      # non-fatal (failure → those assets ship in the artifact as before). Only the
      # boot-critical dist/assets delete is fail-safe-by-failing (see its step).
      #
      # Auth: SSH deploy key (write-only to frontaliere-cdn) in secret
      # CDN_DEPLOY_KEY — least privilege, cannot touch any other repo.
      - name: Push generated assets to CDN repo (frontaliere-cdn / Pages)
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${CDN_DEPLOY_KEY:-}" ]; then
            echo "no CDN_DEPLOY_KEY secret — skipping CDN push, assets stay in dist"; exit 0
          fi
          stage=/tmp/cdn-stage
          rm -rf "$stage" && mkdir -p "$stage"
          : > "$stage/.nojekyll"                              # serve every path verbatim, skip Jekyll
          printf 'cdn.frontaliereticino.ch' > "$stage/CNAME"  # keep custom domain (force-push would else wipe it)
          # Offloadable dirs: og cards, ALL runtime data JSON, the bundler assets
          # (JS/CSS) whose URLs renderBuiltUrl already rebased to the CDN, and the
          # git-tracked full blog heroes (served at cdn.frontaliereticino.ch/images/
          # blog; finalize plugin already rewrote HTML + deleted dist heroes, so we
          # push from the public/ source). The build-generated 480w thumbnails are
          # written to public/images/blog/thumbnails/ by generate-image-thumbnails.mjs
          # (gitignored but on disk at push time), so the public/images/blog copy
          # below ALREADY pushes them to ${CDN}/images/blog/thumbnails/ — the offload
          # script then deletes the dist copy of dist/images/blog/thumbnails.
          [ -d dist/og ]           && cp -r dist/og           "$stage/og"
          [ -d dist/data ]         && cp -r dist/data         "$stage/data"
          [ -d dist/assets ]       && cp -r dist/assets       "$stage/assets"
          [ -d public/images/blog ] && mkdir -p "$stage/images" && cp -r public/images/blog "$stage/images/blog"
          if [ ! -d "$stage/og" ] && [ ! -d "$stage/data" ] && [ ! -d "$stage/assets" ] && [ ! -d "$stage/images" ]; then
            echo "no offloadable assets present — skipping CDN push"; exit 0
          fi
          printf '<!doctype html><meta charset=utf-8><title>frontaliereticino.ch CDN</title>frontaliereticino.ch asset CDN' > "$stage/index.html"
          keyfile="$RUNNER_TEMP/cdn_deploy_key"
          printf '%s\n' "$CDN_DEPLOY_KEY" > "$keyfile" && chmod 600 "$keyfile"
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # ── Additive assets/ (anti-clobber) ──────────────────────────────────
          # The bundler assets/ are CONTENT-HASHED (index-*.js / App-*.js etc) and
          # therefore immutable: a given hash always holds identical bytes. The old
          # force-push replaced the whole CDN repo each deploy, DELETING the entry
          # hashes still referenced by the currently-live HTML — which, for the
          # ~13 GB Pages site, keeps serving the previous build for the 10-20 min
          # the new publish takes to propagate (and longer on a rollback). Result:
          # live HTML → 404 on its own JS → SPA dead (prod outage 2026-06-04).
          # Fix: carry forward the prior CDN assets/ and merge the new build ON TOP
          # (cp -n never overwrites a freshly-built file), so old + new hashes
          # coexist and any in-flight HTML keeps booting. og/data/images are
          # same-path and fully refreshed above (overwrite is correct for them).
          # Sparse + blob:none keeps the clone to the small assets/ tree only.
          if [ -d "$stage/assets" ]; then
            prev="$RUNNER_TEMP/cdn-prev"; rm -rf "$prev"
            if git clone --depth 1 --filter=blob:none --sparse \
                 git@github.com:valerielinc-ops/frontaliere-cdn.git "$prev" 2>/dev/null; then
              git -C "$prev" sparse-checkout set assets 2>/dev/null || true
              if [ -d "$prev/assets" ]; then
                cp -rn "$prev/assets/." "$stage/assets/" 2>/dev/null || true
                echo "additive CDN: carried forward prior assets/ (now $(ls -1 "$stage/assets" | wc -l) files)"
              fi
            else
              echo "additive CDN: no prior CDN clone (first push / transient) — proceeding with new assets only"
            fi
            rm -rf "$prev"
          fi
          echo "CDN payload: $(du -sh "$stage" | cut -f1)"
          # Flag if the CDN repo nears the GitHub Pages ~1 GB published-site soft limit.
          # With additive assets/ the payload grows slowly across deploys (only NEW
          # hashes accumulate; data/og/images are refreshed, not stacked). A separate
          # zero-Claude janitor cron prunes assets/ hashes no longer referenced by
          # any live sitemap page once past a grace window (follow-up).
          payload_bytes="$(du -sb "$stage" | cut -f1)"
          if [ "$payload_bytes" -gt 950000000 ]; then
            echo "::warning::CDN payload ${payload_bytes} bytes (>950 MB) — approaching GitHub Pages ~1 GB soft limit; run the CDN assets/ janitor or split (e.g. keep blog heroes on jsDelivr)"
          fi
          cd "$stage"
          git init -q
          git checkout -q -b main
          git config user.email "deploy-bot@frontaliereticino.ch"
          git config user.name "deploy-bot"
          git add -A
          git commit -qm "cdn assets (og + data + additive assets) ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"
          # Force-push a single fresh commit → CDN repo history never accumulates.
          # Content is additive (prior assets/ merged above), so the force-push no
          # longer clobbers in-flight entry hashes — it just flattens history.
          if git push -f git@github.com:valerielinc-ops/frontaliere-cdn.git main; then
            echo "CDN_BASE=https://cdn.frontaliereticino.ch" >> "$GITHUB_ENV"
            echo "✅ pushed assets to frontaliere-cdn"
          else
            echo "⚠️ CDN push failed — offload skipped, og/data stay in dist"
          fi
          rm -f "$keyfile"

      - name: Offload og refs + data base into dist (non-fatal)
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        run: node scripts/offload-generated-images-cdn.mjs

      # Boot-critical asset offload. The build already rebased Vite asset URLs to
      # the CDN (ASSET_CDN/renderBuiltUrl) → the artifact's HTML/JS point at
      # cdn.frontaliereticino.ch/assets/* with no same-origin fallback. BUILD-TIME
      # guards before deleting dist/assets (no live polling here — the CDN Pages
      # build lags the push, which made an inline poll a flaky false-negative that
      # blocked the whole build; the CDN-serves-live check now runs post-deploy in
      # validate-live, with the rollback job as the safety net):
      #   (A) FAIL the deploy if the push failed (CDN_BASE unset) — the Vite refs
      #       are already baked to the CDN with no fallback, so the artifact is
      #       broken; failing keeps the last good deploy live.
      #   (B) If ANY dist HTML still references a SAME-ORIGIN /assets/ path (a
      #       custom SSG emitter that didn't go through renderBuiltUrl), KEEP
      #       dist/assets (skip the delete) — non-fatal: those pages keep working
      #       same-origin while the Vite refs use the CDN. No artifact win this
      #       round, but nothing breaks.
      - name: Drop dist/assets after CDN push (build-time guards; live check in validate-live)
        if: github.event.inputs.profile_sequential != 'true'
        run: |
          set -uo pipefail
          [ -d dist/assets ] || { echo "no dist/assets — nothing to offload"; exit 0; }
          if [ -z "${CDN_BASE:-}" ]; then
            echo "::error::CDN push failed but dist/assets URLs are already rebased to the CDN (no fallback) — failing deploy (last good stays live)"; exit 1
          fi
          # Guard B: any surviving SAME-ORIGIN /assets/ reference in dist HTML?
          # Extension/path coverage is a SUPERSET of the offload script's Phase 3
          # (offloadAssetRefs ASSET_FILE) — else a same-origin ref of a type Phase 3
          # misses would also evade this guard and 404 after delete.
          if grep -rlE "[\"'(]/?assets/[^\"'() ]*\.(js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|webp|avif|gif|svg|ico|json)" --include='*.html' dist 2>/dev/null | head -1 | grep -q .; then
            echo "⚠️ some dist HTML still references same-origin /assets/ (not CDN-rebased) — KEEPING dist/assets (no breakage, no asset reduction this round)"
            exit 0
          fi
          freed="$(du -sh dist/assets | cut -f1)"
          rm -rf dist/assets
          echo "✅ no same-origin /assets/ refs survive; dropped dist/assets (${freed}) from artifact (CDN: ${CDN_BASE}/assets — verified live in validate-live)"

      - name: Capture pre-deploy sitemap URLs (for IndexNow diff)
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        run: node scripts/capture-deployed-sitemaps.mjs

      - name: Upload pre-deploy snapshot for post-deploy validation
        if: github.event.inputs.profile_sequential != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-snapshot-${{ github.run_id }}
          path: /tmp/pre-deploy-sitemap-urls.json
          retention-days: 1
          if-no-files-found: ignore

      # Pack the new sitemap URLs (extracted from dist/sitemap-*.xml) into
      # /tmp/new-sitemap-urls.json so validate-live can submit them to
      # IndexNow / Google Indexing API without scraping the live site or
      # downloading the 1.5 GB github-pages artifact. Bundled together
      # with the pre-deploy snapshot into a single small `sitemaps-`
      # artifact for convenience.
      - name: Pack new sitemap URLs from dist/
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const distDir = 'dist';
            if (!fs.existsSync(distDir)) {
              console.error('dist/ missing — skipping new-sitemap-urls.json');
              process.exit(0);
            }
            const files = fs.readdirSync(distDir)
              .filter(f => /^sitemap-.+\.xml\$/.test(f) && f !== 'sitemap-index.xml')
              .sort();
            const perSitemap = {};
            const all = new Set();
            for (const f of files) {
              const xml = fs.readFileSync(path.join(distDir, f), 'utf8');
              const urls = [...new Set([...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].trim()))].sort();
              perSitemap[f] = urls;
              for (const u of urls) all.add(u);
            }
            const out = {
              version: 2,
              capturedAt: new Date().toISOString(),
              source: 'dist',
              perSitemap,
              _allUrls: [...all].sort(),
            };
            fs.writeFileSync('/tmp/new-sitemap-urls.json', JSON.stringify(out));
            console.log('📦 Packed ' + out._allUrls.length + ' new sitemap URLs across ' + Object.keys(perSitemap).length + ' files → /tmp/new-sitemap-urls.json');
          "

      - name: Stage sitemaps bundle (pre-deploy + new + build-id)
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/sitemaps-bundle
          cp -f /tmp/pre-deploy-sitemap-urls.json /tmp/sitemaps-bundle/ 2>/dev/null || true
          # build-id.txt is consumed by `wait-for-pages-propagation.mjs`
          # in validate-live to verify the live site is serving THIS deploy.
          # Bundling it here means validate-live can run without
          # downloading the 1.5 GB github-pages artifact.
          cp -f dist/build-id.txt /tmp/sitemaps-bundle/ 2>/dev/null || true
          cp -f /tmp/new-sitemap-urls.json /tmp/sitemaps-bundle/ 2>/dev/null || true
          ls -la /tmp/sitemaps-bundle/

      # Single small artifact (~tens of KB) consumed by validate-live for
      # IndexNow / Google Indexing diff. Lets validate-live skip the
      # 1.5 GB github-pages artifact entirely.
      - name: Upload sitemaps bundle artifact
        if: github.event.inputs.profile_sequential != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-${{ github.run_id }}
          path: /tmp/sitemaps-bundle/
          retention-days: 1
          if-no-files-found: ignore

      # Master source data for post-deploy validators. The deploy artifact
      # strips dist/data/jobs.json (jobsJsonDistCleanupPlugin, PR #712) and
      # offloads the rest of dist/data/ to the CDN repo, DELETING the
      # cdn-only copies from dist (offload-generated-images-cdn.mjs, PR
      # #1288) — to stay under the 10 GB GH Pages cap; runtime SPA fetches
      # the per-locale shards / CDN instead. Validators still read the
      # master source files from data/:
      #   • jobs.json                   — validate:translation-completeness
      #                                   (titleByLocale / descriptionByLocale)
      #   • jobs-crawler-summaries.json — validate:crawler-summaries
      #                                   (gitignored, assembled at build; its
      #                                   dist copy is CDN-offloaded + deleted)
      # so we upload both as one small dedicated artifact (retention 1d)
      # that post-deploy-validate-dist downloads back into data/.
      - name: Upload master source data for post-deploy validators
        if: github.event.inputs.profile_sequential != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-master-${{ github.run_id }}
          path: |
            data/jobs.json
            data/jobs-crawler-summaries.json
          retention-days: 1
          if-no-files-found: error

      # Post-build dist shrinker REMOVED 2026-05-22 (PR #480).
      # Originally added (PRs #473+#475+#476+#478) to recover ~190 MB
      # of HTML byte slop. After Round-2 source fixes:
      #   - htmlMinify.ts strips whitespace + comments + boolean attrs
      #     directly in every SEO build plugin
      #   - inlineTextToHtml strips inline style/class from imported
      #     job descriptions (Bachem MS-Word HTML pattern)
      #   - 3 dev pages purged from public/
      #   - tnum CSS-string quote bug fixed in editorialContent.ts
      # …dist-shrink saving collapsed to 32 MB (16 MB JSON + 16 MB
      # whitespace residue) at a cost of 28-35 min CI per deploy.
      # ROI = ~1 MB/min CI → not worth the wall-clock.
      #
      # The script + tests + npm scripts (`npm run dist:shrink`) are
      # kept for ad-hoc diagnostic runs ("how much could we save if we
      # re-enabled X?"). The per-rule + per-dir + per-locale + top-N
      # breakdowns remain a useful refactor compass when investigating
      # template bloat.
      #
      # ┌─ Pages artifact pipeline (two steps, one logical operation) ─┐
      # │                                                                │
      # │  Step A : tar dist/ as a plain UNCOMPRESSED archive            │
      # │  Step B : upload via upload-artifact@v7 with compression 9     │
      # │                                                                │
      # │  Why split:                                                    │
      # │  - actions/upload-pages-artifact@v5 does not expose            │
      # │    compression-level — it forwards path to upload-artifact     │
      # │    at the default level 6. With ~118k HTML pages the artifact  │
      # │    crosses the 1 GB Pages warning threshold, so we replicate   │
      # │    its internal tar manually and pass our own knobs to         │
      # │    upload-artifact@v7.                                         │
      # │                                                                │
      # │  Why this is NOT a parallel-gzipped tar:                       │
      # │  Two attempts to substitute `tar | pigz` and use compression-  │
      # │  level 0 on upload-artifact ended badly:                       │
      # │  - run 25308327381 (`pigz -1`): 1.6 GB artifact, exceeded the  │
      # │    1 GB Pages cap → "Deployment failed".                       │
      # │  - run 25309021889 (`pigz -9`): artifact dropped to 1.35 GB    │
      # │    but `actions/deploy-pages@v5` still failed with             │
      # │    "Deployment temporarily failed → Deployment failed". The    │
      # │    likely cause is that the Pages backend does NOT accept a    │
      # │    pre-gzipped tar inside the artifact zip — its extractor     │
      # │    expects uncompressed tar named `artifact.tar`, even though  │
      # │    a CLI `tar -xf` would auto-detect the gzip magic bytes.     │
      # │  Lesson: trade time for compatibility. Pages format is fixed   │
      # │  to plain tar, so we keep the tar uncompressed and let         │
      # │  upload-artifact compress at level 9.                          │
      # │                                                                │
      # │  Background: PATH 3 (tar in bg during post-build pool) was     │
      # │  tried in commit 11b65de81 and reverted — tar contended with   │
      # │  the 4 heaviest dist/-walking audits and net post-build went   │
      # │  +98s.                                                         │
      # └────────────────────────────────────────────────────────────────┘
      - name: Pack dist/ into Pages tar archive
        if: github.event.inputs.profile_sequential != 'true'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          # Surface size early so a regression past the 1 GB Pages
          # threshold is visible in the workflow log right after pack
          # (instead of only at the deploy-pages "Deployment failed"
          # tail) — the artifact size is the binding constraint.
          ls -lh "$RUNNER_TEMP/artifact.tar"
          # Export for downstream report step (Audit dist bytes).
          TAR_BYTES=$(stat -c %s "$RUNNER_TEMP/artifact.tar")
          echo "TAR_BYTES=$TAR_BYTES" >> "$GITHUB_ENV"

      # ┌────────────────────────────────────────────────────────────────┐
      # │ Audit dist bytes — attribute size per plugin/locale and append │
      # │ to data/dist-size-history.jsonl. Observability only: the step  │
      # │ NEVER blocks the upload. If GitHub Pages rejects the tar at    │
      # │ 10 GB the deploy fails downstream with the canonical error,    │
      # │ but we always attempt the upload so we can compare "did fit"   │
      # │ vs "tried and bounced" across runs.                            │
      # │ Cost: stat-only walk, < 30 s on ~470 k files.                  │
      # └────────────────────────────────────────────────────────────────┘
      - name: Audit dist bytes (per-plugin report)
        if: github.event.inputs.profile_sequential != 'true'
        run: |
          node scripts/report-dist-bytes-by-plugin.mjs \
            --dist=dist \
            --tar-size-bytes="${TAR_BYTES}" \
            --run-id="${GITHUB_RUN_ID}" \
            --sha="${GITHUB_SHA}"

      # Maintain data/url-first-seen.json — stamps every URL that
      # appears in dist sitemaps with today's date the first time we
      # see it. Consumed by build-plugins/shared/trafficEvidenceFilter.ts
      # for the minAgeDays grace window (currently 15 d for every
      # approved pattern). Stat-only walk over sitemap-*.xml files (<5 s
      # even on the full dist). Commit handled in the dist-history step
      # below so we don't double-push.
      - name: Refresh url-first-seen (grace-window seed)
        if: github.event.inputs.profile_sequential != 'true'
        run: node scripts/refresh-url-first-seen.mjs --dist=dist

      # Persist the JSONL row the audit script just appended on the runner.
      # The deploy workflow runs on every push to main, so this is roughly
      # one append per deploy. Retries on push to absorb the rare race when
      # two builds finish near-simultaneously (typically resolved by the
      # rebase since each appends a distinct line keyed on runId).
      - name: Commit dist-size-history row + url-first-seen updates
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet -- data/dist-size-history.jsonl data/url-first-seen.json; then
            echo "[dist-history] no diff to commit"
            exit 0
          fi
          git config user.name "dist-history-bot"
          git config user.email "dist-history-bot@frontaliereticino.ch"
          git add data/dist-size-history.jsonl data/url-first-seen.json
          git commit -m "chore(dist-history): append run ${GITHUB_RUN_ID} (${GITHUB_SHA::8})"
          # The build job leaves dist/ and other generated files dirty
          # in the working tree. `git pull --rebase` refuses to run
          # while unstaged changes exist (`cannot pull with rebase: You
          # have unstaged changes`), so we ran the retry loop three
          # times for nothing on every deploy and the url-first-seen
          # update never landed on origin. `rebase.autoStash=true`
          # stashes those untracked/unstaged files before rebase and
          # pops them back after — purely scoped to this command, no
          # leftover stash state.
          # Bumped 3 → 5 attempts + geometric-ish backoff
          # (5/10/15/25/40 s) after annotation on run 26604491084 (and
          # every prior deploy): `[dist-history] push failed after 3
          # attempts`. Concurrent producers on main (crawlers +
          # thin-promotions + fuel + weather + post-merge auto-commits)
          # regularly out-race a 3×5 s window. The extended budget hits
          # a ~95 s total wait before giving up, which empirically
          # covers every observed conflict cluster on the main branch.
          for i in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main \
                && git push origin HEAD:main; then
              echo "[dist-history] pushed on attempt $i"
              exit 0
            fi
            case "$i" in
              1) sleep 5 ;;
              2) sleep 10 ;;
              3) sleep 15 ;;
              4) sleep 25 ;;
              5) sleep 40 ;;
            esac
          done
          echo "::warning::[dist-history] push failed after 5 attempts — url-first-seen.json will not be available to the next build's grace-window check"

      # ┌────────────────────────────────────────────────────────────────┐
      # │ EXPERIMENT (opt-in, reversible) — branch-based publish viability │
      # │ The actions/deploy-pages path caps Pages status-polling at 10    │
      # │ min; with a ~13 GB dist (1.53 GB artifact) every recent deploy   │
      # │ hit "Timeout reached, aborting!" → 0/100 runs published. Legacy  │
      # │ "deploy from branch" has no such artifact-polling cap. Before    │
      # │ switching the production Pages source we must confirm GitHub     │
      # │ even ACCEPTS a 13 GB git push. This step force-pushes dist/ as a │
      # │ single orphan commit to `gh-pages-test` (a throwaway branch) —   │
      # │ `git init` inside dist/ keeps it a standalone tree, so the main  │
      # │ repo history is NOT bloated and nothing is published (Pages      │
      # │ source is untouched). Read the wall time + exit status to decide.│
      # └────────────────────────────────────────────────────────────────┘
      - name: "[experiment] Orphan force-push dist/ to gh-pages-test"
        if: github.event_name == 'workflow_dispatch' && inputs.publish_branch_test == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "dist size: $(du -sh dist | cut -f1), files: $(find dist -type f | wc -l)"
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages-test
          git config user.email "deploy-bot@frontaliereticino.ch"
          git config user.name "deploy-bot"
          git add -A
          git commit -qm "experiment: branch-based publish ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"
          echo "Pushing $(du -sh . | cut -f1) as a single orphan commit to gh-pages-test..."
          time git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages-test
          echo "✅ 13 GB branch push SUCCEEDED — legacy branch-based Pages deploy is viable"

      - name: Upload Pages artifact (compression-level 9)
        if: github.event.inputs.profile_sequential != 'true'
        id: upload-pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          # Level 9 = max deflate compression on the zip envelope. Pages
          # backend extracts the zip first, so our content gets the best
          # compression ratio in transit (~970 MB vs ~1.21 GB at level 6).
          compression-level: 9

      - name: Upload write-collisions analysis
        if: always() && github.event.inputs.profile_sequential != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Detect previous-slug winners changes
        if: github.event.inputs.profile_sequential != 'true'
        id: winners_changed
        run: |
          if git diff --quiet -- data/previous-slug-winners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous-slug winners for post-deploy validation
        if: github.event.inputs.profile_sequential != 'true' && steps.winners_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winners-${{ github.run_id }}
          path: data/previous-slug-winners.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Report failure to GitHub Issues (build)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --description "## Build fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve build GitHub Issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build succeeded → close the canonical "CI Failure (build)" issue if
          # open. Paired with --reopen-within-hours 6 on the reporter above so the
          # close↔reopen cycle stays on ONE canonical issue (no per-run storm,
          # no stale issue while green). Idempotent no-op when nothing is open.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ───────────────────────────────────────────────────────────────────────
  # deploy: publish dist/ to GitHub Pages (actions/deploy-pages reads the
  # `github-pages` artifact from this run automatically). Inherits the
  # `pages-deploy` concurrency group so build+deploy together hold the
  # serial Pages lock for the upload+publish sequence — but each job
  # individually rilascia la lock when complete.
  #
  # ⚠️ KNOWN FUNNEL-CRITICAL GAP — issue #987: at the current site scale
  # (~13 GB / ~470k files) actions/deploy-pages aborts at its 10-min polling
  # cap, so this job goes RED even though GitHub Pages often finishes the
  # publish server-side afterwards. Because validate-live / publish are gated
  # on `needs: deploy` + success(), a red deploy means the post-deploy steps
  # (Google Indexing API + IndexNow + GSC, previous-slug-winners sync, and
  # last_known_good marking) NEVER run. Branch-based deploy was tried and
  # reverted (#966 → #986: the legacy branch build fails outright on 13 GB).
  # The real fix lives in #987 (server-side extended polling and/or reducing
  # deploy congestion), NOT in reducing site size or changing host.
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    if: |
      success() &&
      github.event.inputs.profile_sequential != 'true'
    # Concurrency lock applies HERE only — `actions/deploy-pages@v5` is
    # the singleton: GitHub Pages allows one active deployment at a time
    # repo-wide. Build (above) has no concurrency so multiple builds
    # progress in parallel; the lock is acquired only at the publish
    # boundary.
    #
    # cancel-in-progress: false is best-effort: GitHub Actions caps the
    # group at 1 running + 1 pending. When a third deploy enters, the
    # PREVIOUSLY-pending one gets cancelled (i.e. the middle one in a
    # burst is dropped, the first and last survive). For a cron-driven
    # site where the latest deploy already contains everything from the
    # missed intermediate ones, this is the desired behaviour.
    concurrency:
      group: 'pages-deploy'
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      deployments: read   # the extended server-side poll reads /deployments + /statuses
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_first.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        # 0-tolerance gate: blocks the deploy if any tracked file contains
        # unresolved <<<<<<< / ======= / >>>>>>> markers. Added after the
        # 2026-05-21 incident where a concurrent cron committed 92 job slice
        # files with raw `git stash pop` conflicts. assemble-jobs-dataset.mjs
        # silently skipped them and production shipped with 2603 jobs
        # instead of 5922 (-57%). Runs ~3s, fails fast before any expensive
        # build step.
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      # Reset a stuck Pages `errored` state BEFORE publishing. After bursts of
      # failed/cancelled deployments GitHub Pages can latch into status=errored
      # and then refuse to ACTIVATE even successful deployments → the site
      # freezes on an old build (prod outage 2026-06-05). Clearing the state
      # first lets THIS deploy's deployment activate. Conditional: no-op unless
      # currently errored, so healthy deploys are untouched. Tries the safe
      # build request first, then a build_type toggle (transient, via the
      # existing gh-pages branch) only if still errored.
      - name: Reset Pages errored state (only if stuck)
        if: github.event.inputs.profile_sequential != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          R="${GITHUB_REPOSITORY}"
          st=$(gh api "repos/$R/pages" --jq '.status // "?"' 2>/dev/null || echo "?")
          echo "pages status before publish: $st"
          if [ "$st" != "errored" ]; then echo "not errored — no reset needed"; exit 0; fi
          echo "::warning::Pages stuck 'errored' — resetting so this deploy can activate"
          gh api -X POST "repos/$R/pages/builds" >/dev/null 2>&1 || true
          sleep 15
          st=$(gh api "repos/$R/pages" --jq '.status // "?"' 2>/dev/null || echo "?")
          echo "after safe reset: $st"
          if [ "$st" = "errored" ]; then
            echo "toggling build_type legacy(gh-pages) -> workflow"
            printf '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' | gh api -X PUT "repos/$R/pages" --input - >/dev/null 2>&1 || true
            sleep 8
            printf '{"build_type":"workflow"}' | gh api -X PUT "repos/$R/pages" --input - >/dev/null 2>&1 || true
            sleep 10
            st=$(gh api "repos/$R/pages" --jq '.status // "?"' 2>/dev/null || echo "?")
            echo "after toggle: $st"
          fi
          [ "$st" = "errored" ] && echo "::warning::still errored after reset — deploy may not activate; manual unstick-pages may be needed" || echo "✅ pages state cleared"

      # GitHub Pages allows only one deployment at a time. When concurrent
      # pushes trigger this workflow, the second run can hit "in progress
      # deployment" errors. Retry once after a short wait to handle this.
      #
      # `actions/deploy-pages@v5` ALSO caps its internal status polling at
      # 10 minutes (the `timeout: 1800000` we pass is silently clamped to
      # 600000 — see the warning emitted at start of the step). For sites
      # with >1M files the Pages backend's `syncing_files` phase can run
      # well past 10 minutes, causing the action to abort with
      # `Timeout reached, aborting!` even though the deployment itself
      # eventually completes server-side. The deployment-status extended
      # poll below recognises that case and keeps the job green when Pages
      # reports the publish succeeded.
      - name: Deploy to GitHub Pages
        id: deployment_first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000
          error_count: 100

      - name: Wait for previous Pages deployment to finish
        if: steps.deployment_first.outcome == 'failure'
        run: |
          echo "::warning::First deploy attempt failed (likely Pages busy or 10-minute polling cap). Retrying in 30s..."
          sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000
          error_count: 100

      # actions/deploy-pages aborts at its 10-min polling cap (clamped from our
      # `timeout: 1800000`), but for a ~13 GB / ~470k-file site GitHub Pages
      # finishes publishing SERVER-SIDE afterwards. Proven 2026-05-30: run
      # 26665087347 went red at the cap, yet ~32 min later the github-pages
      # deployment for its sha reached state=success and the live build-id
      # advanced (1780052190433 → 1780096323338). So a double action-failure is
      # NOT a real deploy failure — it just means the publish is still syncing.
      #
      # The earlier extended-poll was removed for using a 25-min window (too
      # short) and matching the wrong signal (live SHA, which is a build-id
      # timestamp, never equals github.sha). This version polls the github-pages
      # DEPLOYMENT(s) for THIS sha for up to 40 min and goes GREEN when Pages
      # reports success — so validate-live → publish (IndexNow, Google Indexing
      # API, GSC, previous-slug-winners sync, last_known_good) finally run
      # (issue #987).
      #
      # ONLY `success` is a terminal GREEN. The action emits two attempts
      # (deployment_first + retry) → two Deployment objects per sha; on abort at
      # the 10-min cap it may stamp a transient `error`/`failure`/cancel status
      # BEFORE Pages finishes server-side. So `error`/`failure` are NOT treated
      # as terminal — we keep polling (a genuinely failed publish simply never
      # reaches success and falls through to the 40-min deadline → red, slow but
      # correct). We check ALL deployments for the sha and succeed if ANY is
      # success; we give up early only when EVERY deployment for the sha is
      # `inactive` (definitively superseded by a newer deploy that carries the
      # same content).
      - name: Wait for server-side Pages publish (extended, beyond the 10-min action cap)
        if: steps.deployment_first.outcome == 'failure' && steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 40*60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&sha=${GITHUB_SHA}&per_page=20" --jq '.[].id' 2>/dev/null || echo "")
            if [ -n "$ids" ]; then
              any_active=0
              for d in $ids; do
                st=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${d}/statuses?per_page=1" --jq '.[0].state // empty' 2>/dev/null || echo "")
                echo "$(date -u +%H:%M:%S) github-pages deployment ${d} state=${st:-<none>}"
                if [ "$st" = "success" ]; then
                  echo "✅ GitHub Pages completed the publish server-side (after the action's 10-min cap)."
                  exit 0
                fi
                # error/failure/in_progress/pending/<none> may still reach success → keep waiting
                if [ "$st" != "inactive" ]; then any_active=1; fi
              done
              if [ "$any_active" = "0" ]; then
                echo "::warning::All github-pages deployments for ${GITHUB_SHA} are inactive (superseded by a newer deploy) — not waiting further."
                exit 1
              fi
            else
              echo "$(date -u +%H:%M:%S) no github-pages deployment for ${GITHUB_SHA} yet — waiting"
            fi
            sleep 60
          done
          echo "::error::GitHub Pages did not report success within 40 min for ${GITHUB_SHA} (publish stuck or genuinely failed)."
          exit 1

      - name: Save deploy metadata to Firestore
        if: success()
        env:
          ARTICLE_ID: ${{ github.event.inputs.article_id }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          OG_TITLE: ${{ github.event.inputs.og_title }}
          OG_DESCRIPTION: ${{ github.event.inputs.og_description }}
          OG_IMAGE: ${{ github.event.inputs.og_image }}
          ARTICLE_CATEGORY: ${{ github.event.inputs.article_category }}
        run: |
          node scripts/deploy-registry.mjs save \
            --run-id="${{ github.run_id }}" \
            --sha="${{ github.sha }}" \
            --trigger="${{ github.event_name }}" \
            --article-id="${ARTICLE_ID}" \
            --article-url="${ARTICLE_URL}" \
            --og-title="${OG_TITLE}" \
            --og-description="${OG_DESCRIPTION}" \
            --og-image="${OG_IMAGE}" \
            --article-category="${ARTICLE_CATEGORY}"

      - name: Report failure to GitHub Issues (deploy)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure (deploy): ${{ github.workflow }}" \
            --description "## Deploy fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve deploy GitHub Issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deploy succeeded → close the canonical "CI Failure (deploy)" issue if
          # open. Paired with --reopen-within-hours 6 above so close↔reopen stay
          # on ONE canonical issue. Idempotent no-op when nothing is open.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (deploy): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ───────────────────────────────────────────────────────────────────────
  # validate-dist: dist-side gates (bfs-depth, text-html-ratio, ...).
  # Runs in PARALLEL with `deploy` — only needs `build` (the artifact).
  # ───────────────────────────────────────────────────────────────────────
  validate-dist:
    needs: build
    if: |
      success() &&
      github.event.inputs.profile_sequential != 'true'
    uses: ./.github/workflows/post-deploy-validate-dist.yml
    with:
      deploy_run_id: ${{ github.run_id }}
      deploy_event_name: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: read    # checkout
      actions: read     # download-artifact same-run
      issues: write     # github-issue-creator on validation failure (PR #772 added to the called job; must be declared at this caller too or the reusable workflow startup_failures)

  # ───────────────────────────────────────────────────────────────────────
  # validate-live: live smoke + social posting + indexing submission.
  # Needs `deploy` to have published the new dist before fetching live.
  # ───────────────────────────────────────────────────────────────────────
  validate-live:
    needs: deploy
    if: |
      success() &&
      github.event.inputs.profile_sequential != 'true'
    uses: ./.github/workflows/post-deploy-validate-live.yml
    with:
      deploy_run_id: ${{ github.run_id }}
      deploy_event_name: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: write   # sync previous-slug winners (git push)
      actions: read     # download small artifacts (sitemaps, winners)
      issues: write     # github-issue-creator on validation failure (PR #772 added to the called job; must be declared at this caller too or the reusable workflow startup_failures)

  # ───────────────────────────────────────────────────────────────────────
  # publish: side-effects + mark last_known_good. Runs ONLY when build,
  # deploy, validate-dist, AND validate-live have all succeeded.
  #
  # Side-effects covered:
  #   - Sync previous-slug-winners.json (git push)
  #   - Post to Facebook + LinkedIn (workflow_dispatch only)
  #   - Submit URLs to Google Indexing API + IndexNow + GSC
  #   - Mark this run as last_known_good (rollback target)
  #
  # Why gated AFTER validate-dist (not just deploy): these are
  # IRREVERSIBLE. If validate-dist failed AFTER validate-live succeeded,
  # rollback fired but FB/LinkedIn had already announced URLs that now
  # point to the rolled-back dist (mismatch or 404). IndexNow had pinged
  # Bing on the bad-dist URLs, baking the bad version into search engines.
  #
  # Marking last_known_good is also part of publish so a failed
  # validate-dist can never accidentally mark a bad dist as the rollback
  # target (the original 25431484293 self-rollback bug).
  # ───────────────────────────────────────────────────────────────────────
  publish:
    needs: [deploy, validate-dist, validate-live]
    if: |
      success() &&
      github.event.inputs.profile_sequential != 'true'
    uses: ./.github/workflows/post-deploy-publish.yml
    with:
      deploy_run_id: ${{ github.run_id }}
      deploy_event_name: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: write   # sync previous-slug winners (git push)
      actions: read     # download small artifacts (sitemaps, winners)
      issues: write     # github-issue-creator on publish failure (PR #772 added to the called job; must be declared at this caller too or the reusable workflow startup_failures)

  # ───────────────────────────────────────────────────────────────────────
  # rollback: revert Pages to last_known_good if either validate fails for a
  # reason that means the LIVE SITE IS BAD.
  # Still-live guard: skip rollback if a newer deploy has already replaced
  # ours on Pages — the bad version is gone, no need to clobber the new
  # good one.
  #
  # NOT a rollback trigger: validate-live `propagation_timeout`. That means our
  # build-id never went live within the window (Pages publish backlog under
  # deploy congestion) — but the live site is an OLDER VALID build the whole
  # time, not broken. Rolling back to an even-older last_known_good would only
  # regress the site and add another publish to the backlog (the thrash that
  # wedged every deploy during the 2026-05-30 dispatch storm). So we gate
  # rollback OFF when validate-live's ONLY failure reason is propagation_timeout;
  # the next deploy lands normally once Pages drains. A genuine live-broken
  # failure (5xx / e2e / CLS / visual) leaves failure_kind empty → rollback fires.
  # ───────────────────────────────────────────────────────────────────────
  rollback:
    needs: [deploy, validate-dist, validate-live]
    if: |
      always() &&
      (needs.validate-dist.result == 'failure' ||
       (needs.validate-live.result == 'failure' && needs.validate-live.outputs.failure_kind != 'propagation_timeout')) &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # `actions: write` is required so the rollback can DELETE the failed
      # build's `github-pages` artifact before re-uploading the last-known-good
      # one — otherwise actions/deploy-pages@v5 sees two artifacts with the
      # same name in the same run and fails with "Multiple artifacts named
      # 'github-pages' were unexpectedly found for this workflow run."
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.rollback_deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # See post-deploy-validate-dist.yml: same OOM root cause on rollback —
      # downloading the last-known-good github-pages artifact (~1.8 GB) on top
      # of the failed run's leftovers blows the 14 GB partition. Reclaim
      # preinstalled SDKs before any heavy I/O.
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        # 0-tolerance gate: blocks the deploy if any tracked file contains
        # unresolved <<<<<<< / ======= / >>>>>>> markers. Added after the
        # 2026-05-21 incident where a concurrent cron committed 92 job slice
        # files with raw `git stash pop` conflicts. assemble-jobs-dataset.mjs
        # silently skipped them and production shipped with 2603 jobs
        # instead of 5922 (-57%). Runs ~3s, fails fast before any expensive
        # build step.
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      # Validate-dist + validate-live run concurrently with the next
      # deploy's build. By the time this rollback fires, a newer deploy
      # may already be live on Pages — reverting our (failed) deploy
      # would clobber a valid newer one. Check the live Pages deployment
      # SHA before proceeding.
      - name: Verify our deploy is still live (still-live guard)
        id: still-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          live_sha=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" \
            --jq '.[0].sha // empty')
          my_sha="${{ github.sha }}"
          echo "Live Pages deployment SHA: ${live_sha:-(unknown)}"
          echo "My deploy SHA:             $my_sha"
          if [ -z "$live_sha" ]; then
            echo "::warning::Could not resolve live deployment SHA — proceeding with rollback as best-effort"
            echo "still_live=true" >> "$GITHUB_OUTPUT"
          elif [ "$live_sha" = "$my_sha" ]; then
            echo "✅ My deploy is still live — rollback is the right action."
            echo "still_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ A newer deploy ($live_sha) has already replaced mine on Pages."
            echo "   Rollback is a no-op — skipping. The newer deploy already removed the bad version."
            echo "still_live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get last known good deploy
        if: steps.still-live.outputs.still_live == 'true'
        id: last-good
        run: |
          DATA=$(node scripts/deploy-registry.mjs get-good 2>/dev/null || echo '{}')
          RUN_ID=$(echo "$DATA" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).runId||'')}catch{console.log('')}})")
          SHA=$(echo "$DATA" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch{console.log('')}})")
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No last_known_good found in Firestore — cannot rollback."
          else
            echo "Rolling back to run $RUN_ID (sha $SHA)"
          fi

      - name: Fail if no last known good deploy is available
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id == ''
        run: |
          echo "::error::No last_known_good deploy found in Firestore. Cannot perform rollback."
          exit 1

      # Cross-run download. Pin to the SPECIFIC artifact id (resolved via
      # gh api) to avoid the "Multiple artifacts named github-pages were
      # unexpectedly found for this workflow run" error that
      # actions/download-artifact@v5 throws when the source run had both
      # a deploy AND a self-rollback (which uploads a second
      # `github-pages` artifact for re-publishing).
      - name: Resolve last-good github-pages artifact id
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != ''
        id: last-good-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pick the FIRST `github-pages` (oldest = the original deploy
          # upload, not a later rollback re-upload).
          artifact_id=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ steps.last-good.outputs.run-id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")] | sort_by(.created_at) | .[0].id // empty')
          if [ -z "$artifact_id" ]; then
            # GitHub Pages artifacts have a 1-hour retention by default;
            # when the last-known-good is older than that, the artifact is
            # gone and we cannot fast-rollback by re-uploading. Surface a
            # warning, leave `id` empty, and let the next step dispatch a
            # fresh build at the last-known-good SHA as the slow-path
            # fallback. Incident 2026-05-28 (validation run 10723) wedged
            # prod for hours because this branch used to `exit 1`.
            echo "::warning::No github-pages artifact in run ${{ steps.last-good.outputs.run-id }} (likely expired past 1h Pages retention) — will dispatch fresh deploy at last-good SHA"
            echo "id=" >> "$GITHUB_OUTPUT"
          else
            echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
            echo "Resolved last-good github-pages artifact id: $artifact_id"
          fi

      # Slow-path rollback: dispatch a fresh `Deploy to GitHub Pages`
      # workflow_dispatch run pinned to the last-known-good SHA. Used when
      # the artifact-fast-path above couldn't find the artifact (expired
      # past Pages' 1-hour retention). Re-runs the full build (~10-15 min)
      # but produces a guaranteed-good dist that is independent of artifact
      # retention windows.
      - name: Dispatch fresh deploy at last-known-good SHA (fallback when artifact expired)
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id == '' && steps.last-good.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching deploy.yml at last-known-good SHA ${{ steps.last-good.outputs.sha }}"
          gh workflow run deploy.yml --ref ${{ steps.last-good.outputs.sha }} \
            || {
              echo "::error::Failed to dispatch fresh deploy at last-known-good SHA. Manual recovery required: gh workflow run deploy.yml --ref ${{ steps.last-good.outputs.sha }}"
              exit 1
            }
          echo "Fresh deploy dispatched. Watch: https://github.com/${{ github.repository }}/actions/workflows/deploy.yml"

      - name: Download last known good GitHub Pages artifact (by id)
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ./rollback-archive
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ steps.last-good-artifact.outputs.id }}/zip" \
            > ./rollback-archive/__artifact.zip
          unzip -q -o ./rollback-archive/__artifact.zip -d ./rollback-archive
          rm -f ./rollback-archive/__artifact.zip

      - name: Reconstruct rollback site from downloaded Pages artifact
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id != ''
        run: |
          test -f ./rollback-archive/artifact.tar
          mkdir -p ./rollback-dist
          tar -xf ./rollback-archive/artifact.tar -C ./rollback-dist

      # The build job uploaded its own "github-pages" artifact (the failed
      # dist). actions/upload-pages-artifact@v5 always uses the name
      # "github-pages", and actions/deploy-pages@v5 queries by NAME (not
      # id), so a second upload here would surface "Multiple artifacts
      # named 'github-pages'" and fail the rollback. Delete the build's
      # artifact first via the REST API before re-uploading the good one.
      - name: Delete failed deploy's github-pages artifact (so rollback can re-upload)
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The build job in THIS run uploaded a github-pages artifact.
          # If there are multiple (rare), delete them all to leave the
          # run with a clean slate before the rollback re-upload.
          ids=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages") | .id] | .[]')
          if [ -z "$ids" ]; then
            echo "No existing github-pages artifact in this run — nothing to delete."
          else
            for id in $ids; do
              echo "Deleting failed-build artifact id=$id"
              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/artifacts/$id"
            done
          fi

      - name: Re-upload last known good artifact for Pages
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./rollback-dist

      - name: Deploy last known good to GitHub Pages
        if: steps.still-live.outputs.still_live == 'true' && steps.last-good.outputs.run-id != '' && steps.last-good-artifact.outputs.id != ''
        id: rollback_deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          error_count: 100

      - name: Report rollback to GitHub Issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.still-live.outputs.still_live }}" != "true" ]; then
            MSG="## Rollback skippato (newer deploy already live)
          **Validation run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Last good (NOT rolled back):** ${{ steps.last-good.outputs.run-id }}"
          elif [ "${{ steps.rollback_deploy.outcome }}" = "success" ]; then
            MSG="## Rollback eseguito (artifact fast-path)
          **Rollback a run:** ${{ steps.last-good.outputs.run-id }} (sha ${{ steps.last-good.outputs.sha }})
          **Validation run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ -z "${{ steps.last-good-artifact.outputs.id }}" ] && [ -n "${{ steps.last-good.outputs.sha }}" ]; then
            MSG="## Rollback via fresh deploy (slow-path: artifact expired)
          **Dispatched fresh build at sha:** ${{ steps.last-good.outputs.sha }} (last-good run ${{ steps.last-good.outputs.run-id }})
          **Validation run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pages artifact past 1h retention — full rebuild in progress (~10-15 min)."
          else
            MSG="## Rollback fallito
          **Tentato rollback a run:** ${{ steps.last-good.outputs.run-id }} (sha ${{ steps.last-good.outputs.sha }})
          **Validation run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          node scripts/lib/github-issue-creator.mjs \
            --title "Rollback: post-deploy" \
            --description "$MSG" \
            --priority 1 \
            --label Bug \
            --workflow "Post-deploy Rollback"
