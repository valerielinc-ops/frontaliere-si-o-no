          SHARD_OBVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_IT_DEPLOY_KEY }}
          SHARD_OBVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_EN_DEPLOY_KEY }}
          SHARD_OBVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_DE_DEPLOY_KEY }}
          SHARD_OBVALDO_FR_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_FR_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_IT_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_EN_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_DE_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_FR_DEPLOY_KEY }}
          SHARD_SOLETTA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_IT_DEPLOY_KEY }}
          SHARD_SOLETTA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_EN_DEPLOY_KEY }}
          SHARD_SOLETTA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_DE_DEPLOY_KEY }}
          SHARD_SOLETTA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_FR_DEPLOY_KEY }}
          SHARD_SVITTO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_IT_DEPLOY_KEY }}
          SHARD_SVITTO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_EN_DEPLOY_KEY }}
          SHARD_SVITTO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_DE_DEPLOY_KEY }}
          SHARD_SVITTO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_FR_DEPLOY_KEY }}
          SHARD_TURGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_IT_DEPLOY_KEY }}
          SHARD_TURGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_EN_DEPLOY_KEY }}
          SHARD_TURGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_DE_DEPLOY_KEY }}
          SHARD_TURGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_FR_DEPLOY_KEY }}
          SHARD_URI_IT_DEPLOY_KEY: ${{ secrets.SHARD_URI_IT_DEPLOY_KEY }}
          SHARD_URI_EN_DEPLOY_KEY: ${{ secrets.SHARD_URI_EN_DEPLOY_KEY }}
          SHARD_URI_DE_DEPLOY_KEY: ${{ secrets.SHARD_URI_DE_DEPLOY_KEY }}
          SHARD_URI_FR_DEPLOY_KEY: ${{ secrets.SHARD_URI_FR_DEPLOY_KEY }}
          SHARD_VAUD_IT_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_IT_DEPLOY_KEY }}
          SHARD_VAUD_EN_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_EN_DEPLOY_KEY }}
          SHARD_VAUD_DE_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_DE_DEPLOY_KEY }}
          SHARD_VAUD_FR_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_FR_DEPLOY_KEY }}
          SHARD_VALLESE_IT_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_IT_DEPLOY_KEY }}
          SHARD_VALLESE_EN_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_EN_DEPLOY_KEY }}
          SHARD_VALLESE_DE_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_DE_DEPLOY_KEY }}
          SHARD_VALLESE_FR_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_FR_DEPLOY_KEY }}
          SHARD_ZUGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_IT_DEPLOY_KEY }}
          SHARD_ZUGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_EN_DEPLOY_KEY }}
          SHARD_ZUGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_DE_DEPLOY_KEY }}
          SHARD_ZUGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_FR_DEPLOY_KEY }}
          SHARD_SANGALLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_IT_DEPLOY_KEY }}
          SHARD_SANGALLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_EN_DEPLOY_KEY }}
          SHARD_SANGALLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_DE_DEPLOY_KEY }}
          SHARD_SANGALLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_FR_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          SHARD_PUSH_MODE: ${{ vars.SHARD_PUSH_MODE == 'delta' && 'delta' || 'full' }}
          # Off unless the repo variable is exactly `changed` (delta mode only):
          # CDN-rewrite only the files the delta push reads — see
          # scripts/lib/shard-cdn-rewrite.sh. Off = byte-identical to before.
          SHARD_DELTA_CDN_REWRITE: ${{ vars.SHARD_DELTA_CDN_REWRITE == 'changed' && 'changed' || '' }}
          SHARD_PUSH_VERIFY: ${{ vars.SHARD_PUSH_VERIFY == '1' && '1' || '' }}
          # Bench run 40074671144 (ticino-it staged copy, 270'838 files): the
          # CDN rewrite 377.8 s single-thread → 162.5 s on 4 worker threads,
          # tree sha identical; the stage `rm -rf` (165 s) leaves the slot.
          # See scripts/offload-generated-images-cdn.mjs (OFFLOAD_CDN_WORKERS)
          # and scripts/lib/push-section-shard.sh (SHARD_STAGE_RM_ASYNC).
          OFFLOAD_CDN_WORKERS: '4'
          SHARD_STAGE_RM_ASYNC: '1'
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Consumed by scripts/ci/report-shard-push-failure.mjs (gh CLI) when a
          # shard push stays unpublished. The job already grants `issues: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Issue #4881 Fase 5 — see ogPagesPlugin.ts's closeBundle docblock
          # for the full contract. When true, this run's build never
          # emitted this section into dist/, so a full-replace push here
          # would force-push a near-empty tree over the live shard —
          # excluded from the loop below instead. MUST stay in lockstep
          # with the build-time emit skip (same two repo variables).
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
        run: |
          set -uo pipefail
          # Wall-time della fase (#7301): `SECONDS` riparte da 0 a ogni step (ogni
          # `run:` e' una bash nuova) e il trap EXIT lo emette su OGNI uscita —
          # inclusa quella fatale sull'ordering qui sotto — cosi' la storia non
          # perde la fase proprio quando e' andata storta. Stesso pattern dello
          # step `Build` (`wall_seconds`), letto da "Append post-build phase
          # timings row" in fondo al job.
          trap 'echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          # Each section pushes to its OWN shard repo — one section's push
          # failure (e.g. a corrupted remote clone) must never skip the
          # others. bp_run_bounded records each failing section instead of
          # aborting the fan-out; the step still ends non-zero (red in the
          # Actions UI) when any section genuinely failed. Incident
          # 2026-07-24 (run 30057726623): svizzera-it's push failure silently
          # aborted the old loop before zurigo-it was even attempted.
          #
          # Bounded-parallel, not unbounded: push-section-shard.sh's own
          # header (see "$stage ... leaked disk" note) documents issue #4734
          # — concurrent `stage` clones (up to several GB each for
          # ticino/svizzera/zurigo) piling up unfreed exhausted runner disk
          # even under the OLD sequential loop. The cap is UNCHANGED at 4 and
          # bp_run_bounded enforces it as a hard ceiling on IN-FLIGHT pushes,
          # so peak `stage` usage is exactly what it was before.
          #
          # What changed (issue #5130): a sliding window + longest-first
          # ordering replaces the batch barrier over an alphabetical list.
          # The barrier made a batch cost as long as its slowest member, and
          # alphabetical order put ticino (305k files) in the same batch as
          # svitto (14k) and turgovia (24k) — measured 13.4 min of wall for
          # 21.8 min of work on run 30980769677. Neither change raises peak
          # concurrency, RSS or disk. Full measured breakdown:
          # scripts/lib/bounded-parallel.sh.
          source scripts/lib/bounded-parallel.sh

          # bounded-parallel.sh invokes the worker by name.
          # shellcheck disable=SC2329
          push_one() {
            local section="$1" skip_var
            # #4881 Fase 5: build no longer emits this section when its
            # BUILD_EMIT_SKIP flag is on — a full-replace push here would
            # force-push a near-empty dist/ tree over the live shard, wiping
            # it. scripts/publish-article-fast.mjs is this section's only
            # push path once the flag is on (see strip-loop + reconcile
            # workflow disposition in the same PR).
            skip_var="$(echo "$section" | LC_ALL=C tr '[:lower:]' '[:upper:]')_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-it: BUILD_EMIT_SKIP=true — excluded from full-replace push (served by fast-publish only)"
              return 0
            fi
            if bash scripts/lib/push-section-shard.sh "$section" it dist; then
              return 0
            fi
            echo "::warning::$section-it shard push step failed — continuing to the next section"
            return 1
          }

          # A partial section list here would silently stop pushing a shard,
          # leaving it serving a stale build with no signal anywhere — so an
          # ordering failure is fatal, never a shortened fan-out.
          order="$(bp_section_order dist it)" || {
            echo "::error::could not order the section list — refusing to push a partial set of shards"
            exit 1
          }
          echo "section push order (longest-first): $(echo "$order" | tr '\n' ' ')"

          export BP_FAILED_FILE="$RUNNER_TEMP/shard-push-failed-it.txt"
          fail=0
          mapfile -t ordered_sections <<< "$order"
          bp_run_bounded 4 push_one "${ordered_sections[@]}" || fail=1
          # A tolerated failure must still be VISIBLE: file/refresh one deduped
          # issue naming the shards that stayed unpublished (incident
          # 2026-07-30 — uri-it failed on every deploy for 3 days behind a
          # ::warning:: inside a green run).
          if [ -s "$BP_FAILED_FILE" ]; then
            node scripts/ci/report-shard-push-failure.mjs \
              --locale it --shards "$(paste -sd, "$BP_FAILED_FILE")" || true
          fi
          exit "$fail"

      # ── Purge the sections just pushed (apex AND origin), batched (#5513) ──
      #
      # deploy.yml purges the LOCALE shard after every push (#5483/#5511) but
      # SECTION shards — pushed above — got nothing: same staleness class
      # (edge keeps serving the previous build for up to the Worker's
      # ORIGIN_CACHE_TTL, 7200s), a different funnel-critical surface
      # (cerca-lavoro-<cantone>, section landings). Left open deliberately by
      # #5511: a section fan-out is dozens of sections × 2 hosts (apex+origin)
      # — over the 30-URL cap a single `cf-purge-cache.mjs --files=` call
      # enforces, so the fixed 9-path shape #5511 uses for the locale shard
      # does not carry over as-is; it needs batching.
      #
      # Gated on the per-section ok-marker, not on the push step's outcome:
      # push_one's fan-out (above) returns non-zero when ANY ONE of the
      # sections failed to push, so an outcome gate here would silently skip
      # the purge for every OTHER section that pushed fine.
      # scripts/ci/section-shard-purge-urls.mjs takes exactly the sections
      # whose $RUNNER_TEMP/shard-ok-<section>-it marker is present — the same
      # signal the tar-pack step below already trusts — and batches their
      # apex+origin URLs into ≤30-URL calls to scripts/cf-purge-cache.mjs, one
      # call per batch, each batch independently tolerated: one failed batch
      # must not sink the rest.
      - name: Purge edge for pushed section shards (apex AND origin)
        if: matrix.locale == 'it'
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::warning::CF_API_TOKEN missing after the Remote Config load — section shards are updated, but the edge keeps serving cached copies until ORIGIN_CACHE_TTL (7200s) expires"
            exit 0
          fi
          sections=()
          for marker in "$RUNNER_TEMP"/shard-ok-*-it; do
            [ -e "$marker" ] || continue
            name="$(basename "$marker")"
            sections+=("${name#shard-ok-}")
          done
          sections=("${sections[@]%-it}")
          if [ "${#sections[@]}" -eq 0 ]; then
            echo "no section shard-ok markers for it — nothing to purge"
            exit 0
          fi
          fail=0
          while IFS= read -r batch_urls; do
            [ -z "$batch_urls" ] && continue
            node scripts/cf-purge-cache.mjs "--files=$batch_urls" || {
              echo "::warning::a section purge batch failed — those URLs keep serving the previous build until the TTL expires"
              fail=1
            }
          done < <(node scripts/ci/section-shard-purge-urls.mjs it "${sections[@]}")
          exit "$fail"

      # Same-run tar artifact for post-deploy-validate-dist's section rehydrate
      # fast path — mirrors "Pack locale shard dist (tar)" below. Previously
      # validate-dist rehydrated each Ticino subtree by `git clone --depth 1`
      # of the ~4 GB shard repo, one locale at a time (~12min wall on run
      # 28564001685). push-section-shard.sh already builds an offloaded staged
      # copy at $RUNNER_TEMP/<section>-src-it/dist/$sub (byte-identical to what
      # it just force-pushed) and leaves it in place instead of deleting it —
      # pack that into one tar per section (same stack-overflow-avoidance
      # reason as the locale tar: upload-artifact enumerates every file, so a
      # raw ~220k-file tree would fail the same way). validate-dist still
      # falls back to the git clone when a given section's artifact is
      # missing/corrupt. Per-section LIVE gate lives INSIDE the loop (not the
      # step `if:`) since each section has its own repo variable.
      - name: Pack section shard dist (tar) for post-deploy validation
        if: matrix.locale == 'it'
        id: pack-section-shards-it
        continue-on-error: true
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          set -uo pipefail
          # Wall-time della fase (#7301) — vedi lo step di push sopra per il
          # perche' del trap EXIT invece di un echo finale.
          trap 'echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          # Bounded-parallel (cap 4, mirrors the push step above): tar +
          # file-count-verify is CPU/IO-bound and independent per section
          # (each reads/writes its own $RUNNER_TEMP/<section>-* paths, no
          # cross-section overlap) — safe to fan out, capped for the same
          # runner-disk-pressure reason as the push step. Same shared
          # sliding-window driver and same longest-first order as that step
          # (memoised in $RUNNER_TEMP, so this reuses the push step's walk of
          # dist instead of paying for a second one).
          source scripts/lib/bounded-parallel.sh
          # SHARD_DELTA_CDN_REWRITE=changed: the push rewrote only the files it
          # read and completes each staged copy in background. Barrier FIRST,
          # before any live gate — the staged files are hardlinked to
          # dist/<sub>, which later steps read for non-stripped sections. It
          # waits for every pass and re-runs a failed one synchronously; a
          # section still failing is not packed (see shard-cdn-rewrite.sh for
          # why its dist/<sub> stays safe). With the variable off there is no
          # partial marker: both calls are no-ops.
          source scripts/lib/shard-cdn-rewrite.sh
          shard_cdn_rewrite_wait_all "$RUNNER_TEMP" || true
          pack_section() {
            local section="$1"
            local live_var
            live_var="$(echo "$section" | LC_ALL=C tr '[:lower:]' '[:upper:]')_SHARD_LIVE"
            if [ "${!live_var:-}" != "true" ]; then
              return 0
            fi
            # Gate on the SAME push ok-marker strip-section-subtree.sh
            # requires (issue #4881 Fase 5 audit finding), not just
            # "$src/$sub" existing. push-section-shard.sh stages "$src/$sub"
            # BEFORE its own index.html assertion / shrink guard can still
            # fail the push — without this check a failed-but-staged push
            # (or, once BUILD_EMIT_SKIP is on, a section the push loop never
            # even attempted) would still get packed and uploaded as a
            # same-run tar, and validate-dist would rehydrate from that
            # incomplete tar instead of correctly falling back to git-clone.
            if [ ! -f "$RUNNER_TEMP/shard-ok-$section-it" ]; then
              echo "no push ok-marker for $section-it (push skipped/failed this run) — validate-dist will fall back to git clone"
              return 0
            fi
            # Never pack a staged copy the deferred CDN rewrite did not complete.
            shard_cdn_rewrite_ready "$RUNNER_TEMP" "$section" it || return 0
            local sub src packed_n persisted_src_n live_src_n
            sub="$(jq -r --arg s "$section" --arg l "it" '.[$s][$l] // empty' scripts/lib/section-shard-slugs.json)"
            src="$RUNNER_TEMP/${section}-src-it/dist"
            if [ ! -d "$src/$sub" ]; then
              echo "no staged $section-it subtree (push skipped/failed) — validate-dist will fall back to git clone"
              return 0
            fi
            live_src_n=$(find "$src/$sub" -type f | wc -l)
            # Independent shrink guard (issue #6283): push-section-shard.sh
            # persists the file count it saw right after staging (BEFORE the
            # pack step's secondary tar-vs-source guard below). Comparing the
            # LIVE count here against that independent, earlier baseline
            # catches a shrink the secondary guard is structurally blind to.
            if [ -f "$RUNNER_TEMP/shard-srcn-$section-it" ]; then
              persisted_src_n="$(cat "$RUNNER_TEMP/shard-srcn-$section-it")"
              if [ "$live_src_n" -ne "$persisted_src_n" ]; then
                echo "::warning::$section-it subtree shrank between push and pack (persisted src_n=$persisted_src_n, live=$live_src_n) — skipping pack, validate-dist will fall back to git-clone"
                return 0
              fi
            fi
            if ! packed_n=$(tar -C "$src" -cvf "$RUNNER_TEMP/$section-dist-it.tar" "$sub" | awk '!/\/$/ { n++ } END { print n + 0 }'); then
              echo "::warning::$section-dist-it.tar creation failed — discarding tar, validate-dist will fall back to git-clone"
              rm -f "$RUNNER_TEMP/$section-dist-it.tar"
              return 0
            fi
            ls -lh "$RUNNER_TEMP/$section-dist-it.tar"
            # Byte-identity guard (#2761 item 1): this tar and push-section-shard.sh's
            # own push both read the SAME already-offloaded "$src/$sub" staged copy
            # (see the comment above push_section_shard's stage_src note) — nothing
            # mutates it in between, so the two paths are guaranteed to agree. This
            # count check makes that guarantee self-verifying: if it ever drifts,
            # discard the tar so validate-dist safely falls back to git-clone
            # instead of silently validating a partial/mismatched tree. It is a
            # SECONDARY guard (covers a bug in tar itself) — the independent
            # shrink check above is now the primary defence against a
            # between-steps shrink, which this secondary comparison alone cannot see.
            if [ "$packed_n" -ne "$live_src_n" ]; then
              echo "::warning::$section-dist-it.tar file count mismatch (packed=$packed_n src=$live_src_n) — discarding tar, validate-dist will fall back to git-clone"
              rm -f "$RUNNER_TEMP/$section-dist-it.tar"
            fi
            rm -rf "$src"
          }
          # Degrade to the plain list rather than pack nothing: this tar only
          # feeds post-deploy-validate-dist's rehydrate FAST PATH, which
          # already falls back to a git clone per section — but skipping
          # sections silently is still not on the table.
          order="$(bp_section_order dist it)" || {
            echo "::warning::could not order the section list — packing in list order"
            order="$(bash scripts/lib/deploy-shard-sections.sh)"
          }
          mapfile -t ordered_sections <<< "$order"
          bp_run_bounded 4 pack_section "${ordered_sections[@]}" || true
      - name: Upload shard batch 1 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-1-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/appenzello-dist-it.tar
            ${{ runner.temp }}/argovia-dist-it.tar
            ${{ runner.temp }}/articolifrontaliere-dist-it.tar
            ${{ runner.temp }}/articolisvizzera-dist-it.tar
            ${{ runner.temp }}/basilea-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 2 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-2-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/berna-dist-it.tar
            ${{ runner.temp }}/friburgo-dist-it.tar
            ${{ runner.temp }}/ginevra-dist-it.tar
            ${{ runner.temp }}/giura-dist-it.tar
            ${{ runner.temp }}/glarona-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 3 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-3-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grigioni-dist-it.tar
            ${{ runner.temp }}/lucerna-dist-it.tar
            ${{ runner.temp }}/neuchatel-dist-it.tar
            ${{ runner.temp }}/nidvaldo-dist-it.tar
            ${{ runner.temp }}/obvaldo-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 4 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-4-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sangallo-dist-it.tar
            ${{ runner.temp }}/sciaffusa-dist-it.tar
            ${{ runner.temp }}/soletta-dist-it.tar
            ${{ runner.temp }}/svitto-dist-it.tar
            ${{ runner.temp }}/svizzera-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 5 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-5-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ticino-dist-it.tar
            ${{ runner.temp }}/turgovia-dist-it.tar
            ${{ runner.temp }}/uri-dist-it.tar
            ${{ runner.temp }}/vallese-dist-it.tar
            ${{ runner.temp }}/vaud-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 6 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-6-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zugo-dist-it.tar
            ${{ runner.temp }}/zurigo-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore

      - name: Strip section subtrees (IT)
        if: matrix.locale == 'it'
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
          # Issue #4881 Fase 5: these sections never got an ok-marker this
          # run when BUILD_EMIT_SKIP is on (excluded from the push loop
          # above), so strip-section-subtree.sh would already safely no-op
          # for them (its own ok-marker gate) — skipped explicitly here
          # instead to avoid a permanent "no push ok-marker" ::warning::
          # every deploy that reads like a failure but isn't one.
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
        run: |
          set -uo pipefail
          # Bounded-parallel (cap 4, same driver + same longest-first order as
          # the push and pack steps above, memoised in $RUNNER_TEMP so this
          # reuses their walk of dist instead of paying for a third one).
          #
          # Was a strict sequential loop, and it is the one step in the shard
          # tail with NO reason to be: each section's work is `find | wc -l`
          # then `rm -rf` on its OWN dist/<sub>, and the section subtrees are
          # disjoint by construction (scripts/lib/section-shard-slugs.json maps
          # each section to a distinct URL slug), so removing them concurrently
          # lands on exactly the same tree as removing them one after another —
          # `rm -rf` of disjoint paths commutes. It is also inode/IO-bound, not
          # CPU-bound, on a runner sitting idle at this point in the job.
          #
          # Measured (build-locale (it), 25 runs 08-04→08-07): median 230 s,
          # p90 478 s, max 747 s of pure wall. ~29% of the ~1.05M stripped
          # files are ticino's, so the parallel floor is ticino itself
          # (max(0.29·T, T/4)), not T.
          #
          # This raises NO ceiling the push step's cap-4 protects: strip frees
          # disk, never allocates it, and holds no clone/stage. The one piece of
          # shared state — the per-locale stripped-file tally that
          # push-locale-shard.sh's shrink guard reads — stopped being shared:
          # strip-section-subtree.sh now writes one private file per section and
          # tally-stripped-sections.sh folds them (see both headers).
          source scripts/lib/bounded-parallel.sh

          strip_one() {
            local section="$1" skip_var
            skip_var="$(echo "$section" | LC_ALL=C tr '[:lower:]' '[:upper:]')_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-it: BUILD_EMIT_SKIP=true — build never emitted this section, no ok-marker, nothing to strip"
              return 0
            fi
            bash scripts/lib/strip-section-subtree.sh "$section" it dist
          }

          # Degrade to the plain list rather than strip nothing: a partial list
          # here would leave a section in the apex (artifact back over the 10 GB
          # Pages cap) with no signal, so the fan-out must always cover the full
          # set — only the ORDER is an optimisation.
          order="$(bp_section_order dist it)" || {
            echo "::warning::could not order the section list — stripping in list order"
            order="$(bash scripts/lib/deploy-shard-sections.sh)"
          }
          # Step exit status is UNCHANGED from the previous sequential loop,
          # which ran under `set -uo pipefail` (no `-e`) and so never aborted
          # nor failed the step on a strip error. Only the VISIBILITY changes:
          # a failing section used to vanish, and now names itself.
          export BP_FAILED_FILE="$RUNNER_TEMP/shard-strip-failed-it.txt"
          mapfile -t ordered_sections <<< "$order"
          bp_run_bounded 4 strip_one "${ordered_sections[@]}" || true
          if [ -s "$BP_FAILED_FILE" ]; then
            echo "::warning::section strip failed for: $(paste -sd, "$BP_FAILED_FILE") — those subtrees stay in the IT apex (artifact may exceed the 10 GB Pages cap)"
          fi
          # Authoritative fold of the per-section tallies, AFTER the fan-out has
          # joined — push-locale-shard.sh's shrink guard reads the result.
          echo "[strip] stripped $(bash scripts/lib/tally-stripped-sections.sh it) file(s) across the IT section shards"

      # ── IT shard → GitHub Pages + CDN (Pages-serving shard) ──────────────
      # deploy-it-pages-prep.sh runs the monolith's post-build bash IN ORDER:
      # SPA fallback, CDN push (exports CDN_BASE), offload, prune-cdn, drop
      # dist/assets, capture sitemaps, pack new sitemap urls, stage bundle,
      # pack tar (exports TAR_BYTES), audit bytes, file delta, refresh
      # url-first-seen. It does NOT commit dist-history (that stays YAML below).
      - name: Deploy prep (IT → Pages + CDN)
        id: deploy-prep-it
        if: matrix.locale == 'it'
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          # CDN publish target: 'pages' (legacy git force-push, default) or 'r2'
          # (Cloudflare R2 S3 sync — instant publish, kills the #2569 gate wait).
          # Flip by setting the repo variable CDN_TARGET=r2 (no code change). R2_*
          # creds are hydrated from Remote Config by the earlier load-rc-env step.
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
          # The prep's offload pass over the IT dist on 4 worker threads (bench
          # run 40074671144: 2.3x, byte-identical tree).
          OFFLOAD_CDN_WORKERS: '4'
        run: bash scripts/lib/deploy-it-pages-prep.sh

      # Refresh the R2 copies the Worker serves for EDGE_PUSHED_FILES.
      #
      # servePushedEdgeFile() in infra/cloudflare-worker/locale-router.js
      # PREFERS the R2 object over the origin passthrough whenever the object
      # exists — that is the whole point of the table. The consequence nobody
      # closed when it shipped: an R2 object that stops being refreshed does
      # not decay back to the origin, it SHADOWS it indefinitely.
      #
      # Until this step, the only caller of publish-edge-files.mjs was
      # fast-publish-article.yml, which is workflow_dispatch-only. Measured on
      # 2026-08-05, three days after its last run (2026-08-02T02:12:48Z):
      #
      #   R2 /edge/sitemap-news.xml   last-modified 2026-08-02T02:15:18Z,
      #                               3 <url>, publication dates 07-31…08-02
      #   public/sitemap-news.xml     22 <url>, ALL inside the 48h window
      #
      # Google News only accepts articles published in the last two days, so
      # every entry it could see was expired: the site was serving ZERO
      # eligible URLs while the corpus published ~22/day. The same freeze hit
      # /sitemap-glossario.xml (6 days) and the llms.txt family (3 days) — the
      # AI-citation surface. It also pinned the pre-CDN /images/blog/*.webp
      # <image:loc> URLs, which now 404; the fresh copy already points at
      # cdn.frontaliereticino.ch.
      #
      # Running it here puts a hard ceiling on that staleness at one deploy.
      # This is the right spot and not merely a convenient one: dist/ is fully
      # built (so the 'generated' llms.txt entries render against real page
      # data), load-rc-env hydrated R2_*/CF_* earlier in this same job, and the
      # matrix guard makes it run exactly once per deploy rather than per
      # locale. continue-on-error matches the script's own fail-open posture —
      # a failed PUT leaves the previous R2 copy serving, exactly as before.
      #
      # `--producer=build` (issue #5458), NOT a bare call. This step used to
      # invoke publish-edge-files.mjs with no flag at all, which re-publishes
      # the WHOLE EDGE_PUSHED_FILES table from THIS checkout — fixed to the
      # commit that triggered this run, and this run takes 2h+ end to end. By
      # the time this step executes, entries this deploy does NOT produce
      # (sitemap-blog.xml / sitemap-blog-ch.xml / sitemap-articles-archive.xml,
      # written straight to this same R2 prefix by the corpus repo's own
      # publish-api.yml; sitemap-news.xml and the ten rss*.xml, kept fresh by
      # sync-articles-sitemaps.yml; the two sitemap-topics-*.xml, kept fresh by
      # rerender-article-hubs.yml) had already been refreshed by their real,
      # faster publishers — and this step clobbered them with a 2h-stale copy,
      # with a purge on top that pushed the stale version to every PoP
      # immediately. `--producer=build` resolves against the SAME table
      # (infra/cloudflare-worker/locale-router.js's `producer` field is the
      # single source of truth — see its comment), never a second hardcoded
      # path list here: only entries this deploy's own full build actually
      # produces (sitemap-glossario.xml, the llms.txt family) are in scope.
      # tests/locale-router-edge-pushed-files.test.ts enforces this invocation
      # shape so it cannot silently regress back to a bare call.
      - name: Publish edge files (refresh the R2 copies the Worker prefers)
        if: matrix.locale == 'it'
        continue-on-error: true
        run: node scripts/publish-edge-files.mjs --producer=build

      - name: Upload Pages artifact (compression-level 9)
        if: matrix.locale == 'it'
        id: upload-pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          # 8 giorni, non 1 come il resto degli artifact di questo workflow.
          # `cathedral-seo-gates-check.yml` gira col cron `47 4 * * 1` e non
          # costruisce piu' il proprio dist (#5169): replica QUESTO artifact.
          # Con la retention a 1 giorno bastava una giornata senza deploy
          # riuscito perche' il gate del lunedi' non trovasse nulla e morisse
          # su «No successful deploy.yml run on main still has a
          # 'github-pages' artifact» — motivo per cui e' rimasto rosso dal
          # 2026-08-31. La finestra deve coprire la cadenza del gate.
          # Il costo e' trascurabile e non vale per gli altri: questo tar e' il
          # TRONCO (49 MB), mentre gli shard-batch dello stesso run pesano fino
          # a 1,5 GB l'uno e restano a 1 giorno.
          retention-days: 8
          if-no-files-found: error
          # Level 9 = max deflate compression on the zip envelope. Pages
          # backend extracts the zip first, so our content gets the best
          # compression ratio in transit (~970 MB vs ~1.21 GB at level 6).
          compression-level: 9

      # Register this run's deploy metadata (sha, trigger, optional article_*
      # dispatch inputs) keyed by THIS build run's id. deploy-publish.yml reads
      # it back via `deploy-registry.mjs get --run-id=<this run>` (= the
      # workflow_run.id it is triggered by) to drive the LinkedIn/Reddit article
      # posting gate + live-meta wait. It lived in the deploy job before the
      # build/publish split — but only the BUILD run sees the workflow_dispatch
      # article inputs, so it is saved here (the workflow_run-triggered publish
      # run cannot read them).
      - name: Save deploy metadata to Firestore
        if: matrix.locale == 'it' && success()
        continue-on-error: true
        env:
          ARTICLE_ID: ${{ github.event.inputs.article_id }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          OG_TITLE: ${{ github.event.inputs.og_title }}
          OG_DESCRIPTION: ${{ github.event.inputs.og_description }}
          OG_IMAGE: ${{ github.event.inputs.og_image }}
          ARTICLE_CATEGORY: ${{ github.event.inputs.article_category }}
        run: |
          node scripts/deploy-registry.mjs save \
            --run-id="${{ github.run_id }}" \
            --sha="${{ github.sha }}" \
            --trigger="${{ github.event_name }}" \
            --article-id="${ARTICLE_ID}" \
            --article-url="${ARTICLE_URL}" \
            --og-title="${OG_TITLE}" \
            --og-description="${OG_DESCRIPTION}" \
            --og-image="${OG_IMAGE}" \
            --article-category="${ARTICLE_CATEGORY}"

      # Single small artifact (~tens of KB) consumed by validate-live for
      # IndexNow / Google Indexing diff. Lets validate-live skip the
      # 1.5 GB github-pages artifact entirely.
      - name: Upload sitemaps bundle artifact
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-${{ github.run_id }}
          path: /tmp/sitemaps-bundle/
          retention-days: 1
          if-no-files-found: ignore

      # Master source data for post-deploy validators (jobs.json +
      # jobs-crawler-summaries.json). Downloaded back into data/ by
      # post-deploy-validate-dist.
      - name: Upload master source data for post-deploy validators
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-master-${{ github.run_id }}
          path: |
            data/jobs.json
            data/jobs-crawler-summaries.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload pre-deploy snapshot for post-deploy validation
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-snapshot-${{ github.run_id }}
          path: /tmp/pre-deploy-sitemap-urls.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload write-collisions analysis
        id: write_collisions_analysis
        if: always() && matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Retry write-collisions analysis upload
        if: always() && matrix.locale == 'it' && steps.write_collisions_analysis.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true

      - name: Detect previous-slug winners changes
        if: matrix.locale == 'it'
        id: winners_changed
        run: |
          if git diff --quiet -- data/previous-slug-winners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous-slug winners for post-deploy validation
        if: matrix.locale == 'it' && steps.winners_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winners-${{ github.run_id }}
          path: data/previous-slug-winners.json
          retention-days: 7
          if-no-files-found: ignore

      # The two accumulators go to the build-history-commit job as an
      # artifact; its commit + push to main (5 attempts with rebase, ~6 min on
      # deploy 39917633944, mostly a fetch + autostash of this big dirty
      # checkout) no longer sits between the IT build and `rearm`, i.e. on the
      # critical path to the publish. The commit itself is unchanged: same two
      # paths, same accumulator assertions, same merge drivers, same helper.
      - name: Upload dist-size-history + url-first-seen for the history commit
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dist-history-${{ github.run_id }}
          path: |
            data/dist-size-history.jsonl
            data/url-first-seen.json
          retention-days: 2
          if-no-files-found: ignore

      # Non-IT shard transfer, packing, and publication run in
      # deploy-publish.yml after this build releases its six-hour budget.
      # IT keeps the in-build section path because it owns Pages and the CDN
      # payload admission gate.
      - name: Report failure to GitHub Issues (build)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound as env, not interpolated into the script text (repo rule:
          # inputs reach the shell as DATA). The TITLE stays the literal
          # "CI Failure (build): <workflow>" inside the script — the 4-locale
          # matrix collapsing onto ONE canonical issue is load-bearing (#5121).
          RUN_ID: ${{ github.run_id }}
          JOB_KEY: ${{ github.job }}
          LOCALE: ${{ matrix.locale }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # #5414 Parte B: stesso titolo/dedup di prima, description arricchita
          # con job+locale e primo step fallito (via jobs API — il log del job
          # ancora in corso non è scaricabile, quindi l'estratto arriva solo
          # dal diag file /tmp/build-failure-diag.txt se uno step lo scrive).
          node scripts/ci/report-validate-dist-failure.mjs --mode report --scope build

      # ── Il gate di memoria della build (#5369 §7) ────────────────────────
      #
      # Titolo DEDICATO e non `CI Failure (build)`: sono due guasti diversi e
      # collassarli sulla stessa issue perderebbe l'unica cosa che serve
      # sapere, cioe' che a rompere e' stata la crescita del picco e non un
      # test. La condizione su `steps.memguard.outputs.breach` e' cio' che
      # tiene il titolo onesto: senza, ogni build rossa aprirebbe questa issue.
      #
      # CHI CHIUDE: lo step gemello "Resolve build memory issue on green" del
      # job `resolve-build-alarm` in fondo al file, con `mode: resolve` e il
      # TITOLO IDENTICO — e' il modello `sibling-resolve-step`. Sta li' e non in
      # questa gamba perche' il titolo e' lo stesso per le quattro gambe: uno
      # step `if: success()` di una gamba verde chiudeva la issue aperta da una
      # gamba rossa della stessa run. Il reconciler centrale NON copre questo titolo
      # (non matcha il suo `TITLE_RE`, `Workflow|Crawler|CI Failure: `), quindi
      # quella meta' locale e' l'unica che c'e'. Cambiare il titolo qui senza
      # cambiarlo la' lascia la issue aperta per sempre: e' il guasto di #5470,
      # e `tests/build-memory-guard.test.ts` confronta le due occorrenze.
      - name: Report build memory breach to GitHub Issues
        if: failure() && steps.memguard.outputs.breach != ''
        uses: ./.github/actions/report-failure
        with:
          title: 'il picco di memoria della build risale sopra la soglia'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '1'
          labels: Bug
          entity: ${{ matrix.locale }}
          diag-file: /tmp/build-failure-diag.txt
          context: |
            - **Soglia sfondata:** `${{ steps.memguard.outputs.breach }}`
            - **Picco del footprint anonimo (RSS+VmSwap):** ${{ steps.memguard.outputs.peak_anon_mb }} MB
            - **Picco RSS del processo di build:** ${{ steps.memguard.outputs.peak_rss_mb }} MB
            - **MemAvailable minimo dell'host:** ${{ steps.memguard.outputs.min_host_avail_mb }} MB
            - **Headroom anonimo minimo dell'host** (MemAvailable + evizione
              accreditata, è la quantità che il pavimento host confronta):
              ${{ steps.memguard.outputs.min_host_headroom_mb }} MB
            - **SwapFree minimo dell'host:** ${{ steps.memguard.outputs.min_swap_free_mb }} MB
            - Il build è stato fermato di proposito **prima** che l'host lo uccidesse.
              Un kill dell'host lascia lo step su `in_progress` senza exit code, e in
              quello stato nessuno step `if: failure()` viene valutato — è così che il
              leg IT del run 31672320271 è sparito senza aprire nulla, bloccando gli
              shard de/fr/en (#5773 / #5772 / #5771).
            - Profilo di riferimento (run 31747139648, 2026-08-13, verde 4/4): ~7,7 GB di
              RSS e ~4,1 GB di heap **vivo** sono già residenti quando parte il primo
              plugin di `closeBundle`; altri +4,3 GB di heap vivo li aggiunge una fase
              sola, fra le milestone `[mem] jobsSeoPages: collector created` e
              `[mem] jobsSeoPages: after company-landing`. Grep sul log del run:
              `[mem] `, `[profile-mem] `, `[hostmem] `.
            - Le soglie e la loro derivazione stanno in
              `build-plugins/shared/buildMemoryGuard.ts`. **Non alzarle**: il tetto è
              una frazione della capacità anonima dell'host (RAM+swap, credito cappato)
              confrontata col footprint RSS+VmSwap del processo, il pavimento host
              guarda l'headroom anonimo (MemAvailable + evizione accreditata, non la
              sola RAM libera — #5899) e quello su SwapFree presidia lo spazio di
              evizione: insieme sono l'ultima linea prima del kill opaco. Se questa
              issue è aperta, la strada è ridurre la retention (vedi i checkpoint
              `[mem]` di jobsSeoPagesPlugin), non allargare le soglie.

      # ── La misura full-corpus del build jobs SEO (#9618) ─────────────────
      #
      # L'allarme dello step "Validate full-corpus jobs SEO evidence", che NON
      # blocca il deploy (il perche' e' nel commento di quello step). Senza
      # questa coppia il `continue-on-error` renderebbe muto un FAIL: il run
      # resterebbe verde e la misura incompleta non la vedrebbe nessuno.
      #
      # `steps.build_step.outcome == 'success'` tiene il titolo onesto: su una
      # build rossa i marker mancano per forza, e quel guasto lo apre gia'
      # "CI Failure (build)". Qui arriva solo il caso "sito pubblicato, misura
      # non verificabile".
      #
      # CHI CHIUDE: lo step gemello qui sotto, col TITOLO IDENTICO, appena una
      # run IT ha la misura completa (`sibling-resolve-step`; il test
      # tests/failure-issue-closers.test.ts verifica l'accoppiamento).
      #
      # `continue-on-error` anche qui: l'action esce 0 per contratto, ma se il
      # reporting stesso si rompesse (API, checkout parziale) il job diventerebbe
      # rosso e `deploy-publish.yml` non pubblicherebbe, cioe' il blocco che lo
      # step di misura ha appena smesso di causare.
      - name: Report jobs SEO full-corpus evidence gap to GitHub Issues
        if: always() && matrix.locale == 'it' && steps.build_step.outcome == 'success' && steps.jobs_seo_evidence.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          title: 'la misura full-corpus del build jobs SEO non è verificabile'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '3'
          labels: Bug
          entity: ${{ matrix.locale }}
          diag-file: ${{ runner.temp }}/jobs-seo-evidence-diag.txt
          context: |
            - **Il deploy NON è stato bloccato**: la build è verde e il sito è
              proseguito verso la pubblicazione. A fallire è la verifica della
              MISURA (`scripts/ci/report-jobs-seo-build-metrics.mjs
              --require-full-corpus`), cioè i marker `[mem] jobsSeoPages` e
              `[jobs-seo-profile]` che #9618 usa come prova.
            - L'estratto qui sotto elenca le invarianti fallite. Il summary del
              job e l'artifact `jobs-seo-full-corpus-markers-<run_id>` hanno i
              marker completi.
            - **Prima di correggere il produttore**, chiediti se è l'invariante
              a essere sbagliata: #9754 pretendeva `previousSlugEntries > 0`,
              che in produzione vale 0 per scelta (#9773). Riproduci in locale
              con `node scripts/ci/report-jobs-seo-build-metrics.mjs
              <jobs-seo-markers.txt> --require-full-corpus`.
            - Se la produzione ha ragione, aggiungi l'artifact di questa run a
              `tests/fixtures/jobs-seo-full-corpus-markers/` insieme alla
              correzione del validatore: è il replay che impedisce all'errore
              di tornare.

      - name: Resolve jobs SEO full-corpus evidence issue on pass
        if: always() && matrix.locale == 'it' && steps.jobs_seo_evidence.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          mode: resolve
          title: 'la misura full-corpus del build jobs SEO non è verificabile'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # La chiusura di "CI Failure (build)" NON sta più qui: la fa il job
      # `resolve-build-alarm` in fondo al file, solo quando TUTTE le gambe
      # della run sono verdi. Uno step `if: success()` di una gamba vede solo la
      # propria gamba: il 2026-09-25 la gamba fr della run 36077807468 ha chiuso
      # #9179 alle 04:53 mentre la gamba it della STESSA run era rossa.

      # Marker del profilo + wall-time delle fasi POST-build del leg (#7301).
      # I marker finiscono nella stessa riga bounded del JSONL per permettere
      # confronti tra run con jq, invece di lasciare il dato solo nel log.
      # Queste metriche non possono essere chiavi della riga di
      # "Append build memory history row": quello step sta
      # a meta' job, e push shard + pack tar finiscono molto dopo — sul run
      # 33833300860 valgono 23 min + 5 min dei 130 min totali del leg IT. Senza
      # questa riga l'unica fonte su quelle fasi e' l'API Actions run-per-run,
      # soggetta a retention e ai run cancellati, quindi nessuna ottimizzazione
      # del leg IT ha una misura prima/dopo verificabile dal repo.
      #
      # In fondo al job, non subito dopo il tar: e' strumentazione. Come la
      # riga di memoria, va solo in staging; il commit lo fa
      # build-history-commit, fuori dal percorso critico della gamba (#9247).
      #
      # Riga SEPARATA nello stesso JSONL, non uno schema unico: le due righe
      # hanno produttori e momenti diversi, e le 294 righe gia' committate non
      # avranno mai queste chiavi. Chi legge il file discrimina sulla presenza
      # della chiave. `profile` e `phases` sono limitati a 25 elementi ciascuno
      # dal parser; i campi post-build restano per compatibilita' con jq.
      - name: Append post-build phase timings row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HISTORY_STAGE_DIR: ${{ runner.temp }}/build-history-rows
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          ROW_BUILD_STATUS: ${{ job.status }}
          # IT keeps its section timing in this job. The non-IT section tail
          # now runs in deploy-publish.yml; only its compact source handoff is
          # measured here.
          ROW_PUSH_SHARDS_IT: ${{ steps.push-section-shards-it.outputs.wall_seconds }}
          ROW_PACK_TAR_IT: ${{ steps.pack-section-shards-it.outputs.wall_seconds }}
          ROW_PACK_LOCALE_SOURCE: ${{ steps.pack-locale-source.outputs.wall_seconds }}
        run: |
          set -o pipefail
          marker_json='{"profile":[],"phases":[]}'
          if [ -f /tmp/build.log ]; then
            marker_json="$(node scripts/ci/parse-build-profile-markers.mjs /tmp/build.log)"
          fi
          ROW_MARKERS="$marker_json" node -e '
            const pick = (...names) => {
              const v = names.map((n) => process.env[n]).find((x) => x);
              return v === undefined ? null : Number(v);
            };
            const postBuild = {
              push_shards_seconds: pick("ROW_PUSH_SHARDS_IT"),
              pack_tar_seconds: pick("ROW_PACK_TAR_IT"),
              pack_locale_source_seconds: pick("ROW_PACK_LOCALE_SOURCE"),
            };
            const markers = JSON.parse(process.env.ROW_MARKERS || "{}");
            const profile = Array.isArray(markers.profile) ? markers.profile : [];
            const phases = Array.isArray(markers.phases) ? markers.phases : [];
            // Tutte assenti = nessuna fase post-build ha girato su questo leg
            // e nessun marker nel log (shard non provisionati, o job morto
            // prima). Riga vuota = rumore nella storia: meglio niente.
            if (Object.values(postBuild).every((v) => v === null)
                && profile.length === 0 && phases.length === 0) process.exit(0);
            process.stdout.write(JSON.stringify({
              ts: new Date().toISOString(),
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              build_status: process.env.ROW_BUILD_STATUS || null,
              kind: "build-profile",
              profile,
              phases,
              ...postBuild,
            }));
          ' | HISTORY_LABEL=build-history-profile \
              bash scripts/lib/append-build-history-row.sh

      - name: Append incremental manifest history row
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HISTORY_STAGE_DIR: ${{ runner.temp }}/build-history-rows
          ROW_LOCALE: ${{ matrix.locale }}
          ROW_RUN_ID: ${{ github.run_id }}
          ROW_SHA: ${{ github.sha }}
          MANIFEST_PREVIOUS: .cache/incremental-manifest-prev/${{ matrix.locale }}.jsonl
          MANIFEST_CURRENT: .cache/incremental-manifest/${{ matrix.locale }}.jsonl
        run: |
          set -o pipefail
          if [ ! -f "$MANIFEST_CURRENT" ]; then
            echo "[build-history-manifest] current manifest missing; niente da appendere"
            exit 0
          fi
          ROW_PREVIOUS="$MANIFEST_PREVIOUS" ROW_CURRENT="$MANIFEST_CURRENT" node --input-type=module -e '
            import fs from "node:fs";
            import { PAGE_KINDS } from "./build-plugins/shared/incrementalManifest.mjs";
            import { loadManifest } from "./scripts/ci/incremental-manifest-report.mjs";

            const previousPath = process.env.ROW_PREVIOUS;
            const currentPath = process.env.ROW_CURRENT;
            const current = await loadManifest(currentPath);
            const previous = fs.existsSync(previousPath) ? await loadManifest(previousPath) : null;
            const byKind = Object.fromEntries(PAGE_KINDS.map((kind) => [kind, {
              current: current.data.counts.byKind[kind] ?? 0,
              hits: previous ? 0 : null,
              misses: previous ? 0 : null,
              added: previous ? 0 : null,
              removed: previous ? 0 : null,
            }]));
            const totals = {
              current: current.data.counts.total,
              previous: previous ? previous.data.counts.total : null,
              hits: previous ? 0 : null,
              misses: previous ? 0 : null,
              added: previous ? 0 : null,
              removed: previous ? 0 : null,
            };

            if (previous) {
              for (const [pagePath, currentEntry] of current.entries) {
                const stats = byKind[currentEntry.kind];
                const previousEntry = previous.entries.get(pagePath);
                if (!previousEntry) {
                  stats.added += 1;
                  totals.added += 1;
                } else if (previousEntry.inputHash === currentEntry.inputHash) {
                  stats.hits += 1;
                  totals.hits += 1;
                } else {
                  stats.misses += 1;
                  totals.misses += 1;
                }
              }
              for (const [pagePath, previousEntry] of previous.entries) {
                if (current.entries.has(pagePath)) continue;
                byKind[previousEntry.kind].removed += 1;
                totals.removed += 1;
              }
            }

            process.stdout.write(JSON.stringify({
              ts: new Date().toISOString(),
              kind: "incremental-manifest",
              locale: process.env.ROW_LOCALE,
              run_id: process.env.ROW_RUN_ID,
              sha: process.env.ROW_SHA,
              previous: previous ? {
                total: previous.data.counts.total,
                by_kind: previous.data.counts.byKind,
              } : null,
              current: {
                total: current.data.counts.total,
                by_kind: current.data.counts.byKind,
              },
              totals,
              by_kind: byKind,
              file_size_bytes: fs.statSync(currentPath).size,
            }));
          ' | HISTORY_LABEL=build-history-manifest \
              bash scripts/lib/append-build-history-row.sh

      # Le righe in staging dei tre produttori sopra lasciano la gamba come
      # artifact; le committa UNA volta per run il job build-history-commit
      # (#9247). Il nome porta run_attempt: il rerun di una gamba non collide
      # con l'artifact del tentativo precedente, e le righe gia' committate
      # le scarta il dedup del job di commit.
      - name: Upload build-history rows
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-history-rows-${{ matrix.locale }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-history-rows/
          if-no-files-found: ignore
          retention-days: 3

      - name: Check jobs SEO HTML cache contents
        if: success() && env.JOBS_SEO_REUSE == '1'
        id: jobs-seo-html-content
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .cache/incremental-html ] && test -n "$(find .cache/incremental-html -type f -print -quit 2>/dev/null)"; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the blobs alongside the manifest snapshot for the next opt-in
      # run. A failed/incomplete build must never become the reusable source.
      - name: Save jobs SEO HTML cache
        if: success() && env.JOBS_SEO_REUSE == '1' && steps.jobs-seo-html-content.outputs.has_files == 'true' && hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-html
          key: jobs-seo-html-${{ matrix.locale }}-${{ hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) }}

      # Small, immutable receipt consumed by deploy-publish.yml. It is written
      # after every leg (including failed legs) and uploaded independently of
      # the large payload artifacts. A missing/invalid receipt is fail-closed
      # in the admission plan, while a failed non-IT leg remains on its
      # last-known-good shard and is explicitly reported as stale.
      - name: Write locale publish provenance
        if: always()
        id: write-locale-provenance
        env:
          PROVENANCE_BUILD_OUTCOME: ${{ steps.build_step.outcome }}
          PROVENANCE_VALIDATE_OUTCOME: ${{ steps.validate-locale-shard.outcome }}
          PROVENANCE_IT_PREP_OUTCOME: ${{ steps.deploy-prep-it.outcome }}
          PROVENANCE_PAGES_ARTIFACT_OUTCOME: ${{ steps.upload-pages-artifact.outcome }}
          PROVENANCE_SOURCE_ARTIFACT_OUTCOME: ${{ matrix.locale == 'it' && 'deferred' || (steps.pack-locale-source.outcome == 'success' && steps.upload-locale-source.outcome == 'success' && 'success' || 'failure') }}
          PROVENANCE_OFFLOAD_OUTCOME: ${{ matrix.locale == 'it' && steps.deploy-prep-it.outcome || 'deferred' }}
          PROVENANCE_SECTION_PUSH_OUTCOME: ${{ matrix.locale == 'it' && steps.push-section-shards-it.outcome || 'deferred' }}
          PROVENANCE_CDN_GATE_OUTCOME: deferred
          PROVENANCE_LOCALE_PUSH_OUTCOME: deferred
          PROVENANCE_LOCALE_PACK_OUTCOME: deferred
          PROVENANCE_LOCALE_ARTIFACT_OUTCOME: deferred
        run: |
          node scripts/ci/locale-publish-provenance.mjs \
            --output "$RUNNER_TEMP/locale-publish-provenance/${BUILD_LOCALE}.json" \
            --dist-dir dist

      # The IT section shards are pushed by this build leg. Record that fact
      # immediately after the provenance file; Pages itself is recorded later
      # by deploy-publish, after the GitHub Pages deployment reports success.
      - name: Write durable IT shard receipt
        if: >-
          ${{ always() && matrix.locale == 'it' &&
              steps.push-section-shards-it.outcome == 'success' &&
              steps.deploy-prep-it.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/publish-receipts.mjs \
            --write locale \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --locale it

      - name: Upload locale publish provenance
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: locale-publish-provenance-${{ matrix.locale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/locale-publish-provenance/${{ matrix.locale }}.json
          retention-days: 8
          if-no-files-found: error

      # Save the current shadow snapshot only after the report and history row:
      # the run-specific key is unique, while restore-keys above picks the
      # newest prior snapshot on the next run for this locale. Keep this as the
      # final step in the job: provenance has already captured every
      # publish-critical outcome, while this cache is only a later-run hint.
      - name: Save incremental manifest cache
        if: always() && hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-manifest
          key: incremental-manifest-${{ matrix.locale }}-${{ github.run_id }}

  # ───────────────────────────────────────────────────────────────────────
  # build-history-commit: l'UNICO scrittore di
  # data/build-history/memory-peaks.jsonl per run (#9247).
  #
  # Le gambe di build-locale mettono le righe in staging e le caricano come
  # artifact build-history-rows-<locale>-<attempt>; questo job, dopo TUTTE le
  # gambe, fa un solo commit e un solo push. Prima erano dodici push per run
  # dentro le gambe, in gara fra loro: fino a 37,8 min di rebase sul percorso
  # critico (run 37107091990) e righe perse in silenzio.
  #
  # Telemetria, mai un gate: continue-on-error, nessun job lo mette in
  # `needs` (non entra nel percorso di publish), timeout corto. Una run
  # cancellata a meta' committa le righe che ha; il log del commit elenca le
  # righe per file, quindi una gamba mancante si vede.
  # ───────────────────────────────────────────────────────────────────────
  build-history-commit:
    needs: [build-locale]
    # always(): anche con gambe fallite o una run cancellata ci sono righe da
    # salvare. Ma se build-locale e' stato saltato (run non ammessa, prep
    # fallito) non esiste nessuna riga: niente runner ne' segreti caricati.
    if: ${{ github.event_name != 'schedule' && always() && needs.build-locale.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      # Il push usa GITHUB_PAT/APP_TOKEN da Remote Config
      # (configure-main-push-auth.sh): il GITHUB_TOKEN serve solo a leggere
      # il repo e gli artifact della run.
      contents: read
      actions: read
      issues: write
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout build-history writer
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /.gitattributes
            /data/build-history/
            /data/dist-size-history.jsonl
            /data/url-first-seen.json
            /scripts/lib/
            /scripts/ci/assert-accumulator-write.mjs
            /scripts/ci/merge-json-first-seen.mjs
            /scripts/ci/phase-timing-observer.mjs
            /scripts/load-rc-env.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Nessun npm ci: load-rc-env.mjs ripiega sul percorso REST senza
      # dipendenze (#4837) e carica GITHUB_PAT per il push su main.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Download dist-size-history + url-first-seen (IT leg)
        id: dist-history-download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dist-history-${{ github.run_id }}
          path: ${{ runner.temp }}/dist-history

      # Moved here from the IT leg of build-locale (it was the leg's last
      # 6 min before `rearm`). Body unchanged except the copy-in above. It runs
      # BEFORE the build-history commit on purpose: HEAD is still the build SHA,
      # the base the leg used to commit on, so the rebase onto origin/main and
      # its merge drivers (union / json-first-seen) see the same three-way
      # merge as before.
      - name: Commit dist-size-history row + url-first-seen updates
        if: always() && steps.dist-history-download.outcome == 'success'
        continue-on-error: true
        env:
          DIST_HISTORY_DIR: ${{ runner.temp }}/dist-history
        run: |
          # The IT leg's accumulators (artifact dist-history-<run>), copied over
          # this checkout of the SAME build SHA: the diff below is exactly the
          # one the leg used to commit in place.
          for f in dist-size-history.jsonl url-first-seen.json; do
            if [ -f "$DIST_HISTORY_DIR/$f" ]; then cp "$DIST_HISTORY_DIR/$f" "data/$f"; fi
          done
          if git diff --quiet -- data/dist-size-history.jsonl data/url-first-seen.json; then
            echo "[dist-history] no diff to commit"
            exit 0
          fi
          git config user.name "dist-history-bot"
          git config user.email "dist-history-bot@frontaliereticino.ch"
          # Wire up the custom merge driver declared in .gitattributes for
          # data/url-first-seen.json (`merge=json-first-seen`). Without this
          # config the attribute is inert and git falls back to a 3-way text
          # merge → the very CONFLICT that wedged this loop. The driver unions
          # the two URL→date maps keeping the earliest first-seen, so the
          # rebase below auto-resolves instead of aborting.
          git config merge.json-first-seen.driver \
            'node scripts/ci/merge-json-first-seen.mjs %O %A %B'
          for accumulator in data/dist-size-history.jsonl data/url-first-seen.json; do
            node scripts/ci/assert-accumulator-write.mjs "$accumulator"
          done
          git add -- data/dist-size-history.jsonl data/url-first-seen.json
          unexpected_paths="$(git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              data/dist-size-history.jsonl|data/url-first-seen.json) ;;
              *) printf '%s\n' "$path" ;;
            esac
          done)"
          if [ -n "$unexpected_paths" ]; then
            echo "::error::dist-history refusing to commit staged paths outside its accumulator allowlist"
            printf '%s\n' "$unexpected_paths" | sed 's/^/  unexpected: /'
            exit 1
          fi
          # The build snapshot remains dirty in this checkout. Commit only the
          # two history paths so those generated bytes cannot hitchhike here.
          git commit --only \
            -m "chore(dist-history): append run ${GITHUB_RUN_ID} (${GITHUB_SHA::8})" \
            -- data/dist-size-history.jsonl data/url-first-seen.json
          bash scripts/lib/configure-main-push-auth.sh
          # The build job leaves dist/ and other generated files dirty
          # in the working tree. `git pull --rebase` refuses to run
          # while unstaged changes exist (`cannot pull with rebase: You
          # have unstaged changes`), so we ran the retry loop three
          # times for nothing on every deploy and the url-first-seen
          # update never landed on origin. `rebase.autoStash=true`
          # stashes those untracked/unstaged files before rebase and
          # pops them back after — purely scoped to this command, no
          # leftover stash state.
          # Bumped 3 → 5 attempts + geometric-ish backoff
          # (5/10/15/25/40 s) after annotation on run 26604491084 (and
          # every prior deploy): `[dist-history] push failed after 3
          # attempts`. Concurrent producers on main (crawlers +
          # thin-promotions + fuel + weather + post-merge auto-commits)
          # regularly out-race a 3×5 s window. The extended budget hits
          # a ~95 s total wait before giving up, which empirically
          # covers every observed conflict cluster on the main branch.
          # Both committed files now auto-resolve during the rebase via
          # .gitattributes merge drivers: `merge=union` for the JSONL append
          # log, and `merge=json-first-seen` (configured above) for the
          # url-first-seen.json map. Historically url-first-seen.json had NO
          # driver, so a concurrent producer touching nearby lines left the
          # tree mid-rebase; without aborting, every later attempt died on
          # "Pulling is not possible because you have unmerged files" and the
          # loop wedged until the job was canceled (run 27976954013, and again
          # run 28142157430 where all 5 attempts CONFLICTed). The `--abort`
          # below stays as a belt-and-braces recovery for any unexpected
          # mid-rebase state; it is a safe no-op when no rebase is in progress
          # (e.g. a plain push-rejected race).
          # `rebase.backend=merge` is forced explicitly (git >=2.26 default,
          # but not guaranteed on every runner image): the `apply` backend
          # replays patches instead of doing a real merge and SILENTLY
          # SKIPS merge drivers, so the json-first-seen driver above would
          # never fire and the CONFLICT wedge (see above) could reappear
          # with no signal (#2921, follow-up of #2920).
          # The shared helper forces the merge backend and preserves the dirty
          # dist tree while it rebases; a failed push is fatal so the history
          # cannot disappear behind a green deploy.
          bash scripts/lib/git-push-with-retry.sh --max-attempts 5 --stash-dirty

      # Senza merge-multiple: ogni artifact nella sua sottocartella, cosi' i
      # file omonimi di due tentativi della stessa gamba non si sovrascrivono.
      # continue-on-error: se nessuna gamba ha caricato righe (prep rossa, run
      # cancellata presto) lo step di commit lo dichiara da se'.
      - name: Download build-history rows
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: build-history-rows-*
          path: ${{ runner.temp }}/build-history-rows

      - name: Commit build-history rows (one commit per run)
        env:
          HISTORY_ROWS_DIR: ${{ runner.temp }}/build-history-rows
          HISTORY_COMMIT_MSG: 'chore(build-history): append rows run ${{ github.run_id }}'
        run: bash scripts/lib/commit-build-history-rows.sh



      # The matrix legs may observe independently; resolve only after every
      # locale is green AND three consecutive deploy runs have complete phase
      # measurements below the +30% boundary. The Actions run list is needed
      # because a cancelled run can stop before writing a history row.
      - name: Resolve build phase timing regression issue on green
        if: always() && needs.build-locale.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PHASE_TIMING_HISTORY: data/build-history/memory-peaks.jsonl
          PHASE_TIMING_RUNS_FILE: ${{ runner.temp }}/phase-timing-runs.json
          PHASE_TIMING_RUN_ID: ${{ github.run_id }}
          PHASE_TIMING_REQUIRED_LOCALES: it,en,de,fr
          PHASE_TIMING_RECOVERY_RUNS: '3'
        run: |
          set -euo pipefail
          # A `--branch` run listing without `--created` can come back frozen
          # weeks in the past (scripts/ci/lib/run-listing-window.mjs): the
          # recovery check would then not find the current run and never
          # close. Seven days cover the three consecutive deploys it needs
          # with a wide margin; the observer orders the runs by id itself.
          CREATED_SINCE="$(jq -rn 'now - (7 * 86400) | strftime("%Y-%m-%d")')"
          gh run list \
            --repo "$GH_REPO" \
            --workflow deploy.yml \
            --branch main \
            --created ">=$CREATED_SINCE" \
            --limit 20 \
            --json databaseId,status,conclusion \
            > "$PHASE_TIMING_RUNS_FILE"
          recovery=$(node scripts/ci/phase-timing-observer.mjs --recovery-ready)
          echo "[phase-timing] recovery-ready=$recovery (runs=$PHASE_TIMING_RECOVERY_RUNS)"
          if [ "$recovery" != 'true' ]; then
            exit 0
          fi
          node scripts/lib/github-issue-creator.mjs \
            --title "Build phase timing regression (+30% median)" \
            --resolve \
            --workflow "$WORKFLOW_NAME" \
            --run-url "$RUN_URL"

  # ───────────────────────────────────────────────────────────────────────
  # rearm: make "every HEAD eventually gets a successful build" an invariant
  # rather than a hope (#5349).
  #
  # THE HOLE. `pages-build-run` keeps 1 running + 1 pending and drops the
  # superseded middle. That is newest-wins and it is correct — on a linear
  # `main` the newer build already contains what it superseded. But nothing in
  # the old design restarted the pipeline when it reached a terminal state with
  # NOTHING queued behind it. Measured across the 100 runs from 2026-08-06T12:37Z to
  # 2026-08-08T05:58Z (~41 h): 82 cancelled, 10 success, 6 failure, and exactly
  # ONE such moment — a run ended `failure` at 2026-08-06T16:27:57Z and the
  # pipeline sat idle for 412 minutes until a human pushed. Same order as the
  # 638-minute publish lag that filed #5349.
  #
  # WHY HERE and not on a schedule. A debounce (schedule + dispatch instead of
  # push) removes the queue by removing events: it makes every urgent merge pay
  # the debounce interval, and at 16:27 the queue was not overfull, it was
  # EMPTY — a debounce fixes nothing there. This job adds the missing edge
  # instead, at the exact moment the information is available: the build just
  # ended, so "is anything still queued?" is answerable now.
  #
  # WHY `if: always()` AND THE CANCELLATION COVER. GitHub evaluates this final
  # job after failed and cancelled dependencies when the run is still executing.
  # A run cancelled while PENDING can be removed before this job is scheduled;
  # the schedule-reconcile job and deploy-stalled-watchdog.yml are the explicit
  # rescues for that documented platform edge. They exit after the same
  # queue/HEAD check, so they cannot add a duplicate while another build is
  # queued, running, or already green.
  #
  # RECURSION and STORM are closed in scripts/ci/rearm-deploy-build.mjs — the
  # cap is per-SHA (so each re-arm strictly consumes budget and the chain ends
  # after one retry) and the decision is taken for the current HEAD only, never
  # once per superseded commit. A canonical-regression status can override a
  # green-build shortcut exactly once for that SHA; see the queue helper and
  # that file's header for the full argument.
  # ───────────────────────────────────────────────────────────────────────
  rearm:
    needs: [validate-promotion-trigger, matrix-setup, prep, build-locale]
    # `always()` bypasses the implicit needs-success gate, so admission is
    # evaluated here even after a failed/cancelled build. The resolver allows
    # only a translation-handoff failure through; every other promotion-gate
    # failure remains fail-closed before it can add work.
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      github.ref == 'refs/heads/main'
    # Same durable admission claim as schedule-reconcile. The final rearm
    # keeps it until its queue recheck and any workflow_dispatch have returned.
    concurrency:
      group: deploy-rearm-dispatch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # read this workflow's run list + POST /dispatches
      statuses: read   # read the durable canonical-regression queue
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Re-arm the build pipeline after the terminal run
        # A first green run also dispatches one bounded successor: build-history
        # and other bot commits can advance main after this run's queue snapshot.
        # The per-SHA cap in rearm-deploy-build.mjs prevents a success loop.
        # Never fail the deploy over this. A red job here would be a second
        # failure stacked on the one that stopped the pipeline, and
        # deploy-stalled-watchdog.yml remains the backstop either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # At most this many build attempts per commit. The caller's own run
          # counts, so the default of 2 means exactly ONE automatic retry: a
          # commit whose build is genuinely broken is retried once and then left
          # to the "CI Failure (build)" issue this workflow already files.
          REARM_MAX_BUILDS_PER_SHA: '2'
          REARM_SELF_CONCLUSION: ${{ needs.build-locale.result == 'success' && 'success' || 'failure' }}
          REARM_PROMOTION_RESULT: ${{ needs.validate-promotion-trigger.result }}
          REARM_TRANSLATION_RESULT: ${{ needs.validate-promotion-trigger.outputs.translation_handoff_result }}
          REARM_SOURCE_RESULT: ${{ needs.validate-promotion-trigger.outputs.source_promotion_result }}
          # A confirmed host-loss/timeout in one matrix leg gets exactly one
          # job-level rerun. The rerun reuses this run's SHA and prepared
          # snapshot artifact; it must never fan out into a second full matrix.
          REARM_MAX_LOCALE_RECOVERY_ATTEMPTS: '1'
        run: node scripts/ci/rearm-deploy-build.mjs

      # This dispatch is deliberately at the end of the build workflow. The
      # publisher waits for this source run to become terminal before admitting
      # its artifacts, so the direct GITHUB_TOKEN dispatch is safe even though
      # GitHub does not emit a reliable workflow_run event for token-triggered
      # runs. The status-based receipt in deploy-publish makes this idempotent.
      - name: Start Pages publisher for this build
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.build-locale.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml" --jq '.id')
          gh workflow run deploy-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_run_id=$SOURCE_RUN_ID" \
            -f "source_sha=$SOURCE_SHA" \
            -f 'source_conclusion=success' \
            -f 'source_branch=main' \
            -f "source_event_name=$SOURCE_EVENT_NAME" \
            -f 'source_workflow=Deploy to GitHub Pages' \
            -f 'source_workflow_path=.github/workflows/deploy.yml' \
            -f "source_workflow_id=$workflow_id"

  # ───────────────────────────────────────────────────────────────────────
  # resolve-build-alarm: gli allarmi di build con un titolo UNICO per tutte le
  # gambe ("CI Failure (build)" e il gate di memoria) si chiudono solo a run
  # TUTTA verde. Quelli per-locale (shard, guard CDN) restano nella gamba: il
  # locale è nel titolo, quindi ogni gamba chiude solo il proprio.
  #
  # Prima la chiusura era uno step `if: success()` dentro ogni gamba di
  # `build-locale`, e uno step vede solo la propria gamba. Il 2026-09-25 la
  # gamba it della run 36077807468 ha riaperto #9179 e alle 04:53 una gamba
  # verde della STESSA run l'ha chiusa come «tornata verde»: la produzione era
  # rossa e l'allarme spento. `needs.build-locale.result` è l'esito aggregato
  # della matrice, cioè `success` solo se le quattro gambe lo sono.
  #
  # NON può rendere rossa una run verde: `continue-on-error` a livello di job.
  # Una run rossa per colpa di questo job non avvierebbe la pubblicazione
  # (`workflow_run` con conclusion success), e un guasto del reporter non deve
  # mai costare un deploy. Gira in parallelo a `rearm`, quindi non allunga la
  # tenuta del lock di concorrenza del build.
  # ───────────────────────────────────────────────────────────────────────
  resolve-build-alarm:
    name: close the build alarm when every leg is green
    needs: [build-locale]
    if: github.event_name != 'schedule' && needs.build-locale.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve build GitHub Issue on success
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tutte le gambe verdi → chiude la issue canonica "CI Failure (build)"
          # se è aperta. Il reporter di ogni gamba la riapre entro 720h invece
          # di coniarne una nuova: la coppia riapri↔chiudi resta su UNA issue
          # canonica. No-op se non c'è niente di aperto. Il TITOLO deve restare
          # identico a quello del reporter.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Stesso difetto, stesso rimedio: il titolo del gate di memoria è unico
      # per le quattro gambe (l'`entity` va nel body, non nel titolo), quindi
      # lo chiude solo una run in cui nessuna gamba è rossa.
      - name: Resolve build memory issue on green
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          mode: resolve
          title: 'il picco di memoria della build risale sopra la soglia'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────
  # in-run-alarm: la seconda rete dell'allarme di deploy, per le run che
  # l'osservatore esterno non può vedere.
  #
  # IL BUCO. `deploy-failure-alarm.yml` parte su `workflow_run: completed` di
  # questo workflow, e GitHub NON emette quell'evento per una run avviata con il
  # GITHUB_TOKEN (actor `github-actions[bot]`): è la regola anti-ricorsione già
  # descritta nel job `rearm` qui sopra. La run 36065965021 del 2026-09-24,
  # dispatchata da `rearm` col token interno, è fallita nel leg it e
  # l'osservatore esterno non è mai partito. #9715 fa dispatchare `rearm` col
  # token dell'App, ma il ripiego sul GITHUB_TOKEN resta quando l'App non dà un
  # token con `actions: write`: dal 2026-09-18 ci sono state 15 run così.
  #
  # PERCHÉ SOLO QUELLE RUN. Una run avviata da un utente, da un PAT o dall'App
  # emette `workflow_run`, e l'osservatore esterno la vede a run CONCLUSA, con
  # la conclusion vera. Accendere anche questo job per quelle run non aggiunge
  # copertura: aggiunge un secondo commento 🔁 sulla stessa issue per ogni
  # guasto. Con il filtro sull'actor ogni run rossa è vista da UN osservatore.
  # `triggering_actor` copre un re-run lanciato col GITHUB_TOKEN; `actor` il
  # dispatch originale. Se capitassero tutti e due (un re-run manuale di una
  # run del bot), il titolo è IDENTICO a quello dell'osservatore esterno e il
  # dedup del creator li collassa sulla stessa issue: al peggio un commento in
  # più, mai una issue doppia.
  #
  # PERCHÉ `!cancelled()` E NON `always()`. Serve partire anche quando i job
  # osservati sono falliti, ma non su una run cancellata: le cancellazioni
  # newest-wins avvengono in coda e non avviano nessun job, una cancellazione a
  # metà run è un'azione deliberata, e l'osservatore esterno tace sulle
  # `cancelled` per la stessa ragione. `contains(..., 'failure')` esclude anche
  # i job `cancelled` e `skipped`.
  #
  # NON è un gate: gira dopo il verdetto dei job osservati, il suo esito non
  # conta per la run (`continue-on-error`), e scrive solo una issue.
  # ───────────────────────────────────────────────────────────────────────
  in-run-alarm:
    name: in-run deploy alarm (run without workflow_run)
    needs: [validate-promotion-trigger, matrix-setup, prep, build-locale]
    if: >-
      ${{ github.event_name != 'schedule' && !cancelled() && github.ref == 'refs/heads/main' &&
          (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]') &&
          contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      # Senza questa riga la Jobs API risponde 403 e il body degrada a «job non
      # attribuito» in silenzio: un blocco `permissions:` esplicito azzera gli
      # scope non elencati.
      actions: read
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Digest the failing deploy run
        id: digest
        # Lo script esce 0 per contratto; `continue-on-error` copre il crash
        # imprevisto, perché lo step successivo deve partire comunque: senza
        # body usa il testo di ripiego invece di tacere.
        continue-on-error: true
        env:
          # Tutti gli input passano da env, mai come testo di script.
          ALARM_WORKFLOW_NAME: ${{ github.workflow }}
          ALARM_REPO: ${{ github.repository }}
          ALARM_RUN_ID: ${{ github.run_id }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # La run è ancora in corso, quindi non ha una conclusion da leggere:
          # il `failure` l'ha già provato l'`if:` del job su `needs.*.result`.
          ALARM_RUN_CONCLUSION: failure
          ALARM_OBSERVER: in-run
          ALARM_DESCRIPTION_FILE: alarm-description.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/report-deploy-run-failure.mjs --mode report
      - name: Open or update the deploy alarm issue
        id: open
        # Ogni job di `needs:` è elencato per esteso: è la forma che
        # `isFailureGated` (scripts/ci/failure-issue-inventory.mjs) riconosce,
        # così il gate di accoppiamento verifica che qualcuno chiuda questo
        # titolo. `tests/deploy-in-run-alarm.test.ts` pretende che l'elenco
        # copra tutti i `needs:` del job.
        if: >-
          needs.validate-promotion-trigger.result == 'failure' ||
          needs.matrix-setup.result == 'failure' ||
          needs.prep.result == 'failure' ||
          needs.build-locale.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Se il digest non ha potuto scrivere il body (Jobs API 403, rete),
          # l'allarme suona lo stesso con meno dettaglio.
          if [ ! -s alarm-description.md ]; then
            cat > alarm-description.md <<'FALLBACK'
          Il deploy e' rosso su main in una run avviata dal token interno di
          GitHub Actions, che l'osservatore esterno non vede, e il digest della
          run non e' stato leggibile. Il guasto resta: apri la run e leggi il
          primo job rosso.
          FALLBACK
          fi
          # Titolo IDENTICO a quello dell'osservatore esterno: una sola issue
          # canonica per il deploy rosso, chiusa al primo verde dall'osservatore
          # esterno o dal reconciler orario.
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description-file alarm-description.md \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}" \
            --run-url "${ALARM_RUN_URL}"
      - name: Open the deploy alarm without the checkout (fallback)
        # Lo step sopra ha il `success()` implicito: se il checkout o il setup di
        # Node falliscono, salta, e per una run del bot non c'è un osservatore
        # esterno che rimedi. Questo parte comunque (`always()`), tranne su
        # una run cancellata, che non allarma come nel resto del job,
        # solo quando lo step sopra non ha scritto. Il creator non ha dipendenze
        # oltre ai moduli di Node: se il checkout manca lo scarica con `gh`
        # allo SHA della run e lo esegue col Node di sistema del runner, quindi
        # dedup, riapertura e titolo restano quelli canonici.
        if: >-
          always() && !cancelled() && steps.open.outcome != 'success' &&
          (needs.validate-promotion-trigger.result == 'failure' ||
           needs.matrix-setup.result == 'failure' ||
           needs.prep.result == 'failure' ||
           needs.build-locale.result == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Senza checkout la cwd non è un repo git: `gh` deve sapere dove scrivere.
          GH_REPO: ${{ github.repository }}
          ALARM_SHA: ${{ github.sha }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          creator=scripts/lib/github-issue-creator.mjs
          if [ ! -s "$creator" ]; then
            creator="$RUNNER_TEMP/github-issue-creator.mjs"
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/lib/github-issue-creator.mjs?ref=${ALARM_SHA}" \
              > "$creator" || true
          fi
          if [ ! -s "$creator" ]; then
            echo "::error title=Deploy alarm not written::il creator delle issue non è leggibile né dal checkout né via API; apri a mano ${ALARM_RUN_URL}"
            exit 0
          fi
          node "$creator" \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "Il deploy e' rosso su main in una run avviata dal token interno di GitHub Actions, che l'osservatore esterno non vede. Il job di allarme interno non ha potuto preparare il digest (checkout o setup falliti): apri la run e leggi il primo job rosso." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}" \
            --run-url "${ALARM_RUN_URL}" \
            || echo "::error title=Deploy alarm not written::il creator è uscito non-zero; apri a mano ${ALARM_RUN_URL}"
