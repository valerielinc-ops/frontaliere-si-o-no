name: Deploy to GitHub Pages
run-name: ${{ github.event_name == 'schedule' && 'Deploy queue reconciliation (no build)' || 'Deploy to GitHub Pages' }}

on:
  # A completed run owns its next dispatch. The schedule is only a best-effort
  # recovery edge for the one case GitHub cannot execute a final job: a run
  # cancelled while it is still pending. It never builds in the scheduled run;
  # it exits after checking the current queue and main tip. The separate
  # deploy-stalled-watchdog.yml covers schedule delivery gaps and completion
  # events that never reach this workflow's final job.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Optional article id to verify live metadata and post to Facebook after deploy'
        required: false
        type: string
      article_url:
        description: 'Optional live article URL for post-deploy metadata verification'
        required: false
        type: string
      og_title:
        description: 'Optional expected OG title for the deployed article'
        required: false
        type: string
      og_description:
        description: 'Optional OG description for the Facebook post copy'
        required: false
        type: string
      og_image:
        description: 'Optional expected OG image for the deployed article'
        required: false
        type: string
      article_category:
        description: 'Optional article category used for Facebook hashtags'
        required: false
        type: string
      profile_sequential:
        description: 'Investigation-only run: serialize every closeBundle hook to inspect [profile-detail] timings. Production keeps independent hooks parallel.'
        required: false
        type: boolean
        default: false
      profile_job_phases:
        description: 'Investigation-only: collect per-phase jobs SEO timings. Adds instrumentation to the per-page build path; off by default.'
        required: false
        type: boolean
        default: false
      write_collision_dump:
        description: 'Investigation-only: dump every unique-by-hash content claim() to dist/.write-collisions-data/ for triaging colliding paths. Off by default — adds ~200k synchronous writeFileSync calls during build (~100-200s overhead) that get pruned at end. The collisions JSON report is emitted regardless; only enable this when you need the actual HTML payload of a colliding path.'
        required: false
        type: boolean
        default: false
      publish_branch_test:
        description: 'EXPERIMENT (reversible): after build, orphan force-push dist/ to the `gh-pages-test` branch instead of (not in addition to) the normal artifact deploy. Validates whether a ~13 GB site survives a git push to GitHub — the prerequisite for switching off the actions/deploy-pages path (10-min artifact-polling cap that has failed every recent deploy). Does NOT touch the live Pages source or the production gh-pages branch; nothing is published. Off by default.'
        required: false
        type: boolean
        default: false
      parallel_plugins:
        description: 'Compatibility override for a profile dispatch: keep closeBundle hooks parallel even when profile_sequential=true.'
        required: false
        type: boolean
        default: false
      rearm_dispatch:
        description: 'Internal self-rearm admission token; keeps a recovery build in its own pending lane.'
        required: false
        type: boolean
        default: false

permissions:
  # The build reads the repository and publishes its Pages artifact; the final
  # job also needs actions:write for the self-driven successor dispatch.
  contents: read
  pages: write
  id-token: write
  issues: write     # for github-issue-creator on build/deploy failure
  actions: write    # final self-dispatch and the schedule recovery edge

# Workflow-level serialisation of the normal BUILD block (matrix-setup → prep
# → build-locale ×4). A self-rearm uses a separate workflow lane so it cannot
# replace a legitimate pending manual build between the resolver's final queue
# read and its dispatch. The build-locale jobs carry the shared per-locale
# production lock across both lanes; their four locales still run in parallel.
# The ten-minute schedule is only a cheap, best-effort rescue for a run
# cancelled before its final job can start. Schedule reconciliation has its
# own group so a new schedule tick cannot replace a legitimate pending build;
# its queue check still sees the build group and skips whenever that pipeline
# is moving. The external watchdog is the recovery edge when GitHub never
# records a schedule tick at all.
#
# Crucially, this run now ENDS at the build: deploy / validate / publish moved to
# the separate `deploy-publish.yml` workflow. The final build step dispatches the
# publish tail for this immutable source run; `deploy-request.yml` remains only
# a status-aware recovery tick for old/manual source runs. The lock is released
# the moment the build finishes — the next queued build starts immediately,
# while the prior build's deploy/validate/publish tail proceeds independently in
# deploy-publish.yml (its own `pages-deploy` lock).
# This gives "one build at a time, next starts when the build — not the whole
# deploy cycle — is done", without the ~1h idle a whole-run lock caused.
#
# The normal lane still serialises whole runs. Recovery runs have a separate
# workflow lane, so `build-locale` adds a per-locale lock to preserve the same
# no-cross-run guarantee for each CDN / frontaliere-<loc> production target.
concurrency:
  # Keep the resolver out of the build group's one-pending slot. A re-arm
  # dispatch also gets its own lane: a manual workflow_dispatch that arrives
  # after the resolver's last queue read must remain pending, rather than being
  # replaced by the recovery run. The build-locale jobs below share a
  # per-locale admission lock, so the separate workflow lane cannot make two
  # runs mutate the same production target at once.
  group: ${{ github.event_name == 'schedule' && 'deploy-schedule-reconcile' || (inputs.rearm_dispatch == true && 'pages-build-rearm' || 'pages-build-run') }}
  cancel-in-progress: false

jobs:
  # Schedule runs intentionally do not enter the expensive build graph. The
  # resolver counts queued/in-progress runs and successful builds for HEAD;
  # only when both are absent does it dispatch one workflow_dispatch on main.
  # It also holds a translation `pending` tree and consumes the durable
  # canonical-regression request; no external workflow dispatches this build.
  schedule-reconcile:
    name: Reconcile the current deploy tip
    if: github.event_name == 'schedule'
    # Durable admission claim shared with the final rearm job. It is acquired
    # before this job reads the queue and held through the pre-dispatch
    # recheck/dispatch, so the two producers cannot race each other.
    concurrency:
      group: deploy-rearm-dispatch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      statuses: read
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout deploy resolver
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /scripts/ci/rearm-deploy-build.mjs
            /scripts/ci/deploy-rearm-request.mjs
            /scripts/ci/lib/deploy-job-failure-signature.mjs
            /scripts/ci/deploy-failure-classifier.mjs
            /scripts/ci/lib/deploy-run-evidence.mjs
            /scripts/ci/lib/deploy-blocked-issue.mjs
            /scripts/ci/lib/run-listing-window.mjs
            /scripts/lib/int-from-env.mjs
            /scripts/lib/is-invoked-directly.mjs
            /scripts/ci/translation-deploy-handoff.mjs
            /data/translation-deploy-handoff.json
          sparse-checkout-cone-mode: false
      - name: Dispatch only when the queue is idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REARM_MODE: schedule
          REARM_MAX_BUILDS_PER_SHA: '2'
          REARM_SKIP_LOCALE_RECOVERY: '1'
        run: node scripts/ci/rearm-deploy-build.mjs

  # Admit only an explicit main-branch production candidate before any build
  # leg can produce artifacts or mutate deploy targets.
  # This file is the canonical build producer for the coordinator handoff;
  # publish admission binds the source to this workflow's name, path, and
  # immutable ID before any Pages or post-deploy side effect is allowed.
  validate-promotion-trigger:
    name: validate production promotion trigger
    if: github.event_name != 'schedule'
    outputs:
      translation_handoff_result: ${{ steps.translation_handoff.outcome }}
      source_promotion_result: ${{ steps.source_promotion.outcome }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout promotion gate
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
            /scripts/ci/translation-deploy-handoff.mjs
            /scripts/lib/is-invoked-directly.mjs
            /data/translation-deploy-handoff.json
          sparse-checkout-cone-mode: false
      - name: Reject an incomplete translation tree
        id: translation_handoff
        # Only the workflow's own GITHUB_TOKEN dispatch may carry the
        # rearm input. A human workflow_dispatch can set the boolean input,
        # but its actor is not github-actions[bot], so it still runs this
        # strict gate and remains fail-closed on a pending marker.
        if: inputs.rearm_dispatch != true || github.event_name != 'workflow_dispatch' || github.actor != 'github-actions[bot]'
        run: node scripts/ci/translation-deploy-handoff.mjs
      - name: Reject non-main or unverified source
        id: source_promotion
        # Run independently of the translation handoff so the rearm resolver
        # can admit only a translation hold with a verified source promotion.
        if: always()
        env:
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_REF: ${{ github.ref }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_SOURCE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/production-promotion-gate.mjs trigger

  # No human-approval environment gates this pipeline: the owner's 16/09
  # decision is that PRs and deploys flow without a human veto (the deny
  # control-plane survives only on the issue surface). Admission stays
  # fail-closed through `validate-promotion-trigger` and the workflow-identity
  # checks, which are provable from the run context and need no reviewer.
  # See tests/deploy-no-human-approval-gate.test.ts before adding one back.

  matrix-setup:
    needs: [validate-promotion-trigger]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      build_id: ${{ steps.build_id.outputs.build_id }}
    steps:
      - name: Build locale matrix
        id: build
        run: |
          set -eo pipefail
          # Canonical locale set, fixed order, de-duplicated (same node one-liner
          # as deploy-matrix-experiment.yml). Production always builds all four.
          JSON=$(node -e '
            const all = ["it","en","de","fr"];
            process.stdout.write(JSON.stringify(all));
          ')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Locale matrix: $JSON"
      - name: Mint shared digits-only build id
        id: build_id
        run: |
          # Single canonical DEPLOY_BUILD_ID for every shard so each shard's
          # build-plugins/constants.ts BUILD_ID (DEPLOY_BUILD_ID-aware) emits an
          # identical dist/build-id.txt — validate-live's propagation check keys
          # on that file, so all shards must agree.
          echo "build_id=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  # ── Shared prep: assemble the dataset ONCE → atomic snapshot artifact. ──
  # Removes the ×4 duplicated data-prep from the locale shards and guarantees
  # every shard builds from the IDENTICAL job snapshot (no crawler-commit-window
  # divergence). Mirrors deploy-matrix-experiment.yml's prep VERBATIM, plus the
  # monolith's Active-jobs regression check + SEO position tracking.
  prep:
    needs: matrix-setup
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the standard bundle only when it is missing, then make the
          # trust paths explicit for actions/checkout. Never disable TLS checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # This gate inspects the shared SEO source tree and is independent of the
      # locale-specific build. Keep it before the expensive dataset assembly:
      # a source regression must block the matrix as a whole, not let the IT
      # leg fail while en/de/fr spend hours building work that cannot publish.
      - name: Run SEO source tests once per build
        timeout-minutes: 25
        env:
          BUILD_LOCALE: ''
          # The prep checkout intentionally omits the live jobs dataset.
          VITEST_SKIP_LIVE_DATA: 'true'
        run: npm run gate:seo-source

      # The thumbnail encoder reads only the checked-out public/images tree and
      # writes only its thumbnails/ subdirs, which nothing reads before the
      # snapshot pack: it overlaps the single-threaded dataset steps below
      # instead of adding its 116 s (deploy 39917633944) to the prep critical
      # path. The join step sits where the foreground step used to, so every
      # later step still sees the thumbnails exactly as before, and a failure
      # still fails the job there (scripts/ci/background-step.sh).
      - name: Start responsive image thumbnails (background)
        run: bash scripts/ci/background-step.sh start thumbnails -- node scripts/generate-image-thumbnails.mjs
      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: |
          if test -f scripts/load-rc-env.mjs; then
            node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
          else
            echo "⚠️ load-rc-env.mjs is absent in this checkout (non-fatal)"
          fi
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        # The assembler prints the key it checks itself: a hashFiles() over a
        # subset of its inputs gave exact hits on stale directories, whose save
        # actions/cache then skipped. See the action for the full reason.
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --stats
      - name: Cache assemble-jobs output
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}
      - name: Assemble jobs dataset from per-crawler slices
        id: assemble_jobs
        run: node scripts/assemble-jobs-dataset.mjs --stats
      - name: Save assemble-jobs cache
        if: ${{ steps.assemble_jobs.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true' && hashFiles(format('.cache/assemble-jobs/{0}/manifest.json', steps.assemble_cache_key.outputs.key)) != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}
      - name: Active-jobs regression check
        # Block deploy if active jobs dropped >25% vs baseline. Catches mass
        # job loss that slips past the assemble hard-fail (crawler outages,
        # over-eager housekeeping prunes, expired-jobs leaks). Baseline at
        # data/active-jobs-baseline.json auto-ratchets UP only — manual
        # commit required to lower (see CLAUDE.md rule #1).
        run: npm run audit:active-jobs-regression
      - name: SEO position tracking (non-blocking)
        # Refresh the 7-day GSC avg-position snapshot for status visibility and
        # PRINT where it stands. NON-BLOCKING by design (owner decision
        # 2026-06-24): the former SEO-landing moratorium was downgraded from a
        # deploy gate to a tracker. Losing real SEO traffic / serving users 404s
        # (e.g. ~14k/day indexed ricerca-stipendio-* pages going 404) outweighs
        # the avg-position vanity metric, so position is monitored but never
        # blocks a deploy. check-seo-moratorium.mjs reports only (always exit 0).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # OAuth2 path (currently not set; SA fallback in
          # refresh-gsc-position-rolling.mjs uses GOOGLE_APPLICATION_CREDENTIALS
          # exported by the Prepare Firebase credentials step above — the
          # Firebase SA also has GSC permissions per memory
          # `reference_firebase_sa_doubles_as_gsc`).
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          node scripts/refresh-gsc-position-rolling.mjs
          node scripts/check-seo-moratorium.mjs
      - name: Housekeeping (cross-crawler dedup + locale hardening)
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: node scripts/cleanup-jobs.mjs
      - name: Refresh employer-profiles snapshot from live corpus
        run: node scripts/build-employer-profiles.mjs
      - name: Refresh weekly-employers footer link list
        run: node scripts/refresh-weekly-employers-top-pairs.mjs
      - name: Mine all job slugs for 404 coverage
        run: node scripts/mine-all-job-slugs.mjs
      - name: Canton-aware migration of slug registry
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs
      - name: Join responsive image thumbnails
        run: bash scripts/ci/background-step.sh wait thumbnails
      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs
      - name: Generate shared related-search matching summary
        env:
          BUILD_PROFILE: '1'
          SEQUENTIAL_PROFILE: '1'
          RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
          # prep is not the memory-bound build: this process peaks at ~3.6 GB
          # of heap on a 16 GB runner, so the four per-locale postings workers
          # run at once instead of one after another (350 s serial in deploy
          # 39917633944). Results are seeded in locale order either way, so
          # the summary is byte-identical — proved on the bench with
          # prep_compare (see the PR). The build legs keep 1: there the same
          # workers would stack on a ~10 GB build heap.
          RELATED_SEARCH_PREPASS_CONCURRENCY: '4'
          # Same repository-variable rollout as the build legs below.
          RELATED_SEARCH_POSTINGS_SPARSE: ${{ vars.RELATED_SEARCH_POSTINGS_SPARSE == '1' && '1' || '' }}
          RELATED_SEARCH_CLUSTERS_SUMMARY_OUT: data/related-search-clusters-summary.json
          NODE_OPTIONS: '--max-old-space-size=14336 --expose-gc'
        run: ./node_modules/.bin/tsx scripts/generate-related-search-clusters-summary.ts
      - name: Pack prepared snapshot (generated data + thumbnails)
        run: |
          set -eo pipefail
          # public/data holds the assemble-generated, GITIGNORED runtime JSON
          # (jobs.json, jobs-stats.json, expired-jobs.json) that Vite copies into
          # dist/data. A fresh shard checkout does NOT have them (gitignored) and
          # they are not regenerated per-shard (assemble runs only here in prep),
          # so they MUST travel in the snapshot — otherwise dist/data/jobs-stats.json
          # is missing on the IT shard (validate-critical-dist-pages fail) and the
          # SPA's /data/jobs.json 404s live. (fuel-prices/health-premiums/etc. are
          # CDN-managed by their own crons, not produced by the deploy.)
          # pigz writes the same gzip format on every core (gzip used one:
          # 108 s for 833 MB in deploy 39917633944); consumers keep reading a
          # plain .tgz. gzip stays the fallback if an image ever drops pigz.
          GZ="$(command -v pigz || command -v gzip)"
          echo "[prepared-snapshot] compressor=$GZ"
          tar -I "$GZ" -cf /tmp/prepared-snapshot.tgz \
            data \
            public/data \
            public/images/blog/thumbnails public/images/places/thumbnails 2>/dev/null || \
            tar -I "$GZ" -cf /tmp/prepared-snapshot.tgz data public/data
          ls -lh /tmp/prepared-snapshot.tgz
      - name: Upload prepared snapshot
        uses: actions/upload-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/prepared-snapshot.tgz
          retention-days: 1
          # Already gzip: a second deflate pass only costs upload time.
          compression-level: 0

  # ── Matrix build: one runner per locale. IT serves Pages + uploads the same
  # artifacts as the monolith; en/de/fr push to their frontaliere-<loc> shards.
  build-locale:
    needs: [matrix-setup, prep]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Recovery runs use a separate workflow lane so a manual pending dispatch
    # cannot be evicted by the resolver. Keep the actual production writers
    # mutually exclusive by locale across both lanes: each leg owns its
    # locale's CDN / frontaliere-<loc> force-push target and the IT Pages
    # artifact. Different locales stay parallel.
    concurrency:
      group: pages-build-locale-${{ matrix.locale }}
      cancel-in-progress: false
    # shard-secrets-overflow: repo-level Actions secrets hit GitHub's 100/repo
    # cap (89 section-shard deploy keys already used the quota). Environment
    # secrets are a separate 100-slot pool that GitHub merges into the same
    # `secrets.*` context when a job declares `environment:` — no change
    # needed to how existing repo-level SHARD_*_DEPLOY_KEY secrets are read.
    # No protection rules on this environment (see `gh api .../environments`).
    environment: shard-secrets-overflow
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      statuses: write   # durable shard receipt for the successful IT push
      # #5331: the CDN ordering gate reads THIS run's job list to tell "the IT
      # leg has not published the marker YET" apart from "the IT leg is over and
      # failed, so it never will". Read-only, and the gate degrades to its old
      # blind 2700s wait if the scope is ever missing — never to an early
      # publish.
      actions: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      # Production closeBundle hooks MUST stay serialized. PR 8818 (merged
      # 2026-09-16) changed this default to parallel; deploy run 35100583972
      # then OOMed all four build-locale legs (DE hit Mark-Compact at 14,334 MB
      # against the 14,336 MB heap cap). Sequential run 34956104680 kept
      # employerProfilePages at 6.8 GB heap (6,783-6,788 MB) versus 11.0 GB
      # (11,053 MB) in the parallel leg. Parallel closeBundle in production is
      # forbidden until the per-leg memory peak is below about 10 GB. The empty
      # value is therefore an explicit workflow_dispatch + parallel_plugins=true
      # opt-in; every other event/input resolves to '1'.
      BUILD_PROFILE: '1'
      ASSET_CDN: 'https://cdn.frontaliereticino.ch'
      JOB_OG_RENDER_BUDGET_S: '1800'
      JOB_OG_PUBLISH_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
      # Restored to 2 (#4959 §4): the post-walk worker no longer imports the
      # site-shell graph. injectContextualLinks moved to a leaf module with
      # type-only imports, so plain Node ESM inside the worker resolves it —
      # verified directly: the leaf loads, the old plugin path still fails with
      # ERR_MODULE_NOT_FOUND on siteShell.
      POST_WALK_WORKERS: '2'
      SEQUENTIAL_PROFILE: ${{ fromJSON('["1",""]')[github.event_name == 'workflow_dispatch' && github.event.inputs.parallel_plugins == 'true' && 1 || 0] }}
      JOBS_SEO_PROFILE_PHASES: ${{ inputs.profile_job_phases == true && '1' || '' }}
      # The canonical-fallback pre-pass is the peak RSS hotspot on the 16 GiB
      # runner: run 36148322951 reached ~12.9 GiB with the detected 4-worker
      # pool and then stopped emitting logs while the host was swapping. The
      # inline path has the same deterministic output and avoids cloning the
      # ~20k tuple corpus into worker threads. Raise this only after an Actions
      # run demonstrates a safe RSS margin.
      JOBS_SEO_FALLBACK_WORKERS: '1'
      WEEKLY_EMPLOYERS_PROFILE: ''
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
      RELATED_SEARCH_PREPASS_CONCURRENCY: '1'
      DEPLOY_CONTENT_MANIFEST: '1'
      # Runner-level OOM mitigation (run 30274470672, 2026-07-27): IT build
      # got host-killed ("runner has received a shutdown signal") mid
      # related-search-clusters at rss_mb=11848 while heapTotal was only
      # ~5.1GB — the gap is glibc malloc arenas never returned to the OS,
      # not V8 heap (jobsSeoPagesPlugin/staticPagesPlugin/etc. already gc()
      # between phases — see profilePlugin.ts — so V8-side reclaim is not
      # the gap). postWalkCoordinatorPlugin.ts spawns POST_WALK_WORKERS
      # worker_threads earlier in the build; each worker's glibc arenas can
      # outlive the thread and pin RSS for the rest of closeBundle, which
      # matches the ~9.8GB pinned-RSS pattern already logged in past
      # investigations. Capping arenas makes glibc trim more aggressively.
      # Revert trigger: if a build still OOMs at/above this same RSS after
      # this lands, this wasn't the (whole) cause — pursue reducing the
      # related-search-clusters candidate set instead, don't re-try this knob.
      MALLOC_ARENA_MAX: '2'
      # Per-locale emit filter + shared canonical build id (identical
      # dist/build-id.txt across all shards).
      BUILD_LOCALE: ${{ matrix.locale }}
      DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
      # Build-time article emit skip (issue #4881 Fase 5). Read by
      # ogPagesPlugin.ts's closeBundle (renderArticlePages) and
      # seoHubsPlugin.ts's emitSeoHubs (renderArticleHubPagesCore) — see
      # those files' docblocks. Repo variables, same per-section convention
      # as <SECTION>_SHARD_LIVE; default (unset) = unchanged legacy
      # behavior (both sections keep emitting into the monolith build).
      # MUST stay in lockstep with the push-loop exclusion below — never
      # flip one true without the other in the SAME deploy.
      ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
      ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
      # Jobs SEO HTML reuse is deliberately repository-variable opt-in. An
      # unset variable keeps the old build path byte-for-byte: no HTML cache
      # restore, no reuse reads, and no extra current-cache writes.
      JOBS_SEO_REUSE: ${{ vars.JOBS_SEO_REUSE == '1' && '1' || '' }}
      JOBS_SEO_REUSE_VERIFY: ${{ vars.JOBS_SEO_REUSE_VERIFY == '1' && '1' || '' }}
      # Optional deterministic verify sample (0-1, e.g. 0.02) for production:
      # verifies a stable 2% of reuse hits instead of re-rendering everything.
      JOBS_SEO_REUSE_VERIFY_SAMPLE: ${{ vars.JOBS_SEO_REUSE_VERIFY_SAMPLE || '' }}
      # Output-validated reuse fingerprint (opt-in, unset = byte-for-byte the
      # old path). When only the render source graph changed, render a
      # stratified sample of unchanged-input pages and keep reusing a block only
      # if every sampled page is byte-identical to its cached HTML; the post-walk
      # delta follows the same per-block verdict. The 2% verify stays active.
      JOBS_SEO_REUSE_PROBE: ${{ vars.JOBS_SEO_REUSE_PROBE == '1' && '1' || '' }}
      # Jobs SEO CPU flags, output-neutral (bench, frozen clock, run
      # 40135693877: base, an identical base2 and these flags differ only on
      # og/border-wait/*, an external live input): per-closeBundle sector
      # match memo, precompiled orphan-slug parsing. ON by default; a
      # repository variable set to '0' turns each one off without a code
      # change.
      JOBS_SEO_SECTOR_MEMO: ${{ vars.JOBS_SEO_SECTOR_MEMO == '0' && '' || '1' }}
      JOBS_SEO_SLUG_INFO_FAST: ${{ vars.JOBS_SEO_SLUG_INFO_FAST == '0' && '' || '1' }}
      # Related-search postings pre-pass: sparse gram index + 3-gram
      # intersection (same postings, less CPU). Repository-variable opt-in;
      # unset keeps the dense pre-pass byte-for-byte.
      RELATED_SEARCH_POSTINGS_SPARSE: ${{ vars.RELATED_SEARCH_POSTINGS_SPARSE == '1' && '1' || '' }}
      # Post-walk incremental mode is repository-variable opt-in like the two
      # flags above; it requires INCREMENTAL_MANIFEST=1 (previous manifest).
      # Unset keeps the full post-walk byte-for-byte.
      POST_WALK_INCREMENTAL: ${{ vars.POST_WALK_INCREMENTAL == '1' && '1' || '' }}
      POST_WALK_INCREMENTAL_VERIFY: ${{ vars.POST_WALK_INCREMENTAL_VERIFY == '1' && '1' || '' }}
      # STATIC_BUILD_ID_META=off drops the per-build <meta name=ft-build-id>
      # from static SEO pages (the SPA shell keeps it), so a page whose content
      # did not change keeps the same bytes and the delta shard push stops
      # rewriting it on every deploy. Unset keeps the marker byte-for-byte.
      STATIC_BUILD_ID_META: ${{ vars.STATIC_BUILD_ID_META == 'off' && 'off' || '' }}
    steps:
      # #7106 — anchors the CDN gate's job-deadline safety margin (see "WHY A
      # THIRD CLOCK" in scripts/lib/wait-cdn-build-id.sh) to this leg's REAL
      # start, not the "Wait for IT CDN push" step's start. That is what lets
      # the gate self-adjust for however long Build+shard-push (T1) actually
      # took on THIS run instead of assuming a fixed T1. First step so no
      # earlier step's variance is left out of the clock.
      - name: Record job start (#7106 CDN gate job-deadline safety margin)
        run: echo "CDN_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # The removal (80 s in deploy 39917633944) runs detached while checkout,
      # swap and the snapshot restore proceed: the runner starts with 86 GB
      # free, those steps need ~10 GB, and the space only matters once the
      # build writes dist/. "Join disk cleanup" right before the Build step
      # waits for it and prints the AFTER figure the old step printed. The
      # script cannot live in the repo: nothing is checked out yet.
      - name: Free disk space (remove unused toolchains, background)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          rm -f /tmp/free-disk.done
          nohup bash -c '
            pids=()
            for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift; do
              sudo rm -rf "$d" & pids+=("$!")
            done
            rc=0
            for p in "${pids[@]}"; do wait "$p" || rc=1; done
            echo "rm_rc=$rc"
            date +%s > /tmp/free-disk.done
          ' < /dev/null > /tmp/free-disk.log 2>&1 &
          date +%s > /tmp/free-disk.started

      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          # A hosted runner intermittently reached actions/checkout with no
          # libcurl CAfile (run 35913755610: "CAfile: none"). Rebuild the
          # standard bundle only when it is missing, then make the trust paths
          # explicit for the checkout action. Never disable certificate checks.
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      # I build-locale morivano exit 134 sul muro V8 (12288 MB) con l'host
      # ancora largo (~2 GB MemAvailable, ~3 GB SwapFree — run 32319344037):
      # il tetto V8 e' salito a 14336 (package.json build:ci) e regge solo
      # con capacita' di evizione in piu'. Lo swapfile, i suoi numeri e il
      # razionale stanno in UN posto solo: scripts/ci/grow-build-swap.sh
      # (review di #6150 — la copia inline era duplicata 3 volte e ha
      # lasciato scoperti 2 workflow). Il ramo fail-open dello script e'
      # coperto dal preflight di buildMemoryGuard, che ferma in 5 secondi
      # qualunque build:ci parta col tetto alzato senza questo swap.
      # Revert-trigger: se un leg muore host-kill (step in_progress senza
      # exit code) o il wall-time dello step Build cresce >20% con lo swap
      # attivo, togliere script e rialzo del tetto V8 insieme, e riaprire
      # l'indagine retention (issue #6134).
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash scripts/ci/grow-build-swap.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: |
          test -f scripts/load-rc-env.mjs
          node scripts/load-rc-env.mjs

      # The employer-profile ad experiment is consumed by the static
      # generator, so freeze its build input after Remote Config hydration and
      # before the `npm run build:ci` SSG step below. Unknown/missing values
      # stay on the safe control arm; changing RC after this build cannot alter
      # already-emitted HTML and must be followed by another deploy.
      - name: Freeze employer-profile ad input before SSG
        shell: bash
        run: |
          employer_profile_mid_ad_variant="${EMPLOYER_PROFILE_MID_AD_TEST_VARIANT:-control}"
          case "$employer_profile_mid_ad_variant" in
            control|eoc_mid) ;;
            *)
              echo "::warning::Unknown EMPLOYER_PROFILE_MID_AD_TEST_VARIANT; using control."
              employer_profile_mid_ad_variant=control
              ;;
          esac
          echo "EMPLOYER_PROFILE_MID_AD_TEST_VARIANT=$employer_profile_mid_ad_variant" >> "$GITHUB_ENV"
          echo "Employer-profile ad SSG input: $employer_profile_mid_ad_variant"

      # The article-detail near-ATF experiment is consumed by both the static
      # article renderer and the Vite SPA bundle. Unknown/missing values stay
      # on control so an incomplete Remote Config rollout cannot add a slot.
      - name: Freeze article-detail ATF ad input before SSG
        shell: bash
        run: |
          article_detail_atf_variant="${ARTICLE_DETAIL_ATF_AD_TEST_VARIANT:-control}"
          case "$article_detail_atf_variant" in
            control|atf) ;;
            *)
              echo "::warning::Unknown ARTICLE_DETAIL_ATF_AD_TEST_VARIANT; using control."
              article_detail_atf_variant=control
              ;;
          esac
          echo "ARTICLE_DETAIL_ATF_AD_TEST_VARIANT=$article_detail_atf_variant" >> "$GITHUB_ENV"
          echo "VITE_ARTICLE_DETAIL_ATF_AD_TEST_VARIANT=$article_detail_atf_variant" >> "$GITHUB_ENV"
          echo "Article-detail ATF ad SSG input: $article_detail_atf_variant"

      # Eventfrog ephemeral pages (owner decision D5, AGB §17): copy the PRIVATE
      # snapshot to the git-ignored .cache/private-events/ for the events page
      # builder. Never an artifact (public-repo artifacts are downloadable) and
      # never under data/ or public/. Always exits 0: with EVENTFROG_ENABLED
      # off, no snapshot or any error it removes the local copy and the build
      # emits no Eventfrog page. Prints counts only.
      - name: Fetch private event snapshot (Eventfrog, ephemeral pages)
        run: node scripts/fetch-private-event-snapshots.mjs

      # Consume the shared atomic snapshot from the prep job instead of
      # re-running assemble/cleanup/mine/migrate/thumbnails per shard.
      - name: Download prepared snapshot
        uses: actions/download-artifact@v8
        with:
          name: prepared-snapshot
          path: /tmp/snapshot
      - name: Restore prepared snapshot (data + thumbnails)
        run: |
          set -eo pipefail
          # Same gzip stream; pigz decompresses it with separate read, inflate
          # and write threads (gzip -d did all three on one core).
          GZ="$(command -v pigz || command -v gzip)"
          tar -I "$GZ" -xf /tmp/snapshot/prepared-snapshot.tgz -C .
          if [ -f data/jobs.json ]; then
            echo "✓ data/jobs.json restored ($(wc -c < data/jobs.json) bytes)"
          else
            echo "✖ data/jobs.json missing after restore"
            exit 1
          fi
          # The extracted files are now in the checkout. Later build steps use
          # those paths; the source artifact remains available remotely for
          # recovery, so keep its compressed copy out of the runner's disk
          # budget. Run 42383391917 showed this archive still occupied ~982 MB.
          snapshot_bytes="$(stat -c '%s' /tmp/snapshot/prepared-snapshot.tgz)"
          rm -f -- /tmp/snapshot/prepared-snapshot.tgz
          echo "[prepared-snapshot] removed extracted archive bytes=${snapshot_bytes}"
          df -h /

      - name: Resolve job OG image cache version
        if: matrix.locale == 'it'
        id: job_og_image_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import { JOB_OG_IMAGE_VERSION } from './build-plugins/shared/jobOgImageVersion.mjs'; process.stdout.write(JOB_OG_IMAGE_VERSION)")"
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid job OG image cache version: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore per-job OG images
        if: matrix.locale == 'it'
        id: job_og_images_cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/og-jobs
          # Run 34956104680 rendered 16726 cards with 10434/27160 hits (38%),
          # spending 1256.5s wall (~21 min; ~82 CPU-min) on the IT leg. The
          # Cache entries are immutable, and all four build-locale matrix legs
          # share the same github.run_id. Without this IT-only guard, the first
          # leg to save the run-specific key would win and the other legs could
          # not add their files. jobOgImagesPlugin skips cache reads/writes on
          # non-IT legs, so only IT needs to restore and save this cache.
          #
          # The version is read from jobOgImageVersion.mjs rather than copied
          # into this workflow. It must be part of the restore prefix: a plain
          # `og-jobs-${runner.os}-` restore can select the newest cache from a
          # different raster version and turn a version rollback into a cold
          # render of every card (run 41521068653). There is deliberately no
          # fallback to that legacy prefix: a missing versioned cache may cause
          # one cold render, but it must never restore incompatible pixels.
          # Cache filenames also contain the version, and the plugin only
          # consumes files for the current one.
          # The run-specific suffix makes each IT run save an updated snapshot.
          key: og-jobs-${{ runner.os }}-${{ steps.job_og_image_version.outputs.version }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            og-jobs-${{ runner.os }}-${{ steps.job_og_image_version.outputs.version }}-

      # This compact manifest records the OG bytes from the last successful
      # R2 copy of that prefix. A failure in a later, unrelated prefix does not
      # undo the OG copy, so only the OG-specific completion record is needed.
      # A cache miss deliberately falls back to one full additive copy.
      - name: Restore last published R2 OG manifest
        if: ${{ matrix.locale == 'it' && (vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both') }}
        uses: actions/cache/restore@v6
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}
          restore-keys: |
            r2-og-published-

      # Incremental manifest carry (#8878 1b): each locale owns one JSONL
      # snapshot, restored from the newest previous run and saved under a
      # unique run key after all build steps have finished. It remains
      # diagnostic-only by default; the separate jobs SEO HTML cache below is
      # also opt-in through the repository variable JOBS_SEO_REUSE=1.
      - name: Restore previous incremental manifest
        id: incremental-manifest-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/incremental-manifest
          key: incremental-manifest-${{ matrix.locale }}-${{ github.run_id }}
          restore-keys: |
            incremental-manifest-${{ matrix.locale }}-

      # Compute the current renderer fingerprint for cache saves. When the
      # output probe is enabled, the restore key below uses the fingerprint in
      # the exact previous manifest so the probe can validate renderer changes.
      - name: Fingerprint jobs SEO renderer for HTML cache
        if: env.JOBS_SEO_REUSE == '1'
        id: jobs-seo-html-fingerprint
        shell: bash
        env:
          JOBS_SEO_HTML_CACHE_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          node scripts/ci/jobs-seo-html-cache-fingerprint.mjs >> "$GITHUB_OUTPUT"

      # Opt-in only. The exact manifest hash pairs this HTML snapshot with the
      # previous manifest. The restore fingerprint comes from that manifest
      # when output probing is enabled; cache saves below use the current one.
      - name: Restore previous jobs SEO HTML cache
        if: env.JOBS_SEO_REUSE == '1'
        id: jobs-seo-html-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/incremental-html
          # Exact key only (review #8940): a prefix fallback could restore
          # the HTML snapshot of a different run than the previous manifest
          # restored above. Keep the manifest hash exact; lookup() and the
          # output probe still validate each page before it can be reused.
          key: jobs-seo-html-${{ matrix.locale }}-${{ hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) }}-${{ steps.jobs-seo-html-fingerprint.outputs.restore_fingerprint }}

      - name: Stash previous incremental manifest before build overwrites it
        shell: bash
        env:
          MANIFEST_LOCALE: ${{ matrix.locale }}
          # La chiave CERCATA dallo step di restore qui sopra. Serve
          # nell'annotazione: senza, «cache miss» non dice su quale prefisso.
          MANIFEST_RESTORE_KEY: incremental-manifest-${{ matrix.locale }}-
          # Vuoto = nessuna cache trovata per quel prefisso. Non vuoto = una
          # cache è stata ripristinata, ma non conteneva il JSONL del locale.
          # È l'unico modo che questo step ha di distinguere i due casi.
          MANIFEST_MATCHED_KEY: ${{ steps.incremental-manifest-cache.outputs.cache-matched-key }}
          # L'annotazione ha senso solo dove il riuso è atteso: su `main` una
          # run precedente esiste quasi sempre, quindi «niente manifest» è o il
          # primo giro dopo l'abilitazione o uno SFRATTO dal tetto di 10 GiB.
          # Su un ref di esperimento/dispatch il miss è la norma e un warning
          # sarebbe solo rumore.
          MANIFEST_ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          previous=".cache/incremental-manifest/${MANIFEST_LOCALE}.jsonl"
          mkdir -p .cache/incremental-manifest-prev
          if [ -f "$previous" ]; then
            mv "$previous" ".cache/incremental-manifest-prev/${MANIFEST_LOCALE}.jsonl"
            echo "[incremental-manifest] previous ${MANIFEST_LOCALE} manifest stashed ($(wc -l < ".cache/incremental-manifest-prev/${MANIFEST_LOCALE}.jsonl") lines)"
          else
            echo "[incremental-manifest] no previous ${MANIFEST_LOCALE} manifest (first run or cache miss)"
            echo "[incremental-manifest] restore-key=${MANIFEST_RESTORE_KEY} matched-key=${MANIFEST_MATCHED_KEY:-<none>}"
            # `::warning::` e non `echo`: la riga di log la legge solo chi apre
            # il job, l'annotazione compare nel riepilogo della run. Prima di
            # questa PR uno sfratto della cache — tre leg su quattro che
            # ricostruiscono ~1,9 milioni di pagine senza riuso, 19-20/09/2026 —
            # non lasciava NESSUN segnale visibile fuori dal log dello step.
            if [ "${MANIFEST_ON_MAIN}" = "true" ]; then
              if [ -z "${MANIFEST_MATCHED_KEY}" ]; then
                echo "::warning title=Incremental manifest assente (${MANIFEST_LOCALE})::Nessuna cache per il prefisso '${MANIFEST_RESTORE_KEY}': primo giro dopo l'abilitazione oppure SFRATTO dal tetto di 10 GiB del pool cache Actions. Questo leg ricostruisce tutto senza riuso incrementale (INCREMENTAL_MANIFEST e JOBS_SEO_REUSE non hanno nulla da riusare)."
              else
                echo "::warning title=Incremental manifest incompleto (${MANIFEST_LOCALE})::Cache '${MANIFEST_MATCHED_KEY}' ripristinata (prefisso cercato '${MANIFEST_RESTORE_KEY}') ma senza ${MANIFEST_LOCALE}.jsonl: lo snapshot esiste e non contiene questo locale. Questo leg ricostruisce tutto senza riuso incrementale."
              fi
            fi
          fi

      # IT-only: restore + stash the previous deploy content manifest so the
      # IT shard's deploy-file-delta can diff in-place HTML changes (the IT
      # shard is the one that runs deploy-it-pages-prep.sh).
      - name: Restore previous deploy content manifest
        if: matrix.locale == 'it'
        uses: actions/cache@v6
        with:
          path: content-manifest.tsv
          key: deploy-content-manifest-${{ github.run_id }}
          restore-keys: |
            deploy-content-manifest-

      - name: Stash previous content manifest before build overwrites it
        if: matrix.locale == 'it'
        shell: bash
        # Stesso difetto di osservabilita' del manifest incrementale qui sopra,
        # stesso file, stessa cache evictabile: anche questo manifest vive nel
        # pool da 10 GiB e sparisce per sfratto senza lasciare un segnale fuori
        # dal log dello step. Il rimedio e' lo stesso, non una variante.
        env:
          CONTENT_MANIFEST_RESTORE_KEY: deploy-content-manifest-
          CONTENT_MANIFEST_ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ -f content-manifest.tsv ]; then
            mv content-manifest.tsv prev-content-manifest.tsv
            echo "[file-delta] previous manifest stashed ($(wc -l < prev-content-manifest.tsv) lines)"
          else
            echo "[file-delta] no previous manifest (first run after enabling / cache miss)"
            echo "[file-delta] restore-key=${CONTENT_MANIFEST_RESTORE_KEY}"
            if [ "${CONTENT_MANIFEST_ON_MAIN}" = "true" ]; then
              echo "::warning title=Content manifest assente (it)::Nessuna cache per il prefisso '${CONTENT_MANIFEST_RESTORE_KEY}': primo giro dopo l'abilitazione oppure SFRATTO dal tetto di 10 GiB del pool cache Actions. deploy-file-delta non puo' diffare le modifiche HTML in place su questo giro."
            fi
          fi

      - name: Join disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          # Bounded: a removal that never finishes must fail here, before the
          # build fills the disk, not hang the leg.
          for _ in $(seq 1 900); do
            [ -f /tmp/free-disk.done ] && break
            sleep 1
          done
          cat /tmp/free-disk.log 2>/dev/null || true
          if [ ! -f /tmp/free-disk.done ]; then
            echo "::error::disk cleanup did not finish within 900 s"
            exit 1
          fi
          # Best-effort like the foreground step it replaces (whose bare `wait`
          # never failed it), but a failed removal is now visible here instead
          # of only as a later ENOSPC.
          if ! grep -q '^rm_rc=0$' /tmp/free-disk.log 2>/dev/null; then
            echo "::warning::disk cleanup: at least one toolchain removal failed (see the log above)"
          fi
          echo "[free-disk] cleanup wall_s=$(( $(cat /tmp/free-disk.done) - $(cat /tmp/free-disk.started) )) waited_after_start_s=$(( $(date +%s) - $(cat /tmp/free-disk.started) ))"
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Build (BUILD_LOCALE=${{ matrix.locale }})
        id: build_step
        shell: bash
        env:
          # Skip the per-plugin `last-resort` GC after a plugin that grew
          # neither heapUsed nor RSS by 256 MB since the last forced GC
          # (build-plugins/profilePlugin.ts). Each of those calls cost
          # 5.8-8.4 s on a 6.4-7.6 GB live heap even after a 0.01 s plugin:
          # 8.4 min of the IT step and 9.4 of the FR one in deploy 39917633944;
          # bench 40080692388 (IT) measured 7626 s -> 7242 s. Byte identity
          # between the two variants with the clock frozen: see the PR body.
          # Revert trigger: a leg that breaches the memory guard, or is
          # host-killed with a `gc=skipped` as its last `[profile-mem]` line
          # -> drop this line; the code path reverts to GC after every plugin.
          PROFILE_GC_MIN_GROWTH_MB: '256'
          # Redundant with the job-level `MALLOC_ARENA_MAX` above, which has
          # been in place since 2026-07-27 — kept only so this step is
          # self-contained if it is ever lifted out. It is NOT the fix for the
          # current SIGTERMs: the job-level setting was already active in every
          # run that died, which is precisely the revert trigger the job-level
          # comment documents. See that comment for where to look instead.
          MALLOC_ARENA_MAX: '2'
          # Incremental manifest (#8878/#8914): repository-variable opt-in.
          # Run 35146607926 (first with it always on) added +44 min to the IT
          # jobs-seo phase (bridges 99 s → 758 s, legacy-ti 54 s → 705 s):
          # registration cost is being fixed separately. Unset variable keeps
          # the build byte-identical and writes no manifest; set
          # INCREMENTAL_MANIFEST=1 in repository variables for a canary.
          INCREMENTAL_MANIFEST: ${{ vars.INCREMENTAL_MANIFEST == '1' && '1' || '' }}
          # Lower the bounded collection cadence during the large expired-page sweep.
          JOBS_SEO_HTML_GC_INTERVAL_MB: '512'
          # The jobs SEO plugin lists every active job detail it writes here;
          # "Assert active JobPosting coverage" re-checks them in the final dist.
          JOBPOSTING_COVERAGE_OUT: ${{ runner.temp }}/jobposting-coverage.json
        run: |
          set -o pipefail

          # Host-memory sampler. The builds that die report only
          # "The runner has received a shutdown signal" and exit 143, which
          # names no cause, and every theory read off the build's OWN numbers
          # has been falsified by the last SUCCESSFUL run (15922, 2026-08-03):
          # it peaked at rss 12643 MB — HIGHER than the 12203 MB of a run the
          # host killed — and finished. Disk is not it either: all three runs
          # report an identical 108 G free. What no log carries is the figure
          # that would actually settle it, the HOST's free memory at the
          # moment of death. This samples it every 10 s so the next failure is
          # a measurement instead of another guess.
          #
          # `MemAvailable` is the number that matters (free + reclaimable),
          # not `MemFree`. A run killed by the host will show it collapsing
          # toward zero in the seconds before the log stops; one that stays
          # comfortable rules host memory out and sends the search elsewhere.
          #
          # Run against a real shell before landing, which caught two defects
          # that would have made this silently useless: piping the loop through
          # `sed` to add the prefix emitted NOTHING (sed block-buffers when
          # stdout is not a tty, so a sampler this sparse never flushed), and
          # `$!` then held the PID of the pipeline's last element rather than
          # the loop, so the trap left the sampler running. The prefix is
          # printed inline and there is no pipe.
          #
          # The 4-hour bound is a backstop, not the mechanism: the trap below
          # is what normally stops it. It exists so a sampler can never be what
          # keeps a runner alive if the trap is ever bypassed.
          ( end=$(( $(date +%s) + 14400 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              printf '[hostmem] '
              awk '/^(MemTotal|MemAvailable|MemFree|SwapFree|Dirty):/ {sub(/:/,"",$1); printf "%s=%dMB ", $1, $2/1024}' /proc/meminfo
              printf 'topRSS=%dMB\n' "$(ps -eo rss= --sort=-rss | head -1 | awk '{print int($1/1024)}')"
              sleep 10
            done ) &
          sampler=$!
          # Never let the sampler outlive the step, whatever the build does.
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          npm run build:ci 2>&1 | tee /tmp/build.log
          build_exit="${PIPESTATUS[0]}"
          # Wall-time del leg (SECONDS e' un builtin bash, azzerato a inizio
          # step): serve al follow-up #6174 item 1 per accumulare storia
          # comparabile, per ora scritta qui e persistita dallo step
          # "Append build memory history row" sotto. Va dopo la build, non
          # prima dell'exit, cosi' viene emesso anche sui leg che falliscono
          # (host-kill escluso: quello termina il processo prima di questa
          # riga, e non produce mai il referto memguard letto sotto).
          echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$build_exit"

      # Publish the compact edge archive before any section shard delta can
      # remove selected static pages. Each locale build owns its manifest;
      # missing credentials or a partial upload fail this deploy closed.
      - name: Publish expired-job edge dataset (before section shard deltas)
        if: steps.build_step.outcome == 'success'
        run: node scripts/publish-expired-job-edge-dataset.mjs

      # Legge il referto che `buildMemoryGuardPlugin` scrive SEMPRE (verde o
      # rosso) in /tmp/build-memory-peak.json, e lo espone come output. Sta
      # subito dopo il build e gira `always()` perche' il caso che conta e'
      # proprio quello in cui il build e' rosso.
      #
      # `breach` vuoto = il build e' fallito per altro (o non e' fallito): in
      # quel caso lo step di report qui sotto NON parte, altrimenti qualunque
      # rosso aprirebbe una issue di memoria e il titolo perderebbe significato.
      - name: Read build memory report
        id: memguard
        if: always()
        shell: bash
        run: |
          set -o pipefail
          breach=''
          peak=''
          peak_anon=''
          avail=''
          headroom=''
          swap_free=''
          if [ -f /tmp/build-memory-peak.json ]; then
            breach=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.breach??""))' || true)
            peak=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakRssMb??""))' || true)
            peak_anon=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakAnonMb??""))' || true)
            avail=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minHostAvailMb??""))' || true)
            # L'headroom anonimo (MemAvailable + evizione accreditata) e' la
            # quantita' che il pavimento host confronta davvero dal 2026-09-05
            # (#5899): la storicizziamo perche' e' quella su cui si ricalibra.
            headroom=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minHostHeadroomMb??""))' || true)
            swap_free=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minSwapFreeMb??""))' || true)
            cat /tmp/build-memory-peak.json
          else
            echo "[memguard] nessun referto: il processo di build non ha mai chiuso (host-kill) o il guard non era armato"
          fi
          {
            echo "breach=$breach"
            echo "peak_rss_mb=$peak"
            echo "peak_anon_mb=$peak_anon"
            echo "min_host_avail_mb=$avail"
            echo "min_host_headroom_mb=$headroom"
            echo "min_swap_free_mb=$swap_free"
          } >> "$GITHUB_OUTPUT"

      # Read-only evidence for the first comparable build after the Rollup
      # `maxParallelFileOps: 64` cap (#18517). Keep this immediately after the
      # memguard reader: a later publish/tail step must not be able to consume
      # the 350-minute budget before the verdict is written. Missing or partial
      # data is explicitly non-comparable; it never changes the memory gate or
      # the deploy path.
      - name: Observe build memory budget after Rollup cap
        id: build_memory_budget
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BUILD_MEMORY_BUDGET_BASELINE_PEAK_RSS_MB: '13200'
          BUILD_MEMORY_BUDGET_BASELINE_LABEL: 'pre-merge run #36355 (~13.2 GB RSS)'
          BUILD_MEMORY_BUDGET_MAX_WALL_SECONDS: '21000'
          BUILD_MEMORY_BUDGET_REPORT_PATH: /tmp/build-memory-peak.json
          BUILD_MEMORY_BUDGET_BUILD_OUTCOME: ${{ steps.build_step.outcome }}
          BUILD_MEMORY_BUDGET_BREACH: ${{ steps.memguard.outputs.breach }}
          BUILD_MEMORY_BUDGET_PEAK_RSS_MB: ${{ steps.memguard.outputs.peak_rss_mb }}
          BUILD_MEMORY_BUDGET_PEAK_ANON_MB: ${{ steps.memguard.outputs.peak_anon_mb }}
          BUILD_MEMORY_BUDGET_WALL_SECONDS: ${{ steps.build_step.outputs.wall_seconds }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const budgetNumericMetric = (value) => {
            const text = String(value ?? '').trim();
            if (!/^\d+(?:\.\d+)?$/.test(text)) return null;
            const number = Number(text);
            return Number.isFinite(number) ? number : null;
          };

          const budgetMarkdownCell = (value) => String(value ?? 'unknown').replaceAll('|', '\\|');

          function buildMemoryBudgetObserved() {
            const baselineRss = budgetNumericMetric(process.env.BUILD_MEMORY_BUDGET_BASELINE_PEAK_RSS_MB);
            const maxWallSeconds = budgetNumericMetric(process.env.BUILD_MEMORY_BUDGET_MAX_WALL_SECONDS);
            const budgetPeakRss = budgetNumericMetric(process.env.BUILD_MEMORY_BUDGET_PEAK_RSS_MB);
            const budgetPeakAnon = budgetNumericMetric(process.env.BUILD_MEMORY_BUDGET_PEAK_ANON_MB);
            const budgetWallSeconds = budgetNumericMetric(process.env.BUILD_MEMORY_BUDGET_WALL_SECONDS);
            const reportPath = String(process.env.BUILD_MEMORY_BUDGET_REPORT_PATH ?? '').trim();
            const budgetBuildOutcome = String(process.env.BUILD_MEMORY_BUDGET_BUILD_OUTCOME ?? '').trim() || 'unknown';
            const breach = String(process.env.BUILD_MEMORY_BUDGET_BREACH ?? '').trim();
            const baselineLabel = String(process.env.BUILD_MEMORY_BUDGET_BASELINE_LABEL ?? '').trim() || 'baseline unavailable';

            let budgetReportAvailable = false;
            try {
              const stat = fs.statSync(reportPath);
              budgetReportAvailable = stat.isFile() && stat.size > 0;
            } catch {
              budgetReportAvailable = false;
            }

            const missing = [];
            if (!budgetReportAvailable) missing.push('report');
            if (budgetPeakRss === null) missing.push('peak_rss_mb');
            if (budgetPeakAnon === null) missing.push('peak_anon_mb');
            if (budgetWallSeconds === null) missing.push('wall_seconds');
            const comparable = missing.length === 0;
            const reportStatus = budgetReportAvailable
              ? (missing.length === 0 ? 'available' : `partial: missing ${missing.join(', ')}`)
              : 'missing';

            const rssDelta = budgetPeakRss !== null && baselineRss !== null ? budgetPeakRss - baselineRss : null;
            const rssComparison = rssDelta === null
              ? 'not-comparable: RSS or baseline unavailable'
              : `${rssDelta >= 0 ? '+' : ''}${rssDelta} MB vs ${baselineRss} MB`;
            const wallComparison = budgetWallSeconds === null || maxWallSeconds === null
              ? 'not-comparable: duration unavailable'
              : budgetWallSeconds > maxWallSeconds
                ? `over 350-minute budget (${budgetWallSeconds}s > ${maxWallSeconds}s)`
                : `within 350-minute budget (${budgetWallSeconds}s <= ${maxWallSeconds}s)`;
            const comparability = comparable
              ? 'comparable: complete memory and duration report'
              : `not-comparable: missing ${missing.join(', ')}`;

            const triggers = [];
            if (breach) triggers.push(`revert: dynamic memory threshold breached (${breach})`);
            if (budgetWallSeconds !== null && maxWallSeconds !== null && budgetWallSeconds > maxWallSeconds) {
              triggers.push(`revert: wall_seconds exceeded 350-minute budget (${budgetWallSeconds}s)`);
            }
            const revertTrigger = triggers.length > 0
              ? triggers.join('; ')
              : comparable
                ? 'not-triggered: no memory breach and duration within 350-minute budget'
                : 'not-comparable: report unavailable or incomplete; do not infer a pass';

            const summary = [
              '### Build memory budget after Rollup cap (advisory)',
              '',
              'The first complete post-merge build is the comparison point for PR #17596; this observer is read-only.',
              '',
              '| metric | observed | baseline / budget | comparison |',
              '| --- | ---: | ---: | --- |',
              `| peak_rss_mb | \`${budgetMarkdownCell(budgetPeakRss)}\` | \`${budgetMarkdownCell(baselineLabel)}\` | \`${budgetMarkdownCell(rssComparison)}\` |`,
              `| peak_anon_mb | \`${budgetMarkdownCell(budgetPeakAnon)}\` | not recorded in ${budgetMarkdownCell(baselineLabel)} | n/a |`,
              `| wall_seconds | \`${budgetMarkdownCell(budgetWallSeconds)}\` | \`<= ${budgetMarkdownCell(maxWallSeconds)}\` (350 minutes) | \`${budgetMarkdownCell(wallComparison)}\` |`,
              `| report availability | \`${budgetMarkdownCell(reportStatus)}\` | RSS + anon peak + duration required | \`${budgetMarkdownCell(comparability)}\` |`,
              `| build outcome | \`${budgetMarkdownCell(budgetBuildOutcome)}\` | success expected | n/a |`,
              `| revert trigger | \`${budgetMarkdownCell(revertTrigger)}\` | timeout or duration >350 minutes | n/a |`,
              '',
              'Missing data stays non-comparable; the memory guard, Rollup cap, and deploy behavior are unchanged.',
              '',
            ].join('\n');

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) fs.appendFileSync(summaryPath, summary);
            else process.stdout.write(summary);

            const outputs = [
              `report_status=${reportStatus}`,
              `comparable=${comparable}`,
              `peak_rss_delta_mb=${rssDelta ?? 'unknown'}`,
              `wall_budget_status=${wallComparison}`,
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${outputs}\n`);
            console.log(
              `[buildMemoryBudgetObserved] report=${reportStatus} comparable=${comparable} ` +
              `peak_rss_mb=${budgetPeakRss ?? 'unknown'} peak_anon_mb=${budgetPeakAnon ?? 'unknown'} ` +
              `wall_seconds=${budgetWallSeconds ?? 'unknown'} trigger=${revertTrigger}`,
            );
          }

          buildMemoryBudgetObserved();
          NODE

      # Run 42293933497 rendered 33,689 cards in 4,036s with zero cache hits,
      # then failed a later full-corpus SEO gate. Save once the OG plugin marks
      # its completed pass, even if that later gate fails. Each WebP is atomic;
      # a missing entry is rendered on the next run. The marker avoids saving a
      # cold/empty cache when the build failed before the plugin ran.
      - name: Save per-job OG images after successful build
        if: ${{ always() && matrix.locale == 'it' && steps.job_og_images_cache.outcome == 'success' && hashFiles('.cache/og-jobs/.complete') != '' && (steps.build_step.outcome == 'success' || steps.build_step.outcome == 'failure') }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/og-jobs
          key: og-jobs-${{ runner.os }}-${{ steps.job_og_image_version.outputs.version }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}-${{ github.run_id }}

      # Non-IT publisher tails and section-shard staging run in separate
      # directories/runners. Hand off the exact list the IT renderer deferred
      # so their offloader rewrites those previews to the emitted archive card.
      - name: Prepare deferred job OG fallback handoff
        if: matrix.locale == 'it' && steps.build_step.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/job-og-deferred"
          if [ -s .cache/og-jobs/.deferred-fallbacks.json ]; then
            cp .cache/og-jobs/.deferred-fallbacks.json "$RUNNER_TEMP/job-og-deferred/fallbacks.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/job-og-deferred/fallbacks.json"
          fi
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(v)||v.some(s=>typeof s!=="string"||!s||s.includes("/")||s.includes("\\")))process.exit(1)' "$RUNNER_TEMP/job-og-deferred/fallbacks.json"

      - name: Upload deferred job OG fallback handoff
        if: matrix.locale == 'it' && steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: job-og-deferred-fallbacks-${{ github.run_id }}
          path: ${{ runner.temp }}/job-og-deferred/fallbacks.json
          retention-days: 8
          if-no-files-found: error

      - name: Build profile summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Build phase timing'
            echo
            echo '| marker | detail |'
            echo '|---|---|'
            if [ -f /tmp/build.log ]; then
              awk '
                /^\[phase-timing/ {
                  marker = $1
                  sub(/^\[/, "", marker)
                  sub(/\]$/, "", marker)
                  detail = $0
                  sub(/^\[[^]]+\][[:space:]]*/, "", detail)
                  gsub(/\|/, "&#124;", detail)
                  printf "| `%s` | %s |\n", marker, detail
                  found = 1
                }
                END {
                  if (!found) print "| _none_ | no phase timing markers emitted |"
                }
              ' /tmp/build.log
            else
              echo '| _none_ | /tmp/build.log was not produced |'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory phase observer (#9247): the build-profile history already
      # contains the same-locale baselines. Keep the table and the +30% alarm
      # outside the publish path; a missing history row must never stop deploy.
      - name: Observe phase timing per locale
        id: phase_timing
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PHASE_TIMING_LOG: /tmp/build.log
          PHASE_TIMING_HISTORY: data/build-history/memory-peaks.jsonl
          PHASE_TIMING_LOCALE: ${{ matrix.locale }}
          PHASE_TIMING_ALERT_FILE: ${{ runner.temp }}/phase-timing-alert.md
          PHASE_TIMING_JOB_OG_CACHE_MATCHED_KEY: ${{ steps.job_og_images_cache.outputs.cache-matched-key }}
        run: node scripts/ci/phase-timing-observer.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report build phase timing regression to GitHub Issues
        if: always() && steps.phase_timing.outputs.alert == 'true'
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          title: 'Build phase timing regression (+30% median)'
          closed-by: sibling-resolve-step
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '3'
          labels: Bug
          entity: ${{ matrix.locale }}
          diag-file: ${{ runner.temp }}/phase-timing-alert.md
          context: |
            - Il deploy resta non bloccante: questa è una misura advisory della gamba `${{ matrix.locale }}`.
            - L'allarme scatta solo quando una fase supera del 30% la mediana della stessa lingua con almeno tre campioni.
            - La tabella completa è nel riepilogo della gamba e la riga misurata viene conservata nello storico build-profile.

      - name: Incremental manifest shadow report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MANIFEST_PREVIOUS: .cache/incremental-manifest-prev/${{ matrix.locale }}.jsonl
          MANIFEST_CURRENT: .cache/incremental-manifest/${{ matrix.locale }}.jsonl
        run: |
          set -o pipefail
          {
            echo '## Incremental manifest shadow report'
            echo
            if [ -f "$MANIFEST_PREVIOUS" ] && [ -f "$MANIFEST_CURRENT" ]; then
              node scripts/ci/incremental-manifest-report.mjs "$MANIFEST_PREVIOUS" "$MANIFEST_CURRENT"
            elif [ -f "$MANIFEST_CURRENT" ]; then
              echo "Previous: $MANIFEST_PREVIOUS (missing; first run or cache miss, no comparison)"
              echo "Current: $MANIFEST_CURRENT ($(wc -l < "$MANIFEST_CURRENT") JSONL lines)"
            else
              echo "Current: $MANIFEST_CURRENT (missing; build did not write a manifest)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # W0-G: every `node` that reads `dist` below carries an EXPLICIT heap limit.
      # Run 43131340812 OOM-ed all four legs in `hreflang-index-manifest.mjs dist`
      # because the process ran with Node's default heap. These readers use ~1.2 GB
      # in healthy runs: 6144 MB leaves margin and, unlike raising it, does not
      # compete with the swap. tests/deploy-node-heap-contract.test.ts pins it.
      - name: Verify critical dist pages before upload
        if: matrix.locale == 'it'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/validate-critical-dist-pages.mjs

      - name: Verify build profile markers before upload
        if: matrix.locale == 'it'
        run: node scripts/validate-build-profile-markers.mjs /tmp/build.log

      # Il build IT di produzione E' la misura full-corpus (#9618): questo step
      # certifica che la MISURA sia completa (marker, bridge, righe di profilo,
      # rilascio del corpus). Non certifica il sito, e per questo NON e' un
      # gate del deploy: `continue-on-error` lascia proseguire la pubblicazione
      # e un FAIL apre la issue dedicata "la misura full-corpus del build jobs
      # SEO non e' verificabile" (coppia report/resolve in fondo al job).
      #
      # Perche'. Da #9754 lo step era fail-closed, e un'invariante sbagliata
      # (`previousSlugEntries > 0`, mentre il plugin tiene i previous-slug
      # fuori dalla sitemap di proposito: in produzione vale sempre 0) ha
      # fatto fallire ogni deploy che ha completato la build: run 36065965021
      # (24-09 22:11Z) e 36077807468 (25-09 00:29Z), con build sane, finche'
      # #9773 non ha corretto l'invariante. `deploy-publish.yml` pubblica solo
      # se QUESTA run e' `success`, quindi qualunque rosso di questo job, anche
      # a valle della build, spegne la produzione: una misura non puo' avere
      # quel potere. #9618 chiedeva di impedire una chiusura verde della issue
      # di misura, non il deploy.
      #
      # Cosa resta bloccante, e dove. Una build campionata o troncata non puo'
      # arrivare qui PER COSTRUZIONE: il campionamento jobs SEO lancia su
      # refs/heads/main (build-plugins/shared/jobsSeoSample.ts) e le variabili
      # di campionamento e di arresto anticipato non compaiono in questo file
      # (lo pinna tests/jobs-seo-build-metrics-workflow.test.ts). Le invarianti del
      # validatore passano sui marker REALI di produzione in
      # tests/fixtures/jobs-seo-full-corpus-markers/ (replay in
      # tests/report-jobs-seo-build-metrics.test.ts): un'invariante nuova che
      # la produzione non soddisfa diventa rossa sulla PR, non sul deploy.
      #
      # Lo stderr del validatore contiene SOLO le righe `FAIL:` (validazione o
      # crash dello script): finisce nel diag-file, che e' l'unico estratto che
      # il reporter puo' allegare da dentro un job ancora in corso.
      - name: Validate full-corpus jobs SEO evidence
        id: jobs_seo_evidence
        if: always() && matrix.locale == 'it'
        continue-on-error: true
        shell: bash
        env:
          JOBS_SEO_BUILD_LOG: /tmp/build.log
          JOBS_SEO_MARKERS_OUT: ${{ runner.temp }}/jobs-seo-markers.txt
          JOBS_SEO_EVIDENCE_DIAG: ${{ runner.temp }}/jobs-seo-evidence-diag.txt
          JOBS_SEO_WALL_SECONDS: ${{ steps.build_step.outputs.wall_seconds }}
        run: |
          set +e
          node scripts/ci/report-jobs-seo-build-metrics.mjs "$JOBS_SEO_BUILD_LOG" \
            --require-full-corpus \
            --markers-out="$JOBS_SEO_MARKERS_OUT" \
            --summary-label="production/${{ matrix.locale }}" \
            --wall-seconds="${JOBS_SEO_WALL_SECONDS:-?}" \
            2> "$JOBS_SEO_EVIDENCE_DIAG"
          status=$?
          cat "$JOBS_SEO_EVIDENCE_DIAG" >&2
          if [ "$status" -ne 0 ]; then
            echo "::warning title=jobs SEO full-corpus evidence::misura incompleta, il deploy prosegue; vedi la issue dedicata e il summary"
          fi
          exit "$status"

      - name: Upload full-corpus jobs SEO markers
        if: always() && matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-seo-full-corpus-markers-${{ github.run_id }}
          path: ${{ runner.temp }}/jobs-seo-markers.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Validate owned sitemap pages before locale prune
        id: validate-owned-sitemap-pages
        env:
          LOCALE_SITEMAP_MANIFEST_OUT: ${{ runner.temp }}/locale-sitemap-manifest-${{ matrix.locale }}.json
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          BASE_ARTIFACT_NAME: ${{ matrix.locale == 'it' && format('it-publish-root-{0}', github.run_id) || format('locale-shard-source-{0}-{1}', matrix.locale, github.run_id) }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          export LIVE_SHARD_SECTIONS="$(node scripts/ci/list-live-shard-sections.mjs --exclude-build-skipped)"
          node scripts/validate-sitemap-links.mjs \
            --owned-locale="${{ matrix.locale }}" \
            --manifest-out="$LOCALE_SITEMAP_MANIFEST_OUT"
          test -s "$LOCALE_SITEMAP_MANIFEST_OUT"

      - name: Upload expired archive publication evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: expired-archive-evidence-${{ matrix.locale }}-${{ github.run_id }}
          path: dist/assets/expired-archive-evidence-${{ matrix.locale }}.json
          retention-days: 8
          if-no-files-found: error

      # The in-build BUILD_LOCALE filter only gates WriteCollector writes;
      # direct-fs.writeFileSync emitters (redirect/bridge/weather/alias) still
      # write every locale. This removes the non-owned locale output the same
      # way deploy.yml copies only dist/<locale> to each shard repo.
      - name: Prune to locale shard
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ci/prune-locale-shard.mjs dist

      # Run artifact checks after removing other locales. The dotfile audit
      # still runs in every owner leg; non-IT JobPosting schema is also checked
      # after finalization by deploy-publish before any shard push.
      - name: Reject generated HTML under dotfile paths
        run: npm run audit:no-dotfile-html

      # The Pages payload is published by the IT leg. Check its final locale
      # artifact here instead of reopening every locale's HTML before pruning.
      - name: Validate IT JobPosting schema before artifact upload
        if: matrix.locale == 'it'
        run: npm run validate:jobposting-schema

      # First publish only this leg's complete manifest. Non-IT source artifacts
      # defer the rewrite to deploy-publish.yml, after this build run has ended;
      # that avoids holding three build runners at the slowest locale's barrier.
      # IT still rewrites here because its Pages artifact is produced in this
      # workflow. The barrier remains fail-closed and checks the same run/attempt.
      - name: Hreflang index manifest (pre-barrier, no rewrite)
        id: hreflang-index-manifest-pre
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          rm -rf .cache/hreflang-index-manifest
          mkdir -p .cache/hreflang-index-manifest
          args=(--manifest-dir .cache/hreflang-index-manifest --dry-run --manifest-only)
          if [[ '${{ matrix.locale }}' == 'it' ]]; then
            args+=(--prepass-cache .cache/hreflang-index-manifest/it.pages.jsonl)
          fi
          node scripts/ci/hreflang-index-manifest.mjs dist "${args[@]}"

      # Artifacts, not actions/cache: a cache restore turns a download failure
      # into a warning plus a miss, and a workflow cannot retry it. The manifest
      # is mandatory, so run 41088323300 lost three legs after two hours of
      # build to one `Egress is over the account limit` answer. Same key as
      # before: run id and attempt, so a leg never reads another attempt. Keep
      # these tiny manifests one day longer than the two-day source tarballs:
      # a delayed/retried publisher must not outlive its hreflang inputs.
      - name: Publish hreflang index manifest (${{ matrix.locale }})
        id: publish-hreflang-index-manifest
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hreflang-index-manifest-${{ matrix.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/hreflang-index-manifest/${{ matrix.locale }}.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

      - name: Retry hreflang index manifest publish (${{ matrix.locale }})
        if: steps.publish-hreflang-index-manifest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: hreflang-index-manifest-${{ matrix.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/hreflang-index-manifest/${{ matrix.locale }}.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      # One step for the barrier and the download. The script retries transient
      # errors and validates each manifest, so a missing, truncated, or foreign
      # manifest cannot be interpreted as an unknown member and let one shard
      # publish a different graph. The barrier ends 260 minutes after the job
      # start, not after a fixed wait: how far apart the legs arrive depends on
      # their cache hits. Then 20 minutes of downloads at most.
      - name: Exchange same-run hreflang manifests
        if: matrix.locale == 'it'
        id: exchange-hreflang-index-manifests
        timeout-minutes: 285
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HREFlANG_BUILD_LOCALE: ${{ matrix.locale }}
          HREFlANG_JOB_START_EPOCH: ${{ env.CDN_JOB_START_EPOCH }}
          HREFlANG_RUN_ID: ${{ github.run_id }}
          HREFlANG_RUN_ATTEMPT: ${{ github.run_attempt }}
          # Keep the normal 30s barrier cheap, but automatically move to a
          # bounded 2m interval after three explicit API rate-limit warnings or
          # when the observed x-ratelimit-remaining headroom falls below 10%.
          # The exchange script records both the trigger and final snapshot in
          # the step summary; this is a reversible quota guard, not a relaxed
          # manifest correctness check.
          HREFLANG_QUOTA_REVERT_THRESHOLD: '3'
          HREFLANG_QUOTA_REVERT_POLL_MS: '120000'
          HREFLANG_QUOTA_REMAINING_FLOOR_PERCENT: '10'
        run: node scripts/ci/exchange-hreflang-manifests.mjs --manifest-dir .cache/hreflang-index-manifest

      # Every decision is taken before the first rename. Writes are staged in
      # bounded batches; a failed batch rolls itself back, and any later failure
      # aborts this leg before packing or publishing its partially changed dist.
      # No step mutates dist between the pre-pass and this rewrite; artifact
      # exchange touches only manifests, so this page list is safe to reuse.
      - name: Hreflang index manifest (keep only reciprocal indexable clusters)
        if: matrix.locale == 'it'
        id: hreflang-index-manifest
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ci/hreflang-index-manifest.mjs dist --manifest-dir .cache/hreflang-index-manifest --require-foreign-manifests --reuse-prepass-cache .cache/hreflang-index-manifest/it.pages.jsonl

      - name: Refresh expired archive evidence after Hreflang rewrite
        if: matrix.locale == 'it'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ci/shard-content-manifest.mjs refresh-expired-archive-evidence --root dist --locale it --evidence-manifest dist/assets/expired-archive-evidence-it.json

      # Keep this source-side validation successful for the locale provenance
      # receipt consumed by resolve-publish-plan. Non-IT publish repeats it
      # after the deferred hreflang rewrite, before any shard side effects.
      - name: Validate locale shard output
        id: validate-locale-shard
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      # Owner decision 2026-10-24: an active job ALWAYS emits JobPosting.
      # Blocking and zero tolerance (it judges this build's own output, not the
      # reassembled corpus): every active detail the jobs SEO plugin recorded
      # must still carry JobPosting in the final, pruned dist. PR 11394 removed
      # it silently for 20 days; the plugin's in-build assertion covers the
      # render, this covers every step after it.
      - name: Assert active JobPosting coverage
        env:
          JOBPOSTING_COVERAGE_OUT: ${{ runner.temp }}/jobposting-coverage.json
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ci/assert-active-jobposting-coverage.mjs dist

      # The publisher has parallel locale jobs. Persist one compact exact Git
      # tree-entry measurement per source locale so a single preflight can
      # choose one sticky layout for the section before any locale pushes.
      - name: Measure section tree layouts for cross-locale preflight
        env:
          SECTION_TREE_METRICS_LOCALE: ${{ matrix.locale }}
          SECTION_TREE_METRICS_SOURCE_RUN_ID: ${{ github.run_id }}
          SECTION_TREE_METRICS_SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SECTION_TREE_METRICS_SOURCE_SHA: ${{ github.sha }}
          SHARD_REMOTE_TREE_LIMIT_BYTES: '52428800'
          SECTION_TREE_METRICS_OUT: ${{ runner.temp }}/section-tree-layout-metrics/${{ matrix.locale }}.json
        run: |
          set -euo pipefail
          node scripts/ci/measure-section-tree-layout-metrics.mjs \
            --dist dist \
            --locale "$SECTION_TREE_METRICS_LOCALE" \
            --source-run-id "$SECTION_TREE_METRICS_SOURCE_RUN_ID" \
            --source-run-attempt "$SECTION_TREE_METRICS_SOURCE_RUN_ATTEMPT" \
            --source-sha "$SECTION_TREE_METRICS_SOURCE_SHA" \
            --tree-limit "$SHARD_REMOTE_TREE_LIMIT_BYTES" \
            --out "$SECTION_TREE_METRICS_OUT"

      - name: Upload section tree layout metrics
        uses: actions/upload-artifact@v7
        with:
          name: section-tree-layout-metrics-${{ matrix.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/section-tree-layout-metrics/${{ matrix.locale }}.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      # The build runner hands the non-IT tail to deploy-publish.yml as one
      # compact, immutable source artifact. It contains the already validated
      # locale subtree, before section stripping/offload/push work begins;
      # keeping this handoff here releases the six-hour build budget instead
      # of making every non-IT leg carry its own transfer tail.
      # LOCALE_SOURCE_TAR_PARTS > 1 cuts the same file list into N contiguous
      # slices packed by N concurrent tar processes (scripts/lib/parallel-tar.sh):
      # one `tar -cf` over ~1M one-directory-per-page files is latency-bound
      # (fr 23.3 min, de 13.2, en 10.7 on deploy 39917633944, plus a full
      # `tar -tf` read-back). With PTAR_ZSTD=1 every part is zstd-compressed on
      # its own core and the upload stores it as-is (compression-level 0)
      # instead of deflating the whole archive on one thread. The parts hold
      # exactly the entries of the single tar; the tail extracts them all.
      # LOCALE_SOURCE_TAR_PARTS=1 → the historical single tar, byte for byte.
      - name: Pack non-IT locale shard source artifact
        if: matrix.locale != 'it'
        id: pack-locale-source
        continue-on-error: true
        env:
          # Bench run 40074671144 on a 3.8 GB / 270'838-file subtree: pack
          # 152.3 s → 76.6 s, archive 4.67 GB tar (833 MB once deflated by the
          # upload) → 363 MB zstd, upload 37 s → 5 s, download 22 s → 6 s,
          # extract 49.5 s → 32.9 s; extracted tree sha identical.
          LOCALE_SOURCE_TAR_PARTS: '4'
          PTAR_ZSTD: '1'
        run: |
          set -euo pipefail
          trap 'echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          source scripts/lib/parallel-tar.sh
          printf '%s\n' "${DEPLOY_BUILD_ID}" > dist/build-id.txt
          members=("${{ matrix.locale }}" build-id.txt)
          manifest="$RUNNER_TEMP/locale-sitemap-manifest-${{ matrix.locale }}.json"
          test -s "$manifest"
          cp "$manifest" dist/locale-sitemap-manifest.json
          members+=(locale-sitemap-manifest.json)
          evidence="assets/expired-archive-evidence-${{ matrix.locale }}.json"
          test -s "dist/$evidence"
          members+=("$evidence")
          if [ -f "dist/${{ matrix.locale }}.html" ]; then
            members+=("${{ matrix.locale }}.html")
          fi
          if [ -f dist/404.html ]; then
            members+=(404.html)
          fi
          out="$RUNNER_TEMP/locale-shard-source-${{ matrix.locale }}"
          rm -rf "$out"
          ptar_create dist "$out" "locale-shard-source-${{ matrix.locale }}" "${LOCALE_SOURCE_TAR_PARTS:-1}" "${members[@]}"
          find "$out" -maxdepth 1 -type f \( -name '*.tar' -o -name '*.tar.zst' \) -size +0 | grep -q .
          grep -qx "${{ matrix.locale }}/" "$out/locale-shard-source-${{ matrix.locale }}.members"
          rm -f "$out/locale-shard-source-${{ matrix.locale }}.members"
          # Non-IT source tarballs stay raw until deploy-publish has all four
          # same-run manifests. Keep this sidecar outside the tar so it cannot
          # leak into the published locale shard.
          printf '%s\n' 'same-run-hreflang-rewrite-pending-v1' > "$out/hreflang-finalization-required.txt"
          if [ "${PTAR_ZSTD:-}" = 1 ] && [ "${LOCALE_SOURCE_TAR_PARTS:-1}" -gt 1 ]; then
            echo "compression_level=0" >> "$GITHUB_OUTPUT"
          else
            echo "compression_level=1" >> "$GITHUB_OUTPUT"
          fi
          ls -l "$out"

      - name: Upload non-IT locale shard source artifact
        if: matrix.locale != 'it'
        id: upload-locale-source
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: locale-shard-source-${{ matrix.locale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/locale-shard-source-${{ matrix.locale }}/
          compression-level: ${{ steps.pack-locale-source.outputs.compression_level || '1' }}
          retention-days: 2
          if-no-files-found: error

      # IT publishing starts in deploy-publish.yml after the source build and
      # build-time validation finish. This job packages the immutable source
      # root, section groups, and build provenance; CDN, shard, manifest,
      # strip, Pages, sitemap, and metadata work stays in the publisher tail.
      # Persist the fully rendered, already validated jobs SEO pages before
      # remote publication starts. Run 42313737885 missed this cache, spent
      # 4909s in jobs-seo-pages, then timed out before the old save step near
      # the end of the job. A later CDN/shard failure must not make the next
      # build render the same corpus again. Cache storage is optional and must
      # not hold up publication if the cache service stalls.
      - name: Check jobs SEO HTML cache contents
        if: always() && env.JOBS_SEO_REUSE == '1'
        id: jobs-seo-html-content
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .cache/incremental-html ] && test -n "$(find .cache/incremental-html -type f -print -quit 2>/dev/null)"; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save jobs SEO HTML cache
        id: jobs-seo-html-save
        if: success() && env.JOBS_SEO_REUSE == '1' && steps.jobs-seo-html-content.outputs.has_files == 'true' && hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) != ''
        timeout-minutes: 30
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-html
          key: jobs-seo-html-${{ matrix.locale }}-${{ hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) }}-${{ steps.jobs-seo-html-fingerprint.outputs.fingerprint }}

      # Keep the fully rendered IT cache if another locale dies at the
      # same-run hreflang barrier. This fallback is eligible only after IT's
      # build and all preceding local validation/manifest steps succeeded; it
      # stores renderer output, not the published artifact, so the barrier and
      # post-rewrite validation remain mandatory on the next publish.
      - name: Save jobs SEO HTML cache after hreflang barrier failure
        id: jobs-seo-html-barrier-save
        if: >-
          ${{ always() &&
              matrix.locale == 'it' &&
              env.JOBS_SEO_REUSE == '1' &&
              steps.exchange-hreflang-index-manifests.outcome == 'failure' &&
              steps.jobs-seo-html-content.outputs.has_files == 'true' &&
              steps.build_step.outcome == 'success' &&
              steps.validate-owned-sitemap-pages.outcome == 'success' &&
              steps.hreflang-index-manifest-pre.outcome == 'success' &&
              hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) != '' }}
        timeout-minutes: 30
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-html
          key: jobs-seo-html-${{ matrix.locale }}-${{ hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) }}-${{ steps.jobs-seo-html-fingerprint.outputs.fingerprint }}

      # Read-only evidence for the opt-in HTML cache. The build already logs
      # one [jobs-seo-reuse] row per page block; join those rows with the
      # Actions restore/save outcomes so a later deploy can distinguish a
      # cache miss from an inactive path. A missing signal stays unknown and
      # this observer can never block publication.
      - name: Observe Jobs SEO HTML cache hit and wall-clock
        id: jobs-seo-cache-hit-observer
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOBS_SEO_CACHE_ENABLED: ${{ env.JOBS_SEO_REUSE == '1' && 'true' || 'false' }}
          JOBS_SEO_CACHE_HIT: ${{ steps.jobs-seo-html-cache.outputs.cache-hit }}
          JOBS_SEO_CACHE_PRIMARY_KEY: ${{ steps.jobs-seo-html-cache.outputs.cache-primary-key }}
          JOBS_SEO_CACHE_MATCHED_KEY: ${{ steps.jobs-seo-html-cache.outputs.cache-matched-key }}
          JOBS_SEO_CACHE_RESTORE_OUTCOME: ${{ steps.jobs-seo-html-cache.outcome }}
          JOBS_SEO_CACHE_SAVE_OUTCOME: ${{ steps.jobs-seo-html-save.outcome }}
          JOBS_SEO_CACHE_BARRIER_SAVE_OUTCOME: ${{ steps.jobs-seo-html-barrier-save.outcome }}
          JOBS_SEO_BUILD_WALL_SECONDS: ${{ steps.build_step.outputs.wall_seconds }}
          JOBS_SEO_CACHE_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail

          jobsSeoCacheHit() {
            case "${JOBS_SEO_CACHE_ENABLED}:${JOBS_SEO_CACHE_HIT:-}" in
              true:true) printf 'hit' ;;
              true:false) printf 'miss' ;;
              *) printf 'unknown' ;;
            esac
          }

          stepOutcome() {
            case "${1:-}" in
              success|failure|cancelled|skipped) printf '%s' "$1" ;;
              *) printf 'unknown' ;;
            esac
          }

          keyOrUnknown() {
            if [ -n "${1:-}" ]; then printf '%s' "$1"; else printf 'unknown'; fi
          }

          cache_state="$(jobsSeoCacheHit)"
          primary_key="$(keyOrUnknown "${JOBS_SEO_CACHE_PRIMARY_KEY:-}")"
          matched_key="$(keyOrUnknown "${JOBS_SEO_CACHE_MATCHED_KEY:-}")"
          restore_outcome="$(stepOutcome "${JOBS_SEO_CACHE_RESTORE_OUTCOME:-}")"
          save_outcome="$(stepOutcome "${JOBS_SEO_CACHE_SAVE_OUTCOME:-}")"
          barrier_save_outcome="$(stepOutcome "${JOBS_SEO_CACHE_BARRIER_SAVE_OUTCOME:-}")"

          reused_pages='unknown'
          rendered_pages='unknown'
          reuse_wall_ms='unknown'
          if [ -s /tmp/build.log ]; then
            reuse_stats="$(awk '
              function numeric(value) {
                return value ~ /^[0-9]+([.][0-9]+)?$/;
              }
              /^\[jobs-seo-reuse\] block=/ {
                rows += 1;
                reused = rendered = wall = "";
                for (i = 1; i <= NF; i += 1) {
                  if ($i ~ /^reused=[0-9]+$/) reused = substr($i, index($i, "=") + 1);
                  else if ($i ~ /^rendered=[0-9]+$/) rendered = substr($i, index($i, "=") + 1);
                  else if ($i ~ /^wall_ms=[0-9]+([.][0-9]+)?$/) wall = substr($i, index($i, "=") + 1);
                }
                if (!numeric(reused) || !numeric(rendered) || !numeric(wall)) {
                  invalid = 1;
                  next;
                }
                reused_total += reused;
                rendered_total += rendered;
                wall_total += wall;
              }
              END {
                if (rows == 0 || invalid) print "unknown";
                else printf "reused_pages=%d rendered_pages=%d reuse_wall_ms=%.1f", reused_total, rendered_total, wall_total;
              }
            ' /tmp/build.log)"
            if [ "$reuse_stats" != 'unknown' ]; then
              for stat in $reuse_stats; do
                case "$stat" in
                  reused_pages=*) reused_pages="${stat#*=}" ;;
                  rendered_pages=*) rendered_pages="${stat#*=}" ;;
                  reuse_wall_ms=*) reuse_wall_ms="${stat#*=}" ;;
                esac
              done
            fi
          fi

          build_wall_seconds="${JOBS_SEO_BUILD_WALL_SECONDS:-}"
          if [[ ! "$build_wall_seconds" =~ ^[0-9]+$ ]]; then build_wall_seconds='unknown'; fi

          {
            echo '### Jobs SEO HTML cache observer'
            echo
            echo '| locale | opt-in | status | key | matched-key | pages reused | reuse wall (ms) | build wall (s) | restore | save | barrier save |'
            echo '|---|---|---|---|---|---:|---:|---:|---|---|---|'
            printf '| `%s` | `%s` | `%s` | `%s` | `%s` | `%s` | `%s` | `%s` | `%s` | `%s` | `%s` |\n' \
              "$JOBS_SEO_CACHE_LOCALE" "$JOBS_SEO_CACHE_ENABLED" "$cache_state" \
              "$primary_key" "$matched_key" "$reused_pages" "$reuse_wall_ms" \
              "$build_wall_seconds" "$restore_outcome" "$save_outcome" "$barrier_save_outcome"
            echo
            echo 'Missing restore, reuse, or timing data is reported as `unknown`; the observer is advisory and does not alter the deploy path.'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "status=$cache_state"
            echo "reused_pages=$reused_pages"
            echo "rendered_pages=$rendered_pages"
            echo "reuse_wall_ms=$reuse_wall_ms"
            echo "build_wall_seconds=$build_wall_seconds"
          } >> "$GITHUB_OUTPUT"

          echo "[jobsSeoCacheHit] locale=$JOBS_SEO_CACHE_LOCALE status=$cache_state matched_key=$matched_key reused_pages=$reused_pages reuse_wall_ms=$reuse_wall_ms build_wall_seconds=$build_wall_seconds restore=$restore_outcome save=$save_outcome barrier_save=$barrier_save_outcome"

      # IT's publishing tail runs in deploy-publish.yml. Hand off a root
      # tar without live section subtrees plus six balanced section source
      # tars; the post-push validation batches remain publisher outputs.
      - name: Package IT publication source artifacts
        if: matrix.locale == 'it'
        id: package-it-publish-source
        env:
          LOCALE_SITEMAP_MANIFEST_OUT: ${{ runner.temp }}/locale-sitemap-manifest-it.json
          ARTICLE_ID: ${{ github.event.inputs.article_id }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          OG_TITLE: ${{ github.event.inputs.og_title }}
          OG_DESCRIPTION: ${{ github.event.inputs.og_description }}
          OG_IMAGE: ${{ github.event.inputs.og_image }}
          ARTICLE_CATEGORY: ${{ github.event.inputs.article_category }}
        run: bash scripts/ci/package-it-publish-source.sh

      - name: Upload IT root publication source
        if: matrix.locale == 'it'
        id: upload-it-publish-root
        uses: actions/upload-artifact@v7
        with:
          name: it-publish-root-${{ github.run_id }}
          path: ${{ runner.temp }}/it-publish-source/root/it-publish-root*.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Upload IT shard publication plan and support files
        if: matrix.locale == 'it'
        id: upload-it-shard-source-plan
        uses: actions/upload-artifact@v7
        with:
          name: it-shard-source-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/it-publish-source/plan/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Upload IT shard source group zurigo
