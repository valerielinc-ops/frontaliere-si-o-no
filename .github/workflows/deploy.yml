          SHARD_VALLESE_IT_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_IT_DEPLOY_KEY }}
          SHARD_VALLESE_EN_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_EN_DEPLOY_KEY }}
          SHARD_VALLESE_DE_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_DE_DEPLOY_KEY }}
          SHARD_VALLESE_FR_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_FR_DEPLOY_KEY }}
          SHARD_ZUGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_IT_DEPLOY_KEY }}
          SHARD_ZUGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_EN_DEPLOY_KEY }}
          SHARD_ZUGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_DE_DEPLOY_KEY }}
          SHARD_ZUGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_FR_DEPLOY_KEY }}
          SHARD_SANGALLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_IT_DEPLOY_KEY }}
          SHARD_SANGALLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_EN_DEPLOY_KEY }}
          SHARD_SANGALLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_DE_DEPLOY_KEY }}
          SHARD_SANGALLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_FR_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Issue #4881 Fase 5 — see ogPagesPlugin.ts's closeBundle docblock
          # for the full contract. When true, this run's build never
          # emitted this section into dist/, so a full-replace push here
          # would force-push a near-empty tree over the live shard —
          # excluded from the loop below instead. MUST stay in lockstep
          # with the build-time emit skip (same two repo variables).
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP }}
        run: |
          set -uo pipefail
          # Each section pushes to its OWN shard repo — one section's push
          # failure (e.g. a corrupted remote clone) must never skip the
          # others. `|| fail=1` absorbs a non-zero exit so every section is
          # always attempted; the step still ends non-zero (red in the
          # Actions UI) when any section genuinely failed. Incident
          # 2026-07-24 (run 30057726623): svizzera-it's push failure silently
          # aborted this loop before zurigo-it was even attempted.
          #
          # Bounded-parallel, not unbounded: push-section-shard.sh's own
          # header (see "$stage ... leaked disk" note) documents issue #4734
          # — concurrent `stage` clones (up to several GB each for
          # ticino/svizzera/zurigo) piling up unfreed exhausted runner disk
          # even under the OLD sequential loop. Capping concurrent in-flight
          # pushes keeps peak `stage` usage bounded to MAX_PARALLEL sections
          # at a time instead of scaling with the full 27-section list.
          MAX_PARALLEL=4
          fail=0
          pids=(); names=()
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            # #4881 Fase 5: build no longer emits this section when its
            # BUILD_EMIT_SKIP flag is on — a full-replace push here would
            # force-push a near-empty dist/ tree over the live shard, wiping
            # it. scripts/publish-article-fast.mjs is this section's only
            # push path once the flag is on (see strip-loop + reconcile
            # workflow disposition in the same PR).
            skip_var="$(echo "$section" | tr a-z A-Z)_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-it: BUILD_EMIT_SKIP=true — excluded from full-replace push (served by fast-publish only)"
              continue
            fi
            bash scripts/lib/push-section-shard.sh "$section" it dist &
            pids+=("$!"); names+=("$section")
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              for idx in "${!pids[@]}"; do
                wait "${pids[$idx]}" || { echo "::warning::${names[$idx]}-it shard push step failed — continuing to the next section"; fail=1; }
              done
              pids=(); names=()
            fi
          done
          for idx in "${!pids[@]}"; do
            wait "${pids[$idx]}" || { echo "::warning::${names[$idx]}-it shard push step failed — continuing to the next section"; fail=1; }
          done
          exit "$fail"

      # Same-run tar artifact for post-deploy-validate-dist's section rehydrate
      # fast path — mirrors "Pack locale shard dist (tar)" below. Previously
      # validate-dist rehydrated each Ticino subtree by `git clone --depth 1`
      # of the ~4 GB shard repo, one locale at a time (~12min wall on run
      # 28564001685). push-section-shard.sh already builds an offloaded staged
      # copy at $RUNNER_TEMP/<section>-src-it/dist/$sub (byte-identical to what
      # it just force-pushed) and leaves it in place instead of deleting it —
      # pack that into one tar per section (same stack-overflow-avoidance
      # reason as the locale tar: upload-artifact enumerates every file, so a
      # raw ~220k-file tree would fail the same way). validate-dist still
      # falls back to the git clone when a given section's artifact is
      # missing/corrupt. Per-section LIVE gate lives INSIDE the loop (not the
      # step `if:`) since each section has its own repo variable.
      - name: Pack section shard dist (tar) for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          set -uo pipefail
          # Bounded-parallel (cap 4, mirrors the push step above): tar +
          # file-count-verify is CPU/IO-bound and independent per section
          # (each reads/writes its own $RUNNER_TEMP/<section>-* paths, no
          # cross-section overlap) — safe to fan out, capped for the same
          # runner-disk-pressure reason as the push step.
          pack_section() {
            local section="$1"
            local live_var="$(echo "$section" | tr a-z A-Z)_SHARD_LIVE"
            if [ "${!live_var:-}" != "true" ]; then
              return 0
            fi
            # Gate on the SAME push ok-marker strip-section-subtree.sh
            # requires (issue #4881 Fase 5 audit finding), not just
            # "$src/$sub" existing. push-section-shard.sh stages "$src/$sub"
            # BEFORE its own index.html assertion / shrink guard can still
            # fail the push — without this check a failed-but-staged push
            # (or, once BUILD_EMIT_SKIP is on, a section the push loop never
            # even attempted) would still get packed and uploaded as a
            # same-run tar, and validate-dist would rehydrate from that
            # incomplete tar instead of correctly falling back to git-clone.
            if [ ! -f "$RUNNER_TEMP/shard-ok-$section-it" ]; then
              echo "no push ok-marker for $section-it (push skipped/failed this run) — validate-dist will fall back to git clone"
              return 0
            fi
            local sub src packed_n src_n
            sub="$(jq -r --arg s "$section" --arg l "it" '.[$s][$l] // empty' scripts/lib/section-shard-slugs.json)"
            src="$RUNNER_TEMP/${section}-src-it/dist"
            if [ ! -d "$src/$sub" ]; then
              echo "no staged $section-it subtree (push skipped/failed) — validate-dist will fall back to git clone"
              return 0
            fi
            tar -C "$src" -cf "$RUNNER_TEMP/$section-dist-it.tar" "$sub"
            ls -lh "$RUNNER_TEMP/$section-dist-it.tar"
            # Byte-identity guard (#2761 item 1): this tar and push-section-shard.sh's
            # own push both read the SAME already-offloaded "$src/$sub" staged copy
            # (see the comment above push_section_shard's stage_src note) — nothing
            # mutates it in between, so the two paths are guaranteed to agree. This
            # count check makes that guarantee self-verifying: if it ever drifts,
            # discard the tar so validate-dist safely falls back to git-clone
            # instead of silently validating a partial/mismatched tree.
            packed_n=$(tar -tf "$RUNNER_TEMP/$section-dist-it.tar" | { grep -vc '/$' || true; })
            src_n=$(find "$src/$sub" -type f | wc -l)
            if [ "$packed_n" -ne "$src_n" ]; then
              echo "::warning::$section-dist-it.tar file count mismatch (packed=$packed_n src=$src_n) — discarding tar, validate-dist will fall back to git-clone"
              rm -f "$RUNNER_TEMP/$section-dist-it.tar"
            fi
            rm -rf "$src"
          }
          MAX_PARALLEL=4
          pids=()
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            pack_section "$section" &
            pids+=("$!")
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              for pid in "${pids[@]}"; do wait "$pid"; done
              pids=()
            fi
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Upload shard batch 1 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-1-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/appenzello-dist-it.tar
            ${{ runner.temp }}/argovia-dist-it.tar
            ${{ runner.temp }}/articolifrontaliere-dist-it.tar
            ${{ runner.temp }}/articolisvizzera-dist-it.tar
            ${{ runner.temp }}/basilea-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 2 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-2-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/berna-dist-it.tar
            ${{ runner.temp }}/friburgo-dist-it.tar
            ${{ runner.temp }}/ginevra-dist-it.tar
            ${{ runner.temp }}/giura-dist-it.tar
            ${{ runner.temp }}/glarona-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 3 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-3-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grigioni-dist-it.tar
            ${{ runner.temp }}/lucerna-dist-it.tar
            ${{ runner.temp }}/neuchatel-dist-it.tar
            ${{ runner.temp }}/nidvaldo-dist-it.tar
            ${{ runner.temp }}/obvaldo-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 4 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-4-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sangallo-dist-it.tar
            ${{ runner.temp }}/sciaffusa-dist-it.tar
            ${{ runner.temp }}/soletta-dist-it.tar
            ${{ runner.temp }}/svitto-dist-it.tar
            ${{ runner.temp }}/svizzera-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 5 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-5-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ticino-dist-it.tar
            ${{ runner.temp }}/turgovia-dist-it.tar
            ${{ runner.temp }}/uri-dist-it.tar
            ${{ runner.temp }}/vallese-dist-it.tar
            ${{ runner.temp }}/vaud-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 6 dist for post-deploy validation
        if: matrix.locale == 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-6-dist-it-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zugo-dist-it.tar
            ${{ runner.temp }}/zurigo-dist-it.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore

      - name: Strip section subtrees (IT)
        if: matrix.locale == 'it'
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
          # Issue #4881 Fase 5: these sections never got an ok-marker this
          # run when BUILD_EMIT_SKIP is on (excluded from the push loop
          # above), so strip-section-subtree.sh would already safely no-op
          # for them (its own ok-marker gate) — skipped explicitly here
          # instead to avoid a permanent "no push ok-marker" ::warning::
          # every deploy that reads like a failure but isn't one.
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP }}
        run: |
          set -uo pipefail
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            skip_var="$(echo "$section" | tr a-z A-Z)_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-it: BUILD_EMIT_SKIP=true — build never emitted this section, no ok-marker, nothing to strip"
              continue
            fi
            bash scripts/lib/strip-section-subtree.sh "$section" it dist
          done

      # ── IT shard → GitHub Pages + CDN (Pages-serving shard) ──────────────
      # deploy-it-pages-prep.sh runs the monolith's post-build bash IN ORDER:
      # SPA fallback, CDN push (exports CDN_BASE), offload, prune-cdn, drop
      # dist/assets, capture sitemaps, pack new sitemap urls, stage bundle,
      # pack tar (exports TAR_BYTES), audit bytes, file delta, refresh
      # url-first-seen. It does NOT commit dist-history (that stays YAML below).
      - name: Deploy prep (IT → Pages + CDN)
        if: matrix.locale == 'it'
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          # CDN publish target: 'pages' (legacy git force-push, default) or 'r2'
          # (Cloudflare R2 S3 sync — instant publish, kills the #2569 gate wait).
          # Flip by setting the repo variable CDN_TARGET=r2 (no code change). R2_*
          # creds are hydrated from Remote Config by the earlier load-rc-env step.
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
        run: bash scripts/lib/deploy-it-pages-prep.sh

      - name: Upload Pages artifact (compression-level 9)
        if: matrix.locale == 'it'
        id: upload-pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          # Level 9 = max deflate compression on the zip envelope. Pages
          # backend extracts the zip first, so our content gets the best
          # compression ratio in transit (~970 MB vs ~1.21 GB at level 6).
          compression-level: 9

      # Register this run's deploy metadata (sha, trigger, optional article_*
      # dispatch inputs) keyed by THIS build run's id. deploy-publish.yml reads
      # it back via `deploy-registry.mjs get --run-id=<this run>` (= the
      # workflow_run.id it is triggered by) to drive the LinkedIn/Reddit article
      # posting gate + live-meta wait. It lived in the deploy job before the
      # build/publish split — but only the BUILD run sees the workflow_dispatch
      # article inputs, so it is saved here (the workflow_run-triggered publish
      # run cannot read them).
      - name: Save deploy metadata to Firestore
        if: matrix.locale == 'it' && success()
        continue-on-error: true
        env:
          ARTICLE_ID: ${{ github.event.inputs.article_id }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          OG_TITLE: ${{ github.event.inputs.og_title }}
          OG_DESCRIPTION: ${{ github.event.inputs.og_description }}
          OG_IMAGE: ${{ github.event.inputs.og_image }}
          ARTICLE_CATEGORY: ${{ github.event.inputs.article_category }}
        run: |
          node scripts/deploy-registry.mjs save \
            --run-id="${{ github.run_id }}" \
            --sha="${{ github.sha }}" \
            --trigger="${{ github.event_name }}" \
            --article-id="${ARTICLE_ID}" \
            --article-url="${ARTICLE_URL}" \
            --og-title="${OG_TITLE}" \
            --og-description="${OG_DESCRIPTION}" \
            --og-image="${OG_IMAGE}" \
            --article-category="${ARTICLE_CATEGORY}"

      # Single small artifact (~tens of KB) consumed by validate-live for
      # IndexNow / Google Indexing diff. Lets validate-live skip the
      # 1.5 GB github-pages artifact entirely.
      - name: Upload sitemaps bundle artifact
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-${{ github.run_id }}
          path: /tmp/sitemaps-bundle/
          retention-days: 1
          if-no-files-found: ignore

      # Master source data for post-deploy validators (jobs.json +
      # jobs-crawler-summaries.json). Downloaded back into data/ by
      # post-deploy-validate-dist.
      - name: Upload master source data for post-deploy validators
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: jobs-master-${{ github.run_id }}
          path: |
            data/jobs.json
            data/jobs-crawler-summaries.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload pre-deploy snapshot for post-deploy validation
        if: matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-snapshot-${{ github.run_id }}
          path: /tmp/pre-deploy-sitemap-urls.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload write-collisions analysis
        if: always() && matrix.locale == 'it'
        uses: actions/upload-artifact@v7
        with:
          name: write-collisions-analysis-${{ github.run_id }}
          path: |
            dist/.write-collisions.json
            dist/.write-collisions-data/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Detect previous-slug winners changes
        if: matrix.locale == 'it'
        id: winners_changed
        run: |
          if git diff --quiet -- data/previous-slug-winners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous-slug winners for post-deploy validation
        if: matrix.locale == 'it' && steps.winners_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winners-${{ github.run_id }}
          path: data/previous-slug-winners.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit dist-size-history row + url-first-seen updates
        if: matrix.locale == 'it'
        continue-on-error: true
        run: |
          if git diff --quiet -- data/dist-size-history.jsonl data/url-first-seen.json; then
            echo "[dist-history] no diff to commit"
            exit 0
          fi
          git config user.name "dist-history-bot"
          git config user.email "dist-history-bot@frontaliereticino.ch"
          # Wire up the custom merge driver declared in .gitattributes for
          # data/url-first-seen.json (`merge=json-first-seen`). Without this
          # config the attribute is inert and git falls back to a 3-way text
          # merge → the very CONFLICT that wedged this loop. The driver unions
          # the two URL→date maps keeping the earliest first-seen, so the
          # rebase below auto-resolves instead of aborting.
          git config merge.json-first-seen.driver \
            'node scripts/ci/merge-json-first-seen.mjs %O %A %B'
          git add data/dist-size-history.jsonl data/url-first-seen.json
          git commit -m "chore(dist-history): append run ${GITHUB_RUN_ID} (${GITHUB_SHA::8})"
          # The build job leaves dist/ and other generated files dirty
          # in the working tree. `git pull --rebase` refuses to run
          # while unstaged changes exist (`cannot pull with rebase: You
          # have unstaged changes`), so we ran the retry loop three
          # times for nothing on every deploy and the url-first-seen
          # update never landed on origin. `rebase.autoStash=true`
          # stashes those untracked/unstaged files before rebase and
          # pops them back after — purely scoped to this command, no
          # leftover stash state.
          # Bumped 3 → 5 attempts + geometric-ish backoff
          # (5/10/15/25/40 s) after annotation on run 26604491084 (and
          # every prior deploy): `[dist-history] push failed after 3
          # attempts`. Concurrent producers on main (crawlers +
          # thin-promotions + fuel + weather + post-merge auto-commits)
          # regularly out-race a 3×5 s window. The extended budget hits
          # a ~95 s total wait before giving up, which empirically
          # covers every observed conflict cluster on the main branch.
          # Both committed files now auto-resolve during the rebase via
          # .gitattributes merge drivers: `merge=union` for the JSONL append
          # log, and `merge=json-first-seen` (configured above) for the
          # url-first-seen.json map. Historically url-first-seen.json had NO
          # driver, so a concurrent producer touching nearby lines left the
          # tree mid-rebase; without aborting, every later attempt died on
          # "Pulling is not possible because you have unmerged files" and the
          # loop wedged until the job was canceled (run 27976954013, and again
          # run 28142157430 where all 5 attempts CONFLICTed). The `--abort`
          # below stays as a belt-and-braces recovery for any unexpected
          # mid-rebase state; it is a safe no-op when no rebase is in progress
          # (e.g. a plain push-rejected race).
          # `rebase.backend=merge` is forced explicitly (git >=2.26 default,
          # but not guaranteed on every runner image): the `apply` backend
          # replays patches instead of doing a real merge and SILENTLY
          # SKIPS merge drivers, so the json-first-seen driver above would
          # never fire and the CONFLICT wedge (see above) could reappear
          # with no signal (#2921, follow-up of #2920).
          for i in 1 2 3 4 5; do
            if git -c rebase.autoStash=true -c rebase.backend=merge \
                pull --rebase origin main \
                && git push origin HEAD:main; then
              echo "[dist-history] pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            case "$i" in
              1) sleep 5 ;;
              2) sleep 10 ;;
              3) sleep 15 ;;
              4) sleep 25 ;;
              5) sleep 40 ;;
            esac
          done
          echo "::warning::[dist-history] push failed after 5 attempts — url-first-seen.json will not be available to the next build's grace-window check"

      # ── Section shards (non-IT) → frontaliere-<section>-<loc> shard repos ──
      # Section shard push FIRST (before the offload below) so
      # push-section-shard.sh stages the RAW subtree and offloads its own
      # copy exactly once; then strip it so the locale shard drops below the
      # 10 GB Pages cap. One repo PER (section, locale) (frontaliere-<section>-<loc>).
      # Push gates on the deploy key; strip on <SECTION>_SHARD_LIVE + the push
      # ok-marker.
      - name: Push section shards (non-IT → frontaliere-<section>-<loc>)
        if: matrix.locale != 'it'
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          SHARD_SVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_IT_DEPLOY_KEY }}
          SHARD_SVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_EN_DEPLOY_KEY }}
          SHARD_SVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_DE_DEPLOY_KEY }}
          SHARD_SVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_FR_DEPLOY_KEY }}
          SHARD_ZURIGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_IT_DEPLOY_KEY }}
          SHARD_ZURIGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_EN_DEPLOY_KEY }}
          SHARD_ZURIGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_DE_DEPLOY_KEY }}
          SHARD_ZURIGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_FR_DEPLOY_KEY }}
          SHARD_ARGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_IT_DEPLOY_KEY }}
          SHARD_ARGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_EN_DEPLOY_KEY }}
          SHARD_ARGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_DE_DEPLOY_KEY }}
          SHARD_ARGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_FR_DEPLOY_KEY }}
          SHARD_APPENZELLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_IT_DEPLOY_KEY }}
          SHARD_APPENZELLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_EN_DEPLOY_KEY }}
          SHARD_APPENZELLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_DE_DEPLOY_KEY }}
          SHARD_APPENZELLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_FR_DEPLOY_KEY }}
          SHARD_BASILEA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_IT_DEPLOY_KEY }}
          SHARD_BASILEA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_EN_DEPLOY_KEY }}
          SHARD_BASILEA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_DE_DEPLOY_KEY }}
          SHARD_BASILEA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_FR_DEPLOY_KEY }}
          SHARD_BERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_IT_DEPLOY_KEY }}
          SHARD_BERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_EN_DEPLOY_KEY }}
          SHARD_BERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_DE_DEPLOY_KEY }}
          SHARD_BERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_FR_DEPLOY_KEY }}
          SHARD_FRIBURGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_IT_DEPLOY_KEY }}
          SHARD_FRIBURGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_EN_DEPLOY_KEY }}
          SHARD_FRIBURGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_DE_DEPLOY_KEY }}
          SHARD_FRIBURGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_FR_DEPLOY_KEY }}
          SHARD_GINEVRA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_IT_DEPLOY_KEY }}
          SHARD_GINEVRA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_EN_DEPLOY_KEY }}
          SHARD_GINEVRA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_DE_DEPLOY_KEY }}
          SHARD_GINEVRA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_FR_DEPLOY_KEY }}
          SHARD_GLARONA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_IT_DEPLOY_KEY }}
          SHARD_GLARONA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_EN_DEPLOY_KEY }}
          SHARD_GLARONA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_DE_DEPLOY_KEY }}
          SHARD_GLARONA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_FR_DEPLOY_KEY }}
          SHARD_GRIGIONI_IT_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_IT_DEPLOY_KEY }}
          SHARD_GRIGIONI_EN_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_EN_DEPLOY_KEY }}
          SHARD_GRIGIONI_DE_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_DE_DEPLOY_KEY }}
          SHARD_GRIGIONI_FR_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_FR_DEPLOY_KEY }}
          SHARD_GIURA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_IT_DEPLOY_KEY }}
          SHARD_GIURA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_EN_DEPLOY_KEY }}
          SHARD_GIURA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_DE_DEPLOY_KEY }}
          SHARD_GIURA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_FR_DEPLOY_KEY }}
          SHARD_LUCERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_IT_DEPLOY_KEY }}
          SHARD_LUCERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_EN_DEPLOY_KEY }}
          SHARD_LUCERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_DE_DEPLOY_KEY }}
          SHARD_LUCERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_FR_DEPLOY_KEY }}
          SHARD_NEUCHATEL_IT_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_IT_DEPLOY_KEY }}
          SHARD_NEUCHATEL_EN_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_EN_DEPLOY_KEY }}
          SHARD_NEUCHATEL_DE_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_DE_DEPLOY_KEY }}
          SHARD_NEUCHATEL_FR_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_FR_DEPLOY_KEY }}
          SHARD_NIDVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_IT_DEPLOY_KEY }}
          SHARD_NIDVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_EN_DEPLOY_KEY }}
          SHARD_NIDVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_DE_DEPLOY_KEY }}
          SHARD_NIDVALDO_FR_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_FR_DEPLOY_KEY }}
          SHARD_OBVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_IT_DEPLOY_KEY }}
          SHARD_OBVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_EN_DEPLOY_KEY }}
          SHARD_OBVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_DE_DEPLOY_KEY }}
          SHARD_OBVALDO_FR_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_FR_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_IT_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_EN_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_DE_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_FR_DEPLOY_KEY }}
          SHARD_SOLETTA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_IT_DEPLOY_KEY }}
          SHARD_SOLETTA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_EN_DEPLOY_KEY }}
          SHARD_SOLETTA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_DE_DEPLOY_KEY }}
          SHARD_SOLETTA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_FR_DEPLOY_KEY }}
          SHARD_SVITTO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_IT_DEPLOY_KEY }}
          SHARD_SVITTO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_EN_DEPLOY_KEY }}
          SHARD_SVITTO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_DE_DEPLOY_KEY }}
          SHARD_SVITTO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_FR_DEPLOY_KEY }}
          SHARD_TURGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_IT_DEPLOY_KEY }}
          SHARD_TURGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_EN_DEPLOY_KEY }}
          SHARD_TURGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_DE_DEPLOY_KEY }}
          SHARD_TURGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_FR_DEPLOY_KEY }}
          SHARD_URI_IT_DEPLOY_KEY: ${{ secrets.SHARD_URI_IT_DEPLOY_KEY }}
          SHARD_URI_EN_DEPLOY_KEY: ${{ secrets.SHARD_URI_EN_DEPLOY_KEY }}
          SHARD_URI_DE_DEPLOY_KEY: ${{ secrets.SHARD_URI_DE_DEPLOY_KEY }}
          SHARD_URI_FR_DEPLOY_KEY: ${{ secrets.SHARD_URI_FR_DEPLOY_KEY }}
          SHARD_VAUD_IT_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_IT_DEPLOY_KEY }}
          SHARD_VAUD_EN_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_EN_DEPLOY_KEY }}
          SHARD_VAUD_DE_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_DE_DEPLOY_KEY }}
          SHARD_VAUD_FR_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_FR_DEPLOY_KEY }}
          SHARD_VALLESE_IT_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_IT_DEPLOY_KEY }}
          SHARD_VALLESE_EN_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_EN_DEPLOY_KEY }}
          SHARD_VALLESE_DE_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_DE_DEPLOY_KEY }}
          SHARD_VALLESE_FR_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_FR_DEPLOY_KEY }}
          SHARD_ZUGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_IT_DEPLOY_KEY }}
          SHARD_ZUGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_EN_DEPLOY_KEY }}
          SHARD_ZUGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_DE_DEPLOY_KEY }}
          SHARD_ZUGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_FR_DEPLOY_KEY }}
          SHARD_SANGALLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_IT_DEPLOY_KEY }}
          SHARD_SANGALLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_EN_DEPLOY_KEY }}
          SHARD_SANGALLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_DE_DEPLOY_KEY }}
          SHARD_SANGALLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_FR_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Issue #4881 Fase 5 — see ogPagesPlugin.ts's closeBundle docblock
          # and the IT-leg push step above for the full contract.
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP }}
        run: |
          set -uo pipefail
          # Each section pushes to its OWN shard repo — one section's push
          # failure (e.g. a corrupted remote clone) must never skip the
          # others. `|| fail=1` absorbs a non-zero exit so every section is
          # always attempted; the step still ends non-zero (red in the
          # Actions UI) when any section genuinely failed. Incident
          # 2026-07-24 (run 30057726623): svizzera-it's push failure silently
          # aborted this loop before zurigo-it was even attempted.
          # Bounded-parallel, not unbounded: push-section-shard.sh's own
          # header documents issue #4734 — concurrent `stage` clones (up to
          # several GB each for ticino/svizzera/zurigo) piling up unfreed
          # exhausted runner disk even under the OLD sequential loop. Capping
          # concurrent in-flight pushes keeps peak `stage` usage bounded to
          # MAX_PARALLEL sections at a time instead of scaling with the full
          # 27-section list.
          MAX_PARALLEL=4
          fail=0
          pids=(); names=()
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            # #4881 Fase 5: same exclusion as the IT-leg push step above —
            # build no longer emitted this section, so a full-replace push
            # here would force-push a near-empty dist/ tree over the shard.
            skip_var="$(echo "$section" | tr a-z A-Z)_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-${{ matrix.locale }}: BUILD_EMIT_SKIP=true — excluded from full-replace push (served by fast-publish only)"
              continue
            fi
            bash scripts/lib/push-section-shard.sh "$section" "${{ matrix.locale }}" dist &
            pids+=("$!"); names+=("$section")
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              for idx in "${!pids[@]}"; do
                wait "${pids[$idx]}" || { echo "::warning::${names[$idx]}-${{ matrix.locale }} shard push step failed — continuing to the next section"; fail=1; }
              done
              pids=(); names=()
            fi
          done
          for idx in "${!pids[@]}"; do
            wait "${pids[$idx]}" || { echo "::warning::${names[$idx]}-${{ matrix.locale }} shard push step failed — continuing to the next section"; fail=1; }
          done
          exit "$fail"

      # Same-run tar artifact for post-deploy-validate-dist's section rehydrate
      # fast path — see the IT leg's "Pack section shard dist" step above for
      # the full rationale (git-clone fallback was ~12min wall across the 4
      # legs combined, run 28564001685). Per-section LIVE gate lives INSIDE
      # the loop (not the step `if:`) since each section has its own repo
      # variable.
      - name: Pack section shard dist (tar) for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          set -uo pipefail
          loc="${{ matrix.locale }}"
          # Bounded-parallel (cap 4) — see the IT leg's "Pack section shard
          # dist" step above for the full rationale.
          pack_section() {
            local section="$1"
            local live_var="$(echo "$section" | tr a-z A-Z)_SHARD_LIVE"
            if [ "${!live_var:-}" != "true" ]; then
              return 0
            fi
            # Gate on the push ok-marker — see the IT leg's "Pack section
            # shard dist" step above (issue #4881 Fase 5 audit finding) for
            # the full rationale.
            if [ ! -f "$RUNNER_TEMP/shard-ok-$section-$loc" ]; then
              echo "no push ok-marker for $section-$loc (push skipped/failed this run) — validate-dist will fall back to git clone"
              return 0
            fi
            local slug sub src packed_n src_n
            slug="$(jq -r --arg s "$section" --arg l "$loc" '.[$s][$l] // empty' scripts/lib/section-shard-slugs.json)"
            sub="$loc/$slug"
            src="$RUNNER_TEMP/${section}-src-$loc/dist"
            if [ ! -d "$src/$sub" ]; then
              echo "no staged $section-$loc subtree (push skipped/failed) — validate-dist will fall back to git clone"
              return 0
            fi
            tar -C "$src" -cf "$RUNNER_TEMP/$section-dist-$loc.tar" "$sub"
            ls -lh "$RUNNER_TEMP/$section-dist-$loc.tar"
            # Byte-identity guard (#2761 item 1) — see the IT leg's "Pack section
            # shard dist" step above for the full rationale: this tar and
            # push-section-shard.sh's own push both read the SAME already-offloaded
            # "$src/$sub" staged copy, nothing mutates it in between, so a count
            # mismatch here can only mean a tar bug — discard rather than upload a
            # tar validate-dist could trust incorrectly.
            packed_n=$(tar -tf "$RUNNER_TEMP/$section-dist-$loc.tar" | { grep -vc '/$' || true; })
            src_n=$(find "$src/$sub" -type f | wc -l)
            if [ "$packed_n" -ne "$src_n" ]; then
              echo "::warning::$section-dist-$loc.tar file count mismatch (packed=$packed_n src=$src_n) — discarding tar, validate-dist will fall back to git-clone"
              rm -f "$RUNNER_TEMP/$section-dist-$loc.tar"
            fi
            rm -rf "$src"
          }
          MAX_PARALLEL=4
          pids=()
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            pack_section "$section" &
            pids+=("$!")
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              for pid in "${pids[@]}"; do wait "$pid"; done
              pids=()
            fi
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Upload shard batch 1 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-1-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/appenzello-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/argovia-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/articolifrontaliere-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/articolisvizzera-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/basilea-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 2 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-2-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/berna-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/friburgo-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/ginevra-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/giura-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/glarona-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 3 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-3-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grigioni-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/lucerna-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/neuchatel-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/nidvaldo-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/obvaldo-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 4 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-4-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sangallo-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/sciaffusa-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/soletta-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/svitto-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/svizzera-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 5 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-5-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ticino-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/turgovia-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/uri-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/vallese-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/vaud-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload shard batch 6 dist for post-deploy validation
        if: matrix.locale != 'it'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-6-dist-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zugo-dist-${{ matrix.locale }}.tar
            ${{ runner.temp }}/zurigo-dist-${{ matrix.locale }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: ignore

      - name: Strip section subtrees (non-IT)
        if: matrix.locale != 'it'
        env:
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
          # Issue #4881 Fase 5: same exclusion as the IT-leg strip step —
          # see that step's comment for the rationale.
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP }}
        run: |
          set -uo pipefail
          for section in $(jq -r 'keys[] | select(startswith("_")|not)' scripts/lib/section-shard-slugs.json); do
            skip_var="$(echo "$section" | tr a-z A-Z)_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-${{ matrix.locale }}: BUILD_EMIT_SKIP=true — build never emitted this section, no ok-marker, nothing to strip"
              continue
            fi
            bash scripts/lib/strip-section-subtree.sh "$section" "${{ matrix.locale }}" dist
          done

      - name: Offload shard refs to CDN
        if: matrix.locale != 'it'
        continue-on-error: true
        # offload-generated-images-cdn.mjs rewrites HTML asset/data refs to the CDN
        # and injects window.__CDN_DATA_BASE__. It reads CDN_BASE from the env and
        # NO-OPs when unset. In the monolith a single offload runs after the CDN
        # push (which exports CDN_BASE) and rewrites every locale; here en/de/fr run
        # on separate runners that never push the CDN, so CDN_BASE must be supplied
        # explicitly (it's the fixed CDN-repo Pages origin, == ASSET_CDN). Without
        # it the shard HTML would keep same-origin /data refs → 404 live (the shard
        # repos don't host /data; it's CDN-offloaded). The actual CDN content is
        # pushed by the IT shard's deploy-it-pages-prep, which runs in parallel and
        # completes before validate-dist/validate-live.
        env:
          CDN_BASE: 'https://cdn.frontaliereticino.ch'
        run: node scripts/offload-generated-images-cdn.mjs

      # Same-run shard-dist artifact for post-deploy-validate-dist rehydrate.
      # validate-dist previously rehydrated each en/de/fr subtree by
      # `git clone --depth 1` of the shard repo (~14min wall, serial). The pruned
      # dist here — dist/<locale> + dist/<locale>.html — is byte-for-byte what
      # push-locale-shard.sh force-pushes next, so uploading it lets validate-dist
      # fetch it via `gh run download` (same-run, no API lag) instead of cloning.
      # Uploaded AFTER "Offload shard refs to CDN" so the HTML carries the same
      # CDN-rewritten /data refs the pushed shard serves (the clone-rehydrate it
      # replaces consumed post-offload content) — keeps the rehydrated dist
      # byte-identical to the git-clone path. validate-dist still falls back to the
      # git clone when this artifact is missing (e.g. a failed shard push/upload),
      # so a locale is NEVER silently un-validated. IT/main shard untouched
      # (`matrix.locale != 'it'`) → matrix-equivalence sha256 intact.
      #
      # PACK INTO ONE TAR FIRST. The previous version uploaded the raw
      # `dist/<loc>` tree (~410k loose files) directly. actions/upload-artifact@v7
      # enumerates every file before upload and STACK-OVERFLOWED on that count —
      # "##[error]Maximum call stack size exceeded" — so the upload silently
      # failed (continue-on-error → step shows green, no artifact produced). The
      # fast path was therefore DEAD on every deploy: validate-dist's rehydrate
      # always fell through to the ~675s git-clone fallback. Packing the subtree
      # into a single artifact.tar (exactly how the github-pages artifact is
      # shipped) makes upload enumerate ONE file → no stack overflow, and the
      # validate-dist side untars it straight into dist/ (no extra cp copy).
      - name: Pack locale shard dist (tar) for post-deploy validation
        if: matrix.locale != 'it'
        # continue-on-error for the same reason as the upload+push steps: a pack
        # failure must degrade to validate-dist's git-clone fallback, never flip
        # build-locale.result→failure (which would block the Pages publish).
        continue-on-error: true
        run: |
          set -euo pipefail
          members=( "${{ matrix.locale }}" )
          # dist/<loc>.html (= the /{loc} homepage) is normally present; guard so
          # a future strip that drops it can't make tar exit non-zero. NB: use a
          # full `if` — `[ -f ] && members+=()` would itself exit non-zero (and
          # abort the step under set -e) when the homepage is absent.
          if [ -f "dist/${{ matrix.locale }}.html" ]; then
            members+=( "${{ matrix.locale }}.html" )
          fi
          tar -C dist -cf "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar" "${members[@]}"
          ls -lh "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar"
          # Byte-identity guard (#2761 item 1): this tar and push-locale-shard.sh's
          # `cp -al "$dist_dir/$loc" "$stage/$loc"` both read the SAME dist/<loc>
          # (+ <loc>.html) — this step runs BEFORE "Push locale shard" below and
          # nothing mutates dist/<loc> in between, so the two paths are guaranteed
          # to agree; validate-dist's git-clone fallback also only ever restores
          # this identical <loc>/ + <loc>.html pair. This count check makes that
          # guarantee self-verifying: if it ever drifts, discard the tar so
          # validate-dist safely falls back to git-clone instead of silently
          # validating a partial/mismatched tree.
          prefixed_members=()
          for m in "${members[@]}"; do prefixed_members+=( "dist/$m" ); done
          packed_n=$(tar -tf "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar" | { grep -vc '/$' || true; })
          src_n=$(find "${prefixed_members[@]}" -type f 2>/dev/null | wc -l)
          if [ "$packed_n" -ne "$src_n" ]; then
            echo "::warning::locale-dist-${{ matrix.locale }}.tar file count mismatch (packed=$packed_n src=$src_n) — discarding tar, validate-dist will fall back to git-clone"
            rm -f "$RUNNER_TEMP/locale-dist-${{ matrix.locale }}.tar"
          fi
      - name: Upload locale shard dist for post-deploy validation
        if: matrix.locale != 'it'
        # MUST stay continue-on-error: this is a non-essential speedup artifact.
        # deploy + validate-dist gate on `needs.build-locale.result == 'success'`
        # (in matrix mode `build` is skipped), and build-locale has
        # fail-fast: false, so a single leg failing here would make
        # build-locale.result == failure → deploy blocked = no Pages publish.
        # A transient artifact-service error or an empty dist/<loc> must instead
        # degrade gracefully: validate-dist's git-clone fallback then rehydrates
        # the locale (the documented resilience path). Mirrors the adjacent
        # `Push locale shard` step, which is continue-on-error for the same reason.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: locale-dist-${{ matrix.locale }}-${{ github.run_id }}
          # Single tar (see "Pack locale shard dist" above) — NOT the ~410k-file
          # tree, which overflows the action's file enumerator.
          path: ${{ runner.temp }}/locale-dist-${{ matrix.locale }}.tar
          # compression-level 1: the tar is mostly HTML (very compressible) and
          # this step gates the Pages publish, so favour a fast upload over a few
          # extra MB. validate-dist downloads it over GitHub's internal network.
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      # ── Cross-shard CDN-push ordering guard (#2569 atomicity) ────────────
      # The non-IT shard HTML was rewritten to reference cdn.frontaliereticino.ch
      # for /data + /assets (the "Offload shard refs to CDN" step above). The IT
      # shard pushes THIS build's CDN payload (data/assets) from a SEPARATE
      # parallel matrix runner with no ordering vs this leg. Publishing this
      # shard BEFORE the IT CDN push lands this build's payload would put the
      # live locale ahead of the CDN (refs 404 / serve a prior build's data).
      # deploy-it-pages-prep.sh stamps DEPLOY_BUILD_ID into the CDN's
      # cdn-build-id.txt in the SAME force-push as the payload, so this gate —
      # polling that marker until it equals THIS build's id — only unblocks once
      # the IT CDN push has atomically published this build. continue-on-error so
      # a timeout never flips build-locale.result→failure (that would block the
      # whole Pages publish); instead the gate's outcome gates the publish step
      # below, so a stuck/failed IT CDN push leaves this shard UNPUBLISHED
      # (stale, surfaced by the #2658 path) rather than published-ahead.
      - name: Wait for IT CDN push (cross-shard ordering guard)
        id: cdn-gate
        if: matrix.locale != 'it'
        continue-on-error: true
        env:
          DEPLOY_BUILD_ID: ${{ needs.matrix-setup.outputs.build_id }}
          # The non-IT gate must out-wait TWO serial delays before the marker
          # turns: (1) the IT leg reaching its CDN force-push, and (2) — the real
          # bottleneck — GitHub Pages PUBLISHING that push on the frontaliere-cdn
          # repo. The CDN payload is now ~1.27 GB (all ACTIVE content: 11.6k stable
          # JS/CSS chunks + offloaded /data JSON + og images; the assets/ janitor
          # finds 0 orphans → nothing to prune), OVER the Pages ~1 GB soft limit, so
          # the Pages publish latency has ballooned: the git push lands fast but the
          # live marker lags it by ~22min while Pages rebuilds the oversized site.
          # #2872 measured: gate started 10:36:28, IT push succeeded 10:45:38, marker
          # went live 11:07:42 — a 31min gate-start→publish window. The prior 1800s
          # (30min) budget expired 11:06:34, just 68s SHORT of the marker, timing out
          # ALL THREE non-IT shards (en/de/fr) into stale-live. This was NOT a
          # transient/expired-key failure (the earlier theory in #2786/#2806/#2807):
          # it is structural Pages-publish latency on the >1 GB CDN. 2700s (45min)
          # restores margin over the measured 31min; the gate still exits the instant
          # the marker matches, so the budget is a ceiling, not a fixed wait.
          # STOPGAP: as the CDN keeps growing, publish latency grows with it — the
          # durable fix is to get the CDN off GitHub Pages' 1 GB-limited, slow-publish
          # path (e.g. Cloudflare R2: no size limit, instant PUT, marker visible in
          # seconds) or split it back under 1 GB. Tracked for #2872 follow-up.
          CDN_WAIT_TIMEOUT_S: 2700
          # When CDN_TARGET=r2 the marker is published to R2 (no-store); the gate
          # then cache-busts each poll so it sees R2's strong read-after-write id
          # immediately — the 2700s budget becomes a near-no-op (match in seconds).
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
        run: bash scripts/lib/wait-cdn-build-id.sh "${DEPLOY_BUILD_ID}"

      - name: Push locale shard
        id: push-shard
        # Only publish once the ordering guard confirmed the IT CDN push landed
        # THIS build (steps.cdn-gate.outcome == 'success'). On a gate timeout the
        # shard is skipped (NOT pushed ahead of the CDN); the stale-shard
        # surfacing step below fires on skip|failure so the unpublished locale is
        # never shipped silently. (cdn-gate is itself a no-op exit-0 when
        # DEPLOY_BUILD_ID is unset, so non-matrix/local paths are unaffected.)
        if: matrix.locale != 'it' && steps.cdn-gate.outcome == 'success'
        # Stays continue-on-error (transient shard-repo/network errors must NOT
        # block the whole Pages publish — build-locale has fail-fast:false, a
        # hard failure here would flip build-locale.result→failure→no publish).
        # The PREVIOUS gap (#2658): a failed push then shipped a STALE live
        # locale SILENTLY (deploy green, no signal). The surfacing step below
        # closes that — keeps the resilience, removes the silence.
        continue-on-error: true
        env:
          SHARD_EN_DEPLOY_KEY: ${{ secrets.SHARD_EN_DEPLOY_KEY }}
          SHARD_DE_DEPLOY_KEY: ${{ secrets.SHARD_DE_DEPLOY_KEY }}
          SHARD_FR_DEPLOY_KEY: ${{ secrets.SHARD_FR_DEPLOY_KEY }}
        run: bash scripts/lib/push-locale-shard.sh ${{ matrix.locale }} dist

      - name: Surface a stale-locale shard push failure (#2658)
        # A push failure leaves the live ${{ matrix.locale }} shard serving STALE
        # content while the deploy still goes green. Don't fail the deploy (the
        # continue-on-error resilience is deliberate) — but make it LOUD: warning
        # annotation + a deduped tracking issue so the stale locale is never
        # shipped silently. Self-resolves on the next green push (reopen-within).
        # Also fires when the #2569 CDN ordering guard timed out (cdn-gate
        # failure → push-shard SKIPPED): the shard is intentionally NOT published
        # ahead of the IT CDN push, so the live locale stays stale and must be
        # surfaced the same way.
        if: matrix.locale != 'it' && (steps.push-shard.outcome == 'failure' || steps.cdn-gate.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning title=Stale locale shard::Push of the ${{ matrix.locale }} shard did not publish (push failure, or the #2569 CDN ordering guard timed out waiting for the IT CDN push) — the live ${{ matrix.locale }} pages serve STALE content until the next successful deploy. Deploy stays green by design (transient-tolerant); investigate the shard repo / deploy key / IT CDN push."
          node scripts/lib/github-issue-creator.mjs \
            --title "Deploy: ${{ matrix.locale }} locale shard push failed (stale live locale)" \
            --description "## Push locale shard fallito — locale live STALE
          Il push dello shard \`${{ matrix.locale }}\` è fallito: le pagine live di quel locale servono contenuto **stale** finché un deploy successivo non ripush con successo. Il deploy resta verde per design (resilienza a errori transienti dello shard-repo), ma la mancata propagazione è ora segnalata.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Locale:** ${{ matrix.locale }}
          **Branch:** ${{ github.ref_name }}
          Probabili cause: errore transiente di rete/artifact-service, conflitto di push, deploy key shard scaduta." \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve stale-locale shard issue on successful push (#2658)
        # Mirror of the surfacing step: a green push closes the canonical
        # stale-locale issue if open (close↔reopen on ONE issue, no per-run storm).
        if: matrix.locale != 'it' && steps.push-shard.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "Deploy: ${{ matrix.locale }} locale shard push failed (stale live locale)" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure to GitHub Issues (build)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --description "## Build fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Resolve build GitHub Issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build succeeded → close the canonical "CI Failure (build)" issue if
          # open. Paired with --reopen-within-hours 6 on the reporter above so the
          # close↔reopen cycle stays on ONE canonical issue (no per-run storm,
          # no stale issue while green). Idempotent no-op when nothing is open.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "CI Failure (build): ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
