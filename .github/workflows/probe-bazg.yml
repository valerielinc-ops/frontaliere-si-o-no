name: Probe BAZG Waiting-Times API

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe BAZG endpoints
        id: probe
        run: |
          if node scripts/probe-bazg-waiting-times.mjs; then
            echo "BAZG_ONLINE=true" >> "$GITHUB_OUTPUT"
          else
            echo "BAZG_ONLINE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if BAZG is back online
        if: steps.probe.outputs.BAZG_ONLINE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The title was already stable, but the raw `gh issue create` had NO
          # dedup at all: BAZG staying online meant a fresh, identical issue
          # every week. `github-issue-creator.mjs` (ISSUES.md dedup a monte)
          # comments the recurrence on the canonical issue instead.
          node scripts/lib/github-issue-creator.mjs \
            --title "BAZG API is back online — wire as priority-1 traffic source" \
            --description "The weekly BAZG probe found a working endpoint. Time to wire it as the priority-0 source in \`functions/src/trafficSchedulerCore.js\`, above HERE Maps in the provider waterfall. See the design doc: \`valerielinc-main-design-20260503-183137-border-wait-multi-source.md\`." \
            --priority 3 \
            --label enhancement \
            --workflow "${{ github.workflow }}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
