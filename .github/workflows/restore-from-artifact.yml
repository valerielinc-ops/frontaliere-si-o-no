name: Restore GitHub Pages from previous artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Source workflow run ID to copy the github-pages artifact from'
        required: true
        default: '26138669646'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  validate-promotion-trigger:
    name: validate restore promotion trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Reject non-main or unverified restore source
        env:
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_REF: ${{ github.ref }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_SOURCE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/production-promotion-gate.mjs trigger

  validate-source-build:
    name: validate canonical source build
    needs: validate-promotion-trigger
    if: needs.validate-promotion-trigger.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Validate successful canonical build run
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*)
              echo "::error::source_run_id must contain only decimal digits"
              exit 1
              ;;
          esac
          gh api --method GET \
            "repos/${PROMOTION_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            | PROMOTION_SOURCE_RUN_ID="$SOURCE_RUN_ID" node scripts/ci/production-promotion-gate.mjs source-run

  production-approval:
    name: approve restore promotion
    needs: validate-source-build
    if: needs.validate-source-build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production-deploy
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Verify required reviewers and environment attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_ENVIRONMENT_NAME: production-deploy
          PRODUCTION_DEPLOY_APPROVAL: ${{ secrets.PRODUCTION_DEPLOY_APPROVAL }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/${PROMOTION_REPOSITORY}/environments/${PROMOTION_ENVIRONMENT_NAME}" \
            | node scripts/ci/production-promotion-gate.mjs approval

  deploy:
    needs: [validate-source-build, production-approval]
    if: needs.validate-source-build.result == 'success' && needs.production-approval.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required for Pages OIDC only. The human production gate is the separate
    # fail-closed `production-approval` job above.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download github-pages artifact from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p _restore
          # #7502: same class as the composite action — an unpaginated listing
          # answers with the first 30 artifacts of the run, and deploy.yml
          # uploads more than that, so a client-side name filter over a
          # truncated page reports "no github-pages artifact" for a run that
          # has one. Filter on the name server-side; `.expired == false` stays.
          ARTIFACT_IDS=$(gh api \
            "repos/$GH_REPO/actions/runs/${SOURCE_RUN_ID}/artifacts?name=github-pages&per_page=100" \
            --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | sort_by(.created_at) | reverse | .[].id')
          if [ -z "$ARTIFACT_IDS" ]; then
            echo "::error::No github-pages artifact in run ${SOURCE_RUN_ID}"
            exit 1
          fi
          ARTIFACT_COUNT=$(printf '%s\n' "$ARTIFACT_IDS" | awk 'NF { count++ } END { print count + 0 }')
          if [ "$ARTIFACT_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one live github-pages artifact in run ${SOURCE_RUN_ID}, found ${ARTIFACT_COUNT}; refusing an ambiguous restore."
            exit 1
          fi
          ARTIFACT_ID="$ARTIFACT_IDS"
          gh api "repos/$GH_REPO/actions/artifacts/${ARTIFACT_ID}/zip" > _restore/artifact.zip
          # #7503, same class as the composite action: `unzip` exits 1 for
          # NON-fatal warnings with the members extracted anyway, and reserves
          # >= 2 for real errors. Under `set -e` a bare call turned a benign
          # warning on a >1 GB archive into a dead restore. The upload step
          # below has `if-no-files-found: error` on `_restore/artifact.tar`,
          # so a warning that really lost the file still fails the job.
          uzrc=0
          unzip -q -o _restore/artifact.zip -d _restore || uzrc=$?
          if [ "$uzrc" -eq 1 ]; then
            echo "::warning::unzip of artifact ${ARTIFACT_ID} reported warnings (exit 1) — proceeding; the artifact.tar upload below is the contract"
          elif [ "$uzrc" -ge 2 ]; then
            echo "::error::unzip of artifact ${ARTIFACT_ID} failed with exit ${uzrc}"
            exit 1
          fi

      - name: Re-upload as fresh github-pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: _restore/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
