name: Restore GitHub Pages from previous artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Source workflow run ID to copy the github-pages artifact from'
        required: true
        default: '26138669646'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download github-pages artifact from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p _restore
          # #7502: same class as the composite action — an unpaginated listing
          # answers with the first 30 artifacts of the run, and deploy.yml
          # uploads more than that, so a client-side name filter over a
          # truncated page reports "no github-pages artifact" for a run that
          # has one. Filter on the name server-side; `.expired == false` stays.
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID}/artifacts?name=github-pages&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No github-pages artifact in run ${SOURCE_RUN_ID}"
            exit 1
          fi
          gh api repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip > _restore/artifact.zip
          # #7503, same class as the composite action: `unzip` exits 1 for
          # NON-fatal warnings with the members extracted anyway, and reserves
          # >= 2 for real errors. Under `set -e` a bare call turned a benign
          # warning on a >1 GB archive into a dead restore. The upload step
          # below has `if-no-files-found: error` on `_restore/artifact.tar`,
          # so a warning that really lost the file still fails the job.
          uzrc=0
          (cd _restore && unzip -q artifact.zip) || uzrc=$?
          if [ "$uzrc" -eq 1 ]; then
            echo "::warning::unzip of artifact ${ARTIFACT_ID} reported warnings (exit 1) — proceeding; the artifact.tar upload below is the contract"
          elif [ "$uzrc" -ge 2 ]; then
            echo "::error::unzip of artifact ${ARTIFACT_ID} failed with exit ${uzrc}"
            exit 1
          fi

      - name: Re-upload as fresh github-pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: _restore/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
