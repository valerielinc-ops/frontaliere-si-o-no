name: Restore GitHub Pages from previous artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Source workflow run ID to copy the github-pages artifact from'
        required: true
        default: '26138669646'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  validate-promotion-trigger:
    name: validate restore promotion trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Reject non-main or unverified restore source
        env:
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_REF: ${{ github.ref }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_SOURCE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/production-promotion-gate.mjs trigger

  validate-source-build:
    name: validate canonical source build
    needs: validate-promotion-trigger
    if: needs.validate-promotion-trigger.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Validate successful canonical build run
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*)
              echo "::error::source_run_id must contain only decimal digits"
              exit 1
              ;;
          esac
          source_run_json="$RUNNER_TEMP/canonical-source-run.json"
          gh api --method GET \
            "repos/${PROMOTION_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "$source_run_json"
          PROMOTION_SOURCE_RUN_ID="$SOURCE_RUN_ID" \
            node scripts/ci/production-promotion-gate.mjs source-run < "$source_run_json"

  # `validate-source-build` above is the fail-closed admission: it proves the
  # artifact comes from a canonical, successful, main-branch build of the
  # expected workflow. No human-approval environment is layered on top — see
  # tests/deploy-no-human-approval-gate.test.ts.

  deploy:
    needs: [validate-source-build]
    if: needs.validate-source-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Share only the actual Pages upload lock with deploy-publish.yml. The
    # source admission above is read-only and must not occupy that slot.
    concurrency:
      group: ${{ needs.validate-source-build.result == 'success' && 'pages-deploy' || format('pages-deploy-noop-{0}', github.run_id) }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the Pages artifact resolver
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/fetch-pages-artifact/
            .github/actions/fetch-pages-artifact/**
          sparse-checkout-cone-mode: false

      - name: Fetch Pages artifact from source or publisher run
        id: pages-artifact
        uses: ./.github/actions/fetch-pages-artifact
        with:
          run-id: ${{ inputs.source_run_id }}
          output-dir: _restore
          github-token: ${{ github.token }}

      - name: Re-upload as fresh github-pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ steps.pages-artifact.outputs.tar-path }}
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
