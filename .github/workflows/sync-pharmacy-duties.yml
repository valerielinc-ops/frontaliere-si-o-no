name: sync-pharmacy-duties

# Duties are fetched by the border workflow and handed to its finalizer in a
# runner-temporary directory. This manual alias deliberately has no schedule
# and no writer of its own, so main never receives a release-less intermediate
# duty snapshot.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-pharmacy-data
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-pharmacies-border.yml
    secrets: inherit
