name: sync-pharmacy-duties

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pharmacy-duties
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Fetch and validate Ticino duty schedules
        run: node scripts/sync-pharmacy-duties.mjs
      - name: Commit changed duty snapshots
        run: |
          set -euo pipefail
          if git diff --quiet -- data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json; then
            echo "No pharmacy duty data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json
          git commit -m "chore(data): refresh Ticino pharmacy duties"
          git push origin HEAD:main
