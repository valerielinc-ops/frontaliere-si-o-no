name: sync-pharmacy-duties

on:
  schedule:
    - cron: '17 4 * * *'
    # The SSG duty cards are evaluated at build time. This lightweight cadence
    # notices known start/end transitions and requests a rebuild without
    # re-fetching OFCT between the full daily imports.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pharmacy-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      # The duty parser reaches public-fetch-policy.mjs through crawler-template.mjs,
      # which imports the declared `undici` dependency. load-rc-env.mjs also uses
      # the installed firebase-admin SDK when loading Remote Config.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Il ruleset del repo rifiuta il GITHUB_TOKEN ambientale sui push diretti
      # a main (GH013), quindi la credenziale va caricata PRIMA del push, non
      # dopo: e' l'invariante che tests/main-push-auth-wiring.test.ts verifica.
      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Fetch and validate Ticino duty schedules
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * *' }}
        run: node scripts/sync-pharmacy-duties.mjs
      - name: Refresh static pages after a known duty boundary
        if: ${{ github.event_name == 'schedule' && github.event.schedule != '17 4 * * *' }}
        run: node scripts/refresh-pharmacy-duty-expiry.mjs
      - name: Commit changed duty snapshots
        run: |
          set -euo pipefail
          if git diff --quiet -- data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json; then
            echo "No pharmacy duty data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json
          git commit -m "chore(data): refresh Ticino pharmacy duties"
          # Duty snapshots can race with other generated-data writers on main.
          # Rebase and regenerate the snapshot on the fetched main tip so a
          # concurrent write never gets hidden behind a stale direct push.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 4 * * *" ]; then
            REGENERATE_CMD='node scripts/refresh-pharmacy-duty-expiry.mjs'
          else
            REGENERATE_CMD='node scripts/sync-pharmacy-duties.mjs'
          fi
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "${REGENERATE_CMD} && git add data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json"
