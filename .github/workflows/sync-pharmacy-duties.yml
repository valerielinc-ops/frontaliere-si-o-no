name: sync-pharmacy-duties

# Duties are fetched by the border workflow and handed to its finalizer in a
# runner-temporary directory. The cadence is only a trigger for that reusable
# workflow, which is the sole writer and never publishes a release-less
# intermediate duty snapshot.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-pharmacy-data
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/sync-pharmacies-border.yml
    secrets: inherit
