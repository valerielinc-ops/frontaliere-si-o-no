name: Post-Build Matrix Test

# Test workflow — splits the 18 post-build validators/audits/SPA/E2E checks
# across 4 matrix runners (instead of 1) to measure if matrix parallelism
# beats the current single-runner MAX_PARALLEL=2 cap (~345s baseline).
#
# Math: sum=690s sequential, current=345s on 1×2 cores. Matrix=4 runners ×
# 2 cores = 8 effective slots. With LPT bucket assignment (in
# scripts/lib/post-build-tasks.sh) the largest bucket sums ~232s →
# per-shard wall ~116s + 60-90s setup = ~3 min total vs current 5.75 min.
#
# Does NOT touch deploy.yml. Manual-only via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      profile_jobs_seo:
        description: 'Compatibility no-op: jobsSeoPagesPlugin per-category profiling is now enabled by default whenever BUILD_PROFILE=1.'
        required: false
        type: boolean
        default: false
      profile_related_compare:
        description: 'Investigation-only: compare legacy related-job filtering against the pre-indexed related-job pool and emit before/after profiler rows.'
        required: false
        type: boolean
        default: false
      build_only:
        description: 'Investigation-only: stop after the build step so profiling runs do not upload the very large dist artifact or launch shard validators.'
        required: false
        type: boolean
        default: false
      hreflang_source_run_id:
        description: 'Investigation-only: rebuild the IT shard from this deploy run snapshot and measure hreflang staging; no deploy or publish occurs.'
        required: false
        type: string
        default: ''
      hreflang_source_run_attempt:
        description: 'Attempt number for the source deploy run artifacts.'
        required: false
        type: string
        default: '1'

permissions:
  contents: read

# Gruppo di concorrenza STABILE: uno studio manuale non deve poter tenere
# N runner insieme. Il tetto dell'account e' 20-22 job e il 2026-09-19
# `Deploy Matrix Experiment`, con un gruppo per-run identico a questo,
# arrivava a 6 run vivi insieme (3.091 job-minuti in 24 h) rubando slot a
# `tests`. `cancel-in-progress: false` protegge la misura gia' partita:
# l'eccedenza resta pendente e non occupa mai un runner.
# (La nota precedente diceva «per-run group so multiple test invocations don't
# queue»: e' esattamente il comportamento che la misura ha mostrato insostenibile.
# Questo workflow continua a NON condividere il lock pages-deploy: non deploya.)
concurrency:
  group: post-build-matrix-test
  cancel-in-progress: false

env:
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

jobs:
  build:
    if: github.event.inputs.hreflang_source_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Review di #6150: questo job lancia `npm run build:ci` come MONOLITE
      # (nessun BUILD_LOCALE — il profilo di memoria peggiore) col tetto V8 a
      # 14336 MB: senza lo swapfile e' la configurazione che il 19-08 ha
      # ucciso 7 deploy su 8, e il preflight di buildMemoryGuard la ferma.
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash scripts/ci/grow-build-swap.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Assemble jobs dataset
        # assembleJobsDataset() only reads+aggregates committed per-slice
        # files; it never calls writeJobsCrawlerSlice()/the shrink/boilerplate
        # guards (those only run inside dedicated update-<company>-jobs.mjs
        # crawler scripts), so it does not need GH_TOKEN / issues:write.
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Build
        env:
          FAST_BUILD: ''
          BUILD_PROFILE: '1'
          SEQUENTIAL_PROFILE: '1'
          JOBS_SEO_PROFILE: ${{ github.event.inputs.profile_jobs_seo == 'true' && '1' || '' }}
          # Phase-level instrumentation inside the active-job per-page render —
          # enabled by default to mirror the deploy workflow (see deploy.yml).
          JOBS_SEO_PROFILE_PHASES: '1'
          JOBS_SEO_PROFILE_COMPARE_RELATED: ${{ github.event.inputs.profile_related_compare == 'true' && '1' || '' }}
        run: npm run build:ci

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload build output for shards
        if: github.event.inputs.build_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          # dist/ is the primary input; assembled data/* files are needed by
          # validators that read jobs.json / expired-jobs.json directly.
          # public/data/ is needed by validate:spa-render which fetches the
          # SPA's data files at runtime.
          path: |
            dist/
            data/jobs.json
            data/expired-jobs.json
            data/jobs-stats.json
            data/jobs-meta.json
            data/jobs-crawler-summaries.json
            public/data/
          retention-days: 1
          if-no-files-found: error
          compression-level: 1

  shards:
    needs: build
    if: github.event.inputs.build_only != 'true' && github.event.inputs.hreflang_source_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # Playwright is only needed by shard 3 (test:e2e:smoke). Skip on the
      # other 3 shards to save ~30-60s setup overhead.
      - name: Cache Playwright browsers
        if: matrix.shard == 3
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: matrix.shard == 3 && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: matrix.shard == 3 && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run shard tasks
        id: run
        shell: bash
        run: |
          set -uo pipefail
          source scripts/lib/post-build-tasks.sh

          MAX_PARALLEL=2
          : > /tmp/timings.txt
          : > /tmp/failures.txt

          # Single shared implementation since #5130 — see
          # scripts/lib/bounded-parallel.sh and the same delegation in
          # post-deploy-validate-dist.yml.
          source scripts/lib/bounded-parallel.sh
          wait_slot() { bp_wait_slot "$MAX_PARALLEL"; }

          # `set +e` inside the subshell — see post-deploy-validation.yml
          # spawn_capped for the full rationale. Without it, GH Actions'
          # default `bash -eo pipefail` errexit propagates into the subshell
          # and a failed task dies before rc=$?, vanishing from both the
          # timings and failures files (silent gate failure).
          spawn_capped() {
            local name=$1
            local logfile
            logfile="/tmp/$(echo "$name" | tr ':/' '__').log"
            wait_slot
            (
              set +e
              start=$(date +%s.%N)
              run_post_build_task "$name" > "$logfile" 2>&1
              rc=$?
              end=$(date +%s.%N)
              awk "BEGIN{printf \"%-40s %7.2f rc=%d\n\", \"$name\", $end-$start, $rc}" \
                >> /tmp/timings.txt
              if [ $rc -ne 0 ]; then
                echo "$name $logfile" >> /tmp/failures.txt
              fi
            ) &
          }

          shard_start=$(date +%s.%N)
          while IFS= read -r task; do
            [ -n "$task" ] && spawn_capped "$task"
          done < <(print_post_build_shard "${{ matrix.shard }}")
          wait
          shard_end=$(date +%s.%N)

          shard_wall=$(awk "BEGIN{printf \"%.2f\", $shard_end - $shard_start}")
          echo "── Shard ${{ matrix.shard }} per-task wall_s (sorted DESC) ──"
          sort -k2 -gr /tmp/timings.txt
          echo "──────────────────────────────────────────────────────────"
          echo "shard_wall_s=$shard_wall"
          echo "$shard_wall" > /tmp/shard-wall.txt

          if [ -s /tmp/failures.txt ]; then
            echo ""
            echo "❌ Shard ${{ matrix.shard }} failures:"
            while IFS= read -r line; do
              name=$(echo "$line" | awk '{print $1}')
              logfile=$(echo "$line" | awk '{print $2}')
              echo "── $name ──"
              cat "$logfile" || true
              echo ""
            done < /tmp/failures.txt
            exit 1
          fi

      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}-timings
          path: |
            /tmp/timings.txt
            /tmp/shard-wall.txt
          retention-days: 7

      # Upload structured audit reports + sitemaps on failure so a parallel
      # debug agent can reproduce the gate decisions offline. Reports are
      # generated by scripts/lib/auditReport.mjs at every audit's exit point
      # (pass or fail) — uploaded only on failure to stay within the free-tier
      # retention budget.
      - name: Upload audit reports + sitemaps on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/audit-reports/**
            dist/sitemap.xml
            dist/sitemap-*.xml
          if-no-files-found: ignore
          retention-days: 7

  benchmark-hreflang-staging:
    name: Rebuild IT shard and measure staging peak
    if: github.event.inputs.hreflang_source_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v5

      - name: Free unused toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Grow swap for the production build heap
        run: bash scripts/ci/grow-build-swap.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load build secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Download source run prepared snapshot
        uses: actions/download-artifact@v7
        with:
          name: prepared-snapshot
          run-id: ${{ github.event.inputs.hreflang_source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/source-snapshot

      - name: Restore source run prepared snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/source-snapshot/prepared-snapshot.tgz
          tar -xzf /tmp/source-snapshot/prepared-snapshot.tgz -C .
          test -f data/jobs.json
          test -f public/data/jobs.json

      - name: Download source run hreflang manifest (en)
        uses: actions/download-artifact@v7
        with:
          name: hreflang-index-manifest-en-${{ github.event.inputs.hreflang_source_run_id }}-${{ github.event.inputs.hreflang_source_run_attempt }}
          run-id: ${{ github.event.inputs.hreflang_source_run_id }}
          github-token: ${{ github.token }}
          path: .cache/hreflang-index-manifest

      - name: Download source run hreflang manifest (de)
        uses: actions/download-artifact@v7
        with:
          name: hreflang-index-manifest-de-${{ github.event.inputs.hreflang_source_run_id }}-${{ github.event.inputs.hreflang_source_run_attempt }}
          run-id: ${{ github.event.inputs.hreflang_source_run_id }}
          github-token: ${{ github.token }}
          path: .cache/hreflang-index-manifest

      - name: Download source run hreflang manifest (fr)
        uses: actions/download-artifact@v7
        with:
          name: hreflang-index-manifest-fr-${{ github.event.inputs.hreflang_source_run_id }}-${{ github.event.inputs.hreflang_source_run_attempt }}
          run-id: ${{ github.event.inputs.hreflang_source_run_id }}
          github-token: ${{ github.token }}
          path: .cache/hreflang-index-manifest

      - name: Set production-shaped build id
        run: echo "BENCH_BUILD_ID=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Mirror build-locale environment from deploy workflow
        env:
          BENCH_REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { parse } from 'yaml';

          const workflow = parse(readFileSync('.github/workflows/deploy.yml', 'utf8'));
          const buildEnv = workflow.jobs['build-locale']?.env;
          if (!buildEnv || typeof buildEnv !== 'object') {
            throw new Error('deploy.yml is missing jobs.build-locale.env');
          }
          const repositoryVars = JSON.parse(process.env.BENCH_REPOSITORY_VARS_JSON || '{}');
          const resolveValue = (raw, key) => {
            if (typeof raw !== 'string') return String(raw ?? '');
            const wrapped = /^\$\{\{\s*([\s\S]*?)\s*\}\}$/u.exec(raw);
            if (!wrapped) return raw;
            const expression = wrapped[1].trim();
            const comparison = /^vars\.([A-Z0-9_]+)\s*==\s*'([^']*)'\s*&&\s*'([^']*)'\s*\|\|\s*'([^']*)'$/u.exec(expression);
            if (comparison) {
              return String(repositoryVars[comparison[1]] ?? '') === comparison[2]
                ? comparison[3]
                : comparison[4];
            }
            const fallback = /^vars\.([A-Z0-9_]+)\s*\|\|\s*'([^']*)'$/u.exec(expression);
            if (fallback) return String(repositoryVars[fallback[1]] ?? fallback[2]);
            if (expression === 'matrix.locale') return 'it';
            if (expression === 'needs.matrix-setup.outputs.build_id') return process.env.BENCH_BUILD_ID;
            if (expression.includes('parallel_plugins')) return '1';
            throw new Error(`unsupported deploy build environment expression for ${key}`);
          };

          const lines = [];
          for (const [key, raw] of Object.entries(buildEnv)) {
            const value = resolveValue(raw, key);
            if (/[\r\n]/u.test(key) || /[\r\n]/u.test(value)) {
              throw new Error(`multiline deploy build environment value is unsupported: ${key}`);
            }
            lines.push(`${key}=${value}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          console.log(`Loaded ${lines.length} production build environment values from deploy.yml.`);
          NODE

      - name: Build IT locale shard from source snapshot
        env:
          NODE_OPTIONS: '--max-old-space-size=14336 --expose-gc'
        run: npm run build:ci 2>&1 | tee /tmp/build.log

      - name: Validate build profile markers
        run: node scripts/validate-build-profile-markers.mjs /tmp/build.log

      - name: Prune to production IT locale shard
        run: node scripts/ci/prune-locale-shard.mjs dist

      - name: Validate locale shard output
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      - name: Measure hreflang staging on the production-shaped shard
        shell: bash
        env:
          BENCH_SOURCE_RUN_ID: ${{ github.event.inputs.hreflang_source_run_id }}
          BENCH_SOURCE_RUN_ATTEMPT: ${{ github.event.inputs.hreflang_source_run_attempt }}
        run: |
          set -euo pipefail
          echo "Source deploy run: $BENCH_SOURCE_RUN_ID attempt $BENCH_SOURCE_RUN_ATTEMPT"
          echo "Benchmark code SHA: $(git rev-parse HEAD)"
          echo "IT shard bytes: $(du -sb dist | awk '{print $1}')"
          echo "IT shard files: $(find dist -type f | wc -l)"
          rm -f .cache/hreflang-index-manifest/it.json
          node scripts/ci/hreflang-index-manifest.mjs dist \
            --manifest-dir .cache/hreflang-index-manifest \
            --require-foreign-manifests 2>&1 | tee /tmp/hreflang-benchmark.log
          {
            echo "## Hreflang staging benchmark"
            echo
            echo "- Source deploy run: $BENCH_SOURCE_RUN_ID, attempt $BENCH_SOURCE_RUN_ATTEMPT"
            echo "- Benchmark code SHA: $(git rev-parse HEAD)"
            echo "- IT shard bytes: $(du -sb dist | awk '{print $1}')"
            echo "- IT shard files: $(find dist -type f | wc -l)"
            echo
            grep '^\[hreflang-index-manifest\]' /tmp/hreflang-benchmark.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hreflang-enospc-benchmark-${{ github.event.inputs.hreflang_source_run_id }}-${{ github.event.inputs.hreflang_source_run_attempt }}
          path: /tmp/hreflang-benchmark.log
          retention-days: 7
          if-no-files-found: ignore

  aggregate:
    needs: [build, shards]
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.build_only != 'true' && github.event.inputs.hreflang_source_run_id == ''
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: shard-timings/
          pattern: shard-*-timings

      - name: Compute matrix wall + summary
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_MAX=0
          MATRIX_SUM=0
          {
            echo "## Post-build matrix split — measurement"
            echo ""
            echo "| Shard | Wall (s) |"
            echo "|---:|---:|"
            for d in shard-timings/shard-*-timings; do
              [ -d "$d" ] || continue
              n=$(basename "$d" | sed -E 's/shard-([0-9]+)-timings/\1/')
              w=$(tr -d '[:space:]' < "$d/shard-wall.txt" 2>/dev/null || echo "?")
              echo "| $n | $w |"
              if [ "$w" != "?" ]; then
                MATRIX_SUM=$(awk "BEGIN{printf \"%.2f\", $MATRIX_SUM + $w}")
                gt=$(awk "BEGIN{print ($w > $MATRIX_MAX) ? 1 : 0}")
                if [ "$gt" = "1" ]; then MATRIX_MAX=$w; fi
              fi
            done
            echo ""
            echo "**Matrix wall (max shard) = ${MATRIX_MAX}s**"
            echo "**Sum across shards = ${MATRIX_SUM}s** (info — not the wall)"
            echo ""
            echo "Single-runner baselines for comparison (from deploy.yml):"
            echo "- MAX_PARALLEL=2 (current default): ~345s"
            echo "- Uncapped (18-way thrash): ~567s"
            echo ""
            echo "### Per-task wall_s, all shards (sorted DESC)"
            echo ""
            echo '```'
            cat shard-timings/shard-*-timings/timings.txt 2>/dev/null \
              | sort -k2 -gr || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
