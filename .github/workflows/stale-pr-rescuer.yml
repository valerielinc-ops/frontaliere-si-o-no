name: Stale PR rescuer (self-healing signal)

# Converte gli stalli silenziosi della pipeline PR in un segnale labellato +
# queryable entro ~1h, invece di lasciarli fermi giorni (osservato 2026-06-02:
# #1073 e #1075 ferme 23h). Tre classi di stallo, tutte documentate in
# AGENTS.md ma finora SOLO manuali:
#   A) workflow-validation drift: la PR modifica il workflow di review → pr-review-loop
#      fallisce con review body vuoto (storicamente: app-token 401). Oggi il caso è
#      coperto dal drift-fallback deterministico di auto-merge-eval.mjs, non da merge origin/main.
#   B) 🔴 Important non ripreso: il reviewer ha postato 🔴 sull'head corrente,
#      auto-merge skipped, nessun commit nuovo. Fix: commit sullo stesso branch.
#   C) vitest non-`success` sull'head e nessun run in volo: la PR non ha NESSUN
#      segnale a valle e non può acquisirne (con i test rossi il job si ferma
#      prima dello step di review Claude, che dal 2026-08-26 vive dentro
#      `tests.yml`) → prima cadeva in un `else` muto ed era irrecuperabile. Fix:
#      `stale-review`, che riapre il grafo dei rerun e dei fixer.
#      Misurata su 8 PR ferme 1-4 giorni il 2026-08-05 (issue #5041).
#
# DETERMINISTICO (zero Claude → zero quota Max, coerente con la frugalità di
# issue-triage). Azione = label `stale-review` + UN commento idempotente con la
# rescue instruction. La label è applicata con il token App quando disponibile:
# così può rieseguire il run PR esistente di tests.yml; il
# GITHUB_TOKEN resta fallback per label e rerun via API. Se non esiste un run
# pull_request già creato, il rescuer lascia un checkpoint manuale: non esegue
# mai `workflow_dispatch` su un ref scelto dal branch della PR.
# NON fa auto-push (l'auto-merge-origin-main per la classe A richiede PAT con
# scope `workflows`; è il follow-up dichiarato). Alert-only = safe da girare
# live accanto agli agent locali attivi sui branch.

on:
  # Event-driven primary: fire right after every review completes — exactly when
  # a stall (drift failure / 🔴 unpicked) would begin. Reliable on this high-load
  # Actions account, where the scheduled cron is deprioritized/dropped (observed
  # 2026-06-02: the `20 * * * *` slot missed 2 consecutive hours while 5 other
  # crons fired). The in-script 2h age-gate still prevents poking fresh PRs;
  # given the review volume, a stalled PR gets flagged within ~1 review cycle.
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    # I `tests` dei push su main non riguardano nessuna PR aperta. Il filtro
    # sul trigger evita che il run venga creato: il solo `if:` del job lo
    # lasciava nascere, occupare la concurrency e sfrattare il run in attesa
    # (anche un dispatch manuale, 2026-09-19 run 35462167973). `head_branch`
    # qui e' quello del run di `tests`, cioe' il branch della PR o `main`.
    branches-ignore: [main]
  schedule:
    - cron: '20 * * * *'  # slow fallback @ :20 (best-effort on this account)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, niente label/commenti'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # rerun the existing PR code-validation run
  checks: read # serve per commits/{sha}/check-runs (tests sull'head reale della PR)
  pull-requests: write
  issues: write

concurrency:
  group: stale-pr-rescuer
  cancel-in-progress: false

jobs:
  rescue:
    # Il `tests` di un push su `main` non cambia lo stato di nessuna PR: lo
    # scan qui sotto legge solo le PR aperte e non usa il payload
    # `workflow_run` (niente `head_branch`/`head_sha`, vedi la nota piu' in
    # basso). Quei completamenti erano 86 run in 4 h il 2026-09-19, tutte
    # identiche al tick successivo. Restano le completion delle PR, il cron e
    # il dispatch.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Pin the runner-owned GitHub CLI before checkout so every API read and
      # rescue mutation below uses the attested absolute executable.
      - name: Resolve trusted GitHub CLI (before checkout)
        id: trusted_gh
        run: |
          set -euo pipefail
          gh_bin="$(command -v gh || true)"
          if [ -z "$gh_bin" ] || [[ "$gh_bin" != /* ]] || [ ! -x "$gh_bin" ]; then
            echo "::error::GitHub CLI path non assoluto o non eseguibile: ${gh_bin:-missing}"
            exit 1
          fi
          gh_bin="$(realpath "$gh_bin")"
          case "$gh_bin" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "::error::GitHub CLI risolve in un path controllabile dal runner: $gh_bin"
              exit 1
              ;;
          esac
          probe="$gh_bin"
          while [ "$probe" != "/" ]; do
            if [ -w "$probe" ]; then
              echo "::error::GitHub CLI o una directory del suo path è scrivibile dal runner: $probe"
              exit 1
            fi
            probe="$(dirname "$probe")"
          done
          printf 'path=%s\n' "$gh_bin" >> "$GITHUB_OUTPUT"

      # `secrets.GITHUB_TOKEN` è deliberatamente un fallback soltanto: un evento
      # GitHub scritto da quell'identità non avvia un altro workflow. Il minter è
      # zero-dep e viene preso in sparse checkout per mantenere questo rescuer
      # leggero; l'App token può rieseguire il run PR senza creare check metadata.
      - name: Checkout App-token minter
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/mint-app-token.mjs
            scripts/ci/orphan-pr-custodian.mjs
            scripts/ci/lib/constants.mjs
            scripts/ci/lib/review-input-revision.mjs
            scripts/lib/githubApiHeaders.mjs
            functions/src/githubApiHeaders.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Mint App token for non-recursive rescue labels
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Scan open PRs and flag stalled ones
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CI_CHECK_NAME: 'vitest (unit + integration)'
          LEGACY_CI_CHECK_NAME: 'vitest execution'
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          AGE_MIN_S=7200  # 2h: non toccare PR con lavoro recente (agent attivo)

          # Tutte le PR aperte sono candidate alla lettura; la provenienza
          # autonoma viene verificata sotto con branch/label, non inferita
          # dall'autore owner (che include anche PR umane). `gh pr list` con
          # `--limit 50` troncava in silenzio proprio le PR più vecchie, cioè
          # quelle che questo rescuer deve recuperare. Se una pagina API non
          # è leggibile, il job fallisce e il cron ritenta: non si dichiara
          # verde lasciando una PR invisibile.
          if ! prs=$("$TRUSTED_GH_BIN" api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | {number, headRefName: .head.ref, headRefOid: .head.sha, updatedAt: .updated_at, labels: [.labels[] | {name}], isDraft: .draft}' \
            | jq -s '.'); then
            echo "::error::Query PR aperte fallita o non valida: scan stale non eseguito." >&2
            exit 1
          fi

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            N=$(echo "$pr" | jq -r '.number')
            BRANCH=$(echo "$pr" | jq -r '.headRefName')
            HEAD=$(echo "$pr" | jq -r '.headRefOid')
            UPD=$(echo "$pr" | jq -r '.updatedAt')
            HAS_AUTOFIX=$(echo "$pr" | jq -r 'if any(.labels[]?.name; . == "agent:autofix") then "true" else "false" end')
            IS_DRAFT=$(echo "$pr" | jq -r '.isDraft')

            # Il rescuer e il recycle sono strumenti del loop autonomo. La
            # provenienza va dimostrata dal branch storico del fixer oppure dal
            # label esplicito applicato dallo step `issue-fix`/`/fix-issue`;
            # autore owner non è una prova sufficiente, perché include anche PR
            # umane. Questo filtro evita che una stale-review aggiunta a mano
            # trasformi una PR umana in un target di auto-requeue.
            IS_AUTOFIX=false
            case "$BRANCH" in
              fix/*) IS_AUTOFIX=true ;;
              *) [ "$HAS_AUTOFIX" = "true" ] && IS_AUTOFIX=true ;;
            esac
            if [ "$IS_AUTOFIX" != "true" ]; then
              echo "PR #$N non marcata agent:autofix e branch non fix/* — skip (solo PR autonome)"; continue
            fi

            # DRAFT → skip. Una draft non è in attesa di review, quindi nessuna
            # delle tre classi è un vero stallo per lei. Il filtro diventa
            # NECESSARIO con la classe C: una draft WIP ha spesso vitest rosso o
            # nessun check per giorni, quindi verrebbe etichettata `stale-review`
            # — e `recycle-stale-prs.yml` CHIUDE le `stale-review` ferme >24h
            # senza commit nuovi (quel workflow non filtra le draft). Senza
            # questa guardia la classe C trasformerebbe un WIP legittimo in una
            # PR chiusa. `pr-autorebase.mjs` filtra già le draft (`!p.isDraft`);
            # questo allinea il rescuer alla stessa regola.
            if [ "$IS_DRAFT" = "true" ]; then echo "PR #$N draft — skip"; continue; fi

            # Age gate: l'orologio è l'ultimo PUSH, non `updated_at`. Ogni
            # review, commento e label del ciclo rinfresca `updated_at` — cioè
            # proprio l'attività automatica che NON prova che un agente sia
            # vivo, che è la domanda che questo gate pone. Misurato il
            # 2026-09-19 sul corpus: tre PR orfane ferme da ore (#1599 aperta
            # da 11,7 h) respinte come «fresche» perché il reviewer aveva
            # appena postato il suo ennesimo 🔴. Stesso difetto e stessa
            # correzione di `scripts/ci/orphan-pr-custodian.mjs`, che questo
            # workflow esegue due step più sotto.
            # `updated_at` resta il ripiego quando la data del commit non è
            # leggibile: è sempre >= la data del push, quindi al massimo
            # ritarda un intervento, non ne anticipa uno.
            PUSHED_AT=$("$TRUSTED_GH_BIN" api "repos/$REPO/commits/$HEAD" --jq '.commit.committer.date' 2>/dev/null || true)
            IDLE_SINCE="${PUSHED_AT:-$UPD}"
            # Una risposta non vuota ma senza una data (per esempio `{}`) non
            # attiva `${PUSHED_AT:-$UPD}`: prova esplicitamente `updated_at`
            # prima del fallback conservativo su `NOW`.
            UPD_S=$(date -u -d "$IDLE_SINCE" +%s 2>/dev/null \
              || date -u -d "$UPD" +%s 2>/dev/null \
              || echo "$NOW")
            if [ $((NOW - UPD_S)) -lt $AGE_MIN_S ]; then echo "PR #$N con push recente (<2h) — skip"; continue; fi

            # NB: il run di `tests` ora contiene anche la review Claude; il
            # check-run è quindi il segnale condiviso da usare sulla head.
            # Verificato via API diretta: per run workflow_run-triggered, sia
            # `head_branch` SIA il `head_sha` di TOP-LIVELLO che GitHub espone in
            # lista riportano il branch/commit di `main` al momento del trigger
            # (qualunque commit fosse HEAD lì, spesso un push bot scollegato),
            # MAI l'head della PR — un filtro `--branch "$BRANCH"` non trova mai
            # nulla (RV_CONCL sempre "none", Classe A dead code) e filtrare su
            # `head_sha == $HEAD` è ugualmente inutile (nessun run lo riporta mai,
            # anche quando la review È stata effettivamente postata su quell'head).
            # Segnale affidabile invece: il check-run di `tests.yml` (trigger
            # `pull_request`, quindi SI attacca correttamente all'head reale della
            # PR) + la review API (il suo `commit_id` è anch'esso corretto).
            # `check-runs` è paginato: un head con molti rerun può avere il
            # verdetto che conta oltre la prima pagina. Una risposta API
            # illeggibile è distinta da una lista vuota e non può diventare un
            # rescue mutante per errore.
            CHECKS_STATE=available
            if ! checks=$("$TRUSTED_GH_BIN" api --paginate "repos/$REPO/commits/$HEAD/check-runs?per_page=100" 2>/dev/null); then
              CHECKS_STATE=unavailable
            elif [ -z "${checks//[[:space:]]/}" ] || ! printf '%s\n' "$checks" | jq -s -e --arg head "$HEAD" '
              def parse_time:
                if type != "string" or length == 0 then null
                else (try (sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) catch null) end;
              def workflow_id:
                if (.details_url | type) != "string" then null
                else try (.details_url | capture("^https://github[.]com/[^/]+/[^/]+/actions/runs/(?<id>[1-9][0-9]*)/job/[1-9][0-9]*$").id) catch null end;
              def safe_id: (type == "number" and floor == . and . >= 1 and . <= 9007199254740991);
              def valid_uuid: (type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"; "i"));
              def generation:
                if (.created_at | parse_time) != null then true
                elif (.run_attempt | safe_id) then true
                else (workflow_id != null and (.check_suite | type) == "object" and (.check_suite.id | safe_id) and (.external_id | valid_uuid)) end;
              def valid_pages:
                type == "array" and length > 0 and all(.[];
                  type == "object"
                  and (.check_runs | type) == "array"
                  and all(.check_runs[]; type == "object")
                );
              def candidates:
                [.[].check_runs[] | select(.name == $ENV.CI_CHECK_NAME or .name == $ENV.LEGACY_CI_CHECK_NAME)] as $matches
                | if any($matches[]; .name == $ENV.CI_CHECK_NAME)
                  then $matches | map(select(.name == $ENV.CI_CHECK_NAME))
                  else $matches | map(select(.name == $ENV.LEGACY_CI_CHECK_NAME))
                  end;
              if (valid_pages | not) then false
              else candidates as $all
              | if ($all | length) == 0 then true else all($all[];
                (.id | safe_id)
                and (.head_sha | type) == "string" and (.head_sha | ascii_downcase) == ($head | ascii_downcase)
                and (.status == "completed" or .status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")
                and ((has("created_at") | not) or .created_at == null or (.created_at | parse_time) != null)
                and ((has("run_attempt") | not) or .run_attempt == null or (.run_attempt | safe_id))
                and ((has("external_id") | not) or .external_id == null or (.external_id | valid_uuid))
                and ((has("check_suite") | not) or .check_suite == null or ((.check_suite | type) == "object" and (.check_suite.id | safe_id) and ((.check_suite.head_sha // null) == null or ((.check_suite.head_sha | type) == "string" and (.check_suite.head_sha | ascii_downcase) == ($head | ascii_downcase))) and ((.check_suite.created_at // null) == null or (.check_suite.created_at | parse_time) != null)))
                and generation
                and (.status != "completed" or ((.completed_at | parse_time) and (.conclusion | type) == "string" and (.conclusion | length) > 0))) end
              end
            ' >/dev/null 2>&1; then
              CHECKS_STATE=unavailable
            fi
            if [ "$CHECKS_STATE" = "unavailable" ]; then
              echo "::warning::Check-run della PR #$N non verificabile — nessun rescue o mutation."
              continue
            fi
            # Selezione generation-aware: created_at, poi run_attempt, poi
            # workflow-run ID e infine check ID. `completed_at` non è un tie-break
            # di generazione. SHA misto, metadati incomparabili e duplicati sono
            # tutti pending/ambiguous e restano fail-closed.
            TESTS_STATE=$(printf '%s\n' "$checks" | jq -rs --arg n "$CI_CHECK_NAME" --arg legacy "$LEGACY_CI_CHECK_NAME" --arg head "$HEAD" '
              def workflow_id:
                if (.details_url | type) != "string" then null
                else try (.details_url | capture("^https://github[.]com/[^/]+/[^/]+/actions/runs/(?<id>[1-9][0-9]*)/job/[1-9][0-9]*$").id) catch null end;
              def safe_id: (type == "number" and floor == . and . >= 1 and . <= 9007199254740991);
              def parse_time:
                if type != "string" or length == 0 then null else (try (sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) catch null) end;
              def generation:
                (.created_at | parse_time) as $created
                | (if (.run_attempt | safe_id) then .run_attempt else 0 end) as $attempt
                | (workflow_id // "0") as $workflow
                | if $created != null then {source:"timestamp", created:$created, attempt:$attempt, workflow:($workflow | tonumber), id:.id}
                  elif (.run_attempt | safe_id) then {source:"attempt", created:0, attempt:.run_attempt, workflow:($workflow | tonumber), id:.id}
                  elif $workflow != "0" then {source:"workflow", created:0, attempt:0, workflow:($workflow | tonumber), id:.id}
                  else null end;
              def candidates:
                [.[].check_runs[] | select(.name == $n or .name == $legacy)] as $matches
                | if any($matches[]; .name == $n)
                  then $matches | map(select(.name == $n))
                  else $matches | map(select(.name == $legacy))
                  end;
              candidates as $all
              | if ($all | length) == 0 then {conclusion:"none", pending:0}
                elif ([ $all[] | .head_sha | ascii_downcase ] | unique | length) != 1 then {conclusion:"none", pending:1}
                elif any($all[]; (generation == null)) then {conclusion:"none", pending:1}
                elif ([ $all[] | generation.source ] | unique | length) != 1 then {conclusion:"none", pending:1}
                elif ([ $all[] | .id ] | unique | length) != ($all | length) then {conclusion:"none", pending:1}
                else ($all | map(. + {generation:generation}) | map(select(.status != "completed" or .conclusion != "skipped"))) as $verdicts
                  | if ($verdicts | length) == 0 then {conclusion:"none", pending:0}
                    else ($verdicts | sort_by([.generation.created, .generation.attempt, .generation.workflow, .generation.id]) | last) as $latest
                      | if $latest.status == "completed" then {conclusion:$latest.conclusion, pending:0} else {conclusion:"none", pending:1} end
                    end
                end')
            TESTS_CONCL=$(printf '%s' "$TESTS_STATE" | jq -r '.conclusion // "none"' 2>/dev/null || echo "none")
            TESTS_PENDING=$(printf '%s' "$TESTS_STATE" | jq -r '.pending // 1' 2>/dev/null || echo 1)

            # Ultima review del bot reviewer (claude) + commit a cui si riferisce.
            reviews=$("$TRUSTED_GH_BIN" api "repos/$REPO/pulls/$N/reviews" 2>/dev/null || echo '[]')

            # Fencing sulla REVISIONE del body, non solo su `commit_id`. Una
            # modifica del body non cambia la HEAD: senza questo confronto un
            # verdetto che `review-gate` ha gia' invalidato resta attivo qui, e
            # la classificazione (e il re-queue che ne segue) parte dal
            # risultato vecchio. E' la stessa regola che applica il custode in
            # `scripts/ci/orphan-pr-custodian.mjs`, eseguito piu' sotto nello
            # stesso job.
            PR_JSON="${RUNNER_TEMP:-/tmp}/rescuer-pr-$N.json"
            CUR_REV=""
            if "$TRUSTED_GH_BIN" api "repos/$REPO/pulls/$N" > "$PR_JSON" 2>/dev/null; then
              CUR_REV=$(node scripts/ci/lib/review-input-revision.mjs hash-pr-json --file "$PR_JSON" 2>/dev/null || true)
            fi
            # Una review SENZA marker resta ammessa: il reviewer di questo repo
            # non li emette, e il fencing non deve spegnere la classificazione.
            # Con i marker ne serve ESATTAMENTE uno e uguale alla revisione
            # corrente — la stessa condizione di `reviewHasInputRevision`.
            # `CUR_REV` vuota con marker presenti => nessuna review ammessa:
            # non potendo provare la validita' si chiude, non si indovina.
            fenced=$(printf '%s' "$reviews" | jq -c --arg rev "$CUR_REV" '
              def marks: (.body // "")
                | gsub("\\\\r\\\\n"; "\n") | gsub("\\\\n"; "\n")
                | split("\n") | map(sub("\r$"; ""))
                | map(select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                      | ascii_downcase | ltrimstr("<!-- review_input_revision: ") | rtrimstr(" -->"));
              [ .[]
                | select(.user.login | test("^(claude(\\[bot\\])?|frontaliere-automation\\[bot\\])$"; "i"))
                | select((marks | length) == 0
                         or ((marks | length) == 1 and marks[0] == ($rev | ascii_downcase))) ]' \
              2>/dev/null || echo '[]')
            LAST_BODY=$(printf '%s' "$fenced" | jq -r 'last | .body // ""')
            LAST_CID=$(printf '%s' "$fenced" | jq -r 'last | .commit_id // ""')

            # La copia bash deve fallire chiuso se PCRE rifiuta `(*UTF)`: exit 1
            # significa solo «nessun marker», exit >1 è un errore del guard.
            IMPORTANT_MARKER_STATUS=1
            if grep -qP '(*UTF)^(?:[^🟡🟢]*(?<!\x60)🔴\s*\*{0,2}\s*Important\s*\*{0,2}\s*[:—-]|[ \t]*(?:[-*+>][ \t]*)?(?:\x60[^\x60\n]*:L?\d+(?:[-–]\d+)?\x60?|(?:PR[ \t]+body|[A-Za-z0-9_.@/-]+):L?\d+(?:[-–]\d+)?):[ \t]*🔴\s*\*{0,2}\s*Important\s*\*{0,2}(?=\s+\S))' <<< "$LAST_BODY"; then
              IMPORTANT_MARKER_STATUS=0
            else
              IMPORTANT_MARKER_STATUS=$?
            fi
            if [ "$IMPORTANT_MARKER_STATUS" -gt 1 ]; then
              echo "::error::grep -P non ha potuto validare il marker 🔴 Important (exit $IMPORTANT_MARKER_STATUS): Classe B disabilitata per questa PR."
              # Non uscire dall'iterazione: le classi A e C non usano il marker
              # e devono restare raggiungibili anche se il runner ha un PCRE rotto.
            fi

            REASON=""; RESCUE=""; CLASS=""
            if [ "$TESTS_CONCL" = "success" ] && [ "$LAST_CID" != "$HEAD" ]; then
              CLASS="A"
              # Classe A: tests verdi sull'head corrente da >2h ma nessuna review
              # l'ha mai coperto (workflow-validation drift o coda congestionata —
              # non distinguibili via API, stesso fix per entrambe).
              REASON="tests verdi sull'head corrente da >2h ma nessuna review pr-review-loop l'ha coperto"
              RESCUE="tests verdi ma nessuna review: NON mergiare \`main\` (invalida il giro CI e non sana nulla — vedi AGENTS.md). Attendi il prossimo tick di \`pr-autorebase.yml\`, che fa close+reopen sullo stesso head; se dopo due tick la review non compare, apri una issue."
            elif [ "$IMPORTANT_MARKER_STATUS" -eq 0 ] && [ "$LAST_CID" = "$HEAD" ]; then
              CLASS="B"
              # Classe B: 🔴 Important sull'head corrente, non ripreso. Regex
              # allineata a REDFLAG_IMPORTANT_RE (scripts/ci/lib/constants.mjs):
              # un bare `grep -q "🔴"` avrebbe mis-triggerato su prosa di
              # negazione del reviewer ("zero 🔴 Important findings", PR #3330), e
              # il solo delimitatore non basta contro un marker CITATO dentro la
              # riga di un altro finding o dentro un code span (corpus#909) — da qui
              # `^[^🟡🟢❓]*` e `(?<!\`)`. Sono ammessi anche i marker bare soltanto
              # dopo una location (`path:L<linea>:`), formato previsto da REVIEW.md.
              # grep è orientato alla riga, quindi il pattern è la `.source` JS senza
              # il primo `\n` nella classe negata; il guard
              # `mirror bash` di tests/redflag-important-marker.test.ts lo pretende
              # verbatim in questo file.
              REASON="🔴 Important non ripreso (review sull'head corrente $HEAD, auto-merge skipped, nessun commit nuovo)"
              RESCUE="applica il fix del 🔴 in un nuovo commit sullo stesso branch \`$BRANCH\` → re-review automatica. Vedi la review più recente sulla PR."
            elif [ "$TESTS_PENDING" = "0" ] && [ "$TESTS_CONCL" != "success" ]; then
              CLASS="C"
              # Classe C — RETE DI SICUREZZA (2026-08-05, issue #5041).
              #
              # Le classi A e B presuppongono che la PR abbia già un segnale a
              # valle del vitest verde: A esige `tests == success`, B una review
              # (che `pr-review-loop.yml` posta solo su
              # `workflow_run.conclusion == 'success'`). Una PR con vitest ROSSO
              # non ha né può acquisire nessuno dei due, e cadeva in questo
              # `else` MUTO: nessuna label, nessun commento, nessuna traccia.
              #
              # Quel silenzio era il TERZO arco mancante dello stato assorbente
              # misurato sulle 8 PR ferme 1-4 giorni (#5019 #5067 #5068 #5070
              # #5072 #5073 #5074 #5085): senza `stale-review`, il gate
              # near-merge di `pr-autorebase.mjs` skippa la PR, quindi nessun
              # rebase e nessun re-test — e senza re-test il vitest resta rosso.
              # Ciclo chiuso. `vitestFailureIsNotAttributableToPr` (#5095) ne ha
              # aperto uno per il caso `failure` con prova positiva; questa è la
              # rete a maglia larga che copre TUTTI i verdetti non-`success`
              # (`cancelled`, `timed_out`, `action_required`, e il caso "nessun
              # check-run vitest" degli head orfani) senza esigere alcuna prova.
              #
              # Resta deterministico e non usa Claude: mette una label, rilancia
              # il check esistente (oppure lascia un checkpoint manuale se manca)
              # e scrive UN commento
              # idempotente. Il gate d'età di 2h + il marker (classe, head)
              # impediscono il rumore su una PR con lavoro in corso.
              REASON="vitest \`$TESTS_CONCL\` sull'head da >2h, nessun run in volo e nessun segnale a valle (con i test rossi il job si ferma prima dello step di review Claude) — stallo silenzioso"
              RESCUE="etichettata \`stale-review\`; se esiste un run pull_request viene rieseguito, altrimenti resta un checkpoint manuale senza dispatch trusted. Se il rosso è REALE (del diff della PR) il redcheck-fixer lo corregge entro il suo round cap; il rescuer non abbassa il gate e la label non nasconde il problema. Se il branch è in conflitto, il recycle giornaliero ricrea il fix contro main corrente. Vedi AGENTS.md → \"main rosso blocca a cascata\"."
            else
              echo "PR #$N nessuno stallo noto (tests=$TESTS_CONCL pending=$TESTS_PENDING) — skip"; continue
            fi

            echo "::warning::PR #$N STALLED — $REASON"
            if [ "${DRY_RUN:-false}" = "true" ]; then echo "(dry-run) skip azione PR #$N"; continue; fi

            # Idempotenza sull'AZIONE, non sulla VALUTAZIONE: `stale-review`
            # non è più un semaforo che nasconde la PR al giro successivo.
            # La chiave (classe, head) permette di riprovare uno stallo quando
            # cambia il commit o la diagnosi, senza commentare a ogni cron.
            posted=$("$TRUSTED_GH_BIN" api --paginate "repos/$REPO/issues/$N/comments?per_page=100" 2>/dev/null || echo '[]')
            POSTED_BODIES=$(echo "$posted" | jq -rs '[.[][]? | .body // ""] | join("\n")' 2>/dev/null || echo "")
            MARKER="<!-- stale-pr-rescuer class=$CLASS head=${HEAD:0:7} -->"
            case "$POSTED_BODIES" in
              *"$MARKER"*) echo "PR #$N: classe $CLASS su ${HEAD:0:7} già segnalata — nessuna azione"; continue ;;
            esac

            "$TRUSTED_GH_BIN" pr edit "$N" --repo "$REPO" --add-label "stale-review" 2>/dev/null || \
              echo "label stale-review assente nel repo — creala una volta: gh label create stale-review"
            # Rerun the existing pull_request run: labels are metadata and do
            # not start tests.yml. Keeping its event preserves PR review context.
            # Prefer the current required check; fall back to the legacy
            # execution name only on heads that do not expose the wrapper.
            RESCUE_RUN=$(printf '%s\n' "$checks" | jq -rs --arg n "$CI_CHECK_NAME" --arg legacy "$LEGACY_CI_CHECK_NAME" '
              def parse_time:
                if type != "string" or length == 0 then null
                else (try (sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) catch null) end;
              def workflow_id:
                if (.details_url | type) != "string" then null
                else try (.details_url | capture("^https://github[.]com/[^/]+/[^/]+/actions/runs/(?<id>[1-9][0-9]*)/job/[1-9][0-9]*$").id) catch null end;
              def safe_id: (type == "number" and floor == . and . >= 1 and . <= 9007199254740991);
              def generation:
                (.created_at | parse_time) as $created
                | (if (.run_attempt | safe_id) then .run_attempt else 0 end) as $attempt
                | (workflow_id // "0") as $workflow
                | if $created != null then {source:"timestamp", created:$created, attempt:$attempt, workflow:($workflow | tonumber), id:.id}
                  elif (.run_attempt | safe_id) then {source:"attempt", created:0, attempt:.run_attempt, workflow:($workflow | tonumber), id:.id}
                  elif $workflow != "0" then {source:"workflow", created:0, attempt:0, workflow:($workflow | tonumber), id:.id}
                  else null end;
              [.[].check_runs[] | select((.name == $n or .name == $legacy) and .status == "completed" and .conclusion != "skipped")] as $matches
              | if any($matches[]; .name == $n) then $matches | map(select(.name == $n)) else $matches | map(select(.name == $legacy)) end
              | map(. + {generation:generation})
              | if length == 0 or any(.[]; .generation == null) then ""
                elif ([.[] | .generation.source] | unique | length) != 1 then ""
                else sort_by([.generation.created, .generation.attempt, .generation.workflow, .generation.id]) | last
                  | (.details_url // "")
                  | (try (capture("/actions/runs/(?<id>[1-9][0-9]*)").id) catch "")
                end')
            ACTION_OK=true
            if [ -n "$RESCUE_RUN" ]; then
              "$TRUSTED_GH_BIN" run rerun "$RESCUE_RUN" --repo "$REPO" || {
                ACTION_OK=false
                echo "::warning::Cannot rerun code checks for PR #$N."
              }
            else
              ACTION_OK=false
              echo "::warning::Nessun run pull_request esistente per PR #$N: checkpoint manuale, nessun dispatch trusted."
            fi
            COMMENT_MARKER=""
            if [ "$ACTION_OK" = "true" ]; then COMMENT_MARKER="$MARKER"; fi
            "$TRUSTED_GH_BIN" pr comment "$N" --repo "$REPO" --body "$(printf '🔧 **stale-review** (auto): PR ferma >2h.\n\nClasse: %s\n\nRescue: %s\n\n_Segnale deterministico da stale-pr-rescuer.yml (zero-Claude). Auto-rescue con push = follow-up (serve PAT scope workflows)._\n%s' "$REASON" "$RESCUE" "$COMMENT_MARKER")" \
              2>/dev/null || echo "comment fallito PR #$N"
          done
          echo "Scan completo."

      # Le PR non autonome (branch non `fix/*`, autore umano, senza
      # `agent:autofix`) sono saltate dallo scan qui sopra e dai fixer: quando
      # l'agente che le ha aperte muore restano ferme per ore (9 PR, 6-8 h, il
      # 2026-09-19). Il custode rilancia un check richiesto CANCELLED su una
      # HEAD con LGTM e adotta per i fixer le PR con un 🔴 dichiarato fuori
      # scope. Zero-Claude, idempotente per (azione, HEAD).
      - name: Orphan PR custodian
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/ci/orphan-pr-custodian.mjs
