name: TikTok Content Preview (delivery held)

# This workflow is a manual, read-only content preview. TikTok automated
# delivery is held by scripts/lib/social-automation-policy.mjs while the
# internal team uploader is ineligible under current platform guidelines.
# It loads only the GA4 service account for analytics.readonly; it never loads
# TikTok tokens, Remote Config, or the browser profile.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit the preview to article, job, or border'
        required: false
        default: ''
        type: string
      date:
        description: 'UTC report day (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string

concurrency:
  group: tiktok-daily-broadcast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONLY: ${{ inputs.only || '' }}
      REPORT_DATE: ${{ inputs.date || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci

      - name: Prepare GA4 read-only credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        if: env.ONLY != 'article' && env.ONLY != 'border'
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --no-summaries

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: env.ONLY != 'article' && env.ONLY != 'border' && steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Assemble jobs dataset
        id: assemble
        if: env.ONLY != 'article' && env.ONLY != 'border'
        run: node scripts/assemble-jobs-dataset.mjs --no-summaries
        continue-on-error: true

      - name: Save assemble-jobs cache
        if: env.ONLY != 'article' && env.ONLY != 'border' && steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Generate TikTok content preview
        run: |
          set -euo pipefail
          ARGS=(--dry-run)
          if [ -n "$ONLY" ]; then ARGS+=("--only=$ONLY"); fi
          if [ -n "$REPORT_DATE" ]; then ARGS+=("--date=$REPORT_DATE"); fi
          npx --no-install tsx scripts/post-to-tiktok.mjs "${ARGS[@]}"
