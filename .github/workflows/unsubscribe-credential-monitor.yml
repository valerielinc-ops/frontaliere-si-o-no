name: unsubscribe-credential-monitor

# #5757 item 3 — the deferred half of follow-up(#5747): a threshold on the
# `credential` field (#5719: `autologin_code` | `email_token`) that every
# `unsubscribe` event carries on the `unsubscribe_link` channel. Items 1 and
# 2 of #5757 shipped as PR #5762/#5763; this closes item 3, which both PRs
# explicitly deferred.
#
# WHY IT MATTERS
#   `email_token` is the primary, expected credential (every newsletter
#   footer carries the scoped `/disiscrivi-newsletter/` link). `autologin_code`
#   is a FALLBACK, only used when that primary token failed and an authentic
#   `ac` code saved the click. #5724 is rolling out a TTL/revocation window
#   for `ac` itself (see autologin-refusal-monitor.yml, the sibling that
#   watches `exchange_auth_code`). The day that ships, every unsubscribe
#   currently riding the `autologin_code` fallback is one policy change away
#   from a real "Link non valido" on their exit — the exact LPD-complaint
#   shape `ac` exists to prevent. This workflow is the number that has to
#   exist before that day, same reasoning as the sibling monitor.
#
# SAME FORM AS THE SIBLING MONITOR, DIFFERENT SOURCE
#   That one reads Cloud Logging; this reads Firestore directly (the data
#   was already a Firestore event, never a log line — see
#   scripts/check-unsubscribe-credential-rate.mjs's header for why it does
#   NOT use a collectionGroup('events') query: the composite index
#   firestore.indexes.json declares for it is not deployed to production).
#
#   >= 25% -> priority 1
#   >= 10% -> priority 2
#   > 0 with no fallback ever observed before -> priority 3 (informational)
#   0 unsubscribe_link events in the window -> priority 2 (no_signal — a
#     broken query looks identical to "nobody unsubscribed", so this alerts
#     rather than passing silently)
#
# ATTESO AL PRIMO GIRO: il canale e' nuovo (measured volume ~20-50
# credentialed unsubscribe/week at the time this was written) — un giro con
# poco traffico apre `insufficient_sample` (NON alerting) piu' spesso che il
# monitor gemello. E' corretto, non un guasto.

on:
  schedule:
    # 07:40 UTC — dopo il gemello autologin-refusal-monitor (07:10), stessa
    # finestra mattutina europea.
    - cron: '40 7 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Ampiezza della finestra in ore (default 168 = 7 giorni)'
        required: false
        default: '168'

permissions:
  contents: write
  issues: write

concurrency:
  group: unsubscribe-credential-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # Stessa diagnosi di crawler-health-monitor.yml / autologin-refusal-monitor.yml:
          # fetch-depth: 0 da solo scarica blob a valanga; blob:none tiene la
          # storia dei commit (serve per il commit-back sotto) e rimanda i blob.
          filter: blob:none
          persist-credentials: true
        timeout-minutes: 7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      # scripts/check-unsubscribe-credential-rate.mjs reads Firestore directly
      # (see the workflow header — different source than the Cloud-Logging-based
      # sibling autologin-refusal-monitor.yml), so it needs firebase-admin. The
      # package is a devDependency, pruned by --omit=dev above; install it
      # standalone, same pattern as update-fuel-prices.yml/deploy-worker.yml.
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            # Fail-closed, come il gemello: senza credenziali questo monitor
            # non degrada, e' cieco — e un monitor cieco che esce verde e' il
            # guasto silenzioso che #5757 esiste per evitare.
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON mancante — impossibile leggere Firestore."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Check unsubscribe credential fallback rate
        id: check
        continue-on-error: true
        env:
          HOURS: ${{ github.event.inputs.hours || '168' }}
        run: node scripts/check-unsubscribe-credential-rate.mjs --hours="${HOURS}"

      - name: Commit history
        # `if: always()`: la storia va persistita anche (soprattutto) nei giri
        # che hanno alzato un alert — stesso motivo del gemello.
        if: always()
        run: |
          set -uo pipefail
          ec=0
          bash scripts/lib/git-commit-data.sh "📊 Auto-generated unsubscribe credential metrics" docs/unsubscribe-credential-rate/ || ec=$?
          # 42 = contesa sul push, si risana al giro dopo (vedi git-commit-data.sh).
          if [ "$ec" -eq 42 ]; then
            echo "::warning::Push in contesa (42) — lo stato si ricommitta al prossimo giro."
            exit 0
          fi
          exit "$ec"

      - name: Open issue on threshold breach
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f docs/unsubscribe-credential-rate/alert.json ]; then
            echo "::error::Lo script e' uscito !=0 senza scrivere alert.json — crash, non soglia superata."
            exit 1
          fi
          TITLE=$(jq -r '.title' docs/unsubscribe-credential-rate/alert.json)
          PRIORITY=$(jq -r '.priority' docs/unsubscribe-credential-rate/alert.json)
          jq -r '.body' docs/unsubscribe-credential-rate/alert.json > /tmp/unsub-credential-alert-body.md

          # github-issue-creator.mjs: dedup sui primi 60 caratteri del titolo,
          # quindi il discriminante (il codice del finding) sta PRIMO — un
          # suffisso finirebbe oltre il taglio e farebbe collassare famiglie
          # diverse (stessa nota del gemello autologin-rate).
          node scripts/lib/github-issue-creator.mjs \
            --title "$TITLE" \
            --description "$(cat /tmp/unsub-credential-alert-body.md)" \
            --priority "$PRIORITY" \
            --label unsub-credential-rate \
            --workflow "${{ github.workflow }}"

      - name: Close recovered unsub-credential-rate issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Senza questo step una issue di soglia resta aperta per sempre: lo
          # step sopra crea e basta. La condizione di chiusura e' l'assenza di
          # alert.json, che lo script cancella quando il giro e' pulito —
          # stessa forma del gemello autologin-rate.
          if [ -f docs/unsubscribe-credential-rate/alert.json ]; then
            echo "Alert ancora attivo — nessuna chiusura."
            exit 0
          fi
          gh issue list --state open --limit 200 \
            --json number,title --jq '.[] | select(.title | test("^\\[unsub-credential\\] ")) | .number' \
            > /tmp/unsub-credential-issues.txt || true
          while read -r num; do
            [ -n "$num" ] || continue
            echo "Chiudo #$num — nessun alert nell'ultimo giro."
            gh issue close "$num" --repo "$GH_REPO" \
              --comment "✅ Auto-chiusa: l'ultimo giro di \`unsubscribe-credential-monitor\` non ha alert (quota fallback sotto soglia). Storico: \`docs/unsubscribe-credential-rate/history.json\`." \
              || echo "Chiusura di #$num fallita (continuo)."
          done < /tmp/unsub-credential-issues.txt

      - name: Fail if threshold breached
        id: failgate
        if: steps.check.outcome == 'failure'
        run: |
          echo "Soglia superata — vedi la issue aperta sopra."
          exit 1

      - name: Report unexpected failure to GitHub Issues
        if: failure() && steps.failgate.conclusion != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito (crash fuori dalla detection)
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          Nota: il monitor e' fallito prima/fuori dallo step di misura — nessuna issue di soglia e' stata aperta, quindi la quota fallback NON e' stata letta oggi." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
