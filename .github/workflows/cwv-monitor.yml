name: CWV Monitor

# Weekly real-user CLS/INP regression watchdog for the #4302 money-page
# target list (dogana/valichi, mappa confine, job boards, weekly employer
# hub, tax simulator, homepage). Queries PostHog `$web_vitals` field data,
# persists a weekly snapshot to data/cwv-monitor-history.json (kept
# unpruned — see project convention on tracking files), and opens/dedupes
# a GitHub backlog issue via the shared "top-N over threshold" sync
# (scripts/lib/error-issue-sync.mjs) when a page/metric has been over its
# target on two consecutive recorded weeks.
#
# Zero-Claude by design (pure node + the existing gh issue-creator) per the
# frugality rules in AGENTS.md — no claude-code-action, no Max-quota burn.
#
# Auth: POSTHOG_PERSONAL_API_KEY / POSTHOG_PROJECT_ID / POSTHOG_HOST live in
# Firebase Remote Config, loaded via scripts/load-rc-env.mjs (same mechanism
# as monitor-cls-posthog.mjs / posthog-error-monitor.yml).

on:
  schedule:
    # Weekly, Wednesday 07:40 UTC — clear of the other 07:xx crons
    # (posthog-error-monitor Tuesday 07:25, GA4 app-error sync Monday
    # 07:00 inside analytics.yml, dmarc-monitor/app-auth-health-monitor/
    # funnel-metrics-snapshot/gsc-frontaliere-monitor Monday).
    - cron: '40 7 * * 3'
  workflow_dispatch:
    inputs:
      windowDays:
        description: 'HogQL look-back window in days (per query)'
        required: false
        type: string
        default: '7'

concurrency:
  group: cwv-monitor
  cancel-in-progress: false

permissions:
  # The weekly snapshot reaches main through the stable PR branch
  # chore/cwv-monitor-history (scripts/lib/open-data-refresh-pr.sh): the main
  # ruleset requires the vitest check, which only exists on a PR head. The
  # direct push it replaced was cancelled on 2026-09-30 (run 36727205394) and
  # lost that week's snapshot.
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # load-rc-env.mjs needs firebase-admin from node_modules to read
        # Remote Config; the monitor itself only uses node built-ins + gh CLI.
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # A regression is coined on two consecutive recorded weeks, and the
      # publisher keeps only the newest copy of a JSON snapshot when the stable
      # branch already changed it. Bring a snapshot PR still in flight into the
      # workspace before measuring, so last week's row reaches both the verdict
      # and the next PR instead of being replaced by a history rebuilt from main.
      - name: Carry forward pending CWV snapshot PR
        env:
          # actions/checkout uses persist-credentials=false; probe and fetch
          # the stable branch with the same identity the publisher uses below.
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          branch='chore/cwv-monitor-history'
          history_path='data/cwv-monitor-history.json'
          [ -n "$GH_TOKEN" ] || {
            echo "::error::No authenticated refresh token is available to probe the stable CWV snapshot branch"
            exit 1
          }
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          probe="$RUNNER_TEMP/cwv-monitor-history-remote-head"
          if ! git ls-remote "$remote_url" "refs/heads/${branch}" >"$probe" 2>/dev/null; then
            echo "::error::Unable to authenticate or probe the stable CWV snapshot branch"
            exit 1
          fi
          if [ ! -s "$probe" ]; then
            echo "No in-flight CWV snapshot PR branch found."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 "$remote_url" \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" \
            >/dev/null 2>&1; then
            echo "::error::Unable to fetch the stable CWV snapshot branch"
            exit 1
          fi
          if git cat-file -e "refs/remotes/origin/${branch}:${history_path}" 2>/dev/null; then
            git restore --source="refs/remotes/origin/${branch}" -- "$history_path"
            echo "Loaded pending CWV history from ${branch}."
          fi

      - name: Check CWV regressions + record weekly snapshot
        id: measure
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CWV_MONITOR_WINDOW_DAYS: ${{ inputs.windowDays || '7' }}
        run: |
          set +e
          node scripts/cwv-monitor-check.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # The stable branch is pushed with a lease and reconciled by the helper,
      # so a busy main no longer races this job: the snapshot is measured once
      # and never re-queried from PostHog on a retry.
      - name: Open PR with snapshot
        if: always() && steps.measure.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/cwv-monitor-refresh-pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Auto-generated by [workflow run %s](%s).\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            cat <<'EOF'
          ## Implementato
          - Lo snapshot settimanale CWV (`data/cwv-monitor-history.json`) viene proposto tramite il branch stabile `chore/cwv-monitor-history`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — snapshot automatizzato, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/cwv-monitor-history.json \
            --branch chore/cwv-monitor-history \
            --commit-message "chore: record weekly CWV snapshot" \
            --title "chore(data): record weekly CWV snapshot" \
            --body-file "$body"

      - name: Fail closed when the weekly measurement is incomplete
        if: always() && steps.measure.outputs.exit_code != '0'
        run: |
          code='${{ steps.measure.outputs.exit_code }}'
          echo "cwv-monitor-check exited $code — no complete CWV verdict was available"
          case "$code" in
            1) exit 1 ;;
            2) exit 2 ;;
            *) echo "unexpected monitor exit code: $code" >&2; exit 1 ;;
          esac

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 3 \
            --label Bug \
            --workflow "${{ github.workflow }}"
