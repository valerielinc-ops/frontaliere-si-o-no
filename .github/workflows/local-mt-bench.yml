# Bench of the Argos worker (scripts/local-mt-translate.py) on the runner the
# translation pipeline uses (ubuntu-latest, 4 vCPU), against real queued work.
#
# Why a workflow: the worker's throughput decides how much of the translation
# backlog each translate-pending run clears (run 37272320066: 4169 of 14512
# requests in 70 minutes), and it cannot be measured on a developer laptop
# (macOS + torch + CTranslate2 load two OpenMP runtimes and hang). The bench
# runs the base worker and the head worker on the same deterministic sample,
# under the same cap, and reports throughput and byte-identical responses.
# Read-only: no secrets, no writes, nothing pushed.
name: Local MT worker bench

on:
  pull_request:
    paths:
      - scripts/local-mt-translate.py
      - scripts/research/local-mt-engine-bench.mjs
      - .github/workflows/local-mt-bench.yml
  workflow_dispatch:
    inputs:
      requests:
        description: Requests in the sample
        default: '600'
      cap_seconds:
        description: Wall-clock cap per worker (seconds)
        default: '900'

permissions:
  contents: read

concurrency:
  group: local-mt-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (scripts, article engine helpers, job slices)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            packages/articles/engine
            data/jobs/by-crawler
          persist-credentials: false

      # No `cache: npm`: on pull_request it would save a per-ref npm cache
      # (tests/npm-cache-save-main-only.test.ts).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Argos Translate models
        uses: actions/cache@v6
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-translate-models-v1
          restore-keys: argos-translate-models-

      - name: Install Argos Translate
        run: |
          python3 -m pip install --quiet --upgrade pip==26.2.1
          python3 -m pip install --quiet argostranslate==1.11.0
          python3 scripts/local-mt-translate.py --install

      - name: Base worker
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: git show "$BASE_REF:scripts/local-mt-translate.py" > "$RUNNER_TEMP/base-worker.py"

      - name: Bench base vs head
        env:
          BENCH_REQUESTS: ${{ inputs.requests || '600' }}
          BENCH_CAP: ${{ inputs.cap_seconds || '900' }}
        run: |
          node scripts/research/local-mt-engine-bench.mjs \
            --base "$RUNNER_TEMP/base-worker.py" \
            --requests "$BENCH_REQUESTS" \
            --cap-seconds "$BENCH_CAP"
