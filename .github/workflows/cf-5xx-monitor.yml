name: Cloudflare 5xx Monitor

# Daily zone-wide 5xx watchdog. production-canary.yml already probes a FIXED
# list of known URLs every 15min — this catches 5xx on ANY path across the
# whole zone (unknown/new routes, CDN asset paths, locale-router shards),
# reusing the same GraphQL dataset as scripts/cf-status-report.mjs via its
# --json flag (no new integration, no duplicated CF-analytics construct —
# AGENTS.md #6).
#
# Zero-Claude by design (pure node + the existing gh issue-creator) per the
# frugality rules in AGENTS.md — no claude-code-action, no Max-quota burn.
#
# Auth: CF_API_TOKEN lives in Firebase Remote Config, loaded via
# scripts/load-rc-env.mjs (same mechanism as dmarc-monitor.yml /
# discover-404s-via-cloudflare.yml).
#
# Free-plan retention is ~3 days and queries are capped at ~1 day per call
# (see scripts/lib/cf-analytics.mjs), hence the daily cadence.

on:
  schedule:
    # Daily 03:50 UTC — 10min after discover-404s-via-cloudflare (03:40),
    # which already reads the same zone's GraphQL analytics; keeping the two
    # CF-analytics reads close together avoids spreading the CF token budget
    # window across the day.
    - cron: '50 3 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours (max ~23.9, free plan)'
        required: false
        type: string
        default: '23'

concurrency:
  group: cf-5xx-monitor
  cancel-in-progress: false

permissions:
  # `write` since 2026-08-05: this job now persists a snapshot to
  # data/cf-5xx-history.jsonl. It used to only file issues and keep nothing, which
  # meant every analysis started from scratch against a dataset whose free-plan
  # retention is ~3 days — see scripts/ci/cf-5xx-snapshot.mjs for why that hurt.
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Snapshot persistence was still retrying its main push at 13m30s in
    # #10548; allow the bounded retry helper to finish its convoy window.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Sync Cloudflare 5xx issues to backlog
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_5XX_HOURS: ${{ inputs.hours || '23' }}
        run: node scripts/cf-5xx-issue-sync.mjs

      # Runs even if the issue-sync step above failed: the whole point of the snapshot is an
      # unbroken baseline, and a gap is worse than a duplicate issue. The script is itself
      # proceed-safe (warns and exits 0 on any API fault), so this cannot turn the job red.
      - name: Record classified 5xx snapshot
        if: always()
        env:
          CF_5XX_SNAPSHOT_HOURS: ${{ inputs.hours || '23' }}
        run: node scripts/ci/cf-5xx-snapshot.mjs

      - name: Open PR with snapshot
        if: always()
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/cf-5xx-refresh-pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Auto-generated by [workflow run %s](%s).\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            cat <<'EOF'
          ## Implementato
          - Lo snapshot Cloudflare 5xx viene proposto tramite il branch stabile `chore/cf-5xx-history`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — snapshot automatizzato, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/cf-5xx-history.jsonl \
            --branch chore/cf-5xx-history \
            --commit-message "chore: record Cloudflare 5xx snapshot" \
            --title "chore(data): record Cloudflare 5xx snapshot" \
            --body-file "$body"
