name: Cloudflare 5xx Monitor

# Daily zone-wide 5xx watchdog. production-canary.yml already probes a FIXED
# list of known URLs every 15min — this catches 5xx on ANY path across the
# whole zone (unknown/new routes, CDN asset paths, locale-router shards),
# reusing the same GraphQL dataset as scripts/cf-status-report.mjs via its
# --json flag (no new integration, no duplicated CF-analytics construct —
# AGENTS.md #6).
#
# Zero-Claude by design (pure node + the existing gh issue-creator) per the
# frugality rules in AGENTS.md — no claude-code-action, no Max-quota burn.
#
# Auth: CF_API_TOKEN lives in Firebase Remote Config, loaded via
# scripts/load-rc-env.mjs (same mechanism as dmarc-monitor.yml /
# discover-404s-via-cloudflare.yml).
#
# Free-plan retention is ~3 days and queries are capped at ~1 day per call
# (see scripts/lib/cf-analytics.mjs), hence the daily cadence.

on:
  schedule:
    # Daily 03:50 UTC — 10min after discover-404s-via-cloudflare (03:40),
    # which already reads the same zone's GraphQL analytics; keeping the two
    # CF-analytics reads close together avoids spreading the CF token budget
    # window across the day.
    - cron: '50 3 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours (max ~23.9, free plan)'
        required: false
        type: string
        default: '23'

concurrency:
  group: cf-5xx-monitor
  cancel-in-progress: false

permissions:
  # `write` since 2026-08-05: this job now persists a snapshot to
  # data/cf-5xx-history.jsonl. It used to only file issues and keep nothing, which
  # meant every analysis started from scratch against a dataset whose free-plan
  # retention is ~3 days — see scripts/ci/cf-5xx-snapshot.mjs for why that hurt.
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      - name: Sync Cloudflare 5xx issues to backlog
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_5XX_HOURS: ${{ inputs.hours || '23' }}
        run: node scripts/cf-5xx-issue-sync.mjs

      # Runs even if the issue-sync step above failed: the whole point of the snapshot is an
      # unbroken baseline, and a gap is worse than a duplicate issue. The script is itself
      # proceed-safe (warns and exits 0 on any API fault), so this cannot turn the job red.
      - name: Record classified 5xx snapshot
        if: always()
        env:
          CF_5XX_SNAPSHOT_HOURS: ${{ inputs.hours || '23' }}
        run: node scripts/ci/cf-5xx-snapshot.mjs

      - name: Commit snapshot
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cf-5xx-history.jsonl
          if git diff --cached --quiet; then
            echo "No new snapshot to commit"
            exit 0
          fi
          git commit -m "chore: record Cloudflare 5xx snapshot"

          # NO --regenerate-cmd here, deliberately — cwv-monitor.yml passes one and this is
          # the opposite case. That script rewrites its entry in place keyed by date, so
          # re-running it on a rebase retry is idempotent. This history is APPEND-ONLY: a
          # regenerate would append a SECOND line for the same window and silently double-count
          # the sample. A plain rebase is safe instead, because this workflow is the only
          # writer of the file (daily cron + its own concurrency group), so the rebase only
          # ever replays one new trailing line over someone else's unrelated commit.
          bash scripts/lib/git-push-with-retry.sh
