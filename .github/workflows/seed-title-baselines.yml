name: Seed title-length + title-no-disambig-hash + h1-title-duplicates baselines

# One-shot helper workflow: regenerates the three title-related audit
# baselines against the latest deployed dist/ (downloaded from the
# most recent `github-pages` artifact) and uploads the small JSON outputs
# as artifacts.
#
# Why this exists
# ---------------
# `audit-title-length`, `audit-title-no-disambig-hash` and
# `audit-h1-title-duplicates` all migrated to the mix-adjusted rate
# ratchet (per-feature offender RATE vs a `mode:'rate'` baseline, not a
# flat count) — see `scripts/lib/mixAdjustedRateGate.mjs`. Their
# committed baselines are still the legacy flat-count shape (supported
# for backward compat but inert re: the new rate logic) until reseeded
# once against a real production dist/. After this seed, baselines are
# updated manually via `npm run audit:title-length:rebaseline`,
# `npm run audit:title-no-disambig-hash:rebaseline` and
# `npm run audit:h1-title-duplicates:rebaseline` whenever a deploy
# deliberately lowers an offender rate.
#
# Mirrors `seed-bfs-depth-baseline.yml` exactly — same flow, three
# baselines instead of one.
#
# Full-dist rehydrate (sibling fix for issue #3104, mirrors
# seed-text-html-ratio-baseline.yml's fix)
# -----------------------------------------------------------------------
# The `github-pages` artifact downloaded below is the IT-only monolith: once
# LOCALE_SHARDS_LIVE is on, `en`/`de`/`fr` (and, once TICINO_SHARD_LIVE is on,
# the Ticino per-locale subtrees) are stripped from it and published to
# separate `frontaliere-<locale>` / `frontaliere-ticino-<locale>` shard repos
# instead. Scanning the artifact alone would silently undercount ~77% of the
# site's HTML files, so the "Rehydrate locale/Ticino shards" steps below
# reuse the identical rehydrate logic `post-deploy-validate-dist.yml` runs
# for every deploy (same artifact names, same git-clone fallback) so this
# workflow always scans the COMPLETE logical site before seeding the ratchet
# baselines — otherwise the committed baseline would silently drop coverage
# for those locales (forbidden by AGENTS.md: never lower a validation gate).
#
# Usage
# -----
# 1. Trigger via "Run workflow" in the GitHub UI (workflow_dispatch).
# 2. Download the `title-baselines-${{ github.run_id }}` artifact.
# 3. Replace the three baselines, commit, push:
#       cp /tmp/title-length-baseline.json data/
#       cp /tmp/title-no-disambig-hash-baseline.json data/
#       cp /tmp/h1-title-duplicates-baseline.json data/
#       git add data/title-length-baseline.json data/title-no-disambig-hash-baseline.json data/h1-title-duplicates-baseline.json
#       git commit -m "chore(seo-gate): tighten title baselines from prod dist"
#       git push

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    # Was 60, bumped to 150 (this exact timeout hit run 28751237762 at
    # 60m13s, mid title-no-disambig-hash scan). Bumped again to 280 after
    # run 29903886249 hit the 150min ceiling at the SAME step (corpus grew
    # to ~3.36M pages, ~20% over the ~2.8M this file's 150min estimate was
    # based on): measured ~47min setup+rehydrate + ~65min for the
    # title-length scan alone before the step-2 scan got cut off mid-run.
    # 280 assumes ~47min setup + ~75min/scan × 3 ≈ 272min, with headroom.
    timeout-minutes: 280
    # Same walker family as the audits in post-deploy-validate-dist.yml, which
    # runs audit-title-length / audit-title-no-disambig-hash /
    # audit-h1-title-duplicates inside `npm run audit:all` at 4096. Mirror that
    # here so a manual reseed on a complete dist can't die on the default heap
    # (issue #4857).
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      # Reclaim disk before rehydrating the full multi-locale dist (~27 GB
      # once all locale/Ticino shards are restored, per
      # post-deploy-validate-dist.yml's own "Free disk space on runner" step,
      # mirrored verbatim here for the same reason).
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Find latest successful deploy
        id: latest
        run: |
          run_id=$(gh run list \
            --workflow=deploy.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "Latest successful deploy: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch github-pages artifact
        id: pages
        uses: ./.github/actions/fetch-pages-artifact
        with:
          run-id: ${{ steps.latest.outputs.run_id }}
          output-dir: /tmp/pages
          github-token: ${{ github.token }}

      - name: Extract dist/
        run: |
          set -e
          mkdir -p dist
          tar -xf "${{ steps.pages.outputs.tar-path }}" -C dist
          echo "dist/ tree (top level):"
          ls dist/ | head
          echo ""
          echo "Total HTML files:"
          find dist -name '*.html' | wc -l

      # Rehydrate stripped en/de/fr locale subtrees so dist/ is the COMPLETE
      # logical site before the audit runs — otherwise the baselines below
      # would silently drop ratchet coverage for 3 of 4 locales (issue
      # #3104). Body now shared via scripts/lib/rehydrate-locale-shards.sh
      # (extracted issue #4828, AGENTS.md #6 — this step, the other 3
      # seed-*-baseline.yml siblings, and post-deploy-validate-dist.yml's
      # 3 jobs all inlined this exact loop before the extraction).
      - name: Rehydrate locale shards into dist/ (when sharding active)
        if: ${{ vars.LOCALE_SHARDS_LIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.latest.outputs.run_id }}
          LOCALE_SHARDS_LIVE: ${{ vars.LOCALE_SHARDS_LIVE }}
        run: bash scripts/lib/rehydrate-locale-shards.sh

      # Mirrors the locale rehydrate above for the carved-out canton-section
      # shards (all 27 sections — 22 cantons + ticino/svizzera/zurigo + the 2
      # article hubs). Slug map + fast-path/clone-fallback pattern mirrored
      # from post-deploy-validate-dist.yml's rehydrate_section().
      - name: Rehydrate section shards into dist/ (when active)
        if: ${{ vars.TICINO_SHARD_LIVE == 'true' || vars.SVIZZERA_SHARD_LIVE == 'true' || vars.ZURIGO_SHARD_LIVE == 'true' || vars.ARGOVIA_SHARD_LIVE == 'true' || vars.APPENZELLO_SHARD_LIVE == 'true' || vars.BASILEA_SHARD_LIVE == 'true' || vars.BERNA_SHARD_LIVE == 'true' || vars.FRIBURGO_SHARD_LIVE == 'true' || vars.GINEVRA_SHARD_LIVE == 'true' || vars.GLARONA_SHARD_LIVE == 'true' || vars.GRIGIONI_SHARD_LIVE == 'true' || vars.GIURA_SHARD_LIVE == 'true' || vars.LUCERNA_SHARD_LIVE == 'true' || vars.NEUCHATEL_SHARD_LIVE == 'true' || vars.NIDVALDO_SHARD_LIVE == 'true' || vars.OBVALDO_SHARD_LIVE == 'true' || vars.SCIAFFUSA_SHARD_LIVE == 'true' || vars.SOLETTA_SHARD_LIVE == 'true' || vars.SVITTO_SHARD_LIVE == 'true' || vars.TURGOVIA_SHARD_LIVE == 'true' || vars.URI_SHARD_LIVE == 'true' || vars.VAUD_SHARD_LIVE == 'true' || vars.VALLESE_SHARD_LIVE == 'true' || vars.ZUGO_SHARD_LIVE == 'true' || vars.SANGALLO_SHARD_LIVE == 'true' || vars.ARTICOLIFRONTALIERE_SHARD_LIVE == 'true' || vars.ARTICOLISVIZZERA_SHARD_LIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.latest.outputs.run_id }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: bash scripts/lib/rehydrate-section-shards.sh

      - name: Report full rehydrated dist/ size
        run: |
          echo "Full dist/ after rehydrate: $(find dist -type f | wc -l) files; HTML: $(find dist -name '*.html' | wc -l)"
          df -h / | tail -1

      # A baseline is worse than an audit to get wrong: the section rehydrate
      # above is soft-fail by contract, and pages missing from dist/ drop out
      # of the seeded title/H1 counts — locking in numbers the next comparison
      # treats as the accepted norm. Refuse to seed from a partial dist
      # (issue #4857).
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs

      - name: Generate title-length baseline
        run: |
          node scripts/audit-title-length.mjs \
            --threshold=66 \
            --write-baseline=data/title-length-baseline.json
          echo ""
          echo "==== title-length baseline preview ===="
          head -30 data/title-length-baseline.json

      - name: Generate title-no-disambig-hash baseline
        run: |
          node scripts/audit-title-no-disambig-hash.mjs \
            --write-baseline=data/title-no-disambig-hash-baseline.json
          echo ""
          echo "==== title-no-disambig-hash baseline preview ===="
          head -30 data/title-no-disambig-hash-baseline.json

      - name: Generate h1-title-duplicates baseline
        run: |
          node scripts/audit-h1-title-duplicates.mjs \
            --write-baseline=data/h1-title-duplicates-baseline.json
          echo ""
          echo "==== h1-title-duplicates baseline preview ===="
          head -30 data/h1-title-duplicates-baseline.json

      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: title-baselines-${{ github.run_id }}
          path: |
            data/title-length-baseline.json
            data/title-no-disambig-hash-baseline.json
            data/h1-title-duplicates-baseline.json
          retention-days: 14
          if-no-files-found: error

      - name: Echo download instructions
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "Baselines generated. Next steps:"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "1. Download the artifact:"
          echo "   gh run download ${{ github.run_id }} \\"
          echo "     --name title-baselines-${{ github.run_id }} \\"
          echo "     --dir /tmp/"
          echo ""
          echo "2. Replace and commit:"
          echo "   cp /tmp/title-length-baseline.json data/"
          echo "   cp /tmp/title-no-disambig-hash-baseline.json data/"
          echo "   cp /tmp/h1-title-duplicates-baseline.json data/"
          echo "   git add data/title-length-baseline.json data/title-no-disambig-hash-baseline.json data/h1-title-duplicates-baseline.json"
          echo "   git commit -m \"chore(seo-gate): tighten title baselines from prod dist\""
          echo "   git push"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
