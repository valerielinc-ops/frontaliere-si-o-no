name: sync-pharmacy-duties-italy

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pharmacy-duties-italy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for the Italy duty writer"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Import official Italian duty calendars
        run: node scripts/import-pharmacy-duties-italy.mjs
      - name: Validate Italian duty release
        run: node scripts/check-pharmacy-duties-italy.mjs
      - name: Commit Italian duty snapshots
        run: |
          set -euo pipefail
          if git diff --quiet -- data/pharmacy-duties-italy.json data/pharmacy-duties-italy-status.json; then
            echo "No Italian pharmacy duty changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pharmacy-duties-italy.json data/pharmacy-duties-italy-status.json
          git commit -m "chore(data): refresh Italian pharmacy duty release"
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd '
              node scripts/import-pharmacy-duties-italy.mjs
              node scripts/check-pharmacy-duties-italy.mjs
              git add data/pharmacy-duties-italy.json data/pharmacy-duties-italy-status.json
            '
