name: Refresh Border-Wait Ranking Digest (weekly)

# Evergreen "best/worst dogane" wait-time ranking article (F8 chain, issue
# #2963 pattern reused for border wait times). The article
# (`classifica-dogane-ticino`) is registered ONCE — this workflow only
# refreshes its body files + the compact ranking JSON consumed by the live
# chart (InlineBorderWaitRanking), from the traffic history already
# collected every 15 min by traffic-scheduler.yml. Never floods the repo
# with new articles.

on:
      # ── CUTOVER (issue #4974 item 3, §5.7) ──────────────────────────────
      # Disabled here because this producer now runs in
      # nanakokyobashi-rgb/frontaliere-articles, which owns the corpus. Leaving
      # both enabled would give the same files two writers and the last push
      # would win — the exact failure the migration exists to remove.
      #
      # workflow_dispatch is deliberately KEPT so this can still be run by hand
      # during the observation window if the nanako side needs to be compared
      # against it. Re-enabling means deleting these comment markers; it is not
      # a code change, which is what makes the rollback cheap.
  # schedule:  # DISABLED AT CUTOVER — see above
  # # Weekly, Monday 04:50 UTC — off-peak minute slot (avoids jobs :05-:55,
  # # articles :22, article-gen :07/:37, weather :23, events :40, fuel :37).
  # - cron: '50 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled with human approval.'
        required: false
        default: true
        type: boolean
      human_approval:
        description: 'Explicit human approval for ranking-content publication side effects.'
        required: false
        default: false
        type: boolean

concurrency:
  group: border-wait-ranking-digest
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Require human approval for ranking-content side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: generate-border-wait-ranking-weekly
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Prepare Firebase credentials for push auth
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Refresh ranking digest article body + snapshot JSON
        id: refresh
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: npx --no-install tsx scripts/generate-border-wait-ranking-article.mjs

      - name: Gate — refreshed body files must keep the suite green
        id: gate
        run: npx vitest run tests/border-wait-ranking.test.ts tests/border-wait-ranking-content.test.ts tests/blog-body-typescript-syntax.test.ts

      - name: Commit + push (with rebase-retry)
        id: commit
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git-add-resolved: services/locales/blog-body is a symlink into
          # packages/articles/content, and `git add` on a path THROUGH it aborts
          # with "pathspec is beyond a symbolic link" — under `set -e` that would
          # take the ranking JSON down with it.
          node scripts/lib/git-add-resolved.mjs public/data/border-wait-ranking.json \
            services/locales/blog-body/it/classifica-dogane-ticino.ts \
            services/locales/blog-body/en/classifica-dogane-ticino.ts \
            services/locales/blog-body/de/classifica-dogane-ticino.ts \
            services/locales/blog-body/fr/classifica-dogane-ticino.ts
          if git diff --cached --quiet; then
            echo "No ranking digest changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🛂 Weekly border-wait ranking digest refresh"
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "npx --no-install tsx scripts/generate-border-wait-ranking-article.mjs && node scripts/lib/git-add-resolved.mjs public/data/border-wait-ranking.json services/locales/blog-body/it/classifica-dogane-ticino.ts services/locales/blog-body/en/classifica-dogane-ticino.ts services/locales/blog-body/de/classifica-dogane-ticino.ts services/locales/blog-body/fr/classifica-dogane-ticino.ts"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: bash scripts/lib/trigger-deploy.sh || true

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
