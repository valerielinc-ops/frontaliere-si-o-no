name: Send Saved Jobs Digest

on:
  schedule:
    # Weekly Monday 07:33 UTC — clear of the existing daily 00:33/03:33 slots
    # and the existing Monday-specific slots at 02:35/04:00/04:21/05:00/06:00.
    # :33 avoids the :00/:15/:30/:45 minute marks GitHub Actions cron
    # deprioritizes under load (same rationale as send-job-alerts.yml, #3798).
    - cron: '33 7 * * 1'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Limit send to a single email (test mode). Empty = send to all users with saved jobs.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build the digest but do not send.'
        required: false
        default: true
        type: boolean
concurrency:
  group: saved-jobs-digest
  # A queued retry must observe the same campaign delivery ledger instead of
  # cancelling a run after the provider may already have accepted its email.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write     # for github-issue-creator on failure

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # node_modules in cache (perf-plan email senders, A3/D4): key on the lockfile and
      # the Node major, `npm ci` only on a miss.
      - name: Setup Node.js and restore node_modules
        uses: ./.github/actions/npm-ci-cached

      # Needed by the dry run too: the sender reads users and consent from Firestore
      # (reads only) even with --dry-run.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      # Least privilege (perf-plan email senders, D4): only the keys the job's code
      # reads from `process.env`. Enforced by tests/email-senders-workflow-perimeter.test.ts.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=CF_ACCOUNT_ID,CF_API_TOKEN,CLOUDFLARE_EMAIL_API_TOKEN,JOB_EMAIL_RANKING_AFFINITY_WEIGHT,JOB_EMAIL_RANKING_ENABLED,JOB_EMAIL_RANKING_ROLLOUT,JOB_EMAIL_RANKING_TREATMENT,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,NEWSLETTER_SECRET,RESEND_API_KEY

      # Content-addressed cache of the assembled dataset. The key is printed by
      # the assembler itself (.github/actions/assemble-jobs-cache-key): sha256
      # of every slice, of its local import closure, of the aux data files it
      # reads, of package-lock.json and of the Node major. It is the SAME value
      # the script checks before restoring, so a hit can only replay an output
      # built from byte-identical inputs; no restore-keys fallback. Measured
      # miss cost: 4m41 (run 35422626497).
      #
      # ACTIVE-ONLY, NO SUMMARIES (perf-plan email senders, D1). The digest reads ONE
      # data file, data/jobs.json (loadJobsById): never expired-jobs.json,
      # `previousSlugs` or the crawler summaries. The expired archive and slug
      # reconciliation took 503 s of the assembly on a cache miss. The flags MUST be
      # identical in the key action and in the assemble step, or every run misses the
      # cache (tests/email-senders-assemble-flags.test.ts). The key still hashes the
      # expired slices: the active assembly reads them to carry `firstSeenAt` forward.
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --active-only --no-summaries

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Assemble jobs dataset
        id: assemble
        run: node scripts/assemble-jobs-dataset.mjs --active-only --no-summaries

      - name: Save assemble-jobs cache
        if: steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # Dry run (input dry_run, default true for manual dispatches): builds every
      # digest from production data and prints recipients, subjects and the
      # SAVEDJOBS_METRICS line, claiming and sending nothing (reads only).
      - name: Build saved-jobs digests without sending (dry run)
        if: inputs.dry_run == true || inputs.dry_run == 'true'
        env:
          TARGET_EMAIL: ${{ inputs.target_email }}
        run: |
          node scripts/send-saved-jobs-digest.mjs --dry-run

      - name: Send saved-jobs digest emails
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        id: send-digest
        env:
          TARGET_EMAIL: ${{ inputs.target_email }}
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: |
          node scripts/send-saved-jobs-digest.mjs

      - name: Report failure to GitHub Issues
        if: steps.send-digest.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Saved Jobs Digest invio fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Il rosso del run, DOPO l'apertura della issue: `continue-on-error` sullo
      # step di invio tiene vivo il job perche' il reporter possa girare, non per
      # dichiarare verde un run fallito. `close-recovered-failure-issues.yml`
      # chiude `CI Failure: <workflow>` sulla premessa «ultimo run completato
      # success dopo l'apertura»: con un run verde per costruzione la issue si
      # chiude come recuperata al giro dopo, guasto ancora in piedi. Stesso idiom
      # di `location-quality-audit.yml` (#7379, item 3).
      - name: Fail job if the send step failed
        if: steps.send-digest.outcome == 'failure'
        run: |
          echo "::error::invio del saved-jobs digest fallito — vedi l'issue aperta sopra."
          exit 1
