name: crawler-quarantine-review

# Uscita dal gruppo di quarantena dei crawler (data/crawler-quarantine.json).
#
# Legge le ondate osservate del gruppo di quarantena nel repo che esegue i
# crawler e applica, deterministicamente, le due uscite decise da
# scripts/lib/crawler-quarantine.mjs:
#   - rientro nel gruppo di origine dopo 4 ondate verdi consecutive;
#   - ritiro (con issue «Crawler ritirato: <slug>») dopo 10 ondate rosse
#     consecutive o 7 giorni di fallimento.
# Tiene inoltre aperta la issue di ogni fallimento noto escluso dal verdetto.
# Se una decisione cambia registro o gruppi apre UNA PR (mai due insieme), che
# il ciclo del repo revisiona e mergia su `## LGTM`.
#
# Ogni 6 ore: le ondate partono alle 09:00 e alle 21:00 UTC con ore di ritardo,
# e il gruppo chiude dopo 1-3 ore; una lettura ogni 6 ore vede ogni ondata una
# volta senza inseguirla.

on:
  schedule:
    - cron: '47 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: crawler-quarantine-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Il generatore dei gruppi importa `yaml`.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # La PR tocca `.github/workflows/crawler-group-*.yml`: GitHub rifiuta che
      # GITHUB_TOKEN li scriva, serve il token della App (stesso pattern di
      # prospector-loop.yml).
      - name: Mint App token
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Review the quarantine group
        env:
          # APP_TOKEN solo con contents+pull_requests verificati dal conio
          # (APP_TOKEN_DATA_REFRESH): altrimenti vale vuoto e lo script ricade
          # sul suo fallback. Lint: tests/workflow-app-token-capability.test.ts.
          APP_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || '' }}
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'frontaliere-automation[bot]'
          git config user.email '296434481+frontaliere-automation[bot]@users.noreply.github.com'
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::warning::App token non disponibile: decisioni calcolate e stampate, nessuna PR (i gruppi di workflow non si possono pushare con GITHUB_TOKEN)."
            node scripts/crawler-quarantine-review.mjs
            exit 0
          fi
          # actions/checkout scrive un extraheader con GITHUB_TOKEN che ha la
          # precedenza sull'URL: senza toglierlo il push torna al token sbagliato.
          # Da checkout v6 (qui v7) l'header sta in un file incluso via
          # `includeIf.gitdir:…`, invisibile a `git config --unset-all`: lo helper
          # toglie entrambe le forme e fallisce se ne resta una.
          bash scripts/lib/clear-checkout-git-credentials.sh
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/crawler-quarantine-review.mjs --open-pr
