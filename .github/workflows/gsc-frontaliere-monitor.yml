name: GSC Frontaliere Brand Monitor

# Cathedral Phase 3 / T3.2 — Brand dilution monitor (Decision D11).
# Pulls top-20 GSC queries containing "frontalier" over the last 14 days for
# `sc-domain:frontaliereticino.ch`, compares ranks against the committed
# baseline, and opens a GitHub issue if any tracked query slips ≥3 positions.

on:
  schedule:
    # Weekly: Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Overwrite data/gsc-frontaliere-baseline.json with current GSC snapshot (use after a deliberate brand pivot — never as a workaround for drift).'
        required: false
        default: false
        type: boolean

concurrency:
  group: gsc-frontaliere-monitor
  cancel-in-progress: true

permissions:
  contents: write       # commit baseline updates when triggered with update_baseline=true
  issues: write         # open brand-drift issue on non-zero exit

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No npm install — script is dependency-free (only node:fs/path/crypto + fetch).

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT_JSON secret — monitor will gracefully skip and exit 0"
          fi

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Run brand dilution monitor
        id: monitor
        continue-on-error: true
        run: |
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            node scripts/check-gsc-frontaliere-baseline.mjs --update-baseline
          else
            node scripts/check-gsc-frontaliere-baseline.mjs
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # Note: with set -e off (default for run blocks without explicit shell flags
        # the way GitHub configures bash, this still captures the exit). We use
        # continue-on-error: true so the issue-opening step always runs.

      - name: Capture monitor exit code
        id: status
        run: |
          # `monitor` step exit code is exposed via outcome (success|failure)
          if [ "${{ steps.monitor.outcome }}" = "success" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload monitor report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-frontaliere-monitor-report
          path: data/gsc-frontaliere-monitor-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit updated baseline
        if: ${{ inputs.update_baseline == true && steps.status.outputs.drift == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsc-frontaliere-baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(gsc): refresh frontaliere brand baseline ($(date -u +%Y-%m-%d))"
          # Retry-on-rebase: many scheduled workflows push to main concurrently
          # (crawlers, fuel, weather, thin-promotions, etc.); a non-fast-forward
          # push is the expected failure mode, NOT a code bug. Mirror the
          # rebase loop already used by crawler-health-monitor.yml,
          # refresh-thin-promotions.yml, and deploy.yml's dist-history step.
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          bash scripts/lib/configure-main-push-auth.sh
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed gsc baseline refresh."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
            if ! git rebase origin/main; then
              echo "⚠️ Rebase conflict on data/gsc-frontaliere-baseline.json — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving baseline uncommitted."
          exit 1

      - name: Open brand drift issue
        if: ${{ steps.status.outputs.drift == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stable title (ISSUES.md dedup a monte): the run date used to be
          # interpolated here, so a drift that persisted week after week opened a
          # brand-new issue every week for the same condition. The date belongs
          # in the body — `github-issue-creator.mjs` comments each recurrence on
          # the canonical issue, which is what makes the persistence visible.
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[GSC] Brand dilution alert on tracked frontaliere queries"
          BODY_FILE=$(mktemp)
          {
            echo "Weekly GSC frontaliere brand monitor detected at least one tracked query slipping ≥3 positions in average rank."
            echo
            echo "**Detected on:** ${DATE}"
            echo
            echo "**Property:** \`sc-domain:frontaliereticino.ch\`"
            echo "**Lookback:** 14 days"
            echo "**Threshold:** ≥3 positions"
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Monitor report"
            echo
            echo '```json'
            if [ -f data/gsc-frontaliere-monitor-report.json ]; then
              cat data/gsc-frontaliere-monitor-report.json
            else
              echo '{"_error":"report not generated"}'
            fi
            echo '```'
            echo
            echo "## Next steps"
            echo
            echo "1. Investigate whether the drift is a real brand-erosion signal (competitor outranking us, content removed, internal-link loss) or a benign GSC sampling artifact."
            echo "2. If real, fix the root cause (NEVER set the page to noindex without explicit per-URL approval — see CLAUDE.md non-negotiable #5 + memory \`feedback_never_noindex_without_approval.md\`)."
            echo "3. After remediation, re-run with \`update_baseline: true\` from the workflow_dispatch input to refresh the baseline. Do NOT widen the threshold."
          } > "$BODY_FILE"

          node scripts/lib/github-issue-creator.mjs \
            --title "$TITLE" \
            --description "$(cat "$BODY_FILE")" \
            --priority 2 \
            --label seo \
            --label monitoring \
            --label brand-drift \
            --workflow "${{ github.workflow }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Fail if drift detected
        id: failgate
        if: ${{ steps.status.outputs.drift == 'true' }}
        run: |
          echo "::error::Brand drift detected — see opened issue and uploaded artifact."
          exit 1

      - name: Report unexpected failure to GitHub Issues
        if: failure() && steps.failgate.conclusion != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito (crash pre/fuori detection)
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}
          Nota: il monitor è fallito prima/fuori dallo step di detection — nessuna issue di condizione è stata aperta." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
