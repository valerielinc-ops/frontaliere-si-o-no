name: location-quality-audit

# Weekly deterministic check of crawled job location quality
# (scripts/audit-job-locations.mjs): how many jobs have a canton that
# mismatches the BFS-inferred canton, how many have a city that matches no
# canonical Swiss location ("custom" value — the bug class behind the
# reported Hirslanden Bern instances), how many silently fall back to
# their company's own most-common ("default") canton, and how many ship a
# canton that contradicts what the crawler recorded in
# data/jobs/by-crawler/ (BFS-independent — the only signal that catches a
# mislabelled hamlet like Obbürgen/NW, #4838). Opens/updates ONE
# stable-title tracking issue every run with the numeric snapshot so the
# trend is visible over time. This is NOT a deploy gate — report-only, same
# shape as audit-404-risk.yml. Zero-Claude (deterministic script + node/gh
# issue creation).
#
# LAYER 5 (2026-08-19) — location FORMAT, not location TRUTH. The four original
# layers all adjudicate WHICH PLACE a job is in; none of them asks whether the
# location string is well-formed. "Lengnau (BE)" stamped BE is correct by every
# one of them, and the live job page rendered it "Lengnau (BE) (BE)" — 2,457 of
# 27,590 jobs (8.91%) printed a doubled or empty parenthetical.
# `scripts/lib/job-location-display.mjs` removes the duplication at RENDER time
# on every surface, so the three rows layer 5 adds are about the DATA, which
# only the crawler can fix:
#   · redundant marker      — informational: the render fix already hides it.
#   · canton CONFLICT       — a bug: the location and the field name different
#                             cantons, so one of the two is factually wrong.
#   · description duplicated — a bug: the string is frozen into the indexed
#                             description at crawl time, where no render fix
#                             reaches it.
# The per-crawler table names `scripts/lib/<crawler>-job-parser.mjs` outright so
# the queued fixer has the file to edit without re-deriving it.
#
# ROUTING is deliberately left on the queue, unchanged: `priority:medium` plus
# the labels below classify as `other` in scripts/lib/classify-issue.mjs =>
# `route: queue` => `agent:fix-queued`, drained one at a time by
# followup-drainer. The immediate `agent:fix` bypass is reserved for category
# `crawler` (production-critical, low volume) and this weekly snapshot is
# neither — the same call job-title-locale-audit.yml documents.
#
# CLOSURE is UNCHANGED and deliberately not a `--resolve` twin. This workflow
# posts the numeric snapshot on the canonical issue EVERY run — that comment
# thread IS the trend line the header above promises — and signals health by
# dropping to `priority:low` instead of closing. That is not the
# alert-pat-down.mjs failure mode (an alert naming a closer that did not exist):
# the issue is reachable, deduped by title, and its priority moves. Adding a
# closer here would delete the trend history, so layer 5 only adds rows to the
# existing `hasRealBugs` condition.

on:
  schedule:
    - cron: '10 9 * * 3' # Wednesdays 09:10 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: location-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # data/jobs.json is gitignored (build artifact). Assemble it from the
      # committed per-crawler slices so the audit sees every real crawler,
      # not just whatever happens to be checked in.
      - name: Assemble jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Run location quality audit
        id: audit
        continue-on-error: true
        run: npm run audit:job-locations

      - name: Upload full report (per-job detail)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: location-audit-report
          path: data/location-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open / update issue with numeric snapshot
        if: steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r

          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('data/location-audit-report.json', 'utf8'));
          const s = r.summary;
          const pct = (n) => (r.audited > 0 ? ((n / r.audited) * 100).toFixed(2) : '0.00');
          const rewritten = s.crawlerLocationRewritten || 0;
          const stampDiffers = s.crawlerCantonStampDiffers || 0;
          // A published LOCALITY that contradicts the crawler's own record is a
          // wrong location by construction — no municipality database has to
          // adjudicate it — so it belongs with the two never-acceptable
          // categories rather than in the informational rows (#4838: the BFS-only
          // signal reported 0 problems while 28/39 Bürgenstock jobs shipped TI).
          //
          // The canton STAMP difference is deliberately not a bug signal (#5136):
          // dedicated crawlers write the employer's home canton on every posting,
          // so "crawler said BS, we published ZH" is usually just the crawler's
          // constant being stale. Alarming on it buried the real rewrites under
          // ~775 false positives.
          // Layer 5. `redundant` is deliberately NOT a bug signal: the render fix in
          // scripts/lib/job-location-display.mjs already stops it reaching a reader,
          // so alarming on 2,457 rows would bury the two that still hurt. `conflict`
          // and `descDup` do: the first means one of location/canton is factually
          // wrong, the second is frozen into indexed description text where no
          // render-time fix can reach it.
          const redundant = s.redundantLocationMarker || 0;
          const conflict = s.locationCantonConflict || 0;
          const descDup = s.descriptionCantonDuplicated || 0;
          // Layer 6. A bug, not a formatting nit: the field holds page furniture
          // ("0200 Deutsch Suche Suche Masterdata Specialist"), a street address
          // or a marketing sentence, so the page names a place that does not
          // exist. Separated from `customLocation` on purpose — that bucket
          // conflates a hamlet BFS does not list with text that was never a
          // place, which is why it could never name an offender.
          const implausible = s.implausibleLocation || 0;
          const byCrawler = r.locationFormatByCrawler || [];

          const hasRealBugs = s.cantonMismatch > 0 || s.foreignInSwiss > 0 || rewritten > 0
            || conflict > 0 || descDup > 0 || implausible > 0;

          let md = `## Location data quality snapshot\n\n`;
          md += `Audited ${r.audited} / ${r.totalJobs} jobs (geocoding ${r.geocodingEnabled ? 'ON' : 'OFF'}).\n\n`;
          md += `| Metric | Count | % of audited |\n|---|---:|---:|\n`;
          md += `| ✅ Correct (BFS-confirmed) | ${s.correct} | ${pct(s.correct)}% |\n`;
          md += `| ⚠️ Canton mismatch (BFS disagrees with stored canton) | ${s.cantonMismatch} | ${pct(s.cantonMismatch)}% |\n`;
          md += `| 🚨 Foreign city tagged as Swiss canton | ${s.foreignInSwiss} | ${pct(s.foreignInSwiss)}% |\n`;
          md += `| 📌 Published locality contradicts the crawler record | ${rewritten} | ${pct(rewritten)}% |\n`;
          md += `| ❓ Custom/unknown location (matches no canonical Swiss location) | ${s.customLocation} | ${pct(s.customLocation)}% |\n`;
          md += `| 🏢 Suspected company-default fallback | ${s.companyDefaultFallback} | ${pct(s.companyDefaultFallback)}% |\n`;
          md += `| 📭 Empty location | ${s.emptyLocation} | ${pct(s.emptyLocation)}% |\n`;
          md += `| 🔤 Lowercase canton (stored) | ${s.lowercaseCanton} | ${pct(s.lowercaseCanton)}% |\n`;
          md += `| ℹ️ Crawler canton stamp differs (same place — context, not a bug) | ${stampDiffers} | ${pct(stampDiffers)}% |\n`;
          md += `| 🔁 Location already names its canton/country (render fix hides it) | ${redundant} | ${pct(redundant)}% |\n`;
          md += `| ❗ Location names a DIFFERENT canton than the field | ${conflict} | ${pct(conflict)}% |\n`;
          md += `| 📝 Description text repeats the canton (frozen at crawl time) | ${descDup} | ${pct(descDup)}% |\n`;
          md += `| 🧩 Location cannot be a place name (scraper leak) | ${implausible} | ${pct(implausible)}% |\n\n`;
          md += hasRealBugs
            ? `🚨 **Canton mismatch, foreign-tagged-as-Swiss and/or published-locality-rewritten are non-zero** — these are the three categories the dataset must never produce (location must always resolve to a real Swiss canton, and the published locality must never contradict the crawler's own record). Check the full report artifact for offending companies/cities.\n\n`
            : `No canton-mismatch / foreign-tagged-as-Swiss / locality-rewritten bugs this run.\n\n`;
          md += `_\`📌 Published locality contradicts the crawler record\` is BFS-independent, which is exactly why it matters: it catches jobs moved onto a city that IS a real BFS municipality, so every BFS-backed row above signs them off as correct. The destination is usually an everyday word that happens to name a village — "Alle" (JU) is German for "all" — so start from the "Rewritten INTO" table in the artifact and add repeat offenders to \`TEXT_RESCUE_AMBIGUOUS_TOKENS\`. ${r.crawlerRecordsIndexed || 0} crawler records indexed this run._\n\n`;
          if (byCrawler.length) {
            // BY CRAWLER, not by company: the repair is an edit to exactly one
            // scripts/lib/<crawler>-job-parser.mjs, and the crawler key IS that
            // filename. A company leaderboard would name Coop a thousand times
            // and still never say which file to open.
            md += `### Location format, by crawler\n\n`;
            md += `| crawler | file to edit | ❗ conflict | 📝 description | 🧩 not a place | 🔁 redundant |\n|---|---|---:|---:|---:|---:|\n`;
            for (const row of byCrawler.slice(0, 15)) {
              // `parserFile` is RESOLVED by the audit, by searching the sources
              // for the crawler key — it is not derived from the key. The naming
              // convention holds for a minority: `rado` is crawled by
              // `scripts/update-swatchgroup-jobs.mjs`, `convit-holding` by
              // `update-convit-jobs.mjs`. A guessed path that does not exist is
              // worse than none, because it reads as an answer.
              const file = row.parserFile ? `\`${row.parserFile}\`` : '_non risolto — grep del companyKey_';
              md += `| \`${row.crawler}\` | ${file} | ${row.conflict} | ${row.descriptionDuplicated} | ${row.implausible} | ${row.redundant} |\n`;
            }
            if (byCrawler.length > 15) {
              md += `\n_${byCrawler.length - 15} further crawlers omitted — the full list is in the artifact._\n`;
            }
            md += `\n### How to repair each column\n\n`;
            md += `- **❗ conflict** — the location names one canton and \`job.canton\` another (e.g. \`"Reinach (AG)"\` stamped \`BL\`; both Reinachs exist). One half is wrong. Decide from the employer's own posting, then fix whichever the crawler derives incorrectly. The page currently prints the location verbatim and appends NO canton, so a reader sees one place, not a contradiction.\n`;
            md += `- **📝 description** — the crawler wrote the canton into description prose right after a location that already carried it (\`"Konolfingen, CH, Kanton BE"\`). Strip the marker from the location ONCE where the crawler assigns it — see the \`splitJobLocation()\` call in \`scripts/lib/nestle-job-parser.mjs\`, which fixes the stored field, the description and the page together.\n`;
            md += `- **🧩 not a place** — the crawler stored something that cannot be a municipality name: page furniture (\`"0200 Deutsch Suche Suche Masterdata Specialist"\`), a street address, a marketing sentence (\`"2050 and has the highest-possible ESG rating from MSCI"\`). The page then names a place that does not exist. Fix the selector that reads the location in the file named above. Checked against the 2,294 municipalities in \`data/canton-municipalities.json\`, none of which reaches five words.\n`;
            md += `- **🔁 redundant** — informational. \`formatJobLocation()\` already removes it on every surface; listed so a crawler that starts emitting a NEW marker shape is visible before it turns into one of the two rows above.\n\n`;
            md += `Offenders with the literal values are under \`redundantLocationMarker\`, \`locationCantonConflict\` and \`descriptionCantonDuplicated\` in the artifact.\n\n`;
            md += `### Reproduce\n\n\`\`\`bash\nnode scripts/assemble-jobs-dataset.mjs\nnpm run audit:job-locations\n\`\`\`\n\n`;
            md += `**Formatter:** \`scripts/lib/job-location-display.mjs\` · **Gate:** \`tests/job-location-display.test.ts\`\n\n`;
          }
          md += `**Run:** ${process.env.RUN_URL}\n`;
          md += `Full per-job detail: \`location-audit-report\` workflow artifact (30-day retention).\n`;
          md += `Script: \`scripts/audit-job-locations.mjs\`\n`;
          writeFileSync('/tmp/r/desc.md', md);
          writeFileSync('/tmp/r/has-bugs', hasRealBugs ? '1' : '0');
          NODE

          if [ "$(cat /tmp/r/has-bugs)" = "1" ]; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Location data quality: weekly snapshot" \
              --description "$(cat /tmp/r/desc.md)" \
              --priority 3 \
              --label crawler-data-quality \
              --label bug \
              --workflow "${{ github.workflow }}"
          else
            node scripts/lib/github-issue-creator.mjs \
              --title "Location data quality: weekly snapshot" \
              --description "$(cat /tmp/r/desc.md)" \
              --priority 4 \
              --label crawler-data-quality \
              --workflow "${{ github.workflow }}"
          fi

      - name: Report audit crash to GitHub Issues
        if: steps.audit.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Location quality audit crashed
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Il job \`scripts/audit-job-locations.mjs\` è uscito con errore — nessuno snapshot numerico prodotto questo run. Verifica \`data/jobs.json\` assemblato correttamente e il log del job." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Fail job if audit crashed
        if: steps.audit.outcome != 'success'
        run: |
          echo "::error::location quality audit crashed — see issue opened above."
          exit 1
