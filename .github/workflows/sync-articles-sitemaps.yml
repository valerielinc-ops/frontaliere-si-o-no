name: Sync article sitemaps, feeds and ticker from the articles API

# The article data surface is produced by the repository that owns the corpus
# (nanakokyobashi-rgb/frontaliere-articles) and consumed here. This workflow is
# the consumption: it pulls the published files into public/ and commits them
# when they actually changed.
#
# Thirteen files since #4974 item 2 — the two sitemaps, the ten RSS feeds and
# the news-ticker payload. The filename still says "sitemaps" because renaming
# it would orphan this workflow's run history for no functional gain; the
# publisher's repository_dispatch keys on the event type, not on this name.
#
# repository_dispatch is the primary trigger, and it is the right shape: the
# publisher knows when it has published, so the push is the event. The schedule
# is only a safety net for a dispatch that never arrives (token rotated, API
# outage) — it is not the mechanism.
#
# scripts/pull-articles-api.mjs refuses rather than degrades: it validates the
# manifest, both sitemaps (gating on hreflang alternate counts as well as url
# counts), every feed's item count, and every locale title/slug in the ticker
# payload — then exits non-zero having written nothing if anything looks wrong.
# So a bad publish leaves the committed copy serving instead of overwriting it.
#
# THE TWO PULLS ARE ONE OPERATION (issue #5298). They read from two sources with
# different freshness — the corpus repo's git history, and the API built from an
# earlier state of it — and they commit into a single commit. Both are therefore
# pinned to `manifest.json`'s `commit`, and if they cannot agree on it the whole
# run is SKIPPED rather than half-committed. Rationale and failure history:
# scripts/lib/articles-sync-pin.mjs. This is the fix at the WRITER; the transit
# tolerance in tests/blog-slugs-sitemap-sync.test.ts was the earlier mitigation
# at the reader, and with the window closed here it has nothing left to excuse.

on:
  repository_dispatch:
    types: [articles-published]
  schedule:
    # Twice a day, offset off the hour to stay clear of the deploy cron.
    - cron: '23 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: sync-articles-sitemaps
  cancel-in-progress: false

permissions:
  contents: write
  # A skipped sync exits 0 by design (nothing was written; the previous commit is
  # still consistent). That makes a mirror stuck for good invisible on a wall of
  # green runs, so N consecutive skips open an issue — see the escalation step.
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The corpus, not just the published surface. pull-articles-api.mjs brings
      # in the sitemaps, feeds and ticker — everything a MACHINE reads — and
      # that is why every post-cutover article was in sitemap-blog.xml and the
      # RSS while the site's own hub still showed 2026-07-29 as its newest
      # entry. The reader-facing lists are rendered from the SPA bundle, which
      # is built from packages/articles/content/, and nothing had refreshed
      # that since mirror-articles-corpus.yml last ran on the cutover day.
      #
      # The published API cannot substitute: articles.json carries no title
      # (§7.1), and a list needs titles.
      #
      # A pull, never a push — nanako owns the corpus. See the script header.
      #
      # Runs FIRST because it is the step that resolves the pin: it reads
      # `manifest.json`, checks the corpus out at the commit named there rather
      # than at `main`, and exports it as ARTICLES_SYNC_COMMIT for the next step.
      - name: Pull the article corpus
        id: pull-corpus
        run: node scripts/pull-articles-corpus.mjs

      # Skipped outright when the corpus pull already gave up: its sitemaps would
      # be committed next to a registry from a different upstream state, which is
      # the pair this whole mechanism exists to never produce.
      - name: Pull published sitemaps
        id: pull-api
        if: steps.pull-corpus.outputs.skipped != 'true'
        run: node scripts/pull-articles-api.mjs

      # One place to ask "may this run write?", so a future step cannot forget
      # half of the condition. Read via env rather than interpolated into the
      # script body — the values are ours, but the habit is not negotiable.
      - name: Decide whether this run may commit
        id: gate
        env:
          CORPUS_SKIPPED: ${{ steps.pull-corpus.outputs.skipped }}
          API_SKIPPED: ${{ steps.pull-api.outputs.skipped }}
        run: |
          set -euo pipefail
          if [ "${CORPUS_SKIPPED:-}" = "true" ] || [ "${API_SKIPPED:-}" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "This sync was skipped; nothing will be committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── A skipped sync is green, so something has to make a STUCK one loud ──
      #
      # Each script already emits `::warning::` with its reason, which covers the
      # single skip: somebody reading that run sees it. Nobody reads green runs,
      # though, so the case that actually needs catching is the mirror that never
      # comes back — and a warning per run is indistinguishable from a warning
      # that has been there for a week.
      #
      # THRESHOLD 3, and it is a real choice, not a default:
      #   - A skip is not the routine outcome of a race. The API is BUILT from the
      #     commit it names, so that commit exists upstream by construction; a
      #     skip means the mirror could not serve an object it must already have,
      #     or the surface moved mid-clone. Both are self-correcting within one
      #     retry, so 1 skip carries no information and 2 barely more.
      #   - Retries are frequent: a repository_dispatch per publish, ~10-20
      #     minutes apart during generation hours (measured in #5298: 08:02,
      #     08:10, 08:29, 08:32, 08:37). Three consecutive skips is therefore
      #     ~30-60 minutes of a condition surviving every retry — far past any
      #     transient, and still inside the hour.
      #   - Higher (5) would spend a whole quiet night at the cron-only cadence
      #     before saying anything, which is the silent-failure shape again.
      #
      # WINDOW 36h, tied to that cadence: the floor is the 5:23/17:23 cron, 12h
      # apart, so three cron-only events span 24h. A 24h window would leave the
      # first event sitting exactly on the cutoff and let CI jitter decide whether
      # the third one escalates — the coin-flip github-issue-creator.mjs's own
      # header warns about. 36h gives a full cadence of margin.
      #
      # The counter resets on success (the resolve step below closes the issue),
      # so "3" means three in a row with no good sync between them.
      - name: Escalate a sync that keeps being skipped
        if: steps.gate.outputs.skipped == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPUS_REASON: ${{ steps.pull-corpus.outputs.skip-reason }}
          API_REASON: ${{ steps.pull-api.outputs.skip-reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Heredoc, not an inline multi-line argument: this block is indented
          # inside the YAML scalar, and continuation lines would carry those
          # leading spaces into the issue body, where four of them mean "code
          # block". YAML strips the block indent uniformly, so the shell — and
          # the issue — see flush-left markdown.
          DESC=$(cat <<EOF
          The corpus pull and the sitemap pull could not agree on a single upstream commit, so nothing was committed. Background: \`scripts/lib/articles-sync-pin.mjs\`.

          **Reason:** ${CORPUS_REASON:-}${API_REASON:-}

          **Run:** ${RUN_URL}

          One occurrence self-heals on the next \`articles-published\` dispatch and is not worth an issue. This one is open because the condition survived three consecutive runs, so the likely causes are structural: nanako's Pages/CDN surface is serving a manifest naming a commit that is no longer on the mirror's \`main\` (force-push, or a stale Pages deploy), or the mirror has stopped receiving pushes altogether. Start from \`publish-api.yml\` on nanakokyobashi-rgb/frontaliere-articles.

          While this is open the site keeps serving the last consistent pair — the sitemaps are stale, not wrong.
          EOF
          )
          node scripts/lib/github-issue-creator.mjs \
            --title "Article sync skipped: corpus mirror behind the published API" \
            --description "$DESC" \
            --priority 2 \
            --label "articles-sync" \
            --consecutive-gate 3 \
            --gate-window-hours 36 \
            --workflow "${{ github.workflow }}"

      - name: Clear the skip escalation
        if: steps.gate.outputs.skipped != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Article sync skipped: corpus mirror behind the published API" \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ── The only place a diff of what is ABOUT TO be published still exists ─
      #
      # The deterministic factuality gates (scripts/lib/article-factuality-gates.mjs)
      # were written for the 2026-07-28 incident and are correct — run against
      # the article issue #5595 reports they flag an institution that does not
      # exist — but nothing ever ran them on the path that actually publishes.
      # Since the 2026-08-02 cutover (#4974) article bodies are generated in
      # nanakokyobashi-rgb/frontaliere-articles and land here through THIS job,
      # which commits `packages/articles/content` straight to `main` with no PR.
      # Every committed-diff hook is therefore dead on that path, verified:
      #
      #   - `pull_request` runs of tests.yml never see these bodies: no PR;
      #   - the `push: branches: [main]` run never even STARTS — the push below
      #     uses this workflow's own GITHUB_TOKEN and GitHub does not trigger
      #     workflows on such pushes (2026-08-11: sync commit 7f1a3b4f carries
      #     four check-runs, all `schedule`/`workflow_run`, zero `push`);
      #   - and if it did start, `github.base_ref` is empty on a push, so
      #     `--changed origin/${{ github.base_ref || 'main' }}` diffs origin/main
      #     against itself — an empty scope, green having checked nothing.
      #
      # So this step, HERE: the corpus pull above has already written the new
      # bodies into the working tree and the `git add`/`git commit` below has
      # not run yet. That uncommitted diff is the last observable form of the
      # batch before it becomes `main`.
      #
      # REPORTS, NEVER BLOCKS, and `continue-on-error` is the second lock on
      # that. Failing here would stop the commit, i.e. hold back the whole batch
      # — the correct articles included — plus the sitemaps, the ten RSS feeds
      # and the ticker that ride the same commit. Measured 2026-08-11: 3.173 of
      # 15.640 body-locales flagged (20,3%), only 206 blocking, and the case the
      # issue reports scores `major`. Making it blocking is an owner decision;
      # the reasoning and the FACTUALITY_ISSUE_SCOPE knob are documented in
      # scripts/ci/report-synced-article-factuality.mjs.
      - name: Report factuality of the newly synced articles
        if: steps.gate.outputs.skipped != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/report-synced-article-factuality.mjs

      # ── The curated article-fabrication-guard, run on the same window ──────
      #
      # A NARROWER, higher-signal sibling of the step above. That one runs the
      # deterministic factuality gates (arithmetic, tax plausibility,
      # institution-acronym-in-parentheses); this one runs the curated denylist
      # behind `tests/article-fabrication-guard.test.ts` — confirmed-fabricated
      # institution NAMES and acronyms observed being invented, matched without
      # requiring the "(ACRONYM)" shape the factuality gate needs. That
      # difference is why it exists as its own step: neither incident #5671
      # names — "Ufficio federale del lavoro" (no acronym in parentheses) and
      # the bare acronym "LTL" — would have tripped the step above.
      #
      # Until this PR the vitest test was the ONLY place these patterns ran,
      # and `npm test` never sees this path (see the script's own header for
      # the verified push/PR gap). scripts/lib/article-fabrication-patterns.mjs
      # is the single definition both the test and this step import, so the
      # two cannot drift apart.
      #
      # REPORTS by default — same reasoning as the step above, and the same
      # `continue-on-error` belt-and-braces. Whether a match should hold back
      # the whole batch is an owner decision (#5630/#5595/#5696, unresolved).
      # ARTICLE_FABRICATION_GUARD_BLOCKING (a repository VARIABLE, not this
      # workflow) flips it: set it to the literal string `true` in Settings →
      # Secrets and variables → Actions → Variables to make this step's exit
      # code actually stop the job — and with it every step after, including
      # the commit. OFF (unset) is the state after this PR.
      - name: Report article-fabrication-guard findings on the newly synced articles
        if: steps.gate.outputs.skipped != 'true'
        continue-on-error: ${{ vars.ARTICLE_FABRICATION_GUARD_BLOCKING != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_FABRICATION_GUARD_BLOCKING: ${{ vars.ARTICLE_FABRICATION_GUARD_BLOCKING }}
        run: node scripts/ci/report-synced-article-fabrication.mjs

      - name: Commit if changed
        id: commit
        if: steps.gate.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # Recorded BEFORE the commit, because after it `git diff` is clean.
          # Drives the edge-publish step below: /sitemap-news.xml is served
          # from R2, not from this commit, so committing a fresher file does
          # nothing for Google News on its own.
          if git diff --quiet -- public/sitemap-news.xml; then
            echo "news-sitemap-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "news-sitemap-changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Same reasoning, second surface: the homepage ticker reads
          # cdn.frontaliereticino.ch/data/news-ticker-live.json, an R2 object,
          # NOT the file this job commits. See the edge-publish step below.
          if git diff --quiet -- public/news-ticker-live.json; then
            echo "ticker-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "ticker-changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Third surface, same reasoning and the one nobody re-checks: a feed
          # is a SUBSCRIPTION, so a stale copy is not noticed by whoever reads
          # it. Measured 2026-08-09 before this step existed: /rss.xml on the
          # apex was 2h57m26s behind the corpus and missing 5 of 50 items,
          # while /edge/rss.xml answered 404 — no writer had ever PUT it. The
          # bottleneck was never the pull (public/rss.xml here is byte-identical
          # to the corpus copy); it was the site's deploy chain, >2h and
          # self-cancelling on churn.
          if git diff --quiet -- public/rss.xml public/rss-it.xml public/rss-en.xml public/rss-de.xml public/rss-fr.xml public/rss-svizzera.xml public/rss-svizzera-it.xml public/rss-svizzera-en.xml public/rss-svizzera-de.xml public/rss-svizzera-fr.xml; then
            echo "feeds-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "feeds-changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Every artifact the pull writes: the two sitemaps, the ten RSS feeds
          # and the news-ticker payload (issue #4974 item 2). Listing them here
          # rather than `git add public/` keeps the commit scoped to what this
          # workflow owns — public/ carries plenty this job must never touch.
          #
          # The last three are the generator migration's additions (item 3, §3
          # and §5.5 of docs/articles-generator-migration.md). They are listed
          # unconditionally and that is safe today even though nanako publishes
          # neither yet: the pull skips an artifact it cannot find, so the paths
          # simply stay unmodified and drop out of the diff check below. Adding
          # them now rather than at cutover means the day nanako starts emitting
          # is a publisher change only, with nothing to remember on this side.
          #
          # public/images/blog is a DIRECTORY on purpose — the pull writes one
          # file per new article and the set is not known ahead of time.
          # public/sitemap-articles-archive.xml was MISSING from this list while
          # scripts/pull-articles-api.mjs has written it since #4974 — so every
          # run produced the file and this step threw it away unstaged. It never
          # reached the repo, Vite never copied it into dist/, sitemapAliasPlugin
          # (which builds the index by discovering dist/sitemap-*.xml) never saw
          # it, and the published index carries 86 entries with that one absent.
          # Measured 2026-08-07 against the live index and the eight article
          # shard trees: the `/{section}/{all}/` hubs and their page-N chain
          # (156 URLs in the archive sitemap) answer 200, are self-canonical and
          # indexable, and are announced by none of the 86 sitemaps. That is the
          # exact condition #4974 added the file to fix; only the staging was
          # missing, so the fix never reached the index.
          FILES=(
            packages/articles/content
            public/sitemap-blog.xml
            public/sitemap-blog-ch.xml
            public/sitemap-articles-archive.xml
            public/rss.xml public/rss-it.xml public/rss-en.xml public/rss-de.xml public/rss-fr.xml
            public/rss-svizzera.xml public/rss-svizzera-it.xml public/rss-svizzera-en.xml
            public/rss-svizzera-de.xml public/rss-svizzera-fr.xml
            public/news-ticker-live.json
            public/sitemap-news.xml
            public/sitemap.xml
            public/images/blog
          )

          if git diff --quiet -- "${FILES[@]}" && git diff --quiet --cached -- "${FILES[@]}" \
             && [ -z "$(git ls-files --others --exclude-standard -- "${FILES[@]}")" ]; then
            echo "published artifacts already current — nothing to commit"
            exit 0
          fi

          # Report what moved, so the run log carries the numbers a human would
          # otherwise have to reconstruct from a 40k-line diff.
          for f in public/sitemap-blog.xml public/sitemap-blog-ch.xml; do
            new_urls=$(grep -c '<url>' "$f" || true)
            new_alts=$(grep -c 'xhtml:link' "$f" || true)
            echo "$f: $new_urls urls, $new_alts alternates"
          done
          for f in public/rss.xml public/rss-svizzera.xml; do
            echo "$f: $(grep -c '<item>' "$f" || true) items"
          done

          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          git add -- "${FILES[@]}"
          git commit -q -m "🗺️ Sync article sitemaps, feeds and ticker from the articles API"

          # Rebase-retry, not a bare push. This job races every other workflow
          # that writes to main — and it lost: a plain `git push` was rejected
          # with "fetch first" minutes after a publish, so the fresh feeds sat
          # in a dropped commit and the site kept serving the stale ones. The
          # failure is silent in the way that matters: the publisher is green,
          # the API is correct, and only the site is behind.
          # --regenerate-cmd re-pulls when a rebase CONFLICTS, so the retry
          # publishes what the API says then rather than replaying a snapshot
          # that lost. A clean rebase reapplies the commit as-is and never runs
          # it — which is correct, there is nothing to redo.
          # Attempt count left at the helper's default (40): its own header
          # records 25 being exhausted on this repo (#4557), and this job races
          # the same writers.
          # BOTH pulls, not just the API one. The helper hard-resets to
          # origin/main before regenerating, which throws away the corpus half of
          # the pair as well — replaying only the API half rebuilt the sitemaps
          # against whatever registry origin/main happened to carry, i.e. the
          # exact mismatch #5298 is about, reintroduced on the conflict path. The
          # pin in ARTICLES_SYNC_COMMIT survives into this shell, so the replay
          # targets the same corpus commit the original attempt did, and skips
          # (writing nothing, committing nothing) if the API has moved since.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/pull-articles-corpus.mjs && node scripts/pull-articles-api.mjs && git add -- ${FILES[*]}"

      # ── The invariant this job is the only actor able to maintain ───────────
      #
      # The two pulls above read from two DIFFERENT sources. The registries
      # (`packages/articles/content/router{Blog,Swiss}Data.ts`) come from the
      # corpus repo's git `main`; the sitemaps come from the API it publishes to
      # GitHub Pages. Neither pull compares itself against the other — every
      # guard in both scripts is internal (a manifest count, a non-shrink check
      # against the previously committed copy). So this job can converge on a
      # pair that disagrees, and nothing here would notice.
      #
      # When it does disagree, the symptom lands nowhere near the cause:
      # `tests/blog-slugs-sitemap-sync.test.ts` goes red on EVERY open PR,
      # including the ones that never touched an article. That is exactly how
      # #5289 presented — three articles sat in the registries with no sitemap
      # entry, and the visible effect was that no PR in the repo could merge.
      # The alarm belongs on the job that writes the pair, not on unrelated
      # contributors.
      #
      # Ordering is deliberate: AFTER the commit and push, never before.
      # Verification must not gate the fix — landing fresher sitemaps is what
      # clears the PR gate, so a failing check must never be the reason they
      # stay behind. By the time this runs the artifacts are already on main;
      # a red here is diagnostic and blocks nothing.
      #
      # That benign case is now GONE, and this comment is the record of it: the
      # corpus repo's git `main` runs ahead of the API build it publishes, so a
      # pull that straddled a publish used to see a registry entry whose sitemap
      # URL did not exist yet, and this check went red on a pair that was merely
      # young. It self-healed next run, which made every genuine divergence look
      # like one more instance of the same shrug. Since #5298 the corpus is
      # checked out AT the commit the API names, so the pair cannot be young —
      # any red here means the two sources have genuinely parted, first time.
      - name: Verify registry ↔ sitemap convergence
        if: steps.gate.outputs.skipped != 'true'
        run: node scripts/ci/check-blog-slugs-sitemap-sync.mjs

      # ── Google News freshness: the commit above is not the publish ──────────
      #
      # /sitemap-news.xml is registered in EDGE_PUSHED_FILES, so the Worker
      # serves the R2 copy and never reads the file this job just committed
      # until something PUTs it. deploy.yml now does that on every deploy,
      # which bounds the staleness — but "a few hours" is the wrong unit for a
      # surface whose entries expire after 48h and whose whole value is being
      # crawled while the news is still news. This job is the actor that
      # rewrites the file (every articles-published dispatch, ~22 articles a
      # day), so it is the one that should publish it.
      #
      # --only=/sitemap-news.xml on purpose: this checkout is a `git checkout`,
      # not a build. Pushing the whole table from here would overwrite the
      # 'generated' llms.txt family with whatever a dist-less tree renders.
      # This job owns exactly one entry and pushes exactly that one.
      #
      # Gated on the file having actually changed so a quiet run does not spend
      # a Cloudflare purge on a byte-identical re-PUT.
      - name: Prepare Firebase credentials
        if: steps.commit.outputs.news-sitemap-changed == 'true' || steps.commit.outputs.ticker-changed == 'true' || steps.commit.outputs.feeds-changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        if: steps.commit.outputs.news-sitemap-changed == 'true' || steps.commit.outputs.ticker-changed == 'true' || steps.commit.outputs.feeds-changed == 'true'
        run: node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"

      - name: Publish the news sitemap to the edge
        if: steps.commit.outputs.news-sitemap-changed == 'true'
        continue-on-error: true
        run: node scripts/publish-edge-files.mjs --only=/sitemap-news.xml

      # The ten RSS feeds, same mechanism as the sitemap above. The --only list
      # stays on ONE line with no spaces after the commas: coveredPaths() in
      # tests/locale-router-edge-pushed-files.test.ts extracts it with
      # /--only=(\S+)/ line by line, so a wrapped or space-separated list would
      # be invisible to the guard — the same way a backslash continuation hides
      # --files= from the purge guard.
      - name: Publish the RSS feeds to the edge
        if: steps.commit.outputs.feeds-changed == 'true'
        continue-on-error: true
        run: node scripts/publish-edge-files.mjs --only=/rss.xml,/rss-it.xml,/rss-en.xml,/rss-de.xml,/rss-fr.xml,/rss-svizzera.xml,/rss-svizzera-it.xml,/rss-svizzera-en.xml,/rss-svizzera-de.xml,/rss-svizzera-fr.xml

      # ── The homepage ticker: same class of defect, a different key ──────────
      #
      # components/community/NewsFeed.tsx fetches
      # cdn.frontaliereticino.ch/data/news-ticker-live.json after first paint
      # and swaps it in over the build-time payload. That R2 object had exactly
      # ONE automated writer: scripts/publish-article-chunks.mjs, run by
      # fast-publish-article.yml — the path an article takes when it is created
      # in THIS repo. Since the corpus cutover, articles are created and
      # published by nanakokyobashi-rgb/frontaliere-articles, so that workflow
      # stopped firing and nothing rewrote the key. Measured 2026-08-08: the
      # object was frozen at 2026-08-07T15:29:57Z — 27 hours, spanning ~40
      # published articles — while public/news-ticker-live.json here was being
      # refreshed by THIS job every ~20 minutes and the ticker went on showing
      # the day before's news. Two full deploys ran inside that window and
      # changed nothing, because deploy-it-pages-prep.sh's step_push_cdn syncs
      # `dist/data/**` to `data/` and this file lands at `dist/` root (Vite
      # copies public/ verbatim), so the deploy never touches this key.
      #
      # This job is the actor that rewrites the payload, so it is the one that
      # should publish it — the same argument, and the same shape, as the
      # /sitemap-news.xml step above.
      #
      # THE UNWRAP IS LOAD-BEARING, NOT TIDYING. The committed file is the
      # publisher's `{schema, articles: [...]}` envelope (build-plugins read it
      # as `parsed.articles`), while the browser applies isTickerArticleArray()
      # and takes a BARE ARRAY only. PUTting the file as-is would replace a
      # working payload with one every client silently rejects — the ticker
      # would fall back to the build-time top-5 forever, with a green run here
      # and a 200 on the CDN. Cache-Control and key mirror
      # publish-article-chunks.mjs (TICKER_CDN_KEY / TICKER_CACHE_CONTROL) so
      # the two writers cannot disagree about the freshness contract.
      - name: Publish the news-ticker payload to the edge
        if: steps.commit.outputs.ticker-changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::R2 credentials absent — the ticker keeps serving the previously pushed copy"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync("public/news-ticker-live.json", "utf-8"));
            const articles = parsed && parsed.articles;
            if (!Array.isArray(articles) || articles.length === 0) {
              throw new Error("public/news-ticker-live.json carries no articles array — refusing to publish");
            }
            for (const a of articles) {
              if (!a || !a.id || !a.title || !a.title.it || !a.slug || !a.slug.it) {
                throw new Error(`ticker entry ${a && a.id} is missing a locale title/slug — refusing to publish`);
              }
            }
            fs.writeFileSync("/tmp/news-ticker-live.json", JSON.stringify(articles));
            console.log(`ticker: ${articles.length} articles, newest ${articles[0].date}`);
          '
          bash scripts/lib/upload-cdn-file.sh /tmp/news-ticker-live.json \
            data/news-ticker-live.json "public, max-age=300, must-revalidate"
          # Targeted purge — and it MUST stay on ONE line. The workflow half of
          # tests/cf-zone-purge-blast-radius.test.ts (#5162) tests for `--files=`
          # PER LINE, so splitting this on a backslash continuation makes the
          # first line read as the zone-wide invocation the guard forbids: red
          # CI on a purge that was already targeted, with a message describing a
          # blast radius the command never had. Its script half is deliberately
          # file-scoped for exactly this reason; the workflow half is not.
          #
          # The purge is a best-effort extra, not the mechanism. NewsFeed.tsx
          # reads this through cdnFreshUrl(), which appends `?v=<5-min bucket>`
          # (services/cdnDataBase.ts) — a key this purge does not touch by
          # design, because the SPA's variant was never reachable from here
          # (#4974). What actually bounds staleness for the client is the
          # max-age=300 above, matched to that same 5-minute bucket. This clears
          # the bare-URL variant for everyone else, and mirrors the purge
          # publish-article-chunks.mjs already issues after its own PUT.
          node scripts/cf-purge-cache.mjs --files=https://cdn.frontaliereticino.ch/data/news-ticker-live.json
