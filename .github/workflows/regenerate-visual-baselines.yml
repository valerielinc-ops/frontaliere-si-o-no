name: Regenerate visual-regression baselines

# Manually-dispatched workflow that runs the visual-regression spec
# against the LIVE site with `--update-snapshots`, captures fresh
# Linux baseline PNGs, and commits them to the repo. The next deploy
# pickup the new baselines and starts comparing against them in
# `validate-live`.
#
# WHEN to run:
#   - First-time setup (no *-linux.png present yet)
#   - After an INTENTIONAL design / copy change that invalidates the
#     existing baselines (the audit will be flagging it as a regression)
#
# DO NOT run after a flaky failure — investigate root cause first.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: npx playwright install --with-deps chromium

      - name: Generate fresh baselines against live site
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: npm run test:e2e:visual:update

      - name: Commit and push new baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` only sees tracked changes; new baselines are
          # untracked. Stage first, then check if there's anything to commit.
          git add tests/e2e/seo-visual-regression.spec.ts-snapshots/*-linux.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No baseline changes — already up to date."
            exit 0
          fi
          git commit -m "chore(visual): regenerate linux baselines

          Manually triggered via regenerate-visual-baselines.yml.
          See workflow run for context."
          # Retry-on-rebase loop — same pattern as #794/#804/#805/#806.
          # workflow_dispatch-only job, but main is busy with concurrent
          # producers so a non-fast-forward race is still possible.
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          bash scripts/lib/configure-main-push-auth.sh
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed regenerated baselines."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main || true
            if ! git -c rebase.autoStash=true rebase origin/main; then
              echo "⚠️ Rebase conflict on visual baseline files — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving baselines uncommitted."
          exit 1
