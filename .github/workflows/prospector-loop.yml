name: prospector-loop

# The autonomous coverage loop: discover Swiss employers we do not crawl, work
# out where they publish their vacancies, synthesise a crawler, and grade it
# against the employer's own page.
#
# Sei stadi, tenuti separati invece che in un solo script, perche'
# have completely different cost profiles and failure modes: DISCOVER is API
# calls, TRACE and EXPAND are thousands of polite requests to third-party sites,
# SYNTHESIZE and VALIDATE are re-crawls of a shortlist. Splitting them means a
# rate-limited source cannot cost us the whole run, and a stage can be re-run on
# its own from the Actions tab.
#
# L'ultimo stadio CHIUDE il loop: i crawler che superano il gate di qualita'
# entrano in produzione senza passi umani. Il gate non e' "punteggio alto" ma la
# congiunzione in scripts/lib/prospector/promotion-gate.mjs, la cui condizione
# vincolante — due validazioni buone su due giorni distinti — non e'
# soddisfacibile da una singola run, per quanto buona sembri. La PR che apre
# viaggia poi sul ciclo autonomo che questo repo gia' usa: tests verde,
# pr-review-loop, auto-merge su `## LGTM`.

on:
  schedule:
    # 03:17 UTC — outside the crawler waves, and outside Swiss business hours,
    # since TRACE knocks on several hundred small employers' web servers.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cantons:
        description: 'Cantoni per DISCOVER (lista, oppure "all")'
        default: 'all'
      sources:
        description: 'Sorgenti: own,seco,osm,web'
        default: 'own,seco,web,osm'
      trace_limit:
        description: 'Quanti candidati tracciare'
        default: '150'
      expand_platforms:
        description: 'Quante piattaforme espandere'
        default: '2'
      promote_max:
        description: 'Quanti crawler validati promuovere in produzione per giro'
        default: '10'
      promote_min_days:
        description: 'Giorni distinti di validazione richiesti (2 = normale; 1 SOLO per un giro di verifica)'
        default: '2'

concurrency:
  group: prospector-loop
  cancel-in-progress: false

permissions:
  contents: write
  # PROMOTE apre una PR con i crawler validati, che il ciclo del repo revisiona
  # e mergia da solo su `## LGTM`.
  pull-requests: write

env:
  # Tutta la Svizzera. Il feed SECO su un solo cantone rende 172 datori, sui 26
  # ne rende 5'923 — e la copertura nazionale e' l'obiettivo del loop. `web` e
  # `own` erano gia' nazionali per costruzione.
  CANTONS: ${{ github.event.inputs.cantons || 'all' }}
  SOURCES: ${{ github.event.inputs.sources || 'own,seco,web,osm' }}
  TRACE_LIMIT: ${{ github.event.inputs.trace_limit || '150' }}
  EXPAND_PLATFORMS: ${{ github.event.inputs.expand_platforms || '2' }}
  # Politeness is not a default worth leaving to chance: these employers never
  # asked to be crawled.
  PROSPECTOR_HOST_DELAY_MS: '1200'
  PROSPECTOR_CONCURRENCY: '5'

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Queue commit below is a direct push to this repo's main (bare `git push`
      # on the scheduled ref). The ambient GITHUB_TOKEN extraheader is rejected
      # with GH013; load the long-lived PAT (this job can run for hours, so an
      # App installation token minted here would be the wrong identity).
      # load-rc-env.mjs uses the stdlib REST path — no npm ci.
      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # L'install stava piu' in basso, subito prima di PROMOTE, perche' i cinque
      # stadi precedenti giravano su builtin Node e `fetch`. Non e' piu' vero:
      # `scripts/lib/prospector/public-fetch-policy.mjs` importa `Agent` da
      # `undici` per vincolare il lookup DNS alla connessione (#6807), ed e'
      # sulla catena di import di `polite-fetch.mjs`, che TUTTI gli stadi usano.
      # Dal 2026-09-01 il loop moriva ogni notte su
      #   Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'undici'
      # in TRACE (DISCOVER falliva uguale, mascherato dal suo continue-on-error).
      # Installare qui costa ~1 minuto e toglie di mezzo l'invariante implicita
      # "questi script non importano dipendenze", che nessun gate verificava.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Discover
        # continue-on-error: DISCOVER esce con exit-code 1 se TUTTE le fonti
        # esterne richieste (SECO+OSM+WEB) sono fallite nello stesso giro — un
        # outage totale, distinto da un giro senza novita'. Il resto del loop
        # deve comunque processare la coda esistente (nessuno stadio muore per
        # colpa di un altro, PR #6287): lo step appare rosso in Actions per la
        # visibilita', ma non blocca Trace/Expand/Synthesize/Validate.
        continue-on-error: true
        run: node scripts/prospect-discover.mjs --cantons="$CANTONS" --sources="$SOURCES"

      - name: Trace
        run: node scripts/prospect-trace.mjs --limit="$TRACE_LIMIT"

      - name: Expand platforms
        run: node scripts/prospect-expand.mjs --platforms="$EXPAND_PLATFORMS" --max-probe=200

      - name: Synthesize crawlers
        run: node scripts/prospect-synthesize.mjs --limit=40

      - name: Grade extraction against the live pages
        run: node scripts/prospect-validate.mjs --limit=40 --sample=3

      - name: Summary
        run: node scripts/prospect-report.mjs --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the queue and the report
        # A full loop takes ~30 minutes, which is long enough for another push
        # to land on the branch first: the first remote run failed here with
        # "! [rejected] (fetch first)". So: rebase onto whatever arrived, and
        # retry — the loop's state files are append-mostly and rebase cleanly.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/prospector
          if git diff --cached --quiet; then
            echo 'Nessuna variazione da committare.'
            exit 0
          fi
          git commit -m 'prospector: aggiorna coda candidati, registro piattaforme e report qualita'
          bash scripts/lib/configure-main-push-auth.sh
          for attempt in 1 2 3; do
            if git push; then
              echo "push riuscito al tentativo $attempt"
              exit 0
            fi
            echo "push respinto, ribaso e riprovo ($attempt/3)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
          done
          echo 'push fallito dopo 3 tentativi'
          exit 1

      # ── Chiusura del loop ────────────────────────────────────────────────
      # Ship dei crawler che hanno superato il gate: nessun passo umano. Gira
      # DOPO il commit dello stato, cosi' la PR di promozione parte da un main
      # che gia' contiene lo storico di validazione su cui il gate ha deciso.
      # `scaffold-crawler.mjs` importa `yaml`: senza install fallisce con
      # ERR_MODULE_NOT_FOUND — misurato, il primo giro autonomo ha aperto il
      # gate per 10 crawler e ne ha scaffoldati zero. L'install ora e' in cima
      # al job, non piu' qui, perche' anche gli stadi 1-5 hanno dipendenze.
      #
      # `GITHUB_TOKEN` NON basta: GitHub rifiuta per progetto che una GitHub App
      # crei o aggiorni file sotto `.github/workflows/` senza il permesso
      # `workflows`, e la promozione tocca proprio i `crawler-group-*.yml`
      # rigenerati. Misurato: il primo giro che e' arrivato in fondo ha
      # scaffoldato tutti e 10 i crawler e poi si e' fermato su
      # «refusing to allow a GitHub App to create or update workflow».
      #
      # Il repo ha gia' il suo pattern per questo: token di installazione della
      # App come identita' di push (`secrets.GH_PAT` non esiste — vedi
      # auto-merge-on-lgtm.yml).
      - name: Mint App token (identita' primaria, PAT di fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Promote validated crawlers
        env:
          # APP_TOKEN e' esportato in GITHUB_ENV dallo step di conio; se il conio
          # fallisce si ricade su GITHUB_TOKEN, che pero' non potra' pushare i
          # file di workflow — e il gate APP_TOKEN_WORKFLOWS lo sa gia', quindi
          # in quel caso i gruppi non vengono nemmeno rigenerati.
          #
          # Niente fallback a GITHUB_PAT qui: lo step di commit della coda ha
          # gia' caricato Remote Config per il push a main. La promozione tocca
          # `.github/workflows/**` e vuole lo scope `workflows` del token App,
          # non il PAT.
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTE_MAX: ${{ github.event.inputs.promote_max || '10' }}
          # Il cron non passa mai questo input, quindi resta 2: la leva e'
          # raggiungibile solo da un dispatch manuale, e ogni uso finisce
          # scritto nel titolo e nel corpo della PR prodotta.
          PROMOTE_MIN_DAYS: ${{ github.event.inputs.promote_min_days || '2' }}
        run: |
          # `git push` usa le credenziali del checkout (extraheader con
          # GITHUB_TOKEN), non GH_TOKEN: senza riscrivere il remote, il token
          # coniato sopra varrebbe solo per `gh` e il push resterebbe quello che
          # GitHub rifiuta sui file di workflow.
          if [ -n "${APP_TOKEN:-}" ]; then
            # L'unset NON e' ridondante, ed e' il motivo per cui il giro
            # precedente e' stato rifiutato NONOSTANTE il remote riscritto:
            # actions/checkout scrive
            #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
            # che ha la PRECEDENZA sullo `x-access-token:` nell'URL. Senza
            # toglierlo, il push torna silenziosamente al token sbagliato — e
            # nel log si vede solo «refusing to allow a GitHub App», che sembra
            # un problema di permessi mentre e' un problema di credenziale.
            # Stessa trappola documentata in issue-fix.yml e pr-redflag-fixer.yml.
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin \
              "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          node scripts/prospect-promote.mjs --max="$PROMOTE_MAX" --min-days="$PROMOTE_MIN_DAYS" --open-pr
