name: prospector-loop

# The autonomous coverage loop: discover Swiss employers we do not crawl, work
# out where they publish their vacancies, synthesise a crawler, and grade it
# against the employer's own page.
#
# Sei stadi, tenuti separati invece che in un solo script, perche'
# have completely different cost profiles and failure modes: DISCOVER is API
# calls, TRACE and EXPAND are thousands of polite requests to third-party sites,
# SYNTHESIZE and VALIDATE are re-crawls of a shortlist. Splitting them means a
# rate-limited source cannot cost us the whole run, and a stage can be re-run on
# its own from the Actions tab.
#
# L'ultimo stadio CHIUDE il loop: i crawler che superano il gate di qualita'
# entrano in produzione senza passi umani. Il gate non e' "punteggio alto" ma la
# congiunzione in scripts/lib/prospector/promotion-gate.mjs, la cui condizione
# vincolante — due validazioni buone su due giorni distinti — non e'
# soddisfacibile da una singola run, per quanto buona sembri. La PR che apre
# viaggia poi sul ciclo autonomo che questo repo gia' usa: tests verde,
# pr-review-loop, auto-merge su `## LGTM`.

on:
  schedule:
    # 03:17 UTC — outside the crawler waves, and outside Swiss business hours,
    # since TRACE knocks on several hundred small employers' web servers.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cantons:
        description: 'Cantoni per DISCOVER (lista, oppure "all")'
        default: 'all'
      sources:
        description: 'Sorgenti: own,seco,osm,web'
        default: 'own,seco,web,osm'
      trace_limit:
        description: 'Quanti candidati tracciare'
        default: '150'
      expand_platforms:
        description: 'Quante piattaforme espandere'
        default: '2'
      promote_max:
        description: 'Quanti crawler validati promuovere in produzione per giro'
        default: '10'
      promote_min_days:
        description: 'Giorni distinti di validazione richiesti (2 = normale; 1 SOLO per un giro di verifica)'
        default: '2'

concurrency:
  group: prospector-loop
  cancel-in-progress: false

permissions:
  contents: write
  # PROMOTE apre una PR con i crawler validati, che il ciclo del repo revisiona
  # e mergia da solo su `## LGTM`.
  pull-requests: write

env:
  # Tutta la Svizzera. Il feed SECO su un solo cantone rende 172 datori, sui 26
  # ne rende 5'923 — e la copertura nazionale e' l'obiettivo del loop. `web` e
  # `own` erano gia' nazionali per costruzione.
  CANTONS: ${{ github.event.inputs.cantons || 'all' }}
  SOURCES: ${{ github.event.inputs.sources || 'own,seco,web,osm' }}
  TRACE_LIMIT: ${{ github.event.inputs.trace_limit || '150' }}
  EXPAND_PLATFORMS: ${{ github.event.inputs.expand_platforms || '2' }}
  # Politeness is not a default worth leaving to chance: these employers never
  # asked to be crawled.
  PROSPECTOR_HOST_DELAY_MS: '1200'
  PROSPECTOR_CONCURRENCY: '5'

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Discover
        run: node scripts/prospect-discover.mjs --cantons="$CANTONS" --sources="$SOURCES"

      - name: Trace
        run: node scripts/prospect-trace.mjs --limit="$TRACE_LIMIT"

      - name: Expand platforms
        run: node scripts/prospect-expand.mjs --platforms="$EXPAND_PLATFORMS" --max-probe=200

      - name: Synthesize crawlers
        run: node scripts/prospect-synthesize.mjs --limit=40

      - name: Grade extraction against the live pages
        run: node scripts/prospect-validate.mjs --limit=40 --sample=3

      - name: Summary
        run: node scripts/prospect-report.mjs --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the queue and the report
        # A full loop takes ~30 minutes, which is long enough for another push
        # to land on the branch first: the first remote run failed here with
        # "! [rejected] (fetch first)". So: rebase onto whatever arrived, and
        # retry — the loop's state files are append-mostly and rebase cleanly.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/prospector
          if git diff --cached --quiet; then
            echo 'Nessuna variazione da committare.'
            exit 0
          fi
          git commit -m 'prospector: aggiorna coda candidati, registro piattaforme e report qualita'
          for attempt in 1 2 3; do
            if git push; then
              echo "push riuscito al tentativo $attempt"
              exit 0
            fi
            echo "push respinto, ribaso e riprovo ($attempt/3)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
          done
          echo 'push fallito dopo 3 tentativi'
          exit 1

      # ── Chiusura del loop ────────────────────────────────────────────────
      # Ship dei crawler che hanno superato il gate: nessun passo umano. Gira
      # DOPO il commit dello stato, cosi' la PR di promozione parte da un main
      # che gia' contiene lo storico di validazione su cui il gate ha deciso.
      # Le dipendenze servono SOLO qui. I cinque stadi precedenti girano su
      # builtin Node e `fetch`, e installare per loro sarebbe minuti sprecati
      # ogni notte; `scaffold-crawler.mjs` invece importa `yaml`, e senza
      # install fallisce con ERR_MODULE_NOT_FOUND — misurato: il primo giro
      # autonomo ha aperto il gate per 10 crawler e ne ha scaffoldati zero.
      #
      # `--ignore-scripts`: il postinstall del repo non serve a generare un
      # parser, e in questo job sarebbe solo altro tempo e altra superficie.
      - name: Install dependencies (solo per lo scaffolding)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Promote validated crawlers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_MAX: ${{ github.event.inputs.promote_max || '10' }}
          # Il cron non passa mai questo input, quindi resta 2: la leva e'
          # raggiungibile solo da un dispatch manuale, e ogni uso finisce
          # scritto nel titolo e nel corpo della PR prodotta.
          PROMOTE_MIN_DAYS: ${{ github.event.inputs.promote_min_days || '2' }}
        run: node scripts/prospect-promote.mjs --max="$PROMOTE_MAX" --min-days="$PROMOTE_MIN_DAYS" --open-pr
