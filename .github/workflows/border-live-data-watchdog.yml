name: Border Live-Data Watchdog

# Owner requirement: live border data must ALWAYS be live. If a Canton Ticino
# webcam breaks, the live routing provider falls back to mock for ALL crossings,
# or the wait-time snapshot freezes, it must surface as a GitHub issue — never
# sit dormant.
#
# SCOPE — complementary to traffic-data-freshness.yml, NOT a duplicate:
#   - traffic-data-freshness.yml owns the FAST wait-time staleness loop (hourly,
#     90-min threshold, peak-hours window, self-heals via traffic-scheduler).
#   - THIS workflow owns the WEBCAM-HEALTH gap + the ALL-MOCK-SOURCE gap, plus a
#     COARSE 6h staleness backstop (looser than the 90-min loop, so it only fires
#     if the pipeline is truly frozen and the fast loop has already failed to heal).
# Cadence is 6-hourly: webcams change slowly and the HTTP probe is the only cost.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  # contents: write — the run persists data/webcam-status.json back to main so
  # the NEXT run can tell an offline→online transition from a feed that was
  # never down (issue #6644). Without the commit the state file is recreated
  # empty every run and no recovery is ever detectable.
  contents: write
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run border live-data health check
        id: health
        env:
          STALE_HOURS: '6'
        run: npx tsx scripts/check-border-data-health.mjs

      # Persist the per-webcam state regardless of the health verdict: a
      # DEGRADED run is exactly when the transitions are most interesting, and
      # the file is what makes the next run's recovery alert possible at all.
      - name: Persist per-webcam status
        if: always() && steps.health.conclusion != 'skipped'
        # Never let state bookkeeping mask (or invent) a health verdict: the
        # issue open/resolve steps below key off the health step's outcome.
        continue-on-error: true
        run: |
          if [ ! -f data/webcam-status.json ]; then
            echo "No status file written (registry unreadable?) — nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/webcam-status.json
          if git diff --cached --quiet; then
            echo "No webcam status change."
          else
            git commit -m "chore(webcam): per-webcam status snapshot [skip ci]"
            bash scripts/lib/git-push-with-retry.sh --soft-fail-exhausted
          fi

      # Recovery alert (issue #6644). On a DEGRADED run the recovered lines are
      # already inside HEALTH_SUMMARY (the canonical issue comment). This step
      # covers the other case — a run where nothing is broken any more — so a
      # feed coming back after downtime is never silent.
      - name: Report webcam recoveries
        if: always() && steps.health.outputs.recovered != ''
        run: |
          {
            echo "### Webcam tornate online"
            echo ''
            echo '```'
            echo "${RECOVERED}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RECOVERED: ${{ steps.health.outputs.recovered }}

      # Degraded → open (or comment on) the canonical issue. The helper dedups on
      # the first 60 chars of the STABLE title, so consecutive degraded runs
      # comment on the same issue instead of spawning duplicates.
      - name: Open / dedup degraded issue
        if: failure() && steps.health.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Border live-data degraded: stale wait-times or broken webcams" \
            --description "## Border live-data watchdog tripped

          The 6-hourly watchdog (\`scripts/check-border-data-health.mjs\`) detected degraded live border data: a stale wait-time snapshot, an all-\`mock\` source fallback, and/or a broken Canton Ticino webcam.

          ### Health report
          \`\`\`
          ${HEALTH_SUMMARY}
          \`\`\`

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### What to check
          - Webcam BROKEN → the www4.ti.ch feed URL changed or is 403/down; update \`data/borderCrossings.ts\` \`webcams[].imageUrl\`.
          - ALL-MOCK → the live routing provider (HERE) failed; check \`traffic-scheduler\` workflow + RC keys.
          - STALE (6h backstop) → the hourly \`traffic-data-freshness\` self-heal did not recover; investigate \`traffic-scheduler\`.

          This issue auto-resolves on the next watchdog run once data is healthy again." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Healthy → close the canonical issue if it was open (idempotent no-op
      # otherwise), so a recovered watchdog never leaves a stale open issue.
      - name: Resolve issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Border live-data degraded: stale wait-times or broken webcams" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --resolve
