name: Border Live-Data Watchdog

# Owner requirement: live border data must ALWAYS be live. If a Canton Ticino
# webcam breaks, the live routing provider falls back to mock for ALL crossings,
# or the wait-time snapshot freezes, it must surface as a GitHub issue — never
# sit dormant.
#
# SCOPE — complementary to traffic-data-freshness.yml, NOT a duplicate:
#   - traffic-data-freshness.yml owns the FAST wait-time staleness loop (hourly,
#     90-min threshold, peak-hours window, self-heals via traffic-scheduler).
#   - THIS workflow owns the WEBCAM-HEALTH gap + the ALL-MOCK-SOURCE gap, plus a
#     COARSE 6h staleness backstop (looser than the 90-min loop, so it only fires
#     if the pipeline is truly frozen and the fast loop has already failed to heal).
# Cadence is 6-hourly: webcams change slowly and the HTTP probe is the only cost.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  # contents: write — the run persists data/webcam-status.json back to main so
  # the NEXT run can tell an offline→online transition from a feed that was
  # never down (issue #6644). Without the commit the state file is recreated
  # empty every run and no recovery is ever detectable.
  contents: write
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The "Persist per-webcam status" step below pushes data/webcam-status.json
      # straight to main, and the main ruleset rejects the ambient
      # github-actions[bot] identity (GH013). git-push-with-retry.sh fails closed
      # on that via configure-main-push-auth.sh, so without GITHUB_PAT loaded here
      # the push never lands — and because the persist step is
      # `continue-on-error: true`, the run still went green while the snapshot was
      # silently dropped on every single run since #7360 added it.
      # Fail-open on purpose (`if [ -n ... ]` + continue-on-error): this workflow's
      # reason to exist is the health verdict and the degraded-issue alert, and a
      # Remote Config hiccup must never mask those — same rationale as the persist
      # step's own "never let state bookkeeping mask a health verdict" comment.
      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Cross-run carry of data/webcam-status.json OUTSIDE git (issue #7376).
      # The persist step below is best-effort (`--soft-fail-exhausted` plus
      # `continue-on-error`), and the state it carries is NOT recomputable from
      # a window: if the run that first sees a feed OFFLINE loses its push, main
      # keeps saying `online`, and when the feed comes back the next run reads
      # `prev.status !== 'offline'` and never announces the recovery. The
      # transition is one-shot — unlike refresh-thin-promotions.yml or
      # discover-404s-via-cloudflare.yml, whose overlapping windows recapture a
      # lost push on the next run — and the failure looks exactly like a healthy
      # run: no alert.
      # The Actions cache is written on EVERY run regardless of the push
      # outcome, so restoring it over the checked-out copy hands this run the
      # state the previous push dropped. Because the restored file then differs
      # from HEAD, the persist step re-pushes it by itself. Cache miss (first
      # run, eviction) leaves the committed copy in place, i.e. the previous
      # behaviour. It is a carry, not a source of truth: main stays the record.
      - name: Restore per-webcam status from cache
        id: webcam-cache
        uses: actions/cache/restore@v5
        with:
          path: data/webcam-status.json
          key: webcam-status-${{ github.run_id }}
          restore-keys: webcam-status-

      # Make the lost push VISIBLE: without this, a dropped persist is
      # indistinguishable from a run where nothing changed.
      - name: Flag a lost previous persist
        if: steps.webcam-cache.outputs.cache-matched-key != ''
        run: |
          if git diff --quiet -- data/webcam-status.json; then
            echo "Cached webcam status matches main — previous persist landed."
          else
            echo "::warning::data/webcam-status.json su main e' indietro rispetto alla cache: il persist della run precedente non e' arrivato (push best-effort). Stato ripreso dalla cache, questa run ritenta il push."
            {
              echo '### Stato webcam ripreso dalla cache'
              echo ''
              echo 'Il persist della run precedente non e arrivato su main (push best-effort esaurito o step fallito). Lo stato e stato ripreso dalla cache Actions, quindi una recovery resta rilevabile; questa run ritenta il push.'
              echo ''
              echo '```diff'
              git --no-pager diff -- data/webcam-status.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run border live-data health check
        id: health
        env:
          STALE_HOURS: '6'
        run: npx --no-install tsx scripts/check-border-data-health.mjs

      # Persist the per-webcam state regardless of the health verdict: a
      # DEGRADED run is exactly when the transitions are most interesting, and
      # the file is what makes the next run's recovery alert possible at all.
      - name: Persist per-webcam status
        if: always() && steps.health.conclusion != 'skipped'
        # Never let state bookkeeping mask (or invent) a health verdict: the
        # issue open/resolve steps below key off the health step's outcome.
        continue-on-error: true
        run: |
          if [ ! -f data/webcam-status.json ]; then
            echo "No status file written (registry unreadable?) — nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/webcam-status.json
          if git diff --cached --quiet; then
            echo "No webcam status change."
          else
            git commit -m "chore(webcam): per-webcam status snapshot [skip ci]"
            bash scripts/lib/git-push-with-retry.sh --soft-fail-exhausted
          fi

      # Written on every run, push outcome irrelevant: this is the copy the next
      # run restores when the push above did not land. Keyed by run id (unique,
      # so the save never collides) and read back by the `webcam-status-` prefix,
      # which resolves to the most recent cache.
      - name: Save per-webcam status to cache
        if: always() && hashFiles('data/webcam-status.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/webcam-status.json
          key: webcam-status-${{ github.run_id }}

      # Recovery alert (issue #6644). On a DEGRADED run the recovered lines are
      # already inside HEALTH_SUMMARY (the canonical issue comment). This step
      # covers the other case — a run where nothing is broken any more — so a
      # feed coming back after downtime is never silent.
      - name: Report webcam recoveries
        if: always() && steps.health.outputs.recovered != ''
        run: |
          {
            echo "### Webcam tornate online"
            echo ''
            echo '```'
            echo "${RECOVERED}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RECOVERED: ${{ steps.health.outputs.recovered }}

      # Degraded → open (or comment on) the canonical issue. The helper dedups on
      # the first 60 chars of the STABLE title, so consecutive degraded runs
      # comment on the same issue instead of spawning duplicates.
      - name: Open / dedup degraded issue
        if: failure() && steps.health.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Border live-data degraded: stale wait-times or broken webcams" \
            --description "## Border live-data watchdog tripped

          The 6-hourly watchdog (\`scripts/check-border-data-health.mjs\`) detected degraded live border data: a stale wait-time snapshot, an all-\`mock\` source fallback, and/or a broken Canton Ticino webcam.

          ### Health report
          \`\`\`
          ${HEALTH_SUMMARY}
          \`\`\`

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### What to check
          - Webcam BROKEN → the www4.ti.ch feed URL changed or is 403/down; update \`data/borderCrossings.ts\` \`webcams[].imageUrl\`.
          - ALL-MOCK → the live routing provider (HERE) failed; check \`traffic-scheduler\` workflow + RC keys.
          - STALE (6h backstop) → the hourly \`traffic-data-freshness\` self-heal did not recover; investigate \`traffic-scheduler\`.

          This issue auto-resolves on the next watchdog run once data is healthy again." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Healthy → close the canonical issue if it was open (idempotent no-op
      # otherwise), so a recovered watchdog never leaves a stale open issue.
      - name: Resolve issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Border live-data degraded: stale wait-times or broken webcams" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --resolve
