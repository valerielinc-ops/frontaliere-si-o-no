name: Rerender Article Corpus

# Issue #4881 Fase 4 — corpus-wide article re-render, off the site's critical
# path. Two things are inherently corpus-wide and cannot be done incrementally
# per-article (measured — see scripts/rerender-article-corpus.mjs's own header
# comment for the full rationale):
#   1. Related-articles blocks: publishing ONE article changes the related
#      block of 100% of the section's OTHER articles (buildRelatedArticlesHtml
#      always slots the newest article into every sibling's candidate list —
#      confirmed 548/548 svizzera, 3023/3023 frontaliere at measurement time).
#      The per-article fast-publish path (scripts/publish-article-fast.mjs,
#      #4837) deliberately does NOT re-render siblings for this reason.
#   2. Template drift safety net: once articles skip the full `vite build`
#      (fast-publish path), that build's whole-corpus re-render stops acting
#      as a safety net against template regressions. This workflow (reactive
#      on template-file changes below, plus operator-dispatched) is the
#      replacement.
#
#      The detection half of that pair now runs, weekly and read-only:
#      .github/workflows/audit-article-corpus-drift.yml. Issue #5444 tracked
#      it existing-but-never-triggered for a while (this comment used to say
#      so, at the present tense — a live trap in itself: it read as "the
#      safety net exists" to anyone who didn't also grep `.github/`), then a
#      real CI run (31369064388, 2026-08-10) found the operational
#      preconditions (ASSET_CDN, TZ, on-disk hero images) all satisfied, and
#      two genuine template/renderer bugs besides. See that workflow's own
#      header for the histogram and for why it still does NOT open issues on
#      every red run: most of its `content-mismatch` signal is the SAME
#      related-articles staleness described in point 1 above, which a
#      re-render against the current tree will always show for any article
#      that isn't the newest, and which is not actionable — not a case of
#      the detector failing to fire.
#
#      What IS watched, from outside and twice a day, is the article-HUB
#      surface: .github/workflows/article-hub-landing-watchdog.yml compares the
#      served /tutti/ archives against the topic hubs
#      sitemap-topics-<section>.xml announces (issue #5432). That covers hub
#      renderer drift; it says nothing about article-page templates.
#
# Renders via scripts/rerender-article-corpus.mjs, which calls the EXACT
# renderArticlePages() export build-plugins/ogPagesPlugin.ts's `vite build`
# path and the single-article fast-publish path both use, plus the same
# post-render plugin functions (flatHtmlRedirectPlugin,
# blogContextualLinksPlugin, hreflangPostprocessPlugin,
# blogImageCdnFinalizePlugin) in the same order — one implementation, never a
# fork. Pushes via the existing merge-aware, never-force
# scripts/lib/push-article-shard-incremental.sh (no separate push step needed
# here — the driver script does render + push in one invocation).
#
# Memory: renderArticlePages() is NEVER called unbounded here. The driver
# chunks each section's article ids into batches and renders every batch in a
# FRESH `npx tsx` subprocess — see the driver's header comment for why a fresh
# process (not in-process sequential batching) is the actual memory-safety
# mechanism, and why the batch size is a REASONED target, not a measured one
# (no full local build is available to profile against).
#
# THE HUB RENDERERS ARE NOT THIS WORKFLOW'S JOB — see
# .github/workflows/rerender-article-hubs.yml.
#
# This spot used to carry a TODO: "if a sibling effort extracts an article-hub
# renderer, add that path to the `push:` filter below — a hub-renderer change
# is exactly the class of change this workflow exists to catch corpus-wide."
# The instinct was right and the destination was wrong, and it was never acted
# on: for a year no workflow in this repo named seoHubsPlugin.ts,
# topicClusterHubsPlugin.ts, topicClusterHubsData.ts, articleHubPagesPlugin.ts
# or topicTaxonomy.ts in any `push: paths:` filter, so #5422's fix sat correct
# on main while every served hub page kept the old renderer (issue #5432).
#
# It does not belong here. This job re-renders 3571 articles under a 180-minute
# timeout and holds `rerender-corpus-<section>` for the duration; the hub
# re-render is ~3 seconds of work for BOTH sections. Sharing this lock would
# make the repair unavailable exactly while a hub regression is live, and
# sharing this timeout would hide a repair that takes minutes inside a job that
# takes hours.
#
# So do NOT add hub-renderer paths to the `push:` filter below. Add them to
# rerender-article-hubs.yml, which exists for them, renders through the same
# scripts/lib/render-and-push-hubs.mjs the fast-publish path uses, and pushes
# through the same scripts/lib/push-article-shard-incremental.sh this one does.
on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Section to rerender (all = both frontaliere+svizzera, matches the push-trigger scope)'
        type: choice
        options:
          - all
          - frontaliere
          - svizzera
        default: all
      locale:
        description: 'Which locale shard(s) to PUSH (render always covers all 4 locales per article — see driver script)'
        type: choice
        options:
          - all
          - it
          - en
          - de
          - fr
        default: all
      dry_run:
        description: 'Render only, skip the shard push'
        type: boolean
        default: false
      limit:
        description: 'Max article ids per section (testing only — blank = full section)'
        type: string
        default: ''
      only_ids:
        description: 'Comma-separated article ids to rerender (canary/targeted repair — overrides limit; blank = whole section)'
        type: string
        default: ''
      batch_size:
        description: 'Article ids per render subprocess batch (memory-bounded — see scripts/rerender-article-corpus.mjs header comment)'
        type: string
        default: '300'
  push:
    branches: [main]
    paths:
      - 'build-plugins/ogPagesPlugin.ts'
      - 'build-plugins/shared/seoPageShell.ts'
      - 'build-plugins/shared/articleSectionDescriptors.ts'
      - 'build-plugins/blogContextualLinksPlugin.ts'
      - 'build-plugins/flatHtmlRedirectPlugin.ts'
      - 'build-plugins/hreflangPostprocessPlugin.ts'
      - 'build-plugins/blogImageCdnFinalizePlugin.ts'
      - 'scripts/rerender-article-corpus.mjs'

permissions:
  contents: read
  issues: write

jobs:
  plan:
    # Computes which section(s) run as separate matrix jobs below. A push
    # trigger (template file changed on main) always means "rerender both —
    # a shared template affects both sections identically". workflow_dispatch
    # honors the operator's --section choice, defaulting to both.
    runs-on: ubuntu-latest
    outputs:
      sections: ${{ steps.compute.outputs.sections }}
    steps:
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.section }}" != "all" ]; then
            echo 'sections=["${{ inputs.section }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'sections=["frontaliere","svizzera"]' >> "$GITHUB_OUTPUT"
          fi

  rerender:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        section: ${{ fromJson(needs.plan.outputs.sections) }}
    runs-on: ubuntu-latest
    # Bounded per SECTION, not per whole corpus (~3023 frontaliere /
    # ~548 svizzera articles) — see the driver script's header comment for
    # the batching design this timeout budgets around. Generous ceiling;
    # actual wall-time is expected to be dominated by `npx tsx` cold-start
    # per batch + shard-push clone/push round trips, not render compute
    # (see driver script's header comment — reasoned, not fully measured).
    timeout-minutes: 180
    # Serialize per SECTION: two runs targeting the SAME section could push
    # overlapping article-id batches to the same 4 shard repos concurrently
    # (unlike fast-publish-article.yml's per-ARTICLE concurrency, where
    # concurrent runs on DIFFERENT articles are safe by construction — see
    # that workflow's own concurrency-group comment). A queued run for a
    # DIFFERENT section is a separate group and proceeds independently.
    concurrency:
      group: rerender-corpus-${{ matrix.section }}
      cancel-in-progress: false
    environment: shard-secrets-overflow
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "Firebase secrets not set — proceeding without (mirrors fast-publish-article.yml's own tolerant fallback)."
          fi

      # Same provider keys (R2/CDN etc.) the single-article fast-publish path
      # loads before calling the identical post-render plugin functions this
      # driver reuses — see scripts/load-rc-env.mjs's RC_TO_ENV mapping.
      # Deliberately NO `npm ci`: the driver runs via `npx -y tsx@4`
      # (on-demand, no repo install), same as publish-article-fast.mjs —
      # this workflow exists precisely to stay off the full-install/full-build
      # critical path.
      - name: Load secrets from Remote Config (R2 + indexing)
        run: node scripts/load-rc-env.mjs

      - name: Rerender and push ${{ matrix.section }} corpus
        id: render
        env:
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_SECTION: ${{ matrix.section }}
          INPUT_LOCALE: ${{ inputs.locale || 'all' }}
          INPUT_BATCH_SIZE: ${{ inputs.batch_size || '300' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_ONLY_IDS: ${{ inputs.only_ids }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rerender-corpus
          ARGS=(--section "$INPUT_SECTION" \
                --locale "$INPUT_LOCALE" \
                --batch-size "$INPUT_BATCH_SIZE" \
                --out /tmp/rerender-corpus/dist \
                --manifest /tmp/rerender-corpus/manifest.json)
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          # --only-ids wins over --limit in the driver (it picks the id list
          # BEFORE the limit slice), so a run that names ids gets exactly those
          # and nothing else. That is what makes a canary verifiable: the first
          # ids of a section's enumeration are mostly archived redirect stubs
          # (8 of the first 10 for frontaliere), so `--limit 10` re-renders
          # pages that carry none of the properties one would check afterwards.
          if [ -n "${INPUT_ONLY_IDS:-}" ]; then
            ARGS+=(--only-ids "$INPUT_ONLY_IDS")
          fi
          # Pinned to the same tsx major package.json's devDependencies
          # declares ("tsx": "^4.21.0"), matching publish-article-fast.mjs's
          # own invocation — a future tsx major cannot silently change loader
          # behaviour on this un-installed path.
          npx -y tsx@4 scripts/rerender-article-corpus.mjs "${ARGS[@]}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "rerender-article-corpus (${{ matrix.section }}) failed" \
            --description "Corpus re-render for section '${{ matrix.section }}' failed (run ${{ github.run_id }}). Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 2 \
            --label rerender-corpus \
            --workflow "Rerender Article Corpus"

      # Metà di CHIUSURA (#5470). Senza questo step la issue qui sopra non si
      # chiudeva mai: il titolo `rerender-article-corpus (<section>) failed` sta
      # fuori dal TITLE_RE di scripts/ci/close-recovered-failure-issues.mjs
      # (`^(?:Workflow|Crawler|CI) Failure: `) e fuori dal `--mode resolve` di
      # scripts/ci/report-validate-dist-failure.mjs (prefisso `Validation
      # Failure (dist):`) — nessuno dei due chiuditori la vedeva. Col dedup sul
      # titolo la stessa sezione che rifallisce ricade sulla stessa issue, che è
      # giusto, ma quella issue restava aperta anche dopo un run verde.
      # Modello: rpm-canary.yml, step "Resolve open issue on green".
      # Il titolo deve restare IDENTICO a quello dello step di apertura: un
      # carattere di differenza e la chiusura non trova più niente.
      # Non si rinominano i titoli dentro il pattern generico: il dedup è sul
      # titolo, quindi il cambio orfanerebbe qualunque issue aperta col titolo
      # vecchio. Questo step è locale e non tocca niente di condiviso.
      - name: Resolve open issue on green
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "rerender-article-corpus (${{ matrix.section }}) failed" \
            --workflow "Rerender Article Corpus" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
