# Per-locale/all-locale matrix build EXPERIMENT (study phase — does NOT deploy).
#
# Tests the proposed matrix-per-locale build: instead of one monolithic build
# emitting all four locales, fan one build per locale across separate runners
# (BUILD_LOCALE=<loc>), each emitting ONLY its own subtree. This validates the
# missing prerequisite — the BUILD_LOCALE emit filter (build-plugins/shared/
# localeEmitFilter.ts) — end-to-end on real data, and measures the per-runner
# wall-time vs the ~23 min monolith.
# With all_locales=true, the same matrix has exactly one leg and deliberately
# leaves BUILD_LOCALE unset, measuring the proposed single-process four-locale
# build on the production-sized runner.
#
# SAFETY: manual (workflow_dispatch) only. It NEVER pushes to the production
# shard repos (frontaliere-{en,de,fr}/cdn) and NEVER touches GitHub Pages — it
# builds, validates, reports timing, and discards the output. The live
# deploy.yml is completely untouched.
#
# Each matrix job self-prepares the dataset (assemble + derived files). Because
# every job checks out the SAME commit and the assemble cache is keyed on the
# committed slice hashes, all jobs see a byte-identical snapshot — so the
# experiment is deterministic. In production the recommended architecture adds
# a single shared `prep` job that uploads the assembled dataset as an artifact
# consumed by every locale, guaranteeing atomicity across the crawler-commit
# window (see PR body "Non implementato").
name: Deploy Matrix Experiment (per-locale, no deploy)

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locales to build in the matrix'
        required: false
        default: 'it,en,de,fr'
      all_locales:
        description: 'Build all four locales in one process (single memory canary)'
        type: boolean
        required: false
        default: false
      fast_build:
        description: 'FAST_BUILD=1 (skip heavy feature plugins for a quick smoke test)'
        type: boolean
        required: false
        default: false
      parallel_plugins:
        description: 'Run closeBundle plugins in parallel (default: sequential, like prod)'
        type: boolean
        required: false
        default: false
      retention_probe:
        description: 'Investigation-only: release exactly one jobsSeo retention candidate and label its corpus-release gcFreed measurement'
        required: false
        default: ''
      variants:
        description: 'One variant per line: name=KEY=VAL,KEY=VAL (empty value means no extra env)'
        type: string
        required: false
        default: 'base='
      compare_monolith:
        description: 'Run the all-locales monolith and compare gate (single variant only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-matrix-experiment
  cancel-in-progress: false

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      variant_count: ${{ steps.build.outputs.variant_count }}
      single_variant: ${{ steps.build.outputs.single_variant }}
      single_env_json: ${{ steps.build.outputs.single_env_json }}
    steps:
      - name: Checkout matrix parser
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci/matrix-experiment-variants.mjs
          sparse-checkout-cone-mode: false
      - name: Build locale × variant matrix from input
        id: build
        env:
          LOCALES_INPUT: ${{ github.event.inputs.locales }}
          ALL_LOCALES_INPUT: ${{ github.event.inputs.all_locales }}
          VARIANTS_INPUT: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          JSON="$(node scripts/ci/matrix-experiment-variants.mjs)"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            const rows = JSON.parse(process.argv[1]);
            const variants = [...new Set(rows.map(({ variant }) => variant))];
            const first = rows[0];
            console.log("variant_count=" + variants.length);
            console.log("single_variant=" + (variants.length === 1 ? first.variant : ""));
            console.log("single_env_json=" + (variants.length === 1 ? first.env_json : "{}"));
          ' "$JSON" >> "$GITHUB_OUTPUT"
          echo "Matrix include: $JSON"

  # ── Shared prep (Fase 3): assemble the dataset ONCE → atomic snapshot artifact.
  # Removes the ×4 duplicated data-prep from the locale shards and guarantees
  # every shard builds from the IDENTICAL job snapshot (no crawler-commit-window
  # divergence). OG images stay per-shard (rendered in build:ci, og-jobs cache).
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: |
          if test -f scripts/load-rc-env.mjs; then
            node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
          else
            echo "⚠️ load-rc-env.mjs is absent in this checkout (non-fatal)"
          fi
      - name: Cache assemble-jobs output
        uses: actions/cache/restore@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ hashFiles('scripts/assemble-jobs-dataset.mjs', 'scripts/lib/parse-job-slices-worker.mjs', 'data/jobs/by-crawler/**/*.json', 'data/jobs/expired/by-crawler/**/*.json', 'data/jobs-crawler-summaries/by-crawler/**/*.json') }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-
      - name: Assemble jobs dataset from per-crawler slices
        # assembleJobsDataset() only reads+aggregates committed per-slice
        # files; it never calls writeJobsCrawlerSlice()/the shrink/boilerplate
        # guards (those only run inside dedicated update-<company>-jobs.mjs
        # crawler scripts), so it does not need GH_TOKEN / issues:write.
        run: node scripts/assemble-jobs-dataset.mjs --stats
      - name: Housekeeping (cross-crawler dedup + locale hardening)
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: node scripts/cleanup-jobs.mjs
      - name: Refresh weekly-employers footer link list
        run: node scripts/refresh-weekly-employers-top-pairs.mjs
      - name: Mine all job slugs for 404 coverage
        run: node scripts/mine-all-job-slugs.mjs
      - name: Canton-aware migration of slug registry
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs
      - name: Generate responsive image thumbnails
        run: node scripts/generate-image-thumbnails.mjs
      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs
      - name: Pack prepared snapshot (generated data + thumbnails)
        run: |
          set -eo pipefail
          tar -czf /tmp/prepared-snapshot.tgz \
            data \
            public/images/blog/thumbnails public/images/places/thumbnails 2>/dev/null || \
            tar -czf /tmp/prepared-snapshot.tgz data
          ls -lh /tmp/prepared-snapshot.tgz
      - name: Upload prepared snapshot
        uses: actions/upload-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/prepared-snapshot.tgz
          retention-days: 1

  build-locale:
    needs: [matrix-setup, prep]
    name: build-locale (${{ matrix.locale }}, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      BUILD_VARIANT: ${{ matrix.locale == 'all' && 'all-locales' || matrix.locale }}
      FAST_BUILD: ${{ github.event.inputs.fast_build == 'true' && '1' || '' }}
      SEQUENTIAL_PROFILE: ${{ github.event.inputs.parallel_plugins == 'true' && '' || '1' }}
      BUILD_PROFILE: '1'
      POST_WALK_WORKERS: '2'
      JOBS_SEO_PROFILE_PHASES: '1'
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
      RELATED_SEARCH_PREPASS_CONCURRENCY: '1'
      JOBS_SEO_RETENTION_PROBE: ${{ github.event.inputs.retention_probe }}
    steps:
      # Copied minimally from deploy.yml's build-locale job, whose source of
      # truth is the production cleanup step in this same repository.
      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5

      # Lockstep con deploy.yml's build-locale job: stesso script, stessi
      # numeri, un posto solo (scripts/ci/grow-build-swap.sh). Senza,
      # l'esperimento misurerebbe un runtime diverso da quello di produzione.
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash scripts/ci/grow-build-swap.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit no merge conflict markers
        run: npm run audit:no-merge-markers

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config secrets will not be loaded."
          fi

      - name: Load secrets from Remote Config
        run: |
          if test -f scripts/load-rc-env.mjs; then
            node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal for the build experiment)"
          else
            echo "⚠️ load-rc-env.mjs is absent in this checkout (non-fatal for the build experiment)"
          fi

      # Fase 3: consume the shared atomic snapshot from the prep job instead of
      # re-running assemble/cleanup/mine/migrate/thumbnails per shard. Guarantees
      # every shard builds the IDENTICAL dataset. OG images are still rendered
      # per-shard during build:ci (og-jobs cache shared across runs).
      - name: Download prepared snapshot
        uses: actions/download-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/snapshot
      - name: Restore prepared snapshot (data + thumbnails)
        run: |
          set -eo pipefail
          tar -xzf /tmp/snapshot/prepared-snapshot.tgz -C .
          if [ -f data/jobs.json ]; then
            echo "✓ data/jobs.json restored ($(wc -c < data/jobs.json) bytes)"
          else
            echo "✖ data/jobs.json missing after restore"
            exit 1
          fi

      - name: Cache per-job OG images
        uses: actions/cache/restore@v5
        with:
          path: .cache/og-jobs
          key: og-jobs-${{ runner.os }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}
          restore-keys: |
            og-jobs-${{ runner.os }}-

      - name: Configure locale emit mode
        env:
          ALL_LOCALES: ${{ matrix.all_locales }}
          LOCALE: ${{ matrix.locale }}
        run: |
          if [ "$ALL_LOCALES" = 'true' ]; then
            echo 'All-locale canary: BUILD_LOCALE is intentionally unset.'
          else
            echo "BUILD_LOCALE=$LOCALE" >> "$GITHUB_ENV"
            echo "Per-locale experiment: BUILD_LOCALE=$LOCALE"
          fi

      - name: Apply variant environment
        env:
          VARIANT_ENV_JSON: ${{ matrix.env_json }}
        run: |
          set -euo pipefail
          printf '%s' "$VARIANT_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
          echo "Applied variant ${{ matrix.variant }} environment (${#VARIANT_ENV_JSON} bytes of JSON)"

      # Read-only copies of deploy.yml's production carry-over caches. The
      # experiment deliberately has no cache-save step, so variants cannot
      # replace a production snapshot.
      - name: Restore previous incremental manifest
        id: incremental-manifest-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/incremental-manifest
          key: incremental-manifest-${{ matrix.locale }}-${{ github.run_id }}
          restore-keys: |
            incremental-manifest-${{ matrix.locale }}-

      - name: Restore previous jobs SEO HTML cache
        if: env.JOBS_SEO_REUSE == '1'
        id: jobs-seo-html-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/incremental-html
          key: jobs-seo-html-${{ matrix.locale }}-${{ hashFiles(format('.cache/incremental-manifest/{0}.jsonl', matrix.locale)) }}

      - name: Stash previous incremental manifest before build overwrites it
        shell: bash
        env:
          MANIFEST_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          previous=".cache/incremental-manifest/${MANIFEST_LOCALE}.jsonl"
          mkdir -p .cache/incremental-manifest-prev
          if [ -f "$previous" ]; then
            mv "$previous" ".cache/incremental-manifest-prev/${MANIFEST_LOCALE}.jsonl"
            echo "[incremental-manifest] previous ${MANIFEST_LOCALE} manifest stashed ($(wc -l < ".cache/incremental-manifest-prev/${MANIFEST_LOCALE}.jsonl") lines)"
          else
            echo "[incremental-manifest] no previous ${MANIFEST_LOCALE} manifest (first run or cache miss)"
          fi

      - name: Record disk/dist usage before build
        shell: bash
        run: |
          set -o pipefail
          echo '::group::Disk/dist usage BEFORE build'
          echo '[dist-metrics] df -B1 .'
          df -B1 .
          echo '[dist-metrics] du -sb dist'
          if [ -d dist ]; then
            du -sb dist
          else
            echo 'dist is absent before build'
          fi
          echo '[dist-metrics] find dist -type f | wc -l'
          if [ -d dist ]; then
            find dist -type f | wc -l
          else
            echo 0
          fi
          echo '::endgroup::'

      - name: Build (${{ matrix.locale == 'all' && 'all locales' || format('BUILD_LOCALE={0}', matrix.locale) }})
        id: build_step
        shell: bash
        env:
          # Same allocator setting as deploy.yml's build-locale job; it is
          # part of the memory measurement, not a canary-only optimization.
          MALLOC_ARENA_MAX: '2'
        run: |
          set -eo pipefail
          echo "::group::Build ${BUILD_VARIANT}"
          START=$(date +%s)

          # Host-memory sampler copied from deploy.yml's build-locale step.
          # MemAvailable is the host signal needed to distinguish a host-side
          # kill from a V8/build-memory-guard failure.
          ( end=$(( $(date +%s) + 14400 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              printf '[hostmem] '
              awk '/^(MemTotal|MemAvailable|MemFree|SwapFree|Dirty):/ {sub(/:/,"",$1); printf "%s=%dMB ", $1, $2/1024}' /proc/meminfo
              printf 'topRSS=%dMB\n' "$(ps -eo rss= --sort=-rss | head -1 | awk '{print int($1/1024)}')"
              sleep 10
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          BUILD_LOCALE_FOR_LOG="${BUILD_LOCALE:-all}"
          BUILD_LOG="/tmp/build-${BUILD_LOCALE_FOR_LOG}.log"
          npm run build:ci 2>&1 | tee "$BUILD_LOG"
          build_exit="${PIPESTATUS[0]}"
          END=$(date +%s)
          echo "::endgroup::"
          ELAPSED=$((END - START))
          echo "BUILD_ELAPSED_SECONDS=$ELAPSED" >> "$GITHUB_ENV"
          echo "wall_seconds=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "⏱️  ${BUILD_VARIANT} build wall-time: ${ELAPSED}s ($((ELAPSED/60))m$((ELAPSED%60))s)"
          exit "$build_exit"

      # Copied from deploy.yml's build-locale memory instrumentation. The
      # canary remains report-only: it does not open issues or publish output.
      - name: Read build memory report
        id: memguard
        if: always()
        shell: bash
        run: |
          set -o pipefail
          breach=''
          peak=''
          peak_anon=''
          avail=''
          headroom=''
          swap_free=''
          if [ -f /tmp/build-memory-peak.json ]; then
            breach=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.breach??""))' || true)
            peak=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakRssMb??""))' || true)
            peak_anon=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.peakAnonMb??""))' || true)
            avail=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minHostAvailMb??""))' || true)
            headroom=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minHostHeadroomMb??""))' || true)
            swap_free=$(node -e 'const r=require("/tmp/build-memory-peak.json");process.stdout.write(String(r.minSwapFreeMb??""))' || true)
            cat /tmp/build-memory-peak.json
          else
            echo '[memguard] no report: build did not close (host kill) or guard was not armed'
          fi
          {
            echo "breach=$breach"
            echo "peak_rss_mb=$peak"
            echo "peak_anon_mb=$peak_anon"
            echo "min_host_avail_mb=$avail"
            echo "min_host_headroom_mb=$headroom"
            echo "min_swap_free_mb=$swap_free"
          } >> "$GITHUB_OUTPUT"

      # Same [hostmem] sampler as deploy.yml's build-locale step. It is kept
      # beside the build here so a host-side OOM is distinguishable from a
      # build-memory-guard breach in this study workflow.
      - name: Build profile summary
        if: always()
        shell: bash
        run: |
          BUILD_LOG="/tmp/build-${BUILD_LOCALE:-all}.log"
          {
            echo '## Build profile markers'
            echo
            echo '| marker | detail |'
            echo '|---|---|'
            if [ -f "$BUILD_LOG" ]; then
              awk '
                /^\[profile-detail\]/ || /^\[phase-timing/ {
                  marker = $1
                  sub(/^\[/, "", marker)
                  sub(/\]$/, "", marker)
                  detail = $0
                  sub(/^\[[^]]+\][[:space:]]*/, "", detail)
                  gsub(/\|/, "&#124;", detail)
                  printf "| `%s` | %s |\n", marker, detail
                  found = 1
                }
                END {
                  if (!found) print "| _none_ | no profile markers emitted |"
                }
              ' "$BUILD_LOG"
            else
              echo "| _none_ | ${BUILD_LOG} was not produced |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Incremental manifest shadow report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MANIFEST_PREVIOUS: .cache/incremental-manifest-prev/${{ matrix.locale }}.jsonl
          MANIFEST_CURRENT: .cache/incremental-manifest/${{ matrix.locale }}.jsonl
        run: |
          set -o pipefail
          {
            echo '## Incremental manifest shadow report'
            echo
            if [ -f "$MANIFEST_PREVIOUS" ] && [ -f "$MANIFEST_CURRENT" ]; then
              node scripts/ci/incremental-manifest-report.mjs "$MANIFEST_PREVIOUS" "$MANIFEST_CURRENT"
            elif [ -f "$MANIFEST_CURRENT" ]; then
              echo "Previous: $MANIFEST_PREVIOUS (missing; first run or cache miss, no comparison)"
              echo "Current: $MANIFEST_CURRENT ($(wc -l < "$MANIFEST_CURRENT") JSONL lines)"
            else
              echo "Current: $MANIFEST_CURRENT (missing; build did not write a manifest)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The [hostmem] sampler is started in the build step, matching
      # deploy.yml's build-locale implementation. Keep this explicit marker in
      # the workflow next to the report so the source/consumer relationship is
      # obvious when the study workflow is reviewed.
      - name: Report dist size + timing
        if: always()
        env:
          PEAK_RSS_MB: ${{ steps.memguard.outputs.peak_rss_mb }}
          PEAK_ANON_MB: ${{ steps.memguard.outputs.peak_anon_mb }}
          MIN_HOST_AVAIL_MB: ${{ steps.memguard.outputs.min_host_avail_mb }}
          MIN_HOST_HEADROOM_MB: ${{ steps.memguard.outputs.min_host_headroom_mb }}
          MIN_SWAP_FREE_MB: ${{ steps.memguard.outputs.min_swap_free_mb }}
          MEMORY_BREACH: ${{ steps.memguard.outputs.breach }}
        run: |
          set -o pipefail
          echo '::group::Disk/dist usage AFTER build'
          echo '[dist-metrics] df -B1 .'
          df -B1 .
          echo '[dist-metrics] du -sb dist'
          if [ -d dist ]; then
            du -sb dist
          else
            echo 'dist is absent after build'
          fi
          echo '[dist-metrics] find dist -type f | wc -l'
          if [ -d dist ]; then
            find dist -type f | wc -l
          else
            echo 0
          fi
          echo '::endgroup::'
          dist_bytes='?'
          dist_files='0'
          if [ -d dist ]; then
            dist_bytes="$(du -sb dist | awk '{print $1}')"
            dist_files="$(find dist -type f | wc -l | tr -d ' ')"
          fi
          {
            echo "### ${BUILD_VARIANT} build summary"
            echo
            echo '| metric | value |'
            echo '|---|---|'
            echo "| wall-time | ${BUILD_ELAPSED_SECONDS:-?}s |"
            echo "| dist bytes (du -sb) | ${dist_bytes} |"
            echo "| dist files | ${dist_files} |"
            echo "| peak_rss_mb | ${PEAK_RSS_MB:-?} |"
            echo "| peak_anon_mb | ${PEAK_ANON_MB:-?} |"
            echo "| min_host_avail_mb | ${MIN_HOST_AVAIL_MB:-?} |"
            echo "| min_host_headroom_mb | ${MIN_HOST_HEADROOM_MB:-?} |"
            echo "| min_swap_free_mb | ${MIN_SWAP_FREE_MB:-?} |"
            echo "| breach | ${MEMORY_BREACH:-} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune to locale shard (filesystem-level, mirrors production push_shard)
        if: matrix.all_locales != true
        # The in-build BUILD_LOCALE filter only gates WriteCollector writes;
        # direct-fs.writeFileSync emitters (redirect/bridge/weather/alias) still
        # write every locale. This removes the non-owned locale output the same
        # way deploy.yml copies only dist/<locale> to each shard repo.
        run: node scripts/ci/prune-locale-shard.mjs dist

      - name: Validate locale shard output
        if: matrix.all_locales != true
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      - name: Hash-manifest the dist (equivalence check)
        run: node scripts/ci/dist-hash-manifest.mjs dist "/tmp/manifest-${{ matrix.locale }}.txt"
      - name: Upload build manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.locale }}
          path: /tmp/manifest-${{ matrix.locale }}.txt
          retention-days: 1

      - name: Extract build markers
        if: always()
        env:
          MARKER_LOCALE: ${{ matrix.locale }}
          MARKER_VARIANT: ${{ matrix.variant }}
          BUILD_WALL_SECONDS: ${{ steps.build_step.outputs.wall_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_LOCALE="${BUILD_LOCALE:-all}"
          BUILD_LOG="/tmp/build-${BUILD_LOCALE}.log"
          MARKER_FILE="/tmp/markers-${MARKER_LOCALE}-${MARKER_VARIANT}.txt"

          strip_ansi() {
            perl -pe 's/\e\[[0-?]*[ -\/]*[@-~]//g'
          }

          {
            echo "build-log=${BUILD_LOG}"
            echo "wall-time-build=${BUILD_WALL_SECONDS:-?}s"
            if [ -f "$BUILD_LOG" ]; then
              strip_ansi < "$BUILD_LOG" \
                | grep -E '^\[(mem|jobs-seo-profile|incremental-manifest|post-walk|jobs-seo-reuse)' \
                || true
            else
              echo "[markers] build log missing: ${BUILD_LOG}"
            fi
          } > "$MARKER_FILE"

          memory_fields() {
            awk -v needle="$1" '
              index($0, needle) {
                heap = "?";
                rss = "?";
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^heapUsed=/) heap = $i;
                  if ($i ~ /^rss=/) rss = $i;
                }
                printf "%s / %s", heap, rss;
                found = 1;
                exit;
              }
              END { if (!found) print "?" }
            ' "$MARKER_FILE"
          }

          memory_rss() {
            awk -v needle="$1" '
              index($0, needle) {
                for (i = 1; i <= NF; i++) if ($i ~ /^rss=/) { print $i; found = 1; exit }
              }
              END { if (!found) print "?" }
            ' "$MARKER_FILE"
          }

          profile_seconds() {
            awk -v category="$1" '
              $1 == "[jobs-seo-profile]" && $2 == category {
                printf "%.2fs", $4 / 1000;
                found = 1;
                exit;
              }
              END { if (!found) print "?" }
            ' "$MARKER_FILE"
          }

          active_memory="$(memory_fields 'jobsSeoPages: after-active-pages')"
          release_rss="$(memory_rss 'jobsSeoPages: after corpus-release')"
          previous_bridge="$(profile_seconds 'previous-slug-bridge')"
          previous_bridge_legacy="$(profile_seconds 'previous-slug-bridge-legacy-ti')"
          cross_locale_bridge="$(profile_seconds 'cross-locale-active-bridge')"
          manifest_cost="$(sed -nE 's/.*phases_ms=.*manifest:([^, ]+).*/\1ms/p' "$MARKER_FILE" | tail -1)"
          manifest_cost="${manifest_cost:-?}"

          {
            echo "### Build markers — ${MARKER_LOCALE}/${MARKER_VARIANT}"
            echo
            echo '| metric | value |'
            echo '|---|---|'
            echo "| wall-time build | ${BUILD_WALL_SECONDS:-?}s |"
            echo "| after-active-pages heapUsed/rss | ${active_memory} |"
            echo "| after corpus-release rss | ${release_rss} |"
            echo "| previous-slug-bridge total | ${previous_bridge} |"
            echo "| previous-slug-bridge-legacy-ti total | ${previous_bridge_legacy} |"
            echo "| cross-locale-active-bridge total | ${cross_locale_bridge} |"
            echo "| incremental manifest cost | ${manifest_cost} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build markers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-markers-${{ matrix.locale }}-${{ matrix.variant }}-${{ github.run_id }}
          path: /tmp/markers-${{ matrix.locale }}-${{ matrix.variant }}.txt
          retention-days: 14
          if-no-files-found: error

  # ── Classic monolith build (all 4 locales) from the SAME prep snapshot ──
  # Reference for the equivalence check. Same data + same wall-clock window as
  # the shards (both start right after prep) ⇒ no time-variance. NO BUILD_LOCALE.
  monolith:
    needs: [matrix-setup, prep]
    if: inputs.compare_monolith == true && inputs.all_locales != true && needs.matrix-setup.outputs.variant_count == '1'
    name: monolith (${{ needs.matrix-setup.outputs.single_variant }})
    runs-on: ubuntu-latest
    env:
      SEQUENTIAL_PROFILE: ${{ github.event.inputs.parallel_plugins == 'true' && '' || '1' }}
      BUILD_PROFILE: '1'
      FAST_BUILD: ${{ github.event.inputs.fast_build == 'true' && '1' || '' }}
      POST_WALK_WORKERS: '2'
      JOBS_SEO_PROFILE_PHASES: '1'
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
      JOBS_SEO_RETENTION_PROBE: ${{ github.event.inputs.retention_probe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply variant environment
        env:
          VARIANT_ENV_JSON: ${{ needs.matrix-setup.outputs.single_env_json }}
        run: |
          set -euo pipefail
          printf '%s' "$VARIANT_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      # Lockstep con deploy.yml e col job build-locale qui sopra: il monolite
      # (4 locali in un processo) e' il profilo di memoria peggiore dei tre.
      # Script unico: scripts/ci/grow-build-swap.sh.
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash scripts/ci/grow-build-swap.sh
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: |
          if test -f scripts/load-rc-env.mjs; then
            node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
          else
            echo "⚠️ load-rc-env.mjs is absent in this checkout (non-fatal)"
          fi
      - name: Download prepared snapshot
        uses: actions/download-artifact@v7
        with:
          name: prepared-snapshot
          path: /tmp/snapshot
      - name: Restore prepared snapshot (identical data to the shards)
        run: |
          set -eo pipefail
          tar -xzf /tmp/snapshot/prepared-snapshot.tgz -C .
          if [ -f data/jobs.json ]; then
            echo "✓ data/jobs.json restored"
          else
            echo "✖ missing"
            exit 1
          fi
      - name: Cache per-job OG images
        uses: actions/cache/restore@v5
        with:
          path: .cache/og-jobs
          key: og-jobs-${{ runner.os }}-${{ hashFiles('build-plugins/jobOgImagesPlugin.ts', 'public/fonts/Roboto-*.ttf', 'data/company-logos-manifest.json') }}
          restore-keys: |
            og-jobs-${{ runner.os }}-

      - name: Build monolith (all 4 locales, no BUILD_LOCALE)
        run: npm run build:ci
      - name: Hash-manifest the full monolith dist
        run: node scripts/ci/dist-hash-manifest.mjs dist /tmp/manifest-monolith.txt
      - name: Upload monolith manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-monolith
          path: /tmp/manifest-monolith.txt
          retention-days: 1

  # ── Equivalence gate: recomposed 4 shards === monolith (byte/sha256) ──
  compare:
    needs: [matrix-setup, build-locale, monolith]
    if: inputs.compare_monolith == true && inputs.all_locales != true && needs.matrix-setup.outputs.variant_count == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (compare script)
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download all manifests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/manifests
          pattern: manifest-*
          merge-multiple: false
      - name: Compare recomposed matrix === monolith
        run: |
          set -eo pipefail
          MONO=/tmp/manifests/manifest-monolith/manifest-monolith.txt
          shards=()
          for loc in it en de fr; do
            f="/tmp/manifests/manifest-$loc/manifest-$loc.txt"
            [ -f "$f" ] && shards+=("$f")
          done
          echo "monolith: $MONO"; echo "shards:${shards[*]}"
          node scripts/ci/compare-dist-manifests.mjs "$MONO" "${shards[@]}"
