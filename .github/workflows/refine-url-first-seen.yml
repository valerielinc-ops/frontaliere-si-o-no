name: Refine url-first-seen via GSC

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file write, no PR)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      window_days:
        description: 'GSC lookback window (days)'
        required: false
        default: '480'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install google-auth-library (script-only dep)
        run: npm i google-auth-library --no-save

      - name: Materialize SA JSON
        env:
          SA_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret GSC_SERVICE_ACCOUNT_JSON not set. Add SA JSON (Firebase SA that doubles as GSC) to repo secrets."
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/sa.json
          chmod 600 /tmp/sa.json

      - name: Run GSC refinement
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          FLAGS="--window-days=${{ inputs.window_days }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "Running: node scripts/refine-url-first-seen-via-gsc.mjs $FLAGS"
          node scripts/refine-url-first-seen-via-gsc.mjs $FLAGS

      - name: Cleanup SA
        if: always()
        run: rm -f /tmp/sa.json

      - name: Open PR if data changed
        if: inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet data/url-first-seen.json; then
            echo "No diff in data/url-first-seen.json — nothing to PR."
            exit 0
          fi
          BRANCH="chore/url-first-seen-refresh-${GITHUB_RUN_ID}"
          git config user.name "url-first-seen-bot"
          git config user.email "url-first-seen-bot@frontaliereticino.ch"
          git checkout -b "$BRANCH"
          git add data/url-first-seen.json
          git commit -m "chore(grace-window): GSC refinement (run ${GITHUB_RUN_ID})"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(grace-window): GSC refinement (run ${GITHUB_RUN_ID})" \
            --body "$(cat <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - GSC API refinement applicato a \`data/url-first-seen.json\`. Vedi step log per stats (URL refinati, ancora a fallback, finestra GSC effettiva).

          ## Non implementato (ancora)
          - Niente — chore data update. Per re-tuning della logica vedi script + workflow su \`main\`.
          EOF
          )"
