name: Refine url-first-seen via GSC

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file write, no PR)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      window_days:
        description: 'GSC lookback window (days)'
        required: false
        default: '480'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Nessun uso della git history: il job legge solo il working tree
          # (`git diff --quiet data/url-first-seen.json`), poi `checkout -b`
          # + commit + push di un branch FRESCO (PR, mai push su main, nessun
          # rebase né `git show <commit>:<file>`). `fetch-depth: 1` (shallow):
          # solo il working tree HEAD, niente commit-graph history (~11GB .git
          # mai scaricati) e niente partial clone → niente lazy-fetch che possa
          # stallare (stessa classe del Checkout di `pr-review-loop.yml`, dove un
          # lazy-fetch da 11min mangiava il timeout). Prima era `fetch-depth: 0 +
          # filter: blob:none` (cargo-cult: nessuna capacità history serviva).
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install google-auth-library (script-only dep)
        run: npm i google-auth-library --no-save

      - name: Materialize SA JSON
        env:
          SA_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret GSC_SERVICE_ACCOUNT_JSON not set. Add SA JSON (Firebase SA that doubles as GSC) to repo secrets."
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/sa.json
          chmod 600 /tmp/sa.json

      - name: Run GSC refinement
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_WINDOW_DAYS: ${{ inputs.window_days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS=("--window-days=$INPUT_WINDOW_DAYS")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          echo "Running: node scripts/refine-url-first-seen-via-gsc.mjs ${FLAGS[*]}"
          node scripts/refine-url-first-seen-via-gsc.mjs "${FLAGS[@]}"

      # Load GITHUB_PAT (Firebase Remote Config) into $GITHUB_ENV. RC reachability
      # requires the *Firebase* SA (secrets.FIREBASE_SERVICE_ACCOUNT_JSON), the
      # same credential every other RC-loading workflow uses (sync-gsc-orphans,
      # traffic-scheduler, deploy, …). The GSC SA above (GSC_SERVICE_ACCOUNT_JSON)
      # is a distinct, GSC-only service account and is NOT guaranteed to have the
      # Firebase Remote Config viewer role — using it here left load-rc-env unable
      # to read GITHUB_PAT, so the #1114 fix never actually worked (issue #1141).
      # Needed because a `gh pr create` authenticated by secrets.GITHUB_TOKEN is
      # rejected by GitHub anti-recursion ("GitHub Actions is not permitted to
      # create pull requests") → the old PR step failed red on every data diff and
      # the grace-window/GSC refresh never landed (issue #1114). The PAT creates
      # the PR as a real user, which is permitted.
      - name: Materialize Firebase SA (Remote Config)
        if: inputs.dry_run == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON not set — cannot load GITHUB_PAT from Remote Config; the PR step would fail (issue #1114/#1141)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json

      - name: Load RC secrets (GITHUB_PAT)
        if: inputs.dry_run == 'false'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: node scripts/load-rc-env.mjs

      # App installation token = primary push/PR identity (re-triggers review/CI;
      # GITHUB_TOKEN would not, anti-recursion). Uses Actions secrets APP_ID/
      # APP_PRIVATE_KEY (not Firebase), so it works even after Cleanup SA. Falls
      # back to env.GITHUB_PAT. B2b tail migration.
      - name: Mint App token (primary identity, PAT fallback)
        if: inputs.dry_run == 'false'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Cleanup SA
        if: always()
        run: rm -f /tmp/sa.json /tmp/firebase-sa.json

      - name: Open PR if data changed
        if: inputs.dry_run == 'false'
        env:
          # GITHUB_PAT is loaded into $GITHUB_ENV by the RC step above (Firebase
          # RC, NOT an Actions secret — `secrets.GH_PAT` does not exist). Used
          # for BOTH the branch push and `gh pr create`: a PR created with
          # secrets.GITHUB_TOKEN is blocked by anti-recursion (issue #1114).
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          if git diff --quiet data/url-first-seen.json; then
            echo "No diff in data/url-first-seen.json — nothing to PR."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No App/PAT token (Firebase RC / App creds) — cannot create PR (a secrets.GITHUB_TOKEN PR is blocked by anti-recursion). Check APP_ID/APP_PRIVATE_KEY or Firebase SA / RC availability."
            exit 1
          fi
          BRANCH="chore/url-first-seen-refresh-${GITHUB_RUN_ID}"
          git config user.name "url-first-seen-bot"
          git config user.email "url-first-seen-bot@frontaliereticino.ch"
          git checkout -b "$BRANCH"
          git add data/url-first-seen.json
          git commit -m "chore(grace-window): GSC refinement (run ${GITHUB_RUN_ID})"
          # Push with the PAT in the URL: the credential persisted by
          # actions/checkout is the GITHUB_TOKEN, which cannot open the PR below.
          # `-c http.https://github.com/.extraheader=` azzera l'header GITHUB_TOKEN
          # persistito da checkout, che altrimenti sovrascrive il token in URL → il
          # push autenticherebbe come github-actions[bot] e i check della chore-PR
          # finirebbero in `action_required` (approvazione manuale).
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(grace-window): GSC refinement (run ${GITHUB_RUN_ID})" \
            --body "$(cat <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - GSC API refinement applicato a \`data/url-first-seen.json\`. Vedi step log per stats (URL refinati, ancora a fallback, finestra GSC effettiva).

          ## Non implementato (ancora)
          Nessuno — chore data update, nessun residuo. Il re-tuning della logica vive nello script e nel workflow su \`main\`, ed è un task a sé.
          EOF
          )"
