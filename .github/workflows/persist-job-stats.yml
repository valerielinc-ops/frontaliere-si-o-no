name: Persist Job Stats History

on:
  workflow_dispatch:
  # Runs after each deploy completes — deploy.yml dispatches this via trigger-deploy-stats
  # Also runs on cron as safety net (in case dispatch is missed)
  schedule:
    - cron: '15 6,18 * * *'  # 07:15 and 19:15 CET (after typical deploy times)

permissions:
  contents: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: persist-job-stats
  cancel-in-progress: false

jobs:
  persist-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Assemble jobs dataset (with stats)
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Check job dataset churn
        id: churn
        continue-on-error: true
        run: node scripts/check-job-dataset-churn.mjs

      - name: Open issue for anomalous dataset churn
        if: steps.churn.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(jq 'length' data/job-dataset-churn-issues.json)
          echo "Found $count churn anomalies."

          for i in $(seq 0 $((count - 1))); do
            date=$(jq -r ".[$i].date" data/job-dataset-churn-issues.json)
            metric=$(jq -r ".[$i].metric" data/job-dataset-churn-issues.json)
            observed=$(jq -r ".[$i].observed" data/job-dataset-churn-issues.json)
            baselineMean=$(jq -r ".[$i].baselineMean" data/job-dataset-churn-issues.json)
            baselineStddev=$(jq -r ".[$i].baselineStddev" data/job-dataset-churn-issues.json)
            threshold=$(jq -r ".[$i].threshold" data/job-dataset-churn-issues.json)
            baselineDays=$(jq -r ".[$i].baselineDays" data/job-dataset-churn-issues.json)
            hosts=$(jq -r ".[$i].topHosts | map(\"\\(.host) (\\(.count))\") | join(\", \")" data/job-dataset-churn-issues.json)

            # issueTitle is stable for the same metric + dominant-host hash, so a
            # multi-day event becomes recurrence comments on one open issue.
            # The guard keeps date-based titles for unattributed anomalies.
            title=$(jq -r ".[${i}].issueTitle" data/job-dataset-churn-issues.json)
            body=$(cat <<EOF
          Automated churn guard flagged **${metric}** on **${date}**: **${observed}**
          vs a trailing ${baselineDays}-day baseline of mean=${baselineMean},
          stddev=${baselineStddev} (threshold ${threshold}).

          Top host contributors: ${hosts:-n/a}

          Source: \`data/jobs-stats-history.json\`
          Detection script: \`scripts/check-job-dataset-churn.mjs\`
          Workflow run: ${GITHUB_SERVER_URL:-https://github.com}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID:-}

          Triage:
          1. Confirm the dominant host above is a real crawler run, not a misclassification.
          2. If a single source is dumping/retracting pages in bulk, check its parser for a selector or dedup regression.
          3. If legitimate (e.g. a source republished its whole board), close as expected.
          EOF
          )

            node scripts/lib/github-issue-creator.mjs \
              --title "$title" \
              --description "$body" \
              --priority 3 \
              --label funnel-seo \
              --workflow "${{ github.workflow }}"
          done

      - name: Commit and push stats history
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add data/jobs-stats-history.json data/jobs-keys-snapshot.json
          # job-canton-pins.json is gitignored (like all-known-job-slugs.json) but
          # force-tracked: it persists the per-job canton freeze that kills URL
          # drift (assemble-jobs-dataset.mjs writes it on every run). -f stages it
          # past the ignore rule.
          git add -f data/job-canton-pins.json 2>/dev/null || true
          git diff --cached --quiet && echo "No stats changes to commit" && exit 0
          git commit -m "📈 Auto-update job board stats history"
          # Centralized rebase-retry helper survives concurrent pushes from
          # other data-refresh workflows. On rebase conflict, regenerate the
          # stats artifacts on the rebased base (the assemble script is
          # deterministic given the latest jobs.json + Firestore stats).
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/assemble-jobs-dataset.mjs --stats && git add data/jobs-stats-history.json data/jobs-keys-snapshot.json && (git add -f data/job-canton-pins.json 2>/dev/null || true)"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `${{ github.workflow }}`, non il letterale "Persist Job Stats": il
          # reconciler estrae il nome dal titolo e fa `gh run list -w <nome>`, e
          # il `name:` di questo file è "Persist Job Stats History". Col
          # letterale corto il lookup non risolveva nessun run e la issue restava
          # aperta per sempre pur SEMBRANDO coperta (#5437). L'interpolazione
          # rende la deriva impossibile anche a un futuro rename del `name:`.
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "Stats history persistence failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
