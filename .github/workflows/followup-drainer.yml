name: Follow-up drainer (queue → agent:fix, no-Claude)

# Drena la coda dei follow-up `agent:fix-queued` UNO alla volta, promuovendo a
# `agent:fix` solo quando lo slot issue-fix è libero → la run promossa è l'unica
# pending → mai cancellata-in-coda. Fix della starvation osservata 2026-06-04
# (slot concurrency globale issue-fix + cancel:false → 60% fix-run follow-up
# cancellate, ~20 issue stuck). Rescue+park degli agent:fix orfani (run morta,
# nessuna PR) per terminazione autonoma senza intervento umano.
# ZERO Claude: tutto deterministico (scripts/ci/followup-drainer.mjs + gh).

on:
  schedule:
    - cron: '*/20 * * * *' # drena la coda ~ogni 20min
  workflow_run:
    workflows: ['Issue fix (Claude → PR)'] # appena un fix finisce, promuovi il prossimo
    types: [completed]
  workflow_dispatch:

# Una sola run drainer alla volta: evita race di doppia-promozione sullo slot.
concurrency:
  group: followup-drainer
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drain:
    runs-on: ubuntu-latest
    # NON alzare questo cap: il timeout #5162 era il Checkout, non il drain (che
    # gira in ~5s). Deve restare uguale a JOB_TIMEOUT_MINUTES qui sotto —
    # `timeout-minutes` non accetta il context `env`, quindi il valore è ripetuto.
    timeout-minutes: 6
    env:
      JOB_TIMEOUT_MINUTES: 6
    steps:
      # Deadline assoluta del job: è il riferimento che mancava allo script per
      # sapere quanto tempo gli lascia il setup. Vedi scripts/ci/lib/run-budget.mjs.
      - name: Export job deadline
        run: echo "CI_JOB_DEADLINE_EPOCH=$(( $(date +%s) + ${{ env.JOB_TIMEOUT_MINUTES }} * 60 ))" >> "$GITHUB_ENV"

      # Il Checkout è la causa del timeout #5162: nel run 31037187242 il
      # `git fetch --depth=1` ha girato 6m10s (19:03:48 → 19:09:58) prendendosi
      # l'INTERO budget di 6 minuti — il drain non è mai partito. Il drain vero
      # costa 5 secondi (run 31045219116): il budget di questo job è, di fatto,
      # tutto Checkout.
      #
      # Distribuzione misurata su 16 run riusciti: 102s → 249s (mediana ~113s).
      # Il fallimento a 370s è quindi una CODA del fetch, non un trend — e questo
      # cap la separa dal caso normale. 5 minuti stanno sopra il massimo osservato
      # (249s) con margine, quindi nessun run sano viene toccato, e sotto il cap
      # del job, il che cambia l'esito da `cancelled` a `failure`: un job
      # `cancelled` non fa mai scattare gli `if: failure()` — è esattamente il
      # buco che scan-job-timeouts.mjs esiste per tappare — mentre un `failure`
      # si diagnostica da solo. Il tick successivo (cron 20min + workflow_run a
      # ogni fine di issue-fix) recupera comunque: questo job è ridondante di
      # proposito, un run perso non perde lavoro.
      #
      # NIENTE `filter: blob:none` qui, ed è una scelta MISURATA, non una svista:
      # con `fetch-depth: 1` il fetch è già bulk e il partial clone è un
      # peggioramento netto (+125% su tests.yml, vedi la nota in
      # pr-review-loop.yml, che cita anche uno stallo da 11 minuti). Paga solo
      # con `fetch-depth: 0` — ed è per questo che pr-autorebase.yml lo usa e
      # questo no.
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; promozione inerte (un labeled da GITHUB_TOKEN non triggererebbe issue-fix)."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Promotion identity = GitHub App installation token: its `labeled`
      # agent:fix DOES trigger issue-fix (App tokens are not subject to the
      # GITHUB_TOKEN anti-recursion). Sets env.APP_TOKEN; missing → env.GITHUB_PAT
      # fallback. issue-fix sender gate already allowlists the App slug (#2881).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT. Scatta solo se né App né PAT.
      - name: Alert token-down (dedup, zero-Claude)
        if: env.APP_TOKEN == '' && env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Drain follow-up queue (deterministic, no Claude)
        env:
          # App (o PAT) OBBLIGATORIO: il `labeled` agent:fix deve triggerare
          # issue-fix e passare il gate `sender` (GITHUB_TOKEN no, anti-ricorsione;
          # l'App slug è allowlistato in #2881). Senza token → exit warning (inerte).
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Nessun token usabile (App/PAT assenti) → drainer inerte (promozione non triggererebbe issue-fix)."
            exit 0
          fi
          node scripts/ci/followup-drainer.mjs
