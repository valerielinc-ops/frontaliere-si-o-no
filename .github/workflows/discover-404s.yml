name: Discover 404s via URL Inspection

# Proactively inspects a rotating batch of known URLs (active job paths,
# previous slugs, compat paths) using the GSC URL Inspection API to detect
# 404 status changes. URLs that Google reports as NOT_FOUND/SOFT_404 are
# appended to the sharded `data/seo-404-compat/` store so the build pipeline
# generates a soft-landing page. URLs that recovered are dropped.
#
# This compensates for Google's lack of a Coverage-drilldown API — the only
# programmatic way to discover unknown 404 URLs would be via the UI CSV
# export. By rotating through our known URL universe we catch every
# 404 transition without manual intervention.
#
# A second, complementary producer runs in the same job: the Cloudflare edge
# 404 sweep (discover-404s-via-cloudflare.mjs), which surfaces 404 URLs we DON'T
# already track — every real edge hit, human + bot, locale shards included,
# zero GSC quota. Both producers append to the same accumulator and share the
# prune + commit steps below.

on:
  schedule:
    # Daily at 02:15 UTC (off-peak, avoids overlap with sync-gsc-orphans
    # at 14:30 UTC which shares the URL Inspection quota).
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'URLs to inspect this run (default 1500, quota cap 2000/day)'
        required: false
        type: string
        default: '1500'
      min_age_days:
        description: 'Skip URLs inspected more recently than this many days'
        required: false
        type: string
        default: '14'
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: false

# Serialize with other GSC-API workflows to avoid sharing/exhausting the
# URL Inspection quota simultaneously.
concurrency:
  group: gsc-url-inspection
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # Primary identity for the deploy dispatch below = GitHub App installation
      # token (`frontaliere-automation[bot]`): auto-mints, no expiry babysit, and
      # its dispatch re-triggers deploy.yml just like the PAT (no GITHUB_TOKEN
      # anti-recursion). Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run URL Inspection sweep
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1500' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '14' }}
        run: |
          node scripts/discover-404s-via-inspection.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Run Cloudflare edge 404 sweep
        # Third producer (#1803 — script merged but never wired to CI until
        # now). CF edge analytics records EVERY real 404 at the edge (human +
        # bot, /en /de /fr shards included, no GSC quota), unlike URL
        # Inspection which only re-checks URLs we already track. The script
        # only APPENDS candidates (assets/infra filtered, min-count 2); the
        # prune step below drops whatever the resolver can't map, keeping
        # tests/search-console-compat.test.ts green. The CF analytics lib
        # filters requestSource=eyeball by default (#1842), so Worker-internal
        # phantom rows (edgeWorkerCacheAPI) can never reach the accumulator.
        # continue-on-error: best-effort enrichment — a CF API hiccup must not
        # kill the GSC sweep's commit. CF_API_TOKEN arrives from the
        # "Load RC secrets" step above (Firebase Remote Config → GITHUB_ENV).
        continue-on-error: true
        run: |
          node scripts/discover-404s-via-cloudflare.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Prune non-resolving 404-compat paths (keep test invariant green)
        if: ${{ inputs.dry_run != true }}
        # Same gate as sync-gsc-orphans: the sweep appends raw NOT_FOUND/SOFT_404
        # URLs; any the resolver can't map would break the committed-snapshot
        # test → main red → drain frozen. Assemble jobs first (resolver needs
        # data/jobs.json), then drop non-resolving paths before commit.
        run: |
          node scripts/assemble-jobs-dataset.mjs
          npx tsx scripts/prune-404-compat-paths.ts

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage only the files this workflow is responsible for.
          # seo-404-compat is sharded across data/seo-404-compat/part-*.json (#2988).
          git add data/seo-404-compat data/inspection-state.json || true

          if git diff --cached --quiet; then
            echo "📭 No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: discover 404s via URL Inspection sweep

          Automated sweep via GSC URL Inspection API. Paths flagged as
          NOT_FOUND/SOFT_404 are added to the seo-404-compat store so
          the next build generates a soft-landing page at those URLs.
          URLs that recovered are dropped from compat."

          # Centralized rebase-retry helper survives concurrent pushes from
          # other workflows. The sharded `data/seo-404-compat/` store is shared
          # with sync-gsc-orphans.yml and a handful of slug-maintenance scripts,
          # so a rebase conflict on a shard's `paths` is possible (run 25716042219).
          # The in-place resolver does a 3-way set merge:
          #   final = upstream ∪ (local − base) − (base − local)
          # `data/inspection-state.json` is single-writer (this workflow);
          # if it ever conflicts the resolver fails loud rather than masking
          # a real bug.
          bash scripts/lib/git-push-with-retry.sh \
            --in-place-resolver-cmd "node scripts/lib/resolve-404-compat-conflict.mjs && git add -A"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # Re-mint immediately before the late dispatch below: the URL Inspection
      # sweep + Cloudflare sweep above can run up to ~64min (this job's actual
      # observed duration), longer than the App installation token's ~1hr TTL
      # by the time we reach this step on a slow run. The early mint (~90 lines
      # up) can already be expired here, and the `env.APP_TOKEN || env.GITHUB_PAT`
      # fallback below only covers unset/empty — an expired-but-non-empty
      # APP_TOKEN short-circuits the `||` and 401s trigger-deploy.sh (#3320).
      # Re-minting fresh here restores full TTL headroom for the dispatch.
      - name: Re-mint App token (fresh, avoids TTL expiry after long sweep)
        if: steps.commit.outputs.has_changes == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Trigger deploy if compat changed
        if: steps.commit.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          # Only trigger a deploy if the compat store itself changed — state-
          # file-only updates don't affect the built site.
          COMPAT_CHANGED=$(git diff HEAD~1 --name-only -- data/seo-404-compat | wc -l)
          if [ "$COMPAT_CHANGED" -gt 0 ]; then
            echo "🚀 Compat file updated — triggering deploy"
            # Hard-fail by design (no `|| true`, #6936): a failed dispatch
            # here fails the job, caught by "Report failure to GitHub Issues"
            # below — that GitHub issue IS this caller's recovery net
            # (auto-triage picks it up), so silencing it would just hide a
            # real deploy gap.
            bash scripts/lib/trigger-deploy.sh
          else
            echo "📝 Only state file changed — no deploy needed"
          fi
        env:
          # trigger-deploy.sh resolves TOKEN="${GITHUB_PAT:-${GH_TOKEN:-}}" — override
          # with the App token when minted (primary identity), PAT otherwise (#2861
          # item 1). GITHUB_PAT itself è caricato in $GITHUB_ENV dallo step
          # "load-rc-env" (Firebase RC, non un Actions secret — `secrets.GH_PAT` non
          # esiste). NON shadoware con secrets.*: altrimenti trigger-deploy.sh gira
          # con token vuoto e il deploy non parte (cfr. #878).
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
