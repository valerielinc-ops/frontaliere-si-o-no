name: Discover 404s via URL Inspection

# Proactively inspects a rotating batch of known URLs (active job paths,
# previous slugs, compat paths) using the GSC URL Inspection API to detect
# 404 status changes. URLs that Google reports as NOT_FOUND/SOFT_404 are
# appended to the sharded `data/seo-404-compat/` store so the build pipeline
# generates a soft-landing page. URLs that recovered are dropped.
#
# This compensates for Google's lack of a Coverage-drilldown API — the only
# programmatic way to discover unknown 404 URLs would be via the UI CSV
# export. By rotating through our known URL universe we catch every
# 404 transition without manual intervention.
#
# A second, complementary producer runs in the same job: the Cloudflare edge
# 404 sweep (discover-404s-via-cloudflare.mjs), which surfaces 404 URLs we DON'T
# already track — every real edge hit, human + bot, locale shards included,
# zero GSC quota. Both producers append to the same accumulator and share the
# prune + PR publishing steps below.

on:
  schedule:
    # Daily at 02:15 UTC (off-peak, avoids overlap with sync-gsc-orphans
    # at 14:30 UTC which shares the URL Inspection quota).
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'URLs to inspect this run (default 1500, quota cap 2000/day)'
        required: false
        type: string
        default: '1500'
      min_age_days:
        description: 'Skip URLs inspected more recently than this many days'
        required: false
        type: string
        default: '14'
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: true

# Serialize with other GSC-API workflows to avoid sharing/exhausting the
# URL Inspection quota simultaneously.
concurrency:
  group: gsc-url-inspection
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  DATA_REFRESH_BRANCH: chore/discover-404s-via-url-inspection

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Run URL Inspection sweep
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1500' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '14' }}
        run: |
          node scripts/discover-404s-via-inspection.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Run Cloudflare edge 404 sweep
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        # Third producer (#1803 — script merged but never wired to CI until
        # now). CF edge analytics records EVERY real 404 at the edge (human +
        # bot, /en /de /fr shards included, no GSC quota), unlike URL
        # Inspection which only re-checks URLs we already track. The script
        # only APPENDS candidates (assets/infra filtered, min-count 2); the
        # prune step below drops whatever the resolver can't map, keeping
        # tests/search-console-compat.test.ts green. The CF analytics lib
        # filters requestSource=eyeball by default (#1842), so Worker-internal
        # phantom rows (edgeWorkerCacheAPI) can never reach the accumulator.
        # continue-on-error: best-effort enrichment — a CF API hiccup must not
        # kill the GSC sweep's commit. CF_API_TOKEN arrives from the
        # "Load RC secrets" step above (Firebase Remote Config → GITHUB_ENV).
        continue-on-error: true
        run: |
          node scripts/discover-404s-via-cloudflare.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Prune non-resolving 404-compat paths (keep test invariant green)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        # Same gate as sync-gsc-orphans: the sweep appends raw NOT_FOUND/SOFT_404
        # URLs; any the resolver can't map would break the committed-snapshot
        # test → main red → drain frozen. The resolver uses committed static
        # registries, so do not assemble the ~400 MB crawler-slice corpus here;
        # this writer only needs the compatibility-store prune.
        run: npx --no-install tsx scripts/prune-404-compat-paths.ts

      # The sweeps can take over an hour; mint immediately before publishing so
      # the App token is fresh. The Remote Config PAT remains the fallback.
      - name: Mint App token for refresh PR (PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Open PR with discovered 404 data
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/discover-404s-refresh-pr-body.md"
          cat > "$body" <<EOF
          Automated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Pubblica i path 404 compatibili e lo stato URL Inspection sul branch stabile `${DATA_REFRESH_BRANCH}`; il required check `vitest (unit + integration)` valida i dati prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — questa PR contiene tutti i risultati e lo stato del ciclo di scansione.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/seo-404-compat \
            --path data/inspection-state.json \
            --branch "$DATA_REFRESH_BRANCH" \
            --commit-message "chore(data): discover 404s via URL Inspection sweep" \
            --title "chore(data): refresh discovered 404 compatibility paths" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
