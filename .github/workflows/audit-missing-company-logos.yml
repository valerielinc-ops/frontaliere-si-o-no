name: Audit Missing Company Logos (weekly)

# Trova le aziende per cui services/jobDataNormalization.ts::resolveCompanyLogoUrl()
# ritorna `null` per TUTTI i loro annunci — quelle pagine mostrano il badge
# iniziali colorato invece di un logo reale (vedi
# scripts/audit-missing-company-logos.mjs per il dettaglio). Distinto da
# verify-company-logos-weekly.yml, che verifica URL di logo GIA' assegnati ma
# rotti: qui nessun logo e' mai stato assegnato.
#
# Scrive data/company-logos-missing.json e, se ci sono aziende senza logo,
# apre/aggiorna UNA issue con l'elenco — la riprende il loop autonomo del
# repo (issue-triage -> agent:fix-queued -> issue-fix -> PR -> pr-review-loop
# -> auto-merge).
#
# Runs every Sunday 05:15 UTC (poco dopo verify-company-logos-weekly, 04:00).

on:
  schedule:
    - cron: '15 5 * * 0' # Every Sunday 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Nessun blocco sparse-checkout: NON e' un'omissione. scripts/audit-missing-company-logos.mjs
      # importa scripts/lib/github-issue-creator.mjs (per --report-issue), la cui
      # closure statica tocca 7 bucket (data/all-known-job-slugs/, data/jobs-ai-cache.json,
      # data/jobs/, data/orphan-enriched-data/, data/seo-404-compat/, public/data/,
      # public/images/) — e' quell'import a rendere il job pieno per costruzione, non
      # verify-company-logos.mjs (che non importa quell'utility come modulo). Verificato con
      # `node scripts/ci/apply-checkout-profiles.mjs --dry-run --only audit-missing-company-logos.yml`
      # → "workflow modificati: 0, peso escluso in media per job: 0 MB su 6829 MB".
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          filter: blob:none
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # --report-issue: calcola il report E apre/aggiorna l'issue nello
      # stesso step (createGithubIssue dedupe sul titolo stabile, quindi run
      # ripetute commentano sulla issue canonica invece di duplicarla).
      - name: Audit missing company logos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/audit-missing-company-logos.mjs --report-issue

      - name: Commit + push missing-logos report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-logos-missing.json
          if git diff --cached --quiet; then
            echo "No missing-logo changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh missing-company-logos report"

          # Rigenera SENZA --report-issue: un retry su conflitto di rebase non
          # deve riaprire/ricommentare la issue una seconda volta.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "npx tsx scripts/audit-missing-company-logos.mjs || true; git add data/company-logos-missing.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
