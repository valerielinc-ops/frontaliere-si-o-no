name: Translate Pending Jobs

on:
  workflow_run:
    workflows: ["Orchestrate Job Crawlers"]
    types: [completed]
  schedule:
    - cron: '0 7 * * *'     # Daily: housekeeping + translate (replaces cleanup-stale-jobs cron)
    - cron: '0 13 * * *'    # Midday: translate after 08:00 orchestration
    - cron: '0 1 * * *'     # Midnight: translate after 20:00 orchestration
    - cron: '20 1 * * *'    # Nightly retry: after quota reset
    - cron: '20 4 * * *'    # Backup nightly retry
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Max jobs for the PREMIUM/free HTTP cascade (quota-bound; keep modest)'
        default: '100'
      mopup_max_jobs:
        description: 'Max jobs for the local-MT (Argos) mop-up — free + unlimited, drain the whole backlog'
        default: '6000'
      company_key:
        description: 'Single company key to translate (e.g. a-group). Leave empty for all.'
        default: ''
      skip_housekeeping:
        description: 'Skip housekeeping (URL validation, expired pruning)'
        type: boolean
        default: false
      skip_translate:
        description: 'Skip translations (only housekeeping + slug hardening)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no commit)'
        type: boolean
        default: false

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write     # for github-issue-creator on failure

env:
  # --max-old-space-size=12288: ubuntu-latest standard runner has 16GB RAM;
  # Phase 2b's per-company loop touches the full jobs.json (~25k jobs) many
  # times per run, so give Node headroom above its ~4GB implicit default
  # while leaving ~4GB for the OS/git/npm subprocesses (issue #3767 OOM).
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169 --max-old-space-size=12288'

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # NOTE: the self-hosted LibreTranslate service container was REMOVED (2026-06-15).
    # Measured on run 27521648869: the Argos /translate endpoint on the 2-core runner
    # was 100% dead — 1483 timeouts, ZERO successful translations (tier hits:
    # libreTranslateSelfHosted=0) — while burning ~124min/run waiting it out and
    # OOM-pressuring the node process. The real work is done by the PUBLIC LibreTranslate
    # instances (tier hits: libreTranslate=107) + MyMemory, which the cascade reaches
    # anyway. Dropping the dead container reclaims that time and memory. To restore
    # self-hosted LT, re-add the service + LIBRETRANSLATE_SELF_HOSTED_URL after fixing
    # why Argos times out on the runner (model-load/2-core/memory).
    # UPDATE (2026-07-03): live run logs (e.g. 28637771315) show local-mt-translate.py
    # printing "4 workers" — os.cpu_count() now resolves to 4 on ubuntu-latest, not
    # the 2 measured above. The runner class was upgraded since the original note;
    # LOCAL_MT_WORKERS already tracks cpu_count() automatically so no config change
    # needed, but don't reuse the stale "2-core" figure in future capacity math.

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the local Opus-MT ONNX weights (~50-80MB/q8 model, 6 models for the
      # IT/EN/DE/FR directions). First run downloads from the HF CDN once (~minutes,
      # one-time); cached runs reuse them so the in-cascade local tier pays no
      # cold-start. Mirrors the embedding-build workflows' .cache/transformers cache.
      - name: Cache Opus-MT models
        uses: actions/cache@v5
        with:
          path: .cache/transformers
          key: opus-mt-models-v1
          restore-keys: opus-mt-models-

      # Cache the installed Argos Translate packages (it/en/de/fr <-> en, ~a few
      # hundred MB total). install_models() in local-mt-translate.py downloads
      # these .argosmodel files from the HF/GitHub CDN on every run — this cache
      # makes that a one-time cost, mirroring the Opus-MT cache above. install_models()
      # stays idempotent (package.install() is a no-op if already present), so a
      # cache hit just skips the network transfer; a cache miss falls through to
      # the existing retry logic unchanged.
      - name: Cache Argos Translate models
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-translate-models-v1
          restore-keys: argos-translate-models-

      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Phase 2b cascade (relocalize-pending-jobs.mjs -> dedicated-crawler-
      # common.mjs -> ai-models.mjs) — tier-0 in ai-models.mjs's DEFAULT_CHAIN
      # by default since 2026-07-29 (AI_COMPETING_TIERS), competing on real
      # score instead of being reached only after every free-tier model has
      # failed. See .github/actions/setup-claude-haiku-fallback/action.yml
      # for the full rationale + incident history.
      - uses: ./.github/actions/setup-claude-haiku-fallback

      # ── Phase 1: Housekeeping (prune expired, validate URLs, dedup) ──────
      # Runs BEFORE translations so we don't waste AI quota on dead jobs.
      # Determine if this is the daily housekeeping run (07:00 UTC cron).
      # Other triggers (13:00, 01:00, workflow_run, manual) skip housekeeping
      # to go straight to translations — saves ~8 min of URL validation.
      - name: Check if housekeeping should run
        id: hk
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "🧹 Daily 07:00 UTC — housekeeping enabled"
          elif [ "${{ inputs.skip_housekeeping }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Housekeeping skipped (user input)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Housekeeping skipped (not daily cron)"
          fi

      # Slug hardening is SKIPPED here — it runs AFTER translations in Phase 3.
      - name: "Phase 1: Housekeeping"
        if: steps.hk.outputs.run == 'true'
        env:
          JOBS_SKIP_LOCALE_HARDENING: '1'
        run: |
          echo "🧹 Running housekeeping (no slug hardening — deferred to Phase 3)..."
          for slice in data/jobs/by-crawler/*.json; do
            [ -f "$slice" ] || continue
            JOBS_SLICE_FILE="$slice" node scripts/cleanup-jobs.mjs || true
          done
          echo "✅ Housekeeping complete"

      - name: Commit housekeeping
        if: always() && steps.checkout.outcome == 'success' && steps.hk.outputs.run == 'true' && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🧹 Housekeeping — prune expired + validate URLs"

      # ── Phase 2: Translate pending jobs (ARGOS-FIRST) ────────────────────
      # The FAST local engine leads, the slow HTTP cascade tops up.
      # Measured baseline (run 27949678243): the cascade ("Phase 2b") burned
      # 40-173min to translate only ~100 jobs — premium DeepL/Azure are chronically
      # exhausted (0 hits), so the on-runner ONNX Opus-MT tier carried ~89% of the
      # cascade but is ~15x slower PER FIELD than the CTranslate2 int8 Argos engine
      # the mop-up already used (993 translations / 0 failures in 8.7min). So we now
      # run Argos (CTranslate2) as the PRIMARY bulk pass FIRST (Phase 2a), re-assemble,
      # then let the cascade (Phase 2b) upgrade only the small remainder — contamination,
      # thin output, Argos misses — where premium/LLM quota (when it recovers) actually
      # adds quality. Net: the bulk is done by the fast engine; the slow cascade no
      # longer grinds the whole backlog through onnxruntime.
      # Kill-switch: set repo/workflow var TRANSLATE_ARGOS_FIRST_DISABLE=1 to fall back
      # to cascade-first (Phase 2a + the re-assemble are skipped; the always()-guarded
      # Phase 2c mop-up still drains the backlog exactly as before). NB the disable
      # value is '1', NOT '0': GitHub coerces an UNSET var ('') and '0' both to the
      # number 0, so `vars.X != '0'` is FALSE when unset → Phase 2a would never run
      # (the original gate's bug). `vars.X != '1'` is the proven pattern (mirrors
      # LOCAL_MT_DISABLE): unset → 0 != 1 → runs; set to '1' → 1 != 1 → skips.
      # REVERT-TRIGGER (NOT measurable pre-merge — only the live scheduled run
      # exercises the ~17k-job backlog): if the next translate-pending run shows
      # wall-clock ≥ the prior baseline OR fewer jobs completed/run, set
      # TRANSLATE_ARGOS_FIRST_DISABLE=1 (instant revert, zero code change) and investigate.
      - name: Install Argos Translate (local MT engine)
        # Installed ONCE up front so BOTH the Phase 2a bulk pass and the
        # always()-guarded Phase 2c mop-up reuse it (pip + model cache persist for
        # the job). always() so Argos is present even if an earlier step errored —
        # the translation steps below are the safety net for the whole backlog.
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --upgrade pip
          # argostranslate pulls ctranslate2 + sentencepiece (the int8 CPU runtime).
          python3 -m pip install --quiet argostranslate
          # Download the it/en/de/fr xx<->en packages once (Argos pivots the cross
          # pairs through English). Idempotent + retried inside the script.
          python3 scripts/local-mt-translate.py --install

      - name: Assemble dataset
        if: inputs.skip_translate != true
        run: node scripts/assemble-jobs-dataset.mjs

      # ── Phase 2a: Local MT BULK (Argos / CTranslate2) — PRIMARY workhorse ──
      # Drains the whole backlog with the fast int8 engine BEFORE the slow cascade.
      # Same script as the Phase 2c mop-up; here it LEADS. ADDITIVE + SAFE: only
      # fills genuinely-missing locale fields, never overwrites a good translation,
      # and clears needsRetranslation only when a locale actually became complete —
      # so re-running it (Phase 2c) or falling back to cascade-first is always safe.
      - name: "Phase 2a: Local MT bulk translate (Argos)"
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        continue-on-error: true
        env:
          LOCAL_MT_TIME_BUDGET_MS: '9000000'  # 150 * 60 * 1000
        run: node scripts/local-mt-mopup.mjs --max-jobs ${{ inputs.mopup_max_jobs || '6000' }}

      # Re-assemble so the cascade (which reads data/jobs.json) sees Argos's fills
      # and only queues the genuine remainder, not work Argos already finished.
      - name: Re-assemble dataset after Argos bulk
        if: inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1' && vars.TRANSLATE_ARGOS_FIRST_DISABLE != '1'
        run: node scripts/assemble-jobs-dataset.mjs

      # Ext3 task 4 — flag jobs whose descriptionByLocale[X] contains text
      # in a different language (detection mirrors
      # tests/job-locale-consistency.test.ts). Flagged jobs get
      # needsRetranslation=true so the translate step below rebuilds them in
      # this same run. Runs AFTER assembly (operates on the assembled
      # data/jobs.json) but BEFORE the translate step so the fresh flags are
      # picked up in a single pipeline execution. Soft-fail on error: a
      # detection crash shouldn't block the whole batch.
      - name: "Phase 2 pre: Flag locale-mismatched job descriptions"
        if: inputs.skip_translate != true
        continue-on-error: true
        run: node scripts/mark-locale-mismatched-jobs.mjs

      - name: Log translation stats (before)
        if: inputs.skip_translate != true
        run: node scripts/log-translation-stats.mjs before

      - name: "Phase 2b: Translate pending jobs (cascade top-up)"
        # With Argos-first (Phase 2a) the bulk is already done, so this cascade now
        # processes only the REMAINDER: contamination (wrong-language locale slots
        # that the mop-up's missing-slot logic does not touch), thin output, and any
        # job Argos failed on — plus it is where premium/LLM quota, WHEN it recovers,
        # upgrades quality. When TRANSLATE_ARGOS_FIRST_DISABLE=1 it reverts to the old
        # role (leads, with the Argos mop-up as the safety net).
        if: inputs.skip_translate != true
        env:
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: '1'
          # Auth for the opt-in Claude CLI Haiku fallback (tier-0 by default
          # since 2026-07-29 — see AI_COMPETING_TIERS in ai-models.mjs; see
          # "Setup Claude CLI Haiku fallback" step above). Harmless to always
          # pass: ai-models.mjs only offers the model when this AND the RC
          # flag are both set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cap the slow cascade's run-wide deadline so it does a SHORT top-up pass
          # instead of expanding to fill 250min (measured: Phase 2b grew to 229min /
          # ~269min total on run 28074729486 even though Phase 2a had already drained
          # the bulk in 23min — the cascade always runs to its budget). Under Argos-first
          # the fast engine (Phase 2a + the Phase 2c mop-up) covers the backlog, so 90min
          # is plenty for the premium-upgrade + contamination-fix the cascade uniquely
          # does; the rest defers to the next of ~7 runs/day. Self-throttling: the
          # deadline is measured from RUN_START, so a long Phase 2a shrinks the window.
          # Revert path (TRANSLATE_ARGOS_FIRST_DISABLE=1, cascade is primary) keeps the
          # full 250min. (== '1' avoids the '' vs '0' numeric-coercion footgun.)
          JOBS_CASCADE_DEADLINE_MS: ${{ vars.TRANSLATE_ARGOS_FIRST_DISABLE == '1' && '15000000' || '5400000' }}
          # Local Opus-MT tier (Helsinki-NLP via @huggingface/transformers, on-runner).
          # Free, deterministic, offline; reuses the ONNX runtime proven for embeddings.
          # Kept ON as the cascade's local fallback for the remainder (and for the
          # cascade-first revert path), but note it is ~15x slower per field than the
          # CTranslate2 Argos engine that now leads in Phase 2a — so Argos-first keeps
          # the slow ONNX tier off the bulk. Set MT_LOCAL_OPUSMT='' (or remove) to disable.
          MT_LOCAL_OPUSMT: '1'
          TRANSFORMERS_CACHE: .cache/transformers
          # Self-hosted LibreTranslate removed (see note above the steps): it was 100%
          # dead on the runner. The cascade now uses premium tiers + local Opus-MT +
          # MyMemory + PUBLIC LibreTranslate, which were already doing all the real work.
          # NB: the AI-localization wall-clock budget is set DYNAMICALLY per-company by
          # relocalize-pending-jobs.mjs (JOBS_AI_LOCALIZATION_TIME_BUDGET_MS = remaining
          # time until its 250min run-wide cascade deadline), so it is intentionally NOT
          # hard-coded here — a static value reset the budget per company and could blow
          # past the 350min job timeout (review #2205 🔴). The cascade stops by ~250min,
          # leaving ~100min for the mop-up + always()-guarded commit/scatter/slug/deploy.
        run: node scripts/relocalize-pending-jobs.mjs --max-jobs ${{ inputs.max_jobs || '100' }} ${{ inputs.company_key && format('--company-key {0}', inputs.company_key) || '' }}

      - name: Log translation stats (after)
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/log-translation-stats.mjs after

      - name: Scatter changes back to per-crawler slices
        # always()-guarded so partial work is scattered to per-crawler slices for
        # the commit step even if the translate step errored or was cut short by
        # the wall-clock budget. relocalize already writes slices incrementally
        # per-company, but this final scatter captures anything the in-process
        # retry pass left only in data/jobs.json.
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true
        run: node scripts/scatter-jobs-to-slices.mjs

      # ── Phase 2c mop-up: catch the cascade's leftovers (in-process, $0) ──
      # With Argos-first, the bulk was already drained in Phase 2a; this pass mops
      # up whatever the cascade (Phase 2b) freshly left incomplete — contamination
      # it deleted-and-couldn't-retranslate, fields the cascade ran out of budget
      # on. (When TRANSLATE_ARGOS_FIRST_DISABLE=1 this is the ONLY local-MT pass and
      # drains the whole backlog, exactly as before.) Argos Translate is loaded as a DIRECT
      # PYTHON LIBRARY — no HTTP server, no healthcheck race (the failure mode that
      # made the old self-hosted LibreTranslate service 100% dead: 1483 timeouts /
      # 0 hits). Models load ONCE per process; unlimited throughput, no external API.
      # Argos was already installed up front (before Phase 2a), so no install here.
      # always() so it still runs even if the cascade errored or was cut by its time
      # budget. continue-on-error so a mop-up failure can never fail the workflow.
      # ADDITIVE + SAFE: only FILLS genuinely-missing locale fields (never overwrites
      # a good translation), now also applies the markdown-balancer + protected-term
      # glossary (parity with the cascade's finalize()), and clears needsRetranslation
      # only when the locale actually became complete. mark-locale-mismatched-jobs /
      # isIncomplete re-flags any weak output next run, so worst case is a no-op.
      # Gate: set LOCAL_MT_DISABLE=1 (repo/workflow var) to skip entirely.
      - name: "Phase 2c mop-up: local MT (Argos Translate, in-process)"
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && vars.LOCAL_MT_DISABLE != '1'
        continue-on-error: true
        env:
          # GENEROUS wall-clock budget (150min); the elapsed-aware MOPUP_DEADLINE_MS
          # guard (320min from run start, baked into local-mt-mopup.mjs) caps it under
          # the 350min job timeout — whichever is smaller wins, so commit/scatter/slug/
          # deploy always keep their margin. Work-loss on a timeout kill is NOT a risk:
          # local-mt-translate.py flushes each request's JSONL as soon as its units
          # resolve, and the mop-up parses + commits the partial stdout (timedOut branch).
          LOCAL_MT_TIME_BUDGET_MS: '9000000'  # 150 * 60 * 1000
        # --max-jobs is DECOUPLED from the `max_jobs` input (which caps the quota-bound
        # cascade). Argos is free + unlimited, so the mop-up drains whatever remains.
        run: node scripts/local-mt-mopup.mjs --max-jobs ${{ inputs.mopup_max_jobs || '6000' }}

      - name: Commit translations
        if: always() && steps.checkout.outcome == 'success' && inputs.skip_translate != true && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🌐 Auto-translate pending jobs" data/jobs/by-crawler/ data/translation-cache/ data/jobs-crawler-config.json data/slug-registry.json data/translation-stats-history.json

      # ── Phase 2d: Fix source-copy titles (daily 07:00 only) ──────────────
      # Only runs on the daily cron — no point retrying the same 30 failed titles
      # every run. New jobs from crawlers will have source-copy titles that 2d fixes.
      - name: "Phase 2d: Fix untranslated titles (free cascade)"
        if: steps.hk.outputs.run == 'true' && inputs.dry_run != true
        # Self-hosted LibreTranslate removed (see note above the steps) — was 100% dead.
        run: node scripts/fix-untranslated-titles.mjs

      - name: Commit title fixes
        if: steps.hk.outputs.run == 'true' && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🔤 Fix untranslated titles (free cascade)"

      # Phase 2c REMOVED — descriptions are at 0 source copies.
      # If new crawlers add untranslated descriptions, Phase 2 (AI) handles them.

      # ── Phase 3: Regenerate slugs from translated titles ──────────────────
      # Safe replacement for hardenJobLocaleFields (which was destructive:
      # re-translated titles, contaminated EN/DE/FR with Italian, set needsRetranslation).
      # This script ONLY regenerates slugByLocale from existing titleByLocale.
      # It NEVER modifies titles, descriptions, or needsRetranslation.
      - name: "Phase 3: Regenerate locale slugs"
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: node scripts/regenerate-slugs-by-locale.mjs

      - name: Commit slug regeneration
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: bash scripts/lib/git-commit-data.sh --slice-only "🔗 Regenerate locale slugs (post-translation)"

      # ── Phase 4: Validate + Deploy ──────────────────────────────────────
      - name: Trigger deploy
        if: always() && steps.checkout.outcome == 'success' && inputs.dry_run != true
        run: |
          if node scripts/validate-translation-completeness.mjs 2>/dev/null; then
            echo "✅ All translations complete — triggering deploy"
            bash scripts/lib/trigger-deploy.sh
          else
            echo "⏳ Some translations still incomplete — skipping deploy trigger"
            echo "   The next cron run will retry and trigger deploy once all jobs are translated."
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Title MUST use the standard "Workflow Failure: <name>" prefix so the
          # central reconciler (close-recovered-failure-issues.mjs, TITLE_RE
          # ^(?:Workflow|Crawler|CI) Failure:) auto-closes it once the next run is
          # green. The old literal "Translation Pipeline Failure" never matched →
          # the failure issue stayed open forever on recovery (e.g. #2538). The
          # <name> here equals `name:` so `gh run list -w` resolves the run.
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: Translate Pending Jobs" \
            --description "## Pipeline fallita

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "Translate Pending Jobs"
