name: Update Weather Snapshot (council-of-sources)

on:
  schedule:
    # 6×/day, every 4 hours, offset 23 mins to avoid colliding with other crons
    - cron: '23 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

concurrency:
  group: weather-snapshot
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    # Alzato 8->10min: il Checkout da solo arriva gia' al 58% del vecchio cap
    # (vedi tetto sullo step sotto) — stesso sintomo di #5659 (Checkout che
    # mangia l'intero budget del job update-fuel-prices), qui prevenuto prima
    # che diventi un timeout osservato. The snapshot push still spent 8m23s
    # in the main-writer convoy in #10457, so keep the checkout cap but extend
    # the job budget for the bounded retry helper.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (stesso bug class di #5659, vedi update-fuel-prices.yml).
        # 7min stanno sopra il massimo osservato sui run sani (86-278s su 8
        # run, il caso peggiore era gia' il 58% del cap da 8min) e sotto il
        # nuovo cap del job. NIENTE `filter: blob:none`: con `fetch-depth: 1`
        # e' un peggioramento misurato (+125% su tests.yml, vedi #5164), non
        # un miglioramento.
        timeout-minutes: 7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (minimal — tsx + types only)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run weather snapshot updater
        run: npx --no-install tsx scripts/update-weather.ts
        env:
          NODE_ENV: production

      - name: Open PR with snapshot
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/weather-refresh-pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Auto-generated by [workflow run %s](%s).\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            cat <<'EOF'
          ## Implementato
          - Lo snapshot meteo viene proposto tramite il branch stabile `chore/weather-snapshot`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — snapshot automatizzato, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/weather-snapshot.json \
            --branch chore/weather-snapshot \
            --commit-message "🌦️ Refresh weather snapshot (council)" \
            --title "chore(data): refresh weather snapshot" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
