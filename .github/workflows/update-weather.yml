name: Update Weather Snapshot (council-of-sources)

on:
  schedule:
    # 6×/day, every 4 hours, offset 23 mins to avoid colliding with other crons
    - cron: '23 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

concurrency:
  group: weather-snapshot
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    # Alzato 8->10min: il Checkout da solo arriva gia' al 58% del vecchio cap
    # (vedi tetto sullo step sotto) — stesso sintomo di #5659 (Checkout che
    # mangia l'intero budget del job update-fuel-prices), qui prevenuto prima
    # che diventi un timeout osservato.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (stesso bug class di #5659, vedi update-fuel-prices.yml).
        # 7min stanno sopra il massimo osservato sui run sani (86-278s su 8
        # run, il caso peggiore era gia' il 58% del cap da 8min) e sotto il
        # nuovo cap del job. NIENTE `filter: blob:none`: con `fetch-depth: 1`
        # e' un peggioramento misurato (+125% su tests.yml, vedi #5164), non
        # un miglioramento.
        timeout-minutes: 7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (minimal — tsx + types only)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run weather snapshot updater
        run: npx tsx scripts/update-weather.ts
        env:
          NODE_ENV: production

      - name: Commit snapshot (rebase-retry pattern)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the snapshot file (cache files are gitignored)
          git add data/weather-snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot diff, skipping commit"
            exit 0
          fi

          git commit -m "🌦️ Refresh weather snapshot (council)"

          # Rebase-retry loop (max 5 attempts)
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "push ok on attempt $attempt"
              exit 0
            fi
            echo "push failed (attempt $attempt), rebasing..."
            git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
            git rebase origin/main || { git rebase --abort; sleep 2; continue; }
            sleep $((attempt * 2))
          done
          echo "::warning::push failed after 5 attempts — leaving snapshot uncommitted"
          exit 0

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
