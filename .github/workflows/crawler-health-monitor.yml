name: crawler-health-monitor

# Daily check that every crawler in `data/jobs/by-crawler/` produced fresh,
# non-empty output. Opens one GitHub issue per stale/broken crawler.
# Runs after most crawlers complete (cron varies by source, ~05:00-06:00 UTC).
#
# State persistence: `data/crawler-health.json` is committed back to main
# after the script runs so `consecutiveEmptyRuns` and `lastSuccessfulRunAt`
# accumulate across daily runs. Without this commit-back the empty-streak
# gate is dead code (every run starts from `crawlers: {}`).

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: crawler-health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # Need full history so rebase-on-push can replay against latest main.
          fetch-depth: 0
          # Blobless partial clone (same fix as guard-data-integrity.yml, #4120,
          # identical diagnosis in #4266): fetch-depth: 0 alone pulls the
          # entire blob history (~1.36GB/868k objects) and eats the whole
          # 10-min job timeout in the checkout step, before the health-check
          # script ever runs. filter: blob:none keeps full commit/tree history
          # (still needed by the rebase-retry loop below) while deferring
          # blob content download until a file is actually touched.
          filter: blob:none
          # persist-credentials leaves GITHUB_TOKEN on extraheader; the commit
          # step rewrites origin via configure-main-push-auth.sh (GITHUB_PAT).
          persist-credentials: true
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Ha gia' blob:none (#4380) e i numeri lo confermano: Checkout 96-239s su
        # 10 run, max = 40% di un cap da 10min. Nessun altro cambio, solo il
        # tetto.
        timeout-minutes: 7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # No `npm ci` — the script uses only the Node stdlib.
      # If a future version needs deps, switch to `npm ci --omit=dev`.
      # load-rc-env.mjs uses the REST path (no firebase-admin).

      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Run health check
        id: health
        continue-on-error: true
        run: node scripts/check-crawler-health.mjs

      - name: Commit updated health state
        # Always try to persist state, even when the check itself flagged
        # issues — the `consecutiveEmptyRuns` counter needs the commit to
        # keep climbing toward the 3-empty-runs broken gate.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git diff --quiet -- data/crawler-health.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/crawler-health.json
            bash scripts/lib/configure-main-push-auth.sh

            MAX_ATTEMPTS=5
            attempt=0
            while true; do
              attempt=$((attempt + 1))
              # Commit once (the diff is already in the index).
              if git diff --cached --quiet; then
                echo "ℹ️ No staged changes left — already up to date."
                break
              fi
              git commit -m "chore: update crawler-health state [skip ci]" || true

              # Fetch + rebase onto the latest remote tip. Other crawler
              # workflows push to main concurrently; we only touch
              # data/crawler-health.json so conflicts are extremely rare,
              # but rebase keeps us safe even when a parallel push lands
              # between our fetch and push.
              git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
              if ! git rebase origin/main; then
                echo "⚠️ Rebase conflict — aborting and resetting."
                git rebase --abort 2>/dev/null || true
                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "❌ Could not rebase after $MAX_ATTEMPTS attempts."
                  exit 1
                fi
                # Reset our commit, re-add the file (latest remote may have
                # touched it), then loop.
                git reset --mixed HEAD~1 || true
                git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
                git reset --hard origin/main
                # Re-run the script so the state file reflects the new
                # remote baseline plus today's observations.
                node scripts/check-crawler-health.mjs || true
                if git diff --quiet -- data/crawler-health.json; then
                  echo "ℹ️ State file already matches remote after replay."
                  break
                fi
                git add data/crawler-health.json
                continue
              fi

              if git push origin main; then
                echo "✅ Pushed updated health state."
                break
              fi

              echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — retrying after backoff..."
              if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                echo "❌ Push failed after $MAX_ATTEMPTS attempts."
                exit 1
              fi
              # Undo our commit so the next loop re-fetches cleanly.
              git reset --mixed HEAD~1 || true
              sleep $((attempt * 5 + RANDOM % 6))
            done
          else
            echo "ℹ️ No state change — nothing to commit."
          fi

      - name: Open issues for stale crawlers
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f data/crawler-health-issues.json ]; then
            echo "Health check failed but no issues file emitted; nothing to open."
            exit 1
          fi

          count=$(jq 'length' data/crawler-health-issues.json)
          echo "Found $count stale crawler(s)."

          for i in $(seq 0 $((count - 1))); do
            slug=$(jq -r ".[$i].slug" data/crawler-health-issues.json)
            reason=$(jq -r ".[$i].reason" data/crawler-health-issues.json)
            status=$(jq -r ".[$i].status" data/crawler-health-issues.json)
            lastSeen=$(jq -r ".[$i].lastSeenAt // \"never\"" data/crawler-health-issues.json)
            empties=$(jq -r ".[$i].consecutiveEmptyRuns // 0" data/crawler-health-issues.json)

            # `${slug}` is a legitimate discriminant — one issue per crawler.
            # `${status}` was NOT: a crawler sliding degraded → broken changed the
            # title and opened a SECOND issue for the same crawler, still failing
            # for the same reason. The status moves into the body (and drives the
            # priority below), so the title stays constant for the whole outage.
            # The `<slug>:` shape is load-bearing — the "Close recovered
            # crawler-health issues" step parses the slug back out of it.
            title="[crawler-health] ${slug}: crawler unhealthy"
            case "$status" in
              broken)   priority=2 ;;
              advisory) priority=4 ;;
              *)        priority=3 ;;
            esac

            body=$(cat <<EOF
          Automated health check flagged crawler **\`${slug}\`** as **${status}**.

          - Reason: ${reason}
          - Last successful run: ${lastSeen}
          - Consecutive empty runs: ${empties}

          Source state: \`data/crawler-health.json\` → \`crawlers["${slug}"]\`
          Detection script: \`scripts/check-crawler-health.mjs\`
          Workflow run: ${GITHUB_SERVER_URL:-https://github.com}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID:-}

          Triage:
          1. Open \`data/jobs/by-crawler/${slug}.json\` and inspect last entries.
          2. Run the crawler locally to reproduce.
          3. If the source HTML changed, patch the parser.
          4. If the source is gone, retire the crawler and remove from the orchestrator.
          EOF
          )

            # `github-issue-creator.mjs` (ISSUES.md dedup a monte) replaces both
            # the raw create and the hand-rolled title scan above: a recurring
            # outage comments on the canonical issue for that crawler instead of
            # minting a new one, and it creates the `crawler-health` label itself
            # (the race the old comment worried about is handled inside the
            # helper's best-effort `ensureLabelsExist`).
            node scripts/lib/github-issue-creator.mjs \
              --title "$title" \
              --description "$body" \
              --priority "$priority" \
              --label crawler-health \
              --workflow "${{ github.workflow }}"
          done

      - name: Close recovered crawler-health issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Auto-close `[crawler-health] <slug>: …` issues whose crawler
          # is now healthy in data/crawler-health.json. Without this, a recovered
          # crawler's issue lingers open forever (the open step only creates,
          # never closes). Matches by slug parsed from the issue title.
          #
          # Routed through `github-issue-creator.mjs --resolve` — not a raw `gh
          # issue close` (what this step did before #5437) — with the title
          # REBUILT from `$slug` in the exact literal shape the opener above
          # uses (`title="[crawler-health] ${slug}: crawler unhealthy"`). A raw
          # `gh issue close` closed the issue at runtime just fine but was
          # INVISIBLE to the static coupling gate
          # (tests/failure-issue-closers.test.ts): it never mentions
          # `github-issue-creator.mjs`, so the inventory in
          # failure-issue-inventory.mjs has no way to see it and this title
          # showed up as "no closer" — a working closer the gate could not see,
          # the exact failure mode #5437 exists to catch (it already happened
          # once with a COMMENT claiming a closer that did not exist,
          # alert-pat-down.mjs #5432; this is the same shape with working code
          # instead of a comment).
          if [ ! -f data/crawler-health.json ]; then
            echo "No health state file; nothing to reconcile."
            exit 0
          fi
          gh issue list --state open --limit 500 \
            --json number,title --jq '.[] | select(.title | test("^\\[crawler-health\\] ")) | "\(.number)\t\(.title)"' \
            > /tmp/health-issues.tsv || true
          if [ ! -s /tmp/health-issues.tsv ]; then
            echo "No open [crawler-health] issues."
            exit 0
          fi
          while IFS=$'\t' read -r num open_title; do
            slug=$(printf '%s' "$open_title" | sed -E 's/^\[crawler-health\] ([^:]+):.*/\1/')
            status=$(jq -r --arg s "$slug" '.crawlers[$s].status // "unknown"' data/crawler-health.json)
            # `advisory` (#6496) rides on `status: "healthy"` by design (the
            # EMPTY_OK_CRAWLERS allowlist is never overridden) — without this
            # check the closer would auto-resolve the advisory issue the same
            # run it opened it. Only clears when consecutiveEmptyOkRuns resets
            # (jobs > 0 again), same as `advisory` clearing in nextCrawlerState.
            advisory=$(jq -r --arg s "$slug" '.crawlers[$s].advisory // false' data/crawler-health.json)
            if [ "$status" = "healthy" ] && [ "$advisory" != "true" ]; then
              title="[crawler-health] ${slug}: crawler unhealthy"
              echo "Resolving #$num (\"${title}\") — ${slug} is healthy again."
              node scripts/lib/github-issue-creator.mjs --resolve \
                --title "$title" \
                --workflow "${{ github.workflow }}" \
                --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              echo "Keeping #$num — ${slug} status=${status} advisory=${advisory}."
            fi
          done < /tmp/health-issues.tsv

      - name: Fail if any crawler stale
        id: failgate
        if: steps.health.outcome == 'failure'
        run: |
          echo "One or more crawlers are stale/broken — see issues created above."
          exit 1

      - name: Report unexpected failure to GitHub Issues
        if: failure() && steps.failgate.conclusion != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito (crash pre/fuori detection)
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}
          Nota: il monitor è fallito prima/fuori dallo step di detection — nessuna issue di condizione è stata aperta." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
