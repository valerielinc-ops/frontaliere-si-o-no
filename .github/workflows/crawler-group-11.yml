          set +e

          # ---- rehab-basel: run crawler (verbatim from original workflow) ----
          node scripts/update-rehab-basel-jobs.mjs
          crawler_exit=$?
          git_commit_exit=0

          # ---- rehab-basel: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
