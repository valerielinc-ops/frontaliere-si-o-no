      - name: Upload shard batch 2 dist for post-deploy validation
        id: upload-shard-batch-2
        if: needs.push-it-shard-groups.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-2-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/it-shard-validation-batches/2/*
          compression-level: 1
          retention-days: 8
