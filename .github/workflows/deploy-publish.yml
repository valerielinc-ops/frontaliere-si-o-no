            local slug sub src packed_n persisted_src_n live_src_n layout_file source_path_layout
            slug="$(jq -r --arg s "$section" --arg l "$loc" '.[$s][$l] // empty' "$PUBLISHER_ROOT/scripts/lib/section-shard-slugs.json")"
