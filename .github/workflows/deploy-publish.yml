      - name: Upload shard batch 3 dist for post-deploy validation
        id: upload-shard-batch-3
        if: needs.push-it-shard-groups.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-3-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/it-shard-validation-batches/3/*
          compression-level: 1
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload shard batch 4 dist for post-deploy validation
        id: upload-shard-batch-4
        if: needs.push-it-shard-groups.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-4-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/it-shard-validation-batches/4/*
          compression-level: 1
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload shard batch 5 dist for post-deploy validation
        id: upload-shard-batch-5
        if: needs.push-it-shard-groups.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-5-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/it-shard-validation-batches/5/*
          compression-level: 1
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload shard batch 6 dist for post-deploy validation
        id: upload-shard-batch-6
        if: needs.push-it-shard-groups.result == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard-batch-6-dist-it-${{ github.run_id }}
          path: ${{ runner.temp }}/it-shard-validation-batches/6/*
          compression-level: 1
          retention-days: 8
          if-no-files-found: ignore
      - name: Finalize IT section content manifests
        id: finalize-section-manifests-it
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          SECTION_BATCH_DIGESTS: >-
            {"1":"${{ steps.upload-shard-batch-1.outputs.artifact-digest }}","2":"${{ steps.upload-shard-batch-2.outputs.artifact-digest }}","3":"${{ steps.upload-shard-batch-3.outputs.artifact-digest }}","4":"${{ steps.upload-shard-batch-4.outputs.artifact-digest }}","5":"${{ steps.upload-shard-batch-5.outputs.artifact-digest }}","6":"${{ steps.upload-shard-batch-6.outputs.artifact-digest }}"}
        run: |
          set -euo pipefail
          required_sections="$(jq -r '.requiredSections | join(",")' "$RUNNER_TEMP/it-publish-plan/it-shard-group-plan.json")"
          printf '%s\n' "$SECTION_BATCH_DIGESTS" > "$RUNNER_TEMP/it-section-batch-digests.json"
          node scripts/ci/shard-content-manifest.mjs finalize-sections \
            --input "$RUNNER_TEMP/shard-content-manifests/it" \
            --locale it \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --artifact-digests "$RUNNER_TEMP/it-section-batch-digests.json" \
            --required-sections "$required_sections" \
            --manifest-artifact-name "section-page-manifest-it-$ARTIFACT_RUN_ID" \
            --out "$RUNNER_TEMP/section-page-manifest-it.json"
      - name: Upload IT section content manifest
        if: steps.finalize-section-manifests-it.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: section-page-manifest-it-${{ github.run_id }}
          path: ${{ runner.temp }}/section-page-manifest-it.json
          retention-days: 8
          if-no-files-found: error
      - name: Recheck current IT CDN build id before Pages preparation
        id: cdn-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_IT_RUN_ID: ${{ github.run_id }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          CDN_WAIT_TIMEOUT_S: 2700
          CDN_WAIT_MARGIN_WARN_S: 600
          CDN_IT_JOB_NAME: Publish IT CDN assets first
          CDN_IT_READY_STEP_NAME: Require IT CDN build id before shard pushes
          CDN_IT_READY_TIMEOUT_S: 10800
          CDN_IT_READY_INTERVAL_S: 30
          CDN_JOB_START_EPOCH: ${{ env.CDN_JOB_START_EPOCH }}
          CDN_JOB_DEADLINE_S: 21600
          CDN_JOB_FINISH_RESERVE_S: 180
        run: GITHUB_RUN_ID="$CDN_IT_RUN_ID" bash scripts/lib/wait-cdn-build-id.sh "$DEPLOY_BUILD_ID"
      - name: Strip section subtrees (IT)
        run: |
          set -euo pipefail
          for marker in "$RUNNER_TEMP"/shard-ok-*-it; do
            [ -e "$marker" ] || continue
            section="$(basename "$marker" | sed -e 's/^shard-ok-//' -e 's/-it$//')"
            slug="$(jq -er --arg section "$section" '.[$section].it' scripts/lib/section-shard-slugs.json)"
            if [ -d "dist/$slug" ]; then
              bash scripts/lib/strip-section-subtree.sh "$section" it dist
            fi
          done
      - name: Deploy prep (IT → Pages + CDN)
        id: deploy-prep-it
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
          CDN_BASE: ${{ needs.publish-it-cdn.outputs.cdn_base }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          OFFLOAD_CDN_WORKERS: '4'
        run: bash scripts/lib/deploy-it-pages-prep.sh
      - name: Save final R2 OG manifest cache
        if: ${{ always() && (vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both') && hashFiles('.cache/r2-og-published-manifest.json') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}-final-${{ hashFiles('.cache/r2-og-published-manifest.json') }}
      - name: Publish edge files (refresh the R2 copies the Worker prefers)
        continue-on-error: true
        run: |
          node scripts/ci/with-shard-writer-lock.mjs \
            --section __sitemaps__ --locale it --policy wait --timeout-ms 3600000 -- \
            bash -euo pipefail -c '
              node scripts/publish-edge-files.mjs --producer=build
              node scripts/publish-edge-files.mjs --producer=jobs-fast --from-dir="$GITHUB_WORKSPACE/dist"
            '
      - name: Upload Pages artifact (compression-level 9)
        id: upload-pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 8
          if-no-files-found: error
          compression-level: 9
      - name: Save deploy metadata to Firestore
        if: success()
        continue-on-error: true
        env:
          METADATA_FILE: ${{ runner.temp }}/it-publish-plan/deploy-metadata.json
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_EVENT_NAME: ${{ inputs.source_event_name }}
        run: |
          set -euo pipefail
          node scripts/deploy-registry.mjs save \
            --run-id="$SOURCE_RUN_ID" \
            --sha="$SOURCE_SHA" \
            --trigger="$SOURCE_EVENT_NAME" \
            --article-id="$(jq -r '.ARTICLE_ID // ""' "$METADATA_FILE")" \
            --article-url="$(jq -r '.ARTICLE_URL // ""' "$METADATA_FILE")" \
            --og-title="$(jq -r '.OG_TITLE // ""' "$METADATA_FILE")" \
            --og-description="$(jq -r '.OG_DESCRIPTION // ""' "$METADATA_FILE")" \
            --og-image="$(jq -r '.OG_IMAGE // ""' "$METADATA_FILE")" \
            --article-category="$(jq -r '.ARTICLE_CATEGORY // ""' "$METADATA_FILE")"
      - name: Upload sitemaps bundle artifact
        id: upload-sitemaps-bundle
        uses: actions/upload-artifact@v7
        with:
          name: sitemaps-${{ github.run_id }}
          path: /tmp/sitemaps-bundle/
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload pre-deploy snapshot for post-deploy validation
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-snapshot-${{ inputs.source_run_id }}
          path: /tmp/pre-deploy-sitemap-urls.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload dist-size-history + url-first-seen for the history commit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dist-history-${{ inputs.source_run_id }}
          path: |
            data/dist-size-history.jsonl
            data/url-first-seen.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Bind sitemap page manifest to publisher artifact digests
        id: bind-sitemap-page-manifest
        if: >-
          always() &&
          steps.upload-pages-artifact.outcome == 'success' &&
          steps.upload-sitemaps-bundle.outcome == 'success'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          BASE_ARTIFACT_DIGEST: ${{ steps.upload-pages-artifact.outputs.artifact-digest }}
          SITEMAPS_ARTIFACT_DIGEST: ${{ steps.upload-sitemaps-bundle.outputs.artifact-digest }}
          SECTION_ARTIFACT_DIGESTS_JSON: >-
            {"1":"${{ steps.upload-shard-batch-1.outputs.artifact-digest }}","2":"${{ steps.upload-shard-batch-2.outputs.artifact-digest }}","3":"${{ steps.upload-shard-batch-3.outputs.artifact-digest }}","4":"${{ steps.upload-shard-batch-4.outputs.artifact-digest }}","5":"${{ steps.upload-shard-batch-5.outputs.artifact-digest }}","6":"${{ steps.upload-shard-batch-6.outputs.artifact-digest }}"}
        run: |
          set -euo pipefail
          printf '%s\n' "$SECTION_ARTIFACT_DIGESTS_JSON" > "$RUNNER_TEMP/it-section-artifact-digests.json"
          node scripts/ci/shard-content-manifest.mjs bind-page \
            --input "$RUNNER_TEMP/locale-sitemap-manifest-it.json" \
            --out "$RUNNER_TEMP/sitemap-page-manifest-it.json" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --base-artifact-name github-pages \
            --base-artifact-digest "$BASE_ARTIFACT_DIGEST" \
            --section-artifact-digests "$RUNNER_TEMP/it-section-artifact-digests.json" \
            --sitemaps-artifact-name "sitemaps-$ARTIFACT_RUN_ID" \
            --sitemaps-artifact-digest "$SITEMAPS_ARTIFACT_DIGEST" \
            --manifest-artifact-name "sitemap-page-manifest-it-$ARTIFACT_RUN_ID"
      - name: Upload sitemap page manifest for publisher gate
        if: always() && steps.bind-sitemap-page-manifest.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sitemap-page-manifest-it-${{ github.run_id }}
          path: ${{ runner.temp }}/sitemap-page-manifest-it.json
          retention-days: 8
          if-no-files-found: error
      - name: Write IT publish provenance
        if: always()
        env:
          BUILD_LOCALE: it
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          PROVENANCE_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROVENANCE_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PROVENANCE_BUILD_OUTCOME: success
          PROVENANCE_VALIDATE_OUTCOME: success
          PROVENANCE_SOURCE_ARTIFACT_OUTCOME: success
          PROVENANCE_IT_PREP_OUTCOME: ${{ steps.deploy-prep-it.outcome }}
          PROVENANCE_PAGES_ARTIFACT_OUTCOME: ${{ steps.upload-pages-artifact.outcome }}
          PROVENANCE_OFFLOAD_OUTCOME: ${{ steps.deploy-prep-it.outcome }}
          PROVENANCE_SECTION_PUSH_OUTCOME: ${{ needs.push-it-shard-groups.result }}
          PROVENANCE_CDN_GATE_OUTCOME: ${{ needs.publish-it-cdn.result }}
          PROVENANCE_LOCALE_PUSH_OUTCOME: deferred
          PROVENANCE_LOCALE_PACK_OUTCOME: deferred
          PROVENANCE_LOCALE_ARTIFACT_OUTCOME: deferred
        run: node scripts/ci/locale-publish-provenance.mjs --output "$RUNNER_TEMP/locale-publish-provenance/it.json" --dist-dir dist
      - name: Write durable IT shard receipt
        if: >-
          ${{ always() && steps.finalize-section-manifests-it.outcome == 'success' &&
              steps.deploy-prep-it.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/publish-receipts.mjs --write locale --source-run-id "$SOURCE_RUN_ID" --source-sha "$SOURCE_SHA" --locale it
      - name: Upload IT publish provenance
        id: upload-it-provenance
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tail-publish-provenance-it-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/locale-publish-provenance/it.json
          retention-days: 8
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  # publish-nonit-shards: the expensive non-IT section/locale tail runs after

  # ───────────────────────────────────────────────────────────────────────
  # publish-nonit-shards: the expensive non-IT section/locale tail runs after
  # the build matrix has released its six-hour critical path. The source
  # artifact is admitted only by resolve-publish-plan; the CDN gate remains
  # fail-closed and the final receipt is the only input that can promote a
  # locale from stale to healthy for validation/live checks.
  # ───────────────────────────────────────────────────────────────────────
  publish-nonit-shards:
    name: Publish non-IT shard tail (${{ matrix.locale }})
    needs: [resolve-publish-plan, resolve-publish-receipts, publish-it-cdn, preflight-section-tree-layouts]
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.allowed == 'true' &&
          needs.resolve-publish-plan.outputs.it_admitted == 'true' &&
          needs.preflight-section-tree-layouts.result == 'success' &&
          needs.resolve-publish-receipts.outputs.pending_nonit_locales != '[]' &&
          needs.resolve-publish-receipts.result == 'success' &&
          needs.publish-it-cdn.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.resolve-publish-receipts.outputs.pending_nonit_locales) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # shard-secrets-overflow: stesso environment del build-locale di deploy.yml
    # da cui questo job e' stato estratto. Le deploy key di sangallo, zugo, uri,
    # vaud e vallese esistono solo li' (tetto di 100 secret per repo): senza
    # questa riga `secrets.SHARD_<SEZIONE>_<LOCALE>_DEPLOY_KEY` e' vuoto, il push
    # ripiega sul PAT e sugli shard di proprieta' nanakokyobashi-rgb riceve 403.
    # sectionPush diventa failure, la ricevuta resta `source-ready` e l'intero
    # deploy viene saltato con la run verde (run 37671196544).
    environment: shard-secrets-overflow
    concurrency:
      group: nonit-shard-tail-${{ matrix.locale }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      statuses: write
    env:
      BUILD_LOCALE: ${{ matrix.locale }}
      DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      # The artifact and its validators stay on SOURCE_SHA, but shard-push
      # code must come from the current publisher contract. A deferred tail
      # can process an old successful build after a publisher fix has landed;
      # using the historical checkout for the push would silently reintroduce
      # the fixed failure (run 41776299073: full fallback looked for
      # dist/en after changing into its staging clone).
      PUBLISHER_ROOT: ${{ github.workspace }}/publisher-resolver
      PUBLISHER_DIST: ${{ github.workspace }}/dist
      JOB_OG_DEFERRED_FALLBACKS_FILE: ${{ github.workspace }}/.cache/og-jobs/.deferred-fallbacks.json
      DURABLE_LOCALE_PUBLISHED: ${{ contains(needs.resolve-publish-receipts.outputs.published_locales, matrix.locale) && 'true' || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HREFlANG_RUN_ATTEMPT: ${{ needs.resolve-publish-plan.outputs.source_run_attempt }}
    steps:
      - name: Record non-IT tail job start
        run: echo "CDN_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout source workflow SHA
        uses: actions/checkout@v7
        with:
          # Checkout pieno, come il build-locale di deploy.yml da cui questo job
          # e' stato estratto: la chiusura di locale-shard-purge-urls.mjs,
          # offload-generated-images-cdn.mjs e deploy-shard-sections.sh nomina
          # docs/, public/images/, public/data/ e packages/articles/content/,
          # quindi per scripts/ci/checkout-profile-analyzer.mjs lo sparse
          # resterebbe sopra CROSSOVER_MB. Il profilo scritto a mano escludeva
          # quei bucket e tests/checkout-sparse-profiles.test.ts lo boccia.
          ref: ${{ inputs.source_sha }}

      # The source build may predate the receipt module during the transition.
      # Keep the race check on the current workflow contract, not on the
      # historical source checkout used for its payload.
      - name: Checkout durable receipt resolver
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          path: receipt-resolver
          sparse-checkout: |
            /scripts/ci/publish-receipts.mjs
          sparse-checkout-cone-mode: false

      # The source checkout above is intentionally pinned to the build SHA so
      # its artifact-facing validators match the payload. Shard publishers are
      # different: their fixes must also reach a queued/replayed tail whose
      # source build predates the fix. Keep this closure sparse and isolated so
      # only the path-sensitive publisher code follows current main.
      - name: Checkout current shard publisher
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          path: publisher-resolver
          sparse-checkout: |
            /scripts/ci/
            /scripts/lib/
            /scripts/offload-generated-images-cdn.mjs
            /build-plugins/shared/
            /infra/cloudflare-worker/
            /services/publicConfigConstants.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache node_modules
        id: nonit-node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nonit-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Download non-IT source artifact
        id: download-locale-source
        uses: actions/download-artifact@v8
        with:
          name: locale-shard-source-${{ matrix.locale }}-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/locale-shard-source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract non-IT source artifact
        id: extract-locale-source
        run: |
          set -euo pipefail
          fail() { echo "::error title=Non-IT source artifact::$1"; exit 1; }
          # One archive (historical) or the N parts of deploy.yml's
          # LOCALE_SOURCE_TAR_PARTS (scripts/lib/parallel-tar.sh), plain or
          # zstd: every part is extracted, concurrently. The helper comes from
          # the current publisher checkout, not the source SHA: an older source
          # may predate it, and its ptar_extract pre-creates the ancestors the
          # parts share so concurrent `tar -x` never race on a directory
          # (publish 43350569818: "Unexpected inconsistency when making
          # directory").
          mapfile -t source_parts < <(find "$RUNNER_TEMP/locale-shard-source" -type f \( -name '*.tar' -o -name '*.tar.zst' \) 2>/dev/null | sort)
          [ "${#source_parts[@]}" -gt 0 ] || fail "no .tar in the downloaded locale-shard-source artifact"
          rm -rf dist
          # shellcheck source=/dev/null
          source "$PUBLISHER_ROOT/scripts/lib/parallel-tar.sh"
          ptar_extract dist "${source_parts[@]}" \
            || fail "extracting ${#source_parts[@]} source archive part(s) failed"
          rm -f "${source_parts[@]}"
          [ -s dist/build-id.txt ] || fail "dist/build-id.txt missing or empty"
          [ "$(cat dist/build-id.txt)" = "$DEPLOY_BUILD_ID" ] || fail "build id $(cat dist/build-id.txt) != $DEPLOY_BUILD_ID"
          [ -s "dist/${BUILD_LOCALE}/index.html" ] || fail "dist/${BUILD_LOCALE}/index.html missing or empty"
          [ -s dist/locale-sitemap-manifest.json ] || fail "dist/locale-sitemap-manifest.json missing or empty"
          node scripts/validate-sitemap-links.mjs \
            --owned-locale="${BUILD_LOCALE}" \
            --verify-manifest=dist/locale-sitemap-manifest.json
          # Keep the validated locale index outside dist while shard pushes,
          # rewrites and pruning mutate that tree. Section-manifest packing
          # runs later and must read this exact source-build index.
          cp dist/locale-sitemap-manifest.json "$RUNNER_TEMP/locale-sitemap-manifest-${BUILD_LOCALE}.json"
          # Only what deploy.yml's «Pack non-IT locale shard source artifact»
          # ALWAYS packs may be required here: the locale subtree,
          # build-id.txt and the owned sitemap manifest. It adds the flat
          # homepage `<loc>.html` only when the build emitted one, and
          # push-locale-shard.sh stages it only if present, so requiring it
          # failed every non-IT tail without a word (publish runs 37255215160
          # and 37271778943: plain `test` exit 1 right after a good extract,
          # with de/index.html present and the build id equal). Its absence is
          # reported, not fatal.
          if [ ! -s "dist/${BUILD_LOCALE}.html" ]; then
            echo "::warning title=Flat locale homepage absent::dist/${BUILD_LOCALE}.html is not in the artifact; the shard is published without /${BUILD_LOCALE}.html (/${BUILD_LOCALE}/ is the homepage)"
          fi

      # A replayed publisher can consume a source build produced before this
      # handoff existed. Those builds never had a render budget, so an empty
      # list is safe. New builds require the sidecar; a missing artifact must
      # stop this publisher before it can publish pages with 404 OG references.
      - name: Detect deferred job OG fallback handoff contract
        if: matrix.locale != 'it'
        id: job-og-fallback-contract
        shell: bash
        run: |
          if [ -f build-plugins/shared/jobOgRenderBudget.mjs ] \
            && grep -Fq 'JOB_OG_RENDER_BUDGET_S:' .github/workflows/deploy.yml; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download deferred job OG fallback handoff from build run
        if: matrix.locale != 'it' && steps.job-og-fallback-contract.outputs.required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: job-og-deferred-fallbacks-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/job-og-deferred
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deferred job OG fallback handoff
        if: matrix.locale != 'it'
        shell: bash
        env:
          HANDOFF_REQUIRED: ${{ steps.job-og-fallback-contract.outputs.required || 'false' }}
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/job-og-deferred/fallbacks.json"
          mkdir -p .cache/og-jobs
          if [ "$HANDOFF_REQUIRED" = true ]; then
            test -s "$source_file" || { echo '::error::deferred job OG fallback handoff is missing'; exit 1; }
          else
            mkdir -p "$RUNNER_TEMP/job-og-deferred"
            printf '[]\n' > "$source_file"
          fi
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(v)||v.some(s=>typeof s!=="string"||!s||s.includes("/")||s.includes("\\")))process.exit(1)' "$source_file"
          cp "$source_file" "$JOB_OG_DEFERRED_FALLBACKS_FILE"

      # New builds mark the non-IT source tar as pending hreflang finalization.
      # Older successful runs already uploaded rewritten output and do not have
      # the marker contract in their source checkout, so their artifact remains
      # publishable without a second rewrite. A new producer missing its marker
      # fails closed instead of publishing a partial cross-locale graph.
      - name: Classify non-IT source hreflang state
        id: locale-source-hreflang-state
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/ci/locale-source-hreflang-contract.mjs ]; then
            state="$(node scripts/ci/locale-source-hreflang-contract.mjs "$RUNNER_TEMP/locale-shard-source")"
          else
            state='already-finalized'
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "[hreflang] non-IT source state=$state"

      # The build run is terminal before this publisher starts, so all locale
      # manifests are already published. Reuse the same attempt-aware exchange
      # logic as the IT build leg; this scan/download runs once in the deferred
      # publisher instead of keeping each non-IT build runner parked for hours.
      - name: Exchange same-run hreflang manifests for deferred locale
        if: steps.locale-source-hreflang-state.outputs.state == 'pending'
        id: exchange-deferred-hreflang-manifests
        timeout-minutes: 285
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HREFlANG_BUILD_LOCALE: ${{ matrix.locale }}
          HREFlANG_JOB_START_EPOCH: ${{ env.CDN_JOB_START_EPOCH }}
          HREFlANG_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/ci/exchange-hreflang-manifests.mjs --manifest-dir .cache/hreflang-index-manifest

      - name: Finalize deferred same-run hreflang graph
        if: steps.locale-source-hreflang-state.outputs.state == 'pending'
        # Full-corpus reciprocal pass over ~1.85 M pages: fr took 29m40 in
        # publish run 43237316438 and both fr and de hit the old 30-minute cap
        # in 43277796125 (#18252 removed the in-heap prepass cache). The job
        # keeps its 285-minute budget; this only stops a healthy pass from
        # being killed at the boundary.
        timeout-minutes: 60
        run: node scripts/ci/hreflang-index-manifest.mjs dist --manifest-dir .cache/hreflang-index-manifest --require-foreign-manifests

      - name: Refresh expired archive evidence after Hreflang finalization
        # This tail may consume historical source artifacts, so use the current
        # publisher contract rather than the source SHA checkout.
        run: node "$PUBLISHER_ROOT/scripts/ci/shard-content-manifest.mjs" refresh-expired-archive-evidence --root "$PUBLISHER_DIST" --locale "${BUILD_LOCALE}" --evidence-manifest "$PUBLISHER_DIST/assets/expired-archive-evidence-${BUILD_LOCALE}.json"

      - name: Validate finalized non-IT locale shard output
        id: validate-finalized-locale
        run: node scripts/ci/validate-locale-shard-build.mjs dist

      # The historical full-dist schema walker is too expensive after shard
      # publication. Each locale is already materialized here, so validate its
      # complete JobPosting set before any external shard side effect.
      - name: Validate non-IT JobPosting schema before shard publication
        if: matrix.locale != 'it' && env.DURABLE_LOCALE_PUBLISHED != 'true'
        run: npm run validate:jobposting-schema

      - name: Wait for current IT CDN build id before non-IT shard pushes
        id: cdn-gate
        if: always() && env.DURABLE_LOCALE_PUBLISHED != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The gate reads the IT leg from the jobs of the DEPLOY run, not of
          # this publish run. GitHub ignores any `env:` assignment to a default
          # GITHUB_*/RUNNER_* variable, so using the publish run id here would
          # leave the gate polling this run, where no `build-locale (it)`
          # exists: phase 1 answered `unobservable` for its whole 3 h budget and
          # every non-IT shard tail stayed unpublished (run 37255215160). The id
          # travels under a free name and becomes GITHUB_RUN_ID only in `run:`.
          CDN_IT_RUN_ID: ${{ github.run_id }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          CDN_WAIT_TIMEOUT_S: 2700
          CDN_WAIT_MARGIN_WARN_S: 600
          CDN_IT_JOB_NAME: Publish IT CDN assets first
          CDN_IT_READY_STEP_NAME: Require IT CDN build id before shard pushes
          CDN_IT_READY_TIMEOUT_S: 10800
          CDN_IT_READY_INTERVAL_S: 30
          CDN_JOB_START_EPOCH: ${{ env.CDN_JOB_START_EPOCH }}
          CDN_JOB_DEADLINE_S: 21600
          CDN_JOB_FINISH_RESERVE_S: 180
        run: GITHUB_RUN_ID="$CDN_IT_RUN_ID" bash scripts/lib/wait-cdn-build-id.sh "$DEPLOY_BUILD_ID"

      # A duplicate publisher can have passed the matrix-level resolver before
      # the first publisher wrote its receipt. Re-read after this locale job has
      # acquired its own concurrency slot and before any shard push; an
      # unreadable ledger fails closed instead of repeating an expensive push.
      - name: Recheck durable locale receipt before shard side effects
        if: matrix.locale != 'it' && env.DURABLE_LOCALE_PUBLISHED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          receipt_state="$RUNNER_TEMP/durable-locale-receipt"
          node receipt-resolver/scripts/ci/publish-receipts.mjs \
            --resolve \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --locales "$BUILD_LOCALE" \
            --github-output "$receipt_state" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$receipt_state" >> "$GITHUB_OUTPUT"
          if grep -Fxq "published_locales_csv=$BUILD_LOCALE" "$receipt_state"; then
            echo "DURABLE_LOCALE_PUBLISHED=true" >> "$GITHUB_ENV"
            : > "$RUNNER_TEMP/shard-ok-${BUILD_LOCALE}"
            echo "✅ ${BUILD_LOCALE} shard receipt appeared while this publisher was queued; skipping duplicate side effects"
          fi

      # ── Section shards (non-IT) → frontaliere-<section>-<loc> shard repos ──
      # Section shard push FIRST (before the offload below) so
      # push-section-shard.sh stages the RAW subtree and offloads its own
      # copy exactly once; then strip it so the locale shard drops below the
      # 10 GB Pages cap. One repo PER (section, locale) (frontaliere-<section>-<loc>).
      # Push uses the deploy key, with the Remote-Config PAT as a safety-net
      # when a key is missing; strip still gates on <SECTION>_SHARD_LIVE + the
      # push ok-marker.
      - name: Push section shards (non-IT → frontaliere-<section>-<loc>)
        id: push-section-shards-nonit
        if: matrix.locale != 'it' && env.DURABLE_LOCALE_PUBLISHED != 'true'
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          SHARD_SVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_IT_DEPLOY_KEY }}
          SHARD_SVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_EN_DEPLOY_KEY }}
          SHARD_SVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_DE_DEPLOY_KEY }}
          SHARD_SVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_FR_DEPLOY_KEY }}
          SHARD_ZURIGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_IT_DEPLOY_KEY }}
          SHARD_ZURIGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_EN_DEPLOY_KEY }}
          SHARD_ZURIGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_DE_DEPLOY_KEY }}
          SHARD_ZURIGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_FR_DEPLOY_KEY }}
          SHARD_ARGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_IT_DEPLOY_KEY }}
          SHARD_ARGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_EN_DEPLOY_KEY }}
          SHARD_ARGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_DE_DEPLOY_KEY }}
          SHARD_ARGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_FR_DEPLOY_KEY }}
          SHARD_APPENZELLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_IT_DEPLOY_KEY }}
          SHARD_APPENZELLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_EN_DEPLOY_KEY }}
          SHARD_APPENZELLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_DE_DEPLOY_KEY }}
          SHARD_APPENZELLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_FR_DEPLOY_KEY }}
          SHARD_BASILEA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_IT_DEPLOY_KEY }}
          SHARD_BASILEA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_EN_DEPLOY_KEY }}
          SHARD_BASILEA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_DE_DEPLOY_KEY }}
          SHARD_BASILEA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_FR_DEPLOY_KEY }}
          SHARD_BERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_IT_DEPLOY_KEY }}
          SHARD_BERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_EN_DEPLOY_KEY }}
          SHARD_BERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_DE_DEPLOY_KEY }}
          SHARD_BERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_FR_DEPLOY_KEY }}
          SHARD_FRIBURGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_IT_DEPLOY_KEY }}
          SHARD_FRIBURGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_EN_DEPLOY_KEY }}
          SHARD_FRIBURGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_DE_DEPLOY_KEY }}
          SHARD_FRIBURGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_FR_DEPLOY_KEY }}
          SHARD_GINEVRA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_IT_DEPLOY_KEY }}
          SHARD_GINEVRA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_EN_DEPLOY_KEY }}
          SHARD_GINEVRA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_DE_DEPLOY_KEY }}
          SHARD_GINEVRA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_FR_DEPLOY_KEY }}
          SHARD_GLARONA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_IT_DEPLOY_KEY }}
          SHARD_GLARONA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_EN_DEPLOY_KEY }}
          SHARD_GLARONA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_DE_DEPLOY_KEY }}
          SHARD_GLARONA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_FR_DEPLOY_KEY }}
          SHARD_GRIGIONI_IT_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_IT_DEPLOY_KEY }}
          SHARD_GRIGIONI_EN_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_EN_DEPLOY_KEY }}
          SHARD_GRIGIONI_DE_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_DE_DEPLOY_KEY }}
          SHARD_GRIGIONI_FR_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_FR_DEPLOY_KEY }}
          SHARD_GIURA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_IT_DEPLOY_KEY }}
          SHARD_GIURA_EN_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_EN_DEPLOY_KEY }}
          SHARD_GIURA_DE_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_DE_DEPLOY_KEY }}
          SHARD_GIURA_FR_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_FR_DEPLOY_KEY }}
          SHARD_LUCERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_IT_DEPLOY_KEY }}
          SHARD_LUCERNA_EN_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_EN_DEPLOY_KEY }}
          SHARD_LUCERNA_DE_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_DE_DEPLOY_KEY }}
          SHARD_LUCERNA_FR_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_FR_DEPLOY_KEY }}
          SHARD_NEUCHATEL_IT_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_IT_DEPLOY_KEY }}
          SHARD_NEUCHATEL_EN_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_EN_DEPLOY_KEY }}
          SHARD_NEUCHATEL_DE_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_DE_DEPLOY_KEY }}
          SHARD_NEUCHATEL_FR_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_FR_DEPLOY_KEY }}
          SHARD_NIDVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_IT_DEPLOY_KEY }}
          SHARD_NIDVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_EN_DEPLOY_KEY }}
          SHARD_NIDVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_DE_DEPLOY_KEY }}
          SHARD_NIDVALDO_FR_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_FR_DEPLOY_KEY }}
          SHARD_OBVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_IT_DEPLOY_KEY }}
          SHARD_OBVALDO_EN_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_EN_DEPLOY_KEY }}
          SHARD_OBVALDO_DE_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_DE_DEPLOY_KEY }}
          SHARD_OBVALDO_FR_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_FR_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_IT_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_EN_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_DE_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_FR_DEPLOY_KEY }}
          SHARD_SOLETTA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_IT_DEPLOY_KEY }}
          SHARD_SOLETTA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_EN_DEPLOY_KEY }}
          SHARD_SOLETTA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_DE_DEPLOY_KEY }}
          SHARD_SOLETTA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_FR_DEPLOY_KEY }}
          SHARD_SVITTO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_IT_DEPLOY_KEY }}
          SHARD_SVITTO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_EN_DEPLOY_KEY }}
          SHARD_SVITTO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_DE_DEPLOY_KEY }}
          SHARD_SVITTO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_FR_DEPLOY_KEY }}
          SHARD_TURGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_IT_DEPLOY_KEY }}
          SHARD_TURGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_EN_DEPLOY_KEY }}
          SHARD_TURGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_DE_DEPLOY_KEY }}
          SHARD_TURGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_FR_DEPLOY_KEY }}
          SHARD_URI_IT_DEPLOY_KEY: ${{ secrets.SHARD_URI_IT_DEPLOY_KEY }}
          SHARD_URI_EN_DEPLOY_KEY: ${{ secrets.SHARD_URI_EN_DEPLOY_KEY }}
          SHARD_URI_DE_DEPLOY_KEY: ${{ secrets.SHARD_URI_DE_DEPLOY_KEY }}
          SHARD_URI_FR_DEPLOY_KEY: ${{ secrets.SHARD_URI_FR_DEPLOY_KEY }}
          SHARD_VAUD_IT_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_IT_DEPLOY_KEY }}
          SHARD_VAUD_EN_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_EN_DEPLOY_KEY }}
          SHARD_VAUD_DE_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_DE_DEPLOY_KEY }}
          SHARD_VAUD_FR_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_FR_DEPLOY_KEY }}
          SHARD_VALLESE_IT_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_IT_DEPLOY_KEY }}
          SHARD_VALLESE_EN_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_EN_DEPLOY_KEY }}
          SHARD_VALLESE_DE_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_DE_DEPLOY_KEY }}
          SHARD_VALLESE_FR_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_FR_DEPLOY_KEY }}
          SHARD_ZUGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_IT_DEPLOY_KEY }}
          SHARD_ZUGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_EN_DEPLOY_KEY }}
          SHARD_ZUGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_DE_DEPLOY_KEY }}
          SHARD_ZUGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_FR_DEPLOY_KEY }}
          SHARD_SANGALLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_IT_DEPLOY_KEY }}
          SHARD_SANGALLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_EN_DEPLOY_KEY }}
          SHARD_SANGALLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_DE_DEPLOY_KEY }}
          SHARD_SANGALLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_FR_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          SHARD_PUSH_MODE: ${{ vars.SHARD_PUSH_MODE == 'delta' && 'delta' || 'full' }}
          FANOUT_AUTO_THRESHOLD_PCT: ${{ vars.FANOUT_AUTO_THRESHOLD_PCT || '40' }}
          # Default to rewriting only the files a delta push reads; the staged
          # copy is completed in background for validation. Set the repo
          # variable to `off` to restore the full pre-push rewrite.
          SHARD_DELTA_CDN_REWRITE: ${{ vars.SHARD_DELTA_CDN_REWRITE == '' && 'changed' || vars.SHARD_DELTA_CDN_REWRITE }}
          SHARD_PUSH_VERIFY: ${{ vars.SHARD_PUSH_VERIFY == '1' && '1' || '' }}
          # Bench run 40074671144 (ticino-it staged copy, 270'838 files): the
          # CDN rewrite 377.8 s single-thread → 162.5 s on 4 worker threads,
          # tree sha identical; the stage `rm -rf` (165 s) leaves the slot.
          # See scripts/offload-generated-images-cdn.mjs (OFFLOAD_CDN_WORKERS)
          # and scripts/lib/push-section-shard.sh (SHARD_STAGE_RM_ASYNC).
          OFFLOAD_CDN_WORKERS: '4'
          SHARD_STAGE_RM_ASYNC: '1'
          # The source build's commit for the shard commit messages. Not
          # GITHUB_SHA: GitHub ignores env assignments to default GITHUB_* vars,
          # and this dispatch run's default SHA is not the source build SHA.
          DEPLOY_HEAD_SHA: ${{ inputs.source_sha }}
          # Consumed by scripts/ci/report-shard-push-failure.mjs (gh CLI) when a
          # shard push stays unpublished. The job already grants `issues: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Issue #4881 Fase 5 — see ogPagesPlugin.ts's closeBundle docblock
          # and the IT-leg push step above for the full contract.
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
        run: |
          set -uo pipefail
          export GITHUB_SHA="$DEPLOY_HEAD_SHA"
          # Wall-time della fase (#7301): `SECONDS` riparte da 0 a ogni step (ogni
          # `run:` e' una bash nuova) e il trap EXIT lo emette su OGNI uscita —
          # inclusa quella fatale sull'ordering qui sotto — cosi' la storia non
          # perde la fase proprio quando e' andata storta. Stesso pattern dello
          # step `Build` (`wall_seconds`), letto da "Append post-build phase
          # timings row" in fondo al job.
          trap 'echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          loc="${{ matrix.locale }}"
          # Each section pushes to its OWN shard repo — one section's push
          # failure (e.g. a corrupted remote clone) must never skip the
          # others. bp_run_bounded records each failing section instead of
          # aborting the fan-out; the step still ends non-zero (red in the
          # Actions UI) when any section genuinely failed. Incident
          # 2026-07-24 (run 30057726623): svizzera-it's push failure silently
          # aborted the old loop before zurigo-it was even attempted.
          # Bounded-parallel, not unbounded: push-section-shard.sh's own
          # header documents issue #4734 — concurrent `stage` clones (up to
          # several GB each for ticino/svizzera/zurigo) piling up unfreed
          # exhausted runner disk even under the OLD sequential loop. The cap
          # is UNCHANGED at 4 and bp_run_bounded enforces it as a hard ceiling
          # on IN-FLIGHT pushes, so peak `stage` usage is what it was.
          # Sliding window + longest-first ordering (issue #5130) — see the
          # IT-leg push step above and scripts/lib/bounded-parallel.sh.
          cd "$PUBLISHER_ROOT" || {
            echo "::error::publisher checkout is unavailable: $PUBLISHER_ROOT"
            exit 1
          }
          source scripts/lib/bounded-parallel.sh

          section_push_script="$PUBLISHER_ROOT/scripts/lib/push-section-shard.sh"
          if [ ! -f "$section_push_script" ]; then
            echo "::error::publisher helper is unavailable: $section_push_script"
            exit 1
          fi

          # bounded-parallel.sh invokes the worker by name.
          # shellcheck disable=SC2329
          push_one() {
            local section="$1" skip_var rc
            # #4881 Fase 5: same exclusion as the IT-leg push step above —
            # build no longer emitted this section, so a full-replace push
            # here would force-push a near-empty dist/ tree over the shard.
            skip_var="$(echo "$section" | LC_ALL=C tr '[:lower:]' '[:upper:]')_BUILD_EMIT_SKIP"
            if [ "${!skip_var:-}" = "true" ]; then
              echo "$section-$loc: BUILD_EMIT_SKIP=true — excluded from full-replace push (served by fast-publish only)"
              return 0
            fi
            # A full-overlay ticino-fr push of 9.9 GB / 558,573 files completed
            # in 2,524s (run 37728960699). A 60 min worker deadline leaves 18 min
            # beyond that measured run for corpus growth while the 10 min cleanup
            # grace handles child-process termination. Permanent GitHub tree-size
            # rejections are caught by shard_report_largest_tree before upload, so
            # they do not consume this deadline or repeat the same failed push.
            # Timeout leaves the existing live/ok-marker fallback unchanged and
            # does not change page output or indexing directives.
            echo "[section-push] event=start locale=$loc section=$section timeout_seconds=3600 cleanup_grace_seconds=600"
            if timeout --verbose --signal=TERM --kill-after=600s 3600s \
              node scripts/ci/with-shard-writer-lock.mjs \
                --section "$section" --locale "$loc" --policy wait --timeout-ms 3600000 -- \
                bash scripts/lib/push-section-shard.sh "$section" "$loc" "$PUBLISHER_DIST"; then
              echo "[section-push] event=finish locale=$loc section=$section outcome=success"
              return 0
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then
                echo "::error::[section-push] event=timeout locale=$loc section=$section timeout_seconds=3600 cleanup_grace_seconds=600 exit_code=$rc; existing live/ok-marker fallback remains in effect"
              elif [ "$rc" -eq 137 ]; then
                echo "::error::[section-push] event=forced-termination locale=$loc section=$section timeout_seconds=3600 cleanup_grace_seconds=600 exit_code=$rc; inspect timeout signal diagnostics to distinguish deadline escalation from runner termination"
              else
                echo "::error::[section-push] event=finish locale=$loc section=$section outcome=failure exit_code=$rc"
              fi
              return 1
            fi
          }

          # Fatal on an ordering failure — see the IT-leg push step above.
          order="$(bp_section_order "$PUBLISHER_DIST" "$loc" "$PUBLISHER_ROOT")" || {
            echo "::error::could not order the section list — refusing to push a partial set of shards"
            exit 1
          }
          echo "section push order (longest-first): $(echo "$order" | tr '\n' ' ')"

          export BP_FAILED_FILE="$RUNNER_TEMP/shard-push-failed-$loc.txt"
          fail=0
          mapfile -t ordered_sections <<< "$order"
          bp_run_bounded 4 push_one "${ordered_sections[@]}" || fail=1
          # Same visibility contract as the IT leg above — see that comment.
