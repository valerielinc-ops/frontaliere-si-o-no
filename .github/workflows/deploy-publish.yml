name: Publish to GitHub Pages (deploy + validate)

run-name: "Publish Pages build ${{ inputs.source_run_id }} @ ${{ inputs.source_sha }}"

# Second half of the build→publish split (see deploy.yml's concurrency comment).
# deploy.yml only BUILDS (matrix-setup → prep → build-locale ×4) under a
# workflow-level `pages-build-run` lock that releases the moment the build
# finishes. Its final job dispatches this workflow for its own source run; the
# small deploy-request workflow remains only as a status-aware recovery tick.
# This workflow carries its own
# stage-specific locks so a new build can proceed while the previous build's
# validation and post-deploy tail run here independently. Publish admission
# remains all-locale: a new IT snapshot must not be paired with an older
# non-IT shard because the pages emit one cross-locale hreflang graph.
#
# Cross-run handoff: every artifact the deploy/validate/publish steps need was
# produced by the BUILD run (`inputs.source_run_id`). The reusable
# validators already fetch by `deploy_run_id`; the github-pages Pages artifact is
# re-materialised into THIS run below (actions/deploy-pages can only publish an
# artifact that lives in the current run).

on:
  # The cheap coordinator admits one immutable source run explicitly. The
  # source admission job below re-reads that run from GitHub before any plan or
  # Pages job can start, so a manually forged dispatch cannot select an
  # arbitrary artifact by supplying a plausible-looking SHA.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Deploy to GitHub Pages run that produced the artifact'
        required: true
        type: string
      source_sha:
        description: 'Exact main SHA of the source build'
        required: true
        type: string
      source_conclusion:
        description: 'Verified source build conclusion'
        required: true
        type: string
      source_branch:
        description: 'Source build branch'
        required: true
        type: string
      source_event_name:
        description: 'Source build event'
        required: true
        type: string
      source_workflow:
        description: 'Source build workflow name'
        required: true
        type: string
      source_workflow_path:
        description: 'Source build workflow path'
        required: true
        type: string
      source_workflow_id:
        description: 'Source build workflow ID'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write     # for github-issue-creator on deploy failure
  actions: read     # for cross-run download-artifact
  statuses: write   # durable Pages/shard receipts on the immutable source SHA

# There is deliberately NO workflow-level lock here. The Pages deploy job owns
# the shared `pages-deploy` lock below; the long dist validator and the
# post-deploy side-effects have independent locks. A workflow-level lock would
# make a validator that is still rehydrating a 27 GB logical dist hold the
# Pages upload slot, even after the current deploy already finished.
#
# The Pages job's group remains CONDITIONAL on the per-locale admission plan
# proving a publishable IT artifact. Do not collapse it back to a bare
# `pages-deploy`: provenance-blocked runs must not evict a real upload. The
# group is also shared with restore-from-artifact.yml, so recovery cannot race
# a live upload.
#
# The coordinator admits one source build at a time. `cancel-in-progress: false`
# therefore protects the in-flight upload without relying on GitHub's one-entry
# pending queue; the next coordinator tick dispatches the newest successful
# build after this run releases the slot.
jobs:
  validate-source-build:
    name: Validate canonical source build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_run_attempt: ${{ steps.validate-source-build-identity.outputs.source_run_attempt }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false

      - name: Reject non-main publish dispatch
        env:
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_REF: ${{ github.ref }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_SOURCE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/production-promotion-gate.mjs trigger

      - name: Validate source build identity and inputs
        id: validate-source-build-identity
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_CONCLUSION: ${{ inputs.source_conclusion }}
          SOURCE_EVENT_NAME: ${{ inputs.source_event_name }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_WORKFLOW_PATH: ${{ inputs.source_workflow_path }}
          SOURCE_WORKFLOW_ID: ${{ inputs.source_workflow_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*)
              echo '::error::source_run_id must contain only decimal digits'
              exit 1
              ;;
          esac
          source_run_json="$RUNNER_TEMP/canonical-source-run.json"
          # The source run's final job dispatches this publisher before GitHub
          # marks that run completed. Wait for the authoritative run record,
          # then validate the final conclusion and identity; never infer
          # success from the build matrix alone.
          for attempt in $(seq 1 60); do
            gh api --method GET \
              "repos/${PROMOTION_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              > "$source_run_json"
            source_status=$(jq -r '.status // empty' "$source_run_json")
            if [ "$source_status" = 'completed' ]; then break; fi
            if [ "$attempt" = '60' ]; then
              echo '::error::source build did not reach a terminal status before publish admission timed out'
              exit 1
            fi
            sleep 10
          done
          source_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1 and . == floor)' "$source_run_json")
          echo "source_run_attempt=$source_run_attempt" >> "$GITHUB_OUTPUT"
          PROMOTION_SOURCE_RUN_ID="$SOURCE_RUN_ID" \
            node scripts/ci/production-promotion-gate.mjs source-run < "$source_run_json"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" \
            --arg conclusion "$SOURCE_CONCLUSION" \
            --arg event "$SOURCE_EVENT_NAME" \
            --arg workflow "$SOURCE_WORKFLOW" \
            --arg workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg workflow_id "$SOURCE_WORKFLOW_ID" \
            '(.head_sha == $sha) and
             (.head_branch == $branch) and
             (.conclusion == $conclusion) and
             (.event == $event) and
             (.name == $workflow) and
             (.path == $workflow_path) and
             ((.workflow_id | tostring) == $workflow_id)' \
            "$source_run_json" >/dev/null

  # ───────────────────────────────────────────────────────────────────────
  # resolve-publish-plan: turn the source build matrix into an explicit,
  # fail-closed locale handoff plan. The source conclusion and
  # a successful IT leg are not enough: every locale source artifact must be
  # proven before the deferred shard tail can start. A cancelled/failed leg is
  # reported stale for recovery, but it blocks this snapshot rather than being
  # mixed with a new locale's SEO output.
  # ───────────────────────────────────────────────────────────────────────
  resolve-publish-plan:
    needs: validate-source-build
    if: needs.validate-source-build.result == 'success'
    name: Resolve per-locale publish plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      allowed: ${{ steps.plan.outputs.allowed }}
      it_admitted: ${{ steps.plan.outputs.it_admitted }}
      mode: ${{ steps.plan.outputs.mode }}
      build_id: ${{ steps.plan.outputs.build_id }}
      source_run_attempt: ${{ needs.validate-source-build.outputs.source_run_attempt }}
      healthy_locales: ${{ steps.plan.outputs.healthy_locales }}
      stale_locales: ${{ steps.plan.outputs.stale_locales }}
      stale_reasons: ${{ steps.plan.outputs.stale_reasons }}
      tail_locales: ${{ steps.plan.outputs.tail_locales }}
      recovery_required: ${{ steps.plan.outputs.recovery_required }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout admission validator
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Read source matrix jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"

      - name: Read source artifact inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            | jq '{artifacts: [ .[] | .artifacts[] | {name, expired} ]}' \
            > "$RUNNER_TEMP/source-artifacts.json"

      # A cancelled leg can stop before its final `always()` step, so missing
      # receipts are a valid input to the resolver. Successful legs, however,
      # cannot be admitted without their receipt.
      - name: Download locale provenance receipts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: locale-publish-provenance-*
          path: ${{ runner.temp }}/locale-publish-provenance
          merge-multiple: false
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve fail-closed locale plan
        id: plan
        if: always()
        env:
          SOURCE_RUN_CONCLUSION: ${{ inputs.source_conclusion }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/resolve-locale-publish-plan.mjs \
            --jobs-file "$RUNNER_TEMP/source-jobs.json" \
            --provenance-dir "$RUNNER_TEMP/locale-publish-provenance" \
            --source-artifacts-file "$RUNNER_TEMP/source-artifacts.json" \
            --run-conclusion "$SOURCE_RUN_CONCLUSION" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  # A source run created before the build→publish split can leave non-IT
  # receipts in the old full-publish shape. Keep that payload fail-closed and
  # enqueue one current-HEAD build request. This job deliberately does not
  # dispatch deploy.yml: the self-driven deploy schedule is the sole consumer
  # of the durable request, so an old source run can never publish shards or
  # Pages as a side effect.
  recover-legacy-publish-contract:
    name: Recover legacy publish contract through deploy queue
    needs: resolve-publish-plan
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.recovery_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout current deploy queue helper
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /scripts/ci/deploy-rearm-request.mjs
          sparse-checkout-cone-mode: false
      - name: Enqueue one current build for the legacy source contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/deploy-rearm-request.mjs \
            --reason legacy-publish-contract \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA"

  # Commit statuses are the durable idempotency ledger. The source artifacts
  # remain the payload, while these receipts answer the question artifacts
  # cannot: did this exact source run already push this locale, or complete
  # the Pages deployment? A failed status read blocks closed rather than
  # silently republishing a build whose state is unknown.
  resolve-publish-receipts:
    name: Resolve durable shard and Pages receipts
    needs: resolve-publish-plan
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.allowed == 'true' &&
          needs.resolve-publish-plan.outputs.it_admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      pages_deployed: ${{ steps.receipts.outputs.pages_deployed }}
      published_locales: ${{ steps.receipts.outputs.published_locales }}
      published_locales_csv: ${{ steps.receipts.outputs.published_locales_csv }}
      pending_locales: ${{ steps.receipts.outputs.pending_locales }}
      pending_nonit_locales: ${{ steps.receipts.outputs.pending_nonit_locales }}
    steps:
      - name: Checkout receipt resolver
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /scripts/ci/publish-receipts.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve source-run receipts
        id: receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAIL_LOCALES: ${{ needs.resolve-publish-plan.outputs.tail_locales }}
        run: |
          set -euo pipefail
          node scripts/ci/publish-receipts.mjs \
            --resolve \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --locales "$(node -e 'process.stdout.write(JSON.parse(process.env.TAIL_LOCALES || "[]").join(","))')" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  # Make the layout decision once for the complete four-locale source before
  # either parallel shard publisher can push. A source predating the metrics
  # contract can only pass through sticky-registry probes; contracted sources
  # still fail closed when any locale measurement is missing.
  preflight-section-tree-layouts:
    name: Preflight sticky section tree layouts
    needs: [resolve-publish-plan, resolve-publish-receipts]
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.allowed == 'true' &&
          needs.resolve-publish-receipts.result == 'success' &&
          (needs.resolve-publish-receipts.outputs.pending_nonit_locales != '[]' ||
           contains(fromJSON(needs.resolve-publish-plan.outputs.tail_locales), 'it')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - name: Checkout current layout publisher
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/load-rc-env.mjs
            /scripts/lib/
            /scripts/ci/measure-section-tree-layout-metrics.mjs
            /scripts/ci/section-tree-layout-preflight.mjs
            /infra/cloudflare-worker/
          sparse-checkout-cone-mode: false

      - name: Check the source tree metrics contract
        id: source-contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source SHA is invalid; refusing section pushes"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          if git cat-file -e "$SOURCE_SHA:scripts/ci/measure-section-tree-layout-metrics.mjs" 2>/dev/null; then
            echo "has_metrics_contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metrics_contract=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache node_modules
        id: layout-node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.layout-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Download section tree metrics from all source-run attempts
        uses: actions/download-artifact@v8
        with:
          pattern: section-tree-layout-metrics-*-${{ inputs.source_run_id }}-*
          path: ${{ runner.temp }}/section-tree-layout-metrics
          merge-multiple: false
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Register and probe cross-locale fan-out decisions
        id: preflight
        env:
          FANOUT_AUTO_THRESHOLD_PCT: ${{ vars.FANOUT_AUTO_THRESHOLD_PCT || '40' }}
          SHARD_REMOTE_TREE_LIMIT_BYTES: '52428800'
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.resolve-publish-plan.outputs.source_run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_HAS_METRICS_CONTRACT: ${{ steps.source-contract.outputs.has_metrics_contract }}
          PENDING_NONIT_LOCALES: ${{ needs.resolve-publish-receipts.outputs.pending_nonit_locales }}
          TAIL_LOCALES: ${{ needs.resolve-publish-plan.outputs.tail_locales }}
          METRICS_DIR: ${{ runner.temp }}/section-tree-layout-metrics
        run: |
          set -euo pipefail
          PREFLIGHT_LOCALES="$(node -e '
            const pending = JSON.parse(process.env.PENDING_NONIT_LOCALES || "[]");
            const tail = JSON.parse(process.env.TAIL_LOCALES || "[]");
            const locales = [...new Set([...pending, ...(tail.includes("it") ? ["it"] : [])])];
            process.stdout.write(locales.join(","));
          ')"
          if [ -z "$PREFLIGHT_LOCALES" ]; then
            echo "::error::preflight has no section-push locales; refusing section pushes"
            exit 1
          fi
          node scripts/ci/section-tree-layout-preflight.mjs \
            --metrics-dir "$METRICS_DIR" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --source-has-metrics-contract "$SOURCE_HAS_METRICS_CONTRACT" \
            --locales "$PREFLIGHT_LOCALES" \
            --threshold "$FANOUT_AUTO_THRESHOLD_PCT" \
            --tree-limit "$SHARD_REMOTE_TREE_LIMIT_BYTES" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # Publish the IT CDN payload before either IT or non-IT HTML shard pushes.
  # Its success is an explicit dependency of both fan-outs.
  publish-it-cdn:
    name: Publish IT CDN assets first
    needs: [resolve-publish-plan]
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.allowed == 'true' &&
          contains(fromJSON(needs.resolve-publish-plan.outputs.tail_locales), 'it') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: it-cdn-assets-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      cdn_build_id: ${{ steps.cdn-ready.outputs.build_id }}
      cdn_base: ${{ steps.cdn-ready.outputs.cdn_base }}
    steps:
      - name: Checkout IT publisher sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Restore last published R2 OG manifest
        if: ${{ vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both' }}
        uses: actions/cache/restore@v6
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}
          restore-keys: r2-og-published-
      - name: Download IT root source artifact
        uses: actions/download-artifact@v8
        with:
          name: it-publish-root-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/it-publish-root
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract IT root source artifact
        run: |
          set -euo pipefail
          mapfile -t root_parts < <(find "$RUNNER_TEMP/it-publish-root" -maxdepth 1 -type f \
            \( -name 'it-publish-root.part-*.tar.zst' -o -name 'it-publish-root.tar.zst' \) | sort)
          (( ${#root_parts[@]} > 0 )) || { echo '::error::IT root source archive parts are missing'; exit 1; }
          source scripts/lib/parallel-tar.sh
          ptar_extract "$GITHUB_WORKSPACE" "${root_parts[@]}"
      - name: Push generated assets to CDN (early — ahead of the shard pushes)
        id: cdn-push-early
        continue-on-error: true
        timeout-minutes: 45
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          DEPLOY_CDN_PUSH_ONLY: '1'
          R2_TIMEOUT_OG_S: '900'
        run: |
          started_at="$(date +%s)"
          set +e
          bash scripts/lib/deploy-it-pages-prep.sh
          status=$?
          ended_at="$(date +%s)"
          set -e
          {
            echo "started_at=$started_at"
            echo "ended_at=$ended_at"
            echo "duration_s=$((ended_at - started_at))"
            echo "r2_timeout_og_s=${R2_TIMEOUT_OG_S:-unknown}"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Save R2 OG manifest after early CDN push
        if: ${{ always() && (vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both') && hashFiles('.cache/r2-og-published-manifest.json') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}-${{ hashFiles('.cache/r2-og-published-manifest.json') }}
      - name: Retry early CDN push (before the section shards give up)
        id: cdn-push-early-retry
        if: steps.cdn-push-early.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 45
        env:
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          CDN_TARGET: ${{ vars.CDN_TARGET || 'pages' }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          DEPLOY_CDN_PUSH_ONLY: '1'
        run: |
          started_at="$(date +%s)"
          set +e
          bash scripts/lib/deploy-it-pages-prep.sh
          status=$?
          ended_at="$(date +%s)"
          set -e
          {
            echo "started_at=$started_at"
            echo "ended_at=$ended_at"
            echo "duration_s=$((ended_at - started_at))"
            echo "r2_timeout_og_s=${R2_TIMEOUT_OG_S:-unknown}"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Save R2 OG manifest after early CDN retry
        if: ${{ always() && steps.cdn-push-early-retry.outcome != 'skipped' && (vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both') && hashFiles('.cache/r2-og-published-manifest.json') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}-${{ hashFiles('.cache/r2-og-published-manifest.json') }}
      - name: Observe IT early CDN push budget (advisory)
        id: cdn-early-push-budget-observed
        if: always()
        continue-on-error: true
        env:
          EARLY_OUTCOME: ${{ steps.cdn-push-early.outcome }}
          EARLY_STARTED_AT: ${{ steps.cdn-push-early.outputs.started_at }}
          EARLY_ENDED_AT: ${{ steps.cdn-push-early.outputs.ended_at }}
          EARLY_DURATION_S: ${{ steps.cdn-push-early.outputs.duration_s }}
          RETRY_OUTCOME: ${{ steps.cdn-push-early-retry.outcome }}
          RETRY_STARTED_AT: ${{ steps.cdn-push-early-retry.outputs.started_at }}
          RETRY_ENDED_AT: ${{ steps.cdn-push-early-retry.outputs.ended_at }}
          RETRY_DURATION_S: ${{ steps.cdn-push-early-retry.outputs.duration_s }}
          R2_TIMEOUT_OG_S: ${{ steps.cdn-push-early.outputs.r2_timeout_og_s || steps.cdn-push-early-retry.outputs.r2_timeout_og_s || '900' }}
        run: |
          set -euo pipefail
          cdnEarlyPushBudgetObserved() {
            local cap_seconds=2700
            local early_outcome="${EARLY_OUTCOME:-unknown}"
            local retry_outcome="${RETRY_OUTCOME:-unknown}"
            local early_duration="${EARLY_DURATION_S:-unknown}"
            local retry_duration="${RETRY_DURATION_S:-unknown}"
            local early_seconds=0
            local retry_seconds=0
            local early_recorded=0
            local retry_recorded=0

            if [[ "$early_duration" =~ ^[0-9]+$ ]]; then
              early_seconds="$early_duration"
              early_recorded=1
            fi
            if [[ "$retry_duration" =~ ^[0-9]+$ ]]; then
              retry_seconds="$retry_duration"
              retry_recorded=1
            fi

            local early_display='unknown'
            local retry_display='unknown'
            if (( early_recorded )); then early_display="${early_seconds}s"; fi
            if (( retry_recorded )); then retry_display="${retry_seconds}s"; fi

            local max_seconds=0
            local max_display='unknown'
            local comparison='not available (duration missing)'
            if (( early_recorded || retry_recorded )); then
              max_seconds="$early_seconds"
              if (( retry_recorded && retry_seconds > max_seconds )); then max_seconds="$retry_seconds"; fi
              max_display="${max_seconds}s"
              if (( max_seconds <= cap_seconds )); then
                comparison="within 45 min by $((cap_seconds - max_seconds))s"
              else
                comparison="over 45 min by $((max_seconds - cap_seconds))s"
              fi
            fi

            local tail_display='unknown'
            if [[ "${EARLY_STARTED_AT:-}" =~ ^[0-9]+$ ]] && [[ "${RETRY_ENDED_AT:-}" =~ ^[0-9]+$ ]]; then
              local tail_seconds=$((RETRY_ENDED_AT - EARLY_STARTED_AT))
              (( tail_seconds < 0 )) && tail_seconds=0
              tail_display="${tail_seconds}s"
            elif [[ "${EARLY_STARTED_AT:-}" =~ ^[0-9]+$ ]] && [[ "${EARLY_ENDED_AT:-}" =~ ^[0-9]+$ ]]; then
              local tail_seconds=$((EARLY_ENDED_AT - EARLY_STARTED_AT))
              (( tail_seconds < 0 )) && tail_seconds=0
              tail_display="${tail_seconds}s"
            fi

            {
              echo '### IT early CDN push budget (advisory)'
              echo
              echo '| Attempt | Outcome | Duration | R2_TIMEOUT_OG_S | Comparison with 45-minute cap |'
              echo '| --- | --- | ---: | ---: | --- |'
              printf '| early push | `%s` | `%s` | `%s` | `%s` |\n' "$early_outcome" "$early_display" "${R2_TIMEOUT_OG_S:-unknown}" "$comparison"
              printf '| retry | `%s` | `%s` | `%s` | `%s` |\n' "$retry_outcome" "$retry_display" "${R2_TIMEOUT_OG_S:-unknown}" "$comparison"
              printf '| measured early-push tail span | — | `%s` | — | max attempt `%s` |\n' "$tail_display" "$max_display"
              echo
              echo '_Read-only observer: this summary does not change the 45-minute step timeout, retry, or `cdn-ready` gate._'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "cdnEarlyPushBudgetObserved: early=${early_outcome}/${early_display} retry=${retry_outcome}/${retry_display} tail=${tail_display} cap=2700s R2_TIMEOUT_OG_S=${R2_TIMEOUT_OG_S:-unknown}"
          }
          cdnEarlyPushBudgetObserved
      - name: Require IT CDN build id before shard pushes
        id: cdn-ready
        if: always()
        env:
          EARLY_OUTCOME: ${{ steps.cdn-push-early.outcome }}
          RETRY_OUTCOME: ${{ steps.cdn-push-early-retry.outcome }}
          EXPECTED_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ "$EARLY_OUTCOME" != success ] && [ "$RETRY_OUTCOME" != success ]; then
            echo "::error::IT CDN push failed twice; section and locale shard pushes must not run."
            exit 1
          fi
          echo "build_id=$EXPECTED_BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "cdn_base=https://cdn.frontaliereticino.ch" >> "$GITHUB_OUTPUT"
      - name: Save final R2 OG manifest cache
        if: ${{ always() && (vars.CDN_TARGET == 'r2' || vars.CDN_TARGET == 'both') && hashFiles('.cache/r2-og-published-manifest.json') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/r2-og-published-manifest.json
          key: r2-og-published-${{ github.run_id }}-final-${{ hashFiles('.cache/r2-og-published-manifest.json') }}

  # Six balanced groups run concurrently. Zurich and Switzerland each retain
  # a dedicated runner; the other live sections are greedily balanced by file
  # count in the immutable source plan.
  push-it-shard-groups:
    name: Push IT section group (${{ matrix.group }})
    needs: [resolve-publish-plan, publish-it-cdn, preflight-section-tree-layouts]
    if: >-
      ${{ needs.resolve-publish-plan.result == 'success' &&
          needs.resolve-publish-plan.outputs.allowed == 'true' &&
          needs.preflight-section-tree-layouts.result == 'success' &&
          contains(fromJSON(needs.resolve-publish-plan.outputs.tail_locales), 'it') &&
          needs.publish-it-cdn.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        group: [zurigo, svizzera, small-1, small-2, small-3, small-4]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: shard-secrets-overflow
    concurrency:
      group: it-section-tail-${{ matrix.group }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Record IT shard group job start (#7106 deadline safety margin)
        run: echo "CDN_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout source workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Download IT shard source plan
        uses: actions/download-artifact@v8
        with:
          name: it-shard-source-plan-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/it-publish-plan
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download IT shard source group
        uses: actions/download-artifact@v8
        with:
          name: it-shard-source-group-${{ matrix.group }}-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/it-shard-source-group
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore source-side shard inputs
        run: |
          set -euo pipefail
          mkdir -p .cache/incremental-manifest .cache/og-jobs
          if [ -d "$RUNNER_TEMP/it-publish-plan/incremental-manifest" ]; then
            cp -a "$RUNNER_TEMP/it-publish-plan/incremental-manifest/." .cache/incremental-manifest/
          fi
          if [ -f "$RUNNER_TEMP/it-publish-plan/og-jobs/.deferred-fallbacks.json" ]; then
            cp "$RUNNER_TEMP/it-publish-plan/og-jobs/.deferred-fallbacks.json" .cache/og-jobs/.deferred-fallbacks.json
          fi
          mapfile -t group_parts < <(find "$RUNNER_TEMP/it-shard-source-group" -maxdepth 1 -type f \
            \( -name 'it-shard-source-group-${{ matrix.group }}.part-*.tar.zst' \
               -o -name 'it-shard-source-group-${{ matrix.group }}.tar.zst' \) | sort)
          (( ${#group_parts[@]} > 0 )) || { echo '::error::IT shard source group archive parts are missing'; exit 1; }
          source scripts/lib/parallel-tar.sh
          ptar_extract "$GITHUB_WORKSPACE" "${group_parts[@]}"
      - name: Wait for current IT CDN build id before IT section pushes
        id: cdn-gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_IT_RUN_ID: ${{ github.run_id }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          CDN_WAIT_TIMEOUT_S: 2700
          CDN_WAIT_MARGIN_WARN_S: 600
          CDN_IT_JOB_NAME: Publish IT CDN assets first
          CDN_IT_READY_STEP_NAME: Require IT CDN build id before shard pushes
          CDN_IT_READY_TIMEOUT_S: 10800
          CDN_IT_READY_INTERVAL_S: 30
          CDN_JOB_START_EPOCH: ${{ env.CDN_JOB_START_EPOCH }}
          CDN_JOB_DEADLINE_S: 21600
          CDN_JOB_FINISH_RESERVE_S: 180
        run: GITHUB_RUN_ID="$CDN_IT_RUN_ID" bash scripts/lib/wait-cdn-build-id.sh "$DEPLOY_BUILD_ID"
      - name: Verify IT CDN handoff
        if: steps.cdn-gate.outcome == 'success'
        env:
          CDN_BUILD_ID: ${{ needs.publish-it-cdn.outputs.cdn_build_id }}
          EXPECTED_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
        run: test -n "$CDN_BUILD_ID" && test "$CDN_BUILD_ID" = "$EXPECTED_BUILD_ID"
      - name: Push and package IT section group
        id: push-section-group
        if: steps.cdn-gate.outcome == 'success'
        continue-on-error: true
        env:
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_SVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ZURIGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_IT_DEPLOY_KEY }}
          SHARD_ARGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_IT_DEPLOY_KEY }}
          SHARD_APPENZELLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_IT_DEPLOY_KEY }}
          SHARD_BASILEA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_IT_DEPLOY_KEY }}
          SHARD_BERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_IT_DEPLOY_KEY }}
          SHARD_FRIBURGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_FRIBURGO_IT_DEPLOY_KEY }}
          SHARD_GINEVRA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GINEVRA_IT_DEPLOY_KEY }}
          SHARD_GLARONA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GLARONA_IT_DEPLOY_KEY }}
          SHARD_GRIGIONI_IT_DEPLOY_KEY: ${{ secrets.SHARD_GRIGIONI_IT_DEPLOY_KEY }}
          SHARD_GIURA_IT_DEPLOY_KEY: ${{ secrets.SHARD_GIURA_IT_DEPLOY_KEY }}
          SHARD_LUCERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_LUCERNA_IT_DEPLOY_KEY }}
          SHARD_NEUCHATEL_IT_DEPLOY_KEY: ${{ secrets.SHARD_NEUCHATEL_IT_DEPLOY_KEY }}
          SHARD_NIDVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_NIDVALDO_IT_DEPLOY_KEY }}
          SHARD_OBVALDO_IT_DEPLOY_KEY: ${{ secrets.SHARD_OBVALDO_IT_DEPLOY_KEY }}
          SHARD_SCIAFFUSA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SCIAFFUSA_IT_DEPLOY_KEY }}
          SHARD_SOLETTA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SOLETTA_IT_DEPLOY_KEY }}
          SHARD_SVITTO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVITTO_IT_DEPLOY_KEY }}
          SHARD_TURGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_TURGOVIA_IT_DEPLOY_KEY }}
          SHARD_URI_IT_DEPLOY_KEY: ${{ secrets.SHARD_URI_IT_DEPLOY_KEY }}
          SHARD_VAUD_IT_DEPLOY_KEY: ${{ secrets.SHARD_VAUD_IT_DEPLOY_KEY }}
          SHARD_VALLESE_IT_DEPLOY_KEY: ${{ secrets.SHARD_VALLESE_IT_DEPLOY_KEY }}
          SHARD_ZUGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZUGO_IT_DEPLOY_KEY }}
          SHARD_SANGALLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_SANGALLO_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_PUSH_MODE: ${{ vars.SHARD_PUSH_MODE == 'delta' && 'delta' || 'full' }}
          FANOUT_AUTO_THRESHOLD_PCT: ${{ vars.FANOUT_AUTO_THRESHOLD_PCT || '40' }}
          SHARD_DELTA_CDN_REWRITE: ${{ vars.SHARD_DELTA_CDN_REWRITE == '' && 'changed' || vars.SHARD_DELTA_CDN_REWRITE }}
          SHARD_PUSH_VERIFY: ${{ vars.SHARD_PUSH_VERIFY == '1' && '1' || '' }}
          OFFLOAD_CDN_WORKERS: '4'
          SHARD_STAGE_RM_ASYNC: '1'
          ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP: ${{ vars.ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          ARTICOLISVIZZERA_BUILD_EMIT_SKIP: ${{ vars.ARTICOLISVIZZERA_BUILD_EMIT_SKIP == 'false' && 'false' || 'true' }}
          IT_SHARD_PLAN_FILE: ${{ runner.temp }}/it-publish-plan/it-shard-group-plan.json
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_BUILD_ID: ${{ needs.resolve-publish-plan.outputs.build_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GROUP_ID: ${{ matrix.group }}
        shell: bash
        run: |
          trap 'echo "wall_seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          bash scripts/ci/push-it-shard-group.sh "$GROUP_ID"
      - name: Upload IT section group results and ok-markers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: it-shard-result-group-${{ matrix.group }}-${{ inputs.source_run_id }}
          path: |
            ${{ runner.temp }}/it-shard-results/*.tar
            ${{ runner.temp }}/shard-content-manifests/it/*.json
            ${{ runner.temp }}/shard-ok-*-it
          compression-level: 0
          retention-days: 2
          if-no-files-found: ignore
      - name: Require IT section group and CDN gate success
        if: always()
        env:
          PUSH_OUTCOME: ${{ steps.push-section-group.outcome }}
          CDN_GATE_OUTCOME: ${{ steps.cdn-gate.outcome }}
        run: |
          set -euo pipefail
          if [ "$CDN_GATE_OUTCOME" != success ]; then
            echo "::error::IT section group ${{ matrix.group }} did not pass the CDN ordering gate."
            exit 1
          fi
          if [ "$PUSH_OUTCOME" != success ]; then
            echo "::error::IT section group ${{ matrix.group }} push/package step concluded $PUSH_OUTCOME."
            exit 1
          fi

  # IT section-manifest finalization keeps its current fail-closed required set.
