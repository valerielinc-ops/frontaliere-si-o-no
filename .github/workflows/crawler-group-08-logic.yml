            nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch smg-swiss-marketplace-group
        id: crawler-launch-smg-swiss-marketplace-group
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-smg-swiss-marketplace-group.txt
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
