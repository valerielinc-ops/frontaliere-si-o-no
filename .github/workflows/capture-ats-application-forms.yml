name: Capture public ATS application forms

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

concurrency:
  group: capture-ats-application-forms
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Capture a bounded batch of public application forms
        env:
          ATS_FORM_CAPTURE_MAX: 350
          ATS_FORM_CAPTURE_CONCURRENCY: 4
          ATS_FORM_CAPTURE_TIMEOUT_MS: 20000
        run: npm run jobs:capture-ats-application-forms

      - name: Prepare Firebase credentials for main push
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to load the main-push credential.'
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load main-push credential from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=GITHUB_PAT

      - name: Commit updated form snapshots and retry state
        run: >-
          bash scripts/lib/git-commit-data.sh
          --extra-only
          "Capture public ATS application forms"
          data/ats-application-forms.json
