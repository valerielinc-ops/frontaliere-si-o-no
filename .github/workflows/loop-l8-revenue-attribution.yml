name: Loop L8 revenue and attribution reconciliation

on:
  schedule:
    - cron: '41 11 * * *'
  push:
    branches: [main]
    paths:
      - 'data/revenue-monitor-history.jsonl'
      - 'data/revenue-authorized-export.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l8-revenue-attribution.mjs'
      - 'scripts/ci/export-l8-affiliate-outcomes.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/affiliateRevenue.mjs'
      - 'scripts/lib/google-service-account-token.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/load-rc-env.mjs'
      - '.github/workflows/loop-l8-revenue-attribution.yml'
  pull_request:
    paths:
      - 'data/revenue-monitor-history.jsonl'
      - 'data/revenue-authorized-export.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l8-revenue-attribution.mjs'
      - 'scripts/ci/export-l8-affiliate-outcomes.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/affiliateRevenue.mjs'
      - 'scripts/lib/google-service-account-token.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/load-rc-env.mjs'
      - '.github/workflows/loop-l8-revenue-attribution.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when revenue attribution is not measurable'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l8-revenue-attribution
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout revenue inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/revenue-monitor-history.jsonl
            /data/revenue-authorized-export.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l8-revenue-attribution.mjs
            /scripts/ci/export-l8-affiliate-outcomes.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/affiliateRevenue.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /scripts/lib/posthog-client.mjs
            /scripts/load-rc-env.mjs
            /.github/workflows/loop-l8-revenue-attribution.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      - name: Prepare read-only Firebase credentials
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'L8 live attribution unavailable: FIREBASE_SERVICE_ACCOUNT_JSON is not set; continuing as unmeasurable.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load read-only analytics configuration
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo 'L8 Remote Config unavailable; PostHog export will use the fail-closed fallback.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          node scripts/load-rc-env.mjs
          rc_code=$?
          set -e
          if [ "$rc_code" -ne 0 ]; then
            echo 'L8 Remote Config load failed; PostHog export will use the fail-closed fallback.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export fresh L8 attribution outcome
        if: github.event_name != 'pull_request'
        run: |
          set +e
          node scripts/ci/export-l8-affiliate-outcomes.mjs --days 8 --commercial data/revenue-authorized-export.json --out "$RUNNER_TEMP/l8-affiliate-outcomes.json"
          export_code=$?
          set -e
          if [ "$export_code" -ne 0 ]; then
            node scripts/ci/export-l8-affiliate-outcomes.mjs --unavailable --days 8 --reason 'live PostHog or authorised commercial export unavailable' --out "$RUNNER_TEMP/l8-affiliate-outcomes.json"
            echo 'L8 live attribution export failed; continuing with an explicitly unavailable outcome.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build unavailable L8 attribution input for pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/ci/export-l8-affiliate-outcomes.mjs --unavailable --days 8 --reason 'pull_request runs do not access live analytics or commercial credentials' --out "$RUNNER_TEMP/l8-affiliate-outcomes.json"
      - name: Audit revenue attribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l8
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          affiliate_path="$RUNNER_TEMP/l8-affiliate-outcomes.json"
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --history data/revenue-monitor-history.jsonl --affiliate "$affiliate_path")
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l8-revenue-attribution.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l8-result.json" >/dev/null 2>&1; then
            echo 'L8 finding persisted; approved/pending/reversed states remain separate and no commercial mutation was performed.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Validate runner-local L8 outcome export
        id: validate_l8_outcome
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l8
        run: |
          test -s "$REPORT_DIR/l8-outcome.json"
          jq -e '(.loopId == "L8" and (.status | type) == "string" and (.independent | type) == "boolean" and (.metrics | type) == "object" and .safeToAct == false and .autoAdsUntouched == true and .externalCommercialStateUntouched == true and .publishedDataUntouched == true and .partnerStateUntouched == true and .pricesUntouched == true and .recipientsUntouched == true)' "$REPORT_DIR/l8-outcome.json" >/dev/null
      - name: Record canonical L8 evidence
        if: ${{ always() && steps.validate_l8_outcome.outcome == 'success' }}
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l8
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L8 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L8 observation and actions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l8-revenue-attribution-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l8/
          retention-days: 90
          if-no-files-found: error
