name: Loop L8 private evidence status

on:
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: loop-l8-revenue-attribution
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write status-only L8 artifact
        run: |
          umask 077
          output="$RUNNER_TEMP/l8-public"
          mkdir -p "$output"
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            '{
              schemaVersion: 1,
              loopId: "L8",
              run: { runId: $runId, runAttempt: $runAttempt, sha: $sha },
              auditStatus: "skipped",
              validationStatus: "skipped",
              runnerEvidenceStatus: "skipped",
              privateEvidence: true,
              evidenceComplete: false,
              quality: "unmeasurable",
              outcome: {
                status: "unmeasurable",
                independent: false,
                reason: "The public workflow does not inspect private L8 inputs or outcomes."
              }
            }' > "$output/loop-fleet-evidence.json"
          echo 'L8 evidence stays private; the public artifact reports execution status only.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload L8 status
        uses: actions/upload-artifact@v7
        with:
          name: loop-l8-revenue-attribution-${{ github.run_id }}
          path: ${{ runner.temp }}/l8-public/loop-fleet-evidence.json
          retention-days: 90
          if-no-files-found: error
