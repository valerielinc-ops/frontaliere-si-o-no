name: Deploy stalled watchdog

# GitHub does not guarantee delivery of a high-frequency schedule, and a run
# cancelled while it is still queued cannot schedule deploy.yml's final job.
# This is the single, deliberately narrow exception to the self-driven build
# contract: it only invokes the existing queue/SHA resolver, never builds,
# publishes, or bypasses the deploy admission checks. The resolver dispatches
# deploy.yml only when no deploy is queued/running, HEAD has no successful
# build, and the per-SHA retry cap permits it.
on:
  # Stagger away from deploy.yml's cron minute so a platform-wide cron delay
  # does not affect both recovery edges at once.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches:
      - main
    # Keep the watchdog aligned with the established deploy-boundary filter:
    # telemetry, documentation, tests, and workflow-only changes do not need
    # a new build admission check. A mixed push remains eligible under GitHub's
    # normal paths-ignore semantics.
    paths-ignore:
      - 'data/border-wait-current.json'
      - 'public/data/border-wait-current.json'
      - 'data/border-wait-history/**'
      - 'data/build-history/**'
      - 'data/seo-health-state.json'
      - 'data/seo-health/**'
      - 'data/border-wait-averages.json'
      - 'public/data/border-wait-averages.json'
      - 'data/road-events.json'
      - 'public/data/road-events.json'
      - 'data/weather-snapshot.json'
      - 'data/loop-fleet/**'
      - 'data/translation-observability-history.json'
      - 'data/translation-observability-state.json'
      - 'data/translation-stats-history.json'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - '.claude/**'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  # Keep workflow admission separate from the resolver's durable job claim.
  # A workflow_run can arrive while the source workflow is still releasing its
  # job-level claim; requesting that same group at workflow level can fail the
  # observer before Actions materializes any job. Failed-source runs acquire
  # the shared claim below only when their resolver job is scheduled. A
  # successful source completion gets a per-run no-op group so it cannot evict
  # a real resolver.
  group: ${{ github.event_name == 'workflow_run' && format('deploy-stalled-watchdog-workflow-run-{0}', github.run_id) || 'deploy-stalled-watchdog' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  statuses: read

jobs:
  reconcile:
    name: Reconcile a stalled deploy tip
    # A successful Deploy completion needs only the explicit no-op job below;
    # every other trigger remains eligible for the queue/HEAD resolver.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'success'
    # This is the same durable claim used by deploy.yml's final rearm and its
    # in-workflow schedule resolver; at most one resolver may dispatch.
    concurrency:
      group: deploy-rearm-dispatch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore runner CA trust before checkout (#9681)
        shell: bash
        run: |
          set -euo pipefail
          ca_file=/etc/ssl/certs/ca-certificates.crt
          if [[ ! -s "$ca_file" ]]; then
            sudo update-ca-certificates --fresh
          fi
          test -s "$ca_file"
          {
            echo "GIT_SSL_CAINFO=$ca_file"
            echo "GIT_SSL_CAPATH=/etc/ssl/certs"
          } >> "$GITHUB_ENV"

      - name: Checkout resolver
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          sparse-checkout: |
            /scripts/ci/rearm-deploy-build.mjs
            /scripts/ci/deploy-rearm-request.mjs
            /scripts/ci/lib/deploy-job-failure-signature.mjs
            /scripts/ci/lib/run-listing-window.mjs
            /scripts/lib/int-from-env.mjs
            /scripts/lib/is-invoked-directly.mjs
            /scripts/ci/translation-deploy-handoff.mjs
            /data/translation-deploy-handoff.json
          sparse-checkout-cone-mode: false

      - name: Re-arm only an idle, unbuilt main tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REARM_MODE: watchdog
          REARM_WORKFLOW: deploy.yml
          REARM_BRANCH: main
          REARM_MAX_BUILDS_PER_SHA: '2'
          REARM_SKIP_LOCALE_RECOVERY: '1'
        run: node scripts/ci/rearm-deploy-build.mjs

  # A healthy workflow_run still creates a watchdog event because the trigger
  # is completion-based. Keep that event observable and green instead of
  # letting a filtered resolver leave the whole workflow with zero jobs.
  skip-successful-source:
    name: Record successful source run
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record healthy source run
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          echo "Deploy stalled watchdog skipped successful source run
          ${SOURCE_RUN_ID}; no re-arm needed."
