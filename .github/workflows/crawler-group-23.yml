          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          node scripts/load-rc-env.mjs
          echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-omniroute
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Launch rituals-cosmetics
        id: crawler-launch-rituals-cosmetics
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-rituals-cosmetics.txt
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_RITUALS_COSMETICS_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: rituals-cosmetics
          JOBS_SLICE_FILE: data/jobs/by-crawler/rituals-cosmetics.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-23"
          mkdir -p "$state_dir"
          script_path="$state_dir/rituals-cosmetics.sh"
          launcher_path="$state_dir/rituals-cosmetics.launcher.sh"
          log_path="$state_dir/rituals-cosmetics.log"
          pid_path="$state_dir/rituals-cosmetics.pid"
          status_path="$state_dir/rituals-cosmetics.status"
          rm -f "$script_path" "$launcher_path" "$log_path" "$pid_path" "$status_path"
