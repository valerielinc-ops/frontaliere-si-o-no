          aggregate_crawler_member 'anicura'
          aggregate_crawler_member 'fisba'
          aggregate_crawler_member 'postauto'
          aggregate_crawler_member 'pantr-ch'
          aggregate_crawler_member 'confederazione'
          printf '%s\n' "**Summary:** $success_count succeeded, $failure_count failed, $missing_count missing, $systemic_count systemic." >> "$summary_file"
