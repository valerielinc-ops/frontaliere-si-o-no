      - name: Run rituals-cosmetics
        id: crawler-rituals-cosmetics
        if: always()
        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-23"
          status_file="$state_dir/rituals-cosmetics.status"
          pid_file="$state_dir/rituals-cosmetics.pid"
          log_file="$state_dir/rituals-cosmetics.log"
          deadline=$((SECONDS + 340 * 60))
          while [ ! -s "$status_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::rituals-cosmetics: detached crawler did not publish a status before the 340 minute group budget"
              exit 1
            fi
            if [ -s "$pid_file" ]; then
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null; then
