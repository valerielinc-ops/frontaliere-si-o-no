name: Crawler Group 23 (23 crawlers)
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: true
        type: string
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
concurrency:
  group: jobs-crawler-group-23
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_23:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      AI_CACHE_PATH: .cache/jobs-ai-cache.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Validate crawler generation token before crawling
        run: node scripts/check-crawler-generation-token.mjs
      - name: Restore crawler AI cache
        id: restore_crawler_ai_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-23-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-ai-cache-v1-crawler-group-23-${{ github.repository }}-${{ runner.os }}-
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Restore per-company translation cache
        id: translation_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-23-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-cache-v1-crawler-group-23-
      - name: Prepare per-company translation cache
        if: always()
        env:
          TRANSLATION_CACHE_MATCHED_KEY: ${{ steps.translation_cache_restore.outputs.cache-matched-key }}
        run: |-
          mkdir -p data/translation-cache
          if [ -n "$TRANSLATION_CACHE_MATCHED_KEY" ]; then
            echo "✅ Per-company translation cache restored: $TRANSLATION_CACHE_MATCHED_KEY"
            echo "translation-cache: hit ($TRANSLATION_CACHE_MATCHED_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Per-company translation cache miss; translations will repopulate it."
            echo "translation-cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          node scripts/load-rc-env.mjs
          echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-23.yml
      - uses: ./.github/actions/setup-omniroute
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Launch albergo-gardenia
        id: crawler-launch-albergo-gardenia
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-albergo-gardenia.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_ALBERGO_GARDENIA_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: albergo-gardenia
          JOBS_SLICE_FILE: data/jobs/by-crawler/albergo-gardenia.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-23"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/albergo-gardenia.sh"
          launcher_path="$state_dir/albergo-gardenia.launcher.sh"
          worker_path="$state_dir/albergo-gardenia.worker.sh"
          log_path="$state_dir/albergo-gardenia.log"
          pid_path="$state_dir/albergo-gardenia.pid"
          status_path="$state_dir/albergo-gardenia.status"
          started_path="$state_dir/albergo-gardenia.started"
          watchdog_path="$state_dir/albergo-gardenia.watchdog"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$state_dir/albergo-gardenia.crawl-exit"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- albergo-gardenia: run crawler (verbatim from original workflow) ----
          node scripts/update-albergo-gardenia-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::albergo-gardenia: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0

          # ---- albergo-gardenia: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- albergo-gardenia: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Albergo Gardenia jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- albergo-gardenia: Report failure to GitHub Issue (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" \
              --title "Crawler Failure: Run albergo-gardenia" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run albergo-gardenia"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::albergo-gardenia: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::albergo-gardenia: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::albergo-gardenia: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ albergo-gardenia: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::albergo-gardenia: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ albergo-gardenia: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi

          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.started"
          export CRAWLER_MEMBER_CRAWL_EXIT_FILE="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.crawl-exit"
          export CRAWLER_MEMBER_LOG_FILE="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.log"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-23"
          worker_path="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.started"
          watchdog_file="$RUNNER_TEMP/crawler-generation/group-23/albergo-gardenia.watchdog"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-74}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 74)"
            worker_watchdog_minutes=74
          fi
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            printf '\''127\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 127
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            if [ -s "$status_file" ]; then
              status="$(cat "$status_file" 2>/dev/null || true)"
              if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
            fi
            terminal_exit="$flock_exit"
            if ! [[ "$terminal_exit" =~ ^[0-9]+$ ]]; then terminal_exit=143; fi
            if [ "$terminal_exit" -eq 124 ] || [ "$terminal_exit" -eq 137 ]; then printf '\''%s\n'\'' "$worker_watchdog_minutes" > "$watchdog_file"; fi
            printf "%s\n" "$terminal_exit" > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
