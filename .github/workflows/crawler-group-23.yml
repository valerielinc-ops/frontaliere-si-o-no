          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-23/rituals-cosmetics.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-23/rituals-cosmetics.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-23/rituals-cosmetics.status.tmp.$$"
          bash "$script_path"
