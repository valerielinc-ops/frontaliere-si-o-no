              if ! node scripts/lib/github-issue-creator.mjs --title "Crawler Failure: Run $slug" --description "$watchdog_description" --log-excerpt-file "$state_dir/$slug.log" --priority 2 --label Bug --workflow "Run $slug"; then
                echo "::warning::$slug: the watchdog-timeout issue could not be filed; the group verdict is unchanged"
              fi
            fi
          }
          aggregate_crawler_member 'albergo-gardenia'
          aggregate_crawler_member 'artificialy'
          aggregate_crawler_member 'csd-engineers'
          aggregate_crawler_member 'fust'
          aggregate_crawler_member 'hugo-boss'
          aggregate_crawler_member 'lidl'
          aggregate_crawler_member 'migros-hq'
