name: Publish Journalist Articles (queued → live pipeline)

# Picks up journalist_articles docs flipped to status:'queued' by the gated
# journalist dashboard (services/journalistArticleService.ts submitForPublish)
# and runs them through the SAME multi-language registration pipeline
# automated content uses (scripts/create-article.mjs), then checks the live
# internal links of everything already published. Mirrors
# publisher-jobs-sync.yml's shape (schedule + dispatch, bot commit + rebase-
# retry push to main), reusing the exact same secrets — no new ones needed.

on:
  # SCHEDULE REMOVED 2026-08-14 by the owner — this publisher no longer runs on
  # its own. The twin in nanakokyobashi-rgb/frontaliere-articles now owns the
  # queue and runs every 15 minutes in its place.
  #
  # Why: both repos ran this workflow against the SAME Firestore queue
  # (`journalist_articles`), and a doc flipped to status:'published' is never
  # reprocessed — so whoever lost the race never saw that article at all. This
  # side polled every 15 minutes against the twin's every 2 hours, so this side
  # won almost always and the corpus never received the article. The corpus is
  # the repo that OWNS the content, so an article that lands only here is one
  # `pull-articles-corpus.mjs` later reports as "upstream drops <slug> but
  # nothing retired it" — a fail-closed stop that turns `seo-completeness` and
  # `sitemap-slug-integrity` red on EVERY branch and blocks all merges until a
  # human restores it by hand. Measured 2026-08-13: it cost ~1h30 of blocked
  # merges and a manual restore PR (frontaliere-articles#284). See #5794.
  #
  # Latency is preserved: the twin moved from '15 */2 * * *' to '*/15 * * * *'
  # in the same change, so a journalist still sees the article go live within
  # ~15 minutes of hitting Submit — it simply travels corpus → site through the
  # normal sync instead of being written here.
  #
  # `workflow_dispatch` stays: a manual run is still useful to drain the queue
  # on demand, and it cannot cause the race because it is not periodic.
  workflow_dispatch: {}

concurrency:
  # Serialize: never two concurrent commits from this pipeline to main.
  group: publish-journalist-articles
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish-journalist-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      # Loaded BEFORE the publish step (unlike publisher-jobs-sync.yml, which
      # loads it after the commit): translateArticle()/the free-MT cascade
      # needs its provider keys from Remote Config while the pipeline itself
      # is running, not only for a post-commit deploy trigger. The "article is
      # live" email is NOT sent by this workflow — see
      # notify-journalist-article-live.yml, which runs after the deploy this
      # job triggers actually succeeds.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # publish-journalist-article.mjs imports registerArticleFiles/
      # translateArticle from create-article.mjs, which routes callLLM
      # through ai-models.mjs's DEFAULT_CHAIN — same AI-fallback wiring as
      # generate-article.yml (both write via create-article.mjs). Missing
      # here before this change; added as part of the OmniRoute rollout to
      # every ai-models.mjs consumer workflow.
      - uses: ./.github/actions/setup-omniroute
      - uses: ./.github/actions/setup-claude-haiku-fallback

      - name: Publish queued journalist articles
        id: publish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/publish-journalist-article.mjs

      - name: Check live internal links of published journalist articles
        run: node scripts/check-journalist-article-links.mjs

      # This pipeline runs registerArticleFiles() (scripts/create-article.mjs)
      # — the SAME writer of services/seo/seo-pages.ts as generate-article.yml
      # — so it needs the same pre-commit parse gate (issue #2834): a broken
      # seo-pages.ts must never be pushed straight to main unvalidated.
      - name: Validate seo-pages.ts syntax (pre-commit parse gate)
        run: node scripts/ci/check-seo-pages-syntax.mjs

      - name: Commit registered article files (test-gated) + push with rebase-retry
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No journalist-article changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📰 Publish journalist article(s)"
            # --in-place-resolver-cmd: this pipeline runs registerArticleFiles()
            # (scripts/create-article.mjs) — the SAME writer of router.ts/
            # seo-pages.ts/blog-articles-data.ts/sitemaps as generate-article.yml,
            # which already mirrors this resolver for the identical append-only-
            # file conflict shape. Without it, a concurrent main writer racing
            # this commit hits "Rebase conflict and no resolver provided" and the
            # push is abandoned — but Firestore was already stamped
            # status:'published' by publish-journalist-article.mjs BEFORE this
            # step ran, so the doc is left permanently orphaned (published in
            # Firestore, never actually committed to git, no code re-processes a
            # 'published' doc). Incident 2026-07-16: run 29485706663 hit exactly
            # this, orphaning 4 of Samuele Valente's articles for 8+ hours.
            bash scripts/lib/git-push-with-retry.sh \
              --in-place-resolver-cmd "source scripts/lib/resolve-append-conflicts.sh && resolve_append_conflicts && git add -A"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.has_changes == 'true'
        run: bash scripts/lib/trigger-deploy.sh || true

      # Issue #4837 stream C: this workflow can publish MULTIPLE articles per
      # run (unlike generate-article.yml, one per run), so it dispatches
      # fast-publish-article.yml once per published id instead of once per
      # run. `steps.publish.outputs.published_ids` is a JSON array written by
      # scripts/publish-journalist-article.mjs's main(). All journalist
      # articles register into the `frontaliere` section — this pipeline
      # never passes `--section` to create-article.mjs's config, so
      # SECTION_NAME always resolves to its default. Best-effort: a failed
      # fast-publish dispatch still leaves the article to go live via the
      # normal deploy chain triggered above.
      - name: Trigger fast-publish workflow(s)
        if: steps.commit.outputs.has_changes == 'true'
        env:
          PUBLISHED_IDS_JSON: ${{ steps.publish.outputs.published_ids }}
        run: |
          FAST_PUBLISH_SHA="$(git rev-parse HEAD)"
          ARTICLE_IDS="$(node -e '
            let ids = [];
            try { const parsed = JSON.parse(process.env.PUBLISHED_IDS_JSON || "[]"); if (Array.isArray(parsed)) ids = parsed; } catch {}
            for (const id of ids) console.log(id);
          ')"
          if [ -z "$ARTICLE_IDS" ]; then
            echo "No published article ids reported — nothing to fast-publish"
            exit 0
          fi
          fail=0
          while IFS= read -r article_id; do
            [ -z "$article_id" ] && continue
            echo "🚀 Dispatching fast-publish-article.yml for '$article_id'"
            INPUTS_JSON="$(node -e "console.log(JSON.stringify({article_id: process.argv[1], section: 'frontaliere', sha: process.argv[2]}))" \
              "$article_id" "$FAST_PUBLISH_SHA")"
            TRIGGER_REF="main" \
            TRIGGER_EXPECTED_SHA="$FAST_PUBLISH_SHA" \
            bash scripts/lib/trigger-workflow.sh "fast-publish-article.yml" "$INPUTS_JSON" \
              || { echo "::warning::fast-publish dispatch failed for '$article_id' — continuing"; fail=1; }
          done <<< "$ARTICLE_IDS"
          [ "$fail" -eq 0 ] || true

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
