name: Post-deploy Validate (dist)

# Fast, fail-closed provenance gate. Historical content-quality audits run in
# Audit Published Dist, a separate workflow_run workflow with no dependency edge
# back to the publisher.
on:
  workflow_call:
    inputs:
      deploy_run_id:
        description: 'Run ID of the source build that produced the sitemap and locale artifacts.'
        required: true
        type: string
      deploy_event_name:
        description: 'Source build event name, retained for caller compatibility.'
        required: true
        type: string
      deploy_ref:
        description: 'Exact source build SHA.'
        required: false
        type: string
        default: ''
      shard_artifact_run_id:
        description: 'Publisher run containing the combined IT evidence and sitemaps.'
        required: false
        type: string
        default: ''
      locale_artifact_run_ids:
        description: 'JSON map of locale to publisher run. A null entry identifies a legacy receipt.'
        required: true
        type: string
    outputs:
      integrity_ok:
        description: 'True only when source identity, sitemap coverage, shard layout and artifact digests all match.'
        value: ${{ jobs.fast-gate.outputs.integrity_ok }}

jobs:
  fast-gate:
    name: Validate sitemap and shard receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      integrity_ok: ${{ steps.publisher-fast-gate.outputs.integrity_ok }}
      failed_gates: ${{ steps.publisher-fast-gate.outputs.failed_gates }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Start publisher gate timing
        id: gate-clock
        shell: bash
        run: echo "start_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Checkout publisher gate toolchain
        uses: actions/checkout@v7
        with:
          # Pinned to the dispatch SHA shared by every job of the publisher run:
          # in a reusable workflow `github.sha` is the CALLER's SHA. It is not
          # `inputs.deploy_ref` (the build): the gate is part of the publisher
          # toolchain and the build identity it judges is passed as data
          # (`--source-sha`), never by choosing which code runs.
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci/publisher-fast-gate.mjs
            scripts/ci/build-sitemap-family-bridge-evidence.mjs
            scripts/ci/shard-content-manifest.mjs
            scripts/validate-sitemap-links.mjs
            scripts/lib/auditReport.mjs
            scripts/lib/externally-served-paths.mjs
            scripts/lib/expired-archive-html-invariant.mjs
            scripts/lib/expired-job-edge-dataset.mjs
            scripts/lib/flat-string.mjs
            scripts/lib/html-attr.mjs
            scripts/lib/is-invoked-directly.mjs
            scripts/lib/mid-plugins-flag.mjs
            scripts/lib/sitemap-family-coverage.mjs
            scripts/lib/sitemap-snapshot.mjs
            scripts/lib/section-shard-slugs.json
            data/sitemap-family-coverage-declarations.json
            infra/cloudflare-worker/locale-router.js
            infra/cloudflare-worker/ticino-tree-bucket.js
            infra/cloudflare-worker/section-tree-layout.js
            infra/cloudflare-worker/section-tree-layout-schema.js
            infra/cloudflare-worker/legacy-stub-redirects.generated.mjs
            services/publicConfigConstants.mjs
            scripts/lib/pharmacySections.mjs
            scripts/lib/weather-border-links.mjs
            scripts/lib/fuel-station-aliases.mjs
            scripts/lib/borderWaitSections.mjs
            build-plugins/shared/redirectStubMarker.mjs
            build-plugins/shared/fuelRouteSlugs.mjs
            build-plugins/shared/cdnAssetOffloadRx.mjs
            build-plugins/shared/cdnOffloadTargets.mjs
          sparse-checkout-cone-mode: false

      - name: Prepare deploy-ref skew guard
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/deploy-ref-skew-guard.sh" <<'GUARD'
          build_skew_guard_main_package="$RUNNER_TEMP/deploy-ref-skew-guard-main-package.json"
          build_skew_guard_main_commit="$RUNNER_TEMP/deploy-ref-skew-guard-main-commit"

          build_skew_guard_init() {
            rm -f "$build_skew_guard_main_package" "$build_skew_guard_main_commit"
            if git fetch --depth=1 origin main -q 2>/dev/null; then
              if git rev-parse --verify -q 'FETCH_HEAD^{commit}' > "$build_skew_guard_main_commit" 2>/dev/null \
                && git show "$(cat "$build_skew_guard_main_commit"):package.json" > "$build_skew_guard_main_package" 2>/dev/null; then
                return 0
              fi
              rm -f "$build_skew_guard_main_package" "$build_skew_guard_main_commit"
            fi
            return 0
          }

          build_skew_guard_should_skip() {
            local kind=$1 target=$2
            case "$kind" in
              npm)
                if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$target" 2>/dev/null; then
                  return 1
                fi
                if [ -s "$build_skew_guard_main_package" ] && node -e "process.exit(require(process.argv[1]).scripts?.[process.argv[2]] ? 0 : 1)" "$build_skew_guard_main_package" "$target" 2>/dev/null; then
                  return 0
                fi
                ;;
              node)
                if [ -f "$target" ]; then
                  return 1
                fi
                if [ -s "$build_skew_guard_main_commit" ] && git cat-file -e "$(cat "$build_skew_guard_main_commit"):$target" 2>/dev/null; then
                  return 0
                fi
                ;;
            esac
            return 1
          }

          build_skew_guard_skip_row() {
            printf '%s(skipped-deploy_ref-drift)\n' "$1"
          }

          build_skew_guard_run() {
            local kind=$1 target=$2
            shift 2
            BUILD_SKEW_GUARD_SKIPPED=0
            if build_skew_guard_should_skip "$kind" "$target"; then
              printf '[deploy-ref-skew] skip: %s "%s" is absent from this build but present on origin/main; failing closed (skipped-deploy_ref-drift)\n' "$kind" "$target"
              BUILD_SKEW_GUARD_SKIPPED=1
              return 0
            fi
            "$@"
          }

          GUARD
          chmod 700 "$RUNNER_TEMP/deploy-ref-skew-guard.sh"
          source "$RUNNER_TEMP/deploy-ref-skew-guard.sh"
          build_skew_guard_init

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Create receipt workspace
        run: mkdir -p ${{ runner.temp }}/publisher-fast-gate/{sitemaps,page-manifests,section-manifests,archive-evidence}

      - name: Download publisher sitemap bundle
        uses: actions/download-artifact@v8
        with:
          name: sitemaps-${{ inputs.shard_artifact_run_id || github.run_id }}
          path: ${{ runner.temp }}/publisher-fast-gate/sitemaps
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.shard_artifact_run_id || github.run_id }}

      - name: Download source page manifests
        uses: actions/download-artifact@v8
        with:
          pattern: sitemap-page-manifest-*
          path: ${{ runner.temp }}/publisher-fast-gate/page-manifests
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deploy_run_id }}

      - name: Download publisher IT page manifest
        uses: actions/download-artifact@v8
        with:
          pattern: sitemap-page-manifest-it-*
          path: ${{ runner.temp }}/publisher-fast-gate/page-manifests
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.shard_artifact_run_id || github.run_id }}

      - name: Download expired archive publication evidence
        uses: actions/download-artifact@v8
        with:
          pattern: expired-archive-evidence-*-${{ inputs.deploy_run_id }}
          path: ${{ runner.temp }}/publisher-fast-gate/archive-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deploy_run_id }}

      - name: Download publisher section manifests
        uses: actions/download-artifact@v8
        with:
          name: section-page-manifest-it-${{ inputs.shard_artifact_run_id || github.run_id }}
          path: ${{ runner.temp }}/publisher-fast-gate/section-manifests
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.shard_artifact_run_id || github.run_id }}

      - name: Read artifact receipts from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.deploy_run_id }}
          PUBLISHER_RUN_ID: ${{ inputs.shard_artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [ .[] | .artifacts[] | {name, digest, expired} ]}' \
            > "$RUNNER_TEMP/publisher-fast-gate/source-artifacts.json"
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$PUBLISHER_RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [ .[] | .artifacts[] | {name, digest, expired} ]}' \
            > "$RUNNER_TEMP/publisher-fast-gate/publisher-artifacts.json"

      - name: Resolve non-IT validation artifact runs
        id: artifact-runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.deploy_run_id }}
          SOURCE_SHA: ${{ inputs.deploy_ref }}
          PUBLISHER_RUN_ID: ${{ inputs.shard_artifact_run_id || github.run_id }}
          LOCALE_ARTIFACT_RUN_IDS: ${{ inputs.locale_artifact_run_ids }}
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/publisher-fast-gate"
          echo '{}' > "$gate/section-origins.json"
          echo '{}' > "$gate/prior-artifacts.json"

          if ! jq -e --arg it "$PUBLISHER_RUN_ID" '
            .it == $it and has("en") and has("de") and has("fr") and
            ([.en, .de, .fr] | all(. == null or (type == "string" and test("^[0-9]+$"))))
          ' <<< "$LOCALE_ARTIFACT_RUN_IDS" > /dev/null; then
            echo "::error::Invalid locale artifact run map for publisher run $PUBLISHER_RUN_ID"
            exit 1
          fi

          # Old receipts pointed to the source run. Preserve the bounded
          # same-source recovery for those receipts, using both locale artifacts.
          prior_runs=
          if jq -e 'any(.en, .de, .fr; . == null)' <<< "$LOCALE_ARTIFACT_RUN_IDS" > /dev/null; then
            created_since=$(date -u -d "7 days ago" +%F)
            prior_runs=$(gh api --paginate --slurp "repos/$GH_REPO/actions/workflows/deploy-publish.yml/runs?branch=main&created=%3E%3D$created_since&per_page=100" |
              jq -r --arg title "Publish Pages build $SOURCE_RUN_ID @ $SOURCE_SHA" --argjson current "$PUBLISHER_RUN_ID" '
                [.[].workflow_runs[] | select(.display_title == $title and .id < $current and .status == "completed")] |
                sort_by(.id) | reverse | .[].id
              ')
          fi

          for locale in en de fr; do
            receipt_run=$(jq -r --arg locale "$locale" '.[$locale] // empty' <<< "$LOCALE_ARTIFACT_RUN_IDS")
            candidate_runs=${receipt_run:-$prior_runs}
            selected=
            for run_id in $candidate_runs; do
              listing="$gate/artifacts-$run_id.json"
              if [ "$run_id" = "$PUBLISHER_RUN_ID" ]; then
                listing="$gate/publisher-artifacts.json"
              elif [ ! -f "$listing" ]; then
                gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" |
                  jq '{artifacts: [.[].artifacts[] | {name, digest, expired}]}' > "$listing"
              fi
              manifest="section-page-manifest-$locale-$run_id"
              dist="locale-dist-$locale-$run_id"
              if ! jq -e --arg manifest "$manifest" --arg dist "$dist" '
                any(.artifacts[]; .name == $manifest and .expired == false) and
                any(.artifacts[]; .name == $dist and .expired == false)
              ' "$listing" > /dev/null; then
                continue
              fi
              selected=$run_id
              if [ "$run_id" != "$PUBLISHER_RUN_ID" ]; then
                jq --arg locale "$locale" --arg run "$run_id" '.[$locale] = $run' "$gate/section-origins.json" > "$gate/section-origins.tmp"
                mv "$gate/section-origins.tmp" "$gate/section-origins.json"
                jq --arg run "$run_id" --slurpfile listing "$listing" '.[$run] = $listing[0]' "$gate/prior-artifacts.json" > "$gate/prior-artifacts.tmp"
                mv "$gate/prior-artifacts.tmp" "$gate/prior-artifacts.json"
              fi
              break
            done
            if [ -z "$selected" ]; then
              echo "::error::Missing or expired section-page-manifest or locale-dist for $locale (run ${receipt_run:-unknown, legacy receipt for source $SOURCE_RUN_ID})"
              exit 1
            fi
            echo "${locale}=$selected" >> "$GITHUB_OUTPUT"
          done

      - name: Download publisher section manifests (en)
        uses: actions/download-artifact@v8
        with:
          name: section-page-manifest-en-${{ steps.artifact-runs.outputs.en }}
          path: ${{ runner.temp }}/publisher-fast-gate/section-manifests
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.en }}

      - name: Download non-IT locale dist (en)
        uses: actions/download-artifact@v8
        with:
          name: locale-dist-en-${{ steps.artifact-runs.outputs.en }}
          path: ${{ runner.temp }}/publisher-fast-gate/locale-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.en }}

      - name: Download publisher section manifests (de)
        uses: actions/download-artifact@v8
        with:
          name: section-page-manifest-de-${{ steps.artifact-runs.outputs.de }}
          path: ${{ runner.temp }}/publisher-fast-gate/section-manifests
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.de }}

      - name: Download non-IT locale dist (de)
        uses: actions/download-artifact@v8
        with:
          name: locale-dist-de-${{ steps.artifact-runs.outputs.de }}
          path: ${{ runner.temp }}/publisher-fast-gate/locale-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.de }}

      - name: Download publisher section manifests (fr)
        uses: actions/download-artifact@v8
        with:
          name: section-page-manifest-fr-${{ steps.artifact-runs.outputs.fr }}
          path: ${{ runner.temp }}/publisher-fast-gate/section-manifests
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.fr }}

      - name: Download non-IT locale dist (fr)
        uses: actions/download-artifact@v8
        with:
          name: locale-dist-fr-${{ steps.artifact-runs.outputs.fr }}
          path: ${{ runner.temp }}/publisher-fast-gate/locale-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-runs.outputs.fr }}

      - name: Build non-IT sitemap family bridge evidence
        run: |
          set -euo pipefail
          locale_dist_root="$RUNNER_TEMP/publisher-fast-gate/locale-dist"
          sitemaps_dir="$RUNNER_TEMP/publisher-fast-gate/sitemaps"
          trap 'rm -f "$locale_dist_root"/locale-dist-{en,de,fr}.tar' EXIT
          for locale in en de fr; do
            tar_file="$locale_dist_root/locale-dist-$locale.tar"
            evidence_file="$sitemaps_dir/sitemap-family-bridge-evidence-$locale.json"
            node scripts/ci/build-sitemap-family-bridge-evidence.mjs \
              --locale "$locale" \
              --previous "$sitemaps_dir/pre-deploy-sitemap-urls.json" \
              --current "$sitemaps_dir/new-sitemap-urls.json" \
              --dist-tar "$tar_file" \
              --out "$evidence_file"
            rm -f "$tar_file"
          done

      - name: Run fail-closed publisher fast gate
        id: publisher-fast-gate
        env:
          SOURCE_RUN_ID: ${{ inputs.deploy_run_id }}
          SOURCE_SHA: ${{ inputs.deploy_ref }}
          PUBLISHER_RUN_ID: ${{ inputs.shard_artifact_run_id || github.run_id }}
          REPORT_OUT: ${{ runner.temp }}/publisher-fast-gate/publisher-fast-gate.json
          GATE_START_MS: ${{ steps.gate-clock.outputs.start_ms }}
        run: |
          source "$RUNNER_TEMP/deploy-ref-skew-guard.sh"
          set +e
          build_skew_guard_run node scripts/ci/publisher-fast-gate.mjs node scripts/ci/publisher-fast-gate.mjs \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --publisher-run-id "$PUBLISHER_RUN_ID" \
            --sitemaps-dir "$RUNNER_TEMP/publisher-fast-gate/sitemaps" \
            --page-manifests-dir "$RUNNER_TEMP/publisher-fast-gate/page-manifests" \
            --section-manifests-dir "$RUNNER_TEMP/publisher-fast-gate/section-manifests" \
            --archive-evidence-dir "$RUNNER_TEMP/publisher-fast-gate/archive-evidence" \
            --source-artifacts "$RUNNER_TEMP/publisher-fast-gate/source-artifacts.json" \
            --publisher-artifacts "$RUNNER_TEMP/publisher-fast-gate/publisher-artifacts.json" \
            --section-origins "$RUNNER_TEMP/publisher-fast-gate/section-origins.json" \
            --prior-artifacts "$RUNNER_TEMP/publisher-fast-gate/prior-artifacts.json" \
            --out "$REPORT_OUT"
          result=$?
          gate_ms=$(( $(date +%s%3N) - GATE_START_MS ))
          if [ -s "$REPORT_OUT" ]; then
            jq --argjson duration "$gate_ms" '. + {publisherFastGateDurationMs: $duration, publisherFastGateBudgetMs: 300000}' \
              "$REPORT_OUT" > "$REPORT_OUT.tmp"
            mv "$REPORT_OUT.tmp" "$REPORT_OUT"
          else
            jq -n --arg sourceRunId "$SOURCE_RUN_ID" --arg sourceSha "$SOURCE_SHA" \
              --arg publisherRunId "$PUBLISHER_RUN_ID" --argjson duration "$gate_ms" \
              '{audit:"publisher-fast-gate", passed:false, sourceRunId:$sourceRunId, sourceSha:$sourceSha, publisherRunId:$publisherRunId, publisherFastGateDurationMs:$duration, publisherFastGateBudgetMs:300000, errorCount:1, errors:["publisher fast gate validator was absent or did not produce a report"]}' \
              > "$REPORT_OUT"
          fi
          echo "duration_ms=$gate_ms" >> "$GITHUB_OUTPUT"
          gate_seconds=$(awk -v ms="$gate_ms" 'BEGIN { printf "%.2f", ms / 1000 }')
          if [ "${BUILD_SKEW_GUARD_SKIPPED:-0}" = 1 ]; then
            build_skew_guard_skip_row scripts/ci/publisher-fast-gate.mjs >> "$GITHUB_STEP_SUMMARY"
            echo 'integrity_ok=false' >> "$GITHUB_OUTPUT"
            echo '::error::publisher fast gate is missing from the source build; failing closed'
            exit 1
          fi
          if [ -s "$REPORT_OUT" ] && jq -e '.passed == true' "$REPORT_OUT" >/dev/null; then
            echo 'integrity_ok=true' >> "$GITHUB_OUTPUT"
            echo 'failed_gates=' >> "$GITHUB_OUTPUT"
            echo "✅ PASS publisher-fast-gate ${gate_seconds}s rc=0"
          else
            echo 'integrity_ok=false' >> "$GITHUB_OUTPUT"
            echo 'failed_gates=publisher-fast-gate' >> "$GITHUB_OUTPUT"
            echo "❌ FAIL publisher-fast-gate ${gate_seconds}s rc=1"
          fi
          exit "$result"

      - name: Upload fast-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-fast-gate/publisher-fast-gate.json
          if-no-files-found: warn
          retention-days: 8

  validate-dist-report:
    needs: [fast-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Diagnostics only, and deliberately still on the build SHA: the reporter
      # below picks `report-validate-dist-failure.mjs` or the legacy issue
      # creator by file presence, so an old build keeps the reporter that
      # matches its own `deploy_ref` (tests/post-deploy-validate-skew-guard.test.ts).
      # It judges nothing and publishes nothing; the gate that does is pinned.
      - name: Checkout source-side issue reporter
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_ref }}
          sparse-checkout: |
            package.json
            scripts/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download fast-gate evidence for issue details
        if: always() && needs.fast-gate.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: audit-reports*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validate-dist-artifacts/audit-reports
          merge-multiple: true

      - name: Report failure to GitHub Issues
        if: always() && needs.fast-gate.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VALIDATE_DIST_REPORTS_DIR: ${{ runner.temp }}/validate-dist-artifacts/audit-reports
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          INPUT_DEPLOY_REF: ${{ inputs.deploy_ref }}
          INPUT_DEPLOY_EVENT: ${{ inputs.deploy_event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DIST_RESULT: ${{ needs.fast-gate.result }}
          FAILED_GATES: ${{ needs.fast-gate.outputs.failed_gates }}
        run: |
          set +e
          if [ -f scripts/ci/report-validate-dist-failure.mjs ]; then
            node scripts/ci/report-validate-dist-failure.mjs --mode report
          else
            node scripts/lib/github-issue-creator.mjs \
              --title "Validation Failure (dist): post-deploy" \
              --build-sha "${INPUT_DEPLOY_REF}" \
              --description "Publisher fast gate failed for source run ${INPUT_DEPLOY_RUN_ID} @ ${INPUT_DEPLOY_REF}; see ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}." \
              --priority 1 --label Bug --workflow "Post-deploy Validate Dist"
          fi

      - name: Resolve GitHub Issue on success
        if: needs.fast-gate.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -f scripts/ci/report-validate-dist-failure.mjs ]; then
            node scripts/ci/report-validate-dist-failure.mjs --mode resolve
          else
            node scripts/lib/github-issue-creator.mjs \
              --resolve \
              --title "Validation Failure (dist): post-deploy" \
              --workflow "Post-deploy Validate Dist" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          fi
