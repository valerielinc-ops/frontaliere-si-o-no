name: Post-deploy Validate (dist)

# Reusable workflow called from deploy-publish.yml as the `validate-dist` job
# (was deploy.yml before the build/publish split). Fetches the build run's
# artifacts by `deploy_run_id` (cross-run from the workflow_run-triggered caller).
# Runs in PARALLEL with `deploy` (the actual Pages publication), starting
# as soon as the `build` job finishes uploading the `github-pages`
# artifact. Everything here reads from `dist/` only — no live site
# dependency. By design this job does NOT need `actions/deploy-pages`
# to have completed.
#
# Same-run model:
#   • github.sha is invariant — no more workflow_run.head_sha drift
#   • actions/download-artifact@v7 with run-id same-run → no API lag
#   • 1:1 deploy↔validate mapping in the Actions UI by construction;
#     no more "cancelled" post-deploys for cancelled/skipped deploys
#     (the parent gates this entire workflow with `if: success()`)
#   • the parent `build` job has job-level concurrency on
#     `pages-deploy` so the lock is released as soon as build finishes,
#     and the next deploy can start while validate-dist + deploy run.
#
# Job split (this file): run 29489094286 measured ~92.9 min wall on a single
# `validate-dist` job, almost entirely two serialized critical paths that
# don't share state: "Run source validators" (dominated by gate:seo-source,
# ~29 min) then "Post-build validations + SEO audits" (dominated by the
# audit:all → audit:max-bfs-depth → audit:orphan-sitemap-pages chain,
# ~50 min). Splitting into `validate-dist-source` and `validate-dist-postbuild`
# — each with its own runner and its own copy of the common
# checkout/download/extract/rehydrate prefix — lets both paths run
# CONCURRENTLY instead of sequentially, cutting wall time to roughly the
# slower of the two (~60 min) instead of their sum. This is a genuine
# job-level (additional-runner) speedup, unlike same-runner background-step
# tricks which were measured to be a wash for CPU-bound work on one runner
# (see docs/GITNEXUS.md history / reference_gha_parallel_steps_syntax memory).
# `validate-dist-report` centralizes the GitHub Issues bookkeeping so a
# success in one job can never race-close an issue tracking a real failure
# in the other.
#
# Revert-risk note (PR #4278 review): the ~60min estimate assumes both jobs
# get scheduled onto free runners immediately. If org/repo concurrent-runner
# capacity is contended, GitHub may queue one job behind other in-flight
# work instead of starting it in parallel, eroding some of this win — that
# is a scheduling-layer risk this PR cannot control or measure from the diff
# alone. The actual number will be confirmed by comparing the next real
# validate-dist run's wall time against the 29489094286 baseline; if the
# jobs are consistently getting serialized by runner contention rather than
# genuinely running concurrently, revert to a single job rather than
# carrying the split's extra duplicated-prefix maintenance cost for no gain.
#
# Second job split (issue #4593): run 29716815865 measured ~2h20m on
# `validate-dist-postbuild` alone — audit:all (~75min) then, still
# serialized after it, audit:max-bfs-depth (~28min) then
# audit:orphan-sitemap-pages. Same lever as above: neither BFS walker
# shares in-memory state with audit:all (both do their own from-scratch
# dist/ walk), so `validate-dist-postbuild-bfs` gives them their own runner
# + its own copy of the common prefix, letting them run CONCURRENTLY with
# `validate-dist-postbuild`'s audit:all instead of after it — cuts this
# chain's ~30min off the critical path. The two BFS walkers stay serialized
# WITH EACH OTHER on their new shared runner (both previously OOM'd at
# rc=134 sharing a smaller heap cap 4-way in the old light pool — see that
# job's DIST_MULTI_PID comment). Same revert-risk caveat applies: confirm
# against the next real run before assuming the win is real vs. runner-
# contention noise.
on:
  workflow_call:
    inputs:
      deploy_run_id:
        description: 'Run ID of the calling deploy workflow run (pass github.run_id from the caller).'
        required: true
        type: string
      deploy_event_name:
        description: 'github.event_name from the caller. Used to gate Facebook/LinkedIn posting and live-meta wait to workflow_dispatch deploys (article publishing pipeline).'
        required: true
        type: string
      deploy_ref:
        description: 'Commit SHA of the build the artifacts came from. Pass when the caller runs at a different SHA than the build (e.g. deploy-publish.yml on workflow_run) so the validator scripts match the built code. Empty = checkout the caller default.'
        required: false
        type: string
        default: ''
    outputs:
      integrity_ok:
        description: >-
          'true' when no DEPLOY-INVALIDATING gate failed, i.e. the dist is a
          valid site even if a quality audit is red. The caller gates
          `publish` (IndexNow / Google Indexing API / GSC) on this instead of
          on this workflow's overall result — a red quality audit must not
          sequester the indexing notification of an already-live deploy
          (issues #4828, #5128). Classification: QUALITY_GATES in
          scripts/ci/classify-validate-dist-failures.mjs, default-deny.
          Empty/absent ⇒ the caller's `== 'true'` test is false ⇒ publish is
          skipped, so this fails closed.
        value: ${{ jobs.integrity-verdict.outputs.integrity_ok }}

jobs:
  validate-dist-source:
    runs-on: ubuntu-latest
    outputs:
      failed_gates: ${{ steps.gate-results.outputs.failed_gates }}
    permissions:
      actions: read     # for download-artifact same-run (github-pages, sitemaps, shard tars)
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      # Reclaim ~25 GB of preinstalled SDKs we never use (dotnet, android,
      # haskell, CodeQL, powershell). Run 26287421188 OOM'd the runner mid
      # artifact-extract because the github-pages tarball (~1.8 GB) + dist
      # extraction + node_modules + Playwright report leftovers crowded a
      # 14 GB default partition. Best-effort: `|| true` keeps the build
      # green if a path was already pruned by a future image refresh.
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — registry operations will be skipped."
          fi

      # Hydrate the runner env with secrets pulled from Firebase Remote Config
      # so the social-media post steps below see FB_PAGE_ACCESS_TOKEN /
      # FB_PAGE_ID / LINKEDIN_POST_* etc. as `process.env.*`. Without this
      # step, post-to-facebook.mjs reads `process.env.FB_PAGE_ACCESS_TOKEN`,
      # finds nothing, and silently exits with the "⚠️ FB_PAGE_ACCESS_TOKEN
      # or FB_PAGE_ID not set — skipping Facebook post" log line. The
      # `Post to Facebook Page` and `Post to LinkedIn Company Page` steps
      # appear green in the UI but never publish.
      #
      # load-rc-env.mjs is best-effort: if Firebase credentials are missing
      # or RC fetch fails, it warns and exits 0, leaving env vars unset and
      # downstream posting steps to perform their own "missing token" skip.
      # That is the same fail-soft contract the deploy.yml pipeline already
      # relies on (see deploy.yml step "Load secrets from Remote Config").
      - name: Load secrets from Remote Config (FB + LinkedIn tokens)
        run: node scripts/load-rc-env.mjs

      # Download GitHub Pages artifact + run source validators sequentially.
      #
      # Previously the 4 source validators were launched as `run_bg ... &` in
      # parallel with the artifact download, to save ~30-60s. That race
      # caused `validate:translation-completeness` and
      # `validate:crawler-summaries` (which read `dist/data/jobs.json` and
      # `data/jobs-crawler-summaries.json` from the unpacked artifact) to
      # fail in <1s with "file not found" — the tar -xf hadn't run yet.
      # The whole step exited 1 before the post-build pool could start, the
      # validate job rolled back, and the BFS-depth gate never got tested.
      # Run 25419353305 (sha e9f03ab9) was the last to confirm this race
      # under the previous parallel layout.
      #
      # Sequential layout: download → tar → run each validator one at a time
      # and emit a per-gate ✅/❌ row. Adds ~10-15s wall vs parallel but is
      # deterministic, easier to reason about, and avoids the race entirely.
      # Artifact download keyed on `deploy_run_id` (the BUILD run that produced
      # them). When the caller IS that run (deploy_run_id == github.run_id) this
      # is a same-run read; when the caller is deploy-publish.yml (workflow_run),
      # the same `run-id` + token fetches them cross-run from the build run.
      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: /tmp/github-pages-artifact
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pre-deploy sitemap snapshot (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true   # snapshot is optional — IndexNow diff falls back gracefully
        with:
          name: pre-deploy-snapshot-${{ inputs.deploy_run_id }}
          path: /tmp/pre-deploy-snapshot
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Master jobs.json artifact (uploaded by deploy.yml). The deploy
      # pipeline strips dist/data/jobs.json via jobsJsonDistCleanupPlugin
      # (PR #712) to stay under the 10 GB GH Pages cap, but validators
      # like validate:translation-completeness still need the master file
      # with titleByLocale / descriptionByLocale. We download it back to
      # data/jobs.json so the resolve-data-path lookup picks it up.
      - name: Download master jobs.json
        uses: actions/download-artifact@v7
        with:
          name: jobs-master-${{ inputs.deploy_run_id }}
          path: /tmp/jobs-master
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous-slug winners (optional)
        # The build job only uploads `winners-${RUN_ID}` when
        # `data/previous-slug-winners.json` actually changed in the
        # build commit. Most builds → no upload → download would emit
        # a noisy "Artifact not found" annotation if we used
        # actions/download-artifact (continue-on-error suppresses the
        # failure but NOT the annotation). `gh run download` fails
        # silently with a clean stderr message instead.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch/call inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          mkdir -p /tmp/winners
          if gh run download "$INPUT_DEPLOY_RUN_ID" \
               --name "winners-$INPUT_DEPLOY_RUN_ID" \
               --dir /tmp/winners 2>/dev/null; then
            echo "[winners] downloaded artifact for run $INPUT_DEPLOY_RUN_ID"
          else
            echo "[winners] artifact not present (file unchanged this build) — skipping"
          fi

      - name: Extract dist/ + restore data files from artifact
        run: |
          # Pages artifact wraps a single artifact.tar — extract into dist/.
          rm -rf dist && mkdir -p dist
          tar -xf /tmp/github-pages-artifact/artifact.tar -C dist

          # Restore master data/jobs.json from the dedicated artifact
          # (jobsJsonDistCleanupPlugin strips it from dist/ to clear the
          # 10 GB GH Pages cap — validators still need the master copy
          # with titleByLocale / descriptionByLocale).
          mkdir -p data
          cp -f /tmp/jobs-master/jobs.json data/jobs.json
          # Expose jobs.json to scripts that expect public/data/jobs.json.
          mkdir -p public/data
          cp -f data/jobs.json public/data/jobs.json
          # validate:crawler-summaries reads data/jobs-crawler-summaries.json
          # (gitignored, assembled at build). Its dist/data/ copy is offloaded
          # to the CDN repo AND deleted from dist by offload-generated-images-
          # cdn.mjs (PR #1288), so it is NOT in the Pages artifact — restore it
          # from the jobs-master artifact (same channel as jobs.json above).
          cp -f /tmp/jobs-master/jobs-crawler-summaries.json data/jobs-crawler-summaries.json

          # Optional artifacts — copy if present.
          if [ -f /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json ]; then
            cp /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json /tmp/pre-deploy-sitemap-urls.json
          fi
          if [ -f /tmp/winners/previous-slug-winners.json ]; then
            cp /tmp/winners/previous-slug-winners.json data/previous-slug-winners.json
          fi

      # Locale-shard and section-shard rehydrate merged into ONE step, with
      # both functions living in shared scripts (scripts/lib/rehydrate-
      # locale-shards.sh, scripts/lib/rehydrate-section-shards.sh) instead of
      # inline here — this step used to duplicate the ~90-line rehydrate_locale
      # bash function byte-for-byte across all 3 jobs in this file, which is
      # exactly the drift risk AGENTS.md #6 flags; extracted after issues
      # #3772..#4828 (~20+ recurrences over two months) needed the same
      # resilience hardening applied in 3 places by hand. See that script for
      # the retry/timeout hardening added to the git-clone fallback there.
      # rehydrate_section is deliberately started only AFTER
      # rehydrate_locale has fully finished — NOT concurrently with it. For
      # en/de/fr, rehydrate_section writes into `dist/$loc/<section-subpath>`
      # (e.g. `dist/en/find-jobs-ticino`), a path nested INSIDE `dist/$loc`.
      # The locale shard artifact/repo does NOT include any section subtree
      # (stripped separately by that section's strip-<section>-subtree.sh),
      # so if rehydrate_locale's `rm -rf "dist/$loc"` + repopulate for that
      # same locale ran while a rehydrate_section call was still writing
      # there, it would silently wipe whatever section content had just
      # landed — scheduling-dependent, so it would not reproduce on every
      # run. Caught in PR #4278 review before merge (originally for the
      # single Ticino section); sequencing them removes the race while still
      # collapsing the loops into one step. Each function keeps its ORIGINAL
      # error-handling contract byte-for-byte: rehydrate_locale is hard-fail
      # (`set -euo pipefail` — an incomplete/missing shard is a real gate and
      # must fail the job), rehydrate_section is soft-fail (`set -uo
      # pipefail`, no `-e` — emits `::warning::` and continues, degrading
      # coverage for that locale without aborting the run). Ticino, Svizzera
      # and Zurigo run concurrently WITH EACH OTHER once locale is done —
      # each writes a disjoint dist/ subtree so there's no cross-section
      # race — tracked via separate background PIDs the same way LOCALE_PID
      # is below.
      # Booleans come in via `env:` (not inlined into the script body via
      # ${{ }}) to avoid templating untrusted values into bash, matching
      # the DEPLOY_RUN_ID/GH_TOKEN pattern already used elsewhere in this
      # file.
      #
      # When LOCALE_SHARDS_LIVE is on, the published github-pages artifact has the
      # en/de/fr subtrees stripped (they're served from the frontaliere-{loc}
      # shard repos via the Cloudflare Worker, same URLs). The sitemaps, however,
      # still list /en /de /fr URLs — so the dist-walking audits (orphan-sitemap-
      # pages, validate:content-quality, audit:hreflang, validate:sitemap-links …)
      # would flag every locale URL as missing-in-dist. Rehydrate the stripped
      # locale subtrees from their shard repos so dist/ is the COMPLETE logical
      # site and every audit keeps FULL coverage (incl. thin-content / hreflang
      # on locales) — no per-audit special-casing, no lowered gate. The shard was
      # force-pushed THIS build (deploy.yml shard-push runs before the artifact
      # upload), so its content matches what the sitemaps reference. Cloned
      # shallow one-at-a-time and deleted right after the copy to bound peak
      # disk. Only locales actually absent from the artifact are rehydrated (a
      # locale whose shard push failed stays in the main artifact and is left
      # untouched).
      #
      # Mirrors the locale rehydrate above for each carved-out section — Ticino
      # first, then Svizzera and Zurigo added the same way once they too
      # outgrew the 10GB Pages cap. deploy.yml strips dist/<section-subtree>
      # from the apex/locale artifacts (strip-<section>-subtree.sh) and
      # publishes ONE Pages repo PER LOCALE PER SECTION
      # (frontaliere-<section>-<loc>, push-<section>-shard.sh). Restore each
      # subtree so validators that walk dist for a section's URLs don't
      # false-flag them missing. The section→locale→slug map is the single
      # source of truth at scripts/lib/section-shard-slugs.json, shared with
      # the push/strip scripts and the Cloudflare Worker's SECTION_ROUTES.
      # PRIMARY: same-run per-locale tar artifact (`<section>-dist-<loc>-
      # <run>`, "Pack <section> shard dist" step in deploy.yml) built from
      # push-<section>-shard.sh's already-offloaded staged copy — byte-
      # identical to what was force-pushed. Fetched via `gh run download`
      # (same-run, no API lag). FALLBACK: full `git clone` of the shard repo
      # when the artifact is missing/corrupt — a locale is NEVER silently
      # un-validated. Before the tar artifact existed (Ticino era), all 4
      # legs paid the git-clone path unconditionally: ~12min combined wall on
      # run 28564001685 (~250k files/clone × 4, sequential).
      # NO cross-job shard clone cache here — REMOVED deliberately, issue
      # #5441 (follow-up of #5432 point 6d). An actions/cache restore/save
      # pair keyed `shard-clone-cache-<run_id>-<job>-<attempt>` used to wrap
      # this step so that ONE of the three parallel validate-dist jobs would
      # pay the shard `git clone` fallback on behalf of all three. Measured,
      # it could not work, and re-adding it in that shape is a net loss:
      #   • It never hit, structurally — not by bad luck. The restore ran
      #     BEFORE the rehydrate and the save AFTER it, while the 3 jobs start
      #     within 7 s of each other (06:50:17/18/24 on run 31296098323) and
      #     the rehydrate takes 10-25 min: at attempt 1 every job restores
      #     before any job has saved. Across 7 runs / 20 entries,
      #     `lastAccessedAt == createdAt` on ALL of them — GitHub stamps that
      #     field on restore, so not one entry was ever read.
      #   • Even a 100% hit rate would save 0 s of wall clock. The cache
      #     branch in scripts/lib/rehydrate-section-shards.sh shortcuts only
      #     the `git clone` FALLBACK, never the tar-artifact fast path. On run
      #     31296098323 just 11 of ~90 shards fell back, and all 11 finished
      #     303-326 s BEFORE the step ended — the critical path is the
      #     ticino/svizzera tar extraction, which this cache cannot touch by
      #     construction. The clones sit entirely in its shadow.
      #   • It cost real time and real quota. `Save` measured 70/70/59 s on
      #     that run's 3 jobs (199 s per run) and it lands ON the critical
      #     path, because restore and save are serial steps while the clones
      #     are not. Entries ran 150-210 MB each: 4.34 GB of a 10 GB repo
      #     cache that stood at 10.68 GB — over quota, evicting LRU — so
      #     never-read entries were displacing caches that ARE read (32 of the
      #     47 non-shard entries had been restored at least once).
      # Bringing it back needs all three of: (1) a key that survives the run
      # — and therefore an invalidation bound to the SHARD's head commit,
      # never to wall-clock age, because serving a stale shard is exactly the
      # failure class of #5432 point 1, a gate that measures old bytes and
      # reports a number which does not describe production; (2) a
      # demonstrated win on the CRITICAL path, i.e. it must shortcut the tar
      # fast path too, since shortcutting the 11 clone-fallback shards
      # provably buys nothing; (3) a size budget against the 10 GB cap.
      # The MECHANISM is not deleted: SHARD_CLONE_CACHE_DIR still works in the
      # rehydrate scripts and is still used by
      # scripts/ci/revalidate-dist-locally.sh, where the cache dir lives in a
      # per-deploy-run WORKDIR on one machine and repeated local runs really
      # do reuse it, at no upload cost. Only the CI wiring that could never
      # hit is gone.

      - name: Rehydrate locale then section shards into dist/ (when sharding active)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          LOCALE_SHARDS_LIVE: ${{ vars.LOCALE_SHARDS_LIVE }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          bash scripts/lib/rehydrate-locale-shards.sh &
          LOCALE_PID=$!

          LOCALE_RC=0
          wait "$LOCALE_PID" || LOCALE_RC=$?

          bash scripts/lib/rehydrate-section-shards.sh

          if [ "$LOCALE_RC" -ne 0 ]; then
            exit "$LOCALE_RC"
          fi

      # Precondition for every dist-walking audit/validator in this job. The
      # section rehydrate above is soft-fail BY CONTRACT (it warns and degrades
      # rather than aborting), so a shard repo that clones empty leaves dist/
      # missing an entire subtree — and from there every audit reports the
      # absent pages as unreachable / thin / orphan content OF THE SITE, not as
      # a hole in its own input. Issue #4857 is that verdict in its purest form:
      # an audit replay that never rehydrated at all called ~68k reachable
      # cluster URLs an entire content tier below crawl depth. Stop here, with
      # the reason named, instead of shipping a fabricated structural finding.
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs
      - name: Migrate all-known-job-slugs to canton-aware paths
        # Phase 8c: the committed `data/all-known-job-slugs.json` accumulates
        # tracking entries from previous builds. The builder
        # (jobsSeoPagesPlugin.ts ~line 9081) only writes NEW entries (guarded
        # by `if (!tracking[job.slug])`), so any stale TI-section path minted
        # before the canton-aware refactor stays forever. The one-shot
        # migration script rewrites them in-place using the canton resolver,
        # mirroring exactly what `tests.yml` already runs before unit tests.
        # Without this step gate:seo-source fails on every deploy that
        # introduces a non-TI job whose prior tracking entry was TI-legacy
        # (cathedral-expired-tracking-canton.test.ts:95 — post-deploy run
        # 26592389280).
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: Run source validators (parallel — 4 vCPU)
        run: |
          RESDIR=/tmp/source-val-results.d
          rm -rf "$RESDIR"; mkdir -p "$RESDIR"

          # Run ONE validator in the background and record its result row to its
          # OWN file ("$RESDIR/<name>": "<name>  <wall_s>  rc=<code>"). Each
          # validator writes a distinct file, so concurrent runs never interleave
          # into a shared results file (which would corrupt the pass/fail summary
          # and could MASK a failure — gate must stay exact). The summary below
          # cats these files; a failing validator's full log is dumped (after the
          # wait, sequentially) so parallel failures stay readable.
          run_validator() {
            local name=$1 logfile=$2; shift 2
            local start end rc
            start=$(date +%s.%N)
            set +e
            "$@" > "$logfile" 2>&1
            rc=$?
            set -e
            end=$(date +%s.%N)
            awk -v n="$name" "BEGIN{printf \"%-40s %7.2f rc=%d\n\", n, $end-$start, $rc}" \
              > "$RESDIR/$name"
            return 0   # never let a single fail short-circuit the chain (rc is in the result file)
          }

          # Pre-seed every validator's result file as FAILED (rc=99). run_validator
          # OVERWRITES it ("> $RESDIR/$name") with the real row on completion. If a
          # validator's background subshell is signal-killed AFTER node exits but
          # BEFORE the awk write (OOM-cgroup kill, runner timeout, /tmp full), the
          # rc=99 seed survives → the validator counts as FAIL and the gate exits 1,
          # instead of silently vanishing from the summary (the serial pre-PR code
          # wrote the row inline, so this kill-window class did not exist — restoring
          # the "gate exact" guarantee). Format matches the awk row so the summary
          # parser (grep -oE 'rc=[0-9]+$') reads it.
          for vn in validate:translation-completeness validate:crawler-summaries \
                    validate:third-party-secrets gate:seo-source; do
            printf '%-40s %7.2f rc=%d\n' "$vn" 0 99 > "$RESDIR/$vn"
          done

          # These four validators are independent processes with no shared state
          # and no dist dependency, so run them CONCURRENTLY on the 4-vCPU runner.
          # Wall drops from sum(~6.8min serial) to the slowest single gate
          # (gate:seo-source ~110s). The old "cheap-first fail-fast" ordering is
          # moot when all four run together.
          pids=()
          run_validator validate:translation-completeness /tmp/v10.log \
            node scripts/validate-translation-completeness.mjs & pids+=("$!")
          run_validator validate:crawler-summaries        /tmp/v11.log \
            npm run validate:crawler-summaries & pids+=("$!")
          run_validator validate:third-party-secrets      /tmp/v12.log \
            npm run validate:third-party-secrets & pids+=("$!")
          run_validator gate:seo-source                   /tmp/v27.log \
            npm run gate:seo-source & pids+=("$!")
          for p in "${pids[@]}"; do wait "$p" || true; done

          # Merge the per-validator result files into the single results file the
          # summary block consumes (order-independent; sorted below).
          cat "$RESDIR"/* > /tmp/source-val-results.txt 2>/dev/null || true

          # Dump each FAILED validator's full log sequentially (readable — no
          # parallel interleave), keyed off the recorded rc.
          for rf in "$RESDIR"/*; do
            grep -q 'rc=0$' "$rf" && continue
            vname=$(basename "$rf")
            case "$vname" in
              validate:translation-completeness) vlog=/tmp/v10.log ;;
              validate:crawler-summaries)        vlog=/tmp/v11.log ;;
              validate:third-party-secrets)      vlog=/tmp/v12.log ;;
              gate:seo-source)                   vlog=/tmp/v27.log ;;
              *)                                 vlog="" ;;
            esac
            echo "──── $vname failed ────"
            [ -n "$vlog" ] && cat "$vlog" 2>/dev/null || true
            echo "──── end $vname ────"
          done

          # ── 3. Print summary table + decide pass/fail ──
          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "Source validators — per-gate results"
          echo "══════════════════════════════════════════════════════════════"
          SRC_PASS=0
          SRC_FAIL=0
          while IFS= read -r line; do
            # `|| true`: riga malformata (senza rc=N) + set -euo pipefail
            # ucciderebbe il summary a meta' loop (stessa classe del bug che ha
            # tenuto rosso gh-pat-expiry-monitor 06-01->06-12); rc vuoto cade
            # nel ramo FAIL ed e' visibile, niente crash.
            rc=$(printf '%s' "$line" | { grep -oE 'rc=[0-9]+$' || true; } | sed 's/rc=//')
            if [ "$rc" = "0" ]; then
              printf "✅ PASS  %s\n" "$line"
              SRC_PASS=$((SRC_PASS + 1))
            else
              printf "❌ FAIL  %s\n" "$line"
              SRC_FAIL=$((SRC_FAIL + 1))
            fi
          done < <(sort -k2 -gr /tmp/source-val-results.txt)
          echo "──────────────────────────────────────────────────────────────"
          echo "Source validators summary: ${SRC_PASS} passed, ${SRC_FAIL} failed"
          echo "══════════════════════════════════════════════════════════════"
          echo ""

          if [ "$SRC_FAIL" -gt 0 ]; then
            echo "::error::${SRC_FAIL} source validator(s) failed — see per-gate output above"
            exit 1
          fi
          echo "✅ Source validators + Pages artifact download complete"

      # Publish the per-gate verdict for the integrity classifier below.
      # `if: always()` because the step above exits 1 on any failure and the
      # failing case is precisely the one we need to classify. Job outputs
      # ARE readable by dependent jobs of a FAILED job within this workflow
      # (the reusable-workflow boundary is the part that drops them — hence
      # the separate always-green `integrity-verdict` job).
      - name: Publish gate results
        id: gate-results
        if: always()
        run: |
          if [ -s /tmp/source-val-results.txt ]; then
            printf 'failed_gates=%s\n' \
              "$(awk '!/rc=0$/ {printf "%s%s", sep, $1; sep=","}' /tmp/source-val-results.txt)" \
              >> "$GITHUB_OUTPUT"
          else
            # Job died before any validator recorded a row. Emitting the
            # sentinel (rather than nothing) keeps "crashed" distinguishable
            # from "all green" — the classifier fails closed on it.
            echo 'failed_gates=__UNKNOWN__' >> "$GITHUB_OUTPUT"
          fi

      # Informational diff between the live sitemaps (currently deployed) and
      # the new dist/ that's about to replace them. Helps spot anomalies — a
      # single deploy adding 5 URLs and removing 500 is almost always a bug
      # (e.g. an empty data file passed through the build) but the post-build
      # gates won't always catch it. Always exits 0.
      - name: Sitemap diff vs live deployed site (informational)
        continue-on-error: true
        run: node scripts/diff-sitemaps.mjs

  validate-dist-postbuild:
    runs-on: ubuntu-latest
    outputs:
      failed_gates: ${{ steps.gate-results.outputs.failed_gates }}
    permissions:
      actions: read     # for download-artifact same-run (github-pages, sitemaps, shard tars)
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — registry operations will be skipped."
          fi

      # Hydrate the runner env with secrets pulled from Firebase Remote Config
      # so the social-media post steps below see FB_PAGE_ACCESS_TOKEN /
      # FB_PAGE_ID / LINKEDIN_POST_* etc. as `process.env.*`. Without this
      # step, post-to-facebook.mjs reads `process.env.FB_PAGE_ACCESS_TOKEN`,
      # finds nothing, and silently exits with the "⚠️ FB_PAGE_ACCESS_TOKEN
      # or FB_PAGE_ID not set — skipping Facebook post" log line. The
      # `Post to Facebook Page` and `Post to LinkedIn Company Page` steps
      # appear green in the UI but never publish.
      #
      # load-rc-env.mjs is best-effort: if Firebase credentials are missing
      # or RC fetch fails, it warns and exits 0, leaving env vars unset and
      # downstream posting steps to perform their own "missing token" skip.
      # That is the same fail-soft contract the deploy.yml pipeline already
      # relies on (see deploy.yml step "Load secrets from Remote Config").
      - name: Load secrets from Remote Config (FB + LinkedIn tokens)
        run: node scripts/load-rc-env.mjs

      # Download GitHub Pages artifact + run source validators sequentially.
      #
      # Previously the 4 source validators were launched as `run_bg ... &` in
      # parallel with the artifact download, to save ~30-60s. That race
      # caused `validate:translation-completeness` and
      # `validate:crawler-summaries` (which read `dist/data/jobs.json` and
      # `data/jobs-crawler-summaries.json` from the unpacked artifact) to
      # fail in <1s with "file not found" — the tar -xf hadn't run yet.
      # The whole step exited 1 before the post-build pool could start, the
      # validate job rolled back, and the BFS-depth gate never got tested.
      # Run 25419353305 (sha e9f03ab9) was the last to confirm this race
      # under the previous parallel layout.
      #
      # Sequential layout: download → tar → run each validator one at a time
      # and emit a per-gate ✅/❌ row. Adds ~10-15s wall vs parallel but is
      # deterministic, easier to reason about, and avoids the race entirely.
      # Artifact download keyed on `deploy_run_id` (the BUILD run that produced
      # them). When the caller IS that run (deploy_run_id == github.run_id) this
      # is a same-run read; when the caller is deploy-publish.yml (workflow_run),
      # the same `run-id` + token fetches them cross-run from the build run.
      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: /tmp/github-pages-artifact
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pre-deploy sitemap snapshot (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true   # snapshot is optional — IndexNow diff falls back gracefully
        with:
          name: pre-deploy-snapshot-${{ inputs.deploy_run_id }}
          path: /tmp/pre-deploy-snapshot
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download master jobs.json
        uses: actions/download-artifact@v7
        with:
          name: jobs-master-${{ inputs.deploy_run_id }}
          path: /tmp/jobs-master
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous-slug winners (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch/call inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          mkdir -p /tmp/winners
          if gh run download "$INPUT_DEPLOY_RUN_ID" \
               --name "winners-$INPUT_DEPLOY_RUN_ID" \
               --dir /tmp/winners 2>/dev/null; then
            echo "[winners] downloaded artifact for run $INPUT_DEPLOY_RUN_ID"
          else
            echo "[winners] artifact not present (file unchanged this build) — skipping"
          fi

      - name: Extract dist/ + restore data files from artifact
        run: |
          # Pages artifact wraps a single artifact.tar — extract into dist/.
          rm -rf dist && mkdir -p dist
          tar -xf /tmp/github-pages-artifact/artifact.tar -C dist

          # Restore master data/jobs.json from the dedicated artifact
          # (jobsJsonDistCleanupPlugin strips it from dist/ to clear the
          # 10 GB GH Pages cap — validators still need the master copy
          # with titleByLocale / descriptionByLocale).
          mkdir -p data
          cp -f /tmp/jobs-master/jobs.json data/jobs.json
          # Expose jobs.json to scripts that expect public/data/jobs.json.
          mkdir -p public/data
          cp -f data/jobs.json public/data/jobs.json
          # validate:crawler-summaries reads data/jobs-crawler-summaries.json
          # (gitignored, assembled at build). Its dist/data/ copy is offloaded
          # to the CDN repo AND deleted from dist by offload-generated-images-
          # cdn.mjs (PR #1288), so it is NOT in the Pages artifact — restore it
          # from the jobs-master artifact (same channel as jobs.json above).
          cp -f /tmp/jobs-master/jobs-crawler-summaries.json data/jobs-crawler-summaries.json

          # Optional artifacts — copy if present.
          if [ -f /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json ]; then
            cp /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json /tmp/pre-deploy-sitemap-urls.json
          fi
          if [ -f /tmp/winners/previous-slug-winners.json ]; then
            cp /tmp/winners/previous-slug-winners.json data/previous-slug-winners.json
          fi

      # Same merged locale+section rehydrate as validate-dist-source (see that
      # job's step for the full rationale + the shared scripts). Each of the
      # jobs still runs its own copy of this step on its own fresh runner —
      # it's the bash body that's shared now, not the step itself — since
      # the post-build audits below walk the same logical site as the source
      # validators do and each job needs its own dist/ rehydrated.
      # NO cross-job shard clone cache here — REMOVED deliberately, issue
      # #5441 (follow-up of #5432 point 6d). An actions/cache restore/save
      # pair keyed `shard-clone-cache-<run_id>-<job>-<attempt>` used to wrap
      # this step so that ONE of the three parallel validate-dist jobs would
      # pay the shard `git clone` fallback on behalf of all three. Measured,
      # it could not work, and re-adding it in that shape is a net loss:
      #   • It never hit, structurally — not by bad luck. The restore ran
      #     BEFORE the rehydrate and the save AFTER it, while the 3 jobs start
      #     within 7 s of each other (06:50:17/18/24 on run 31296098323) and
      #     the rehydrate takes 10-25 min: at attempt 1 every job restores
      #     before any job has saved. Across 7 runs / 20 entries,
      #     `lastAccessedAt == createdAt` on ALL of them — GitHub stamps that
      #     field on restore, so not one entry was ever read.
      #   • Even a 100% hit rate would save 0 s of wall clock. The cache
      #     branch in scripts/lib/rehydrate-section-shards.sh shortcuts only
      #     the `git clone` FALLBACK, never the tar-artifact fast path. On run
      #     31296098323 just 11 of ~90 shards fell back, and all 11 finished
      #     303-326 s BEFORE the step ended — the critical path is the
      #     ticino/svizzera tar extraction, which this cache cannot touch by
      #     construction. The clones sit entirely in its shadow.
      #   • It cost real time and real quota. `Save` measured 70/70/59 s on
      #     that run's 3 jobs (199 s per run) and it lands ON the critical
      #     path, because restore and save are serial steps while the clones
      #     are not. Entries ran 150-210 MB each: 4.34 GB of a 10 GB repo
      #     cache that stood at 10.68 GB — over quota, evicting LRU — so
      #     never-read entries were displacing caches that ARE read (32 of the
      #     47 non-shard entries had been restored at least once).
      # Bringing it back needs all three of: (1) a key that survives the run
      # — and therefore an invalidation bound to the SHARD's head commit,
      # never to wall-clock age, because serving a stale shard is exactly the
      # failure class of #5432 point 1, a gate that measures old bytes and
      # reports a number which does not describe production; (2) a
      # demonstrated win on the CRITICAL path, i.e. it must shortcut the tar
      # fast path too, since shortcutting the 11 clone-fallback shards
      # provably buys nothing; (3) a size budget against the 10 GB cap.
      # The MECHANISM is not deleted: SHARD_CLONE_CACHE_DIR still works in the
      # rehydrate scripts and is still used by
      # scripts/ci/revalidate-dist-locally.sh, where the cache dir lives in a
      # per-deploy-run WORKDIR on one machine and repeated local runs really
      # do reuse it, at no upload cost. Only the CI wiring that could never
      # hit is gone.

      - name: Rehydrate locale then section shards into dist/ (when sharding active)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          LOCALE_SHARDS_LIVE: ${{ vars.LOCALE_SHARDS_LIVE }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          bash scripts/lib/rehydrate-locale-shards.sh &
          LOCALE_PID=$!

          LOCALE_RC=0
          wait "$LOCALE_PID" || LOCALE_RC=$?

          bash scripts/lib/rehydrate-section-shards.sh

          if [ "$LOCALE_RC" -ne 0 ]; then
            exit "$LOCALE_RC"
          fi

      # Precondition for every dist-walking audit/validator in this job. The
      # section rehydrate above is soft-fail BY CONTRACT (it warns and degrades
      # rather than aborting), so a shard repo that clones empty leaves dist/
      # missing an entire subtree — and from there every audit reports the
      # absent pages as unreachable / thin / orphan content OF THE SITE, not as
      # a hole in its own input. Issue #4857 is that verdict in its purest form:
      # an audit replay that never rehydrated at all called ~68k reachable
      # cluster URLs an entire content tier below crawl depth. Stop here, with
      # the reason named, instead of shipping a fabricated structural finding.
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs
      - name: Migrate all-known-job-slugs to canton-aware paths
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      # Report-only wiring (issue #5656 item 2): validate-page-seo-quality.mjs
      # was discovered orphaned — only reachable via `npm run validate:page-seo`,
      # invoked by zero workflows — so it never ran anywhere despite being
      # written as deploy-blocking (`process.exit(1)` on any error). Surfacing
      # it here first, non-blocking (`continue-on-error: true`), lets its
      # findings accumulate real signal before the owner decides to promote it
      # to deploy-blocking (a distinct risk decision, not this step's call).
      - name: Validate page SEO quality (report-only)
        continue-on-error: true
        run: npm run validate:page-seo

      # Validation pool.
      # Runs dist/ HTML walkers plus the post-deploy live smoke in capped
      # parallel. This keeps the critical path close to the slowest dist audit
      # instead of paying an extra tail for CDN propagation + probe + live E2E.
      - name: Post-build validations + SEO audits (capped parallel)
        env:
          # Cap each audit's V8 heap at 4 GB. Without this the GitHub
          # ubuntu-latest free runner (~7 GB usable) was still OOM-killing
          # `audit:dist-multi-light` and `audit:title-uniqueness` at
          # rc=134 even after every heavy walker had been moved into the
          # serial chain. The runner has 7 GB but Node's default
          # max-old-space-size grows opportunistically under pressure;
          # capping it forces aggressive GC and prevents single-process
          # blow-ups when walking ~132k HTML files.
          NODE_OPTIONS: '--max-old-space-size=4096'
          # AUDIT_STRICT=1 enables the unified runner's AST mutation
          # detection: every audit's collect() runs against a frozen html
          # string; any mutation triggers a fail loud with the auditor's
          # name. Cheap (single equality check per file per audit) and
          # catches accidental side-effects during future audit migrations.
          AUDIT_STRICT: '1'
          # Rotating sample (scripts/lib/audit-runner.mjs's sampleFiles(),
          # read via resolveSamplingEnv() by `npm run audit:all` below plus
          # audit:hreflang and audit:canonical-trailing-slash — the two
          # full-dist walkers that were this pool's critical path on run
          # 30376520728, at 2000s and 1711s of a 58m55s job (PR #4903) — and,
          # since #5440, by the report-only audit:discover-eligibility launched
          # further down in this same run block (it was a separate step with
          # its own identical copy of these two vars; folding it in here made
          # the copy redundant, NOT the sampling different — same rate, same
          # salt, same 4-run rotation). Every
          # other gate in this step still ignores these two vars and scans
          # 100%. audit:hreflang samples only which pages it PARSES: its
          # target-existence index is always built from the full walk, so a
          # sampled run reports a broken alternate with the same certainty as
          # a full one. audit:canonical-trailing-slash is 0-tolerance with no
          # baseline to ratchet, so sampling costs at most a one-run delay on
          # an isolated offender — a systemic regression lands in every
          # bucket. audit:all's
          # walk+collect over the full dist/ corpus (~2.1M indexable pages) is
          # the per-file read+regex collect pass that scales with corpus size;
          # the walk itself (~3.5min) is cheap. At rate=0.25 with
          # AUDIT_SAMPLE_SALT rotating every run via github.run_number, every
          # page in dist/ still gets scanned at least once within 4
          # consecutive runs. This does NOT lower any gate's pass/fail
          # threshold (AGENTS.md non-negotiable #1) — it trades per-run
          # completeness for wall-clock, with the rotation guaranteeing
          # bounded-time full coverage instead of permanent blind spots.
          # See scripts/audit-all.mjs's file-header docs.
          #
          # COVERAGE LATENCY, stated honestly (issue #5432, point 6). The
          # window is `round(1/rate)` = 4 CONSECUTIVE deploy-publish runs, and
          # the "pushes land every 15-60 min, so well under 4 hours" line this
          # comment used to carry was stale. Measured on runs 31283409340 /
          # 31287634802 / 31291721200 / 31296098323, deploy-publish fires
          # about every 2 h, so the real worst case for a sampled gate to see
          # an ISOLATED offender is ~8 h. A systemic regression still lands in
          # every bucket and is caught on the very next run.
          #
          # WHICH GATES DELIBERATELY IGNORE THESE TWO VARS — do NOT "finish
          # the job" by wiring them into the rest, that is exactly how a
          # ratchet gets loosened by 1/rate in silence:
          #   • audit:spa-bundle-injection — a 0-tolerance ABSOLUTE-COUNT
          #     ratchet with no noise floor. Sampling turns the count into a
          #     binomial draw whose extrapolated σ (±180 at rate=0.25, against
          #     a baseline of 10 800 with ~141 of headroom) is larger than the
          #     headroom itself, so the gate would FLAP red rather than merely
          #     loosen. Its file header carries the arithmetic. It got its
          #     speed from I/O scheduling instead — see the pool below.
          #   • audit:max-bfs-depth / audit:orphan-sitemap-pages (now in
          #     validate-dist-postbuild-bfs) — a link graph is not samplable:
          #     dropping one node changes the reachability of others
          #     (scripts/audit-bfs-depth.mjs:58-67).
          #   • assert-dist-complete — a sample cannot prove the pages are all
          #     there. validate:third-party-secrets — one missed file is a
          #     secret in production.
          AUDIT_SAMPLE_RATE: '0.25'
          AUDIT_SAMPLE_SALT: ${{ github.run_number }}
        run: |
          # MAX_PARALLEL=4 — bumped after live measurement on run
          # 26087963151. audit:all peaked at ~1 GB RSS and held the whole
          # 363 s wall window; the pool's heaviest light audit
          # (orphan-sitemap-pages, 92 s) completed inside that window with
          # MAX_PARALLEL=2 — cumulative observed peak ~3-4 GB, well under
          # the 7 GB ubuntu-latest free runner ceiling.
          #
          # Lifting to 4 lets up to four light pool audits run in parallel.
          # If a regression OOMs the runner, drop back to 2 in a hotfix.
          #
          # WHICH GATE IS ACTUALLY THE TAIL — read this before optimising
          # anything here (issue #5432, point 6b). The line that used to sit
          # in this comment, "audit:all remains the bottleneck", was wrong by
          # 1.7x and sent readers at the wrong gate. Per-gate rows from
          # /tmp/post-build-timings.txt on three consecutive real runs:
          #
          #   gate                            31283409340  31287634802  31296098323
          #   audit:spa-bundle-injection         1735.12s     1769.40s     1880.28s
          #   audit:all                          1109.49s     1057.10s      996.28s
          #   audit:no-dotfile-html               538.59s      535.65s      647.04s
          #   validate:sitemap-pages              545.46s      504.30s      522.53s
          #   audit:hreflang                      532.70s      455.11s      440.98s
          #   audit:canonical-trailing-slash      425.82s      413.16s      288.92s
          #   audit:sitemap-canonicals            185.09s      134.57s      157.71s
          #   validate:sitemap-links               71.70s       70.93s       78.30s
          #   validate:jobs-quality                 5.02s        5.79s        5.11s
          #   audit:news-sitemap                    1.01s        0.80s        1.26s
          #   ── STEP WALL                        1740s        1776s        1885s
          #
          # audit:spa-bundle-injection was 99.6-99.7 % of the step wall: every
          # other gate finished inside its window, so the step's last 626-884s
          # (1735−1109 … 1880−996), i.e. 10-15 min, were one Node process on
          # 4 vCPU. It has now been rewritten to overlap
          # its syscalls (bounded-concurrency readdir + read-ahead, same
          # primitives as scripts/lib/audit-runner.mjs) with NO sampling and
          # NO coverage change — see its file header. The evidence that this
          # is where its time went is in the table above: audit:no-dotfile-html
          # (SYNCHRONOUS full-tree walk, zero file reads) costs 535-647s, while
          # audit:canonical-trailing-slash (ASYNC concurrent walk of the same
          # tree PLUS a sampled read+regex pass) costs 289-426s.
          #
          # That prediction — "expect audit:all (~1000-1100s) to be the new
          # tail" — DID NOT HOLD, and it is left here as the standing warning
          # against trusting this block by age instead of by measurement.
          # Measured on run 31310187420, after the rewrite and after #5438:
          #
          #   audit:spa-bundle-injection   1619s   ← still the tail
          #   audit:all                    ~1037s
          #   ── STEP WALL                 ~1625s
          #
          # The rewrite bought ~150-260s, not the 600s+ that would have handed
          # the tail to audit:all. Treat the tail as an OPEN QUESTION and read
          # it off a fresh timings table every time; the ~18 min of slack under
          # spa-bundle is what makes room for the report-only Discover audit
          # spawned in the pool below (#5440), and that slack is only as real
          # as this measurement is fresh.
          MAX_PARALLEL=4
          : > /tmp/post-build-timings.txt
          : > /tmp/post-build-failures.txt

          # The sliding-window primitive lives in ONE place since #5130
          # (scripts/lib/bounded-parallel.sh) — this step is where the idiom
          # was first proven, and deploy.yml's section fan-outs now use the
          # same implementation. Keeping a verbatim second copy here is
          # exactly the duplication AGENTS.md #6 forbids.
          source scripts/lib/bounded-parallel.sh
          wait_slot() { bp_wait_slot "$MAX_PARALLEL"; }

          # IMPORTANT: `set +e` inside the subshell. The GH Actions default
          # shell is `bash -eo pipefail`, which propagates errexit into the
          # ( ... ) subshell. Without `set +e`, a non-zero rc from "$@" kills
          # the subshell BEFORE rc=$? runs, so neither the timings file nor
          # the failures file gets the row — the failed task vanishes and
          # the parent step prints "✅ All passed". This silently masked
          # the title-length regression in post-deploy run 25377607613.
          spawn_capped() {
            local name=$1; local logfile=$2; shift 2
            wait_slot
            (
              set +e
              start=$(date +%s.%N)
              "$@" > "$logfile" 2>&1
              rc=$?
              end=$(date +%s.%N)
              awk "BEGIN{printf \"%-40s %7.2f rc=%d\n\", \"$name\", $end-$start, $rc}" \
                >> /tmp/post-build-timings.txt
              if [ $rc -ne 0 ]; then
                echo "$name $logfile" >> /tmp/post-build-failures.txt
              fi
            ) &
          }

          # ── UNIFIED RUNNER (audit:all) + remaining heavy chain ──
          #
          # `npm run audit:all` runs 6 dist-walking audits in ONE Node process:
          # text-html-ratio, h1-title-duplicates, title-length,
          # title-no-disambig-hash, footer-root-presence, jsonld-no-nested-scripts.
          # The unified runner walks dist/ once and dispatches each file to
          # every in-process auditor. Peak RSS ~1 GB (single V8 shared across
          # all 6 audits) vs the previous 6× ~1-3 GB fan-out — which is the
          # OOM history that forced MAX_PARALLEL=1 in the first place
          # (runs 25400905401, 25402597503, 25404549152, 25406916097).
          # Measured speedup on local dist (82k files): 209 s sequential
          # → 96 s unified (2.17× wall-time reduction, plus structural
          # memory headroom that would now allow lifting MAX_PARALLEL).
          #
          # Remaining unmigrated chain audits (page-weight, content-duplicates,
          # faqpage-validity) still each spawn their own Node process and
          # walk dist/ from scratch — they stay serialized here until they
          # migrate too. audit:title-uniqueness lives in a weekly workflow
          # (memory-bound on the 7 GB runner; documented in run history).
          # audit:all now covers ALL heavy dist-walking audits in a single
          # Node process (text-html-ratio, h1-title-duplicates, title-length,
          # title-no-disambig-hash, footer-root-presence, jsonld-no-nested-
          # scripts, salary-landing-template, page-weight, content-duplicates,
          # faqpage-validity). The "chain" is now one step. We keep the
          # subshell wrapper + timing dump so the workflow summary still
          # has a structured row per logical audit.
          #
          # audit:max-bfs-depth + audit:orphan-sitemap-pages moved OUT to
          # their own job (`validate-dist-postbuild-bfs`, this file) — both
          # are full dist-tree link-graph BFS walkers that don't share
          # in-memory state with audit:all (each does its own from-scratch
          # dist/ walk), so putting them on a separate runner lets them run
          # CONCURRENTLY with this job instead of serialized after it
          # (~30min off the critical path — see that job's header comment).
          # They were ALSO never safe to fold into the LIGHT POOL below: at
          # real production scale (~2.8M pages) both crashed at rc=134
          # "Reached heap limit" sharing the light pool's 4096 MB cap
          # 4-way — they need their own bumped heap ceiling regardless of
          # which job they run in.
          (
            set +e
            start=$(date +%s.%N)
            npm run audit:all > /tmp/g10.log 2>&1
            rc=$?
            end=$(date +%s.%N)
            awk "BEGIN{printf \"%-40s %7.2f rc=%d\n\", \"audit:all\", $end-$start, $rc}" \
              >> /tmp/post-build-timings.txt
            if [ $rc -ne 0 ]; then
              echo "audit:all /tmp/g10.log" >> /tmp/post-build-failures.txt
            fi
          ) &
          DIST_MULTI_PID=$!

          # LIGHT POOL — only audits that DON'T walk the full dist HTML
          # tree (or walk it cheaply via streaming). Safe to parallelise.
          # audit:orphan-sitemap-pages moved OUT — it's a full dist-tree BFS
          # walker, contradicting this pool's own criterion above. It now
          # runs on its own runner in the validate-dist-postbuild-bfs job
          # (this file) with its own bumped heap ceiling instead of
          # contending 4-way for this pool's shared 4096 MB cap, which is
          # what caused it to OOM (rc=134) at real production scale.
          spawn_capped validate:sitemap-pages        /tmp/spm.log \
            npm run validate:sitemap-pages
          # Issue #5655 item 2: dedicated, UNSAMPLED dist/ coverage gate for
          # the GSC keyword-landing family (build-plugins/jobsSeoPagesPlugin.ts
          # KEYWORD_LANDING_MIN_JOBS region). audit:all's AUDIT_SAMPLE_RATE
          # makes a set-membership check unsound (an unsampled URL and an
          # absent one look identical), so this lives here instead — same
          # light pool as the other unsampled full-dist walkers
          # (audit:spa-bundle-injection above). See the script's own header
          # for the exact check and why only the sitemap→dist direction is
          # blocking.
          spawn_capped validate:keyword-landing-coverage /tmp/kwlc.log \
            npm run validate:keyword-landing-coverage
          spawn_capped validate:jobs-quality         /tmp/v2.log \
            npm run validate:jobs-quality
          spawn_capped validate:sitemap-links        /tmp/v3.log \
            npm run validate:sitemap-links
          # Was this step's tail at 99.6-99.7 % of its wall (see the table in
          # the MAX_PARALLEL comment above). Still scans 100 % of dist/ and
          # still ratchets on the same absolute count — it is deliberately the
          # ONE full-dist walker in this pool that ignores AUDIT_SAMPLE_RATE,
          # because its 0-tolerance count baseline has less headroom than the
          # sampling noise would have. Speed came from overlapping its
          # syscalls, not from reading less.
          spawn_capped audit:spa-bundle-injection    /tmp/spa-bundle.log \
            npm run audit:spa-bundle-injection

          # ── DISCOVER ELIGIBILITY — REPORT, NOT A GATE (issue #5440) ────────
          #
          # This used to be its own `continue-on-error: true` step AFTER this
          # one. It is the only entry here that is not a gate: it reports
          # Discover eligibility per page family and must never be able to turn
          # `validate-dist` red. A red validate-dist skips the whole `publish`
          # job (IndexNow, Google Indexing API, GSC sync), so an eligibility
          # report that blocks indexation would cost more traffic than the gap
          # it measures (issue #5001; same non-blocking pattern as
          # `check-seo-moratorium` in deploy.yml). The two universal checks it
          # covers are already enforced at the source by
          # tests/seo/discover-robots-directive.test.ts and
          # tests/dist-single-h1-per-page.test.ts.
          #
          # WHY IT MOVED IN HERE, and what that costs — NOTHING in coverage.
          #
          # As a serial step it was the single most expensive thing in the job
          # despite not gating anything:
          #
          #   run 31283409340   37m02s   (of an 82m40s job — 45 %)
          #   run 31287634802   34m56s   (of an 81m22s job — 43 %)
          #   run 31296098323   41m35s   (of an 89m48s job — 46 %)
          #
          # #5438 sampled it at 25 %, which took it to 8m55s on run
          # 31310187420 and the job from ~76-79 min to 51m12s. Those ~9 min
          # were still SERIAL: a non-gating report sitting on the critical path
          # of a gate, and reclaimed by the corpus at every future growth.
          #
          # Here it is concurrent instead, and the ~9 min disappear from the
          # wall rather than shrinking: this step's tail is
          # audit:spa-bundle-injection at 1619s (measured post-#5438 — NOT
          # audit:all at ~1037s, which is what #5438 predicted and got wrong),
          # so there is ~18 min of slack under the tail for a 535s task.
          #
          # COST IN COVERAGE OR FREQUENCY: none. It still runs on EVERY deploy,
          # at the same 25 % rate, with the same github.run_number salt and the
          # same 4-run rotation — those two vars now come from this step's own
          # `env:` block above, which already carried identical values. The
          # ~8 h worst case for an isolated newly-broken family to surface is
          # the one #5438 introduced and documented; this change does not touch
          # it. The nightly-schedule alternative (audit-dist-from-run.yml) WOULD
          # have: one observation per 24 h instead of per deploy, on a third
          # 240-minute runner, gated on a 7-day artifact retention. That is why
          # it was not taken.
          #
          # WHY IT IS SAFE TO SAMPLE AT ALL, unlike the gates around it: this
          # script has NO baseline and NO ratchet. `createAuditor().report()` in
          # scripts/audit-discover-eligibility.mjs returns `passed: true`
          # unconditionally (pinned by tests/seo/audit-discover-eligibility.test.ts
          # — "NEVER reports passed:false"), and the standalone path exits 0
          # unless `--strict`, which CI does not pass. There is no threshold for
          # a smaller denominator to loosen: the output is a per-family PASS
          # RATE. Contrast audit:spa-bundle-injection right above, an
          # absolute-count ratchet that is deliberately NOT sampled.
          #
          # WHY NOT `spawn_capped`, and why the memory is fine:
          #
          #  • NOT spawn_capped, because spawn_capped's contract is a GATE:
          #    a non-zero rc lands in /tmp/post-build-failures.txt, fails this
          #    step, and — via `Publish gate results` — enters `failed_gates`,
          #    where scripts/ci/classify-validate-dist-failures.mjs is
          #    DEFAULT-DENY and would sequester `publish`. That is precisely the
          #    outcome the old step's `continue-on-error: true` existed to
          #    prevent. Here the `rc=0` in the timings row is a LITERAL, not
          #    `$?`: no code path in this block can write a non-zero rc for this
          #    name, and nothing is ever appended to the failures file. The real
          #    rc is echoed into the log instead, so a crash is loud without
          #    being blocking.
          #  • MEMORY: `wait_slot` (bp_wait_slot, scripts/lib/bounded-parallel.sh)
          #    blocks on `jobs -rp`, which counts EVERY background job of this
          #    shell — the audit:all chain included. So the number of concurrent
          #    Node processes in this step is hard-capped at MAX_PARALLEL=4
          #    whether this block exists or not: one more entrant in a
          #    slot-gated queue cannot raise peak concurrency. The OOM history
          #    that forced MAX_PARALLEL=1 (runs 25400905401, 25402597503,
          #    25404549152, 25406916097) was 6 heavy walkers fanned out with no
          #    cap; nothing here changes the cap.
          #    Per-process, the bound is arithmetic rather than a guess — read
          #    scripts/audit-discover-eligibility.mjs's standalone() and add up
          #    what is LIVE at once:
          #      · walkHtmlFiles() path array — one string per .html in dist.
          #        At ~3.3M files (the figure audit-runner.mjs's own walk
          #        comment uses) and ~80-char paths, a Latin1 SeqString is
          #        16 B header + length, plus one pointer-compressed array slot:
          #        ~110 B/entry ⇒ ~360 MB. THIS IS THE WHOLE COST, and it is
          #        paid identically today — the standalone step already calls
          #        the same walk. Moving the call site changes it by zero.
          #      · sampleFiles() `sampled` — `files.filter(...)`, i.e. 25 % of
          #        the REFERENCES, not copies of the strings: ~3.3M × 0.25 ×
          #        4-8 B ⇒ under 10 MB.
          #      · exactly ONE html string at a time: the collect loop is a
          #        strictly serial `await readFile` with NO read-ahead, and
          #        stripNonContentRegions() chains 4 `.replace`s, so ~5× one
          #        page is live at the peak — ~100 KB at the ~20 KB average
          #        audit-runner.mjs documents, ~25 MB even for a pathological
          #        5 MB page. Per-iteration garbage, not accumulation.
          #      · accumulators: a Map bounded by family count (~87 rows of
          #        ~10 numbers) and an offenders array hard-capped at limit=50.
          #        Kilobytes.
          #    Total < ~400 MB, against this step's 4096 MB cap and the runner's
          #    ~7 GB. That serial I/O is why it is SLOW, and the same reason it
          #    is CHEAP in heap. For comparison inside this same pool:
          #    audit:hreflang pays the same path array AND builds a full
          #    target-existence index over the whole walk on top of it;
          #    audit:all runs 12 auditors with READAHEAD concurrency at ~1 GB
          #    measured. Discover is under both, so substituting it into a slot
          #    can only lower or match the co-resident sum against the ~3-4 GB
          #    cumulative peak already recorded in the MAX_PARALLEL comment.
          #    It also gains this step's `--max-old-space-size=4096`, which it
          #    did NOT have as a standalone step (no job- or workflow-level
          #    NODE_OPTIONS exists in this file) — a tightening, not a loosening.
          #  • AUDIT_STRICT='1' from this step's env is inert here: it is read
          #    only by runAudits() in scripts/lib/audit-runner.mjs, and this
          #    script's standalone path never calls it.
          wait_slot
          (
            set +e
            start=$(date +%s.%N)
            npm run audit:discover-eligibility > /tmp/discover-eligibility.log 2>&1
            rc=$?
            end=$(date +%s.%N)
            echo "" >> /tmp/discover-eligibility.log
            echo "[report-only] audit:discover-eligibility exited rc=$rc — NOT a gate; never propagated to post-build-failures.txt nor to failed_gates (issue #5440)" \
              >> /tmp/discover-eligibility.log
            # `rc=0` is HARD-CODED on purpose — see the bullet above. The row
            # exists only so the timings table still accounts for the wall time.
            awk "BEGIN{printf \"%-40s %7.2f rc=0\n\", \"audit:discover-eligibility(report-only)\", $end-$start}" \
              >> /tmp/post-build-timings.txt
          ) &

          # 0-tolerance: dotfile `dist/**\/.html` files mean a plugin produced
          # `<dir>/.html` via `path + '.html'` where `path` ended in `/`.
          # GitHub Pages serves these for `/<dir>/` with
          # content-type=application/octet-stream, masking the real
          # index.html. See incident 2026-05-28: ogPagesPlugin emitted
          # ~2 540 of these for articles, AdSense RPM crashed from 3.04 to
          # 1.74 CHF/day.
          spawn_capped audit:no-dotfile-html         /tmp/no-dotfile-html.log \
            npm run audit:no-dotfile-html
          spawn_capped audit:hreflang                /tmp/g14.log \
            npm run audit:hreflang
          spawn_capped audit:sitemap-canonicals      /tmp/g15.log \
            npm run audit:sitemap-canonicals
          spawn_capped audit:canonical-trailing-slash /tmp/g15b.log \
            npm run audit:canonical-trailing-slash
          spawn_capped audit:news-sitemap            /tmp/g16.log \
            npm run audit:news-sitemap

          # ── JOB TITLE LOCALE — REPORT, NOT A GATE (PR #5571) ───────────────
          #
          # `npm run audit:job-title-locale` (scripts/audit-job-title-locale.mjs)
          # measures how many non-source `titleByLocale` slots still read as
          # another language once employer/location names are stripped, via
          # titleLooksUntranslated(). It is wired here DIRECTLY, and the two
          # things it is NOT are both deliberate:
          #
          #  • NOT registered in `scripts/audit-all.mjs`, for two independent
          #    reasons. (a) STRUCTURAL: audit-all's REGISTRY entries are
          #    `factory` functions that the unified runner feeds one dist HTML
          #    file at a time (scripts/lib/audit-runner.mjs). This audit never
          #    opens dist/ — its corpus is data/jobs.json, restored above from
          #    the jobs-master artifact because that is the only copy still
          #    carrying titleByLocale/descriptionByLocale. There is no shape in
          #    which it is an audit-all auditor. (b) SAMPLING: audit-all reads
          #    AUDIT_SAMPLE_RATE (scripts/audit-all.mjs, `sample-rate` default
          #    `process.env.AUDIT_SAMPLE_RATE`), which this step's env pins to
          #    '0.25'. Registering there means inheriting a 25 % sample IN
          #    SILENCE — and this audit's entire output is a published RATE
          #    that tests/job-locale-consistency.test.ts ratchets against
          #    (35.50 % ceiling, 32.55 % measured 2026-08-11 on the assembled
          #    data/jobs.json — the same artefact restored into this job, which
          #    is exactly why the two agree). A number that
          #    moves with the sample is not the number that ratchet is about,
          #    and the weekly job-title-locale-audit.yml — which runs the same
          #    script unsampled — would then disagree with this one for no
          #    reason a reader could see.
          #  • NOT `spawn_capped`, for the same reason as the Discover block
          #    above: spawn_capped's contract is a GATE. A non-zero rc lands in
          #    /tmp/post-build-failures.txt, fails this step and, through the
          #    default-deny scripts/ci/classify-validate-dist-failures.mjs,
          #    sequesters `publish`. This audit is report-only by construction
          #    (it sets a non-zero exitCode only when the caller passes
          #    --max-rate, which nothing here does) and ~30 % of title slots
          #    flag today: gating on it would block every deploy on a defect
          #    that predates it by months. The `rc=0` below is a LITERAL for
          #    exactly the Discover reasons; the real rc is echoed into the log
          #    so a crash stays loud without being blocking.
          #
          # WHAT THIS CALL SITE ADDS over the weekly workflow: frequency and
          # subject. The weekly one assembles the dataset from the committed
          # slices and owns the speaking issue; this one measures the very
          # data/jobs.json the deployed build consumed, on every deploy, at
          # 100 % coverage.
          #
          # COST, and why this block is LAST in the spawn list. It is one
          # JSON.parse of data/jobs.json plus a regex pass over the ~80k
          # non-source title slots — no dist walk at all, so it adds no new
          # heap CLASS to this pool: validate:jobs-quality parses the identical
          # file (scripts/validate-jobs-quality.mjs) under the identical
          # --max-old-space-size=4096. What it could add is a second COPY of
          # that parse resident at the same moment. `wait_slot` admits entrants
          # in source order, and validate:jobs-quality is admitted 2nd while
          # this is admitted last, after the five light audits above — by then
          # it has long exited, and what remains co-resident is the pool tail
          # (audit:all ~1 GB, audit:spa-bundle-injection), neither of which
          # touches jobs.json. Even a full overlap fits: ~0.5 GB each against
          # the ~3-4 GB cumulative peak recorded in the MAX_PARALLEL comment
          # and the runner's ~7 GB. Peak CONCURRENCY is unchanged either way —
          # `wait_slot` counts every background job of this shell, so one more
          # entrant in a slot-gated queue cannot raise it.
          #
          # The report goes to /tmp, never to the checked-out data/: this job
          # validates a build, it must not mutate its tree. It is also not
          # written to dist/audit-reports/, whose `gate-offenders` jq line in
          # `Publish gate results` expects a gate-shaped record.
          wait_slot
          (
            set +e
            start=$(date +%s.%N)
            npm run audit:job-title-locale -- --report /tmp/job-title-locale-audit.json \
              > /tmp/job-title-locale.log 2>&1
            rc=$?
            end=$(date +%s.%N)
            echo "" >> /tmp/job-title-locale.log
            echo "[report-only] audit:job-title-locale exited rc=$rc — NOT a gate; never propagated to post-build-failures.txt nor to failed_gates (PR #5571)" \
              >> /tmp/job-title-locale.log
            # `rc=0` is HARD-CODED on purpose — see the bullet above.
            awk "BEGIN{printf \"%-40s %7.2f rc=0\n\", \"audit:job-title-locale(report-only)\", $end-$start}" \
              >> /tmp/post-build-timings.txt
          ) &

          # seo/meta-description-audit — REPORT ONLY, same idiom and same
          # rationale as job-title-locale above.
          #
          # Why it is HERE and not in tests.yml: it needs a real dist/, and
          # neither `typecheck` nor `vitest (unit + integration)` builds or
          # downloads one. Adding a THIRD job to tests.yml would also be
          # ornamental — auto-merge keys on the single check-run name
          # `vitest (unit + integration)` (scripts/ci/lib/constants.mjs), so a
          # sibling job there is never consulted. This pool is where every
          # other dist reader already runs.
          #
          # Why report-only and not spawn_capped: the script always exits 0 by
          # construction (fail-soft, stub report on a missing/empty dist), so
          # feeding it to the gate wrapper would assert a contract it does not
          # have. It is a measurement, and until now it was a measurement
          # nobody ever took: the script was ORPHANED — zero references in
          # .github/workflows/**, package.json and scripts/ci/**. The "19 su 22
          # pagine lavoro senza meta description" in issue #5412 is the residue
          # of one manual run, never re-measured, and it was wrong: the reader
          # required quotes around `description` and dist is minified with
          # `removeAttributeQuotes`. Measured 2026-08-11 on 200 production job
          # pages: old reader 200/200 "missing", 0/200 actually missing.
          #
          # Cost: one dist walk with a regex per file, no JSON.parse of a large
          # data file and no browser — the lightest class in this pool. Report
          # goes to /tmp, never into the checked-out tree, and not into
          # dist/audit-reports/ whose `gate-offenders` jq line below expects a
          # gate-shaped record.
          wait_slot
          (
            set +e
            start=$(date +%s.%N)
            node scripts/seo/meta-description-audit.mjs \
              --dist=dist --out=/tmp/meta-description-reports \
              > /tmp/meta-description-audit.log 2>&1
            rc=$?
            end=$(date +%s.%N)
            echo "" >> /tmp/meta-description-audit.log
            echo "[report-only] seo/meta-description-audit exited rc=$rc — NOT a gate; never propagated to post-build-failures.txt nor to failed_gates" \
              >> /tmp/meta-description-audit.log
            # `rc=0` is HARD-CODED on purpose — see the bullet above.
            awk "BEGIN{printf \"%-40s %7.2f rc=0\n\", \"seo:meta-description(report-only)\", $end-$start}" \
              >> /tmp/post-build-timings.txt
          ) &

          # dist:quality-tests — REAL GATE (issue #5656 item 1). Five vitest
          # files (`npm run gate:dist-quality`) each assert a dist/**/*.html
          # invariant — duplicate meta descriptions, duplicate page-scoped
          # JSON-LD types, anchor-text accessibility budget, single-H1-per-
          # page, related-search-cluster contract — and were all written
          # behind an opt-in switch, `RUN_DIST_GATES=1`, that no workflow or
          # npm script ever set (tests/gate-wiring.test.ts baseline: 7 files
          # skipping on a switch nobody flips). They never ran against real
          # output. This job already has dist/ downloaded and extracted (see
          # "Extract dist/" above), same reasoning that put the
          # seo/meta-description-audit report just above onto this job.
          #
          # Unlike that report, this one is a REAL gate: non-zero rc is
          # appended to /tmp/post-build-failures.txt like every spawn_capped
          # entry, so it reaches `failed_gates` below.
          #
          # Classified QUALITY, not blocking (see
          # scripts/ci/classify-validate-dist-failures.mjs): all five defects
          # describe a page that RENDERS AND SERVES correctly — the same
          # class as audit:all/content-duplicates and
          # audit:all/h1-title-duplicates, both already QUALITY_GATES — and
          # this is the FIRST time any of the five has ever run against
          # production dist/, so an unreviewed red must not sequester the
          # indexing notification of an already-live, valid deploy.
          #
          # tests/seo/faqpage-validity.test.ts and tests/seo/image-object-
          # license-fields.test.ts sit behind the same RUN_DIST_GATES switch
          # and are deliberately NOT in `gate:dist-quality`: both docstrings
          # say "Mirror of scripts/audit-<name>.mjs", and that script sibling
          # already runs inside `npm run audit:all` above, blocking, against
          # this same dist/ — running the vitest mirror too would be a
          # second full-corpus walk asserting an already-enforced invariant.
          wait_slot
          (
            set +e
            start=$(date +%s.%N)
            npm run gate:dist-quality > /tmp/g-dist-quality.log 2>&1
            rc=$?
            end=$(date +%s.%N)
            awk "BEGIN{printf \"%-40s %7.2f rc=%d\n\", \"dist:quality-tests\", $end-$start, $rc}" \
              >> /tmp/post-build-timings.txt
            if [ $rc -ne 0 ]; then
              echo "dist:quality-tests /tmp/g-dist-quality.log" >> /tmp/post-build-failures.txt
            fi
          ) &
          # audit:image-object-license migrated into `npm run audit:all`
          # (see scripts/audit-all.mjs REGISTRY). Single dist walk, in-process
          # JSON-LD parse — removes 34 s of standalone wall time from the
          # parallel pool. Removed from spawn pool.
          # audit:max-bfs-depth moved OUT — it's a full dist-tree BFS walker,
          # contradicting this pool's own criterion above. It now runs on its
          # own runner in the validate-dist-postbuild-bfs job (this file),
          # serialized with audit:orphan-sitemap-pages there (both previously
          # OOM'd, rc=134, sharing this pool's 4096 MB cap 4-way at real
          # production scale). `-- --json` (still passed there) makes the
          # gate ALSO emit the baseline-candidate JSON into g19.log (printed
          # by audit-bfs-depth.mjs MODE_JSON branch BEFORE the baseline
          # gate's exit, so the gate semantics are unchanged) — that job's
          # own "Dump bfs-depth baseline candidate" step reuses it instead of
          # paying a second full dist BFS walk (~4min). The gate still
          # ratchets identically.
          # audit:footer-root-presence + audit:jsonld-no-nested-scripts +
          # audit:salary-landing-template all migrated into `npm run audit:all`
          # above (single Node process, single dist walk). Removed from the
          # spawn pool.
          # NOTE: live:post-deploy-smoke moved to validate-live workflow.
          # This validate-dist job runs in parallel with `deploy`, before
          # the new dist is published — there's nothing live to smoke
          # yet. The smoke + e2e:live now lives in
          # post-deploy-validate-live.yml as a dedicated step.

          # Wait for the serialized dist-multi chain explicitly, then the
          # rest of the spawn_capped pool. Two `wait` calls (one targeted,
          # one bare) — `wait $PID` returns the chain's rc but we already
          # captured per-variant rc into /tmp/post-build-failures.txt
          # inside the subshell, so the FAIL aggregator below sees them.
          wait "$DIST_MULTI_PID" || true
          wait

          # The Discover report's own output. spawn_capped-style logs are only
          # `cat`-ed in the FAILURE branch below, and this one has no failure
          # branch by construction — without this it would run and print
          # nowhere, which would be a worse regression than the 9 minutes the
          # move saves. Printed BEFORE the FAIL aggregation on purpose: as a
          # separate step it defaulted to `if: success()` and was therefore
          # SKIPPED whenever a gate went red, i.e. exactly when the per-family
          # table was most worth having. `|| true` twice: observability must
          # never be able to fail this step.
          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "Discover eligibility — REPORT ONLY, not a gate (25 % rotating sample)"
          echo "══════════════════════════════════════════════════════════════════════"
          cat /tmp/discover-eligibility.log 2>/dev/null || true
          echo "══════════════════════════════════════════════════════════════════════"

          # Same argument for the job-title-locale report: no failure branch by
          # construction, and its JSON goes to /tmp (not to dist/audit-reports,
          # whose `gate-offenders` jq line below expects a gate-shaped record).
          # The job log is where this number survives — it outlives the 7-day
          # artifact retention the weekly workflow's report depends on.
          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "Job title locale — REPORT ONLY, not a gate (100 % of data/jobs.json)"
          echo "══════════════════════════════════════════════════════════════════════"
          cat /tmp/job-title-locale.log 2>/dev/null || true
          echo "══════════════════════════════════════════════════════════════════════"

          # Same argument again: the meta-description report has no failure
          # branch, the reports/ directory it writes is NOT in the artifact
          # upload path below (which is `if: failure()` and globs
          # dist/audit-reports/**), so the job log is the only place this
          # number survives. A measurement nobody can read is the same defect
          # as a measurement nobody takes.
          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "Meta description — REPORT ONLY, not a gate (100 % of dist/*.html)"
          echo "══════════════════════════════════════════════════════════════════════"
          cat /tmp/meta-description-audit.log 2>/dev/null || true
          echo "══════════════════════════════════════════════════════════════════════"

          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "Post-build gates — per-gate results (MAX_PARALLEL=$MAX_PARALLEL, sorted DESC)"
          echo "══════════════════════════════════════════════════════════════════════"
          PB_PASS=0
          PB_FAIL=0
          while IFS= read -r line; do
            # `|| true`: riga malformata (senza rc=N) + set -euo pipefail
            # ucciderebbe il summary a meta' loop (stessa classe del bug che ha
            # tenuto rosso gh-pat-expiry-monitor 06-01->06-12); rc vuoto cade
            # nel ramo FAIL ed e' visibile, niente crash.
            rc=$(printf '%s' "$line" | { grep -oE 'rc=[0-9]+$' || true; } | sed 's/rc=//')
            if [ "$rc" = "0" ]; then
              printf "✅ PASS  %s\n" "$line"
              PB_PASS=$((PB_PASS + 1))
            else
              printf "❌ FAIL  %s\n" "$line"
              PB_FAIL=$((PB_FAIL + 1))
            fi
          done < <(sort -k2 -gr /tmp/post-build-timings.txt)
          echo "──────────────────────────────────────────────────────────────────────"
          echo "Post-build summary: ${PB_PASS} passed, ${PB_FAIL} failed"
          echo "══════════════════════════════════════════════════════════════════════"
          echo ""

          FAIL=0
          if [ -s /tmp/post-build-failures.txt ]; then
            while read -r name logfile; do
              echo "::error::$name failed"
              cat "$logfile"
              FAIL=1
            done < /tmp/post-build-failures.txt
          fi

          [ $FAIL -eq 0 ] || exit 1
          echo "✅ All post-build validators + audits passed"

      # Per-gate verdict for the integrity classifier (see `integrity-verdict`
      # at the end of this file). `if: always()` — the step above exits 1 on
      # failure and the failing case is exactly the one to classify.
      - name: Publish gate results
        id: gate-results
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s /tmp/post-build-timings.txt ]; then
            # No row recorded ⇒ the job died before/inside the gate step.
            # Sentinel is an unclassified gate name, so the default-deny
            # classifier blocks publish on it.
            echo 'failed_gates=__UNKNOWN__' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FAILED="$(awk '!/rc=0$/ {printf "%s%s", sep, $1; sep=","}' /tmp/post-build-timings.txt)"

          # `audit:all` is a BUNDLE: one row for 12 auditors, some structural
          # (footer-root-presence, jsonld-no-nested-scripts) and some purely
          # cosmetic (title-length, text-html-ratio). Handing that one opaque
          # name to a default-deny classifier means any cosmetic auditor
          # sequesters `publish` — issue #4828, observed again on run
          # 31077435060 where audit:all was red ONLY for h1-title-duplicates,
          # text-html-ratio and no-literal-markdown while every structural
          # auditor passed.
          #
          # Expand it into `audit:all/<auditor>` names so each is classified on
          # its own merits. scripts/audit-all.mjs prints the list as
          # `audit-all: failed-audits=a,b,c`.
          #
          # FAIL-CLOSED: if the marker line is absent (older script, crash
          # before the summary, OOM) the opaque `audit:all` name is kept, and
          # default-deny blocks exactly as it does today. Expansion can only
          # ever make the verdict MORE informed, never assume success.
          if printf '%s' "$FAILED" | grep -qw 'audit:all'; then
            SUBS="$(sed -n 's/^audit-all: failed-audits=//p' /tmp/g10.log | tail -n1)"
            if [ -n "${SUBS:-}" ]; then
              EXPANDED="$(printf '%s' "$SUBS" | tr ',' '\n' \
                | awk 'NF {printf "%saudit:all/%s", sep, $0; sep=","}')"
              echo "audit:all expanded to: ${EXPANDED}"
              FAILED="$(printf '%s' "$FAILED" \
                | tr ',' '\n' \
                | awk -v e="$EXPANDED" '{ if ($0=="audit:all") print e; else print }' \
                | awk 'NF {printf "%s%s", sep, $0; sep=","}')"
            else
              echo "audit:all failed but no failed-audits marker in /tmp/g10.log — keeping opaque name (fail-closed)"
            fi
          fi

          echo "failed_gates=${FAILED}"
          printf 'failed_gates=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"

          # PER-GATE OFFENDER TOTALS, ON SUCCESS TOO (issue #5432, point 6).
          #
          # Until this line, a PASSING gate left no trace of HOW MANY offenders
          # it counted: spawn_capped sends each gate's stdout to /tmp/<x>.log,
          # which is only `cat`-ed in the failure branch above, and the
          # `dist/audit-reports/**` artifact is uploaded `if: failure()`. So on
          # a green run the timings table recorded that each gate passed and
          # how long it took, and nothing else.
          #
          # That gap is what makes a speed change unauditable after the fact.
          # The dangerous failure mode of any optimisation in this job is not a
          # red gate, it is a gate that still exits 0 while counting a FRACTION
          # of the offenders — a sampled ratchet whose baseline was never
          # rescaled reports ~1/rate of them and passes. Reviewing that needs
          # the counts from BEFORE the change, and on green runs they did not
          # survive anywhere. (Concretely: profiling this job for #5432 could
          # recover every gate's DURATION from the logs of runs 31283409340 /
          # 31287634802 / 31296098323, and not one gate's offender count.)
          #
          # The data already exists — scripts/lib/auditReport.mjs writes
          # dist/audit-reports/<name>.json on pass AND on fail, deliberately.
          # It was simply never printed. One line, no new artifact, no storage
          # cost, and the job log outlives the 7-day artifact retention.
          # `|| true`: never let observability break the gate step.
          #
          # Since #5440 this glob also picks up discover-eligibility.json,
          # which is written inside the pool step now instead of after this one.
          # It always reports `passed=true` by construction (it is a report, not
          # a gate) — do not read that row as a gate verdict.
          jq -r '"gate-offenders \(.audit) offendersTotal=\(.offendersTotal) passed=\(.passed)"' dist/audit-reports/*.json 2>/dev/null || true

      # bfs-depth baseline-candidate dump moved to validate-dist-postbuild-bfs
      # (this file) — audit:max-bfs-depth (and its /tmp/g19.log) now runs
      # there, not in this job.

      # `Discover eligibility report (non-blocking)` was a step HERE until
      # #5440. It is now launched inside the capped pool of the "Post-build
      # validations + SEO audits" step above (search
      # `DISCOVER ELIGIBILITY — REPORT, NOT A GATE`), where it overlaps the
      # pool's tail instead of running serially after it. It is still
      # report-only, still 25 %-sampled, and still runs on every deploy — the
      # rationale, the non-gating mechanics and the memory argument all live at
      # that call site. Do not re-add it as a step: as a step it also defaulted
      # to `if: success()` and was skipped on exactly the red runs where the
      # per-family table is most useful.

      - name: Build size summary
        run: |
          echo "=== Recovered dist size summary ==="
          # Was `du -sh dist/` — a full stat-walk of ~1.27M files (~76s) for a
          # number that is ~27G every build (low signal) and is ALSO printed by
          # the rehydrate step. Dropped; `df -h` shows the disk headroom that
          # actually matters here (OOM/disk-full risk) for free.
          df -h / | tail -1
          # The per-HTML `find … -exec du -sh {} +` over ~132k+ files (top-10 by
          # size) was ~2min of pure stat-walk for observability that nothing
          # consumes — dropped. Per-plugin byte attribution already lives in the
          # build job's "Audit dist bytes" step. Keep the cheap sitemap listing.
          #
          # `find dist -name sitemap*.xml` ALSO walked the full ~1.27M-file tree.
          # The sitemap index + shards live at the dist root (and one level down
          # for any per-locale set), so glob those paths directly — no full walk.
          echo "Sitemaps:"
          du -sh dist/sitemap*.xml dist/*/sitemap*.xml 2>/dev/null | sort -rh || true

      # On failure, upload structured audit reports + sitemaps so a debug
      # agent can diagnose without rebuilding dist/. Each audit script writes
      # to dist/audit-reports/<name>.json via scripts/lib/auditReport.mjs;
      # sitemaps are bundled because link-graph audits (bfs-depth,
      # orphan-sitemap-pages, sitemap-canonicals) need them for offline replay.
      # Retention deliberately short — 7 days is enough to fix the failing PR
      # without bloating storage on the free-tier account.
      - name: Upload audit reports + sitemaps on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/audit-reports/**
            dist/sitemap.xml
            dist/sitemap-*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Split out of validate-dist-postbuild (this file, header comment) —
  # audit:max-bfs-depth + audit:orphan-sitemap-pages are full dist-tree
  # link-graph BFS walkers that ran SERIALIZED after audit:all in one
  # shared job (audit:all ~75min + this chain ~30min ≈ 105min sequential
  # on run 29716815865). Neither shares in-memory state with audit:all —
  # each does its own full dist/ walk from scratch — so putting them on
  # their own runner lets them run CONCURRENTLY with validate-dist-postbuild
  # instead of after it, cutting this chain's ~30min off the critical path
  # (same job-level-parallelism lever the file header already used once for
  # the validate-dist-source / validate-dist-postbuild split — see that
  # comment for the OOM/heap-cap rationale on why these two stay serialized
  # WITH EACH OTHER even though they're now parallel with audit:all).
  validate-dist-postbuild-bfs:
    runs-on: ubuntu-latest
    outputs:
      failed_gates: ${{ steps.gate-results.outputs.failed_gates }}
    permissions:
      actions: read     # for download-artifact same-run (github-pages, sitemaps, shard tars)
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — registry operations will be skipped."
          fi

      # Hydrate the runner env with secrets pulled from Firebase Remote Config
      # so the social-media post steps below see FB_PAGE_ACCESS_TOKEN /
      # FB_PAGE_ID / LINKEDIN_POST_* etc. as `process.env.*`. Without this
      # step, post-to-facebook.mjs reads `process.env.FB_PAGE_ACCESS_TOKEN`,
      # finds nothing, and silently exits with the "⚠️ FB_PAGE_ACCESS_TOKEN
      # or FB_PAGE_ID not set — skipping Facebook post" log line. The
      # `Post to Facebook Page` and `Post to LinkedIn Company Page` steps
      # appear green in the UI but never publish.
      #
      # load-rc-env.mjs is best-effort: if Firebase credentials are missing
      # or RC fetch fails, it warns and exits 0, leaving env vars unset and
      # downstream posting steps to perform their own "missing token" skip.
      # That is the same fail-soft contract the deploy.yml pipeline already
      # relies on (see deploy.yml step "Load secrets from Remote Config").
      - name: Load secrets from Remote Config (FB + LinkedIn tokens)
        run: node scripts/load-rc-env.mjs

      # Download GitHub Pages artifact + run source validators sequentially.
      #
      # Previously the 4 source validators were launched as `run_bg ... &` in
      # parallel with the artifact download, to save ~30-60s. That race
      # caused `validate:translation-completeness` and
      # `validate:crawler-summaries` (which read `dist/data/jobs.json` and
      # `data/jobs-crawler-summaries.json` from the unpacked artifact) to
      # fail in <1s with "file not found" — the tar -xf hadn't run yet.
      # The whole step exited 1 before the post-build pool could start, the
      # validate job rolled back, and the BFS-depth gate never got tested.
      # Run 25419353305 (sha e9f03ab9) was the last to confirm this race
      # under the previous parallel layout.
      #
      # Sequential layout: download → tar → run each validator one at a time
      # and emit a per-gate ✅/❌ row. Adds ~10-15s wall vs parallel but is
      # deterministic, easier to reason about, and avoids the race entirely.
      # Artifact download keyed on `deploy_run_id` (the BUILD run that produced
      # them). When the caller IS that run (deploy_run_id == github.run_id) this
      # is a same-run read; when the caller is deploy-publish.yml (workflow_run),
      # the same `run-id` + token fetches them cross-run from the build run.
      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: /tmp/github-pages-artifact
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pre-deploy sitemap snapshot (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true   # snapshot is optional — IndexNow diff falls back gracefully
        with:
          name: pre-deploy-snapshot-${{ inputs.deploy_run_id }}
          path: /tmp/pre-deploy-snapshot
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download master jobs.json
        uses: actions/download-artifact@v7
        with:
          name: jobs-master-${{ inputs.deploy_run_id }}
          path: /tmp/jobs-master
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous-slug winners (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch/call inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          mkdir -p /tmp/winners
          if gh run download "$INPUT_DEPLOY_RUN_ID" \
               --name "winners-$INPUT_DEPLOY_RUN_ID" \
               --dir /tmp/winners 2>/dev/null; then
            echo "[winners] downloaded artifact for run $INPUT_DEPLOY_RUN_ID"
          else
            echo "[winners] artifact not present (file unchanged this build) — skipping"
          fi

      - name: Extract dist/ + restore data files from artifact
        run: |
          # Pages artifact wraps a single artifact.tar — extract into dist/.
          rm -rf dist && mkdir -p dist
          tar -xf /tmp/github-pages-artifact/artifact.tar -C dist

          # Restore master data/jobs.json from the dedicated artifact
          # (jobsJsonDistCleanupPlugin strips it from dist/ to clear the
          # 10 GB GH Pages cap — validators still need the master copy
          # with titleByLocale / descriptionByLocale).
          mkdir -p data
          cp -f /tmp/jobs-master/jobs.json data/jobs.json
          # Expose jobs.json to scripts that expect public/data/jobs.json.
          mkdir -p public/data
          cp -f data/jobs.json public/data/jobs.json
          # validate:crawler-summaries reads data/jobs-crawler-summaries.json
          # (gitignored, assembled at build). Its dist/data/ copy is offloaded
          # to the CDN repo AND deleted from dist by offload-generated-images-
          # cdn.mjs (PR #1288), so it is NOT in the Pages artifact — restore it
          # from the jobs-master artifact (same channel as jobs.json above).
          cp -f /tmp/jobs-master/jobs-crawler-summaries.json data/jobs-crawler-summaries.json

          # Optional artifacts — copy if present.
          if [ -f /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json ]; then
            cp /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json /tmp/pre-deploy-sitemap-urls.json
          fi
          if [ -f /tmp/winners/previous-slug-winners.json ]; then
            cp /tmp/winners/previous-slug-winners.json data/previous-slug-winners.json
          fi

      # Same merged locale+section rehydrate as validate-dist-source (see that
      # job's step for the full rationale + the shared scripts). Each of the
      # jobs still runs its own copy of this step on its own fresh runner —
      # it's the bash body that's shared now, not the step itself — since
      # the post-build audits below walk the same logical site as the source
      # validators do and each job needs its own dist/ rehydrated.
      # NO cross-job shard clone cache here — REMOVED deliberately, issue
      # #5441 (follow-up of #5432 point 6d). An actions/cache restore/save
      # pair keyed `shard-clone-cache-<run_id>-<job>-<attempt>` used to wrap
      # this step so that ONE of the three parallel validate-dist jobs would
      # pay the shard `git clone` fallback on behalf of all three. Measured,
      # it could not work, and re-adding it in that shape is a net loss:
      #   • It never hit, structurally — not by bad luck. The restore ran
      #     BEFORE the rehydrate and the save AFTER it, while the 3 jobs start
      #     within 7 s of each other (06:50:17/18/24 on run 31296098323) and
      #     the rehydrate takes 10-25 min: at attempt 1 every job restores
      #     before any job has saved. Across 7 runs / 20 entries,
      #     `lastAccessedAt == createdAt` on ALL of them — GitHub stamps that
      #     field on restore, so not one entry was ever read.
      #   • Even a 100% hit rate would save 0 s of wall clock. The cache
      #     branch in scripts/lib/rehydrate-section-shards.sh shortcuts only
      #     the `git clone` FALLBACK, never the tar-artifact fast path. On run
      #     31296098323 just 11 of ~90 shards fell back, and all 11 finished
      #     303-326 s BEFORE the step ended — the critical path is the
      #     ticino/svizzera tar extraction, which this cache cannot touch by
      #     construction. The clones sit entirely in its shadow.
      #   • It cost real time and real quota. `Save` measured 70/70/59 s on
      #     that run's 3 jobs (199 s per run) and it lands ON the critical
      #     path, because restore and save are serial steps while the clones
      #     are not. Entries ran 150-210 MB each: 4.34 GB of a 10 GB repo
      #     cache that stood at 10.68 GB — over quota, evicting LRU — so
      #     never-read entries were displacing caches that ARE read (32 of the
      #     47 non-shard entries had been restored at least once).
      # Bringing it back needs all three of: (1) a key that survives the run
      # — and therefore an invalidation bound to the SHARD's head commit,
      # never to wall-clock age, because serving a stale shard is exactly the
      # failure class of #5432 point 1, a gate that measures old bytes and
      # reports a number which does not describe production; (2) a
      # demonstrated win on the CRITICAL path, i.e. it must shortcut the tar
      # fast path too, since shortcutting the 11 clone-fallback shards
      # provably buys nothing; (3) a size budget against the 10 GB cap.
      # The MECHANISM is not deleted: SHARD_CLONE_CACHE_DIR still works in the
      # rehydrate scripts and is still used by
      # scripts/ci/revalidate-dist-locally.sh, where the cache dir lives in a
      # per-deploy-run WORKDIR on one machine and repeated local runs really
      # do reuse it, at no upload cost. Only the CI wiring that could never
      # hit is gone.

      - name: Rehydrate locale then section shards into dist/ (when sharding active)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          LOCALE_SHARDS_LIVE: ${{ vars.LOCALE_SHARDS_LIVE }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: |
          bash scripts/lib/rehydrate-locale-shards.sh &
          LOCALE_PID=$!

          LOCALE_RC=0
          wait "$LOCALE_PID" || LOCALE_RC=$?

          bash scripts/lib/rehydrate-section-shards.sh

          if [ "$LOCALE_RC" -ne 0 ]; then
            exit "$LOCALE_RC"
          fi

      # Precondition for every dist-walking audit/validator in this job. The
      # section rehydrate above is soft-fail BY CONTRACT (it warns and degrades
      # rather than aborting), so a shard repo that clones empty leaves dist/
      # missing an entire subtree — and from there every audit reports the
      # absent pages as unreachable / thin / orphan content OF THE SITE, not as
      # a hole in its own input. Issue #4857 is that verdict in its purest form:
      # an audit replay that never rehydrated at all called ~68k reachable
      # cluster URLs an entire content tier below crawl depth. Stop here, with
      # the reason named, instead of shipping a fabricated structural finding.
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs
      - name: Migrate all-known-job-slugs to canton-aware paths
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      # BFS chain — full dist-tree link-graph walkers, kept serialized WITH
      # EACH OTHER (both crashed rc=134 "Reached heap limit" sharing a
      # smaller cap 4-way in the old light pool at production scale — see
      # validate-dist-postbuild's DIST_MULTI_PID comment for that incident
      # history), but now on their OWN runner so they run CONCURRENTLY with
      # validate-dist-postbuild's audit:all instead of after it.
      - name: BFS-depth + orphan-sitemap-pages audits (serial chain)
        env:
          AUDIT_STRICT: '1'
        run: |
          : > /tmp/post-build-timings.txt
          : > /tmp/post-build-failures.txt
          set +e
          for chain_step in \
            "audit:max-bfs-depth|/tmp/g19.log|NODE_OPTIONS='--max-old-space-size=8192' npm run audit:max-bfs-depth -- --json" \
            "audit:orphan-sitemap-pages|/tmp/g9.log|NODE_OPTIONS='--max-old-space-size=8192' npm run audit:orphan-sitemap-pages -- --gate=baseline" \
          ; do
            IFS='|' read -r step_name step_log step_cmd <<<"$chain_step"
            start=$(date +%s.%N)
            eval "$step_cmd" > "$step_log" 2>&1
            rc=$?
            end=$(date +%s.%N)
            awk -v n="$step_name" "BEGIN{printf \"%-40s %7.2f rc=%d\n\", n, $end-$start, $rc}" \
              >> /tmp/post-build-timings.txt
            if [ $rc -ne 0 ]; then
              echo "$step_name $step_log" >> /tmp/post-build-failures.txt
            fi
          done

          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "BFS-chain gates — per-gate results"
          echo "══════════════════════════════════════════════════════════════════════"
          PB_PASS=0
          PB_FAIL=0
          while IFS= read -r line; do
            rc=$(printf '%s' "$line" | { grep -oE 'rc=[0-9]+$' || true; } | sed 's/rc=//')
            if [ "$rc" = "0" ]; then
              printf "✅ PASS  %s\n" "$line"
              PB_PASS=$((PB_PASS + 1))
            else
              printf "❌ FAIL  %s\n" "$line"
              PB_FAIL=$((PB_FAIL + 1))
            fi
          done < <(sort -k2 -gr /tmp/post-build-timings.txt)
          echo "──────────────────────────────────────────────────────────────────────"
          echo "BFS-chain summary: ${PB_PASS} passed, ${PB_FAIL} failed"
          echo "══════════════════════════════════════════════════════════════════════"
          echo ""

          FAIL=0
          if [ -s /tmp/post-build-failures.txt ]; then
            while read -r name logfile; do
              echo "::error::$name failed"
              cat "$logfile"
              FAIL=1
            done < /tmp/post-build-failures.txt
          fi

          [ $FAIL -eq 0 ] || exit 1
          echo "✅ BFS-depth + orphan-sitemap-pages audits passed"

      # Per-gate verdict for the integrity classifier — see the identical
      # step in validate-dist-postbuild for the rationale.
      - name: Publish gate results
        id: gate-results
        if: always()
        run: |
          if [ -s /tmp/post-build-timings.txt ]; then
            printf 'failed_gates=%s\n' \
              "$(awk '!/rc=0$/ {printf "%s%s", sep, $1; sep=","}' /tmp/post-build-timings.txt)" \
              >> "$GITHUB_OUTPUT"
          else
            echo 'failed_gates=__UNKNOWN__' >> "$GITHUB_OUTPUT"
          fi

      # Moved from validate-dist-postbuild — depends on /tmp/g19.log, which
      # now only exists in THIS job. See that job's copy of this step
      # (removed) for the full rationale; unchanged otherwise.
      - name: Dump bfs-depth baseline candidate (informational)
        if: always()
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "bfs-depth baseline candidate (current dist counts)"
          echo "══════════════════════════════════════════════════════════════"
          echo "Paste this into data/bfs-depth-baseline.json to ratchet down"
          echo "the gate after a deliberate improvement. Counts must only"
          echo "ever DECREASE — this gate is a ratchet."
          echo "──────────────────────────────────────────────────────────────"
          if [ -f /tmp/g19.log ] && grep -q '^{$' /tmp/g19.log; then
            sed -n '/^{$/,/^}$/p' /tmp/g19.log
          else
            echo "(bfs gate JSON not found in /tmp/g19.log — gate may have crashed before emit)"
          fi
          echo "══════════════════════════════════════════════════════════════"

      - name: Upload audit reports + sitemaps on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-bfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/audit-reports/**
            dist/sitemap.xml
            dist/sitemap-*.xml
          if-no-files-found: ignore
          retention-days: 7

  validate-dist-report:
    # Centralizes the GitHub Issues bookkeeping so the three independent jobs
    # above can't race each other into a wrong state — e.g. postbuild
    # succeeding and resolving the tracking issue while source is still
    # failing (or vice versa). `if: always()` so this still runs (and
    # correctly reports failure) even if one of the jobs above failed
    # or was itself skipped by an upstream `if:` — only an actual cancel of
    # ALL THREE jobs leaves neither branch below matching, mirroring the
    # original single-job behavior where `if: failure()` / `if: success()`
    # steps don't fire on a cancelled run either.
    needs: [validate-dist-source, validate-dist-postbuild, validate-dist-postbuild-bfs]
    if: always()
    runs-on: ubuntu-latest
    # Il download del log di un job stallato non ha timeout lato gh: senza
    # questo tetto il job resterebbe appeso al default (360 min) tenendo un
    # runner E ritardando `publish`, che ha needs su validate-dist.
    timeout-minutes: 15
    permissions:
      issues: write     # for github-issue-creator on validation failure (run 26592389280 surfaced "Resource not accessible by integration (createIssue)")
      actions: read     # jobs API + job logs per il reporter diagnostico (#5414): un blocco permissions esplicito AZZERA gli scope non elencati, quindi senza questa riga ogni gh api actions/... risponde 403 e il reporter degrada a muto
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Report failure to GitHub Issues
        if: needs.validate-dist-source.result == 'failure' || needs.validate-dist-postbuild.result == 'failure' || needs.validate-dist-postbuild-bfs.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dispatch/call inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          # deploy_ref = workflow_run.head_sha: il commit della BUILD. Prima
          # qui finiva github.sha, che per un run workflow_run è il commit del
          # default branch al momento del trigger, NON quello della build
          # (issue #5414): il reporter lo etichetta come Build SHA nel body.
          INPUT_DEPLOY_REF: ${{ inputs.deploy_ref }}
          INPUT_DEPLOY_EVENT: ${{ inputs.deploy_event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RESULT: ${{ needs.validate-dist-source.result }}
          POSTBUILD_RESULT: ${{ needs.validate-dist-postbuild.result }}
          BFS_RESULT: ${{ needs.validate-dist-postbuild-bfs.result }}
        run: |
          # Reporter diagnostico (#5414 Parte B): legge i job falliti e i loro
          # log via jobs API e apre UNA issue per gate fallito (titolo stabile
          # "Validation Failure (dist): <gate>", max 3; oltre, o senza righe
          # gate riconoscibili, la issue riassuntiva legacy "…: post-deploy").
          # Dedup/reopen invariati: titoli stabili senza run-number (#5121),
          # reopen-within-hours 6 per il flap rosso→verde→rosso
          # (#928/#931/#937/#941). Il run-number resta nel body.
          # Il job fa checkout al SHA della BUILD (deploy_ref), che per un
          # deploy partito prima del merge di questa PR non contiene ancora il
          # reporter: senza questa guardia `node` fallirebbe con
          # ERR_MODULE_NOT_FOUND, continue-on-error lo inghiottirebbe e non si
          # aprirebbe NESSUNA issue — muto proprio nella finestra transitoria.
          # Fallback al reporter legacy, che esiste a qualunque SHA.
          # Il fallback passa `--build-sha "${INPUT_DEPLOY_REF}"` per la stessa
          # ragione del reporter diagnostico: senza, il guard anti-riapertura
          # non si attiva su questo ramo e la issue legacy si riapre su build
          # che precedono la propria fix. È lo STESSO valore che il body qui
          # sotto stampa come **Build SHA** — il commit della BUILD, non
          # l'head_sha della validazione. Se l'input `deploy_ref` è vuoto la
          # CLI riceve una stringa vuota e torna al reopen incondizionato,
          # che è il fail-safe voluto: mai astenersi su un dato assente.
          # (Qui e sopra l'input e' nominato senza prefisso di proposito:
          # check-workflow-input-injection.mjs conta i riferimenti a un input
          # su TUTTO il testo del run:, commenti compresi, e fallisce CLOSED su
          # quelli che non trova dentro un'espressione Actions che ha saputo
          # parsare. Non puo' distinguere la prosa da un'interpolazione sfuggita
          # al parser, e non deve: un commento non ferma un valore multiriga.)
          if [ -f scripts/ci/report-validate-dist-failure.mjs ]; then
            node scripts/ci/report-validate-dist-failure.mjs --mode report
          else
            echo "::warning::reporter diagnostico assente al SHA della build — fallback al reporter legacy"
            node scripts/lib/github-issue-creator.mjs \
              --title "Validation Failure (dist): post-deploy" \
              --description "## Validazione dist fallita
          **Validation run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          **Build run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${INPUT_DEPLOY_RUN_ID}
          **Build SHA:** ${INPUT_DEPLOY_REF}
          **Job results:** source=${SOURCE_RESULT} · postbuild=${POSTBUILD_RESULT} · bfs=${BFS_RESULT}" \
              --priority 1 \
              --reopen-within-hours 6 \
              --build-sha "${INPUT_DEPLOY_REF}" \
              --label Bug \
              --workflow "Post-deploy Validate Dist"
          fi

      - name: Resolve GitHub Issue on success
        if: needs.validate-dist-source.result == 'success' && needs.validate-dist-postbuild.result == 'success' && needs.validate-dist-postbuild-bfs.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Mirror of the failure reporter: all three gating jobs passed, so
          # close EVERY open "Validation Failure (dist): …" issue — the legacy
          # "post-deploy" title AND the per-gate ones the reporter above mints.
          # Without this the issues stay open while the state is already green
          # (stale-issue churn). Idempotent no-op when nothing is open; the
          # failure reporter's reopen-within-hours reopens them on a re-flap.
          # Stessa guardia del reporter: al SHA di una build pre-merge lo
          # script non esiste e la issue legacy resterebbe aperta sul verde.
          if [ -f scripts/ci/report-validate-dist-failure.mjs ]; then
            node scripts/ci/report-validate-dist-failure.mjs --mode resolve
          else
            echo "::warning::reporter diagnostico assente al SHA della build — resolve legacy"
            node scripts/lib/github-issue-creator.mjs \
              --resolve \
              --title "Validation Failure (dist): post-deploy" \
              --workflow "Post-deploy Validate Dist" \
              --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # integrity-verdict: does this run's red state invalidate the DEPLOY, or is
  # it a QUALITY defect on pages that are already live?
  #
  # The caller gates `publish` (IndexNow, Google Indexing API, GSC submit,
  # previous-slug-winners) on this output instead of on this workflow's
  # overall result. Rationale and the classification list live in
  # scripts/ci/classify-validate-dist-failures.mjs — default-deny: anything
  # not explicitly listed as a quality gate blocks.
  #
  # This job SHOULD stay green, and the script always exits 0 so the verdict
  # travels as an output rather than as an exit code.
  #
  # CORRECTED (#4828, measured — this line used to read "a failed job's outputs
  # do not cross the reusable-workflow boundary", which is FALSE and was the
  # stated justification for the whole design). Probe run 31081857672: a job
  # that wrote an output and THEN exited 1 (conclusion `failure`) still
  # delivered that output to the caller through the reusable-workflow boundary.
  # Probe run 31081032808: a reusable workflow whose OVERALL conclusion is
  # `failure` still delivers outputs set by a green job.
  #
  # What actually loses the value is narrower and more mundane: a step that
  # never runs, or dies BEFORE writing to $GITHUB_OUTPUT, writes nothing —
  # then `integrity_ok` is empty and the caller reads it as "not true". That
  # is the safe direction, but it makes a quality-only failure
  # indistinguishable from an infra failure, so the step below writes an
  # explicit fail-closed verdict even when the classifier cannot run.
  #
  # It does NOT make anything green: the three gate jobs keep their own
  # results, this workflow still reports FAILURE to the caller, and
  # validate-dist-report still opens the tracking issue (AGENTS.md
  # non-negotiables #1 and #2 — no threshold widened, no error downgraded).
  # ─────────────────────────────────────────────────────────────────────────
  integrity-verdict:
    needs: [validate-dist-source, validate-dist-postbuild, validate-dist-postbuild-bfs]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      integrity_ok: ${{ steps.verdict.outputs.integrity_ok }}
      blocking_gates: ${{ steps.verdict.outputs.blocking_gates }}
      quality_gates: ${{ steps.verdict.outputs.quality_gates }}
    steps:
      # NOT pinned to `deploy_ref`, unlike every other job in this file.
      #
      # The gate jobs check out the BUILD's SHA so the validator scripts match
      # the code that produced dist/. This job validates nothing about dist/ —
      # it maps gate NAMES emitted by THIS workflow definition onto a
      # classification table. That table therefore has to come from the same
      # commit as this workflow file, not from whatever the build happened to
      # be built from.
      #
      # Pinning it to deploy_ref broke production on run 31055982487
      # (2026-08-05T23:20): the build predated the merge of #5179, so the
      # checked-out tree had no scripts/ci/classify-validate-dist-failures.mjs,
      # node exited MODULE_NOT_FOUND, the step died BEFORE writing anything to
      # $GITHUB_OUTPUT, and `integrity_ok` reached the caller EMPTY — so
      # `publish` was sequestered with no verdict recorded anywhere. (Not
      # because the job was red: a failed job's outputs do cross the boundary,
      # probe run 31081857672. The value was simply never written.)
      # Any future rename, move or crash of the classifier reproduces it.
      - name: Checkout (workflow ref — see comment)
        continue-on-error: true
        uses: actions/checkout@v5

      - name: Setup Node.js
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Classify gate failures
        id: verdict
        if: always()
        env:
          # A job that was cancelled or never ran contributes no gate names.
          # Its `result` is folded in below so "cancelled" cannot read as
          # "clean" — only `success` and `failure` carry a trustworthy list.
          SOURCE_RESULT: ${{ needs.validate-dist-source.result }}
          SOURCE_GATES: ${{ needs.validate-dist-source.outputs.failed_gates }}
          POSTBUILD_RESULT: ${{ needs.validate-dist-postbuild.result }}
          POSTBUILD_GATES: ${{ needs.validate-dist-postbuild.outputs.failed_gates }}
          BFS_RESULT: ${{ needs.validate-dist-postbuild-bfs.result }}
          BFS_GATES: ${{ needs.validate-dist-postbuild-bfs.outputs.failed_gates }}
        run: |
          set -euo pipefail
          FAILED=""
          # `if` form, not `[ -z "$1" ] && return 0`: under `set -e` that
          # compound returns 1 for a NON-empty arg and kills the step.
          add() { if [ -n "$1" ]; then FAILED="${FAILED:+$FAILED,}$1"; fi; }

          # For each gate job: a `failure` with no gate names means it died
          # outside the gate step (checkout, artifact download, rehydrate,
          # "Assert dist/ is the complete logical site"). That is a
          # dist-integrity failure, not a quality one — mark it unknown so
          # the classifier's default-deny blocks publish.
          for pair in "source:$SOURCE_RESULT:$SOURCE_GATES" \
                      "postbuild:$POSTBUILD_RESULT:$POSTBUILD_GATES" \
                      "bfs:$BFS_RESULT:$BFS_GATES"; do
            name="${pair%%:*}"; rest="${pair#*:}"
            result="${rest%%:*}"; gates="${rest#*:}"
            case "$result" in
              success) add "$gates" ;;
              failure) if [ -n "$gates" ]; then add "$gates"; else add "__UNKNOWN__:$name"; fi ;;
              *)       add "__UNKNOWN__:$name" ;;   # cancelled / skipped
            esac
          done

          echo "collected failed gates: ${FAILED:-(none)}"

          # The classifier always exits 0 and carries its verdict in
          # $GITHUB_OUTPUT. If it cannot run AT ALL — file missing, syntax
          # error, node crash, checkout above skipped — nothing is written and
          # `integrity_ok` reaches the caller EMPTY (run 31055982487). Emit the
          # fail-closed verdict ourselves in that case, so `publish` is blocked
          # by a value the caller can SEE and the step summary can explain,
          # instead of by an empty string nobody can attribute. This is the
          # part that actually matters: the loss comes from never writing the
          # value, not from the job's colour.
          if ! node scripts/ci/classify-validate-dist-failures.mjs --failed "$FAILED"; then
            echo "::error::integrity classifier could not run — failing closed (integrity_ok=false)"
            {
              echo "integrity_ok=false"
              echo "blocking_gates=__CLASSIFIER_UNAVAILABLE__"
              echo "quality_gates="
            } >> "$GITHUB_OUTPUT"
          fi

          # Exit 0 so the verdict is unambiguous and the summary step below
          # renders (see the corrected block comment above the job — a red job
          # would NOT by itself lose the output).
          # It asserts nothing about dist/ — the three gate jobs keep their own
          # results, validate-dist still reports FAILURE, and
          # validate-dist-report still opens the tracking issue. Nothing is
          # downgraded here (AGENTS.md non-negotiables #1, #2); the verdict is
          # the output, never the exit code.
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### validate-dist integrity verdict"
            echo ""
            echo "- \`integrity_ok\`: **${{ steps.verdict.outputs.integrity_ok }}**"
            echo "- blocking gates: \`${{ steps.verdict.outputs.blocking_gates || '(none)' }}\`"
            echo "- quality gates: \`${{ steps.verdict.outputs.quality_gates || '(none)' }}\`"
            echo ""
            echo "\`publish\` (IndexNow / Indexing API / GSC) runs when this is \`true\` AND"
            echo "\`deploy\` + \`validate-live\` are green. A quality gate staying red still"
            echo "fails this workflow and still opens the tracking issue."
          } >> "$GITHUB_STEP_SUMMARY"
