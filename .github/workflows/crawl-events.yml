name: Crawl Ticino + nationwide + Genève pilot events (tio.ch, guidle, myswitzerland, geneve.ch)

# Refreshes the events dataset (issue #2963, extended nationwide by #3125,
# extended with a second non-TI canton pilot by #3644).
# Four quota-free crawlers (plain fetch + jsdom, no API key, no Claude):
# tio.ch agenda (Ticino only), guidle.com and myswitzerland.com (all of
# Switzerland), and geneve.ch/agenda (GE — pilot canton validating the
# reusable createAgendaCrawler factory, scripts/lib/agenda-crawler-factory.mjs).
# Cantonal agendas on the same factory (P9a, 2026-10-05): fr.ch (FR, event RSS)
# and the iCMS agendas nw.ch (NW), ow.ch (OW), stadtluzern.ch (LU) — one
# isolated step each, surfaced after publication like the GE pilot.
# Each writes its own per-source slice
# (data/events/by-source/<key>.json); scripts/assemble-events-dataset.mjs
# merges them (by-id, then a cross-source fuzzy dedup pass) into
# data/events.json. Publishes data/events.json + every per-source slice + the
# mirrored-image INDEX (data/events-image-manifest.json — the images
# themselves are pushed to the CDN by this job and are NOT tracked since
# #6163) through a stable PR; the events test runs BEFORE publication
# as a gate so a malformed dataset can never turn main red.
#
# NOTE: named crawl-events.yml (NOT update-jobs-*.yml) on purpose, so the jobs
# orchestrator/health-monitor never sweeps it into the jobs pipeline.

on:
  schedule:
    # Once daily at 05:40 UTC — free minute slot (jobs :05–:55, articles :22,
    # article-gen :07/:37, weather :23 are all taken).
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days horizon to crawl'
        required: false
        default: '21'
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean
      myswitzerland_ids:
        description: 'Comma-separated MySwitzerland IDs to revisit; empty runs all sources normally.'
        required: false
        default: ''
        type: string
      guidle_ids:
        description: 'Comma-separated Guidle codes to revisit; mutually exclusive with myswitzerland_ids.'
        required: false
        default: ''
        type: string
concurrency:
  group: crawl-events
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  crawl-events:
    runs-on: ubuntu-latest
    # 12 min was enough for the single TI-only tio-agenda crawl before
    # #3415's in-crawler geo/translation enrichment. That enrichment's
    # one-time backlog pass (every pre-existing event needs geocoding +
    # EN/DE/FR translation the first time it runs) measured at 30min08s
    # alone (run 28683305065, 2026-07-03) — it ate the entire 35min budget
    # and got the whole job cancelled before guidle/myswitzerland/assemble/
    # commit ever ran. Once the geo/translation caches
    # (data/events-geocode-cache.json, data/events-translation-cache.json —
    # see the "Persist geo/translation caches" step below) are populated,
    # only that day's genuinely new events need enrichment and tio-agenda
    # should return close to its 12min baseline. Run 36029589003 consumed
    # ~56min before the GE pilot started, so 60min cancelled before
    # assemble/commit. Run 36707880973 then reached the 90min cap while the
    # final dataset push was retrying (#10544); keep headroom for the full
    # crawl, publication gate, and the main-writer convoy.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Prepare Firebase credentials for push auth
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load refresh-PR credentials"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          test -f scripts/load-rc-env.mjs
          node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # A stable PR branch can still be in flight when the next daily run
      # starts. Carry its append-only data forward before crawling, otherwise
      # a new branch from main would silently discard the pending refresh.
      - name: Carry forward pending events refresh PR
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          # actions/checkout uses persist-credentials=false in this workflow;
          # probe and fetch the stable branch through the same authenticated
          # refresh identity used by the publisher below.
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          branch='chore/crawl-events-refresh'
          [ -n "$GH_TOKEN" ] || {
            echo "::error::No authenticated refresh token is available to probe the stable events refresh branch"
            exit 1
          }
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          probe="$RUNNER_TEMP/crawl-events-refresh-remote-head"
          if ! git ls-remote "$remote_url" "refs/heads/${branch}" >"$probe" 2>/dev/null; then
            echo "::error::Unable to authenticate or probe the stable events refresh branch"
            exit 1
          fi
          if [ ! -s "$probe" ]; then
            echo "No in-flight events refresh PR branch found."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 "$remote_url" \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" \
            >/dev/null 2>&1; then
            echo "::error::Unable to fetch the stable events refresh branch"
            exit 1
          fi
          for path in \
            data/events.json \
            public/data/events.json \
            data/events-geocode-cache.json \
            data/events-translation-cache.json \
            data/events-image-manifest.json \
            data/events/by-source/ \
            data/events/checkpoints/; do
            if git cat-file -e "refs/remotes/origin/${branch}:${path}" 2>/dev/null; then
              git restore --source="refs/remotes/origin/${branch}" -- "$path"
            fi
          done

      - name: Validate targeted source inputs
        env:
          INPUT_MYSWITZERLAND_IDS: ${{ inputs.myswitzerland_ids || '' }}
          INPUT_GUIDLE_IDS: ${{ inputs.guidle_ids || '' }}
        run: |
          if [ -n "$INPUT_MYSWITZERLAND_IDS" ] && [ -n "$INPUT_GUIDLE_IDS" ]; then
            echo '::error::Select only one targeted source per run.'
            exit 1
          fi

      - name: Crawl tio.ch agenda
        id: crawl-tio
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DAYS: ${{ github.event.inputs.days || '21' }}
        run: node scripts/crawl-tio-agenda.mjs --days "$INPUT_DAYS"

      - name: Persist geo/translation caches (survives downstream failures)
        id: persist-caches
        # scripts/crawl-tio-agenda.mjs writes data/events-geocode-cache.json
        # + data/events-translation-cache.json to disk once tio-agenda
        # finishes, but the main "Commit dataset" step below only runs if
        # guidle/myswitzerland/assemble/gate ALL also succeed. Without this
        # step, a downstream failure or job timeout (run 28683305065,
        # 2026-07-03) throws away the whole enrichment backlog and every
        # future run redoes it from scratch. if: always() so it still fires
        # even if a later step gets cancelled by timeout-minutes.
        if: always() && !inputs.myswitzerland_ids && !inputs.guidle_ids && inputs.dry_run != true && inputs.dry_run != 'true'
        # Best effort: a temporary PR-publisher failure must not skip the
        # remaining crawlers and the final dataset publication.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          [ -f data/events-geocode-cache.json ] || exit 0
          [ -f data/events-translation-cache.json ] || exit 0
          body="$RUNNER_TEMP/crawl-events-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il crawler aggiorna le cache geo/traduzioni tramite il branch stabile \`chore/crawl-events-refresh\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          - Nessun altro cambiamento applicativo in questa PR; il publisher limita il commit ai dati generati dal crawler.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --reconcile-main \
            --path data/events-geocode-cache.json \
            --path data/events-translation-cache.json \
            --branch chore/crawl-events-refresh \
            --commit-message "chore(events): persist crawl caches" \
            --title "chore(data): refresh crawl events" \
            --body-file "$body"

      - name: Crawl guidle.com (nationwide)
        id: crawl-guidle
        if: ${{ !inputs.myswitzerland_ids }}
        env:
          INPUT_GUIDLE_IDS: ${{ inputs.guidle_ids || '' }}
        run: |
          args=()
          if [ -n "$INPUT_GUIDLE_IDS" ]; then
            args+=(--ids "$INPUT_GUIDLE_IDS")
          fi
          node scripts/crawl-guidle-events.mjs "${args[@]}"

      - name: Crawl myswitzerland.com (nationwide)
        id: crawl-myswitzerland
        if: ${{ !inputs.guidle_ids }}
        # continue-on-error: one source must not freeze the whole dataset.
        # From 2026-10-04 the www.myswitzerland.com CDN answers HTTP 406 to
        # every uncached detail page; the fail-closed detail-failure policy
        # (scripts/lib/detail-failure-reuse-policy.mjs, 15%, unchanged) then
        # rejects the batch and the crawler exits 1 BEFORE writing its slice or
        # advancing its cursor (commitMySwitzerlandBatch). Without this line
        # that rejection skipped geneve, assemble, gate and publish for every
        # other source too. The failure is NOT swallowed: "Surface
        # MySwitzerland crawl failures" below fails the job after publication
        # so "Report failure to GitHub Issues" still fires. Same pattern as the
        # GE pilot step.
        continue-on-error: true
        env:
          INPUT_MYSWITZERLAND_IDS: ${{ inputs.myswitzerland_ids || '' }}
        run: |
          args=()
          if [ -n "$INPUT_MYSWITZERLAND_IDS" ]; then
            args+=(--ids "$INPUT_MYSWITZERLAND_IDS")
          fi
          node scripts/crawl-myswitzerland-events.mjs "${args[@]}"

      - name: Crawl geneve.ch agenda (GE, pilot)
        id: crawl-ge
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        # continue-on-error: geneve.ch is the newest, least battle-tested of
        # the four sources (own DOM-drift guard exists specifically because
        # selector drift is plausible on a brand-new source) and sits
        # upstream of Assemble/Gate/Commit. Without this, a GE-only failure
        # would cascade and skip that day's commit for tio/guidle/
        # myswitzerland too, even though they crawled fine — the exact
        # failure class the "Persist geo/translation caches" step above
        # already exists to hedge against for tio-agenda's own caches.
        continue-on-error: true
        run: node scripts/crawl-ge-agenda.mjs

      # OpenAgenda API v2 (Ville de Genève, communes genevoises, Région de
      # Nyon), Licence Ouverte 2.0. The public key OPENAGENDA_PUBLIC_KEY comes
      # from Remote Config, loaded above only in real runs: without it (dry_run
      # dispatches, or before the owner creates the key) the crawler prints a
      # ::notice:: and exits 0 without touching its slice. Runs next to the
      # geneve.ch HTML pilot above; assemble keeps the OpenAgenda record of a
      # duplicate pair (SUPERSEDED_EVENT_SOURCES). Same isolation contract as
      # the GE pilot, with its own "Surface …" twin below.
      - name: Crawl OpenAgenda (GE/VD)
        id: crawl-openagenda
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        continue-on-error: true
        run: node scripts/crawl-openagenda-events.mjs

      # Cantonal agendas (P9a). Same isolation contract as the GE pilot: a
      # failing source never blocks assemble/gate/publish for the others, and
      # its "Surface …" twin below fails the job after publication.
      - name: Crawl fr.ch agenda (FR)
        id: crawl-fr
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        continue-on-error: true
        run: node scripts/crawl-fr-agenda.mjs

      - name: Crawl nw.ch agenda (NW)
        id: crawl-nw
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        continue-on-error: true
        run: node scripts/crawl-icms-agenda.mjs --source nw-agenda

      - name: Crawl ow.ch agenda (OW)
        id: crawl-ow
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        continue-on-error: true
        run: node scripts/crawl-icms-agenda.mjs --source ow-agenda

      - name: Crawl stadtluzern.ch agenda (LU)
        id: crawl-lu
        if: ${{ !inputs.myswitzerland_ids && !inputs.guidle_ids }}
        continue-on-error: true
        run: node scripts/crawl-icms-agenda.mjs --source lu-stadt-agenda

      - name: Persist nationwide checkpoints + slices (survives downstream failures)
        id: persist-nationwide
        # The "Persist geo/translation caches" step above runs BEFORE guidle and
        # myswitzerland, so it only ever covered tio-agenda. Everything the two
        # nationwide crawlers produce — their checkpoint cursors, their by-source
        # slices, and their additions to the shared translation cache — was
        # committed nowhere but "Commit dataset" at the very end, which requires
        # assemble AND the vitest gate to pass first.
        #
        # That is how a month of work was lost: from 2026-07-07 the job was
        # killed by timeout-minutes before the commit step, so saveCursor() never
        # reached git and myswitzerland restarted from checkpoint index 1331
        # every single day, re-crawling the same 320 of 21314 records and
        # discarding them. The translation budget added alongside this step stops
        # the timeout; this step makes sure the next stall costs one run's
        # progress instead of all of it.
        #
        # if: always() and continue-on-error for the same reasons as the caches
        # step above — this is a progress ratchet, not the deliverable, and it
        # must never skip-cascade assemble/gate/commit.
        if: always() && inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/crawl-events-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il crawler aggiorna checkpoint e slice nationwide tramite il branch stabile \`chore/crawl-events-refresh\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          - Nessun altro cambiamento applicativo in questa PR; il publisher limita il commit ai dati generati dal crawler.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --reconcile-main \
            --path data/events/checkpoints/ \
            --path data/events/by-source/guidle.json \
            --path data/events/by-source/myswitzerland.json \
            --path data/events-translation-cache.json \
            --path data/events-geocode-cache.json \
            --branch chore/crawl-events-refresh \
            --commit-message "chore(events): persist nationwide crawl progress" \
            --title "chore(data): refresh crawl events" \
            --body-file "$body"

      - name: Assemble events dataset
        id: assemble
        run: node scripts/assemble-events-dataset.mjs --stats

      - name: Refresh weekend-digest article body (evergreen, body-only)
        id: digest
        # Rewrites the 4 blog-body files of the stable `eventi-weekend-ticino`
        # article with the current weekend's events (no re-registration, no RSS
        # churn). Soft-fail: a refresh hiccup must never block the events commit.
        # DISABLED AT CUTOVER (#4974 item 3, §5.7): the digest now runs in
        # nanakokyobashi-rgb/frontaliere-articles, which fetches the dataset the
        # steps above publish. Everything ELSE in this workflow stays — the
        # crawling is a site data pipeline (§0.2), and nanako now DEPENDS on it
        # continuing to write public/data/events.json.
        run: echo "digest refresh moved to the articles repo — see refresh-events-digest.yml there"

      - name: Gate — events dataset + refreshed body must keep the suite green
        id: gate
        run: npx vitest run tests/events-pipeline.test.ts tests/blog-body-typescript-syntax.test.ts

      # ── The mirrored images now live on the CDN, not in git (#6163) ────────
      #
      # public/images/events used to be COMMITTED: 5'568 files, 4'108 MB, 59%
      # of the whole tracked tree, and the deploy pushed them to R2 from that
      # git-tracked copy (deploy-it-pages-prep.sh step_push_cdn, which no
      # longer lists `events` for exactly this reason). Untracking them left
      # the push without a source, because a deploy checkout and a crawl run
      # are different runs on different runners — the bytes only ever exist
      # here, in the run that downloaded them. So this job pushes them.
      #
      # ORDER MATTERS AND ONLY GOES ONE WAY: upload here, commit the manifest
      # in the NEXT step. mirrorEventImage records each image into
      # data/events-image-manifest.json the moment it writes it, so the
      # manifest on disk already claims images that are not on the CDN yet.
      # Committing it first would publish an index pointing at keys that 404;
      # a failed upload instead prunes its own entry (see the script) so the
      # committed manifest is always a subset of what actually landed.
      #
      # Deliberately NOT added to the two "survives downstream failures"
      # persist steps above: those run mid-crawl, before any upload. If a
      # timeout-minutes kill lands between mirroring and this step the manifest
      # is simply never committed and tomorrow re-mirrors those images — wasted
      # bandwidth, never a broken image. That is the safe direction of failure.
      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        # Non-fatal like every other caller: without R2_* the push script
        # reports the miss, prunes the manifest back and the images are
        # re-mirrored next run. Nothing is committed that claims otherwise.
        run: |
          if test -f scripts/load-rc-env.mjs; then
            node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
          else
            echo "⚠️ load-rc-env.mjs is absent in this checkout (non-fatal)"
          fi

      - name: Push this run's mirrored event images to the CDN
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/push-mirrored-event-images-cdn.mjs

      - name: Publish dataset refresh through PR
        id: commit
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        # The required Vitest check runs on the PR head before generated data
        # can enter main. The shared publisher also resolves article symlinks.
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/crawl-events-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il crawler pubblica dataset, slice, checkpoint, manifest e superfici articolo tramite il branch stabile \`chore/crawl-events-refresh\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          - Nessun altro cambiamento applicativo in questa PR; il publisher limita il commit ai dati generati dal crawler.
          EOF

          paths=(
            --path data/events.json
            --path public/data/events.json
            --path data/events/by-source/tio-agenda.json
            --path data/events/by-source/guidle.json
            --path data/events/by-source/myswitzerland.json
            --path services/locales/blog-body/it/eventi-weekend-ticino.ts
            --path services/locales/blog-body/en/eventi-weekend-ticino.ts
            --path services/locales/blog-body/de/eventi-weekend-ticino.ts
            --path services/locales/blog-body/fr/eventi-weekend-ticino.ts
            --path data/blog-articles-data.ts
            --path services/seo/seo-blog-5.ts
            --path public/sitemap-blog.xml
            --path data/events-image-manifest.json
            --path data/events/checkpoints/
          )
          for source in ge-agenda openagenda fr-agenda nw-agenda ow-agenda lu-stadt-agenda; do
            if [ -f "data/events/by-source/${source}.json" ]; then
              paths+=(--path "data/events/by-source/${source}.json")
            fi
          done
          bash scripts/lib/open-data-refresh-pr.sh \
            --reconcile-main \
            --resolve-symlinks \
            "${paths[@]}" \
            --branch chore/crawl-events-refresh \
            --commit-message "📅 Refresh Ticino + nationwide events agenda" \
            --title "chore(data): refresh crawl events" \
            --body-file "$body"

      - name: Surface GE pilot crawl failures (review nit — continue-on-error swallows the signal)
        # `continue-on-error: true` on "Crawl geneve.ch agenda" (added so a
        # GE-only failure never blocks that day's tio/guidle/myswitzerland
        # commit) has a side effect: it also stops a GE failure from ever
        # making the JOB fail, so "Report failure to GitHub Issues" below
        # (if: failure()) would never fire for it — the pilot source could
        # regress silently and indefinitely (the event archive is append-only,
        # so a source failure must not erase old URLs or hide a freshness gap).
        # This step runs after the commit either way (if: always()) and only
        # fails the job — deliberately, on purpose — to re-surface that one
        # step's own outcome, separate from the cascade gate above.
        if: always()
        run: |
          if [ "${{ steps.crawl-ge.outcome }}" = "failure" ]; then
            echo "::error::Crawl geneve.ch agenda (GE, pilot) failed this run — dataset commit still proceeded via continue-on-error, but this needs investigation."
            exit 1
          fi

      - name: Surface OpenAgenda crawl failures (continue-on-error must not hide them)
        # Twin of the GE pilot step above for "Crawl OpenAgenda (GE/VD)". A
        # missing key is a notice and exit 0, so it never lands here; a
        # rejected key, an unreachable API or a run with zero events does.
        if: always()
        run: |
          if [ "${{ steps.crawl-openagenda.outcome }}" = "failure" ]; then
            echo "::error::Crawl OpenAgenda (GE/VD) failed this run — previous openagenda slice kept, the other sources were published via continue-on-error; this needs investigation."
            exit 1
          fi

      - name: Surface MySwitzerland crawl failures (continue-on-error must not hide them)
        # Twin of the GE step above for "Crawl myswitzerland.com (nationwide)".
        # Runs after publication either way and fails the job when that step
        # failed, so the myswitzerland slice cannot age silently while the
        # rest of the dataset keeps publishing.
        if: always()
        run: |
          if [ "${{ steps.crawl-myswitzerland.outcome }}" = "failure" ]; then
            echo "::error::Crawl myswitzerland.com (nationwide) failed this run — previous myswitzerland slice and cursor kept, the other sources were published via continue-on-error; this needs investigation."
            exit 1
          fi

      - name: Surface cantonal agenda crawl failures (continue-on-error must not hide them)
        # Twin of the GE/MySwitzerland steps above for the P9a cantonal
        # agendas: runs after publication either way and fails the job when
        # any of them failed, naming which.
        if: always()
        run: |
          failed=""
          [ "${{ steps.crawl-fr.outcome }}" = "failure" ] && failed="$failed fr.ch"
          [ "${{ steps.crawl-nw.outcome }}" = "failure" ] && failed="$failed nw.ch"
          [ "${{ steps.crawl-ow.outcome }}" = "failure" ] && failed="$failed ow.ch"
          [ "${{ steps.crawl-lu.outcome }}" = "failure" ] && failed="$failed stadtluzern.ch"
          if [ -n "$failed" ]; then
            echo "::error::Cantonal agenda crawl failed this run:${failed} — previous slices kept, the other sources were published via continue-on-error; this needs investigation."
            exit 1
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `Workflow Failure: ${{ github.workflow }}` e non
          # `Crawler Failure: events pipeline (…)`. Due difetti in una riga sola
          # (#5437):
          #   - il nome nel titolo non era il `name:` del workflow, quindi
          #     `gh run list -w` non risolveva niente e la issue restava aperta
          #     per sempre pur avendo il prefisso giusto;
          #   - dopo il consolidamento dei crawler (2026-07) il prefisso
          #     `Crawler Failure:` significa «il gruppo 2 è `Run <slug>`, uno
          #     STEP dentro un crawler-group-*.yml». Questo non è un crawler di
          #     gruppo: tenere quel prefisso mandava il reconciler sul ramo
          #     sbagliato prima ancora del lookup.
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Crawler fallito
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}

          **Step outcomes:**
          - Crawl tio.ch agenda: ${{ steps.crawl-tio.outcome }}
          - Crawl guidle.com (nationwide): ${{ steps.crawl-guidle.outcome }}
          - Crawl myswitzerland.com (nationwide): ${{ steps.crawl-myswitzerland.outcome }}
          - Crawl geneve.ch agenda (GE, pilot): ${{ steps.crawl-ge.outcome }}
          - Crawl OpenAgenda (GE/VD): ${{ steps.crawl-openagenda.outcome }}
          - Crawl fr.ch agenda (FR): ${{ steps.crawl-fr.outcome }}
          - Crawl nw.ch agenda (NW): ${{ steps.crawl-nw.outcome }}
          - Crawl ow.ch agenda (OW): ${{ steps.crawl-ow.outcome }}
          - Crawl stadtluzern.ch agenda (LU): ${{ steps.crawl-lu.outcome }}
          - Assemble events dataset: ${{ steps.assemble.outcome }}
          - Refresh weekend-digest article: ${{ steps.digest.outcome }}
          - Gate (vitest): ${{ steps.gate.outcome }}
          - Commit dataset: ${{ steps.commit.outcome }}" \
            --label "crawler" \
            --workflow "${{ github.workflow }}" || true
