name: Crawl Ticino + nationwide events (tio.ch, guidle, myswitzerland)

# Refreshes the events dataset (issue #2963, extended nationwide by #3125).
# Three quota-free crawlers (plain fetch + jsdom, no API key, no Claude):
# tio.ch agenda (Ticino only) + guidle.com and myswitzerland.com (all of
# Switzerland). Each writes its own per-source slice
# (data/events/by-source/<key>.json); scripts/assemble-events-dataset.mjs
# merges them (by-id, then a cross-source fuzzy dedup pass) into
# data/events.json. Commits data/events.json + every per-source slice +
# mirrored event images straight to main; the events test runs BEFORE commit
# as a gate so a malformed dataset can never turn main red (AGENTS.md:
# "data-refresh che committa su main = stesso gate test di una PR").
#
# NOTE: named crawl-events.yml (NOT update-jobs-*.yml) on purpose, so the jobs
# orchestrator/health-monitor never sweeps it into the jobs pipeline.

on:
  schedule:
    # Once daily at 05:40 UTC — free minute slot (jobs :05–:55, articles :22,
    # article-gen :07/:37, weather :23 are all taken).
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days horizon to crawl'
        required: false
        default: '21'

concurrency:
  group: crawl-events
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  crawl-events:
    runs-on: ubuntu-latest
    # 12 min was enough for the single TI-only tio-agenda crawl before
    # #3415's in-crawler geo/translation enrichment. That enrichment's
    # one-time backlog pass (every pre-existing event needs geocoding +
    # EN/DE/FR translation the first time it runs) measured at 30min08s
    # alone (run 28683305065, 2026-07-03) — it ate the entire 35min budget
    # and got the whole job cancelled before guidle/myswitzerland/assemble/
    # commit ever ran. Once the geo/translation caches
    # (data/events-geocode-cache.json, data/events-translation-cache.json —
    # see the "Persist geo/translation caches" step below) are populated,
    # only that day's genuinely new events need enrichment and tio-agenda
    # should return close to its 12min baseline. 60 min gives headroom for
    # today's one-time backlog plus nationwide guidle/myswitzerland, whose
    # real full-catalog duration is still not independently measured.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Crawl tio.ch agenda
        id: crawl-tio
        run: node scripts/crawl-tio-agenda.mjs --days "${{ github.event.inputs.days || '21' }}"

      - name: Persist geo/translation caches (survives downstream failures)
        id: persist-caches
        # scripts/crawl-tio-agenda.mjs writes data/events-geocode-cache.json
        # + data/events-translation-cache.json to disk once tio-agenda
        # finishes, but the main "Commit dataset" step below only runs if
        # guidle/myswitzerland/assemble/gate ALL also succeed. Without this
        # step, a downstream failure or job timeout (run 28683305065,
        # 2026-07-03) throws away the whole enrichment backlog and every
        # future run redoes it from scratch. if: always() so it still fires
        # even if a later step gets cancelled by timeout-minutes.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f data/events-geocode-cache.json ] || exit 0
          [ -f data/events-translation-cache.json ] || exit 0
          git add data/events-geocode-cache.json data/events-translation-cache.json
          if git diff --cached --quiet; then
            echo "No cache diff, skipping commit"
            exit 0
          fi

          git commit -m "🗺️ Persist tio-agenda geo/translation cache"
          bash scripts/ci/git-push-retry.sh

      - name: Crawl guidle.com (nationwide)
        id: crawl-guidle
        run: node scripts/crawl-guidle-events.mjs

      - name: Crawl myswitzerland.com (nationwide)
        id: crawl-myswitzerland
        run: node scripts/crawl-myswitzerland-events.mjs

      - name: Assemble events dataset
        id: assemble
        run: node scripts/assemble-events-dataset.mjs --stats

      - name: Refresh weekend-digest article body (evergreen, body-only)
        id: digest
        # Rewrites the 4 blog-body files of the stable `eventi-weekend-ticino`
        # article with the current weekend's events (no re-registration, no RSS
        # churn). Soft-fail: a refresh hiccup must never block the events commit.
        run: node scripts/generate-events-digest-article.mjs || echo "::warning::digest article refresh skipped"

      - name: Gate — events dataset + refreshed body must keep the suite green
        id: gate
        run: npx vitest run tests/events-pipeline.test.ts tests/blog-body-typescript-syntax.test.ts

      - name: Commit dataset (rebase-retry pattern)
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json \
            data/events/by-source/tio-agenda.json \
            data/events/by-source/guidle.json \
            data/events/by-source/myswitzerland.json \
            services/locales/blog-body/it/eventi-weekend-ticino.ts \
            services/locales/blog-body/en/eventi-weekend-ticino.ts \
            services/locales/blog-body/de/eventi-weekend-ticino.ts \
            services/locales/blog-body/fr/eventi-weekend-ticino.ts \
            data/blog-articles-data.ts services/seo/seo-blog-5.ts public/sitemap-blog.xml
          # No-hotlink mirrored event images (scripts/lib/events-utils.mjs
          # mirrorEventImage → public/images/events/): guarded, unlike the
          # slice files above, because the dir only exists once a crawler has
          # actually mirrored at least one image this run — `git add` on a
          # missing path errors under `set -e` and would abort the commit.
          [ -d public/images/events ] && git add public/images/events/ || true
          # Cross-run cursors for the checkpointed nationwide crawlers
          # (scripts/lib/crawl-checkpoint.mjs) — must persist between
          # scheduled runs so guidle/myswitzerland resume instead of
          # restarting the catalog walk from 0 every day.
          [ -d data/events/checkpoints ] && git add data/events/checkpoints/ || true
          if git diff --cached --quiet; then
            echo "No events diff, skipping commit"
            exit 0
          fi

          git commit -m "📅 Refresh Ticino + nationwide events agenda + weekend-digest article (tio.ch, guidle, myswitzerland)"
          bash scripts/ci/git-push-retry.sh

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Crawler Failure: events pipeline (tio.ch, guidle, myswitzerland)" \
            --description "## Crawler fallito
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}

          **Step outcomes:**
          - Crawl tio.ch agenda: ${{ steps.crawl-tio.outcome }}
          - Crawl guidle.com (nationwide): ${{ steps.crawl-guidle.outcome }}
          - Crawl myswitzerland.com (nationwide): ${{ steps.crawl-myswitzerland.outcome }}
          - Assemble events dataset: ${{ steps.assemble.outcome }}
          - Refresh weekend-digest article: ${{ steps.digest.outcome }}
          - Gate (vitest): ${{ steps.gate.outcome }}
          - Commit dataset: ${{ steps.commit.outcome }}" \
            --label "crawler" \
            --workflow "${{ github.workflow }}" || true
