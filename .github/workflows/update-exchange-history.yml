name: Update Exchange Rate History

on:
  schedule:
    - cron: '30 5 * * *'  # Daily at 05:30 UTC (07:30 CET) — after ECB publishes rates
  workflow_dispatch:

concurrency:
  group: exchange-history
  cancel-in-progress: true

permissions:
  # contents: write — the SSG-snapshot step below commits
  # data/exchange-rate-snapshot.json back to main (epic #4452).
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Alzato 5->8min: il Checkout da solo arriva gia' al 55% del vecchio cap
    # (vedi tetto sullo step sotto) — stesso sintomo di #5659 (Checkout che
    # mangia l'intero budget del job update-fuel-prices), qui prevenuto prima
    # che diventi un timeout osservato. Il job stesso, nel run piu' lento
    # campionato, ha gia' usato l'83% del vecchio cap (249s su 300s).
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (stesso bug class di #5659). 5min stanno sopra il
        # massimo osservato sui run sani (135-166s su 5 run) e sotto il nuovo
        # cap del job. NIENTE `filter: blob:none`: con `fetch-depth: 1`
        # (default) e' un peggioramento misurato (+125% su tests.yml, #5164).
        timeout-minutes: 5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret not set"
            exit 1
          fi

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Update exchange rate history
        run: node scripts/update-exchange-history.mjs

      # Refresh the committed SSG snapshot (epic #4452): the static
      # /cambio-franco-euro/ pages read data/exchange-rate-snapshot.json at
      # build time (never Firestore). The script SELF-VALIDATES its output
      # (plausibility band, series length, window integrity) and exits 1 on
      # any anomaly, so this bot-direct-to-main commit can never poison a
      # committed-snapshot invariant (AGENTS.md § Build And Test).
      # No explicit deploy trigger: the daily fuel-prices workflow (06:37 UTC,
      # one hour after this cron) commits + triggers the deploy that picks
      # this snapshot up.
      - name: Refresh SSG exchange snapshot
        run: node scripts/snapshot-exchange-history.mjs

      - name: Commit SSG snapshot (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rate-snapshot.json
          if git diff --cached --quiet; then
            echo "No exchange snapshot changes."
          else
            git commit -m "💱 Daily CHF/EUR SSG snapshot refresh"
            # Centralized rebase-retry helper handles concurrent pushes from
            # other workflows; the snapshot is a deterministic output of the
            # script, so re-run it before retrying.
            bash scripts/lib/git-push-with-retry.sh \
              --regenerate-cmd 'node scripts/snapshot-exchange-history.mjs && git add data/exchange-rate-snapshot.json'
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
