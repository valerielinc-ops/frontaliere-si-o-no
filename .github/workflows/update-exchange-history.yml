name: Update Exchange Rate History

on:
  schedule:
    - cron: '30 5 * * *'  # Daily at 05:30 UTC (07:30 CET) — after ECB publishes rates
  workflow_dispatch:

concurrency:
  group: exchange-history
  cancel-in-progress: true

permissions:
  # contents: write — the SSG-snapshot step below commits
  # data/exchange-rate-snapshot.json back to main (epic #4452).
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Il checkout generato resta pieno quando il profilo analizzato ricadrebbe
    # nella fascia lenta: il controllo locale è ~20s, contro 299s del profilo
    # sparse osservato nella run 37197962007.
    # The snapshot push hit the 8-minute cap after 6m26s of contention
    # retries (#10545); retain the Checkout guard but give the job push room.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (stesso bug class di #5659). 5min stanno sopra il
        # margine ampio sul checkout pieno misurato localmente. NIENTE
        # `filter: blob:none`: con `fetch-depth: 1` (default) e' un
        # peggioramento misurato quando la maggior parte dei blob serve.
        timeout-minutes: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret not set"
            exit 1
          fi

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Update exchange rate history
        run: node scripts/update-exchange-history.mjs

      # Refresh the committed SSG snapshot (epic #4452): the static
      # /cambio-franco-euro/ pages read data/exchange-rate-snapshot.json at
      # build time (never Firestore). The script SELF-VALIDATES its output
      # (plausibility band, series length, window integrity) and exits 1 on
      # any anomaly, so this PR can never propose a poisoned snapshot.
      # No explicit deploy trigger: the daily fuel-prices workflow (06:37 UTC,
      # one hour after this cron) commits + triggers the deploy that picks
      # this snapshot up.
      - name: Refresh SSG exchange snapshot
        run: node scripts/snapshot-exchange-history.mjs

      - name: Open PR for SSG snapshot (if changed)
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/exchange-rate-refresh-pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Auto-generated by [workflow run %s](%s).\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            cat <<'EOF'
          ## Implementato
          - Il refresh propone `data/exchange-rate-snapshot.json` tramite il branch stabile `chore/exchange-rate-snapshot`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — snapshot automatizzato, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/exchange-rate-snapshot.json \
            --branch chore/exchange-rate-snapshot \
            --commit-message "💱 Daily CHF/EUR SSG snapshot refresh" \
            --title "chore(data): refresh CHF/EUR SSG snapshot" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        id: report_failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Report failure without checkout (fallback)
        # Se il checkout/setup fallisce, lo script nel workspace non esiste.
        # Recupera solo il creator alla SHA della run: gh e Node sono già
        # disponibili sul runner, quindi il segnalatore non dipende dal repo.
        if: >-
          always() && !cancelled() && failure() &&
          steps.report_failure.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALARM_SHA: ${{ github.sha }}
          ALARM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          creator=scripts/lib/github-issue-creator.mjs
          if [ ! -s "$creator" ]; then
            creator="$RUNNER_TEMP/github-issue-creator.mjs"
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/lib/github-issue-creator.mjs?ref=${ALARM_SHA}" \
              > "$creator" || true
          fi
          if [ ! -s "$creator" ]; then
            echo "::error title=Exchange failure not reported::il creator delle issue non è leggibile né dal checkout né via API; apri a mano ${ALARM_RUN_URL}"
            exit 0
          fi
          node "$creator" \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "Il workflow è rosso ma il checkout non ha reso disponibile il reporter principale. Run: ${ALARM_RUN_URL}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}" \
            --run-url "${ALARM_RUN_URL}" \
            || echo "::error title=Exchange failure not reported::il creator è uscito non-zero; apri a mano ${ALARM_RUN_URL}"
