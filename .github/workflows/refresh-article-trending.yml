name: Refresh Article Trending

# Reads the `article_views` Firestore collection ONCE per day and commits the
# resulting `public/article-trending.json` snapshot through a PR. The SPA's
# components/community/BlogArticles.tsx reads the committed file instead of
# scanning ~1377 docs from the browser on every cache-miss visit.
# The PR is required because main's ruleset requires the vitest status check
# before accepting a write.
#
# Cost rationale: before this workflow, fetchTrendingArticles() in
# BlogArticles.tsx executed `getDocs(collection('article_views'))` from each
# unique browser session whenever the 1h localStorage cache missed. With
# `allow read: if true` rules and ~1377 docs growing, this was estimated at
# ~500k–5M Firestore reads/wk (correlated with blog SEO traffic).
# Daily cron drops that to ~7 server-side scans/wk, ~10k reads/wk total.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'  # 06:15 CET / 07:15 CEST — staggered after job-popularity

permissions:
  contents: write
  pull-requests: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: refresh-article-trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Fetch article trending from Firestore
        run: node scripts/fetch-article-trending.mjs

      - name: Open PR with trending snapshot
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/article-trending-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il refresh aggiorna \`public/article-trending.json\` tramite il branch stabile \`chore/refresh-article-trending\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.
          - Closes #10495

          ## Non implementato (ancora)
          Nessuno — aggiornamento dati automatizzato, senza residui.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path public/article-trending.json \
            --branch chore/refresh-article-trending \
            --commit-message "chore(data): refresh article trending snapshot" \
            --title "chore(data): refresh article trending snapshot" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh Article Trending" \
            --description "Article trending refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
