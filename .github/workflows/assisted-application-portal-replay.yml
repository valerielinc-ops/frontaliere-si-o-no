name: Assisted application portal replay

# Daily portal replay on main (decision of 2026-11-15: the replay is no longer a
# required PR check). Once a day, and on demand, the workflow replays the public
# portal listings of EVERY ATS family on a base commit and on the tip of main,
# and opens (or updates) one GitHub issue when a family regresses or cannot be
# measured. A green run closes that issue again. Nothing here reads a pull
# request: no PR waits for, or is repaired because of, this workflow.
#
# Base and head of the comparison.
#   head = `github.sha`: the tip of main on the schedule (a manual dispatch from
#          another ref replays that ref and never opens or closes the issue).
#   base = `inputs.base_sha` when given; otherwise the `headSha` of the latest
#          successful run of this workflow on main (schedule or dispatch, read
#          with `gh run list` over the last 14 days, `actions: read`); otherwise
#          the head itself (also when that run is older than 14 days). The
#          head-against-itself comparison has no code delta to blame: it checks
#          that the portals still behave the way the runner expects.
#
# Full matrix every day. The portals change without any commit, so the
# changed-path selection of the former PR gate does not apply. `detect` writes a
# one-line path list holding a shared runner path
# (`scripts/assisted-application/agent.mjs`), which the trusted CLI
# (`affectedPortalReplayFamilies`) already expands to the complete family set,
# and then runs the unchanged `detect` and `prepare` commands on it. No CLI
# option is needed, so the trusted CLI of any base commit (`inputs.base_sha`
# can be old) understands it; the test file pins that the path still expands to
# every family.
#
# The shared setup runs once per bounded group worker; the trusted base compare
# CLI runs the families inside each worker, like the crawler-group workflows,
# instead of creating a runner job for every family.
#
# Broker capacity (root cause of the all-red `portal_replay_timeout` reports,
# run 43593542762): every family replays base and head at the same time, so a
# family is two concurrent Codex callers, and the 75 s per-listing budget of the
# CLI also runs while a request waits in the broker queue. Starting all twelve
# families together put 22 callers behind a broker whose first request runs
# alone and which has two lanes: nothing but the first call finished in 75 s,
# every other listing was reported as unmeasured. The worker now (1) opens all
# six broker lanes, (2) warms the broker up with one tiny request, which opens
# the lanes and fails fast and by name if the Codex backend is not usable, and
# (3) never starts more families than lanes/2, so no request waits in a queue.
#
# Verdict and issue. `portal replay daily verdict` fails when a family is FAIL,
# unmeasured or missing. The issue job then opens or updates ONE issue (stable
# title, marker `<!-- portal-replay-daily -->`, label `portal-replay-daily`) with
# the run link, base..head, the failing families and their reason codes, and
# closes it when a later verdict is green. A cancelled run (a manual cancel, or
# a newer run replacing a queued one) skips the verdict and touches no issue.
on:
  schedule:
    # Off-peak (04:17 UTC) and off the :00/:30 marks the fleet crowds.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional full commit SHA used as the comparison base (default: head of the latest successful daily run, else the tip itself)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: assisted-application-portal-replay-daily
  # A replay is expensive and runs for up to two hours. Never cancel the active
  # run; a newer pending run only replaces an older pending one.
  cancel-in-progress: false

jobs:
  detect:
    name: resolve base and select families
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.detect.outputs.run }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      head_sha: ${{ steps.base.outputs.head_sha }}
      base_source: ${{ steps.base.outputs.base_source }}
    steps:
      # The base lookup is an API read (`actions: read`), so it gets bounded
      # retries with a growing backoff: a transient 403/5xx must not turn into
      # a guessed base. After the last attempt the job fails by name and the
      # verdict reports it.
      - name: Resolve the comparison base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -uo pipefail
          sha_re='^[0-9a-f]{40}$'
          if [[ ! "$HEAD_SHA" =~ $sha_re ]]; then
            echo "::error::unexpected head SHA: $HEAD_SHA"
            exit 1
          fi
          retry() {
            local attempt delay
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 4 ]; then
                delay=$((attempt * attempt * 15))
                echo "::warning::GitHub read failed (attempt $attempt/4); retrying in ${delay}s" >&2
                sleep "$delay"
              fi
            done
            return 1
          }
          base=''
          source=''
          # GitHub may materialize an omitted optional string input as this
          # sentinel. It means "not supplied", not a commit to validate.
          if [ "$INPUT_BASE_SHA" = '0000000000000000000000000000000000000001' ]; then
            INPUT_BASE_SHA=''
          fi
          if [ -n "$INPUT_BASE_SHA" ]; then
            if [[ ! "$INPUT_BASE_SHA" =~ $sha_re ]]; then
              echo '::error::base_sha must be a full 40-character lowercase commit SHA'
              exit 1
            fi
            retry gh api "repos/$REPO/commits/$INPUT_BASE_SHA" --jq .sha > "$RUNNER_TEMP/portal-replay-base-sha.txt" || {
              echo "::error::base_sha $INPUT_BASE_SHA is not a commit of $REPO"
              exit 1
            }
            base="$(cat "$RUNNER_TEMP/portal-replay-base-sha.txt")"
            source='input'
          else
            # Without a `created` window a `--branch` listing can come back frozen
            # weeks in the past (scripts/ci/lib/run-listing-window.mjs). Fourteen
            # days is far more than the daily cadence needs; when the latest
            # successful run is older than that, there is no usable base and the
            # comparison falls back to the head itself (health of the portals).
            CREATED_SINCE="$(jq -rn 'now - (14 * 86400) | strftime("%Y-%m-%d")')"
            retry gh run list --repo "$REPO" --workflow assisted-application-portal-replay.yml --branch main --status success \
              --created ">=$CREATED_SINCE" --limit 50 \
              --json event,headSha,createdAt > "$RUNNER_TEMP/portal-replay-last-success.json" || {
              echo '::error::could not read the latest successful daily replay run after 4 attempts'
              exit 1
            }
            base="$(jq -r '[.[] | select(.event == "schedule" or .event == "workflow_dispatch") | select(.headSha | test("^[0-9a-f]{40}$"))] | sort_by(.createdAt) | last | .headSha // empty' "$RUNNER_TEMP/portal-replay-last-success.json")"
            if [ -n "$base" ]; then
              source='last-success'
            else
              base="$HEAD_SHA"
              source='head'
            fi
          fi
          if [[ ! "$base" =~ $sha_re ]]; then
            echo "::error::resolved base is not a full commit SHA: $base"
            exit 1
          fi
          echo "portal replay base: $base ($source), head: $HEAD_SHA"
          {
            printf 'base_sha=%s\n' "$base"
            printf 'head_sha=%s\n' "$HEAD_SHA"
            printf 'base_source=%s\n' "$source"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base replay CLI
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.base_sha }}
          path: .portal-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            functions/src
            scripts/assisted-application
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # One shared runner path stands for "everything": the trusted CLI expands
      # it to the complete family group (see the header). No git diff is read.
      - name: Write the full-matrix path list
        run: |
          set -euo pipefail
          printf '%s\n' 'scripts/assisted-application/agent.mjs' > "$RUNNER_TEMP/portal-replay-paths.txt"
          echo "full matrix requested through: $(cat "$RUNNER_TEMP/portal-replay-paths.txt")"

      - name: Upload path list for prepare
        uses: actions/upload-artifact@v7
        with:
          name: portal-replay-paths-${{ github.run_id }}
          path: ${{ runner.temp }}/portal-replay-paths.txt
          retention-days: 1
          overwrite: true

      - name: Detect the families to replay
        id: detect
        run: |
          set -euo pipefail
          portal_replay_cli=.portal-base/scripts/assisted-application/portal-replay.mjs
          output_file="$RUNNER_TEMP/portal-replay-detect-output.txt"
          rm -f "$output_file"
          test -f "$portal_replay_cli"
          node "$portal_replay_cli" detect \
            --diff-file "$RUNNER_TEMP/portal-replay-paths.txt" \
            --github-output "$output_file"
          run_count="$(awk -F= '$1 == "run" { count++ } END { print count + 0 }' "$output_file")"
          run_value="$(awk -F= '$1 == "run" { print substr($0, index($0, "=") + 1) }' "$output_file")"
          if [[ "$run_count" != '1' || ! "$run_value" =~ ^(true|false)$ ]]; then
            echo '::error::portal replay detect did not produce exactly one boolean run output'
            exit 1
          fi
          # The daily replay always runs the whole matrix: a `false` here means
          # the trusted CLI no longer expands the shared path, which must fail
          # loudly instead of skipping the portals.
          if [[ "$run_value" != 'true' ]]; then
            echo '::error::the trusted replay CLI did not select any family for the full-matrix path list'
            exit 1
          fi
          printf 'run=%s\n' "$run_value" >> "$GITHUB_OUTPUT"

  prepare:
    name: prepare portal replay corpus
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      families: ${{ steps.prepare.outputs.families }}
      now_ms: ${{ steps.prepare.outputs.now_ms }}
      stop_hosts: ${{ steps.prepare.outputs.stop_hosts }}
    steps:
      - name: Checkout base classifier
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: .portal-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            data/jobs/by-crawler
            functions/src
            scripts/assisted-application
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The open portal-stop issues are the one input git cannot supply, so this
      # stays an API call: bounded retries with a growing backoff instead of a
      # single attempt that a transient 403/5xx turns into a red required check.
      - name: List open portal-stop hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title portal-stop' --limit 1000 --json title > "$RUNNER_TEMP/portal-stop-titles.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 15))
              echo "::warning::portal-stop listing failed (attempt $attempt/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo '::error::could not list the open portal-stop issues after 4 attempts'
          exit 1

      - name: Download changed path list from detect
        uses: actions/download-artifact@v8
        with:
          name: portal-replay-paths-${{ github.run_id }}
          path: ${{ runner.temp }}/portal-replay-paths

      - name: Select a deterministic corpus
        id: prepare
        run: |
          replay_now_ms="$(node -p 'Date.now()')"
          set -euo pipefail
          portal_replay_cli=.portal-base/scripts/assisted-application/portal-replay.mjs
          output_file="$RUNNER_TEMP/portal-replay-prepare-output.txt"
          rm -f "$output_file"
          test -f "$portal_replay_cli"
          node "$portal_replay_cli" prepare \
            --diff-file "$RUNNER_TEMP/portal-replay-paths/portal-replay-paths.txt" \
            --data-dir .portal-base/data/jobs/by-crawler \
            --classifier-root .portal-base \
            --stop-titles "$RUNNER_TEMP/portal-stop-titles.json" \
            --now-ms "$replay_now_ms" \
            --corpus-out "$RUNNER_TEMP/portal-replay-corpus.json" \
            --github-output "$output_file"
          output_value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key { print substr($0, index($0, "=") + 1) }' "$output_file"
          }
          output_count() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key { count++ } END { print count + 0 }' "$output_file"
          }
          families="$(output_value families)"
          now_ms="$(output_value now_ms)"
          stop_hosts="$(output_value stop_hosts)"
          for key in families now_ms stop_hosts; do
            if [[ "$(output_count "$key")" != '1' ]]; then
              echo "::error::portal replay prepare did not produce exactly one $key output"
              exit 1
            fi
          done
          [[ "$now_ms" =~ ^[0-9]+$ ]] || { echo '::error::portal replay prepare produced an invalid now_ms output'; exit 1; }
          node -e '
            const [families, stopHosts] = process.argv.slice(1).map(JSON.parse);
            const strings = (value) => Array.isArray(value) && value.every((item) => typeof item === "string");
            if (!strings(families) || families.length === 0 || !strings(stopHosts)) process.exit(1);
          ' "$families" "$stop_hosts"
          printf 'families=%s\n' "$families" >> "$GITHUB_OUTPUT"
          printf 'now_ms=%s\n' "$now_ms" >> "$GITHUB_OUTPUT"
          printf 'stop_hosts=%s\n' "$stop_hosts" >> "$GITHUB_OUTPUT"

  replay:
    name: replay portal families (group ${{ matrix.group }})
    needs: [detect, prepare]
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    runs-on: ubuntu-latest
    # Budget bound, derived from the largest group and not from an average
    # (a family holds one of the parallel slots for its whole workload). The
    # sorted modulo partition puts at most four families in each of the three
    # workers; the bound below treats all four as five-listing families.
    # `--timeout-ms 75000` is the ACTIVE budget of a listing attempt: the time
    # the runner under test spends on the page. The time it waits for the Codex
    # broker (queue + model at effort max) is measured apart: each call is
    # bounded by REPLAY_CODEX_CALL_TIMEOUT_MS (150 s, the broker limit below),
    # the whole attempt by REPLAY_WALL_CAP_MS (300 s). Base and head are judged
    # by the same two clocks.
    #   attempt   <= 300 s wall
    #   listing   <= (retries 1 + 1) attempts * 300 s            = 600 s
    #                (a neutral retry or the one completion of an unmeasured
    #                side; base and head run concurrently, not summed)
    #   family    <= 5 listings (maxPerFamily) * 600 s + 60 s of
    #                preflight and browser launch               = 3060 s
    #   group     <= 4 families of 5                              = 12240 s of work
    #   makespan  <= work / 3 slots + (2/3) * largest family    = 6120 s (102 min)
    #   setup     ~ 4.4 min measured (checkouts, two npm ci, Chromium, broker),
    #               6 min allowed                                -> 108 min
    # timeout-minutes covers that bound and stays at the 120-minute ceiling.
    timeout-minutes: 120
    env:
      # Broker lanes (the action accepts 1..6). Each family runs base and head
      # concurrently, so the number of families in flight is lanes / 2.
      PORTAL_REPLAY_BROKER_LANES: '6'
      PORTAL_REPLAY_GROUP: ${{ matrix.group }}
      PORTAL_REPLAY_GROUP_COUNT: '3'
    steps:
      - name: Checkout head runner (tip of main)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            functions/src
            packages
            scripts/assisted-application
            scripts/lib
          sparse-checkout-cone-mode: true

      - name: Checkout trusted base runner and Codex broker action
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: .portal-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-claude-haiku-fallback
            .github/actions/setup-codex-sandbox
            data/jobs/by-crawler
            functions/src
            packages
            scripts/assisted-application
            scripts/lib
          sparse-checkout-cone-mode: true

      - name: Materialize trusted Codex sandbox action
        shell: bash
        run: |
          set -euo pipefail
          source_action="$GITHUB_WORKSPACE/.portal-base/.github/actions/setup-codex-sandbox/action.yml"
          target_action="$GITHUB_WORKSPACE/.github/actions/setup-codex-sandbox/action.yml"
          test -f "$source_action"
          test ! -e "$target_action" && test ! -L "$target_action"
          mkdir -p "$(dirname "$target_action")"
          install -m 0644 "$source_action" "$target_action"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Require trusted Codex broker credentials
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [[ -z "$CODEX_AUTH_JSON" ]]; then
            echo '::error::blocked: the CODEX_AUTH_JSON secret is not available to this run; the real-Codex replay cannot be measured until it is restored.'
            exit 1
          fi

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install base dependencies and workspace sources
        run: npm ci --prefix .portal-base --no-audit --no-fund

      - name: Build the same deterministic corpus in this job workspace
        env:
          PORTAL_REPLAY_FAMILIES: ${{ needs.prepare.outputs.families }}
          PORTAL_REPLAY_NOW_MS: ${{ needs.prepare.outputs.now_ms }}
          PORTAL_REPLAY_STOP_HOSTS: ${{ needs.prepare.outputs.stop_hosts }}
        run: |
          printf '%s' "$PORTAL_REPLAY_STOP_HOSTS" > "$RUNNER_TEMP/portal-replay-stop-hosts.json"
          set -euo pipefail
          portal_replay_cli=.portal-base/scripts/assisted-application/portal-replay.mjs
          test -f "$portal_replay_cli"
          node "$portal_replay_cli" corpus \
            --data-dir .portal-base/data/jobs/by-crawler \
            --classifier-root .portal-base \
            --stop-hosts-file "$RUNNER_TEMP/portal-replay-stop-hosts.json" \
            --now-ms "$PORTAL_REPLAY_NOW_MS" \
            --expected-families "$PORTAL_REPLAY_FAMILIES" \
            --corpus-out "$RUNNER_TEMP/portal-replay-corpus.json"

      - name: Install Chromium
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /etc/apt/apt.conf.d
            printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99network-tuning >/dev/null
          fi
          npx playwright install chromium || npx playwright install --with-deps chromium
          (cd .portal-base && npx playwright install chromium) || (cd .portal-base && npx playwright install --with-deps chromium)

      - id: codex
        uses: ./.portal-base/.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          broker_idle_ttl_ms: '1200000'
          broker_max_concurrency: ${{ env.PORTAL_REPLAY_BROKER_LANES }}
          broker_max_timeout_ms: '150000'

      - name: Require trusted Codex broker
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.codex.outputs.codex_auth_broker_socket }}
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_AUTH_BROKER_SOCKET" || ! -S "$CODEX_AUTH_BROKER_SOCKET" ]]; then
            echo '::error::trusted Codex broker did not produce a Unix socket; refusing to start portal replay.'
            exit 1
          fi

      # The broker runs its first request alone and only then opens its other
      # lanes, and a broker whose Codex login is rejected would otherwise show
      # up as twelve `portal_replay_timeout` families. One tiny trusted request
      # (the base `ai-models.mjs`, never PR code) opens the lanes and either
      # proves the backend usable, records an explicit provider-quota skip, or
      # fails here with the cause. Two more concurrent requests measure whether
      # the lanes really run in parallel.
      - name: Warm up the Codex broker and measure its lanes
        id: broker_warmup
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.codex.outputs.codex_auth_broker_socket }}
          CODEX_BROKER_MAX_TIMEOUT_MS: ${{ steps.codex.outputs.codex_broker_max_timeout_ms }}
          PROVIDER_STATUS_FILE: ${{ runner.temp }}/portal-replay-reports/provider-unavailable-${{ matrix.group }}.status
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const { requestCodexBrokerJson } = await import(pathToFileURL(path.resolve(".portal-base/scripts/lib/ai-models.mjs")).href);
            const schema = { type: "object", properties: { ok: { type: "boolean" } }, required: ["ok"], additionalProperties: false };
            const quotaError = /\b(?:usage\s+limit|rate\s+limit|quota\s+(?:exhausted|exceeded)|too\s+many\s+requests)\b/iu;
            const writeProviderStatus = (status) => {
              const statusFile = process.env.PROVIDER_STATUS_FILE || "";
              if (statusFile) {
                mkdirSync(path.dirname(statusFile), { recursive: true });
                writeFileSync(statusFile, `${status}\n`, { mode: 0o600 });
              }
              if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, `provider_status=${status}\n`);
            };
            const markQuota = (result) => {
              if (result.ok || !quotaError.test(result.error)) return false;
              writeProviderStatus("codex_quota");
              console.log("::warning::Codex broker quota exhausted; portal replay deferred without issuing a portal verdict.");
              return true;
            };
            const ask = async () => {
              const started = Date.now();
              try {
                const answer = await requestCodexBrokerJson({ prompt: "Return the JSON object {\"ok\": true} and nothing else.", schema, timeoutMs: 60000 });
                return { ms: Date.now() - started, ok: answer?.ok === true, error: "" };
              } catch (error) {
                return { ms: Date.now() - started, ok: false, error: String(error?.message || error).split("\n")[0].slice(0, 200) };
              }
            };
            let first = await ask();
            if (!first.ok) {
              console.log(`Codex broker warm-up attempt 1 failed after ${first.ms} ms: ${first.error || "unexpected answer"}`);
              if (markQuota(first)) process.exit(0);
              await new Promise((resolve) => setTimeout(resolve, 15000));
              first = await ask();
            }
            if (!first.ok) {
              if (markQuota(first)) process.exit(0);
              console.log(`::error::blocked: the Codex backend did not answer a minimal request (${first.error || "unexpected answer"}, ${first.ms} ms); the portal replay cannot be measured until the CODEX_AUTH_JSON login or the Codex quota is restored.`);
              process.exit(1);
            }
            console.log(`Codex broker warm-up: first request answered in ${first.ms} ms`);
            const pair = Date.now();
            const results = await Promise.all([ask(), ask()]);
            const pairMs = Date.now() - pair;
            const slowest = Math.max(...results.map((item) => item.ms));
            console.log(`Codex broker lanes probe: 2 concurrent requests in ${pairMs} ms (single request ${first.ms} ms, errors: ${results.filter((item) => !item.ok).length})`);
            const failedProbes = results.filter((item) => !item.ok);
            if (failedProbes.length && failedProbes.every((item) => quotaError.test(item.error))) {
              markQuota(failedProbes[0]);
              process.exit(0);
            }
            if (failedProbes.length) {
              console.log(`::warning::Codex broker probe failed on ${failedProbes.length}/2 concurrent requests (${failedProbes[0].error || "unexpected answer"}); the broker is unhealthy under concurrency and replay results may be unmeasured.`);
            }
            if (pairMs > first.ms * 1.7 && slowest > 5000) {
              console.log(`::warning::Codex broker lanes look serialized (2 requests took ${pairMs} ms against ${first.ms} ms for one); replay listings may wait in the broker queue.`);
            }
          '

      - name: Replay portal families in parallel inside this worker
        if: ${{ steps.broker_warmup.outputs.provider_status != 'codex_quota' }}
        env:
          ASSISTED_APPLICATION_HEADED: '1'
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.codex.outputs.codex_auth_broker_socket }}
          CODEX_BROKER_MAX_TIMEOUT_MS: ${{ steps.codex.outputs.codex_broker_max_timeout_ms }}
          PORTAL_REPLAY_FAMILIES: ${{ needs.prepare.outputs.families }}
          PORTAL_REPLAY_REPORT_DIR: ${{ runner.temp }}/portal-replay-reports
          PORTAL_REPLAY_LOG_DIR: ${{ runner.temp }}/portal-replay-logs
        run: |
          run_group() {
            set -euo pipefail
            mkdir -p "$PORTAL_REPLAY_REPORT_DIR" "$PORTAL_REPLAY_LOG_DIR"
            # The paired comparison semantics belong to the head checkout;
            # the base checkout remains the source of trusted fences and data.
            portal_replay_cli=scripts/assisted-application/portal-replay.mjs
            test -f "$portal_replay_cli"
            PORTAL_REPLAY_FAMILIES="$PORTAL_REPLAY_FAMILIES" PORTAL_REPLAY_GROUP="$PORTAL_REPLAY_GROUP" PORTAL_REPLAY_GROUP_COUNT="$PORTAL_REPLAY_GROUP_COUNT" node --input-type=module -e '
              const families = JSON.parse(process.env.PORTAL_REPLAY_FAMILIES || "[]");
              const group = Number(process.env.PORTAL_REPLAY_GROUP);
              const groupCount = Number(process.env.PORTAL_REPLAY_GROUP_COUNT);
              if (!Array.isArray(families) || !families.length || families.some((family) => typeof family !== "string" || !/^[a-z0-9_]+$/.test(family))) process.exit(1);
              if (!Number.isInteger(group) || !Number.isInteger(groupCount) || group < 0 || group >= groupCount || groupCount < 1) process.exit(1);
              for (const [index, family] of [...new Set(families)].sort().entries()) {
                if (index % groupCount === group) console.log(family);
              }
            ' > "$RUNNER_TEMP/portal-replay-families.txt"
            mapfile -t families < "$RUNNER_TEMP/portal-replay-families.txt"
            if (( ${#families[@]} == 0 )); then
              echo "portal replay group $PORTAL_REPLAY_GROUP has no affected families"
              return 0
            fi
            # Base and head replay at the same time: one family is two broker
            # callers. Keep the callers within the broker lanes so a request
            # never waits in the broker queue while the 75 s listing timer runs.
            lanes="${PORTAL_REPLAY_BROKER_LANES:-2}"
            max_parallel=$(( lanes / 2 ))
            if (( max_parallel < 1 )); then max_parallel=1; fi
            echo "portal replay group: ${#families[@]} families, at most $max_parallel in parallel ($lanes broker lanes)"
            rm -f "$PORTAL_REPLAY_LOG_DIR"/*.exit

            run_family() {
              local family="$1"
              local report="$PORTAL_REPLAY_REPORT_DIR/portal-replay-${family}.json"
              local log="$PORTAL_REPLAY_LOG_DIR/portal-replay-${family}.log"
              local started=$SECONDS
              local status=0
              # The 3060 s family bound derived above is enforced, not only
              # declared: a family that outlives it exits 124, its log is still
              # printed below and the gate counts it as failed. Without it one
              # stuck family held its whole group to the 120-minute timeout.
              PORTAL_REPLAY_FAMILY="$family" PORTAL_REPLAY_REPORT="$report" timeout --kill-after=30s 3060s node "$portal_replay_cli" compare \
                --base-root .portal-base \
                --head-root . \
                --corpus "$RUNNER_TEMP/portal-replay-corpus.json" \
                --family "$family" \
                --timeout-ms 75000 \
                --output "$report" > "$log" 2>&1 || status=$?
              # The exit status goes through a file: a sliding window cannot
              # wait for each pid, and a lost status would hide a failed family.
              echo "$status" > "$PORTAL_REPLAY_LOG_DIR/portal-replay-${family}.exit"
              echo "portal replay family $family finished with exit $status after $((SECONDS - started))s"
            }

            # Sliding window: start the next family as soon as one finishes.
            for family in "${families[@]}"; do
              while (( $(jobs -pr | wc -l) >= max_parallel )); do sleep 1; done
              run_family "$family" &
            done
            wait

            failed_count=0
            for family in "${families[@]}"; do
              exit_file="$PORTAL_REPLAY_LOG_DIR/portal-replay-${family}.exit"
              if [[ ! -s "$exit_file" || "$(cat "$exit_file")" != "0" ]]; then failed_count=$((failed_count + 1)); fi
            done

            for family in "${families[@]}"; do
              report="$PORTAL_REPLAY_REPORT_DIR/portal-replay-${family}.json"
              log="$PORTAL_REPLAY_LOG_DIR/portal-replay-${family}.log"
              if [[ -s "$report" ]]; then
                echo "portal replay group $family: report ready"
              else
                echo "portal replay group $family: report missing"
              fi
              if [[ -s "$log" ]]; then
                echo "--- $family ---"
                sed -n '1,200p' "$log"
              fi
            done
            if (( failed_count > 0 )); then
              echo "portal replay group: $failed_count/${#families[@]} family process(es) failed"
              return 1
            fi
          }
          group_script="$RUNNER_TEMP/portal-replay-group.sh"
          declare -f run_group > "$group_script"
          printf '\nrun_group\n' >> "$group_script"
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum --server-args="-screen 0 1366x900x24" bash "$group_script"
          else
            bash "$group_script"
          fi

      - name: Upload sanitized family reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assisted-application-portal-replay-reports-${{ github.run_id }}-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/portal-replay-reports/*.json
            ${{ runner.temp }}/portal-replay-reports/*.status
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.codex.outputs.codex_auth_broker_socket }}
        run: |
          if [ -n "$CODEX_AUTH_BROKER_SOCKET" ] && [ -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            node .portal-base/.github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
              --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET"
          fi

  portal-replay-daily-verdict:
    name: portal replay daily verdict
    # Not `always()`: nothing requires this check any more, so a skipped job has
    # no merge to unblock, and a cancelled run (manual cancel, or replaced while
    # pending) must neither report a regression nor touch the issue.
    if: ${{ !cancelled() }}
    needs: [detect, prepare, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verdict_code: ${{ steps.aggregate.outputs.verdict_code }}
    steps:
      # The trusted base CLI stays the aggregator once it knows the report
      # semantics. When the base is older than the report protocol (an old
      # `base_sha` was dispatched) or missing (detect failed), the head CLI of
      # this very run, a main commit, is the compatibility bridge; otherwise the
      # old sanitizer turns pre-existing base errors into false regressions.
      - name: Checkout trusted base replay CLI
        if: needs.detect.outputs.base_sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: .portal-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            functions/src
            scripts/assisted-application
          sparse-checkout-cone-mode: true

      - name: Checkout head replay CLI for a changed report protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .portal-head
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            functions/src
            scripts/assisted-application
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download sanitized family reports
        if: needs.detect.result == 'success'
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: assisted-application-portal-replay-reports-${{ github.run_id }}-*
          path: ${{ runner.temp }}/portal-replay-reports
          merge-multiple: true

      - name: Aggregate the daily verdict and publish the sanitized report
        id: aggregate
        env:
          PREPARE_RUN: ${{ needs.detect.outputs.run || 'false' }}
          DETECT_RESULT: ${{ needs.detect.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
          FAMILIES: ${{ needs.prepare.outputs.families || '[]' }}
          REPORT_DIR: ${{ runner.temp }}/portal-replay-reports
          SUMMARY_FILE: ${{ runner.temp }}/portal-replay-summary.md
        run: |
          mkdir -p "$REPORT_DIR"
          if [[ "$DETECT_RESULT" != 'success' ]]; then
            effective_prepare_result=failure
          elif [[ "$PREPARE_RUN" == 'true' && "$PREPARE_RESULT" != 'success' ]]; then
            effective_prepare_result=failure
          else
            effective_prepare_result=success
          fi
          set -euo pipefail
          portal_replay_cli=.portal-base/scripts/assisted-application/portal-replay.mjs
          if [ -f "$portal_replay_cli" ] && grep -Fq "PORTAL_REPLAY_GATE_SEMANTICS = 'measured-baseline-v3'" "$portal_replay_cli"; then
            gate_cli="$portal_replay_cli"
          else
            gate_cli=.portal-head/scripts/assisted-application/portal-replay.mjs
            test -f "$gate_cli"
            echo 'portal replay verdict: using the head CLI because the trusted base is missing or predates the report protocol'
          fi
          node "$gate_cli" aggregate \
            --prepare-run "$PREPARE_RUN" \
            --prepare-result "$effective_prepare_result" \
            --matrix-result "$REPLAY_RESULT" \
            --families "$FAMILIES" \
            --report-dir "$REPORT_DIR" \
            --output "$RUNNER_TEMP/portal-replay-gate.json" \
            --summary "$SUMMARY_FILE"
          verdict_code="$(jq -r '.verdict.code // empty' "$RUNNER_TEMP/portal-replay-gate.json")"
          [[ -n "$verdict_code" ]] || { echo '::error::portal replay verdict did not publish a code'; exit 1; }
          printf 'verdict_code=%s\n' "$verdict_code" >> "$GITHUB_OUTPUT"

      # The summary is for people, the JSON for the issue job (verdict code,
      # failing families and their reason codes); both are sanitized.
      - name: Upload sanitized verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assisted-application-portal-replay-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/portal-replay-summary.md
            ${{ runner.temp }}/portal-replay-gate.json
          if-no-files-found: ignore
          retention-days: 7

  portal-replay-daily-issue:
    name: portal replay daily issue
    # Only on main, and only on a decided verdict: `failure` opens or updates the
    # one issue, `success` closes it. A cancelled or skipped verdict changes
    # nothing. A dispatch from another branch is a trial and never touches it.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.portal-replay-daily-verdict.result == 'failure' || needs.portal-replay-daily-verdict.result == 'success')
    needs: [detect, portal-replay-daily-verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Pin the runner-owned GitHub CLI before checkout, like the other
      # workflows that mutate issues, so a checked-out file cannot shadow it.
      - name: Resolve trusted GitHub CLI (before checkout)
        id: trusted_gh
        run: |
          set -euo pipefail
          gh_bin="$(command -v gh || true)"
          if [ -z "$gh_bin" ] || [[ "$gh_bin" != /* ]] || [ ! -x "$gh_bin" ]; then
            echo "::error::GitHub CLI path non assoluto o non eseguibile: ${gh_bin:-missing}"
            exit 1
          fi
          gh_bin="$(realpath "$gh_bin")"
          case "$gh_bin" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "::error::GitHub CLI risolve in un path controllabile dal runner: $gh_bin"
              exit 1
              ;;
          esac
          probe="$gh_bin"
          while [ "$probe" != "/" ]; do
            if [ -w "$probe" ]; then
              echo "::error::GitHub CLI o una directory del suo path è scrivibile dal runner: $probe"
              exit 1
            fi
            probe="$(dirname "$probe")"
          done
          printf 'path=%s\n' "$gh_bin" >> "$GITHUB_OUTPUT"

      # Code of this very run (the tip of main): the shared issue helper and the
      # body builder. The replayed base never executes here.
      - name: Checkout issue helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/portal-replay-daily-issue.mjs
            scripts/lib/is-invoked-directly.mjs
            scripts/lib/github-issue-creator.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download sanitized verdict
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: assisted-application-portal-replay-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/portal-replay-verdict

      # One issue under a stable title (<= 60 characters, so the helper matches
      # the whole title), found again through the marker in its body. The helper
      # comments on the open issue, reopens a recently closed twin instead of
      # minting a new number, and creates the label idempotently.
      - name: Open or update the daily replay issue
        if: always() && needs.portal-replay-daily-verdict.result == 'failure' && needs.portal-replay-daily-verdict.outputs.verdict_code != 'codex_quota'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha || github.sha }}
          BASE_SOURCE: ${{ needs.detect.outputs.base_source }}
          GATE_JSON: ${{ runner.temp }}/portal-replay-verdict/portal-replay-gate.json
          ISSUE_BODY_FILE: ${{ runner.temp }}/portal-replay-issue-body.md
        run: |
          set -euo pipefail
          node scripts/ci/portal-replay-daily-issue.mjs \
            --gate-json "$GATE_JSON" \
            --run-url "$RUN_URL" \
            --repo "$GH_REPO" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-source "$BASE_SOURCE" \
            --out "$ISSUE_BODY_FILE"
          title="$(node scripts/ci/portal-replay-daily-issue.mjs --print-title)"
          node scripts/lib/github-issue-creator.mjs \
            --title "$title" \
            --description-file "$ISSUE_BODY_FILE" \
            --priority 2 \
            --label Bug \
            --label portal-replay-daily \
            --workflow 'Assisted application portal replay' \
            --require-persisted

      - name: Close the daily replay issue after a green verdict
        if: needs.portal-replay-daily-verdict.result == 'success' && needs.portal-replay-daily-verdict.outputs.verdict_code != 'codex_quota'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="$(node scripts/ci/portal-replay-daily-issue.mjs --print-title)"
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "$title" \
            --workflow 'Assisted application portal replay' \
            --run-url "$RUN_URL"
