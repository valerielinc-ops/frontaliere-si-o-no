name: job-description-locale-audit

# Twice-daily deterministic check of wrong-language JOB DESCRIPTIONS
# (scripts/audit-job-description-locale.mjs) — the metric behind the DESCRIPTIONS
# ratchet in tests/job-locale-consistency.test.ts.
#
# WHY IT EXISTS. On 2026-08-11 that ratchet read 0.320% against its 0.300% limit
# and turned `vitest` red on EVERY open PR at once. Nothing reported the drift:
# the gate only speaks inside a PR run, it prints a rate with no offender list,
# and NO BRANCH COULD FIX IT because the defect was in main's DATA, not in any
# diff. Every open PR sat on `stale-review` while the cause went unnamed.
# This workflow is the missing measurement, and it names the offenders.
#
# IT ALSO ALERTS ON A THIN MARGIN, not only on a breach. Same day, the gate went
# green again with NOTHING repaired: the offender count stayed at 100 while the
# dataset grew from 31,266 to 34,594 description slots, so the rate fell to
# 0.289% by dilution alone. A gate 0.011pp under its limit is one crawl away
# from red and, to every existing signal, looks exactly like a healthy one.
# `min_headroom_pp` is what makes that state visible before it costs a day.
#
# THE REPAIR PATH IS NOT HERE. `mark-locale-mismatched-jobs.mjs` inside
# translate-pending.yml marks the offenders `needsRetranslation`, which both
# removes them from this population and queues them for the cascade. That script
# wrote its marks ONLY to the gitignored `data/jobs.json` until #5637, so the
# marks evaporated on every re-assemble and the backlog could never drain —
# which is why the breach above was never going to clear on its own. This audit
# reports; it does not write data.
#
# Zero-Claude: a deterministic script plus `gh issue` calls. Report-only, never
# a deploy gate.
#
# ROUTING — deliberately NOT the immediate `agent:fix` route. Per
# scripts/lib/classify-issue.mjs, `agent:fix` is reserved for category `crawler`.
# `priority:medium` plus the labels below classify as `other` => `route: queue`
# => `agent:fix-queued` + `fu-prio:low`, drained one at a time by
# followup-drainer. tests/audit-job-description-locale.test.ts asserts that
# classification so a future title edit cannot silently promote it into the
# crawler bypass.
#
# CLOSURE — the issue closes ITSELF via the `--resolve` twin step below, with a
# literal title IDENTICAL to the opener's. scripts/ci/failure-issue-inventory.mjs
# (gated by tests/failure-issue-closers.test.ts) recognises a closer only as a
# twin `--resolve` step in the SAME workflow with an identical literal title, so
# the two calls stay split and neither title moves into a shell variable.
# Shipping an alert with no closer is the alert-pat-down.mjs incident.

on:
  schedule:
    # 08:25 and 20:25 UTC — both sit AFTER a translate-pending drain (07:00 and
    # 13:00 crons) so the measurement reflects the post-drain state, and clear of
    # job-title-locale-audit (Tue 09:40) and the crawler-quality audits.
    - cron: '25 8,20 * * *'
  workflow_dispatch:
    inputs:
      min_headroom_pp:
        description: 'Percentage points of headroom below the ratchet under which a still-green gate is alerted. Default: repo var JOB_DESC_LOCALE_MIN_HEADROOM_PP, else 0.05.'
        required: false
        default: ''
      queue_stale_alert:
        description: 'Number of jobs queued >7d while still serving their source-language description, above which the issue is opened. Default: repo var JOB_DESC_QUEUE_STALE_ALERT, else 100.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: job-description-locale-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # data/jobs.json is gitignored (build artifact). Assemble it from the
      # committed per-crawler slices so the audit measures the same population
      # the vitest ratchet does — the test reads DATA_JOBS_PATH, never the slices.
      - name: Assemble jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Run job description locale audit
        id: audit
        continue-on-error: true
        env:
          MIN_HEADROOM_PP: ${{ inputs.min_headroom_pp || vars.JOB_DESC_LOCALE_MIN_HEADROOM_PP || '0.05' }}
        run: node scripts/audit-job-description-locale.mjs --min-headroom-pp "$MIN_HEADROOM_PP"

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-description-locale-audit-report
          path: data/job-description-locale-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build issue body from the report
        id: body
        if: steps.audit.outcome == 'success'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUEUE_STALE_ALERT: ${{ inputs.queue_stale_alert || vars.JOB_DESC_QUEUE_STALE_ALERT || '100' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/jdl

          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('data/job-description-locale-audit.json', 'utf8'));
          const p3 = (v) => `${(v * 100).toFixed(3)}%`;

          if (!r.datasetPresent) {
            // No dataset => no measurement. Say nothing rather than assert health:
            // silently closing the issue on an empty run is how a real defect
            // disappears from the tracker.
            writeFileSync('/tmp/jdl/action', 'skip');
            writeFileSync('/tmp/jdl/body.md', '');
            console.log('No job dataset — skipping issue update.');
          } else {
            // THE QUEUE IS A THIRD, INDEPENDENT ALARM. `breached` / `thinMargin` /
            // `gateBlind` are all statements about the RATE, and the rate skips
            // `needsRetranslation` jobs in its numerator by design. A job that is
            // queued and never drains therefore serves its source-language text
            // on a foreign-locale page indefinitely without moving any of the
            // three. `queue.staleSourceCopyJobs` is that population.
            //
            // THRESHOLD 100, derived from the shape of the queue rather than
            // picked round. Measured 2026-08-19 on the committed slices: 419
            // stale-eligible jobs sit in 0-7d (normal churn — the drain runs 5x
            // a day), only 4 survive into 8-30d, and then 370 pile up beyond 30
            // days. A healthy drain leaves single digits behind; 100 sits an
            // order of magnitude above that and well under the 376 tail, so it
            // is red today, opens work, and can actually go green again.
            const q = r.queue || {};
            const queueStaleAlert = Number(process.env.QUEUE_STALE_ALERT || '100');
            const queueStuck = Number(q.staleSourceCopyJobs || 0) > queueStaleAlert;
            const unhealthy = r.breached || r.thinMargin || r.gateBlind || queueStuck;
            let md = `## Descrizioni in lingua sbagliata — snapshot\n\n`;
            md += r.gateBlind
              ? `🔴 **GATE CIECA.** Solo **${r.servedSlots}/${r.slots}** slot (${(r.servedShare * 100).toFixed(1)}%) sono serviti come traduzioni finite, sotto il floor del ${(r.minServedShare * 100).toFixed(0)}%. Il tasso qui sotto e' verde perche' la gate non vede quasi niente, non perche' il corpus sia sano: la coda \`needsRetranslation\` si e' mangiata la popolazione.\n\n`
              : r.breached
              ? `🔴 **RATCHET SUPERATA.** \`vitest\` e' rosso su **ogni PR aperta**, e nessun branch puo' ripararlo: il difetto e' nei DATI di main, non in un diff.\n\n`
              : `⚠️ **Margine sottile.** La gate e' verde ma per poco: **${r.headroomPp.toFixed(3)}pp** sotto il limite (soglia d'allarme ${r.minHeadroomPp}pp). Un solo crawl la fa diventare rossa su tutte le PR insieme.\n\n`;
            md += `**${r.flagged} di ${r.slots}** slot descrizione leggono come un'altra lingua = **${p3(r.rate)}** (max ${p3(r.maxRate)}), su ${r.totalJobs} job.\n`;
            md += `Serviti come traduzioni finite: **${r.servedSlots}/${r.slots}** = ${(r.servedShare * 100).toFixed(1)}% (floor ${(r.minServedShare * 100).toFixed(0)}%). Popolazione: \`${r.population}\`.\n\n`;
            md += `Di questi, **${r.sourceCopyCount}** sono copie byte-identiche del sorgente — la forma che il mop-up Argos gratuito (\`local-mt-mopup.mjs\`, Phase 2a di translate-pending) sa riparare senza toccare la quota. Il resto richiede la cascata AI, che e' quota-bound.\n`;
            md += `Job ancora toccabili dal percorso di riparazione (non \`localeMismatchSuppressed\`): **${r.actionableJobs}**.\n\n`;

            md += `### Dove si concentrano\n\n| offender | azienda |\n|---:|---|\n`;
            for (const c of r.topCompanies) md += `| ${c.count} | ${c.key} |\n`;
            md += `\n| offender | direzione |\n|---:|---|\n`;
            for (const p of r.topPairs) md += `| ${p.count} | \`${p.key}\` |\n`;

            md += `\n### Primi offender\n\n`;
            for (const o of r.offenders.slice(0, 15)) {
              md += `- \`${o.company}/${o.slug}\` [${o.locale}] => ${o.detected} (${o.confidence})`;
              md += o.sourceCopy ? ` — **copia del sorgente ${o.sourceLang}**\n` : `\n`;
            }

            if (q.queuedJobs !== undefined) {
              md += `\n### La coda di traduzione — la popolazione che il tasso qui sopra NON vede\n\n`;
              md += `**${q.queuedJobs}** job sono in coda (\`needsRetranslation\`). Di questi, **${q.sourceCopyJobs}** servono ancora una descrizione byte-identica al sorgente, e **${q.staleSourceCopyJobs}** lo fanno da piu' di ${q.staleDays} giorni (il piu' vecchio: ${q.oldestStaleDays}g).\n\n`;
              md += queueStuck
                ? `🔴 **La coda non drena per ${q.staleSourceCopyJobs} job** (soglia ${queueStaleAlert}). Ognuno serve testo ${'`'}sourceLang${'`'} su una pagina di un'altra lingua, ogni giorno, e **nessuna delle metriche qui sopra lo conta**: il ratchet salta i job in coda nel numeratore per scelta, \`MIN_SERVED_SHARE\` e' un floor da catastrofe, e \`QUEUE_AGE_ALERT_DAYS\` (150) guarda l'eta' del singolo job piu' vecchio, non quanti sono.\n\n`
                : `✅ Sotto la soglia di ${queueStaleAlert}: la coda sta drenando.\n\n`;
              md += `| eta' in coda | job che servono il sorgente |\n|---|---:|\n`;
              for (const [bucket, n] of Object.entries(q.byAge || {})) md += `| ${bucket} | ${n} |\n`;
              if (q.staleNonSwissMeasured && q.staleSourceCopyJobs > 0) {
                const share = (q.staleNonSwiss / q.staleSourceCopyJobs) * 100;
                md += `\n**Dove sono questi job: ${q.staleNonSwiss} su ${q.staleSourceCopyJobs} (${share.toFixed(1)}%) non sono in un comune svizzero.**\n\n`;
                if ((q.topLocations || []).length) {
                  md += `| job fermi | sede |\n|---:|---|\n`;
                  for (const l of q.topLocations) md += `| ${l.count} | ${String(l.key).replace(/\|/g, '\\|')} |\n`;
                  md += `\n`;
                }
                // THE PARAGRAPH IS DERIVED, NOT ASSERTED. Its first version stated the
                // foreign-postings diagnosis unconditionally, because that is what the
                // committed SLICES showed (357 of 376 = 94.9%). The first live run on the
                // ASSEMBLED artefact read 2 of 180 = 1.1% — assemble drops most of those
                // postings before publication — so the prose contradicted the table
                // printed directly above it. Both numbers were right about different
                // populations; only one of them is the published corpus. Say which
                // diagnosis the measurement supports, never a stored conclusion.
                md += share >= 50
                  ? `Questo cambia la diagnosi, e va letto prima di trattare il numero come un arretrato di traduzione. Un annuncio fuori dalla Svizzera non ha pubblico frontaliero, quindi non raccoglie traffico; l'ordinamento della coda in \`scripts/lib/job-traffic-priority.mjs\` e' traffic-first, quindi non lo pesca mai; e l'unico meccanismo che potrebbe pescarlo e' la riserva oldest-first del 20%. Non e' la cascata che fallisce su questi job: e' che non arrivano mai al suo turno. **La domanda da porsi e' perche' siano nel corpus**, non come alzare il cap di traduzione — \`scripts/audit-job-locations.mjs\` (layer 2, \`foreignInSwiss\`) misura la stessa popolazione dal lato localita'.\n\n`
                  : `La maggioranza di questi job **e'** in un comune svizzero, quindi la spiegazione «annunci esteri senza pubblico frontaliero, che il ranking a traffico non pesca mai» **non regge qui** e non va usata: sono job che il sito serve ai suoi lettori veri e che la cascata non ha comunque tradotto. Guarda la distribuzione per eta' qui sopra prima del cap: se \`8-30d\` e' quasi vuoto e le fasce oltre i 30 giorni sono piene, non e' un arretrato lento ma un insieme che la cascata non raggiunge, e il punto di partenza e' l'ordinamento in \`scripts/lib/job-traffic-priority.mjs\` (\`RESERVE_FOR_OLDEST\`), non la quota AI — il mop-up gratuito \`local-mt-mopup.mjs\` ripara proprio le copie byte-identiche senza consumarla.\n\n`;
              }

              md += `\n_Lo scalino fra le fasce e' il segnale: se \`8-30d\` e' quasi vuoto e \`31-90d\` e' pieno, non e' un arretrato che si smaltisce piano — e' un insieme di job che la cascata non prende mai._\n\n`;
              if ((q.topCompanies || []).length) {
                md += `| job fermi | azienda |\n|---:|---|\n`;
                for (const c of q.topCompanies) md += `| ${c.count} | ${c.key} |\n`;
                md += `\n`;
              }
              if ((q.samples || []).length) {
                md += `<details><summary>Primi ${q.samples.length} job fermi</summary>\n\n`;
                for (const sm of q.samples) {
                  md += `- \`${sm.companyKey || sm.company}/${sm.slug}\` — ${sm.waitedDays}g in coda, ${sm.sourceLang} copiato in [${sm.copiedLocales.join(', ')}]\n`;
                }
                md += `\n</details>\n\n`;
              }
              md += `**Da dove partire.** L'ordinamento della coda e' \`scripts/lib/job-traffic-priority.mjs\`: prima il traffico, con \`RESERVE_FOR_OLDEST\` (20%) di ogni batch pescato oldest-first proprio per non affamare la coda. Se questi job restano fermi mentre la riserva gira, la domanda giusta non e' "alzare il cap" ma **perche' questi specifici job non vengono mai presi** — cominciare dalle aziende in cima alla tabella, che sono poche e concentrate. Il mop-up gratuito \`local-mt-mopup.mjs\` (Phase 2a) ripara le copie byte-identiche senza consumare quota, quindi una coda ferma di sole copie del sorgente non e' spiegabile con la quota AI.\n\n`;
            }

            md += `\n### Riprodurre\n\n\`\`\`bash\nnode scripts/assemble-jobs-dataset.mjs\nnode scripts/audit-job-description-locale.mjs\nnpx vitest run tests/job-locale-consistency.test.ts\n\`\`\`\n\n`;
            md += `### Riparare\n\nIl percorso previsto e' il marker dentro \`translate-pending.yml\`, che mette \`needsRetranslation\` sugli offender (cosi' escono da questa popolazione ED entrano in coda per la cascata):\n\n`;
            md += `\`\`\`bash\nnode scripts/mark-locale-mismatched-jobs.mjs\n\`\`\`\n\n`;
            md += `Se il conteggio non scende fra un run e l'altro, il sospetto e' che i mark non stiano arrivando alle slice committate: \`data/jobs.json\` e' un artefatto gitignorato, e uno step che scrive solo li' perde il flag al riassemblaggio successivo (era il difetto chiuso da #5637).\n\n`;
            md += `**Report completo:** artifact \`job-description-locale-audit-report\` (30 giorni).\n`;
            md += `**Run:** ${process.env.RUN_URL}\n`;

            writeFileSync('/tmp/jdl/body.md', md);
            writeFileSync('/tmp/jdl/action', unhealthy ? 'alert' : 'resolve');
            console.log(`rate=${p3(r.rate)} headroom=${r.headroomPp.toFixed(3)}pp -> ${unhealthy ? 'alert' : 'resolve'}`);
          }
          NODE

          echo "action=$(cat /tmp/jdl/action)" >> "$GITHUB_OUTPUT"

      # priority 3 (`priority:medium`) + the labels below classify as category
      # `other` in scripts/lib/classify-issue.mjs => route 'queue' =>
      # `agent:fix-queued` + `fu-prio:low`. Do NOT raise to priority:high or add
      # `parser-broken`: combined with a crawler/parser word in the title that
      # would jump the anti-starvation queue into the immediate `agent:fix` route.
      - name: Open / update the tracking issue
        if: steps.body.outputs.action == 'alert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Job description locale quality: daily snapshot" \
            --description "$(cat /tmp/jdl/body.md)" \
            --priority 3 \
            --label job-description-locale \
            --label bug \
            --reopen-within-hours 72 \
            --workflow "${{ github.workflow }}"

      # THE CLOSER. Identical literal title to the opener above, so
      # resolveGithubIssue() matches the same canonical issue createGithubIssue()
      # deduped on. No-op when nothing is open, hence safe on every healthy run.
      - name: Close the tracking issue once the rate is healthy
        if: steps.body.outputs.action == 'resolve'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Job description locale quality: daily snapshot" \
            --resolve \
            --run-url "$RUN_URL" \
            --workflow "${{ github.workflow }}"

      - name: Report audit crash to GitHub Issues
        if: steps.audit.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Job description locale audit crashed
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          \`scripts/audit-job-description-locale.mjs\` exited non-zero — no snapshot produced this run. Check that \`data/jobs.json\` assembled." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      - name: Fail job if audit crashed
        if: steps.audit.outcome != 'success'
        run: |
          echo "::error::job description locale audit crashed — see the issue opened above."
          exit 1