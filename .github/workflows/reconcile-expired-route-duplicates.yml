name: Reconcile Expired Route Duplicates

# The expired archive is a collection of crawler-owned slices. A dedicated,
# serialized writer is the only safe place for the historical route collapse:
# it can sweep every slice without racing the daily crawler commits, then push
# only the changed slices through the standard data commit helper.
on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, before the regular stale-job cleanup.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report duplicate routes without persisting repairs.'
        required: false
        type: boolean
        default: false

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials for push auth
        if: ${{ inputs.dry_run != true }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: ${{ inputs.dry_run != true }}
        run: node scripts/load-rc-env.mjs

      - name: Sweep expired slices (dry run)
        if: ${{ inputs.dry_run == true }}
        run: node scripts/reconcile-crawler-company-ownership.mjs --expired-sweep

      - name: Sweep expired slices and reconcile ownership
        if: ${{ inputs.dry_run != true }}
        run: node scripts/reconcile-crawler-company-ownership.mjs --expired-sweep --apply

      - name: Reassemble dataset
        if: ${{ inputs.dry_run != true }}
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Audit expired archive
        if: ${{ inputs.dry_run != true }}
        run: node scripts/audit-expired-at-parsable.mjs

      - name: Test gate (bot-direct-to-main)
        if: ${{ inputs.dry_run != true }}
        run: npm test

      - name: Commit and push changed slices
        if: ${{ inputs.dry_run != true }}
        id: commit
        run: |
          SKIP_AI_TRANSLATION=1 bash scripts/lib/git-commit-data.sh --slice-only \
            "chore(data): reconcile expired archive route ownership" \
            data/jobs/expired/by-crawler
        env:
          SKIP_AI_TRANSLATION: '1'

      - name: Trigger deploy if data changed
        if: steps.commit.outputs.has_changes == 'true' && inputs.dry_run != true
        run: bash scripts/lib/trigger-deploy.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
