name: Reconcile Expired Route Duplicates

# The expired archive is a collection of crawler-owned slices. A dedicated,
# serialized writer is the only safe place for the historical route collapse:
# it can sweep every slice without racing the daily crawler commits, then push
# only the changed slices through the standard data commit helper.
on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, before the regular stale-job cleanup.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report duplicate routes without persisting repairs.'
        required: false
        type: boolean
        default: true
      human_approval:
        description: 'Explicit human approval for expired-route repair writes.'
        required: false
        type: boolean
        default: false

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Require human approval for expired-route side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: reconcile-expired-route-duplicates
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials for push auth
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Sweep expired slices (dry run)
        if: steps.side_effect_gate.outputs.effective_dry_run == 'true'
        run: node scripts/reconcile-crawler-company-ownership.mjs --expired-sweep

      - name: Sweep expired slices and reconcile ownership
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/reconcile-crawler-company-ownership.mjs --expired-sweep --apply

      - name: Reassemble dataset
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Audit expired archive
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/audit-expired-at-parsable.mjs

      - name: Test gate (reconciler and commit contract)
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          set -euo pipefail
          # This is a data-only writer. Run its deterministic route, archive,
          # parsability, and slice-commit contracts; the broad application
          # suite needs services/artifacts this job does not provision.
          npx vitest run \
            tests/reconcile-crawler-company-ownership.test.ts \
            tests/cleanup-jobs-archive-dedup-losers.test.ts \
            tests/expired-at-parsable.test.ts \
            tests/git-commit-data-slice-scoping.test.ts \
            --reporter=dot

      - name: Commit and push changed slices
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        id: commit
        run: |
          SKIP_AI_TRANSLATION=1 bash scripts/lib/git-commit-data.sh --slice-only \
            "chore(data): reconcile expired archive route ownership" \
            data/jobs/expired/by-crawler
        env:
          SKIP_AI_TRANSLATION: '1'

      - name: Verify persisted expired archive convergence
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          pushed_commit="${{ steps.commit.outputs.final_commit }}"
          persisted_sha="$(git rev-parse origin/main)"
          if [ -n "$pushed_commit" ] && ! git merge-base --is-ancestor "$pushed_commit" "$persisted_sha"; then
            echo "::error::commit $pushed_commit is not reachable from origin/main $persisted_sha after the writer push"
            exit 1
          fi

          verify_root="$(mktemp -d)"
          trap 'rm -rf -- "$verify_root"' EXIT
          git archive --format=tar "$persisted_sha" data/jobs/expired/by-crawler | tar -x -C "$verify_root"
          PERSISTED_SHA="$persisted_sha" VERIFY_ROOT="$verify_root" node --input-type=module <<'NODE'
          import path from 'node:path';
          import { sweepExpiredArchiveSlices } from './scripts/reconcile-crawler-company-ownership.mjs';

          const report = sweepExpiredArchiveSlices({
            dir: path.join(process.env.VERIFY_ROOT, 'data/jobs/expired/by-crawler'),
            apply: false,
          });
          const summary = {
            verifiedCommit: process.env.PERSISTED_SHA,
            filesScanned: report.filesScanned,
            filesChanged: report.filesChanged,
            capRefused: report.capRefused,
            crossSliceDuplicatesBefore: report.crossSliceDuplicatesBefore,
            crossSliceDuplicatesAfter: report.crossSliceDuplicatesAfter,
          };
          console.log(JSON.stringify(summary, null, 2));
          if (report.filesChanged !== 0 || report.crossSliceDuplicatesAfter !== 0) {
            throw new Error(
              `expired archive not converged: filesChanged=${report.filesChanged}, crossSliceDuplicatesAfter=${report.crossSliceDuplicatesAfter}`,
            );
          }
          NODE

      - name: Trigger deploy if data changed
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: bash scripts/lib/trigger-deploy.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
