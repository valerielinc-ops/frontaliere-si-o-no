name: Fast Publish Article (near-instant single-article shard push)

# Issue #4837 stream C — "article committed to main" → "article live in all
# 4 locales" today means waiting on the FULL deploy.yml build (npm ci +
# whole-site SSG build + all locale/section shard pushes), 30min-2h04m37s in
# the worst measured run (see scripts/notify-journalist-article-live.mjs's
# ORPHAN_THRESHOLD_MS comment). This workflow renders + pushes ONLY the one
# article's own locale shards (frontaliere-articolifrontaliere-<loc> /
# frontaliere-articolisvizzera-<loc>), skipping the full build entirely. The
# full deploy.yml/deploy-publish.yml chain still runs additively afterwards
# (triggered separately by the caller) and remains the source of truth for
# sitemap/RSS/search-index regeneration — this workflow is a fast PREVIEW
# push, not a replacement, EXCEPT for the handful of exact apex paths
# registered in locale-router.js's EDGE_PUSHED_FILES (issue #4881 Fase 3):
# for those, "Publish edge files" below pushes a live-serving R2 copy so the
# Worker's pushable-origin dispatch serves it immediately, instead of waiting
# for the next full deploy — narrowly scoped rollout (/sitemap-blog-ch.xml +
# the llms.txt family, see that table's own comment for the full list), not a
# change to how the rest of this workflow works.
#
# Depends on (stream A / stream B contracts):
#   scripts/publish-article-fast.mjs        — renders one article's 4 locale
#                                              HTML pages + a summary JSON
#   scripts/lib/push-article-shard-incremental.sh — merge-only shard push
#   scripts/lib/upload-cdn-file.sh          — single-file R2 PUT
#   scripts/publish-edge-files.mjs          — pushable-origin PUT (sitemap/RSS
#                                              + generated llms.txt family)
#                                              + targeted edge-cache purge

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Article id to fast-publish'
        required: true
        type: string
      section:
        description: 'Article section (determines which shard repos + registry file)'
        required: true
        type: choice
        options:
          - frontaliere
          - svizzera
      sha:
        description: 'Commit SHA to check out (default: the SHA main was at when this run was dispatched)'
        required: false
        type: string

# Serialize per ARTICLE, not per section.
#
# This group was originally `fast-publish-${{ inputs.section }}` with the stated
# intent that "a QUEUED second run must still complete and push its own article
# rather than being cancelled". A per-section group cannot deliver that: GitHub
# holds exactly ONE pending run per concurrency group, so when a third run is
# queued the pending one is CANCELLED. Any producer that dispatches several
# articles at once therefore loses the middle ones silently:
#   - publish-journalist-articles.yml dispatches one run per id in
#     `published_ids`, and a single 15-min cron window can publish several;
#   - scripts/reconcile-fast-publish-articles.mjs dispatches one run per article
#     registered since the deploy's build SHA — by construction a backlog.
# Both are exactly the paths that exist to guarantee completeness. This is the
# same starvation that motivated the whole feature: deploy.yml's own
# `pages-build-run` group dropped 12 consecutive queued runs on 2026-07-28.
#
# Concurrent runs for DIFFERENT articles are safe against the same shard repo:
# push-article-shard-incremental.sh never force-pushes and builds its commit on
# the remote tip, so a loser gets a non-fast-forward, re-clones onto the new tip
# and rebuilds (exercised by its concurrent-writer test). Two runs for the SAME
# article still serialize here, which is the only race worth preventing.
concurrency:
  group: fast-publish-${{ inputs.section }}-${{ inputs.article_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fast-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # shard-secrets-overflow: same environment deploy.yml's build-locale job
    # declares — repo-level Actions secrets already hit GitHub's 100/repo cap
    # (89 section-shard deploy keys), so the SHARD_ARTICOLIFRONTALIERE_*/
    # SHARD_ARTICOLISVIZZERA_* deploy keys live in this environment's
    # separate 100-slot secrets pool instead. No new secrets needed — reuses
    # the exact keys deploy.yml's own shard-push step already reads.
    environment: shard-secrets-overflow
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — R2/indexing credential load will be limited."
          fi

      # R2 (CDN) credentials + any other provider keys this render path needs
      # are Remote-Config-sourced, same as every other workflow in this repo
      # (scripts/load-rc-env.mjs RC_TO_ENV: R2_ACCOUNT_ID, R2_BUCKET,
      # R2_S3_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY). Deliberately
      # NO `npm ci` anywhere in this job — full dependency install is exactly
      # the cost this workflow exists to avoid. publish-article-fast.mjs runs
      # via `npx -y tsx` (on-demand, no repo install) and the shard-push /
      # CDN-upload scripts are plain bash + Node built-ins.
      - name: Load secrets from Remote Config (R2 + indexing)
        run: node scripts/load-rc-env.mjs

      - name: Render article (fast path)
        id: render
        run: |
          mkdir -p /tmp/fast-publish
          # Pinned to the same major the repo depends on (package.json
          # devDependencies: "tsx": "^4.21.0") so a future tsx major cannot
          # silently change loader behaviour on this un-installed fast path.
          npx -y tsx@4 scripts/publish-article-fast.mjs \
            --id "${{ inputs.article_id }}" \
            --section "${{ inputs.section }}" \
            --out /tmp/fast-publish/dist \
            --summary /tmp/fast-publish/summary.json

      # NEVER blocks the publish. The hero image has a client-side
      # raw.githubusercontent fallback (services/seo/blogImageCdn.ts:81-97) and
      # the next full deploy re-syncs the whole CDN payload anyway, so a failed
      # PUT must degrade to "image 404s for social crawlers until the next
      # deploy", not to "the article never goes live at all".
      - name: Upload CDN assets (images)
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          SUMMARY_PATH=/tmp/fast-publish/summary.json
          UPLOAD_COUNT="$(jq '(.cdnUploads // []) | length' "$SUMMARY_PATH")"
          if [ "$UPLOAD_COUNT" -eq 0 ]; then
            echo "No CDN uploads listed in summary — skipping"
            exit 0
          fi
          fail=0
          for idx in $(seq 0 $((UPLOAD_COUNT - 1))); do
            local_file="$(jq -r ".cdnUploads[$idx].local" "$SUMMARY_PATH")"
            cdn_key="$(jq -r ".cdnUploads[$idx].key" "$SUMMARY_PATH")"
            bash scripts/lib/upload-cdn-file.sh "$local_file" "$cdn_key" || {
              echo "::warning::CDN upload failed for $cdn_key — continuing (asset may 404 until next full deploy)"
              fail=1
            }
          done
          exit "$fail"

      # Mirrors the fault-tolerant parallel-push pattern at deploy.yml
      # (`push-section-shard.sh` loop, MAX_PARALLEL / `|| fail=1` / `wait`) —
      # incident 2026-07-24 (run 30057726623): one section's push failure
      # silently aborted the rest of the loop before it. At most 4 locales
      # here (never 27 sections), so no MAX_PARALLEL batching is needed — all
      # 4 legs are simply backgrounded and waited on individually.
      #
      # `<section>` passed to push-article-shard-incremental.sh is the SHARD
      # section token (articolifrontaliere / articolisvizzera — the
      # scripts/lib/section-shard-slugs.json key), NOT the article-level
      # `frontaliere` / `svizzera` input: this mirrors push-section-shard.sh's
      # own convention of deriving SHARD_<SECTION>_<LOCALE>_DEPLOY_KEY by
      # uppercasing that exact token, so the two scripts resolve the SAME
      # deploy-key secret for the SAME shard repo.
      - name: Push locale shards (parallel, fault-tolerant)
        if: steps.render.outcome == 'success'
        env:
          SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_IT_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_EN_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_DE_DEPLOY_KEY }}
          SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLIFRONTALIERE_FR_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_IT_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_EN_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_DE_DEPLOY_KEY }}
          SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARTICOLISVIZZERA_FR_DEPLOY_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          SUMMARY_PATH=/tmp/fast-publish/summary.json
          DIST_DIR=/tmp/fast-publish/dist
          if [ "${{ inputs.section }}" = "svizzera" ]; then
            SHARD_SECTION="articolisvizzera"
          else
            SHARD_SECTION="articolifrontaliere"
          fi

          fail=0
          pids=(); names=()
          while IFS= read -r shard_json; do
            locale="$(jq -r '.locale' <<<"$shard_json")"
            mapfile -t rel_paths < <(jq -r '.paths[]' <<<"$shard_json")
            bash scripts/lib/push-article-shard-incremental.sh "$SHARD_SECTION" "$locale" "$DIST_DIR" "${rel_paths[@]}" &
            pids+=("$!"); names+=("$locale")
          done < <(jq -c '.shards[]' "$SUMMARY_PATH")

          for idx in "${!pids[@]}"; do
            wait "${pids[$idx]}" || { echo "::warning::${names[$idx]}-${SHARD_SECTION} shard push failed — continuing to the next locale"; fail=1; }
          done
          exit "$fail"

      # Only pings search engines once the pages are CONFIRMED live — never
      # before. This is the exact ordering bug fast-publish-article.yml fixes
      # relative to generate-article.yml's old "Notify Google Indexing API"
      # step (removed in the same change — see that workflow's comment),
      # which pinged immediately after dispatching deploy.yml on the false
      # assumption "deploy takes ~2-3 min" (worst measured deploy:
      # 2h04m37s — Google was being sent to crawl a 404).
      - name: Verify shard URLs are live
        id: verify
        if: steps.render.outcome == 'success'
        run: node scripts/wait-for-live-article-shards.mjs /tmp/fast-publish/summary.json

      # Deliberately NOT publishing the client-side data chunks here (#4881 Fase
      # 3-bis, reverted). The page shards rendered above are self-contained static
      # HTML and need nothing from this job. The registry does not: the app imports
      # data/blog-articles-data.ts both statically and dynamically, so Rollup emits
      # the chunk with a generated namespace export and rewrites the dynamic site to
      # `.then(m => m.blogArticlesData)`. A standalone esbuild build of the same
      # source carries only `ARTICLES`, so that pick resolved to `undefined` and every
      # article page sat on its loading skeleton until the next full deploy overwrote
      # the chunk — silently, because the resulting TypeError bypassed the chunk-load
      # recovery path (#4959).
      #
      # Re-enabling out-of-band registry publishing requires a stable, hand-authored
      # export contract that a separately built package can satisfy — not a chunk
      # whose shape is a Rollup implementation detail. Until then the full deploy
      # publishes the complete, internally consistent client asset graph atomically.
      #
      # The news-ticker payload is a different kind of artifact and keeps shipping here:
      # plain JSON on a stable, hand-authored contract, so no build-shape skew is
      # possible. --ticker-only builds the registry in a temp dir purely to compute it
      # and uploads nothing else.
      - name: Publish news-ticker payload
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: npx -y tsx@4 scripts/publish-article-chunks.mjs --ticker-only

      # Issue #4881 Fase 3 (pushable-origin edge files). Independent of the
      # per-article render above: public/sitemap-blog-ch.xml was already
      # regenerated and committed by scripts/create-article.mjs in the SAME
      # commit checked out at the top of this job. The llms.txt family
      # (added as a residual — see EDGE_PUSHED_FILES's own comment in
      # locale-router.js) is NOT committed by create-article.mjs at all;
      # publish-edge-files.mjs renders it itself into a scratch dir (via
      # `npx -y tsx@4 scripts/generate-llms-txt.mjs`, spawned internally —
      # no separate step needed here) before PUTting it, same as the
      # already-committed sitemap file. Gated on render only to match this
      # file's own convention of not running later steps once an earlier
      # ungated step has failed the job. NEVER blocks the publish: a failed
      # render/PUT/purge here just means those apex paths keep serving their
      # previous R2 copy (or fall open to the origin passthrough) until this
      # step succeeds on a later run or the next full deploy.
      - name: Publish edge files (sitemap/RSS + llms.txt pushable origin)
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: node scripts/publish-edge-files.mjs

      # Google Indexing API AND IndexNow (Bing/Yandex), with the same verified
      # URL list. IndexNow is included deliberately: its normal driver
      # (scripts/submit-indexnow.js) discovers URLs from the DEPLOYED SITEMAPS,
      # which are apex-only artifacts that do not change until the next full
      # deploy — so without a direct submit here a fast-published article would
      # reach Google in minutes and Bing/Yandex only hours later.
      - name: Notify search engines (Google Indexing API + IndexNow)
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/notify-article-search-engines.mjs --summary /tmp/fast-publish/summary.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: Fast Publish Article" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Article:** ${{ inputs.article_id }} (section=${{ inputs.section }})
          **SHA:** ${{ inputs.sha || github.sha }}

          Il fast-publish è fallito — l'articolo resta pubblicato SOLO tramite il deploy.yml completo (30min-2h)." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
