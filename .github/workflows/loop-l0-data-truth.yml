name: Loop L0 data truth

on:
  schedule:
    - cron: '7 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l0-data-truth.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/articles-api-base.mjs'
      - '.github/workflows/loop-l0-data-truth.yml'
  pull_request:
    paths:
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l0-data-truth.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/articles-api-base.mjs'
      - '.github/workflows/loop-l0-data-truth.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when the manifest is unusable'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l0-data-truth
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/public/images/
            !/data/
            /data/loop-fleet/
            !/packages/articles/content/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      - name: Audit corpus manifest
        id: audit-manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l0
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --strict --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json)
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue)
          else
            args+=(--dry-run)
          fi
          node scripts/ci/loop-l0-data-truth.mjs "${args[@]}" | tee "$REPORT_DIR/stdout.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Decide whether stale-manifest recovery is needed
        if: always()
        id: stale-recovery
        env:
          AUDIT_OUTCOME: ${{ steps.audit-manifest.outcome }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l0
        run: |
          set -euo pipefail
          quality=''
          result="$REPORT_DIR/l0-result.json"
          if [ -s "$result" ]; then
            quality="$(jq -r '.quality // empty' "$result" 2>/dev/null || true)"
          fi
          needed=false
          if [ "$AUDIT_OUTCOME" = 'failure' ] && [ "$quality" = 'stale' ]; then
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
      - name: Prepare Firebase credentials for stale-manifest recovery
        if: always() && steps.stale-recovery.outputs.needed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load publisher recovery credentials'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load publisher recovery credentials from Remote Config
        if: always() && steps.stale-recovery.outputs.needed == 'true'
        run: node scripts/load-rc-env.mjs
      - name: Request bounded publisher recovery for stale manifest
        if: always() && steps.stale-recovery.outputs.needed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTICLE_PUBLISHER_REPLAY_ISSUE_KIND: l0
          ARTICLE_PUBLISHER_REPLAY_TRIGGER: the stale L0 manifest verdict
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l0
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo '::error::GITHUB_PAT_NANAKO missing from Remote Config — cannot request publish-api recovery'
            exit 1
          fi
          reason="$(jq -r '.reason // "stale corpus manifest"' "$REPORT_DIR/l0-result.json")"
          GATE_REASON="$reason" PUBLISHER_GH_TOKEN="$GITHUB_PAT_NANAKO" \
            node scripts/ci/request-article-publisher-replay.mjs
      - name: Record canonical L0 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l0
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L0 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L0 observation and decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loop-l0-data-truth-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l0/
          retention-days: 90
          if-no-files-found: error
