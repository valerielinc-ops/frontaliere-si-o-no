name: Newsletter QA Gate

on:
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    # QA assembly plus the generated-report push exceeded 15 minutes during
    # the main-writer convoy (#10547); keep diagnostics and report publication
    # inside a bounded but useful 25-minute window.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON missing — proceeding without secrets"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Assemble jobs dataset
        continue-on-error: true
        run: node scripts/assemble-jobs-dataset.mjs 2>&1 || echo "⚠️ Jobs assembly failed"

      - name: Run newsletter QA
        run: node scripts/newsletter-qa.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Open PR with newsletter QA report
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/newsletter-qa-report-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Pubblica il report QA e gli screenshot tramite il branch stabile \`chore/refresh-newsletter-qa\`, così il required check \`vitest (unit + integration)\` valida gli artefatti prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          Nessuno — il report generato viene pubblicato tramite la PR stabile.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path docs/newsletter-qa/ \
            --branch chore/refresh-newsletter-qa \
            --commit-message "chore(newsletter): publish QA report" \
            --title "chore(newsletter): publish QA report" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
