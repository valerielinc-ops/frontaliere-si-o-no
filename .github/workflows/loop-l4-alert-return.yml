name: Loop L4 alert to return

on:
  schedule:
    - cron: '11 9 * * *'
  push:
    branches: [main]
    paths:
      - 'data/alert-config.json'
      - 'data/alert-snoozes.json'
      - 'data/alert-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l4-alert-return.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/send-job-alerts.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/app-error-recency.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'functions/src/jobAlertBackfillCore.js'
      - 'functions/src/lib/subscriberConsent.js'
      - 'functions/src/lib/emailSuppression.js'
      - 'functions/src/lib/newsletterOptOut.js'
      - 'functions/src/lib/subscriberPersonalization.js'
      - 'functions/src/lib/jobBoardUrlCanton.js'
      - 'functions/src/lib/cantonUrlSlugs.json'
      - 'functions/src/lib/subscriberLocale.js'
      - 'functions/src/emailI18n.js'
      - 'functions/src/lib/syntheticClicks.js'
      - 'functions/src/lib/emailScannerRanges.js'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/loop-fleet-issue.mjs'
      - '.github/workflows/loop-l4-alert-return.yml'
  pull_request:
    paths:
      - 'data/alert-config.json'
      - 'data/alert-snoozes.json'
      - 'data/alert-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l4-alert-return.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/app-error-recency.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'functions/src/jobAlertBackfillCore.js'
      - 'functions/src/lib/subscriberConsent.js'
      - 'functions/src/lib/emailSuppression.js'
      - 'functions/src/lib/newsletterOptOut.js'
      - 'functions/src/lib/subscriberPersonalization.js'
      - 'functions/src/lib/jobBoardUrlCanton.js'
      - 'functions/src/lib/cantonUrlSlugs.json'
      - 'functions/src/lib/subscriberLocale.js'
      - 'functions/src/emailI18n.js'
      - 'functions/src/lib/syntheticClicks.js'
      - 'functions/src/lib/emailScannerRanges.js'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/loop-fleet-issue.mjs'
      - '.github/workflows/loop-l4-alert-return.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when alert return evidence is not safe'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l4-alert-return
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alert inputs
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/alert-config.json
            /data/alert-snoozes.json
            /data/alert-outcomes.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l4-alert-return.mjs
            /scripts/ci/export-loop-outcomes.mjs
            /scripts/lib/ga4-service-account.mjs
            /scripts/lib/app-error-recency.mjs
            /scripts/lib/analytics-settled-window.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /scripts/lib/loop-fleet-issue.mjs
            /functions/src/jobAlertBackfillCore.js
            /functions/src/lib/subscriberConsent.js
            /functions/src/lib/emailSuppression.js
            /functions/src/lib/newsletterOptOut.js
            /functions/src/lib/subscriberPersonalization.js
            /functions/src/lib/jobBoardUrlCanton.js
            /functions/src/lib/cantonUrlSlugs.json
            /functions/src/lib/subscriberLocale.js
            /functions/src/emailI18n.js
            /functions/src/lib/syntheticClicks.js
            /functions/src/lib/emailScannerRanges.js
            /.github/workflows/loop-l4-alert-return.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"

      # I push che toccano soltanto codice dell'audit o i suoi input non devono
      # rileggere Firestore e non devono registrare un'evidenza basata su dati
      # vecchi. Il confronto usa git, perche' il filtro del trigger non espone
      # i path cambiati allo job. Un push che cambia l'export o questo workflow
      # mantiene invece il percorso live necessario per verificare la modifica.
      - name: Determina il perimetro della misura L4
        id: l4-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          L4_EXPORT_PERIMETER: |
            .github/workflows/loop-l4-alert-return.yml
            data/alert-config.json
            data/alert-snoozes.json
            functions/src/emailI18n.js
            functions/src/jobAlertBackfillCore.js
            functions/src/lib/cantonUrlSlugs.json
            functions/src/lib/emailSuppression.js
            functions/src/lib/jobBoardUrlCanton.js
            functions/src/lib/newsletterOptOut.js
            functions/src/lib/subscriberConsent.js
            functions/src/lib/subscriberLocale.js
            functions/src/lib/subscriberPersonalization.js
            scripts/ci/export-loop-outcomes.mjs
            scripts/lib/analytics-settled-window.mjs
            scripts/lib/ga4-service-account.mjs
        run: |
          set -euo pipefail
          safe_live_path() {
            echo 'run_export=true' >> "$GITHUB_OUTPUT"
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            echo "::notice::L4 percorso live prudente: impossibile determinare i path cambiati ($1); eseguo export e audit"
          }
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            echo 'run_export=false' >> "$GITHUB_OUTPUT"
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != 'push' ]; then
            echo 'run_export=true' >> "$GITHUB_OUTPUT"
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = '0000000000000000000000000000000000000000' ]; then
            if ! changed_paths=$(git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA"); then
              safe_live_path 'il diff del commit iniziale ha fallito'
              exit 0
            fi
          else
            if ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              safe_live_path 'il fetch del commit precedente ha fallito'
              exit 0
            fi
            if ! changed_paths=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA"); then
              safe_live_path 'il diff tra commit non ha potuto essere calcolato'
              exit 0
            fi
          fi
          if printf '%s\n' "$changed_paths" | grep -F -x -f <(printf '%s\n' "$L4_EXPORT_PERIMETER") >/dev/null; then
            echo 'run_export=true' >> "$GITHUB_OUTPUT"
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_export=false' >> "$GITHUB_OUTPUT"
            echo 'run_audit=false' >> "$GITHUB_OUTPUT"
            echo "::notice::L4 saltato: il push non cambia l'export ne' il workflow; nessuna misura o evidenza viene registrata"
          fi

      - name: Prepare read-only Firebase credentials
        if: steps.l4-scope.outputs.run_export == 'true' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set; recording an explicitly unavailable alert outcome"
            echo 'LOOP_FLEET_L4_EXPORT_UNAVAILABLE=1' >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Export fresh L4 outcomes
        if: always() && steps.l4-scope.outputs.run_export == 'true'
        run: |
          set -euo pipefail
          output_path="$RUNNER_TEMP/alert-outcomes.json"
          if [ "${LOOP_FLEET_L4_EXPORT_UNAVAILABLE:-0}" = '1' ]; then
            node scripts/ci/export-loop-outcomes.mjs --loop L4 --unavailable --out "$output_path" --reason 'Firebase read-only credentials unavailable'
            exit 0
          fi
          set +e
          node scripts/ci/export-loop-outcomes.mjs --loop L4 --config data/alert-config.json --snoozes data/alert-snoozes.json --out "$output_path"
          export_code=$?
          set -e
          if [ "$export_code" -ne 0 ]; then
            echo '::warning::L4 live alert-delivery export failed; recording an explicitly unavailable outcome'
            node scripts/ci/export-loop-outcomes.mjs --loop L4 --unavailable --out "$output_path" --reason 'live Firestore alert-delivery export failed'
          fi
      - name: Audit alert to return
        if: steps.l4-scope.outputs.run_audit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l4
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          outcomes_path=data/alert-outcomes.json
          if [ "${{ github.event_name }}" != "pull_request" ]; then outcomes_path="$RUNNER_TEMP/alert-outcomes.json"; fi
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --config data/alert-config.json --snoozes data/alert-snoozes.json --outcomes "$outcomes_path")
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l4-alert-return.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l4-result.json" >/dev/null 2>&1; then
            echo 'L4 finding persisted; only reversible suppress/defer recommendations were produced and no message was sent.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Record canonical L4 evidence
        if: always() && steps.l4-scope.outputs.run_audit == 'true'
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l4
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L4 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L4 observation and actions
        if: always() && steps.l4-scope.outputs.run_audit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: loop-l4-alert-return-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l4/
          retention-days: 90
          if-no-files-found: error
