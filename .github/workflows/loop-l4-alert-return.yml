name: Loop L4 alert to return

on:
  schedule:
    - cron: '11 9 * * *'
  push:
    branches: [main]
    paths:
      - 'data/alert-config.json'
      - 'data/alert-snoozes.json'
      - 'data/alert-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l4-alert-return.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l4-alert-return.yml'
  pull_request:
    paths:
      - 'data/alert-config.json'
      - 'data/alert-snoozes.json'
      - 'data/alert-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l4-alert-return.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l4-alert-return.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when alert return evidence is not safe'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l4-alert-return
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alert inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/alert-config.json
            /data/alert-snoozes.json
            /data/alert-outcomes.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l4-alert-return.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /.github/workflows/loop-l4-alert-return.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Audit alert to return
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l4
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --config data/alert-config.json --snoozes data/alert-snoozes.json --outcomes data/alert-outcomes.json)
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l4-alert-return.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l4-result.json" >/dev/null 2>&1; then
            echo 'L4 finding persisted; only reversible suppress/defer recommendations were produced and no message was sent.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Record canonical L4 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l4
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L4 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L4 observation and actions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l4-alert-return-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l4/
          retention-days: 90
          if-no-files-found: error
