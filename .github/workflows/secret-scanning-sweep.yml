name: Secret scanning sweep

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non disponibile"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load owner tokens from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Sweep valerielinc-ops repositories
        env:
          SECRET_SCAN_OWNER: valerielinc-ops
          SECRET_SCAN_FAIL_ON_UNAVAILABLE: 'true'
          SECRET_SCAN_ALLOWED_UNAVAILABLE: ''
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT non caricato da Remote Config"
            exit 1
          fi
          SECRET_SCAN_TOKEN="$GITHUB_PAT" node scripts/ci/monitor-secret-alerts.mjs

      - name: Sweep nanakokyobashi-rgb repositories
        env:
          SECRET_SCAN_OWNER: nanakokyobashi-rgb
          SECRET_SCAN_FAIL_ON_UNAVAILABLE: 'true'
          SECRET_SCAN_ALLOWED_UNAVAILABLE: 'nanakokyobashi-rgb/frontaliere-reddit-devvit'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config"
            exit 1
          fi
          SECRET_SCAN_TOKEN="$GITHUB_PAT_NANAKO" node scripts/ci/monitor-secret-alerts.mjs
