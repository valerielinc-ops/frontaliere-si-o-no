name: Secret scanning sweep

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # il reporter apre/aggiorna la issue di fallimento
  actions: read # la jobs API che il reporter usa per il body diagnostico

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non disponibile"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load owner tokens from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Sweep valerielinc-ops repositories
        id: sweep_valerielinc
        continue-on-error: true
        env:
          SECRET_SCAN_OWNER: valerielinc-ops
          SECRET_SCAN_FAIL_ON_UNAVAILABLE: 'true'
          SECRET_SCAN_ALLOWED_UNAVAILABLE: ''
          SECRET_SCAN_DIAG_FILE: secret-sweep-diag.txt
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT non caricato da Remote Config"
            exit 1
          fi
          SECRET_SCAN_TOKEN="$GITHUB_PAT" node scripts/ci/monitor-secret-alerts.mjs

      - name: Sweep nanakokyobashi-rgb repositories
        id: sweep_nanakokyobashi
        if: always()
        continue-on-error: true
        env:
          SECRET_SCAN_OWNER: nanakokyobashi-rgb
          SECRET_SCAN_FAIL_ON_UNAVAILABLE: 'true'
          SECRET_SCAN_ALLOWED_UNAVAILABLE: 'nanakokyobashi-rgb/frontaliere-reddit-devvit'
          SECRET_SCAN_DIAG_FILE: secret-sweep-diag.txt
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config"
            exit 1
          fi
          SECRET_SCAN_TOKEN="$GITHUB_PAT_NANAKO" node scripts/ci/monitor-secret-alerts.mjs

      - name: Fail if any owner sweep failed
        if: always()
        env:
          VALERIELINC_OUTCOME: ${{ steps.sweep_valerielinc.outcome }}
          NANAKOKYOBASHI_OUTCOME: ${{ steps.sweep_nanakokyobashi.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$VALERIELINC_OUTCOME" != success ]; then
            echo "::error::Sweep valerielinc-ops non riuscita (outcome: $VALERIELINC_OUTCOME)"
            failed=1
          fi
          if [ "$NANAKOKYOBASHI_OUTCOME" != success ]; then
            echo "::error::Sweep nanakokyobashi-rgb non riuscita (outcome: $NANAKOKYOBASHI_OUTCOME)"
            failed=1
          fi
          exit "$failed"

      # Il file di diagnosi porta repository, numero e tipo di ogni alert
      # aperto (mai il valore): senza, la issue nominava solo lo step qui sopra
      # e per sapere QUALE alert bisognava aprire il log.
      - name: Report failure to GitHub Issues
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: 'CI Failure: Secret scanning sweep'
          closed-by: close-recovered-failure-issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '2'
          labels: Bug
          diag-file: secret-sweep-diag.txt
          context: |
            La sweep ha trovato alert di secret scanning APERTI, oppure un
            repository su cui il secret scanning non è monitorabile e che non è
            fra i gap dichiarati. L'estratto elenca repository, numero e tipo di
            ogni alert; il valore rilevato non viene mai scritto.

            Un alert si chiude ruotando la credenziale (se è nostra) o
            risolvendolo su GitHub con la motivazione corretta (credenziale di
            terzi in una fixture: va anche redatta nel file). Il gate che lo
            previene sulle PR è `tests/no-hardcoded-secrets.test.ts`.
