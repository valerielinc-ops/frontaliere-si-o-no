name: Telegram Channel Broadcast

# Free Bot API broadcast to the Telegram channel:
#   • daily  06:30 UTC (08:30 CEST) → "jobs of the day" digest
#   • weekly Mon 07:00 UTC (09:00 CEST) → best/worst dogane ranking (week ended)
#   • manual (workflow_dispatch only) → 'preferred-source': one-off
#     announcement, deduped by data/telegram-posted-announcements.json so
#     re-dispatching never double-posts.
#
# Fail-soft by design: with no TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID in
# Remote Config the poster logs a clean skip and exits 0 — the whole pipeline
# is in place; activation is a one-time owner config (create bot + channel,
# store the token in RC). CI stays GREEN with no token.
#
# workflow_dispatch defaults to dry_run=true (preview only) for safe manual
# testing. Scheduled runs send for real (subject to the token being present).

on:
  schedule:
    - cron: '30 6 * * *'   # daily jobs digest
    - cron: '0 7 * * 1'    # weekly dogane ranking (Monday)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to broadcast'
        required: false
        default: 'jobs'
        type: choice
        options: ['jobs', 'border', 'preferred-source']
      dry_run:
        description: 'Preview only (no Telegram API call)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
concurrency:
  group: telegram-channel-broadcast
  cancel-in-progress: false

permissions:
  contents: write  # commit data/telegram-posted-jobs.json (jobs mode)
  pull-requests: write
  issues: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    # Raised from 10 → 20 (#6182): same dataset-growth pattern as
    # fb-jobs-daily-schedule.yml (#4764) and reddit-jobs-daily-schedule.yml —
    # this job's daily (jobs) mode also runs `assemble-jobs-dataset.mjs
    # --stats` on a full checkout (sparse removed in #6133, above the 1.5GB
    # crossover), so it shares the same shrinking margin as its two siblings.
    # The ledger push can spend several minutes in the shared main-writer
    # retry convoy after assembly; 20 minutes was cut off at 12m10s in #10543.
    timeout-minutes: 30
    env:
      APPROVAL_TRUSTED_SCHEDULE: 'true'
      # Weekly cron ⇒ border; daily cron / manual ⇒ input or 'jobs'.
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 7 * * 1' && 'border' || 'jobs') }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from RC
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Resolve real-send flag
        env:
          ALLOW_SIDE_EFFECT: ${{ github.event_name != 'schedule' || env.APPROVAL_TRUSTED_SCHEDULE == 'true' }}
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' || (github.event_name == 'schedule' && env.APPROVAL_TRUSTED_SCHEDULE != 'true') }}
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            echo "TELEGRAM_SEND=" >> "$GITHUB_ENV"
          else
            echo "TELEGRAM_SEND=1" >> "$GITHUB_ENV"
          fi

      - name: Assemble jobs dataset
        if: env.MODE == 'jobs'
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Broadcast jobs digest
        if: env.MODE == 'jobs' && (inputs.dry_run != true && inputs.dry_run != 'true')
        run: node scripts/post-to-telegram.mjs jobs

      - name: Broadcast dogane ranking
        if: env.MODE == 'border' && (inputs.dry_run != true && inputs.dry_run != 'true')
        run: npx --no-install tsx scripts/post-to-telegram.mjs border

      - name: Broadcast preferred-source announcement
        if: env.MODE == 'preferred-source' && (inputs.dry_run != true && inputs.dry_run != 'true')
        run: node scripts/post-to-telegram.mjs preferred-source

      - name: Open PR with posted ledgers
        if: success() && inputs.dry_run != true && inputs.dry_run != 'true' && (env.MODE == 'jobs' || env.MODE == 'preferred-source') && (github.event_name != 'schedule' || env.APPROVAL_TRUSTED_SCHEDULE == 'true')
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/telegram-channel-ledgers-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il broadcast aggiorna i ledger dei messaggi pubblicati tramite il branch stabile `chore/telegram-channel-ledgers`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — ledger automatizzati, senza residui.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/telegram-posted-jobs.json \
            --path data/telegram-posted-announcements.json \
            --branch chore/telegram-channel-ledgers \
            --commit-message "chore(telegram): track posted jobs/announcements" \
            --title "chore(telegram): track posted jobs and announcements" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
