name: Discover 404s via Cloudflare

# Third producer for the sharded data/seo-404-compat/ store (beside the two GSC-based
# sweeps). Cloudflare edge analytics records EVERY real 404 hit — including the
# zero-impression long tail GSC never surfaces — with no GSC quota. Paths the
# resolver can map get a reconciled soft-landing/bridge page at the next build.
#
# Only status-404 is read (the producer bounds min=max=404) so the intermittent
# shard 5xx on LIVE /en /de /fr pages can never leak into the 404 reconciler.
# Same prune-before-publication gate as discover-404s.yml keeps the committed-
# snapshot test green before the data PR is opened.

on:
  schedule:
    # Daily at 03:40 UTC — off-peak, after discover-404s (02:15) so the two
    # 404 producers don't race on the same accumulator file.
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      min_count:
        description: 'Skip 404 paths hit fewer than this many times (noise floor)'
        required: false
        type: string
        default: '2'
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: true

# Serialize this workflow's own runs. Cross-workflow races with the other
# compat-file writers (discover-404s.yml, sync-gsc-orphans.yml) are resolved by
# the PR merge path after each writer's own validation; the two 404 producers
# keep independent stable branches so neither can overwrite the other's PR.
concurrency:
  group: discover-404s-cloudflare
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      # Primary identity for the PR publisher below = GitHub App installation
      # token (`frontaliere-automation[bot]`): auto-mints, no expiry babysit, and
      # its dispatch re-triggers deploy.yml just like the PAT (no GITHUB_TOKEN
      # anti-recursion). Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run Cloudflare 404 sweep
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          # CF_API_TOKEN (Zone→Analytics→Read) + CF_ACCOUNT_ID are hydrated from
          # Remote Config by the previous step.
          MIN_COUNT: ${{ inputs.min_count || '2' }}
        run: |
          node scripts/discover-404s-via-cloudflare.mjs \
            --min-count="$MIN_COUNT" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Refresh CF-hot 404 list (bounded bridge recovery)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          # CF_API_TOKEN persisted to $GITHUB_ENV by the load-rc-env step above.
          CF_API_TOKEN: ${{ env.CF_API_TOKEN }}
        # Accumulate the non-Ticino job 404s Cloudflare confirms are actually
        # hit, ranked by hit count and hard-capped → cfHot404BridgePlugin emits
        # a bounded set of bridge pages (the traffic-targeted replacement for
        # the reverted #2000 full-symmetry sweep that OOM'd the SSG build).
        run: |
          node scripts/build-cf-hot-404s.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Prune non-resolving 404-compat paths (keep test invariant green)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        # Same gate as discover-404s.yml: the sweep appends raw 404 URLs; any the
        # resolver can't map (bot-probe junk like /wp-admin/install.php) would
        # break tests/search-console-compat.test.ts → main red. The resolver
        # uses committed static registries, so avoid assembling the ~400 MB
        # crawler-slice corpus in this compatibility-only writer.
        run: npx --no-install tsx scripts/prune-404-compat-paths.ts

      - name: Open pull request with 404 compatibility updates
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          # Prefer the long-lived PAT for the publisher; an App token is the
          # fallback identity when Remote Config did not provide the PAT.
          GH_TOKEN: ${{ env.GITHUB_PAT || env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || '' }}
        run: |
          body="$RUNNER_TEMP/discover-404s-cloudflare-pr-body.md"
          {
            printf 'Auto-generated by [workflow run %s](%s/%s/actions/runs/%s).\n\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat <<'EOF'
          ## Implementato
          - La sweep Cloudflare pubblica `data/seo-404-compat` e `data/cf-hot-404s.json` tramite il branch stabile `chore/discover-404s-cloudflare`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`.

          ## Non implementato (ancora)
          Nessuno — aggiornamento dati automatizzato, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/seo-404-compat \
            --path data/cf-hot-404s.json \
            --branch chore/discover-404s-cloudflare \
            --commit-message "chore(data): refresh Cloudflare 404 compatibility" \
            --title "chore(data): refresh Cloudflare 404 compatibility" \
            --body-file "$body"

      # Push publication now happens through the PR publisher above.
      # Main deployment is triggered by the merge of the generated PR.
      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
