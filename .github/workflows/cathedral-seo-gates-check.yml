name: cathedral-seo-gates-check

# Weekly read-only sweep of the 6 SEO content gates. Detects:
#   - REGRESSIONS  → fail workflow + open issue (current > baseline)
#   - IMPROVEMENTS → job summary; issue ONLY for gates D9 does not cover
#   - PASSES       → single-line job summary, no action
#
# This workflow NEVER mutates baselines. Per CLAUDE.md non-negotiables #1
# and #5, baseline widening is a deliberate human action — the issue body
# carries the exact `gh workflow run` / `npm run audit:*:rebaseline` command
# for the operator to execute manually after review.
#
# Improvements are NOT all reportable (issue #7354). VISION.md driver D9 —
# owner instruction of 2026-08-25, given on issue #5983, which was this same
# improvement issue naming these same gates (text-html-ratio 6912→2562,
# max-bfs-depth 26398→11108) — refuses tightening the baseline of a
# "nice-to-have" gate when its measurement improves: the ratchet would make
# the gate ever stricter on a heuristic Google does not require, and such a
# gate is advisory instead. That reclassification is DONE, not pending: issue
# #6462 was closed COMPLETED on 2026-08-31 by PR #6756, which added the last
# two unclassified auditors (`audit:all/breadcrumb-coverage`,
# `audit:all/information-gain`) to `QUALITY_GATES` and censused all 21 entries
# in `docs/SEO-GATES.md`. The advisory mechanism lives in the pipeline that can
# actually sequester a deploy — `post-deploy-validate-dist.yml` →
# `classify-validate-dist-failures.mjs` → `publish` gated on `integrity_ok` —
# and NOT here: this workflow is a standalone weekly `schedule` job with no
# `needs:` edge from anything, replaying a past deploy's already-published
# artifact, so its red fails its own Actions status and nothing else. #6462
# audited it for exactly that and recorded "already fully advisory, no change
# needed" (`docs/SEO-GATES.md`). The two `exit 1` left below are outside that
# scope by #6462's own point 4: one fires when the checker produced no verdict
# file at all (a crash, not a gate), the other when `regressed > 0` — a real
# regression, whose zero tolerance #6462 explicitly said not to touch. So the
# improvement issue asked for work that is forbidden the moment it is filed;
# with a stable title it was refiled unchanged (#5983 → #7354) and routed to
# the autonomous fixer every time, which burned a run rediscovering D9 and
# closed it `needs-human`.
#
# `scripts/ci/seo-gates-improvement-report.mjs` now files the issue only for
# improved gates that are NOT in the `QUALITY_GATES` table of
# `classify-validate-dist-failures.mjs` — the same table that decides which
# gate may not sequester `publish`, so "is this a Google requirement?" has one
# answer and not two. Nice-to-have improvements land in the job summary.
# Regressions are untouched: `current > baseline` still opens one issue per
# gate and still fails this workflow.
#
# CLAUDE.md non-negotiable #14 — live test after merge:
#   gh workflow run cathedral-seo-gates-check.yml --ref main
#   gh run view <id>          # verify success or expected failure
#   gh run view <id> --log    # inspect gate verdict JSON in step summary
#
# Schedule: Mon 04:47 UTC — runs BEFORE cathedral-noindex-flip (05:13 UTC)
# so any regression caught here gates the flip workflow on the same Monday
# pipeline. Workflow_dispatch supported for ad-hoc operator runs.

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: >-
          Deploy run whose already-built dist/ to audit. Leave empty to use the
          most recent successful deploy.yml run on main that still has its
          artifacts (they expire after 8 days).
        required: false
        type: string
  push:
    # Re-run when the gates checker itself changes — does NOT run on data /
    # plugin / dist edits (those are validated by deploy.yml).
    branches: [main]
    paths:
      - '.github/workflows/cathedral-seo-gates-check.yml'
      - 'scripts/cathedral-seo-gates-check.mjs'

permissions:
  contents: read
  issues: write
  # Listing + downloading the `github-pages` artifact of the deploy run whose
  # dist/ this gate audits (issue #5169 — it no longer builds its own).
  actions: read

concurrency:
  group: cathedral-seo-gates-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Issue #5169: this used to run its own full SSG build (~143 min) and was
    # killed by the KERNEL OOM-killer on 9 of its last 10 runs. It now replays
    # the dist deploy.yml already built, so the budget covers artifact download
    # + shard rehydrate + 6 audits, not a build. Kept generous: rehydrate falls
    # back to cloning the shard repos when a run's artifacts have expired.
    timeout-minutes: 180
    # Skip draft PR runs + closed-PR re-runs. The workflow does not subscribe
    # to pull_request events; this `if` is belt-and-braces for any future
    # operator who adds one without rereading the safety contract.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)
    # Issue #5553: `regressed=0, errors=2` — `orphan-sitemap-pages` and
    # `max-bfs-depth` both died with a V8 heap OOM (`node::OOMErrorHandler` /
    # `Heap::CollectGarbage` in the child's stderr), NOT with a crash before
    # detection. Two gates therefore reported `status=error current=? baseline=?`
    # and the workflow failed without a single regression having been evaluated.
    #
    # It is not an accumulation bug in the audits. Both already dequeue with an
    # index cursor instead of `shift()` and both already keep bare path strings
    # in the frontier (see the comments in scripts/audit-bfs-depth.mjs and
    # scripts/audit-orphan-pages-in-sitemaps.mjs); the offender lists they build
    # are small — 26,398 offenders over 255,347 sitemap URLs in
    # data/bfs-depth-baseline.json, a few MB.
    #
    # CORRECTION (2026-09-05, issues #7419/#7420). The next sentence used to
    # read "The heap goes into the BFS visited-set itself, which is inherent:
    # one Map/Set entry per reachable path over the whole rehydrated dist/."
    # That was inferred from a single V8 death-rattle line — a process that
    # aborts inside the walk writes no report and no offender list, so the heap
    # SIZE was the only surviving evidence and nothing said what was in it.
    # It is wrong in both halves, and it is why three autonomous fix attempts
    # on these issues went nowhere: they were following a false explanation
    # written in-house.
    #
    # Measured, by putting a probe inside the walk and replaying the same
    # corpus (replay 33949494806 over deploy 33936935725, 4,389,672 files):
    #
    #   dequeued=250000   discovered=936931   existing=248011  heap=4490MB
    #   dequeued=1000000  discovered=1202200  existing=875363  heap=7689MB
    #   → FATAL ERROR: Reached heap limit, rc=134, at 673 s
    #
    # So the sentence was wrong TWICE, and each half mattered.
    #
    # Wrong on the ORDER OF MAGNITUDE: the visited set peaks at 1,202,200 paths
    # averaging 44 characters — ~180 MB of the 7,712 MB that died, about 2%.
    #
    # Wrong on the MECHANISM, which is where the other 98% is: an href produced
    # by the anchor regex is a V8 SlicedString pointing into the whole HTML
    # document it was scraped from, so every path kept in the visited set pins
    # its entire source page. That is emphatically streamable-away. PR #7441
    # measured it directly — 40,359 bytes retained per path before its fix,
    # under 5,000 after — and flattened at that boundary
    # (scripts/lib/flat-string.mjs, merged as 11d4f1ef695). The identical bug
    # had already been found and documented in
    # scripts/audit-duplicate-meta-description.mjs on run 32261742920.
    #
    # Both halves are recorded because this comment is what three autonomous
    # fix attempts on #7419/#7420 read and believed: a heap you are told is
    # inherent is a heap you only ever raise.
    #
    # The heap floor below therefore stays as a CEILING, not as the remedy.
    #
    # A REAL asymmetry was also missing, and it is worth keeping even though it
    # was never the whole story: it lives in a DIFFERENT file from the audits,
    # so nobody saw it. The very same two
    # audits are given `--max-old-space-size=8192` by their seed workflows
    # (seed-bfs-depth-baseline.yml, seed-orphan-pages-baseline.yml), and this
    # gate — which runs them over a dist/ that is larger, because it is
    # rehydrated with the locale + section shards — inherited node's default
    # heap instead. Same binary, same corpus, a quarter of the memory.
    #
    # 8192 matches those two seed workflows deliberately: it is the value
    # already proven on this runner for these audits — a ceiling, not a fix, as
    # the CORRECTION above records — and it stays well under
    # the 16 GB of `ubuntu-latest` so a raised V8 ceiling cannot turn a clean
    # heap OOM into a KERNEL OOM-kill — the failure mode #5169 removed.
    #
    # `scripts/cathedral-seo-gates-check.mjs` spawns each audit with
    # `env: process.env`, so a job-level value reaches every `npm run audit:*`
    # child. Guarded by tests/cathedral-gates-audit-heap.test.ts.
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      # Free ~25-30 GB before dist/ lands. This gate no longer BUILDS dist
      # (issue #5169 — see the replay steps below), but it still materialises
      # the whole logical site: the github-pages tarball plus every locale and
      # section shard, which the rehydrate scripts will `git clone` when a run's
      # artifacts have expired. ubuntu-latest ships ~14 GB free on /, so the
      # cleanup is still load-bearing — it just guards the download now, not a
      # Vite emit. Deletes only toolchains this repo never uses.
      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Create the labels with their colour/description before the issue steps.
      # `github-issue-creator.mjs` creates anything missing on its own, but only
      # with defaults — this keeps them recognisable in the backlog. (#4598: the
      # raw `gh issue create` these steps used to run could crash the job under
      # `set -euo pipefail` on a missing label; the helper's exit-0 contract now
      # rules that out structurally.)
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "seo-gates" --color "1D76DB" \
            --description "cathedral-seo-gates-check: SEO content gate regression/improvement" --force 2>/dev/null || true
          gh label create "regression" --color "D93F0B" \
            --description "cathedral-seo-gates-check: gate regressed above baseline" --force 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      # ── dist/ is REPLAYED, never rebuilt (issue #5169) ────────────────────
      #
      # This gate used to run its own full SSG build through the composite
      # action `build-dist-multi-locale-merged`. It was killed by the kernel
      # OOM-killer on 9 of its last 10 runs — run 30795844586 died at RSS
      # ~11.3 GB after 72 minutes while building the FIRST of four locales
      # (`The runner has received a shutdown signal`, i.e. the whole runner
      # process went, so even the crash-reporter step below could not fire).
      # The revert trigger written into that action ("if a scheduled run of
      # either caller workflow still OOMs at/above the previous ~11.7GB ceiling
      # after this lands, per-locale filtering is not shedding the memory this
      # diagnosis assumes") is therefore SATISFIED: per-locale splitting does
      # not help, because the retention is not per-locale — related-search's
      # 349k candidates and the global hub datasets are loaded identically in
      # every sub-build.
      #
      # The fix is to stop building. deploy.yml's per-locale matrix builds this
      # exact dist successfully every few hours, and the repo already has the
      # machinery to replay it (`audit-dist-from-run.yml`, documented in
      # AGENTS.md → Build And Test). Auditing the artifact deploy SHIPPED is
      # also strictly more truthful than auditing a private rebuild of it.
      #
      # Not applicable here: #4943's remedy for the sibling AdSense checklist
      # (drop the build and read the LIVE site). These gates measure emitted
      # HTML — title length, structured data, text/HTML ratio, BFS depth — so
      # they need a dist tree, just not one built here.
      - name: Resolve + download the deployed dist (github-pages artifact)
        id: pages
        uses: ./.github/actions/fetch-pages-artifact
        with:
          # Empty on the schedule, set only when an operator pins a run. The
          # walk-back this gate used to carry inline — client-side created_at
          # ordering, the `.expired==false` filter, capped pagination, the
          # 410-between-resolve-and-download retry and the raw candidate log —
          # now lives in the composite action, which is also what the four
          # seed-*.yml, audit-dist-from-run.yml, inspect-dist-composition.yml
          # and measure-deploy-delta.yml call. The inline copy is what drifted
          # (#7392, #7393, #7394, #7395, #7396, #7397): six defects that only
          # ever existed because the same fifty lines lived in eight places.
          run-id: ${{ inputs.deploy_run_id }}
          output-dir: /tmp/pages
          github-token: ${{ github.token }}

      - name: Extract dist/ from the artifact tarball
        env:
          TAR_PATH: ${{ steps.pages.outputs.tar-path }}
          DEPLOY_RUN_ID: ${{ steps.pages.outputs.run-id }}
          DEPLOY_CREATED_AT: ${{ steps.pages.outputs.created-at }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xf "$TAR_PATH" -C dist
          rm -f "$TAR_PATH"
          echo "Restored $(find dist -type f | wc -l) files into dist/ from deploy run $DEPLOY_RUN_ID (created_at $DEPLOY_CREATED_AT)"

      # The github-pages artifact is the TRUNK only: deploy.yml strips the
      # en/de/fr subtrees and every per-section subtree out of it (they are
      # served from their own shard repos through the Worker at the same URLs).
      # Auditing it as-is walks a fraction of the site and reports the absent
      # subtrees as a defect OF THE SITE — replay run 30346794790 declared ~68k
      # cluster URLs below crawl depth for exactly this reason (#4857). Same
      # order and same failure contract as post-deploy-validate-dist.yml and
      # audit-dist-from-run.yml: locale first and hard-fail, sections strictly
      # after and soft-fail.
      - name: Rehydrate locale then section shards into dist/
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.pages.outputs.run-id }}
          # Every `*_SHARD_LIVE` / `LOCALE_SHARDS_LIVE` repo variable at once, so
          # a newly added section cannot be silently missed by a hand-kept list.
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -uo pipefail
          eval "$(jq -r 'to_entries[]
                         | select(.key | test("_SHARDS?_LIVE$"))
                         | "export \(.key)=\(.value | @sh)"' <<< "$REPO_VARS_JSON")"
          LOCALE_RC=0
          bash scripts/lib/rehydrate-locale-shards.sh || LOCALE_RC=$?
          bash scripts/lib/rehydrate-section-shards.sh
          echo "dist/ now holds $(find dist -type f | wc -l) files"
          if [ "$LOCALE_RC" -ne 0 ]; then exit "$LOCALE_RC"; fi

      # Precondition, not a gate: abort BEFORE any audit runs if dist/ is still
      # missing whole subtrees. Without it a degraded rehydrate turns straight
      # into a fabricated structural verdict about the site — and, here, into a
      # bogus "regressed" issue filed against a baseline that is fine.
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs

      - name: Run gates check
        id: gates
        continue-on-error: true
        run: node scripts/cathedral-seo-gates-check.mjs

      # On failure (any gate regressed or errored), upload the structured
      # per-audit JSON reports plus sitemaps so the issue auto-filer below
      # links to an artifact a debug agent can download and analyse offline,
      # instead of re-running `npm run build:ci` to reproduce. 7-day retention
      # matches the rest of the post-build pipeline.
      - name: Upload audit reports + sitemaps on failure
        if: failure() || steps.gates.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-cathedral-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/audit-reports/**
            dist/sitemap.xml
            dist/sitemap-*.xml
            data/cathedral-seo-gates-verdict.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Emit job summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/cathedral-seo-gates-verdict.json ]; then
            echo "::warning::No verdict file produced — gates checker failed before evaluation."
            exit 0
          fi
          {
            echo "## SEO Content Gates Verdict"
            echo ""
            echo '| Gate | Status | Current | Baseline | Delta |'
            echo '|------|--------|---------|----------|-------|'
            jq -r '.gates[] | "| \(.name) | \(.status) | \(.current // "—") | \(.baseline // "—") | \(.delta // "—") |"' \
              data/cathedral-seo-gates-verdict.json
            echo ""
            echo "_Checked at $(jq -r .checkedAt data/cathedral-seo-gates-verdict.json)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report improvements (issue only for gates D9 does not cover)
        id: improvements
        if: steps.gates.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          improved=$(jq '.summary.improved' data/cathedral-seo-gates-verdict.json)
          if [ "$improved" = "0" ]; then
            echo "No gate improvements detected — nothing to report."
            exit 0
          fi

          # Partitions the improved gates: nice-to-have ones (VISION.md D9) are
          # written to the job summary and stop there; the rest get
          # /tmp/issue-body.md. See the header of this file and of the script
          # for why the unconditional issue was a treadmill.
          # The body file is written ONLY when at least one improved gate is
          # outside D9 — its presence is the decision, so a stale file from a
          # previous step must not stand in for it.
          rm -f /tmp/issue-body.md
          node scripts/ci/seo-gates-improvement-report.mjs --issue-body=/tmp/issue-body.md

          if [ ! -f /tmp/issue-body.md ]; then
            echo "All improved gates are nice-to-have (D9) — job summary only, no issue filed."
            exit 0
          fi

          # Stable title: the improved-gate COUNT used to sit at ~char 52, inside
          # the 60-char window the dedup matches on, so a month where 3 gates
          # improved instead of 2 opened a second issue for the same standing
          # opportunity. The count lives in the body, next to the per-gate
          # detail that actually drives the rebaseline decision.
          title="chore(seo-gates): possible rebaseline opportunity"

          # `github-issue-creator.mjs` (ISSUES.md dedup a monte) owns both the
          # create and the dedup: same stable title → comment on the canonical
          # issue instead of a new one. It also always exits 0, which removes the
          # `set -euo pipefail` hazard the raw `gh` call carried here.
          node scripts/lib/github-issue-creator.mjs \
            --title "$title" \
            --description "$(cat /tmp/issue-body.md)" \
            --priority 4 \
            --label seo-gates \
            --workflow "${{ github.workflow }}"

      - name: Open issue + fail workflow on regression
        id: failgate
        if: steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f data/cathedral-seo-gates-verdict.json ]; then
            echo "::error::Gates checker failed to produce a verdict file."
            exit 1
          fi
          regressed=$(jq '.summary.regressed' data/cathedral-seo-gates-verdict.json)
          errors=$(jq '.summary.errors' data/cathedral-seo-gates-verdict.json)

          if [ "$regressed" -gt 0 ]; then
            # One issue per regressed gate (easier triage than a single mega-issue).
            mapfile -t names < <(jq -r '.gates[] | select(.status == "regressed") | .name' \
              data/cathedral-seo-gates-verdict.json)
            for name in "${names[@]}"; do
              # Already stable — `${name}` is a legitimate discriminant (one
              # issue per gate), not a per-run value. What changes is WHO dedups:
              # the helper, on the canonical issue, instead of a hand-rolled
              # exact-title scan of the 200 most recent open issues.
              title="SEO gates regression: ${name} above baseline"
              current=$(jq -r --arg n "$name"   '.gates[] | select(.name == $n) | .current'        data/cathedral-seo-gates-verdict.json)
              baseline=$(jq -r --arg n "$name"  '.gates[] | select(.name == $n) | .baseline'       data/cathedral-seo-gates-verdict.json)
              delta=$(jq -r --arg n "$name"     '.gates[] | select(.name == $n) | .delta'          data/cathedral-seo-gates-verdict.json)
              audit_cmd=$(jq -r --arg n "$name" '.gates[] | select(.name == $n) | .auditCmd'       data/cathedral-seo-gates-verdict.json)
              notes=$(jq -r --arg n "$name"     '.gates[] | select(.name == $n) | .notes'          data/cathedral-seo-gates-verdict.json)
              {
                echo "Automated check detected a REGRESSION on the **${name}** gate."
                echo ""
                echo "- Current:  **${current}**"
                echo "- Baseline: ${baseline}"
                echo "- Delta:    +${delta}"
                echo "- Reproduce locally: \`${audit_cmd}\`"
                echo "- Notes: ${notes}"
                echo ""
                echo "Per CLAUDE.md non-negotiables #1 + #5, the fix is to ELIMINATE the new"
                echo "offenders — do NOT widen the baseline as a workaround."
                echo ""
                echo "Workflow run: ${GITHUB_SERVER_URL:-https://github.com}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID:-}"
              } > /tmp/issue-body.md
              node scripts/lib/github-issue-creator.mjs \
                --title "$title" \
                --description "$(cat /tmp/issue-body.md)" \
                --priority 2 \
                --label seo-gates \
                --label regression \
                --workflow "${{ github.workflow }}"
            done
            # Mark that a condition (regression) issue was surfaced, so the
            # generic crash-reporter below stays silent (no duplicate).
            echo "opened=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::warning::${errors} gate(s) errored during evaluation — see verdict JSON."
          fi

          echo "Gates check reported regressed=${regressed} errors=${errors} — failing the workflow."
          exit 1

      # Closer half (#5437 — this title had none). Per-gate, not per-run: a
      # gate whose STATUS this run is `pass`/`improved` gets its own regression
      # issue resolved even while OTHER gates still regress — the opener above
      # is the same granularity (one issue per gate name). `error` status is
      # deliberately excluded: an evaluation error is inconclusive, not proof
      # the gate recovered. `always()` so this still runs when `failgate`
      # itself fails the job (mixed regressed/recovered gates in the same run).
      - name: Resolve regression issues for gates back under baseline
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f data/cathedral-seo-gates-verdict.json ]; then
            echo "No verdict file — nothing to resolve."
            exit 0
          fi
          mapfile -t recovered < <(jq -r '.gates[] | select(.status == "pass" or .status == "improved") | .name' \
            data/cathedral-seo-gates-verdict.json)
          for name in "${recovered[@]}"; do
            title="SEO gates regression: ${name} above baseline"
            node scripts/lib/github-issue-creator.mjs --resolve \
              --title "$title" \
              --workflow "${{ github.workflow }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Report unexpected failure to GitHub Issues
        # failgate both opens the issue AND fails the job, so its conclusion
        # alone can't tell "failed with issue" from "failed without issue"
        # (missing verdict file, or errors-only with regressed==0). Gate on
        # an explicit opened=true output: fire only when NO regression issue
        # was surfaced — covers verdict-missing, errors-only, and any crash
        # before/outside the gate (build dist, checkout, setup).
        if: failure() && steps.failgate.outputs.opened != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito (crash pre/fuori detection)
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}
          Nota: il gate è fallito prima/fuori dallo step di valutazione (es. build dist) — nessuna issue di regressione è stata aperta." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
