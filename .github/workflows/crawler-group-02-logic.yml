      - name: Run roche
        id: crawler-roche
        if: always()
        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-02"
          status_file="$state_dir/roche.status"
          pid_file="$state_dir/roche.pid"
          log_file="$state_dir/roche.log"
          deadline=$((SECONDS + 340 * 60))
          while [ ! -s "$status_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::roche: detached crawler did not publish a status before the 340 minute group budget"
              exit 1
            fi
            if [ -s "$pid_file" ]; then
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null; then
                sleep 1
                if [ ! -s "$status_file" ]; then
                  echo "::error::roche: detached crawler exited without publishing its status"
                  exit 1
                fi
              fi
            fi
            sleep 2
          done
          if [ -f "$log_file" ]; then
            cat "$log_file"
          else
            echo "::error::roche: crawler log is missing"
            exit 1
          fi
          status="$(cat "$status_file" 2>/dev/null || true)"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "::error::roche: invalid crawler status: $status"
            exit 1
          fi
          exit "$status"
