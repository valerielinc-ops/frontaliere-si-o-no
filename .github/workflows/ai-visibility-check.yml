name: AI Visibility Check

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of every month at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list queries without making API calls'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-visibility-check
  cancel-in-progress: false

jobs:
  check-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Checkout 80-799s su 5 run: il massimo è il 44% di un cap da 30min.
          # Blobless partial clone come guard-data-integrity #4120 (mediana ~150s
          # nei job filtrati contro ~600s in quelli non filtrati). Sicuro: il job
          # interroga i motori AI e committa il report, non legge blob storici.
          filter: blob:none
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 15

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Run AI visibility check
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/check-ai-visibility.mjs --dry-run
          else
            node scripts/check-ai-visibility.mjs --verbose
          fi

      - name: Upload report artifacts
        if: always() && inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ai-visibility-${{ github.run_number }}
          path: reports/ai-visibility-*
          # 90 = repository maximum; higher values are silently clamped (and the
          # committed data/ai-visibility-history.jsonl is the long-term record).
          retention-days: 90

      - name: Commit visibility history
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Full reports live under reports/ which is gitignored (preserved as
          # build artifacts only). Only the compact append-only history file is
          # committed so the next monthly run can compute the trend.
          git add data/ai-visibility-history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "📊 AI visibility report — ${DATE}"
          # Centralized rebase-retry helper survives concurrent pushes from other
          # workflows. The history file is append-only, so on a rebase conflict
          # keep the local commit and union both sides instead of regenerating.
          bash scripts/lib/git-push-with-retry.sh \
            --branch "$GITHUB_REF_NAME" \
            --in-place-resolver-cmd "source scripts/lib/resolve-append-conflicts.sh && resolve_append_conflicts && git add -A"

      # Create the domain label with its colour/description before the issue
      # step. `github-issue-creator.mjs` calls `gh label create` for anything
      # missing, but only with defaults — this keeps the label recognisable in
      # the backlog. The old `priority` label is gone: urgency is now the
      # helper's `--priority` (→ `priority:high` / `priority:low`), the same
      # scale the triage/drainer pipeline already sorts on.
      - name: Ensure labels exist
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ai-visibility" --color "1D76DB" \
            --description "ai-visibility-check: monthly AI citation visibility report" --force 2>/dev/null || true

      # Issue via scripts/lib/github-issue-creator.mjs with a STABLE title
      # (ISSUES.md: dedup a MONTE). The previous `gh issue create` interpolated
      # the run date AND the score into the title, so every monthly run minted a
      # brand-new issue for a condition that is by definition the same one — a
      # backlog that grows on its own and no issue anyone can actually close.
      # The date/score/percent still matter, so they move into the BODY, which
      # is where the metric's history belongs anyway: the helper appends each
      # run as a comment on the canonical issue, so the trend reads as a thread.
      - name: Create GitHub issue if citations dropped
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="reports/ai-visibility-latest.md"
          if [ ! -f "$REPORT" ]; then
            echo "No report generated, skipping issue creation."
            exit 0
          fi

          # Extract score from JSON report
          DATE=$(date -u +%Y-%m-%d)
          JSON_REPORT="reports/ai-visibility-${DATE}.json"
          if [ ! -f "$JSON_REPORT" ]; then
            echo "No JSON report found, skipping issue creation."
            exit 0
          fi

          SCORE=$(node -e "const r=JSON.parse(require('fs').readFileSync('${JSON_REPORT}','utf8')); console.log(r.meta.score)")
          TOTAL=$(node -e "const r=JSON.parse(require('fs').readFileSync('${JSON_REPORT}','utf8')); console.log(r.meta.scoreMax)")
          PERCENT=$(node -e "const r=JSON.parse(require('fs').readFileSync('${JSON_REPORT}','utf8')); console.log(r.meta.scorePercent)")

          # Check for trend data (previous score)
          PREV_SCORE=$(node -e "const r=JSON.parse(require('fs').readFileSync('${JSON_REPORT}','utf8')); console.log(r.trend?.previousScore ?? 'none')" 2>/dev/null || echo "none")

          # Stable titles: no date, no score, no counter anywhere in them (the
          # helper dedups on the first 60 characters).
          ISSUE_TITLE="AI Visibility monthly citation report"
          ISSUE_PRIORITY=4
          DROP_LINE=""

          if [ "$PREV_SCORE" != "none" ] && [ "$SCORE" -lt "$PREV_SCORE" ]; then
            LOST=$((PREV_SCORE - SCORE))
            ISSUE_TITLE="AI Visibility dropped versus the previous report"
            ISSUE_PRIORITY=2
            DROP_LINE="**Citations lost since the previous report: ${LOST}** (was ${PREV_SCORE}, now ${SCORE})."
          fi

          BODY=$(printf '%s\n' \
            "**Report date:** ${DATE}" \
            "**Score:** ${SCORE}/${TOTAL} (${PERCENT}%)" \
            "**Previous score:** ${PREV_SCORE}" \
            "" \
            "${DROP_LINE}" \
            "" \
            "$(cat "$REPORT")")

          node scripts/lib/github-issue-creator.mjs \
            --title "$ISSUE_TITLE" \
            --description "$BODY" \
            --priority "$ISSUE_PRIORITY" \
            --label seo \
            --label ai-visibility \
            --workflow "${{ github.workflow }}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
