name: production-canary

# Agent F — 5XX hardening canary.
# Runs `npm run probe:5xx` on a schedule and on manual dispatch. Fails the
# workflow if any production URL returns 5XX or a network error on all retry
# attempts.
#
# Post-deploy probing is handled by `post-deploy-validate-live.yml` (which
# runs `probe:5xx` + `test:e2e:live` after every deploy), so this canary
# intentionally does NOT trigger on `push: main` — its unique value is
# catching regressions BETWEEN deploys (Pages outage, RC config breakage,
# DNS/CDN/cert issues, upstream rate-limits).
#
# No external notifications (Slack etc.) are wired — CI failure surfaces via
# GitHub Actions status and emails project maintainers.

on:
  schedule:
    # Every 15 minutes. Cron runs in UTC.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  # Only one canary in flight at a time; cancel an older run if a newer one starts.
  group: production-canary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe production for 5XX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run 5XX probe
        id: probe
        run: npm run probe:5xx 2> probe-output.err
        # Non-zero exit fails the workflow by default.

      - name: Upload probe result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-5xx-result-${{ github.run_id }}
          path: probe-output.err
          if-no-files-found: ignore
          retention-days: 7

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
