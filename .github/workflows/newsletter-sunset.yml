name: Newsletter Sunset

# Graduated, reversible list hygiene: win-back never-engagers, then soft-move
# them to `inactive`, and reactivate any who came back. Policy + thresholds live
# in scripts/lib/subscriberSunset.mjs (120d on list + ≥12 ignored sends).
on:
  schedule:
    # Weekly, Monday 04:11 UTC — well before the daily newsletter send (05:33 UTC)
    # so a same-day win-back is stamped before the regular send filters it out.
    - cron: '11 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default), apply (status transitions only), or send (also email win-backs)'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - send
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled with human approval.'
        required: false
        default: true
        type: boolean
      human_approval:
        description: 'Explicit human approval for sunset writes and sends.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

# Never overlap with itself (it mutates subscriber status in batches).
concurrency:
  group: newsletter-sunset
  cancel-in-progress: false

jobs:
  sunset:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require human approval for sunset side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_TRUSTED_SCHEDULE: 'true'
          APPROVAL_SCOPE: newsletter-sunset
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      - name: Load secrets from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Run sunset
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM || '' }}
          # Scheduled runs apply transitions AND send win-backs; manual runs use
          # the chosen mode (default dry-run — safe to inspect before acting).
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'dry-run' }}
          ALLOW_SIDE_EFFECT: ${{ steps.side_effect_gate.outputs.allow_side_effect }}
          EFFECTIVE_DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            MODE=dry-run
          fi
          echo "🌙 Newsletter sunset mode=$MODE"
          case "$MODE" in
            send)  node scripts/newsletter-sunset.mjs --apply --send ;;
            apply) node scripts/newsletter-sunset.mjs --apply ;;
            *)     node scripts/newsletter-sunset.mjs ;;
          esac

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
