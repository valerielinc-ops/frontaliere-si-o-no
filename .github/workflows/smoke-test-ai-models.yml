name: Smoke-Test AI Models

# Manual-only. One ping per model in DEFAULT_CHAIN; records pass/4xx/5xx/timeout.
# Use after touching scripts/lib/ai-models.mjs to confirm new IDs work and to
# spot newly deprecated models before they brick a production workflow
# (cf. run 26534353239 where gemini-3.1-flash-lite-preview kept winning the
# fallback selector after Google deprecated it).
on:
  workflow_dispatch: {}
  # Scheduled so the Mistral `-latest` regression gate (issue #892) actually
  # protects. A manual-only trigger never catches a silent no-op alias pass;
  # the daily run fails CI the moment all Mistral `-latest` models go stale.
  # Early in the UTC day so a regression surfaces before discovery would
  # pre-exhaust the `-latest` chain for the rest of the day.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Remote Config keys will not load."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. Wired here too so the smoke-test's
      # one-ping-per-model sweep actually exercises this tier instead of
      # silently no-op'ing on it. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Tier-0 in ai-models.mjs's DEFAULT_CHAIN by default since 2026-07-29
      # (AI_COMPETING_TIERS) — competes on real score instead of being
      # reached only after every free-tier model has failed. Wired here too
      # so the smoke-test's one-ping-per-model sweep actually exercises this
      # tier instead of silently no-op'ing on it. See
      # .github/actions/setup-claude-haiku-fallback/action.yml for the full
      # rationale + incident history.
      - uses: ./.github/actions/setup-claude-haiku-fallback

      - name: Run smoke-test (one ping per model)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p .tmp
          node scripts/smoke-test-ai-models.mjs > .tmp/smoke.json 2> .tmp/smoke.log
          echo "## Smoke-test summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./.tmp/smoke.json');console.log(JSON.stringify(r.summary,null,2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Dead models (HTTP 404)" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const r=require('./.tmp/smoke.json');
            const dead=(r.results||[]).filter(x=>x.status==='http_404');
            if(!dead.length){console.log('_None._');}
            else{
              console.log('| Model | Detail |');
              console.log('|-------|--------|');
              for(const d of dead){console.log('| \`'+d.model+'\` | '+(d.detail||'').replace(/\\|/g,'\\\\|').slice(0,120)+' |');}
            }
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke-test artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-models-smoke-${{ github.run_id }}
          path: |
            .tmp/smoke.json
            .tmp/smoke.log
          retention-days: 30

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
