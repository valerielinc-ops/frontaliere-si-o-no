name: Retry native auto-merge opt-in

# This is a bounded recovery loop for a transient GitHub API failure while
# opting a PR into native auto-merge. Native auto-merge still owns the wait and
# merge decision; this workflow never pushes a branch or merges directly.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: retry-native-automerge
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      # Keep source loading identical to the event-driven workflow: checkout
      # only trusted main through a blobless sparse clone, then validate every
      # runtime file before any gate code is imported. A missing helper fails
      # this run closed and the next scheduled tick retries automatically.
      - name: Checkout trusted native auto-merge source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main
          path: native-automerge-main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/native-automerge-source.mjs
            /scripts/load-rc-env.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/ci/native-automerge-gate.mjs
            /scripts/ci/review-test-policy.mjs
            /scripts/ci/lib/automation-risk-policy.mjs
            /scripts/ci/lib/fetchPrFiles.mjs
            /scripts/ci/lib/vitestCheck.mjs
            /scripts/ci/lib/constants.mjs
            /scripts/ci/lib/pr-review-admission.mjs
            /scripts/ci/lib/review-input-revision.mjs
            /scripts/ci/review-marker-recovery.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /data/loop-fleet/loop-registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate trusted native auto-merge source
        env:
          NATIVE_AUTOMERGE_SOURCE_ROOT: ${{ github.workspace }}/native-automerge-main
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/ci/native-automerge-source.mjs"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/load-rc-env.mjs"

      - name: Retry bounded native auto-merge opt-in
        env:
          REPOSITORY: ${{ github.repository }}
          MAX_PR_SCAN: '100'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "GITHUB_PAT was not loaded from Remote Config" >&2
            exit 1
          fi
          cd "$NATIVE_AUTOMERGE_SOURCE_ROOT"

          open_prs=$(GH_TOKEN="$GITHUB_PAT" gh pr list \
            --repo "$REPOSITORY" --state open --base main --limit "$MAX_PR_SCAN" \
            --json number,isDraft,createdAt)
          pr_numbers=$(jq -r \
            '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[].number' \
            <<<"$open_prs")
          scanned=0
          attempted=0
          failed=0
          while IFS= read -r -u 9 pr_number; do
            [ -n "$pr_number" ] || continue
            scanned=$((scanned + 1))
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "::warning::skipping malformed PR number from GitHub API: $pr_number"
              continue
            fi
            if ! current=$(GH_TOKEN="$GITHUB_PAT" gh pr view "$pr_number" --repo "$REPOSITORY" \
              --json state,isDraft,baseRefName,autoMergeRequest); then
              echo "::warning::could not read PR #$pr_number; the next scheduled tick will retry"
              failed=$((failed + 1))
              continue
            fi
            if jq -e '(.state != "OPEN") or (.isDraft == true) or (.baseRefName != "main")' \
              <<<"$current" >/dev/null; then
              continue
            fi
            attempted=$((attempted + 1))
            if GH_TOKEN="$GITHUB_PAT" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
              "$REPOSITORY" "$pr_number"; then
              echo "Native auto-merge guard evaluated for PR #$pr_number"
            else
              echo "::warning::native auto-merge opt-in failed for PR #$pr_number; the next scheduled tick will retry"
              failed=$((failed + 1))
            fi
          done 9<<<"$pr_numbers"
          echo "Bounded native auto-merge scan inspected $scanned PR(s), gate-attempted $attempted PR(s); $failed transient failure(s)"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
