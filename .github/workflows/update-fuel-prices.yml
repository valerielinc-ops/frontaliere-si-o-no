name: Update Fuel Prices (Italy + Switzerland)

on:
  schedule:
    # Hourly at :37 — write to Firestore only (fresh data, no commit)
    - cron: '37 1-5,7-23 * * *'
    # Daily at 06:37 UTC — write to Firestore AND commit repo cache
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean
concurrency:
  group: fuel-prices
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest
    # Leave room for the daily cache push to outlast concurrent main writers
    # instead of cancelling after the 10-minute cap (#10542).
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (#5659, run 31537838525 e 31935143259: 10m0s interi nello
        # step Checkout, lo script fuel-prices non e' mai partito). Con il
        # tetto e' un `failure` diagnosticabile. 6min stanno sopra il massimo
        # osservato sui run sani (114-183s su 7 run, ~30% del cap da 10min) con
        # ampio margine, e sotto il cap del job. NIENTE `filter: blob:none`:
        # con `fetch-depth: 1` e' un peggioramento misurato (+125% su
        # tests.yml, vedi la nota in pr-review-loop.yml e #5164), non un
        # miglioramento.
        timeout-minutes: 6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare Firebase credentials for PR publishing
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load publishing credentials from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Install firebase-admin
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: npm install --no-save firebase-admin@14.5.0

      - name: Detect daily run
        id: schedule
        # Identify the daily run by the cron expression that triggered it,
        # not by the wall-clock hour. GitHub Actions routinely delays scheduled
        # runs past the next hour boundary; checking `date -u +%H` would then
        # mis-classify the daily run as hourly and skip the snapshot step.
        run: |
          if [ "${{ github.event.schedule }}" = "37 6 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and upload fuel prices to Firestore
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          if [ "${{ steps.schedule.outputs.daily }}" = "true" ]; then
            node scripts/generate-fuel-prices-dataset.mjs --save-local --cantons-input-out "$RUNNER_TEMP/fuel-cantons-input.json"
          else
            node scripts/generate-fuel-prices-dataset.mjs
          fi

      - name: Persist daily snapshot of raw fuel prices JSON
        if: steps.schedule.outputs.daily == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          mkdir -p data/fuel-prices-history
          cp public/data/fuel-prices.json "data/fuel-prices-history/$(date -u +%F).json"

      - name: Snapshot fuel history for SEO pages (F6)
        if: steps.schedule.outputs.daily == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/snapshot-fuel-history.mjs

      # P9b: per-canton averages (CH border strip + FR/AT/IT, DE when the
      # Tankerkönig key exists) from the generator hand-off above plus the
      # foreign open-data feeds. Its own failure must not cost the main fuel
      # cache its PR, so the step is non-blocking here and reported below; a
      # refused dataset writes nothing and the published file stays.
      - name: Build cantonal fuel dataset (P9b)
        id: fuel_cantons
        if: steps.schedule.outputs.daily == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        run: node scripts/build-fuel-cantons-dataset.mjs --input "$RUNNER_TEMP/fuel-cantons-input.json"

      # Daily: publish the cache through a PR so the required Vitest check
      # validates generated data before it reaches main. This removes the
      # retry convoy that used to spend the whole ten-minute job cap pushing
      # directly to the protected main ref (#10542).
      - name: Open PR with fuel price cache
        if: steps.schedule.outputs.daily == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/fuel-prices-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Pubblica il cache giornaliero dei prezzi carburante tramite una PR stabile, così il required check \`vitest (unit + integration)\` valida i dati prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          Nessuno — il dataset generato e la sua cronologia vengono pubblicati atomically through the refresh PR (insieme a \`fuel-prices-cantons.json\` quando la build per cantone è passata).
          EOF
          # The canton dataset joins the same PR once it exists: before its
          # first successful build the path is untracked and absent, and
          # `git add` would reject the pathspec.
          cantons_paths=()
          if [ -f data/fuel-prices-cantons.json ] && [ -f public/data/fuel-prices-cantons.json ]; then
            cantons_paths=(--path data/fuel-prices-cantons.json --path public/data/fuel-prices-cantons.json)
          fi
          bash scripts/lib/open-data-refresh-pr.sh \
            --force \
            --path data/fuel-prices.json \
            --path public/data/fuel-prices.json \
            --path data/fuel-prices-history/ \
            "${cantons_paths[@]}" \
            --branch chore/refresh-fuel-prices \
            --commit-message "chore(data): refresh fuel prices" \
            --title "chore(data): refresh fuel prices" \
            --body-file "$body"

      - name: Report cantonal fuel dataset failure
        if: steps.fuel_cantons.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Dataset carburanti per cantone rifiutato (update-fuel-prices)" \
            --description "## Dataset carburanti per cantone rifiutato o fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Lo step \`Build cantonal fuel dataset (P9b)\` è fallito: il file pubblicato \`data/fuel-prices-cantons.json\` resta quello precedente. Il log dello step elenca lo stato di ogni fonte e la copertura dei cantoni attesi." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Recovery mirror: the title above is custom, so neither
      # close-recovered-failure-issues.mjs nor the generic report closes it;
      # the next accepted canton build does (model: rpm-canary.yml). Gated on
      # the script's own `built` output, not on the step outcome: a run whose
      # generator hand-off was missing exits 0 without building anything.
      - name: Resolve cantonal fuel dataset issue on accepted build
        if: steps.fuel_cantons.outputs.built == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Dataset carburanti per cantone rifiutato (update-fuel-prices)" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
