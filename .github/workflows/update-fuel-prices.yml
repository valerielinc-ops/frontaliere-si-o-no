name: Update Fuel Prices (Italy + Switzerland)

on:
  schedule:
    # Hourly at :37 — write to Firestore only (fresh data, no commit)
    - cron: '37 1-5,7-23 * * *'
    # Daily at 06:37 UTC — write to Firestore AND commit repo cache
    - cron: '37 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: fuel-prices
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (#5659, run 31537838525 e 31935143259: 10m0s interi nello
        # step Checkout, lo script fuel-prices non e' mai partito). Con il
        # tetto e' un `failure` diagnosticabile. 6min stanno sopra il massimo
        # osservato sui run sani (114-183s su 7 run, ~30% del cap da 10min) con
        # ampio margine, e sotto il cap del job. NIENTE `filter: blob:none`:
        # con `fetch-depth: 1` e' un peggioramento misurato (+125% su
        # tests.yml, vedi la nota in pr-review-loop.yml e #5164), non un
        # miglioramento.
        timeout-minutes: 6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Detect daily run
        id: schedule
        # Identify the daily run by the cron expression that triggered it,
        # not by the wall-clock hour. GitHub Actions routinely delays scheduled
        # runs past the next hour boundary; checking `date -u +%H` would then
        # mis-classify the daily run as hourly and skip the snapshot step.
        run: |
          if [ "${{ github.event.schedule }}" = "37 6 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and upload fuel prices to Firestore
        run: |
          if [ "${{ steps.schedule.outputs.daily }}" = "true" ]; then
            node scripts/generate-fuel-prices-dataset.mjs --save-local
          else
            node scripts/generate-fuel-prices-dataset.mjs
          fi

      - name: Persist daily snapshot of raw fuel prices JSON
        if: steps.schedule.outputs.daily == 'true'
        run: |
          mkdir -p data/fuel-prices-history
          cp public/data/fuel-prices.json "data/fuel-prices-history/$(date -u +%F).json"

      - name: Snapshot fuel history for SEO pages (F6)
        if: steps.schedule.outputs.daily == 'true'
        run: node scripts/snapshot-fuel-history.mjs

      # Daily: commit repo cache + trigger deploy (with rebase-retry for concurrent pushes)
      - name: Commit repo cache (daily only)
        id: commit
        if: steps.schedule.outputs.daily == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/fuel-prices.json public/data/fuel-prices.json data/fuel-prices-history/
          if git diff --cached --quiet; then
            echo "No fuel price changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "⛽ Daily fuel prices cache update"
            # Centralized rebase-retry helper handles concurrent pushes from
            # other workflows. Fuel cache files are deterministic outputs of
            # generate-fuel-prices-dataset.mjs; on rebase conflict re-fetch
            # and re-snapshot before retrying.
            bash scripts/lib/git-push-with-retry.sh \
              --regenerate-cmd 'node scripts/generate-fuel-prices-dataset.mjs --save-local && mkdir -p data/fuel-prices-history && cp public/data/fuel-prices.json data/fuel-prices-history/$(date -u +%F).json && node scripts/snapshot-fuel-history.mjs && git add -f data/fuel-prices.json public/data/fuel-prices.json data/fuel-prices-history/'
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load secrets from Remote Config
        if: steps.commit.outputs.has_changes == 'true'
        run: node scripts/load-rc-env.mjs

      - name: Trigger deploy workflow
        if: steps.commit.outputs.has_changes == 'true'
        run: bash scripts/lib/trigger-deploy.sh || true

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
