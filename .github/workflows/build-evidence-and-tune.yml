name: Build evidence + tune quota
on:
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC
  workflow_dispatch:

env:
  DATA_REFRESH_BRANCH: chore/build-evidence-and-tune

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Persist the local embedding model (multilingual-e5-small, ~120MB)
      # downloaded once from the public HF CDN by @huggingface/transformers, so
      # build-article-embeddings.mjs doesn't re-download it every run (~5 min).
      # No API key involved — purely a CDN artifact cache.
      - name: Cache local embedding model
        uses: actions/cache@v6
        with:
          path: .cache/transformers
          key: transformers-multilingual-e5-small-v1

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Env for build-evidence-index.mjs (GA4_PROPERTY_ID, POSTHOG_*) +
      # build-article-embeddings.mjs (OPENAI_API_KEY) is populated via
      # load-rc-env.mjs above, which writes RC keys to $GITHUB_ENV.
      # No explicit `env:` here — that would shadow RC values with empty
      # GitHub secret references. FIREBASE_SERVICE_ACCOUNT_JSON also
      # already in env via the first step.
      #
      # The evidence index (GA4/PostHog network fetch) and the article
      # embeddings (local ONNX CPU work) are independent and write disjoint
      # files (data/evidence-index.json vs data/article-embeddings*.{bin,json}),
      # so they run as ordinary shell processes in parallel. The explicit waits
      # keep the commit behind both commands and preserve either failure.
      - name: Build evidence index + article embeddings (parallel)
        env:
          # Local ONNX embeddings (no API key). Cache model weights in-repo so the
          # actions/cache step above persists them across runs.
          TRANSFORMERS_CACHE: .cache/transformers
        run: |
          set +e
          node scripts/build-evidence-index.mjs > "$RUNNER_TEMP/evidence-index.log" 2>&1 &
          evidence_pid=$!
          node scripts/build-article-embeddings.mjs --incremental > "$RUNNER_TEMP/article-embeddings.log" 2>&1 &
          embeddings_pid=$!
          evidence_status=0
          embeddings_status=0
          wait "$evidence_pid" || evidence_status=$?
          wait "$embeddings_pid" || embeddings_status=$?
          cat "$RUNNER_TEMP/evidence-index.log"
          cat "$RUNNER_TEMP/article-embeddings.log"
          if [ "$evidence_status" -ne 0 ] || [ "$embeddings_status" -ne 0 ]; then
            echo "evidence_status=$evidence_status embeddings_status=$embeddings_status"
            exit 1
          fi

      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Open PR with evidence snapshot
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          # Stage whichever evidence artifacts exist (embeddings.bin missing
          # if OPENAI_API_KEY is unset; meta JSON is always written).
          paths=()
          for file in data/evidence-index.json data/article-embeddings.bin data/article-embeddings-meta.json; do
            if [ -f "$file" ]; then paths+=(--path "$file"); fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No evidence artifacts to publish"
            exit 0
          fi

          body="$RUNNER_TEMP/build-evidence-refresh-pr-body.md"
          cat > "$body" <<EOF
          Automated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Pubblica l'indice evidence e gli artefatti embeddings sul branch stabile ${DATA_REFRESH_BRANCH}; il required check vitest (unit + integration) li valida prima dell'ingresso su main.

          ## Non implementato (ancora)
          Nessuno — questa PR contiene gli artefatti evidence generati dal workflow.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            "${paths[@]}" \
            --branch "$DATA_REFRESH_BRANCH" \
            --commit-message "chore(evidence): refresh $(date -u +%Y-%m-%d)" \
            --title "chore(data): refresh build evidence" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

  tune-quota:
    needs: build-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Prepare Firebase credentials for refresh PR auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a refresh PR"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Load evidence snapshot from build-evidence job
        run: |
          set -euo pipefail
          remote_branch="$(git ls-remote --heads origin "refs/heads/$DATA_REFRESH_BRANCH")"
          if [ -n "$remote_branch" ]; then
            git fetch --no-tags origin "$DATA_REFRESH_BRANCH"
            git checkout -B "$DATA_REFRESH_BRANCH" FETCH_HEAD
          else
            echo "No evidence PR branch was created; using the current main snapshot."
          fi

      - name: Tune discovery quota
        run: node scripts/tune-discovery-quota.mjs

      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Update PR with tune state
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/build-evidence-refresh-pr-body.md"
          cat > "$body" <<EOF
          Automated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Pubblica indice evidence, embeddings e stato quota sul branch stabile ${DATA_REFRESH_BRANCH}; il required check vitest (unit + integration) valida l'aggiornamento prima dell'ingresso su main.

          ## Non implementato (ancora)
          Nessuno — questa PR contiene tutti gli snapshot generati dal workflow.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/quota-state.json \
            --path data/quota-history.jsonl \
            --branch "$DATA_REFRESH_BRANCH" \
            --commit-message "chore(tune): quota update $(date -u +%Y-%m-%d)" \
            --title "chore(data): refresh build evidence and tune quota" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
