name: Build evidence + tune quota
on:
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC
  workflow_dispatch:

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Persist the local embedding model (multilingual-e5-small, ~120MB)
      # downloaded once from the public HF CDN by @huggingface/transformers, so
      # build-article-embeddings.mjs doesn't re-download it every run (~5 min).
      # No API key involved — purely a CDN artifact cache.
      - name: Cache local embedding model
        uses: actions/cache@v5
        with:
          path: .cache/transformers
          key: transformers-multilingual-e5-small-v1

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Env for build-evidence-index.mjs (GA4_PROPERTY_ID, POSTHOG_*) +
      # build-article-embeddings.mjs (OPENAI_API_KEY) is populated via
      # load-rc-env.mjs above, which writes RC keys to $GITHUB_ENV.
      # No explicit `env:` here — that would shadow RC values with empty
      # GitHub secret references. FIREBASE_SERVICE_ACCOUNT_JSON also
      # already in env via the first step.
      #
      # The evidence index (GA4/PostHog network fetch) and the article
      # embeddings (local ONNX CPU work) are independent and write disjoint
      # files (data/evidence-index.json vs data/article-embeddings*.{bin,json}),
      # so they run as background steps concurrently. `wait-all` rejoins before
      # the commit; a failure in either still fails the job (verified live).
      - name: Build evidence index
        id: evidence-index
        background: true
        run: node scripts/build-evidence-index.mjs

      - name: Build article embeddings (incremental)
        id: article-embeddings
        background: true
        run: node scripts/build-article-embeddings.mjs --incremental
        env:
          # Local ONNX embeddings (no API key). Cache model weights in-repo so the
          # actions/cache step above persists them across runs.
          TRANSFORMERS_CACHE: .cache/transformers

      - name: Wait for evidence index + embeddings
        wait-all: true

      - name: Commit evidence
        run: |
          git config user.name "evidence-bot"
          git config user.email "evidence-bot@frontaliereticino.ch"
          # Stage whichever evidence artifacts exist (embeddings.bin missing
          # if OPENAI_API_KEY is unset; meta JSON is always written).
          for f in data/evidence-index.json data/article-embeddings.bin data/article-embeddings-meta.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git pull --rebase --autostash origin main
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "chore(evidence): refresh $(date -u +%Y-%m-%d)"
          # Retry-on-rebase loop — same pattern as #794/#804/#805/#806.
          # Concurrent producers on main (crawlers + scheduled refreshers
          # + post-merge auto-commits) regularly out-race a single push;
          # mirror the loop already proven elsewhere.
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed evidence refresh."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main || true
            if ! git -c rebase.autoStash=true rebase origin/main; then
              echo "⚠️ Rebase conflict on evidence data files — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving evidence uncommitted."
          exit 1

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

  tune-quota:
    needs: build-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Pull latest evidence commit from build-evidence job
        run: git pull --rebase --autostash origin main

      - name: Tune discovery quota
        run: node scripts/tune-discovery-quota.mjs

      - name: Commit tune state
        run: |
          git config user.name "tune-bot"
          git config user.email "tune-bot@frontaliereticino.ch"
          git add data/quota-state.json data/quota-history.jsonl 2>/dev/null || true
          git pull --rebase --autostash origin main
          if git diff --cached --quiet; then
            echo "No tune changes to commit"
            exit 0
          fi
          git commit -m "chore(tune): quota update $(date -u +%Y-%m-%d)"
          # Retry-on-rebase loop — same as the build-evidence job above.
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed tune state."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main || true
            if ! git -c rebase.autoStash=true rebase origin/main; then
              echo "⚠️ Rebase conflict on quota state files — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving tune uncommitted."
          exit 1

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
