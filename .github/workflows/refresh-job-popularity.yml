name: Refresh Job Popularity

# Reads the `job_views` Firestore collection ONCE per day and commits the
# resulting `data/job-popularity.json` snapshot to main. Other workflows
# (deploy.yml, send-newsletter.yml) read the committed file instead of
# re-fetching the whole collection on every push.
#
# Cost rationale, in two rounds:
#   1. Before this workflow, fetch-job-popularity.mjs ran on every deploy +
#      every newsletter send (~511 executions / 7d), each one scanning the
#      whole `job_views` collection — ~2.9k docs then, ~1.48M reads / 7d.
#      The daily cron dropped that to 7 executions a week.
#   2. `job_views` has since grown to 66.107 docs (measured 2026-08-24), so
#      those 7 full scans were back to ~462k reads / week. The script is now
#      incremental (`lastViewed >=` the previous scan, projected with
#      `.select`), with a full scan on the first run, on `--full`, and
#      whenever data/job-popularity.meta.json is missing or older than 7d.
# The metadata file is what makes the incremental path possible, so it is
# committed alongside the snapshot — including on days when only it changes.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # 06:00 CET / 07:00 CEST — before the morning deploys

permissions:
  contents: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: refresh-job-popularity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Fetch job popularity from Firestore
        run: node scripts/fetch-job-popularity.mjs

      - name: Commit and push popularity snapshot
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          # `-A`, non un add semplice: scripts/fetch-job-popularity.mjs CANCELLA
          # il metadato quando cade nel fallback, e un add semplice non stagia
          # quella rimozione — il commit successivo si ritroverebbe il metadato
          # vecchio accanto a un job-popularity.json azzerato, che e' esattamente
          # lo stato che writeFallback() esiste per impedire. Entrambi i pathspec
          # sono tracciati (il metadato ha un seed committato), quindi `-A` non
          # puo' fallire con "did not match any files".
          git add -A data/job-popularity.json data/job-popularity.meta.json
          git diff --cached --quiet && echo "No popularity changes to commit" && exit 0
          git commit -m "chore(data): refresh job popularity snapshot"
          # Concurrent data-refresh workflows can push to main at the same time
          # (memory project_workflow_push_race_pattern). Use the shared
          # rebase-retry helper. The fetch is deterministic given the current
          # job_views state, so on conflict we re-run it after rebasing.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/fetch-job-popularity.mjs && git add -A data/job-popularity.json data/job-popularity.meta.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh Job Popularity" \
            --description "Job popularity refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
