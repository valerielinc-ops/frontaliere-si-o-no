name: Refresh Job Popularity

# Reads the `job_views` Firestore collection ONCE per day and publishes the
# resulting `data/job-popularity.json` snapshot through a PR. Other workflows
# (deploy.yml, send-newsletter.yml) read the committed file instead of
# re-fetching the whole collection on every push. The PR is required because
# main's ruleset requires the vitest status check before accepting a write.
#
# Cost rationale, in two rounds:
#   1. Before this workflow, fetch-job-popularity.mjs ran on every deploy +
#      every newsletter send (~511 executions / 7d), each one scanning the
#      whole `job_views` collection — ~2.9k docs then, ~1.48M reads / 7d.
#      The daily cron dropped that to 7 executions a week.
#   2. `job_views` has since grown to 66.107 docs (measured 2026-08-24), so
#      those 7 full scans were back to ~462k reads / week. The script is now
#      incremental (`lastViewed >=` the previous scan, projected with
#      `.select`), with a full scan on the first run, on `--full`, and
#      whenever data/job-popularity.meta.json is missing or older than 7d.
# The metadata file is what makes the incremental path possible, so it is
# committed alongside the snapshot — including on days when only it changes.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # 06:00 CET / 07:00 CEST — before the morning deploys

permissions:
  contents: write
  pull-requests: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: refresh-job-popularity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Fetch job popularity from Firestore
        run: node scripts/fetch-job-popularity.mjs

      - name: Open PR with popularity snapshot
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          # `-A`, non un add semplice: scripts/fetch-job-popularity.mjs CANCELLA
          # il metadato quando cade nel fallback, e un add semplice non stagia
          # quella rimozione — il commit successivo si ritroverebbe il metadato
          # vecchio accanto a un job-popularity.json azzerato, che e' esattamente
          # lo stato che writeFallback() esiste per impedire. Entrambi i pathspec
          # sono tracciati (il metadato ha un seed committato), quindi `-A` non
          # puo' fallire con "did not match any files".
          body="$RUNNER_TEMP/job-popularity-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il refresh incrementale aggiorna \`data/job-popularity.json\` e il relativo metadato tramite il branch stabile \`chore/refresh-job-popularity\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.
          - Closes #10490

          ## Non implementato (ancora)
          Nessuno — aggiornamento dati automatizzato, senza residui.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/job-popularity.json \
            --path data/job-popularity.meta.json \
            --branch chore/refresh-job-popularity \
            --commit-message "chore(data): refresh job popularity snapshot" \
            --title "chore(data): refresh job popularity snapshot" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh Job Popularity" \
            --description "Job popularity refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
