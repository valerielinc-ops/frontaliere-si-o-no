name: Audit dist from prior run
on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: 'Deploy run ID to reuse the github-pages artifact from (numeric)'
        required: true
        type: string
      audits:
        description: >-
          Comma-sep npm script names (newlines count as separators too). A BARE
          name is prefixed with `audit:` (`page-weight` → `audit:page-weight`);
          `all` invokes the unified runner (6 dist-walking audits in 1 Node
          process). A name that ALREADY carries a canonical gate namespace —
          `audit:`, `validate:`, `lint:`, `gate:`, `check:`, i.e. the same set as
          GATE_NS_RE in scripts/ci/gate-wiring-inventory.mjs — is invoked
          LITERALLY, so a gate can be replayed here too. Every resolved name is
          checked against package.json BEFORE running: an unknown name fails
          explicitly as "script inesistente" instead of turning into a wrapper
          failure that reads like a red gate. To replay #5875 pass
          `gate:dist-quality` (the npm script; `dist:quality-tests` is only the
          CHECK-RUN LABEL post-deploy-validate-dist.yml gives its report — there
          is no npm script by that name). For #5874 pass `gate:seo-source`:
          it runs with RUN_DIST_GATES=1 against the rehydrated dist and the
          jobs dataset of the same run; its three audit-all mirrors
          (breadcrumb, FAQPage, ImageObject) assert the verdict audit:all
          writes for this dist, and the step runs those auditors first when
          nothing requested before it has.
          Examples: `all` / `all,page-weight,max-bfs-depth` /
          `gate:dist-quality,gate:seo-source`.
        required: false
        default: 'all,page-weight,max-bfs-depth'
        type: string
      audit_sample_rate:
        description: 'Optional AUDIT_SAMPLE_RATE override for the unified runner and sampled audits.'
        required: false
        default: '1'
        type: string
      audit_sample_salt:
        description: 'Optional AUDIT_SAMPLE_SALT override for rotating sampled audits.'
        required: false
        default: '0'
        type: string
      audit_all_audits:
        description: 'Optional CSV filter passed to audit:all (used by the publish-side report job to exclude integrity auditors already run by validate-dist).'
        required: false
        default: ''
        type: string
      deploy_ref:
        description: 'Commit SHA containing the audit scripts. Empty = workflow default.'
        required: false
        default: ''
        type: string
      shard_artifact_run_id:
        description: >-
          Run ID containing the en/de/fr shard artifacts (locale-dist-*,
          shard-batch-*-dist-{en,de,fr}): a deploy-publish run, NOT the build.
          Empty = resolved from the deploy-publish runs titled "Publish Pages
          build <deploy_run_id> @ …" (any conclusion: the run that really
          published is often `cancelled` by its own report job).
        required: false
        default: ''
        type: string
      allow_mixed_shards:
        description: >-
          'true' audits a dist whose shards partly came from a git clone of
          the shard repos' CURRENT main (artifacts expired). Default 'false':
          such a replay is incoherent — trunk, sitemaps and jobs dataset of
          the build under shards of today — and fails before any verdict.
        required: false
        default: 'false'
        type: string

  workflow_call:
    inputs:
      deploy_run_id:
        description: 'Deploy/build run ID whose github-pages and jobs-master artifacts are audited.'
        required: true
        type: string
      audits:
        description: 'Comma-separated report audit names.'
        required: true
        type: string
      audit_sample_rate:
        description: 'AUDIT_SAMPLE_RATE for sampled audits.'
        required: false
        default: '1'
        type: string
      audit_sample_salt:
        description: 'AUDIT_SAMPLE_SALT for sampled audits.'
        required: false
        default: '0'
        type: string
      audit_all_audits:
        description: 'Optional CSV filter passed to audit:all.'
        required: false
        default: ''
        type: string
      deploy_ref:
        description: 'Commit SHA containing the audit scripts. Empty = caller default.'
        required: false
        default: ''
        type: string
      shard_artifact_run_id:
        description: 'Run ID containing the locale/section shard artifacts to rehydrate.'
        required: false
        default: ''
        type: string
      allow_mixed_shards:
        description: >-
          The publish run passes its own run id; a clone fallback there reads
          the shard it pushed minutes earlier, so the default stays lenient.
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Replayed source gates must execute against the rehydrated report
      # rather than self-skipping behind their default safety switch.
      RUN_DIST_GATES: '1'
    # The audits now walk the COMPLETE rehydrated site instead of the trunk
    # artifact alone. Keep the report runner below the hosted six-hour ceiling;
    # it is independent of the 350-minute dist-validation lock and cannot delay
    # publish even when a quality walk is slow.
    timeout-minutes: 350
    steps:
      - name: Checkout repo (for audit scripts only)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_ref }}

      # Rehydrating both shard families onto the extracted tarball needs room
      # the 14 GB default partition doesn't have. Mirrors the identical step in
      # post-deploy-validate-dist.yml (added there after run 26287421188 ran the
      # runner out of disk mid-extract). Best-effort: `|| true` so a future
      # image refresh that already dropped a path can't fail the job.
      - name: Free disk space on runner
        # One list for every job that rehydrates the logical dist; it prints
        # df (blocks AND inodes) before/after. See its header for why.
        run: bash scripts/ci/free-runner-disk.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minimal deps (no build)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Fetch the deployed dist (github-pages artifact)
        id: pages
        uses: ./.github/actions/fetch-pages-artifact
        with:
          # Required input of this workflow: an operator names the run to
          # replay, so the action pins it and does NOT walk back to another.
          run-id: ${{ inputs.deploy_run_id }}
          output-dir: /tmp/pages
          github-token: ${{ github.token }}

      - name: Extract dist/ from the artifact tarball
        env:
          TAR_PATH: ${{ steps.pages.outputs.tar-path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xf "$TAR_PATH" -C dist
          rm -f "$TAR_PATH"
          echo "Restored $(find dist -type f | wc -l) files into dist/"

      # A replay must use artifacts belonging to the selected run (or to the
      # explicitly supplied publisher run). Resolve every live subtree before
      # rehydrate can reach its git-clone resilience path; an expired artifact
      # is an inconclusive replay, never permission to read today's shard-main.
      - name: Resolve replay shard artifacts and provenance (fail closed)
        if: ${{ inputs.shard_artifact_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          SHARD_ARTIFACT_RUN_ID: ${{ inputs.shard_artifact_run_id }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPLAY_DIST_DIR: dist
          REHYDRATE_PROVENANCE_FILE: ${{ runner.temp }}/replay-shard-provenance.tsv
        run: bash scripts/ci/resolve-replay-shard-runs.sh

      # The `github-pages` artifact is the TRUNK only. With LOCALE_SHARDS_LIVE /
      # <SECTION>_SHARD_LIVE on, deploy.yml strips the en/de/fr subtrees and the
      # per-section subtrees (cerca-lavoro-ticino, cerca-lavoro-svizzera, …) out
      # of it — they are served from their own shard repos through the
      # Cloudflare Worker at the same URLs. Auditing the tarball as-is walks a
      # fraction of the site and every dist-walking audit reports the absent
      # subtrees as a defect OF THE SITE: replay run 30346794790 restored 224,032
      # files, visited 41,837 paths, and declared ~68k cluster URLs an entire
      # content tier below crawl depth (issue #4857) — while flagging shards
      # 001-005 too, which data/bfs-depth-baseline.json records as 100% reachable
      # at depth ≤4. Every cluster canonicalizes under /cerca-lavoro-svizzera/,
      # one of the stripped section subtrees. post-deploy-validate-dist.yml has
      # always rehydrated before auditing; this replay did not.
      #
      # NOTE on replaying an OLD run: the rehydrate scripts prefer that run's
      # shard artifacts and fall back to a `git clone` of the shard repo (whose
      # main branch holds the LATEST push) when they have expired. Such a dist
      # mixes trunk-of-then with shards-of-now; every subtree's source is
      # recorded in REHYDRATE_PROVENANCE_FILE and the coherence step below
      # refuses the mix unless allow_mixed_shards is 'true'.
      - name: Rehydrate locale then section shards into dist/ (when sharding active)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          SHARD_ARTIFACT_RUN_ID: ${{ inputs.shard_artifact_run_id }}
          AUDIT_REPLAY_FAIL_CLOSED: true
          # Where every subtree's bytes came from (trunk / artifact / clone),
          # read by the coherence step below and uploaded with the reports.
          REHYDRATE_PROVENANCE_FILE: ${{ runner.temp }}/replay-shard-provenance.tsv
          # A strict replay may not fall back to a clone because a ~10 GB IT
          # batch zip took longer than the publish run's 150 s.
          REHYDRATE_ZIP_TIMEOUT: ${{ inputs.allow_mixed_shards == 'true' && '150' || '900' }}
          # Every `*_SHARD_LIVE` / `LOCALE_SHARDS_LIVE` repo variable at once,
          # exported below, instead of the hand-listed 27-line `env:` block
          # post-deploy-validate-dist.yml carries. Sections keep being added
          # (scripts/lib/section-shard-slugs.json) and a hand-copied list
          # silently misses the new ones; this form cannot drift (AGENTS.md #6).
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -uo pipefail
          eval "$(jq -r 'to_entries[]
                         | select(.key | test("_SHARDS?_LIVE$"))
                         | "export \(.key)=\(.value | @sh)"' <<< "$REPO_VARS_JSON")"

          # Same order and same failure contract as post-deploy-validate-dist.yml:
          # locale first and hard-fail (an incomplete locale shard is a real
          # gate), sections strictly AFTER it and soft-fail (they warn and
          # degrade coverage). Sections must not run concurrently with the locale
          # pass: rehydrate_section writes into dist/$loc/<section>, nested inside
          # the subtree rehydrate_locale wipes and repopulates.
          LOCALE_RC=0
          bash scripts/lib/rehydrate-locale-shards.sh || LOCALE_RC=$?
          bash scripts/lib/rehydrate-section-shards.sh
          echo "dist/ now holds $(find dist -type f | wc -l) files"
          if [ "$LOCALE_RC" -ne 0 ]; then exit "$LOCALE_RC"; fi

      - name: Verify replay shard provenance after rehydrate
        env:
          REHYDRATE_PROVENANCE_FILE: ${{ runner.temp }}/replay-shard-provenance.tsv
        run: bash scripts/lib/rehydrate-provenance.sh verify dist

      # Precondition, not a gate: abort BEFORE any audit runs (and before a
      # misleading report is uploaded) if dist/ is still missing whole subtrees.
      # Without this, a rehydrate that silently degrades turns straight back into
      # a fabricated structural verdict about the site.
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs

      # Complete is not the same as coherent: a subtree cloned from a shard
      # repo's main holds TODAY's pages under the trunk, sitemaps and jobs
      # dataset of the build — replay 39952023039 read expired jobs as
      # "sitemap URL without HTML". The article shards are never packed into
      # artifacts (no push ok-marker), so they come from a clone by
      # construction, in validate-dist too.
      - name: Assert the rehydrated shards are coherent with the build
        env:
          ALLOW_MIXED: ${{ inputs.allow_mixed_shards }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REHYDRATE_PROVENANCE_FILE: ${{ runner.temp }}/replay-shard-provenance.tsv
        run: |
          set -euo pipefail
          prov="$REHYDRATE_PROVENANCE_FILE"
          # Every subtree the rehydrate owns must have a recorded origin: an
          # unrecorded one (a provenance write that failed in a fail-soft
          # worker) would otherwise pass as coherent by omission.
          eval "$(jq -r 'to_entries[] | select(.key | test("_SHARDS?_LIVE$")) | "export \(.key)=\(.value | @sh)"' <<< "$REPO_VARS_JSON")"
          expected="$(
            if [ "${LOCALE_SHARDS_LIVE:-}" = "true" ]; then printf '%s\n' en de fr; fi
            jq -r 'to_entries[] | select(.key | startswith("_") | not) | "\(.key)\t\(.value.it)\t\(.value.en)\t\(.value.de)\t\(.value.fr)"' scripts/lib/section-shard-slugs.json \
              | while IFS=$'\t' read -r section it en de fr; do
                  live_var="$(printf '%s' "$section" | tr '[:lower:]' '[:upper:]')_SHARD_LIVE"
                  [ "${!live_var:-}" = "true" ] || continue
                  printf '%s\n' "$it" "en/$en" "de/$de" "fr/$fr"
                done
          )"
          unrecorded="$(comm -23 <(printf '%s\n' "$expected" | grep . | sort -u) <(cut -f1 "$prov" 2>/dev/null | sort -u))"
          if [ -n "$unrecorded" ]; then
            echo "::error::$(printf '%s\n' "$unrecorded" | grep -c .) sottoalberi senza provenienza registrata: la coerenza non è dimostrabile"
            printf '%s\n' "$unrecorded" | head -20 | sed 's/^/  /'
            exit 1
          fi
          echo "Provenienza dei sottoalberi reidratati:"
          cut -f2 "$prov" | sort | uniq -c | sed 's/^/  /'
          if [ ! -s "$prov" ]; then
            # Sharding is live on every run this workflow replays: an empty
            # provenance means the rehydrate could not record where its bytes
            # came from, so coherence cannot be shown — never read as "clean".
            echo "::error::provenienza del rehydrate assente o vuota ($prov): la coerenza del dist non è dimostrabile"
            exit 1
          fi
          # Article shard repos are frontaliere-articolifrontaliere-<loc> and
          # frontaliere-articolisvizzera-<loc> (hyphen-free section names, see
          # scripts/lib/section-shard-slugs.json); accept a hyphenated spelling
          # too, bounded by the locale suffix, `@<sha>` or the end.
          mixed="$(awk -F'\t' '$2 ~ /^clone/ && $3 !~ /^frontaliere-articoli-?(frontaliere|svizzera)(-[a-z][a-z])?@/ && $3 !~ /^frontaliere-articoli-?(frontaliere|svizzera)(-[a-z][a-z])?$/' "$prov")"
          if [ -z "$mixed" ]; then
            echo "✅ ogni sottoalbero viene dal trunk o dagli artifact del build/publish (articoli: clone per costruzione)"
            exit 0
          fi
          echo "Sottoalberi da clone del main attuale degli shard:"
          printf '%s\n' "$mixed" | sed 's/^/  /'
          if [ "$ALLOW_MIXED" = "true" ]; then
            echo "::warning::$(printf '%s\n' "$mixed" | grep -c .) sottoalberi da clone: il dist è misto, i verdetti non descrivono solo questo build"
            exit 0
          fi
          echo "::error::replay incoerente: $(printf '%s\n' "$mixed" | grep -c .) sottoalberi reidratati da clone invece che dagli artifact del build. Nessun verdetto: rilancia su un build con artifact vivi o con allow_mixed_shards=true."
          exit 1

      - name: Download master jobs data for data-backed reports
        uses: actions/download-artifact@v8
        with:
          name: jobs-master-${{ inputs.deploy_run_id }}
          path: /tmp/jobs-master
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}

      - name: Restore master jobs data for data-backed reports
        run: |
          set -euo pipefail
          mkdir -p data public/data
          cp -f /tmp/jobs-master/jobs.json data/jobs.json
          cp -f data/jobs.json public/data/jobs.json
          cp -f /tmp/jobs-master/jobs-crawler-summaries.json data/jobs-crawler-summaries.json

      # The source SEO and OG checks used to prepare these snapshots inside
      # validate-dist. They are report-only now; keep their inputs pinned to
      # this same rehydrated run before invoking the report surface.
      - name: Prepare report-only SEO inputs
        if: >-
          ${{ contains(inputs.audits, 'gate:seo-source') ||
              contains(inputs.audits, 'validate:og-images') }}
        run: |
          set -euo pipefail
          node scripts/migrate-all-known-job-slugs-canton-aware.mjs
          node scripts/sync-published-blog-image-evidence.mjs

      - name: Run requested audits
        id: audits
        env:
          # NIENTE `NODE_OPTIONS` a livello di step: l'heap è per-invocazione,
          # deciso da `heap_for` qui sotto. Fissarlo qui lo faceva ereditare
          # anche ai gate `gate:*`, che in post-deploy girano con un heap più
          # piccolo — e un replay che gira con un heap DIVERSO dall'originale
          # riproduce un'altra corsa, non quella sotto indagine.
          #
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_AUDITS: ${{ inputs.audits }}
          INPUT_AUDIT_ALL: ${{ inputs.audit_all_audits }}
          AUDIT_SAMPLE_RATE: ${{ inputs.audit_sample_rate }}
          AUDIT_SAMPLE_SALT: ${{ inputs.audit_sample_salt }}
          # Keep audit:all replays equivalent to the post-deploy validator:
          # only its single-H1 auditor reads this flag, and only for the
          # reassembled published corpus.
          AUDIT_REASSEMBLED_CORPUS: '1'
        run: |
          set +e
          mkdir -p /tmp/audit-logs
          : > /tmp/verdicts.txt
          FAIL=0
          IDX=0

          # ── replay-resolution:start ─────────────────────────────────────────
          # Blocco AUTOCONTENUTO: `tests/audit-dist-from-run-gate-names.test.ts`
          # lo estrae fra questi due marker e lo ESEGUE con `bash` su nomi
          # campione. Non aggiungere qui dentro nulla che dipenda dal runner
          # oltre `package.json` nella cwd: il test verifica il COMPORTAMENTO
          # della risoluzione, non la presenza di una variabile.
          #
          # I namespace canonici sono quelli di GATE_NS_RE in
          # scripts/ci/gate-wiring-inventory.mjs — un'unica definizione di «cosa
          # è un cancello» in tutto il repo. Prima qui c'era 'gate|audit|dist':
          # mancavano `validate:`/`lint:`/`check:` (26 script su main) e ognuno
          # di quei nomi ricadeva nel difetto #5918 (prefisso `audit:` messo a
          # forza → `Missing script` → FAIL fabbricato dal wrapper, che dal job
          # summary si legge identico a «il gate è rosso»). E c'era `dist:`, che
          # non serve nessuno script replayabile: l'unico `dist:` invocabile
          # sarebbe `dist:shrink`, che MUTA `dist/` sul posto — in mezzo al loop
          # degli audit produrrebbe verdetti su byte mai serviti. Tolto.
          KNOWN_PREFIXES='audit|validate|lint|gate|check'

          # Virgole E newline sono separatori. `IFS=',' read -ra <<<` leggeva
          # SOLO la prima riga: un input incollato su più righe perdeva in
          # silenzio tutto il resto e il job usciva verde avendo auditato metà
          # lista. `xargs` non va bene come trim: su una virgoletta spaiata
          # esce in errore restituendo stringa vuota, e `echo` si mangia un
          # nome che inizia per `-n`/`-e` trattandolo da opzione.
          parse_names() {
            printf '%s' "$1" | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -v '^$'
          }

          # Nome nudo → prefisso `audit:`. Nome con un namespace canonico →
          # LETTERALE. Nome con un namespace sconosciuto → resta prefissato e
          # cade nel preflight qui sotto con un errore che dice quale.
          resolve_script() {
            case "$1" in
              report:job-title-locale|report:meta-description)
                printf '%s\n' "$1"
                ;;
              *:*)
                if grep -qE "^($KNOWN_PREFIXES):" <<<"$1"; then
                  printf '%s\n' "$1"
                else
                  printf 'audit:%s\n' "$1"
                fi
                ;;
              *) printf 'audit:%s\n' "$1" ;;
            esac
          }

          # PREFLIGHT: lo script deve ESISTERE. Senza questo, un nome
          # sconosciuto (namespace non canonico, etichetta di check-run come
          # `dist:quality-tests`, refuso) arrivava a `npm run`, usciva rc≠0 e
          # veniva contato come audit fallito: di nuovo un FAIL fabbricato,
          # cioè esattamente la classe #5918 spostata di un metro.
          script_exists() {
            case "$1" in
              report:job-title-locale|report:meta-description) return 0 ;;
            esac
            jq -e --arg s "$1" '.scripts | has($s)' package.json >/dev/null 2>&1
          }

          # PARITÀ DI HEAP col run che si sta riproducendo.
          #   audit:*  → 8192. Sono i walker full-tree (BFS/orphan-sitemap): il
          #              replay 30383007845 morì `Reached heap limit` rc=134
          #              sull'heap di default, e post-deploy li lancia a 8192
          #              (:2057-2058).
          #   tutto il resto (gate:/validate:/lint:/check:) → 4096, che è ciò
          #              che post-deploy dà allo step dove gira
          #              `gate:dist-quality` (env :882, invocazione :1494);
          #              `gate:seo-source` gira lì senza NODE_OPTIONS, cioè sul
          #              default di Node, dello stesso ordine.
          # Perché non «il massimo dei due per tutti»: un gate replayato a 8192
          # su un runner da ~7 GB usabili non fallisce come in post-deploy —
          # invece dell'ERR_WORKER_OUT_OF_MEMORY in-process, che è il verdetto
          # informativo che #5875 ha davvero prodotto, si prende un OOM-kill del
          # kernel a rc=137. Stessa causa, verdetto di forma diversa: la
          # riproduzione mente sul finale.
          heap_for() {
            case "$1" in
              audit:*) printf '8192\n' ;;
              *)       printf '4096\n' ;;
            esac
          }
          # ── replay-resolution:end ───────────────────────────────────────────

          # gate:seo-source runs with RUN_DIST_GATES=1, which also arms the
          # vitest mirrors of three audit-all auditors. On the reassembled
          # corpus (6.2M HTML files) each mirror used to re-walk the tree
          # (breadcrumb ABORTED on its 240s budget, FAQPage/ImageObject "timed
          # out" at 300s — replay 39952023039); they now assert the report
          # audit:all writes for this same dist (tests/helpers/auditAllMirror.ts).
          # When nothing requested before gate:seo-source produced those
          # reports, produce them here: ONE shared walk, same heap, same
          # sampling as audit:all, its log kept outside the per-request logs
          # the reconciliation below counts.
          ensure_seo_source_mirror_reports() {
            local missing="" a
            for a in breadcrumb-coverage faqpage-validity image-object-license; do
              [ -s "dist/audit-reports/$a.json" ] || missing="${missing:+$missing,}$a"
            done
            [ -z "$missing" ] && return 0
            mkdir -p /tmp/audit-prereq-logs
            echo "──── prerequisito di gate:seo-source: npm run audit:all -- --audits=$missing (heap 8192 MB) ────" | tee -a /tmp/summary.txt
            (NODE_OPTIONS="--max-old-space-size=8192" npm run audit:all -- --audits="$missing" 2>&1) > /tmp/audit-prereq-logs/seo-source-mirrors.log
            echo "   rc=$? — il verdetto lo porta gate:seo-source (i report restano in dist/audit-reports)" | tee -a /tmp/summary.txt
            grep -E '^(✅|❌) ' /tmp/audit-prereq-logs/seo-source-mirrors.log | tee -a /tmp/summary.txt || true
          }

          REQUESTED=$(parse_names "$INPUT_AUDITS")
          if [ -z "$REQUESTED" ]; then
            echo "::error::L'input 'audits' non contiene nessun nome dopo il parsing (ricevuto: '$INPUT_AUDITS')."
            exit 1
          fi

          # fd 9, non stdin: il corpo lancia `npm run` (che spawna node) e
          # qualunque byte letto lì è una riga di richiesta che il `read`
          # successivo non vede — un audit mai eseguito sotto un summary verde.
          while IFS= read -r -u 9 n; do
            [ -z "$n" ] && continue
            IDX=$((IDX+1))
            script=$(resolve_script "$n")
            if ! script_exists "$script"; then
              echo "❌ FAIL $n → npm run $script: script INESISTENTE in package.json (namespace canonici: ${KNOWN_PREFIXES}; un nome nudo prende il prefisso audit:). Non è il verdetto di un gate, è un nome sbagliato." | tee -a /tmp/summary.txt
              printf 'VERDICT\t%s\tNO-SCRIPT\n' "$n" >> /tmp/verdicts.txt
              FAIL=$((FAIL+1))
              continue
            fi
            heap=$(heap_for "$script")
            # Il log porta l'indice della richiesta: due nomi diversi che
            # risolvono allo stesso script (`all` e `audit:all`) avevano lo
            # stesso file e il secondo sovrascriveva il primo.
            log=/tmp/audit-logs/$(printf '%03d' "$IDX")-$(printf '%s' "$script" | tr ':/' '__').log
            echo "──── npm run $script (heap ${heap} MB) ────" | tee -a /tmp/summary.txt
            case "$script" in
              audit:all)
                if [ -n "$INPUT_AUDIT_ALL" ]; then
                  (NODE_OPTIONS="--max-old-space-size=$heap" npm run "$script" -- --audits="$INPUT_AUDIT_ALL" 2>&1) > "$log"
                else
                  (NODE_OPTIONS="--max-old-space-size=$heap" npm run "$script" 2>&1) > "$log"
                fi
                ;;
              report:job-title-locale)
                (NODE_OPTIONS="--max-old-space-size=$heap" npm run audit:job-title-locale -- --report /tmp/job-title-locale-audit.json 2>&1) > "$log"
                ;;
              report:meta-description)
                (NODE_OPTIONS="--max-old-space-size=$heap" node scripts/seo/meta-description-audit.mjs --dist=dist --out=/tmp/meta-description-reports 2>&1) > "$log"
                ;;
              validate:og-images)
                (NODE_OPTIONS="--max-old-space-size=$heap" npm run "$script" -- --require-published-blog-image-evidence 2>&1) > "$log"
                ;;
              gate:seo-source)
                ensure_seo_source_mirror_reports
                (NODE_OPTIONS="--max-old-space-size=$heap" npm run "$script" 2>&1) > "$log"
                ;;
              *)
                (NODE_OPTIONS="--max-old-space-size=$heap" npm run "$script" 2>&1) > "$log"
                ;;
            esac
            rc=$?
            tail -25 "$log" | tee -a /tmp/summary.txt
            if [ $rc -ne 0 ]; then
              echo "❌ FAIL $script rc=$rc" | tee -a /tmp/summary.txt
              printf 'VERDICT\t%s\tFAIL\n' "$n" >> /tmp/verdicts.txt
              FAIL=$((FAIL+1))
            else
              echo "✅ PASS $script" | tee -a /tmp/summary.txt
              printf 'VERDICT\t%s\tPASS\n' "$n" >> /tmp/verdicts.txt
            fi
          done 9<<< "$REQUESTED"

          # RICONCILIAZIONE richiesti ↔ eseguiti. L'input viene ri-parsato da
          # capo e confrontato coi verdetti realmente emessi + i log realmente
          # scritti. Serve perché il fallimento peggiore di questo step non è un
          # audit rosso, è un audit MAI ESEGUITO che esce "SUMMARY: 0 failing":
          # la stessa inversione di #5918 col segno opposto. Cosa coglie: un
          # nome perso dal loop, un'uscita anticipata, un `npm run` che non ha
          # prodotto nemmeno un log.
          MISSING=""
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            if ! grep -qF "$(printf 'VERDICT\t%s\t' "$n")" /tmp/verdicts.txt; then
              MISSING="$MISSING $n"
            fi
          done <<< "$REQUESTED"
          REQ_N=$(printf '%s\n' "$REQUESTED" | grep -c '^')
          DONE_N=$(grep -c '^VERDICT' /tmp/verdicts.txt)
          RAN_N=$(grep -cE '^VERDICT.*(PASS|FAIL)$' /tmp/verdicts.txt)
          LOG_N=$(find /tmp/audit-logs -type f -name '*.log' | wc -l | tr -d ' ')
          echo "── Riconciliazione: richiesti=$REQ_N con verdetto=$DONE_N eseguiti=$RAN_N log=$LOG_N" | tee -a /tmp/summary.txt
          if [ -n "$MISSING" ] || [ "$REQ_N" -ne "$DONE_N" ] || [ "$RAN_N" -ne "$LOG_N" ]; then
            echo "::error::Riconciliazione fallita: richiesti=$REQ_N verdetti=$DONE_N eseguiti=$RAN_N log=$LOG_N senza verdetto:${MISSING:- —}. Il summary sotto NON copre tutto ciò che è stato chiesto." | tee -a /tmp/summary.txt
            FAIL=$((FAIL+1))
          fi

          echo ""
          echo "── SUMMARY: $FAIL failing audit(s) su $REQ_N richiesti" | tee -a /tmp/summary.txt
          if [ $FAIL -gt 0 ]; then exit 1; fi

      - name: Upload audit logs + reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-replay-${{ inputs.deploy_run_id }}
          path: |
            /tmp/audit-logs/
            /tmp/summary.txt
            /tmp/job-title-locale-audit.json
            /tmp/meta-description-reports/
            /tmp/rehydrate-provenance.tsv
            /tmp/audit-prereq-logs/
            dist/audit-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Post summary to job
        if: always()
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          {
            echo "## Audit replay for deploy run \`$INPUT_DEPLOY_RUN_ID\`"
            echo ''
            echo '```'
            tail -120 /tmp/summary.txt 2>/dev/null || echo '(no summary captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
