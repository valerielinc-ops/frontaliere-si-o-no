name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.indexes.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # for github-issue-creator on failure

concurrency:
  group: deploy-cloud-functions
  cancel-in-progress: true

jobs:
  validate-promotion-trigger:
    name: validate production promotion trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Reject non-main or unverified source
        env:
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_REF: ${{ github.ref }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_SOURCE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/production-promotion-gate.mjs trigger

  production-approval:
    name: approve production promotion
    needs: validate-promotion-trigger
    if: needs.validate-promotion-trigger.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production-deploy
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout promotion gate
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/ci/production-promotion-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Verify required reviewers and environment attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_ENVIRONMENT_NAME: production-deploy
          PRODUCTION_DEPLOY_APPROVAL: ${{ secrets.PRODUCTION_DEPLOY_APPROVAL }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/${PROMOTION_REPOSITORY}/environments/${PROMOTION_ENVIRONMENT_NAME}" \
            | node scripts/ci/production-promotion-gate.mjs approval

  deploy-functions:
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project frontaliere-ticino --force

      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project frontaliere-ticino

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Cloud Functions deploy fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 1 \
            --label Bug \
            --workflow "${{ github.workflow }}"
