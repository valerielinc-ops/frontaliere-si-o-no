# Matrix ≡ Monolith equivalence check (no deploy modification).
#
# Implements the "reuse the live monolith artifact" idea: instead of rebuilding
# the monolith, download the github-pages artifact (it + shared, en/de/fr
# stripped) that a real deploy.yml run already produced, then build the MATRIX
# it-shard FROM THE SAME COMMIT and diff them byte-for-byte (sha256).
#
# Why it+shared only: the live en/de/fr shard repos are force-pushed per deploy
# and drift across runs (no coherent same-commit all-4 snapshot exists). The
# github-pages artifact IS a coherent single-commit snapshot of it + ALL shared
# files — which is exactly the cross-locale risk surface: every sitemap (with
# 4-locale xhtml:link alternates), hreflang, assets, /data, /og, build-id.
#
# Same commit ⇒ same committed crawler slices ⇒ deterministic assemble ⇒ same
# data/jobs.json ⇒ pages must be byte-identical. Any diff is a real matrix bug.
name: Matrix Equivalence Check (it+shared vs live monolith)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA the live deploy was built from (matches the artifact)'
        required: true
      deploy_run_id:
        description: 'deploy.yml run id whose github-pages artifact to compare against'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: matrix-equivalence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  equivalence:
    runs-on: ubuntu-latest
    env:
      BUILD_LOCALE: it
      SEQUENTIAL_PROFILE: '1'
      RELATED_SEARCH_CLUSTERS_NO_CACHE: '1'
    steps:
      - name: Checkout the equivalence tooling (this branch)
        uses: actions/checkout@v5
        with:
          path: tooling
      - name: Checkout the BUILD commit (must match the live artifact)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.sha }}
          path: build
      # Review di #6150: questo job lancia `npm run build:ci` (tetto V8
      # 14336 MB) e senza lo swapfile il runtime NON e' quello del deploy che
      # deve byte-matchare — e il preflight di buildMemoryGuard lo fermerebbe
      # comunque. Script dal checkout `tooling` (il commit di build puo'
      # precedere lo script).
      - name: Grow swap (il tetto V8 a 14336 MB vuole headroom sull'host)
        run: bash tooling/scripts/ci/grow-build-swap.sh
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: build
        run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi
      - name: Load secrets from Remote Config
        working-directory: build
        run: node scripts/load-rc-env.mjs || echo "⚠️ load-rc-env failed (non-fatal)"
      - name: Reproduce the deploy data snapshot (deterministic from committed slices)
        working-directory: build
        env:
          JOBS_SKIP_URL_VALIDATION: '1'
        run: |
          set -eo pipefail
          node scripts/assemble-jobs-dataset.mjs --stats
          node scripts/cleanup-jobs.mjs
          node scripts/refresh-weekly-employers-top-pairs.mjs
          node scripts/mine-all-job-slugs.mjs
          node scripts/migrate-all-known-job-slugs-canton-aware.mjs
          node scripts/generate-image-thumbnails.mjs
          node scripts/cleanup-news-sitemap.mjs
      - name: Build matrix it-shard (BUILD_LOCALE=it) from the commit
        working-directory: build
        run: npm run build:ci
      - name: Prune to it shard (root + shared, drop en/de/fr) — mirrors deploy strip
        run: node tooling/scripts/ci/prune-locale-shard.mjs build/dist
      # `--deploy-artifact-perimeter` (issue #4894) — applied to BOTH sides, never
      # one. The github-pages artifact is post-processed (CDN offload deletes
      # assets/data/og/images subtrees and rewrites every same-origin ref in HTML
      # to https://cdn.frontaliereticino.ch/...), so a raw dist/ can never equal
      # it. See the flag's docblock in dist-hash-manifest.mjs for the measured
      # breakdown of run 27749079114.
      - name: Manifest the matrix it-shard
        run: node tooling/scripts/ci/dist-hash-manifest.mjs build/dist /tmp/matrix-it.txt --deploy-artifact-perimeter
      - name: Download the live github-pages artifact (monolith it + shared)
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ github.event.inputs.deploy_run_id }}
        run: |
          set -eo pipefail
          mkdir -p /tmp/live
          gh run download "$INPUT_DEPLOY_RUN_ID" \
            -R "${{ github.repository }}" -n github-pages -D /tmp/live
          # The github-pages artifact is a single artifact.tar inside. Extract it
          # into the TOOLING checkout as ./dist: rehydrate-section-shards.sh reads
          # scripts/lib/section-shard-*.json by relative path and writes into
          # ./dist, so it must run with the repo root as cwd.
          mkdir -p tooling/dist
          if [ -f /tmp/live/artifact.tar ]; then
            tar -xf /tmp/live/artifact.tar -C tooling/dist
          else
            cp -a /tmp/live/. tooling/dist/
          fi
          find tooling/dist -maxdepth 1 -type d 2>/dev/null | head -20 || true
      # With <SECTION>_SHARD_LIVE=true the deploy STRIPS that section's subtree
      # from the artifact before upload (deploy.yml → strip-section-subtree.sh),
      # so the artifact is missing pages the matrix side still has. All 27 section
      # variables are currently 'true'. Pull them back in — same step, same env
      # block and same script as post-deploy-validate-dist.yml, which is the
      # working reference implementation.
      #
      # Deliberately NOT rehydrating the LOCALE shards: the matrix side is an
      # it-shard (prune-locale-shard.mjs drops en/de/fr) and the artifact is
      # it+shared, so both sides are already IT-only. Adding en/de/fr to the live
      # side alone would re-break the symmetry this check depends on.
      # NO shard-clone cache restore here — REMOVED, issue #5441. It was
      # copied over from post-deploy-validate-dist.yml along with the step
      # below, but it was even more inert here than there: this workflow has
      # exactly ONE job (`equivalence`) and never had a matching
      # `actions/cache/save`, so nothing in the repo has ever written a
      # `shard-clone-cache-<run_id>-…` key that a run of THIS workflow could
      # read — a different workflow's run_id can never match. Guaranteed miss,
      # forever, while SHARD_CLONE_CACHE_DIR below still made the rehydrate
      # pay the `cp -r` that populates a directory nobody uploads. See the
      # long note at the same position in post-deploy-validate-dist.yml for
      # the measurements and for what a working version would have to prove.
      - name: Rehydrate section shards into the live artifact (when sharding active)
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.inputs.deploy_run_id }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: bash scripts/lib/rehydrate-section-shards.sh
      - name: Manifest the live monolith it+shared
        run: node tooling/scripts/ci/dist-hash-manifest.mjs tooling/dist /tmp/live-it.txt --deploy-artifact-perimeter
      - name: Compare matrix it-shard ≡ live monolith it+shared
        run: node tooling/scripts/ci/compare-dist-manifests.mjs /tmp/live-it.txt /tmp/matrix-it.txt
