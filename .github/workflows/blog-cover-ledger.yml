name: Repair blog cover licence ledger

on:
  schedule:
    - cron: '35 3 * * 2'
  workflow_dispatch:
    inputs:
      max_assets:
        description: 'Maximum number of new article-hero images (1–20)'
        required: false
        default: '20'
        type: string

concurrency:
  group: blog-cover-ledger
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_ASSETS: ${{ inputs.max_assets || '20' }}

    steps:
      - name: Checkout the historical hero archive
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate generation limit
        run: |
          case "$MAX_ASSETS" in
            ''|*[!0-9]*) echo '::error::max_assets must be an integer from 1 to 20'; exit 2 ;;
          esac
          if [ "$MAX_ASSETS" -lt 1 ] || [ "$MAX_ASSETS" -gt 20 ]; then
            echo '::error::max_assets must be an integer from 1 to 20'
            exit 2
          fi

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to load Remote Config'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo 'GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json' >> "$GITHUB_ENV"

      - name: Load CDN, Codex and PR credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Setup Codex OAuth image lane
        id: setup_codex
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          codex_cli_version: '0.160.1'
          broker_max_concurrency: '1'
          broker_max_timeout_ms: '600000'

      - name: Audit and materialize the historical repair plan
        run: |
          node scripts/audit/blog-cover-ledger.mjs --perceptual --write data/blog-cover-ledger.json
          node scripts/audit/materialize-blog-cover-ledger.mjs

      - name: Generate bounded article-hero replacements
        id: generate
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_codex.outputs.codex_auth_broker_socket }}
        run: node scripts/audit/generate-blog-cover-queue.mjs --limit "$MAX_ASSETS"

      - name: Build the unified blog image-credit index
        run: node scripts/audit/build-blog-image-credits-index.mjs

      - name: Verify every published cover has a record
        run: npm run validate:blog-cover-ledger

      - name: Upload generated bytes and unified ledger to the CDN
        env:
          CDN_BASE: https://cdn.frontaliereticino.ch
        run: |
          set -euo pipefail
          mapfile -t generated_keys < <(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('data/blog-cover-generation-last-run.json')); for (const key of x.completedKeys || []) console.log(key);")
          purge_urls=()
          for key in "${generated_keys[@]}"; do
            output="$(bash scripts/lib/upload-cdn-file.sh "public/images/blog/$key.webp" "images/blog/$key.webp")"
            printf '%s\n' "$output"
            grep -q '✅ uploaded' <<<"$output" || { echo "::error::CDN upload did not succeed for $key"; exit 1; }
            purge_urls+=("$CDN_BASE/images/blog/$key.webp")
          done
          output="$(bash scripts/lib/upload-cdn-file.sh data/image-credits-blog.json data/image-credits-blog.json)"
          printf '%s\n' "$output"
          grep -q '✅ uploaded' <<<"$output" || { echo '::error::CDN upload did not succeed for data/image-credits-blog.json'; exit 1; }
          purge_urls+=("$CDN_BASE/data/image-credits-blog.json")
          if [ "${#purge_urls[@]}" -gt 0 ]; then
            node scripts/cf-purge-cache.mjs --files="$(IFS=,; echo "${purge_urls[*]}")"
          fi

      - name: Publish repair state through a data PR
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${GITHUB_PAT:?GITHUB_PAT was not loaded from Remote Config}"
          body="$RUNNER_TEMP/blog-cover-ledger-pr-body.md"
          remaining="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('data/blog-cover-replacements.json')); console.log(Object.values(x.items || {}).filter((item) => item.status !== 'generated').length);")"
          cat > "$body" <<EOF
          ## Implementato
          - L’inventario conserva il livello di prova per ogni hero storico, materializza i duplicati con record esistente e registra il registro unificato `data/image-credits-blog.json` consumato dalla SPA.
          - Le copertine senza prova certa restano sul proprio articolo con record `inferred`/nessun credito; solo la coda limitata `article-hero` genera copertine su misura allo stesso URL.
          - Questa esecuzione ha caricato i byte nuovi e l’indice sul CDN e ha richiesto il purge mirato dei nomi sostituiti.

          ## Non implementato (ancora)
          - Restano ${remaining} cover storiche `inferred` nella coda ordinata: in questa PR sono mantenute senza ripuntamento e verranno generate a lotti limitati nelle esecuzioni successive.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/blog-cover-ledger.json \
            --path data/blog-cover-replacements.json \
            --path data/blog-cover-wikimedia-matches.json \
            --path data/blog-generated-image-registry.json \
            --path data/image-credits-blog.json \
            --path packages/articles/content/image-credits/blog/ \
            --path public/images/blog/ \
            --branch chore/blog-cover-ledger \
            --commit-message 'chore(images): repair blog cover licence ledger' \
            --title 'chore(images): repair blog cover licence ledger' \
            --body-file "$body"

      - name: Stop Codex broker
        if: always() && steps.setup_codex.outputs.codex_auth_broker_socket != ''
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_codex.outputs.codex_auth_broker_socket }}
        run: |
          node -e 'const net=require("node:net"); const s=net.createConnection(process.env.CODEX_AUTH_BROKER_SOCKET,()=>s.end(JSON.stringify({op:"cleanup"})+"\n")); s.on("error",()=>{});'
