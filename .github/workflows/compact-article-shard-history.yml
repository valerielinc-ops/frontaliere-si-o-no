name: Compact article shard history

# Issue #4881 defect B: push-section-shard.sh bounds `.git` growth on every
# full-replace push by incrementing `.shard-deploys` and orphan-flattening
# once SHARD_HISTORY_CAP (default 50) is reached. push-article-shard-
# incremental.sh (the fast single-article publish path, issue #4837)
# deliberately never increments that counter — correct in isolation (a fast
# publish runs far more often than a full deploy and must not accelerate
# that flatten cycle), but once a section's full-replace push stops running
# entirely in favor of fast-publish-only, `.shard-deploys` freezes and
# push-section-shard.sh's cap check never runs again for that shard: every
# subsequent fast-publish appends one more commit forever, unbounded `.git`
# growth (rehydrate clones, actions/checkout on any future maintenance,
# GitHub's own repo-size UX all degrade with it).
#
# This workflow periodically invokes scripts/lib/compact-article-shard-
# history.sh for EVERY (section, locale) shard — not just today's article
# sections — because the fix measures REAL commit count via
# shard_history_needs_compaction() (scripts/lib/shard-git-helpers.sh)
# instead of relying on the `.shard-deploys` proxy: a shard still on the
# full-replace path self-flattens via SHARD_HISTORY_CAP long before
# ARTICLE_SHARD_HISTORY_CAP (500) real commits, so this is a cheap no-op for
# it. No workflow change is needed the next time another section migrates
# to incremental-only publishing.
#
# Runs on a weekly schedule (this is bookkeeping, not per-deploy hygiene —
# a section publishing normally sits far below the cap between runs) plus
# workflow_dispatch for on-demand runs. Mirrors deploy.yml's existing
# bounded-parallel section-loop idiom (MAX_PARALLEL, pids/names arrays,
# `|| fail=1`, final flush, `exit "$fail"`) so one shard's clone/push
# failure never blocks the rest.

on:
  schedule:
    - cron: '0 3 * * 0' # weekly, Sunday 03:00 UTC — quiet slot, mirrors worktree-branch-janitor.yml's off-peak convention
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compact-article-shard-history
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    # Le deploy key di uri/vaud/vallese NON stanno a livello repo (cap 100
    # secret/repo raggiunto) ma nell'environment `shard-secrets-overflow`, e un
    # job che non lo dichiara le legge come stringa VUOTA → push-article-shard
    # stampa "no SHARD_<X>_DEPLOY_KEY secret — skipping" e la compaction di
    # quegli shard non è MAI girata, in silenzio, lasciando crescere il loro
    # `.git`. Stessa famiglia dell'incidente 2026-07-30 (`docs/AGENTS-HISTORY.md`
    # → `## shard-key-secret-shadowing`): un secret invisibile che degrada senza
    # errore. `deploy.yml`/`fast-publish-article.yml`/`rerender-article-corpus.yml`
    # lo dichiarano già.
    environment: shard-secrets-overflow
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Compact shard history (all sections x locales)
        # No continue-on-error here (unlike deploy.yml's analogous step):
        # that step protects the apex publish from an optional shard push
        # failure; this workflow's ONLY job is the compaction itself, so a
        # failure must surface as a real run failure, not a silently-green
        # scheduled run. Per-section resilience (one shard's failure must
        # not skip the rest) is handled INSIDE the loop below via `|| fail=1`
        # + `::warning::`, same as deploy.yml — that is section-level
        # fault-tolerance, not error-to-warning downgrade of the run itself.
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          # One SHARD_<SECTION>_<LOCALE>_DEPLOY_KEY per (section, locale) —
          # GitHub Actions cannot loop/inherit secrets in a top-level
          # schedule/workflow_dispatch trigger (unlike workflow_call +
          # secrets: inherit), so every key is declared individually here.
          # Verbatim copy of deploy.yml's "Push section shards" step env
          # block (same 27 sections x 4 locales = 108 keys) — duplicating
          # the secret DECLARATIONS is the accepted, pre-existing pattern
          # (already present twice in deploy.yml); the logic itself is not
          # duplicated (compact-article-shard-history.sh + the shared
          # shard-git-helpers.sh functions, sourced not copy-pasted).
          SHARD_TICINO_IT_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_IT_DEPLOY_KEY }}
          SHARD_TICINO_EN_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_EN_DEPLOY_KEY }}
          SHARD_TICINO_DE_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_DE_DEPLOY_KEY }}
          SHARD_TICINO_FR_DEPLOY_KEY: ${{ secrets.SHARD_TICINO_FR_DEPLOY_KEY }}
          SHARD_SVIZZERA_IT_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_IT_DEPLOY_KEY }}
          SHARD_SVIZZERA_EN_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_EN_DEPLOY_KEY }}
          SHARD_SVIZZERA_DE_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_DE_DEPLOY_KEY }}
          SHARD_SVIZZERA_FR_DEPLOY_KEY: ${{ secrets.SHARD_SVIZZERA_FR_DEPLOY_KEY }}
          SHARD_ZURIGO_IT_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_IT_DEPLOY_KEY }}
          SHARD_ZURIGO_EN_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_EN_DEPLOY_KEY }}
          SHARD_ZURIGO_DE_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_DE_DEPLOY_KEY }}
          SHARD_ZURIGO_FR_DEPLOY_KEY: ${{ secrets.SHARD_ZURIGO_FR_DEPLOY_KEY }}
          SHARD_ARGOVIA_IT_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_IT_DEPLOY_KEY }}
          SHARD_ARGOVIA_EN_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_EN_DEPLOY_KEY }}
          SHARD_ARGOVIA_DE_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_DE_DEPLOY_KEY }}
          SHARD_ARGOVIA_FR_DEPLOY_KEY: ${{ secrets.SHARD_ARGOVIA_FR_DEPLOY_KEY }}
          SHARD_APPENZELLO_IT_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_IT_DEPLOY_KEY }}
          SHARD_APPENZELLO_EN_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_EN_DEPLOY_KEY }}
          SHARD_APPENZELLO_DE_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_DE_DEPLOY_KEY }}
          SHARD_APPENZELLO_FR_DEPLOY_KEY: ${{ secrets.SHARD_APPENZELLO_FR_DEPLOY_KEY }}
          SHARD_BASILEA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_IT_DEPLOY_KEY }}
          SHARD_BASILEA_EN_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_EN_DEPLOY_KEY }}
          SHARD_BASILEA_DE_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_DE_DEPLOY_KEY }}
          SHARD_BASILEA_FR_DEPLOY_KEY: ${{ secrets.SHARD_BASILEA_FR_DEPLOY_KEY }}
          SHARD_BERNA_IT_DEPLOY_KEY: ${{ secrets.SHARD_BERNA_IT_DEPLOY_KEY }}
