name: Orchestrate Job Crawlers

on:
  schedule:
    # Run twice daily: morning + afternoon (UTC). Shifted +1h (2026-07-05) vs
    # original 08:00/20:00 — actual runs were landing 08:00 late anyway.
    # All crawlers (including Coop) are dispatched here; no standalone crons.
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Which crawler groups to run (all = every crawler-group-*.yml)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
      delay_seconds:
        description: 'Seconds to wait between dispatches (0-60)'
        required: false
        default: '20'
        type: string
      dry_run:
        description: 'Log which workflows would run without dispatching'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: orchestrate-crawlers
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Consolidation (2026-07): 581 individual update-jobs-*.yml crawler
    # workflows were replaced by 23 crawler-group-NN.yml workflows, each
    # running its member crawlers as `background: true` steps inside ONE
    # job (see scripts/generate-crawler-group-workflows.mjs). With only 23
    # dispatch targets instead of 581, a single sequential pass finishes in
    # well under a minute of active work (23 * ~20s delay ≈ 8min) — the
    # 2-way shard + 180min timeout this job used to need (FRO-432, a single
    # pass over 425+ crawlers couldn't finish in time) is no longer
    # necessary. No matrix, no sharding: one job, one pass, generous 30min
    # timeout for margin.
    steps:
      - name: Checkout (workflow files + failure-report script)
        uses: actions/checkout@v5
        with:
          # Non-cone sparse patterns (gitignore-style). `.github/workflows`
          # feeds the `find` discovery; `scripts` materializes
          # scripts/lib/github-issue-creator.mjs (its only import is the Node
          # built-in node:child_process) so the `Report failure` step can
          # actually create the alert issue instead of `Cannot find module`
          # being swallowed by continue-on-error (no issue ever created — FRO #1409).
          sparse-checkout: |
            .github/workflows
            scripts
            scripts/lib
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Reap zombie queued runs (>30 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Known GH Actions scheduler bug: occasional runs get stranded in `queued`
          # forever and block their concurrency group, masking future dispatches as
          # "no-op" or causing false-failure cascades. Cancel anything queued >30 min
          # before starting the new wave.
          cutoff=$(date -u -d '-30 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          # Capture the discovery into a variable first so a non-zero exit from
          # `gh api` (rate-limit / API error) aborts the job instead of being
          # swallowed: process substitution (`mapfile < <(...)`) does NOT
          # propagate the subshell exit to set -e/pipefail, so on API failure the
          # reap would silently no-op (empty zombies) while the step stays green,
          # contradicting the "a reap error fails the job" guarantee (FRO #1409).
          #
          # Fetch the RAW page bodies (no `--jq` extraction yet) so we can
          # shape-validate before trusting an empty result. If the
          # secondary-rate-limit / abuse-detection guard trips, GitHub can return
          # HTTP 200 with a body that is an OBJECT carrying `message` /
          # `documentation_url` instead of the runs collection (no HTTP error →
          # `gh` exits 0). Extracting `.workflow_runs[]` straight away would make
          # such a body yield an EMPTY id list → zero zombies reaped, step green,
          # silent no-op (zombies accumulate across waves → capacity leak). We
          # therefore require every page to be an object that actually contains a
          # `workflow_runs` ARRAY; anything else aborts the job so the failure
          # is visible and Report-failure fires.
          if ! queued_pages=$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100"
          ); then
            echo "🧟 reap: gh api error enumerating queued runs — aborting."
            exit 1
          fi
          # `--slurp` returns a JSON array of page bodies. Validate each page is a
          # run-collection object before extracting ids. We do NOT pass `jq -e`:
          # `-e` exits 4 when the filter produces no output, which is exactly the
          # common "no zombies" case (empty id list) and would false-abort every
          # clean wave. Instead the shape assertion uses jq `error()`, which
          # always raises a non-zero exit regardless of `-e`, so an
          # abuse-detection body (no `workflow_runs` array) aborts while a
          # legitimately-empty result exits 0 with empty output.
          if ! queued_json=$(
            printf '%s' "$queued_pages" | jq -r '
              if type != "array" then error("reap: unexpected non-array slurp result") else . end
              | ( map(select((type == "object") and (.workflow_runs | type == "array"))) | length ) as $valid
              | if $valid != length then
                  error("reap: a page body is not a runs collection (workflow_runs array missing — likely a 200 abuse-detection/secondary-rate-limit body)")
                else . end
              | [ .[].workflow_runs[] | select(.created_at < "'"${cutoff}"'") | .id ] | .[]
            '
          ); then
            echo "🧟 reap: queued-runs response failed shape validation (possible HTTP 200 abuse-detection body) — aborting."
            exit 1
          fi
          mapfile -t zombies <<<"$queued_json"
          # `<<<` of an empty string yields a single empty element; drop it so the
          # count check below is accurate.
          [ "${#zombies[@]}" -eq 1 ] && [ -z "${zombies[0]}" ] && zombies=()
          if [ ${#zombies[@]} -eq 0 ]; then
            echo "🧟 No zombie queued runs."
          else
            echo "🧟 Cancelling ${#zombies[@]} zombie queued run(s) older than ${cutoff}:"
            for z in "${zombies[@]}"; do
              echo "  - run $z"
              gh run cancel "$z" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            done
          fi

      - name: Discover and dispatch crawler group workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELAY: ${{ inputs.delay_seconds || '20' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Crawler Group Orchestrator — $(date -u '+%Y-%m-%d %H:%M UTC')  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          # Verify-by-observation: `gh workflow run` is a fire-and-forget RPC against
          # the dispatches endpoint (HTTP 204). Its exit code is unreliable — the
          # client can time out *after* the server already created the run. Trusting
          # the exit code produced 3 false failures (and `exit 1` on the whole job)
          # on 2026-05-27 even though all 3 runs existed server-side. Instead, we
          # ignore the exit code and poll the runs API to confirm the side-effect.
          STDERR_LOG="${RUNNER_TEMP:-/tmp}/dispatch-stderr.log"
          : >"$STDERR_LOG"

          # Retry the fire+verify up to DISPATCH_ATTEMPTS times. The dispatches
          # endpoint occasionally returns a transient 5xx. A transient API error
          # leaves no run behind, so re-firing is safe and almost always succeeds
          # on the next attempt. We only re-fire when the previous attempt
          # produced NO run (verified via the runs API), so a slow-but-successful
          # dispatch is not double-fired.
          DISPATCH_ATTEMPTS=3
          dispatch_and_verify() {
            local filename="$1"
            local attempt
            for attempt in $(seq 1 "$DISPATCH_ATTEMPTS"); do
              local before_iso
              before_iso=$(date -u -d '-5 seconds' '+%Y-%m-%dT%H:%M:%SZ')

              # Fire-and-forget. skip_ai_translation=1 forced on every dispatch
              # (unchanged from the pre-consolidation orchestrator): AI quota
              # spreading is not needed here — translation runs centrally via
              # translate-pending.yml. Every crawler's composite step reads
              # `${{ github.event.inputs.skip_ai_translation || '<its own
              # original default> }}`, so forcing "1" at the GROUP dispatch
              # level overrides all member crawlers' env simultaneously,
              # matching the old per-workflow `-f skip_ai_translation=1`.
              # Stderr is captured for post-mortem; exit code ignored.
              gh workflow run "$filename" --ref main -f skip_ai_translation=1 \
                >/dev/null 2>>"$STDERR_LOG" || true

              # Poll for up to ~15s for a new workflow_dispatch run created after t0.
              # GitHub normally registers dispatches within 1-3s.
              local deadline=$(( $(date +%s) + 15 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                sleep 2
                local newest
                newest=$(gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${filename}/runs?per_page=1&event=workflow_dispatch" \
                  --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || echo "")
                if [ -n "$newest" ] && [[ "$newest" > "$before_iso" ]]; then
                  return 0
                fi
              done

              # No run appeared — likely a transient dispatch error. Back off and
              # re-fire (unless this was the last attempt).
              if [ "$attempt" -lt "$DISPATCH_ATTEMPTS" ]; then
                echo -n " ↻retry$attempt"
                sleep 5
              fi
            done
            return 1
          }

          # Discover all crawler-group workflow files (stable numeric-alphabetical
          # order — crawler-group-01..23 sorts correctly under LC_ALL=C since the
          # index is zero-padded).
          mapfile -t workflows < <(find .github/workflows -name 'crawler-group-*.yml' -type f | LC_ALL=C sort)
          total=${#workflows[@]}

          if [ "$total" -eq 0 ]; then
            echo "❌ No crawler-group workflows found!"
            exit 1
          fi

          echo "📋 Dispatching $total crawler group workflows"
          echo ""

          dispatched=0
          failed=0

          for wf in "${workflows[@]}"; do
            filename=$(basename "$wf")
            counter=$((dispatched + failed + 1))

            echo -n "  [$counter/$total] $filename (delay: ${DELAY}s)"

            if [ "$DRY_RUN" = "true" ]; then
              echo " — 🔵 DRY RUN (would dispatch)"
              dispatched=$((dispatched + 1))
              continue
            fi

            if dispatch_and_verify "$filename"; then
              echo " — ✅ dispatched"
              dispatched=$((dispatched + 1))
            else
              echo " — ❌ FAILED (no run appeared within 15s)"
              failed=$((failed + 1))
            fi

            # Delay between dispatches (avoid API rate limits / runner contention;
            # AI quota spreading no longer needed — all crawlers run with
            # skip_ai_translation semantics baked into their own defaults).
            if [ "$counter" -lt "$total" ] && [ "$DRY_RUN" != "true" ]; then
              sleep "$DELAY"
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Dispatched: $dispatched"
          echo "  ❌ Failed:     $failed"
          echo "  📊 Total:      $total"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "⚠️  Some dispatches failed — captured stderr below for diagnosis:"
            echo "---- begin gh stderr ----"
            cat "$STDERR_LOG" || true
            echo "---- end gh stderr ----"
          fi

          # Tolerate a couple of transient dispatch hiccups before failing the job.
          # `dispatch_and_verify` already retries; a residual "no run appeared
          # within 15s" is a flaky GitHub dispatch-API timing issue, NOT a
          # crawler bug — the un-dispatched group is simply re-dispatched on the
          # next cron cycle, so nothing breaks. With only 23 targets, ANY failure
          # is a larger fraction of the run than it was with 581, so the
          # tolerance is intentionally tighter (1 vs the old 3).
          DISPATCH_FAIL_TOLERANCE="${DISPATCH_FAIL_TOLERANCE:-1}"
          if [ "$failed" -gt "$DISPATCH_FAIL_TOLERANCE" ]; then
            echo "❌ $failed dispatch failure(s) exceed tolerance ($DISPATCH_FAIL_TOLERANCE) — systemic dispatch outage, failing the job."
            exit 1
          elif [ "$failed" -gt 0 ]; then
            echo "✅ $failed transient dispatch failure(s) within tolerance ($DISPATCH_FAIL_TOLERANCE) — not failing the job; they retry next cron cycle."
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
