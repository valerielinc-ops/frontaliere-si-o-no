name: Orchestrate Job Crawlers

on:
  schedule:
    # Run twice daily: morning + afternoon (UTC). Shifted +1h (2026-07-05) vs
    # original 08:00/20:00 — actual runs were landing 08:00 late anyway.
    # All crawlers (including Coop) are dispatched here; no standalone crons.
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Which crawlers to run (all = every crawler-group-*.yml)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
      delay_seconds:
        description: 'Seconds to wait between dispatches (10-90)'
        required: false
        default: '60'
        type: string
      dry_run:
        description: 'Log which workflows would run without dispatching'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: orchestrate-crawlers
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Consolidation (2026-07): the crawler set collapsed from 581 individual
    # `update-jobs-*.yml` workflows to 23 grouped `crawler-group-*.yml`
    # workflows (each group bundles multiple crawlers as concurrent
    # `background: true` steps inside ONE job — see
    # scripts/generate-crawler-group-workflows.mjs). Dispatching 23 targets
    # takes seconds, well within any single job's timeout, so the FRO-432
    # 2-shard matrix split (needed to fit 581 sequential dispatches inside a
    # 180-min job) is no longer necessary — a single job dispatches all 23.

    steps:
      - name: Checkout (workflow files + failure-report script)
        uses: actions/checkout@v5
        with:
          # Non-cone sparse patterns (gitignore-style). `.github/workflows`
          # feeds the `find` discovery; `scripts` materializes
          # scripts/lib/github-issue-creator.mjs (its only import is the Node
          # built-in node:child_process) so the `Report failure` step can
          # actually create the alert issue instead of `Cannot find module`
          # being swallowed by continue-on-error (no issue ever created — FRO #1409).
          #
          # FRO #1697 (item 4): the bare `scripts` pattern matches recursively in
          # gitignore semantics (a directory match pulls in all its contents), so
          # scripts/lib/ is covered in theory. We add `scripts/lib` explicitly as
          # a belt-and-suspenders guarantee: the entire Item-1 alerting path hinges
          # on scripts/lib/github-issue-creator.mjs being present, and an explicit
          # nested pattern removes any dependence on non-cone recursion edge cases
          # (a top-level-only materialization would re-break Report-failure with
          # `Cannot find module`). Harmless if redundant.
          sparse-checkout: |
            .github/workflows
            .github/corpus-workflows/contract.json
            .github/corpus-workflows/observers/workflows/crawler-generation-observer-shadow.yml
            functions/src/githubApiHeaders.js
            scripts
            scripts/lib
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Reap zombie queued runs (>30 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Known GH Actions scheduler bug: occasional runs get stranded in `queued`
          # forever and block their concurrency group, masking future dispatches as
          # "no-op" or causing false-failure cascades. Cancel anything queued >30 min
          # before starting the new wave.
          cutoff=$(date -u -d '-30 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          # Capture the discovery into a variable first so a non-zero exit from
          # `gh api` (rate-limit / API error) aborts the shard instead of being
          # swallowed: process substitution (`mapfile < <(...)`) does NOT
          # propagate the subshell exit to set -e/pipefail, so on API failure the
          # reap would silently no-op (empty zombies) while the step stays green,
          # contradicting the "a reap error fails the shard" guarantee (FRO #1409).
          #
          # FRO #1697 (item 3): fetch the RAW page bodies (no `--jq` extraction
          # yet) so we can shape-validate before trusting an empty result. If the
          # secondary-rate-limit / abuse-detection guard trips, GitHub can return
          # HTTP 200 with a body that is an OBJECT carrying `message` /
          # `documentation_url` instead of the runs collection (no HTTP error →
          # `gh` exits 0). Extracting `.workflow_runs[]` straight away would make
          # such a body yield an EMPTY id list → zero zombies reaped, step green,
          # silent no-op (zombies accumulate across waves → capacity leak). We
          # therefore require every page to be an object that actually contains a
          # `workflow_runs` ARRAY; anything else aborts the shard so the failure
          # is visible and Report-failure fires.
          if ! queued_pages=$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100"
          ); then
            echo "🧟 reap: gh api error enumerating queued runs — aborting shard."
            exit 1
          fi
          # `--slurp` returns a JSON array of page bodies. Validate each page is a
          # run-collection object before extracting ids. We do NOT pass `jq -e`:
          # `-e` exits 4 when the filter produces no output, which is exactly the
          # common "no zombies" case (empty id list) and would false-abort every
          # clean wave. Instead the shape assertion uses jq `error()`, which
          # always raises a non-zero exit regardless of `-e`, so an
          # abuse-detection body (no `workflow_runs` array) aborts while a
          # legitimately-empty result exits 0 with empty output.
          if ! queued_json=$(
            printf '%s' "$queued_pages" | jq -r '
              if type != "array" then error("reap: unexpected non-array slurp result") else . end
              | ( map(select((type == "object") and (.workflow_runs | type == "array"))) | length ) as $valid
              | if $valid != length then
                  error("reap: a page body is not a runs collection (workflow_runs array missing — likely a 200 abuse-detection/secondary-rate-limit body)")
                else . end
              | [ .[].workflow_runs[] | select(.created_at < "'"${cutoff}"'") | .id ] | .[]
            '
          ); then
            echo "🧟 reap: queued-runs response failed shape validation (possible HTTP 200 abuse-detection body) — aborting shard."
            exit 1
          fi
          mapfile -t zombies <<<"$queued_json"
          # `<<<` of an empty string yields a single empty element; drop it so the
          # count check below is accurate.
          [ "${#zombies[@]}" -eq 1 ] && [ -z "${zombies[0]}" ] && zombies=()
          if [ ${#zombies[@]} -eq 0 ]; then
            echo "🧟 No zombie queued runs."
          else
            echo "🧟 Cancelling ${#zombies[@]} zombie queued run(s) older than ${cutoff}:"
            for z in "${zombies[@]}"; do
              echo "  - run $z"
              gh run cancel "$z" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            done
          fi

      # Cross-repo migration of every crawler-group-*.yml (started as the
      # crawler-group-23 pilot: first attempt #6485, a composite action,
      # reverted in #6517 — see crawler-group-23-logic.yml's header for why
      # — second attempt #6520, a reusable workflow, dispatch-tested for
      # real; then applied to the remaining 22 groups + translate-pending.yml
      # in the same batch). Every crawler-group-*.yml AND translate-pending.yml
      # now dispatch onto nanakokyobashi-rgb/frontaliere-articles instead of
      # this repo, so their Actions minutes land on nanako's separate,
      # less-saturated pool instead of this account's ~20-concurrent-job
      # Free-plan pool. Needs GITHUB_PAT_NANAKO (write/workflow-scoped PAT on
      # nanako's repos) — like every other secret this repo uses, it only
      # exists in Firebase Remote Config, not as a GitHub Actions secret.
      # These two steps follow the same "Prepare Firebase credentials" +
      # "Load secrets from Remote Config" pattern every other workflow that
      # needs an RC secret uses (see scripts/load-rc-env.mjs). Fail-soft by
      # design if the Firebase creds are unset: GITHUB_PAT_NANAKO simply
      # stays empty, and the dispatch loop below turns that into one failed
      # target within DISPATCH_FAIL_TOLERANCE per group instead of failing
      # the whole job (the translate-pending dispatch step further down is
      # independently fail-soft too, via its own empty-token check).
      - name: Prepare Firebase credentials (needed for the cross-repo dispatches below)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "ℹ️ Firebase secrets not set — GITHUB_PAT_NANAKO won't load; the cross-repo dispatches below will fail-soft."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT_NANAKO — needed for the cross-repo dispatches below)
        run: node scripts/load-rc-env.mjs

      - name: Preflight crawler generation shadow transport
        id: generation_preflight
        continue-on-error: true
        env:
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          node scripts/crawler-generation-dispatch.mjs preflight
          --contract .github/corpus-workflows/contract.json
          --observer .github/corpus-workflows/observers/workflows/crawler-generation-observer-shadow.yml

      - name: Dispatch crawler generation wave
        id: generation_wave
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GENERATION_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          SITE_CODE_COMMIT: ${{ github.sha }}
          CORPUS_CODE_COMMIT: ${{ steps.generation_preflight.outputs.corpus_commit || 'unavailable' }}
          SHADOW_READY: ${{ steps.generation_preflight.outputs.ready || 'false' }}
          DELAY_SECONDS: ${{ inputs.delay_seconds || '60' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CHECKPOINT: ${{ runner.temp }}/crawler-generation-dispatch/checkpoint.json
        run: >-
          node scripts/crawler-generation-dispatch.mjs dispatch-groups
          --generation-token "$GENERATION_TOKEN"
          --site-code-commit "$SITE_CODE_COMMIT"
          --corpus-code-commit "$CORPUS_CODE_COMMIT"
          --shadow-ready "$SHADOW_READY"
          --delay-seconds "$DELAY_SECONDS"
          --failure-tolerance "2"
          --dry-run "$DRY_RUN"
          --repository "$GITHUB_WORKSPACE"
          --runner-temp "$RUNNER_TEMP"
          --checkpoint "$CHECKPOINT"

      - name: Dispatch crawler generation sentinel
        id: generation_sentinel
        if: always()
        continue-on-error: true
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GENERATION_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          SHADOW_READY: ${{ steps.generation_wave.outputs.shadow_ready || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CHECKPOINT: ${{ runner.temp }}/crawler-generation-dispatch/checkpoint.json
        run: |
          if [ "$SHADOW_READY" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Crawler generation observer stays dormant (shadow preflight=$SHADOW_READY, dry-run=$DRY_RUN)."
            exit 0
          fi
          node scripts/crawler-generation-dispatch.mjs dispatch-sentinel \
            --generation-token "$GENERATION_TOKEN" \
            --repository "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP" \
            --checkpoint "$CHECKPOINT"

      - name: Cleanup accepted crawler generation ref
        if: >-
          always()
          && steps.generation_wave.outputs.shadow_ready == 'true'
          && steps.generation_sentinel.outcome == 'success'
          && steps.generation_sentinel.outputs.accepted == 'true'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GENERATION_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          CORPUS_CODE_COMMIT: ${{ steps.generation_preflight.outputs.corpus_commit }}
        run: |
          set -euo pipefail
          node scripts/crawler-generation-dispatch.mjs cleanup-ref \
            --generation-token "$GENERATION_TOKEN" \
            --corpus-code-commit "$CORPUS_CODE_COMMIT"

      # translate-pending.yml migrated to frontaliere-articles alongside the
      # crawler groups (same batch as the crawler-group-01..22 migration on
      # top of the crawler-group-23 pilot). Its old same-repo trigger —
      # `workflow_run: workflows: ["Orchestrate Job Crawlers"], types:
      # [completed]` — fired as soon as THIS job finished (it only dispatches
      # the crawler groups above, it does not wait for them to actually
      # crawl), and cannot be replicated on the frontaliere-articles side:
      # workflow_run only observes workflows in the SAME repo, and this
      # orchestrator stays here. Firing the cross-repo dispatch explicitly,
      # right here (i.e. at the same point in the run this job used to
      # finish), reproduces the same timing. `if: always()` so it still
      # fires even if some crawler-group dispatches above failed or this job
      # is about to fail — the old workflow_run trigger fired on completion
      # regardless of this job's conclusion, success or failure. Never fails
      # the job over this: translate-pending.yml's own 5 daily crons
      # (unchanged) are the safety net if this dispatch is missed.
      - name: Dispatch translate-pending (frontaliere-articles)
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "ℹ️ GITHUB_PAT_NANAKO not loaded — skipping the translate-pending cross-repo dispatch (its 5 daily crons remain the safety net)."
            exit 0
          fi
          for attempt in 1 2 3; do
            if GH_TOKEN="$GITHUB_PAT_NANAKO" gh workflow run translate-pending.yml \
                --repo nanakokyobashi-rgb/frontaliere-articles --ref main; then
              echo "✅ translate-pending.yml dispatched onto nanakokyobashi-rgb/frontaliere-articles"
              exit 0
            fi
            echo "⚠️  dispatch attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::translate-pending.yml cross-repo dispatch failed after 3 attempts — its 5 daily crons remain the safety net."

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
