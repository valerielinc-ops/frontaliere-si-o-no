name: Orchestrate Job Crawlers

on:
  schedule:
    # Run twice daily: morning + afternoon (UTC). Shifted +1h (2026-07-05) vs
    # original 08:00/20:00 — actual runs were landing 08:00 late anyway.
    # All crawlers (including Coop) are dispatched here; no standalone crons.
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Which crawlers to run (all = every crawler-group-*.yml)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
      delay_seconds:
        description: 'Seconds to wait between dispatches (10-90)'
        required: false
        default: '60'
        type: string
      dry_run:
        description: 'Log which workflows would run without dispatching'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: orchestrate-crawlers
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Consolidation (2026-07): the crawler set collapsed from 581 individual
    # `update-jobs-*.yml` workflows to 23 grouped `crawler-group-*.yml`
    # workflows (each group bundles multiple crawlers as concurrent
    # `background: true` steps inside ONE job — see
    # scripts/generate-crawler-group-workflows.mjs). Dispatching 23 targets
    # takes seconds, well within any single job's timeout, so the FRO-432
    # 2-shard matrix split (needed to fit 581 sequential dispatches inside a
    # 180-min job) is no longer necessary — a single job dispatches all 23.

    steps:
      - name: Checkout (workflow files + failure-report script)
        uses: actions/checkout@v5
        with:
          # Non-cone sparse patterns (gitignore-style). `.github/workflows`
          # feeds the `find` discovery; `scripts` materializes
          # scripts/lib/github-issue-creator.mjs (its only import is the Node
          # built-in node:child_process) so the `Report failure` step can
          # actually create the alert issue instead of `Cannot find module`
          # being swallowed by continue-on-error (no issue ever created — FRO #1409).
          #
          # FRO #1697 (item 4): the bare `scripts` pattern matches recursively in
          # gitignore semantics (a directory match pulls in all its contents), so
          # scripts/lib/ is covered in theory. We add `scripts/lib` explicitly as
          # a belt-and-suspenders guarantee: the entire Item-1 alerting path hinges
          # on scripts/lib/github-issue-creator.mjs being present, and an explicit
          # nested pattern removes any dependence on non-cone recursion edge cases
          # (a top-level-only materialization would re-break Report-failure with
          # `Cannot find module`). Harmless if redundant.
          sparse-checkout: |
            .github/workflows
            scripts
            scripts/lib
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Reap zombie queued runs (>30 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Known GH Actions scheduler bug: occasional runs get stranded in `queued`
          # forever and block their concurrency group, masking future dispatches as
          # "no-op" or causing false-failure cascades. Cancel anything queued >30 min
          # before starting the new wave.
          cutoff=$(date -u -d '-30 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          # Capture the discovery into a variable first so a non-zero exit from
          # `gh api` (rate-limit / API error) aborts the shard instead of being
          # swallowed: process substitution (`mapfile < <(...)`) does NOT
          # propagate the subshell exit to set -e/pipefail, so on API failure the
          # reap would silently no-op (empty zombies) while the step stays green,
          # contradicting the "a reap error fails the shard" guarantee (FRO #1409).
          #
          # FRO #1697 (item 3): fetch the RAW page bodies (no `--jq` extraction
          # yet) so we can shape-validate before trusting an empty result. If the
          # secondary-rate-limit / abuse-detection guard trips, GitHub can return
          # HTTP 200 with a body that is an OBJECT carrying `message` /
          # `documentation_url` instead of the runs collection (no HTTP error →
          # `gh` exits 0). Extracting `.workflow_runs[]` straight away would make
          # such a body yield an EMPTY id list → zero zombies reaped, step green,
          # silent no-op (zombies accumulate across waves → capacity leak). We
          # therefore require every page to be an object that actually contains a
          # `workflow_runs` ARRAY; anything else aborts the shard so the failure
          # is visible and Report-failure fires.
          if ! queued_pages=$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100"
          ); then
            echo "🧟 reap: gh api error enumerating queued runs — aborting shard."
            exit 1
          fi
          # `--slurp` returns a JSON array of page bodies. Validate each page is a
          # run-collection object before extracting ids. We do NOT pass `jq -e`:
          # `-e` exits 4 when the filter produces no output, which is exactly the
          # common "no zombies" case (empty id list) and would false-abort every
          # clean wave. Instead the shape assertion uses jq `error()`, which
          # always raises a non-zero exit regardless of `-e`, so an
          # abuse-detection body (no `workflow_runs` array) aborts while a
          # legitimately-empty result exits 0 with empty output.
          if ! queued_json=$(
            printf '%s' "$queued_pages" | jq -r '
              if type != "array" then error("reap: unexpected non-array slurp result") else . end
              | ( map(select((type == "object") and (.workflow_runs | type == "array"))) | length ) as $valid
              | if $valid != length then
                  error("reap: a page body is not a runs collection (workflow_runs array missing — likely a 200 abuse-detection/secondary-rate-limit body)")
                else . end
              | [ .[].workflow_runs[] | select(.created_at < "'"${cutoff}"'") | .id ] | .[]
            '
          ); then
            echo "🧟 reap: queued-runs response failed shape validation (possible HTTP 200 abuse-detection body) — aborting shard."
            exit 1
          fi
          mapfile -t zombies <<<"$queued_json"
          # `<<<` of an empty string yields a single empty element; drop it so the
          # count check below is accurate.
          [ "${#zombies[@]}" -eq 1 ] && [ -z "${zombies[0]}" ] && zombies=()
          if [ ${#zombies[@]} -eq 0 ]; then
            echo "🧟 No zombie queued runs."
          else
            echo "🧟 Cancelling ${#zombies[@]} zombie queued run(s) older than ${cutoff}:"
            for z in "${zombies[@]}"; do
              echo "  - run $z"
              gh run cancel "$z" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            done
          fi

      # Cross-repo migration of every crawler-group-*.yml (started as the
      # crawler-group-23 pilot: first attempt #6485, a composite action,
      # reverted in #6517 — see crawler-group-23-logic.yml's header for why
      # — second attempt #6520, a reusable workflow, dispatch-tested for
      # real; then applied to the remaining 22 groups + translate-pending.yml
      # in the same batch). Every crawler-group-*.yml AND translate-pending.yml
      # now dispatch onto nanakokyobashi-rgb/frontaliere-articles instead of
      # this repo, so their Actions minutes land on nanako's separate,
      # less-saturated pool instead of this account's ~20-concurrent-job
      # Free-plan pool. Needs GITHUB_PAT_NANAKO (write/workflow-scoped PAT on
      # nanako's repos) — like every other secret this repo uses, it only
      # exists in Firebase Remote Config, not as a GitHub Actions secret.
      # These two steps follow the same "Prepare Firebase credentials" +
      # "Load secrets from Remote Config" pattern every other workflow that
      # needs an RC secret uses (see scripts/load-rc-env.mjs). Fail-soft by
      # design if the Firebase creds are unset: GITHUB_PAT_NANAKO simply
      # stays empty, and the dispatch loop below turns that into one failed
      # target within DISPATCH_FAIL_TOLERANCE per group instead of failing
      # the whole job (the translate-pending dispatch step further down is
      # independently fail-soft too, via its own empty-token check).
      - name: Prepare Firebase credentials (needed for the cross-repo dispatches below)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "ℹ️ Firebase secrets not set — GITHUB_PAT_NANAKO won't load; the cross-repo dispatches below will fail-soft."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT_NANAKO — needed for the cross-repo dispatches below)
        run: node scripts/load-rc-env.mjs

      - name: Discover and dispatch crawler group workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELAY: ${{ inputs.delay_seconds || '60' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Crawler Orchestrator — $(date -u '+%Y-%m-%d %H:%M UTC')  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          # Consolidation (2026-07): 581 individual crawlers collapsed into 23
          # grouped workflows (crawler-group-01..23.yml — see
          # scripts/generate-crawler-group-workflows.mjs). The old FRO-326/
          # FRO-424 volume-based per-crawler stagger (20s/60s/120s by known
          # job-count tier) no longer applies at this granularity: there are
          # only 23 dispatch calls total instead of ~580, so GitHub API
          # rate-limit / runner-contention risk is already far lower. A single
          # flat delay between dispatches is enough headroom for the dispatch
          # RPCs themselves.
          #
          # issue #6314 (follow-up of #6296): the flat delay ALSO doubles as
          # the lever for reducing write contention on `main` at the source.
          # Every group's ~25-28 member crawlers start crawling concurrently
          # right after that group's own short setup phase, then each does an
          # individual flock-serialized commit+push as soon as it personally
          # finishes (git-commit-data.sh / git-push-with-retry.sh — unchanged
          # per-crawler mechanism, owner-mandated, see docs/CRAWLERS.md
          # "Crawler-Group Workflows"). Duration is heavy-tailed (measured from
          # data/crawler-workflow-duration-baseline.json: p10=4.7min,
          # p25=9.9min, median=24.5min) — a quarter of all crawlers finish (and
          # push) inside 10 minutes of their group starting. With the old 20s
          # flat delay, all 23 groups start within ~7min of each other, so
          # every group's fast-finishing quarter lands its push burst in
          # roughly the SAME few-minute window — the exact contention this
          # issue traces (measured on refresh-thin-promotions.yml: 40 retries
          # exhausted against 157 commits in ~19min during the crawler-dispatch
          # queue). Raising the delay to 60s spreads the 23 dispatches across
          # ~22min instead of ~7min, spreading each group's fast-crawler push
          # burst proportionally and lowering how many groups can be in their
          # commit-and-push moment at the same wall-clock instant. This does
          # NOT reduce the total number of pushes (batching them would — see
          # the issue — but that conflicts with the owner-mandated "every
          # crawler's own unchanged commit-and-push mechanism, no shared/
          # generic step" constraint in generate-crawler-group-workflows.mjs),
          # only how clustered they are in time. Observable via the existing
          # "push contention loss (exit 42)" step-summary warning already
          # emitted per crawler — frequency should drop post-fix.
          get_delay() {
            echo "$DELAY"
          }

          # Verify-by-observation: `gh workflow run` is a fire-and-forget RPC against
          # the dispatches endpoint (HTTP 204). Its exit code is unreliable — the
          # client can time out *after* the server already created the run. Trusting
          # the exit code produced 3 false failures (and `exit 1` on the whole job)
          # on 2026-05-27 even though all 3 runs existed server-side. Instead, we
          # ignore the exit code and poll the runs API to confirm the side-effect.
          STDERR_LOG="${RUNNER_TEMP:-/tmp}/dispatch-stderr.log"
          : >"$STDERR_LOG"

          # Retry the fire+verify up to DISPATCH_ATTEMPTS times. The dispatches
          # endpoint occasionally returns a transient 5xx (HTTP 500 observed
          # 2026-06-10 on a single crawler — `thurklinik` — out of 219, failing
          # the whole shard and opening a noisy false-positive issue, FRO #1786).
          # A transient API error leaves no run behind, so re-firing is safe and
          # almost always succeeds on the next attempt. We only re-fire when the
          # previous attempt produced NO run (verified via the runs API), so a
          # slow-but-successful dispatch is not double-fired.
          DISPATCH_ATTEMPTS=3
          # target_repo/target_token optional (default: this repo, $GH_TOKEN) —
          # every crawler-group-*.yml now passes both explicitly to dispatch
          # onto nanakokyobashi-rgb/frontaliere-articles with
          # GITHUB_PAT_NANAKO instead of the local repo with the default
          # token (see the `if` below). Any OTHER target this function might
          # be called for in the future can still omit args 2/3 to fall back
          # to the local-repo default, unchanged from before the migration.
          dispatch_and_verify() {
            local filename="$1"
            local target_repo="${2:-$GITHUB_REPOSITORY}"
            local target_token="${3:-$GH_TOKEN}"
            local attempt
            for attempt in $(seq 1 "$DISPATCH_ATTEMPTS"); do
              local before_iso
              before_iso=$(date -u -d '-5 seconds' '+%Y-%m-%dT%H:%M:%SZ')

              # Fire-and-forget. Stderr is captured for post-mortem; exit code ignored.
              GH_TOKEN="$target_token" gh workflow run "$filename" --repo "$target_repo" --ref main -f skip_ai_translation=1 \
                >/dev/null 2>>"$STDERR_LOG" || true

              # Poll for up to ~15s for a new workflow_dispatch run created after t0.
              # GitHub normally registers dispatches within 1-3s.
              local deadline=$(( $(date +%s) + 15 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                sleep 2
                local newest
                newest=$(GH_TOKEN="$target_token" gh api \
                  "/repos/${target_repo}/actions/workflows/${filename}/runs?per_page=1&event=workflow_dispatch" \
                  --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || echo "")
                if [ -n "$newest" ] && [[ "$newest" > "$before_iso" ]]; then
                  return 0
                fi
              done

              # No run appeared — likely a transient dispatch error. Back off and
              # re-fire (unless this was the last attempt).
              if [ "$attempt" -lt "$DISPATCH_ATTEMPTS" ]; then
                echo -n " ↻retry$attempt"
                sleep 5
              fi
            done
            return 1
          }

          # Discover all crawler-group workflow files (stable alphabetical
          # order — crawler-group-01..23.yml sorts correctly since indices are
          # zero-padded). LC_ALL=C pins a byte-wise collation regardless of
          # runner locale for determinism.
          # -not -name '*-logic.yml' excludes the 23 reusable-workflow files
          # (crawler-group-NN-logic.yml) that the migration to nanako added
          # alongside each disabled crawler-group-NN.yml — the glob
          # 'crawler-group-*.yml' matches them too, but they declare only
          # `on: workflow_call` (no workflow_dispatch), so any dispatch
          # attempt on them always fails. Without this exclusion every run
          # produced 23 guaranteed failures (one per group), well past
          # DISPATCH_FAIL_TOLERANCE, failing the whole orchestrator job.
          mapfile -t workflows < <(find .github/workflows -name 'crawler-group-*.yml' -not -name '*-logic.yml' -type f | LC_ALL=C sort)
          total=${#workflows[@]}

          if [ "$total" -eq 0 ]; then
            echo "❌ No crawler-group workflows found!"
            exit 1
          fi

          echo "📋 Dispatching $total crawler-group workflows"
          echo ""

          dispatched=0
          failed=0

          # Dispatch all crawler-group workflows in alphabetical order, with a
          # flat delay between each (see get_delay() above).
          for wf in "${workflows[@]}"; do
            filename=$(basename "$wf")
            counter=$((dispatched + failed + 1))

            this_delay=$(get_delay "$filename")

            # Cross-repo migration (reusable workflow, see
            # crawler-group-NN-logic.yml), validated by the crawler-group-23
            # pilot then applied to every remaining group in the same batch:
            # EVERY crawler-group-*.yml dispatches onto
            # nanakokyobashi-rgb/frontaliere-articles instead of this repo, so
            # its Actions minutes land on nanako's separate, less-saturated
            # pool instead of this account's ~20-concurrent-job Free-plan
            # pool. The local crawler-group-NN.yml files here are all
            # disabled (see each one's own header comment) — their logic now
            # lives as reusable workflows consumed by the frontaliere-articles
            # copies of this filename. The regex match (rather than a fixed
            # list) means a future crawler-group-NN.yml added by the
            # generator routes here automatically too — if a group is ever
            # migrated BACK to running locally, its filename simply needs to
            # stop matching (e.g. rename, or narrow the regex), not be added
            # to an exclude list.
            # Rollback (all groups): delete this `if` block (falls through to
            # the default) and re-enable every crawler-group-NN.yml's local
            # dispatch (undo each one's own "DISABLED" header first).
            target_repo="$GITHUB_REPOSITORY"
            target_token="$GH_TOKEN"
            if [[ "$filename" =~ ^crawler-group-[0-9]+\.yml$ ]]; then
              target_repo="nanakokyobashi-rgb/frontaliere-articles"
              target_token="${GITHUB_PAT_NANAKO:-}"
              echo -n "  [$counter/$total] $filename → ${target_repo} (reusable-workflow) (delay: ${this_delay}s)"
            else
              echo -n "  [$counter/$total] $filename (delay: ${this_delay}s)"
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo " — 🔵 DRY RUN (would dispatch)"
              dispatched=$((dispatched + 1))
              continue
            fi

            if dispatch_and_verify "$filename" "$target_repo" "$target_token"; then
              echo " — ✅ dispatched"
              dispatched=$((dispatched + 1))
            else
              echo " — ❌ FAILED (no run appeared within 15s)"
              failed=$((failed + 1))
            fi

            # Delay between dispatches
            if [ "$counter" -lt "$total" ] && [ "$DRY_RUN" != "true" ]; then
              sleep "$this_delay"
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Dispatched: $dispatched"
          echo "  ❌ Failed:     $failed"
          echo "  📊 Total:      $total crawler-group workflows"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "⚠️  Some dispatches failed — captured stderr below for diagnosis:"
            echo "---- begin gh stderr ----"
            cat "$STDERR_LOG" || true
            echo "---- end gh stderr ----"
          fi

          # Tolerate a few transient dispatch hiccups before failing the job.
          # `dispatch_and_verify` already retries; a residual "no run appeared
          # within 15s" is a flaky GitHub dispatch-API timing issue, NOT a
          # crawler bug — the un-dispatched group is simply re-dispatched on
          # the next cron cycle, so nothing breaks. Failing the whole job on a
          # single hiccup out of only 23 targets would be too sensitive, so we
          # keep a small tolerance before treating it as a systemic outage.
          DISPATCH_FAIL_TOLERANCE="${DISPATCH_FAIL_TOLERANCE:-2}"
          if [ "$failed" -gt "$DISPATCH_FAIL_TOLERANCE" ]; then
            echo "❌ $failed dispatch failure(s) exceed tolerance ($DISPATCH_FAIL_TOLERANCE) — systemic dispatch outage, failing the job."
            exit 1
          elif [ "$failed" -gt 0 ]; then
            echo "✅ $failed transient dispatch failure(s) within tolerance ($DISPATCH_FAIL_TOLERANCE) — not failing the job; they retry next cron cycle."
          fi

      # translate-pending.yml migrated to frontaliere-articles alongside the
      # crawler groups (same batch as the crawler-group-01..22 migration on
      # top of the crawler-group-23 pilot). Its old same-repo trigger —
      # `workflow_run: workflows: ["Orchestrate Job Crawlers"], types:
      # [completed]` — fired as soon as THIS job finished (it only dispatches
      # the crawler groups above, it does not wait for them to actually
      # crawl), and cannot be replicated on the frontaliere-articles side:
      # workflow_run only observes workflows in the SAME repo, and this
      # orchestrator stays here. Firing the cross-repo dispatch explicitly,
      # right here (i.e. at the same point in the run this job used to
      # finish), reproduces the same timing. `if: always()` so it still
      # fires even if some crawler-group dispatches above failed or this job
      # is about to fail — the old workflow_run trigger fired on completion
      # regardless of this job's conclusion, success or failure. Never fails
      # the job over this: translate-pending.yml's own 5 daily crons
      # (unchanged) are the safety net if this dispatch is missed.
      - name: Dispatch translate-pending (frontaliere-articles)
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "ℹ️ GITHUB_PAT_NANAKO not loaded — skipping the translate-pending cross-repo dispatch (its 5 daily crons remain the safety net)."
            exit 0
          fi
          for attempt in 1 2 3; do
            if GH_TOKEN="$GITHUB_PAT_NANAKO" gh workflow run translate-pending.yml \
                --repo nanakokyobashi-rgb/frontaliere-articles --ref main; then
              echo "✅ translate-pending.yml dispatched onto nanakokyobashi-rgb/frontaliere-articles"
              exit 0
            fi
            echo "⚠️  dispatch attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::translate-pending.yml cross-repo dispatch failed after 3 attempts — its 5 daily crons remain the safety net."

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"