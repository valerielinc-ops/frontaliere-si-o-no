name: Profession Keyword Opportunities

# Weekly "professioni da attaccare" gap ranking (#3396).
# Signals: PostHog on-site search (60d) ∪ crawler job titles − existing
# landing coverage → data/profession-keyword-opportunities.json + one
# dedup GitHub issue with the top opportunities.
#
# Zero-Claude by contract (AGENTS.md quota frugality): the script is pure
# HogQL + parsing + regex. Deterministic given the same inputs.
#
# Scheduling: Monday 03:00 UTC — after the Sunday 14:30 UTC GSC orphan
# sync (sync-gsc-orphans.yml) and before refresh-keyword-config.yml at
# 03:30, so the fresh opportunities file feeds the keyword-pages
# generator the same morning.
#
# Secrets pattern mirrors refresh-thin-promotions.yml: the only GH-Actions
# secret needed is FIREBASE_SERVICE_ACCOUNT_JSON; POSTHOG_* are loaded
# from Firebase Remote Config at runtime via scripts/load-rc-env.mjs.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      window_days:
        description: 'On-site search window in days (default 60)'
        required: false
        default: '60'

permissions:
  contents: write
  issues: write

concurrency:
  group: profession-keyword-opportunities
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history for the rebase-retry push loop (same rationale as
          # refresh-thin-promotions.yml: shallow clones break `git rebase
          # origin/main` on bursts of concurrent data commits).
          fetch-depth: 0
          # Blobless partial clone (same fix as guard-data-integrity.yml
          # #4120 / crawler-health-monitor.yml #4380): this job shares the
          # same tight 10-min timeout-minutes budget that crawler-health-monitor
          # blew through on the repo's current ~1.36GB/868k-object blob history.
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Ha gia' blob:none MA i numeri NON dicono che sta bene: Checkout 94-518s
        # su 7 run e il massimo e' l'86% di un cap da 10min. E' il rischio residuo
        # piu' alto della classe (vedi `## Non implementato` della PR): il tetto lo
        # rende diagnosticabile, non lo risolve.
        timeout-minutes: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Rank profession keyword opportunities
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_WINDOW_DAYS: ${{ github.event.inputs.window_days || '60' }}
        run: |
          node scripts/profession-keyword-opportunities.mjs \
            --window-days="$INPUT_WINDOW_DAYS" \
            --markdown-out=/tmp/profession-opportunities.md

      - name: Commit if changed
        env:
          # Dispatch inputs reach the shell as DATA, never as script text. The
          # regenerate command is a nested shell string, so the variable stays
          # unexpanded here and is quoted again when that shell reads it.
          INPUT_WINDOW_DAYS: ${{ github.event.inputs.window_days || '60' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profession-keyword-opportunities.json
          if git diff --cached --quiet; then
            echo "No changes to profession opportunities"
            exit 0
          fi
          git commit -m "chore: weekly profession keyword opportunities refresh"
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/profession-keyword-opportunities.mjs --window-days=\"\$INPUT_WINDOW_DAYS\" --markdown-out=/tmp/profession-opportunities.md && git add data/profession-keyword-opportunities.json"

      - name: Open/update dedup issue with top opportunities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Skip the issue when every profession with signal is already
          # covered — no gap, no noise.
          OPP_COUNT="$(node -e "console.log((JSON.parse(require('fs').readFileSync('data/profession-keyword-opportunities.json','utf8')).opportunities||[]).length)")"
          if [ "$OPP_COUNT" -eq 0 ]; then
            echo "No uncovered opportunities — skipping issue"
            exit 0
          fi
          # Stable title (no run-number/date in the first 60 chars) →
          # github-issue-creator dedups by commenting on the canonical issue.
          node scripts/lib/github-issue-creator.mjs \
            --title "SEO: professioni da attaccare — gap ranking settimanale" \
            --description "$(cat /tmp/profession-opportunities.md)" \
            --priority 3 \
            --label seo \
            --workflow "${{ github.workflow }}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label bug \
            --workflow "${{ github.workflow }}"
