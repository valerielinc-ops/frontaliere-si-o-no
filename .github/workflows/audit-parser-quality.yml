name: Audit Parser Quality

on:
  # Reliability note (issue #4063 item 3 — audit non-racy): the `workflow_run`
  # trigger below fires when the DISPATCHER (`orchestrate-crawlers.yml`,
  # "Orchestrate Job Crawlers") completes, which only takes the few minutes it
  # takes to fire 23 `gh workflow run` calls ~20s apart — NOT when the 23
  # dispatched `crawler-group-*.yml` jobs it kicks off actually finish
  # crawling AND pushing (each has its own hard `timeout-minutes: 340`, up to
  # 5h40 — see scripts/generate-crawler-group-workflows.mjs JOB_TIMEOUT_MINUTES).
  # So this trigger alone races the real crawl+push and can silently read
  # pre-push data (documented in PR #4056 "Non implementato": a run on
  # 2026-07-10 read stale data this way). Fixed with the same "staggered cron
  # backstop" pattern translate-pending.yml already uses for the identical
  # problem (its 13:00/01:00 crons + nightly retries around the same
  # orchestrator waves): keep workflow_run as a cheap opportunistic early
  # nudge (harmless — `cancel-in-progress` below means a later, correct run
  # simply supersedes it) and add cron entries timed PAST crawler-group's own
  # 340min ceiling for both daily dispatch waves (orchestrate-crawlers.yml
  # dispatches at 09:00 / 21:00 UTC), so at least one run per wave is
  # guaranteed to observe already-concluded (pushed-or-timed-out) jobs rather
  # than guessing. `getDatasetProvenance()` in audit-parser-quality.mjs
  # additionally stamps every report with the git SHA actually audited, so a
  # stale read is distinguishable after the fact even if this schedule ever
  # needs re-tuning.
  schedule:
    - cron: '30 10 * * *' # early opportunistic pass — most (non-outlier) groups finish well under 340min
    - cron: '15 15 * * *' # morning-wave backstop: 09:00 UTC dispatch + 340min ceiling + margin
    - cron: '15 3 * * *' # evening-wave backstop: 21:00 UTC dispatch + 340min ceiling + margin (next day)
  workflow_dispatch:
  # Opportunistic early trigger — see reliability note above; the cron
  # backstops are what actually guarantees a post-crawl (not post-dispatch) read.
  workflow_run:
    workflows: ['Orchestrate Job Crawlers']
    types: [completed]

concurrency:
  group: audit-parser-quality
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  # jobs API: il reporter diagnostico (.github/actions/report-failure, #5437) la
  # interroga per sapere QUALE step è fallito. Un blocco permissions esplicito
  # AZZERA gli scope non elencati: senza questa riga la chiamata risponde 403 e il
  # body degrada in silenzio al vecchio run+trigger+ref.
  actions: read
  # scripts/ci/run-superseded.mjs legge le annotazioni del check-run del job
  # (firma del timeout) per distinguere un timeout da una sostituzione.
  checks: read

env:
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169'

jobs:
  audit:
    runs-on: ubuntu-latest
    # #6105: Checkout alone routinely takes ~3m45s-4m on this repo (4.4GB+
    # .git, growing — fetch-depth: 50 below). The earlier 10-15s audit figure
    # covered only the static pass; the strict source-detail pass now checks
    # 1,090 details at concurrency 3. On run 33525971231 it was still running
    # after 12m10s and GitHub cancelled the 15-minute job before it could write
    # the JSON report. Sixty minutes bounds the complete fail-closed pass while
    # retaining strict/source-detail semantics and an artifact for real findings.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 50 (not the default 1) so getDatasetProvenance() in
          # audit-parser-quality.mjs can `git log -- data/jobs/by-crawler` and
          # find the last commit that actually touched the crawler dataset —
          # a depth-1 shallow clone can only see HEAD itself and would leave
          # the provenance annotation null whenever HEAD isn't that commit.
          # Matches the same fetch-depth already used by crawler-group-*.yml
          # for the same reason.
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The strict audit imports the public-fetch policy, which imports the
      # declared `undici` dependency. Keep this install before the audit so a
      # bootstrap failure cannot hide parser findings or suppress its report.
      - name: Install audit dependencies
        run: npm ci

      # Issue 5253: the reporter below runs inside this job and cannot download
      # its log, so without a diag file the issue said only "nessun estratto
      # disponibile" (runs 37192114497, 37193497505, 37213030719) and the reason
      # — which crawlers are CRITICAL, or the unexplained fetch-failure rate —
      # stayed in the run log. `--diag-file` writes it; the reporter's
      # `diag-file` input must name the SAME path
      # (tests/scripts/audit-parser-quality-workflow.test.ts).
      - name: Run parser quality audit (strict)
        id: parser-audit
        run: |
          rm -f data/parser-quality-report.json "$RUNNER_TEMP/parser-quality-strict-diag.txt"
          node scripts/audit-parser-quality.mjs --strict --check-source-details --diag-file="$RUNNER_TEMP/parser-quality-strict-diag.txt"

      - name: Upload parser quality report
        if: always() && steps.parser-audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: parser-quality-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/parser-quality-report.json
          if-no-files-found: error
          retention-days: 30

      # `cancel-in-progress: true` cancels this job whenever a newer run of the
      # group is queued (the workflow_run nudge vs the cron backstop): that run
      # supersedes this one and is NOT a failure (issue 5253, run 37112269877).
      # A timeout is cancelled too and must still be reported, so the verdict
      # needs a newer run AND no timeout annotation AND elapsed time away from
      # the limit; any unreadable input reports (fail-closed). Explicit
      # `if: cancelled()`: without a status function the implicit success()
      # would never run it. JOB_TIMEOUT_MINUTES must equal `timeout-minutes`
      # above (tests/cancel-superseded-reporter-contract.test.ts).
      - name: Detect superseded cancellation
        id: superseded
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TIMEOUT_MINUTES: '60'
        run: node scripts/ci/run-superseded.mjs

      # Reporter diagnostico (#5437): il body dice QUALE step è fallito, con
      # quale comando, come si riproduce in locale e quali script guardare
      # (`## Suggested action` — la sezione che il fixer autonomo estrae).
      # Prima diceva solo run/trigger/ref, e il fixer ripartiva dal log del run.
      # CHI CHIUDE: close-recovered-failure-issues.mjs, sul primo run verde
      # successivo. Il titolo resta `Workflow Failure: <name:>` proprio perché è
      # quello il pattern che quel reconciler riconosce — non cambiarlo.
      - name: Report failure to GitHub Issues
        # A job timeout marks the interrupted audit cancelled, not failed. The
        # report upload above deliberately still runs and fails if no JSON was
        # finalized; include cancelled() so that exact fail-closed path also
        # reaches the durable issue reporter (run 33525971231 skipped it).
        # A cancellation by a newer run of the same concurrency group is not
        # reported (step `superseded` above). failure() is false in a cancelled
        # job even when the upload step failed (run 33525971231), so the guard
        # on the cancelled() branch is the whole gate.
        if: failure() || (cancelled() && steps.superseded.outputs.superseded != 'true')
        uses: ./.github/actions/report-failure
        with:
          title: 'Workflow Failure: ${{ github.workflow }}'
          closed-by: close-recovered-failure-issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '2'
          labels: Bug
          diag-file: ${{ runner.temp }}/parser-quality-strict-diag.txt
