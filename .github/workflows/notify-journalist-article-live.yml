name: Notify Journalist Article Live

# Sends the "your article is online" email only once a deploy has actually
# landed and the article's 4 locale URLs are reachable — see
# scripts/notify-journalist-article-live.mjs for the full incident context
# (the email used to fire at commit time, from publish-journalist-articles.yml,
# well before the site was actually rebuilt/deployed).

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  schedule:
    # Fallback in case a workflow_run event is missed/delayed — cheap no-op
    # when there's nothing awaiting live confirmation.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean
concurrency:
  group: notify-journalist-article-live
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  notify-journalist-article-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPROVAL_TRUSTED_SCHEDULE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      # node_modules in cache (perf-plan email senders, A3/F3): key on the lockfile and
      # the Node major, `npm ci` only on a miss.
      - name: Setup Node.js and restore node_modules
        uses: ./.github/actions/npm-ci-cached

      # Also for the dry run: the script reads the pending articles from Firestore (reads only).
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      # Least privilege (perf-plan email senders, F3): only the keys the job's code reads
      # from `process.env`. Enforced by tests/email-senders-workflow-perimeter.test.ts.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=CF_ACCOUNT_ID,CF_API_TOKEN,CLOUDFLARE_EMAIL_API_TOKEN,JOURNALIST_PENDING_SCOPE,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,NEWSLETTER_SECRET,RESEND_API_KEY

      # Dry run (input dry_run, default true for manual dispatches): reads the pending articles
      # and checks their URLs, with no claim, no email, no stamp and no requeue.
      - name: Check pending journalist articles without notifying (dry run)
        if: inputs.dry_run == true || inputs.dry_run == 'true'
        run: node scripts/notify-journalist-article-live.mjs --dry-run

      - name: Verify + notify live journalist articles
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          ALLOW_SIDE_EFFECT: ${{ github.event_name != 'schedule' || env.APPROVAL_TRUSTED_SCHEDULE == 'true' }}
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' || (github.event_name == 'schedule' && env.APPROVAL_TRUSTED_SCHEDULE != 'true') }}
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            echo "::notice::Scheduled journalist notification is unarmed; keeping this run dry/no-op."
            exit 0
          fi
          node scripts/notify-journalist-article-live.mjs

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
