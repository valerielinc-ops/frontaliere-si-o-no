name: Notify Journalist Article Live

# Sends the "your article is online" email only once a deploy has actually
# landed and the article's 4 locale URLs are reachable — see
# scripts/notify-journalist-article-live.mjs for the full incident context
# (the email used to fire at commit time, from publish-journalist-articles.yml,
# well before the site was actually rebuilt/deployed).

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  schedule:
    # Fallback in case a workflow_run event is missed/delayed — cheap no-op
    # when there's nothing awaiting live confirmation.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled with human approval.'
        required: false
        default: true
        type: boolean
      human_approval:
        description: 'Explicit human approval for the live-notification side effect.'
        required: false
        default: false
        type: boolean

concurrency:
  group: notify-journalist-article-live
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  notify-journalist-article-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require human approval for live notification
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: journalist-live-notification
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Verify + notify live journalist articles
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/notify-journalist-article-live.mjs

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
