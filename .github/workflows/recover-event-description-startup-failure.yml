name: Recover event description rewrite startup failure

# GitHub can mark a workflow run as failed before its root job acquires a
# runner. The dependent jobs then appear only as skipped, so no step inside
# event-description-rewrite.yml can report or recover the failure. This
# observer replays only that exact first-attempt signature; ordinary job
# failures remain owned by the normal workflow and central failure scanner.
on:
  workflow_run:
    workflows: [Rewrite event descriptions (Codex Luna Max)]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-event-description-startup-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.path == '.github/workflows/event-description-rewrite.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted recovery predicate
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/event-description-startup-recovery.mjs
            scripts/ci/lib/workflow-run-list-recovery.mjs
            scripts/load-rc-env.mjs
            scripts/lib/fetch-with-ref-timeout.mjs
            scripts/lib/google-service-account-token.mjs
            scripts/lib/remote-config-template-url.mjs
          sparse-checkout-cone-mode: false

      - name: Prepare Firebase credentials for recovery API
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to load the recovery API token'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load recovery API token from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=GITHUB_PAT

      - name: Require recovery API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo '::error::GITHUB_PAT was not loaded from Remote Config; refusing to use the rate-limited installation token'
            exit 1
          fi

      - name: Retry only an unstarted rewrite run
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { getOctokit } = require('@actions/github');
            const { pathToFileURL } = require('node:url');
            const { listRecentEventDescriptionRuns, shouldRetryEventDescriptionRun } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/event-description-startup-recovery.mjs`,
            ).href);
            const recoveryToken = process.env.GITHUB_PAT;
            if (!recoveryToken) {
              throw new Error('GITHUB_PAT was not loaded from Remote Config; refusing recovery.');
            }
            // The ambient GITHUB_TOKEN is an installation token shared by the
            // repository's concurrent workflows. Use the long-lived PAT for
            // every recovery API call so a busy installation cannot make the
            // observer fail before it evaluates the startup signature.
            const recoveryGithub = getOctokit(recoveryToken);
            const run = context.payload.workflow_run;
            const runAttempt = run?.run_attempt;
            if (!Number.isSafeInteger(runAttempt) || runAttempt !== 1) {
              core.info(`Run ${run?.id || '<unknown>'} is not an explicit first attempt; refusing recovery.`);
              return;
            }
            const jobs = await recoveryGithub.paginate(
              recoveryGithub.rest.actions.listJobsForWorkflowRunAttempt,
              {
                ...context.repo,
                run_id: Number(run.id),
                attempt_number: runAttempt,
                per_page: 100,
              },
            );
            const workflowRuns = await listRecentEventDescriptionRuns({
              github: recoveryGithub,
              repo: context.repo,
              run,
              core,
            });
            if (!shouldRetryEventDescriptionRun({ run, jobs, workflowRuns })) {
              core.info(`Run ${run.id} does not match the bounded startup-failure signature.`);
              return;
            }
            core.warning(
              `Run ${run.id} failed before the event rewrite plan acquired a runner; `
              + 'requesting one bounded replay of the same run.',
            );
            await recoveryGithub.rest.actions.reRunWorkflow({
              ...context.repo,
              run_id: Number(run.id),
            });
