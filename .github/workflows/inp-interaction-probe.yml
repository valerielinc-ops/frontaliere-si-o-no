name: INP interaction probe (live)

# Measures INP per interaction on production with scripts/perf/
# inp-interaction-probe.mjs: job-board «Lugano» chip, calculator 75k preset and
# the consent dialog's accept button, Pixel 5 + CPU 4x, cold page per run.
# It reads production, writes nothing, opens no issue and gates nothing; the
# table lands in the job summary and the JSON in an artifact.
#
# On a PR that touches the probe it runs against production as it is, which is
# the "before" of that PR; dispatch it on main after the deploy for the "after".
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Cold runs per interaction'
        required: false
        default: '3'
  pull_request:
    paths:
      - 'scripts/perf/inp-interaction-probe.mjs'
      - 'scripts/perf/lib/inp-probe-summary.mjs'
      - '.github/workflows/inp-interaction-probe.yml'

permissions:
  contents: read

concurrency:
  group: inp-interaction-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # 2 interactions x 3 runs at ~30 s each, plus npm/Chromium installation.
    # The install includes apt dependencies and can exceed 25 minutes on a
    # cold shared runner; leave enough headroom for the measurement itself.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/perf/inp-interaction-probe.mjs
            scripts/perf/lib/inp-probe-summary.mjs
            build-plugins/shared/cantonResolvers.mjs
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Only Playwright, in a scratch dir: the probe needs no other dependency,
      # and a full `npm ci` of the site would cost more than the measurement.
      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          # The exact version the lockfile pins, not the package.json range:
          # runs months apart must measure with the same browser build.
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          mkdir -p "$RUNNER_TEMP/probe/lib"
          mkdir -p "$RUNNER_TEMP/build-plugins/shared"
          cp scripts/perf/inp-interaction-probe.mjs "$RUNNER_TEMP/probe/"
          cp scripts/perf/lib/inp-probe-summary.mjs "$RUNNER_TEMP/probe/lib/"
          cp build-plugins/shared/cantonResolvers.mjs "$RUNNER_TEMP/build-plugins/shared/"
          cd "$RUNNER_TEMP/probe"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@${version}"
          npx playwright install --with-deps chromium

      - name: Probe
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          set -euo pipefail
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number" >&2; exit 2 ;; esac
          cd "$RUNNER_TEMP/probe"
          node inp-interaction-probe.mjs --runs "$RUNS" --out "$RUNNER_TEMP/probe/out"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inp-interaction-probe
          path: ${{ runner.temp }}/probe/out
          if-no-files-found: ignore
