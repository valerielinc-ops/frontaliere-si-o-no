name: Revenue Monitor (weekly)

on:
  schedule:
    # Mondays 06:15 UTC — early enough to land in the Monday digest.
    - cron: '15 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: revenue-monitor
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Run revenue monitor (save report)
        run: node scripts/revenue-monitor.mjs --save --markdown > /tmp/revenue-monitor.md

      - name: Print summary to job log
        run: |
          echo "## Revenue monitor" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/revenue-monitor.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: revenue-monitor-report
          path: |
            reports/revenue-*.json
            reports/revenue-*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Commit revenue monitor history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Full reports live under reports/ which is gitignored (preserved as
          # build artifacts only, see "Upload report artifact" above). Only the
          # compact append-only history file is committed so the next weekly
          # run can compute the trend (mirrors ai-visibility-check.yml, #2741).
          git add data/revenue-monitor-history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "📊 Weekly revenue monitor report — ${DATE}"
          # Centralized rebase-retry helper survives concurrent pushes from
          # other workflows. The history file is append-only, so on a rebase
          # conflict keep the local commit and union both sides instead of
          # regenerating.
          bash scripts/lib/git-push-with-retry.sh \
            --branch "$GITHUB_REF_NAME" \
            --in-place-resolver-cmd "source scripts/lib/resolve-append-conflicts.sh && resolve_append_conflicts && git add -A"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
