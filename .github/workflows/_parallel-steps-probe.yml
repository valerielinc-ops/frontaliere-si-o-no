# TEMPORARY probe: confirm always()/failure() steps still run after a failed wait-all.
name: _parallel-steps-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-cond:
    runs-on: ubuntu-latest
    steps:
      - name: Background FAIL
        id: bgfail
        background: true
        run: |
          sleep 2
          exit 1

      - name: Wait all
        wait-all: true

      - name: success-step (should SKIP)
        run: echo "RAN_SUCCESS_STEP"

      - name: always-step (should RUN)
        if: always()
        run: echo "RAN_ALWAYS_STEP"

      - name: failure-step (should RUN)
        if: failure()
        run: echo "RAN_FAILURE_STEP"
