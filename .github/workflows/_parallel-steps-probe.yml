# TEMPORARY probe: validate failure propagation of background/wait steps.
# Delete after confirming a failing background step fails the job.
name: _parallel-steps-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Background OK
        id: bgok
        background: true
        run: |
          sleep 3
          echo "ok done"

      - name: Background FAIL
        id: bgfail
        background: true
        run: |
          sleep 2
          echo "about to fail"
          exit 1

      - name: Wait all (should surface failure)
        wait-all: true

      - name: Should NOT run if wait-all propagates failure
        run: echo "REACHED_POST_WAIT_ALL"
