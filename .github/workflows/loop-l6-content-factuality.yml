name: Loop L6 content learning and factuality

on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - 'data/quality-alerts-history.jsonl'
      - 'data/editorial-factuality-verdicts.jsonl'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/export-l6-factuality-outcomes.mjs'
      - 'scripts/ci/loop-l6-content-factuality.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/loop-fleet-issue.mjs'
      - 'scripts/ci/produce-l6-source-verdicts.mjs'
      - 'scripts/lib/l6-source-check.mjs'
      - 'scripts/lib/blog-body-io.mjs'
      - 'scripts/lib/unescape-ts-string.mjs'
      - '.github/workflows/loop-l6-content-factuality.yml'
  pull_request:
    paths:
      - 'data/quality-alerts-history.jsonl'
      - 'data/editorial-factuality-verdicts.jsonl'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/export-l6-factuality-outcomes.mjs'
      - 'scripts/ci/loop-l6-content-factuality.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'scripts/lib/loop-fleet-issue.mjs'
      - 'scripts/ci/produce-l6-source-verdicts.mjs'
      - 'scripts/lib/l6-source-check.mjs'
      - 'scripts/lib/blog-body-io.mjs'
      - 'scripts/lib/unescape-ts-string.mjs'
      - '.github/workflows/loop-l6-content-factuality.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when source verification is not trustworthy'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l6-content-factuality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout content quality inputs
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/quality-alerts-history.jsonl
            /data/editorial-factuality-verdicts.jsonl
            /data/loop-fleet/loop-registry.json
            /scripts/ci/export-l6-factuality-outcomes.mjs
            /scripts/ci/loop-l6-content-factuality.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /scripts/lib/loop-fleet-issue.mjs
            /scripts/ci/produce-l6-source-verdicts.mjs
            /scripts/lib/l6-source-check.mjs
            /scripts/lib/blog-body-io.mjs
            /scripts/lib/unescape-ts-string.mjs
            /packages/articles/content/blog-articles-data.ts
            /.github/workflows/loop-l6-content-factuality.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      # Automated source-check verdicts, written to a runner-local file that is
      # uploaded with the artifact and never committed:
      # data/editorial-factuality-verdicts.jsonl stays the human reviewers'
      # ledger. Not on pull_request, where the export below is --unavailable
      # anyway and a PR run must not download third-party pages.
      - name: Produce automated L6 source-check verdicts
        id: produce_l6_verdicts
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l6
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          node scripts/ci/produce-l6-source-verdicts.mjs --select --limit 20 > "$RUNNER_TEMP/l6-select.txt"
          # The sparse checkout holds no article body: materialise only the
          # bodies of the selected articles. `sparse-checkout add` takes no
          # --no-cone (the mode set by actions/checkout is kept); a missing
          # locale is fine, the producer counts it as locale-missing.
          grep '^packages/' "$RUNNER_TEMP/l6-select.txt" | sed 's|^|/|' > "$RUNNER_TEMP/l6-sparse-paths.txt" || true
          if [ -s "$RUNNER_TEMP/l6-sparse-paths.txt" ]; then
            git sparse-checkout add --stdin < "$RUNNER_TEMP/l6-sparse-paths.txt"
          fi
          node scripts/ci/produce-l6-source-verdicts.mjs --limit 20 --out "$REPORT_DIR/editorial-factuality-verdicts.jsonl" --summary "$REPORT_DIR/producer-summary.json"
          jq -c '{selected,rowsWritten,skipped}' "$REPORT_DIR/producer-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Warn when the L6 producer failed
        if: always() && steps.produce_l6_verdicts.outcome == 'failure'
        run: echo '::warning::L6 source-check producer failed; the export reads only the committed ledger and stays fail-closed (unavailable when it is missing)'
      - name: Export read-only L6 editorial outcome
        if: always()
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          OUTCOME_PATH: ${{ runner.temp }}/loop-fleet-l6/content-factuality-outcomes.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$OUTCOME_PATH")"
          if [ "$WORKFLOW_EVENT" = 'pull_request' ]; then
            node scripts/ci/export-l6-factuality-outcomes.mjs --unavailable --out "$OUTCOME_PATH" --registry data/loop-fleet/loop-registry.json
            exit 0
          fi
          committed=data/editorial-factuality-verdicts.jsonl
          produced="$RUNNER_TEMP/loop-fleet-l6/editorial-factuality-verdicts.jsonl"
          ledger="$committed"
          if [ -s "$produced" ] && [ -s "$committed" ]; then
            # One run ledger: committed human rows first, produced rows after.
            # The contract rejects a second review of the same articleId +
            # locale, and one invalid row stops the whole ledger measuring, so
            # automated rows whose identity a committed row already holds are
            # dropped here (identity trimmed as the exporter trims it).
            run_ledger="$RUNNER_TEMP/loop-fleet-l6/run-editorial-factuality-verdicts.jsonl"
            if { cat "$committed"; printf '\n'; jq -c -n --rawfile committed "$committed" '
                def identity: [(.articleId // "" | tostring), (.locale // "" | tostring)] | map(gsub("^\\s+|\\s+$"; "")) | join("\t");
                (reduce ($committed | split("\n")[] | (fromjson? // empty) | objects | identity) as $id ({}; .[$id] = true)) as $seen
                | inputs | select($seen[identity] | not)' "$produced"; } > "$run_ledger"; then
              ledger="$run_ledger"
            else
              echo '::warning::could not merge the produced L6 verdicts with the committed ledger; exporting the committed ledger only'
            fi
          elif [ -s "$produced" ]; then
            ledger="$produced"
          fi
          set +e
          node scripts/ci/export-l6-factuality-outcomes.mjs --json --ledger "$ledger" --out "$OUTCOME_PATH" --registry data/loop-fleet/loop-registry.json | tee "$RUNNER_TEMP/loop-fleet-l6/export-cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          export_code=${PIPESTATUS[0]}
          set -e
          if [ "$export_code" -ne 0 ]; then
            echo '::warning::L6 editorial outcome export failed; recording an explicitly unavailable outcome so factuality remains fail-closed'
            node scripts/ci/export-l6-factuality-outcomes.mjs --unavailable --out "$OUTCOME_PATH" --registry data/loop-fleet/loop-registry.json
          fi
      - name: Audit content learning and factuality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l6
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --apply --report-dir "$REPORT_DIR" --history data/quality-alerts-history.jsonl --outcomes "$REPORT_DIR/content-factuality-outcomes.json" --registry data/loop-fleet/loop-registry.json)
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l6-content-factuality.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l6-result.json" >/dev/null 2>&1; then
            echo 'L6 finding persisted as a deduplicated issue; candidate fixes remain runner-local and source-independent.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Validate runner-local L6 outcome export
        if: always()
        id: validate_l6_outcome
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l6
        run: |
          test -s "$REPORT_DIR/l6-outcome.json"
          jq -e '(
            .loopId == "L6"
            and (.status | type) == "string"
            and (.independent | type) == "boolean"
            and (.metrics | type) == "object"
            and (if .status == "observed" then (.independent == true and .evidenceStatus == "verified") else true end)
            and .safeToAct == false
            and .generatorIsNotOracle == true
            and .publishedContentUntouched == true
          )' "$REPORT_DIR/l6-outcome.json" >/dev/null
      - name: Record canonical L6 evidence
        if: ${{ always() && steps.validate_l6_outcome.outcome == 'success' }}
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l6
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L6 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L6 observation and actions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loop-l6-content-factuality-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l6/
          retention-days: 90
          if-no-files-found: error
