name: AdSense hourly monitor
# The loop clock (functions/src/loopClockDispatch.js) names its own dispatches:
# scripts/ci/loop-clock-health.mjs counts a run as the clock's only by this
# marker. Every other run keeps the title GitHub would give it.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.loop_clock != '' && format('AdSense hourly monitor [loop-clock {0}]', inputs.loop_clock) || 'AdSense hourly monitor' }}

# AdSense exposes no hourly dimension, so each run stores the day's running
# total in Firestore (adsense_hourly_snapshots) and the hourly detail is the
# difference between consecutive snapshots. It opens a backlog issue when
# earnings fall 20% against the same weekday of the previous week: thresholds,
# backtest and confirmation rules are in scripts/lib/adsense-hourly.mjs.
#
# It complements revenue-signal-monitor.yml, which reads GA4 for sharp drops
# (-50%, IT+CH) and keeps no history. The Cloud Scheduler loop clock is what
# makes this hourly: the native cron below is only a safety net, an hourly
# workflow's native cron fired every 4.5-5 hours in October 2026.
#
# Exit code: 0 when the run measured, with or without an alarm. A run that
# cannot measure fails and reports `Workflow Failure: AdSense hourly monitor`,
# never a revenue alarm.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      loop_clock:
        description: 'Set only by the Cloud Scheduler loop clock (entry id @ slot): it names the run, nothing else reads it'
        required: false
        default: ''
        type: string

concurrency:
  group: adsense-hourly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Snapshot and evaluate AdSense
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Isolated prefix + symlink, as in revenue-signal-monitor.yml: a full
      # `npm ci` every hour would install 1,384 packages for two clients.
      - name: Install Firebase and GA4 clients
        run: |
          npm install --prefix "$RUNNER_TEMP/monitor-deps" --no-save --ignore-scripts --no-fund --no-audit firebase-admin@14.5.0 google-auth-library@11.1.0
          ln -s "$RUNNER_TEMP/monitor-deps/node_modules" node_modules

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config (AdSense tokens)
        run: node scripts/load-rc-env.mjs

      - name: Store snapshot and evaluate
        id: monitor
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/adsense-hourly-monitor.mjs --out=adsense-hourly.json --body-out=adsense-hourly-issue.md

      - name: Append summary to job log
        if: always()
        run: |
          if [ -s adsense-hourly.json ]; then
            {
              echo "## AdSense hourly monitor"
              echo '```json'
              cat adsense-hourly.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the revenue issue
        if: steps.monitor.outputs.status == 'alarm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIORITY: ${{ steps.monitor.outputs.priority }}
        run: |
          set -euo pipefail
          node scripts/lib/github-issue-creator.mjs \
            --title "Revenue AdSense: calo oltre il 20% sulla settimana precedente" \
            --description-file adsense-hourly-issue.md \
            --priority "$PRIORITY" \
            --label Bug \
            --label revenue \
            --label adsense-hourly-monitor \
            --workflow "${{ github.workflow }}"

      # After the issue exists: a failed creation must retry on the next run.
      - name: Remember the notified alarms
        if: steps.monitor.outputs.status == 'alarm'
        env:
          ALARM_KEYS: ${{ steps.monitor.outputs.alarm_keys }}
        run: node scripts/adsense-hourly-monitor.mjs "--ack=$ALARM_KEYS"

      - name: Resolve the revenue issue after a healthy day
        if: steps.monitor.outputs.status == 'recovered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Revenue AdSense: calo oltre il 20% sulla settimana precedente" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          Il monitor AdSense non ha potuto misurare (credenziali, API o Firestore): nessun allarme revenue è stato valutato.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Riproduci:** \`node scripts/adsense-hourly-monitor.mjs --dry-run\` con credenziali AdSense e service account." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
