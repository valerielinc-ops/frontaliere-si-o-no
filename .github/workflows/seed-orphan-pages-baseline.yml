name: Seed orphan-pages baseline

# One-shot helper workflow: regenerates `data/orphan-pages-baseline.json`
# against the latest deployed dist/ (downloaded from the most recent
# `github-pages` artifact) and uploads the JSON output as an artifact.
#
# Why this exists
# ---------------
# `audit-orphan-pages-in-sitemaps.mjs` uses a RATE-based ratchet: each
# sitemap's orphan SHARE (orphans/total) must not regress beyond tolerance.
# The committed baseline was mechanically converted from the old v1
# absolute-count snapshot (2026-04-28), so its per-sitemap rates are
# stale-high and several sitemaps that now exist (per-canton job sitemaps,
# sitemap-comuni-frontiera) are missing entirely. Run this against a real,
# current dist/ to seed an accurate v2 baseline — tight caps + every live
# sitemap folded in. After this seed, update the baseline manually via
# `npm run audit:orphan-sitemap-pages:rebaseline` whenever a deploy
# deliberately lowers an orphan rate.
#
# Usage
# -----
# 1. Trigger via "Run workflow" in the GitHub UI (workflow_dispatch).
# 2. Download the `orphan-pages-baseline-${{ github.run_id }}` artifact.
# 3. Replace `data/orphan-pages-baseline.json` with the downloaded file,
#    commit, push.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Find latest successful deploy
        id: latest
        run: |
          run_id=$(gh run list \
            --workflow=deploy.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "Latest successful deploy: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download github-pages artifact from latest deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gh-pages-artifact dist
          gh run download ${{ steps.latest.outputs.run_id }} \
            --name "github-pages" \
            --dir /tmp/gh-pages-artifact/
          ls -lh /tmp/gh-pages-artifact/

      - name: Extract dist/
        run: |
          tar -xf /tmp/gh-pages-artifact/artifact.tar -C dist
          echo "dist/ tree (top level):"
          ls dist/ | head
          echo ""
          echo "Total HTML files:"
          find dist -name '*.html' | wc -l

      - name: Generate orphan-pages baseline (rate v2)
        run: |
          node scripts/audit-orphan-pages-in-sitemaps.mjs --rebaseline
          echo ""
          echo "==== baseline preview (head) ===="
          head -40 data/orphan-pages-baseline.json

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: orphan-pages-baseline-${{ github.run_id }}
          path: data/orphan-pages-baseline.json
          retention-days: 14
          if-no-files-found: error

      - name: Echo download instructions
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "Baseline generated. Next steps:"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "1. Download the artifact:"
          echo "   gh run download ${{ github.run_id }} \\"
          echo "     --name orphan-pages-baseline-${{ github.run_id }} \\"
          echo "     --dir /tmp/"
          echo ""
          echo "2. Replace and commit:"
          echo "   cp /tmp/orphan-pages-baseline.json data/orphan-pages-baseline.json"
          echo "   git add data/orphan-pages-baseline.json"
          echo "   git commit -m \"chore(seo-gate): seed orphan-pages baseline from prod dist\""
          echo "   git push"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
