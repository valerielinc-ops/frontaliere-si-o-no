name: Submit IndexNow Batch

on:
  # Full-sitemap submission is a manual recovery tool only. Routine
  # remediation uses the single-URL streaming loop.
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Target engine (leave empty for all)'
        required: false
        default: ''
        type: string
      sitemap:
        description: 'Sitemap filter (e.g. "jobs", "blog", leave empty for all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (preview only, no submissions)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  submit:
    runs-on: ubuntu-latest
    # No build/dist or package install: the script uses Node built-ins,
    # reads deployed sitemaps over HTTP and runs only when an operator
    # explicitly dispatches this full-sitemap recovery workflow.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # No build/dist or package install: the script uses Node built-ins,
      # reads deployed sitemaps over HTTP and runs only when an operator
      # explicitly dispatches this full-sitemap recovery workflow.
      - name: Submit IndexNow batch
        env:
          # Dispatch inputs reach the shell as DATA, never as script text. The
          # array form also stops an unquoted value word-splitting, which
          # `--sitemap $VALUE` did even without malice.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENDPOINT: ${{ inputs.endpoint }}
          INPUT_SITEMAP: ${{ inputs.sitemap }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_ENDPOINT" ]; then
            ARGS+=(--endpoint "$INPUT_ENDPOINT")
          fi
          if [ -n "$INPUT_SITEMAP" ]; then
            ARGS+=(--sitemap "$INPUT_SITEMAP")
          fi
          node scripts/submit-indexnow-batch.mjs "${ARGS[@]}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
