name: Submit IndexNow Batch

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Target engine (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - bing
          - yandex
          - indexnow
      sitemap:
        description: 'Sitemap filter (e.g. "jobs", "blog", leave empty for all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (preview only, no submissions)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  submit:
    runs-on: ubuntu-latest
    # No build/dist: the script fetches the deployed sitemaps live over HTTP.
    # Live dry-run (run 26636490673) measured fetch + parse at 29 s total.
    # `npm ci` (cache-first) was added only to make `firebase-admin` available
    # for the RC-loading step below (BING_API_KEY); it's a few seconds on a
    # cache hit. 15 min leaves headroom for the real submission worst case —
    # 5 batches × 3 endpoints, each up to 30 s + 3 retries + 429 Retry-After
    # waits (60 s cap) — which a tight 10-min cap could brush under sustained
    # rate-limiting.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # scripts/load-rc-env.mjs dynamically imports `firebase-admin` from
      # node_modules (falls back to a no-op warning if missing, so this
      # wouldn't crash the workflow — but it WOULD silently keep BING_API_KEY
      # unset, defeating the point of the fix below). Cache-first install
      # keeps this cheap; the script itself still needs no build/dist.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # BING_API_KEY lives in Firebase Remote Config, not a GitHub secret (no
      # `secrets.BING_API_KEY` exists in this repo — a prior version of this
      # workflow referenced it directly, so the Bing Webmaster API submission
      # silently no-op'd on every run: submit-indexnow-batch.mjs logs
      # "BING_API_KEY not set — skipping" but exits 0 regardless, since the
      # raw IndexNow ping itself doesn't need it. Mirrors the RC-loading
      # pattern already used in post-deploy-publish.yml / ai-visibility-check.yml).
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — Bing Webmaster API submission will be skipped."
          fi

      - name: Load secrets from Remote Config (BING_API_KEY)
        run: node scripts/load-rc-env.mjs

      # No build/dist needed here: submit-indexnow-batch.mjs itself uses only
      # Node builtins + fetch, and reads the 6 sub-sitemaps LIVE from the
      # deployed site (https://frontaliereticino.ch/sitemap-*.xml). IndexNow
      # tells engines to crawl live URLs, so the published sitemaps are the
      # correct source of truth — rebuilding the site (~38 min, OOM-prone)
      # just to regenerate XML the deploy already serves was pure waste. Pass
      # `--local` to read from dist/ instead (not used here). The `npm ci`
      # above is only for the RC-loading step's `firebase-admin` dependency.
      - name: Submit IndexNow batch
        env:
          # Dispatch inputs reach the shell as DATA, never as script text. The
          # array form also stops an unquoted value word-splitting, which
          # `--sitemap $VALUE` did even without malice.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENDPOINT: ${{ inputs.endpoint }}
          INPUT_SITEMAP: ${{ inputs.sitemap }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_ENDPOINT" ]; then
            ARGS+=(--endpoint "$INPUT_ENDPOINT")
          fi
          if [ -n "$INPUT_SITEMAP" ]; then
            ARGS+=(--sitemap "$INPUT_SITEMAP")
          fi
          node scripts/submit-indexnow-batch.mjs "${ARGS[@]}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
