name: Send-Time Impact Report

# Engagement validation for the per-user send-time feature (#3798).
# Runs the read-only report against production Firestore using the CI-side
# Firebase service account, so the result can be produced without any local
# credentials. Output goes to the job log, the run summary, an artifact, and
# (on schedule, or on demand when post_to_issue=true) a comment on the #3798
# tracker so the cohort growth is recorded in the backlog over time.

on:
  schedule:
    # Weekly, Monday 02:20 UTC. Weekly cadence tracks the slow-growing
    # `personal` cohort (subscribers need 3+ post-feature events before they get
    # a personal hour) into the backlog without spamming it.
    # The slot is not load-bearing for a read-only report, and the "quiet
    # 01:00-04:00 UTC concurrency window" this comment used to cite does not
    # exist — see the corrected audit in send-job-alerts.yml (#3798 Fase 1).
    # Effective start is ~05:54 UTC (median 214m of GitHub dispatch backlog).
    - cron: '20 2 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (sent_at >= now - days)'
        required: false
        default: '20'
        type: string
      since:
        description: 'Feature activation date for the pre/post split (YYYY-MM-DD)'
        required: false
        default: '2026-07-12'
        type: string
      maturity_hours:
        description: 'Exclude deliveries released less than N hours ago (0 = disable, reproduces the old confounded numbers)'
        required: false
        default: '48'
        type: string
      post_to_issue:
        description: 'Post the report as a comment on issue #3798'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write   # to post the report onto the #3798 tracker

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Run send-time impact report (read-only)
        env:
          # `inputs` is empty on a `schedule` event, so fall back to the same
          # defaults the workflow_dispatch inputs declare.
          REPORT_DAYS: ${{ inputs.days || '20' }}
          REPORT_SINCE: ${{ inputs.since || '2026-07-12' }}
          # #3798 Fase 4: without a maturation window the `personal` cohort is
          # the only one systematically delayed relative to its own sent_at, so
          # it gets a shorter effective window in which to be opened. Measured
          # 2026-08-05: that single confound moved personal-vs-global from
          # -8.7pp to +12.1pp on the same data.
          REPORT_MATURITY_HOURS: ${{ inputs.maturity_hours || '48' }}
        run: |
          node scripts/report-send-hour-impact.mjs \
            --days "$REPORT_DAYS" \
            --since "$REPORT_SINCE" \
            --maturity-hours "$REPORT_MATURITY_HOURS" | tee /tmp/send-hour-impact.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: send-hour-impact-report
          path: /tmp/send-hour-impact.txt
          if-no-files-found: ignore

      - name: Post report to #3798
        # Always on schedule; on manual runs only when explicitly requested.
        if: ${{ always() && (github.event_name == 'schedule' || inputs.post_to_issue) }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body = '(no report output captured)';
            try { body = fs.readFileSync('/tmp/send-hour-impact.txt', 'utf8').trim() || body; } catch {}
            const trigger = context.eventName === 'schedule' ? 'scheduled' : 'manual';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3798,
              body: [
                `### 📬 Send-time impact report (${trigger})`,
                '',
                '```',
                body,
                '```',
                '',
                `_Auto-posted by the Send-Time Impact Report workflow — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Comparisons are real two-proportion z-tests (\`[significant, p=...]\` / \`[not significant, p=...]\`). Since #3798 Fase 4 the report keys on DELIVERY time (\`scheduled_for ?? sent_at\`) and drops deliveries released in the last \`--maturity-hours\`, so the deliberately-delayed \`personal\` cohort is no longer compared against a shorter open window than \`global\`/\`immediate\`; \`sched%\` is the share of each group that genuinely got a scheduled send._`,
              ].join('\n'),
            });
