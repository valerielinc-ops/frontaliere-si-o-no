name: FB Jobs Daily Schedule (E5)

on:
  schedule:
    # 13:30 UTC = 14:30 CET / 15:30 CEST. Chosen to land AFTER the daily
    # orchestrator-→translate pipeline that primes today's job set:
    #   - orchestrate-crawlers (08:00 UTC, ~103 min) ends ~09:43 UTC
    #   - translate-pending  (12:00 UTC, up to ~56 min) ends ~12:56 UTC
    # 13:30 leaves a ~30 min cushion. The 144 scheduled FB posts start at
    # the next :05 mark (≥ +10 min FB minimum) and fan out over the next
    # 24 h on minute slots :05/:15/:25/:35/:45/:55.
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      volume:
        description: 'Posts to schedule (1=smoke-test, 24/72/144 = 1/h, 1/20m, 1/10m)'
        required: false
        default: '144'
        type: choice
        options: ['1', '24', '72', '144']
      dry_run:
        description: 'Skip Graph API call (preview only)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write  # to commit fb-posted-jobs.json
  issues: write

jobs:
  schedule:
    runs-on: ubuntu-latest
    # Raised from 10 → 20 (#4764, recurring x4 + #4244 earlier occurrence).
    # Observed run durations grew steadily as the jobs dataset grew: ~3.3-3.7min
    # in late May, ~5-6.5min through late June, a step up to ~8-9min from
    # 2026-07-04 onward (npm ci + assemble-jobs-dataset.mjs scale with dataset
    # size). By mid-July runs were chronically landing at 8-10min against a
    # 10min ceiling with zero margin — 3 of the last ~20 scheduled runs were
    # hard-cancelled at the wall (2026-07-15, 2026-07-26 x2). No single-step
    # regression found; this is dataset-size growth eating a timeout that had
    # no headroom left. 20min gives ~2x headroom over the worst observed run
    # (10.3min) so continued organic dataset growth doesn't immediately trip
    # the ceiling again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from RC
        run: node scripts/load-rc-env.mjs

      - name: Assemble jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Schedule FB jobs
        env:
          FB_JOB_VOLUME: ${{ github.event.inputs.volume || '24' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/schedule-fb-jobs-daily.mjs

      - name: Commit posted-jobs tracking
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fb-posted-jobs.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(fb): track posted jobs [skip ci]"
          # In-place resolver merges by job-id when another commit lands
          # on main mid-run (e.g. a concurrent article workflow or a
          # parallel orchestrator's ledger reset). Without this the
          # workflow exits 1 and the ledger goes out-of-sync with the
          # FB Page's actual scheduled queue.
          bash scripts/lib/git-push-with-retry.sh \
            --in-place-resolver-cmd "node scripts/lib/resolve-fb-posted-jobs-conflict.mjs && git add -A"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
