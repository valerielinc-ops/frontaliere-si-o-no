name: Collect Border-Crossing Traffic

on:
  # ─── Scheduled runs (UTC) ──────────────────────────────────────────
  # Cron times are in UTC.  Europe/Rome is UTC+1 (CET) or UTC+2 (CEST).
  # The ranges below cover both winter and summer offsets.
  #
  # HERE bills 2 "Time Aware Routing" transactions per crossing (52/run for 26
  # crossings); the free tier is 5 000/month. Frequency is concentrated at the
  # two commute peaks (where wait times actually move) and thinned everywhere
  # else so the month's runs spread evenly under budget. A hard in-code monthly
  # cap (HERE_MONTHLY_BUDGET in trafficSchedulerCore.js) is the backstop that
  # guarantees we never exceed the free tier regardless of scheduling variance.
  schedule:
    # ── Weekdays (Mon–Fri) ──
    # Morning commute peak ≈ CET 05:00–09:00 → every 30 min
    - cron: '*/30 4-7 * * 1-5'
    # Midday off-peak sanity check ≈ CET 12:00
    - cron: '0 11 * * 1-5'
    # Evening return peak ≈ CET 15:00–19:00 → every 30 min
    - cron: '*/30 14-17 * * 1-5'
    # ── Weekends (Sat–Sun) → every 4h to conserve HERE quota ──
    - cron: '0 6,10,14,18 * * 0,6'
  workflow_dispatch: {}

concurrency:
  group: traffic-scheduler
  # cancel-in-progress is FALSE so a freshness-watchdog re-dispatch (issue #1106
  # item 2) can never cancel an in-flight run that is about to write the data
  # file: under sustained stale (>90min) the hourly watchdog dispatches this
  # workflow every hour, and with cancel=true an arriving dispatch would kill a
  # */15 cron run mid-collect, leaving data stale → watchdog re-dispatches → loop.
  # Runs are ≤10min and crons are spaced ≥15min, so serialized queueing (group
  # without cancel) still prevents overlap without the cancellation race.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # jobs API per il reporter diagnostico (.github/actions/report-failure, #5437):
  # un blocco permissions esplicito azzera gli scope non elencati, quindi senza
  # questa riga la chiamata risponde 403 e il body torna povero senza dirlo.
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Collect traffic data
        env:
          ENABLE_WEBCAM_ANALYSIS: '1'
        run: node scripts/collect-traffic.mjs

      - name: Recompute rolling 30-day averages
        run: node scripts/compute-border-wait-averages.mjs

      # Publishes the 2x7-day aggregate the weekly ranking article is built from
      # (issue #4974 item 3). Runs here rather than in the weekly workflow so the
      # artifact is always fresh when the generator — which now lives in nanako —
      # comes to fetch it, whatever hour its own cron fires at.
      - name: Publish border-wait ranking window
        run: node scripts/publish-border-wait-window.mjs

      - name: Commit + push (with rebase-retry)
        # Centralized rebase-retry helper (scripts/lib/git-push-with-retry.sh)
        # survives concurrent pushes from other data-refresh workflows.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/border-wait-current.json public/data/border-wait-current.json data/border-wait-history data/border-wait-averages.json public/data/border-wait-averages.json public/data/border-wait-ranking-window.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(border-wait): live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          bash scripts/lib/git-push-with-retry.sh \
            --branch "${GITHUB_REF_NAME:-main}" \
            --regenerate-cmd "node scripts/collect-traffic.mjs && node scripts/compute-border-wait-averages.mjs && node scripts/publish-border-wait-window.mjs && git add data/border-wait-current.json public/data/border-wait-current.json data/border-wait-history data/border-wait-averages.json public/data/border-wait-averages.json public/data/border-wait-ranking-window.json"
        # NOTE: Commit + push goes to main BUT deploy.yml has paths-ignore on
        # data/border-wait-* so this won't trigger a deploy storm — periodic
        # deploys will pick up the new JSON.

      # Reporter diagnostico (#5437) al posto del body run/trigger/ref: dice
      # quale step è morto (collect / compute averages / publish window / push)
      # e quali script guardare, che è metà della diagnosi già fatta.
      # CHI CHIUDE: close-recovered-failure-issues.mjs sul primo run verde — il
      # titolo `Workflow Failure: <name:>` è esattamente il suo pattern.
      - name: Report failure to GitHub Issues
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: 'Workflow Failure: ${{ github.workflow }}'
          closed-by: close-recovered-failure-issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '2'
          labels: Bug
