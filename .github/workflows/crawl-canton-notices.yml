name: Crawl canton notices (avvisi ufficiali cantonali)

# Avvisi ufficiali dei 24 gruppi cantonali (D11/P9g del programma «sezioni
# articoli per cantone»): RSS/JSON/liste HTML delle fonti istituzionali LENTE
# (amministrazioni fiscali, casse AVS e pensioni, uffici mobilita'/cantieri,
# sanita', migrazione, comunicati di Cantoni e Comuni) del registro
# data/canton-notice-sources.json → data/canton-notices.json +
# public/data/canton-notices.json (stesso contenuto: il secondo arriva sul CDN
# con il deploy e lo legge il corpus, generator/scripts/refresh-canton-notices.mjs).
#
# Solo metadati (titolo, link, data, fonte): nessun testo degli articoli.
# Robots.txt riletto a ogni giro, user agent dichiarato, una richiesta per
# fonte, richieste allo stesso server in serie: i dettagli e le soglie stanno
# in scripts/crawl-canton-notices.mjs.
#
# Tre giri al giorno: le fonti sono lente (poche voci a settimana per fonte),
# e ogni giro apre/aggiorna la PR stabile chore/canton-notices-refresh, cosi'
# il required check `vitest (unit + integration)` gira prima di main.

on:
  schedule:
    - cron: '43 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the crawl and its thresholds without opening the data PR.'
        required: false
        default: false
        type: boolean

concurrency:
  group: crawl-canton-notices
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
        # Tetto sullo step come negli altri refresh dati (#5659): un Checkout
        # impantanato non deve consumare il budget del job e morire `cancelled`.
        timeout-minutes: 7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (fast-xml-parser for the feed parser)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Crawl official canton notices
        run: node scripts/crawl-canton-notices.mjs

      - name: Prepare Firebase credentials for push auth
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for the data PR"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Open PR with the notices dataset
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          body="$RUNNER_TEMP/canton-notices-refresh-pr-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Auto-generated by [workflow run %s](%s).\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            cat <<'EOF'
          ## Implementato
          - Il dataset degli avvisi ufficiali cantonali (`data/canton-notices.json` e la copia pubblica per il CDN) viene proposto tramite il branch stabile `chore/canton-notices-refresh`, così il required check `vitest (unit + integration)` gira prima dell'ingresso su `main`; le soglie del crawler (fonti lette, avvisi, cantoni, anti-shrink) sono già passate in questo giro.

          ## Non implementato (ancora)
          Nessuno — refresh automatico dei soli dati, senza residui.
          EOF
          } > "$body"
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/canton-notices.json \
            --path public/data/canton-notices.json \
            --branch chore/canton-notices-refresh \
            --commit-message "🏛️ Refresh avvisi ufficiali cantonali" \
            --title "chore(data): refresh canton notices" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
