name: Social Publish Readiness Watch

# Watches Instagram, TikTok, and Reddit readiness. Instagram can become
# available through Meta grants; TikTok is held by policy for this internal
# uploader regardless of credentials; Reddit's classic API path was refused.
#
# Why this exists rather than "we'll notice". The Instagram/TikTok Remote Config
# parameters existed for days while scripts/load-rc-env.mjs did not map them, so
# the posters read `undefined`, soft-skipped every scheduled run, and reported
# success. A channel that is credential-READY and still silent is invisible by
# construction here: the whole design of the posters is to never fail. Nothing
# in the repo asked "did the approval land?", so the answer was re-derived by
# hand each time somebody wondered — three follow-up issues in a row were filed
# as "owner decision" when two of them were platform review queues already
# running and the third was a refusal nobody had recorded.
#
# Shape and alert channel are the sibling of app-auth-health-monitor.yml /
# gh-pat-expiry-monitor.yml: daily cron, read-only probe, stable-title dedup via
# scripts/lib/github-issue-creator.mjs, zero-Claude bash+node (see AGENTS.md
# "Auth automazioni & frugalità quota" — no claude-code-action, no Max quota).
#
# It opens deduplicated issues for READY channels that need activation and
# ACTION_REQUIRED and CREDENTIAL_MISSING states that need an owner to verify identity, linkage, or
# configuration. A missing Page field is ambiguous (link or scopes), so the
# issue asks for verification instead of declaring the account disconnected.
# TikTok remains policy-held for this internal workflow; a channel waiting on
# Meta's review queue is tracked without a daily reminder. Reddit's refused
# Data API path is likewise a recorded decision, not a queue to poll.

on:
  schedule:
    # 07:50 UTC — after gh-pat-expiry-monitor (06:30) and app-auth-health
    # (07:10), before the Instagram broadcast (08:20), so a
    # channel that flipped ready is flagged on the same morning its first real
    # post would have gone out.
    - cron: '50 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: social-publish-readiness-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    environment: social-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      # No `npm ci`: the prober and its lib use only Node builtins + global
      # fetch. Skipping the install keeps this monitor at well under a minute,
      # which is the difference between a daily check and a daily tax.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Probe every channel
        id: probe
        run: |
          set -euo pipefail
          # Keep read-only probe credentials in this step's shell only.
          eval "$(GITHUB_ENV= node scripts/load-rc-env.mjs --only-env=FB_PAGE_ID,FB_PAGE_ACCESS_TOKEN,FB_PAGE_ACCESS_TOKEN_EXPIRES_AT,FB_USER_ACCESS_TOKEN,FB_USER_ACCESS_TOKEN_EXPIRES_AT,INSTAGRAM_ACCESS_TOKEN,INSTAGRAM_ACCESS_TOKEN_EXPIRES_AT,INSTAGRAM_BUSINESS_ACCOUNT_ID,REDDIT_DATA_API_APPROVED,REDDIT_CLIENT_ID,REDDIT_CLIENT_SECRET --include-social-secrets)"
          for name in FB_PAGE_ACCESS_TOKEN FB_USER_ACCESS_TOKEN INSTAGRAM_ACCESS_TOKEN REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then printf '::add-mask::%s\n' "$value"; fi
          done
          node scripts/check-social-publish-readiness.mjs --github-summary | tee readiness.txt
          unset FB_PAGE_ID FB_PAGE_ACCESS_TOKEN FB_PAGE_ACCESS_TOKEN_EXPIRES_AT FB_USER_ACCESS_TOKEN FB_USER_ACCESS_TOKEN_EXPIRES_AT INSTAGRAM_ACCESS_TOKEN INSTAGRAM_ACCESS_TOKEN_EXPIRES_AT INSTAGRAM_BUSINESS_ACCOUNT_ID REDDIT_DATA_API_APPROVED REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET

      # One issue per newly-ready channel. The title's first 60 chars are stable
      # and carry the channel name FIRST, so the dedup key discriminates between
      # channels instead of collapsing all three onto one issue (see the
      # dedup-title rule in AGENTS.md → "Dedup a MONTE").
      - name: Alert on any channel that can publish (dedup, zero-Claude)
        if: steps.probe.outputs.ready != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          READY_CHANNELS: ${{ steps.probe.outputs.ready }}
          INSTAGRAM_READINESS_REASON: ${{ steps.probe.outputs.reason_instagram }}
          TIKTOK_READINESS_REASON: ${{ steps.probe.outputs.reason_tiktok }}
          REDDIT_READINESS_REASON: ${{ steps.probe.outputs.reason_reddit }}
        run: |
          set -euo pipefail
          for CH in $READY_CHANNELS; do
            case "$CH" in
              instagram) REASON="$INSTAGRAM_READINESS_REASON" ;;
              tiktok) REASON="$TIKTOK_READINESS_REASON" ;;
              reddit) REASON="$REDDIT_READINESS_REASON" ;;
              *) echo "unknown readiness channel: $CH" >&2; exit 1 ;;
            esac
            node scripts/lib/github-issue-creator.mjs \
              --title "$CH publishing is unblocked — activate the poster" \
              --description "$(printf '%s\n' \
                "## ✅ ${CH}: the platform-side block is gone" \
                "" \
                "\`scripts/check-social-publish-readiness.mjs\` reports this channel as **ready**:" \
                "" \
                "> ${REASON}" \
                "" \
                "### Why this is an alert and not good news on its own" \
                "The probe marks a channel ready only against the checks configured for it; this does not prove that a post has been sent. Verify that channel's supported publisher workflow and confirm the result is visible on the intended account before treating delivery as operational." \
                "" \
                "### What to check" \
                "- the channel's scheduled publishing path completes as expected and the result is visible on the intended account" \
                "- the follow-up issue that tracked this channel's block can be closed" \
                "" \
                "Full probe output:" \
                "" \
                '```' \
                "$(cat readiness.txt)" \
                '```')" \
              --priority 2 \
              --label follow-up \
              --workflow "Social Publish Readiness Watch" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Alert on setup or identity checks that need owner action (dedup, zero-Claude)
        if: steps.probe.outputs.action_required != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTION_REQUIRED_CHANNELS: ${{ steps.probe.outputs.action_required }}
          INSTAGRAM_READINESS_REASON: ${{ steps.probe.outputs.reason_instagram }}
        run: |
          set -euo pipefail
          for CH in $ACTION_REQUIRED_CHANNELS; do
            case "$CH" in
              instagram) REASON="$INSTAGRAM_READINESS_REASON" ;;
              *) echo "unknown setup action channel: $CH" >&2; exit 1 ;;
            esac
            node scripts/lib/github-issue-creator.mjs \
              --title "$CH publishing setup requires owner action — Meta identity or credentials" \
              --description "$(printf '%s\n' \
                "## ⚠️ ${CH}: readiness needs owner verification" \
                "" \
                "The read-only readiness probe reports a setup state that needs owner action:" \
                "" \
                "> ${REASON}" \
                "" \
                "A missing instagram_business_account field does not prove that the Instagram account is disconnected; Meta may also withhold the field until the required API scopes are available." \
                "Confirm in Meta Business Suite that the intended professional Instagram account is linked to the configured Page, then verify App Review and the publishing token. The probe does not print account IDs or tokens." \
                "" \
                '```' \
                "$(cat readiness.txt)" \
                '```')" \
              --priority 2 \
              --label follow-up \
              --workflow "Social Publish Readiness Watch" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Alert on missing optional Instagram capabilities (dedup, zero-Claude)
        if: steps.probe.outputs.capability_action_required != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CAPABILITY_ACTION_REQUIRED: ${{ steps.probe.outputs.capability_action_required }}
          INSIGHTS_READINESS_REASON: ${{ steps.probe.outputs.reason_capability_insights }}
          COMMENTS_READINESS_REASON: ${{ steps.probe.outputs.reason_capability_comments }}
          DIRECT_MESSAGES_READINESS_REASON: ${{ steps.probe.outputs.reason_capability_direct_messages }}
        run: |
          set -euo pipefail
          for CAPABILITY in $CAPABILITY_ACTION_REQUIRED; do
            case "$CAPABILITY" in
              insights)
                TITLE='Instagram Insights grant needs owner action'
                REASON="$INSIGHTS_READINESS_REASON"
                LABEL='Insights read and measurement'
                ;;
              comments)
                TITLE='Instagram comments grant needs owner action'
                REASON="$COMMENTS_READINESS_REASON"
                LABEL='Comment moderation and replies'
                ;;
              direct_messages)
                TITLE='Instagram direct messages grant needs owner action'
                REASON="$DIRECT_MESSAGES_READINESS_REASON"
                LABEL='Direct message handling'
                ;;
              *) echo "unknown Instagram capability: $CAPABILITY" >&2; exit 1 ;;
            esac
            node scripts/lib/github-issue-creator.mjs \
              --title "$TITLE" \
              --description "$(printf '%s\n' \
                "## ⚠️ Instagram $LABEL needs owner action" \
                "" \
                "The shared Page link, publisher token identity, and `instagram_basic` checks pass, but this capability is not ready:" \
                "" \
                "> $REASON" \
                "" \
                "In Meta Business settings, verify App Review access for the listed permission and the matching Page task. Then rerun the read-only Social Publish Readiness Watch. No token or account ID is included in this report." \
                "" \
                '```' \
                "$(cat readiness.txt)" \
                '```')" \
              --priority 2 \
              --label follow-up \
              --workflow "Social Publish Readiness Watch" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Alert on Meta token expiry or missing lifecycle metadata (dedup, zero-Claude)
        if: steps.probe.outputs.meta_token_lifecycle_action_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          META_TOKEN_LIFECYCLE_REASON: ${{ steps.probe.outputs.meta_token_lifecycle_reason }}
        run: |
          set -euo pipefail
          node scripts/lib/github-issue-creator.mjs \
            --title "Meta social token expiry needs owner action" \
            --description "$(printf '%s\n' \
              '## ⚠️ Meta token lifecycle needs attention' \
              '' \
              "$META_TOKEN_LIFECYCLE_REASON" \
              '' \
              'Renew or safely re-provision the affected credentials before relying on unattended publishing. The report contains no token values or account IDs.' \
              '' \
              'Full read-only probe:' \
              '' \
              '```' \
              "$(cat readiness.txt)" \
              '```')" \
            --priority 2 \
            --label follow-up \
            --workflow "Social Publish Readiness Watch" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Resolve the Meta token lifecycle issue when metadata is healthy or credentials are absent
        if: success() && steps.probe.outputs.meta_token_lifecycle_action_required != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Meta social token expiry needs owner action" \
            --reason completed \
            --workflow "Social Publish Readiness Watch" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Resolve optional Instagram capability issues when ready
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CAPABILITY_READY: ${{ steps.probe.outputs.capability_ready }}
        run: |
          set -euo pipefail
          for CAPABILITY in insights comments direct_messages; do
            case "$CAPABILITY" in
              insights) TITLE='Instagram Insights grant needs owner action' ;;
              comments) TITLE='Instagram comments grant needs owner action' ;;
              direct_messages) TITLE='Instagram direct messages grant needs owner action' ;;
            esac
            case " $CAPABILITY_READY " in
              *" $CAPABILITY "*)
                node scripts/lib/github-issue-creator.mjs --resolve \
                  --title "$TITLE" \
                  --reason completed \
                  --workflow "Social Publish Readiness Watch" \
                  --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                ;;
            esac
          done

      - name: Resolve the setup issue when Instagram identity is verified
        if: success() && steps.probe.outputs.action_required == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "instagram publishing setup requires owner action — Meta identity or credentials" \
            --reason completed \
            --workflow "Social Publish Readiness Watch" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Watcher-of-the-watcher, mirroring app-auth-health-monitor.yml: if the
      # probe step itself breaks, nobody notices that readiness detection is
      # dead. Every non-crash outcome resolves the self-alert.
      - name: Self-alert on monitor crash (dedup, zero-Claude)
        if: failure() && steps.probe.conclusion == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Social readiness monitor crashed: social-publish-readiness-watch failing" \
            --description "The daily social readiness probe failed before producing a verdict, so a channel becoming publishable would no longer be detected." \
            --priority 3 \
            --workflow "Social Publish Readiness Watch" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Resolve the self-alert when the monitor itself is healthy
        if: always() && steps.probe.conclusion != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Social readiness monitor crashed: social-publish-readiness-watch failing" \
            --workflow "Social Publish Readiness Watch" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
