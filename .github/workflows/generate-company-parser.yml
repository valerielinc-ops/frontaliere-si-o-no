name: Generate Company Crawler Parser (AI)

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: 'Company name (required)'
        required: true
        type: string
      company_website:
        description: 'Company website URL (required)'
        required: true
        type: string
      company_key:
        description: 'Optional company key slug'
        required: false
        type: string
      apply_config:
        description: 'Apply generated config to data/jobs-crawler-config.json'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      omniroute_enabled:
        description: 'Pilot: register OmniRoute (self-hosted local AI gateway) as an opt-in AI fallback for this run only (tier-0 by default — see AI_COMPETING_TIERS in ai-models.mjs)'
        required: false
        default: false
        type: boolean

concurrency:
  group: generate-company-parser
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "⚠️ Firebase secrets not set — secrets will not be loaded from Remote Config."
          fi
          if [ -f /tmp/firebase-sa.json ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute pilot (opt-in, OFF by default — see omniroute_enabled
      # input). Install/start/register/enable factored into
      # .github/actions/setup-omniroute (shared with omniroute-poc.yml,
      # PR #4797) so the two workflows don't drift on the same bash
      # (AGENTS.md #6). Reuses the same small curated provider-key set
      # loaded above by load-rc-env.mjs — does NOT provision OmniRoute's
      # full ~78-100+ locally-registered provider roster as CI secrets
      # (see PR body's "Non implementato"). When the input is false/unset,
      # the composite action is skipped entirely and OMNIROUTE_ENABLED is
      # never set, so ai-models.mjs's OmniRoute provider stays inert —
      # identical behavior to before this pilot.
      - name: Setup OmniRoute (pilot, opt-in)
        if: ${{ inputs.omniroute_enabled }}
        uses: ./.github/actions/setup-omniroute

      - name: Dump OmniRoute logs on failure (pilot, opt-in)
        if: ${{ failure() && inputs.omniroute_enabled }}
        run: |
          cat /tmp/omniroute.log || true
          node scripts/omniroute-diagnose.mjs || true

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Tier-0 in ai-models.mjs's DEFAULT_CHAIN by default since 2026-07-29
      # (AI_COMPETING_TIERS) — competes on real score instead of being
      # reached only after every free-tier model has failed. See
      # .github/actions/setup-claude-haiku-fallback/action.yml for the full
      # rationale + incident history.
      - uses: ./.github/actions/setup-claude-haiku-fallback

      - name: Generate parser proposal
        env:
          PARSER_COMPANY_NAME: ${{ inputs.company_name }}
          PARSER_COMPANY_WEBSITE: ${{ inputs.company_website }}
          PARSER_COMPANY_KEY: ${{ inputs.company_key }}
          PARSER_APPLY_CONFIG: ${{ inputs.apply_config == 'true' && '1' || '0' }}
          # Auth for the opt-in Claude CLI Haiku fallback (tier-0 by default
          # since 2026-07-29 — see AI_COMPETING_TIERS in ai-models.mjs; see
          # "Setup Claude CLI Haiku fallback" step above). Harmless to always
          # pass: ai-models.mjs only offers the model when this AND the RC
          # flag are both set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/generate-company-parser.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No parser changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Parser updates detected:"
            git status --short
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PARSER_COMPANY_NAME: ${{ inputs.company_name }}
          PARSER_COMPANY_WEBSITE: ${{ inputs.company_website }}
          PARSER_COMPANY_KEY: ${{ inputs.company_key }}
          PARSER_APPLY_CONFIG: ${{ inputs.apply_config == 'true' && '1' || '0' }}
          # --regenerate-cmd below re-invokes generate-company-parser.mjs on
          # rebase-conflict retry — same auth needed as the step above.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/jobs-crawler-parser-proposals.json data/jobs-crawler-config.json
          git commit -m "🤖 Generate company crawler parser proposal"

          # Centralized rebase-retry helper survives concurrent pushes from
          # other data-refresh workflows. On rebase conflict, re-run the
          # parser generator on the new base.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/generate-company-parser.mjs && git add data/jobs-crawler-parser-proposals.json data/jobs-crawler-config.json"

