name: Post-deploy Validate (live)

# Reusable workflow called from deploy-publish.yml as the `validate-live` job
# (was deploy.yml before the build/publish split). Runs AFTER
# `actions/deploy-pages@v5` has published the new dist to GitHub Pages.
# READ-ONLY by design: live smoke (probe 5xx + e2e:live) fetched directly
# from the deployed site.
#
# NOTE: the `rollback` job was DISABLED (`if: false`) since 2026-06-12 and was
# REMOVED entirely in the build/publish split. The `failure_kind` output below
# is now unconsumed (kept harmless so re-introducing rollback needs no signal
# changes here); its references to "rollback firing" are historical.
#
# Side-effects (Facebook/LinkedIn post, IndexNow/GSC submission, winners
# git push, mark last_known_good) used to live here but were extracted
# to `post-deploy-publish.yml` because they fired BEFORE validate-dist
# completed. If validate-dist later failed, rollback fired but FB had
# already announced URLs that now point to the rolled-back dist (mismatch
# or 404). The publish workflow gates on BOTH validate-dist AND
# validate-live success.
#
# Inputs:
#   deploy_run_id     — caller's github.run_id (for cross-job artifact
#                       names like sitemaps-${run_id})
#   deploy_event_name — kept for parity with publish.yml signature.
on:
  workflow_call:
    inputs:
      deploy_run_id:
        description: 'Run ID of the calling deploy workflow run.'
        required: true
        type: string
      deploy_event_name:
        description: 'github.event_name from the caller (workflow_dispatch / push / etc.)'
        required: true
        type: string
      deploy_ref:
        description: 'Commit SHA of the build the artifacts came from. Pass when the caller runs at a different SHA than the build (e.g. deploy-publish.yml on workflow_run). Empty = checkout the caller default.'
        required: false
        type: string
        default: ''
    outputs:
      # Lets the caller (deploy.yml) distinguish a PROPAGATION-TIMEOUT failure
      # (our build-id never went live within the window — the live site is an
      # older VALID build, nothing is broken) from a genuine LIVE-BROKEN failure
      # (5xx / e2e / CLS / visual regression). Empty on success or on a
      # live-broken failure; 'propagation_timeout' when only propagation timed
      # out. deploy.yml gates `rollback` OFF for propagation_timeout — rolling
      # back to an even-older last_known_good would only regress the site.
      failure_kind:
        description: "'propagation_timeout' if the deploy never propagated live; empty otherwise."
        value: ${{ jobs.validate-live.outputs.failure_kind }}

jobs:
  validate-live:
    runs-on: ubuntu-latest
    outputs:
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
    permissions:
      contents: read    # read-only — winners git push moved to publish.yml
      actions: read     # for download-artifact same-run
      issues: write     # for github-issue-creator on validation failure (run 26592389280 surfaced "Resource not accessible by integration (createIssue)")
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — registry operations will be skipped."
          fi

      # `sitemaps-${run_id}` bundles build-id.txt which is consumed by
      # `wait-for-pages-propagation.mjs` to verify the live site is
      # serving THIS deploy — so validate-live doesn't need to download
      # the 1.5 GB github-pages artifact just for build-id.
      - name: Download sitemaps bundle (for build-id.txt)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sitemaps-${{ inputs.deploy_run_id }}
          path: /tmp/sitemaps-bundle
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage build-id.txt into dist/
        run: |
          if [ -f /tmp/sitemaps-bundle/build-id.txt ]; then
            mkdir -p dist
            cp /tmp/sitemaps-bundle/build-id.txt dist/build-id.txt
          fi

      # Live smoke — Playwright fetches the deployed site directly.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: npx playwright install --with-deps chromium

      # ── Propagation wait (separated from smoke so we can tell a not-yet-live
      # deploy apart from a broken one) ──────────────────────────────────────
      # wait-for-pages-propagation.mjs exits 0 when the live build-id is OURS or
      # NEWER (a later deploy already superseded us — site still ≥ as fresh), and
      # exits 1 only when the live build-id stays OLDER than ours for the whole
      # window (our deploy genuinely hasn't landed on Pages yet). Under deploy
      # congestion the Pages publish backlog can make ours land minutes-to-hours
      # after this window — but the live site is an EARLIER VALID build the whole
      # time, NOT broken. So a propagation timeout must NOT trigger rollback.
      #
      # Window = 240s (script default is 25min; we override here). Two facts set
      # this ceiling:
      #   1. The probe is CACHE-BUSTED — wait-for-pages-propagation.mjs adds a
      #      unique `?_=<ts>` + `Cache-Control: no-cache` per request, so the
      #      build-id.txt read defeats the Fastly edge. The ~1-2 min edge lag
      #      documented for *cached HTML* therefore does NOT delay build-id
      #      detection.
      #   2. Measured: across the 88 completed deploy runs of late-May→Jun, every
      #      healthy deploy (action or retry reaching success) confirmed at
      #      attempt 1, t+0–1s (p100 = 1s; e.g. runs 26808012188, 26803159863,
      #      26755640441) — deploy-pages returns success only after server-side
      #      syncing_files→updating_pages, so the origin already serves our bytes.
      # 240s sits comfortably ABOVE the documented 1-2 min edge lag, so even a
      # worst-case edge-stale healthy deploy cannot false-fire propagation_timeout
      # (which would gate publish/IndexNow OFF — indexing latency). The old 25-min
      # window was only ever burned in the double-action-timeout branch, where it
      # almost always ended in propagation_timeout regardless (the ~13 GB / ~470k-
      # file publish lands long after any sane window). 240s still cuts ~21 of the
      # ~23 min wasted there. Trade-off: a rare supersede caught at t+1415s now
      # times out instead — fine, that build was never ours; publish defers to the
      # superseding run's own validate-live.
      # Phase 2 (deep sample, 2026-07-14): build-id live ≠ whole artifact live.
      # For this ~650k-file site, Pages serves the fresh build-id within seconds
      # of activation while a tail of pages can keep 404ing at origin for an
      # extended window (measured: ~2.5k canonical job URLs for ~2h after the
      # 03:59Z activation — the send-job-alerts live-link preflight filtered
      # 15-30% of every CH-wide alert that morning, and the purge below had
      # dropped the previous build's edge copies that were masking the holes).
      # The script now additionally samples 60 URLs of THIS build (from the
      # sitemaps bundle's new-sitemap-urls.json) spread across the sitemap set
      # and holds the gate until ≥97% serve at origin, so the purge below can
      # never expose an origin still full of propagation holes. On deep-sample
      # timeout the step fails like a build-id timeout → propagation_timeout
      # classification → NO purge (edge keeps serving the previous build's 200s),
      # NO rollback, publish gated off. Fail-open: bundle missing → build-id-only.
      - name: Wait for Pages propagation (our build-id or newer must be live)
        id: propagation
        continue-on-error: true
        env:
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: |
          node scripts/wait-for-pages-propagation.mjs \
            --timeout-ms=240000 \
            --sample-file=/tmp/sitemaps-bundle/new-sitemap-urls.json \
            --sample-size=60 --sample-min-ok=0.97 --sample-timeout-ms=900000

      - name: Classify propagation timeout (no rollback for this)
        if: steps.propagation.outcome == 'failure'
        id: classify
        run: |
          echo "::warning::[validate-live] Pages propagation timed out — our build-id is not live yet. The live site is an older VALID build (not broken); the next deploy will land once Pages drains. Flagging propagation_timeout → caller skips rollback, and publish is gated off (no IndexNow on not-yet-live URLs)."
          echo "failure_kind=propagation_timeout" >> "$GITHUB_OUTPUT"

      # Job still FAILS on propagation timeout (so `publish` — gated on
      # validate-live success — does not submit IndexNow/Google/GSC for URLs that
      # aren't live yet), but the caller reads `failure_kind` and skips rollback.
      # Skip the smoke + downstream gates: they would only test the stale live
      # build, which its own deploy already validated.
      - name: Fail on propagation timeout (skip smoke against stale live)
        if: steps.propagation.outcome == 'failure'
        run: |
          echo "::error::[validate-live] propagation_timeout — deploy not live within window. Skipping smoke/gates; caller will NOT rollback (live is a valid earlier build)."
          exit 1

      # NO ZONE-WIDE PURGE HERE — REMOVED 2026-08-05 (#5162). Do not re-add.
      #
      # This step used to run `node scripts/cf-purge-cache.mjs` with no argv,
      # i.e. `purge_everything`, on every successful deploy. It was there because
      # it-apex-html-cache held apex HTML for 24h (override_origin) and GitHub
      # Pages cannot signal Cloudflare on republish.
      #
      # `purge_everything` is ZONE-wide, and this zone carries the R2 CDN as well
      # as the apex. Measured over 23h before removal:
      #
      #   cdn.frontaliereticino.ch  1_497_318 req  96.0% hit  ← wiped every deploy
      #   frontaliereticino.ch        570_021 req  19.2% hit  ← the intended target
      #
      # So each deploy discarded a 1.4M-object CDN cache to refresh a cache that
      # was barely holding anything — and the CDN never needed it, because
      # /assets/ freshness comes from the targeted per-key purge that
      # deploy-it-pages-prep.sh already runs (scripts/ci/purge-changed-cdn-assets.mjs).
      # The re-fetch storm hit R2 directly: ~60k origin fetches in 23h against a
      # 7-day edge TTL, 277 failing as edge-synthesised 502s — issues #5034,
      # #5035, #5036, #5052, #5081, #5092, #5093, #5094 and the failed dynamic
      # import in #4644; the apex 503s (#5082) are the same storm on Pages.
      #
      # It also made serve_stale (#5158) dead on arrival: a purge DELETES the
      # copy, and serve_stale can only serve one that exists and merely expired
      # (measured staleRescuable = 0).
      #
      # Apex freshness is now a bounded 300s edge TTL (APEX_EDGE_TTL_SECONDS in
      # scripts/cf-locale-failover-setup.mjs) — self-invalidating, no purge
      # needed. cf-purge-cache.mjs still supports the zone-wide mode for
      # deliberate operator use, but it now requires CF_PURGE_ZONE_WIDE=1 so it
      # cannot silently return to a deploy path.
      # Guarded by tests/cf-zone-purge-blast-radius.test.ts.

      # Verify the offloaded JS/CSS bundle actually serves from the CDN on the
      # LIVE site. Moved here from the build job: the CDN Pages build lags the
      # push, so an inline build-time poll was a flaky false-negative that blocked
      # the whole build. By the time validate-live runs the deploy is propagated
      # and the CDN repo's Pages site has long since built, so this is reliable.
      # The boot chain (entry JS/CSS) is rebased to cdn.frontaliereticino.ch by
      # ASSET_CDN/renderBuiltUrl; if the homepage references such a URL it MUST
      # serve 200, else the live site can't boot → fail → caller rolls back.
      # If no CDN /assets/ ref is present (assets stayed same-origin this round —
      # Guard B kept dist/assets), there is nothing to verify → pass.
      # ── Parallel live gates ──────────────────────────────────────────────
      # The CDN-bundle curl check and the CLS gate (PSI — network-bound, light
      # local CPU) are mutually independent and touch disjoint paths, so they run
      # as `background:` steps overlapping the foreground Playwright chain (Live
      # smoke → visual regression). `wait-all` near the end rejoins them; a failed
      # background gate still fails the job (verified live, probe run 28352247167).
      # The two Playwright steps stay foreground + sequential — they share
      # playwright-report/ + test-results/ and would clobber each other if run
      # concurrently. Load RC is hoisted here so the backgrounded CLS step
      # inherits the PageSpeed key from $GITHUB_ENV before it launches.
      - name: Load RC secrets (PageSpeed API key)
        run: node scripts/load-rc-env.mjs

      - name: Verify CDN-offloaded bundle serves live
        id: cdn-gate
        background: true
        env:
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: |
          set -uo pipefail
          # Retry the homepage fetch so a transient network blip can't masquerade
          # as "no CDN ref → nothing to verify" and silently skip the gate.
          html=""
          for i in 1 2 3 4; do
            html="$(curl -s --max-time 30 "${LIVE_BASE_URL}/" || true)"
            [ -n "$html" ] && break
            sleep 5
          done
          if [ -z "$html" ]; then
            echo "[validate-live] homepage fetch returned empty after 4 tries — inconclusive (transient); the e2e:live smoke below exercises boot end-to-end. Skipping CDN gate."
            exit 0
          fi
          # NOTE: trailing `|| true` is load-bearing. The step shell runs under
          # `set -e` + `pipefail` (GitHub default `bash -eo pipefail {0}` plus the
          # `set -uo pipefail` above). Without the guard the `asset=$(…)` ASSIGNMENT
          # aborts the whole step (exit 1, zero stdout) in two real cases, BEFORE the
          # `if [ -z "$asset" ]` "nothing to verify → pass" branch can run:
          #   1. assets served same-origin this deploy (Guard B kept dist/assets) →
          #      grep finds no cdn ref → grep exits 1 → pipefail → assignment fails.
          #   2. grep matches but `grep | head -1` closes the pipe early → grep gets
          #      SIGPIPE (141) → pipefail → assignment fails (intermittent race).
          # Both are EXPECTED states, not boot breakage. The bare grep-pipe false-
          # failed every same-origin-assets deploy (recurring "Validation Failure
          # (live)" #1960), gating publish/IndexNow off on a perfectly healthy site.
          # `|| true` normalises to asset="" so the graceful pass path is reached.
          asset="$(printf '%s' "$html" | grep -oE 'https://cdn\.frontaliereticino\.ch/assets/[^"'"'"' )]+\.(js|css)' | head -1 || true)"
          if [ -z "$asset" ]; then
            echo "[validate-live] homepage (non-empty) references no cdn.frontaliereticino.ch/assets bundle — assets served same-origin this deploy; nothing to verify."
            exit 0
          fi
          echo "[validate-live] verifying boot bundle on CDN: $asset"
          ok=""
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$asset" || echo 000)"
            echo "  attempt $i: $code"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::[validate-live] CDN boot bundle $asset not serving after ~2min (live homepage references it but it 404s) — failing → rollback"
            exit 1
          fi
          echo "✅ [validate-live] CDN boot bundle serves 200 from cdn.frontaliereticino.ch"

      # Per-canton job shards must actually SERVE from the CDN.
      #
      # This gate exists because the failure it catches is invisible from the
      # outside: `fetchShardDirect` treats a 404 as "shards not built yet" and
      # falls back to the full locale index, so a shard set that never published
      # produces a site that looks perfectly healthy while quietly downloading
      # ~3.5 MB per canton landing again — the exact silent regression that left
      # job-popularity.json 404ing for hours (#5313). Nothing else checks it:
      # the CDN gate above covers /assets/ only, and there is no edge redirect
      # for /data/ (ensure-image-cdn-redirect.mjs has no such prefix), so a
      # missing file is a hard 404 with no safety net.
      #
      # Three assertions, cheapest first:
      #   1. the manifest serves        → the directory published at all;
      #   2. TI-it + BASILEA-de serve   → per-locale naming AND the half-canton
      #      merge are right (a raw-BFS name like BS-de.json is never emitted,
      #      so this is what would catch a regression in resolveCantonShardKey);
      #   3. counts agree with the manifest → the set is not truncated.
      - name: Verify canton job shards serve from CDN
        id: canton-shards-gate
        background: true
        env:
          CDN_BASE_URL: https://cdn.frontaliereticino.ch
        run: |
          set -uo pipefail
          base="${CDN_BASE_URL}/data/jobs-by-canton"
          manifest=""
          for i in $(seq 1 12); do
            manifest="$(curl -s --max-time 20 "$base/manifest.json" || true)"
            printf '%s' "$manifest" | grep -q '"total"' && break
            echo "  attempt $i: manifest not ready"
            manifest=""
            sleep 10
          done
          if [ -z "$manifest" ]; then
            echo "::error::[validate-live] $base/manifest.json not serving after ~2min — the canton shard set did not publish. The SPA silently falls back to the full locale index, so every canton SERP is back to downloading the whole corpus. Failing → rollback."
            exit 1
          fi
          total="$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).total)}catch{console.log("")}})')"
          echo "[validate-live] shard manifest OK — total=$total"
          # Representative shards: the highest-traffic canton, and a merged
          # half-canton in a non-default locale.
          for f in TI-it BASILEA-de; do
            ok=""
            for i in $(seq 1 6); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/$f.json" || echo 000)"
              [ "$code" = "200" ] && { ok=1; break; }
              echo "  $f attempt $i: $code"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::[validate-live] $base/$f.json does not serve 200 — canton shards are addressed wrong or partially published. Failing → rollback."
              exit 1
            fi
            echo "  ✅ $f.json serves 200"
          done
          # Truncation check: the TI shard must hold exactly what the manifest
          # promised for TI. Catches a half-written or stale-cached shard set.
          want="$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).byCanton.TI)}catch{console.log("")}})')"
          got="$(curl -s --max-time 30 "$base/TI-it.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).length)}catch{console.log("")}})')"
          if [ -n "$want" ] && [ -n "$got" ] && [ "$want" != "$got" ]; then
            echo "::error::[validate-live] TI shard holds $got records but the manifest promises $want — truncated or stale shard set. Failing → rollback."
            exit 1
          fi
          echo "✅ [validate-live] canton shards serve from CDN (TI=$got records, corpus total=$total)"

      # CLS ratchet — fails if any audited template's CLS p75 regresses past
      # Google's "needs improvement" threshold (0.25) or by more than 10%/+0.05
      # absolute vs `data/cls-baseline.json`. CLS poor crushes AdSense viewability
      # and ad-bid; without this gate, every refactor risks pushing it up another
      # notch. Improving the baseline requires running `audit-cls-live --rebaseline`
      # locally and committing the diff together with the fix.
      # Backgrounded so PSI's serial/quota-limited wait overlaps the Playwright chain.
      - name: CLS regression gate
        id: cls-gate
        background: true
        env:
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: node scripts/audit-cls-live.mjs

      - name: Live smoke (probe 5xx + e2e:live)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: |
          npm run probe:5xx
          npm run test:e2e:live

      # Visual regression on the LIVE site. Skipped until linux baselines
      # are committed (run regenerate-visual-baselines.yml workflow_dispatch
      # to generate them). On failure, validate-live fails → rollback fires
      # and restores the previous dist (which by definition matched the
      # baseline). Foreground + sequential after Live smoke: both drive
      # Playwright and share playwright-report/ + test-results/.
      - name: E2E visual regression (live)
        if: hashFiles('tests/e2e/seo-visual-regression.spec.ts-snapshots/*-linux.png') != ''
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          LIVE_BASE_URL: https://frontaliereticino.ch
        run: npx playwright test tests/e2e/seo-visual-regression.spec.ts

      # Rejoin the backgrounded CDN bundle + canton-shard + CLS gates. A failure
      # in any of them surfaces here and fails the job. The upload + reporter
      # steps below are always()/failure()-gated, so they still run on a gate
      # failure (verified live, probe run 28352484149).
      - name: Wait for parallel live gates (CDN bundle + canton shards + CLS)
        wait-all: true

      - name: Upload CLS report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cls-report-${{ github.run_id }}
          path: reports/cls-*.json
          retention-days: 30

      # On failure, also upload the structured audit-reports/cls-live.json
      # produced by scripts/lib/auditReport.mjs. The full PSI / Lighthouse JSON
      # is embedded for every hard CLS regression so a debug agent can replay
      # the attribution evidence offline without re-running PSI (which is
      # quota-limited and ~30 min serial). Tied to failure() to stay within
      # the free-tier retention budget.
      - name: Upload audit reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/audit-reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-live
          path: test-results/
          retention-days: 14

      # propagation_timeout is an expected transient under Pages publish
      # congestion (live is a valid earlier build, not broken) — not a bug, so
      # don't open/append a "Validation Failure (live)" issue for it.
      - name: Report failure to GitHub Issues
        if: failure() && steps.classify.outputs.failure_kind != 'propagation_timeout'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dispatch/call inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          INPUT_DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          # Titolo STABILE (senza run-number) → dedup di github-issue-creator.mjs
          # collassa le run successive in commenti 🔁 sulla issue canonica invece
          # di aprire una issue nuova per run. Run-number nella description.
          # --reopen-within-hours: se la stessa issue canonica è stata chiusa
          # da poco (es. auto-close su un deploy verde) e il gate ri-fallisce,
          # la RIAPRE invece di aprirne una nuova → niente storm per-run di issue
          # transienti (#928/#931/#937/#941, già chiuse). Finestra 6h ~ ritmo deploy.
          node scripts/lib/github-issue-creator.mjs \
            --title "Validation Failure (live): post-deploy" \
            --description "## Live validation post-deploy fallita
          **Validation run #:** ${{ github.run_number }}
          **Deploy run:** https://github.com/${{ github.repository }}/actions/runs/$INPUT_DEPLOY_RUN_ID
          **Validation run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Build SHA:** ${INPUT_DEPLOY_REF:-$GITHUB_SHA} (deploy_ref = workflow_run.head_sha)" \
            --priority 1 \
            --reopen-within-hours 6 \
            --label Bug \
            --workflow "Post-deploy Validate Live"

      - name: Resolve GitHub Issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mirror of the failure reporter: live validation passed, so close the
          # canonical "Validation Failure (live)" issue if open — no stale issue
          # while the state is green. Idempotent; reopens on a re-flap via the
          # failure reporter's --reopen-within-hours 6.
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
