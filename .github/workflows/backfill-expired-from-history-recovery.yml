name: Recover timed-out history backfill

# A timeout is reported by GitHub as `cancelled`, and the cancelled run cannot
# execute its normal failure steps. The primary workflow persists a cursor at
# every bounded checkpoint; rerunning the same run therefore resumes from the
# last pushed crawler instead of rebuilding the already committed work.
on:
  workflow_run:
    workflows: [Backfill Expired Jobs From History]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: backfill-expired-from-history-recovery
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.path == '.github/workflows/backfill-expired-from-history.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun the same dispatch with its original inputs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            core.warning(
              `Backfill ${run.id} ended ${run.conclusion}; ` +
              `rerunning attempt ${Number(run.run_attempt || 1) + 1} from its durable cursor.`,
            );
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
