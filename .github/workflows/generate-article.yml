name: Generate Blog Article

on:
      # ── CUTOVER (issue #4974 item 3, §5.7) ──────────────────────────────
      # Disabled here because this producer now runs in
      # nanakokyobashi-rgb/frontaliere-articles, which owns the corpus. Leaving
      # both enabled would give the same files two writers and the last push
      # would win — the exact failure the migration exists to remove.
      #
      # workflow_dispatch is deliberately KEPT so this can still be run by hand
      # during the observation window if the nanako side needs to be compared
      # against it. Re-enabling means deleting these comment markers; it is not
      # a code change, which is what makes the rollback cheap.
      #
      # ── #5289: "by hand" was never ENFORCED ─────────────────────────────
      # Commenting out `schedule:` closed one door and left two open, because
      # `workflow_dispatch` is not the same thing as "a human". On 2026-08-06
      # at 09:51:54Z `refresh-bfs-stats.yml` detected a new BFS quarter
      # (2026-Q1 → 2026-Q2) and ran `gh workflow run generate-article.yml`.
      # That one dispatch re-lit the producer, and because the last step of
      # this job dispatches ITSELF, the chain then ran unattended for ~22h
      # (~20 runs) writing packages/articles/content/ — exactly the two-writer
      # state the comment above says the migration exists to remove.
      #
      # What it cost, measured: five articles were committed here between
      # 2026-08-06 10:28 and 2026-08-07 05:35. None of them exists in nanako's
      # corpus, so `scripts/pull-articles-corpus.mjs` saw a downstream tree
      # LARGER than upstream and refused (its shrink guard doing its job) —
      # which froze the sitemap sync and left tests/blog-slugs-sitemap-sync.ts
      # red on main itself, blocking every PR in the repo. Then, once nanako
      # published enough new articles for the counts to cross back over, the
      # pull succeeded and its mirrorTree DELETED all five. They are still
      # live (HTTP 200) with no corpus entry behind them.
      #
      # So the guard below makes "by hand" explicit: the job only runs when
      # the dispatcher passes confirm_corpus_write=yes. The self-trigger step
      # does not pass it (see "Self-trigger next run" at the bottom), so a
      # chain cannot restart itself, and neither can another workflow.
  # schedule:  # DISABLED AT CUTOVER — see above
  # # Every 30 minutes.  Body expansion is now capped at 600 words/field
  # # and translation uses dynamic maxTokens + sub-chunking, so free-tier
  # # models no longer truncate.  Duplicate-check exits early (no API calls)
  # # for most runs, keeping actual model consumption low.
  # - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      confirm_corpus_write:
        description: 'CUTOVER GUARD (#5289) — the corpus is owned by nanakokyobashi-rgb/frontaliere-articles. Type "yes" to let this retired producer write packages/articles/content/ anyway. Anything else and the job is skipped. Automation must NOT set this.'
        required: false
        type: string
        default: ''
      url:
        description: 'Optional: specific article URL to generate from (leave empty for auto-scan)'
        required: false
        type: string
      retry_count:
        description: 'Internal: retry counter for self-trigger chain (do not set manually)'
        required: false
        type: string
        default: '0'
      no_changes_streak:
        description: 'Internal: consecutive no_changes counter, observability only — does not affect self-trigger delay (do not set manually)'
        required: false
        type: string
        default: '0'
      section:
        description: 'Article section to generate: frontaliere (default) or svizzera. The self-trigger chain alternates this each run so both sections grow at the same cadence.'
        required: false
        type: string
        default: ''
      runner:
        description: 'Where to run: github (GitHub-hosted, default) or self-hosted (Oracle free VM — non-Actions IP so GitHub Models PATs are not IP-throttled).'
        required: false
        type: string
        default: ''
      force_chain:
        description: 'Diagnostic: comma-separated model chain to force (e.g. local/fallback) — bypasses the auto cascade. Use to validate/measure the local fallback on demand without waiting for natural remote exhaustion. Leave empty in normal runs.'
        required: false
        type: string
        default: ''

concurrency:
  # Shared group: only 1 run active at a time, next run queues (not skipped).
  # GitHub keeps at most 1 pending — if a 3rd arrives, it replaces the pending one.
  group: article-generation
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  # Fires on exactly the dispatches the guard turns away, so a blocked run is
  # a run that SAYS it was blocked. A skipped job with no explanation reads as
  # "the workflow is broken" — which is how the 2026-08-06 chain went 22h
  # unnoticed in the first place, from the opposite direction.
  cutover-notice:
    if: github.event.inputs.confirm_corpus_write != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why nothing was generated
        env:
          # Via env and quoted below, never interpolated into the script text:
          # `confirm_corpus_write` is free-form input and would otherwise reach
          # the shell as code (scripts/ci/check-workflow-input-injection.mjs).
          # The irony is worth naming — a guard against unattended writes must
          # not itself hand the shell to whoever dispatches it.
          CONFIRM_VALUE: ${{ github.event.inputs.confirm_corpus_write }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## 🚫 Generazione saltata — questo produttore e' in pensione (#4974 item 3)"
            echo ""
            echo "Gli articoli **nascono in \`nanakokyobashi-rgb/frontaliere-articles\`** dal cutover"
            echo "del 2026-08-02. Questo workflow scrive \`packages/articles/content/\`, che a valle"
            echo "e' una **copia** rifatta da \`scripts/pull-articles-corpus.mjs\` a ogni sync: cio'"
            echo "che nasce qui non risale a monte, blocca il sync (guardia anti-shrink) e viene"
            echo "poi cancellato dal primo sync che riesce. Cinque articoli hanno fatto"
            echo "esattamente quel giro il 2026-08-06/07 — vedi #5289."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${EVENT_NAME}\` |"
            echo "| Chi ha lanciato | \`${TRIGGERING_ACTOR}\` |"
            echo "| \`confirm_corpus_write\` | \`${CONFIRM_VALUE:-(non passato)}\` |"
            echo ""
            echo "**Se sei un umano e lo vuoi davvero** (confronto contro nanako nella finestra"
            echo "di osservazione), rilancia passando \`confirm_corpus_write=yes\`:"
            echo ""
            echo '```'
            echo "gh workflow run generate-article.yml --ref main -f confirm_corpus_write=yes"
            echo '```'
            echo ""
            echo "L'automazione non deve passarlo: e' il flag che distingue «a mano» da «da sola»."
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    # `confirm_corpus_write == 'yes'` is the cutover guard (#5289). It is an
    # input, not a check on the actor, on purpose: `refresh-bfs-stats.yml` and
    # this job's own self-trigger both dispatch as the same App identity a
    # human would use through `gh`, so no actor test can separate them. An
    # input can only arrive from whoever typed it.
    if: >-
      github.event.inputs.confirm_corpus_write == 'yes'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    # Opt-in self-hosted routing. Defaults to GitHub-hosted, so nothing breaks if
    # no self-hosted runner exists. Set repo variable ARTICLE_RUNNER=self-hosted
    # (or dispatch with runner=self-hosted) once an Oracle-free-VM runner with the
    # `article-gen` label is online — that runs from a non-Actions IP so GitHub
    # Models PATs (+ multi-PAT rotation) aren't IP-throttled. See
    # docs/SELFHOSTED-RUNNER.md. Falls back to ubuntu-latest otherwise.
    runs-on: ${{ (github.event.inputs.runner || vars.ARTICLE_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","article-gen"]') || 'ubuntu-latest' }}
    # 80min = setup (~6) + the generate step's own hard kill (55min frontaliere
    # budget + 5min grace) + post steps (~5) + margin. Was 360: with `concurrency:
    # cancel-in-progress: false` and a cron every 30min, a single hung run held
    # the article-generation slot for HOURS and queued every following run behind
    # it (run 30436268314 burned 3h52m before a manual cancel; the next run then
    # sat queued 2h18m). The generate step's `timeout` wrapper is the primary
    # guard — this is the backstop for a hang anywhere else in the job.
    timeout-minutes: 80
    steps:
      # NOTE: the deploy.yml-style "Free disk space" toolchain cleanup was
      # removed here (2026-06-15). It cost ~260s of pure overhead per run and is
      # unnecessary for THIS workflow: article generation only commits source +
      # generated thumbnails (a few MB) and dispatches deploy.yml — it never runs
      # the multi-GB Vite/Pages build, so the ubuntu-latest default free space
      # (~25 GB on /) is ample. The heavy cleanup stays in deploy.yml where the
      # 9 GB+ dist actually lands. Saves ~260s × ~48 runs/day ≈ 3.5h runner/day.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "⚠️ Firebase secrets not set — secrets will not be loaded from Remote Config."
          fi
          if [ -f /tmp/firebase-sa.json ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Since 2026-07-29 (AI_COMPETING_TIERS default in ai-models.mjs) this
      # tier is tier-0 BY DEFAULT — it competes on real score against every
      # free-tier model above, no longer reached only as an absolute last
      # resort. Owner request 2026-07-11: the recurring free-pool exhaustion
      # deferrals must never zero production again. Extracted to a shared
      # composite action 2026-07-24 (was
      # duplicated byte-for-byte in this file and send-newsletter.yml, then
      # about to be copy-pasted into more workflows for the fleet-wide
      # rollout — see .github/actions/setup-claude-haiku-fallback/action.yml
      # for the full rationale + incident history).
      - uses: ./.github/actions/setup-claude-haiku-fallback

      # Primary identity for the self-trigger dispatch below = GitHub App
      # installation token (`frontaliere-automation[bot]`): auto-mints, no expiry
      # babysit, and its dispatch re-triggers the next run just like the PAT (no
      # GITHUB_TOKEN anti-recursion). Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Cleanup stale news sitemap entries
        run: node scripts/cleanup-news-sitemap.mjs

      # Resolve which article section this run generates. The self-trigger chain
      # alternates `section` each run (frontaliere ⇄ svizzera) so both grow at
      # the same cadence without adding runs. Fail-safe: anything other than an
      # explicit 'svizzera' (incl. empty cron default) falls back to
      # 'frontaliere' — the ~95%-revenue funnel must never break. URL-specific
      # runs honour an explicit section too: the lost-article auto-retry
      # dispatches url+section together, so a svizzera article lost to a push
      # race must retry in its own section, not get rerouted to frontaliere.
      - name: Resolve target section
        id: section
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_SECTION: ${{ github.event.inputs.section }}
        run: |
          SEC="$INPUT_SECTION"
          if [ "$SEC" != "svizzera" ]; then SEC="frontaliere"; fi
          echo "section=$SEC" >> "$GITHUB_OUTPUT"
          echo "🎯 Target section: $SEC"

      # ── Local open-source LLM fallback (opt-in) ───────────────────────
      # When the repo variable ARTICLE_LOCAL_FALLBACK=1, set up a local ollama
      # server serving a small open-source model (default qwen2.5:7b). The model
      # sits in the last-resort block of the cascade (scripts/lib/ai-models.mjs,
      # sunk below every tier-0 cloud model by sortChainByScore) and is reached
      # ONLY when every remote free-tier provider is daily-exhausted — the
      # recurring "tutti i modelli esauriti"
      # defer that drops frontaliere production to 0 for that window. Public repo →
      # GitHub-hosted runner minutes are free, so this is $0; the only cost is
      # wall-clock (CPU inference is slow), which is fine for a last-resort path.
      # Entirely inert unless the variable is set: no env exported → LOCAL_LLM_ENABLED
      # stays unset → ai-models marks local/* unavailable → identical to today.
      # local/ is deliberately NEVER promoted by AI_COMPETING_TIERS (CPU
      # inference must never win a live race against a network call) — it
      # always stays in the last-resort block. omniroute/claude-cli are
      # tier-0 BY DEFAULT since 2026-07-29 (see AI_COMPETING_TIERS in
      # scripts/lib/ai-models.mjs) so they no longer share this block with
      # local/ unless AI_COMPETING_TIERS='' is set, in which case the classic
      # omniroute → local → claude-cli order applies (overridable via
      # AI_LAST_RESORT_ORDER).
      - name: Cache local LLM model
        if: vars.ARTICLE_LOCAL_FALLBACK == '1'
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ollama-${{ vars.ARTICLE_LOCAL_MODEL || 'qwen2.5:7b' }}

      - name: Setup local LLM fallback (ollama)
        if: vars.ARTICLE_LOCAL_FALLBACK == '1'
        env:
          LOCAL_MODEL: ${{ vars.ARTICLE_LOCAL_MODEL || 'qwen2.5:7b' }}
        run: |
          set -e
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
            # install.sh auto-detects systemd (present on GH-hosted full-VM
            # ubuntu runners) and starts its OWN "ollama.service" — as a
            # dedicated system user whose home is NOT $HOME — before this
            # script continues. That auto-started server then races the
            # manual "nohup ollama serve" below for port 11434; whichever
            # wins the bind decides where `ollama pull` below writes the
            # model. Root cause of "Cache local LLM model" above almost
            # never producing a cache: when systemd's instance wins the
            # race, the ~9GB model lands outside $HOME, so the cache step's
            # `path: ~/.ollama/models` finds nothing to save at job end
            # ("Path Validation Error: ... do(es) not exist", e.g. run
            # 30375068235, step "Post Cache local LLM model", 2026-07-28
            # 16:10:56Z). It is a race, not a hard failure, which is why
            # `gh cache list` showed zero ollama-* entries historically but
            # one DID appear from run 30381046429 (2026-07-28 17:41:50Z) —
            # confirming both outcomes are live and it's timing, not a
            # structural impossibility. Stopping the auto-started service
            # here removes the race entirely: our own serve call below,
            # running as this job's user, is then the only process that can
            # bind 11434, so the model always lands under $HOME as the
            # cache step already expects. No effect on the model itself or
            # on generation output — same `ollama serve` binary, same
            # model, just guaranteed to be the one process actually
            # listening.
            sudo systemctl stop ollama.service 2>/dev/null || true
          fi
          # Start the server in the background and wait for it to answer.
          # OLLAMA_KEEP_ALIVE keeps the model resident between cascade calls so
          # each fallback attempt pays inference time only, not a reload.
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=30m nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          # Pull the model (no-op if restored from cache).
          ollama pull "$LOCAL_MODEL"
          # Warm the model into RAM so the first real generate call spends its
          # budget on inference, not the one-off model load.
          ollama run "$LOCAL_MODEL" "ok" >/dev/null 2>&1 || true
          # Export so the generate step's ai-models cascade can reach the local
          # model as last resort. ollama exposes an OpenAI-compatible endpoint.
          # LOCAL_LLM_TIMEOUT_MS also sizes undici's headers/body timeout via the
          # local dispatcher — non-streaming CPU inference otherwise dies at
          # undici's 300s default as `fetch failed` before any output.
          # 900000 (15min) was sized for qwen2.5:7b: run 28755532056 showed
          # real successful completions at 9.3min/11.9min, later confirmed
          # faster in practice (6-11min across 60 live runs, 2026-06-30..07-03,
          # local fallback engaged 2/60). Bumped to 1500000 (25min) 2026-07-06
          # for the qwen2.5:14b upgrade (2x params vs 7b — quality fix for
          # fact-check criticals the 7b model was hallucinating, e.g. inventing
          # non-existent institutions): ~2x the 7b range gives an estimated
          # 12-22min per call, so 25min keeps headroom without letting a single
          # stuck call burn past the smallest section wall-budget (30min,
          # svizzera) on its own. Deliberately NOT touching
          # CREATE_ARTICLE_MAX_WALL_MS below to compensate for the larger
          # model — #3102 already tried blowing that budget up for local
          # fallback (300min) and #3307 reverted it: the bigger ceiling
          # silently defeated the deadlineMs cascade-abort safety, letting
          # unrelated stuck free-tier calls walk the entire chain uninterrupted
          # (the real driver of 60-140min runaway runs). The per-run budget
          # stays exactly as validated; if 14b keeps hitting this per-call
          # timeout or the run-level deadline in live runs, revert
          # ARTICLE_LOCAL_MODEL to qwen2.5:7b (repo variable, no code change).
          {
            echo "LOCAL_LLM_ENABLED=1"
            echo "LOCAL_LLM_URL=http://127.0.0.1:11434/v1/chat/completions"
            echo "LOCAL_LLM_MODEL=$LOCAL_MODEL"
            echo "LOCAL_LLM_TIMEOUT_MS=1500000"
          } >> "$GITHUB_ENV"
          echo "🧠 Local LLM fallback ready: $LOCAL_MODEL (last-resort in the cascade)"

      - name: Generate article
        id: generate
        env:
          CREATE_ARTICLE_REPORT_FILE: .tmp/create-article-run-report.json
          TARGET_SECTION: ${{ steps.section.outputs.section }}
          # Diagnostic chain override (empty in normal runs). Lets ops force the
          # local fallback (or any subset) on demand to validate/measure it
          # without waiting for the remote pool to exhaust naturally.
          AI_MODELS_FORCE_CHAIN: ${{ github.event.inputs.force_chain }}
          # Slot routing: ALL slots → proven/news pool (owner request
          # 2026-07-11: "sta pubblicando offerte non articoli" — the product
          # intent is articles regenerated from the news sources). This is the
          # spec § 13.2 rollback lever read by quotaController.decideSlot; it
          # bypasses the discovery/demand pool ("offres fielmann", "stellen
          # lugano" orphan-query pieces) whose 80-99 counter window the
          # Jul 8-10 push outage had frozen the run counter into, making every
          # post-fix publish draw discovery instead of news. To re-enable a
          # discovery share, set the repo variable DISCOVERY_QUOTA_OVERRIDE
          # to a 60-95 quota (e.g. 80 = 20% discovery) or to 'file' to fall
          # back to the tuner-managed data/quota-state.json value.
          DISCOVERY_QUOTA_OVERRIDE: ${{ vars.DISCOVERY_QUOTA_OVERRIDE || '100' }}
          # Section-aware wall-clock budget. The `frontaliere` pipeline is
          # gate-heavier than `svizzera`: it carries the frontaliere-density
          # relevance gate (>=8 keyword hits) on top of the shared fact-check /
          # quality gates, so it needs several full-article attempts per run and
          # each free-tier generation+fact-check pass is slow. The flat 30-min
          # internal budget added 2026-06-16 starved it -- frontaliere fell to
          # 0 articles/day Jun 19-21 while svizzera (no density gate, completes
          # in minutes) kept producing, stalling the /articoli-frontaliere/
          # revenue feed. Job `timeout-minutes` is 360 and runs already tolerate
          # ~35min uncancelled (concurrency `cancel-in-progress: false`), so a
          # 55-min frontaliere budget is safe and well under the hard cap.
          # svizzera keeps the original 30-min cap (it never approaches it).
          #
          # Local-LLM fallback (ARTICLE_LOCAL_FALLBACK=1) previously blew this
          # budget to 300min (18000000) so a slow CPU call could run to
          # completion for measurement (fixed in #3102 via a per-call
          # dispatcher after an earlier false "deferred on wall" reading).
          # That measurement is done: across 60 runs 2026-06-30..07-03, local
          # fallback engaged in only 2/60 runs, ~6-11min per call, both
          # succeeded — well inside the normal 55/30min budget. Meanwhile the
          # 300min override was silently defeating the deadlineMs cascade-
          # abort safety added in #3307 (RUN_START_MS + RUN_WALL_BUDGET_MS
          # never elapsed within a run), letting single generate/translate/
          # fact-check calls walk the entire free-tier chain uninterrupted —
          # the real driver behind 60-140min runs, not the local fallback.
          # Reverting unconditionally to the section-based budget restores
          # the deadlineMs abort and keeps local fallback available (it still
          # fires when reached) without the runaway ceiling.
          CREATE_ARTICLE_MAX_WALL_MS: ${{ steps.section.outputs.section == 'svizzera' && '1800000' || '3300000' }}
          # Auth for the opt-in Claude CLI Haiku fallback (tier-0 by default
          # since 2026-07-29 — see AI_COMPETING_TIERS in ai-models.mjs; see
          # "Setup Claude CLI Haiku fallback" step above). Same secret already
          # used by pr-review-loop.yml/issue-fix.yml — zero marginal cost
          # (Max-plan subscription), never ANTHROPIC_API_KEY. Harmless to
          # always pass: ai-models.mjs only offers the model when this AND the
          # RC flag are both set (isClaudeCliFallbackEnabled/hasClaudeCodeOauthToken).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A free-text URL pasted straight onto a command line was the clearest
          # injection site in this repo (#5032). It arrives through the
          # environment, where it is data, and is quoted at every use.
          ARTICLE_URL: ${{ inputs.url }}
        run: |
          echo "📰 Generating blog article (section=$TARGET_SECTION)..."
          # Out-of-process wall-clock kill. CREATE_ARTICLE_MAX_WALL_MS is an
          # IN-process budget: it only fires if the generator's own event loop
          # is still running its checks. Run 30436268314 showed that assumption
          # break — one model call hung 3h36m with zero output, past both the
          # 90s per-request AbortSignal and the 55min run deadline, until it was
          # cancelled by hand. `timeout` runs outside the process, so it holds
          # even when nothing inside it can. Sized at the section's own budget
          # + 5min grace so the in-process deadline always gets to finish the
          # run gracefully (and publish) first; this only ever fires on a hang.
          # SIGTERM first (Node exits, Post steps still run), SIGKILL 60s later.
          hard_kill_s=$(( CREATE_ARTICLE_MAX_WALL_MS / 1000 + 300 ))
          echo "⏱️  hard kill after ${hard_kill_s}s (in-process budget $(( CREATE_ARTICLE_MAX_WALL_MS / 1000 ))s + 300s grace)"
          set +e
          # CREATE_ARTICLE_HARD_KILL_S carries this SAME hard_kill_s into the node
          # process (#6052): the in-process RUN_WALL_BUDGET_MS used to be declared
          # independently from CREATE_ARTICLE_MAX_WALL_MS alone, with its own unset
          # fallback (30min) that can diverge from what `timeout` above actually
          # enforces (e.g. bash arithmetic on an unset/empty var here yields
          # hard_kill_s=300s while node's independent fallback yields 1800000ms) —
          # a gap deadlineMs then has no way to see. Passing the exact value the
          # shell wrapper computes lets create-article.mjs clamp its own budget to
          # it instead of re-deriving a number that can drift from the real cap.
          if [ -n "$ARTICLE_URL" ]; then
            CREATE_ARTICLE_HARD_KILL_S="$hard_kill_s" timeout --signal=TERM --kill-after=60s "${hard_kill_s}s" node scripts/create-article.mjs --section="$TARGET_SECTION" "$ARTICLE_URL"
          else
            CREATE_ARTICLE_HARD_KILL_S="$hard_kill_s" timeout --signal=TERM --kill-after=60s "${hard_kill_s}s" node scripts/create-article.mjs --section="$TARGET_SECTION"
          fi
          rc=$?
          set -e
          # 124 = timeout fired, 137 = SIGKILL after --kill-after. Both mean the
          # generator hung. Treated as a no-article DEFER, not a failure: the
          # transient-exhaustion path already exits 0 with no changes, and the
          # self-trigger chain must keep advancing (a hard failure here stops
          # article production entirely until someone notices). Loud in the
          # step summary so a recurring hang is never silent.
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "⏱️  HARD TIMEOUT: create-article.mjs killed after ${hard_kill_s}s — deferring to next run (no article this run)"
            {
              echo "## ⏱️ Create-article hard timeout"
              echo ""
              echo "Generation exceeded ${hard_kill_s}s (section \`$TARGET_SECTION\`) and was killed out-of-process."
              echo "No article produced this run; the self-trigger chain continues."
              echo "Check the log for the last \`⏳ [<model>] in-flight\` heartbeat — it names the model that stalled."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

      - name: Create-article final report
        if: always()
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const p = ".tmp/create-article-run-report.json";
            if (!fs.existsSync(p)) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Create-article report\n\nNo report file produced.\n");
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const dup = r.duplicateReasonBreakdown || {};
            const dupLines = Object.keys(dup).length
              ? Object.entries(dup).map(([k,v]) => `- ${k}: ${v}`).join("\n")
              : "- none";
            const preDrops = r.preFilterDrops || {};
            const samples = Array.isArray(r.discardedHeadlineSamples) ? r.discardedHeadlineSamples : [];
            const lines = [
              "## Create-article report",
              "",
              `- status: ${r.status || "unknown"}`,
              `- selected article type: ${r.selectedArticleType || "n/a"}`,
              `- sources scanned: ${r.sources?.scanned ?? 0}/${r.sources?.configured ?? 0} (ok=${r.sources?.succeeded ?? 0}, failed=${r.sources?.failed ?? 0})`,
              `- recent vs undated used: recent=${r.selectionUsage?.attemptsRecent ?? 0}, undated=${r.selectionUsage?.attemptsUndated ?? 0}`,
              "",
              "### Duplicate reason breakdown",
              dupLines,
              "",
              "### Headline pool stats",
              `- total=${r.headlines?.total ?? 0}, recent=${r.headlines?.recent ?? 0}, undated=${r.headlines?.undated ?? 0}`,
              `- usedRecent=${r.headlines?.usedRecent ?? 0}, usedUndated=${r.headlines?.usedUndated ?? 0}`,
              `- droppedPreSpendGate=${r.headlines?.droppedPreSpendGate ?? 0} (frontaliere-relevance classifier)`,
              "",
              "### Fase 1 pre-filter drops (perché la pool news si è svuotata)",
              `- URL gia usata (source gia pubblicata): ${preDrops.urlAlreadyUsed ?? 0}`,
              `- Topic gia coperto (dedup vs corpus): ${preDrops.topicAlreadyCovered ?? 0}`,
              "",
              samples.length
                ? [
                    "| motivo | headline scartata | matcha con | segnale |",
                    "|---|---|---|---|",
                    ...samples.map((s) => {
                      const headline = String(s.headline || "").replace(/\|/g, "\\|").slice(0, 90);
                      const matched = s.existingTitle
                        ? `${String(s.existingTitle).replace(/\|/g, "\\|").slice(0, 90)} (${s.existingId || ""})`
                        : (s.existingId || s.classifierReason || "-");
                      const signal = s.sim != null ? `${s.signal}=${s.sim}` : (s.signal || s.reason || "-");
                      return `| ${s.reason || "-"} | ${headline} | ${matched} | ${signal} |`;
                    }),
                  ].join("\n")
                : "_nessun sample registrato questo run._",
              "",
              "### Report file",
              `- \`${p}\``
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      # ── Learning loop: turn this run's observations into next run's defence ──
      #
      # Every run today is amnesic — a defect at run N does not make the same
      # defect less likely at run N+1, because the gate verdicts die with this
      # job's log. This step folds the run's institution observations into
      # data/article-defect-memory.json, which the NEXT run's gates read.
      # See docs/ARTICLE-LEARNING-LOOP.md.
      #
      # `always()`: a run that FAILED generation still produced evidence — an
      # acronym its sources never backed up is a fact about the generator
      # whether or not that draft shipped. Restricting the signal to published
      # articles would blind the store to exactly the drafts the gates stop.
      #
      # `continue-on-error`: a corrupt or unwritable memory must never hold up
      # a finished article. The script refuses to overwrite a degraded store
      # (exit 1) and that shows red here, but the commit below still runs.
      # Zero model calls — pure string comparison, no quota cost.
      #
      # The same step also appends this run's row to the rejection ledger
      # (data/article-defect-history.jsonl) and renders the 7-day trend into the
      # job summary. One step and not two because both stores are fed by the
      # same run report at the same moment, and a second step would mean a
      # second commit racing the first over the same push. The ledger is a
      # RECORD, not a control input: nothing in the pipeline reads it, which is
      # the property that makes it safe to accumulate automatically at all.
      - name: Update article defect memory
        if: always()
        continue-on-error: true
        run: |
          # `set -e` is on by default here, and the script exits 1 when it
          # refuses to overwrite a degraded store — capture the status so the
          # summary is written either way and the step still reports the failure.
          rc=0
          node scripts/update-article-defect-memory.mjs \
            --from-run .tmp/create-article-run-report.json --trends --apply \
            > .tmp/defect-memory.log 2>&1 || rc=$?
          cat .tmp/defect-memory.log
          {
            echo '## Article defect memory'
            echo ''
            echo '```'
            cat .tmp/defect-memory.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No new article generated (no relevant news or duplicate detected)"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📝 New article files detected:"
            git status --short
          fi

      - name: Run article-critical tests
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run test:articles

      # Encode the 480w WebP thumbnail for the new hero. The committed thumbnails
      # arrive with the checkout (no actions/cache needed — git IS the cache), so
      # the script skips all existing images via the committed-thumbnail fast path
      # and only encodes the freshly-added one. `git add -A` below commits it.
      - name: Generate responsive image thumbnail for new article
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/generate-image-thumbnails.mjs

      # Pre-commit parse gate for services/seo/seo-pages.ts (issue #2834,
      # hotfixed by PR #2833): a prior in-place edit left a missing-comma
      # ItemList array that reached `main` unvalidated and turned the
      # vitest gate RED for every branch. `resolve-append-conflicts.sh`
      # already esbuild-checks conflicted files during rebase, but the
      # common CLEAN commit path (no conflict — the scenario that actually
      # broke main) never ran any syntax check. Run it unconditionally here,
      # BEFORE the commit, so a broken file never gets pushed in the first
      # place.
      #
      # `has_changes` (step "Check for changes", above) can't false-negative
      # this away: it's a blanket `git diff --quiet` over the WHOLE working
      # tree, computed after the "Generate article" step already wrote
      # seo-pages.ts — so has_changes is true on this run whenever
      # seo-pages.ts (or anything else) was modified, and false only when
      # nothing was generated at all (nothing to gate or commit either way).
      - name: Validate seo-pages.ts syntax (pre-commit parse gate)
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/ci/check-seo-pages-syntax.mjs

      # Do not run `npm run build:prod` here. This workflow commits generated
      # article source and dispatches deploy.yml, which already assembles the
      # jobs dataset and performs the full Vite/GitHub Pages build. Running the
      # same production build inside article generation duplicates 20+ minutes
      # of CPU work and has caused runner shutdowns before the article can be
      # committed (run 26324239287, 2026-05-23).

      - name: Commit and push
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        # Pass step outputs via env: rather than inline `${{ }}` interpolation
        # so they survive bash quoting safely. Article titles can contain
        # double quotes ('No a una LAMal "low cost"') which break inline
        # substitution: the literal `"` closes the bash assignment and
        # subsequent tokens are interpreted as commands. With env: GitHub
        # injects the value as a real env var, accessed via "$VAR".
        env:
          ARTICLE_TITLE: ${{ steps.generate.outputs.article_title }}
          AUTHOR_SLUG: ${{ steps.generate.outputs.author_slug }}
          AUTHOR_NAME: ${{ steps.generate.outputs.author_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Source the centralized append-only conflict resolver. Article
          # generation only APPENDS entries to structured files (BlogArticles.tsx,
          # router.ts, routerBlogData.ts, blog-articles-data.ts, sitemaps,
          # article-source-urls.json). When both sides add entries at the same
          # insertion point, git marks it as a conflict but both additions are
          # valid; the function strips conflict markers and keeps both sides,
          # then dedupes single-declaration conflicts in router.ts.
          source scripts/lib/resolve-append-conflicts.sh

          # ── Sync with remote BEFORE committing ──
          git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "⚠️  Remote has new commits since checkout — rebasing before commit..."
            git stash --include-untracked
            if ! git rebase origin/main; then
              git rebase --abort
              git stash pop 2>/dev/null || git stash drop
              echo "⚠️  Rebase conflict — deferring article to next scheduled run"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git stash pop; then
              echo "⚠️  Stash pop had conflicts — attempting auto-resolution..."
              if ! resolve_append_conflicts; then
                echo "❌ Auto-resolution failed — deferring article to next run"
                git checkout -- . 2>/dev/null || true
                git clean -fd 2>/dev/null || true
                git stash drop 2>/dev/null || true
                echo "committed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Drop the stash reference since we've resolved the conflicts
              git stash drop 2>/dev/null || true
            fi
          fi

          git add -A
          # A2: descriptive commit message with article title + Reviewed-by
          # trailer pointing to the assigned author from the registry.
          # Falls back to the generic message when the create-article step
          # didn't emit byline outputs (older runs / generation failure).
          # ARTICLE_TITLE / AUTHOR_SLUG / AUTHOR_NAME come from env: above.
          if [ -n "$ARTICLE_TITLE" ]; then
            COMMIT_SUBJECT="feat(article): ${ARTICLE_TITLE}"
            if [ -n "$AUTHOR_SLUG" ] && [ -n "$AUTHOR_NAME" ]; then
              git commit -m "$COMMIT_SUBJECT" -m "Reviewed-by: ${AUTHOR_NAME} <${AUTHOR_SLUG}@frontaliereticino.ch>"
            elif [ -n "$AUTHOR_SLUG" ]; then
              git commit -m "$COMMIT_SUBJECT" -m "Reviewed-by: ${AUTHOR_SLUG}"
            else
              git commit -m "$COMMIT_SUBJECT"
            fi
          else
            # No article published this run (evergreen pool exhausted /
            # wall-budget hit) but tracker state still changed — e.g. the
            # evergreen-rejected cross-run memory (#3138). The old generic
            # "Auto-generated blog article" message would misleadingly label
            # a state-only commit as an article publish.
            CHANGED_PATHS="$(git diff --cached --name-only)"
            if ! echo "$CHANGED_PATHS" | grep -qE '^data/(blog|swiss)-articles-data\.ts$'; then
              git commit -m "chore(article-gen): update run-state tracker (nessun articolo questo run)"
            else
              git commit -m "📰 Auto-generated blog article"
            fi
          fi

          # Push with centralized rebase-retry helper. The append-only files
          # the article generator touches can conflict with concurrent main
          # writers; --in-place-resolver-cmd keeps the local commit and runs
          # resolve_append_conflicts inside the rebase, then `rebase --continue`.
          # No --max-attempts override: inherit the helper's default (5), same
          # as every other caller. This step used to hardcode 3 — the weakest
          # budget of any of the 16 callers of this helper — despite being the
          # LATEST-in-job push against `main` (after a 15-30min LLM step during
          # which crawler workflows keep landing commits every 15-40s). Run
          # 28757866877 hit exactly this: a fully-generated svizzera article
          # exhausted 3 attempts and was discarded ("Article is LOST"),
          # forcing a full from-scratch regeneration on the next self-trigger.
          if bash scripts/lib/git-push-with-retry.sh \
            --in-place-resolver-cmd "source scripts/lib/resolve-append-conflicts.sh && resolve_append_conflicts && git add -A"; then
            echo "✅ Article committed and pushed to main"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️  Push helper failed — deferring article to next run"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Verify article exists in committed source
        if: steps.commit.outputs.committed == 'true' && steps.generate.outputs.article_id != ''
        id: verify_article
        run: |
          ARTICLE_ID="${{ steps.generate.outputs.article_id }}"
          SECTION="${{ steps.generate.outputs.section }}"
          echo "🔍 Verifying article: $ARTICLE_ID (section=${SECTION:-frontaliere})"

          # Check 1: Article ID exists in the SECTION's registry. Frontaliere
          # writes data/blog-articles-data.ts; svizzera writes
          # data/swiss-articles-data.ts (anything not 'svizzera' → frontaliere).
          if [ "$SECTION" = "svizzera" ]; then
            REGISTRY="data/swiss-articles-data.ts"
          else
            REGISTRY="data/blog-articles-data.ts"
          fi
          if ! grep -q "$ARTICLE_ID" "$REGISTRY"; then
            echo "❌ Article '$ARTICLE_ID' NOT found in $REGISTRY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "  ✅ Found in $REGISTRY"

          echo "✅ Source checks passed for '$ARTICLE_ID'"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      # Trigger deploy.yml (GITHUB_TOKEN pushes don't trigger other workflows)
      # Uses env: block to safely pass values containing quotes/special chars
      - name: Trigger deploy workflow
        id: trigger_deploy
        if: steps.commit.outputs.committed == 'true' && steps.verify_article.outputs.exists == 'true'
        env:
          DEPLOY_ARTICLE_ID: ${{ steps.generate.outputs.article_id }}
          DEPLOY_ARTICLE_URL: ${{ steps.generate.outputs.article_url }}
          DEPLOY_ARTICLE_OG_TITLE: ${{ steps.generate.outputs.og_title }}
          DEPLOY_ARTICLE_OG_DESCRIPTION: ${{ steps.generate.outputs.og_description }}
          DEPLOY_ARTICLE_OG_IMAGE: ${{ steps.generate.outputs.og_image }}
          DEPLOY_ARTICLE_CATEGORY: ${{ steps.generate.outputs.category }}
        # Hard-fail by design (no `|| true`, #6936): a failed dispatch here
        # fails the job, caught by "Report failure to GitHub Issues" below —
        # that GitHub issue IS this caller's recovery net (auto-triage picks
        # it up), so silencing the failure would just hide a real deploy gap.
        run: |
          EXPECTED_SHA="$(git rev-parse HEAD)" \
          bash scripts/lib/trigger-deploy.sh

      # ── Trigger fast-publish workflow (issue #4837 stream C) ───────────
      # Fire-and-forget dispatch of fast-publish-article.yml: it renders +
      # pushes ONLY this article's own locale shards (skipping the full
      # site build) and pings Google Indexing API itself once it has
      # VERIFIED the 4 URLs are actually live — see that workflow for the
      # ordering rationale. This does not replace "Trigger deploy workflow"
      # above: the full deploy.yml/deploy-publish.yml chain still runs and
      # remains the source of truth for sitemap/RSS/search-index
      # regeneration; fast-publish is an additive, best-effort fast path.
      # Best-effort: `|| true` because a missed fast-publish still means the
      # article goes live via the normal (slower) deploy chain.
      - name: Trigger fast-publish workflow
        id: trigger_fast_publish
        if: steps.commit.outputs.committed == 'true' && steps.verify_article.outputs.exists == 'true'
        env:
          FAST_PUBLISH_ARTICLE_ID: ${{ steps.generate.outputs.article_id }}
          FAST_PUBLISH_SECTION: ${{ steps.generate.outputs.section }}
        run: |
          FAST_PUBLISH_SHA="$(git rev-parse HEAD)"
          INPUTS_JSON="$(
            FAST_PUBLISH_ARTICLE_ID_JSON="$FAST_PUBLISH_ARTICLE_ID" \
            FAST_PUBLISH_SECTION_JSON="$FAST_PUBLISH_SECTION" \
            FAST_PUBLISH_SHA_JSON="$FAST_PUBLISH_SHA" \
            node -e '
              const section = process.env.FAST_PUBLISH_SECTION_JSON === "svizzera" ? "svizzera" : "frontaliere";
              process.stdout.write(JSON.stringify({
                article_id: process.env.FAST_PUBLISH_ARTICLE_ID_JSON || "",
                section,
                sha: process.env.FAST_PUBLISH_SHA_JSON || "",
              }));
            '
          )"
          TRIGGER_REF="main" \
          TRIGGER_EXPECTED_SHA="$FAST_PUBLISH_SHA" \
          bash scripts/lib/trigger-workflow.sh "fast-publish-article.yml" "$INPUTS_JSON" \
          || true

      # ── Corpus mirror: REMOVED AT CUTOVER (issue #4974 item 3, §5.7) ──
      #
      # This step used to dispatch mirror-articles-corpus.yml after every commit,
      # back when this repo was the only writer and the articles repo was a
      # read-only copy. That direction is now reversed: nanako GENERATES
      # articles, and `scripts/pull-articles-corpus.mjs` (run by
      # sync-articles-sitemaps.yml) pulls its `content/` back into
      # `packages/articles/content/`.
      #
      # The mirror does `rm -rf content && cp -R packages/articles/content`.
      # Dispatching it from here would therefore DELETE every article generated
      # in nanako since this repo last pulled — silently, and reported as a
      # successful mirror. The workflow's own `on:` block was disabled at
      # cutover for exactly this reason; this dispatch was the one path that
      # could still fire it, and it survived because nothing tested for it.
      #
      # Left as a comment rather than deleted so the next reader finds the
      # reason instead of re-adding it. The invariant is pinned by
      # tests/workflows/articles-mirror-trigger.test.ts.

      # ── Notify Google Indexing API ─────────────────────────────────────
      # REMOVED (issue #4837 stream C): this step used to ping Google right
      # after dispatching deploy.yml on the assumption "deploy takes ~2-3
      # min" — false; the worst measured full deploy was 2h04m37s (see
      # scripts/notify-journalist-article-live.mjs's ORPHAN_THRESHOLD_MS
      # comment), so Google was routinely sent to crawl a 404. The ping is
      # now owned by "Trigger fast-publish workflow" above, which only fires
      # it AFTER fast-publish-article.yml has verified the 4 locale URLs are
      # actually live. If fast-publish itself doesn't run/succeed, the full
      # deploy chain's post-deploy-publish.yml "Post-deploy indexing
      # (parallel)" step still submits every URL via
      # scripts/submit-google-indexing.js as an unconditional safety net —
      # no article is left permanently unpinged.

      # ── Final disposition report ──────────────────────────────────────
      # This step runs ALWAYS to give a clear summary of what happened
      # to the generated article (committed? verified? submitted?).
      - name: Article final disposition
        if: always() && steps.generate.outputs.article_id != ''
        run: |
          ARTICLE_ID="${{ steps.generate.outputs.article_id }}"
          ARTICLE_URL="${{ steps.generate.outputs.article_url }}"
          SOURCE_URL="${{ steps.generate.outputs.source_url }}"
          HAS_CHANGES="${{ steps.changes.outputs.has_changes }}"
          COMMITTED="${{ steps.commit.outputs.committed }}"
          VERIFIED="${{ steps.verify_article.outputs.exists }}"
          DEPLOY_DISPATCHED="${{ steps.trigger_deploy.outputs.dispatch_sent }}"
          FAST_PUBLISH_DISPATCHED="${{ steps.trigger_fast_publish.outputs.dispatch_sent }}"

          # Determine final status
          if [ "$VERIFIED" == "true" ] && [ "$DEPLOY_DISPATCHED" == "true" ]; then
            STATUS="✅ Committed, verified in source, deploy triggered"
            ICON="🟢"
          elif [ "$VERIFIED" == "true" ] && [ "$DEPLOY_DISPATCHED" != "true" ]; then
            STATUS="⚠️ Committed and verified in source, but deploy dispatch was not confirmed"
            ICON="🟠"
          elif [ "$COMMITTED" == "true" ] && [ "$VERIFIED" != "true" ]; then
            STATUS="⚠️ Committed but verification FAILED — article may be broken"
            ICON="🟠"
          elif [ "$COMMITTED" == "false" ]; then
            STATUS="❌ DEFERRED — commit/push failed (rebase conflict or push race). Article is LOST."
            ICON="🔴"
          elif [ "$HAS_CHANGES" == "true" ]; then
            STATUS="❌ BLOCKED — tests failed before commit. Article is LOST."
            ICON="🔴"
          elif [ "$HAS_CHANGES" == "false" ]; then
            STATUS="ℹ️ No changes detected (article generation produced no file changes)"
            ICON="⚪"
          else
            STATUS="❓ Unknown — generate step may have failed"
            ICON="⚪"
          fi

          echo ""
          echo "$ICON FINAL DISPOSITION: $STATUS"
          echo "   Article: $ARTICLE_ID"
          echo "   URL: $ARTICLE_URL"
          echo "   Source: $SOURCE_URL"
          echo "   committed=$COMMITTED  verified=$VERIFIED  deploy_dispatched=$DEPLOY_DISPATCHED  fast_publish_dispatched=$FAST_PUBLISH_DISPATCHED  has_changes=$HAS_CHANGES"
          echo ""

          # Append to step summary for clear visibility
          {
            echo "## $ICON Article Final Disposition"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Article | \`$ARTICLE_ID\` |"
            echo "| URL | $ARTICLE_URL |"
            echo "| Source | $SOURCE_URL |"
            echo "| Status | **$STATUS** |"
            echo "| Changes detected | $HAS_CHANGES |"
            echo "| Committed to main | $COMMITTED |"
            echo "| Verified in source | $VERIFIED |"
            echo "| Deploy dispatched | $DEPLOY_DISPATCHED |"
            echo "| Fast-publish dispatched | $FAST_PUBLISH_DISPATCHED |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Emit warning annotation for lost articles (visible in PR / Actions UI)
          if [ "$ICON" == "🔴" ]; then
            echo ""
            echo "::warning::Article '$ARTICLE_ID' was generated but LOST — $STATUS"
            if [ -n "$SOURCE_URL" ]; then
              echo ""
              echo "🔁 To retry this article, trigger a manual workflow_dispatch with URL:"
              echo "   $SOURCE_URL"
              {
                echo ""
                echo "> **🔁 Retry**: trigger \`workflow_dispatch\` with URL: \`$SOURCE_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # ── Self-trigger chain ────────────────────────────────────────────
      # GitHub Actions silently skips ~66% of cron slots (measured 34%
      # utilization on this 30-min cron). At end of every run we dispatch
      # the next via workflow_dispatch + PAT to bypass cron unreliability.
      # The concurrency group `article-generation` already prevents overlap.
      # The cron schedule remains as a fallback safety net.
      - name: Determine self-trigger decision
        id: decide_trigger
        if: always()
        env:
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          VERIFIED: ${{ steps.verify_article.outputs.exists }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          # Retry counter passed via workflow_dispatch input (default 0 for cron-triggered runs)
          RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
          NO_CHANGES_STREAK: ${{ github.event.inputs.no_changes_streak || '0' }}
          # Section this run generated — the chain alternates it for the next run.
          CUR_SECTION: ${{ steps.section.outputs.section }}
          # Source URL of the article this run generated (empty for evergreen /
          # no-generation runs). Used to retry the SAME article by URL when a
          # fully-generated article is lost to a commit/push race, instead of
          # discarding the work and rescanning from scratch next run.
          SOURCE_URL: ${{ steps.generate.outputs.source_url }}
        run: |
          # Outcome decision tree:
          # ✅ verified=true → self-trigger immediately, retry_count=0, streak=0
          # ⚪ has_changes=false (no source / all duplicates) → self-trigger after flat 60s, no cap
          # 🟠 committed=false (rebase/push race) → self-trigger after 60s, retrying the
          #    same article by source URL (max 3 URL retries, then plain rescan)
          # 🟠 verified=false (committed but missing from source) → RETRY with backoff
          # 🔴 generate step failure → RETRY with backoff
          # Backoff schedule (failures): 60s → 300s → 1800s, max 3 retries
          # no_changes streak: flat 60s every time, uncapped — never yields to cron
          # (2026-07-17: removed the 0/600/1800s tiers + streak>=10 cron handoff so
          # the chain keeps generating content instead of going quiet for up to 30min
          # on the unreliable cron — see docs/AGENTS-HISTORY.md#generate-article-no-changes-backoff-removed)

          SHOULD_TRIGGER="false"
          DELAY="0"
          REASON="unknown"
          NEXT_RETRY="0"
          NEXT_STREAK="0"
          NEXT_URL=""

          # Section alternation: flip to the sibling section on "advance" paths
          # (success, no-changes) so both sections grow at the same cadence; KEEP
          # the same section on retry/rebase so a failed article retries in its
          # own context. Default frontaliere when unknown (fail-safe).
          CUR_SECTION="${CUR_SECTION:-frontaliere}"
          if [ "$CUR_SECTION" = "svizzera" ]; then OTHER_SECTION="frontaliere"; else OTHER_SECTION="svizzera"; fi
          NEXT_SECTION="$CUR_SECTION"

          if [ "$VERIFIED" = "true" ]; then
            SHOULD_TRIGGER="true"
            DELAY="0"
            REASON="success"
            NEXT_RETRY="0"
            NEXT_STREAK="0"
            NEXT_SECTION="$OTHER_SECTION"
          elif [ "$HAS_CHANGES" = "false" ]; then
            # Flat 60s, uncapped — a dry discovery pool is not an error, so keep
            # self-triggering indefinitely instead of yielding to the unreliable
            # 30-min cron. See docs/AGENTS-HISTORY.md#generate-article-no-changes-backoff-removed
            CUR_STREAK="${NO_CHANGES_STREAK:-0}"
            NEXT_STREAK=$((CUR_STREAK + 1))
            SHOULD_TRIGGER="true"
            DELAY="60"
            REASON="no_changes_streak_${NEXT_STREAK}_backoff_60s"
            # No source/all-duplicates for this section → try the other one next.
            NEXT_SECTION="$OTHER_SECTION"
            NEXT_RETRY="0"
          elif [ "$COMMITTED" = "false" ] && [ "$HAS_CHANGES" = "true" ]; then
            # A fully-generated article lost to a commit/push race. When we
            # know its source URL, retry the SAME article by URL (bounded by
            # retry_count so a poison URL can't loop forever); the ledger
            # commit was lost with the push, so the duplicate check will not
            # block the regeneration. Keep the same section for the retry.
            SHOULD_TRIGGER="true"
            DELAY="60"
            NEXT_STREAK="0"
            CUR_RETRY="${RETRY_COUNT:-0}"
            if [ -n "$SOURCE_URL" ] && [ "$CUR_RETRY" -lt 3 ]; then
              NEXT_RETRY=$((CUR_RETRY + 1))
              NEXT_URL="$SOURCE_URL"
              REASON="rebase_failed_retry_url_${NEXT_RETRY}_of_3"
            else
              REASON="rebase_failed"
              NEXT_RETRY="0"
            fi
          else
            # Failure path: verify_failed OR generate_failed
            CUR_RETRY="${RETRY_COUNT:-0}"
            if [ "$CUR_RETRY" -lt 3 ]; then
              NEXT_RETRY=$((CUR_RETRY + 1))
              case "$NEXT_RETRY" in
                1) DELAY=60 ;;
                2) DELAY=300 ;;
                3) DELAY=1800 ;;
              esac
              SHOULD_TRIGGER="true"
              REASON="retry_${NEXT_RETRY}_of_3"
            else
              SHOULD_TRIGGER="false"
              REASON="retry_exhausted"
            fi
            NEXT_STREAK="0"
          fi

          {
            echo "should_trigger=$SHOULD_TRIGGER"
            echo "delay=$DELAY"
            echo "reason=$REASON"
            echo "next_retry=$NEXT_RETRY"
            echo "next_streak=$NEXT_STREAK"
            echo "next_section=$NEXT_SECTION"
            echo "next_url=$NEXT_URL"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🔁 Self-trigger decision"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Should trigger | \`$SHOULD_TRIGGER\` |"
            echo "| Reason | \`$REASON\` |"
            echo "| Delay (s) | \`$DELAY\` |"
            echo "| Retry count (next) | \`$NEXT_RETRY\` |"
            echo "| no_changes streak (next) | \`$NEXT_STREAK\` |"
            echo "| Section (this → next) | \`$CUR_SECTION\` → \`$NEXT_SECTION\` |"
            echo "| Retry URL (next) | \`${NEXT_URL:-—}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Re-mint immediately before the late dispatch below: the frontaliere
      # generation budget alone allows up to 55min, and observed runs on this
      # workflow have taken up to ~62min end-to-end — long enough to outlive
      # the App installation token's ~1hr TTL from the early mint (near the
      # top of this job). The `env.APP_TOKEN || env.GITHUB_PAT` fallback below
      # only covers unset/empty — an expired-but-non-empty APP_TOKEN
      # short-circuits the `||` and 401s the self-trigger dispatch, silently
      # breaking the self-trigger chain (same class of bug as #3320). Re-minting
      # fresh here restores full TTL headroom.
      - name: Re-mint App token (fresh, avoids TTL expiry after long generation)
        if: steps.decide_trigger.outputs.should_trigger == 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Note (#5289): this dispatch CANNOT carry `confirm_corpus_write`.
      # trigger-self.sh builds its payload from a fixed shape — retry_count,
      # no_changes_streak, section, url — so a chain started by hand runs
      # exactly once more and then stops at the guard above. That is the
      # intended shape: one authorized run is one article, not a producer.
      # If you ever add a passthrough here, you have re-created the two-writer
      # state that cost five orphaned articles and a repo-wide merge block.
      - name: Self-trigger next run
        if: steps.decide_trigger.outputs.should_trigger == 'true'
        continue-on-error: true
        env:
          # trigger-self.sh resolves TOKEN="${GITHUB_PAT:-${GH_TOKEN:-}}" — override
          # with the App token when minted (primary identity), PAT otherwise (#2861
          # item 1). GITHUB_PAT itself is loaded into $GITHUB_ENV by `Load secrets
          # from Remote Config` (Firebase RC, not an Actions secret). Do NOT shadow
          # it with secrets.GITHUB_PAT — that resolves to empty and bricks the chain.
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          WORKFLOW_FILE: generate-article.yml
          DELAY_SECONDS: ${{ steps.decide_trigger.outputs.delay }}
          SELF_TRIGGER_REASON: ${{ steps.decide_trigger.outputs.reason }}
          RETRY_COUNT: ${{ steps.decide_trigger.outputs.next_retry }}
          NO_CHANGES_STREAK: ${{ steps.decide_trigger.outputs.next_streak }}
          SECTION: ${{ steps.decide_trigger.outputs.next_section }}
          URL: ${{ steps.decide_trigger.outputs.next_url }}
        run: bash scripts/lib/trigger-self.sh

      # Reporter diagnostico (#5437). Questo workflow ha decine di step (LLM,
      # immagini, SEO, commit, self-trigger): sapere QUALE è morto, con quale
      # comando, è la differenza fra una diagnosi e uno scaricamento di log.
      # CHI CHIUDE: close-recovered-failure-issues.mjs sul primo run verde
      # successivo — il titolo `Workflow Failure: <name:>` è il suo pattern, e
      # `name:` combacia, quindi `gh run list -w` risolve il run.
      - name: Report failure to GitHub Issues
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: 'Workflow Failure: ${{ github.workflow }}'
          closed-by: close-recovered-failure-issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          priority: '2'
          labels: Bug
