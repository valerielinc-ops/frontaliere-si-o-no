name: Send Job Alert Emails

on:
  schedule:
    # Daily 00:33 UTC. Issue #3798 Fase 1 — KEPT, but the earlier rationale for
    # this slot was measured on the wrong metric and is corrected here.
    #
    # Re-audited 2026-08-05 (30 days of scheduled runs across all 100+ crontabbed
    # workflows in this repo, delay = run.created_at - nominal cron minute):
    #
    #  * The account-wide concurrency pool is NOT the constraint any more. Job
    #    queue wait (job.started_at - job.created_at) is a median of 2s and a
    #    p90 of 8-9s for every run created between 00:00 and 06:00 UTC (n=414
    #    jobs sampled over 7 days). The ~20-job free-tier ceiling that drove
    #    incident #2882 stopped biting when the 581 per-crawler workflows were
    #    consolidated into 23 groups (docs/CI-CD-PIPELINE.md). Picking a slot to
    #    dodge our own concurrent jobs optimises something that no longer costs
    #    anything.
    #  * What actually costs hours is GitHub's own scheduled-DISPATCH backlog,
    #    which never appears in a "runs created per hour" histogram because that
    #    histogram counts runs at the delayed time, not the nominal one. Median
    #    delay by nominal cron hour: 00h 240m, 02h 199m, 03h 159m, 05h 147m,
    #    10h 109m, 15h 65m, 21h 62m, 22h 51m. Confirmed WITHIN a single
    #    workflow, which rules out any per-workflow confound:
    #    orchestrate-crawlers.yml runs at both 09:00 (median 133m) and 21:00
    #    (median 62m) — same workflow, same repo, 2.1x apart.
    #  * So the 00:00-04:00 band is the WORST band of the day for dispatch, not
    #    a "quiet window". It only LOOKS quiet in a created-at histogram
    #    (00h-02h show 11-22 runs/h vs 68-75 at 10h-11h) because the night's own
    #    scheduled work is being deferred into the morning. Delay is in fact
    #    ANTI-correlated with our own run volume: 22h is the 5th busiest hour
    #    and has the LOWEST delay.
    #
    # Why 00:33 stays anyway, despite being the worst-drifting slot measured
    # (median 240m, p90 471m, max 590m): moving to the low-drift 15:00-22:00
    # band would fire this workflow in the afternoon, and
    # scripts/lib/send-schedule.mjs computeScheduledSendAt schedules each
    # subscriber for the NEXT occurrence of their preferred hour. The later in
    # the UTC day the run fires, the more subscribers have already passed their
    # hour and get pushed to tomorrow's slot — receiving ~24h-old job matches.
    # Firing early is worth more than firing punctually. 00:33 + 240m median
    # lands ~04:33 UTC, the earliest effective start of any sampled slot, and
    # even the p90 (~08:24) stays clear of the morning crawler batch (dispatched
    # ~11:20).
    #
    # The one candidate that could beat it is the 23:00 slot, which the audit
    # could not evaluate because no workflow is scheduled there. That gap is now
    # being filled automatically: cron-dispatch-canary.yml samples 23:17 and
    # 00:33 on the same night (paired, so GitHub's day-to-day backlog swings
    # cancel) into data/cron-dispatch-history.jsonl. Standing verdict:
    #   node scripts/ci/audit-cron-dispatch-delay.mjs
    # Pre-committed rule: at >=14 paired nights, if 23:17 has the earlier median
    # EFFECTIVE START, move this cron there — nothing else about this workflow
    # changes. Do not move it on the delay figure alone; see the canary's
    # docblock for why early beats punctual.
    #
    # Note the minute is NOT load-bearing: the ":00/:15/:30/:45 get
    # deprioritised" folklore does not hold here. Median delay is 150m at :00,
    # 149m at :15/:30/:45 and 158m at off-minutes (n=1462) — off-minutes are if
    # anything marginally worse.
    #
    # The previously-claimed "full 3h gap before send-newsletter at 03:33" does
    # not exist in practice and is not needed: effective start is ~04:33 here vs
    # ~06:13 for the newsletter (a ~1h40m gap), and on p90 days this one starts
    # AFTER the newsletter. The two workflows have no data dependency and
    # separate `concurrency` groups, so the ordering is not required.
    - cron: '33 0 * * *'
    # SECONDO SLOT — 12:07 UTC. Aggiunto il 2026-08-14 su decisione del
    # proprietario, ora che il soffitto di cadenza e' tolto e la tabella
    # [1, 3, 7] e' di nuovo in vigore: chi clicca ha diritto a un invio al
    # giorno, e un solo giro che parte in media alle 04:33 lascia indietro
    # tutti quelli la cui ora preferita cade dopo.
    #
    # IL VINCOLO CHE DECIDE L'ORA, e viene prima di ogni considerazione sul
    # ritardo: la guardia anti-doppione e' una funzione pura del GIORNO UTC —
    # un avviso servito oggi non e' piu' dovuto oggi. Se lo slittamento di
    # dispatch spinge un giro oltre la mezzanotte, i due giri cadono in due
    # giorni UTC DIVERSI e il gate li vede come due invii legittimi. Con lo
    # slittamento massimo misurato qui sotto (590m), il nominale deve quindi
    # stare sotto le ~14:10.
    #
    # Le 15:07 erano la prima scelta, per il ritardo basso, e sono state
    # scartate proprio per questo: 15:07 + 590m = 00:57 del giorno dopo.
    #
    # Fra le ore ammesse dal vincolo si sceglie col ritardo misurato (00h 240m,
    # 02h 199m, 03h 159m, 05h 147m, 10h 109m, 15h 65m, 21h 62m, 22h 51m): le
    # 12h stanno nella parte bassa della banda ammessa, e 12:07 + 590m = 21:57
    # resta nello stesso giorno anche nel caso peggiore. Le ore a ritardo
    # minore (15h, 21h, 22h) violano tutte il vincolo, e partirebbero comunque
    # troppo tardi per computeScheduledSendAt, che schedula ogni iscritto alla
    # PROSSIMA occorrenza della sua ora preferita: piu' tardi parte il giro,
    # piu' gente ha gia' passato la propria ora e slitta a domani.
    #
    # Il minuto :07 vale solo a non impilarsi sugli altri cron: lo stesso audit
    # dice che il minuto NON e' load-bearing (150m a :00, 149m a :15/:30/:45,
    # 158m fuori).
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Limit send to a single email (test mode). Empty = send to all active alerts.'
        required: false
        default: ''
        type: string

concurrency:
  group: job-alerts
  # CANCEL-IN-PROGRESS: FALSE dal 2026-08-14, ed e' la meta' che rende sicuro il
  # secondo slot. Con `true`, un secondo giro che parte mentre il primo sta
  # ancora spedendo lo CANCELLA a meta': i destinatari gia' serviti hanno il
  # timbro, quelli non ancora serviti restano scoperti fino al giorno dopo, e
  # nessuno se ne accorge, perche' un run cancellato non e' un fallimento.
  # I due cron distano ~15h nominali, ma il ritardo di dispatch misurato qui
  # sopra arriva a 590m: la sovrapposizione non e' teorica. Con `false` il
  # secondo giro aspetta, e quando parte trova gia' scritto lo stato del primo
  # — che e' esattamente cio' su cui si regge la protezione dal doppio invio.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write     # for github-issue-creator on failure

jobs:
  send-alerts:
    # GATE DEL SECONDO SLOT. Il giro delle 15:07 spedisce solo se la
    # repo-variable JOB_ALERT_SECOND_SLOT_ARMED vale 'true'; il giro delle 00:33
    # e il dispatch manuale non sono mai gated.
    #
    # Serve perche' due slot senza la protezione anti-doppione nella LOGICA
    # sono un doppio invio, e quella protezione non puo' stare nella spaziatura
    # dei cron: su questo repo slittano fino a 590 minuti. Finche' la variabile
    # non e' armata, questo workflow si comporta esattamente come prima.
    #
    # Da armare solo dopo che e' su main la logica che tratta un avviso gia'
    # spedito — o gia' PROGRAMMATO e non ancora partito — come non piu' dovuto.
    if: github.event.schedule != '7 12 * * *' || vars.JOB_ALERT_SECOND_SLOT_ARMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Assemble jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Send job alert emails
        continue-on-error: true
        id: send-alerts
        env:
          ENABLE_JOB_ALERTS: 'true'
          TARGET_EMAIL: ${{ inputs.target_email }}
          # Bypass newsletter cooldown when targeting a single test recipient
          SKIP_NEWSLETTER_COOLDOWN: ${{ inputs.target_email != '' && '1' || '' }}
        run: node scripts/send-job-alerts.mjs

      - name: Report failure to GitHub Issues
        if: steps.send-alerts.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Job Alerts invio fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
