name: Send Job Alert Emails

# Cloud Scheduler owns the primary slot and names its run so retries can find
# the already accepted dispatch. GitHub's native midnight cron was created 6-10
# hours late (30-day median 394 min, p90 492; last week 490-580 min), which
# moved the morning emails into mid-morning. The fixed primary clock is 05:00
# UTC. Do not add the old cron back: it would create a second daily run while
# the Firestore anti-duplicate guard is keyed by UTC day. The native 12:07 UTC
# slot below is the same-day safety net if Cloud Scheduler fails.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'cloud-scheduler' && inputs.dry_run != true && inputs.dry_run != 'true' && format('Send Job Alert Emails [cloud-scheduler {0}]', inputs.scheduled_slot) || 'Send Job Alert Emails' }}

on:
  schedule:
    # SECONDO SLOT — 12:07 UTC. Aggiunto il 2026-08-14 su decisione del
    # proprietario, ora che il soffitto di cadenza e' tolto e la tabella
    # [1, 3, 7] e' di nuovo in vigore: chi clicca ha diritto a un invio al
    # giorno, e un solo giro che parte alle 05:00 lascia indietro
    # tutti quelli la cui ora preferita cade dopo.
    #
    # IL VINCOLO CHE DECIDE L'ORA, e viene prima di ogni considerazione sul
    # ritardo: la guardia anti-doppione e' una funzione pura del GIORNO UTC —
    # un avviso servito oggi non e' piu' dovuto oggi. Se lo slittamento di
    # dispatch spinge un giro oltre la mezzanotte, i due giri cadono in due
    # giorni UTC DIVERSI e il gate li vede come due invii legittimi. Con lo
    # slittamento massimo misurato qui sotto (590m), il nominale deve quindi
    # stare sotto le ~14:10.
    #
    # Le 15:07 erano la prima scelta, per il ritardo basso, e sono state
    # scartate proprio per questo: 15:07 + 590m = 00:57 del giorno dopo.
    #
    # Fra le ore ammesse dal vincolo si sceglie col ritardo misurato (00h 240m,
    # 02h 199m, 03h 159m, 05h 147m, 10h 109m, 15h 65m, 21h 62m, 22h 51m): le
    # 12h stanno nella parte bassa della banda ammessa, e 12:07 + 590m = 21:57
    # resta nello stesso giorno anche nel caso peggiore. Le ore a ritardo
    # minore (15h, 21h, 22h) violano tutte il vincolo, e partirebbero comunque
    # troppo tardi per computeScheduledSendAt, che schedula ogni iscritto alla
    # PROSSIMA occorrenza della sua ora preferita: piu' tardi parte il giro,
    # piu' gente ha gia' passato la propria ora e slitta a domani.
    #
    # Il minuto :07 vale solo a non impilarsi sugli altri cron: lo stesso audit
    # dice che il minuto NON e' load-bearing (150m a :00, 149m a :15/:30/:45,
    # 158m fuori).
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Limit send to a single email (test mode). Empty = send to all active alerts.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build the alerts but do not send.'
        required: false
        default: true
        type: boolean
      trigger_source:
        description: 'Who dispatched the primary slot (Cloud Scheduler sends cloud-scheduler; leave manual)'
        required: false
        default: 'manual'
        type: string
      scheduled_slot:
        description: 'Nominal UTC slot (ISO) of a Cloud Scheduler dispatch; empty for a manual one'
        required: false
        default: ''
        type: string
concurrency:
  group: job-alerts
  # CANCEL-IN-PROGRESS: FALSE dal 2026-08-14, ed e' la meta' che rende sicuro il
  # secondo slot. Con `true`, un secondo giro che parte mentre il primo sta
  # ancora spedendo lo CANCELLA a meta': i destinatari gia' serviti hanno il
  # timbro, quelli non ancora serviti restano scoperti fino al giorno dopo, e
  # nessuno se ne accorge, perche' un run cancellato non e' un fallimento.
  # I due cron distano ~15h nominali, ma il ritardo di dispatch misurato qui
  # sopra arriva a 590m: la sovrapposizione non e' teorica. Con `false` il
  # secondo giro aspetta, e quando parte trova gia' scritto lo stato del primo
  # — che e' esattamente cio' su cui si regge la protezione dal doppio invio.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write     # for github-issue-creator on failure

jobs:
  send-alerts:
    # GATE DEL SECONDO SLOT. Il giro delle 12:07 spedisce solo se la
    # repo-variable JOB_ALERT_SECOND_SLOT_ARMED vale 'true'; il dispatch
    # Cloud Scheduler delle 05:00 e il dispatch manuale non sono mai gated.
    #
    # Serve perche' due slot senza la protezione anti-doppione nella LOGICA
    # sono un doppio invio, e quella protezione non puo' stare nella spaziatura
    # dei cron: su questo repo slittano fino a 590 minuti. Finche' la variabile
    # non e' armata, questo workflow si comporta esattamente come prima.
    #
    # Da armare solo dopo che e' su main la logica che tratta un avviso gia'
    # spedito — o gia' PROGRAMMATO e non ancora partito — come non piu' dovuto.
    if: github.event.schedule != '7 12 * * *' || vars.JOB_ALERT_SECOND_SLOT_ARMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # CHECKOUT PIENO, per misura del repo e non per dimenticanza (perf-plan
          # PR 7). Togliere public/images/ (4,4 GB; il sender legge solo brands/)
          # con uno sparse-checkout e `filter: blob:none` lascerebbe comunque ~2,2 GB
          # di dati che l'assemble legge (data/jobs/ da solo e' 702 MB). Oltre ~1 GB
          # residui il profilo e' piu' LENTO del fetch unico, perche' i blob si
          # spostano su una seconda richiesta pigra (CROSSOVER_MB in
          # scripts/ci/checkout-profile-analyzer.mjs; test `nessun job resta sparse
          # sopra la soglia di convenienza`). Il test del perimetro di questo job
          # (tests/send-job-alerts-workflow-perimeter.test.ts) tiene vera la
          # PRECONDIZIONE per un futuro profilo: il codice legge solo
          # public/images/brands/.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node_modules in cache (perf-plan PR 7): chiave sull'hash del lockfile e sulla
      # major di Node. `npm ci` costava 46 s a ogni run; con la cache si salta
      # quando il lockfile non e' cambiato.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      # Privilegio minimo (perf-plan PR 7): prima questo step riceveva ~130 segreti,
      # compresi token GitHub, LinkedIn e TikTok, e il sender ne usa una trentina.
      # L'elenco e' quello che il codice del job (sender, cascade, assemble,
      # issue-creator e le loro importazioni) legge davvero da `process.env`, tolti i
      # moduli dei crawler/traduzione che l'assemble importa ma non esegue. Lo
      # verifica tests/send-job-alerts-workflow-perimeter.test.ts: una chiave nuova
      # letta dal codice e non elencata qui fa fallire la CI, non il job in produzione.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=APPLICATION_INTENT_RANKING_ENABLED,CF_ACCOUNT_ID,CF_API_TOKEN,CLOUDFLARE_EMAIL_API_TOKEN,ENABLE_JOB_ALERTS,JOB_ALERT_BATCH_BOOKKEEPING,JOB_ALERT_CANDIDATE_INDEX_MODE,JOB_ALERT_CANDIDATE_INDEX_SHADOW_SAMPLE,JOB_ALERT_LIVE_LINK_MANIFEST,JOB_ALERT_LIVE_LINK_MANIFEST_MAX_AGE_HOURS,JOB_ALERT_PLANNING_FASTPATH,JOB_ALERT_PLAN_BATCH_SIZE,JOB_ALERT_SUBJECT_AB_ENABLED,JOB_ALERT_SUBJECT_AB_ROLLOUT,JOB_ALERT_SUBJECT_AB_VARIANTS,JOB_ALERT_VOCABULARY_WORKERS,JOB_EMAIL_RANKING_AFFINITY_WEIGHT,JOB_EMAIL_RANKING_ENABLED,JOB_EMAIL_RANKING_IMPRESSIONS_MODE,JOB_EMAIL_RANKING_ROLLOUT,JOB_EMAIL_RANKING_TREATMENT,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,NEWSLETTER_SECRET,PER_USER_SEND_TIME,RESEND_API_KEY

      # Content-addressed cache of the assembled dataset. The key is printed by
      # the assembler itself (.github/actions/assemble-jobs-cache-key): sha256
      # of every slice, of its local import closure, of the aux data files it
      # reads, of package-lock.json and of the Node major. It is the SAME value
      # the script checks before restoring, so a hit can only replay an output
      # built from byte-identical inputs; no restore-keys fallback. Measured
      # miss cost: 4m41 (run 35422626497).
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Assemble jobs dataset
        id: assemble
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Save assemble-jobs cache
        if: steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # Dry run (input dry_run, default true per i dispatch manuali): costruisce gli
      # alert con i dati di produzione e stampa il motivo di ogni alert filtrato e il
      # funnel, senza inviare né scrivere nulla. Lo step di invio resta fermo con dry_run.
      - name: Build alerts without sending (dry run)
        if: inputs.dry_run == true || inputs.dry_run == 'true'
        env:
          ENABLE_JOB_ALERTS: 'true'
          # Node's default old-space ceiling is ~4 GiB on the runner. The
          # sender's bounded batches keep live data finite, but the production
          # inventory can still need more headroom before V8 collects it.
          NODE_OPTIONS: '--max-old-space-size=8192'
          TARGET_EMAIL: ${{ inputs.target_email }}
          SKIP_NEWSLETTER_COOLDOWN: ${{ inputs.target_email != '' && '1' || '' }}
        run: |
          node scripts/send-job-alerts.mjs --dry-run

      - name: Send job alert emails
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        id: send-alerts
        env:
          ENABLE_JOB_ALERTS: 'true'
          # Keep the sender below the runner's available memory while lifting
          # V8's default ~4 GiB heap ceiling that aborts otherwise bounded runs.
          NODE_OPTIONS: '--max-old-space-size=8192'
          # send-job-alerts.mjs emits an aggregate zero-match issue before
          # sending; expose the Actions token to its github-issue-creator
          # import as well as to the explicit failure-report step below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_EMAIL: ${{ inputs.target_email }}
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
          # Bypass newsletter cooldown when targeting a single test recipient
          SKIP_NEWSLETTER_COOLDOWN: ${{ inputs.target_email != '' && '1' || '' }}
        run: |
          node scripts/send-job-alerts.mjs

      - name: Report failure to GitHub Issues
        if: steps.send-alerts.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Job Alerts invio fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Il rosso del run, DOPO l'apertura della issue: `continue-on-error` sullo
      # step di invio tiene vivo il job perche' il reporter possa girare, non per
      # dichiarare verde un run fallito. `close-recovered-failure-issues.yml`
      # chiude `CI Failure: <workflow>` sulla premessa «ultimo run completato
      # success dopo l'apertura»: con un run verde per costruzione la issue si
      # chiude come recuperata al giro dopo, guasto ancora in piedi. Stesso idiom
      # di `location-quality-audit.yml` (#7379, item 3).
      - name: Fail job if the send step failed
        if: steps.send-alerts.outcome == 'failure'
        run: |
          echo "::error::invio delle job alert fallito — vedi l'issue aperta sopra."
          exit 1

      # The newsletter is chained only from the successful, non-dry-run primary
      # Cloud Scheduler dispatch. The marker is uploaded after the failure gate,
      # so a partial/failed alert run, the 12:07 fallback slot, or a manual/dry
      # run can never authorize a newsletter send. The stable slot identity is
      # independent of the scheduler cron; the UTC date remains the handoff key
      # used to correlate the event-driven run with the fallback cron.
      - name: Create primary newsletter handoff marker
        if: steps.send-alerts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'cloud-scheduler' && inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          HANDOFF_DIR: ${{ runner.temp }}/newsletter-handoff
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p "$HANDOFF_DIR"
          jq -n \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_branch "$GITHUB_REF_NAME" \
            --arg trigger_source "$TRIGGER_SOURCE" \
            --arg scheduled_slot "$SCHEDULED_SLOT" \
            --arg dry_run "$DRY_RUN" \
            --arg newsletter_key "$(date -u +%F)" \
            '{
              schema_version: 2,
              kind: "newsletter-jobalert-handoff",
              schedule: "job-alert-primary",
              source_workflow: "Send Job Alert Emails",
              source_workflow_path: ".github/workflows/send-job-alerts.yml",
              source_event: "workflow_dispatch",
              source_conclusion: "success",
              trigger_source: $trigger_source,
              scheduled_slot: $scheduled_slot,
              dry_run: $dry_run,
              source_run_id: $source_run_id,
              source_run_attempt: $source_run_attempt,
              source_branch: $source_branch,
              newsletter_key: $newsletter_key
            }' > "$HANDOFF_DIR/primary.json"

      - name: Upload primary newsletter handoff
        if: steps.send-alerts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'cloud-scheduler' && inputs.dry_run != true && inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/newsletter-handoff/primary.json
          if-no-files-found: error
          retention-days: 3
