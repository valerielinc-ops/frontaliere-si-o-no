name: Send Job Alert Emails

on:
  schedule:
    # Daily 01:47 UTC — slot chosen from a real-run audit (3.5 days, July 2026):
    # 01:00-04:00 UTC is the quietest concurrency window across GitHub Actions
    # runs (~4 concurrent jobs observed vs a ~22-job peak at 12:00 UTC). The
    # previous 05:00 UTC slot collided with real translate-pending runs
    # observed spanning 04:51→07:01 UTC and 05:11→09:47 UTC. :47 avoids the
    # :00/:15/:30/:45 minute marks GitHub Actions cron deprioritizes under load
    # (silent skips). job-alerts typically finishes in 3-10 min, leaving wide
    # margin before send-newsletter at 03:33 UTC (unchanged, confirmed by the
    # same audit). Issue #3798.
    - cron: '47 1 * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Limit send to a single email (test mode). Empty = send to all active alerts.'
        required: false
        default: ''
        type: string

concurrency:
  group: job-alerts
  cancel-in-progress: true

permissions:
  contents: read
  issues: write     # for github-issue-creator on failure

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Assemble jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Send job alert emails
        continue-on-error: true
        id: send-alerts
        env:
          ENABLE_JOB_ALERTS: 'true'
          TARGET_EMAIL: ${{ inputs.target_email }}
          # Bypass newsletter cooldown when targeting a single test recipient
          SKIP_NEWSLETTER_COOLDOWN: ${{ inputs.target_email != '' && '1' || '' }}
        run: node scripts/send-job-alerts.mjs

      - name: Report failure to GitHub Issues
        if: steps.send-alerts.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Job Alerts invio fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
