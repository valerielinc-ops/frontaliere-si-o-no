name: Auto-merge on Claude LGTM

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Trigger condizioni:
    # - review autore = GitHub App "claude[bot]" (user.type=='Bot' + startsWith
    #   safety net).
    # - review.state = "commented" (gh pr review --comment).
    # - body contiene `## LGTM` (signal esplicito da REVIEW.md: "Zero 🔴
    #   Important: chiudi con `## LGTM`"). Sostituisce il check precedente
    #   `!contains(body, '🔴')` che generava false negatives quando il bot
    #   scriveva meta-language tipo "Nessun 🔴 Important" per affermare zero
    #   blocker — l'emoji nel testo di negazione bloccava il merge.
    # - body NON contiene `🔴 Important` (guard belt-and-suspenders contro
    #   reviewer-error: se il bot scrive `## LGTM` per sbaglio E lascia un
    #   `🔴 Important` nei findings, l'auto-merge non scatta). Token
    #   `🔴 Important` (non solo emoji 🔴) per evitare di bloccare merge dove
    #   l'emoji appare in legend/meta-language. REVIEW.md istruisce comunque
    #   il reviewer a NON scrivere `## LGTM` con 🔴 aperto.
    # - PR non draft.
    if: |
      github.event.review.user.type == 'Bot' &&
      startsWith(github.event.review.user.login, 'claude') &&
      github.event.review.state == 'commented' &&
      contains(github.event.review.body, '## LGTM') &&
      !contains(github.event.review.body, '🔴 Important') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge + delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Auto-merge PR #$PR_NUMBER triggered by Claude LGTM review."
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo "${{ github.repository }}"

      # Il merge sopra usa GITHUB_TOKEN: per design GitHub, eventi generati dal
      # GITHUB_TOKEN (qui il `pull_request: closed`) NON triggerano altri
      # workflow. Conseguenza storica: ogni PR auto-mergiata su `## LGTM`
      # saltava `post-merge-followup.yml` (triage 🟡/❓/Non-implementato) — il
      # workflow girava SOLO per le PR mergiate a mano (es. #814/#833), non per
      # quelle auto-mergiate (#822/#828/#829/#831). Verificato: deploy.yml ha la
      # propria mitigazione via workflow_dispatch, post-merge-followup no.
      # Fix: dispatch esplicito del path workflow_dispatch (aggiunto in #809)
      # con GH_PAT — le API autenticate con PAT triggerano i workflow, a
      # differenza del GITHUB_TOKEN. Non cambiamo il token del merge (resta
      # github-actions[bot]) per non introdurre un push-triggered deploy
      # duplicato.
      - name: Dispatch post-merge follow-up triage
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Dispatching post-merge-followup triage for auto-merged PR #$PR_NUMBER."
          gh workflow run post-merge-followup.yml \
            -f pr_number="$PR_NUMBER" \
            --repo "${{ github.repository }}"
