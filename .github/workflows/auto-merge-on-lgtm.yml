name: Auto-merge on Claude LGTM

# Auto-merge scatta SOLO quando coesistono DUE condizioni, qualunque arrivi prima:
#   A) review claude-bot sulla HEAD corrente con `## LGTM` e NO `🔴 Important`;
#   B) check-run `vitest (unit + integration)` sulla HEAD == `success`.
# Il check "NO 🔴 Important" per (A) NON vive nel job `if:` sotto — un `contains()`
# YAML è una substring-match naive, e "🔴 Important" appare anche nella prosa di
# NEGAZIONE del reviewer ("zero 🔴 Important findings...", PR #3330): il job veniva
# skippato per una PR con `## LGTM` e zero findings reali. La decisione vive SOLO
# in auto-merge-eval.mjs (REDFLAG_IMPORTANT_RE, negation-aware) — vedi sotto.
# In passato il gate vitest bloccava SOLO su conclusion==failure: se vitest era
# pending/mancante il merge PROCEDEVA → una PR poteva mergiare prima della fine
# dei test e, se poi andavano rossi, main andava rosso (osservato #1454: LGTM
# mentre vitest girava → vitest failure → main red cascade). Ora il merge
# richiede vitest == success.
#
# Per coprire entrambi gli ordini di arrivo ci sono DUE trigger:
#   - pull_request_review (LGTM appena postato): se vitest non è ancora success,
#     esce 0 quietamente — il completamento di `tests` ri-valuterà.
#   - workflow_run di `tests` completato: se vitest è verde, risolve la PR dalla
#     head e ri-valuta (potrebbe esserci già un `## LGTM` in attesa).
# La decisione è centralizzata in scripts/ci/auto-merge-eval.mjs (single source
# of truth: stessi gate per entrambi i trigger).

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ['tests'] # name: del workflow tests.yml (check-run vitest)
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write # alert PAT-down (github-issue-creator)

jobs:
  auto-merge:
    # Pre-filtro a livello di evento (il resto dei gate, incluso il check
    # `🔴 Important` negation-aware, è in auto-merge-eval.mjs — single source of
    # truth per entrambi i trigger):
    #   - pull_request_review: review autore = claude-bot (user.type=='Bot' +
    #     startsWith 'claude'), state 'commented', body con `## LGTM`, PR non
    #     draft. NON filtra su `🔴 Important` qui (vedi commento header) — se il
    #     body ha un 🔴 reale, auto-merge-eval.mjs lo blocca comunque a valle.
    #   - workflow_run: solo se la run di `tests` è conclusa con success (vitest
    #     verde) — altrimenti inutile valutare.
    if: |
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.type == 'Bot' &&
        startsWith(github.event.review.user.login, 'claude') &&
        github.event.review.state == 'commented' &&
        contains(github.event.review.body, '## LGTM') &&
        github.event.pull_request.draft == false)
      ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # ── Perché tutto questo setup per un semplice merge ──────────────────
      # Per design GitHub, un push/evento generato dal GITHUB_TOKEN di default
      # NON triggera altri workflow (anti-ricorsione). Mergiare con GITHUB_TOKEN
      # quindi:
      #   - NON fa partire deploy.yml (`on: push: main`) → ogni PR auto-mergiata
      #     saltava il deploy (es. #829: 0 run deploy per il suo merge commit).
      #   - NON fa partire post-merge-followup.yml (`on: pull_request: closed`).
      # Un PAT non ha questo limite: i suoi push/eventi triggerano i workflow.
      # Il PAT vive in Firebase Remote Config come `GITHUB_PAT` (pattern
      # zero-cost del repo, NON un Actions secret), caricato in $GITHUB_ENV da
      # `scripts/load-rc-env.mjs`. Mergiando col PAT, il `pull_request: closed`
      # fa partire post-merge-followup da solo → niente più dispatch esplicito
      # (lo step #836/#839 usava `secrets.GH_PAT` che non esiste → era no-op).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna credenziale Firebase SA — GITHUB_PAT non verrà caricato; il merge ripiega su GITHUB_TOKEN (nessun cascade deploy/followup)."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Primary merge identity = GitHub App installation token (`frontaliere-
      # automation[bot]`): auto-mints, no expiry, and its merge-push to main
      # re-triggers the deploy + post-merge-followup cascade (no GITHUB_TOKEN
      # anti-recursion). Sets env.APP_TOKEN; missing App creds → falls back to
      # env.GITHUB_PAT, then GITHUB_TOKEN. The identity gates already allowlist
      # the App slug (#2881). B2b-1 of the App migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT. Scatta solo se NESSUN token
      # cascade-capable (né App né PAT).
      - name: Alert token-down (dedup, zero-Claude)
        if: env.APP_TOKEN == '' && env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ── Risolvi il PR number dall'evento ─────────────────────────────────
      # pull_request_review: PR = quella dell'evento.
      # workflow_run: l'evento NON porta il PR; lo risolviamo dalla head del run
      # di `tests`. Prima via head_sha (più preciso: matcha il commit testato),
      # poi fallback su head_branch. Se non c'è PR aperta per quella head →
      # niente da fare (pr_number resta vuoto, lo step di merge fa skip).
      - name: Resolve PR number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            echo "pr_number=$REVIEW_PR" >> "$GITHUB_OUTPUT"
            echo "Risolto PR #$REVIEW_PR (pull_request_review)."
            exit 0
          fi
          # workflow_run: cerca la PR aperta con quella head SHA.
          PRN=$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null || true)
          if [ -z "${PRN:-}" ] && [ -n "${RUN_HEAD_BRANCH:-}" ]; then
            PRN=$(gh pr list --repo "$REPO" --head "$RUN_HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -z "${PRN:-}" ]; then
            echo "Nessuna PR aperta per head_sha=$RUN_HEAD_SHA / branch=$RUN_HEAD_BRANCH — niente da mergiare."
          else
            echo "Risolto PR #$PRN (workflow_run tests completato)."
          fi
          echo "pr_number=${PRN:-}" >> "$GITHUB_OUTPUT"

      # ── Valutazione unica + merge ────────────────────────────────────────
      # La decisione (LGTM + vitest==success + collision gate) e il merge vivono
      # in auto-merge-eval.mjs, identici per entrambi i trigger. Esce 0 quando un
      # gate non è soddisfatto (l'altro trigger ri-valuterà): non è un errore.
      - name: Evaluate gates + squash-merge
        if: steps.resolve.outputs.pr_number != ''
        env:
          # GH_TOKEN read-only per le query (check-runs/reviews/compare).
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Token primario = env.GITHUB_PAT (da Remote Config): il push del merge
          # triggera deploy.yml + tests + lighthouse, e il pull_request:closed
          # triggera post-merge-followup. Il GITHUB_TOKEN di fallback serve in
          # DUE casi (entrambi → merge avviene ma senza cascade, = pre-fix):
          #   1. RC non carica → env.GITHUB_PAT vuoto → fallback diretto.
          #   2. Merge col PAT fallisce (es. PAT senza scope PR-write) → retry
          #      con GITHUB_TOKEN, così l'auto-merge non si rompe mai.
          MERGE_PRIMARY_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          MERGE_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ env.APP_TOKEN != '' || env.GITHUB_PAT != '' }}
        run: node scripts/ci/auto-merge-eval.mjs "${{ steps.resolve.outputs.pr_number }}"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
