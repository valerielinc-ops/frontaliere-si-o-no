name: Mirror article corpus to the articles repo

# Transitional, and deliberately one-way.
#
# The corpus now has a home of its own (nanakokyobashi-rgb/frontaliere-articles),
# which republishes it as JSON + sitemaps that this site consumes. But articles
# are still CREATED here, by scripts/create-article.mjs, so without this mirror the
# published surface silently freezes at whatever snapshot was pushed when the repo
# was extracted — and a stale API is worse than no API, because consumers cannot
# tell the difference.
#
# This closes that gap while `generate-article.yml` still lives in this repo.
# When the generator moves (#4959), articles will be created in the articles repo
# directly and this workflow is deleted, not rewired: mirroring is the symptom of
# the split being unfinished, not part of the target architecture.
#
# One-way on purpose: this repo is the writer, the articles repo is the reader.
# Nothing here ever pulls, so there is no direction in which the two can diverge
# into a conflict.

on:
  # DISABLED AT CUTOVER. This trigger force-replaced nanako's corpus wholesale
  # (`rm -rf content && cp -R packages/articles/content`) and overwrote its
  # package.json. Now that nanako GENERATES articles, that would delete the ones
  # this repo has never seen and strip the generator's dependencies. The mirror
  # is kept dispatch-only rather than deleted, per §5.7: it stays until every
  # producer is confirmed stopped, plus a week.
  #
  # 2026-08-05: it is no longer the code channel. Disabling it also stranded
  # `engine/`, which this repo still owns and nanako executes — four engine
  # changes never arrived and article pages shipped without their footer portal
  # target for three days (docs/articles-generator-migration.md §13). That job
  # now belongs to mirror-articles-engine.yml, which carries engine/ ONLY and
  # can therefore run automatically. Deleting this file no longer removes the
  # last connection between the two repos; check §13.2 for the corrected §5.7
  # criterion, because the obvious path query cannot return 0 any more.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/articles/**'
  # Safety net, and in practice the load-bearing trigger. The `push` event above
  # does NOT fire for the commits that actually matter: every workflow that
  # writes the corpus (generate-article, crawl-events, batch-faq-articles,
  # generate-border-wait-ranking, rerender-article-corpus, fast-publish) pushes
  # with the default GITHUB_TOKEN, and GitHub's anti-recursion rule means a
  # GITHUB_TOKEN push never triggers another workflow. Without this schedule the
  # mirror only ever ran when someone dispatched it by hand — which is exactly
  # the "API silently freezes at the extraction snapshot" failure this workflow
  # exists to prevent, and it had already happened: between the first mirror and
  # this change, corpus commits landed on main and none of them reached the
  # articles repo. generate-article.yml also dispatches this workflow directly
  # (with a PAT) so a new article does not wait for the next slot.
      # ── CUTOVER (issue #4974 item 3, §5.7) ──────────────────────────────
      # Disabled here because this producer now runs in
      # nanakokyobashi-rgb/frontaliere-articles, which owns the corpus. Leaving
      # both enabled would give the same files two writers and the last push
      # would win — the exact failure the migration exists to remove.
      #
      # workflow_dispatch is deliberately KEPT so this can still be run by hand
      # during the observation window if the nanako side needs to be compared
      # against it. Re-enabling means deleting these comment markers; it is not
      # a code change, which is what makes the rollback cheap.
  # schedule:  # DISABLED AT CUTOVER — see above
  # # Every two hours, offset off the hour to stay clear of the deploy cron.
  # - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean

# Serialised, never cancelled: two mirrors racing would interleave force-pushes
# over the same tree.
concurrency:
  group: mirror-articles-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Push packages/articles to the articles repo
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        timeout-minutes: 12
        env:
          PAT: ${{ secrets.ARTICLES_REPO_PAT }}
          MIRROR_GIT_TIMEOUT_SECONDS: '120'
          MIRROR_GUARDED_PUSH_TIMEOUT_SECONDS: '180'
          # The checkout may consume its full 5-minute step ceiling from the
          # 15-minute job. Leave a 60-second tail for failure reporting rather
          # than allowing three nominal retries to overrun the job.
          MIRROR_RETRY_BUDGET_SECONDS: '540'
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::ARTICLES_REPO_PAT is not set — cannot mirror"
            exit 1
          fi

          site_root="${GITHUB_WORKSPACE:-$PWD}"
          mirror_deadline=$((SECONDS + MIRROR_RETRY_BUDGET_SECONDS))
          mirror_remaining_seconds() {
            local remaining=$((mirror_deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::mirror retry budget expired before the next operation" >&2
              return 1
            fi
            printf '%s\n' "$remaining"
          }
          mirror_timeout_seconds() {
            local cap="$1"
            local remaining
            remaining="$(mirror_remaining_seconds)" || return 1
            if [ "$remaining" -lt "$cap" ]; then
              printf '%s\n' "$remaining"
            else
              printf '%s\n' "$cap"
            fi
          }
          run_bounded() {
            local label="$1" timeout_seconds="$2"
            shift 2
            node "$site_root/scripts/lib/run-bounded-command.mjs" \
              --timeout-seconds "$timeout_seconds" \
              --label "$label" \
              -- "$@"
          }
          timeout_seconds="$(mirror_timeout_seconds "$MIRROR_GIT_TIMEOUT_SECONDS")" || exit 1
          work=$(mktemp -d)
          run_bounded "clone articles mirror target" "$timeout_seconds" git clone --depth 1 \
            "https://x-access-token:${PAT}@github.com/nanakokyobashi-rgb/frontaliere-articles.git" \
            "$work"

          # Replace the tracked corpus wholesale, but keep the files the articles
          # repo owns and this repo does not know about (its build script, its
          # workflows, its README). Only paths that came from packages/articles are
          # candidates for deletion.
          # Files the articles repo owns under content/ must survive the wipe.
          # swiss-article-canonical-overrides.json lives THERE, not in this repo's
          # packages/articles/content, and the publisher cannot build a correct
          # sitemap without it: the first mirror run deleted it and broke
          # publishing outright. Preserve it until it is moved into the package
          # here too, at which point the mirror carries it naturally.
          keep=$(mktemp -d)
          cd "$work"
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

          # Rebuild from the current remote tip on every bounded retry. The
          # shared guard checks the complete candidate tree before publishing,
          # then force-with-lease rejects a concurrent advancement instead of
          # letting a stale mirror replace the articles repo's main ref.
          for attempt in 1 2 3; do
            timeout_seconds="$(mirror_timeout_seconds "$MIRROR_GIT_TIMEOUT_SECONDS")" || exit 1
            run_bounded "fetch articles mirror base (attempt ${attempt}/3)" "$timeout_seconds" \
              git fetch --no-tags origin main
            git reset --hard -q origin/main
            # Preserve the file from this retry's fresh remote base. Reusing
            # the initial clone after a lease loss could overwrite a newer
            # canonical override committed to origin/main in the meantime.
            for f in swiss-article-canonical-overrides.json; do
              rm -f "$keep/$f"
              [ -f "$work/content/$f" ] && cp "$work/content/$f" "$keep/$f"
            done
            for d in content engine; do
              rm -rf "${work:?}/$d"
            done
            cp -R "$site_root/packages/articles/content" "$work/content"
            cp -R "$site_root/packages/articles/engine" "$work/engine"
            for f in index.ts articleSections.ts package.json; do
              [ -f "$site_root/packages/articles/$f" ] && cp "$site_root/packages/articles/$f" "$work/$f"
            done
            for f in swiss-article-canonical-overrides.json; do
              [ -f "$keep/$f" ] && cp "$keep/$f" "$work/content/$f"
            done

            git add -A
            if git diff --cached --quiet; then
              echo "corpus already in sync — nothing to mirror"
              exit 0
            fi

            # Guard: the corpus only ever grows in normal operation. A mirror
            # that would delete a large share of it means something upstream is
            # wrong (a bad checkout, a partial clone), and a push would destroy
            # the published surface.
            deleted=$(git diff --cached --diff-filter=D --name-only | wc -l)
            total=$(git ls-files | wc -l)
            echo "mirroring attempt ${attempt}/3: $total files tracked, $deleted deletion(s)"
            if [ "$deleted" -gt 200 ]; then
              echo "::error::mirror would delete $deleted files — refusing, investigate upstream"
              exit 1
            fi

            git commit -q \
              -m "Mirror packages/articles from frontaliere-si-o-no@${GITHUB_SHA:0:8}" \
              -m "Automated one-way mirror while the generator still runs in the site repo (issue 4959). Publishing of the JSON + sitemap surface is triggered by this push."
            base_sha="$(git rev-parse --verify origin/main^{commit})"
            candidate_sha="$(git rev-parse --verify HEAD^{commit})"
            timeout_seconds="$(mirror_timeout_seconds "$MIRROR_GUARDED_PUSH_TIMEOUT_SECONDS")" || exit 1
            push_output=""
            push_status=0
            push_output="$(node "$site_root/scripts/lib/main-push-guard.mjs" \
              --repo "$work" \
              --base "$base_sha" \
              --candidate "$candidate_sha" \
              --branch main \
              --push \
              --timeout-seconds "$timeout_seconds" 2>&1)" || push_status=$?
            printf '%s\n' "$push_output"
            if [ "$push_status" -eq 0 ]; then
              echo "mirrored ${GITHUB_SHA:0:8} — the articles repo will republish its data surface"
              exit 0
            fi
            # A candidate based on the previous origin/main can become stale
            # while the mirror is being built. Each retry rebuilds from a
            # freshly fetched origin/main; let this normal race refresh and
            # retry, while keeping integrity/proof failures fail-closed.
            if printf '%s' "$push_output" | grep -qiE 'candidate tree collapse|cannot resolve commit|cannot inspect tree|cannot prove ancestry'; then
              echo "::error::main push guard rejected the mirror candidate; refusing to retry a destructive tree"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::mirror push failed after 3 attempts"
              exit 1
            fi
            echo "mirror push lost a concurrent update; retrying from origin/main"
            sleep_for=$((attempt * 5))
            remaining="$(mirror_remaining_seconds)" || exit 1
            if [ "$remaining" -le "$sleep_for" ]; then
              echo "::error::mirror retry budget expired before the next backoff" >&2
              exit 1
            fi
            sleep "$sleep_for"
          done
