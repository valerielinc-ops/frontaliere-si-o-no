name: OmniRoute POC

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  omniroute-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # Install/start/register/enable factored into
      # .github/actions/setup-omniroute — shared with the opt-in pilot
      # wiring in generate-company-parser.yml so the two workflows don't
      # drift on the same bash (AGENTS.md #6). The trailing "enable" step
      # inside the action (OMNIROUTE_ENABLED=1) is a no-op here — this POC
      # calls OmniRoute's raw HTTP API directly below, not via
      # ai-models.mjs's callLLM.
      - name: Setup OmniRoute
        uses: ./.github/actions/setup-omniroute

      - name: Call a completion through OmniRoute (auto routing/fallback)
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:20128/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"auto","stream":false,"messages":[{"role":"user","content":"Reply with exactly this token and nothing else: OMNIROUTE_POC_OK"}]}')
          echo "$RESPONSE" | tee /tmp/omniroute-response.json
          echo "$RESPONSE" | grep -q "OMNIROUTE_POC_OK" || { echo "POC FAILED: expected token not found in response"; exit 1; }
          echo "POC OK — model used: $(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/omniroute-response.json','utf8')).model || 'unknown')")"

      - name: Dump OmniRoute logs on failure
        if: failure()
        run: |
          cat /tmp/omniroute.log || true
          node scripts/omniroute-diagnose.mjs || true
