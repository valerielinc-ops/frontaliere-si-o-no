name: House creative readout

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: house-creative-readout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  house-creatives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Experiment controls are server-only Remote Config values and are
    # intentionally absent from /api/public-config/. Always publish the
    # aggregate readout so an inactive or zero-exposure experiment is visible
    # instead of silently skipping the measurement.
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install reporting dependencies
        run: npm ci --ignore-scripts
      - name: Read aggregate creative performance and confirmed purchases
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '524485296'
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/house-report-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/house-report-sa.json"
          node scripts/analytics/house-ad-readout.mjs --days=28 > "$RUNNER_TEMP/house-ad-readout.json"
      - name: Upload aggregate house creative report
        uses: actions/upload-artifact@v7
        with:
          name: house-ad-readout
          path: ${{ runner.temp }}/house-ad-readout.json
          retention-days: 90
          if-no-files-found: error
