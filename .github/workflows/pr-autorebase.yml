name: PR auto-rebase (near-merge only, no-Claude)

# Esegue davvero il rebase che stale-pr-rescuer si limita a SUGGERIRE: una PR a
# un passo dal merge ma dietro main resta ferma perché nessuno fa
# `git merge origin/main`. Qui lo facciamo, ma FRUGALMENTE e ZERO Claude: dopo
# il rebase NON ri-eseguiamo la review — dispatchiamo SOLO tests.yml sull'head
# (vitest cheap) e auto-merge-eval porta avanti l'`## LGTM` esistente (contributo
# PR invariato su un rebase di solo main-merge). Tocchiamo SOLO le PR
# "near-merge" (LGTM già dato, oppure label collision-risk/stale-review).
# Tutto deterministico (scripts/ci/pr-autorebase.mjs + gh + git).
#
# Perché dispatchiamo tests invece di affidarci al push: un push PAT su un branch
# PR NON ri-triggera in modo affidabile i workflow `pull_request` (osservato:
# head rebasati di #1587/#1526 con zero check-run). Il dispatch è deterministico.

on:
  schedule:
    - cron: '*/30 * * * *' # nominale 30min, ma GitHub THROTTLA i cron ad alta
      #   frequenza (osservato: gira ogni 2-4h, non 30min) → da solo lascia le PR
      #   near-merge bloccate per ore. Per questo c'è anche il trigger
      #   pull_request_review qui sotto: appena arriva un `## LGTM` l'autorebase
      #   parte SUBITO e sblocca la PR (rebase+dispatch o heal) senza aspettare
      #   il prossimo tick del cron.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, niente merge/push/label/commenti'
        type: boolean
        default: false

# Una rebase-run alla volta: evita push concorrenti sullo stesso branch.
concurrency:
  group: pr-autorebase
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  autorebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # serve l'intera storia per merge origin/main nei branch

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; autorebase inerte (push via GITHUB_TOKEN NON ri-triggererebbe review/vitest — anti-ricorsione)."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT)
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Rebase near-merge PRs (deterministic, no Claude)
        env:
          # PAT OBBLIGATORIO: serve per pushare il rebase E per `gh workflow run
          # tests.yml` (scope actions:write). NON ci affidiamo più al push per
          # ri-triggerare i workflow (un push PAT su branch PR non triggera
          # `pull_request` in modo affidabile) — vitest viene dispatchato
          # esplicitamente; l'LGTM lo porta avanti auto-merge-eval. Zero Claude.
          GH_TOKEN: ${{ env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GITHUB_PAT assente → autorebase inerte (serve per push + dispatch tests.yml)."
            exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/ci/pr-autorebase.mjs --dry-run
          else
            node scripts/ci/pr-autorebase.mjs
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
