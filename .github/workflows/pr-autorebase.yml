name: PR auto-rebase (near-merge only, no-Claude)

# Esegue davvero il rebase che stale-pr-rescuer si limita a SUGGERIRE: una PR a
# un passo dal merge ma dietro main resta ferma perché nessuno fa
# `git merge origin/main`. Qui lo facciamo, ma FRUGALMENTE e ZERO Claude: dopo
# il rebase NON ri-eseguiamo la review — dispatchiamo SOLO tests.yml sull'head
# (vitest cheap) e auto-merge-eval porta avanti l'`## LGTM` esistente (contributo
# PR invariato su un rebase di solo main-merge). Tocchiamo SOLO le PR
# "near-merge" (LGTM già dato, oppure label collision-risk/stale-review).
# Tutto deterministico (scripts/ci/pr-autorebase.mjs + gh + git).
#
# Perché dispatchiamo tests invece di affidarci al push: un push PAT su un branch
# PR NON ri-triggera in modo affidabile i workflow `pull_request` (osservato:
# head rebasati di #1587/#1526 con zero check-run). Il dispatch è deterministico.

on:
  schedule:
    - cron: '*/30 * * * *' # nominale 30min, ma GitHub THROTTLA i cron ad alta
      #   frequenza (osservato: gira ogni 2-4h, non 30min) → da solo lascia le PR
      #   near-merge bloccate per ore. Per questo c'è anche il trigger
      #   pull_request_review qui sotto: appena arriva un `## LGTM` l'autorebase
      #   parte SUBITO e sblocca la PR (rebase+dispatch o heal) senza aspettare
      #   il prossimo tick del cron.
  pull_request_review:
    types: [submitted]
  # Un MERGE rende le PR open collidenti improvvisamente behind/CONFLICTING: il
  # cron è throttlato da GitHub (2-4h) e pull_request_review scatta sull'LGTM
  # (PRIMA che il peer mergi), quindi senza questo trigger il conflitto emergeva
  # solo ore dopo (incidente #2836↔#2840: collisione su scripts/lib/email-cascade.mjs
  # sorta al merge del peer; risolta a mano perché nessun trigger ri-valutava).
  # Su OGNI merge ri-valutiamo subito le PR near-merge → rebase/auto-resolve, o
  # stale-review + comment in ~1min invece di 2-4h. Merged-only (vedi job `if`).
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, niente merge/push/label/commenti'
        type: boolean
        default: false

# Una rebase-run alla volta: evita push concorrenti sullo stesso branch.
concurrency:
  group: pr-autorebase
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # alert PAT-down (github-issue-creator)

jobs:
  autorebase:
    # Sul trigger pull_request gira SOLO se la PR è stata mergiata (è il merge a
    # poter rendere le peer behind/CONFLICTING); gli altri trigger (schedule,
    # review, dispatch) girano sempre.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    # NON alzare questo cap: i timeout #5145/#5144 erano il Checkout, non il
    # lavoro (vedi lo step sotto). Alzarlo avrebbe solo pagato più minuti Actions
    # per lo stesso fetch. Deve restare uguale a JOB_TIMEOUT_MINUTES qui sotto —
    # `timeout-minutes` non accetta il context `env`, quindi il valore è ripetuto:
    # se cambi uno cambia l'altro.
    timeout-minutes: 15
    env:
      JOB_TIMEOUT_MINUTES: 15
    steps:
      # Deadline assoluta del job, esportata PRIMA di qualunque lavoro: è il
      # riferimento che mancava allo script. Il cap `timeout-minutes` copre
      # setup+lavoro insieme, ma il setup (Checkout) è la voce dominante e
      # variabile, quindi lo script non poteva sapere quanto tempo gli restasse.
      # Con la deadline lo sa e si ferma pulito invece di essere ucciso a metà di
      # una PR (vedi scripts/ci/lib/run-budget.mjs).
      - name: Export job deadline
        run: echo "CI_JOB_DEADLINE_EPOCH=$(( $(date +%s) + ${{ env.JOB_TIMEOUT_MINUTES }} * 60 ))" >> "$GITHUB_ENV"

      # Checkout: era la CAUSA REALE dei timeout #5145/#5144, non il lavoro.
      # Misurato sui run reali di questo job (cap 15min): Checkout 10m21s
      # (31025827970), 13m06s (31029804861), 13m42s (31033258098), 14m00s
      # (31044227098) — l'87-93% del budget — con la fase di rebase a 19-114s.
      # #5145 (14m58s) e #5144 (14m59s) sono lo stesso Checkout che sfora di un
      # minuto: il job muore prima che pr-autorebase.mjs parta. Non è la coda di
      # PR ad essere cresciuta (era 0 aperte alla diagnosi): è la STORIA del repo
      # — 10,5 GB, ~8.900 commit su main in 7 giorni — e `fetch-depth: 0` ne paga
      # il costo intero a ogni run, quindi peggiora da solo ogni giorno.
      #
      # Config presa da pr-body-contract.yml, l'unico altro job che ha bisogno
      # della storia completa e dove è GIÀ MISURATA: `filter: blob:none` porta il
      # suo Checkout da ~200s a 77s. La combinazione conta: il partial clone paga
      # solo con `fetch-depth: 0` (salta i blob di TUTTA la storia, che qui sono
      # quasi interamente immagini); su un fetch bulk `depth: 1` è invece un
      # peggioramento netto (+125% misurato su tests.yml, vedi la nota in
      # pr-review-loop.yml) — per questo il drainer NON lo usa.
      # Lo sparse-checkout evita di materializzare 1,15 GB di immagini che questo
      # job non legge mai: fa solo `git merge origin/main` e push. I path esclusi
      # restano nell'indice (skip-worktree) → i commit li preservano, il merge
      # resta corretto, e se un conflitto tocca uno di quei file git lo
      # materializza da sé.
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # serve l'intera storia per merge origin/main nei branch
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/images/events
            !/public/images/blog
          sparse-checkout-cone-mode: false
        # Tetto esplicito sul setup: se il Checkout degenera comunque, il job
        # fallisce QUI in modo diagnosticabile invece di consumare in silenzio
        # tutto il budget e morire `cancelled` nel mezzo del lavoro. Stessa
        # ragione di pr-review-loop.yml / pr-body-contract.yml — il *valore*
        # pero' non e' piu' lo stesso, perche' li' e' cambiato: 8 min era tarato
        # su un Checkout da 75s che oggi ne costa 250-475.
        #
        # Qui non ha ancora sparato — misurato il 2026-08-18 su 22 run concluse,
        # questo step va da 0s (cache calda / job che salta) a **381s**, p50
        # 280s, p90 365s. Ma 381s contro 480s sono 99s di margine, cioe' il 26%:
        # lo stesso rapporto che su `pr-review-loop` (max 472 su 480) ha prodotto
        # 5 review perse su 18. Alzare e' **preventivo e dichiarato tale**, non un
        # rimedio a un difetto gia' osservato su questo job.
        #
        # 10 e non 12 per aritmetica, non per prudenza: questo tetto deve restare
        # sotto quello del job (15 min) con abbastanza spazio da lasciar girare
        # il lavoro vero, altrimenti smette di fare il suo mestiere — un Checkout
        # degenerato non fallirebbe piu' QUI, si mangerebbe il budget e il job
        # morirebbe `cancelled` piu' avanti, che e' esattamente il modo di
        # fallire che questo tetto esiste per evitare. Il lavoro dopo il Checkout
        # (merge + push) e' misurato a p50 52s, p90 72s, **max 97s** sulle stesse
        # 21 run: 10 + 5 di residuo tiene 3,1x sul caso peggiore del lavoro e
        # 1,57x sul caso peggiore del Checkout. A 12 il residuo scendeva a 3 min.
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; autorebase inerte (push via GITHUB_TOKEN NON ri-triggererebbe review/vitest — anti-ricorsione)."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT)
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Primary identity = GitHub App installation token (`<app>[bot]`): auto-mints,
      # no expiry to babysit, and its events re-trigger downstream workflows (no
      # GITHUB_TOKEN anti-recursion). Sets env.APP_TOKEN; on missing App creds it
      # warns + sets nothing → the steps below fall back to env.GITHUB_PAT.
      # PR #2855 follow-up: first workflow migrated to the App (validates that an
      # App-pushed branch re-triggers tests and is NOT action_required-gated).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT (e' la cosa rotta). Scatta solo se
      # NESSUN token usabile (né App né PAT).
      - name: Alert token-down (dedup, zero-Claude)
        if: env.APP_TOKEN == '' && env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Rebase near-merge PRs (deterministic, no Claude)
        env:
          # Identità di push/dispatch: App token (primario) → PAT (fallback). Serve
          # per pushare il rebase E per `gh workflow run tests.yml` (scope
          # actions:write — l'App ce l'ha). Un push via App/PAT ri-triggera i
          # workflow (no anti-ricorsione GITHUB_TOKEN); vitest è comunque
          # dispatchato esplicitamente, l'LGTM lo porta avanti auto-merge-eval.
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Nessun token usabile (App/PAT assenti) → autorebase inerte (serve per push + dispatch tests.yml)."
            exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/ci/pr-autorebase.mjs --dry-run
          else
            node scripts/ci/pr-autorebase.mjs
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
