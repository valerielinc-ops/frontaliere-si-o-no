name: Recover assisted applications after portal fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/assisted-application/lib/portal/**'
      - 'scripts/assisted-application/extension/apply-control.js'
      - 'scripts/assisted-application/lib/submit.mjs'
      - 'scripts/assisted-application/agent.mjs'
      - 'scripts/assisted-application/verify-portal.mjs'
      - 'scripts/assisted-application/reconcile-portal-questions.mjs'
      - '.github/workflows/assisted-application-portal-recovery.yml'
      - 'scripts/assisted-application/lib/portal-code-version.mjs'
      - 'scripts/assisted-application/lib/execution-runtime.mjs'
      - 'scripts/assisted-application/lib/execution-artifacts.mjs'
      - 'scripts/assisted-application/lib/execution-process.mjs'
      - 'scripts/assisted-application/lib/browser-ownership.mjs'
      - 'scripts/assisted-application/lib/process-registry.mjs'
      - 'scripts/assisted-application/lib/browser-egress.mjs'
      - 'scripts/lib/prospector/public-fetch-policy.mjs'
      - 'scripts/assisted-application/nopecha-e2e.mjs'
      - 'scripts/assisted-application/report-runner-failure.mjs'
      - 'scripts/assisted-application/lib/execution-release.mjs'
      - 'scripts/assisted-application/lib/darwin-isolation.mjs'
      - 'scripts/assisted-application/remote-controller.mjs'
      - 'scripts/assisted-application/remote-executor.mjs'
      - 'scripts/assisted-application/supervised-agent.mjs'
      - '.github/actions/setup-codex-darwin-broker/**'
      - '.github/actions/setup-claude-haiku-fallback/**'
      - 'functions/src/codexFallback.js'
      - 'functions/src/assistedApplicationReceiptReconcile.js'
      - 'functions/src/lib/submissionReceiptContract.js'
      - 'functions/src/lib/qualificationCounterContext.js'
      - 'functions/src/lib/submittedOrderFields.js'
      - 'functions/src/assistedApplicationExecution.js'
      - 'functions/src/assistedApplicationEligibility.js'
      - 'functions/src/lib/assistedApplicationRetentionPolicy.js'
      - 'functions/src/lib/assistedApplicationArtifactRetention.js'
      - 'functions/src/assistedApplicationFollowup.js'
      - 'scripts/assisted-application/lib/secure-run.mjs'
      - 'scripts/assisted-application/lib/draft.mjs'
      - 'scripts/assisted-application/lib/docx-inplace.mjs'
      - 'functions/src/lib/portalChannels.js'
      - 'functions/src/lib/portalInfrastructureEvidence.js'
      - 'scripts/assisted-application/install-nopecha.sh'
      - 'functions/src/assistedApplicationOperationalAnswers.js'
      - 'functions/src/assistedApplicationCandidateEdits.js'
      - 'functions/src/assistedApplicationFlow.js'
      - 'functions/src/assistedApplicationPortalRetryPolicy.js'
      - 'functions/src/assistedApplicationPortalRecoveryPolicy.js'
      - 'functions/src/assistedApplicationSubmissionGuard.js'
      - 'functions/src/lib/answerRules.js'
      - 'functions/src/lib/portalQuestionText.js'
      - 'functions/src/assistedApplicationNativeProof.js'
      - 'functions/src/lib/addressContextContract.js'
      - 'functions/src/lib/answerSourceConflicts.js'
      - 'functions/src/lib/applicationConsent.js'
      - 'functions/src/lib/applicationOrigin.js'
      - 'functions/src/lib/assistedApplicationPolicyAuthority.js'
      - 'functions/src/lib/candidateIdentityContract.js'
      - 'functions/src/lib/candidateLanguageQuestion.js'
      - 'functions/src/lib/languageFacts.js'
      - 'functions/src/lib/nativeAnswerConstraints.js'
      - 'functions/src/lib/nativeApplicationPolicy.js'
      - 'functions/src/lib/nativeApplicationTarget.js'
      - 'functions/src/lib/nativeControlSource.js'
      - 'functions/src/lib/nativeDocumentTransport.js'
      - 'functions/src/lib/nativeFilePurpose.js'
      - 'functions/src/lib/nativeFormContract.js'
      - 'functions/src/lib/nativePolicyAuthority.js'
      - 'functions/src/lib/nativeQualificationContext.js'
      - 'functions/src/lib/nativeQuestionText.js'
      - 'functions/src/lib/nativeScopeInterpretation.js'
      - 'functions/src/lib/phoneNormalization.js'
      - 'functions/src/lib/primaryApplicationProtocol.js'
      - 'functions/src/lib/publicContractTransport.js'
      - 'functions/src/lib/qualificationEvidence.js'
      - 'functions/src/lib/qualificationGenerate.js'
      - 'functions/src/lib/permitStatus.js'
      - 'functions/src/lib/documentQuestions.js'
      - 'functions/src/lib/personalFacts.js'
      - 'functions/src/lib/cvPeriod.js'
      - 'functions/src/lib/requirementLanguageCodes.js'
      - 'functions/src/lib/sourceCitations.js'
      - 'functions/src/lib/attestedLanguageProjection.js'
      - 'functions/src/lib/portalNativeContract.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assisted-portal-code-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .github/actions
            functions
            scripts
            package.json
            package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Prepare the read-only public-form browser
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Revalidate legacy operational portal contracts
        run: node scripts/assisted-application/reconcile-portal-questions.mjs --apply
        timeout-minutes: 5
      - name: Queue recoverable applications through the normal clock
        run: node scripts/assisted-application/reconcile-portal-code.mjs --apply
