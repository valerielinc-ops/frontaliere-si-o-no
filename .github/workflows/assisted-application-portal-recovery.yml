name: Recover assisted applications after portal fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/assisted-application/lib/portal/**'
      - 'scripts/assisted-application/extension/apply-control.js'
      - 'scripts/assisted-application/lib/submit.mjs'
      - 'scripts/assisted-application/agent.mjs'
      - 'scripts/assisted-application/lib/portal-code-version.mjs'
      - 'scripts/assisted-application/lib/execution-runtime.mjs'
      - 'scripts/assisted-application/lib/execution-artifacts.mjs'
      - 'scripts/assisted-application/lib/execution-process.mjs'
      - 'scripts/assisted-application/lib/browser-ownership.mjs'
      - 'scripts/assisted-application/lib/process-registry.mjs'
      - 'scripts/assisted-application/lib/browser-egress.mjs'
      - 'scripts/lib/prospector/public-fetch-policy.mjs'
      - 'scripts/assisted-application/nopecha-e2e.mjs'
      - 'scripts/assisted-application/report-runner-failure.mjs'
      - 'scripts/assisted-application/lib/execution-release.mjs'
      - 'scripts/assisted-application/lib/darwin-isolation.mjs'
      - 'scripts/assisted-application/remote-controller.mjs'
      - 'scripts/assisted-application/remote-executor.mjs'
      - 'scripts/assisted-application/supervised-agent.mjs'
      - '.github/actions/setup-codex-darwin-broker/**'
      - '.github/actions/setup-claude-haiku-fallback/**'
      - 'functions/src/assistedApplicationExecution.js'
      - 'functions/src/assistedApplicationEligibility.js'
      - 'functions/src/lib/assistedApplicationRetentionPolicy.js'
      - 'functions/src/lib/portalChannels.js'
      - 'functions/src/lib/portalInfrastructureEvidence.js'
      - 'scripts/assisted-application/install-nopecha.sh'
      - 'functions/src/assistedApplicationOperationalAnswers.js'
      - 'functions/src/assistedApplicationCandidateEdits.js'
      - 'functions/src/assistedApplicationFlow.js'
      - 'functions/src/assistedApplicationPortalRetryPolicy.js'
      - 'functions/src/assistedApplicationPortalRecoveryPolicy.js'
      - 'functions/src/assistedApplicationSubmissionGuard.js'
      - 'functions/src/lib/answerRules.js'
      - 'functions/src/lib/portalQuestionText.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assisted-portal-code-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .github/actions
            functions
            scripts
            package.json
            package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Queue recoverable applications through the normal clock
        run: node scripts/assisted-application/reconcile-portal-code.mjs --apply
