name: Monitor GSC Job Indexation

on:
  schedule:
    # Weekly: Sunday 15:00 UTC (after sync-gsc-orphans)
    - cron: '0 15 * * 0'
  workflow_dispatch: {}

concurrency:
  group: monitor-gsc-seo
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Firebase SA credentials — monitor will skip GSC checks"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Primary identity for the auto-redeploy trigger below = GitHub App
      # installation token (`frontaliere-automation[bot]`): auto-mints, no expiry
      # babysit. Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run GSC Job Indexation Monitor
        # monitor-gsc-job-indexation.mjs reads process.env.GITHUB_PAT — override with
        # the App token when minted (primary identity), PAT otherwise (#2861 item 1).
        # GITHUB_PAT itself è caricato in $GITHUB_ENV da "Load secrets from Remote
        # Config" (Firebase RC, non un Actions secret — `secrets.GITHUB_PAT` non
        # esiste). NON shadoware con secrets.* o il monitor gira con token vuoto
        # (cfr. #878).
        env:
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          # gh CLI (used by scripts/lib/github-issue-creator.mjs for issue creation)
          # only honors GH_TOKEN/GITHUB_TOKEN, never GITHUB_PAT — without this the
          # monitor's issue-creation path was always a silent no-op (PR #3322 review).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor-gsc-job-indexation.mjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
