name: Monitor GSC Job Indexation

# Daily since 2026-10-24: monitor (indexation + job rich results guard), then
# Google Indexing API notifications for job pages, starting from the pages the
# monitor just found WITHOUT a "Job Postings" rich result.
# 08:20 UTC is after the Indexing API quota reset (midnight America/Los_Angeles,
# 07:00 UTC in summer, 08:00 UTC in winter), so this run opens the quota day.
#
# After every successful publish, post-deploy-publish.yml dispatches this
# workflow with `mode=post-publish`: only the `indexing` job runs, with a
# small top-up, so new jobs reach Google the same day. That dispatch replaced a
# `workflow_run` trigger on "Publish to GitHub Pages (deploy + validate)" that
# never fired once from 2026-10-24 to 2026-11-10 (only `schedule` runs in the
# history): deploy-publish.yml is itself started by a GITHUB_TOKEN
# workflow_dispatch from deploy.yml, and GitHub does not deliver the next
# workflow_run hop of such a run — the same loss lighthouse-ci.yml and
# runtime-reliability-watch.yml measured in 2026-09. It also required
# conclusion == success, while 17 of the last 20 publishes concluded failure on
# a validator after Pages had already been deployed.
#
# Quota: Google grants 200 publish requests/day (INDEXING_API_DAILY_QUOTA).
# Whichever run opens the quota day may take all of it but TOPUP_RESERVE, which
# is left for the post-publish top-ups of the same day.
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = monitor + indexing; post-publish = indexing top-up only (dispatched by post-deploy-publish.yml)'
        required: false
        default: full
        type: choice
        options: [full, post-publish]
      indexing_max:
        description: 'Max Indexing API notifications this run (empty = 15 for post-publish, daily quota minus the top-up reserve otherwise)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (no issues, no Indexing API notifications)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read
  statuses: write

env:
  # Real Google quota (publish requests per day, per GCP project). Raise it
  # here only after Google approves a higher quota in the Cloud console.
  INDEXING_API_DAILY_QUOTA: '200'
  # Requests the run opening the quota day leaves to the post-publish top-ups
  # (4-5 publishes a day x 15).
  INDEXING_API_TOPUP_RESERVE: '60'

jobs:
  monitor:
    if: github.event_name == 'schedule' || inputs.mode != 'post-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: monitor-gsc-seo
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Firebase SA credentials — monitor will skip GSC checks"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Run GSC Job Indexation Monitor
        # GITHUB_PAT itself is loaded in $GITHUB_ENV by "Load secrets from Remote
        # Config" (Firebase RC, not an Actions secret). The durable re-arm helper
        # uses GH_TOKEN/GITHUB_TOKEN for the repository status and run-list APIs;
        # GITHUB_PAT remains the fallback for monitor-specific APIs.
        env:
          GITHUB_PAT: ${{ env.GITHUB_PAT }}
          # gh CLI (used by scripts/lib/github-issue-creator.mjs for issue creation)
          # only honors GH_TOKEN/GITHUB_TOKEN, never GITHUB_PAT — without this the
          # monitor's issue-creation path was always a silent no-op (PR #3322 review).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--rich-missing-out /tmp/job-rich-missing.json)
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/monitor-gsc-job-indexation.mjs "${ARGS[@]}"

      - name: Hand the pages without Jobs rich result to the indexing job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-rich-missing
          path: /tmp/job-rich-missing.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

  # Owner of the Indexing API ledger (notified URLs + per-day counter), stored
  # in Firestore (scripts/lib/indexing-ledger-store.mjs) — not in the Actions
  # cache, which evicted it before every run from 2026-10-24 to 2026-11-10.
  # The job-level group serializes every writer across scheduled, dispatched
  # and post-publish runs AND fast-publish-article.yml's notify job: pull →
  # submit → push never overlap, and the push is conditioned on the version
  # pulled. A newer pending run may replace an older pending one; nothing is
  # lost, the ledger carries the backlog and the first run of each quota day
  # takes the large share (--max-first-run).
  indexing:
    needs: monitor
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: indexing-api-jobs-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # load-rc-env.mjs has a dependency-free Remote Config path (#4837) and
      # the submitter uses Node built-ins only: no npm install needed.
      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      # GSC_CLIENT_ID/SECRET/REFRESH_TOKEN: the owner OAuth identity, used when
      # the service account is not a Search Console Owner.
      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Fetch the monitor's pages without Jobs rich result
        if: needs.monitor.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: job-rich-missing
          path: /tmp/job-rich-missing

      # No continue-on-error: a ledger that cannot be read must stop the run.
      # Submitting from an empty ledger is exactly the duplicate spend this
      # store removes, and without a pull receipt the push below refuses.
      - name: Pull Indexing API ledger from Firestore
        id: ledger_pull
        run: node scripts/lib/indexing-ledger-store.mjs pull --ledger /tmp/indexing-api-jobs-ledger.json

      - name: Notify job pages to Google Indexing API
        # Exit 1 on configuration/auth errors (invalid ledger, no owner
        # identity, 403); exit 0 on Google's 429 quota stop, which is expected
        # at 200/day. Post-publish: 15. Otherwise: the daily quota minus the
        # top-up reserve. Whichever run opens the quota day takes the large
        # share. A ledger Firestore does not have yet is bootstrapped here.
        # URLs come from the live job sitemaps AND from the active-job dataset
        # the build publishes on the data CDN (jobs-it-index.json +
        # jobs-slug-map.json, ~11 MB brotli over HTTP): the sitemaps only move
        # with a full publish, the offer pages also go live with the section
        # shards. Fetched rather than checked out: data/jobs.json is not
        # tracked, and assembling it needs data/jobs/ (1.4 GB) plus npm ci.
        # The sparse checkout above only has to keep data/canton-*.json and
        # the script's imports (tests/indexing-api-workflow-wiring.test.ts).
        # Dataset unreadable → warning, sitemap URLs only.
        env:
          INPUT_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
          INPUT_MAX: ${{ inputs.indexing_max }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FIRST_RUN_SHARE=$(( INDEXING_API_DAILY_QUOTA - INDEXING_API_TOPUP_RESERVE ))
          if [ -z "$INPUT_MAX" ]; then
            if [ "$INPUT_MODE" = "post-publish" ]; then INPUT_MAX=15; else INPUT_MAX=$FIRST_RUN_SHARE; fi
          fi
          case "$INPUT_MAX" in *[!0-9]*) echo "::error::indexing_max must be an integer"; exit 1 ;; esac
          ARGS=(--max "$INPUT_MAX" --max-first-run "$FIRST_RUN_SHARE" --ledger /tmp/indexing-api-jobs-ledger.json --priority-file /tmp/job-rich-missing/job-rich-missing.json)
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/submit-google-indexing-jobs.js "${ARGS[@]}"

      # always(): reservations made before a failure are real Google requests
      # and must reach the stored counter. Never after a failed pull (the
      # receipt would be missing) and never on a dry run (nothing was sent).
      - name: Push Indexing API ledger to Firestore
        if: always() && steps.ledger_pull.outcome == 'success' && inputs.dry_run != true
        run: node scripts/lib/indexing-ledger-store.mjs push --ledger /tmp/indexing-api-jobs-ledger.json

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
