name: SEO closed-loop health and recovery
# owner: SEO / Platform

# Daily integration check for the five SEO phases.  The specialised monitors
# remain the owners of their own data; this workflow joins their evidence with
# a fresh production sample and applies only the already-protected 404 repair.
# It must never invent content, canonical URLs or redirects from a partial
# analytics response.

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the checks without committing the 404 store or health state'
        required: false
        type: boolean
        default: false
      sample:
        description: 'Deterministic live HTML sample size'
        required: false
        type: string
        default: '80'
      job_sample:
        description: 'Deterministic live JobPosting sample size'
        required: false
        type: string
        default: '30'

concurrency:
  group: seo-health-loop
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Keep the production checkout small.  The runner reads public HTTP
          # sitemaps and committed monitor state; the compat prune uses the
          # shared resolver and canton registry, not the multi-GB job payload.
          sparse-checkout: |
            /*
            !/public/images/
            !/public/data/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/jobs-snapshots-history/
            !/data/jobs-crawler-summaries/
            !/data/orphan-enriched-data/
            !/data/jobs-ai-cache.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON missing; GA4/Cloudflare/RC-backed sources may be unavailable."
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Mint App token for protected pushes and deploy dispatch
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run five-phase SEO health loop
        id: health
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SAMPLE: ${{ inputs.sample || '80' }}
          HEALTH_JOB_SAMPLE: ${{ inputs.job_sample || '30' }}
          HEALTH_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ "$HEALTH_DRY_RUN" = 'true' ]; then
            extra_args+=(--dry-run)
          fi
          node scripts/seo/seo-health-loop.mjs \
            --strict-sources \
            --open-issue \
            --auto-correction \
            --sample="$HEALTH_SAMPLE" \
            --job-sample="$HEALTH_JOB_SAMPLE" \
            "${extra_args[@]}"

      - name: Reconcile 404 compatibility store
        id: compat_reconcile
        if: ${{ inputs.dry_run != true }}
        # The Cloudflare/GSC producers own ingestion.  This step is the
        # deterministic repair: remove duplicates and paths the resolver can
        # no longer map, with strict mode so an unavailable resolver blocks a
        # write instead of silently leaving an invalid committed snapshot.
        run: PRUNE_404_STRICT=1 npx --no-install tsx scripts/prune-404-compat-paths.ts

      - name: Validate compatibility invariant
        id: compat_validation
        if: ${{ inputs.dry_run != true && steps.compat_reconcile.outcome == 'success' }}
        run: npx vitest run tests/search-console-compat.test.ts --reporter=dot

      - name: Save health state before compat push
        id: health_snapshot
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/seo-health-state
          for file in data/seo-health-state.json data/seo-health/history.jsonl; do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/seo-health-state/$(basename "$file")"
            fi
          done

      - name: Commit and push corrected compat shards
        id: compat
        if: ${{ inputs.dry_run != true && steps.compat_validation.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/seo-404-compat
          if git diff --cached --quiet; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'push_exhausted=false' >> "$GITHUB_OUTPUT"
            echo 'No compat changes.'
            exit 0
          fi
          git commit -m 'chore(seo): reconcile 404 compatibility paths'

          # This is a rolling, re-derived set: a missed push is recaptured by
          # the next producer sweep.  Exhaustion therefore warns and lets the
          # health-state commit proceed, but it must not trigger a deploy for
          # a commit that did not reach main.
          set +e
          PUSH_LOG=$(bash scripts/lib/git-push-with-retry.sh \
            --soft-fail-exhausted \
            --in-place-resolver-cmd 'node scripts/lib/resolve-404-compat-conflict.mjs && git add data/seo-404-compat' 2>&1)
          rc=$?
          set -e
          echo "$PUSH_LOG"
          if echo "$PUSH_LOG" | grep -q '::warning::Failed to push after'; then
            echo 'push_exhausted=true' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'push_exhausted=false' >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Drop unsent compat commit after retry exhaustion
        if: ${{ always() && steps.compat.outputs.push_exhausted == 'true' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Restore and persist health state
        id: health_commit
        if: ${{ always() && inputs.dry_run != true && steps.health_snapshot.outcome == 'success' && (steps.compat.outcome == 'success' || steps.compat.outcome == 'skipped') }}
        run: |
          set -euo pipefail
          saved_any=false
          for file in data/seo-health-state.json data/seo-health/history.jsonl; do
            saved="/tmp/seo-health-state/$(basename "$file")"
            if [ -f "$saved" ]; then
              mkdir -p "$(dirname "$file")"
              cp "$saved" "$file"
              saved_any=true
            fi
          done
          if [ "$saved_any" != 'true' ]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'No health state was produced; preserving the health-step failure for the issue reporter.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/seo-health-state.json data/seo-health/history.jsonl
          if git diff --cached --quiet; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'No health-state changes.'
            exit 0
          fi
          git commit -m 'chore(seo): persist closed-loop health state'
          # State/history are single-writer files.  On a rebase conflict,
          # regenerate them from the exact saved observation rather than
          # silently accepting a stale or empty source result.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd 'for file in data/seo-health-state.json data/seo-health/history.jsonl; do saved="/tmp/seo-health-state/$(basename "$file")"; if [ -f "$saved" ]; then mkdir -p "$(dirname "$file")"; cp "$saved" "$file"; fi; done; git add data/seo-health-state.json data/seo-health/history.jsonl'
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

      - name: Re-mint App token before deploy dispatch
        if: ${{ steps.compat.outcome == 'success' && steps.compat.outputs.has_changes == 'true' }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Trigger deploy for live compat correction
        id: deploy
        if: ${{ steps.compat.outcome == 'success' && steps.compat.outputs.has_changes == 'true' && steps.compat.outputs.push_exhausted == 'false' && (steps.health_commit.outcome == 'success' || steps.health_commit.outcome == 'skipped') }}
        env:
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Only the resolver-verified compat shards change the built site.
        # Health reports/state never dispatch a production build by themselves.
        run: |
          set -euo pipefail
          deploy_token="${GITHUB_PAT:-${GH_TOKEN:-}}"
          if [ -z "$deploy_token" ]; then
            echo '::error::No deploy token available; refusing to record an un-deployed compat correction.'
            exit 1
          fi
          dispatch_output="$(mktemp)"
          trap 'rm -f "$dispatch_output"' EXIT
          GITHUB_PAT="$deploy_token" \
            GITHUB_OUTPUT="$dispatch_output" \
            EXPECTED_SHA="$(git rev-parse HEAD)" \
            bash scripts/lib/trigger-deploy.sh
          if ! grep -qx 'dispatch_sent=true' "$dispatch_output"; then
            echo '::error::Deploy trigger returned without dispatch_sent=true; refusing a false-green correction.'
            exit 1
          fi

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-health-${{ github.run_id }}
          path: data/seo-health/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Report workflow failure
        if: ${{ always() && inputs.dry_run != true && (steps.health.outcome == 'failure' || steps.compat_reconcile.outcome == 'failure' || steps.compat_validation.outcome == 'failure' || steps.compat.outcome == 'failure' || steps.health_commit.outcome == 'failure' || steps.deploy.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title 'Workflow Failure: SEO closed-loop health and recovery' \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}
          **Health step:** ${{ steps.health.outcome }}
          **Compat reconcile:** ${{ steps.compat_reconcile.outcome }}
          **Compat validation:** ${{ steps.compat_validation.outcome }}" \
            --priority 2 \
            --label Bug \
            --workflow '${{ github.workflow }}'

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Fail when the health loop has an actionable finding
        if: ${{ steps.health.outcome == 'failure' }}
        run: exit 1
