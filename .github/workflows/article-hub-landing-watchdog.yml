name: Article Hub Landing Watchdog

# The article-hub landings are the entry surface for every article the corpus
# publishes. Two producers can write them and, between 2026-07-29 and today,
# neither wrote `/articoli-svizzera/`: the site is no longer on that path's
# serving route (`scripts/lib/deploy-shard-sections.sh` excludes both article
# sections from the shard push), and the corpus refresher could only swap a
# grid that was already there. Nothing failed. 617 articles sat behind 9 KB of
# copy for a week.
#
# `ensureArticleHubCards` makes that state unreachable in code and
# `tests/build-emit-skip-gate.test.ts` pins it in the source — but neither
# watches what is actually served. This does, from outside, so the next handoff
# that leaves a path unowned surfaces as an issue instead of as silence.
#
# SCOPE — the eight handed-off landings AND their eight /tutti/ archives,
# derived from the Worker's own SECTION_ROUTES via EXTERNALLY_SERVED_SECTIONS.
#
# The archives used to be out of scope, on the stated grounds that they "have
# their own publisher-side validation in nanako's fast-publish workflow". They
# did not. Issue #5270: `publish-article-fast.mjs` ran the CDN offload BEFORE
# re-rendering the archive, so every archive page shipped 9 same-origin
# `/assets/…` refs that 404 — no CSS, no SPA bundle, no AdSense loader — while
# still answering 200. The landing was unaffected (it is refreshed by swapping
# a grid inside already-offloaded HTML) which is precisely why watching only
# the landing saw nothing.
#
# Worse, the ordering lives in TWO copies of that script — this repo's and
# nanako's — and no mirror carries `scripts/`. #5271 fixed this repo's copy on
# 2026-08-06 and the live archive then alternated healthy/broken depending on
# which repo had published last. A source-order test in either repo covers half
# the publishes; this probe covers the served bytes, which is all of them.
#
# Article DETAIL pages remain out of scope.

on:
  schedule:
    # Twice a day, offset from the corpus's publish windows so a run lands
    # after them rather than during. Cheap: 21 HTTP GETs — 3 API documents,
    # the 2 section topic sitemaps, and the 8 landings with their 8 /tutti/
    # archives.
    - cron: '40 6,18 * * *'
  workflow_dispatch: {}
  # A scheduled probe can run before the six-hour rerender window catches a
  # newly published article. Re-run the same probe after that writer finishes:
  # a transient stale page gets repaired and verified without opening a false
  # recurrence issue.
  workflow_run:
    workflows: ["Rerender Article Hubs"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  watchdog:
    # `workflow_run` cannot filter on the completed run's display title in the
    # trigger declaration. Keep the trigger broad for delivery, but only run a
    # probe for the exact recovery-shaped dispatch that this watchdog creates;
    # unrelated manual, parity, and parallel rerenders stay dormant.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       startsWith(github.event.workflow_run.display_title, 'Rerender Article Hubs [watchdog-'))
    runs-on: ubuntu-latest
    # The probe reads the same served surfaces that rerender-article-hubs writes.
    # This lock belongs only to the probe job. The recovery orchestrator below
    # must be able to wait for the child without holding the writer's lock.
    concurrency:
      group: article-hub-surfaces
      cancel-in-progress: false
    timeout-minutes: 10
    outputs:
      health_outcome: ${{ steps.health.outcome }}
      health_summary: ${{ steps.health.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The job-level filter above rejects unrelated workflow_run events. Fetch
      # the event's run once more before probing so the accepted event is also
      # authoritative about the exact completed workflow, dispatch event, and
      # correlation title that woke this job.
      - name: Validate completed recovery run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          if [[ ! "$TRIGGER_TITLE" =~ ^Rerender\ Article\ Hubs\ \[(watchdog-[1-9][0-9]*-[1-9][0-9]*)\]$ ]]; then
            echo "::error::workflow_run title is not a watchdog recovery: $TRIGGER_TITLE"
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID")"
          jq -e \
            --arg expected_id "$TRIGGER_RUN_ID" \
            --arg expected_title "$TRIGGER_TITLE" \
            '(.id | tostring) == $expected_id
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .display_title == $expected_title' \
            <<<"$run_json" >/dev/null

      # No `npm ci`: the probe imports four first-party ESM modules and uses
      # global fetch, nothing else. Installing 1.4 GB of node_modules to make
      # twenty-one HTTP requests would be the slowest part of the run by an
      # order of magnitude.
      #
      # That is also why the renderer-drift check (#5432) reads its expectation
      # from the published `sitemap-topics-<section>.xml` rather than
      # recomputing it with the engine's `computeEligibleTopicKeys`. The
      # obstacle is NOT the install — `npx -y tsx@4.23.15` runs TypeScript here with
      # no repo install at all, as `rerender-article-corpus.yml` does. It is
      # that recomputing answers a different question: what THIS checkout would
      # emit, from the site repo's copy of the corpus, instead of what the site
      # published. Two extra GETs compare two independently-produced surfaces,
      # which is the only comparison that can see one of them go stale.
      - name: Probe the article-hub landings
        id: health
        # Keep the measured failure available to the recovery job. The final
        # verdict below restores a red workflow_run job after its post-rerender
        # probe, while scheduled/manual failures enter bounded recovery first.
        continue-on-error: true
        run: node scripts/check-article-hub-landings.mjs

      # Degraded → open (or comment on) the canonical issue. The helper dedups
      # on the first 60 chars of the STABLE title, so consecutive degraded runs
      # comment on the same issue instead of spawning duplicates. A scheduled
      # failure that dispatched recovery waits for the workflow_run probe; if
      # dispatch fails, or the post-rerender probe still fails, this opens it.
      - name: Open / dedup degraded issue
        if: >-
          always() &&
          github.event_name == 'workflow_run' &&
          steps.health.outcome == 'failure' &&
          github.event.workflow_run.event == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Article hub landing degraded: missing grid or stale article set" \
            --description "## Article-hub landing watchdog tripped

          One or more of the eight handed-off article-hub landings — or one of their
          eight \`/tutti/\` archives — is degraded: no \`ssg-article-grid\` marker, too few
          cards, it no longer links the newest article the corpus published, it still
          carries same-origin \`/assets/\` references, or it no longer links the topic
          hubs its own section sitemap announces.

          ### Probe report
          \`\`\`
          ${HEALTH_SUMMARY}
          \`\`\`

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### What to check
          - **no marker** → the page has no writer. The site is not on the serving path for these
            prefixes (\`scripts/lib/deploy-shard-sections.sh\`), so only the corpus can fix it:
            \`refresh-hub-landing.mjs\` must reach \`ensureArticleHubCards\`, which CREATES the grid
            when it is absent. Check nanako's \`fast-publish-article\` run log for
            \`[hub-landing] … no article grid\`.
          - **stale** → the corpus refresher is skipping the page. Its per-page fail-closed reasons
            are logged verbatim (meta coverage, image CDN leak, unbalanced grid).
          - **HTTP != 200** → shard or Worker routing problem, not a content one.
          - **same-origin \`/assets/\` refs** → that page was written AFTER the CDN offload
            instead of before it, so its \`/assets/…\` strings were never rewritten and every
            one of them 404s: the page renders with no CSS, no SPA bundle and no AdSense
            loader while still answering 200 (issue #5270). Two publishers can cause it and
            they keep SEPARATE copies of \`scripts/publish-article-fast.mjs\` — this repo's and
            nanako's — because no mirror carries \`scripts/\`. Check which one pushed last
            (\`gh api repos/valerielinc-ops/frontaliere-<section>-<loc>/commits\`: the fast-push
            message carries the publisher's commit SHA) and fix the ordering in THAT copy:
            \`renderArticleHubPages\` must run BEFORE the
            \`offload-generated-images-cdn.mjs\` subprocess.
          - **announced topic-hub anchors missing** → RENDERER drift, not corpus drift
            (issue #5432). The archive is served by output older than #5422/#5423, so
            every URL in \`sitemap-topics-<section>.xml\` is unreachable from it and
            \`audit:max-bfs-depth\` goes red saying only \`unreachable\`. An archive is
            re-rendered ONLY as a side effect of publishing an article into its section,
            so a section that has stopped publishing stays on the old renderer
            indefinitely — every other check on this page keeps passing meanwhile.
            Re-render it: \`gh workflow run fast-publish-article.yml --repo
            nanakokyobashi-rgb/frontaliere-articles --ref main -f article_id=<an id of
            that section> -f section=<section> -f dry_run=false\` (\`dry_run\` defaults to
            true, and \`section\` is required whenever \`article_id\` is given).
          - **anchors the sitemap does not announce** → the opposite direction: the
            archive links topic hubs the site has not published. Check whether the
            deploy that owns \`public/sitemap-topics-<section>.xml\` is the stale side.

          This issue auto-resolves on the next watchdog run once the landings are healthy again." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # The body above PROMISED an auto-resolve that did not exist (#5437: the
      # dangerous class — a title nobody could ever close).
      - name: Resolve degraded issue on green
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Article hub landing degraded: missing grid or stale article set" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # A workflow_run probe is the post-rerender verification. Keep its job
      # fail-closed so a completed writer cannot hide a still-degraded surface.
      - name: Set post-rerender verdict
        if: always() && github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          [ "${{ steps.health.outcome }}" = 'success' ]

  recovery:
    needs: watchdog
    if: >-
      always() &&
      needs.watchdog.result == 'success' &&
      needs.watchdog.outputs.health_outcome == 'failure' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    # The rerender child has a 30-minute timeout; leave bounded room for API
    # discovery and the terminal status poll without holding the probe lock.
    timeout-minutes: 40
    steps:
      # The recovery job has no checkout by design for the API-only waiter, but
      # its failure reporter is a first-party module. Check out only that
      # standalone transport artifact before the reporter step; keeping this
      # sparse avoids materialising the site's data and public trees.
      - name: Checkout failure reporter
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/lib/github-issue-creator.mjs
          sparse-checkout-cone-mode: false

      # This job deliberately has no `article-hub-surfaces` concurrency group:
      # the probe job released that group before this waiter started. Holding it
      # here would queue the child rerender behind the waiter forever.
      - name: Request and await exact hub rerender recovery
        id: recovery
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RECOVERY_REQUEST_ID: watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          RECOVERY_TIMEOUT_SECONDS: '2100'
        run: |
          set -euo pipefail
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rerender-article-hubs.yml/dispatches" \
            -f ref=main \
            -f 'inputs[section]=all' \
            -f 'inputs[dry_run]=false' \
            -f "inputs[recovery_request_id]=$RECOVERY_REQUEST_ID"

          deadline=$(( $(date +%s) + RECOVERY_TIMEOUT_SECONDS ))
          recovery_run_id=''
          while [ "$(date +%s)" -lt "$deadline" ]; do
            runs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/rerender-article-hubs.yml/runs" \
              -f event=workflow_dispatch -f per_page=100)"
            recovery_run_id="$(jq -r --arg request "$RECOVERY_REQUEST_ID" --arg started "$dispatch_started_at" '
              [.workflow_runs[]
                | select(.event == "workflow_dispatch")
                | select(.display_title == ("Rerender Article Hubs [" + $request + "]"))
                | select(.created_at >= $started)]
              | sort_by(.created_at)
              | .[0].id // empty
            ' <<<"$runs_json")"
            [ -n "$recovery_run_id" ] && break
            sleep 10
          done
          if [ -z "$recovery_run_id" ]; then
            echo "::error::exact rerender recovery run was not observed within ${RECOVERY_TIMEOUT_SECONDS}s"
            exit 1
          fi
          echo "recovery_run_id=$recovery_run_id" >> "$GITHUB_OUTPUT"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id")"
            status="$(jq -r '.status // empty' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            if [ "$status" = 'completed' ]; then
              if [ "$conclusion" = 'success' ]; then
                echo "exact rerender recovery $recovery_run_id completed successfully"
                exit 0
              fi
              echo "::error::exact rerender recovery $recovery_run_id completed with conclusion=$conclusion"
              exit 1
            fi
            sleep 15
          done
          echo "::error::exact rerender recovery $recovery_run_id did not complete within ${RECOVERY_TIMEOUT_SECONDS}s"
          exit 1

      - name: Set recovery verdict
        if: always()
        run: |
          set -euo pipefail
          [ "${{ steps.recovery.outcome }}" = 'success' ]

      - name: Open / dedup degraded issue when recovery is not verified
        if: always() && steps.recovery.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SUMMARY: ${{ needs.watchdog.outputs.health_summary }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Article hub landing degraded: missing grid or stale article set" \
            --description "The article-hub watchdog found degraded served pages, but did not observe its exact recovery rerender complete successfully. An unrelated or manually completed rerender is not accepted as recovery.

          ### Probe report
          \`\`\`
          ${HEALTH_SUMMARY}
          \`\`\`

          **Watchdog run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the recovery dispatch and the rerender workflow before treating another completed rerender as proof of repair." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
