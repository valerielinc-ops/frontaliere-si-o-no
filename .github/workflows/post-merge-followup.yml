name: Post-merge follow-up triage

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to backfill follow-up triage for (must be already-merged + same-owner author).'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  followup:
    # Trigger condizioni:
    # - PR merged (non solo chiuso).
    # - Autore PR = repo owner (skip dependabot/forks).
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    # Lo scope è leggere PR body `## Non implementato` + reviewer 🟡/❓ e creare
    # issue con label `follow-up` quando il filtro scopo passa. Vedi FOLLOWUP.md.
    #
    # workflow_dispatch path (closes #774): backfill manuale di PR già mergiate
    # ma non triagiate al momento del merge originario (es. PR vecchie pre
    # post-merge-followup adoption). Le condizioni "merged + same-owner"
    # vengono ri-verificate dentro il claude prompt sul PR risolto via API,
    # quindi qui basta gate sul fatto che dispatch sia volontario.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'valerielinc-ops') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run Claude follow-up triage
        id: followup
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull-request event passes the closed PR's number directly;
          # workflow_dispatch passes it via the `pr_number` input.
          # Title is fetched inside the prompt to keep the dispatch path
          # self-contained (no need to pre-resolve via API in the env block).
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: "--max-turns 15 --model claude-sonnet-4-6 --allowedTools 'Bash(gh:*),Read,Grep,Glob'"
          prompt: |
            Triage automatico follow-up per PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }} (${{ github.event_name }}).

            **Event-aware bootstrap:**
            - Se `EVENT_NAME=pull_request`, la PR è appena stata chiusa+mergiata (auto-triage); `PR_TITLE` è già esposta come env var.
            - Se `EVENT_NAME=workflow_dispatch`, la PR è un BACKFILL manuale di una PR vecchia. Ri-verifica che:
              - `gh pr view $PR_NUMBER --json state,mergedAt,user --jq '.mergedAt'` sia non-null (PR mergiata)
              - `gh pr view $PR_NUMBER --json user --jq '.user.login'` == `valerielinc-ops` (same-owner gate)
              - Se uno dei due fallisce → emetti `## Post-merge follow-up triage (backfill skipped): PR not eligible (not merged or different author)` e termina.

            **Bootstrap:**
            1. Leggi `FOLLOWUP.md` — contratto operativo completo (parse rules, filtro scopo, dedup, issue format, closing comment).
            2. Leggi `REVIEW.md → "Scopo progetto"` per il filtro funnel.
            3. Carica:
               - `gh pr view $PR_NUMBER --json number,title,body,mergedAt,mergeCommit,url`
               - `gh api repos/$REPO/pulls/$PR_NUMBER/reviews`
               - `gh issue list --label follow-up --state all --json number,title,body --limit 50`

            **Esegui workflow come specificato in FOLLOWUP.md:**
            - Parse PR body `## Non implementato` (skip motivi `out of scope` / `posposto`).
            - Parse reviewer bot review più recente: estrai 🟡 nit, ❓ q, `## Adversarial check` bullets. Skip 🔴 (già fixed o droppato consapevolmente pre-merge).
            - Filtro scopo (`REVIEW.md`): item passa se impatta monetizzazione / traffico / funnel.
            - Dedup vs issue `follow-up` esistenti (titolo >70% similar → skip).
            - **In-flight PR overlap** (anti self-flag): escludi item su file che una PR aperta sta già modificando (`gh pr list --state open` + `gh pr diff <n> --name-only`) → log "in-flight in PR #N". Vedi FOLLOWUP.md § Dedup.
            - Crea issue per candidate validi, max 10/PR. Label: `follow-up` + UNO funnel-* se inferibile.
            - **Supersede detection** (FOLLOWUP.md § Supersede detection): per le issue `follow-up` aperte che citano un file toccato da questa PR (`gh pr diff $PR_NUMBER --name-only`), posta UN commento `🔗 Possibile supersede` (idempotente). **Mai chiudere** — solo segnalazione; chiude solo l'autore con `Closes #N`.
            - Posta `## Post-merge follow-up triage` summary commento sulla PR.

            **Constraint:**
            - Read-only eccetto `gh issue create`, `gh pr comment`, `gh issue comment` (solo Supersede detection).
            - Mai modificare PR label/state/title.
            - Mai chiudere/riaprire issue (nemmeno le superseded — solo commento).
            - Incerto sul filtro → crea con rationale "needs triage".
            - Zero candidate → `## Post-merge follow-up triage: zero outstanding items.` e termina.

      - name: Claude usage metrics
        if: always()
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.followup.outputs.execution_file }}" "post-merge-followup"
