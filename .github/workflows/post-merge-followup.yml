name: Post-merge follow-up triage

# SCHEDULED-BATCH (era pull_request:[closed] per-PR). Una sola sessione Claude ogni
# ~3h triagia TUTTE le PR mergiate dall'owner dalla finestra precedente, invece di
# UNA run per ogni merge. Il ~60-80% delle run per-PR creava zero issue → spreco
# sulla quota Max OAuth CONDIVISA (AGENTS.md § frugalità — "più batched"). Sicurezza
# garantita dal watermark-su-SUCCESSO + idempotenza (vedi collect-followup-batch.mjs):
# una finestra non viene mai persa, al più ri-triagiata (no-op grazie all'idempotenza).
on:
  schedule:
    - cron: '0 */3 * * *' # ogni 3h
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to backfill follow-up triage for (must be already-merged + same-owner author).'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # collect-followup-batch.mjs legge `gh run list` per il watermark

concurrency:
  # Questo è il mutex condiviso con followup-reconcile.yml e followup-drainer.yml:
  # gate, reconciler e queue writer possono toccare lo stesso bucket daily. La chiave
  # è repo-scoped (non workflow-scoped), e cancel:false conserva la run già partita.
  group: followup-daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  followup:
    # Trigger:
    # - `schedule`: batch automatico ogni 3h delle PR mergiate dall'owner
    #   (`valerielinc-ops` / `frontaliere-automation[bot]`) — il filtro autore vive
    #   ora in `collect-followup-batch.mjs`, non più nell'`if:` del job.
    # - `workflow_dispatch` (closes #774): backfill manuale di UNA PR già mergiata ma
    #   non triagiata (es. PR vecchie pre-adozione). Volontario → nessun gate qui; le
    #   condizioni "merged + same-owner" sono ri-verificate dentro il prompt Claude.
    # Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    # Scope: leggere PR body `## Non implementato` + reviewer 🟡/❓ e creare issue
    # `follow-up` quando il filtro scopo passa. Vedi FOLLOWUP.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 30→40 (2026-07-17): headroom per il cap turni dinamico alzato (max 60→80).
    timeout-minutes: 40 # batch di N PR in una sessione (era 10 per una sola PR)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Collect-batch (zero-Claude, deterministico). Produce la lista FINALE di PR da
      # triagiare:
      #  - schedule → watermark (ultima run di SUCCESSO, fallback now-6h) → PR mergiate
      #    dall'owner dalla finestra → scarta le già-triagiate (commento idempotenza) →
      #    applica i DUE gate per-PR esistenti (grandchild-suppression + no-op pre-gate,
      #    invocati come subprocess: risparmio preservato anche in batch).
      #  - workflow_dispatch → batch = [pr_number] diretto (backfill volontario,
      #    bypass gate: il prompt Claude ri-verifica eligibility).
      # PROCEED-SAFE: un gate per-PR inconcludente → PR inclusa nel batch (mai persa);
      # errori delle sorgenti di raccolta → collection_ok=false e run rossa.
      # Se il batch supera il limite della sessione provider, il collector emette
      # solo il prefisso e imposta anch'esso collection_ok=false: il prefisso viene
      # triagiato, poi il verifier finale rende la run rossa così il watermark di
      # successo non avanza. La run successiva ricopre la stessa finestra e
      # l'idempotenza salta il prefisso già persistito, lasciando il residuo.
      # Emette collection_ok, batch_prs (csv), batch_count, max_turns e daily_key
      # (Europe/Zurich). collection_ok è distinto dal batch vuoto: un errore di
      # raccolta non può essere interpretato come "nessuna PR".
      # Vedi scripts/ci/collect-followup-batch.mjs.
      - name: Collect follow-up batch
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="$INPUT_PR_NUMBER"
            echo "::notice::Backfill dispatch per PR #${PR} (eligibility ri-verificata nel prompt Claude)."
            {
              echo "batch_prs=${PR}"
              echo "batch_count=1"
              echo "collection_ok=true"
              echo "max_turns=34" # = maxTurnsFor(1) — tenere allineato a collect-followup-batch.mjs
              echo "daily_key=$(TZ=Europe/Zurich date +%F)"
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/collect-followup-batch.mjs
          fi

      # Sibling della stessa classe misurata su issue-fix.yml (2026-08-05). Il
      # tracker #1951 segnalava questo workflow al 38% di failure-rate: scaricati
      # i log delle run fallite, sono **tutte HTTP 429** — quota Max condivisa
      # esaurita, esattamente come le 60/61 di issue-fix. Claude non esegue (0
      # turni, $0) e la run muore rossa.
      #
      # Qui il RECUPERO era già corretto e NON va toccato: il watermark avanza
      # solo sulle run di SUCCESSO, quindi una run fallita lascia la finestra
      # indietro e la successiva (≤3h) la ri-copre — nessun contatore di
      # Il beacon viene conservato per telemetria e diagnosi della quota Claude;
      # non e' piu' un gate di esecuzione, perche' Codex e' il provider primario.
      - name: Pre-flight — quota telemetry (Codex primary)
        id: quota
        # Il controllo è best-effort: un guasto infra non deve sopprimere il
        # triage, che resta affidato al provider primario e al suo fallback.
        continue-on-error: true
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CODEX_FALLBACK_MODE: '1'
        # Senza ISSUE_NUMBER lo script è in sola RILEVAZIONE: legge il beacon
        # `<!-- QUOTA_RESETS_AT: … -->` lasciato sulle issue della coda issue-fix
        # (stessa quota, stesso account) e non modifica nessuna label.
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Setup Headroom compression proxy
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        uses: ./.github/actions/setup-headroom

      # Il beacon della quota Claude resta telemetria: Codex e' il provider primario,
      # quindi una quota Claude aperta non puo' saltare il batch.

      # Il follow-up puo' trovare un file che appartiene al producer del corpus,
      # anche quando la PR sorgente e' nel sito. In quel caso l'issue deve nascere
      # su nanako: il GITHUB_TOKEN del sito e' scoped al solo repo corrente.
      # Carichiamo il PAT Valerie cross-repo solo quando esiste davvero un batch, cosi'
      # una finestra vuota non paga ne' Firebase ne' il caricamento RC.

      - name: Prepare Firebase credentials for follow-up routing
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON assente: routing verso nanako non disponibile"
          fi

      - name: Load cross-repo follow-up credentials
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Prefetch zero-Claude (token-lever, stesso bundle di tests.yml/pr-review-loop):
      # il prompt sotto rifà, per OGNI PR del batch, `gh pr view N --json ...` + `gh api
      # .../reviews`, e il check "In-flight PR overlap" rifà `gh pr list --state open` +
      # `gh pr diff <n> --name-only` per ciascuna PR aperta. Con `batch_count` PR per run
      # è il moltiplicatore più alto del repo: ogni PR extra nel batch è un turno in più
      # di puro setup, che qui è già zero-provider perché `batch_prs` è noto PRIMA che
      # l'agente parta. Fail-open: un fetch fallito lascia la sezione vuota/`{}` e il
      # prompt sa rifare la chiamata diretta se il bundle risulta incompleto.
      - name: Prefetch follow-up batch context (zero-Claude)
        id: batchctx
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          CTX_DIR: ${{ runner.temp }}/followup-ctx
        run: |
          set -uo pipefail
          mkdir -p "$CTX_DIR"
          : > "$CTX_DIR/prs.md"
          IFS=',' read -ra NUMS <<< "$BATCH_PRS"
          for n in "${NUMS[@]}"; do
            [ -z "$n" ] && continue
            {
              echo "### PR #$n"
              echo '```json'
              gh pr view "$n" --repo "$REPO" --json number,title,body,mergedAt,mergeCommit,url,author 2>/dev/null || echo '{}'
              echo '```'
              echo "Reviews:"
              echo '```json'
              gh api "repos/$REPO/pulls/$n/reviews" 2>/dev/null || echo '[]'
              echo '```'
              echo
            } >> "$CTX_DIR/prs.md"
          done

          # In-flight PR overlap (line "In-flight PR overlap" sotto): elenco PR aperte +
          # i loro file, condiviso da TUTTE le PR del batch (non per-PR).
          gh pr list --repo "$REPO" --state open --limit 100 --json number,title,headRefName \
            > "$CTX_DIR/open-prs.json" 2>/dev/null || echo '[]' > "$CTX_DIR/open-prs.json"
          : > "$CTX_DIR/open-pr-files.txt"
          for n in $(jq -r '.[].number' "$CTX_DIR/open-prs.json" 2>/dev/null || true); do
            echo "### PR #$n" >> "$CTX_DIR/open-pr-files.txt"
            gh pr diff "$n" --repo "$REPO" --name-only 2>/dev/null >> "$CTX_DIR/open-pr-files.txt" || true
            echo >> "$CTX_DIR/open-pr-files.txt"
          done

          {
            echo "# Post-merge follow-up batch bundle"
            echo
            echo "## Per-PR metadata + reviews (batch: $BATCH_PRS)"
            cat "$CTX_DIR/prs.md"
            echo
            echo "## Open PRs (per il check 'In-flight PR overlap')"
            cat "$CTX_DIR/open-prs.json"
            echo
            echo "## Open PR changed files"
            cat "$CTX_DIR/open-pr-files.txt"
          } > "$CTX_DIR/followup-bundle.md"
          echo "Prefetched follow-up batch context in $CTX_DIR:"
          ls -la "$CTX_DIR"

      - name: Run Claude follow-up triage (batch)
        # Tetto sullo step: senza, l'unico limite era il cap del job
        # (40min) e la run ci moriva `cancelled` — che NON fa scattare
        # nessun `if: failure()` e si vede solo dallo scan periodico
        # (`scripts/ci/scan-job-timeouts.mjs`). Stessa classe di #7310.
        # 32min = cap del job meno il setup pre-provider misurato (~98s
        # sulle ultime run) e una coda per gli step `if: always()`.
        timeout-minutes: 32
        id: followup
        # Gira SOLO se il batch ha almeno una PR. Per le altre run (finestra vuota /
        # tutte già-triagiate / tutte scartate dai gate) la sessione del provider è
        # interamente saltata.
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        uses: ./.github/actions/claude-codex-fallback
        # The shared action runs one Codex subscription attempt first and invokes
        # Claude only when the Codex primary does not complete successfully.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          BATCH_COUNT: ${{ steps.collect.outputs.batch_count }}
          TRIAGE_DAILY_KEY: ${{ steps.collect.outputs.daily_key }}
          REPO: ${{ github.repository }}
          GITHUB_PAT: ${{ env.GITHUB_PAT }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `allowed_non_write_users` (sotto) funziona SOLO con `github_token` esplicito,
          # non con la sola GitHub App auth di `claude_code_oauth_token` (docs/security.md
          # anthropics/claude-code-action: "Only works when github_token is provided as
          # input"). Senza questo il bypass del gate write-access è un no-op silenzioso e
          # la run continua a fallire con lo stesso errore che questo file dichiara di
          # risolvere (trovato in review PR #3182). Token auto-generato, scope limitato ai
          # `permissions:` del job (pull-requests/issues write), scade a fine job — NON un
          # PAT statico.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          codex_github_token: ${{ secrets.GITHUB_TOKEN }}
          # The corpus PAT is a separate host-side bridge scope. It is never
          # included in the Codex child environment and is accepted only for
          # nanakokyobashi-rgb/frontaliere-articles issue operations.
          codex_corpus_github_token: ${{ env.GITHUB_PAT }}
          # Il merge che alimenta questo workflow è fatto da automation interna con DUE
          # actor bot distinti — entrambi vanno in whitelist o claude-code-action aborta
          # "Workflow initiated by non-human actor":
          #  - `frontaliere-automation[bot]`: actor del path PRIMARIO di cascade
          #    post-LGTM (`auto-merge-on-lgtm.yml` mergia con APP_TOKEN). CORREZIONE
          #    2026-07-01: l'assunzione "lo schedule gira come github-actions[bot]" era
          #    sbagliata — `triggering_actor` osservato sui run schedulati è
          #    `frontaliere-automation[bot]` (ultimo autore del commit che ha introdotto
          #    il cron, PR #3157). Manteniamo comunque la whitelist anche per il path
          #    workflow_dispatch self-invocato e per simmetria coi sibling (issue-fix).
          #  - `github-actions[bot]`: fallback per eventuali dispatch manuali via UI.
          # `claude[bot]` per simmetria coi sibling. Mai `*`.
          allowed_bots: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          # `allowed_bots` bypassa solo il gate "non-human actor" — claude-code-action fa
          # un secondo check SEPARATO ("does the actor have write access") via l'API
          # collaborator-permission, che una GitHub App bot NON supera (non è un
          # collaborator classico anche se ha accesso reale via installation). Root
          # cause della run schedulata che falliva 100% dal merge di PR #3157 con "User
          # does not have write access on this repository" (turns=0, $0 — falliva PRIMA
          # di invocare Claude, zero triage creato da allora). Stessi 3 nomi di
          # allowed_bots.
          allowed_non_write_users: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          show_full_output: true
          # max-turns DINAMICO = min(26 + 8*batch_count, 80), floor 26 (era
          # min(20+6n,60); bump fleet-wide 2026-07-17, owner). AGENTS.md vieta di
          # ABBASSARE i turni di post-merge-followup (15→20
          # fu un fix di `error_max_turns` su PR perse); qui processiamo N PR in una
          # sessione → vanno ALZATI in proporzione, mai sotto il floor. Modello →
          # claude-opus-5 (owner 2026-09-03: opus a effort medium, mai claude-sonnet-4-6).
          # Se una sessione satura il cap (batch grande) → error_max_turns → run NON
          # success → watermark non avanza → la prossima run schedulata ri-copre la
          # finestra; l'idempotenza salta le PR già commentate, riprende le restanti.
          # 2026-07-02: ROLLBACK di `--dangerously-skip-permissions` (adottato la
          # mattina stessa) — issue #3269: run schedulati/workflow_dispatch (questo
          # workflow gira su `schedule`) risolvono `permissionMode` a "default"
          # nonostante il flag, bloccando quasi ogni Bash con "requires approval"
          # (confermato sul run 28594653701 di oggi, 13:43Z: 36 blocchi, zero
          # comment postato). pr-review-loop.yml (trigger `workflow_run`) e
          # issue-fix.yml (trigger `issues`) invece OTTENGONO bypassPermissions
          # regolarmente con la stessa config — il pattern correla con
          # l'event_name del trigger (schedule/workflow_dispatch → sempre bloccato,
          # anche con actor umano), non con settings/claude_args. Torniamo allo
          # scoped `--allowedTools` precedente (problema noto ma minore: rifiuta
          # a volte sintassi shell non staticamente analizzabile, non blocca TUTTO).
          claude_args: "--effort medium --max-turns ${{ steps.collect.outputs.max_turns }} --model claude-opus-5 --allowedTools 'Bash(gh:*),Read,Grep,Glob'"
          prompt: |
            Triage automatico follow-up in BATCH (${{ github.event_name }}).
            PR da processare (CSV): ${{ steps.collect.outputs.batch_prs }}
            Conteggio: ${{ steps.collect.outputs.batch_count }}
            Daily key (Europe/Zurich, solo se la triage run riesce): ${{ steps.collect.outputs.daily_key }}

            Itera su OGNI PR del batch ed esegui il workflow FOLLOWUP.md per ciascuna, in
            modo INDIPENDENTE: un errore su una PR non deve impedire di processare le altre.
            I finding validi non diventano issue per-PR: vengono prima raccolti e poi
            raggruppati per repository target nel bucket giornaliero della chiave sopra.

            **Bootstrap (UNA volta, condiviso per TUTTO il batch — non ri-leggere per ogni PR):**
            1. Leggi `FOLLOWUP.md` — contratto operativo completo (parse rules, filtro scopo, dedup, issue format, closing comment).
            2. Leggi `REVIEW.md → "Scopo progetto"` per il filtro funnel.
            3. `gh issue list --label follow-up --state all --json number,title --limit 300` (SOLO `number,title`: il bulk overview serve per la vista d'insieme; il dedup vero è item-level e il body va letto solo per i bucket daily candidati). Riusa questa lista per il dedup su tutte le PR del batch.
            4. Il contesto per-PR del batch è già prefetchato (zero-Claude, token-lever) in `${{ runner.temp }}/followup-ctx/followup-bundle.md`: leggilo con `Read` — contiene, per ciascuna PR #N del batch, `gh pr view` (number/title/body/mergedAt/mergeCommit/url/author) + le review, e l'elenco delle PR aperte con i rispettivi file (per l'In-flight PR overlap sotto). Non ripetere queste chiamate per-PR a meno che la sezione della PR risulti vuota/incompleta nel bundle.

            **Protocollo bucket giornaliero (vincolante):**
            - La chiave è `${{ steps.collect.outputs.daily_key }}` in `Europe/Zurich`, derivata dal giorno della triage riuscita, MAI da `mergedAt`. Lo stesso retry può quindi raccogliere la finestra arretrata nello stesso bucket della run.
            - Dopo aver applicato tutti i filtri esistenti, determina il repository target di ogni item e raggruppa per `(daily_key, target repository)`: sito e corpus sono issue separate. Il titolo canonico è `follow-up(daily:YYYY-MM-DD): N item — owner/repo`.
            - Cerca prima un issue aperto con quella chiave e quel repository. Se esiste, rileggi il body immediatamente prima dell'append; confronta la baseline (o una hash), ricostruisci l'append dalla lettura nuova su divergenza e non sovrascrivere contenuto concorrente. Se trovi un bucket `collecting` storico che contiene una PR della finestra, riusa quella chiave/titolo anche se il retry è entrato nel giorno successivo: mai sdoppiare la finestra. Se non esiste, crea UNA sola issue per gruppo con `State: collecting`; non aggiungere `agent:fix` né `agent:fix-queued` durante la raccolta.
            - Ogni item deve avere un ID stabile `FU-YYYY-MM-DD-NNN`, assegnato una sola volta, e i campi `Target repository`, `Target file`, `Original text`, `Suggested action`, `Acceptance token`, `Sources`. Deduplica col fingerprint `target repository + target file + token/azione normalizzata`; su match aggiungi la PR alla riga `Sources`, non un secondo item.
            - Il body resta `State: collecting` finché tutti i chunk seriali del batch sono conclusi. Non troncare mai il set per un cap “max 10”: il cap vale solo per chunk/sessione. Un errore lascia il bucket collecting e la finestra senza avanzare; il retry riusa la stessa chiave e le PR già commentate restano idempotenti.
            - Se la finestra supera il budget della sessione, il collector fornisce al massimo quattro PR e imposta `collection_ok=false`. Processa tutte le PR emesse; il verifier finale rende intenzionalmente rossa la run schedulata, quindi il watermark di successo non avanza. La run successiva riusa la stessa finestra, salta per idempotenza le PR già commentate e processa il residuo dal primo PR non commentato. Non aprire un secondo bucket per lo stesso `(daily_key, target repository)`.
            - Solo il gate zero-Claude successivo demota gli item privi di acceptance falsificabile, porta il bucket a `State: sealed` e aggiunge `agent:fix-queued`. Un bucket collecting non è lavorabile dal drainer.
            - Una PR di fix daily con `Addresses #<bucket>` e `Follow-up item: FU-...` passa il gate anti-nipote solo per cercare finding nuovi: non creare issue figlie. Leggi il bucket padre nello stesso repository target; i finding già coperti dal padre aggiornano `Sources`/si deduplicano, quelli genuinamente nuovi si appendono al padre (se sealed, riportalo a collecting per il gate successivo). Se il padre è illeggibile, posta il blocco sulla PR e non creare un contenitore alternativo.

            **Per OGNI PR #N del batch (CSV sopra):**
            - **Backfill check (SOLO se `EVENT_NAME=workflow_dispatch`):** ri-verifica che
              - `gh pr view N --json mergedAt --jq '.mergedAt'` sia non-null (PR mergiata)
              - `gh pr view N --json author --jq '.author.login'` ∈ {`valerielinc-ops`, `frontaliere-automation` (o `app/frontaliere-automation`)} (same-owner / internal-app gate)
              - Se uno dei due fallisce → posta su #N `## Post-merge follow-up triage (backfill skipped): PR not eligible (not merged or different author)` e passa alla PR successiva.
              (Sul path `schedule` l'eleggibilità è già garantita da collect-followup-batch.mjs → salta questo check.)
            - Metadata + review della PR: già nel bundle (`## Per-PR metadata + reviews`, punto 4 del Bootstrap sopra). Non rifare `gh pr view`/`gh api .../reviews` a meno che la sezione di questa PR risulti vuota.
            - **Risolvi il repository PRIMA di creare qualunque issue.** Il repo della PR
              sorgente NON decide il repo dell'issue: lo decide il primo file realmente
              modificabile indicato dall'item. Usa questa mappa fissa:
              - `nanakokyobashi-rgb/frontaliere-articles`: `generator/**`,
                `generator/tests/**`, `generator/scripts/**`, `content/**`,
                `data/blog-articles/**`, `data/article-source-urls.json`,
                `data/batch-faq-progress.json` e i workflow del corpus che generano/pubblicano articoli
                (`generate-article.yml`, `batch-faq-articles.yml`,
                `publish-journalist-articles.yml`, `publish-api.yml`). Anche il twin
                `scripts/create-article.mjs` appartiene qui quando l'item riguarda la
                generazione live: il producer del sito e' disattivato dal cutover.
              - `valerielinc-ops/frontaliere-si-o-no`: tutto il resto, inclusi i file
                del sito, i workflow di deploy/sync/validation e i mirror che leggono
                il corpus senza generarlo.
              Se un item cita piu' file, scegli il repo del file che richiede la modifica
              comportamentale; se cita solo un sintomo, individua prima il file sorgente
              reale. Scrivi sempre nell'issue `Target repository:` e `Target file:`.
              Per Nanako usa SEMPRE `gh` con il repository esplicito:
              `gh issue create --repo nanakokyobashi-rgb/frontaliere-articles ...`.
              Nel processo Codex non cercare né interpolare `GITHUB_PAT` o `GH_TOKEN`:
              il token resta nel bridge host-side della action e il wrapper `gh` lo
              seleziona per il repository corpus. Se il bridge risponde che il
              credential corpus è indisponibile, posta il blocco di routing sulla PR
              e lascia l'item da ritentare nella prossima passata.
              Dedup, label e commenti vanno eseguiti sullo stesso `--repo` target.
            - Parse PR body `## Non implementato (ancora)`. **Il routing lo decide lo STATO LETTERALE del bullet, non una parola-scusa** (AGENTS.md #8; `scripts/ci/followup-has-candidates.mjs` applica esattamente questa regola a monte, e sono la stessa tassonomia — non inventarne una terza):
              - `in questa PR` · `PR concatenata #N` · `per scelta` · `by construction` · `blocked: decisione del proprietario` → **NON creare issue**: la voce è già chiusa o già tracciata altrove.
              - `blocked: <causa tecnica>` → **crea issue**, e riporta la causa nel campo `Blocked on:` dell'item.
              - **nessuno stato dichiarato** → **crea issue** (fail-safe: un residuo non qualificato è lavoro potenzialmente dovuto, e tacerlo è peggio che generare una traccia).
              Il vecchio skip su `out of scope` / `posposto` è **ABOLITO** (FOLLOWUP.md § parse rules): non sono più scappatoie di chiusura, e trattarli come tali faceva evaporare lavoro dovuto.
            - **Riporta lo stato NELL'ITEM che minti**, come riga `- Stato dichiarato nella PR: <lo stato letterale, verbatim, oppure «nessuno»>`. Senza, la issue di follow-up nasce non qualificata e nessuno può distinguere a macchina ciò che aspetta una decisione umana da ciò che un agente potrebbe chiudere subito — è la ragione per cui la coda non si smaltisce (misurato il 2026-08-14: 9 item su 25 nelle follow-up aperte del sito senza stato).
            - Parse reviewer bot review più recente: estrai 🟡 nit, ❓ q, `## Adversarial check` bullets. Skip 🔴 (già fixed o droppato consapevolmente pre-merge).
            - **Hard-exclude churn (FOLLOWUP.md → "Hard-exclude: churn non-actionable"):** droppa SEMPRE, prima del filtro funnel, gli item che sono doc/anchor/line-number rot, "document the intent/rationale", "de-rot comments", pure style/naming/format, o che il reviewer stesso marca `deferred`/`non funnel-critical`/nit puro. NON creare follow-up per essi.
            - **Hard-exclude missing-test nit (FOLLOWUP.md → "Hard-exclude: missing-test nit"):** droppa SEMPRE (reason `missing-test-nit`), prima del filtro funnel, **a prescindere dalla fonte e anche se funnel-critico**, ogni item che è essenzialmente "manca un test" / "aggiungi coverage" / "committa il test citato" / "pinna il comportamento con un test". NON droppare un BUG in un test ESISTENTE (assertion/regex/guard leaky, fixture date assolute): è correttezza, resta in scope.
            - **Hard-exclude live-verification-only (FOLLOWUP.md → "Hard-exclude: live-verification-only item"):** NON mintare issue (reason `live-verify-only`), prima del filtro funnel, **a prescindere dalla fonte**, ogni item la cui UNICA azione è ispezionare il sito già deployato (nessun file da editare): "verify live / verifica live / post-deploy / (post-merge, live) / (live)", "curl la URL prod / live-200", "render at NNNpx", "apri DevTools", "Playwright hydration", checkbox `## Test plan` `- [ ]` etichettata `(post-merge, live)` non spuntata. **Routing:** raccoglili in una UNICA checklist `Live-verification` batchata nel summary commento di QUELLA PR, NON come issue. **Eccezione:** un item che MESCOLA live-verify con un'edit concreta resta actionable.
            - **Hard-exclude rischio senza condizione di accettazione falsificabile (decisione del proprietario, 2026-09-05):** un item entra in coda SOLO se porta con sé qualcosa che, girando, può provare che è stato affrontato. In pratica: la sua `Suggested action` deve citare fra backtick almeno **un token-codice distintivo** (simbolo, campo, chiave, path, costante — ciò che un check potrà cercare verbatim nel file citato). Un rischio formulato solo in prosa («nessun gate impedisce un drift futuro», «valutare se serve un campo esplicito») **non si può mai provare affrontato**: nessuna evidenza lo chiuderà, quindi entra in coda e non ne esce più. NON mintarlo come item (reason `no-acceptance-condition`) — **raccoglilo nel commento di summary della PR**, dove resta leggibile, esattamente come si fa per `Live-verification`. Vale **a prescindere dalla fonte**, e in particolare per i bullet di `## Adversarial check`, che sono la fonte dominante di questa classe. L'oracolo è lo STESSO che poi chiude l'item (`citedTokens()` in `scripts/ci/followup-resolution-match.mjs`): usarne uno più permissivo in apertura è ciò che ha prodotto la coda immortale. **Seconda strada ammessa dal 2026-09-07 (D3), in DISGIUNZIONE con la prima:** invece del token, l'item può portare una riga di scheda `- METRICA: prima=<n> atteso=<n> | COMANDO: <comando>` il cui comando **nomina un referente** — un file, uno script o un test, cioè un path con una `/` e un'estensione (`npx vitest run tests/foo.test.ts`, `node scripts/ci/bar.mjs`). Il referente NON deve esistere ancora: può essere il test che la fix dovrà scrivere. Una metrica già al bersaglio (`prima=N atteso=N`) viene invece RIFIUTATA, perché non c'è niente da muovere. Usa questa strada quando l'item è lavoro vero ma la frase non si lascia ridurre a un token: è spesso più facile che inventare un token, e prova di più. Misurato il 2026-09-05 sul sito: 81 item su 129 nelle ultime 60 follow-up non citano un solo token, e 36 dei 49 item delle aggregate bloccate sono di questa classe.
              **PRIMA FORMULA L'AZIONE, POI GIUDICA QUELLA — e se l'item è azionabile ma la frase non porta un token, DERIVALO invece di scartarlo.** Il metro non si applica al bullet grezzo della review ma al testo che scrivi tu in `Suggested action`: sul bullet grezzo `suggestedActionText()` ricade sull'INTERO testo e i backtick che stanno in `Original text` fanno sembrare l'item ammissibile, mentre alla chiusura quella regione è esclusa per costruzione e l'item vale `no-valid-item` — cioè nasce già non chiudibile. Misurato eseguendo le funzioni: sullo stesso item, `citedTokens()` sul bullet grezzo dà `["manifest.counts"]` e sull'item coniato dà `[]`. Quindi: se un item ha codice da cambiare, vai a **cercare** il file, il simbolo o il campo da toccare e scrivilo tu nella `Suggested action` (`nomeFunzione()`, `oggetto.campo`, `COSTANTE >= 1` — mai un identificatore nudo né un path nudo, che `isDistinctiveToken()` rifiuta per scelta). Scartare per forma un item funnel-critico è peggio che scartarne uno vago: quello ha codice da cambiare e finisce in un commento che nessun reconciler drena. La rinuncia vale solo quando non esiste NIENTE da toccare, cioè quando è davvero un rischio in prosa.
              NB: dopo di te gira uno step deterministico (`scripts/ci/gate-minted-followups.mjs`) che ri-applica questa regola con la funzione vera, non con la tua lettura di questa riga. Un item che non la rispetta viene demoto dal corpo della issue e conservato nel commento della PR.
            - Dedup vs issue `follow-up` esistenti (titolo >70% similar → skip).
            - **In-flight PR overlap** (anti self-flag): escludi item su file che una PR aperta sta già modificando — usa `## Open PRs` + `## Open PR changed files` già nel bundle (punto 4 del Bootstrap), non rifare `gh pr list`/`gh pr diff --name-only` → log "in-flight in PR #N". Vedi FOLLOWUP.md § Dedup.
            - Non creare issue per-PR: aggiungi tutti i candidate validi al bucket giornaliero/repository target, senza un cap che tronchi gli item. Il cap è ammesso solo per il chunk/sessione. Label del bucket: `follow-up` + UNO funnel-* se inferibile; non aggiungere `agent:fix`/`agent:fix-queued` finché il gate non ha sigillato il bucket.
            - **OBBLIGATORIO:** posta `## Post-merge follow-up triage` summary commento su QUELLA PR (#N) — SEMPRE, anche con zero candidate (`## Post-merge follow-up triage: zero outstanding items.`). Questo commento è il MARKER DI IDEMPOTENZA del batch: senza, la prossima run schedulata ri-triagia la stessa PR. Include la sezione `Live-verification` (checklist `- [ ]` batchata) se ce ne sono; vedi FOLLOWUP.md § Closing comment.

            **Constraint:**
            - Le scritture ammesse sono `gh issue create/edit/comment` sul repository target e `gh pr comment` sulla PR sorgente; mai modificare PR label/state/title e mai chiudere/riaprire issue dal triage.
            - Le append al body sono concorrenti: lettura subito prima, confronto baseline/hash, ricostruzione su body nuovo e commento append-only per gli eventi di stato. Un errore di append non deve cancellare item già presenti.
            - Incerto sul filtro → crea con rationale "needs triage".
            - **Token-lever:** chiamate `gh`/lettura indipendenti vanno emesse in parallelo nello stesso messaggio, mai una per turno — un messaggio con più tool-call resta 1 turno.
            - NB: la supersede detection NON è scope di questo prompt — la fa già `followup-reconcile.yml` deterministico daily (zero-Claude). Una PR nata per un bucket porta `Follow-up item: FU-...` e `Addresses #<bucket>`; non usare `Closes` finché resta anche un item aperto.

      # NB: niente self-retry step (era richiesto dal modello per-PR, dove un run fallito
      # = triage perso per sempre). Nel modello batch il watermark avanza SOLO su run di
      # SUCCESSO → una run fallita lascia il watermark indietro → la prossima run
      # schedulata (≤3h) ri-copre l'intera finestra; l'idempotenza (commento
      # `## Post-merge follow-up triage`) salta le PR già processate e riprende le altre.
      # Retry at-least-once by-construction, senza ricorsione né `actions: write`.

      # Do not infer completion from an action exit code: Codex/Claude can stop
      # after one chunk while the batch still contains other PRs.  The gate may
      # seal a collecting bucket only when every PR in the positive batch carries
      # the required idempotency marker and the action/fallback itself succeeded.
      # A successful empty collection is complete without invoking Claude; an
      # empty/failed collection is not. The explicit collection_ok output keeps
      # those states distinct so a collector error cannot advance the watermark.
      - name: Verify complete follow-up triage (zero-Claude)
        id: triage_complete
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          BATCH_COUNT: ${{ steps.collect.outputs.batch_count }}
          COLLECTION_OK: ${{ steps.collect.outputs.collection_ok }}
          CLAUDE_OUTCOME: ${{ steps.followup.outputs.claude_outcome }}
          ACTION_SUCCESS: ${{ steps.followup.outputs.action_success }}
          CORPUS_REPO: nanakokyobashi-rgb/frontaliere-articles
          GITHUB_PAT_NANAKO: ${{ env.GITHUB_PAT_NANAKO || env.GITHUB_PAT }}
          GITHUB_PAT: ${{ env.GITHUB_PAT }}
        run: |
          set -uo pipefail
          complete=false
          count="${BATCH_COUNT:-}"
          csv="${BATCH_PRS:-}"
          collection_ok="${COLLECTION_OK:-false}"
          marker_ok=true
          actual=0
          seen=""
          action_ok=false
          persistence_ok=true

          # A PR marker is only an idempotency claim.  For a non-empty result it
          # must point to a durable daily bucket whose body contains both a stable
          # item heading and this PR in Sources.  This catches a successful marker
          # comment followed by a failed issue create/edit; otherwise the next run
          # would skip the PR forever.  The bucket can live in either repository.
          bucket_persisted_for_pr() {
            bucket="$1"
            pr_number="$2"
            for target_repo in "${REPO:-}" "${CORPUS_REPO:-}"; do
              [ -n "$target_repo" ] || continue
              target_token="${GH_TOKEN:-}"
              if [ "$target_repo" = "${CORPUS_REPO:-}" ]; then
                target_token="${GITHUB_PAT_NANAKO:-${GITHUB_PAT:-}}"
              fi
              [ -n "$target_token" ] || continue
              issue_json=$(GH_TOKEN="$target_token" gh issue view "$bucket" --repo "$target_repo" --json number,title,body 2>/dev/null) || continue
              if printf '%s' "$issue_json" | jq -e --arg bucket "$bucket" --arg pr "$pr_number" '
                ((.number | tostring) == $bucket)
                and ((.title // "") | test("^follow-up\\(daily:[0-9]{4}-[0-9]{2}-[0-9]{2}\\):[[:space:]]+[0-9]+[[:space:]]+items?"))
                and ((.body // "") | test("(?m)^### FU-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}"))
                and ((.body // "") | test("(?m)^-[[:space:]]+Sources?:[^\\n]*PR[[:space:]]+#" + $pr + "([^0-9]|$)"))
              ' >/dev/null 2>&1; then
                return 0
              fi
            done
            return 1
          }

          if [ "$collection_ok" != true ]; then
            echo "triage incompleta: collection_ok non è true (raccolta fallita/illeggibile)"
            marker_ok=false
          elif ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "triage incompleta: batch_count non numerico"
            marker_ok=false
          elif [ "$count" -eq 0 ]; then
            if [ -n "$(printf '%s' "$csv" | tr -d '[:space:]')" ]; then
              echo "triage incompleta: batch_count=0 ma BATCH_PRS non è vuoto"
              marker_ok=false
            else
              # There is no Claude action for a genuinely empty, successfully
              # collected window. This is the only zero-batch completion path.
              action_ok=true
            fi
          else
            IFS=',' read -ra prs <<< "$csv"
            for raw_pr in "${prs[@]}"; do
              pr=$(printf '%s' "$raw_pr" | tr -d '[:space:]')
              if ! [[ "$pr" =~ ^[1-9][0-9]*$ ]]; then
                echo "triage incompleta: BATCH_PRS contiene un PR non numerico"
                marker_ok=false
                continue
              fi
              case ",${seen}," in
                *,"$pr",*)
                  echo "triage incompleta: PR #$pr duplicata nel batch"
                  marker_ok=false
                  continue
                  ;;
              esac
              seen="${seen:+$seen,}${pr}"
              actual=$((actual + 1))
              comments=$(gh pr view "$pr" --repo "$REPO" --json comments 2>/dev/null) || comments=""
              if [ -z "$comments" ] || ! printf '%s' "$comments" | jq -e '[.comments[]?.body // "" | contains("## Post-merge follow-up triage")] | any' >/dev/null 2>&1; then
                echo "triage incompleta: PR #$pr senza marker di triage leggibile"
                marker_ok=false
              else
                marker_body=$(printf '%s' "$comments" | jq -r '[.comments[]?.body // "" | select(contains("## Post-merge follow-up triage"))] | last // ""' 2>/dev/null || true)
                bucket_refs=$(printf '%s\n' "$marker_body" | sed -n -E '/^[[:space:]]*(-[[:space:]]+|\*[[:space:]]+)?Created(\/updated)?:/p' | grep -Eo 'bucket #[0-9]+' | sed -E 's/.*#//' | sort -un || true)
                # A zero-candidate summary may name the unchanged daily bucket for
                # audit context. That is not a claim that this PR was persisted in
                # the bucket, so it must use the empty-result path below.
                if printf '%s' "$marker_body" | grep -Eiq 'zero outstanding items|backfill skipped|Created:[[:space:]]*0 issue[[:space:]]*\(solo live-verification batchata\)|Created/updated:[[:space:]]*(0 issue[[:space:]]*[—-][[:space:]]*nessun item nuovo aggiunto|nessun nuovo item nel bucket)'; then
                  # The explicit zero-item marker is an empty-result claim. A
                  # bucket named only as unchanged audit context is not a
                  # persistence claim and must not fail this branch.
                  :
                elif [ -z "$bucket_refs" ]; then
                  echo "triage incompleta: marker PR #$pr senza riferimento a un bucket persistito"
                  persistence_ok=false
                else
                  while IFS= read -r bucket; do
                    [ -n "$bucket" ] || continue
                    if ! bucket_persisted_for_pr "$bucket" "$pr"; then
                      echo "triage incompleta: bucket #$bucket per PR #$pr non leggibile o senza item/Source persistito"
                      persistence_ok=false
                    fi
                  done < <(printf '%s\n' "$bucket_refs")
                fi
              fi
            done
            if [ "$actual" -ne "$count" ] 2>/dev/null; then
              echo "triage incompleta: batch_count=$count ma PR verificate=$actual"
              marker_ok=false
            fi
          fi
          if [ "$count" -gt 0 ] 2>/dev/null; then
            if [ "${CLAUDE_OUTCOME:-}" = success ] || [ "${ACTION_SUCCESS:-}" = true ]; then
              action_ok=true
            else
              echo "triage incompleta: batch positivo senza esito Codex/Claude riuscito"
            fi
          fi
          if [ "$marker_ok" = true ] && [ "$persistence_ok" = true ] && [ "$action_ok" = true ]; then
            complete=true
          fi
          echo "triage_complete=$complete" >> "$GITHUB_OUTPUT"
          echo "triage_complete=$complete (batch_count=${count:-missing}, verified_prs=$actual, persistence_ok=$persistence_ok, action_ok=$action_ok)"
          if [ "$complete" != true ]; then
            exit 1
          fi

      # Gate DETERMINISTICO in ingresso sul conio (zero-Claude). Il divieto di mintare
      # item senza condizione di accettazione falsificabile esiste gia' sopra, ma vive
      # SOLO nel prompt: e' una richiesta a un LLM, non un invariante. Misurato il
      # 2026-09-06 sul sito, ultimi 7 giorni: 164 aggregate coniate, 91 (55% = 13,0/giorno)
      # strutturalmente immortali — 76 `no-valid-item` (nessun item falsificabile: non si
      # chiudono MAI, `aggregateCloseGate()` le blocca per costruzione) + 15
      # `aggregate-unparsed`. Questo step rilegge la issue appena coniata con lo STESSO
      # oracolo che poi la chiude (`hasFalsifiableAcceptance()` da
      # `scripts/ci/followup-resolution-match.mjs`, importato verbatim — mai un predicato
      # nuovo, e mai piu' largo: e' il vincolo di #7587), demota gli item che non passano
      # nel commento di summary della PR, e sopprime la issue quando non ne resta nessuno.
      # `if: always()` perche' il gate deve girare anche se lo step Claude e' finito in
      # timeout DOPO aver creato una issue; `continue-on-error` perche' un guasto qui non
      # deve poter far cadere il triage (la issue resta intatta, e' il verso sicuro).
      - name: Gate sul conio — demota gli item senza condizione di accettazione (zero-Claude)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          TRIAGE_DAILY_KEY: ${{ steps.collect.outputs.daily_key }}
          COLLECTION_OK: ${{ steps.collect.outputs.collection_ok }}
          TRIAGE_COMPLETE: ${{ steps.triage_complete.outputs.triage_complete }}
        run: node scripts/ci/gate-minted-followups.mjs

      # Le follow-up che riguardano il producer vengono coniate sul corpus, non sul
      # sito. Il gate deve quindi leggere/scrivere le issue su Nanako ma commentare la
      # PR sorgente qui: `GATE_PR_REPO` separa i due repository nel gate.
      - name: Gate sul conio — corpus (zero-Claude)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT_NANAKO || env.GITHUB_PAT }}
          GH_REPO: nanakokyobashi-rgb/frontaliere-articles
          GATE_PR_REPO: ${{ github.repository }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          TRIAGE_DAILY_KEY: ${{ steps.collect.outputs.daily_key }}
          COLLECTION_OK: ${{ steps.collect.outputs.collection_ok }}
          TRIAGE_COMPLETE: ${{ steps.triage_complete.outputs.triage_complete }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Gate sul conio corpus saltato: GITHUB_PAT_NANAKO/GITHUB_PAT assente; issue lasciate intatte."
            exit 0
          fi
          node scripts/ci/gate-minted-followups.mjs

      - name: Claude usage metrics
        if: always() && steps.followup.outputs.claude_used == 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to the run
        # Step Summary + a grep-able CLAUDE_USAGE line to the log. Best-effort: never fails.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.followup.outputs.execution_file }}" "post-merge-followup"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
