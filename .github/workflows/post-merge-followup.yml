name: Post-merge follow-up triage

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to backfill follow-up triage for (must be already-merged + same-owner author).'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: write # self-retry via workflow_dispatch (vedi step "Retry once")

jobs:
  followup:
    # Trigger condizioni:
    # - PR merged (non solo chiuso).
    # - Autore PR = repo owner (skip dependabot/forks).
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    # Lo scope è leggere PR body `## Non implementato` + reviewer 🟡/❓ e creare
    # issue con label `follow-up` quando il filtro scopo passa. Vedi FOLLOWUP.md.
    #
    # workflow_dispatch path (closes #774): backfill manuale di PR già mergiate
    # ma non triagiate al momento del merge originario (es. PR vecchie pre
    # post-merge-followup adoption). Le condizioni "merged + same-owner"
    # vengono ri-verificate dentro il claude prompt sul PR risolto via API,
    # quindi qui basta gate sul fatto che dispatch sia volontario.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'valerielinc-ops') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Grandchild-suppression gate (zero-Claude, deterministico). Una PR che
      # FIXA un follow-up, se triagiata, può generare un follow-up NIPOTE (il
      # reviewer lascia un 🟡 sul fix → nuovo follow-up) → self-feed infinito.
      # Questo step salta interamente il triage Claude quando la PR mergiata
      # chiude/supera una issue `follow-up`. Proceed-safe: nel dubbio emette
      # false → triage gira (mai perdere un follow-up di PR organica).
      # Vedi scripts/ci/is-followup-fix-pr.mjs + FOLLOWUP.md.
      - name: Grandchild-suppression gate
        id: gchild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/is-followup-fix-pr.mjs

      - name: Setup Headroom compression proxy
        if: steps.gchild.outputs.is_followup_fix != 'true'
        uses: ./.github/actions/setup-headroom

      - name: Run Claude follow-up triage
        id: followup
        # Skip quando la PR è essa stessa un fix-di-follow-up (rompe il self-feed
        # nipote + risparmia la run Claude sulla quota Max condivisa).
        if: steps.gchild.outputs.is_followup_fix != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull-request event passes the closed PR's number directly;
          # workflow_dispatch passes it via the `pr_number` input.
          # Title is fetched inside the prompt to keep the dispatch path
          # self-contained (no need to pre-resolve via API in the env block).
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # max-turns 20 (era 15): il triage completo (parse PR body + reviews,
          # filtro churn/funnel, dedup, in-flight overlap, gh issue create)
          # sforava sistematicamente i 15 turni → 6 run `error_max_turns` il
          # 2026-05-30 (num_turns 16+) con triage perso per PR #1015/#1012/#979
          # (nessun re-run → 🟡/❓ + `## Non implementato` mai triagiati). 15
          # troncava prima degli step obbligatori; AGENTS.md vieta di abbassarli
          # proprio per questo. Allineato a lessons-harvester (20).
          # NB: la supersede detection è stata RIMOSSA da questo prompt (2026-06-04)
          # — la fa già `followup-reconcile.yml` deterministico daily (zero-Claude).
          claude_args: "--max-turns 20 --model claude-sonnet-4-6 --allowedTools 'Bash(gh:*),Read,Grep,Glob'"
          prompt: |
            Triage automatico follow-up per PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }} (${{ github.event_name }}).

            **Event-aware bootstrap:**
            - Se `EVENT_NAME=pull_request`, la PR è appena stata chiusa+mergiata (auto-triage); `PR_TITLE` è già esposta come env var.
            - Se `EVENT_NAME=workflow_dispatch`, la PR è un BACKFILL manuale di una PR vecchia. Ri-verifica che:
              - `gh pr view $PR_NUMBER --json state,mergedAt,user --jq '.mergedAt'` sia non-null (PR mergiata)
              - `gh pr view $PR_NUMBER --json user --jq '.user.login'` == `valerielinc-ops` (same-owner gate)
              - Se uno dei due fallisce → emetti `## Post-merge follow-up triage (backfill skipped): PR not eligible (not merged or different author)` e termina.

            **Bootstrap:**
            1. Leggi `FOLLOWUP.md` — contratto operativo completo (parse rules, filtro scopo, dedup, issue format, closing comment).
            2. Leggi `REVIEW.md → "Scopo progetto"` per il filtro funnel.
            3. Carica:
               - `gh pr view $PR_NUMBER --json number,title,body,mergedAt,mergeCommit,url`
               - `gh api repos/$REPO/pulls/$PR_NUMBER/reviews`
               - `gh issue list --label follow-up --state all --json number,title --limit 50` (SOLO `number,title`: il bulk overview serve per la vista d'insieme/titoli; il dedup vero è item-level scoped via `--search` — vedi FOLLOWUP.md § Dedup. MAI aggiungere `,body`: con ~170 issue follow-up il dump arriva a ~170KB emoji-heavy, viene troncato a un boundary di surrogate UTF-16 → lone surrogate → request body API JSON invalido `400 no low surrogate in string`, ogni run fallisce.)

            **Esegui workflow come specificato in FOLLOWUP.md:**
            - Parse PR body `## Non implementato` (skip motivi `out of scope` / `posposto`).
            - Parse reviewer bot review più recente: estrai 🟡 nit, ❓ q, `## Adversarial check` bullets. Skip 🔴 (già fixed o droppato consapevolmente pre-merge).
            - **Hard-exclude churn (FOLLOWUP.md → "Hard-exclude: churn non-actionable"):** droppa SEMPRE, prima del filtro funnel, gli item che sono doc/anchor/line-number rot, "document the intent/rationale", "de-rot comments", pure style/naming/format, o che il reviewer stesso marca `deferred`/`non funnel-critical`/nit puro. Questi auto-routano a `agent:fix` e bruciano quota Max condivisa per zero impatto funnel (caso #1010→PR #1011 "puro churn documentale"). NON creare follow-up per essi.
            - **Hard-exclude missing-test nit (FOLLOWUP.md → "Hard-exclude: missing-test nit"):** droppa SEMPRE (reason `missing-test-nit`), prima del filtro funnel, **a prescindere dalla fonte e anche se funnel-critico**, ogni item che è essenzialmente "manca un test" / "aggiungi coverage" / "committa il test citato" / "pinna il comportamento con un test" — sia da reviewer (🟡/❓/adversarial) sia da PR body `## Non implementato`. L'owner non valorizza la copertura test (#865/#908/#854 erano già done-but-open). NON droppare un BUG in un test ESISTENTE (assertion/regex/guard leaky, fixture date assolute): è correttezza, resta in scope.
            - **Hard-exclude live-verification-only (FOLLOWUP.md → "Hard-exclude: live-verification-only item"):** NON mintare issue (reason `live-verify-only`), prima del filtro funnel, **a prescindere dalla fonte**, ogni item la cui UNICA azione è ispezionare il sito già deployato (nessun file da editare): frasi-segnale "verify live / verifica live / post-deploy / (post-merge, live) / (live)", "curl la URL prod / live-200", "render at NNNpx / 382px", "apri DevTools", "Playwright hydration", checkbox `## Test plan` `- [ ]` etichettata `(post-merge, live)` non spuntata. Auto-routerebbero a `agent:fix` su una PR vuota → giri Claude sprecati su quota condivisa (classe #1149/#959/#1129, ~40% dei sub-item). **Routing:** raccoglili in una UNICA checklist `Live-verification` batchata nel summary commento (sotto), NON come issue. **Eccezione (resta in scope):** un item che MESCOLA live-verify con un'edit concreta su un file resta actionable (solo la coda live-verify è conferma). Nel dubbio puro-live-verify vs ha-anche-un'edit → tienilo actionable.
            - Filtro scopo (`REVIEW.md`): item passa SOLO se è funnel-critico (monetizzazione / traffico / correttezza) **E** azionabile (cambiamento di comportamento concreto). Nel dubbio churn-vs-funnel → drop.
            - Dedup vs issue `follow-up` esistenti (titolo >70% similar → skip).
            - **In-flight PR overlap** (anti self-flag): escludi item su file che una PR aperta sta già modificando (`gh pr list --state open` + `gh pr diff <n> --name-only`) → log "in-flight in PR #N". Vedi FOLLOWUP.md § Dedup.
            - Crea issue per candidate validi, max 10/PR. Label: `follow-up` + UNO funnel-* se inferibile.
            - Posta `## Post-merge follow-up triage` summary commento sulla PR. Include la sezione `Live-verification` (checklist `- [ ]` batchata degli item `live-verify-only`, nessuna issue/fixer) se ce ne sono; vedi FOLLOWUP.md § Closing comment.

            **Constraint:**
            - Read-only eccetto `gh issue create`, `gh pr comment`.
            - Mai modificare PR label/state/title.
            - Mai chiudere/riaprire issue.
            - Incerto sul filtro → crea con rationale "needs triage".
            - Zero candidate → `## Post-merge follow-up triage: zero outstanding items.` e termina.


      # Un run fallito (error_max_turns, 400 upstream, transient) = triage
      # PERSO per sempre: i 🟡/❓ del reviewer e gli item `## Non implementato`
      # evaporano senza retry ne' monitor (unico recupero era il dispatch
      # manuale). Self-retry UNA volta via workflow_dispatch: l'eccezione
      # anti-ricorsione di GitHub consente a GITHUB_TOKEN di creare run
      # workflow_dispatch, e il gate `event_name == 'pull_request'` rende il
      # retry non ricorsivo by-construction (il run di retry e' un dispatch:
      # se fallisce anche lui, questo step e' skipped -> bounded a 1).
      - name: Retry once on failure (self-dispatch)
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::post-merge-followup fallito su PR #${{ github.event.pull_request.number }} — self-retry via workflow_dispatch (1 tentativo)."
          gh workflow run post-merge-followup.yml --ref main \
            -f pr_number="${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

      - name: Claude usage metrics
        if: always()
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.followup.outputs.execution_file }}" "post-merge-followup"
