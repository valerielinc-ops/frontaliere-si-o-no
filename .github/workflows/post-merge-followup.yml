name: Post-merge follow-up triage

# SCHEDULED-BATCH (era pull_request:[closed] per-PR). Una sola sessione Claude ogni
# ~3h triagia TUTTE le PR mergiate dall'owner dalla finestra precedente, invece di
# UNA run per ogni merge. Il ~60-80% delle run per-PR creava zero issue → spreco
# sulla quota Max OAuth CONDIVISA (AGENTS.md § frugalità — "più batched"). Sicurezza
# garantita dal watermark-su-SUCCESSO + idempotenza (vedi collect-followup-batch.mjs):
# una finestra non viene mai persa, al più ri-triagiata (no-op grazie all'idempotenza).
on:
  schedule:
    - cron: '0 */3 * * *' # ogni 3h
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to backfill follow-up triage for (must be already-merged + same-owner author).'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # collect-followup-batch.mjs legge `gh run list` per il watermark

concurrency:
  # Serializza le run schedulate (cancel-in-progress:false → una run in coda attende,
  # mai cancellata). Con watermark-su-successo l'overlap non perde dati, ma serializzare
  # evita doppio-triage concorrente sulla stessa finestra. Pattern = followup-reconcile.yml.
  group: post-merge-followup
  cancel-in-progress: false

jobs:
  followup:
    # Trigger:
    # - `schedule`: batch automatico ogni 3h delle PR mergiate dall'owner
    #   (`valerielinc-ops` / `frontaliere-automation[bot]`) — il filtro autore vive
    #   ora in `collect-followup-batch.mjs`, non più nell'`if:` del job.
    # - `workflow_dispatch` (closes #774): backfill manuale di UNA PR già mergiata ma
    #   non triagiata (es. PR vecchie pre-adozione). Volontario → nessun gate qui; le
    #   condizioni "merged + same-owner" sono ri-verificate dentro il prompt Claude.
    # Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    # Scope: leggere PR body `## Non implementato` + reviewer 🟡/❓ e creare issue
    # `follow-up` quando il filtro scopo passa. Vedi FOLLOWUP.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 30→40 (2026-07-17): headroom per il cap turni dinamico alzato (max 60→80).
    timeout-minutes: 40 # batch di N PR in una sessione (era 10 per una sola PR)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Collect-batch (zero-Claude, deterministico). Produce la lista FINALE di PR da
      # triagiare:
      #  - schedule → watermark (ultima run di SUCCESSO, fallback now-6h) → PR mergiate
      #    dall'owner dalla finestra → scarta le già-triagiate (commento idempotenza) →
      #    applica i DUE gate per-PR esistenti (grandchild-suppression + no-op pre-gate,
      #    invocati come subprocess: risparmio preservato anche in batch).
      #  - workflow_dispatch → batch = [pr_number] diretto (backfill volontario,
      #    bypass gate: il prompt Claude ri-verifica eligibility).
      # PROCEED-SAFE: dubbio/errore su una PR → inclusa nel batch (mai persa).
      # Emette batch_prs (csv), batch_count, max_turns. Vedi scripts/ci/collect-followup-batch.mjs.
      - name: Collect follow-up batch
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="$INPUT_PR_NUMBER"
            echo "::notice::Backfill dispatch per PR #${PR} (eligibility ri-verificata nel prompt Claude)."
            {
              echo "batch_prs=${PR}"
              echo "batch_count=1"
              echo "max_turns=34" # = maxTurnsFor(1) — tenere allineato a collect-followup-batch.mjs
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/collect-followup-batch.mjs
          fi

      # Sibling della stessa classe misurata su issue-fix.yml (2026-08-05). Il
      # tracker #1951 segnalava questo workflow al 38% di failure-rate: scaricati
      # i log delle run fallite, sono **tutte HTTP 429** — quota Max condivisa
      # esaurita, esattamente come le 60/61 di issue-fix. Claude non esegue (0
      # turni, $0) e la run muore rossa.
      #
      # Qui il RECUPERO era già corretto e NON va toccato: il watermark avanza
      # solo sulle run di SUCCESSO, quindi una run fallita lascia la finestra
      # indietro e la successiva (≤3h) la ri-copre — nessun contatore di
      # tentativi, nessun park, nessuna chiusura automatica, cioè nessuno stato
      # assorbente come quello che issue-fix aveva. Quello che restava da
      # eliminare è solo lo SPRECO: durante una finestra di quota aperta ogni run
      # schedulata spende comunque una chiamata Claude condannata in partenza.
      # Questo gate la salta e fallisce subito con un messaggio veritiero: il
      # watermark resta indietro (comportamento identico a prima), la finestra
      # viene ri-coperta, ma la quota non viene toccata.
      - name: Pre-flight — quota backoff gate (zero-Claude)
        id: quota
        # PROCEED-SAFE come i gate gemelli di issue-fix.yml: lo script è totale
        # (throw → quota_blocked=false) e continue-on-error impedisce che un
        # guasto infra sopprima il triage.
        continue-on-error: true
        if: steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Senza ISSUE_NUMBER lo script è in sola RILEVAZIONE: legge il beacon
        # `<!-- QUOTA_RESETS_AT: … -->` lasciato sulle issue della coda issue-fix
        # (stessa quota, stesso account) e non modifica nessuna label.
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Setup Headroom compression proxy
        if: steps.quota.outputs.quota_blocked != 'true' && steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        uses: ./.github/actions/setup-headroom

      - name: Skip on exhausted quota (no false green — watermark must hold)
        # RED deliberato, non un warning: il watermark avanza sulle sole run di
        # SUCCESSO, quindi uscire verdi qui farebbe avanzare la finestra e
        # perderebbe per sempre il batch di PR non triagiate. Fallire è il
        # comportamento CORRETTO e identico a quello odierno (la run moriva
        # comunque sul 429); l'unica differenza è che non spendiamo la chiamata.
        if: steps.quota.outputs.quota_blocked == 'true'
        run: |
          echo "::error::post-merge-followup: quota Claude esaurita (reset epoch ${{ steps.quota.outputs.resets_at }}) — salto la chiamata Claude, che morirebbe su HTTP 429 a turno 1. Il watermark NON avanza: la prossima run schedulata (≤3h) ri-copre l'intera finestra, nessuna PR persa."
          exit 1

      - name: Run Claude follow-up triage (batch)
        id: followup
        # Gira SOLO se il batch ha almeno una PR. Per le altre run (finestra vuota /
        # tutte già-triagiate / tutte scartate dai gate) la sessione Claude è
        # interamente saltata → quota Max risparmiata. La condizione sulla quota è
        # ridondante (lo step di skip sopra esce 1 e GitHub salta già il resto) ma
        # esplicita: il gate non deve dipendere dall'ordine degli step per reggere.
        if: steps.quota.outputs.quota_blocked != 'true' && steps.collect.outputs.batch_count != '0' && steps.collect.outputs.batch_count != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_PRS: ${{ steps.collect.outputs.batch_prs }}
          BATCH_COUNT: ${{ steps.collect.outputs.batch_count }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `allowed_non_write_users` (sotto) funziona SOLO con `github_token` esplicito,
          # non con la sola GitHub App auth di `claude_code_oauth_token` (docs/security.md
          # anthropics/claude-code-action: "Only works when github_token is provided as
          # input"). Senza questo il bypass del gate write-access è un no-op silenzioso e
          # la run continua a fallire con lo stesso errore che questo file dichiara di
          # risolvere (trovato in review PR #3182). Token auto-generato, scope limitato ai
          # `permissions:` del job (pull-requests/issues write), scade a fine job — NON un
          # PAT statico.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Il merge che alimenta questo workflow è fatto da automation interna con DUE
          # actor bot distinti — entrambi vanno in whitelist o claude-code-action aborta
          # "Workflow initiated by non-human actor":
          #  - `frontaliere-automation[bot]`: actor del path PRIMARIO di cascade
          #    post-LGTM (`auto-merge-on-lgtm.yml` mergia con APP_TOKEN). CORREZIONE
          #    2026-07-01: l'assunzione "lo schedule gira come github-actions[bot]" era
          #    sbagliata — `triggering_actor` osservato sui run schedulati è
          #    `frontaliere-automation[bot]` (ultimo autore del commit che ha introdotto
          #    il cron, PR #3157). Manteniamo comunque la whitelist anche per il path
          #    workflow_dispatch self-invocato e per simmetria coi sibling (issue-fix).
          #  - `github-actions[bot]`: fallback per eventuali dispatch manuali via UI.
          # `claude[bot]` per simmetria coi sibling. Mai `*`.
          allowed_bots: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          # `allowed_bots` bypassa solo il gate "non-human actor" — claude-code-action fa
          # un secondo check SEPARATO ("does the actor have write access") via l'API
          # collaborator-permission, che una GitHub App bot NON supera (non è un
          # collaborator classico anche se ha accesso reale via installation). Root
          # cause della run schedulata che falliva 100% dal merge di PR #3157 con "User
          # does not have write access on this repository" (turns=0, $0 — falliva PRIMA
          # di invocare Claude, zero triage creato da allora). Stessi 3 nomi di
          # allowed_bots.
          allowed_non_write_users: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          show_full_output: true
          # max-turns DINAMICO = min(26 + 8*batch_count, 80), floor 26 (era
          # min(20+6n,60); bump fleet-wide 2026-07-17, owner). AGENTS.md vieta di
          # ABBASSARE i turni di post-merge-followup (15→20
          # fu un fix di `error_max_turns` su PR perse); qui processiamo N PR in una
          # sessione → vanno ALZATI in proporzione, mai sotto il floor. Modello →
          # claude-sonnet-5 (owner 2026-07-17: mai claude-sonnet-4-6).
          # Se una sessione satura il cap (batch grande) → error_max_turns → run NON
          # success → watermark non avanza → la prossima run schedulata ri-copre la
          # finestra; l'idempotenza salta le PR già commentate, riprende le restanti.
          # 2026-07-02: ROLLBACK di `--dangerously-skip-permissions` (adottato la
          # mattina stessa) — issue #3269: run schedulati/workflow_dispatch (questo
          # workflow gira su `schedule`) risolvono `permissionMode` a "default"
          # nonostante il flag, bloccando quasi ogni Bash con "requires approval"
          # (confermato sul run 28594653701 di oggi, 13:43Z: 36 blocchi, zero
          # comment postato). pr-review-loop.yml (trigger `workflow_run`) e
          # issue-fix.yml (trigger `issues`) invece OTTENGONO bypassPermissions
          # regolarmente con la stessa config — il pattern correla con
          # l'event_name del trigger (schedule/workflow_dispatch → sempre bloccato,
          # anche con actor umano), non con settings/claude_args. Torniamo allo
          # scoped `--allowedTools` precedente (problema noto ma minore: rifiuta
          # a volte sintassi shell non staticamente analizzabile, non blocca TUTTO).
          claude_args: "--max-turns ${{ steps.collect.outputs.max_turns }} --model claude-sonnet-5 --allowedTools 'Bash(gh:*),Read,Grep,Glob'"
          prompt: |
            Triage automatico follow-up in BATCH (${{ github.event_name }}).
            PR da processare (CSV): ${{ steps.collect.outputs.batch_prs }}
            Conteggio: ${{ steps.collect.outputs.batch_count }}

            Itera su OGNI PR del batch ed esegui il workflow FOLLOWUP.md per ciascuna, in
            modo INDIPENDENTE: un errore su una PR non deve impedire di processare le altre.

            **Bootstrap (UNA volta, condiviso per TUTTO il batch — non ri-leggere per ogni PR):**
            1. Leggi `FOLLOWUP.md` — contratto operativo completo (parse rules, filtro scopo, dedup, issue format, closing comment).
            2. Leggi `REVIEW.md → "Scopo progetto"` per il filtro funnel.
            3. `gh issue list --label follow-up --state all --json number,title --limit 50` (SOLO `number,title`: il bulk overview serve per la vista d'insieme/titoli; il dedup vero è item-level scoped via `--search`. MAI aggiungere `,body`: con ~170 issue follow-up il dump arriva a ~170KB emoji-heavy, troncato a un boundary di surrogate UTF-16 → lone surrogate → `400 no low surrogate in string`, ogni run fallisce.) Riusa questa lista per il dedup su tutte le PR del batch.

            **Per OGNI PR #N del batch (CSV sopra):**
            - **Backfill check (SOLO se `EVENT_NAME=workflow_dispatch`):** ri-verifica che
              - `gh pr view N --json mergedAt --jq '.mergedAt'` sia non-null (PR mergiata)
              - `gh pr view N --json author --jq '.author.login'` ∈ {`valerielinc-ops`, `frontaliere-automation` (o `app/frontaliere-automation`)} (same-owner / internal-app gate)
              - Se uno dei due fallisce → posta su #N `## Post-merge follow-up triage (backfill skipped): PR not eligible (not merged or different author)` e passa alla PR successiva.
              (Sul path `schedule` l'eleggibilità è già garantita da collect-followup-batch.mjs → salta questo check.)
            - Carica: `gh pr view N --json number,title,body,mergedAt,mergeCommit,url` + `gh api repos/$REPO/pulls/N/reviews`.
            - Parse PR body `## Non implementato (ancora)`. **Il routing lo decide lo STATO LETTERALE del bullet, non una parola-scusa** (AGENTS.md #8; `scripts/ci/followup-has-candidates.mjs` applica esattamente questa regola a monte, e sono la stessa tassonomia — non inventarne una terza):
              - `in questa PR` · `PR concatenata #N` · `per scelta` · `by construction` · `blocked: decisione del proprietario` → **NON creare issue**: la voce è già chiusa o già tracciata altrove.
              - `blocked: <causa tecnica>` → **crea issue**, e riporta la causa nel campo `Blocked on:` dell'item.
              - **nessuno stato dichiarato** → **crea issue** (fail-safe: un residuo non qualificato è lavoro potenzialmente dovuto, e tacerlo è peggio che generare una traccia).
              Il vecchio skip su `out of scope` / `posposto` è **ABOLITO** (FOLLOWUP.md § parse rules): non sono più scappatoie di chiusura, e trattarli come tali faceva evaporare lavoro dovuto.
            - **Riporta lo stato NELL'ITEM che minti**, come riga `- Stato dichiarato nella PR: <lo stato letterale, verbatim, oppure «nessuno»>`. Senza, la issue di follow-up nasce non qualificata e nessuno può distinguere a macchina ciò che aspetta una decisione umana da ciò che un agente potrebbe chiudere subito — è la ragione per cui la coda non si smaltisce (misurato il 2026-08-14: 9 item su 25 nelle follow-up aperte del sito senza stato).
            - Parse reviewer bot review più recente: estrai 🟡 nit, ❓ q, `## Adversarial check` bullets. Skip 🔴 (già fixed o droppato consapevolmente pre-merge).
            - **Hard-exclude churn (FOLLOWUP.md → "Hard-exclude: churn non-actionable"):** droppa SEMPRE, prima del filtro funnel, gli item che sono doc/anchor/line-number rot, "document the intent/rationale", "de-rot comments", pure style/naming/format, o che il reviewer stesso marca `deferred`/`non funnel-critical`/nit puro. NON creare follow-up per essi.
            - **Hard-exclude missing-test nit (FOLLOWUP.md → "Hard-exclude: missing-test nit"):** droppa SEMPRE (reason `missing-test-nit`), prima del filtro funnel, **a prescindere dalla fonte e anche se funnel-critico**, ogni item che è essenzialmente "manca un test" / "aggiungi coverage" / "committa il test citato" / "pinna il comportamento con un test". NON droppare un BUG in un test ESISTENTE (assertion/regex/guard leaky, fixture date assolute): è correttezza, resta in scope.
            - **Hard-exclude live-verification-only (FOLLOWUP.md → "Hard-exclude: live-verification-only item"):** NON mintare issue (reason `live-verify-only`), prima del filtro funnel, **a prescindere dalla fonte**, ogni item la cui UNICA azione è ispezionare il sito già deployato (nessun file da editare): "verify live / verifica live / post-deploy / (post-merge, live) / (live)", "curl la URL prod / live-200", "render at NNNpx", "apri DevTools", "Playwright hydration", checkbox `## Test plan` `- [ ]` etichettata `(post-merge, live)` non spuntata. **Routing:** raccoglili in una UNICA checklist `Live-verification` batchata nel summary commento di QUELLA PR, NON come issue. **Eccezione:** un item che MESCOLA live-verify con un'edit concreta resta actionable.
            - Filtro scopo (`REVIEW.md`): item passa SOLO se è funnel-critico (monetizzazione / traffico / correttezza) **E** azionabile (cambiamento di comportamento concreto). Nel dubbio churn-vs-funnel → drop.
            - Dedup vs issue `follow-up` esistenti (titolo >70% similar → skip).
            - **In-flight PR overlap** (anti self-flag): escludi item su file che una PR aperta sta già modificando (`gh pr list --state open` + `gh pr diff <n> --name-only`) → log "in-flight in PR #N". Vedi FOLLOWUP.md § Dedup.
            - Crea issue per candidate validi, **max 10 per PR**. Label: `follow-up` + UNO funnel-* se inferibile.
            - **OBBLIGATORIO:** posta `## Post-merge follow-up triage` summary commento su QUELLA PR (#N) — SEMPRE, anche con zero candidate (`## Post-merge follow-up triage: zero outstanding items.`). Questo commento è il MARKER DI IDEMPOTENZA del batch: senza, la prossima run schedulata ri-triagia la stessa PR. Include la sezione `Live-verification` (checklist `- [ ]` batchata) se ce ne sono; vedi FOLLOWUP.md § Closing comment.

            **Constraint:**
            - Read-only eccetto `gh issue create`, `gh pr comment`.
            - Mai modificare PR label/state/title. Mai chiudere/riaprire issue.
            - Incerto sul filtro → crea con rationale "needs triage".
            - NB: la supersede detection NON è scope di questo prompt — la fa già `followup-reconcile.yml` deterministico daily (zero-Claude).

      # NB: niente self-retry step (era richiesto dal modello per-PR, dove un run fallito
      # = triage perso per sempre). Nel modello batch il watermark avanza SOLO su run di
      # SUCCESSO → una run fallita lascia il watermark indietro → la prossima run
      # schedulata (≤3h) ri-copre l'intera finestra; l'idempotenza (commento
      # `## Post-merge follow-up triage`) salta le PR già processate e riprende le altre.
      # Retry at-least-once by-construction, senza ricorsione né `actions: write`.

      - name: Claude usage metrics
        if: always()
        # Exact token/cost for this run (replaces estimates). Writes a table to the run
        # Step Summary + a grep-able CLAUDE_USAGE line to the log. Best-effort: never fails.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.followup.outputs.execution_file }}" "post-merge-followup"
