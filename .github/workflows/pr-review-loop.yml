name: PR Review (Claude single-pass)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DISABILITATO: il run 26586585273 ha registrato total_cost_usd: 0.64 nonostante
    # claude_code_oauth_token settato. Da chiarire se telemetria informativa
    # (subscription quota, mostrata in USD equivalente) o consumo reale API credits.
    # Riabilitare SOLO dopo verifica su console.anthropic.com / claude.ai/usage
    # che il billing non addebita le run dell'action.
    if: false && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15 --model claude-sonnet-4-6"
          prompt: |
            Sei il reviewer automatico per la PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}").

            ## Bootstrap (in quest'ordine)
            1. Leggi `REVIEW.md` nella root del repo. **Quel file è il tuo contratto operativo: severity, filtro scopo progetto, completeness contract, formato output, esempi.** Tutto ciò che segue qui sotto è secondario rispetto a REVIEW.md.
            2. Leggi `AGENTS.md` solo come contesto di progetto (non-negotiables, architettura).
            3. Carica la PR:
               - `gh pr view $PR_NUMBER --json title,body,labels,baseRefName,headRefName`
               - `gh pr diff $PR_NUMBER`
               - `gh pr view $PR_NUMBER --json files`

            ## Workflow di review

            **Step 1 — verifica completeness contract.**
            La PR description DEVE contenere le sezioni `## Implementato` e `## Non implementato (ancora)` (vedi REVIEW.md). Se mancano una o entrambe, posta UN SOLO finding 🔴 process:
            `PR body:L0: 🔴 Important: mancano sezioni Implementato / Non implementato. Aggiungere per consentire review sostanziale.`
            e termina (no altri finding).

            **Step 2 — review degli item in "Implementato".**
            Per ogni voce: pensiero critico sulla correttezza (logica, edge case, semplicità, fa davvero quello che dichiara). Filtra ogni candidato finding attraverso il filtro scopo progetto di REVIEW.md (monetizzazione / traffico organico / funzionamento funnel). Se non passa il filtro, NON riportarlo.

            **Step 3 — review degli item in "Non implementato (ancora)".**
            Per ogni voce: domandati se è **critica per monetizzazione o traffico organico**. Se sì → finding 🔴 Important chiedendo o implementazione pre-merge o follow-up issue documentata. Se no → ignora.

            **Step 4 — scope drift.**
            Cose nel diff non dichiarate in nessuna delle due sezioni → 🟡 Nit (cap a 3 per review).

            **Step 5 — posta la review.**
            Un singolo comando:
            `gh pr review $PR_NUMBER --comment --body "<markdown>"`

            Formato body (esatto):
            ```
            ## Scope
            <una frase: cosa la PR dichiara di fare>

            ## Findings (Important: N, Nit: M)
            <una riga per finding, formato REVIEW.md>
            ```

            Se zero 🔴 Important e zero 🟡 Nit: chiudi con `## LGTM` + una frase di recap. Non inventare finding per riempire.

            ## Constraint operativi

            - **Single-pass**: una sola review per run. Non aprire più review.
            - **No push, no edit file**: sei in modalità lettura. Non modificare il repo.
            - **No security cavilli**: ignora XSS, injection, secret leak, path traversal — fuori scope (vedi REVIEW.md "Cosa IGNORARE").
            - **No style nitpick**: ignora naming, formatting, type strictness salvo che mascherino bug logici reali.
            - **Verification bar**: se incerto su un comportamento, usa `❓ q:` invece di un 🔴/🟡 speculativo.

            Il tuo obiettivo è dare un secondo paio d'occhi che faccia chiudere lo scope del progetto (monetizzazione + traffico), non un compitino di code review accademico.
