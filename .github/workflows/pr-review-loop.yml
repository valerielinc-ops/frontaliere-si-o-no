name: PR Review (Claude single-pass)

# Trigger = COMPLETAMENTO di `tests` (vitest), NON più `pull_request` diretto.
#
# Razionale (token-burn, il driver #1 della quota Max del loop): col vecchio
# trigger `pull_request` la review Claude (opus@40 8-11min / sonnet@25 ~5min)
# girava IN PARALLELO a vitest → veniva SPESA anche su PR che poi falliscono i
# test. auto-merge richiede `## LGTM` E `vitest==success`: a test rossi la review
# era buttata, l'agent pushava un fix (`synchronize`) e una review ripartiva (il
# re-review guard salta Claude solo per delta data/docs-only / contributo
# invariato, NON per un fix-code) → costo quota raddoppiato. Gateando la review
# sul completamento-success di `tests`, Claude non parte MAI su code rosso: si
# spende UNA review, sull'head già verde. Anche la PRIMA review è risparmiata su
# una PR che fallisce i test. (Sui re-push verdi resta attivo il tier
# `incremental`/`incremental-high`: si reviewa solo il delta dall'ultima review.)
#
# Trade-off: +~6-9min di latenza happy-path (test→review serializzati invece che
# paralleli). Accettabile perché il vincolo del loop è la quota Max, non il
# wall-clock; la disciplina agent-side (npm test PRIMA di `gh pr create`, vedi
# AGENTS.md `## Build And Test` + prompt di issue-fix) tiene comunque l'happy-
# path verde al primo colpo, così la review parte subito dopo i test.
#
# Perché è safe gateare qui:
#   - `tests` gira su OGNI `pull_request:[main]` SENZA paths-ignore → nessuna PR
#     resta senza check vitest → gateare non lascia PR orfane.
#   - `tests` ha `cancel-in-progress` keyed sul ref → i SHA superati concludono
#     'cancelled' (≠ success) → solo l'ultimo head verde fa partire la review.
#   - SOLO `workflow_run.event == 'pull_request'` (vedi job `if`): l'autorebase
#     ri-lancia `tests` via `workflow_dispatch` PROPRIO per non ri-triggerare la
#     review (LGTM carry-forward su pure main-merge); escludendo quel caso
#     preserviamo il no-re-review sul rebase. I push su `main` (no PR) sono
#     anch'essi esclusi.
#   - Bonus: i workflow triggerati da `workflow_run` usano SEMPRE il file di
#     `main` → niente più workflow-validation drift-401 (la review non dipende
#     più dalla versione del file sul branch PR).
on:
  workflow_run:
    workflows: ['tests']   # name: del workflow tests.yml (check-run vitest)
    types: [completed]

# Collassa re-run rapidi sullo stesso branch a una sola review (i SHA superati
# sono già cancellati a monte da `tests`). Keyed sul branch perché in un evento
# `workflow_run` NON è disponibile `pull_request.number`; head_branch identifica
# la PR così PR diverse non si cancellano a vicenda.
#
# ── L'EVENTO STA NEL GROUP (metà sito di issue #5614, corretta) ─────────────
#
# `tests.yml` qui NON è scopato al solo `pull_request`: ha anche `push:
# branches:[main]` e — quello che morde — `workflow_dispatch`, che
# `pr-autorebase.yml` usa per ri-lanciare `tests` sull'head appena rebasata di
# una PR (un push via PAT su un branch di PR non ri-triggera sempre
# `pull_request`, vedi il commento in tests.yml). Quel run di `tests` produce
# comunque un `workflow_run: completed` con lo STESSO `head_branch` della PR, e
# con group keyed solo sul branch cadeva nello stesso slot della review vera.
#
# Il danno è asimmetrico, come sul corpus: la run nata da `workflow_dispatch`
# viene SEMPRE saltata dal gate `if:` del job sotto (che pretende
# `workflow_run.event == 'pull_request'`), quindi con `cancel-in-progress: true`
# cancellava la review vera senza lasciare nessuna review al suo posto — non un
# errore, un'ASSENZA silenziosa. Misurato sul sito: 1 `cancelled` su 200 run
# (`gh run list --repo valerielinc-ops/frontaliere-si-o-no
# --workflow=pr-review-loop.yml --limit 200 --json conclusion`) — più raro che
# sul corpus (25/400, frontaliere-articles#286) perché lì `tests.yml` gira
# anche su push a QUALSIASI branch, non solo main, ma lo stesso meccanismo.
#
# `workflow_run.event` distingue il trigger che ha fatto partire `tests`
# ('pull_request' vs 'workflow_dispatch' vs 'push') così le due run per lo
# stesso branch finiscono in gruppi diversi e non si cancellano a vicenda.
# Stessa riga di frontaliere-articles#286 (mirror engine), minus
# `github.event_name` / `inputs.pr`: qui pr-review-loop.yml ha un solo trigger
# (`workflow_run`), quindi quella parte sarebbe una costante — il corpus la
# porta perché LUI ha anche un `workflow_dispatch` proprio su questo file
# (issue #201), che qui non esiste.
concurrency:
  group: pr-review-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Non-code paths (Tier-2 token-lever): dati/static rigenerati + lockfile +
      # snapshot + asset binari. Sia il re-review guard sia la tier-decision li
      # strippano — una PR che tocca SOLO questi non ha CODE reviewabile → skip
      # Claude / tier minimal. Sorgente unica (AGENTS.md #6: niente regex letterale
      # duplicata tra step). Include lockfile (package-lock/pnpm-lock/yarn.lock),
      # `*.snap`, baseline binarie (png/jpg/webp/gif/svg/ico/woff) — es. una PR di
      # soli baseline PNG visivi sotto tests/ non deve escalare al tier high per
      # "diff binario".
      NONCODE_RE: '^(data/|public/|reports/|_newsletter_variants/|docs/)|(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$|\.(snap|png|jpe?g|webp|gif|svg|ico|woff2?)$'
    # Gate evento: SOLO `tests` concluso success (vitest verde) E triggerato da
    # un `pull_request` (i `workflow_dispatch` dell'autorebase e i `push` su main
    # sono esclusi — vedi header). Il filtro draft + l'esistenza della PR sono
    # verificati nello step `resolve` (un evento workflow_run non porta la PR).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    # Auth via CLAUDE_CODE_OAUTH_TOKEN da subscription Max (consuma quota piano,
    # non API credits). Verificato zero-cost: nessuna org Anthropic Console,
    # Usage credits $0.00 spent, "Extra usage not enabled". I total_cost_usd nel
    # log dell'action sono telemetria informativa equivalente API, non addebiti.
    steps:
      # ── Risolvi la PR dalla head del run di `tests` ──────────────────────
      # Un evento workflow_run NON porta la PR: la risolviamo dall'head_sha
      # (preciso: il commit testato-verde), fallback su head_branch. Niente PR
      # aperta o PR draft → `should_review=false` → tutti gli step sotto skip.
      # Mirror della resolve in auto-merge-on-lgtm.yml. NON serve checkout (solo
      # chiamate gh-API) → gira PRIMA del checkout, che poi prende la head SHA.
      - name: Resolve PR from tests run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          PRN=$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null || true)
          if [ -z "${PRN:-}" ] && [ -n "${RUN_HEAD_BRANCH:-}" ]; then
            PRN=$(gh pr list --repo "$REPO" --head "$RUN_HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -z "${PRN:-}" ]; then
            echo "Nessuna PR aperta per head_sha=$RUN_HEAD_SHA / branch=$RUN_HEAD_BRANCH — niente da revieware."
            { echo "pr_number="; echo "should_review=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta=$(gh pr view "$PRN" --repo "$REPO" --json isDraft,title 2>/dev/null || true)
          is_draft=$(echo "$meta" | jq -r '.isDraft // false')
          title=$(echo "$meta" | jq -r '.title // ""')
          if [ "$is_draft" = "true" ]; then
            echo "PR #$PRN è draft → skip review (parità col vecchio if: draft == false)."
            { echo "pr_number=$PRN"; echo "should_review=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NB: il debounce anti-burst NON è più qui — vive nello step
          # "Debounce burst pushes" più sotto, dopo l'avvio dell'install di
          # Headroom in background. Restava in questo step per ragioni storiche
          # e la sua `sleep 25` era puro tempo aggiunto: misurata a 26s di
          # "Resolve PR" (run 30372284779) PRIMA del checkout, quindi non
          # copriva nulla. Spostata dopo l'install bg, gli stessi 25s mascherano
          # l'install invece di sommarsi — e la finestra di ricontrollo della
          # head diventa più larga, quindi il debounce assorbe più burst.
          {
            echo "pr_number=$PRN"
            echo "should_review=true"
          } >> "$GITHUB_OUTPUT"
          # title può contenere caratteri speciali → delimitatore heredoc.
          {
            echo "title<<__TITLE_EOF__"
            echo "$title"
            echo "__TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Risolto PR #$PRN (draft=$is_draft) da tests run su $RUN_HEAD_SHA."

      - name: Checkout
        if: steps.resolve.outputs.should_review == 'true'
        uses: actions/checkout@v5
        with:
          # Un workflow_run-triggered job fa checkout del DEFAULT branch by
          # default: dobbiamo prendere ESPLICITAMENTE la head SHA testata-verde,
          # altrimenti il reviewer farebbe `rg`/`Read`/`Grep` su `main` invece
          # che sul code della PR. È anche esattamente il commit che vitest ha
          # verificato → review e test guardano lo stesso albero.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Shallow checkout: il reviewer NON usa MAI la git-history. Tutto il suo
          # lavoro è `gh pr view`/`gh pr diff` (GitHub API) + `rg`/`Read`/`Grep`
          # sul working tree HEAD (cross-file probing scopato al CODE, REVIEW.md
          # step 5). I soli strumenti che richiedono history — `git blame`,
          # `git log -L`, `git show <hist-sha>` — REVIEW.md non li invoca.
          #
          # Storia: `fetch-depth: 0 + filter: blob:none` (partial clone) prendeva
          # commit-graph completo + blob HEAD e deferiva i blob storici a una
          # lazy-fetch on-demand. Due costi: (1) il commit-graph di un repo a
          # heavy churn (data/jobs, ~11GB .git) è grande di suo → 58-94s baseline
          # di Checkout; (2) la lazy-fetch del partial clone occasionalmente
          # STALLAVA — osservato Checkout da 11 MINUTI (run 27672265799, PR #2394)
          # che mangiava il budget del timeout 15min → la Claude review partiva
          # con ~4min, veniva uccisa a metà pass → nessuna review postata → PR in
          # idle/stallo (auto-merge mai triggerato). Causa #1 di "review idle".
          #
          # `fetch-depth: 1` elimina ENTRAMBI: niente commit-graph history (non
          # scarica gli ~11GB di .git), niente partial clone → niente lazy-fetch
          # → niente stallo. Se mai servisse la history per un caso futuro,
          # ripristinare depth:0.
          fetch-depth: 1
          # NIENTE `sparse-checkout`, ed è una scelta MISURATA. Sarebbe stato
          # allettante: l'albero pesa ~2.6GB e il reviewer non apre mai
          # public/images/events (790MB), public/images/blog (361MB),
          # data/jobs (627MB), data/translation-cache (182MB),
          # data/seo-404-compat (164MB) né docs/newsletter-qa (90MB).
          #
          # Ma impostarlo porta actions/checkout su `--filter=blob:none`, e su
          # questo repo convertire il fetch bulk in lazy-fetch on-demand COSTA
          # invece di risparmiare: provato su tests.yml (fetch bulk identico a
          # questo, run 30361290650) il Checkout è passato da 75s a 169s, +125%.
          # Lo sparse-checkout paga solo dove il partial clone è già in uso —
          # in pr-body-contract.yml, che ha `filter: blob:none`, ha portato il
          # Checkout da ~200s a 77s. Qui il fetch è bulk, quindi no.
          #
          # (Il rischio non è solo di lentezza: è il partial clone ad aver
          # stallato un Checkout per 11 MINUTI su questo stesso job — run
          # 27672265799, PR #2394 — lasciando la review idle senza diagnosi.)
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        #
        # 8 -> 20 il 2026-08-18. Il tetto di 8 min era tarato per intercettare
        # quello stallo da 11 minuti, ma la banda utile fra «sano» e «rotto»
        # si è chiusa e il tetto ha smesso di discriminare.
        #
        # Misurato sulle ultime 800 run del workflow (263 Checkout del job
        # `review`, finestra 08-12 → 08-18): i 248 Checkout `success` hanno
        # p50 154s, p95 270s, p99 442s e **max 472s** — cioè 8 SECONDI sotto
        # il tetto di 480s. Le 6 morti valgono tutte **esattamente 480,000s**:
        # è il valore del tetto, non un valore prodotto da un guasto. Fra le
        # due popolazioni non c'è nessun buco, e uno strumento senza buco non
        # sta misurando la differenza che dichiara di misurare — sta tagliando
        # la coda della propria distribuzione. Lo `0 success sopra 480s` è
        # censurato per costruzione: un checkout che supera il tetto smette di
        # essere `success` per definizione.
        #
        # Il 2026-08-18 i tempi di Checkout sono raddoppiati su tutto il repo
        # dalle 14:00Z: p95 di giornata 419s contro i 206-240s dei sei giorni
        # precedenti, e 9 dei 12 Checkout sani più lenti dell'intera finestra
        # sono di oggi. Risultato: 5 review uccise su 4 PR distinte (#6029
        # 14:36, #6030 15:19, #6037 16:10, #6041 17:32, #6037 di nuovo 18:59)
        # contro UNA sola nei sei giorni precedenti. #6037 è rimasta senza
        # nessuna review — non è un ritardo, è una PR che il ciclo non può più
        # prendere, perché `auto-merge-on-lgtm` aspetta un `## LGTM` che nessuno
        # scriverà mai.
        #
        # E la cura era peggiore del male: un Checkout lento che comunque
        # finisce lascia la review partire, mentre il kill la cancella del
        # tutto. Il tetto non stava prevenendo il danno, lo stava causando.
        #
        # 20 min = 2,5x il massimo sano osservato, e resta 18x sotto il budget
        # del job (360 min), quindi un wedge vero viene ancora fermato in
        # tempo utile. Ri-misurare se il p99 si muove, non ri-derivare a
        # occhio: il numero vecchio era stato scelto su un singolo incidente.
        timeout-minutes: 20

      # Headroom install (~63s misurati su run 30353920865) in BACKGROUND: è
      # lavoro puramente I/O (pipx da PyPI) che non dipende da nulla degli step
      # sotto, quindi resta in ombra dietro Setup Node + re-review guard + tier
      # + debounce invece di aggiungersi in coda. `wait-all` più sotto lo
      # rijoina prima che il proxy serva davvero.
      #
      # DEVE restare uno step `run:`: `background:` su uno step `uses:` non è
      # supportato e rompe l'INTERO file workflow (zero job creati — incidente
      # PR #4777/#4779 su deploy.yml). Per questo l'install sta in install.sh e
      # non nella composite action, che resta `uses:` per gli altri 5 chiamanti.
      - name: Install Headroom (background)
        id: headroom-install
        if: steps.resolve.outputs.should_review == 'true'
        background: true
        run: bash .github/actions/setup-headroom/install.sh "proxy,code"

      - name: Setup Node.js
        if: steps.resolve.outputs.should_review == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Re-review guard: se il delta DALL'ULTIMA review claude-bot `## LGTM` tocca
      # SOLO file non-code (NONCODE_RE) NON ri-eseguiamo Claude — è il token-lever
      # #1: un crawler che rigenera `data/jobs/*.json` su una PR già LGTM'd faceva
      # ripartire una review a vuoto. L'approvazione regge perché auto-merge-eval
      # usa un fingerprint CODE-only → carry-forward; vitest è già verde (siamo qui
      # solo dopo un `tests` success). Conservativo: nessuna LGTM precedente, o
      # compare vuoto/errore → review piena. (Non c'è più un `ACTION`: ogni
      # invocazione è un `tests` success su una head; la presenza/assenza di LGTM
      # precedente determina full-vs-skip — su una PR appena aperta non c'è LGTM
      # → full.)
      - name: Re-review guard (skip Claude when no code changed since last LGTM)
        id: guard
        if: steps.resolve.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '[.[] | select(.user.type=="Bot" and (.user.login|test("claude";"i")) and (.body|contains("## LGTM")))] | last | .commit_id // empty' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Nessuna review LGTM precedente → review piena."; exit 0
          fi
          changed=$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Compare vuoto/errore → review piena (conservativo)."; exit 0
          fi
          code=$(echo "$changed" | grep -vE "$NONCODE_RE" || true)
          if [ -z "$code" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Delta dall'ultima LGTM = SOLO data/docs (nessun code) → skip Claude; LGTM carry-forward (fingerprint code-only), vitest già verde."
            exit 0
          fi
          # Il compare 2-dot last...HEAD vede ANCHE il code che main ha portato in
          # un rebase di solo main-merge — ma quel code NON è il contributo della
          # PR, che resta invariato. Confronta allora il FINGERPRINT del contributo
          # (3-dot vs merge-base con main, code-only) a HEAD vs all'ultima LGTM: se
          # uguale, la PR non ha cambiato il proprio code (es. autorebase ha solo
          # mergiato main) → skip Claude. Stessa funzione che auto-merge-eval usa
          # per il carry-forward dell'LGTM → niente drift. NULL/incerto → review
          # piena (conservativo). vitest gira comunque sull'head (safety net).
          fpHead=$(node scripts/ci/pr-contribution-fingerprint.mjs "$HEAD_SHA" 2>/dev/null || echo NULL)
          fpLast=$(node scripts/ci/pr-contribution-fingerprint.mjs "$last" 2>/dev/null || echo NULL)
          if [ -n "$fpHead" ] && [ "$fpHead" != "NULL" ] && [ "$fpHead" = "$fpLast" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Contributo CODE invariato dall'ultima LGTM (fingerprint $fpHead) — solo main-merge nel delta → skip Claude; LGTM carry-forward, vitest gira comunque."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Code del contributo cambiato dall'ultima LGTM (fpHead=$fpHead fpLast=$fpLast) → review piena."
          fi

      - name: Determine review tier
        id: tier
        if: steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        # Tier high (claude-sonnet-5, max-turns 60, adversarial pass): toccato CODE
        # funnel-critical — test gate, workflow CI, build-plugin SEO, o script
        # che mutano/emettono dati indicizzati (crawler/parser/adapter, backfill,
        # migrate, assemble dataset, sitemap/canonical/slug/structured-data).
        # Bug in questi path = falso senso di sicurezza che si propaga su ogni
        # merge, quindi probing rigoroso paga. Tier normal 15->25 (misurato: 13
        # run/7gg morti `error_max_turns` a num_turns=16 senza postare review,
        # es. run 27345572135/27340191180 - review intera bruciata + PR ferma
        # fino al rescuer). Tier normal (sonnet, max-turns 35) per
        # tutto il resto, inclusi gli script NON-funnel: `scripts/{ci,dev,evals}/`
        # (helper CI/dev) e gli audit/report read-only (`audit-*`, `analytics*`,
        # `*-report` — non mutano l'indice, verificano soltanto). Vedi REVIEW.md
        # → "Tier review".
        #
        # CODE vs DATA: il tier si decide SOLO sui file code. I file dati/static
        # rigenerati (NONCODE_RE) NON sono reviewabili come code → non escalano il
        # tier e una PR data/docs-only resta normal (sonnet posta comunque
        # `## LGTM` → auto-merge). Questo evita che 50 `data/jobs/*.json`
        # rigenerati da un crawler trascinino sul tier high o gonfino il diff.
        #
        # Budget 25→40: con l'espansione del contratto (REVIEW.md no-short-circuit
        # su tier high + step 7 perf-claim + escalation ❓ funnel-critical, sopra
        # il cross-file `rg` probing + adversarial check già presenti) il pass
        # tier-high su un diff reale sforava i 25 turni e terminava
        # `error_max_turns` SENZA postare review (PR #838, num_turns=26) — peggio
        # del process gate, perché niente LGTM → PR bloccata e zero finding.
        # Budget 40→60 (2026-07-17, owner): tier high morto di nuovo al cap 40
        # senza verdetto su PR #4324 (run 29556645538) — stessa classe #838.
        # Bump fleet-wide di tutti i tier (cap = anti-runaway sopra il p99 dei
        # run sani, non budget di lavoro; un run che muore al cap brucia la
        # quota intera e lascia la PR ferma, peggio di qualche turno in più).
        # 40 turni ≈ ~5.5 min; 60 ≈ ~8.5 min. Timeout 15min→360min (2026-07-17,
        # #4341): era il vincolo più stretto, uccideva review a metà pass
        # (num_turns morto ma minuti di CI esauriti prima) — vedi job timeout-minutes.
        run: |
          set -euo pipefail
          set_tier() {
            echo "tier=$1" >> "$GITHUB_OUTPUT"
            echo "model=$2" >> "$GITHUB_OUTPUT"
            echo "max_turns=$3" >> "$GITHUB_OUTPUT"
            echo "Review tier: $1 ($2, max-turns $3)"
          }
          files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          # Guard PR vuota (rebase-only, base == head): files vuoto. Default tier
          # normal: reviewer posta comunque `## LGTM` (no finding) e auto-merge
          # scatta.
          if [ -z "$files" ]; then
            echo "Empty file list (rebase-only or empty PR)."
            set_tier normal claude-sonnet-5 35
            exit 0
          fi
          # Strip DATA/static: il tier si decide solo sul CODE.
          code_files=$(echo "$files" | grep -vE "$NONCODE_RE" || true)
          if [ -z "$code_files" ]; then
            # Token-lever: una PR data/docs-only (zero code) non ha contributo
            # code-reviewable — l'unica cosa da verificare è il completeness
            # contract del body. Tier `minimal`: sonnet + max-turns 12 (8→12
            # nel bump fleet-wide 2026-07-17, il revert-trigger pre-dichiarato) +
            # prompt corto che SALTA la lettura di REVIEW.md, il cross-file
            # probing e l'adversarial check (tutti no-op senza code). Posta
            # comunque `## LGTM` come claude-bot → auto-merge invariato.
            # 12 turni bastano con margine per: leggi body+files, valida
            # contract, posta review (~4-6 turni osservati). REVERT-TRIGGER: se
            # compaiono `error_max_turns` sul tier minimal → bump 12→16.
            echo "Data/docs-only PR (no reviewable code touched) → tier minimal."
            set_tier minimal claude-sonnet-5 12
            exit 0
          fi
          # funnel_crit <file-list> → exit 0 se la lista contiene CODE funnel-critical
          # (test/CI/build-plugin, o script che mutano/emettono l'indice — tutto
          # scripts/ ECCETTO gli helper non-funnel {ci,dev,evals}/ e gli audit/report
          # read-only). Usato sia per il tier full sia per il delta incrementale.
          funnel_crit() {
            local fs="$1" a b
            a=$(echo "$fs" | grep -E '^(tests/|\.github/workflows/|build-plugins/)' || true)
            b=$(echo "$fs" | grep -E '^scripts/' | grep -vE '^scripts/(ci|dev|evals)/' | grep -viE '(audit|analytics|report)' || true)
            [ -n "$a$b" ]
          }

          # (Rimossa 2026-07-17 la variante crawler_parser_only del 2026-06-30:
          # discriminava SOLO il modello — claude-sonnet-4-6 sui diff
          # crawler/parser-only — e il modello è ora UNIFICATO claude-sonnet-5
          # su ogni tier per decisione owner. Stesso scope e stessi turni.)

          # ── Incremental re-review (token-lever): se esiste GIÀ una review Claude su
          # un commit precedente, valuta SOLO il delta dei file della PR dall'ultimo
          # commit reviewato, non l'intera PR. Il grosso del contributo era già stato
          # reviewato; ri-leggerlo per intero a ogni fix-push brucia token (osservato
          # su #3038: review Opus full ripetute sullo stesso codice). Modello per
          # criticità del DELTA: funnel-critical → tier high/claude-sonnet-5 (rigore,
          # scope ridotto); altrimenti tier incremental (modello sempre claude-sonnet-5). Prima review /
          # nessun commit precedente / delta vuoto
          # → review piena (sotto). Il fingerprint-skip a monte (guard step) copre già
          # il caso "contributo invariato"; qui il contributo È cambiato, ma in modo
          # incrementale. Il prompt resta autorizzato a Read/grep i file pieni per il
          # contesto → le interazioni col code non-toccato restano coglibili.
          lastRev=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '[.[] | select(.user.type=="Bot" and (.user.login|test("claude";"i")))] | last | .commit_id // empty' 2>/dev/null || true)
          if [ -n "$lastRev" ] && [ "$lastRev" != "$HEAD_SHA" ]; then
            delta_code=$(gh api "repos/$REPO/compare/$lastRev...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null \
              | grep -Fxf <(echo "$code_files") || true)
            if [ -n "$delta_code" ]; then
              echo "incremental_base=$lastRev" >> "$GITHUB_OUTPUT"
              echo "Incremental re-review: solo il delta dei file PR da $lastRev:"; echo "$delta_code"
              if funnel_crit "$delta_code"; then
                set_tier incremental-high claude-sonnet-5 35
              else
                # 25→35 (2026-07-17, analisi Fable-5 su 112 morti error_max_turns
                # storiche di questo workflow): incremental è il tier con meno
                # morti in assoluto (1 storica + 1 marginale il 2026-07-17 stesso,
                # run 29569000630, PR #4343, nt=26 su cap 25 — verdetto già
                # formato, morto per overhead di setup non per taglia del delta).
                # Bump di allineamento/assicurazione a parità con incremental-high,
                # NON perché il pattern sia ricorrente qui: se muore ancora a 35
                # dopo i fix di prefetch/disciplina-turni sopra, è di nuovo un
                # problema strutturale, non di budget — non ribumpare al buio.
                set_tier incremental claude-sonnet-5 35
              fi
              exit 0
            fi
            echo "Nessun delta-code nei file PR dall'ultima review → review piena."
          fi

          # CODE funnel-critical → high (full scope, 60 turni), altrimenti normal
          # (35 turni). Modello UNIFICATO claude-sonnet-5 su OGNI tier (owner
          # 2026-07-17: mai claude-sonnet-4-6).
          #
          # high-mega (2026-07-17, analisi Fable-5): la coda di PR sovradimensionate
          # (crawler-batch multi-file: #3428 x6 morti, #3355 x5, #3450 x4) muore
          # ripetutamente anche al cap alto e in 2 casi (#3428, #3450) è finita
          # MERGIATA dall'owner senza NESSUNA review mai postata — il gate LGTM
          # degradato a no-review-at-all esattamente sulle PR funnel-critical più
          # grandi. Soglia dimensionale separata dal budget-per-complessità
          # ordinario: non un bump generico, isola la coda misurata.
          code_file_count=$(echo "$code_files" | grep -c . || true)
          if funnel_crit "$code_files"; then
            if [ "$code_file_count" -ge 25 ]; then
              set_tier high-mega claude-sonnet-5 90
            else
              set_tier high claude-sonnet-5 60
            fi
          else
            set_tier normal claude-sonnet-5 35
          fi

      # Rijoina l'install lanciato in background sopra. `wait-all` invece di
      # `wait: headroom-install` perché quando lo step bg è saltato (PR non
      # reviewabile) non c'è nessun bg outstanding e `wait-all` è un no-op,
      # mentre attendere per id uno step mai avviato non ha semantica definita.
      # Debounce anti-burst (#3153), spostato qui da "Resolve PR from tests run".
      #
      # Cosa protegge: un burst di push ravvicinati sullo stesso branch (agent
      # che itera fix in <1min) può produrre PIÙ eventi `tests`-success in
      # sequenza. Il `cancel-in-progress` di `tests` (keyed sul ref) ne elimina
      # gran parte, ma una corsa in cui ogni push arriva DOPO che il precedente
      # ha già concluso con successo fa comunque partire una review Claude per
      # uno SHA che sta per essere superato. Si dorme una finestra breve e si
      # ricontrolla la head LIVE: se è avanzata, il `tests` del push più recente
      # farà scattare la propria review (gira su OGNI push, niente
      # paths-ignore), quindi uscire qui non lascia MAI la PR senza review.
      #
      # Perché QUI e non più nel resolve: identica semantica, ma questi 25s ora
      # cadono mentre l'install di Headroom lavora in background, invece che da
      # soli prima del checkout. Misura che ha motivato lo spostamento (run
      # 30372284779): "Resolve PR" 26s + "Install Headroom (background)" 32s di
      # cui 30s riassorbiti dal wait — gli step fra install e wait (Setup Node,
      # re-review guard, tier) durano <2s in totale, quindi non mascheravano
      # niente. Con il debounce qui la finestra di copertura passa da ~2s a ~27s
      # e il ricontrollo della head diventa pure più tardivo, cioè più efficace.
      - name: Debounce burst pushes (recheck PR head)
        id: debounce
        if: steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRN: ${{ steps.resolve.outputs.pr_number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          echo "Debounce: attesa 25s per assorbire push rapidi in burst prima di invocare Claude..."
          sleep 25
          LIVE_SHA=$(gh pr view "$PRN" --repo "$REPO" --json headRefOid --jq '.headRefOid // empty' 2>/dev/null || true)
          if [ -n "${LIVE_SHA:-}" ] && [ "$LIVE_SHA" != "$RUN_HEAD_SHA" ]; then
            echo "Debounce: PR #$PRN è avanzata a $LIVE_SHA (questo evento era per $RUN_HEAD_SHA) — un push più recente è già arrivato, la sua run di tests/review se ne occuperà. Skip."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"

      - name: Wait for background Headroom install
        wait-all: true

      - name: Setup Headroom compression proxy
        if: steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.debounce.outputs.superseded != 'true'
        uses: ./.github/actions/setup-headroom
        with:
          # L'install è già girato in background sopra: qui serve solo far
          # partire il proxy e scrivere ANTHROPIC_BASE_URL.
          skip-install: 'true'

      - name: Prefetch review context (zero-Claude, saves turns)
        id: prefetch
        # tier `minimal` ha il suo percorso corto (≤6 turni, gh pr view diretto
        # nel prompt) e non legge mai $CTX_DIR — skip per non sprecare 3 gh call
        # a vuoto su ogni PR data/docs-only.
        if: steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.tier.outputs.tier != 'minimal' && steps.debounce.outputs.superseded != 'true'
        # Fetch una volta sola, PRIMA che Claude parta, ciò che il prompt gli
        # farebbe rifare turno-per-turno (osservato in 3/3 transcript morti
        # error_max_turns analizzati 2026-07-17: `gh pr view`, `gh pr diff`, il
        # compare incrementale rieseguito 2-3x con --jq diversi, il fetch dello
        # sticky sibling-check — 5-8 turni di setup misurati su un cap di 25).
        # Zero costo Claude: puro bash. Il prompt sotto legge questi file con
        # `Read` invece di rieseguire le stesse `gh` call a ogni turno.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
          REPO: ${{ github.repository }}
          CTX_DIR: ${{ runner.temp }}/review-ctx
        run: |
          set -uo pipefail
          mkdir -p "$CTX_DIR"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body,labels,files > "$CTX_DIR/pr.json" \
            || echo '{}' > "$CTX_DIR/pr.json"
          gh pr diff "$PR_NUMBER" --repo "$REPO" \
            --exclude 'data/**' --exclude 'public/**' --exclude 'reports/**' \
            --exclude '_newsletter_variants/**' --exclude 'docs/**' \
            > "$CTX_DIR/diff.patch" \
            || echo "(diff fetch failed — rieseguire gh pr diff manualmente)" > "$CTX_DIR/diff.patch"
          if [ -n "${INCREMENTAL_BASE:-}" ]; then
            gh api "repos/$REPO/compare/$INCREMENTAL_BASE...$HEAD_SHA" \
              --jq '.files[] | select(.filename|test("^(data|public|reports|_newsletter_variants|docs)/")|not) | "\(.filename)\n\(.patch // "(binary/large)")"' \
              > "$CTX_DIR/delta.patch" \
              || echo "(delta fetch failed — rieseguire la gh api compare manualmente)" > "$CTX_DIR/delta.patch"
          fi
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body // "" | contains("<!-- sibling-check -->"))] | last | .body // empty' \
            > "$CTX_DIR/sibling-check.md" 2>/dev/null || true
          echo "Prefetched review context in $CTX_DIR:"
          ls -la "$CTX_DIR"

      - name: Run Claude review
        id: claude_review
        if: steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.debounce.outputs.superseded != 'true'
        # Don't let a hard action failure abort the job before the guard below
        # can classify it — the guard decides whether to fail loudly.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Le PR fix-issue sono aperte da `claude[bot]`: senza whitelist
          # claude-code-action aborta ("non-human actor"). Whitelist esplicita
          # (hardening #898): mai `*`. `claude[bot]` copre le PR fix-issue;
          # `github-actions[bot]` copre eventuali PR aperte da automation interna
          # (run 26621967484 era exit 1 col precedente vincolo non-human-actor).
          # `frontaliere-automation[bot]` (App): sotto workflow_run l'actor della
          # review = l'actor del run di `tests` → su una PR la cui ultima push
          # viene dall'App (autorebase / redflag-fixer / issue-fix) `github.actor`
          # è l'App-bot; senza whitelist la review abortirebbe "non-human actor".
          allowed_bots: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          show_full_output: true
          # Owner-approved 2026-07-01: `--dangerously-skip-permissions` sostituisce
          # l'`--allowedTools` scoped precedente. Il reviewer restava bloccato su
          # probing esplorativo legittimo (es. testare `${!key_var}` indirect
          # expansion in un tmp script durante la review di PR #3180, bash -n
          # syntax-check) fuori dall'allowlist gh/rg/git/Read/Grep/Glob — si
          # arrangiava sempre (review completa comunque postata), ma su richiesta
          # esplicita si rimuove il vincolo così Claude ha accesso pieno.
          # Rischio noto e accettato: reviewer gira su OGNI PR (incluse quelle
          # aperte da bot/automation) con GITHUB_TOKEN pull-requests:write +
          # issues:write, senza restrizione su Bash/Write/Edit.
          claude_args: "--max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --dangerously-skip-permissions"
          prompt: |
            Reviewer automatico PR #${{ steps.resolve.outputs.pr_number }} ("${{ steps.resolve.outputs.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Tier `minimal` (PR data/docs-only, ZERO code) — percorso corto, ≤6 turni:** NON leggere `REVIEW.md` né `AGENTS.md`, NON fare cross-file probing né adversarial check (no-op senza code). Fai SOLO: (1) `gh pr view $PR_NUMBER --json title,body,files`; (2) verifica il completeness contract del body — `## Implementato` e `## Non implementato (ancora)` presenti, ogni bullet sensato, nessun placeholder vuoto/`TBD`; un bullet che dichiara `per scelta` / `by construction` / `blocked: decisione del proprietario` **col motivo scritto dopo lo stato** è una voce CHIUSA: non chiederne l'implementazione, non è un finding; (3) se il body è a posto → posta `gh pr review $PR_NUMBER --comment --body` con una review breve che chiude con `## LGTM` (string esatta → auto-merge); se il contract è violato → `🟡` (o `🔴 Important` se grave) e NIENTE `## LGTM`. Non aprire/scorrere i file dati/static. FERMATI dopo aver postato. (Se il Tier NON è `minimal`, ignora questo paragrafo e segui la Disciplina turni + Bootstrap sotto.)

            **Disciplina turni (budget rigido, tutti i tier eccetto `minimal`):** hai un budget di ${{ steps.tier.outputs.max_turns }} turni. Un messaggio con tool-call = 1 turno **indipendentemente da quanti tool_use contiene** — dati storici (112 morti `error_max_turns` analizzate su questo workflow, 2026-07-17) mostrano p50 ~20 turni contro un lavoro reale che ne richiederebbe ~10-12: la differenza è quasi tutta overhead meccanico, non ragionamento. Quindi: (1) probe indipendenti (grep/Read/gh su file diversi, verifiche non correlate) vanno emesse **in parallelo nello stesso messaggio**, mai una-per-turno; (2) `PR_NUMBER`/`HEAD_SHA`/`INCREMENTAL_BASE` sono già nell'env di questo prompt — mai spendere un turno su `env`/`printenv` per rileggerli; (3) il checkout NON ha `node_modules` installato — mai `npm`/`npx`/build/test runner, il verdetto si basa su lettura statica del diff, non su esecuzione; (4) **entro il turno $((${{ steps.tier.outputs.max_turns }} - 5))** DEVI aver postato la review — se a quel punto hai ancora verifiche aperte, postale come `❓ q:` (con l'escalation funnel-critical già normata sotto) invece di continuare a probeare: una review postata con un `❓` sblocca il loop, una review MAI postata brucia l'intero run senza verdetto (è successo in almeno un caso osservato: verdetto già formato al turno 22 su un cap di 25, morto al 26 senza mai postare).

            **Bootstrap:**
            1. Leggi `REVIEW.md` — contratto operativo completo (tier, severity, filtro scopo, completeness contract, cross-file pattern repetition, test plan compliance, adversarial check, format).
            2. `AGENTS.md` è grande: NON leggerlo salvo necessità specifica esplicita (un finding richiede di citare un non-negotiable preciso). REVIEW.md basta da solo per il workflow di review — leggere AGENTS.md a ogni run è token sprecato.
            3. Il contesto PR è già prefetchato (zero-Claude, prima che tu parta) in `${{ runner.temp }}/review-ctx/`: `pr.json` (`gh pr view --json title,body,labels,files`) e `diff.patch` (diff del SOLO code, stesso `--exclude` di sempre). **Leggili con `Read` — non rieseguire `gh pr view`/`gh pr diff`**, è lo stesso identico output e rifarlo brucia turni di setup. I file dati/static rigenerati (`data/**` job JSON, snapshot, translation-cache, blog-articles; `public/**` immagini/asset) NON sono code: NON revieware il loro contenuto riga-per-riga né contarli come finding — valuta solo se il CODE che li genera è corretto. Se serve un campione di output dati, aprilo mirato con `Read`, non scorrere l'intero blob nel diff.

            **Re-review INCREMENTALE (solo se `INCREMENTAL_BASE` è valorizzato, tier `incremental`/`incremental-high`):** i commit fino a `$INCREMENTAL_BASE` sono GIÀ stati reviewati in un pass precedente — NON ri-revieware l'intero contributo. Il delta dei file code dall'ultima review è già prefetchato in `${{ runner.temp }}/review-ctx/delta.patch` — **leggilo con `Read`, non rieseguire la `gh api compare`** (rifarla turno-per-turno era il primo consumatore di setup-turni osservato). Concentra la review su QUESTE modifiche e sulle loro interazioni. Sei comunque autorizzato (e incoraggiato, se il delta tocca o dipende da code non incluso) a `Read`/`grep` i file pieni per il CONTESTO — l'obiettivo è non ri-spendere token rivalutando code già approvato, non chiudere gli occhi sulle interazioni. Severity e formato invariati. Se il delta è vuoto o solo data/docs → chiudi con `## LGTM` senza inventare finding.

            **Esegui workflow di review come specificato in REVIEW.md:**
            - completeness contract → Implementato critical thinking → Non implementato filtro scopo → scope drift → cross-file pattern repetition (step 5) → test plan compliance (step 6) → claim perf non validato (step 7) → output.
            - **Stati letterali di `## Non implementato (ancora)` — sono SEI, e tre CHIUDONO la voce (REVIEW.md step 2).** Lavoro ancora dovuto: `in questa PR`, `PR concatenata #N`, `blocked: <causa tecnica>`. Voce chiusa con un motivo: `per scelta`, `by construction`, `blocked: decisione del proprietario`. **Su un bullet che dichiara uno dei tre chiudenti e porta il motivo DOPO lo stato non si emette 🔴** («va implementato»): è un no motivato, ed è la stessa tassonomia che `scripts/ci/followup-has-candidates.mjs` (`CLOSING_STATES`) e i due fixer autonomi leggono da `scripts/lib/pr-body-sections-check.mjs`. Ri-emetterlo non lo fa chiudere da nessuno — il 🔴-fixer legge lo stato e declina, il round si consuma, e a round 2 la PR prende `needs-human` con la diagnosi sbagliata «il fixer non ce la fa» su una PR che non aveva niente da fixare. Motivo debole → `❓ q:`. Resta 🔴 il caso opposto: stato chiudente SENZA motivo, o col motivo che nega lo stato («non per scelta ma per un limite dell'API») — quello è un `out of scope` travestito.
            - Tier `high`, `high-mega` (PR funnel-critical sovradimensionata, stesso rigore di `high` con più turni) O `incremental-high`: aggiungi sezione `## Adversarial check` con 3 cose NON verificate prima del summary finale (per incremental-high: limitate al delta reviewato).
            - **Sezioni mancanti + tier `high`/`high-mega` (REVIEW.md step 4): posta il 🔴 process MA NON terminare.** Prosegui con review sostanziale + `## Adversarial check` completi nello stesso pass — il 🔴 blocca solo l'auto-merge, non un merge manuale, quindi la sostanza deferita evapora. Solo tier normal può terminare al process gate.
            - **Claim perf non validato (REVIEW.md step 7):** PR perf/build/CI che dichiara speedup/regressione attesa senza misura baseline pre-merge (solo "atteso X→Y" / "il profiler misura post-deploy") su tier `high`/`high-mega` → 🔴 Important. Chiedi misura pre/post o revert-risk esplicito.
            - **Escalation ❓ funnel-critical (REVIEW.md Verification):** un ❓ q (incluso quelli nell'adversarial check) il cui soggetto impatta monetizzazione/traffico (writeJson/persistenza dataset indicizzato, canonical/redirect/previousSlugs, structured data, sitemap, AdSense) → promuovi a 🔴 o apri follow-up issue + linkala. Mai ❓ funnel-critical passivo accanto a `## LGTM`.
            - **No missing-test findings (REVIEW.md → IGNORA → test coverage):** NON sollevare "manca un test" / "aggiungi coverage" / "pinna con un test" come 🟡 nit né come voce `## Adversarial check`, nemmeno su path funnel-critici. Nell'adversarial check elenca rischi di COMPORTAMENTO/correttezza non verificati, mai assenza di test. Eccezione (resta in scope): un BUG in un test ESISTENTE (assertion/regex/guard leaky, fixture date assolute).

            **Cross-file pattern probing (REVIEW.md step 5):** il commento sticky `<!-- sibling-check -->` (postato dal job zero-Claude di pr-body-contract), se presente sulla PR, è già prefetchato in `${{ runner.temp }}/review-ctx/sibling-check.md` — leggilo con `Read` invece di cercarlo via `gh api`/`gh pr view --json comments`: contiene già i file gemelli candidati che condividono i costrutti modificati dal diff — parti da quella lista (verifica i candidati, non fidarti ciecamente: è token-match euristico). Se il file è vuoto o insufficiente, quando il diff fix-a un pattern (regex, parsing idiom, assertion shape), usa `rg` per cercare il pattern equivalente nel resto del repo. **Scopa la ricerca al CODE** — `rg <pattern> scripts build-plugins components services functions server hooks tests` (oppure `rg <pattern> -g '!data/**' -g '!public/**' -g '!reports/**'`): cercare dentro `data/`/`public/` matcha migliaia di blob dati rigenerati = turni e token sprecati senza segnale. Pattern presente non toccato in file funnel-critico → 🔴; altrove → 🟡.

            **Posta UNA review:**
            `gh pr review $PR_NUMBER --comment --body "<markdown formato REVIEW.md>"`

            **Constraint:**
            - Single-pass, una sola review per run.
            - Read-only: no push, no edit file.
            - Zero finding accettabile → chiudi con `## LGTM` (string esatta triggera auto-merge). Non inventare per riempire.
            - 🔴 aperto → NON scrivere `## LGTM`.
            - ❓ funnel-critical non escalato (né 🔴 né follow-up issue) → NON scrivere `## LGTM`.
            - Incerto → `❓ q:`, no speculazione.

      - name: Fail on transient API error (no review posted)
        # claude-code-action can exit 0 even when the model run ABORTED on a
        # transient Anthropic API error WITHOUT posting a review. The job then
        # looks green but no `## LGTM`/finding was written → the PR silently
        # stalls (observed PR #2340, API 500 mid-run). Classify from the exec log:
        #  - max_turns (terminal_reason) → FAIL LOUDLY + PR comment: MUST be
        #    checked BEFORE the 429 heuristic below. Root cause (PR #3555/#3556,
        #    2026-07-05): the bare `rate[ _-]?limit` alternative in the 429 regex
        #    matches ANY occurrence of that substring in the exec file — which
        #    includes benign per-request rate-limit-headroom metadata present on
        #    EVERY call, success or not. Combined with `is_error:true` (also set
        #    generically on a max_turns abort), a review that simply ran out of
        #    turns (tier high, 40, turns=41 observed) was silently misclassified
        #    as a 429 and downgraded to a warning — job stayed green, zero review
        #    posted, no signal anything was wrong. max_turns is a different
        #    failure mode (this PR's diff was too large/complex for the turn
        #    budget, not a global-quota event) — failing loud here carries no
        #    quota-storm risk, and posting a PR comment surfaces it even to
        #    someone only watching the PR (not the Actions log).
        #  - 5xx / overloaded / server_error → FAIL LOUDLY (red + re-runnable):
        #    the server recovers fast, an immediate re-run is useful.
        #  - 429 (quota / rate_limit) → do NOT fail (Tier-2 token-lever): a red
        #    429 triggers a re-run (push / stale-PR rescuer) that re-hits the
        #    ALREADY-exhausted shared Max quota → self-amplifying storm during a
        #    burst (custode-measured ~10% of runs). Exit 0 with a warning; the PR
        #    has no `## LGTM` so it won't auto-merge, and it gets re-reviewed on
        #    the next push / by the rescuer once quota recovers. No false-green.
        # `set -uo pipefail` (NOT -e): grep in conditionals must not abort.
        if: always() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.debounce.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
          EXEC_FILE: ${{ steps.claude_review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          REVIEW_MAX_TURNS: ${{ steps.tier.outputs.max_turns }}
        run: |
          set -uo pipefail
          # max_turns FIRST — see rationale above. Must win over the 429 regex.
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ] \
             && grep -qE '"terminal_reason"[[:space:]]*:[[:space:]]*"max_turns"' "${EXEC_FILE}"; then
            # 2026-07-17 (analisi Fable-5, 112 morti storiche): arricchisce il
            # comment con tier/cap/turni-usati — prima era un blob opaco che non
            # diceva NULLA su quanto ci si era avvicinati al cap né su quale tier
            # era coinvolto, rendendo impossibile per un umano giudicare a colpo
            # d'occhio se sia un caso marginale (1 turno sopra cap) o un pattern
            # ricorrente su una PR sovradimensionata (i dati mostrano che quel
            # secondo caso è quasi-deterministico su retry: split la PR, non
            # ri-lanciare all'infinito).
            NUM_TURNS=$(grep -oE '"num_turns"[[:space:]]*:[[:space:]]*[0-9]+' "${EXEC_FILE}" | tail -1 | grep -oE '[0-9]+' || true)
            BODY=$(printf '⚠️ **Review automatica fallita** (`terminal_reason=max_turns`, tier `%s`, cap %s turni, turni usati %s): Claude ha esaurito il budget di turni prima di poter postare un verdetto (`## LGTM` / 🔴). Nessuna review è stata pubblicata su questa PR — auto-merge non può scattare finché non ce n’è una.\n\nLog del run: %s\n\nPer sbloccare:\n- rilancia il job (rerun del run `tests` più recente di questa PR fa ripartire anche `pr-review-loop`), oppure\n- esegui la review in locale: checkout del branch, poi lancia la review con lo stesso contratto di `REVIEW.md` sul diff verso `main` (es. skill `/code-review` a effort alto) prima di mergiare a mano.\n\nSe questa PR ha già avuto una morte `max_turns` in precedenza, un retry raramente basta — dato osservato: le morti ripetute sono quasi tutte su PR con molti file indipendenti in un unico batch; valuta di splittarla in PR più piccole.' "${REVIEW_TIER:-?}" "${REVIEW_MAX_TURNS:-?}" "${NUM_TURNS:-?}" "$RUN_URL")
            gh pr comment "$PR_NUMBER" --body "$BODY" || echo "::warning::gh pr comment fallito (non bloccante)."
            echo "::error::Claude review hit max-turns (tier=${REVIEW_TIER:-?}, cap=${REVIEW_MAX_TURNS:-?}, turns=${NUM_TURNS:-?}) without posting a review — re-run this job, or split the PR if this recurs."
            exit 1
          fi
          # 429 / rate-limit: even if outcome=failure, a 429 must NOT fail the
          # job (Tier-2 lever: avoids re-run amplification of the shared Max quota).
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ] \
             && grep -qE '"is_error"[[:space:]]*:[[:space:]]*true' "${EXEC_FILE}" \
             && grep -qiE '"api_error_status"[[:space:]]*:[[:space:]]*429|"type"[[:space:]]*:[[:space:]]*"rate_limit_error"|rate[ _-]?limit|too many requests' "${EXEC_FILE}"; then
            echo "::warning::Claude review aborted on a 429 (quota/rate-limit). NOT failing — avoids re-run amplification of the shared Max quota. PR has no ## LGTM (won't auto-merge); it will be re-reviewed on the next push or by the stale-PR rescuer once quota recovers."
            exit 0
          fi
          if [ "${REVIEW_OUTCOME}" = "failure" ]; then
            echo "::error::Claude review action failed (outcome=failure) — re-run this job."
            exit 1
          fi
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ]; then
            if grep -qE '"is_error"[[:space:]]*:[[:space:]]*true' "${EXEC_FILE}" \
               && grep -qiE '"api_error_status"[[:space:]]*:[[:space:]]*5[0-9][0-9]|overloaded|server_error|internal server error|api error: 5' "${EXEC_FILE}"; then
              echo "::error::Claude review aborted on a transient 5xx API error without posting a review — re-run this job."
              exit 1
            fi
          fi
          echo "Review step completed without an unrecovered transient API error."

      - name: Claude usage metrics
        # Solo se la review Claude è effettivamente girata (guard non-skip): a
        # review skippata non c'è execution_file da riassumere.
        if: always() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.debounce.outputs.superseded != 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "pr-review-loop"
