name: PR Review (Claude single-pass)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Una review opus@40 dura 8-11min. Senza questo, ogni `synchronize` (commit
# nuovo su un branch fix) lancia una review da zero mentre la precedente è
# ancora in volo → review opus SOVRAPPOSTE sullo stesso PR su SHA superati
# (osservato live 2026-06-04: 2 review opus su fix/umantis, ~8min di overlap,
# doppio costo quota). cancel-in-progress collassa i push rapidi a una sola
# review sull'ultimo SHA. Keyed sul PR così PR diversi non si cancellano a
# vicenda. `tests` ha già questo cancel; pr-review-loop no — asimmetria che
# faceva girare la review opus fino in fondo su commit morti.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Auth via CLAUDE_CODE_OAUTH_TOKEN da subscription Max (consuma quota piano,
    # non API credits). Verificato zero-cost: nessuna org Anthropic Console,
    # Usage credits $0.00 spent, "Extra usage not enabled". I total_cost_usd nel
    # log dell'action sono telemetria informativa equivalente API, non addebiti.
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow checkout: il reviewer NON usa MAI la git-history. Tutto il suo
          # lavoro è `gh pr view`/`gh pr diff` (GitHub API) + `rg`/`Read`/`Grep`
          # sul working tree HEAD (cross-file probing scopato al CODE, REVIEW.md
          # step 5). I soli strumenti che richiedono history — `git blame`,
          # `git log -L`, `git show <hist-sha>` — REVIEW.md non li invoca.
          #
          # Storia: `fetch-depth: 0 + filter: blob:none` (partial clone) prendeva
          # commit-graph completo + blob HEAD e deferiva i blob storici a una
          # lazy-fetch on-demand. Due costi: (1) il commit-graph di un repo a
          # heavy churn (data/jobs, ~11GB .git) è grande di suo → 58-94s baseline
          # di Checkout; (2) la lazy-fetch del partial clone occasionalmente
          # STALLAVA — osservato Checkout da 11 MINUTI (run 27672265799, PR #2394)
          # che mangiava il budget del timeout 15min → la Claude review partiva
          # con ~4min, veniva uccisa a metà pass → nessuna review postata → PR in
          # idle/stallo (auto-merge mai triggerato). Causa #1 di "review idle".
          #
          # `fetch-depth: 1` elimina ENTRAMBI: niente commit-graph history (non
          # scarica gli ~11GB di .git), niente partial clone → niente lazy-fetch
          # → niente stallo. Working tree HEAD interamente presente (Read di un
          # campione `data/**` funziona ancora). Checkout atteso ~10-20s. Se mai
          # servisse la history per un caso futuro, ripristinare depth:0 — ma
          # allora SENZA `filter: blob:none` (è il partial clone a stallare).
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Re-review guard: su un `synchronize` il cui delta DALL'ULTIMA review
      # claude-bot `## LGTM` tocca SOLO file non-code (data/public/reports/
      # _newsletter_variants/docs) NON ri-eseguiamo Claude — è il token-lever #1:
      # un crawler che rigenera `data/jobs/*.json` su una PR già LGTM'd faceva
      # ripartire una review (anche sonnet) a vuoto. L'approvazione regge perché
      # auto-merge-eval ora usa un fingerprint CODE-only → carry-forward; vitest
      # gira comunque sull'head (tests.yml su synchronize) come safety net.
      # Conservativo: opened/reopened, nessuna LGTM precedente, o compare
      # vuoto/errore → review piena.
      - name: Re-review guard (skip Claude when no code changed since last LGTM)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [ "$ACTION" != "synchronize" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Evento '$ACTION' → review piena."; exit 0
          fi
          last=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '[.[] | select(.user.type=="Bot" and (.user.login|test("claude";"i")) and (.body|contains("## LGTM")))] | last | .commit_id // empty' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Nessuna review LGTM precedente → review piena."; exit 0
          fi
          changed=$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Compare vuoto/errore → review piena (conservativo)."; exit 0
          fi
          code=$(echo "$changed" | grep -vE '^(data/|public/|reports/|_newsletter_variants/|docs/)' || true)
          if [ -z "$code" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Delta dall'ultima LGTM = SOLO data/docs (nessun code) → skip Claude; LGTM carry-forward (fingerprint code-only), vitest gira comunque."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Code cambiato dall'ultima LGTM → review piena."
          fi

      - name: Determine review tier
        id: tier
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Tier high (opus, max-turns 40, adversarial pass): toccato CODE
        # funnel-critical — test gate, workflow CI, build-plugin SEO, o script
        # che mutano/emettono dati indicizzati (crawler/parser/adapter, backfill,
        # migrate, assemble dataset, sitemap/canonical/slug/structured-data).
        # Bug in questi path = falso senso di sicurezza che si propaga su ogni
        # merge, quindi probing opus paga. Tier normal 15->25 (misurato: 13
        # run/7gg morti `error_max_turns` a num_turns=16 senza postare review,
        # es. run 27345572135/27340191180 - review intera bruciata + PR ferma
        # fino al rescuer). Tier normal (sonnet, max-turns 25) per
        # tutto il resto, inclusi gli script NON-funnel: `scripts/{ci,dev,evals}/`
        # (helper CI/dev) e gli audit/report read-only (`audit-*`, `analytics*`,
        # `*-report` — non mutano l'indice, verificano soltanto). Vedi REVIEW.md
        # → "Tier review".
        #
        # CODE vs DATA: il tier si decide SOLO sui file code. I file dati/static
        # rigenerati (data/**, public/**, reports/**, _newsletter_variants/**,
        # docs/**) NON sono reviewabili come code → non escalano il tier e una PR
        # data/docs-only resta normal (sonnet posta comunque `## LGTM` →
        # auto-merge). Questo evita che 50 `data/jobs/*.json` rigenerati da un
        # crawler trascinino su opus o gonfino il diff.
        #
        # Budget 25→40: con l'espansione del contratto (REVIEW.md no-short-circuit
        # su tier high + step 7 perf-claim + escalation ❓ funnel-critical, sopra
        # il cross-file `rg` probing + adversarial check già presenti) il pass
        # tier-high su un diff reale sforava i 25 turni e terminava
        # `error_max_turns` SENZA postare review (PR #838, num_turns=26) — peggio
        # del process gate, perché niente LGTM → PR bloccata e zero finding.
        # 26 turni ≈ 3.5 min; 40 ≈ ~5.5 min, ben dentro il timeout 15 min.
        run: |
          set -euo pipefail
          set_tier() {
            echo "tier=$1" >> "$GITHUB_OUTPUT"
            echo "model=$2" >> "$GITHUB_OUTPUT"
            echo "max_turns=$3" >> "$GITHUB_OUTPUT"
            echo "Review tier: $1 ($2, max-turns $3)"
          }
          files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          # Guard PR vuota (rebase-only, base == head): files vuoto. Default tier
          # normal: reviewer posta comunque `## LGTM` (no finding) e auto-merge
          # scatta.
          if [ -z "$files" ]; then
            echo "Empty file list (rebase-only or empty PR)."
            set_tier normal claude-sonnet-4-6 25
            exit 0
          fi
          # Strip DATA/static: il tier si decide solo sul CODE.
          code_files=$(echo "$files" | grep -vE '^(data/|public/|reports/|_newsletter_variants/|docs/)' || true)
          if [ -z "$code_files" ]; then
            # Token-lever: una PR data/docs-only (zero code) non ha contributo
            # code-reviewable — l'unica cosa da verificare è il completeness
            # contract del body. Tier `minimal`: sonnet + max-turns 8 (da 15) +
            # prompt corto che SALTA la lettura di REVIEW.md, il cross-file
            # probing e l'adversarial check (tutti no-op senza code). Posta
            # comunque `## LGTM` come claude-bot → auto-merge invariato.
            # 8 turni bastano con margine per: leggi body+files, valida
            # contract, posta review (~4-6 turni osservati). REVERT-TRIGGER: se
            # compaiono `error_max_turns` sul tier minimal → bump 8→12.
            echo "Data/docs-only PR (no reviewable code touched) → tier minimal."
            set_tier minimal claude-sonnet-4-6 8
            exit 0
          fi
          # CODE funnel-critical → high. Match diretto su test/CI/build-plugin,
          # più gli script che mutano/emettono l'indice (tutto scripts/ ECCETTO
          # gli helper non-funnel `{ci,dev,evals}/` e gli audit/report read-only).
          crit=$(echo "$code_files" | grep -E '^(tests/|\.github/workflows/|build-plugins/)' || true)
          scripts_crit=$(echo "$code_files" \
            | grep -E '^scripts/' \
            | grep -vE '^scripts/(ci|dev|evals)/' \
            | grep -viE '(audit|analytics|report)' || true)
          if [ -n "$crit$scripts_crit" ]; then
            set_tier high claude-opus-4-8 40
          else
            set_tier normal claude-sonnet-4-6 25
          fi

      - name: Setup Headroom compression proxy
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/setup-headroom

      - name: Run Claude review
        id: claude_review
        if: steps.guard.outputs.skip != 'true'
        # Don't let a hard action failure abort the job before the guard below
        # can classify it — the guard decides whether to fail loudly.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Le PR fix-issue sono aperte da `claude[bot]`: senza whitelist
          # claude-code-action aborta ("non-human actor"). Whitelist esplicita
          # (hardening #898): mai `*`. `claude[bot]` copre le PR fix-issue;
          # `github-actions[bot]` copre eventuali PR aperte da automation interna
          # (run 26621967484 era exit 1 col precedente vincolo non-human-actor).
          allowed_bots: "github-actions[bot], claude[bot]"
          show_full_output: true
          # Tool expansion: aggiunti `Bash(rg:*)`, `Bash(git:*)` per consentire
          # cross-file pattern search (REVIEW.md → Reviewer behavior step 5) e
          # navigation history (`git log -L`, `git blame`, `git show`). Tier high
          # paga il bump opus per probing regex/assertion/idempotency.
          claude_args: "--max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --allowedTools 'Bash(gh:*),Bash(rg:*),Bash(git:*),Read,Grep,Glob'"
          prompt: |
            Reviewer automatico PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Tier `minimal` (PR data/docs-only, ZERO code) — percorso corto, ≤6 turni:** NON leggere `REVIEW.md` né `AGENTS.md`, NON fare cross-file probing né adversarial check (no-op senza code). Fai SOLO: (1) `gh pr view $PR_NUMBER --json title,body,files`; (2) verifica il completeness contract del body — `## Implementato` e `## Non implementato (ancora)` presenti, ogni bullet sensato, nessun placeholder vuoto/`TBD`; (3) se il body è a posto → posta `gh pr review $PR_NUMBER --comment --body` con una review breve che chiude con `## LGTM` (string esatta → auto-merge); se il contract è violato → `🟡` (o `🔴 Important` se grave) e NIENTE `## LGTM`. Non aprire/scorrere i file dati/static. FERMATI dopo aver postato. (Se il Tier NON è `minimal`, ignora questo paragrafo e segui il Bootstrap sotto.)

            **Bootstrap:**
            1. Leggi `REVIEW.md` — contratto operativo completo (tier, severity, filtro scopo, completeness contract, cross-file pattern repetition, test plan compliance, adversarial check, format).
            2. `AGENTS.md` è grande: NON leggerlo salvo necessità specifica esplicita (un finding richiede di citare un non-negotiable preciso). REVIEW.md basta da solo per il workflow di review — leggere AGENTS.md a ogni run è token sprecato.
            3. Carica PR in UNA call: `gh pr view $PR_NUMBER --json title,body,labels,files`, poi il diff del SOLO code: `gh pr diff $PR_NUMBER -- ':(exclude)data/**' ':(exclude)public/**' ':(exclude)reports/**' ':(exclude)_newsletter_variants/**' ':(exclude)docs/**'`. I file dati/static rigenerati (`data/**` job JSON, snapshot, translation-cache, blog-articles; `public/**` immagini/asset) NON sono code: NON revieware il loro contenuto riga-per-riga né contarli come finding — valuta solo se il CODE che li genera è corretto. Se serve un campione di output dati, aprilo mirato con `Read`, non scorrere l'intero blob nel diff.

            **Esegui workflow di review come specificato in REVIEW.md:**
            - completeness contract → Implementato critical thinking → Non implementato filtro scopo → scope drift → cross-file pattern repetition (step 5) → test plan compliance (step 6) → claim perf non validato (step 7) → output.
            - Tier high: aggiungi sezione `## Adversarial check` con 3 cose NON verificate prima del summary finale.
            - **Sezioni mancanti + tier high (REVIEW.md step 4): posta il 🔴 process MA NON terminare.** Prosegui con review sostanziale + `## Adversarial check` completi nello stesso pass — il 🔴 blocca solo l'auto-merge, non un merge manuale, quindi la sostanza deferita evapora. Solo tier normal può terminare al process gate.
            - **Claim perf non validato (REVIEW.md step 7):** PR perf/build/CI che dichiara speedup/regressione attesa senza misura baseline pre-merge (solo "atteso X→Y" / "il profiler misura post-deploy") su tier high → 🔴 Important. Chiedi misura pre/post o revert-risk esplicito.
            - **Escalation ❓ funnel-critical (REVIEW.md Verification):** un ❓ q (incluso quelli nell'adversarial check) il cui soggetto impatta monetizzazione/traffico (writeJson/persistenza dataset indicizzato, canonical/redirect/previousSlugs, structured data, sitemap, AdSense) → promuovi a 🔴 o apri follow-up issue + linkala. Mai ❓ funnel-critical passivo accanto a `## LGTM`.
            - **No missing-test findings (REVIEW.md → IGNORA → test coverage):** NON sollevare "manca un test" / "aggiungi coverage" / "pinna con un test" come 🟡 nit né come voce `## Adversarial check`, nemmeno su path funnel-critici. Nell'adversarial check elenca rischi di COMPORTAMENTO/correttezza non verificati, mai assenza di test. Eccezione (resta in scope): un BUG in un test ESISTENTE (assertion/regex/guard leaky, fixture date assolute).

            **Cross-file pattern probing (REVIEW.md step 5):** prima di costruire grep a mano, controlla se sulla PR esiste il commento sticky `<!-- sibling-check -->` (postato dal job zero-Claude di pr-body-contract): contiene già i file gemelli candidati che condividono i costrutti modificati dal diff — parti da quella lista (verifica i candidati, non fidarti ciecamente: è token-match euristico). Se assente o insufficiente, quando il diff fix-a un pattern (regex, parsing idiom, assertion shape), usa `rg` per cercare il pattern equivalente nel resto del repo. **Scopa la ricerca al CODE** — `rg <pattern> scripts build-plugins components services functions server hooks tests` (oppure `rg <pattern> -g '!data/**' -g '!public/**' -g '!reports/**'`): cercare dentro `data/`/`public/` matcha migliaia di blob dati rigenerati = turni e token sprecati senza segnale. Pattern presente non toccato in file funnel-critico → 🔴; altrove → 🟡.

            **Posta UNA review:**
            `gh pr review $PR_NUMBER --comment --body "<markdown formato REVIEW.md>"`

            **Constraint:**
            - Single-pass, una sola review per run.
            - Read-only: no push, no edit file.
            - Zero finding accettabile → chiudi con `## LGTM` (string esatta triggera auto-merge). Non inventare per riempire.
            - 🔴 aperto → NON scrivere `## LGTM`.
            - ❓ funnel-critical non escalato (né 🔴 né follow-up issue) → NON scrivere `## LGTM`.
            - Incerto → `❓ q:`, no speculazione.

      - name: Fail on transient API error (no review posted)
        # claude-code-action can exit 0 even when the model run ABORTED on a
        # transient Anthropic API error (500/502/503/529/429, "overloaded",
        # "server_error") WITHOUT posting a review. The job then looks green but
        # no `## LGTM`/finding was ever written → the PR silently stalls (no
        # auto-merge, no failure signal; observed PR #2340, API 500 mid-run).
        # Classify that case from the execution log and FAIL LOUDLY so the run
        # is visibly red + re-runnable instead of masquerading as a clean pass.
        # `set -uo pipefail` (NOT -e): grep in conditionals must not abort.
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
          EXEC_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ "${REVIEW_OUTCOME}" = "failure" ]; then
            echo "::error::Claude review action failed (outcome=failure) — re-run this job."
            exit 1
          fi
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ]; then
            if grep -qE '"is_error"[[:space:]]*:[[:space:]]*true' "${EXEC_FILE}" \
               && grep -qiE '"api_error_status"[[:space:]]*:[[:space:]]*(429|5[0-9][0-9])|overloaded|server_error|internal server error|api error: 5' "${EXEC_FILE}"; then
              echo "::error::Claude review aborted on a transient Anthropic API error without posting a review — re-run this job."
              exit 1
            fi
          fi
          echo "Review step completed without an unrecovered transient API error."

      - name: Claude usage metrics
        # Solo se la review Claude è effettivamente girata (guard non-skip): a
        # review skippata non c'è execution_file da riassumere.
        if: always() && steps.guard.outputs.skip != 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "pr-review-loop"
