name: Refresh Employer Insights

# GA4 is the source of truth for employer metrics.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Analytics source to query; every payload declares it.
        required: true
        default: ga4
        type: choice
        options:
          - posthog
          - ga4

permissions:
  contents: read

concurrency:
  group: employer-insights-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INSIGHTS_SOURCE: ${{ inputs.source || 'ga4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # The builder needs the complete job identity catalog. Keep the
          # heavy unrelated trees out, but deliberately retain data/jobs/.
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Validate selected source
        run: |
          set -euo pipefail
          case "$INSIGHTS_SOURCE" in
            posthog) ;;
            ga4) ;;
            *)
              echo "::error::source must be posthog or ga4"
              exit 1
              ;;
          esac
          echo "Selected employer-insights source: $INSIGHTS_SOURCE"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load analytics and Firebase settings from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Verify selected source settings are present
        run: |
          set -euo pipefail
          case "$INSIGHTS_SOURCE" in
            posthog)
              if [ -z "${POSTHOG_PERSONAL_API_KEY:-}" ] || [ -z "${POSTHOG_PROJECT_ID:-}" ]; then
                echo "::error::PostHog credentials are missing after Remote Config load"
                exit 1
              fi
              ;;
            ga4)
              if [ -z "${GA4_PROPERTY_ID:-}" ]; then
                echo "::error::GA4_PROPERTY_ID is missing after Remote Config load"
                exit 1
              fi
              ;;
          esac

      - name: Count current employer snapshots
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getFirestoreDb } from './scripts/lib/firestore-admin.mjs';

          const expectedSource = process.env.INSIGHTS_SOURCE;
          if (!expectedSource) throw new Error('INSIGHTS_SOURCE is required before reading the snapshot baseline');
          const db = await getFirestoreDb();
          const snapshot = await db.collection('employer_insights').get();
          if (snapshot.empty) throw new Error('employer_insights is empty; refusing a first write without a baseline');
          const ids = snapshot.docs
            .filter((doc) => doc.data()?.source === expectedSource)
            .map((doc) => doc.id)
            .sort();
          if (ids.length === 0) throw new Error(`employer_insights has no ${expectedSource} documents; refusing a first write for this source`);
          fs.writeFileSync('/tmp/employer-insights-current.json', JSON.stringify({ source: expectedSource, count: ids.length, ids }, null, 2) + '\n');
          console.log(`Current employer_insights documents for ${expectedSource}: ${ids.length} (collection total: ${snapshot.size})`);
          NODE

      - name: Build complete dry-run payload (no Firestore write)
        run: |
          set -euo pipefail
          node scripts/build-employer-insights.mjs \
            --source "$INSIGHTS_SOURCE" \
            --json-out /tmp/employer-insights-dry-run.json \
            | tee /tmp/employer-insights-builder.log
          test -s /tmp/employer-insights-dry-run.json

      - name: Validate payload fail-closed
        run: |
          set -euo pipefail
          node scripts/ci/validate-employer-insights-payload.mjs \
            --payload /tmp/employer-insights-dry-run.json \
            --current /tmp/employer-insights-current.json \
            --source "$INSIGHTS_SOURCE" \
            --gate-out /tmp/employer-insights-gate.json

      - name: Write exactly the validated payload with rollback guard
        env:
          PAYLOAD_PATH: /tmp/employer-insights-dry-run.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getFirestoreDb } from './scripts/lib/firestore-admin.mjs';
          import {
            EMPLOYER_INSIGHTS_ADS_SUBCOLLECTION,
            employerInsightsAdId,
            employerInsightsWindowAdsSubcollection,
            readEmployerInsightsSnapshot,
            restoreEmployerInsightsSnapshot,
            writeEmployerInsightsDocuments,
          } from './scripts/lib/employer-insights-firestore.mjs';

          const payload = JSON.parse(fs.readFileSync(process.env.PAYLOAD_PATH, 'utf8'));
          const expectedSource = process.env.INSIGHTS_SOURCE;
          if (!expectedSource || payload.source !== expectedSource || payload.coverage?.source !== expectedSource) {
            throw new Error('validated payload source is missing or does not match the selected source');
          }
          const expected = payload.documents;
          const db = await getFirestoreDb();
          const before = await readEmployerInsightsSnapshot(db);

          async function rollback() {
            let result = { attempted: 0, committed: 0 };
            try {
              result = await restoreEmployerInsightsSnapshot(db, before);
            } catch (error) {
              const committed = Number.isInteger(error?.committedItems) ? error.committedItems : result.committed;
              const attempted = Number.isInteger(error?.attemptedItems) ? error.attemptedItems : result.attempted;
              throw new Error(`rollback incomplete: committed ${committed}/${attempted} documents (Firestore items); ${error.message}`, { cause: error });
            }
            if (result.committed !== result.attempted) {
              throw new Error(`rollback incomplete: committed ${result.committed}/${result.attempted} documents (Firestore items)`);
            }
            return result;
          }

          try {
            const writeResult = await writeEmployerInsightsDocuments(db, expected, { before });
            const written = writeResult.documentsWritten;
            if (written !== expected.length) throw new Error(`writer committed ${written}/${expected.length} documents`);

            const after = await readEmployerInsightsSnapshot(db);
            const missing = expected.filter((document) => {
              const stored = after.roots.get(document.companyKey);
              const storedAds = after.ads.get(document.companyKey) || new Map();
              const expectedAdIds = document.ads.map((ad) => employerInsightsAdId(ad));
              const storedWindowAds = after.windowAds.get(document.companyKey) || new Map();
              const missingWindowAds = Object.entries(document.additionalWindows || {}).some(([windowKey, summary]) => {
                const expectedWindowAds = Array.isArray(summary?.ads) ? summary.ads : null;
                if (!expectedWindowAds) return false;
                const storedSummary = stored?.additionalWindows?.[windowKey];
                const collectionName = employerInsightsWindowAdsSubcollection(windowKey);
                const storedAdsForWindow = storedWindowAds.get(collectionName) || new Map();
                const expectedWindowAdIds = expectedWindowAds.map((ad) => employerInsightsAdId(ad));
                return !storedSummary
                  || storedSummary.adsStorage?.type !== 'subcollection'
                  || storedSummary.adsStorage?.collection !== collectionName
                  || storedSummary.adsStorage?.count !== expectedWindowAds.length
                  || expectedWindowAdIds.some((id) => !storedAdsForWindow.has(id))
                  || storedAdsForWindow.size !== expectedWindowAds.length;
              });
              return !stored
                || stored.source !== expectedSource
                || stored.provenance?.snapshotId !== document.provenance?.snapshotId
                || stored.window?.from !== document.window?.from
                || stored.window?.to !== document.window?.to
                || stored.window?.timezone !== document.window?.timezone
                || stored.adsStorage?.type !== 'subcollection'
                || stored.adsStorage?.collection !== EMPLOYER_INSIGHTS_ADS_SUBCOLLECTION
                || stored.adsStorage?.count !== document.ads.length
                || expectedAdIds.some((id) => !storedAds.has(id))
                || storedAds.size !== document.ads.length
                || missingWindowAds;
            }).map((document) => document.companyKey);
            if (missing.length) throw new Error(`post-write verification missing ${missing.length} validated documents`);
            console.log(`Committed and verified ${written} employer_insights roots plus ad shards; existing collection count is ${after.roots.size}.`);
          } catch (error) {
            try {
              const rollbackResult = await rollback();
              console.error(`Write failed; previous employer_insights snapshot restored (${rollbackResult.committed}/${rollbackResult.attempted} Firestore items).`);
            } catch (rollbackError) {
              throw new Error(`write failed; rollback status: ${rollbackError.message}; original write: ${error.message}`, { cause: rollbackError });
            }
            throw error;
          }
          NODE

      - name: Cleanup temporary credentials and payloads
        if: always()
        run: rm -f /tmp/firebase-sa.json /tmp/employer-insights-current.json /tmp/employer-insights-dry-run.json /tmp/employer-insights-builder.log /tmp/employer-insights-gate.json
