name: Pages Publish-Lag Watchdog

# Watchdog for the deploy→PUBLISH gap (see scripts/check-pages-publish-lag.mjs
# for the full mechanism). deploy.yml only builds; deploy-publish.yml does the
# actual actions/deploy-pages publish under a single-slot concurrency group
# (cancel-in-progress: false), so a burst of push-triggered builds routinely
# supersedes most pending publish attempts — deploy-starvation, the failure
# class deploy.yml's own paths-ignore comment names. Content isn't lost (a
# later successful publish carries every earlier commit forward) but can sit
# built-and-not-live for hours with zero visibility. 2026-07-16: two published
# articles weren't visible for hours and only surfaced because a journalist
# personally asked. This workflow catches that gap automatically instead.
#
# Two signals (sized and justified next to the constants in the script):
#   - AGE: content pending longer than the worst LEGITIMATE merge->live
#     latency (9h). Tolerant on purpose — the pipeline's own worst legitimate
#     case is ~7.6h, measured, and a threshold under it pages when nothing is
#     wrong. It was 4h until 2026-08-07 and fired 14 times in three weeks,
#     half of them self-resolving with no human action.
#   - STALLED QUEUE: content pending while deploy.yml shows no activity at
#     all (4h). Catches a STOPPED pipeline quickly, which is what the age
#     threshold gives up when it is set tolerantly.
#
# Same shape as border-live-data-watchdog.yml / app-auth-health-monitor.yml:
# scheduled cron, dedup issue on degraded (scripts/lib/github-issue-creator.mjs
# stable-title dedup), auto-resolve on recovery, self-alert if the monitor
# itself crashes instead of taking the intentional degraded path.

on:
  schedule:
    - cron: '15 * * * *' # hourly, offset so it doesn't land exactly on other :00 cron jobs
  workflow_dispatch:
    inputs:
      lag_hours:
        description: 'Override LAG_HOURS threshold for this run'
        required: false

concurrency:
  group: pages-publish-lag-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read # /deployments + /deployments/{id}/statuses (see deploy-publish.yml:L61)
  actions: write # il reaper cancella le run incastrate (unwedge-pages-deploy-queue.mjs) # /actions/workflows/deploy.yml/runs — the stalled-queue signal.
  # Without it that call 403s and the script's fail-open catch silently
  # disables the second signal, leaving only the (deliberately tolerant)
  # age threshold. The watchdog would still go green; it would just stop
  # detecting a stopped pipeline.
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    # 10, not 5: every recorded timeout (#5056 — 2026-08-03, 08-17, 08-19) was
    # the job-level ceiling hitting mid-`Checkout` (a transient runner-side
    # `git fetch` stall), before the watchdog's own logic ever ran — the
    # script steps never got a chance to execute or skip cleanly. The sibling
    # watchdogs of the same shape (border-live-data-watchdog.yml,
    # app-auth-health-monitor.yml, article-hub-landing-watchdog.yml) already
    # run at 10.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Unwedge the pages-deploy queue (cancel runs stuck at the environment gate)
        # Prima del check, non dopo: la lag si misura dall'ultimo deploy RIUSCITO,
        # che una cancellazione non fa avanzare — quindi sbloccare qui non
        # maschera nulla, e se la coda era incastrata il prossimo run trova la
        # strada libera. Cancella SOLO run in stato `waiting` da oltre 45 minuti:
        # mai `in_progress`, così il reaper non può diventare la causa
        # dell'outage che previene.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/unwedge-pages-deploy-queue.mjs

      - name: Check publish lag
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAG_HOURS: ${{ github.event.inputs.lag_hours }}
        run: node scripts/check-pages-publish-lag.mjs

      # Degraded → open (or comment on) canonical issue. Helper dedups on the
      # stable title, so consecutive degraded runs comment on the same issue
      # instead of spawning duplicates.
      - name: Open / dedup degraded issue
        if: steps.check.outcome == 'failure' && steps.check.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish lag: built content not yet live" \
            --description "${{ steps.check.outputs.summary }}

          ### Why this happens
          \`deploy.yml\` only builds; \`deploy-publish.yml\` does the actual publish under a single-slot concurrency group (cancel-in-progress: false). A burst of push-triggered builds can supersede most pending publish attempts before they ever run — deploy-starvation. Nothing is permanently lost (the next successful publish carries every earlier commit forward), but content can sit invisible for hours.

          The summary above says which signal fired. **Publish LAG** means the pipeline may still be moving, just slower than its worst measured legitimate case (~7.6h) — check the cadence before assuming a fault. **Build queue STALLED** means no deploy.yml run is queued, running, or recently active while content waits: the pipeline has stopped, and that is always a real fault.

          ### What to check
          - \`gh run list --workflow=deploy-publish.yml --repo ${{ github.repository }}\` for a run of skipped/cancelled conclusions in this window.
          - \`gh api repos/${{ github.repository }}/deployments?environment=github-pages\` for the actual publish cadence.
          - If publishes are stuck (not just delayed), investigate \`deploy-publish.yml\`'s concurrency group directly.
          - On a STALLED verdict, start at the build half instead: \`gh run list --workflow=deploy.yml --repo ${{ github.repository }}\` — if the newest run is hours old and none is in progress, pushes to main have stopped triggering builds at all.

          Note: a github-pages deployment can reach \`success\` server-side even when the \`deploy-publish.yml\` run shows cancelled/failure (issue #987 — \`actions/deploy-pages\` aborts at its 10-min polling cap while Pages finishes the publish anyway). Trust the Deployments API over the run conclusion.

          Issue auto-resolves on the next watchdog run once the lag clears." \
            --priority 2 \
            --label automation \
            --workflow "${{ github.workflow }}"

      # Healthy → close canonical issue if it was open (idempotent no-op
      # otherwise), so a recovered watchdog never leaves a stale open issue.
      - name: Resolve issue on recovery
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish lag: built content not yet live" \
            --workflow "${{ github.workflow }}" \
            --resolve

      # Watcher-del-watcher: if the check step failed WITHOUT going through
      # the intentional degraded path (no `summary` output — a crash, not a
      # real lag reading), page separately so the monitor's own breakage
      # doesn't silently disable detection.
      - name: Alert on monitor crash
        if: steps.check.outcome == 'failure' && steps.check.outputs.summary == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish-lag monitor crashed" \
            --description "The run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed without producing an intentional degraded reading (no 'summary' output). The monitor itself is broken — until fixed, publish-lag regressions won't be caught. Read the run log and fix the root cause." \
            --priority 2 \
            --label automation \
            --workflow "${{ github.workflow }}"

      # Closer half (#5437 — this title had none, unlike its sibling "Pages
      # publish lag: …" a few lines up, which already resolves on recovery).
      # Negation of the crash condition: healthy (outcome success) OR an
      # intentional degraded reading (outcome failure WITH a summary) both mean
      # the monitor itself did not crash.
      - name: Resolve monitor-crash issue when the check itself is healthy
        if: steps.check.outcome == 'success' || steps.check.outputs.summary != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Pages publish-lag monitor crashed" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
