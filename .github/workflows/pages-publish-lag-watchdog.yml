name: Pages Publish-Lag Watchdog

# Watchdog for the deploy→PUBLISH gap (see scripts/check-pages-publish-lag.mjs
# for the full mechanism). deploy.yml only builds; deploy-publish.yml does the
# actual actions/deploy-pages publish under a single-slot concurrency group
# (cancel-in-progress: false), so a burst of push-triggered builds routinely
# supersedes most pending publish attempts — deploy-starvation, the failure
# class deploy.yml's own paths-ignore comment names. Content isn't lost (a
# later successful publish carries every earlier commit forward) but can sit
# built-and-not-live for hours with zero visibility. 2026-07-16: two published
# articles weren't visible for hours and only surfaced because a journalist
# personally asked. This workflow catches that gap automatically instead.
#
# Same shape as border-live-data-watchdog.yml / app-auth-health-monitor.yml:
# scheduled cron, dedup issue on degraded (scripts/lib/github-issue-creator.mjs
# stable-title dedup), auto-resolve on recovery, self-alert if the monitor
# itself crashes instead of taking the intentional degraded path.
#
# It also ACTS, not only reports (added 2026-08-07). Deploy-starvation as
# described above is self-limiting — the queue drains as soon as arrivals slow
# down. There is a second, non-self-limiting failure in the same group: a
# publish run parked at the `github-pages` environment gate holds `pages-deploy`
# with no deadline of any kind, and `cancel-in-progress: false` means GitHub
# will never evict it. Run 31118787881 held it for 14 h on 2026-08-06 while
# 31119921972 sat pending 7 h 13 m without starting a job, and deploy-publish.yml
# went 0-for-300 runs / ten days without a success. The unwedge step below
# cancels exactly that state — runs in status `waiting`, nothing else — so the
# stall is bounded by this cron instead of by someone noticing.

on:
  schedule:
    - cron: '15 * * * *' # hourly, offset so it doesn't land exactly on other :00 cron jobs
  workflow_dispatch:
    inputs:
      lag_hours:
        description: 'Override LAG_HOURS threshold for this run'
        required: false

concurrency:
  group: pages-publish-lag-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read # /deployments + /deployments/{id}/statuses (same read as the
                    # `deployments: read` on deploy-publish.yml's `deploy` job)
  issues: write
  actions: write # list deploy-publish runs + POST /actions/runs/{id}/cancel (unwedge step).
                 # `read` is not enough: cancelling is a write. Scoped by the script
                 # itself, which only ever addresses deploy-publish.yml runs whose
                 # status is `waiting`.

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Runs BEFORE the lag check, on purpose. Cancelling a wedged run frees
      # `pages-deploy` so the newest pending publish can start immediately,
      # rather than waiting for the next hourly tick. It does NOT change what
      # the lag check then reports: lag is measured from the last SUCCESSFUL
      # github-pages deployment, which a cancellation cannot advance — so a
      # wedge that has already cost hours still opens its issue, and only the
      # next tick (once a publish has actually landed) resolves it. Unwedging
      # silently instead would hide a recurring GitHub-side fault.
      #
      # continue-on-error: this step must never be able to suppress the lag
      # check. A crash here surfaces as an ::error:: annotation from the script.
      - name: Unwedge the pages-deploy queue (cancel runs stuck at the environment gate)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/unwedge-pages-deploy-queue.mjs

      - name: Check publish lag
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAG_HOURS: ${{ github.event.inputs.lag_hours }}
        run: node scripts/check-pages-publish-lag.mjs

      # Degraded → open (or comment on) canonical issue. Helper dedups on the
      # stable title, so consecutive degraded runs comment on the same issue
      # instead of spawning duplicates.
      - name: Open / dedup degraded issue
        if: steps.check.outcome == 'failure' && steps.check.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish lag: built content not yet live" \
            --description "${{ steps.check.outputs.summary }}

          ### Why this happens — TWO different failures, same symptom
          \`deploy.yml\` only builds; \`deploy-publish.yml\` does the actual publish under a single-slot concurrency group (cancel-in-progress: false). This report reads identically for both, so start by telling them apart:

          1. **Deploy-starvation (self-limiting).** A burst of push-triggered builds supersedes most pending publish attempts before they ever run. Nothing is permanently lost — the next successful publish carries every earlier commit forward — but content can sit invisible for hours. Drains on its own once arrivals slow down.
          2. **The queue is jammed (NOT self-limiting).** A publish run parked at the \`github-pages\` environment gate is not "running", so no Actions-side deadline applies to it, and \`cancel-in-progress: false\` means GitHub never evicts it — run 31118787881 held the group 14 h on 2026-08-06 while \`deploy-publish.yml\` went 0-for-300 runs over ten days. No-op runs made it worse: \`workflow_run: [completed]\` fires for cancelled builds, and a run joins its concurrency group BEFORE its job \`if:\` is evaluated, so a 2-second no-op could evict a real queued publish on arrival.

          Both causes of (2) are fixed — a conditional concurrency group in \`deploy-publish.yml\`, plus \`scripts/ci/unwedge-pages-deploy-queue.mjs\`, which this workflow already ran immediately before the check above. **If this issue keeps reopening, the wedge is recurring and the queue is where to look, not the watchdog.**

          ### What to check
          - \`gh run list --workflow=deploy-publish.yml --repo ${{ github.repository }}\` for a run of skipped/cancelled conclusions in this window.
          - \`gh api repos/${{ github.repository }}/actions/workflows/deploy-publish.yml/runs --jq '.workflow_runs[] | select(.status=="waiting") | .id'\` — a non-empty result is cause (2), live.
          - \`gh api repos/${{ github.repository }}/deployments?environment=github-pages\` for the actual publish cadence.

          Issue auto-resolves on the next watchdog run once the lag clears." \
            --priority 2 \
            --label automation \
            --workflow "${{ github.workflow }}"

      # Healthy → close canonical issue if it was open (idempotent no-op
      # otherwise), so a recovered watchdog never leaves a stale open issue.
      - name: Resolve issue on recovery
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish lag: built content not yet live" \
            --workflow "${{ github.workflow }}" \
            --resolve

      # Watcher-del-watcher: if the check step failed WITHOUT going through
      # the intentional degraded path (no `summary` output — a crash, not a
      # real lag reading), page separately so the monitor's own breakage
      # doesn't silently disable detection.
      - name: Alert on monitor crash
        if: steps.check.outcome == 'failure' && steps.check.outputs.summary == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Pages publish-lag monitor crashed" \
            --description "The run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed without producing an intentional degraded reading (no 'summary' output). The monitor itself is broken — until fixed, publish-lag regressions won't be caught. Read the run log and fix the root cause." \
            --priority 2 \
            --label automation \
            --workflow "${{ github.workflow }}"
