name: Loop L9 employer supply to paid activation

on:
  schedule:
    - cron: '13 12 * * 1'
  push:
    branches: [main]
    paths:
      - 'data/employer-profiles.json'
      - 'data/employer-funnel-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l9-employer-activation.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/build-employer-profiles.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l9-employer-activation.yml'
  pull_request:
    paths:
      - 'data/employer-profiles.json'
      - 'data/employer-funnel-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l9-employer-activation.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/build-employer-profiles.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l9-employer-activation.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when paid activation is not measurable'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l9-employer-activation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout employer inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/employer-profiles.json
            /data/employer-funnel-outcomes.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l9-employer-activation.mjs
            /scripts/ci/export-loop-outcomes.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/build-employer-profiles.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /scripts/lib/posthog-client.mjs
            /.github/workflows/loop-l9-employer-activation.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      - name: Prepare read-only Firebase credentials
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'L9 Firestore export unavailable: FIREBASE_SERVICE_ACCOUNT_JSON is not set; continuing as unmeasurable.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Export fresh L9 outcomes
        if: github.event_name != 'pull_request'
        run: |
          set +e
          node scripts/ci/export-loop-outcomes.mjs --loop L9 --profiles data/employer-profiles.json --out "$RUNNER_TEMP/employer-funnel-outcomes.json"
          export_code=$?
          set -e
          if [ "$export_code" -ne 0 ]; then
            rm -f "$RUNNER_TEMP/employer-funnel-outcomes.json"
            echo 'L9 Firestore export failed; continuing with an explicitly unmeasurable outcome.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit employer activation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l9
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          outcomes_path=data/employer-funnel-outcomes.json
          if [ "${{ github.event_name }}" != "pull_request" ]; then outcomes_path="$RUNNER_TEMP/employer-funnel-outcomes.json"; fi
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --profiles data/employer-profiles.json --outcomes "$outcomes_path")
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run --strict)
          fi
          set +e
          node scripts/ci/loop-l9-employer-activation.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l9-result.json" >/dev/null 2>&1; then
            echo 'L9 finding persisted; no outreach, price or inventory mutation was performed.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ] && jq -e '(.ok == false and .quality == "unmeasurable" and .outcomeLedgerMissing == true and .profileInventoryComplete == true and .issueCount == 1)' "$REPORT_DIR/l9-result.json" >/dev/null 2>&1; then
            echo 'L9 outcome ledger is not published yet; paid activation remains explicitly unmeasurable.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ] \
            && jq -e '(.ok == false and (.quality == "partial" or .quality == "stale") and .issued == false and .safeDraftOnly == true and .profileInventoryComplete == true and .realOutreachSent == false and .inventoryUntouched == true and .subscriptionStateUntouched == true and .pricesUntouched == true)' "$REPORT_DIR/l9-result.json" >/dev/null 2>&1; then
            echo 'L9 quality finding persisted; paid activation remains unmeasurable and only the verified safe draft-only contract is active.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Validate runner-local L9 outcome export
        id: validate_l9_outcome
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l9
        run: |
          test -s "$REPORT_DIR/l9-outcome.json"
          jq -e '(.loopId == "L9" and (.status | type) == "string" and (.independent | type) == "boolean" and (.safeToAct == false) and (.realOutreachSent == false) and (.inventoryUntouched == true) and (.subscriptionStateUntouched == true) and (.pricesUntouched == true) and (.recipientsUntouched == true))' "$REPORT_DIR/l9-outcome.json" >/dev/null
      - name: Record canonical L9 evidence
        if: ${{ always() && steps.validate_l9_outcome.outcome == 'success' }}
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l9
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L9 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L9 observation and actions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l9-employer-activation-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l9/
          retention-days: 90
          if-no-files-found: error
