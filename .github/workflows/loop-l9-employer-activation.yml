name: Loop L9 private measurement status

on:
  schedule:
    - cron: '13 12 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/loop-l9-employer-activation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: loop-l9-employer-activation
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write private-measurement status
        run: echo 'L9 employer-activation measurement is withheld from this public run.' >> "$GITHUB_STEP_SUMMARY"
