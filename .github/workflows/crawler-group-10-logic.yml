# Crawler Group 10 logic — reusable workflow (on: workflow_call).
#
# Physically hosted here (frontaliere-si-o-no) as the single source of
# the crawling logic — but invoked cross-repo from a minimal caller
# workflow physically hosted in frontaliere-articles (account
# nanakokyobashi-rgb), so the RUN and its concurrency-pool consumption
# are billed against nanako's separate, less-saturated pool instead of
# valerielinc-ops' saturated ~20-concurrent-job Free-plan pool.
#
# Structure validated by the crawler-group-23 pilot
# (frontaliere-si-o-no#6485 -> reverted #6517 -> #6520 /
# frontaliere-articles#594 -> #600 -> #602), dispatch-tested for real
# before this batch migrated the remaining 22 groups + translate-pending.yml
# on top of it. A composite action was tried first and reverted: its
# step schema rejects the background:/wait-all: pair every crawler-group
# workflow needs to run its crawlers in parallel ("Unexpected value
# 'background'" at workflow-load time, before a single step runs). A
# reusable workflow avoids that: workflow_call defines a FULL job, so it
# keeps the same step schema as a normal job (background/wait-all
# included) and the real secrets context.
#
# The crawler steps below are a straight copy of this group's own
# committed crawler-group-NN.yml (same source kept, disabled, for
# rollback). Only two things differ from that body: (1) the first step
# is a public/anonymous checkout of this repo instead of the implicit
# "checkout whatever repo this job is already running in" — a
# workflow_call job's workspace starts empty regardless of which repo's
# workflow called it, and it must start anonymous because the caller's
# own ambient token is scoped to frontaliere-articles, not this repo;
# (2) each crawler step's own `GH_TOKEN` env line is dropped (it would
# shadow the GITHUB_PAT-derived one bootstrapped below with the wrong,
# read-only ambient token). CODEX_AUTH_BROKER_SOCKET and
# FIREBASE_SERVICE_ACCOUNT_JSON are read via the normal secrets context,
# unchanged — the caller passes them explicitly through this workflow's
# declared workflow_call secrets.

name: Crawler Group 10 logic (reusable workflow)
on:
  workflow_call:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: false
        type: string
        default: ""
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false
      CODEX_AUTH_JSON:
        required: false
permissions:
  contents: read
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_10:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
    steps:
      - name: Checkout frontaliere-si-o-no (public, read-only)
        uses: actions/checkout@v5
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 27 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-10.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-omniroute@main
      - id: setup_claude_haiku_fallback
        uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-claude-haiku-fallback@main
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Launch jumbo
        id: crawler-launch-jumbo
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-jumbo.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_JUMBO_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: jumbo
          JOBS_SLICE_FILE: data/jobs/by-crawler/jumbo.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-10"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/jumbo.sh"
          launcher_path="$state_dir/jumbo.launcher.sh"
          worker_path="$state_dir/jumbo.worker.sh"
          log_path="$state_dir/jumbo.log"
          pid_path="$state_dir/jumbo.pid"
          status_path="$state_dir/jumbo.status"
          started_path="$state_dir/jumbo.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- jumbo: run crawler (verbatim from original workflow) ----
          node scripts/update-jumbo-jobs.mjs
          crawler_exit=$?
          git_commit_exit=0

          # ---- jumbo: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- jumbo: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update JUMBO jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- jumbo: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run jumbo" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run jumbo"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::jumbo: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ jumbo: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::jumbo: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ jumbo: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::jumbo: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ jumbo: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::jumbo: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ jumbo: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi

          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-10/jumbo.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-10/jumbo.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-10/jumbo.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-10/jumbo.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-10"
          worker_path="$RUNNER_TEMP/crawler-generation/group-10/jumbo.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-10/jumbo.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-10/jumbo.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-10/jumbo.started"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-189}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 189)"
            worker_watchdog_minutes=189
          fi
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            printf '\''127\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 127
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            if [ -s "$status_file" ]; then
              status="$(cat "$status_file" 2>/dev/null || true)"
              if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
            fi
            terminal_exit="$flock_exit"
            if ! [[ "$terminal_exit" =~ ^[0-9]+$ ]]; then terminal_exit=143; fi
            printf "%s\n" "$terminal_exit" > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$flock_exit"
                if ! [[ "$terminal_exit" =~ ^[1-9][0-9]*$ ]]; then terminal_exit=143; fi
                printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                printf '\''%s\n'\'' "$flock_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$flock_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch swiss-medical-network
        id: crawler-launch-swiss-medical-network
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-swiss-medical-network.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_SWISS_MEDICAL_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: swiss-medical-network
          JOBS_SLICE_FILE: data/jobs/by-crawler/swiss-medical-network.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-10"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/swiss-medical-network.sh"
          launcher_path="$state_dir/swiss-medical-network.launcher.sh"
          worker_path="$state_dir/swiss-medical-network.worker.sh"
          log_path="$state_dir/swiss-medical-network.log"
          pid_path="$state_dir/swiss-medical-network.pid"
          status_path="$state_dir/swiss-medical-network.status"
          started_path="$state_dir/swiss-medical-network.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- swiss-medical-network: run crawler (verbatim from original workflow) ----
          npm run jobs:update:swiss-medical-network
          crawler_exit=$?
          git_commit_exit=0

          # ---- swiss-medical-network: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- swiss-medical-network: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "🏥 Auto-update Swiss Medical Network jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- swiss-medical-network: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run swiss-medical-network" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run swiss-medical-network"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::swiss-medical-network: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ swiss-medical-network: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::swiss-medical-network: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ swiss-medical-network: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::swiss-medical-network: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ swiss-medical-network: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::swiss-medical-network: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ swiss-medical-network: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi

          if { [ "$crawler_exit" -ne 0 ] && [ "$crawler_exit" -ne 143 ]; } || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ] && [ "$git_commit_exit" -ne 143 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-10"
          worker_path="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-10/swiss-medical-network.started"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-152}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default 152)"
            worker_watchdog_minutes=152
          fi
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            printf '\''127\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 127
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            if [ -s "$status_file" ]; then
              status="$(cat "$status_file" 2>/dev/null || true)"
              if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
            fi
            terminal_exit="$flock_exit"
            if ! [[ "$terminal_exit" =~ ^[0-9]+$ ]]; then terminal_exit=143; fi
            printf "%s\n" "$terminal_exit" > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
