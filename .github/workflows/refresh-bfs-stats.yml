name: Refresh BFS Stats

# Refreshes the BFS cross-border worker dataset shown on /statistiche/.
# Replaces the legacy first-visitor-pays-the-fetch flow on the client.
#
# Two runs/day cover the BFS publication window for new quarters; subsequent
# revisions of the same quarter just overwrite Firestore (clients still see
# the freshest values, no notification fires). Only an actual quarter change
# (e.g. 2025-Q4 → 2026-Q1) raises the editorial signal, so the editorial team
# announces the new dataset to subscribers.
#
# That signal used to be `gh workflow run generate-article.yml`. It is an
# ISSUE now (#5289). The cutover of 2026-08-02 (#4974 item 3) moved article
# generation to nanakokyobashi-rgb/frontaliere-articles and commented out
# generate-article.yml's `schedule:`, but nothing updated this dispatch — so
# on 2026-08-06 at 09:51:54Z the 2026-Q1 → 2026-Q2 rollover re-lit the retired
# producer here. Because that workflow's last step dispatches itself, one
# quarterly nudge became ~22h of unattended corpus writes: five articles born
# in the consumer repo, the sitemap sync blocked by the anti-shrink guard in
# scripts/pull-articles-corpus.mjs, every PR in the repo unable to merge, and
# finally all five articles deleted by the first sync that got through.
#
# The cross-repo dispatch to nanako IS the shape, and it is wired below (#5341).
# The comment that used to sit here said it was blocked on "GITHUB_PAT_NANAKO and
# a receiving trigger on that side". Both already existed, and stating otherwise
# cost two autonomous fixer runs that re-derived the same wrong conclusion — the
# second of them looking for the PAT among the Actions secrets, where it is not
# and was never meant to be. Verified before wiring it:
#   - `GITHUB_PAT_NANAKO` is mapped in scripts/load-rc-env.mjs (RC_TO_ENV), and the
#     `Load secrets from Remote Config` step below already runs that loader, which
#     writes KEY=VALUE into $GITHUB_ENV for every later step. The PAT comes from
#     Firebase Remote Config, NOT from Actions secrets.
#   - A non-destructive probe against a non-existent ref returned 422 "No ref
#     found", not 403: the PAT is authorized to dispatch, and nothing ran.
#   - The receiver exists: nanakokyobashi-rgb/frontaliere-articles'
#     generate-article.yml declares `workflow_dispatch` with `url` and `section`,
#     exactly the `url=stats-bfs://<quarter>` shape used below.
#
# This does NOT re-light this repo's own generate-article.yml — the #5289 loop was
# a LOCAL dispatch into a retired producer whose last step re-dispatches itself.
# The target here is the corpus repo, which is where article generation lives
# since the 2026-08-02 cutover, so no local `actions: write` is needed either.

on:
  schedule:
    # 07:15 + 19:15 UTC — twice a day, offset off-the-hour to avoid
    # cron contention with deploy.yml / generate-article.yml.
    - cron: '15 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # `actions: write` is gone with the generate-article dispatch (#5289): this
  # workflow no longer starts any other workflow, so the token that could is
  # the one thing worth removing rather than leaving lying around.
  issues: write     # github-issue-creator: new-quarter signal + failure report

concurrency:
  group: refresh-bfs-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing — cannot write Firestore."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        # Carica da Firebase Remote Config — NON dagli Actions secrets — sia
        # `GITHUB_PAT` sia `GITHUB_PAT_NANAKO`, quest'ultima usata dal dispatch
        # cross-repo verso il corpus (vedi header). Il loader scrive KEY=VALUE in
        # $GITHUB_ENV, quindi ogni step successivo le vede come variabili d'ambiente.
        run: node scripts/load-rc-env.mjs

      # App installation token = primary dispatch identity (App tokens re-trigger
      # workflows like generate-article; GITHUB_TOKEN would not, anti-recursion).
      # Falls back to env.GITHUB_PAT then GITHUB_TOKEN. B2b tail migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Refresh BFS stats
        id: refresh
        run: node scripts/refresh-bfs-stats.mjs

      - name: Job summary
        if: always()
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          PREV_QUARTER: ${{ steps.refresh.outputs.prev_quarter }}
          LATEST_VALUE: ${{ steps.refresh.outputs.latest_value }}
          PREV_VALUE: ${{ steps.refresh.outputs.prev_value }}
          DELTA_ABS: ${{ steps.refresh.outputs.delta_abs }}
          DELTA_PCT: ${{ steps.refresh.outputs.delta_pct }}
          YOY_DELTA_PCT: ${{ steps.refresh.outputs.yoy_delta_pct }}
          LATEST_QUARTER: ${{ steps.refresh.outputs.latest_quarter }}
        run: |
          {
            echo "## BFS stats refresh"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Latest quarter (in CSV) | \`$LATEST_QUARTER\` |"
            echo "| Previous quarter (in Firestore) | \`$PREV_QUARTER\` |"
            if [ -n "$NEW_QUARTER" ]; then
              echo "| New quarter detected | **$NEW_QUARTER** |"
              echo "| Latest value | $LATEST_VALUE |"
              echo "| Previous value | $PREV_VALUE |"
              echo "| QoQ delta | $DELTA_ABS ($DELTA_PCT%) |"
              echo "| YoY delta | $YOY_DELTA_PCT% |"
            else
              echo "| New quarter detected | _no — Firestore overwritten with refreshed data only_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Il dispatch che genera davvero l'articolo di annuncio (#5341), verso il
      # CORPUS. Gate: `new_quarter != ''`, cioè solo sulla transizione di trimestre —
      # `refresh-bfs-stats.mjs` popola quell'output unicamente quando il trimestre
      # letto dal CSV differisce da quello in Firestore. Senza quel gate ogni run
      # (2/giorno) genererebbe un articolo.
      #
      # `GITHUB_PAT_NANAKO` è referenziata per NOME dentro lo script, non
      # interpolata da Actions: il segreto non finisce mai nella command line
      # espansa né nel log del workflow.
      #
      # `continue-on-error` perché il lavoro che conta — la riscrittura di Firestore,
      # cioè i valori che gli utenti vedono su /statistiche/ — è già stato fatto dallo
      # step precedente. Un dispatch fallito non deve far diventare rosso un refresh
      # riuscito; deve però essere RUMOROSO, ed è il compito dello step subito dopo.
      - name: Dispatch announcement article to the corpus (new quarter only)
        id: dispatch
        if: steps.refresh.outputs.new_quarter != ''
        continue-on-error: true
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
        run: |
          set -uo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO non presente nell'ambiente — Remote Config non l'ha caricata."
            echo "Il loader esce 0 anche quando non carica niente, quindi questo è l'unico punto in cui la sua assenza diventa visibile."
            exit 1
          fi
          echo "Dispatch generate-article.yml → nanakokyobashi-rgb/frontaliere-articles (url=stats-bfs://${NEW_QUARTER})"
          GH_TOKEN="$GITHUB_PAT_NANAKO" gh workflow run generate-article.yml \
            --repo nanakokyobashi-rgb/frontaliere-articles \
            -f url="stats-bfs://${NEW_QUARTER}" \
            -f section=frontaliere
          {
            echo "## 🚀 Articolo di annuncio dispacciato"
            echo ""
            echo "\`generate-article.yml\` avviato su \`nanakokyobashi-rgb/frontaliere-articles\`"
            echo "con \`url=stats-bfs://${NEW_QUARTER}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Il PAT è personale: se ruota o viene revocato, il dispatch fallisce. Senza
      # questo step fallirebbe in SILENZIO — `continue-on-error` sopra nasconde
      # l'errore, il refresh resta verde, e il trimestre passerebbe senza articolo
      # e senza che nessuno lo sappia. Titolo statico e senza trimestre (#5121,
      # guardato da tests/monitor-issue-dedup.test.ts): un titolo che si muove coi
      # dati non ritrova mai la sua issue canonica e ne conia una nuova ogni volta.
      - name: Report a failed corpus dispatch (never silent)
        if: steps.refresh.outputs.new_quarter != '' && steps.dispatch.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Dispatch articolo BFS al corpus fallito" \
            --description "Il refresh BFS ha rilevato un nuovo trimestre (\`${NEW_QUARTER}\`) ma **non è riuscito a dispacciare** \`generate-article.yml\` su \`nanakokyobashi-rgb/frontaliere-articles\`.

          I valori su \`/statistiche/\` SONO aggiornati (Firestore riscritto): manca solo l'articolo di annuncio.

          Causa più probabile: \`GITHUB_PAT_NANAKO\` ruotata, scaduta o revocata. Vive in **Firebase Remote Config** (progetto \`frontaliere-ticino\`), non negli Actions secrets — cercarla lì è la diagnosi sbagliata che ha già bloccato #5341 due volte.

          Verifica senza eseguire nulla (un ref inesistente risponde 422 se il PAT è autorizzato, 403 se non lo è):
          \`\`\`
          gh api -X POST repos/nanakokyobashi-rgb/frontaliere-articles/actions/workflows/generate-article.yml/dispatches -f ref=__probe__
          \`\`\`

          Ripiego manuale:
          \`\`\`
          gh workflow run generate-article.yml --repo nanakokyobashi-rgb/frontaliere-articles -f url=stats-bfs://${NEW_QUARTER}
          \`\`\`

          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 2 \
            --label bug \
            --reopen-within-hours 720

      # L'articolo esiste gia'? (#5846, differita da #5817)
      #
      # Lo step qui sotto aveva come UNICA condizione `new_quarter != ''` e non
      # verificava mai che l'articolo di annuncio esistesse. Poiche' chiama
      # `github-issue-creator.mjs --reopen-within-hours 720`, un run creato DOPO
      # la chiusura manuale RIAPRE la issue: e' successo il 2026-08-12 alle
      # 20:02:04Z mentre l'articolo del trimestre era gia' live (20:21:13Z).
      # Nessun guard sulla staleness l'avrebbe trattenuto — quel run era
      # legittimamente piu' recente della chiusura. La condizione che mancava
      # riguarda l'ARTICOLO, non il tempo.
      #
      # La prova e' esatta, non euristica: `create-article.mjs` registra ogni
      # articolo nel ledger `data/article-source-urls.json` del corpus come
      # `<source URL normalizzata> → <id>`, e per un articolo BFS la source URL
      # e' la stessa chiave sintetica `stats-bfs://<trimestre>` che lo step di
      # dispatch qui sopra manda. L'API pubblicata non espone `sourceUrl`,
      # quindi il ledger nel repo del corpus e' l'unico posto che risponde.
      #
      # Fail open by construction: qualunque errore (token assente, rete, 404,
      # JSON rotto) da' `exists=false` e lo step successivo parte lo stesso.
      # Un segnale ridondante costa una issue che si dedupa da sola; un segnale
      # soppresso perde l'annuncio di un trimestre in silenzio.
      - name: Probe the corpus for an existing announcement article
        id: article_probe
        if: steps.refresh.outputs.new_quarter != ''
        continue-on-error: true
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
        run: node scripts/ci/bfs-announcement-article-exists.mjs

      # Segnale editoriale, complementare al dispatch qui sopra: il dispatch avvia la
      # generazione, questa issue traccia il trimestre e SOPRAVVIVE a un run fallito,
      # cosa che un dispatch fire-and-forget non fa. Era `gh workflow run
      # generate-article.yml` LOCALE fino al #5289 — vedi header.
      #
      # The title carries NO quarter, on purpose (#5121, guarded by
      # tests/monitor-issue-dedup.test.ts). github-issue-creator.mjs dedups on
      # the first 60 chars of the title: a title that moves with the data never
      # matches its own canonical issue, so every run mints a duplicate and the
      # serialized fixer burns a turn on each. The quarter is a VALUE, not an
      # entity — it belongs in the body, which the helper replays verbatim in
      # the `🔁 Recurrence` comment, so a reader still sees which quarter fired.
      - name: Raise editorial signal for the new quarter (new quarter only)
        if: steps.refresh.outputs.new_quarter != '' && steps.article_probe.outputs.exists != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          PREV_QUARTER: ${{ steps.refresh.outputs.prev_quarter }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Nuovo trimestre BFS: serve l'articolo di annuncio" \
            --description "**Trimestre da annunciare: \`${NEW_QUARTER}\`** — precedente in Firestore: \`${PREV_QUARTER:-n/d}\`.

          Il dataset BFS dei frontalieri e' passato a \`${NEW_QUARTER}\` — i valori su \`/statistiche/\` sono gia' aggiornati (Firestore riscritto da questo run).

          Serve l'articolo che lo annuncia agli iscritti. **La generazione e' gia' stata avviata automaticamente** (#5341): questo run ha dispacciato \`generate-article.yml\` su \`nanakokyobashi-rgb/frontaliere-articles\` con \`url=stats-bfs://${NEW_QUARTER}\`. Esito del dispatch in questo run: \`${DISPATCH_OUTCOME}\`. Questa issue resta come traccia editoriale — verifica che l'articolo sia effettivamente uscito e chiudila.

          **Si genera in \`nanakokyobashi-rgb/frontaliere-articles\`, mai qui**: dal cutover del 2026-08-02 (#4974 item 3) questo repo e' un consumatore puro e \`packages/articles/content/\` viene rifatto da \`scripts/pull-articles-corpus.mjs\` a ogni sync. Un articolo creato qui blocca il sync e viene poi cancellato — e' successo con cinque articoli il 2026-08-06/07 (#5289).

          Per rilanciare la generazione a mano: \`gh workflow run generate-article.yml --repo nanakokyobashi-rgb/frontaliere-articles -f url=stats-bfs://${NEW_QUARTER}\`.

          Il titolo e' volutamente privo del trimestre (#5121): e' il corpo a portarlo. Se questa issue e' ancora aperta quando arriva il trimestre successivo, il segnale atterra come commento \`🔁 Recurrence\` qui sotto — **leggi l'ultimo commento per sapere quale trimestre e' in attesa di articolo**, non solo il testo di apertura.

          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 3 \
            --reopen-within-hours 720
          {
            echo "## 📰 Segnale editoriale nuovo trimestre"
            echo ""
            echo "Aperta una issue per l'articolo di annuncio di \`${NEW_QUARTER}\`."
            echo "La generazione vive in \`nanakokyobashi-rgb/frontaliere-articles\` (#4974 item 3):"
            echo "questo workflow dispaccia **sul corpus**, mai il \`generate-article.yml\` locale (#5289)."
            echo "Esito del dispatch al corpus in questo run: \`${DISPATCH_OUTCOME}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Una soppressione non deve mai essere invisibile: senza questo step, un
      # trimestre senza segnale editoriale sarebbe indistinguibile — nel job
      # summary — da un trimestre in cui il segnale e' stato alzato. Qui si legge
      # PERCHE' non e' stato alzato e QUALE articolo lo ha reso superfluo.
      - name: Note the suppressed editorial signal (article already exists)
        if: steps.refresh.outputs.new_quarter != '' && steps.article_probe.outputs.exists == 'true'
        continue-on-error: true
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          ARTICLE_ID: ${{ steps.article_probe.outputs.article_id }}
        run: |
          {
            echo "## 🔇 Segnale editoriale NON alzato — l'articolo esiste gia'"
            echo ""
            echo "Trimestre: \`${NEW_QUARTER}\` — articolo trovato nel ledger del corpus: \`${ARTICLE_ID}\`."
            echo "Chiave: \`stats-bfs://$(printf '%s' "${NEW_QUARTER}" | tr '[:upper:]' '[:lower:]')\` in \`data/article-source-urls.json\`."
            echo "Vedi #5846: prima di questo guard lo step riapriva la issue anche ad articolo pubblicato."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh BFS Stats" \
            --description "BFS stats refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
