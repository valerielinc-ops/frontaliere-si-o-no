name: Refresh BFS Stats

# Refreshes the BFS cross-border worker dataset shown on /statistiche/.
# Replaces the legacy first-visitor-pays-the-fetch flow on the client.
#
# Two runs/day cover the BFS publication window for new quarters; subsequent
# revisions of the same quarter just overwrite Firestore (clients still see
# the freshest values, no notification fires). Only an actual quarter change
# (e.g. 2025-Q4 → 2026-Q1) raises the editorial signal, so the editorial team
# announces the new dataset to subscribers.
#
# That signal used to be `gh workflow run generate-article.yml`. It is an
# ISSUE now (#5289). The cutover of 2026-08-02 (#4974 item 3) moved article
# generation to nanakokyobashi-rgb/frontaliere-articles and commented out
# generate-article.yml's `schedule:`, but nothing updated this dispatch — so
# on 2026-08-06 at 09:51:54Z the 2026-Q1 → 2026-Q2 rollover re-lit the retired
# producer here. Because that workflow's last step dispatches itself, one
# quarterly nudge became ~22h of unattended corpus writes: five articles born
# in the consumer repo, the sitemap sync blocked by the anti-shrink guard in
# scripts/pull-articles-corpus.mjs, every PR in the repo unable to merge, and
# finally all five articles deleted by the first sync that got through.
#
# A cross-repo dispatch to nanako would be the eventual shape. It is not done
# here on purpose: it needs GITHUB_PAT_NANAKO and a receiving trigger on that
# side, which is a change in a repo this workflow cannot test against.

on:
  schedule:
    # 07:15 + 19:15 UTC — twice a day, offset off-the-hour to avoid
    # cron contention with deploy.yml / generate-article.yml.
    - cron: '15 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # `actions: write` is gone with the generate-article dispatch (#5289): this
  # workflow no longer starts any other workflow, so the token that could is
  # the one thing worth removing rather than leaving lying around.
  issues: write     # github-issue-creator: new-quarter signal + failure report

concurrency:
  group: refresh-bfs-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing — cannot write Firestore."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        # Loads GITHUB_PAT (used to dispatch generate-article.yml) from RC.
        run: node scripts/load-rc-env.mjs

      # App installation token = primary dispatch identity (App tokens re-trigger
      # workflows like generate-article; GITHUB_TOKEN would not, anti-recursion).
      # Falls back to env.GITHUB_PAT then GITHUB_TOKEN. B2b tail migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Refresh BFS stats
        id: refresh
        run: node scripts/refresh-bfs-stats.mjs

      - name: Job summary
        if: always()
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          PREV_QUARTER: ${{ steps.refresh.outputs.prev_quarter }}
          LATEST_VALUE: ${{ steps.refresh.outputs.latest_value }}
          PREV_VALUE: ${{ steps.refresh.outputs.prev_value }}
          DELTA_ABS: ${{ steps.refresh.outputs.delta_abs }}
          DELTA_PCT: ${{ steps.refresh.outputs.delta_pct }}
          YOY_DELTA_PCT: ${{ steps.refresh.outputs.yoy_delta_pct }}
          LATEST_QUARTER: ${{ steps.refresh.outputs.latest_quarter }}
        run: |
          {
            echo "## BFS stats refresh"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Latest quarter (in CSV) | \`$LATEST_QUARTER\` |"
            echo "| Previous quarter (in Firestore) | \`$PREV_QUARTER\` |"
            if [ -n "$NEW_QUARTER" ]; then
              echo "| New quarter detected | **$NEW_QUARTER** |"
              echo "| Latest value | $LATEST_VALUE |"
              echo "| Previous value | $PREV_VALUE |"
              echo "| QoQ delta | $DELTA_ABS ($DELTA_PCT%) |"
              echo "| YoY delta | $YOY_DELTA_PCT% |"
            else
              echo "| New quarter detected | _no — Firestore overwritten with refreshed data only_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Was: `gh workflow run generate-article.yml`. See the header comment —
      # that dispatch is what re-lit the retired producer on 2026-08-06 (#5289).
      # The editorial signal is kept; only the write is dropped. An issue also
      # survives a failed run, which a fire-and-forget dispatch never did.
      #
      # The title carries NO quarter, on purpose (#5121, guarded by
      # tests/monitor-issue-dedup.test.ts). github-issue-creator.mjs dedups on
      # the first 60 chars of the title: a title that moves with the data never
      # matches its own canonical issue, so every run mints a duplicate and the
      # serialized fixer burns a turn on each. The quarter is a VALUE, not an
      # entity — it belongs in the body, which the helper replays verbatim in
      # the `🔁 Recurrence` comment, so a reader still sees which quarter fired.
      - name: Raise editorial signal for the new quarter (new quarter only)
        if: steps.refresh.outputs.new_quarter != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          PREV_QUARTER: ${{ steps.refresh.outputs.prev_quarter }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Nuovo trimestre BFS: serve l'articolo di annuncio" \
            --description "**Trimestre da annunciare: \`${NEW_QUARTER}\`** — precedente in Firestore: \`${PREV_QUARTER:-n/d}\`.

          Il dataset BFS dei frontalieri e' passato a \`${NEW_QUARTER}\` — i valori su \`/statistiche/\` sono gia' aggiornati (Firestore riscritto da questo run).

          Manca l'articolo che lo annuncia agli iscritti.

          **Va generato in \`nanakokyobashi-rgb/frontaliere-articles\`**, non qui: dal cutover del 2026-08-02 (#4974 item 3) questo repo e' un consumatore puro e \`packages/articles/content/\` viene rifatto da \`scripts/pull-articles-corpus.mjs\` a ogni sync. Un articolo creato qui blocca il sync e viene poi cancellato — e' successo con cinque articoli il 2026-08-06/07 (#5289).

          Sorgente storica del prompt: \`url=stats-bfs://${NEW_QUARTER}\`.

          Il titolo e' volutamente privo del trimestre (#5121): e' il corpo a portarlo. Se questa issue e' ancora aperta quando arriva il trimestre successivo, il segnale atterra come commento \`🔁 Recurrence\` qui sotto — **leggi l'ultimo commento per sapere quale trimestre e' in attesa di articolo**, non solo il testo di apertura.

          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 3 \
            --reopen-within-hours 720
          {
            echo "## 📰 Segnale editoriale nuovo trimestre"
            echo ""
            echo "Aperta una issue per l'articolo di annuncio di \`${NEW_QUARTER}\`."
            echo "La generazione vive in \`nanakokyobashi-rgb/frontaliere-articles\` (#4974 item 3),"
            echo "quindi questo workflow **non** dispaccia piu' \`generate-article.yml\` (#5289)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh BFS Stats" \
            --description "BFS stats refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
