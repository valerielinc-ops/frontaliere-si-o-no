name: Refresh BFS Stats

# Refreshes the BFS cross-border worker dataset shown on /statistiche/.
# Replaces the legacy first-visitor-pays-the-fetch flow on the client.
#
# Two runs/day cover the BFS publication window for new quarters; subsequent
# revisions of the same quarter just overwrite Firestore (clients still see
# the freshest values, no notification fires). Only an actual quarter change
# (e.g. 2025-Q4 → 2026-Q1) dispatches generate-article.yml so the editorial
# team announces the new dataset to subscribers.
#
# That dispatch is best-effort by design while the article generator is being
# cut over to nanako (issue #4974): if generate-article.yml is disabled, the
# step warns and passes instead of failing — see its own comment for why, and
# for what that changes. The Firestore refresh above is never best-effort.

on:
  schedule:
    # 07:15 + 19:15 UTC — twice a day, offset off-the-hour to avoid
    # cron contention with deploy.yml / generate-article.yml.
    - cron: '15 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: refresh-bfs-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing — cannot write Firestore."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        # Loads GITHUB_PAT (used to dispatch generate-article.yml) from RC.
        run: node scripts/load-rc-env.mjs

      # App installation token = primary dispatch identity (App tokens re-trigger
      # workflows like generate-article; GITHUB_TOKEN would not, anti-recursion).
      # Falls back to env.GITHUB_PAT then GITHUB_TOKEN. B2b tail migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Refresh BFS stats
        id: refresh
        run: node scripts/refresh-bfs-stats.mjs

      - name: Job summary
        if: always()
        env:
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
          PREV_QUARTER: ${{ steps.refresh.outputs.prev_quarter }}
          LATEST_VALUE: ${{ steps.refresh.outputs.latest_value }}
          PREV_VALUE: ${{ steps.refresh.outputs.prev_value }}
          DELTA_ABS: ${{ steps.refresh.outputs.delta_abs }}
          DELTA_PCT: ${{ steps.refresh.outputs.delta_pct }}
          YOY_DELTA_PCT: ${{ steps.refresh.outputs.yoy_delta_pct }}
          LATEST_QUARTER: ${{ steps.refresh.outputs.latest_quarter }}
        run: |
          {
            echo "## BFS stats refresh"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Latest quarter (in CSV) | \`$LATEST_QUARTER\` |"
            echo "| Previous quarter (in Firestore) | \`$PREV_QUARTER\` |"
            if [ -n "$NEW_QUARTER" ]; then
              echo "| New quarter detected | **$NEW_QUARTER** |"
              echo "| Latest value | $LATEST_VALUE |"
              echo "| Previous value | $PREV_VALUE |"
              echo "| QoQ delta | $DELTA_ABS ($DELTA_PCT%) |"
              echo "| YoY delta | $YOY_DELTA_PCT% |"
            else
              echo "| New quarter detected | _no — Firestore overwritten with refreshed data only_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch generate-article (new quarter only)
        if: steps.refresh.outputs.new_quarter != ''
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          NEW_QUARTER: ${{ steps.refresh.outputs.new_quarter }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ No PAT/token available to dispatch generate-article.yml."
            exit 1
          fi
          URL="stats-bfs://${NEW_QUARTER}"
          echo "🚀 Dispatching generate-article.yml with url=$URL"
          if gh workflow run generate-article.yml --ref main -f url="$URL"; then
            {
              echo "## 📰 Generate-article dispatch"
              echo ""
              echo "Dispatched with \`url=$URL\` for new quarter \`$NEW_QUARTER\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ── The dispatch target can be legitimately absent ──────────────────
          # generate-article.yml is the LAST workflow in the ordered cutover to
          # nanakokyobashi-rgb/frontaliere-articles (issue #4974,
          # docs/articles-generator-migration.md §5 step 5) and is
          # `disabled_manually` for the duration, which makes the dispatch API
          # answer HTTP 422 "Cannot trigger a 'workflow_dispatch' on a disabled
          # workflow". That is expected infrastructure state, not a fault here:
          # the BFS refresh itself — the whole point of this job — already
          # succeeded and wrote Firestore several steps ago.
          #
          # Letting it fail the job is not free. refresh-bfs-stats.mjs
          # re-dispatches on EVERY run until the quarter's article is registered
          # in data/article-source-urls.json (its "Quarter invariato ma articolo
          # non ancora pubblicato" branch), and that registration can only happen
          # via the very workflow that is disabled — so this step would fail
          # twice a day, forever, each time re-opening the same CI-failure issue.
          # A workflow that fails every night is noise that hides real breakage.
          #
          # SEMANTIC CHANGE, stated deliberately: with the target disabled this
          # job now GREEN-passes with a ::warning:: annotation instead of going
          # red. The BFS dataset on /statistiche/ keeps refreshing; what is
          # skipped is only the editorial announcement article, which cannot be
          # produced on this side at all right now. The moment generate-article
          # is re-enabled here (or its nanako-side equivalent takes the dispatch)
          # this step resumes dispatching with no further change.
          #
          # The state is read back from the API rather than grepped out of the
          # error text: `.state` is a machine-readable enum, the 422 prose is
          # not, and a message reword must not turn a known no-op back into a
          # nightly red build. Any OTHER dispatch failure (bad token, missing
          # ref, rate limit) leaves state == "active" and still fails the job.
          #
          # The lookup failing is NOT the same as "disabled": a 403 from a token
          # without the actions scope, or a network blip, would otherwise buy a
          # blanket pass on every dispatch failure there is. Unknown ⇒ loud.
          if ! STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-article.yml" --jq '.state')"; then
            echo "::error::Dispatch of generate-article.yml failed AND its state could not be read — failing loudly rather than assuming it is disabled."
            exit 1
          fi
          if [ "$STATE" != "active" ]; then
            echo "::warning::generate-article.yml is '$STATE' (generator cutover to nanako, issue #4974) — skipping the ${NEW_QUARTER} announcement dispatch. The BFS dataset was still refreshed."
            {
              echo "## 📰 Generate-article dispatch skipped"
              echo ""
              echo "\`generate-article.yml\` is \`$STATE\` (article-generator cutover to nanako, issue #4974)."
              echo "Firestore was still refreshed for quarter \`$NEW_QUARTER\`; only the announcement article is deferred."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Dispatch of generate-article.yml failed while the workflow is active — real failure."
          exit 1

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh BFS Stats" \
            --description "BFS stats refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
