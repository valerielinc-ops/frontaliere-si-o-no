name: Close Recovered Failure Issues

# Zero-Claude reconciler: auto-closes the auto-generated `Workflow Failure: <name>` /
# `Crawler Failure: <name>` / `CI Failure: <name>` issues once the workflow has recovered (its next run after
# the failure is green again). Mirrors the inline `github-issue-creator.mjs --resolve`
# step centrally so EVERY scheduled workflow — present and future — gets its failure
# issue closed on recovery, without wiring a per-workflow step into ~300 YAML files.
# See scripts/ci/close-recovered-failure-issues.mjs.
#
# Immediate close (same outcome as a per-job `--resolve`): `workflow_run` fires
# when ANY workflow in this repo completes. The job then no-ops unless that run
# was a success on `main` and was not this closer itself. The hourly cron stays
# as the safety net for GitHub's schedule-dispatch delay and for reusable
# workflows that complete in another repo (crawler-group-*-logic called from
# nanako). `workflows:` is omitted on purpose so a newly added writer is covered
# without a YAML edit here.

on:
  workflow_run:
    types: [completed]
  schedule:
    # Hourly: failures recover within a workflow's own cadence (fuel ~2h, crawlers daily);
    # an hourly sweep closes the recovered issue without hammering the API.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be closed without mutating'
        required: false
        type: boolean
        default: false

concurrency:
  group: close-recovered-failure-issues
  # A burst of green writers (the GH013 recovery case) should collapse to one
  # reconcile, not queue N closer runs. The cron is the same group: a green
  # burst may cancel an in-flight hourly pass, then redo the full list.
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: >
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.name != 'Close Recovered Failure Issues'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Close recovered failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/ci/close-recovered-failure-issues.mjs $ARGS
