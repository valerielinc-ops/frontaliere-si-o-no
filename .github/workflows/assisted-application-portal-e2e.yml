name: Assisted application portal e2e

# The portal runner of the assisted application (scripts/assisted-application/
# lib/portal/) on a local fake portal: sign-in, account creation on the alias,
# verification link, form, upload, submit; and the owner's fill extension
# (scripts/assisted-application/extension) on a JOIN-like wizard, up to the send
# button it must never press. No employer, no Codex, no secrets.
# vitest cannot cover it: tests.yml has no browser.
on:
  workflow_dispatch:
    inputs:
      portal_focus:
        description: 'Run the full portal suite or one focused fake-portal group'
        type: choice
        options:
          - all
          - umantis
          - coop
          - workday-assisted
          - workday-auth
          - agent-birth-date
          - diagnostics
          - registration-retry
        default: all
      probe_nopecha_free:
        description: 'Diagnose anonymous Token API availability (key normally required; public demo only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/assisted-application/lib/portal/**'
      - 'functions/src/lib/applicationConsent.js'
      - 'scripts/assisted-application/lib/nopecha-probe.mjs'
      - 'scripts/assisted-application/lib/secure-run.mjs'
      - 'scripts/assisted-application/portal-e2e.mjs'
      - 'scripts/assisted-application/extension/**'
      - 'scripts/assisted-application/extension-e2e.mjs'
      - 'scripts/assisted-application/nopecha-e2e.mjs'
      - 'scripts/assisted-application/install-nopecha.sh'
      - '.github/workflows/assisted-application-portal-e2e.yml'

concurrency:
  # PR runs supersede older runs for the same PR. workflow_dispatch runs each
  # get their own group so one manual diagnostic cannot cancel another.
  group: assisted-application-portal-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Recent full runs take 41–42 min; #16433 hit the 45 min cap. Keep all scenarios
    # and reserve about 15 min for setup and run-to-run variance.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Node 22 + npm ci; the npm cache is only read on a PR ref, saved on main
      # (tests/npm-cache-save-main-only.test.ts).
      - name: Setup Node.js + npm ci
        uses: ./.github/actions/ci-npm-setup

      - name: Install Chromium
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /etc/apt/apt.conf.d
            printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99network-tuning >/dev/null
          fi
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Portal runner on the fake portal
        env:
          AA_PORTAL_E2E_FOCUS: ${{ github.event_name == 'workflow_dispatch' && inputs.portal_focus != 'all' && inputs.portal_focus || '' }}
          AA_PORTAL_E2E_REPORT: ${{ runner.temp }}/assisted-application-portal-e2e-report.json
        run: node scripts/assisted-application/portal-e2e.mjs

      - name: Upload sanitized portal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assisted-application-portal-e2e-report-${{ github.run_id }}
          path: ${{ runner.temp }}/assisted-application-portal-e2e-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install official NopeCHA extension
        if: github.event_name != 'workflow_dispatch' || inputs.portal_focus == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/assisted-application/install-nopecha.sh "${{ runner.temp }}/nopecha"

      - name: NopeCHA browser integration
        if: github.event_name != 'workflow_dispatch' || inputs.portal_focus == 'all'
        env:
          NOPECHA_EXTENSION_PATH: ${{ runner.temp }}/nopecha/extension
        run: node scripts/assisted-application/nopecha-e2e.mjs

      - name: Verify the free Token API on GitHub Actions
        if: inputs.probe_nopecha_free && (github.event_name != 'workflow_dispatch' || inputs.portal_focus == 'all')
        env:
          NOPECHA_EXTENSION_PATH: ${{ runner.temp }}/nopecha/extension
        run: node scripts/assisted-application/nopecha-e2e.mjs --probe-free

  # Its own job (run 36888505712: in the 15-minute portal job the extension step
  # started after 15 min and was cut after 18 s).
  extension:
    if: github.event_name != 'workflow_dispatch' || inputs.portal_focus == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      # Node 22 + npm ci; the npm cache is only read on a PR ref, saved on main
      # (tests/npm-cache-save-main-only.test.ts).
      - name: Setup Node.js + npm ci
        uses: ./.github/actions/ci-npm-setup

      - name: Install Chromium
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /etc/apt/apt.conf.d
            printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99network-tuning >/dev/null
          fi
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Fill extension on a JOIN-like wizard
        run: node scripts/assisted-application/extension-e2e.mjs
