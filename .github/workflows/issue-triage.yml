name: Issue triage (deterministic classify + route)

on:
  issues:
    types: [opened]
  # Self-healing sweep (job `sweep` sotto): recupera le issue orfane che il path
  # event-driven NON triagia mai — run cancellato da burst (cancel:false droppa
  # i pending), o issue creata da GITHUB_TOKEN (anti-ricorsione GitHub → niente
  # `issues:[opened]`: TUTTI i monitor di fallimento). 46 orfane osservate
  # 2026-06-14, alcune di 2 settimane (#855/#857 follow-up mai entrati in coda).
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max crawler→agent:fix per run (anti-burst)'
        required: false
        type: string
        default: '5'
      dry_run:
        description: 'Solo log, nessuna modifica'
        required: false
        type: boolean
        default: false

# Anti-storm: una run triage alla volta. I monitor (post-deploy validate,
# crawler-health) aprono issue in burst; serializzare evita race sul routing.
concurrency:
  group: issue-triage
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  triage:
    # Gate: solo eventi issue (non schedule/dispatch → quelli vanno al job sweep)
    # + issue non già triagiata (anti-loop). Nessun gate sull'autore: le issue
    # sono per lo più auto-generate dai monitor del repo stesso. Triage è
    # low-blast-radius (label + commento + route).
    if: ${{ github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'agent:triaged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ZERO Claude: il triage classifica con regex su titolo+label (bash puro) →
      # la quota Max NON viene toccata dal triage (era ~50 run Claude/giorno, il
      # driver principale del session-limit). Il dedup dei duplicati avviene a
      # MONTE: i monitor usano scripts/lib/github-issue-creator.mjs che, con
      # titolo stabile, commenta sull'issue canonica invece di aprirne una nuova;
      # i follow-up sono batchati 1-per-PR da post-merge-followup. Vedi ISSUES.md.
      #
      # GITHUB_PAT (Remote Config) serve SOLO ad applicare agent:fix in modo che
      # triggeri issue-fix e passi il gate (vedi nota nello step di routing). node
      # + npm ci servono a load-rc-env.mjs (firebase-admin).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; agent:fix non verrà applicato (routing inerte)."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Routing identity = GitHub App installation token (`frontaliere-automation
      # [bot]`): auto-mints, no expiry, and its `labeled` event DOES trigger
      # issue-fix / the drainer (App tokens are not subject to the GITHUB_TOKEN
      # anti-recursion). Sets env.APP_TOKEN; missing App creds → falls back to
      # env.GITHUB_PAT. The issue-fix sender gate already allowlists the App slug
      # (#2881). B2b-2 of the App migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT. Scatta solo se né App né PAT.
      - name: Alert token-down (dedup, zero-Claude)
        if: env.APP_TOKEN == '' && env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Classify and route (deterministic, no Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Routing label-apply token: App first, then PAT. Both re-trigger
          # issue-fix/drainer on `labeled` (unlike GITHUB_TOKEN, anti-recursion).
          ROUTING_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels_json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')
          state=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json state --jq '.state')
          title="$ISSUE_TITLE"
          echo "Issue #$ISSUE_NUMBER state=$state labels=$labels_json title=$title"

          # Classificazione in modulo node testabile (scripts/lib/classify-issue.mjs):
          # regex JS portabile (no grep GNU `\b`) + label come array (no bug se un
          # nome contiene virgola). Test: tests/classify-issue.test.ts.
          decision=$(node scripts/lib/classify-issue.mjs "$title" "$labels_json")
          echo "decision=$decision"
          cat=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).category)" "$decision")
          autofix=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).autofix===true))" "$decision")
          route=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).route||'none')" "$decision")
          fuprio=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).fuPrio||'')" "$decision")
          echo "category=$cat autofix=$autofix route=$route fuPrio=$fuprio"

          # --- Label anti-loop sempre (GITHUB_TOKEN: non deve triggerare nulla) ---
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:triaged" || true

          # --- Commento solo per categorie che restano umane (no rumore sul resto) ---
          case "$cat" in
            revenue|tracker)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "🤖 Triage automatico: categoria \`$cat\` — richiede giudizio strategico umano (no auto-fix). Usa \`/fix-issue\` locale o applica \`agent:fix\` a mano per un tentativo." || true ;;
            validation-failure)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "🤖 Triage automatico: categoria \`validation-failure\`. Spesso transiente — verifica se ricorre (commenti 🔁) prima di applicare \`agent:fix\` a mano. Nessun auto-fix automatico." || true ;;
            other)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "🤖 Triage automatico: categoria non riconosciuta (\`other\`) — needs manual triage." || true ;;
          esac

          # --- Routing via PAT (crawler→fix immediato, follow-up→queue) ----------
          # Le label di routing DEVONO essere via PAT, non GITHUB_TOKEN:
          # (1) anti-ricorsione GitHub — un `labeled` da GITHUB_TOKEN non triggera
          # issue-fix/drainer; (2) il gate issue-fix `sender == valerielinc-ops`
          # non matcha github-actions[bot]. Col PAT (owner) trigger + gate OK.
          #
          # route='fix'   → agent:fix subito (crawler, production-critical).
          # route='queue' → agent:fix-queued + fu-prio:<prio> (follow-up): NON parte
          #   subito; `followup-drainer.yml` lo promuove a agent:fix uno alla volta
          #   solo a slot issue-fix libero → mai cancellato-in-coda (fix starvation
          #   osservata 2026-06-04). high (funnel/priority) drenato prima di low.
          if [ "$route" = "none" ] || [ "$autofix" != "true" ]; then
            echo "route=$route autofix=$autofix → nessun routing."; exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "Issue non OPEN ($state) → skip routing."; exit 0
          fi
          if [ -z "${ROUTING_TOKEN:-}" ]; then
            echo "::warning::Nessun token usabile (App/PAT assenti) → routing inerte (GITHUB_TOKEN non triggererebbe issue-fix/drainer)."; exit 0
          fi
          # Non-fatal: se il token manca dei permessi issues:write o la label non
          # esiste, NON rompere il triage (già completato: triaged + commento) —
          # emetti warning visibile (routing inerte da indagare).
          if [ "$route" = "queue" ]; then
            prio="${fuprio:-low}"
            echo "Accodo #$ISSUE_NUMBER → agent:fix-queued + fu-prio:$prio (drenato dal followup-drainer)."
            GH_TOKEN="$ROUTING_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
              --add-label "agent:fix-queued" --add-label "fu-prio:$prio" \
              || echo "::warning::accodamento via App/PAT fallito (scope/label?) — routing non applicato, triage completato."
          else
            echo "Applico agent:fix via App/PAT su #$ISSUE_NUMBER (category=$cat) → triggera issue-fix."
            GH_TOKEN="$ROUTING_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:fix" \
              || echo "::warning::agent:fix via App/PAT fallito (scope issues:write? label assente?) — routing non applicato, triage completato."
          fi

  # Self-healing del tagging: recupera le issue orfane (no agent:triaged) che il
  # path event-driven non triagia mai (run cancellato da burst, o issue creata da
  # GITHUB_TOKEN → anti-ricorsione). Zero-Claude (riusa il classifier). Gentle
  # by-construction: follow-up → coda (drainer 1-alla-volta), crawler → fix
  # capped/run, crawler-transient → solo triaged (auto-close), resto → solo
  # triaged. Vedi scripts/ci/triage-sweep.mjs.
  sweep:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; routing sweep inerte (solo agent:triaged)."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Alert PAT-down (dedup, zero-Claude)
        if: env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Triage sweep (recover orphaned issues, deterministic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ env.GITHUB_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          ARGS="--cap ${{ github.event.inputs.cap || '5' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/ci/triage-sweep.mjs $ARGS
