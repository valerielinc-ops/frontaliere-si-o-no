name: Automation backlog sweep (Codex Luna Max, daily)

# `needs-human` e `automation-deferred` sono due stati diversi: il primo è una
# richiesta strutturata di decisione del proprietario, il secondo è un handoff
# tecnico che deve rientrare nel ciclo autonomo. Prima della separazione il
# deny tecnico diventava `needs-human` e il backlog sembrava richiedere input
# umano anche quando la decisione era già in VISION.md/DECISIONS.md.
#
# Questo sweep è l'UNICA porta di rientro dallo stato, ed è volutamente:
#  - GIORNALIERO dal 2026-09-24 (1 run Codex Luna Max batch al giorno: era
#    settimanale, ma senza più domande al proprietario è l'unica porta dei
#    defer tecnici e dei `fu-parked`);
#  - guidato da VISION.md e DECISIONS.md (i driver dicono cosa è decidibile in
#    autonomia e il registro cosa ha già deciso il proprietario);
#  - bounded (max 15 azioni per run, il resto al giro successivo).
#
# Esiti per issue: (A) decisione davvero mancante → resta `needs-human` con una
# domanda decidibile; (B) capability oggi disponibile / difetto tecnico →
# `automation-deferred` viene riscritto e rientra in coda (fix o decompose);
# (C) claim non più vera → chiusa con la misura. Il drainer e lo stadio di
# decomposizione fanno il resto (ISSUES.md → «Drenare il backlog»).

on:
  schedule:
    - cron: '37 5 * * *' # ogni giorno 05:37Z, dopo il pre-pass delle 04:37Z
    # Il pre-pass deterministico gira OGNI GIORNO alle 04:37Z, il run agentico
    # alle 05:37Z (vedi l'`if:` del job `sweep`). Storia: il 2026-08-24 un run
    # Claude a settimana con cap 15 contro 59 issue `needs-human` sono quattro
    # settimane di coda nel caso migliore, mentre VERDICT-EXIT (#6323) ne aggiunge
    # a ogni tick del drainer — 15 escalation nei primi 15 minuti dal suo merge.
    # Un'uscita che riceve piu' di quanto emette non e' un'uscita.
    - cron: '37 4 * * *' # ogni giorno 04:37Z, un'ora prima dello sweep agentico
  workflow_dispatch:

concurrency:
  group: needs-human-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write
  # La guardia sulle issue `... Failure:` legge l'ultima run completata.
  actions: read

jobs:
  # Zero Claude, zero quota: riconosce POSITIVAMENTE le famiglie di issue aperte
  # da un monitor (`Crawler Failure:`, `CI Failure:`, `[crawler-health]`, …) e le
  # rimette in coda, cosi' il cap del run Claude qui sotto si spende solo sulle
  # issue dove un giudizio serve davvero. Misurato il 2026-08-24 sulle 59
  # `needs-human` del sito: 26 instradabili senza giudizio (17 re-queue + 9
  # scorpori), e le 7 decisioni vere restavano tutte in `keep`.
  #
  # L'allowlist e' deliberata: ri-accodare per sbaglio una decisione del
  # proprietario farebbe implementare al fixer una scelta che non gli spetta
  # (scope, denaro, consenso), mentre lasciare una tecnica al run Claude costa
  # solo un'azione del suo cap. La direzione dell'errore non e' simmetrica.
  prepass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          # ATTENZIONE: qui serve la CHIUSURA TRANSITIVA degli import, non il
          # solo file di entry. Gli import ESM sono statici — il grafo dei
          # moduli si risolve PRIMA che `main()` esegua una riga — quindi un
          # file mancante non e' un ramo che fallisce ogni tanto: e'
          # `ERR_MODULE_NOT_FOUND` a OGNI invocazione, e il pre-pass non gira
          # mai. Misurato: con la sola `/scripts/ci/needs-human-prepass.mjs`
          # questo job e' morto a ogni run dal 2026-08-27 al 2026-09-04 (8
          # giorni, 0 issue drenate, `needs-human` risalito a 52 sul sito).
          #
          # Il pre-pass importa `close-recovered-failure-issues.mjs` e
          # `followup-drainer.mjs`; il secondo tira `scripts/lib/`
          # (`classify-issue.mjs` → `workflow-scope-detect.mjs`,
          # `secrets-scope-detect.mjs`, `github-issue-creator.mjs`) e
          # `scripts/ci/lib/run-budget.mjs`.
          #
          # `tests/needs-human-prepass-sparse-closure.test.ts` ricalcola la
          # chiusura dal sorgente e fallisce se questo blocco non la copre: la
          # lista qui sotto non va tenuta aggiornata a memoria.
          #
          # `/DECISIONS.md` non e' un import: e' il DATO che il pre-pass legge dal
          # 2026-09-05 (registro delle decisioni gia' prese). Non lo vede il
          # test sulla chiusura degli import, che cammina i soli `from '...'`,
          # e la sua assenza non uccide il modulo: `readDecisionRegistry()` e'
          # fail-open e il pre-pass tornerebbe al comportamento precedente
          # SENZA dirlo forte. Cioe' il modo peggiore di rompersi — verde e
          # inerte — ed e' per questo che sta scritto qui e non altrove.
          sparse-checkout: |
            /scripts/ci/
            /scripts/lib/
            /DECISIONS.md
            /VISION.md
          sparse-checkout-cone-mode: false
        timeout-minutes: 10

      # Il pre-pass scrive `automation-deferred` sulle issue tecniche. La label
      # non è garantita da un bootstrap precedente: se manca, `gh issue edit`
      # fallisce e il job resta verde solo perché il pre-pass è fail-open,
      # lasciando il tecnico in `needs-human` senza porta di rientro.
      - name: Ensure automation-deferred label (zero-Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: >-
          gh label create automation-deferred --repo "$REPO"
          --color FBCA04
          --description "Lavoro automatico differito da policy/capacità; rientra nello sweep"
          --force

      - name: Pre-pass deterministico (zero-Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/needs-human-prepass.mjs

  sweep:
    # Il run agentico gira sul cron delle 05:37Z e su dispatch, mai su quello
    # del pre-pass. Era settimanale; giornaliero dal 2026-09-24 (DECISIONS
    # «Nessun veto»): con zero domande al proprietario lo sweep è l'unica porta
    # dei defer tecnici, e un giro a settimana a cap 15 lasciava ~90 issue ferme
    # per mesi.
    if: github.event_name != 'schedule' || github.event.schedule == '37 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        timeout-minutes: 24

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Come issue-decompose: con l'App token le label `agent:fix-queued` /
      # `agent:decompose-queued` applicate qui vengono viste dal drainer e gli
      # eventi delle issue toccate restano attivi (GITHUB_TOKEN no).
      - name: Mint GitHub App token (zero-Claude, pre-npm)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Ensure VISION autonomy label (zero-Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: >-
          gh label create agent:vision-approved --repo "$REPO"
          --color 5319E7
          --description "Rientro automatico autorizzato dal contratto VISION.md"
          --force

      - name: Pre-flight — Codex lane quota telemetry
        id: quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CODEX_FALLBACK_MODE: '1'
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Run Codex Luna Max sweep
        # Tetto sullo step: senza, l'unico limite era il cap del job
        # (120min) e la run ci moriva `cancelled` — che NON fa scattare
        # nessun `if: failure()` e si vede solo dallo scan periodico
        # (`scripts/ci/scan-job-timeouts.mjs`). Stessa classe di #7310.
        # 110min = cap del job meno il setup pre-Codex misurato (~94s
        # sulle ultime run) e una coda per gli step `if: always()`.
        timeout-minutes: 110
        id: codex_sweep
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          github_token: ${{ env.APP_TOKEN }}
          # Lo sweep modifica label/issue e riattiva il ciclo: il bridge
          # host-side usa solo App/PAT; il vuoto resta fail-closed nell'action.
          codex_github_token: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          prompt: |
            Sei lo sweep giornaliero del backlog fermo (`needs-human`, `automation-deferred`, `fu-parked`) di questo repo. Il tuo compito: rimettere TUTTO nel ciclo autonomo. Dal 2026-09-24 il proprietario non vuole più domande (DECISIONS.md: «Nessun veto sul ciclo autonomo», «Parametri, soglie e scelte interne: sempre autonomi, mai una riga del proprietario»): ogni scelta la prendi tu con la direttiva unica «non perdere pagine SEO, revenue o utenti». NON implementi fix e NON apri PR.

            **Bootstrap:**
            1. Leggi `VISION.md` PER INTERO per i driver di decisione e `DECISIONS.md` per il registro delle decisioni già prese: sono il tuo criterio. Le righe più recenti prevalgono su quelle più vecchie che contraddicono.
            2. Elenca le tre code, unisci per numero e ordina per updatedAt crescente (le più ferme prima):
               - `gh issue list --repo $REPO --state open --label needs-human --json number,title,labels,createdAt,updatedAt --limit 100`
               - `gh issue list --repo $REPO --state open --label automation-deferred --json number,title,labels,createdAt,updatedAt --limit 100`
               - `gh issue list --repo $REPO --state open --label fu-parked --json number,title,labels,createdAt,updatedAt --limit 100`

            **Per ogni issue (MASSIMO 15 azioni totali in questo run — un'azione = un cambio di label/stato; le issue oltre il cap restano al giro successivo):**
            1. Leggi body + commenti (`gh issue view N --repo $REPO --json body,comments,labels,createdAt`). Cerca PRIMA una decisione già registrata in DECISIONS.md: se c'è, applicala.
            2. Classifica in UNA delle tre:
               - **B — lavoro eseguibile**: la decisione esiste nei documenti oppure la prendi tu (default più conservativo rispetto alla direttiva «non perdere pagine SEO, revenue o utenti», scritto nel commento con il driver citato). Misura la causa, completa la scheda se manca, quindi rimuovi `needs-human`/`automation-deferred`/`fu-parked` e usa `agent:fix-queued` per una issue atomica o `agent:decompose-queued` per una grande/contenitore; aggiungi `agent:vision-approved`.
               - **C — claim scaduta**: il difetto descritto non esiste più (verificalo con la misura più economica che decide: un comando dal body, un grep sul codice, una gh api). Commento con la misura osservata e il comando che la riproduce, poi `gh issue close N`. Se NON riesci a misurare, non chiudere: trattala come D.
               - **D — defer tecnico ancora reale**: il fixer ha fallito per input/turn-budget/causa non convergente. Riscrivi il body/commento con ciò che manca (causa misurata, file, criterio di accettazione), togli `needs-human` e fai rientrare con `agent:fix-queued` o `agent:decompose-queued` solo dopo avere cambiato l'input; se l'input non si può ancora cambiare lascia `automation-deferred`. Mai `needs-human`.
            3. VINCOLI: mai chiudere ciò che non hai misurato; mai rimuovere `agent:no-age-out`/`keep-open`; un'issue con PR aperta collegata non si tocca.

            **Guardia obbligatoria per la chiusura delle issue di failure.** Prima di qualsiasi `gh issue close` su un titolo che corrisponde a `^(Workflow|Crawler|CI) Failure: `, applica lo stesso oracolo di `scripts/ci/close-recovered-failure-issues.mjs`: per `Workflow Failure:` e `CI Failure:` esegui `gh run list --repo $REPO -w "$workflow_name" -b main -L 100 --json databaseId,conclusion,status,createdAt`, tieni le sole run con `status == completed`, ordinale per `createdAt` decrescente e usa l'ultima; deve avere `conclusion == success` e una data successiva a `createdAt` dell'issue. Per `Crawler Failure: Run <slug>` usa la stessa risoluzione gruppo→step del reconciler (`crawler-group-*.yml` corrente, step esatto `Run <slug>`) e verifica la conclusione dello step nella run completata più recente su `main`. Se l'ultima run/step è rossa, `cancelled`, assente o non leggibile, NON chiudere: lascia l'issue aperta e commenta la misura. Un `maybe-resolved`, un verdetto o una decisione di sweep non sostituiscono questa prova.

            **Digest (ultima azione, sempre):** una sola issue col titolo ESATTO `🧭 Decisioni del proprietario — digest` (cerca fra le aperte; se non esiste creala con label `automation,agent:no-age-out`). Sostituisci/aggiorna il body con le decisioni prese in autonomia in questo run (issue, scelta, driver citato) e i conteggi residui separati di `needs-human`, `automation-deferred` e `fu-parked`. Nessuna domanda al proprietario.

            **Telemetria:** chiudi postando sul digest un commento con l'ultimo marker su riga propria: `<!-- SWEEP_OUTCOME: a=<n> b=<n> c=<n> d=<n> -->`.

      # Colore = lavoro reale: verde se il marker SWEEP_OUTCOME è stato postato
      # (anche a cap raggiunto), rosso se la CLI è morta senza produrlo.
      - name: Classify outcome (work-done, not CLI exit)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_OUTCOME: ${{ steps.codex_sweep.outcome }}
        run: |
          set -uo pipefail
          N=$(gh search issues --repo "$GITHUB_REPOSITORY" --state open --match title "🧭 Decisioni del proprietario — digest" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${N:-}" ]; then
            HAS=$(gh issue view "$N" --json comments --jq '[.comments[].body | select(test("<!-- SWEEP_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          else
            HAS=0
          fi
          echo "digest=${N:-<none>} sweep-markers=$HAS action=$ACTION_OUTCOME"
          if [ "${HAS:-0}" != "0" ]; then
            echo "✓ marker SWEEP_OUTCOME presente → run SUCCESS."
            exit 0
          fi
          if [ "$ACTION_OUTCOME" = "failure" ]; then
            echo "::error::needs-human-sweep: CLI fallita senza marker → non-delivery. Il prossimo run settimanale (o un dispatch manuale) recupera: lo sweep è idempotente."
            exit 1
          fi
          echo "CLI pulita senza marker (es. zero issue needs-human) → verde."
