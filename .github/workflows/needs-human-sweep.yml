name: Needs-human sweep (Claude, weekly)

# `needs-human` era uno stato ASSORBENTE: nessun meccanismo lo riprendeva in
# mano (l'unico effetto a valle era una issue-digest passiva in
# recycle-stale-prs.yml). Misurato il 2026-08-21: 47 issue aperte in
# `needs-human` sul sito; il 2026-08-14 era già stato misurato che 16 su 35
# erano difetti tecnici parcheggiati per sbaglio, non decisioni vere.
#
# Questo sweep è l'UNICA porta di rientro dallo stato, ed è volutamente:
#  - SETTIMANALE (1 run Claude batch: frugalità di quota per architettura);
#  - guidato da VISION.md (i driver dicono cosa è decidibile in autonomia e
#    cosa resta del proprietario — incluse le decisioni GIÀ prese);
#  - bounded (max 15 azioni per run, il resto al giro successivo).
#
# Esiti per issue: (A) decisione vera del proprietario → resta needs-human ed
# entra nel digest settimanale con la domanda DECIDIBILE; (B) capability oggi
# disponibile / difetto tecnico → rientra in coda (fix o decompose); (C) claim
# non più vera → chiusa con la misura. Il drainer e lo stadio di decomposizione
# fanno il resto (ISSUES.md → «Drenare il backlog» e «Stadio di decomposizione»).

on:
  schedule:
    - cron: '37 5 * * 1' # lunedì 05:37Z, fuori dalle ore di punta del ciclo
    # Il pre-pass deterministico gira OGNI GIORNO; il run Claude resta settimanale
    # (vedi l'`if:` del job `sweep`). Lo scarto e' la fix del 2026-08-24: un run
    # Claude a settimana con cap 15 contro 59 issue `needs-human` sono quattro
    # settimane di coda nel caso migliore, mentre VERDICT-EXIT (#6323) ne aggiunge
    # a ogni tick del drainer — 15 escalation nei primi 15 minuti dal suo merge.
    # Un'uscita che riceve piu' di quanto emette non e' un'uscita.
    - cron: '37 4 * * *' # ogni giorno 04:37Z, un'ora prima dello sweep del lunedi'
  workflow_dispatch:

concurrency:
  group: needs-human-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  # Zero Claude, zero quota: riconosce POSITIVAMENTE le famiglie di issue aperte
  # da un monitor (`Crawler Failure:`, `CI Failure:`, `[crawler-health]`, …) e le
  # rimette in coda, cosi' il cap del run Claude qui sotto si spende solo sulle
  # issue dove un giudizio serve davvero. Misurato il 2026-08-24 sulle 59
  # `needs-human` del sito: 26 instradabili senza giudizio (17 re-queue + 9
  # scorpori), e le 7 decisioni vere restavano tutte in `keep`.
  #
  # L'allowlist e' deliberata: ri-accodare per sbaglio una decisione del
  # proprietario farebbe implementare al fixer una scelta che non gli spetta
  # (scope, denaro, consenso), mentre lasciare una tecnica al run Claude costa
  # solo un'azione del suo cap. La direzione dell'errore non e' simmetrica.
  prepass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/needs-human-prepass.mjs
          sparse-checkout-cone-mode: false
        timeout-minutes: 10

      - name: Pre-pass deterministico (zero-Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/needs-human-prepass.mjs

  sweep:
    # Il run Claude resta SETTIMANALE: e' il giudizio, non il drenaggio. Gira sul
    # cron del lunedi' e su dispatch, mai sul cron giornaliero del pre-pass —
    # altrimenti il costo si moltiplicherebbe per sette senza che il lavoro da
    # giudicare aumenti.
    if: github.event_name != 'schedule' || github.event.schedule == '37 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        timeout-minutes: 24

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Come issue-decompose: con l'App token le label `agent:fix-queued` /
      # `agent:decompose-queued` applicate qui vengono viste dal drainer e gli
      # eventi delle issue toccate restano attivi (GITHUB_TOKEN no).
      - name: Mint GitHub App token (zero-Claude, pre-npm)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Setup Headroom compression proxy
        uses: ./.github/actions/setup-headroom

      - name: Run Claude sweep
        id: claude_sweep
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ env.APP_TOKEN }}
          show_full_output: true
          allowed_bots: 'github-actions[bot], claude[bot], frontaliere-automation[bot]'
          claude_args: "--effort medium --max-turns 60 --model claude-opus-5 --dangerously-skip-permissions"
          prompt: |
            Sei lo sweep settimanale delle issue `needs-human` di questo repo. Il tuo compito: separare le decisioni VERE del proprietario dal resto, e rimettere il resto nel ciclo autonomo. NON implementi fix e NON apri PR.

            **Bootstrap:**
            1. Leggi `VISION.md` PER INTERO: i driver di decisione e il registro delle decisioni già prese sono il tuo criterio di classificazione. La lista «Sempre umano» è stata RIMOSSA il 2026-08-24 (istruzione diretta del proprietario, registro in VISION.md): non esiste più una categoria di business riservata all'umano.
            2. `gh issue list --repo $REPO --state open --label needs-human --json number,title,labels,createdAt,updatedAt --limit 100` — ordina per updatedAt crescente (le più ferme prima).

            **Per ogni issue (MASSIMO 15 azioni totali in questo run — un'azione = un cambio di label/stato; le issue oltre il cap restano al giro successivo):**
            1. Leggi body + commenti (`gh issue view N --json body,comments,labels`). Cerca PRIMA una decisione del proprietario già registrata (comando nel registro di VISION.md): se c'è, la issue non è più una domanda — applicala.
            2. Classifica in UNA delle quattro:
               - **A — vero vicolo cieco tecnico**: NESSUN driver la copre, e non è un blocco di capacità (quello è B). Con «Sempre umano» rimossa questa classe dovrebbe essere quasi sempre vuota: prima di usarla, verifica che non sia semplicemente una decisione di prodotto/business che ORA il ciclo può prendere da sé citando D1-D8. Se davvero nessun driver risponde, NON toccare le label e aggiungila al digest formulando la domanda in modo DECIDIBILE.
               - **B — capability/permessi**: era bloccata da una capacità che oggi esiste (scope `workflows` concesso via App quando `APP_TOKEN_WORKFLOWS=true`; il fixer ha tutti i tool incluso `curl` dal 2026-07-02; lo stadio di decomposizione esiste per le issue grandi). Commento che cita il driver o la capacità + `gh issue edit N --remove-label needs-human --remove-label fu-parked --add-label agent:fix-queued` (issue singola con causa chiara) oppure `--add-label agent:decompose-queued` (issue grande/contenitore: più cause o più target).
               - **C — claim scaduta**: il difetto descritto non esiste più (verificalo con la misura più economica che decide: un comando dal body, un grep sul codice, una gh api). Commento con la misura osservata e il comando che la riproduce, poi `gh issue close N`. Se NON riesci a misurare, NON chiudere: trattala come A o lasciala.
               - **D — parcheggiata giusta**: needs-human corretto ma già nel digest/registro (es. famiglia job-alert: VISION.md dice di lasciarla stare). Non toccare nulla, non metterla nel digest di nuovo se già presente.
            3. VINCOLI: mai chiudere ciò che non hai misurato; mai toccare le issue che il registro di VISION.md riserva (famiglia job-alert: #5705 e affini); mai rimuovere `agent:no-age-out`; un'issue con PR aperta collegata non si tocca.

            **Digest (ultima azione, sempre):** una sola issue col titolo ESATTO `🧭 Decisioni del proprietario — digest` (cerca fra le aperte; se non esiste creala con label `needs-human,automation,agent:no-age-out`). Sostituisci/aggiorna il body con: l'elenco delle domande di classe A (numero, domanda decidibile, opzioni), le decisioni applicate in questo run (classe B/C, con issue e driver citato), e il conteggio residuo `needs-human`. Il body deve restare leggibile in 2 minuti: le domande sono POCHE e decidibili, o lo sweep ha fallito il suo compito.

            **Telemetria:** chiudi postando sul digest un commento con l'ultimo marker su riga propria: `<!-- SWEEP_OUTCOME: a=<n> b=<n> c=<n> d=<n> -->`.

      - name: Claude usage metrics
        if: always()
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_sweep.outputs.execution_file }}" "needs-human-sweep"

      # Colore = lavoro reale: verde se il marker SWEEP_OUTCOME è stato postato
      # (anche a cap raggiunto), rosso se la CLI è morta senza produrlo.
      - name: Classify outcome (work-done, not CLI exit)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_OUTCOME: ${{ steps.claude_sweep.outcome }}
        run: |
          set -uo pipefail
          N=$(gh search issues --repo "$GITHUB_REPOSITORY" --state open --match title "🧭 Decisioni del proprietario — digest" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${N:-}" ]; then
            HAS=$(gh issue view "$N" --json comments --jq '[.comments[].body | select(test("<!-- SWEEP_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          else
            HAS=0
          fi
          echo "digest=${N:-<none>} sweep-markers=$HAS claude=$CLAUDE_OUTCOME"
          if [ "${HAS:-0}" != "0" ]; then
            echo "✓ marker SWEEP_OUTCOME presente → run SUCCESS."
            exit 0
          fi
          if [ "$CLAUDE_OUTCOME" = "failure" ]; then
            echo "::error::needs-human-sweep: CLI fallita senza marker → non-delivery. Il prossimo run settimanale (o un dispatch manuale) recupera: lo sweep è idempotente."
            exit 1
          fi
          echo "CLI pulita senza marker (es. zero issue needs-human) → verde."
