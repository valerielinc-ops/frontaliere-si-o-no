# Deploy the Cloudflare locale-router Worker.
#
# Until now the Worker (infra/cloudflare-worker/locale-router.js) was a manual
# `npx wrangler deploy` from the runbook (LOCALE-SHARD-CLOUDFLARE-RUNBOOK §2.4) —
# no workflow re-deployed it, so any edit to the Worker sat in the repo without
# going live. This closes that gap: every push to main that touches the Worker
# directory deploys it via cloudflare/wrangler-action.
#
# Note: only the WORKER SCRIPT is deployed here. The shard *content* (en/de/fr
# HTML pushed to the frontaliere-{loc} repos) is deployed separately by
# deploy.yml on every site deploy — unchanged.
#
# Credentials come from Firebase Remote Config (repo convention — same as
# deploy.yml), hydrated by scripts/load-rc-env.mjs:
#   CF_API_TOKEN   — Cloudflare API token. MUST carry, beyond the existing
#                    Zone→Analytics:Read used by cf-status-report.mjs, the scopes
#                    Account→Workers Scripts:Edit + Zone→Workers Routes:Edit
#                    (frontaliereticino.ch) or this deploy fails on auth.
#   CF_ACCOUNT_ID  — Cloudflare account id.
# FIREBASE_SERVICE_ACCOUNT_JSON (repo secret) authenticates the RC read.
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare-worker/**'
  workflow_dispatch: {}

# Never cancel an in-flight deploy: a half-applied Worker/route change is worse
# than waiting. Serialize so concurrent merges deploy in order.
concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounds the job (default is 6h): if `wrangler rollback` blocks on a non-TTY
    # confirmation prompt, the step would otherwise hang up to 6h while
    # concurrency: { cancel-in-progress: false } holds the deploy-cloudflare-worker
    # group, blocking every subsequent Worker deploy — including a hotfix for the
    # regression that triggered the rollback. Makes the declared 30-min safety net
    # real (#1821; matches update-jobs-*/production-canary convention).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # load-rc-env.mjs only needs firebase-admin — install it standalone
      # instead of a full `npm ci` (the repo's install is heavy and unneeded
      # for a Worker deploy).
      - name: Install firebase-admin (for RC read)
        run: npm install --no-save firebase-admin

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON not set — cannot read CF creds from Remote Config."
            exit 1
          fi

      - name: Load Cloudflare creds from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Verify creds present
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CF_API_TOKEN / CF_ACCOUNT_ID not hydrated from Remote Config."
            exit 1
          fi

      - name: Deploy locale-router Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare-worker
          command: deploy

      # Over-cap failover config. wrangler re-syncs routes from wrangler.toml,
      # which cannot express request_limit_fail_open — a deploy can silently
      # reset routes to the fail-closed default (error 1027 on everything over
      # the free 100k/day cap). Re-assert fail-open + the zone cache rule that
      # lets the CDN serve the Worker's apex-keyed cached pages while bypassed.
      - name: Assert fail-open routes + failover cache rule
        run: node scripts/cf-locale-failover-setup.mjs

      # Live regression check: status AND timing. The previous 30s tee-deadlock
      # (introduced in #1791, fixed in #1814) returned HTTP 200 but stalled
      # ~30s, so a status-only smoke missed it entirely and it sat live ~1 day.
      # Here each locale root is cache-busted (forcing a MISS so the
      # cache-population path that deadlocked is exercised), timed, and compared
      # to the DIRECT origin time. apex-via-Worker slow + origin fast = a Worker
      # regression (the exact discriminator from the #1814 diagnosis) →
      # auto-rollback. Both slow = an origin problem, not the Worker → warn only.
      - name: Live regression check (status + timing)
        id: regression
        env:
          STALL_THRESHOLD_S: '10'  # healthy ~0.3s; the deadlock was a constant ~30s
          ORIGIN_FAST_S: '4'       # the gray-cloud shard origin normally answers in ~0.2s
        run: |
          set -uo pipefail
          regression=0
          for loc in en de fr; do
            apex="https://frontaliereticino.ch/$loc/"
            origin="https://origin-$loc.frontaliereticino.ch/$loc/"
            # Two cache-busted apex attempts → take the FASTER, so a one-off cold
            # fetch is ignored; a real deadlock is constant across both.
            best=99; code=000
            for n in 1 2; do
              out=$(curl -s -o /dev/null -w '%{time_total} %{http_code}' --max-time 35 "${apex}?dwcheck=${RANDOM}${n}" || echo "99 000")
              t=$(printf '%s' "$out" | awk '{print $1}')
              code=$(printf '%s' "$out" | awk '{print $2}')
              if awk "BEGIN{exit !($t < $best)}"; then best=$t; fi
            done
            otime=$(curl -s -o /dev/null -w '%{time_total}' --max-time 35 "$origin" || echo "99")
            echo "/$loc/ apex=${best}s (http $code) | origin=${otime}s"
            [ "$code" != "200" ] && echo "::warning::/$loc/ returned HTTP $code"
            apex_slow=$(awk "BEGIN{print ($best > $STALL_THRESHOLD_S)?1:0}")
            origin_fast=$(awk "BEGIN{print ($otime < $ORIGIN_FAST_S)?1:0}")
            if [ "$apex_slow" = "1" ] && [ "$origin_fast" = "1" ]; then
              echo "::error::/$loc/ via Worker ${best}s but origin ${otime}s — WORKER STALL REGRESSION"
              regression=1
            elif [ "$apex_slow" = "1" ]; then
              echo "::warning::/$loc/ slow (${best}s) AND origin slow (${otime}s) — origin issue, not the Worker"
            fi
          done
          echo "regression=$regression" >> "$GITHUB_OUTPUT"

      # Auto-recover: roll the Worker back to the previous (good) deployment the
      # moment a stall regression is detected, so prod doesn't sit broken waiting
      # for a human. Only fires on the apex-slow + origin-fast verdict above.
      - name: Auto-rollback Worker on stall regression
        if: steps.regression.outputs.regression == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare-worker
          command: 'rollback --message "auto-rollback - deploy regression check detected a shard stall"'

      - name: Fail the job on regression
        if: steps.regression.outputs.regression == '1'
        run: |
          echo "::error::Worker rolled back — a shard stall regression was detected post-deploy. Investigate the diff before redeploying."
          exit 1
