name: Loop L2 demand to utility

on:
  schedule:
    - cron: '47 7 * * *'
  push:
    branches: [main]
    paths:
      - 'data/gsc-orphan-queries-clusters.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/export-l2-demand-outcomes.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/loop-l2-demand-utility.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l2-demand-utility.yml'
  pull_request:
    paths:
      - 'data/gsc-orphan-queries-clusters.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/export-l2-demand-outcomes.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/loop-l2-demand-utility.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l2-demand-utility.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when the outcome join is not measurable'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l2-demand-utility
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout demand inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/gsc-orphan-queries-clusters.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/export-l2-demand-outcomes.mjs
            /scripts/ci/export-loop-outcomes.mjs
            /scripts/lib/ga4-service-account.mjs
            /scripts/lib/analytics-settled-window.mjs
            /scripts/ci/loop-l2-demand-utility.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/posthog-client.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /.github/workflows/loop-l2-demand-utility.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      - name: Prepare read-only Firebase credentials
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set; recording an explicitly unavailable demand outcome'
            echo 'LOOP_FLEET_L2_EXPORT_UNAVAILABLE=1' >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Export read-only L2 demand outcome
        if: always()
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          OUTCOME_PATH: ${{ runner.temp }}/loop-fleet-l2/demand-outcomes.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$OUTCOME_PATH")"
          if [ "$WORKFLOW_EVENT" = 'pull_request' ]; then
            node scripts/ci/export-l2-demand-outcomes.mjs --unavailable --input data/gsc-orphan-queries-clusters.json --out "$OUTCOME_PATH"
            exit 0
          fi
          if [ "${LOOP_FLEET_L2_EXPORT_UNAVAILABLE:-0}" = '1' ]; then
            node scripts/ci/export-l2-demand-outcomes.mjs --unavailable --input data/gsc-orphan-queries-clusters.json --out "$OUTCOME_PATH" --reason 'Firebase read-only credentials unavailable'
            exit 0
          fi
          set +e
          node scripts/ci/export-l2-demand-outcomes.mjs --json --input data/gsc-orphan-queries-clusters.json --days 8 --out "$OUTCOME_PATH" | tee "$RUNNER_TEMP/loop-fleet-l2/export-cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          export_code=${PIPESTATUS[0]}
          set -e
          if [ "$export_code" -ne 0 ]; then
            echo '::warning::L2 live outcome export failed; recording an explicitly unavailable outcome so utility remains fail-closed'
            node scripts/ci/export-l2-demand-outcomes.mjs --unavailable --input data/gsc-orphan-queries-clusters.json --out "$OUTCOME_PATH" --reason 'PostHog/GSC live join failed'
          fi
      - name: Audit demand to utility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l2
          OUTCOME_PATH: ${{ runner.temp }}/loop-fleet-l2/demand-outcomes.json
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --source "$OUTCOME_PATH")
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l2-demand-utility.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l2-result.json" >/dev/null 2>&1; then
            echo 'L2 finding persisted as a deduplicated issue; no unreviewed landing change was applied.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Validate runner-local L2 outcome export
        if: always()
        id: validate_l2_outcome
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l2
        run: |
          test -s "$REPORT_DIR/l2-outcome.json"
          jq -e '(.loopId == "L2" and (.status | type) == "string" and (.independent | type) == "boolean" and (.metrics | type) == "object" and .safeToAct == false and .publishedDataUntouched == true and .noThinPages == true and .noKeywordStuffing == true and .sourceRequired == true)' "$REPORT_DIR/l2-outcome.json" >/dev/null
      - name: Record canonical L2 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l2
          LOOP_FLEET_VALIDATOR_OUTCOME: ${{ steps.validate_l2_outcome.outcome }}
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L2 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L2 observation and candidates
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l2-demand-utility-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l2/
          retention-days: 90
          if-no-files-found: error
