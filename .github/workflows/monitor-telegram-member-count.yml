name: Telegram Member Count Monitor

# Daily check that the Telegram channel's member count is still moving.
# getChatMemberCount() had no scheduled caller anywhere in the repo before
# this workflow (issue #6507) — a channel that goes silently stale (bot
# removed as admin, channel abandoned, broken join link) went completely
# unobserved. Persists one {date, count} entry/day to the committed
# data/telegram-member-count-history.jsonl and opens a stable-title issue via
# scripts/lib/github-issue-creator.mjs when the count has been unchanged for
# >= 30 days. The history is published through a PR because main requires the
# `vitest (unit + integration)` status check before accepting a write.
#
# Fail-soft by design: with no TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID in
# Remote Config the monitor logs a clean skip and exits 0 — same contract as
# telegram-channel-broadcast.yml.

on:
  schedule:
    - cron: '45 6 * * *'  # daily, shortly after telegram-channel-broadcast.yml's 06:30 digest
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no history write, no issue)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: monitor-telegram-member-count
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # The history commit can wait through the repository's main-writer convoy;
    # 10 minutes cut off a run after 25 retry attempts (#10541).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Senza GOOGLE_APPLICATION_CREDENTIALS `load-rc-env.mjs` e' fail-open:
      # stampa "skipping RC secret loading" ed esce 0, quindi ne' il token
      # Telegram ne' `GITHUB_PAT` vengono popolati. Effetto osservato sulla
      # run del 2026-09-18: lo step di commit stampa "no history changes" e
      # `data/telegram-member-count-history.jsonl` non esiste su `main` — il
      # push non e' mai stato raggiunto, quindi il difetto di identita' che
      # ha bloccato refresh-search-cluster-301-map.yml (GH013: il ruleset
      # rifiuta l'installation token dell'App) qui e' solo latente.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # The App identity re-triggers pull-request checks. If the installation
      # is unavailable, the long-lived PAT loaded above remains the fallback.
      - name: Mint App token (primary PR identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # A stable PR branch can still be in flight when the next daily run
      # starts. Bring its append-only history into the current workspace before
      # the monitor appends today's observation; otherwise the publisher would
      # rebuild the branch from main and silently drop the pending days.
      - name: Carry forward pending history PR
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          branch='chore/telegram-member-count-history'
          history_path='data/telegram-member-count-history.jsonl'
          if ! git fetch --no-tags origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" \
            >/dev/null 2>&1; then
            echo "No in-flight history PR branch found."
            exit 0
          fi
          if git cat-file -e "refs/remotes/origin/${branch}:${history_path}" 2>/dev/null; then
            git show "refs/remotes/origin/${branch}:${history_path}" > "${history_path}"
            echo "Loaded append-only history from ${branch}."
          fi

      - name: Run member count monitor
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/monitor-telegram-member-count.mjs --dry-run
          else
            node scripts/monitor-telegram-member-count.mjs
          fi

      - name: Open PR with member count history
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ env.APP_TOKEN_DATA_REFRESH == 'true' && env.APP_TOKEN || env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          if [ ! -f data/telegram-member-count-history.jsonl ]; then
            echo "No member count history to publish."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          body="$RUNNER_TEMP/telegram-member-count-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - Il monitor aggiorna \`data/telegram-member-count-history.jsonl\` tramite il branch stabile \`chore/telegram-member-count-history\`, così il required check \`vitest (unit + integration)\` gira prima dell'ingresso su \`main\`.

          ## Non implementato (ancora)
          Nessuno — aggiornamento dati automatizzato, senza residui.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/telegram-member-count-history.jsonl \
            --branch chore/telegram-member-count-history \
            --commit-message "chore(telegram): member count history — ${DATE}" \
            --title "chore(telegram): member count history" \
            --body-file "$body"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
