name: Measure Deploy Delta

# Measures the REAL per-deploy delta by diffing two GitHub Pages artifacts
# (the whole site tar) by content hash — answers "how much would an incremental
# sync actually push per deploy". Read-only, no checkout of the site, no commit.
# Manual trigger; pick two deploy runs or let it auto-pick the last two with a
# non-expired github-pages artifact.
#
# NOTE on the locale-shard rehydrate pattern (issue #3104 sibling-fix sweep):
# this workflow was flagged as a possible sibling of the seed-*-baseline.yml
# "github-pages-only download" gap, but it is a FALSE POSITIVE for the
# verbatim rehydrate-steps fix applied there. Those workflows extract ONE
# run's artifact into a `dist/` tree and then walk it with a Node auditor;
# `measure-dist-delta.py` here never materializes a `dist/` tree at all — it
# streams two whole `artifact.tar` files directly (`A/artifact.tar`,
# `B/artifact.tar`) and diffs their members by content hash in place. Bolting
# on the "Rehydrate locale/section shards into dist/" steps would require a
# different, larger change: pulling the matching locale/section shard tars for
# BOTH run_a and run_b and diffing each shard pair separately, then merging
# those deltas into the report — not a copy-paste of the rehydrate steps.
# The `github-pages`-only download here is a real completeness gap (the
# reported delta undercounts churn once LOCALE_SHARDS_LIVE/TICINO_SHARD_LIVE/
# SVIZZERA_SHARD_LIVE/ZURIGO_SHARD_LIVE strip sections into shard repos) but
# it is a distinct, larger fix left
# out of scope for this sweep; this tool is diagnostic/measurement-only (not
# a validation-gate baseline), so the gap does not silently weaken a ratchet.

on:
  workflow_dispatch:
    inputs:
      run_a:
        description: "OLDER deploy run id (blank = auto-pick)"
        required: false
        default: ""
      run_b:
        description: "NEWER deploy run id (blank = auto-pick)"
        required: false
        default: ""
      samples:
        description: "How many changed files to sample-diff (0 = none)"
        required: false
        default: "10"

permissions:
  actions: read
  contents: read

concurrency:
  group: measure-deploy-delta
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    # `samples>0` adds two extra full streaming passes over BOTH ~1.4GB tars
    # (extract_members) on top of the two manifest sha1 passes — ~327k members
    # ×2 archives overran the old 30-min cap (samples=0 fit; samples>0 timed
    # out, blocking the post-fix churn measurement — #1633 item 1). Raised so
    # the sample-diff path can complete; still bounded against a runaway job.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (script only)
        uses: actions/checkout@v5
        with:
          # Hand-kept (apply-checkout-profiles.mjs deliberately leaves this
          # one alone): the delta script, plus the composite action that
          # owns artifact resolve+download for every workflow in the repo.
          sparse-checkout: |
            scripts/measure-dist-delta.py
            .github/actions/fetch-pages-artifact
          sparse-checkout-cone-mode: false

      - name: Resolve run ids (auto-pick last two with github-pages artifact)
        id: pick
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_RUN_A: ${{ inputs.run_a }}
          INPUT_RUN_B: ${{ inputs.run_b }}
        run: |
          set -euo pipefail
          A="$INPUT_RUN_A"
          B="$INPUT_RUN_B"
          if [ -n "$A" ] && [ -z "$B" ] || [ -z "$A" ] && [ -n "$B" ]; then
            echo "::error::Provide BOTH run_a and run_b, or leave BOTH blank for auto-pick."
            exit 1
          fi
          if [ -z "$A" ] && [ -z "$B" ]; then
            echo "Auto-picking last two deploy.yml runs with a non-expired github-pages artifact..."
            # #7393: this used to iterate a `gh api` command substitution
            # directly in the for-LIST position. Under `set -euo
            # pipefail` a command substitution in a for-LIST does not abort the
            # script when it fails — the list came back empty, the loop never
            # ran, and an API error read as "no run has an artifact". The
            # listing is materialised to a file and checked before iterating.
            #
            # #7395: and it was a single per_page=40 page with no successor.
            # Paginate to an explicit, named cap so "we ran out of window" is
            # distinguishable from "nothing succeeded" — same 3 x 50 ceiling as
            # .github/actions/fetch-pages-artifact/action.yml.
            MAX_PAGES=3
            PER_PAGE=50
            WORK="$(mktemp -d)"
            page=1
            while [ "$page" -le "$MAX_PAGES" ]; do
              if ! gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=$PER_PAGE&page=$page" \
                   > "$WORK/page-$page.json"; then
                echo "::error::gh api failed while listing deploy.yml runs (page $page). This is an API/token failure, NOT 'no deploy has an artifact'."
                exit 1
              fi
              # #7504: a 2xx body is not necessarily a runs collection. The
              # secondary-rate-limit / abuse-detection guard answers HTTP 200 with an
              # OBJECT carrying `message`/`documentation_url`, and a truncated response
              # is not JSON at all — in both cases `gh` exits 0 and the count below
              # yields `null`. `[ null -lt 50 ]` then exits 2 ("integer expression
              # expected"), but as the FIRST member of an `&&` list that exit code is
              # invisible to `set -e`: the loop kept paginating and the failure
              # surfaced far downstream as a raw jq error instead of the ::error::
              # built right above. Same class as #7393. Validate the SHAPE first.
              if ! jq -e 'type == "object" and has("workflow_runs") and (.workflow_runs | type == "array")' \
                   "$WORK/page-$page.json" >/dev/null 2>&1; then
                echo "::error::gh api returned a 2xx body without a .workflow_runs array (page $page). This is an API failure, NOT 'no deploy has an artifact'."
                exit 1
              fi
              got=$(jq '.workflow_runs | length' "$WORK/page-$page.json")
              [ "$got" -lt "$PER_PAGE" ] && break
              page=$((page + 1))
            done
            # #7394: the REST endpoint does not CONTRACT created_at desc, and
            # here the order decides which artifact is B (newer) and which is A
            # (older) — i.e. the SIGN of every number this workflow reports.
            # Order client-side and print the timestamps.
            jq -rs '[.[].workflow_runs[]]
                    | sort_by(.created_at) | reverse
                    | .[] | [(.id|tostring), .created_at] | @tsv' \
              "$WORK"/page-*.json > "$WORK/cands.tsv"
            echo "Candidates (id / created_at), client-sorted by created_at desc:"
            sed 's/^/  /' "$WORK/cands.tsv"
            picked=()
            while IFS=$'\t' read -r r created; do
              [ -n "$r" ] || continue
              # #7501: this used to swallow gh's stderr and fall back to a
              # zero count, which maps ANY gh failure (502, timeout, a token
              # without `actions: read`) onto "this run has no artifact" —
              # indistinguishable from a 2xx with an empty list. The candidate
              # was dropped in
              # silence, the pair slid to two older deploys, and the workflow
              # reported a plausible delta between the WRONG two deploys. Same
              # class as #7393, and treated as fatal here exactly like
              # .github/actions/fetch-pages-artifact/action.yml does.
              rc=0
              has=$(gh api "repos/$GH_REPO/actions/runs/$r/artifacts" \
                --jq '[.artifacts[]|select(.name=="github-pages" and .expired==false)]|length') || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "::error::gh api failed while listing artifacts of run $r (exit $rc). This is an API/token failure, NOT 'this run has no artifact'."
                exit 1
              fi
              if [ "${has:-0}" -gt 0 ]; then
                echo "  keeping run $r ($created)"
                picked+=("$r")
              fi
              [ "${#picked[@]}" -ge 2 ] && break
            done < "$WORK/cands.tsv"
            if [ "${#picked[@]}" -lt 2 ]; then
              echo "::error::Could not find two deploy.yml runs on main with a non-expired github-pages artifact within the walk-back cap ($MAX_PAGES pages x $PER_PAGE runs). Pass run_a and run_b explicitly."
              exit 1
            fi
            B="${picked[0]}"   # newest
            A="${picked[1]}"   # older
          fi
          echo "Older (A) = $A"
          echo "Newer (B) = $B"
          echo "run_a=$A" >> "$GITHUB_OUTPUT"
          echo "run_b=$B" >> "$GITHUB_OUTPUT"

      # Both downloads go through the composite action, which owns the
      # `.expired==false` filter these two steps were missing (#7392) and the
      # 410 handling (#7396). The run ids are PINNED here — the pair above is
      # already chosen, so a dead artifact must fail loudly rather than have
      # one half of the diff silently slide to a different deploy.
      - name: Fetch OLDER artifact
        id: older
        uses: ./.github/actions/fetch-pages-artifact
        with:
          run-id: ${{ steps.pick.outputs.run_a }}
          output-dir: A
          github-token: ${{ github.token }}

      - name: Fetch NEWER artifact
        id: newer
        uses: ./.github/actions/fetch-pages-artifact
        with:
          run-id: ${{ steps.pick.outputs.run_b }}
          output-dir: B
          github-token: ${{ github.token }}

      - name: Measure delta (stream-hash, no extract)
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          ls -la A B
          python3 scripts/measure-dist-delta.py A/artifact.tar B/artifact.tar report.md "$INPUT_SAMPLES"
          {
            echo "_Older run [${{ steps.pick.outputs.run_a }}], newer run [${{ steps.pick.outputs.run_b }}]_"
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: deploy-delta-report
          path: report.md
          retention-days: 30
