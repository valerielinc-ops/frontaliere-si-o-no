name: Issue fix (Claude → PR)

on:
  issues:
    types: [labeled]

# Serializza i fixer: un agent alla volta evita N PR concorrenti sullo stesso
# data file (crawler config) + rispetta il cap OOM (max parallel agent). Le issue
# in coda vengono processate appena lo slot si libera.
concurrency:
  group: issue-fix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    # Gate (tutti necessari):
    # - L'evento è l'aggiunta della label `agent:fix` (opt-in esplicito, mai
    #   trigger su qualunque label). Solo collaborator/owner possono labellare,
    #   quindi la label È il consenso umano.
    # - sender == owner: belt-and-suspenders contro label aggiunte da automation
    #   esterne / bot non fidati.
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    if: |
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'valerielinc-ops' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine fix tier
        id: tier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Tier high (opus, max-turns alti): issue funnel-critical — crawler/parser/
        # build-plugin/workflow CI/test gate, o uno script che MUTA/emette dati
        # indicizzati (backfill/migrate/assemble/sitemap/canonical/slug/
        # structured-data/seo). Bug lì = rischio propagato su ogni merge → probing
        # opus paga. Tier normal (sonnet) per il resto. Mirror ESATTO di
        # pr-review-loop: il bare `scripts/` NON escala più (mandava ogni menzione
        # di script — inclusi helper `scripts/{ci,dev,evals}/` e audit/report
        # read-only — a opus@40; osservato 2026-06-04 come tier-breadth waste). Gli
        # script funnel restano high via i loro keyword semantici/path index-muting.
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels --jq '.title + "\n" + .body + "\n" + (.labels[].name)')
          if echo "$body" | grep -qiE 'crawler|parser|build-plugin|\.github/workflows/|test gate|validator|migrator' \
             || echo "$body" | grep -qiE 'scripts/[a-z0-9_./-]*(backfill|migrate|assemble|sitemap|canonical|slug|structured-data|seo|index)'; then
            echo "tier=high" >> "$GITHUB_OUTPUT"
            echo "model=claude-opus-4-8" >> "$GITHUB_OUTPUT"
            echo "max_turns=40" >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "max_turns=30" >> "$GITHUB_OUTPUT"
          fi
          echo "Fix tier: $(grep tier= "$GITHUB_OUTPUT" | head -1)"
          # Aggregate detection (deterministic, da titolo "N item deferred", N>=2).
          # Il parsing dei singoli item dal body è freeform/fragile → ci basiamo
          # sul COUNT nel titolo (affidabile) per attivare il circuit-breaker
          # one-item nel prompt (R3-A): il prompt-only R2-A non sempre teneva
          # (#1172 error_max_turns post-merge). is_aggregate guida l'istruzione
          # forte "fixa 1 item poi STOP".
          N=$(printf '%s' "$body" | grep -oiE '[0-9]+ item deferred' | head -1 | grep -oE '^[0-9]+' || true)
          if [ "${N:-0}" -ge 2 ] 2>/dev/null; then
            echo "is_aggregate=true" >> "$GITHUB_OUTPUT"
            echo "agg_count=${N}" >> "$GITHUB_OUTPUT"
          else
            echo "is_aggregate=false" >> "$GITHUB_OUTPUT"
            echo "agg_count=0" >> "$GITHUB_OUTPUT"
          fi
          echo "Aggregate: is_aggregate=$(grep is_aggregate= "$GITHUB_OUTPUT" | tail -1)"

      - name: Configure git identity
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      - name: Run Claude fix
        id: claude_review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          FIX_TIER: ${{ steps.tier.outputs.tier }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Whitelist esplicita (hardening #898): mai `*`. I sender bot legittimi
          # del trigger sono `claude[bot]` (cascade fix → re-trigger) e
          # `github-actions[bot]` (re-label interno). Il PAT user `valerielinc-ops`
          # è un account umano → bypassa `allowed_bots`, già coperto dal gate `if`.
          allowed_bots: 'github-actions[bot], claude[bot]'
          claude_args: "--max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --allowedTools 'Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(node:*),Bash(rg:*),Bash(ls:*),Bash(cat:*),Read,Grep,Glob,Edit,Write'"
          prompt: |
            Sei l'agent di fix autonomo per la issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Bootstrap (in quest'ordine):**
            1. Leggi `ISSUES.md` → "Fix flow" — contratto operativo del fixer.
            2. Leggi `AGENTS.md` — non-negotiables + Privacy + architettura. VINCOLANTE.
            3. Carica la issue: `gh issue view $ISSUE_NUMBER --json number,title,body,labels,comments`.

            **Pre-condizioni (abort se falliscono):**
            - Se esiste già una PR aperta che cita "#$ISSUE_NUMBER" (`gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number`) → posta commento "PR già in volo: #<n>, skip." e TERMINA. No doppioni.
            - **Overlap-file** (no race su lavoro in corso): estrai i path target dal body della issue (file citati in `## Suggested action` / `## Item` / blocchi codice). Per ogni PR aperta (`gh pr list --state open --json number,title`) confronta i suoi file (`gh pr diff <n> --name-only`) coi target: se una PR aperta **modifica già** uno dei file target → posta commento "File `<path>` già in volo nella PR #<n> (<title>) — skip per evitare conflitto/duplicazione; riaprire l'auto-fix dopo il merge se ancora pertinente." e TERMINA. Razionale: un'altra PR può riscrivere quel file rendendo il fix moot o conflittuale (es. #934 hardening vs #943 rewrite di `submit-indexnow-batch.yml`). Nel dubbio (issue non file-specifica) → procedi.
            - Se la issue è categoria `revenue` o `tracker` (strategica) → posta "Richiede giudizio umano, non auto-fixabile. Rimuovere `agent:fix`." e TERMINA.
            - **Capability guard (valuta SUBITO, prima di implementare — risparmio token):** questo ambiente ha solo `GH_TOKEN` (GitHub App) che NON ha lo scope `workflows` e NON ha PAT/Firebase SA. Dai path target estratti dal body: se il fix richiederebbe di modificare file in `.github/workflows/**` → il `git push` fallirebbe sempre (push di workflow rifiutato senza scope `workflows`) → niente PR. Allora NON implementare: posta un commento col diff/azione proposta + "blocco scope `workflows`: serve PAT abilitato o mano umana" e TERMINA SUBITO. Lo stesso vale se il fix è puramente una repo-setting/branch-protection/admin-API (es. `gh api .../branches/main/protection` → 403) o richiede segreti non in CI: documenta e TERMINA senza implementare. Razionale: fare il fix completo per poi scoprire il blocco al push spreca ~1M token/run (vedi #983); il blocco è deterministico dallo scope, va rilevato a turno 1.

            - **Follow-up aggregata multi-item — is_aggregate=${{ steps.tier.outputs.is_aggregate }} (count=${{ steps.tier.outputs.agg_count }}):** se `is_aggregate=true` questa issue ha ${{ steps.tier.outputs.agg_count }} item distinti e tentarli TUTTI in un run sfora il turn budget → `error_max_turns` → 0 PR, ~2M token persi (osservato #1095/#1101/#1172). **REGOLA FERREA (circuit-breaker):** fixa **ESATTAMENTE UN item** poi FERMATI. Procedura: (a) capability guard **PER-ITEM** — salta gli item che toccano `.github/workflows/**`/admin/secret (NON abortire l'intera issue), (b) scegli il PRIMO item in-capability a massimo valore funnel, (c) implementa SOLO quello, (d) **appena la PR per quell'unico item è aperta → STOP IMMEDIATO, non iniziare un secondo item** (anche se hai turni residui), (e) elenca tutti gli altri item in `## Non implementato` (motivo `follow-up`/`blocked`) → `post-merge-followup` li ri-accoda come nuova follow-up (re-queue esistente; ogni ciclo chiude ≥1 item → converge). Se `is_aggregate=false`: issue singola, comportamento invariato (capability guard whole-issue come sopra). Razionale: il budget di turni basta per 1 item con margine; 2+ item lo bruciano.

            **Fix flow (vedi ISSUES.md):**
            1. Branch isolato: `git checkout -b fix/issue-$ISSUE_NUMBER`.
            2. Diagnosi root cause della issue (NON sintomo). Per categoria `crawler`: il selector è driftato → rigenera/aggiusta il parser; preferisci `node scripts/generate-company-parser.mjs` o l'edit mirato del parser/config citato nel body.
            3. Applica fix CHIRURGICO alla **CLASSE del bug, NON al singolo file** (AGENTS.md non-negotiable #6): no drive-by refactor / no speculative abstraction, MA per un fix di pattern (regex/replace/guard/floor/threshold/selector/bullet-idiom) `rg`/`grep` i sibling funnel-critical (`scripts/update-*.mjs`, `scripts/lib/*-parser.mjs`, `build-plugins/**`) per lo STESSO costrutto → sweepa l'intera classe nella STESSA PR, oppure giustifica OGNI sibling non toccato in `## Non implementato`. Toccare i file gemelli con lo stesso antipattern NON è drive-by: è il fix completo. Pre-empt del 🔴 reviewer "stesso antipattern nel file gemello" (osservato #1083/#1073 il 2026-06-02: PR mono-file → 🔴 sibling → 2 cicli review+fix sprecati sulla quota Max condivisa).
            4. Mai abbassare quality gate/test/validation per "far passare" (non-negotiable #1).
            5. Commit con identity canonica già configurata. Messaggio conventional, in fondo nessuna email non-canonica.
            6. Push del branch: `git push -u origin fix/issue-$ISSUE_NUMBER`.
            7. Apri PR con `gh pr create`. Body OBBLIGATORIO (REVIEW.md completeness contract):
               ```
               ## Implementato
               - <cosa fa il fix>
               Closes #$ISSUE_NUMBER

               ## Non implementato (ancora)
               - <scope NON fatto + motivo: out of scope / follow-up / blocked / posposto>
               ```
            8. La PR entra automaticamente in `pr-review-loop` → review → `## LGTM` → `auto-merge-on-lgtm`. NON mergiare a mano.

            **Constraint:**
            - Changes chirurgiche, root-cause, una issue alla volta.
            - Mai toccare file fuori scope della issue — **eccetto i sibling della STESSA classe del bug** (#6, passo 3): quelli SONO in scope e vanno sweepati nella stessa PR. "Fuori scope" = un'altra feature/area, NON un file gemello con lo stesso antipattern (es. fixare il bullet-idiom in 1 parser e lasciarlo rotto negli altri 16 = fix incompleto, non "rispetto dello scope").
            - **CODE vs DATA — no scroll dei blob (ISSUES.md → "CODE vs DATA", mirror #1096 del reviewer):** i file rigenerati `data/**` (job JSON, snapshot, translation-cache, blog-articles), `public/**` (asset), `reports/**`, `_newsletter_variants/**` NON sono code da leggere riga-per-riga. Se la root cause è un drift di output dati → fixa il CODE che li genera (parser/crawler/build-plugin), non `cat`/scorrere il blob né editarlo a mano. Campione → `Read` mirato (offset/limit). `rg`/`grep` scopati al code: `rg <pattern> scripts build-plugins components services -g '!data/**' -g '!public/**' -g '!reports/**'` — cercare nei blob dati = token bruciati. Eccezione: un `data/**` config/fixture checked-in editato a mano dal fix.
            - Mai disabilitare AdSense Auto Ads (non-negotiable #7).
            - Mai committare path home assoluti o email personali (Privacy).
            - Se la root cause non è determinabile con confidenza → NON forzare un fix; posta su issue "Root cause non determinata: <cosa hai trovato>. Serve indagine umana." rimuovi nulla e TERMINA senza PR.
            - Se il fix richiede credenziali/segreti non disponibili in CI → documenta in commento e TERMINA senza PR.
            - **Telemetria outcome (OBBLIGATORIO):** ogni volta che termini, l'ULTIMO commento che posti sulla issue DEVE iniziare con un marker HTML su riga propria: `<!-- FIX_OUTCOME: <code> -->`. `<code>` ∈ `pr-created` (PR aperta) · `blocked-workflows-scope` · `blocked-secrets` · `blocked-admin-settings` · `no-root-cause` · `overlap-skip` · `pr-already-open` · `already-fixed` · `revenue-tracker-manual`. Se apri una PR (passo 7) e non posti altri commenti, aggiungi comunque un commento col solo marker `<!-- FIX_OUTCOME: pr-created -->`. Il lessons-harvester aggrega questi marker per rilevare classi di blocco ricorrenti e proporre migliorie ai doc/prompt (vedi ISSUES.md → "Auto-improvement loop").

      - name: Claude usage metrics
        if: always()
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "issue-fix"

      - name: Emit FIX_OUTCOME telemetry (deterministic backstop)
        if: always()
        # The agent SHOULD post a granular `<!-- FIX_OUTCOME: <code> -->` marker,
        # but prompt-emitted markers are unreliable (observed: #974 ran with the
        # marker prompt on main yet posted none). This backstop guarantees the
        # lessons-harvester always has a queryable marker: pr-created if this run
        # opened a PR on fix/issue-<N>, else a coarse no-pr-unspecified. It never
        # overwrites the agent's own granular marker. Best-effort: never fails.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          HAS=$(gh issue view "$ISSUE" --json comments --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          if [ "${HAS:-0}" != "0" ]; then
            echo "FIX_OUTCOME marker already present (agent-posted) — no backstop needed."
            exit 0
          fi
          PR=$(gh pr list --head "fix/issue-$ISSUE" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then OUT=pr-created; else OUT=no-pr-unspecified; fi
          echo "FIX_OUTCOME issue=$ISSUE outcome=$OUT (deterministic backstop)"
          gh issue comment "$ISSUE" --body "$(printf '<!-- FIX_OUTCOME: %s -->\n_Outcome rilevato dal post-step deterministico (telemetria lessons-harvester)._' "$OUT")" || true
