name: Issue fix (Claude → PR)

on:
  issues:
    types: [labeled]

# Serializza i fixer: un agent alla volta evita N PR concorrenti sullo stesso
# data file (crawler config) + rispetta il cap OOM (max parallel agent). Le issue
# in coda vengono processate appena lo slot si libera.
concurrency:
  group: issue-fix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    # Gate (tutti necessari):
    # - L'evento è l'aggiunta della label `agent:fix` (opt-in esplicito, mai
    #   trigger su qualunque label). Solo collaborator/owner possono labellare,
    #   quindi la label È il consenso umano.
    # - sender == owner: belt-and-suspenders contro label aggiunte da automation
    #   esterne / bot non fidati.
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    if: |
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'valerielinc-ops' ||
       github.event.sender.login == 'frontaliere-automation[bot]' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Blobless clone (#4189): con fetch-depth:0 il checkout scaricava TUTTI
          # i blob storici di questo repo data-heavy, consumando l'intero budget
          # job da 30min → "Run Claude fix" non partiva mai. `filter: blob:none`
          # prende il commit-graph completo + il working tree di HEAD ma salta i
          # blob storici (fetch on-demand se mai servono): checkout da ~minuti a
          # ~secondi, HEAD materializzato identico → il fixer lavora invariato.
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight — already-resolved gate (zero-Claude)
        id: preflight
        # PROCEED-SAFE: a gate failure must NEVER strand the issue. The script is total
        # (catches its own throws → emits already_resolved=false), but continue-on-error is
        # belt-and-suspenders: any infra fault (node/npm) leaves the output unset → the
        # downstream `already_resolved != 'true'` gates evaluate true → the normal fixer
        # runs unchanged. The only way the Claude steps are skipped is an EXPLICIT
        # `already_resolved=true` (a strong, deterministic match), never an error.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix per escalation #1647 (`fix-outcome:already-fixed` 10×/14d).
        # Prima di spendere un run Claude, controlla deterministicamente se questa
        # follow-up è già stata risolta su main da una PR successiva senza `Closes #N`
        # (done-but-open): se un token DISTINTIVO della regione `Suggested action`
        # è già presente VERBATIM nel file citato → short-circuit. Lo script rimuove
        # `agent:fix`, posta commento + marker `FIX_OUTCOME: already-fixed`, ed emette
        # `already_resolved=true`. CONSERVATIVO (bias a procedere): solo follow-up
        # singole non-in-flight con match forte; aggregate/ambiguo/nessun match →
        # `already_resolved=false` e il fixer normale gira invariato. Matcher condiviso
        # con reconcile-followups.mjs (followup-resolution-match.mjs, no drift).
        run: node scripts/ci/check-issue-already-resolved.mjs

      - name: Determine fix tier
        id: tier
        if: steps.preflight.outputs.already_resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Tier high (claude-sonnet-5, max-turns alti): issue funnel-critical — crawler/parser/
        # build-plugin/workflow CI/test gate, o uno script che MUTA/emette dati
        # indicizzati (backfill/migrate/assemble/sitemap/canonical/slug/
        # structured-data/seo). Bug lì = rischio propagato su ogni merge → probing
        # rigoroso paga. Tier normal (claude-sonnet-4-6) per il resto. Mirror ESATTO di
        # pr-review-loop: il bare `scripts/` NON escala più (mandava ogni menzione
        # di script — inclusi helper `scripts/{ci,dev,evals}/` e audit/report
        # read-only — a opus@40; osservato 2026-06-04 come tier-breadth waste). Gli
        # script funnel restano high via i loro keyword semantici/path index-muting.
        #
        # Terza clausola (2026-07-06): analisi storica FIX_OUTCOME 5 settimane ha
        # mostrato max-turns in crescita costante (0%→24.5% W23→W27), dominato da
        # follow-up SEO/audit/validate-dist con titolo tipo `fix(seo-404): ...` /
        # `fix(seo-audit): ...` / `audit-dist-multi.mjs: ...` — NON matchano la
        # prima clausola (niente crawler/parser/build-plugin/workflows/test
        # gate/validator/migrator letterale) né la seconda (niente prefisso
        # `scripts/` nel titolo) → finiscono tier=normal (40 turni) nonostante
        # tocchino routing/locale/gate logic intricata quanto un crawler. Caso
        # concreto: #3481 "1 item deferred — fix(seo-404): case-insensitive
        # locale-prefix detection in inferLocale()" — già ridotto al singolo item
        # dal circuit-breaker aggregate, comunque max-turns. Aggiunta mirata
        # (seo-/audit-dist/validate-dist), non un bare `seo`/`audit` generico —
        # stesso principio anti-tier-breadth-waste della nota sopra.
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels --jq '.title + "\n" + .body + "\n" + (.labels[].name)')
          if echo "$body" | grep -qiE 'crawler|parser|build-plugin|\.github/workflows/|test gate|validator|migrator' \
             || echo "$body" | grep -qiE 'scripts/[a-z0-9_./-]*(backfill|migrate|assemble|sitemap|canonical|slug|structured-data|seo|index)' \
             || echo "$body" | grep -qiE 'seo-[a-z0-9]|audit-dist|validate-dist'; then
            echo "tier=high" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
            # 40->50 (misurato 06-12): 44 run/7gg morti error_max_turns a
            # num_turns=41 (es. run 27386343034) = run opus intera bruciata,
            # 0 PR, issue ri-accodata -> retry = doppio burn. Il cap esiste
            # anti-runaway, non come budget di lavoro: tenerlo sopra il p99
            # osservato dei run sani.
            echo "max_turns=50" >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            # 30->40 (misurato 2026-06-12 post-#1919): 3 run tier=normal morti
            # error_max_turns al cap nella sola finestra 06:00-07:30Z (run
            # 27397873962/27399888568/27400421268, follow-up #1918/#1931) —
            # il bump #1919 copriva solo il tier high (40->50); il campione
            # 7gg aveva mostrato solo morti opus (bias). Stessa regola: cap
            # anti-runaway sopra il p99 dei run sani, non budget di lavoro.
            echo "max_turns=40" >> "$GITHUB_OUTPUT"
          fi
          echo "Fix tier: $(grep tier= "$GITHUB_OUTPUT" | head -1)"
          # Aggregate detection (deterministic, da titolo "N item deferred", N>=2).
          # Il parsing dei singoli item dal body è freeform/fragile → ci basiamo
          # sul COUNT nel titolo (affidabile) per attivare il circuit-breaker
          # one-item nel prompt (R3-A): il prompt-only R2-A non sempre teneva
          # (#1172 error_max_turns post-merge). is_aggregate guida l'istruzione
          # forte "fixa 1 item poi STOP".
          # `items?` (not just `item`): il titolo è LLM-generated dal template
          # FOLLOWUP.md; per N>=2 il fraseggio naturale è il plurale "2 items
          # deferred". Senza la `s?` opzionale il match fallisce → is_aggregate
          # falso negativo → circuit-breaker one-item no-op → error_max_turns su
          # aggregate (#1172-class, ~2M token). Cfr. #1201 item 1.
          N=$(printf '%s' "$body" | grep -oiE '[0-9]+ items? deferred' | head -1 | grep -oE '^[0-9]+' || true)
          # Fallback SWEEP/BATCH (2026-06-14): le issue "sweep" multi-target NON
          # usano il fraseggio "N items deferred" del template FOLLOWUP.md →
          # is_aggregate=false → circuit-breaker one-item MUTO → il fixer tenta
          # tutti i target e muore error_max_turns ANCHE a cap 50 (osservato
          # #1826 "Sweep: ~30 ... crawlers": 7 run bruciati, fu-attempt:2). Una
          # sweep e' multi-item by-definition: la cura e' decomposizione (fixa 1,
          # deferisci il resto), non un cap piu' alto. Cattura la keyword
          # sweep|batch|bulk + un conteggio ~?N di target plurali tipici; senza
          # conteggio leggibile tratta come aggregate minimo (N=2). I target-noun
          # sono ancorati (no match su "30 seconds"/"0 jobs" → niente falsi
          # positivi su issue single, verificato sui titoli reali del backlog).
          if [ -z "${N:-}" ] && printf '%s' "$body" | grep -qiE '\b(sweep|batch|bulk)\b'; then
            N=$(printf '%s' "$body" | grep -oiE '~?[0-9]+ +([a-z*-]+ +)?(crawler|file|page|parser|script|adapter|component|endpoint|workflow|job|company|landing)s?' | head -1 | grep -oE '[0-9]+' | head -1 || true)
            N=${N:-2}
          fi
          if [ "${N:-0}" -ge 2 ] 2>/dev/null; then
            echo "is_aggregate=true" >> "$GITHUB_OUTPUT"
            echo "agg_count=${N}" >> "$GITHUB_OUTPUT"
          else
            echo "is_aggregate=false" >> "$GITHUB_OUTPUT"
            echo "agg_count=0" >> "$GITHUB_OUTPUT"
          fi
          echo "Aggregate: is_aggregate=$(grep is_aggregate= "$GITHUB_OUTPUT" | tail -1)"

      - name: Configure git identity
        if: steps.preflight.outputs.already_resolved != 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      - name: Setup Headroom compression proxy
        if: steps.preflight.outputs.already_resolved != 'true'
        uses: ./.github/actions/setup-headroom

      - name: Run Claude fix
        id: claude_review
        if: steps.preflight.outputs.already_resolved != 'true'
        # Non far fallire il job sull'exit non-zero della CLI: lo step finale
        # `Classify outcome` decide il colore in base al LAVORO reale (PR aperta
        # per la issue), non al subtype della CLI. Un `error_max_turns` DOPO che
        # l'agent ha gia' aperto la PR (passo 7) NON e' un fallimento del run:
        # campione 7gg (#1951) = 4/11 fail issue-fix avevano una PR creata (3
        # gia' MERGED) ma la CLI moriva al cap turni DOPO `gh pr create` → job
        # RED = false-failure che gonfia il failure-rate del loop-health. Stessa
        # filosofia di #2514 (redflag-fixer): colore = work-done, non CLI exit.
        # I fail genuini (nessuna PR) restano RED via il classify → segnale
        # preservato per loop-health + followup-drainer. `outcome` resta
        # 'failure' (pre-continue-on-error) → i due step di telemetria sotto
        # (Mark error_max_turns / FIX_OUTCOME backstop) continuano a firare.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          FIX_TIER: ${{ steps.tier.outputs.tier }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Whitelist esplicita (hardening #898): mai `*`. I sender bot legittimi
          # del trigger sono `claude[bot]` (cascade fix → re-trigger) e
          # `github-actions[bot]` (re-label interno). Il PAT user `valerielinc-ops`
          # è un account umano → bypassa `allowed_bots`, già coperto dal gate `if`.
          allowed_bots: 'github-actions[bot], claude[bot], frontaliere-automation[bot]'
          # 2026-07-02: --dangerously-skip-permissions sostituisce --allowedTools scoped
          # (rationale completo: post-merge-followup.yml claude_args comment, stesso
          # fix, evita drift tra copie duplicate).
          claude_args: "--max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --dangerously-skip-permissions"
          prompt: |
            Sei l'agent di fix autonomo per la issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Bootstrap (in quest'ordine):**
            1. Leggi `ISSUES.md` → "Fix flow" — contratto operativo del fixer.
            2. Leggi `AGENTS.md` — non-negotiables + Privacy + architettura. VINCOLANTE.
            3. Carica la issue: `gh issue view $ISSUE_NUMBER --json number,title,body,labels,comments`.

            **Pre-condizioni (abort se falliscono):**
            - Se esiste già una PR aperta che cita "#$ISSUE_NUMBER" (`gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number`) → posta commento "PR già in volo: #<n>, skip." e TERMINA. No doppioni.
            - **Overlap-file** (no race su lavoro in corso): estrai i path target dal body della issue (file citati in `## Suggested action` / `## Item` / blocchi codice). Per ogni PR aperta (`gh pr list --state open --json number,title`) confronta i suoi file (`gh pr diff <n> --name-only`) coi target: se una PR aperta **modifica già** uno dei file target → posta commento "File `<path>` già in volo nella PR #<n> (<title>) — skip per evitare conflitto/duplicazione; riaprire l'auto-fix dopo il merge se ancora pertinente." e TERMINA. Razionale: un'altra PR può riscrivere quel file rendendo il fix moot o conflittuale (es. #934 hardening vs #943 rewrite di `submit-indexnow-batch.yml`). Nel dubbio (issue non file-specifica) → procedi.
            - **Capability guard (valuta SUBITO, prima di implementare — risparmio token):** questo ambiente ha solo `GH_TOKEN` (GitHub App) che NON ha lo scope `workflows` e NON ha PAT/Firebase SA. Dai path target estratti dal body: se il fix richiederebbe di modificare file in `.github/workflows/**` → il `git push` fallirebbe sempre (push di workflow rifiutato senza scope `workflows`) → niente PR. Allora NON implementare: posta un commento col diff/azione proposta + "blocco scope `workflows`: serve PAT abilitato o mano umana" e TERMINA SUBITO. Lo stesso vale se il fix è puramente una repo-setting/branch-protection/admin-API (es. `gh api .../branches/main/protection` → 403) o richiede segreti non in CI: documenta e TERMINA senza implementare. Razionale: fare il fix completo per poi scoprire il blocco al push spreca ~1M token/run (vedi #983); il blocco è deterministico dallo scope, va rilevato a turno 1.

            - **Follow-up aggregata multi-item — is_aggregate=${{ steps.tier.outputs.is_aggregate }} (count=${{ steps.tier.outputs.agg_count }}):** se `is_aggregate=true` questa issue ha ${{ steps.tier.outputs.agg_count }} item distinti e tentarli TUTTI in un run sfora il turn budget → `error_max_turns` → 0 PR, ~2M token persi (osservato #1095/#1101/#1172). **REGOLA FERREA (circuit-breaker):** fixa **ESATTAMENTE UN item** poi FERMATI (per una issue *sweep/batch* "item" = UN singolo target/file: es. "~30 crawlers" → fixa 1 crawler, deferisci gli altri 29). Procedura: (a) capability guard **PER-ITEM** — salta gli item che toccano `.github/workflows/**`/admin/secret (NON abortire l'intera issue), (b) scegli il PRIMO item in-capability a massimo valore funnel, (c) implementa SOLO quello, (d) **appena la PR per quell'unico item è aperta → STOP IMMEDIATO, non iniziare un secondo item** (anche se hai turni residui), (e) elenca tutti gli altri item in `## Non implementato` (motivo `follow-up`/`blocked`) → `post-merge-followup` li ri-accoda come nuova follow-up (re-queue esistente; ogni ciclo chiude ≥1 item → converge). Se `is_aggregate=false`: issue singola, comportamento invariato (capability guard whole-issue come sopra). Razionale: il budget di turni basta per 1 item con margine; 2+ item lo bruciano.

            **Fix flow (vedi ISSUES.md):**
            1. Branch isolato: `git checkout -b fix/issue-$ISSUE_NUMBER`.
            2. Diagnosi root cause della issue (NON sintomo). Per categoria `crawler`: il selector è driftato → rigenera/aggiusta il parser; preferisci `node scripts/generate-company-parser.mjs` o l'edit mirato del parser/config citato nel body.
            3. Applica fix CHIRURGICO alla **CLASSE del bug, NON al singolo file** (AGENTS.md non-negotiable #6): no drive-by refactor / no speculative abstraction, MA per un fix di pattern (regex/replace/guard/floor/threshold/selector/bullet-idiom) `rg`/`grep` i sibling funnel-critical (`scripts/update-*.mjs`, `scripts/lib/*-parser.mjs`, `build-plugins/**`) per lo STESSO costrutto → sweepa l'intera classe nella STESSA PR, oppure giustifica OGNI sibling non toccato in `## Non implementato`. Toccare i file gemelli con lo stesso antipattern NON è drive-by: è il fix completo. Pre-empt del 🔴 reviewer "stesso antipattern nel file gemello" (osservato #1083/#1073 il 2026-06-02: PR mono-file → 🔴 sibling → 2 cicli review+fix sprecati sulla quota Max condivisa).
            4. Mai abbassare quality gate/test/validation per "far passare" (non-negotiable #1).
            5. **Gate test pre-PR (anti re-review — OBBLIGATORIO):** prima di committare/aprire la PR, gira i test che coprono l'area che hai toccato: `npx vitest run <path/glob pertinente al code modificato>` (es. fix a un parser → `npx vitest run tests/<area>`). Verde → procedi; rosso introdotto da te → fixa la root cause e ri-gira fino a verde. NON girare la suite intera col `npm test` cieco: qui manca `data/jobs.json` (lo assembla la CI `tests`) → sarebbe rossa per infra, non per il tuo fix; se il tuo cambiamento tocca l'assembly dati gira prima `node scripts/assemble-jobs-dataset.mjs`. **Perché:** la review Claude ora parte SOLO dopo `tests` verde (gate `pr-review-loop` su `workflow_run[tests]==success`). Una PR coi test rossi NON riceve review e resta ferma — e tu sei già terminato → spreco di un ciclo. Test d'area verdi = la suite CI passa al primo colpo e la review parte subito.
            6. Commit con identity canonica già configurata. Messaggio conventional, in fondo nessuna email non-canonica.
            7. Push del branch: `git push -u origin fix/issue-$ISSUE_NUMBER`.
            8. Apri PR con `gh pr create`. Body OBBLIGATORIO (REVIEW.md completeness contract):
               ```
               ## Implementato
               - <cosa fa il fix>
               Closes #$ISSUE_NUMBER

               ## Non implementato (ancora)
               - <scope NON fatto + motivo: out of scope / follow-up / blocked / posposto>
               ```
            9. La PR entra automaticamente in `pr-review-loop` → review → `## LGTM` → `auto-merge-on-lgtm`. NON mergiare a mano.

            **Constraint:**
            - Changes chirurgiche, root-cause, una issue alla volta.
            - Mai toccare file fuori scope della issue — **eccetto i sibling della STESSA classe del bug** (#6, passo 3): quelli SONO in scope e vanno sweepati nella stessa PR. "Fuori scope" = un'altra feature/area, NON un file gemello con lo stesso antipattern (es. fixare il bullet-idiom in 1 parser e lasciarlo rotto negli altri 16 = fix incompleto, non "rispetto dello scope").
            - **CODE vs DATA — no scroll dei blob (ISSUES.md → "CODE vs DATA", mirror #1096 del reviewer):** i file rigenerati `data/**` (job JSON, snapshot, translation-cache, blog-articles), `public/**` (asset), `reports/**`, `_newsletter_variants/**` NON sono code da leggere riga-per-riga. Se la root cause è un drift di output dati → fixa il CODE che li genera (parser/crawler/build-plugin), non `cat`/scorrere il blob né editarlo a mano. Campione → `Read` mirato (offset/limit). `rg`/`grep` scopati al code: `rg <pattern> scripts build-plugins components services -g '!data/**' -g '!public/**' -g '!reports/**'` — cercare nei blob dati = token bruciati. Eccezione: un `data/**` config/fixture checked-in editato a mano dal fix.
            - Mai disabilitare AdSense Auto Ads (non-negotiable #7).
            - Mai committare path home assoluti o email personali (Privacy).
            - Se la root cause non è determinabile con confidenza → NON forzare un fix; posta su issue "Root cause non determinata: <cosa hai trovato>. Serve indagine umana." rimuovi nulla e TERMINA senza PR.
            - Se il fix richiede credenziali/segreti non disponibili in CI → documenta in commento e TERMINA senza PR.
            - **Telemetria outcome (OBBLIGATORIO):** ogni volta che termini, l'ULTIMO commento che posti sulla issue DEVE iniziare con un marker HTML su riga propria: `<!-- FIX_OUTCOME: <code> -->`. `<code>` ∈ `pr-created` (PR aperta) · `blocked-workflows-scope` · `blocked-secrets` · `blocked-admin-settings` · `no-root-cause` · `overlap-skip` · `pr-already-open` · `already-fixed` · `revenue-tracker-manual`. Se apri una PR (passo 7) e non posti altri commenti, aggiungi comunque un commento col solo marker `<!-- FIX_OUTCOME: pr-created -->`. Il lessons-harvester aggrega questi marker per rilevare classi di blocco ricorrenti e proporre migliorie ai doc/prompt (vedi ISSUES.md → "Auto-improvement loop").

      - name: Claude usage metrics
        # Skip when the pre-flight short-circuited (Claude never ran → no execution file).
        if: always() && steps.preflight.outputs.already_resolved != 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "issue-fix"

      - name: Mark error_max_turns (granular telemetry, pre-backstop)
        # Quando la run Claude muore `error_max_turns` (turn budget esaurito) NON
        # lascia un marker FIX_OUTCOME del fixer → il backstop sotto posta un
        # generico `no-pr-unspecified` che il drainer IGNORA (BACKSTOP_MARKER) →
        # l'item viene trattato come orfano ri-tentabile e ri-accodato fino a
        # MAX_ATTEMPTS, bruciando ~3 run del tier high (claude-sonnet-5) su un item
        # che esaurisce il budget
        # in modo DETERMINISTICO (ri-tentarlo lo riproduce). Questo step rileva
        # SPECIFICAMENTE il subtype `error_max_turns` dall'execution file e posta
        # un marker granulare `max-turns` (senza BACKSTOP_MARKER → il drainer lo
        # VEDE) così il drainer può parkare dopo 2 occorrenze (vedi
        # followup-drainer.mjs). Subtype-gated: i fail transienti (altro subtype)
        # NON ricevono il marker → restano ri-tentabili (nessuna falsa
        # escalation). Gira PRIMA del backstop così quest'ultimo trova il marker
        # e si salta. Best-effort, mai fa fallire il job.
        if: always() && steps.claude_review.outcome == 'failure' && steps.preflight.outputs.already_resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          EXEC_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then echo "no execution file → skip"; exit 0; fi
          SUBTYPE=$(node -e "
            const fs=require('fs');
            try {
              const raw=fs.readFileSync(process.env.EXEC_FILE,'utf8').trim();
              let msgs;
              try { msgs=JSON.parse(raw); } catch { msgs=raw.split(/\r?\n/).filter(Boolean).map((l)=>{try{return JSON.parse(l);}catch{return null;}}).filter(Boolean); }
              if (!Array.isArray(msgs)) msgs=[msgs];
              const r=[...msgs].reverse().find((m)=>m&&m.type==='result');
              process.stdout.write(String((r&&r.subtype)||''));
            } catch { process.stdout.write(''); }
          " 2>/dev/null || true)
          echo "claude result subtype: '${SUBTYPE:-<none>}'"
          if [ "$SUBTYPE" = "error_max_turns" ]; then
            # Marker granulare SENZA la stringa BACKSTOP_MARKER ('post-step
            # deterministico') → latestFixOutcomeFromComments del drainer lo legge.
            gh issue comment "$ISSUE" --body "$(printf '<!-- FIX_OUTCOME: max-turns -->\n_Run terminata error_max_turns (turn budget esaurito) — telemetria granulare per il drainer._')" || true
          fi

      - name: Emit FIX_OUTCOME telemetry (deterministic backstop)
        # Skip on short-circuit: the pre-flight gate already posted the granular
        # `<!-- FIX_OUTCOME: already-fixed -->` marker; this coarse backstop would
        # otherwise post `no-pr-unspecified` and poison the lessons-harvester signal.
        if: always() && steps.preflight.outputs.already_resolved != 'true'
        # The agent SHOULD post a granular `<!-- FIX_OUTCOME: <code> -->` marker,
        # but prompt-emitted markers are unreliable (observed: #974 ran with the
        # marker prompt on main yet posted none). This backstop guarantees the
        # lessons-harvester always has a queryable marker: pr-created if this run
        # opened a PR on fix/issue-<N>, else a coarse no-pr-unspecified. It never
        # overwrites the agent's own granular marker. Best-effort: never fails.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          HAS=$(gh issue view "$ISSUE" --json comments --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          if [ "${HAS:-0}" != "0" ]; then
            echo "FIX_OUTCOME marker already present (agent-posted) — no backstop needed."
            exit 0
          fi
          PR=$(gh pr list --head "fix/issue-$ISSUE" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then OUT=pr-created; else OUT=no-pr-unspecified; fi
          echo "FIX_OUTCOME issue=$ISSUE outcome=$OUT (deterministic backstop)"
          gh issue comment "$ISSUE" --body "$(printf '<!-- FIX_OUTCOME: %s -->\n_Outcome rilevato dal post-step deterministico (telemetria lessons-harvester)._' "$OUT")" || true

      # Colore del job = LAVORO reale del run, non l'exit della CLI Claude.
      #  • PR aperta o gia' MERGED per la issue (`fix/issue-<N>`)  → run SUCCESS
      #    (la PR e' in pr-review-loop / gia' mergiata). Vale ANCHE se la CLI e'
      #    morta `error_max_turns` DOPO `gh pr create` (false-failure: #1951 = 4/11
      #    fail avevano una PR, 3 gia' MERGED).
      #  • nessuna PR + CLI FAILED  → non-delivery reale (budget esaurito senza PR,
      #    oppure branch pushato ma PR mai aperta) → RED (segnale preservato per
      #    loop-health-report + followup-drainer). NON mascherato: il run non ha
      #    consegnato una PR.
      #  • nessuna PR + CLI SUCCESS → terminale pulito (capability-guard / overlap
      #    / already-fixed / no-root-cause: l'agent ha deciso di NON aprire PR) →
      #    GREEN, comportamento invariato vs oggi.
      # I fail infra a monte (npm ci, setup, pre-flight) restano RED da soli:
      # quegli step non hanno continue-on-error. Nessun gate abbassato: la PR
      # passa comunque dal reviewer (cfr. #2514 / #2288 — disambigua intenzionale
      # vs crash, colore != gate).
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.preflight.outputs.already_resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CLAUDE_OUTCOME: ${{ steps.claude_review.outcome }}
        run: |
          set -uo pipefail
          # PR aperta o gia' mergiata sul branch di questa issue (head esatto).
          PR_STATE=$(gh pr list --head "fix/issue-$ISSUE" --state all --json number,state \
            --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | .[0].number // empty' 2>/dev/null || true)
          echo "issue=$ISSUE pr(head fix/issue-$ISSUE, open|merged)=${PR_STATE:-<none>} claude=$CLAUDE_OUTCOME"
          if [ -n "${PR_STATE:-}" ]; then
            echo "✓ PR #$PR_STATE esiste (open/merged) per la issue → run SUCCESS. Job verde anche se la CLI e' uscita '$CLAUDE_OUTCOME' (false-failure: lavoro consegnato)."
            exit 0
          fi
          if [ "$CLAUDE_OUTCOME" = "failure" ]; then
            echo "::error::issue-fix #$ISSUE: nessuna PR aperta/mergiata e la CLI e' fallita ('$CLAUDE_OUTCOME') → non-delivery reale. Job RED (segnale preservato per loop-health + drainer)."
            exit 1
          fi
          echo "Nessuna PR ma la CLI e' uscita pulita ('$CLAUDE_OUTCOME') → terminale legittimo (blocked/already-fixed/no-root-cause). Job verde."
