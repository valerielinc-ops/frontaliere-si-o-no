name: Issue fix (Claude → PR)

on:
  issues:
    types: [labeled]

# Serializza i fixer: un agent alla volta evita N PR concorrenti sullo stesso
# data file (crawler config) + rispetta il cap OOM (max parallel agent).
#
# ATTENZIONE — questa NON è una coda (#5514). `cancel-in-progress: false`
# protegge la run IN CORSO, non le pending: GitHub tiene **una sola** run pending
# per gruppo, e ogni nuova pending SFRATTA (`cancelled`) la precedente. La
# profondità della coda è 1, non N. Due `agent:fix` applicati a due issue nello
# stesso minuto producono quindi una run lavorata e una cancellata prima di
# partire — e poiché `on: issues:[labeled]` è one-shot, l'evento della run
# sfrattata è consumato: la label resta sulla issue e NIENTE la ri-arma.
# Misurato: 13 run `cancelled` su 100; il 2026-08-08 alle 09:02 cinque
# `[crawler-health]` etichettate insieme → 1 riuscita, 4 issue ferme due giorni
# (#5392 #5393 #5394 #5395). Il commento che stava qui prima diceva l'opposto
# («le issue in coda vengono processate appena lo slot si libera») ed è ciò che
# rendeva il difetto invisibile a chi leggeva il workflow.
#
# Chi garantisce davvero che una sola pending esista alla volta sta FUORI da
# questo file: `scripts/ci/followup-drainer.mjs` promuove UNA issue a `agent:fix`
# per tick e solo a slot libero, e `scripts/ci/triage-sweep.mjs` applica al più
# un `agent:fix` diretto per run (`crawlerDirectFixBudget`). Se aggiungi un altro
# punto che applica `agent:fix`, deve rispettare la stessa regola o reintroduce
# gli sfratti.
concurrency:
  group: issue-fix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    # Gate (tutti necessari):
    # - L'evento è l'aggiunta della label `agent:fix` (opt-in esplicito, mai
    #   trigger su qualunque label). Solo collaborator/owner possono labellare,
    #   quindi la label È il consenso umano.
    # - sender == owner: belt-and-suspenders contro label aggiunte da automation
    #   esterne / bot non fidati.
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    if: |
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'valerielinc-ops' ||
       github.event.sender.login == 'frontaliere-automation[bot]' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    # 40→360 (2026-07-17, #4341): 40min ha già ricausato ci-timeout 2x (#4189,
    # #4219) dopo il bump 30→40 — stesso costrutto di pr-review-loop.yml, stesso
    # fix: portato al vero max runner-hosted (360) per non uccidere più a metà
    # turno lavoro Claude già fatto. Costo: minuti effettivi usati, non il tetto.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Blobless clone (#4189): con fetch-depth:0 il checkout scaricava TUTTI
          # i blob storici di questo repo data-heavy, consumando l'intero budget
          # job da 30min → "Run Claude fix" non partiva mai. `filter: blob:none`
          # prende il commit-graph completo + il working tree di HEAD ma salta i
          # blob storici (fetch on-demand se mai servono): checkout da ~minuti a
          # ~secondi, HEAD materializzato identico → il fixer lavora invariato.
          filter: blob:none
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Ha gia' blob:none (#4189) e i numeri lo confermano: Checkout 129-262s su
        # 4 run, max = 1% di un cap da 360min. Nessun altro cambio, solo il tetto.
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Conia il token della GitHub App PRIMA di ogni gate che ne dipende.
      #
      # Perché serve qui: `secrets.GITHUB_TOKEN` non ha — e non può avere — lo scope
      # `workflows`, quindi ogni fix che tocchi `.github/workflows/**` falliva sempre al
      # push. Era il blocco più costoso del fixer (~1M token per run prima che tre guardie
      # lo rilevassero in anticipo, escalation #3887). Alla App `frontaliere-automation` è
      # stato concesso `workflows: write` il 2026-08-06; questo step è la metà mancante,
      # senza la quale il permesso non cambiava nulla.
      #
      # Zero-dep (solo node:crypto + fetch), quindi gira prima di `npm ci` come gli altri
      # pre-flight. Su credenziali mancanti/non valide: warn + exit 0 SENZA scrivere
      # APP_TOKEN, e ogni consumatore qui sotto ricade sul comportamento precedente.
      #
      # Lo step scrive DUE variabili in $GITHUB_ENV, e la distinzione è il fix di #5288:
      #   APP_TOKEN            → il token esiste (identità di push/dispatch della App)
      #   APP_TOKEN_WORKFLOWS  → `permissions.workflows == 'write'` LETTO dalla risposta API
      # Sono cose diverse. Il conio riesce (201, token valido) anche quando il permesso
      # `workflows` è stato richiesto ma mai approvato sull'installazione: il permesso
      # semplicemente non compare fra i `permissions`. Chi ha bisogno della CAPACITÀ deve
      # quindi gatare su APP_TOKEN_WORKFLOWS, mai sulla presenza del token.
      - name: Mint GitHub App token (zero-Claude, pre-npm)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # PRIMA di `npm ci`: quando la quota è esaurita questo gate chiude il job
      # in ~15s invece che dopo ~3min di install. Lo script usa solo builtin Node
      # + `gh` (nessuna dipendenza da node_modules), esattamente come gli altri
      # pre-flight, quindi può girare qui senza vincoli d'ordine.
      - name: Pre-flight — quota backoff gate (zero-Claude, pre-npm)
        id: quota
        # PROCEED-SAFE, stesso contratto degli altri pre-flight: lo script è
        # totale (cattura i propri throw → quota_blocked=false) e
        # continue-on-error è belt-and-suspenders — un guasto infra lascia
        # l'output non impostato → i gate a valle valutano true → il fixer gira
        # invariato. L'unico modo per saltare Claude è un `quota_blocked=true`
        # ESPLICITO (beacon con scadenza futura), mai un errore.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix per l'escalation misurata sul tracker #1951 (failure-rate
        # issue-fix acceso da ≥7 report settimanali consecutivi). Scaricando i log
        # di TUTTE e 61 le run fallite della finestra 7gg (2026-07-29 → 08-05):
        # 60 sono HTTP 429 (quota Max settimanale esaurita) con num_turns=1 e
        # $0 di costo — Claude non ha MAI eseguito — 1 è un 529 transiente, e
        # ZERO sono error_max_turns / push falliti / timeout. Di quelle 61, **49
        # (80%) sono cadute dentro una finestra di rate-limit già aperta da un
        # fallimento precedente**: deterministicamente prevedibili, perché il
        # payload del 429 dichiara `resetsAt`. Questo gate legge il beacon
        # `<!-- QUOTA_RESETS_AT: … -->` lasciato dalla run precedente sulle issue
        # in coda e, se la finestra è ancora aperta, ri-accoda questa issue SENZA
        # consumare un tentativo e salta ogni step Claude. Rationale completo e
        # catena assorbente (429 → park → age-out close) in
        # scripts/ci/claude-rate-limit.mjs.
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Install dependencies
        if: steps.quota.outputs.quota_blocked != 'true'
        run: npm ci

      - name: Pre-flight — already-resolved gate (zero-Claude)
        id: preflight
        if: steps.quota.outputs.quota_blocked != 'true'
        # PROCEED-SAFE: a gate failure must NEVER strand the issue. The script is total
        # (catches its own throws → emits already_resolved=false), but continue-on-error is
        # belt-and-suspenders: any infra fault (node/npm) leaves the output unset → the
        # downstream `already_resolved != 'true'` gates evaluate true → the normal fixer
        # runs unchanged. The only way the Claude steps are skipped is an EXPLICIT
        # `already_resolved=true` (a strong, deterministic match), never an error.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix per escalation #1647 (`fix-outcome:already-fixed` 10×/14d).
        # Prima di spendere un run Claude, controlla deterministicamente se questa
        # follow-up è già stata risolta su main da una PR successiva senza `Closes #N`
        # (done-but-open): se un token DISTINTIVO della regione `Suggested action`
        # è già presente VERBATIM nel file citato → short-circuit. Lo script rimuove
        # `agent:fix`, posta commento + marker `FIX_OUTCOME: already-fixed`, ed emette
        # `already_resolved=true`. CONSERVATIVO (bias a procedere): solo follow-up
        # singole non-in-flight con match forte; aggregate/ambiguo/nessun match →
        # `already_resolved=false` e il fixer normale gira invariato. Matcher condiviso
        # con reconcile-followups.mjs (followup-resolution-match.mjs, no drift).
        run: node scripts/ci/check-issue-already-resolved.mjs

      - name: Pre-flight — workflows-scope capability guard (zero-Claude)
        id: scope_guard
        # CONDIZIONATO alla CAPACITÀ del token, non alla sua presenza (#5288, 2026-08-08).
        # Con `workflows: write` davvero concesso il fixer HA lo scope e bloccarlo a priori
        # gli toglierebbe una capacità che possiede; senza — credenziali App assenti,
        # ruotate, revocate, oppure permesso richiesto ma mai approvato sull'installazione —
        # siamo esattamente nello stato per cui il guard è stato costruito, e continua a
        # fare il suo lavoro.
        #
        # La versione precedente gatava su `env.APP_TOKEN == ''`, cioè sulla PRESENZA del
        # token. Non è la stessa cosa: il conio restituisce 201 e un token perfettamente
        # valido anche quando `workflows` non è fra i permessi concessi. In quello stato il
        # guard veniva saltato, il prompt qui sotto dichiarava all'agente «hai lo scope
        # workflows, procedi», l'agente implementava tutto, e il rifiuto arrivava solo alla
        # fine, al `git push` («refusing to allow a GitHub App to create or update workflow
        # … without `workflows` permission», #5280 2026-08-07). Il fallimento era migrato
        # dal turno 1 a dopo l'implementazione: da 0 token a ~1M token per run, cioè
        # esattamente la spesa che l'escalation #3887 aveva eliminato.
        #
        # Disattivare il guard del tutto sarebbe stato l'errore: il fallimento del conio è
        # silenzioso per progetto (`mint-app-token.mjs` esce 0), quindi un guard rimosso
        # avrebbe fatto tornare il fixer a spendere ~1M token per run per poi fallire al
        # push, senza che niente lo segnalasse. Legare le due cose rende il degrado
        # automatico invece che affidato a chi se ne ricorda.
        #
        # FAIL-CLOSED: `mint-app-token.mjs` scrive APP_TOKEN_WORKFLOWS su OGNI cammino di
        # uscita, e una variabile non scritta è comunque `!= 'true'` → il guard gira. Non
        # esiste un modo di arrivare a «capacità concessa» senza che l'API l'abbia detto.
        if: env.APP_TOKEN_WORKFLOWS != 'true' && steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true'
        # PROCEED-SAFE, same contract as `preflight` above: the script is total (catches
        # its own throws → emits workflows_blocked=false), continue-on-error is
        # belt-and-suspenders so an infra fault never strands the issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix for escalation #4227 (`fix-outcome:blocked-workflows-scope`
        # 12×/14d — #4140 #4160 #4189 #4244 #4256 #4266 #4284 #4322 #4365 #4370 #4375 and
        # more). scripts/ci/check-workflows-scope.mjs was built for a prior escalation
        # (#3887) but never actually wired in — this step closes that gap. Two modes:
        #   1. Issue body explicitly cites a `.github/workflows/**` path → block, zero
        #      implementation tokens wasted.
        #   2. Issue is a `scan-job-timeouts.mjs` auto-file (label `ci-timeout`) whose
        #      title EXACTLY matches a PRIOR issue that already carries a
        #      `<!-- FIX_OUTCOME: blocked-workflows-scope -->` marker → block, zero
        #      DIAGNOSIS tokens wasted re-deriving a root cause already found (verified
        #      live: "CI Failure: Refresh thin-page promotions" recurred across 8+
        #      distinct issue numbers in one week, each independently re-diagnosing the
        #      identical checkout-timeout root cause). See that script's docstring for
        #      the full rationale/evidence and the PROCEED-SAFE bias (bare title match
        #      only, no marker → proceeds, normal fixer runs unchanged).
        run: node scripts/ci/check-workflows-scope.mjs

      - name: Pre-flight — in-progress claim gate (zero-Claude, mutex)
        id: claim
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true'
        # PROCEED-SAFE, same contract as `preflight`/`scope_guard` above: the script is
        # total (catches its own throws → emits in_flight=false), continue-on-error is
        # belt-and-suspenders so an infra fault never strands the issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix per #4788/#4793: due sessioni (una interattiva locale, una questo
        # fixer autonomo) hanno lavorato la STESSA issue in parallelo → due PR competitive,
        # merge in conflitto. L'unica difesa esistente era un controllo prompt-level DENTRO
        # lo step Claude ("cerca una PR già aperta") — valutato dopo tier/checkout, e cieco a
        # un lavoro iniziato ma non ancora aperto in PR (esattamente il caso #4793, creata
        # prima che l'altra sessione, più lenta perché includeva root-cause+test, avesse
        # nulla da mostrare). Questo step reclama deterministicamente la label
        # `agent:in-progress` PRIMA di ogni lavoro (tier compreso): se è già presente, un'altra
        # sessione l'ha presa per prima → skip totale, zero quota Max OAuth. Simmetrico alla
        # convenzione lato locale (`/fix-issue`, ISSUES.md "Fix flow"): chi reclama prima
        # vince, l'altro vede la label e si ferma prima di spendere turni.
        run: node scripts/ci/claim-issue-in-flight.mjs

      - name: Determine fix tier
        id: tier
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Tier high (claude-sonnet-5, max-turns alti): issue funnel-critical — crawler/parser/
        # build-plugin/workflow CI/test gate, o uno script che MUTA/emette dati
        # indicizzati (backfill/migrate/assemble/sitemap/canonical/slug/
        # structured-data/seo). Bug lì = rischio propagato su ogni merge → probing
        # rigoroso paga. Tier normal per il resto (stesso modello claude-sonnet-5,
        # unificato owner 2026-07-17 — mai claude-sonnet-4-6; cambiano solo i turni). Mirror ESATTO di
        # pr-review-loop: il bare `scripts/` NON escala più (mandava ogni menzione
        # di script — inclusi helper `scripts/{ci,dev,evals}/` e audit/report
        # read-only — a opus@40; osservato 2026-06-04 come tier-breadth waste). Gli
        # script funnel restano high via i loro keyword semantici/path index-muting.
        #
        # Terza clausola (2026-07-06): analisi storica FIX_OUTCOME 5 settimane ha
        # mostrato max-turns in crescita costante (0%→24.5% W23→W27), dominato da
        # follow-up SEO/audit/validate-dist con titolo tipo `fix(seo-404): ...` /
        # `fix(seo-audit): ...` / `audit-dist-multi.mjs: ...` — NON matchano la
        # prima clausola (niente crawler/parser/build-plugin/workflows/test
        # gate/validator/migrator letterale) né la seconda (niente prefisso
        # `scripts/` nel titolo) → finiscono tier=normal (40 turni) nonostante
        # tocchino routing/locale/gate logic intricata quanto un crawler. Caso
        # concreto: #3481 "1 item deferred — fix(seo-404): case-insensitive
        # locale-prefix detection in inferLocale()" — già ridotto al singolo item
        # dal circuit-breaker aggregate, comunque max-turns. Aggiunta mirata
        # (seo-/audit-dist/validate-dist), non un bare `seo`/`audit` generico —
        # stesso principio anti-tier-breadth-waste della nota sopra.
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels --jq '.title + "\n" + .body + "\n" + (.labels[].name)')
          if echo "$body" | grep -qiE 'crawler|parser|build-plugin|\.github/workflows/|test gate|validator|migrator' \
             || echo "$body" | grep -qiE 'scripts/[a-z0-9_./-]*(backfill|migrate|assemble|sitemap|canonical|slug|structured-data|seo|index)' \
             || echo "$body" | grep -qiE 'seo-[a-z0-9]|audit-dist|validate-dist'; then
            echo "tier=high" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
            # 40->50 (misurato 06-12): 44 run/7gg morti error_max_turns a
            # num_turns=41 (es. run 27386343034) = run opus intera bruciata,
            # 0 PR, issue ri-accodata -> retry = doppio burn. Il cap esiste
            # anti-runaway, non come budget di lavoro: tenerlo sopra il p99
            # osservato dei run sani.
            # 50->70 (2026-07-17, owner): bump fleet-wide di tutti i cap Claude
            # dopo l'ennesimo error_max_turns (pr-review-loop tier high, run
            # 29556645538) — stessa regola: cap sopra il p99, mai budget.
            echo "max_turns=70" >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
            # 30->40 (misurato 2026-06-12 post-#1919): 3 run tier=normal morti
            # error_max_turns al cap nella sola finestra 06:00-07:30Z (run
            # 27397873962/27399888568/27400421268, follow-up #1918/#1931) —
            # il bump #1919 copriva solo il tier high (40->50); il campione
            # 7gg aveva mostrato solo morti opus (bias). Stessa regola: cap
            # anti-runaway sopra il p99 dei run sani, non budget di lavoro.
            # 40->55 (2026-07-17, owner): bump fleet-wide, vedi tier high sopra.
            echo "max_turns=55" >> "$GITHUB_OUTPUT"
          fi
          echo "Fix tier: $(grep tier= "$GITHUB_OUTPUT" | head -1)"
          # Aggregate detection (deterministic, da titolo "N item deferred", N>=2).
          # Il parsing dei singoli item dal body è freeform/fragile → ci basiamo
          # sul COUNT nel titolo (affidabile) per attivare il circuit-breaker
          # one-item nel prompt (R3-A): il prompt-only R2-A non sempre teneva
          # (#1172 error_max_turns post-merge). is_aggregate guida l'istruzione
          # forte "fixa 1 item poi STOP".
          # `items?` (not just `item`): il titolo è LLM-generated dal template
          # FOLLOWUP.md; per N>=2 il fraseggio naturale è il plurale "2 items
          # deferred". Senza la `s?` opzionale il match fallisce → is_aggregate
          # falso negativo → circuit-breaker one-item no-op → error_max_turns su
          # aggregate (#1172-class, ~2M token). Cfr. #1201 item 1.
          N=$(printf '%s' "$body" | grep -oiE '[0-9]+ items? deferred' | head -1 | grep -oE '^[0-9]+' || true)
          # Fallback SWEEP/BATCH (2026-06-14): le issue "sweep" multi-target NON
          # usano il fraseggio "N items deferred" del template FOLLOWUP.md →
          # is_aggregate=false → circuit-breaker one-item MUTO → il fixer tenta
          # tutti i target e muore error_max_turns ANCHE a cap 50 (osservato
          # #1826 "Sweep: ~30 ... crawlers": 7 run bruciati, fu-attempt:2). Una
          # sweep e' multi-item by-definition: la cura e' decomposizione (fixa 1,
          # deferisci il resto), non un cap piu' alto. Cattura la keyword
          # sweep|batch|bulk + un conteggio ~?N di target plurali tipici; senza
          # conteggio leggibile tratta come aggregate minimo (N=2). I target-noun
          # sono ancorati (no match su "30 seconds"/"0 jobs" → niente falsi
          # positivi su issue single, verificato sui titoli reali del backlog).
          if [ -z "${N:-}" ] && printf '%s' "$body" | grep -qiE '\b(sweep|batch|bulk)\b'; then
            N=$(printf '%s' "$body" | grep -oiE '~?[0-9]+ +([a-z*-]+ +)?(crawler|file|page|parser|script|adapter|component|endpoint|workflow|job|company|landing)s?' | head -1 | grep -oE '[0-9]+' | head -1 || true)
            N=${N:-2}
          fi
          if [ "${N:-0}" -ge 2 ] 2>/dev/null; then
            echo "is_aggregate=true" >> "$GITHUB_OUTPUT"
            echo "agg_count=${N}" >> "$GITHUB_OUTPUT"
          else
            echo "is_aggregate=false" >> "$GITHUB_OUTPUT"
            echo "agg_count=0" >> "$GITHUB_OUTPUT"
          fi
          echo "Aggregate: is_aggregate=$(grep is_aggregate= "$GITHUB_OUTPUT" | tail -1)"

      - name: Closing keyword for the PR body (zero-Claude)
        id: closing
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Il prompt scriveva `Closes #$ISSUE_NUMBER` INCONDIZIONATAMENTE. Su una
        # follow-up aggregata multi-item quella riga è esattamente ciò che
        # `pr-body-contract.yml` fallisce (blocco «Closes #N targeting a
        # multi-item follow-up aggregate»): la PR nasce ROSSA, e se passasse
        # chiuderebbe al merge un'aggregata con item ancora dovuti — mentre il
        # circuit-breaker qui sopra ne fa UNO per run. Successo reale due volte
        # il 2026-08-14: #5848 e #5862, entrambe corrette a mano dopo il rosso.
        #
        # Perché NON riusare `steps.tier.outputs.is_aggregate`: quel detector ha
        # un fallback sweep/batch con conteggio di target-noun che il gate non
        # ha, quindi i due possono dare risposte diverse sullo stesso input — ed
        # è la risposta del GATE che decide se la PR è rossa. Qui si chiama la
        # stessa `isAggregate()` che `pr-body-contract.yml` rispecchia, via
        # scripts/lib/pr-body-generator-contract.mjs. Generatore e giudice
        # condividono una sola definizione: non possono più litigare.
        #
        # Fail-open: qualunque errore → `Closes #N`, cioè il comportamento
        # precedente. Un'infrastruttura giù non deve trasformare una chiusura
        # legittima in una issue che resta aperta per sempre.
        run: |
          set -uo pipefail
          ref=$(gh issue view "$ISSUE_NUMBER" --json number,title,body,labels 2>/dev/null \
                | node scripts/lib/pr-body-generator-contract.mjs --closing-ref 2>/dev/null) || ref=""
          if [ -z "$ref" ]; then
            ref="Closes #${ISSUE_NUMBER}"
            echo "closing-ref: fallback → $ref"
          fi
          echo "closing_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Closing ref: $ref"

      - name: Check for resumable WIP branch (zero-Claude)
        id: resume
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Problem A (#4337, confermato via GitHub API + run log): prima di questo
        # fix commit+push+PR accadevano SOLO alla fine del flusso (dopo il gate
        # test) — se `--max-turns` si esauriva PRIMA, il container CI moriva e
        # NULLA veniva mai pushato: 71 turni, $6.58 spesi, edit reali a
        # `build-plugins/staticPagesPlugin.ts`, ma `fix/issue-4337` mai esistito
        # su GitHub (404). 100% del lavoro perso, retry costretto a ridiagnosticare
        # da zero senza sapere che un tentativo precedente era arrivato lì. Ora il
        # prompt fa un checkpoint WIP (commit+push) appena il fix è applicato,
        # PRIMA del gate test (vedi step 4 del prompt) — quindi un run morto dopo
        # quel punto lascia un branch `fix/issue-<N>` reale su origin. Questo step
        # lo rileva deterministicamente (zero token Claude) così il prompt (step 1)
        # sa se deve riprendere da lì invece di ricreare un branch fresh.
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          if git ls-remote --exit-code --heads origin "fix/issue-${ISSUE_NUMBER}" >/dev/null 2>&1; then
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "Branch fix/issue-${ISSUE_NUMBER} già presente su origin → resume da checkpoint WIP."
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "Nessun branch fix/issue-${ISSUE_NUMBER} su origin → fresh start."
          fi

      - name: Configure git identity
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          APP_TOKEN: ${{ env.APP_TOKEN }}
          APP_TOKEN_WORKFLOWS: ${{ env.APP_TOKEN_WORKFLOWS }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          # Instrada il push sul token della App, altrimenti il conio non serve a niente:
          # il `git push` che fa il fixer userebbe comunque la credenziale piazzata da
          # actions/checkout, cioè GITHUB_TOKEN, che lo scope `workflows` non ce l'ha.
          #
          # L'unset dell'extraheader NON è ridondante e non va tolto: actions/checkout
          # scrive `http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>`,
          # che ha la precedenza sullo `x-access-token:` nell'URL del remote — il push
          # tornerebbe silenziosamente al token sbagliato. È la trappola già documentata
          # in pr-redflag-fixer.yml, stessa causa, stesso rimedio.
          #
          # L'identità di push resta la App ogni volta che il token esiste: serve a far
          # ri-triggerare i workflow a valle (`<app>[bot]` ≠ `github-actions[bot]`), ed è
          # utile anche senza scope `workflows`. Quello che NON si deduce dalla presenza
          # del token è la CAPACITÀ sui file workflow — la dice APP_TOKEN_WORKFLOWS, letto
          # da `permissions` nella risposta di conio (#5288). Qui il log distingue i due
          # casi, così un push rifiutato si legge nei log senza dover indovinare.
          #
          # ATTENZIONE — questo step DA SOLO non basta, e per settimane si è creduto di sì.
          # `claude-code-action` RI-SCRIVE il remote appena parte: `configureGitAuth()` →
          # `replaceCheckoutCredentials()` fa un `git remote set-url origin
          # https://x-access-token:<suo-token>@github.com/...` incondizionato, sovrascrivendo
          # ciò che si è appena configurato qui. Il `git push` del fixer usa quindi il token
          # della action, non questo. L'unico modo per farlo restare è passarle
          # `github_token: ${{ env.APP_TOKEN }}` — vedi lo step `Run Claude fix`. Senza quello
          # le righe qui sotto sono vere solo fino all'avvio della action.
          if [ -n "${APP_TOKEN:-}" ]; then
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            if [ "${APP_TOKEN_WORKFLOWS:-}" = "true" ]; then
              echo "push identity: GitHub App (scope workflows CONFERMATO dalla risposta API)"
            else
              echo "push identity: GitHub App (permesso workflows NON concesso sull'installazione — .github/workflows/** resta non pushabile)"
            fi
          else
            echo "push identity: GITHUB_TOKEN (nessun APP_TOKEN — .github/workflows/** resta non pushabile)"
          fi

      - name: Setup Headroom compression proxy
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        uses: ./.github/actions/setup-headroom

      - name: Run Claude fix
        id: claude_review
        if: steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Non far fallire il job sull'exit non-zero della CLI: lo step finale
        # `Classify outcome` decide il colore in base al LAVORO reale (PR aperta
        # per la issue), non al subtype della CLI. Un `error_max_turns` DOPO che
        # l'agent ha gia' aperto la PR (passo 9) NON e' un fallimento del run:
        # campione 7gg (#1951) = 4/11 fail issue-fix avevano una PR creata (3
        # gia' MERGED) ma la CLI moriva al cap turni DOPO `gh pr create` → job
        # RED = false-failure che gonfia il failure-rate del loop-health. Stessa
        # filosofia di #2514 (redflag-fixer): colore = work-done, non CLI exit.
        # I fail genuini (nessuna PR) restano RED via il classify → segnale
        # preservato per loop-health + followup-drainer. `outcome` resta
        # 'failure' (pre-continue-on-error) → i due step di telemetria sotto
        # (Mark error_max_turns / FIX_OUTCOME backstop) continuano a firare.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          FIX_TIER: ${{ steps.tier.outputs.tier }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # L'IDENTITÀ DI PUSH DEL FIXER. Senza questo input la action ne conia uno suo
          # (la App `claude`, cioè `claude[bot]`) e con quello RI-SCRIVE il remote:
          # `src/github/operations/git-config.ts` → `replaceCheckoutCredentials()` esegue
          # `git remote set-url origin https://x-access-token:<token>@github.com/...`
          # in modo incondizionato, buttando via il remote impostato da
          # `Configure git identity`. Risultato misurato sulla issue #5595 (2026-08-11):
          # il conio aveva loggato `workflows=write` e lo step aveva stampato
          # «scope workflows CONFERMATO», eppure il push moriva con
          #   ! [remote rejected] fix/issue-5595 -> fix/issue-5595 (refusing to allow a
          #     GitHub App to create or update workflow
          #     `.github/workflows/sync-articles-sitemaps.yml` without `workflows` permission)
          # — perché a pushare non era la App con lo scope, ma quella della action.
          # Il fix era già stato prodotto per intero (254 righe, 3 file) e si è perso al push,
          # sopravvivendo solo come commento sulla issue. Stessa forma di #5288: una
          # capacità dichiarata vera a monte e smentita a valle, con la CI verde.
          #
          # Perché `env.APP_TOKEN` NUDO e non un fallback su `secrets.GITHUB_TOKEN`:
          # quando il conio fallisce la variabile non è scritta, l'espressione rende `''`,
          # e `''` è ESATTAMENTE il ramo di default della action (`inputs.github_token == ''`
          # → conia il suo token e lo revoca a fine run) — cioè il comportamento di oggi,
          # invariato. Mettere `secrets.GITHUB_TOKEN` come fallback sarebbe invece una
          # REGRESSIONE: gli eventi generati da GITHUB_TOKEN non ri-attivano i workflow a
          # valle (anti-ricorsione), quindi `tests` e `pr-review-loop` non partirebbero
          # più sulle PR del fixer e ogni PR resterebbe ferma senza review.
          github_token: ${{ env.APP_TOKEN }}
          show_full_output: true
          # Whitelist esplicita (hardening #898): mai `*`. I sender bot legittimi
          # del trigger sono `claude[bot]` (cascade fix → re-trigger) e
          # `github-actions[bot]` (re-label interno). Il PAT user `valerielinc-ops`
          # è un account umano → bypassa `allowed_bots`, già coperto dal gate `if`.
          allowed_bots: 'github-actions[bot], claude[bot], frontaliere-automation[bot]'
          # 2026-07-02: --dangerously-skip-permissions sostituisce --allowedTools scoped
          # (rationale completo: post-merge-followup.yml claude_args comment, stesso
          # fix, evita drift tra copie duplicate).
          claude_args: "--max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --dangerously-skip-permissions"
          prompt: |
            Sei l'agent di fix autonomo per la issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Bootstrap (in quest'ordine):**
            1. Leggi `ISSUES.md` → "Fix flow" — contratto operativo del fixer.
            2. Leggi `AGENTS.md` — non-negotiables + Privacy + architettura. VINCOLANTE.
            3. Carica la issue: `gh issue view $ISSUE_NUMBER --json number,title,body,labels,comments`.

            **Pre-condizioni (abort se falliscono):**
            - Se esiste già una PR aperta che cita "#$ISSUE_NUMBER" (`gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number`) → posta commento "PR già in volo: #<n>, skip." e TERMINA. No doppioni.
            - **Overlap-file** (no race su lavoro in corso): estrai i path target dal body della issue (file citati in `## Suggested action` / `## Item` / blocchi codice). Per ogni PR aperta (`gh pr list --state open --json number,title`) confronta i suoi file (`gh pr diff <n> --name-only`) coi target: se una PR aperta **modifica già** uno dei file target → posta commento "File `<path>` già in volo nella PR #<n> (<title>) — skip per evitare conflitto/duplicazione; riaprire l'auto-fix dopo il merge se ancora pertinente." e TERMINA. Razionale: un'altra PR può riscrivere quel file rendendo il fix moot o conflittuale (es. #934 hardening vs #943 rewrite di `submit-indexnow-batch.yml`). Nel dubbio (issue non file-specifica) → procedi.
            - **Capability guard (valuta SUBITO, prima di implementare — risparmio token):** ${{ env.APP_TOKEN_WORKFLOWS == 'true' && 'il push di questo run usa il token della GitHub App, e la risposta API del conio ha CONFERMATO `permissions.workflows == write` (letto, non dedotto dalla presenza del token): modificare file in `.github/workflows/**` è consentito e il `git push` passa. Trattali come qualunque altro file — non auto-bloccarti su quel path.' || 'il push di questo run NON ha lo scope `workflows`: o non esiste un token App, o il token è stato coniato ma il permesso `workflows` non risulta concesso sulla installazione (verificato leggendo `permissions` dalla risposta API). Dai path target estratti dal body: se il fix richiederebbe di modificare file in `.github/workflows/**` → il `git push` fallirebbe sempre (push di workflow rifiutato senza scope `workflows`) → niente PR. Allora NON implementare: posta un commento col diff/azione proposta + "blocco scope `workflows`: serve la GitHub App abilitata o mano umana" e TERMINA SUBITO.' }} In ogni caso NON hai PAT/Firebase SA: se il fix è puramente una repo-setting/branch-protection/admin-API (es. `gh api .../branches/main/protection` → 403) o richiede segreti non in CI (`CF_API_TOKEN`, `POSTHOG_*`, `GEMINI_API_KEY`), documenta e TERMINA senza implementare. Razionale: fare il fix completo per poi scoprire il blocco al push spreca ~1M token/run (vedi #983); il blocco è deterministico dalle capability, va rilevato a turno 1.

            - **Follow-up aggregata multi-item — is_aggregate=${{ steps.tier.outputs.is_aggregate }} (count=${{ steps.tier.outputs.agg_count }}):** se `is_aggregate=true` questa issue ha ${{ steps.tier.outputs.agg_count }} item distinti e tentarli TUTTI in un run sfora il turn budget → `error_max_turns` → 0 PR, ~2M token persi (osservato #1095/#1101/#1172). **REGOLA FERREA (circuit-breaker):** fixa **ESATTAMENTE UN item** poi FERMATI (per una issue *sweep/batch* "item" = UN singolo target/file: es. "~30 crawlers" → fixa 1 crawler, deferisci gli altri 29). Procedura: (a) capability guard **PER-ITEM** — salta gli item che toccano `.github/workflows/**`/admin/secret (NON abortire l'intera issue), (b) scegli il PRIMO item in-capability a massimo valore funnel, (c) implementa SOLO quello, (d) **appena la PR per quell'unico item è aperta → STOP IMMEDIATO, non iniziare un secondo item** (anche se hai turni residui), (e) elenca tutti gli altri item in `## Non implementato (ancora)`, ognuno con lo STATO LETTERALE del passo 9 (per un item deferito a un ciclo successivo: `blocked: <causa>` se sospeso su una causa esterna, altrimenti `PR concatenata #N` quando il numero esiste) → `post-merge-followup` li ri-accoda come nuova follow-up (re-queue esistente; ogni ciclo chiude ≥1 item → converge). Se `is_aggregate=false`: issue singola, comportamento invariato (capability guard whole-issue come sopra). Razionale: il budget di turni basta per 1 item con margine; 2+ item lo bruciano.

            **Fix flow (vedi ISSUES.md):**
            1. Branch isolato — **resume-aware** (`resume=${{ steps.resume.outputs.resume }}`): se `resume=false`, `git checkout -b fix/issue-$ISSUE_NUMBER` (fresh, come sempre). Se `resume=true` esiste già un branch `fix/issue-$ISSUE_NUMBER` su origin (lasciato da un run precedente morto per max-turns DOPO il checkpoint WIP, vedi step 4) — fai `git fetch origin fix/issue-$ISSUE_NUMBER && git checkout fix/issue-$ISSUE_NUMBER` invece di ricreare da zero. Ispeziona cosa c'è già (`git log --oneline origin/main..HEAD --stat`): se il diff è pertinente alla issue corrente, CONTINUA da lì (non ridiagnosticare/rifare il lavoro già presente). Se il diff sembra stale/scollegato dal body della issue attuale → `git reset --hard origin/main` e riparti pulito — usa giudizio, non è un automatismo cieco.
               **Questo container CI è GIÀ un checkout isolato monouso** (step `Checkout` in cima al workflow, `actions/checkout@v5` fresh a ogni run). **NON creare un worktree interno `.claude/worktrees/**` qui**: la regola "worktree-first" di `AGENTS.md`/`CLAUDE.md` esiste per sessioni interattive locali con un `main` condiviso — non si applica in un container CI già isolato, e crearne uno dentro non aggiunge isolamento, brucia solo turni rifacendo la meccanica del checkout (osservato #4263: ~6 turni finali sprecati su un ciclo `git diff` → patch → fetch → `.claude/worktrees/... add` → apply mai completato, 0 PR). Lavora direttamente nella root del checkout.
            2. Diagnosi root cause della issue (NON sintomo). Per categoria `crawler`: il selector è driftato → rigenera/aggiusta il parser; preferisci `node scripts/generate-company-parser.mjs` o l'edit mirato del parser/config citato nel body. **Turn-budget:** se dopo ~15 turni di esplorazione non emerge una root cause chiara, NON continuare a scavare sullo stesso vicolo cieco — restringi lo scope (issue aggregate: scegli un item più semplice, vedi circuit-breaker sopra) o termina pulito con l'outcome `no-root-cause` (già definito in fondo al prompt) invece di bruciare il resto del budget senza convergere.
            3. Applica fix CHIRURGICO alla **CLASSE del bug, NON al singolo file** (AGENTS.md non-negotiable #6): no drive-by refactor / no speculative abstraction, MA per un fix di pattern (regex/replace/guard/floor/threshold/selector/bullet-idiom) `rg`/`grep` i sibling funnel-critical (`scripts/update-*.mjs`, `scripts/lib/*-parser.mjs`, `build-plugins/**`) per lo STESSO costrutto → sweepa l'intera classe nella STESSA PR, oppure giustifica OGNI sibling non toccato in `## Non implementato`. Toccare i file gemelli con lo stesso antipattern NON è drive-by: è il fix completo. Pre-empt del 🔴 reviewer "stesso antipattern nel file gemello" (osservato #1083/#1073 il 2026-06-02: PR mono-file → 🔴 sibling → 2 cicli review+fix sprecati sulla quota Max condivisa).
            4. **Checkpoint WIP — commit+push IMMEDIATO (anti-100%-loss, #4337):** appena il fix del passo 3 è applicato (anche se non ancora testato dal gate del passo 6), committa tutto con `git add -A && git commit -m "wip(issue-$ISSUE_NUMBER): checkpoint pre-test"` e pusha SUBITO: `git push -u origin fix/issue-$ISSUE_NUMBER`. **Perché ORA:** prima di questo cambio commit+push+PR accadevano SOLO a fine flusso — un run morto per `--max-turns` prima di arrivarci perdeva il 100% del diff col container (#4337: 71 turni, $6.58, edit reali a `build-plugins/staticPagesPlugin.ts`, branch mai pushato, 404 su GitHub). Con questo checkpoint, se il run muore DOPO questo punto il branch sopravvive su GitHub col diff reale — recuperabile dal prossimo retry via la resume-logic del passo 1, invece di una perdita totale.
            5. Mai abbassare quality gate/test/validation per "far passare" (non-negotiable #1).
            6. **Gate test pre-PR (anti re-review — OBBLIGATORIO):** gira UNA VOLTA i test che coprono l'area toccata: `npx vitest run <path/glob pertinente al code modificato>` (es. fix a un parser → `npx vitest run tests/<area>`). Verde → procedi al passo 7. Rosso → NON ri-lanciare l'intero file/suite da capo: rigira SOLO il test fallito con `-t <pattern che matcha il nome del test>`, fixa la root cause, ri-verifica scoped, ripeti finché verde. NON girare la suite intera col `npm test` cieco: qui manca `data/jobs.json` (lo assembla la CI `tests`) → sarebbe rossa per infra, non per il tuo fix; se il tuo cambiamento tocca l'assembly dati gira prima `node scripts/assemble-jobs-dataset.mjs`. NON lanciare un `npx tsc --noEmit` full-repo a meno che il fix tocchi davvero type definitions condivise ampiamente (`types/`, interfacce esportate cross-modulo) — per un fix scoped il vitest sull'area toccata basta. **Perché la tightening:** #4263 (aggregate già ristretto a 1 item dal circuit-breaker) ha bruciato il budget 50 turni su ~25 di diagnosi + DUE pass completi di `npx vitest run` sull'intero file + un `npx tsc --noEmit` full-repo + ~6 turni finali di un ciclo patch→worktree mai completato (vedi passo 1) — zero PR consegnata. Test scoping disciplinato = turni per il fix vero, non per ripetere verifiche già fatte. La review Claude ora parte SOLO dopo `tests` verde (gate `pr-review-loop` su `workflow_run[tests]==success`): una PR coi test rossi non riceve review e resta ferma — spreco di un ciclo.
            7. Commit (SOLO se ci sono cambi oltre il checkpoint WIP del passo 4, es. fix ai test rossi del passo 6): identity canonica già configurata, messaggio conventional, in fondo nessuna email non-canonica. Se dal passo 4 non è cambiato altro, questo passo è un no-op — non serve squashare: una storia wip+fix sul branch va bene.
            8. Push (aggiorna il branch già pushato al passo 4 col commit più recente, se presente): `git push -u origin fix/issue-$ISSUE_NUMBER`.
            9. Apri PR con `gh pr create`. Body OBBLIGATORIO (REVIEW.md completeness contract):
               ```
               ## Implementato
               - <cosa fa il fix>
               ${{ steps.closing.outputs.closing_ref }}

               ## Non implementato (ancora)
               - <scope NON fatto> — <STATO LETTERALE>
               ```
               **La riga di chiusura qui sopra è già calcolata, copiala VERBATIM.** Non
               sostituirla con `Closes #$ISSUE_NUMBER` di tua iniziativa: se dice
               `Addresses #$ISSUE_NUMBER` è perché questa issue è una follow-up **aggregata
               multi-item**, e su quelle `pr-body-contract.yml` fallisce ogni `Closes` — la PR
               nasce rossa (successo reale: #5848 e #5862). `Addresses` non è una keyword
               GitHub, quindi non chiude niente al merge: è voluto, l'aggregata la chiude
               `reconcile-followups.mjs` quando TUTTI i suoi item risultano fatti, e il
               circuit-breaker qui sopra te ne fa fare uno solo. La riga esce da
               `scripts/lib/pr-body-generator-contract.mjs`, che usa la stessa `isAggregate()`
               che il gate rispecchia.
               **Lo STATO LETTERALE è obbligatorio su OGNI bullet** e va scelto fra questi cinque,
               scritti esattamente così (AGENTS.md #8; `out of scope` / `follow-up` / `posposto`
               sono la tassonomia vecchia, ABOLITA — non usarli):
               - `in questa PR` — è già nel diff che stai per mergiare;
               - `PR concatenata #N` — con il NUMERO, altrimenti non è tracciabile e non conta;
               - `per scelta` / `by construction` — è un no motivato, non un rinvio;
               - `blocked: <causa esterna reale>` — lavoro sospeso su una causa che non controlli.
               Perché non è cosmesi: `scripts/ci/followup-has-candidates.mjs` riapre come issue di
               follow-up ogni bullet `blocked: <causa tecnica>` **e ogni bullet senza stato**. Un
               bullet che dice solo «out of scope» torna indietro come issue nuova e rialimenta il
               backlog con lavoro già chiuso. Con lo stato giusto, non torna.
            10. La PR entra automaticamente in `pr-review-loop` → review → `## LGTM` → `auto-merge-on-lgtm`. NON mergiare a mano.

            **Constraint:**
            - Changes chirurgiche, root-cause, una issue alla volta.
            - Mai toccare file fuori scope della issue — **eccetto i sibling della STESSA classe del bug** (#6, passo 3): quelli SONO in scope e vanno sweepati nella stessa PR. "Fuori scope" = un'altra feature/area, NON un file gemello con lo stesso antipattern (es. fixare il bullet-idiom in 1 parser e lasciarlo rotto negli altri 16 = fix incompleto, non "rispetto dello scope").
            - **CODE vs DATA — no scroll dei blob (ISSUES.md → "CODE vs DATA", mirror #1096 del reviewer):** i file rigenerati `data/**` (job JSON, snapshot, translation-cache, blog-articles), `public/**` (asset), `reports/**`, `_newsletter_variants/**` NON sono code da leggere riga-per-riga. Se la root cause è un drift di output dati → fixa il CODE che li genera (parser/crawler/build-plugin), non `cat`/scorrere il blob né editarlo a mano. Campione → `Read` mirato (offset/limit). `rg`/`grep` scopati al code: `rg <pattern> scripts build-plugins components services -g '!data/**' -g '!public/**' -g '!reports/**'` — cercare nei blob dati = token bruciati. Eccezione: un `data/**` config/fixture checked-in editato a mano dal fix.
            - Mai disabilitare AdSense Auto Ads (non-negotiable #7).
            - Mai committare path home assoluti o email personali (Privacy).
            - Se la root cause non è determinabile con confidenza → NON forzare un fix; posta su issue "Root cause non determinata: <cosa hai trovato>. Serve indagine umana." rimuovi nulla e TERMINA senza PR.
            - Se il fix richiede credenziali/segreti non disponibili in CI → documenta in commento e TERMINA senza PR.
            - **Telemetria outcome (OBBLIGATORIO):** ogni volta che termini, l'ULTIMO commento che posti sulla issue DEVE iniziare con un marker HTML su riga propria: `<!-- FIX_OUTCOME: <code> -->`. `<code>` ∈ `pr-created` (PR aperta) · `blocked-workflows-scope` · `blocked-secrets` · `blocked-admin-settings` · `no-root-cause` · `overlap-skip` · `pr-already-open` · `already-fixed` · `revenue-tracker-manual`. Se apri una PR (passo 9) e non posti altri commenti, aggiungi comunque un commento col solo marker `<!-- FIX_OUTCOME: pr-created -->`. Il lessons-harvester aggrega questi marker per rilevare classi di blocco ricorrenti e proporre migliorie ai doc/prompt (vedi ISSUES.md → "Auto-improvement loop").

      - name: Claude usage metrics
        # Skip when the pre-flight short-circuited (Claude never ran → no execution file).
        if: always() && steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "issue-fix"

      - name: Mark Claude terminal outcome (granular telemetry, pre-backstop)
        # Quando la run Claude muore PRIMA di poter postare il proprio verdetto,
        # NON lascia un marker FIX_OUTCOME → il backstop sotto posta un generico
        # `no-pr-unspecified` che il drainer IGNORA (BACKSTOP_MARKER) → l'item
        # viene trattato come orfano ri-tentabile e ri-accodato fino a
        # MAX_ATTEMPTS. Questo step emette il marker GRANULARE (senza
        # BACKSTOP_MARKER → il drainer lo VEDE) così il recupero è corretto per
        # causa. Gira PRIMA del backstop, che quindi trova il marker e si salta.
        #
        # Due terminal outcome, entrambi deterministici dall'execution file:
        #  • `error_max_turns` → marker `max-turns`: il budget di turni è esaurito
        #    in modo riproducibile → il drainer parka subito con `needs-human`.
        #  • HTTP 429 (quota Max esaurita) → marker `rate-limited` + beacon
        #    `<!-- QUOTA_RESETS_AT: … -->`. **È il caso dominante e prima non era
        #    coperto**: misurato 2026-08-05 sulle 61 run fallite della finestra
        #    7gg, 60 sono 429 e ZERO sono error_max_turns. Il payload di un 429
        #    porta `"subtype": "success"` con `is_error: true`, quindi il vecchio
        #    gate subtype-only non scattava mai e la issue finiva ri-accodata 3×
        #    contro la stessa quota esaurita → `fu-parked` → age-out close, senza
        #    che nessun agent l'avesse mai letta (0 turni, $0). Catena assorbente
        #    completa in scripts/ci/claude-rate-limit.mjs.
        #
        # Gli altri failure (5xx transienti, crash infra) restano SENZA marker →
        # legittimamente ri-tentabili dal rescue. Nessuna falsa escalation.
        # Best-effort, mai fa fallire il job.
        if: always() && steps.quota.outputs.quota_blocked != 'true' && steps.claude_review.outcome == 'failure' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          EXEC_FILE: ${{ steps.claude_review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: issue-fix
        run: node scripts/ci/mark-claude-terminal-outcome.mjs

      - name: Emit FIX_OUTCOME telemetry (deterministic backstop)
        # Skip on short-circuit: the pre-flight gate already posted the granular
        # `<!-- FIX_OUTCOME: already-fixed -->` marker (preflight) or
        # `<!-- FIX_OUTCOME: blocked-workflows-scope -->` marker (scope_guard, #4227);
        # this coarse backstop would otherwise post `no-pr-unspecified` and poison the
        # lessons-harvester signal. (The step's own `HAS` check below is belt-and-
        # suspenders for the same reason — this `if:` avoids the extra `gh` round-trip.)
        # The agent SHOULD post a granular `<!-- FIX_OUTCOME: <code> -->` marker,
        # but prompt-emitted markers are unreliable (observed: #974 ran with the
        # marker prompt on main yet posted none). This backstop guarantees the
        # lessons-harvester always has a queryable marker: pr-created if this run
        # opened a PR on fix/issue-<N>, else a coarse no-pr-unspecified. It never
        # overwrites the agent's own granular marker. Best-effort: never fails.
        if: always() && steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          HAS=$(gh issue view "$ISSUE" --json comments --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          if [ "${HAS:-0}" != "0" ]; then
            echo "FIX_OUTCOME marker already present (agent-posted) — no backstop needed."
            exit 0
          fi
          PR=$(gh pr list --head "fix/issue-$ISSUE" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then OUT=pr-created; else OUT=no-pr-unspecified; fi
          echo "FIX_OUTCOME issue=$ISSUE outcome=$OUT (deterministic backstop)"
          gh issue comment "$ISSUE" --body "$(printf '<!-- FIX_OUTCOME: %s -->\n_Outcome rilevato dal post-step deterministico (telemetria lessons-harvester)._' "$OUT")" || true

      # Colore del job = LAVORO reale del run, non l'exit della CLI Claude.
      #  • PR aperta o gia' MERGED per la issue (`fix/issue-<N>`)  → run SUCCESS
      #    (la PR e' in pr-review-loop / gia' mergiata). Vale ANCHE se la CLI e'
      #    morta `error_max_turns` DOPO `gh pr create` (false-failure: #1951 = 4/11
      #    fail avevano una PR, 3 gia' MERGED).
      #  • nessuna PR + CLI FAILED  → non-delivery reale (budget esaurito senza PR,
      #    oppure branch pushato ma PR mai aperta) → RED (segnale preservato per
      #    loop-health-report + followup-drainer). NON mascherato: il run non ha
      #    consegnato una PR.
      #  • nessuna PR + CLI SUCCESS → terminale pulito (capability-guard / overlap
      #    / already-fixed / no-root-cause: l'agent ha deciso di NON aprire PR) →
      #    GREEN, comportamento invariato vs oggi.
      # I fail infra a monte (npm ci, setup, pre-flight) restano RED da soli:
      # quegli step non hanno continue-on-error. Nessun gate abbassato: la PR
      # passa comunque dal reviewer (cfr. #2514 / #2288 — disambigua intenzionale
      # vs crash, colore != gate).
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.quota.outputs.quota_blocked != 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CLAUDE_OUTCOME: ${{ steps.claude_review.outcome }}
        run: |
          set -uo pipefail
          # PR aperta o gia' mergiata sul branch di questa issue (head esatto).
          PR_STATE=$(gh pr list --head "fix/issue-$ISSUE" --state all --json number,state \
            --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | .[0].number // empty' 2>/dev/null || true)
          echo "issue=$ISSUE pr(head fix/issue-$ISSUE, open|merged)=${PR_STATE:-<none>} claude=$CLAUDE_OUTCOME"
          if [ -n "${PR_STATE:-}" ]; then
            echo "✓ PR #$PR_STATE esiste (open/merged) per la issue → run SUCCESS. Job verde anche se la CLI e' uscita '$CLAUDE_OUTCOME' (false-failure: lavoro consegnato)."
            exit 0
          fi
          if [ "$CLAUDE_OUTCOME" = "failure" ]; then
            # Quota esaurita (429): il job resta comunque RED — non e' un
            # successo e non ha consegnato niente, quindi nessun falso-verde
            # (Non-Negotiable #2, nessun error→warning). Cambia solo il MESSAGGIO:
            # attribuire questi run al "fixer che non sa fixare" e' una
            # misattribuzione che ha tenuto acceso l'allarme del tracker #1951 per
            # ≥7 report senza che nessuno risalisse alla causa. Claude non ha
            # eseguito (0 turni, $0): il recupero corretto e' aspettare la
            # finestra, non ri-tentare — e lo fa il marker `rate-limited` emesso
            # dallo step precedente, letto da followup-drainer.mjs.
            RL=$(gh issue view "$ISSUE" --json comments \
              --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME: rate-limited -->"))] | length' 2>/dev/null || echo 0)
            if [ "${RL:-0}" != "0" ]; then
              echo "::error::issue-fix #$ISSUE: run terminata su QUOTA Claude esaurita (HTTP 429) al primo turno — l'agent non ha letto la issue (0 turni, costo 0). Non e' un fallimento di diagnosi/fix: la issue e' stata ri-accodata SENZA consumare un tentativo e il drainer sospende le promozioni fino al reset. Job RED perche' nessuna PR e' stata consegnata (nessun falso-verde)."
              exit 1
            fi
            echo "::error::issue-fix #$ISSUE: nessuna PR aperta/mergiata e la CLI e' fallita ('$CLAUDE_OUTCOME') → non-delivery reale. Job RED (segnale preservato per loop-health + drainer)."
            exit 1
          fi
          echo "Nessuna PR ma la CLI e' uscita pulita ('$CLAUDE_OUTCOME') → terminale legittimo (blocked/already-fixed/no-root-cause). Job verde."

      - name: Release in-progress claim (zero-Claude, mutex)
        # Symmetric to the claim step above: runs on EVERY terminal path (success,
        # blocked-workflows-scope, already-resolved, error_max_turns, infra fail) so a
        # dead/failed run never leaves `agent:in-progress` stuck forever. Gated on
        # `steps.claim.outcome != 'skipped'` (this run must have actually executed the
        # claim step — i.e. wasn't itself short-circuited by an earlier gate) AND
        # `in_flight != 'true'` (this run was the one that ADDED the label, not a run
        # that saw it already there and deferred to someone else's claim). Never removes
        # a claim this run didn't set.
        if: always() && steps.quota.outputs.quota_blocked != 'true' && steps.claim.outcome != 'skipped' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --remove-label agent:in-progress 2>/dev/null || true
          echo "Released agent:in-progress claim on issue #$ISSUE (best-effort)."
