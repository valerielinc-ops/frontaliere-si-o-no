name: Issue fix (Claude → PR)

on:
  issues:
    types: [labeled]

# Il gruppo di concorrenza è PER-ISSUE, e la storia del perché è la parte utile.
#
# Era `group: issue-fix`, costante per ogni issue. Con `cancel-in-progress: false`
# quel gruppo non è una coda (#5514): protegge la run IN CORSO, non le pending.
# GitHub tiene **una sola** run pending per gruppo, e ogni nuova pending SFRATTA
# (`cancelled`) la precedente. La profondità era 1, non N. Due `agent:fix`
# applicati a due issue nello stesso minuto producevano una run lavorata e una
# cancellata prima di partire — e poiché `on: issues:[labeled]` è one-shot,
# l'evento della run sfrattata è consumato: la label resta sulla issue e NIENTE
# la ri-arma. Misurato: 13 run `cancelled` su 100; il 2026-08-08 alle 09:02
# cinque `[crawler-health]` etichettate insieme → 1 riuscita, 4 issue ferme due
# giorni (#5392 #5393 #5394 #5395).
#
# Il costo vero è arrivato dopo, quando lo sfratto ha smesso di essere raro. Il
# 2026-09-04 il cap del drainer è passato da 1 a 3 e le run sfrattate sono
# passate da 31 (09-03) a 823 (09-04) mentre i success calavano da 55 a 36; una
# run sfrattata non posa nessun `FIX_OUTCOME`, il RESCUE del drainer la ritrova
# `agent:fix` orfana e le addebita un `fu-attempt`, e tre giri così la
# parcheggiano `fu-parked` + `fu-attempt:3` senza che un solo tentativo sia mai
# avvenuto: 88 issue in 36 ore, su un backlog cresciuto di 82 nette in 15 giorni.
#
# Il cap del drainer, mergiato da solo in #7482, era necessario e NON è
# sufficiente, e la misura post-merge lo dice senza ambiguità. Le quattro run
# `issue-fix` create nei 48 secondi dopo il merge (12:36:45Z): tre `cancelled`
# su quattro, cioè volume crollato (il 09-04 stava a ~71 run/ora) e tasso di
# sfratto invariato. Due di quelle tre sono la STESSA issue — «Sezione TI
# legacy 'cerca-lavoro-ticino' ridichiarata», entrambe create alle 12:37:15Z —
# cioè un doppio evento sullo stesso numero, che nessun cap sulle promozioni
# può vedere per costruzione. E tutte e quattro hanno `event: issues`: con una
# chiave costante si sfrattano a vicenda due issue QUALUNQUE, comprese quelle
# che il drainer non ha promosso (il triage che etichetta, il RESCUE che
# ri-etichetta). Il cap governa una sola sorgente di eventi; la chiave le
# governa tutte.
#
# La chiave per-issue toglie la causa invece di limitarne l'effetto: due issue
# DIVERSE non si sfrattano più, due eventi sulla STESSA issue continuano a
# serializzare — che è l'unica mutua esclusione di cui questo workflow avesse
# davvero bisogno. Il fallback `|| github.run_id` non serve oggi (`issues` è
# l'unico trigger, quindi `github.event.issue.number` è sempre definito) ed esiste
# perché un trigger senza issue nel payload, aggiunto un domani, renderebbe la
# chiave di nuovo costante e riporterebbe gli sfratti in silenzio; con `run_id`
# ogni run avrebbe invece una chiave propria.
#
# A limitare la parallelizzazione torna a essere un numero tarabile da un umano:
# `FOLLOWUP_MAX_INFLIGHT_FIX` in `scripts/ci/followup-drainer.mjs` (default 1),
# che conta le run in volo e promuove al massimo N. Il drainer clampa quel numero
# a `fixQueueDepth()`, che legge il `group:` qui sotto: finché la chiave è
# per-issue il clamp non morde, e se qualcuno la rende di nuovo costante il cap
# torna automaticamente a 1 invece di ricreare gli sfratti.
#
# Restano fuori da questo gruppo le due protezioni che il gruppo costante dava
# per effetto collaterale: le PR concorrenti sullo stesso data file dei crawler
# — coperte da `crawlerDirectFixBudget` in `scripts/ci/triage-sweep.mjs`, che
# resta 1 alla volta e ritorna 0 appena un `agent:fix` è aperto o una run è in
# volo — e il cap OOM sugli agent paralleli, che ora è il cap del drainer.
concurrency:
  group: issue-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
# Contratto #7549: `cancel:false` conserva la run in corso, ma GitHub mantiene
# una sola pending per gruppo. Un terzo evento sulla stessa issue può quindi
# sostituire la pending; l'evento e' one-shot e il rescue del drainer deve
# ri-armare la label/outcome se la run sfrattata non ha mai scritto un verdetto.

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    # Gate (tutti necessari):
    # - L'evento è l'aggiunta della label `agent:fix` (opt-in esplicito, mai
    #   trigger su qualunque label). Solo collaborator/owner possono labellare,
    #   quindi la label È il consenso umano.
    # - sender == owner: belt-and-suspenders contro label aggiunte da automation
    #   esterne / bot non fidati.
    # - Auth via CLAUDE_CODE_OAUTH_TOKEN (subscription Max, zero API cost).
    if: |
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'valerielinc-ops' ||
       github.event.sender.login == 'frontaliere-automation[bot]' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    # 40→360 (2026-07-17, #4341): 40min ha già ricausato ci-timeout 2x (#4189,
    # #4219) dopo il bump 30→40 — stesso costrutto di pr-review-loop.yml, stesso
    # fix: portato al vero max runner-hosted (360) per non uccidere più a metà
    # turno lavoro Claude già fatto. Costo: minuti effettivi usati, non il tetto.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Blobless clone (#4189): con fetch-depth:0 il checkout scaricava TUTTI
          # i blob storici di questo repo data-heavy, consumando l'intero budget
          # job da 30min → "Run Claude fix" non partiva mai. `filter: blob:none`
          # prende il commit-graph completo + il working tree di HEAD ma salta i
          # blob storici (fetch on-demand se mai servono): checkout da ~minuti a
          # ~secondi, HEAD materializzato identico → il fixer lavora invariato.
          filter: blob:none
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # RIMISURATO il 2026-08-18 (era 10min, derivato da 4 run): su 72 Checkout
        # `success` delle ultime 300 run — min 125s, p50 198s, p95 370s, p99 480s,
        # **max 571s** — il tetto di 600s stava 29 SECONDI sopra il massimo sano.
        # Non c'e' separazione fra le due popolazioni: 571s sano e 600s morto sono
        # adiacenti, quindi il tetto stava troncando la coda della propria
        # distribuzione invece di discriminare un guasto.
        # Due morti reali, entrambe oggi (13:27:56Z run 32142498996 e 15:17:20Z run
        # 32153527680), durata esatta 600,000s e annotazione letterale
        # "The action 'Checkout' has timed out after 10 minutes": il Checkout e'
        # morto PRIMA che Claude partisse, quindi due issue (follow-up #6004 e
        # #6001) non sono state riparate. Il rimedio era peggio del male — un
        # Checkout lento che finisce lascia comunque lavorare il fixer, il kill lo
        # annulla del tutto.
        # Questo workflow e' strutturalmente il piu' lento dei quattro del ciclo:
        # e' l'unico senza sparse-checkout, quindi materializza l'albero pieno.
        # Nuovo tetto = 2,5x il massimo osservato (571s), e resta il 6,7% del
        # budget del job (`timeout-minutes: 360`), quindi scatta sempre prima.
        # Rimisurare quando il p99 si muove; non ri-derivare da un campione < 30.
        timeout-minutes: 24

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Conia il token della GitHub App PRIMA di ogni gate che ne dipende.
      #
      # Perché serve qui: `secrets.GITHUB_TOKEN` non ha — e non può avere — lo scope
      # `workflows`, quindi ogni fix che tocchi `.github/workflows/**` falliva sempre al
      # push. Era il blocco più costoso del fixer (~1M token per run prima che tre guardie
      # lo rilevassero in anticipo, escalation #3887). Alla App `frontaliere-automation` è
      # stato concesso `workflows: write` il 2026-08-06; questo step è la metà mancante,
      # senza la quale il permesso non cambiava nulla.
      #
      # Zero-dep (solo node:crypto + fetch), quindi gira prima di `npm ci` come gli altri
      # pre-flight. Su credenziali mancanti/non valide: warn + exit 0 SENZA scrivere
      # APP_TOKEN, e ogni consumatore qui sotto ricade sul comportamento precedente.
      #
      # Lo step scrive DUE variabili in $GITHUB_ENV, e la distinzione è il fix di #5288:
      #   APP_TOKEN            → il token esiste (identità di push/dispatch della App)
      #   APP_TOKEN_WORKFLOWS  → `permissions.workflows == 'write'` LETTO dalla risposta API
      # Sono cose diverse. Il conio riesce (201, token valido) anche quando il permesso
      # `workflows` è stato richiesto ma mai approvato sull'installazione: il permesso
      # semplicemente non compare fra i `permissions`. Chi ha bisogno della CAPACITÀ deve
      # quindi gatare su APP_TOKEN_WORKFLOWS, mai sulla presenza del token.
      - name: Mint GitHub App token (zero-Claude, pre-npm)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Prima di `npm ci`, rileva il beacon della quota Claude per telemetria.
      # Non blocca il run: Codex e' il provider primario e Claude e' il fallback.
      - name: Pre-flight — quota telemetry (Codex primary, pre-npm)
        id: quota
        # Il beacon è best-effort e resta telemetria: un guasto infra non deve
        # sopprimere il run, e la quota Claude non salta Codex.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CODEX_FALLBACK_MODE: '1'
        # STRUCTURAL fix per l'escalation misurata sul tracker #1951 (failure-rate
        # issue-fix acceso da ≥7 report settimanali consecutivi). Scaricando i log
        # di TUTTE e 61 le run fallite della finestra 7gg (2026-07-29 → 08-05):
        # 60 sono HTTP 429 (quota Max settimanale esaurita) con num_turns=1 e
        # $0 di costo — il provider Claude non ha MAI eseguito — 1 è un 529 transiente, e
        # ZERO sono error_max_turns / push falliti / timeout. Di quelle 61, **49
        # (80%) sono cadute dentro una finestra di rate-limit già aperta da un
        # fallimento precedente**: deterministicamente prevedibili, perché il
        # payload del 429 dichiara `resetsAt`. Questo gate legge il beacon
        # `<!-- QUOTA_RESETS_AT: … -->` lasciato dalla run precedente sulle issue
        # in coda e, se la finestra è ancora aperta, ri-accoda questa issue SENZA
        # consumare un tentativo e senza bloccare l'esecuzione Codex-primary. Rationale completo e
        # catena assorbente (429 → park → age-out close) in
        # scripts/ci/claude-rate-limit.mjs.
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Install dependencies
        if: always()
        run: npm ci

      # DECISIONE DEL PROPRIETARIO, 2026-08-24 (registro in DECISIONS.md): l'uso dei
      # secret dal ciclo autonomo è autorizzato in modo permanente e non va più
      # chiesto caso per caso.
      #
      # Prima di questa decisione il fixer del sito girava SENZA credenziali —
      # a differenza di quello del corpus, che le carica da sempre — e il prompt
      # gli diceva di dichiarare `blocked-secrets` e terminare. Misurato il
      # 2026-08-24: 4 verdetti in 7 giorni, e 5 issue parcheggiate su un blocco
      # che era una scelta di configurazione, non una capacità mancante (#5999
      # PostHog, #5964 alias di locale, #5953 campaign goal, #5824 token legacy,
      # #5429 copertura professioni). `blocked-secrets` cessa quindi di essere un
      # verdetto strutturale: se un fix richiede una credenziale, ora c'è.
      #
      # `continue-on-error` e il ramo `else` sono la parte che NON va toccata: il
      # loader esce 0 anche quando non carica niente (per non rompere i workflow),
      # quindi l'unico modo di distinguere «caricati» da «silenzio» è dirlo nel
      # log. Un fixer che crede di avere le credenziali e non le ha spende un run
      # intero per scoprirlo al primo uso.
      - name: Firebase SA per Remote Config (decisione 2026-08-24)
        if: always()
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA in questo run → Remote Config non leggibile: un fix che richiede una credenziale resta bloccato, e il verdetto giusto in quel caso è ancora \`blocked-secrets\`."
          fi

      - name: Load secrets from Remote Config (decisione 2026-08-24)
        id: rc_env
        if: always()
        continue-on-error: true
        run: |
          node scripts/load-rc-env.mjs
          # Il loader esce 0 anche a mani vuote: il conteggio è l'unico segnale.
          echo "rc_loaded=$( [ -n "${CF_API_TOKEN:-}${POSTHOG_API_KEY:-}${GITHUB_PAT:-}" ] && echo true || echo unknown )" >> "$GITHUB_OUTPUT"

      - name: Pre-flight — already-resolved gate (zero-Claude)
        id: preflight
        if: always()
        # PROCEED-SAFE: a gate failure must NEVER strand the issue. The script is total
        # (catches its own throws → emits already_resolved=false), but continue-on-error is
        # belt-and-suspenders: any infra fault (node/npm) leaves the output unset → the
        # downstream `already_resolved != 'true'` gates evaluate true → the normal fixer
        # runs unchanged. The only way the Claude steps are skipped is an EXPLICIT
        # `already_resolved=true` (a strong, deterministic match), never an error.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix per escalation #1647 (`fix-outcome:already-fixed` 10×/14d).
        # Prima di spendere un run Claude, controlla deterministicamente se questa
        # follow-up è già stata risolta su main da una PR successiva senza `Closes #N`
        # (done-but-open): se un token DISTINTIVO della regione `Suggested action`
        # è già presente VERBATIM nel file citato → short-circuit. Lo script rimuove
        # `agent:fix`, posta commento + marker `FIX_OUTCOME: already-fixed`, ed emette
        # `already_resolved=true`. CONSERVATIVO (bias a procedere): solo follow-up
        # singole non-in-flight con match forte; aggregate/ambiguo/nessun match →
        # `already_resolved=false` e il fixer normale gira invariato. Matcher condiviso
        # con reconcile-followups.mjs (followup-resolution-match.mjs, no drift).
        run: node scripts/ci/check-issue-already-resolved.mjs

      - name: Pre-flight — workflows-scope capability guard (zero-Claude)
        id: scope_guard
        # CONDIZIONATO alla CAPACITÀ del token, non alla sua presenza (#5288, 2026-08-08).
        # Con `workflows: write` davvero concesso il fixer HA lo scope e bloccarlo a priori
        # gli toglierebbe una capacità che possiede; senza — credenziali App assenti,
        # ruotate, revocate, oppure permesso richiesto ma mai approvato sull'installazione —
        # siamo esattamente nello stato per cui il guard è stato costruito, e continua a
        # fare il suo lavoro.
        #
        # La versione precedente gatava su `env.APP_TOKEN == ''`, cioè sulla PRESENZA del
        # token. Non è la stessa cosa: il conio restituisce 201 e un token perfettamente
        # valido anche quando `workflows` non è fra i permessi concessi. In quello stato il
        # guard veniva saltato, il prompt qui sotto dichiarava all'agente «hai lo scope
        # workflows, procedi», l'agente implementava tutto, e il rifiuto arrivava solo alla
        # fine, al `git push` («refusing to allow a GitHub App to create or update workflow
        # … without `workflows` permission», #5280 2026-08-07). Il fallimento era migrato
        # dal turno 1 a dopo l'implementazione: da 0 token a ~1M token per run, cioè
        # esattamente la spesa che l'escalation #3887 aveva eliminato.
        #
        # Disattivare il guard del tutto sarebbe stato l'errore: il fallimento del conio è
        # silenzioso per progetto (`mint-app-token.mjs` esce 0), quindi un guard rimosso
        # avrebbe fatto tornare il fixer a spendere ~1M token per run per poi fallire al
        # push, senza che niente lo segnalasse. Legare le due cose rende il degrado
        # automatico invece che affidato a chi se ne ricorda.
        #
        # FAIL-CLOSED: `mint-app-token.mjs` scrive APP_TOKEN_WORKFLOWS su OGNI cammino di
        # uscita, e una variabile non scritta è comunque `!= 'true'` → il guard gira. Non
        # esiste un modo di arrivare a «capacità concessa» senza che l'API l'abbia detto.
        if: env.APP_TOKEN_WORKFLOWS != 'true' && steps.preflight.outputs.already_resolved != 'true'
        # PROCEED-SAFE, same contract as `preflight` above: the script is total (catches
        # its own throws → emits workflows_blocked=false), continue-on-error is
        # belt-and-suspenders so an infra fault never strands the issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # STRUCTURAL fix for escalation #4227 (`fix-outcome:blocked-workflows-scope`
        # 12×/14d — #4140 #4160 #4189 #4244 #4256 #4266 #4284 #4322 #4365 #4370 #4375 and
        # more). scripts/ci/check-workflows-scope.mjs was built for a prior escalation
        # (#3887) but never actually wired in — this step closes that gap. Two modes:
        #   1. Issue body explicitly cites a `.github/workflows/**` path → block, zero
        #      implementation tokens wasted.
        #   2. Issue is a `scan-job-timeouts.mjs` auto-file (label `ci-timeout`) whose
        #      title EXACTLY matches a PRIOR issue that already carries a
        #      `<!-- FIX_OUTCOME: blocked-workflows-scope -->` marker → block, zero
        #      DIAGNOSIS tokens wasted re-deriving a root cause already found (verified
        #      live: "CI Failure: Refresh thin-page promotions" recurred across 8+
        #      distinct issue numbers in one week, each independently re-diagnosing the
        #      identical checkout-timeout root cause). See that script's docstring for
        #      the full rationale/evidence and the PROCEED-SAFE bias (bare title match
        #      only, no marker → proceeds, normal fixer runs unchanged).
        run: node scripts/ci/check-workflows-scope.mjs

      - name: Pre-flight — in-progress claim gate (zero-Claude, mutex)
        id: claim
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true'
        # FAIL-CLOSED: the script emits `in_flight=true` on a GitHub/API/parse
        # fault. A runner failure is also allowed to fail this job rather than
        # letting an unreadable mutex reach the fixer.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLAIM_ACTION: acquire
          CLAIM_OWNER: remote
        # STRUCTURAL fix per #4788/#4793: due sessioni (una interattiva locale, una questo
        # fixer autonomo) hanno lavorato la STESSA issue in parallelo → due PR competitive,
        # merge in conflitto. L'unica difesa esistente era un controllo prompt-level DENTRO
        # lo step Claude ("cerca una PR già aperta") — valutato dopo tier/checkout, e cieco a
        # un lavoro iniziato ma non ancora aperto in PR (esattamente il caso #4793, creata
        # prima che l'altra sessione, più lenta perché includeva root-cause+test, avesse
        # nulla da mostrare). Questo step reclama deterministicamente la label
        # `agent:in-progress` PRIMA di ogni lavoro (tier compreso): se è già presente, un'altra
        # sessione l'ha presa per prima → skip totale, zero quota Max OAuth. Simmetrico alla
        # convenzione lato locale (`/fix-issue`, ISSUES.md "Fix flow"): chi reclama prima
        # vince, l'altro vede la label e si ferma prima di spendere turni.
        run: node scripts/ci/claim-issue-in-flight.mjs

      - name: Load issue group context (B19, zero-Claude)
        id: group
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
        run: |
          set -euo pipefail
          mkdir -p "$CTX_DIR"
          : > "$CTX_DIR/group.json"
          group_is_group=false
          group_label_output=
          group_numbers_output=

          load_group_context() {
            local leader_json group_label group_contract members valid numbers
            local group_max_size group_label_pattern query_limit

            if ! leader_json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels); then
              echo "::warning::impossibile leggere le label della issue #$ISSUE_NUMBER → fallback alla issue singola"
              return 0
            fi

            # Tetto e matcher arrivano dalla stessa sorgente del producer. Il
            # tail protegge il contratto da eventuale stdout diagnostico emesso
            # da un import transitivo senza duplicare la regola nel YAML.
            if ! group_contract=$(node --input-type=module -e "import('./scripts/ci/followup-drainer.mjs').then(({ ISSUE_GROUP_MAX_SIZE, ISSUE_GROUP_LABEL_PATTERN }) => process.stdout.write(JSON.stringify({ maxSize: ISSUE_GROUP_MAX_SIZE, labelPattern: ISSUE_GROUP_LABEL_PATTERN })))" | tail -n 1); then
              echo "::warning::impossibile leggere il contratto del raggruppatore → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! group_max_size=$(printf '%s' "$group_contract" | jq -er '.maxSize | numbers | tostring') || \
              ! group_label_pattern=$(printf '%s' "$group_contract" | jq -er '.labelPattern | strings | select(length > 0)'); then
              echo "::warning::contratto B19 non valido → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            case "$group_max_size" in
              [2-9]|[1-9][0-9]*) ;;
              *) echo "::warning::tetto B19 non valido ($group_max_size) → fallback alla issue #$ISSUE_NUMBER"; return 0 ;;
            esac

            if ! group_label=$(printf '%s' "$leader_json" | jq -r --arg pattern "$group_label_pattern" \
              '[.labels[]?.name | select(test($pattern))] | .[0] // empty'); then
              echo "::warning::impossibile riconoscere la label B19 → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if [ -z "$group_label" ]; then
              echo "issue #$ISSUE_NUMBER: nessun gruppo B19 → flusso singolo"
              return 0
            fi

            # La label è assegnata a tutti i membri, ma solo il numero in coda
            # alla label può armare il run. Un membro etichettato per errore
            # degrada al flusso singolo e non apre una seconda PR di gruppo.
            if [ "${group_label##*-}" != "$ISSUE_NUMBER" ]; then
              echo "issue #$ISSUE_NUMBER: membro non-leader di $group_label → flusso singolo"
              return 0
            fi

            query_limit=$((group_max_size + 1))
            if ! members=$(gh issue list --repo "$REPO" --state open --label "$group_label" \
              --json number,title,body,labels,createdAt,updatedAt --limit "$query_limit"); then
              echo "::warning::impossibile leggere i membri di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! valid=$(printf '%s' "$members" | jq -r --arg label "$group_label" --arg leader "$ISSUE_NUMBER" --argjson max "$group_max_size" \
              'type == "array" and length >= 2 and length <= $max
               and ([.[].number | tostring] | index($leader) != null)
               and all(.[]; any(.labels[]?; .name == $label))'); then
              echo "::warning::impossibile validare $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if [ "$valid" != true ]; then
              echo "::warning::gruppo $group_label non valido o oltre il tetto → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi

            if ! printf '%s' "$members" | jq --arg leader "$ISSUE_NUMBER" \
              'sort_by(if (.number | tostring) == $leader then 0 else 1 end, .createdAt, .number)' > "$CTX_DIR/group.json"; then
              echo "::warning::impossibile scrivere il contesto di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! numbers=$(jq -er '[.[].number] | join(",")' "$CTX_DIR/group.json"); then
              echo "::warning::impossibile leggere il contesto di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            group_is_group=true
            group_label_output=$group_label
            group_numbers_output=$numbers
            echo "issue #$ISSUE_NUMBER: gruppo B19 $group_label → membri #$numbers"
          }

          load_group_context
          {
            echo "is_group=$group_is_group"
            echo "group_label=$group_label_output"
            echo "group_numbers=$group_numbers_output"
          } >> "$GITHUB_OUTPUT"

      - name: Validate issue group context file (zero-Claude)
        id: group_context
        if: steps.group.outputs.is_group == 'true'
        env:
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
        run: |
          set -euo pipefail
          if [ ! -r "$CTX_DIR/group.json" ] || ! jq -e 'type == "array" and length >= 2' "$CTX_DIR/group.json" >/dev/null; then
            echo "::error::contesto del gruppo B19 illeggibile: il ramo group non può procedere"
            exit 1
          fi

      - name: Determine fix tier
        id: tier
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
          IS_GROUP: ${{ steps.group.outputs.is_group }}
          APP_TOKEN_WORKFLOWS: ${{ env.APP_TOKEN_WORKFLOWS }}
        # Tier high (claude-opus-5, max-turns alti): issue funnel-critical — crawler/parser/
        # build-plugin/workflow CI/test gate, o uno script che MUTA/emette dati
        # indicizzati (backfill/migrate/assemble/sitemap/canonical/slug/
        # structured-data/seo). Bug lì = rischio propagato su ogni merge → probing
        # rigoroso paga. Tier normal per il resto (stesso modello claude-opus-5,
        # unificato owner 2026-09-03: opus a effort medium, mai claude-sonnet-4-6; cambiano solo i turni). Mirror ESATTO di
        # pr-review-loop: il bare `scripts/` NON escala più (mandava ogni menzione
        # di script — inclusi helper `scripts/{ci,dev,evals}/` e audit/report
        # read-only — a opus@40; osservato 2026-06-04 come tier-breadth waste). Gli
        # script funnel restano high via i loro keyword semantici/path index-muting.
        #
        # Terza clausola (2026-07-06): analisi storica FIX_OUTCOME 5 settimane ha
        # mostrato max-turns in crescita costante (0%→24.5% W23→W27), dominato da
        # follow-up SEO/audit/validate-dist con titolo tipo `fix(seo-404): ...` /
        # `fix(seo-audit): ...` / `audit-dist-multi.mjs: ...` — NON matchano la
        # prima clausola (niente crawler/parser/build-plugin/workflows/test
        # gate/validator/migrator letterale) né la seconda (niente prefisso
        # `scripts/` nel titolo) → finiscono tier=normal (40 turni) nonostante
        # tocchino routing/locale/gate logic intricata quanto un crawler. Caso
        # concreto: #3481 "1 item deferred — fix(seo-404): case-insensitive
        # locale-prefix detection in inferLocale()" — già ridotto al singolo item
        # dal circuit-breaker aggregate, comunque max-turns. Aggiunta mirata
        # (seo-/audit-dist/validate-dist), non un bare `seo`/`audit` generico —
        # stesso principio anti-tier-breadth-waste della nota sopra.
        run: |
          set -euo pipefail
          # Prefetch bundle (token-lever, stesso pattern di tests.yml/pr-review-loop
          # "review-ctx"): questa issue serve qui per il tier E al prompt Claude
          # (step 3, "Carica la issue") come sua prima azione a pagamento — un solo
          # `gh issue view` invece di due, zero costo qui, un turno risparmiato là.
          mkdir -p "$CTX_DIR"
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,comments > "$CTX_DIR/issue.json"
          if [ "${IS_GROUP:-false}" = true ]; then
            if [ ! -r "$CTX_DIR/group.json" ] || ! jq -e 'type == "array" and length >= 2' "$CTX_DIR/group.json" >/dev/null; then
              echo "::error::contesto del gruppo B19 illeggibile durante il prefetch"
              exit 1
            fi
            body=$(jq -r '.[] | (.title + "\n" + (.body // "") + "\n" + ([.labels[]?.name] | join("\n")))' "$CTX_DIR/group.json")
          else
            body=$(jq -r '.title + "\n" + (.body // "") + "\n" + ([.labels[]?.name] | join("\n"))' "$CTX_DIR/issue.json")
          fi
          # Decision registry prefetch: il fixer deve ricevere le decisioni senza
          # spendere un turno per una lettura che può arrivare troncata. Il cap
          # è intenzionale: se il registro cresce oltre 12 KiB il run fallisce
          # qui, invece di riprodurre silenziosamente il difetto di contesto.
          DECISIONS_FILE="DECISIONS.md"
          DECISIONS_MAX_BYTES=12288
          if [ ! -f "$DECISIONS_FILE" ]; then
            echo "::error::decision registry missing: $DECISIONS_FILE"
            exit 1
          fi
          DECISIONS_BYTES=$(wc -c < "$DECISIONS_FILE")
          if [ "$DECISIONS_BYTES" -gt "$DECISIONS_MAX_BYTES" ]; then
            echo "::error::decision registry too large: $DECISIONS_BYTES bytes > $DECISIONS_MAX_BYTES-byte cap"
            exit 1
          fi
          {
            echo "decision_registry<<DECISION_REGISTRY_EOF"
            cat "$DECISIONS_FILE"
            echo "DECISION_REGISTRY_EOF"
          } >> "$GITHUB_OUTPUT"
          # Binding AGENTS contract prefetch: reuse the fail-closed section
          # extractor used by pr-redflag-fixer, so the fixer receives the
          # non-negotiables before Claude spends a turn reading the file.
          AGENTS_CONTRACT_FILE="AGENTS.md"
          AGENTS_CONTRACT_MAX_BYTES=12288
          if [ ! -f "$AGENTS_CONTRACT_FILE" ]; then
            echo "::error::AGENTS contract missing: $AGENTS_CONTRACT_FILE"
            exit 1
          fi
          if ! REDFLAG_DOC_ROOT=. node scripts/ci/redflag-doc-sections.mjs --agents-only > "$CTX_DIR/agents-contract.md"; then
            echo "::error::could not prefetch the binding AGENTS contract"
            exit 1
          fi
          AGENTS_CONTRACT_BYTES=$(wc -c < "$CTX_DIR/agents-contract.md")
          if [ "$AGENTS_CONTRACT_BYTES" -gt "$AGENTS_CONTRACT_MAX_BYTES" ]; then
            echo "::error::AGENTS contract too large: $AGENTS_CONTRACT_BYTES bytes > $AGENTS_CONTRACT_MAX_BYTES-byte cap"
            exit 1
          fi
          {
            echo "agents_contract<<AGENTS_CONTRACT_EOF"
            cat "$CTX_DIR/agents-contract.md"
            echo "AGENTS_CONTRACT_EOF"
          } >> "$GITHUB_OUTPUT"
          # Capability guard text (spostato qui da un ternario inline nel
          # prompt, #6688-followup 2026-08-30): lo stesso ternario espanso in YAML
          # gonfiava lo scalar `prompt:` di ~2000 char, e quel singolo step scalar
          # ha un tetto reale imposto da GitHub Actions — misurato empiricamente
          # tra 21.253 e 21.514 char (actionlint/PyYAML lo leggono come valido,
          # GitHub lo rifiuta come "workflow file issue" con ZERO job schedulati,
          # niente annotazione, solo il banner generico). Stesso testo, calcolato
          # in bash invece che nell'espressione: il prompt lo legge da un output.
          if [ "${APP_TOKEN_WORKFLOWS:-}" = "true" ]; then
            GUARD_TEXT='il push di questo run usa il token della GitHub App, e la risposta API del conio ha CONFERMATO `permissions.workflows == write` (letto, non dedotto dalla presenza del token): modificare file in `.github/workflows/**` è consentito e il `git push` passa. Trattali come qualunque altro file — non auto-bloccarti su quel path.'
          else
            GUARD_TEXT='il push di questo run NON ha lo scope `workflows`: o non esiste un token App, o il token è stato coniato ma il permesso `workflows` non risulta concesso sulla installazione (verificato leggendo `permissions` dalla risposta API). Dai path target estratti dal body: se il fix richiederebbe di modificare file in `.github/workflows/**` → il `git push` fallirebbe sempre (push di workflow rifiutato senza scope `workflows`) → niente PR. Allora NON implementare: posta un commento col diff/azione proposta + "blocco scope `workflows`: serve la GitHub App abilitata o mano umana" e TERMINA SUBITO.'
          fi
          {
            echo "capability_guard<<CAPABILITY_GUARD_EOF"
            echo "$GUARD_TEXT"
            echo "CAPABILITY_GUARD_EOF"
          } >> "$GITHUB_OUTPUT"
          # Stessa mossa, testo statico (nessun ternario): anche questo pezzo
          # viveva inline nel prompt e contribuiva al totale del blocco.
          SECRETS_NOTE='**I SEGRETI CI SONO** (decisione del proprietario del 2026-08-24, registro in DECISIONS.md): questo run carica Remote Config prima di partire, quindi `CF_API_TOKEN`, `POSTHOG_*`, `GEMINI_API_KEY`, `GITHUB_PAT` e gli altri ~90 parametri sono in `process.env`. Un fix che richiede una credenziale va IMPLEMENTATO, non documentato: `blocked-secrets` non è più un verdetto strutturale e va usato SOLO se leggi la variabile e la trovi davvero vuota — in quel caso dillo con il nome esatto della variabile mancante, perché è un difetto della mappa `RC_TO_ENV`, non un limite di capacità. Resta valido il freno sulle **repo-setting/branch-protection/admin-API** (es. `gh api .../branches/main/protection` → 403): là il PAT c'\''è ma il permesso è un'\''altra cosa, e vale ancora `blocked-admin-settings`. Razionale invariato: fare il fix completo per poi scoprire il blocco al push spreca ~1M token/run (vedi #983), quindi le capability si valutano a turno 1 — solo che ora la risposta sui segreti è «sì».'
          {
            echo "secrets_note<<SECRETS_NOTE_EOF"
            echo "$SECRETS_NOTE"
            echo "SECRETS_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$body" | grep -qiE 'crawler|parser|build-plugin|\.github/workflows/|test gate|validator|migrator' \
             || echo "$body" | grep -qiE 'scripts/[a-z0-9_./-]*(backfill|migrate|assemble|sitemap|canonical|slug|structured-data|seo|index)' \
             || echo "$body" | grep -qiE 'seo-[a-z0-9]|audit-dist|validate-dist'; then
            echo "tier=high" >> "$GITHUB_OUTPUT"
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
            # 40->50 (misurato 06-12): 44 run/7gg morti error_max_turns a
            # num_turns=41 (es. run 27386343034) = run opus intera bruciata,
            # 0 PR, issue ri-accodata -> retry = doppio burn. Il cap esiste
            # anti-runaway, non come budget di lavoro: tenerlo sopra il p99
            # osservato dei run sani.
            # 50->70 (2026-07-17, owner): bump fleet-wide di tutti i cap Claude
            # dopo l'ennesimo error_max_turns (pr-review-loop tier high, run
            # 29556645538) — stessa regola: cap sopra il p99, mai budget.
            echo "max_turns=70" >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
            # 30->40 (misurato 2026-06-12 post-#1919): 3 run tier=normal morti
            # error_max_turns al cap nella sola finestra 06:00-07:30Z (run
            # 27397873962/27399888568/27400421268, follow-up #1918/#1931) —
            # il bump #1919 copriva solo il tier high (40->50); il campione
            # 7gg aveva mostrato solo morti opus (bias). Stessa regola: cap
            # anti-runaway sopra il p99 dei run sani, non budget di lavoro.
            # 40->55 (2026-07-17, owner): bump fleet-wide, vedi tier high sopra.
            echo "max_turns=55" >> "$GITHUB_OUTPUT"
          fi
          echo "Fix tier: $(grep tier= "$GITHUB_OUTPUT" | head -1)"
          # Aggregate detection (deterministic, da titolo "N item deferred", N>=2).
          # Il parsing dei singoli item dal body è freeform/fragile → ci basiamo
          # sul COUNT nel titolo (affidabile) per attivare il circuit-breaker
          # one-item nel prompt (R3-A): il prompt-only R2-A non sempre teneva
          # (#1172 error_max_turns post-merge). is_aggregate guida l'istruzione
          # forte "fixa 1 item poi STOP".
          # `items?` (not just `item`): il titolo è LLM-generated dal template
          # FOLLOWUP.md; per N>=2 il fraseggio naturale è il plurale "2 items
          # deferred". Senza la `s?` opzionale il match fallisce → is_aggregate
          # falso negativo → circuit-breaker one-item no-op → error_max_turns su
          # aggregate (#1172-class, ~2M token). Cfr. #1201 item 1.
          N=$(printf '%s' "$body" | grep -oiE '[0-9]+ items? deferred' | head -1 | grep -oE '^[0-9]+' || true)
          # Fallback SWEEP/BATCH (2026-06-14): le issue "sweep" multi-target NON
          # usano il fraseggio "N items deferred" del template FOLLOWUP.md →
          # is_aggregate=false → circuit-breaker one-item MUTO → il fixer tenta
          # tutti i target e muore error_max_turns ANCHE a cap 50 (osservato
          # #1826 "Sweep: ~30 ... crawlers": 7 run bruciati, fu-attempt:2). Una
          # sweep e' multi-item by-definition: la cura e' decomposizione (fixa 1,
          # deferisci il resto), non un cap piu' alto. Cattura la keyword
          # sweep|batch|bulk + un conteggio ~?N di target plurali tipici; senza
          # conteggio leggibile tratta come aggregate minimo (N=2). I target-noun
          # sono ancorati (no match su "30 seconds"/"0 jobs" → niente falsi
          # positivi su issue single, verificato sui titoli reali del backlog).
          if [ -z "${N:-}" ] && printf '%s' "$body" | grep -qiE '\b(sweep|batch|bulk)\b'; then
            N=$(printf '%s' "$body" | grep -oiE '~?[0-9]+ +([a-z*-]+ +)?(crawler|file|page|parser|script|adapter|component|endpoint|workflow|job|company|landing)s?' | head -1 | grep -oE '[0-9]+' | head -1 || true)
            N=${N:-2}
          fi
          if [ "${N:-0}" -ge 2 ] 2>/dev/null; then
            echo "is_aggregate=true" >> "$GITHUB_OUTPUT"
            echo "agg_count=${N}" >> "$GITHUB_OUTPUT"
          else
            echo "is_aggregate=false" >> "$GITHUB_OUTPUT"
            echo "agg_count=0" >> "$GITHUB_OUTPUT"
          fi
          # Daily buckets are aggregates even when their current count is 1. The
          # fixer must select exactly the first stable open FU item; it never receives
          # permission to work the whole bucket or to group it with another issue.
          if [ -s "$CTX_DIR/issue.json" ] && jq -e '.title | test("^follow-up\\(daily:")' "$CTX_DIR/issue.json" >/dev/null 2>&1; then
            node --input-type=module - "$CTX_DIR/issue.json" >> "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          import { dailyBucketInfo, parseFollowupItems } from './scripts/ci/followup-resolution-match.mjs';
          const issue = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const info = dailyBucketInfo(issue.title || '');
          const items = parseFollowupItems(issue.body || '');
          const open = items.find((item) => item.id && item.state === 'open');
          console.log('is_daily_bucket=true');
          console.log(`daily_key=${info?.dailyKey || ''}`);
          console.log(`selected_item_id=${open?.id || ''}`);
          console.log(`is_aggregate=true`);
          console.log(`agg_count=${items.length}`);
          NODE
          else
            echo "is_daily_bucket=false" >> "$GITHUB_OUTPUT"
            echo "selected_item_id=" >> "$GITHUB_OUTPUT"
          fi
          echo "Aggregate: is_aggregate=$(grep is_aggregate= "$GITHUB_OUTPUT" | tail -1)"

      # A daily bucket is a one-item circuit.  Without a stable selected ID the
      # closing-ref step used to emit `Addresses #N` anyway, allowing Claude to
      # create a broad PR with no item mutex.  Fail before the fixer/action is
      # reached: no DAILY_ITEM_ID means no PR, and the sealed bucket remains queued
      # for the next deterministic retry.
      - name: Validate daily bucket item selection (fail closed)
        id: daily_item_guard
        if: steps.tier.outputs.is_daily_bucket == 'true'
        env:
          DAILY_ITEM_ID: ${{ steps.tier.outputs.selected_item_id }}
        run: |
          set -eu
          case "${DAILY_ITEM_ID:-}" in
            FU-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9])
              echo "daily item selezionato: ${DAILY_ITEM_ID}"
              ;;
            *)
              echo "::error::daily bucket senza DAILY_ITEM_ID stabile: nessuna PR verrà creata"
              exit 1
              ;;
          esac

      - name: Closing keyword for the PR body (zero-Claude)
        id: closing
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
          IS_GROUP: ${{ steps.group.outputs.is_group }}
          IS_DAILY: ${{ steps.tier.outputs.is_daily_bucket }}
          DAILY_ITEM_ID: ${{ steps.tier.outputs.selected_item_id }}
        # Il prompt scriveva `Closes #$ISSUE_NUMBER` INCONDIZIONATAMENTE. Su una
        # follow-up aggregata multi-item quella riga è esattamente ciò che
        # `pr-body-contract.yml` fallisce (blocco «Closes #N targeting a
        # multi-item follow-up aggregate»): la PR nasce ROSSA, e se passasse
        # chiuderebbe al merge un'aggregata con item ancora dovuti — mentre il
        # circuit-breaker qui sopra ne fa UNO per run. Successo reale due volte
        # il 2026-08-14: #5848 e #5862, entrambe corrette a mano dopo il rosso.
        #
        # Perché NON riusare `steps.tier.outputs.is_aggregate`: quel detector ha
        # un fallback sweep/batch con conteggio di target-noun che il gate non
        # ha, quindi i due possono dare risposte diverse sullo stesso input — ed
        # è la risposta del GATE che decide se la PR è rossa. Qui si chiama la
        # stessa `isAggregate()` che `pr-body-contract.yml` rispecchia, via
        # scripts/lib/pr-body-generator-contract.mjs. Generatore e giudice
        # condividono una sola definizione: non possono più litigare.
        #
        # Fail-open: qualunque errore → `Closes #N`, cioè il comportamento
        # precedente. Un'infrastruttura giù non deve trasformare una chiusura
        # legittima in una issue che resta aperta per sempre.
        run: |
          set -uo pipefail
          if [ "${IS_GROUP:-false}" = true ] && [ -s "$CTX_DIR/group.json" ]; then
            expected=$(jq 'length' "$CTX_DIR/group.json" 2>/dev/null || echo 0)
            refs=$(while IFS= read -r item; do
              printf '%s\n' "$item" | node scripts/lib/pr-body-generator-contract.mjs --closing-ref 2>/dev/null || true
            done < <(jq -c '.[]' "$CTX_DIR/group.json" 2>/dev/null))
            actual=$(printf '%s\n' "$refs" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
            if [ "$expected" -ge 2 ] && [ "$actual" = "$expected" ]; then
              {
                echo "closing_ref<<CLOSING_REF_EOF"
                printf '%s\n' "$refs"
                echo "CLOSING_REF_EOF"
              } >> "$GITHUB_OUTPUT"
              echo "Closing refs per gruppo ($actual issue): $refs"
              exit 0
            fi
            echo "::warning::closing refs di gruppo incompleti ($actual/$expected) → fallback alla issue leader"
          fi
          if [ "${IS_DAILY:-false}" = true ]; then
            ref="Addresses #${ISSUE_NUMBER}"
            if [ -n "${DAILY_ITEM_ID:-}" ]; then
              ref="${ref}"$'\nFollow-up item: '"${DAILY_ITEM_ID}"
            else
              echo "::warning::daily bucket #${ISSUE_NUMBER} senza primo item open leggibile — il fixer deve fermarsi senza PR"
            fi
            echo "closing-ref: daily bucket → $ref (mai Closes finché esistono item aperti)"
            {
              echo "closing_ref<<CLOSING_REF_EOF"
              printf '%s\n' "$ref"
              echo "CLOSING_REF_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=$(gh issue view "$ISSUE_NUMBER" --json number,title,body,labels 2>/dev/null \
                | node scripts/lib/pr-body-generator-contract.mjs --closing-ref 2>/dev/null) || ref=""
          if [ -z "$ref" ]; then
            ref="Closes #${ISSUE_NUMBER}"
            echo "closing-ref: fallback → $ref"
          fi
          echo "closing_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Closing ref: $ref"

      - name: Compose PR body contract for the prompt (zero-Claude)
        id: body_contract
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # PERCHÉ QUESTA PROSA NON STA PIÙ NELLO SCALARE `prompt:`. Oltre un
        # certo peso GitHub accetta il file ma lo rende con `jobs: []`: il
        # fixer smette di girare senza un rosso. Il testo qui sotto è
        # VERBATIM quello del passo 9 e arriva all'agente identico,
        # iniettato per espressione come già si fa per `agents_contract` e
        # `decision_registry` — fuori dallo scalare non pesa sul parsing,
        # dentro il prompt resta parola per parola. Accorciarlo per fare
        # spazio toglierebbe invece all'agente la tassonomia che
        # `pr-body-contract.yml` gli fa poi rispettare.
        run: |
          set -uo pipefail
          {
            echo "text<<BODY_CONTRACT_EOF"
            cat <<'BODY_CONTRACT_TEXT'
          Poi esegui `node scripts/ci/pr-body-check-gate.mjs --body-file "$BODY_FILE"` e chiama `gh pr create` solo se il comando termina con exit 0, usando `--body-file "$BODY_FILE"`. Lo step ha anche un wrapper deterministico su `gh`: una create senza body-file o con un body non conforme viene bloccata prima della chiamata remota; non usare un body inline.
          **La riga di chiusura qui sopra è già calcolata, copiala VERBATIM.** Non
          sostituirla con `Closes #$ISSUE_NUMBER` di tua iniziativa: se dice
          `Addresses #$ISSUE_NUMBER` è perché questa issue è una follow-up **aggregata
          multi-item**, e su quelle `pr-body-contract.yml` fallisce ogni `Closes` — la PR
          nasce rossa (successo reale: #5848 e #5862). `Addresses` non è una keyword
          GitHub, quindi non chiude niente al merge: è voluto, l'aggregata la chiude
          `reconcile-followups.mjs` quando TUTTI i suoi item risultano fatti, e il
          circuit-breaker qui sopra te ne fa fare uno solo. La riga esce da
          `scripts/lib/pr-body-generator-contract.mjs`, che usa la stessa `isAggregate()`
          che il gate rispecchia.
          Per un **daily bucket** la riga è sempre `Addresses #$ISSUE_NUMBER`, anche con
          un solo item: aggiungi inoltre `Follow-up item: FU-YYYY-MM-DD-NNN` con l'ID
          selezionato dal primo item `State: open`. Il reconciler marca quell'item done
          solo dopo evidenza, e mantiene aperto il bucket finché ogni item valido non è
          provato risolto.
          **Lo STATO LETTERALE è obbligatorio su OGNI bullet** e va scelto fra questi cinque,
          scritti esattamente così (AGENTS.md #8; `out of scope` / `follow-up` / `posposto`
          sono la tassonomia vecchia, ABOLITA — non usarli):
          - `in questa PR` — è già nel diff che stai per mergiare;
          - `PR concatenata #N` — con il NUMERO, altrimenti non è tracciabile, non chiude e non conta;
          - `per scelta` / `by construction` — è un no motivato, non un rinvio;
          - `blocked: <causa esterna reale>` — lavoro sospeso su una causa che non controlli.
          Perché non è cosmesi: `scripts/ci/followup-has-candidates.mjs` riapre come issue di
          follow-up ogni bullet `blocked: <causa tecnica>` **e ogni bullet senza stato**. Un
          bullet che dice solo «out of scope» torna indietro come issue nuova e rialimenta il
          backlog con lavoro già chiuso. Con lo stato giusto, non torna.
          BODY_CONTRACT_TEXT
            echo "BODY_CONTRACT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for resumable WIP branch (zero-Claude)
        id: resume
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Problem A (#4337, confermato via GitHub API + run log): prima di questo
        # fix commit+push+PR accadevano SOLO alla fine del flusso (dopo il gate
        # test) — se `--max-turns` si esauriva PRIMA, il container CI moriva e
        # NULLA veniva mai pushato: 71 turni, $6.58 spesi, edit reali a
        # `build-plugins/staticPagesPlugin.ts`, ma `fix/issue-4337` mai esistito
        # su GitHub (404). 100% del lavoro perso, retry costretto a ridiagnosticare
        # da zero senza sapere che un tentativo precedente era arrivato lì. Ora il
        # prompt fa un checkpoint WIP (commit+push) appena il fix è applicato,
        # PRIMA del gate test (vedi step 4 del prompt) — quindi un run morto dopo
        # quel punto lascia un branch `fix/issue-<N>` reale su origin. Questo step
        # lo rileva deterministicamente (zero token Claude) così il prompt (step 1)
        # sa se deve riprendere da lì invece di ricreare un branch fresh.
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          if git ls-remote --exit-code --heads origin "fix/issue-${ISSUE_NUMBER}" >/dev/null 2>&1; then
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "Branch fix/issue-${ISSUE_NUMBER} già presente su origin → resume da checkpoint WIP."
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "Nessun branch fix/issue-${ISSUE_NUMBER} su origin → fresh start."
          fi

      - name: Configure git identity
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          APP_TOKEN: ${{ env.APP_TOKEN }}
          APP_TOKEN_WORKFLOWS: ${{ env.APP_TOKEN_WORKFLOWS }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          # Instrada il push sul token della App, altrimenti il conio non serve a niente:
          # il `git push` che fa il fixer userebbe comunque la credenziale piazzata da
          # actions/checkout, cioè GITHUB_TOKEN, che lo scope `workflows` non ce l'ha.
          #
          # L'unset dell'extraheader NON è ridondante e non va tolto: actions/checkout
          # scrive `http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>`,
          # che ha la precedenza sullo `x-access-token:` nell'URL del remote — il push
          # tornerebbe silenziosamente al token sbagliato. È la trappola già documentata
          # in pr-redflag-fixer.yml, stessa causa, stesso rimedio.
          #
          # L'identità di push resta la App ogni volta che il token esiste: serve a far
          # ri-triggerare i workflow a valle (`<app>[bot]` ≠ `github-actions[bot]`), ed è
          # utile anche senza scope `workflows`. Quello che NON si deduce dalla presenza
          # del token è la CAPACITÀ sui file workflow — la dice APP_TOKEN_WORKFLOWS, letto
          # da `permissions` nella risposta di conio (#5288). Qui il log distingue i due
          # casi, così un push rifiutato si legge nei log senza dover indovinare.
          #
          # ATTENZIONE — questo step DA SOLO non basta, e per settimane si è creduto di sì.
          # `claude-code-action` RI-SCRIVE il remote appena parte: `configureGitAuth()` →
          # `replaceCheckoutCredentials()` fa un `git remote set-url origin
          # https://x-access-token:<suo-token>@github.com/...` incondizionato, sovrascrivendo
          # ciò che si è appena configurato qui. Il `git push` del fixer usa quindi il token
          # della action, non questo. L'unico modo per farlo restare è passarle
          # `github_token: ${{ env.APP_TOKEN }}` — vedi lo step `Run Claude fix`. Senza quello
          # le righe qui sotto sono vere solo fino all'avvio della action.
          if [ -n "${APP_TOKEN:-}" ]; then
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            if [ "${APP_TOKEN_WORKFLOWS:-}" = "true" ]; then
              echo "push identity: GitHub App (scope workflows CONFERMATO dalla risposta API)"
            else
              echo "push identity: GitHub App (permesso workflows NON concesso sull'installazione — .github/workflows/** resta non pushabile)"
            fi
          else
            echo "push identity: GITHUB_TOKEN (nessun APP_TOKEN — .github/workflows/** resta non pushabile)"
          fi

      - name: Setup Headroom compression proxy
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        uses: ./.github/actions/setup-headroom

      - name: Install deterministic PR body gate
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/pr-body-gate-bin"
          mkdir -p "$gate_dir"
          ln -sf "$GITHUB_WORKSPACE/scripts/gh-pr-body-check.mjs" "$gate_dir/gh"
          echo "$gate_dir" >> "$GITHUB_PATH"
          echo "PR_BODY_GATE_BIN=$gate_dir" >> "$GITHUB_ENV"

      - name: Run Claude fix
        # Tetto sullo step (classe #7310). Il cap del job è 360min e in pratica
        # non lega mai: il vincolo che morde è `--max-turns`, e la morte al cap
        # dei turni misurata sul run 33656771164 arriva a 934s. 120min stanno
        # molto sopra qualunque fix reale e lasciano 4h di margine al job, ma
        # tolgono il caso «run appesa che brucia 6h di runner e muore
        # `cancelled`», dove gli step di salvataggio WIP e di telemetria
        # perdono la coda per girare.
        timeout-minutes: 120
        id: claude_review
        if: steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Non far fallire il job sull'exit non-zero della CLI: lo step finale
        # `Classify outcome` decide il colore in base al LAVORO reale (PR aperta
        # per la issue), non al subtype della CLI. Un `error_max_turns` DOPO che
        # l'agent ha gia' aperto la PR (passo 9) NON e' un fallimento del run:
        # campione 7gg (#1951) = 4/11 fail issue-fix avevano una PR creata (3
        # gia' MERGED) ma la CLI moriva al cap turni DOPO `gh pr create` → job
        # RED = false-failure che gonfia il failure-rate del loop-health. Stessa
        # filosofia di #2514 (redflag-fixer): colore = work-done, non CLI exit.
        # I fail genuini (nessuna PR) restano RED via il classify → segnale
        # preservato per loop-health + followup-drainer. `outcome` resta
        # 'failure' (pre-continue-on-error) → i due step di telemetria sotto
        # (Mark error_max_turns / FIX_OUTCOME backstop) continuano a firare.
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          FIX_TIER: ${{ steps.tier.outputs.tier }}
          ISSUE_GROUP: ${{ steps.group.outputs.is_group }}
          ISSUE_GROUP_LABEL: ${{ steps.group.outputs.group_label }}
          ISSUE_GROUP_NUMBERS: ${{ steps.group.outputs.group_numbers }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # L'IDENTITÀ DI PUSH DEL FIXER. Senza questo input la action ne conia uno suo
          # (la App `claude`, cioè `claude[bot]`) e con quello RI-SCRIVE il remote:
          # `src/github/operations/git-config.ts` → `replaceCheckoutCredentials()` esegue
          # `git remote set-url origin https://x-access-token:<token>@github.com/...`
          # in modo incondizionato, buttando via il remote impostato da
          # `Configure git identity`. Risultato misurato sulla issue #5595 (2026-08-11):
          # il conio aveva loggato `workflows=write` e lo step aveva stampato
          # «scope workflows CONFERMATO», eppure il push moriva con
          #   ! [remote rejected] fix/issue-5595 -> fix/issue-5595 (refusing to allow a
          #     GitHub App to create or update workflow
          #     `.github/workflows/sync-articles-sitemaps.yml` without `workflows` permission)
          # — perché a pushare non era la App con lo scope, ma quella della action.
          # Il fix era già stato prodotto per intero (254 righe, 3 file) e si è perso al push,
          # sopravvivendo solo come commento sulla issue. Stessa forma di #5288: una
          # capacità dichiarata vera a monte e smentita a valle, con la CI verde.
          #
          # Perché `env.APP_TOKEN` NUDO e non un fallback su `secrets.GITHUB_TOKEN`:
          # quando il conio fallisce la variabile non è scritta, l'espressione rende `''`,
          # e `''` è ESATTAMENTE il ramo di default della action (`inputs.github_token == ''`
          # → conia il suo token e lo revoca a fine run) — cioè il comportamento di oggi,
          # invariato. Mettere `secrets.GITHUB_TOKEN` come fallback sarebbe invece una
          # REGRESSIONE: gli eventi generati da GITHUB_TOKEN non ri-attivano i workflow a
          # valle (anti-ricorsione), quindi `tests` e `pr-review-loop` non partirebbero
          # più sulle PR del fixer e ogni PR resterebbe ferma senza review.
          github_token: ${{ env.APP_TOKEN }}
          codex_github_token: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          show_full_output: true
          # Whitelist esplicita (hardening #898): mai `*`. I sender bot legittimi
          # del trigger sono `claude[bot]` (cascade fix → re-trigger) e
          # `github-actions[bot]` (re-label interno). Il PAT user `valerielinc-ops`
          # è un account umano → bypassa `allowed_bots`, già coperto dal gate `if`.
          allowed_bots: 'github-actions[bot], claude[bot], frontaliere-automation[bot]'
          # 2026-07-02: --dangerously-skip-permissions sostituisce --allowedTools scoped
          # (rationale completo: post-merge-followup.yml claude_args comment, stesso
          # fix, evita drift tra copie duplicate).
          claude_args: "--effort medium --max-turns ${{ steps.tier.outputs.max_turns }} --model ${{ steps.tier.outputs.model }} --dangerously-skip-permissions"
          prompt: |
            Sei l'agent di fix autonomo per la issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"). Tier: ${{ steps.tier.outputs.tier }}.

            **Raggruppamento B19:** `group=${{ steps.group.outputs.is_group }}`, membri `${{ steps.group.outputs.group_numbers }}`. Se `group=true`, carica `${{ runner.temp }}/issue-fix-ctx/group.json`: contiene tutte le issue della stessa PR, già verificate dal drainer con una firma e un punto di riparazione comuni, entro il tetto numerico definito da `ISSUE_GROUP_MAX_SIZE`. Diagnostica ogni membro e risolvi tutti i membri nella stessa PR; non prendere lavoro esterno al gruppo. Nel body della PR usa una riga di chiusura per ogni membro, una keyword per riga, usando le righe pre-calcolate dallo step `closing`. Se un membro non è confermabile o non è riparabile con certezza, non forzarlo: lascialo senza keyword di chiusura e dichiaralo in `## Non implementato (ancora)` con uno stato letterale. Se `group=false`, il flusso resta quello della issue singola.

            **Contratto vincolante di `AGENTS.md` (prefetch zero-Claude):**
            Il workflow ha già iniettato qui sotto le sezioni `Non-Negotiables` e `Privacy` dal checkout corrente. Sono la fonte vincolante per questo run: non spendere un turno per rileggerle e TERMINA se il blocco manca o appare incompleto.
            ${{ steps.tier.outputs.agents_contract }}

            **Bootstrap (in quest'ordine):**
            1. Leggi `ISSUES.md` → "Fix flow" — contratto operativo del fixer.
            2. Il contratto vincolante di `AGENTS.md` è già iniettato sopra. Leggi da `AGENTS.md` solo le sezioni operative necessarie, inclusa l'architettura, dopo aver caricato il contratto.
            2b. Leggi `VISION.md` per i driver di decisione: quando un driver copre una scelta (D1-D8), DECIDI e procedi citandolo nel body della PR. La sezione «Sempre umano» è stata RIMOSSA il 2026-08-24 (istruzione diretta del proprietario): nessuna categoria di business — LPD, denaro, invii massivi, ritiro editoriale, scope, infra irreversibile inclusi — richiede più un'approvazione preventiva. Scala a `needs-human` SOLO un blocco di capacità reale (credenziale davvero assente, scope insufficiente, causa non trovata dopo indagine) — mai più per una decisione che il ciclo può prendere da sé.
            Il registro delle decisioni è stato precaricato deterministicamente dal workflow (zero-Claude) e va trattato come fonte vincolante; non cercare il file e non ri-chiedere ciò che è già deciso:

            ### Registro delle decisioni del proprietario (iniettato dal workflow)
            ${{ steps.tier.outputs.decision_registry }}
            3. Carica la issue con `Read` da `${{ runner.temp }}/issue-fix-ctx/issue.json` (prefetchata dallo step "Determine fix tier", stessi campi). Solo se manca/è vuoto: fallback `gh issue view $ISSUE_NUMBER --json number,title,body,labels,comments`. Se `group=true`, leggi anche `${{ runner.temp }}/issue-fix-ctx/group.json` e tratta ogni record come una issue da chiudere nella stessa PR: la diagnosi deve confermare il punto di riparazione comune, non limitarsi alla label.

            **Pre-condizioni (abort se falliscono):**
            - Se esiste già una PR aperta che cita "#$ISSUE_NUMBER" (`gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number`) → posta commento "PR già in volo: #<n>, skip." e TERMINA. No doppioni.
            - **Overlap-file** (no race su lavoro in corso): estrai i path target dal body della issue (file citati in `## Suggested action` / `## Item` / blocchi codice). Per ogni PR aperta (`gh pr list --state open --json number,title`) confronta i suoi file (`gh pr diff <n> --name-only`) coi target: se una PR aperta **modifica già** uno dei file target → posta commento "File `<path>` già in volo nella PR #<n> (<title>) — skip per evitare conflitto/duplicazione; riaprire l'auto-fix dopo il merge se ancora pertinente." e TERMINA. Razionale: un'altra PR può riscrivere quel file rendendo il fix moot o conflittuale (es. #934 hardening vs #943 rewrite di `submit-indexnow-batch.yml`). Nel dubbio (issue non file-specifica) → procedi.
            - **Capability guard (valuta SUBITO, prima di implementare — risparmio token):** ${{ steps.tier.outputs.capability_guard }} ${{ steps.tier.outputs.secrets_note }}

            - **Stati già dichiarati nei residui (leggi PRIMA di implementare):** se la issue nasce da una PR (follow-up, `Addresses`/`da PR #N` nel body), leggi il body di quella PR e classificane i residui. In quest'ordine:
              1. `gh pr view <N> --json body -q .body > /tmp/pr-body.md`.
              2. `git fetch --no-tags --depth=1 origin main`, poi recupera **sia** `scripts/lib/pr-body-sections-check.mjs` **sia** `scripts/ci/lib/false-positive-declaration.mjs` mantenendo la STESSA struttura relativa: `mkdir -p /tmp/s/lib /tmp/s/ci/lib && git show FETCH_HEAD:scripts/lib/pr-body-sections-check.mjs > /tmp/s/lib/pr-body-sections-check.mjs && git show FETCH_HEAD:scripts/ci/lib/false-positive-declaration.mjs > /tmp/s/ci/lib/false-positive-declaration.mjs` — il primo importa il secondo con un percorso relativo, quindi appiattirli in un file solo rompe l'import (`ERR_MODULE_NOT_FOUND`). **Il modulo va risolto da `main`, MAI dal checkout corrente:** col `resume=true` del passo 1 questo container è su un branch `fix/issue-*` che può essere nato PRIMA di #5916, dove `bulletState` non è esportato (o il file non c'è) e l'import muore quando i turni di diagnosi sono già spesi.
              3. importa `file:///tmp/s/lib/pr-body-sections-check.mjs` ed esegui `extractSection(body, NON_IMPL_ANCORA_RE)` → `sectionBullets(sezione)` → `bulletState(bullet)`. **NON scrivere un secondo parser** né una regex tua: `NON_IMPL_ANCORA_RE` è l'header canonico che `extractSection` pretende come argomento, `sectionBullets` applica `stripNonContent` — senza di lui gli ESEMPI di tassonomia dentro un blocco fenced del body vengono letti come stati dichiarati — e `scripts/ci/followup-has-candidates.mjs` giudica con le stesse funzioni: riscriverle a mano le fa divergere in silenzio.
              **Quali stati CHIUDONO un item — `blocked:` NON è monolitico.** La lista canonica è `CLOSING_STATES` di `followup-has-candidates.mjs`: chiudono `in questa PR`, `PR concatenata #N`, `per scelta`, `by construction` e `blocked: decisione del proprietario`. I primi due sono lavoro già tracciato, gli ultimi tre un NO motivato. NON chiude `blocked-technical`, cioè ogni altro `blocked: <causa>`, che resta lavoro dovuto e va trattato normalmente; e `PR concatenata` senza il `#N` non chiude: è lavoro aperto. Leggi la CAUSA, non il prefisso.
              **Due controlli prima di onorare il veto.** `bulletState` vince sull'occorrenza più a SINISTRA: verifica sul testo del bullet che (a) le parole dello stato non stiano dentro una negazione — «il floor non è a 3 per scelta ma per un limite dell'API, il fix vero arriva in questa PR» viene classificato `by-choice` mentre dichiara l'opposto — e che (b) il MOTIVO venga DOPO lo stato. Una menzione nuda di `per scelta` o `by construction`, senza motivo, non è una chiusura: l'item resta aperto. Il veto vale solo per il bullet che copre il TEMA dell'item, mai per uno che gli somiglia.
              **Cosa fare quando il veto regge.** Non implementare, e posta un commento che cita il bullet verbatim e lo stato letto. Issue SINGOLA → TERMINA con `<!-- FIX_OUTCOME: already-fixed -->`. Aggregata → salta quell'item e passa al successivo in-capability; **se li salti TUTTI, l'ultimo commento deve comunque portare quel marker**, mai il terminale generico: senza, `scripts/ci/followup-drainer.mjs` scarta il backstop, la issue rientra in coda e la stessa aggregata brucia un run Claude a ogni giro fino a `fu-parked`.

            **Daily bucket:** se il titolo usa il protocollo daily, lavora SOLO l'item selezionato `${{ steps.tier.outputs.selected_item_id }}` (primo `State: open`); mai `Closes`.

            **Follow-up aggregata multi-item — is_aggregate=${{ steps.tier.outputs.is_aggregate }} (count=${{ steps.tier.outputs.agg_count }}):** se `is_aggregate=true` questa issue ha ${{ steps.tier.outputs.agg_count }} item distinti e tentarli TUTTI in un run sfora il turn budget → `error_max_turns` → 0 PR, ~2M token persi (osservato #1095/#1101/#1172). **REGOLA FERREA (circuit-breaker):** fixa **ESATTAMENTE UN item** poi FERMATI (per una issue *sweep/batch* "item" = UN singolo target/file: es. "~30 crawlers" → fixa 1 crawler, deferisci gli altri 29). Procedura: (a) capability guard **PER-ITEM** — salta gli item che toccano `.github/workflows/**`/admin/secret (NON abortire l'intera issue), (b) scegli il PRIMO item in-capability a massimo valore funnel, (c) implementa SOLO quello, (d) **appena la PR per quell'unico item è aperta → STOP IMMEDIATO, non iniziare un secondo item** (anche se hai turni residui), (e) elenca tutti gli altri item in `## Non implementato (ancora)`, ognuno con lo STATO LETTERALE del passo 9 (per un item deferito a un ciclo successivo: `blocked: <causa>` se sospeso su una causa esterna, altrimenti `PR concatenata #N` quando il numero esiste). **Due errori di stato che non convergono mai, in direzioni opposte:** un item che hai saltato perché uno stato CHIUDENTE della PR d'origine lo copre va ri-elencato con QUELLO stato (`per scelta` / `by construction` / `blocked: decisione del proprietario`) — riscritto come `blocked: <causa tecnica>` viene riaperto da `followup-has-candidates.mjs` a ogni ciclo, per sempre; e viceversa non dare MAI uno stato chiudente a un item che stai solo rimandando, perché lo toglie dalla coda e il ciclo lo perde. → `post-merge-followup` li ri-accoda come nuova follow-up (re-queue esistente; ogni ciclo chiude ≥1 item → converge). Se `is_aggregate=false`: issue singola, comportamento invariato (capability guard whole-issue come sopra). Razionale: il budget di turni basta per 1 item con margine; 2+ item lo bruciano.

            **Fix flow (vedi ISSUES.md):**
            1. Branch isolato — **resume-aware** (`resume=${{ steps.resume.outputs.resume }}`): se `resume=false`, `git checkout -b fix/issue-$ISSUE_NUMBER` (fresh, come sempre). Se `resume=true` esiste già un branch `fix/issue-$ISSUE_NUMBER` su origin (lasciato da un run precedente morto per max-turns DOPO il checkpoint WIP, vedi step 4) — fai `git fetch origin fix/issue-$ISSUE_NUMBER && git checkout fix/issue-$ISSUE_NUMBER` invece di ricreare da zero. Ispeziona cosa c'è già (`git log --oneline origin/main..HEAD --stat`): se il diff è pertinente alla issue corrente, CONTINUA da lì (non ridiagnosticare/rifare il lavoro già presente). Se il diff sembra stale/scollegato dal body della issue attuale → `git reset --hard origin/main` e riparti pulito — usa giudizio, non è un automatismo cieco.
               **Questo container CI è GIÀ un checkout isolato monouso** (step `Checkout` in cima al workflow, `actions/checkout@v5` fresh a ogni run). **NON creare un worktree interno `.claude/worktrees/**` qui**: la regola "worktree-first" di `AGENTS.md`/`CLAUDE.md` esiste per sessioni interattive locali con un `main` condiviso — non si applica in un container CI già isolato, e crearne uno dentro non aggiunge isolamento, brucia solo turni rifacendo la meccanica del checkout (osservato #4263: ~6 turni finali sprecati su un ciclo `git diff` → patch → fetch → `.claude/worktrees/... add` → apply mai completato, 0 PR). Lavora direttamente nella root del checkout.
            2. Diagnosi root cause della issue (NON sintomo). **Scorciatoia scheda (issue da decomposizione):** se il body o un commento contiene una sezione `## Scheda` (issue nata dallo stadio `issue-decompose`, tipicamente label `from-decompose`), la scheda È la diagnosi già fatta — verifica la CAUSA in ≤3 turni col COMANDO della METRICA; se regge, salta direttamente al passo 3 e usa la METRICA come criterio di verifica del fix e l'OSSERVATORE come test da aggiungere. Se la verifica smentisce la CAUSA, prosegui con la diagnosi normale e dichiaralo nel commento finale. **Scorciatoia segnali (issue da reporter zero-Claude, ISSUES.md → "Contratto minimo"):** se il body contiene `## Segnali (raccolti automaticamente)`, NON è una diagnosi (nessuna CAUSA) — ma il `Comando di riproduzione` verifica lo stato attuale in un turno invece di ricostruirlo, `Metrica` dà osservato/atteso come criterio di successo, `Evidenza` punta a dove guardare. Usali per saltare la scoperta iniziale, poi diagnostica la CAUSA normalmente. Per categoria `crawler`: il selector è driftato → rigenera/aggiusta il parser; preferisci `node scripts/generate-company-parser.mjs` o l'edit mirato del parser/config citato nel body. **Turn-budget:** se dopo ~15 turni di esplorazione non emerge una root cause chiara, NON continuare a scavare sullo stesso vicolo cieco — restringi lo scope (issue aggregate: scegli un item più semplice, vedi circuit-breaker sopra) o termina pulito con l'outcome `no-root-cause` (già definito in fondo al prompt) invece di bruciare il resto del budget senza convergere.
            3. Applica fix CHIRURGICO alla **CLASSE del bug, NON al singolo file** (AGENTS.md non-negotiable #6): no drive-by refactor / no speculative abstraction, MA per un fix di pattern (regex/replace/guard/floor/threshold/selector/bullet-idiom) `rg`/`grep` i sibling funnel-critical (`scripts/update-*.mjs`, `scripts/lib/*-parser.mjs`, `build-plugins/**`) per lo STESSO costrutto → sweepa l'intera classe nella STESSA PR, oppure giustifica OGNI sibling non toccato in `## Non implementato`. Toccare i file gemelli con lo stesso antipattern NON è drive-by: è il fix completo. Pre-empt del 🔴 reviewer "stesso antipattern nel file gemello" (osservato #1083/#1073 il 2026-06-02: PR mono-file → 🔴 sibling → 2 cicli review+fix sprecati sulla quota Max condivisa).
            4. **Checkpoint WIP — commit+push IMMEDIATO (anti-100%-loss, #4337):** appena il fix del passo 3 è applicato (anche se non ancora testato dal gate del passo 6), committa tutto con `git add -A && git commit -m "wip(issue-$ISSUE_NUMBER): checkpoint pre-test"` e pusha SUBITO: `git push -u origin fix/issue-$ISSUE_NUMBER`. **Perché ORA:** prima di questo cambio commit+push+PR accadevano SOLO a fine flusso — un run morto per `--max-turns` prima di arrivarci perdeva il 100% del diff col container (#4337: 71 turni, $6.58, edit reali a `build-plugins/staticPagesPlugin.ts`, branch mai pushato, 404 su GitHub). Con questo checkpoint, se il run muore DOPO questo punto il branch sopravvive su GitHub col diff reale — recuperabile dal prossimo retry via la resume-logic del passo 1, invece di una perdita totale.
            5. Mai abbassare quality gate/test/validation per "far passare" (non-negotiable #1).
            6. **Gate test pre-PR (anti re-review — OBBLIGATORIO):** gira UNA VOLTA i test che coprono l'area toccata: `npx vitest run <path/glob pertinente al code modificato>` (es. fix a un parser → `npx vitest run tests/<area>`). Verde → procedi al passo 7. Rosso → NON ri-lanciare l'intero file/suite da capo: rigira SOLO il test fallito con `-t <pattern che matcha il nome del test>`, fixa la root cause, ri-verifica scoped, ripeti finché verde. NON girare la suite intera col `npm test` cieco: qui manca `data/jobs.json` (lo assembla la CI `tests`) → sarebbe rossa per infra, non per il tuo fix; se il tuo cambiamento tocca l'assembly dati gira prima `node scripts/assemble-jobs-dataset.mjs`. NON lanciare un `npx tsc --noEmit` full-repo a meno che il fix tocchi davvero type definitions condivise ampiamente (`types/`, interfacce esportate cross-modulo) — per un fix scoped il vitest sull'area toccata basta. **Perché la tightening:** #4263 (aggregate già ristretto a 1 item dal circuit-breaker) ha bruciato il budget 50 turni su ~25 di diagnosi + DUE pass completi di `npx vitest run` sull'intero file + un `npx tsc --noEmit` full-repo + ~6 turni finali di un ciclo patch→worktree mai completato (vedi passo 1) — zero PR consegnata. Test scoping disciplinato = turni per il fix vero, non per ripetere verifiche già fatte. La review Claude ora parte SOLO dopo `tests` verde (gate `pr-review-loop` su `workflow_run[tests]==success`): una PR coi test rossi non riceve review e resta ferma — spreco di un ciclo.
            7. Commit (SOLO se ci sono cambi oltre il checkpoint WIP del passo 4, es. fix ai test rossi del passo 6): identity canonica già configurata, messaggio conventional, in fondo nessuna email non-canonica. Se dal passo 4 non è cambiato altro, questo passo è un no-op — non serve squashare: una storia wip+fix sul branch va bene.
            8. Push (aggiorna il branch già pushato al passo 4 col commit più recente, se presente): `git push -u origin fix/issue-$ISSUE_NUMBER`.
            9. Apri PR con `gh pr create`. Body OBBLIGATORIO (REVIEW.md completeness contract). Prepara prima il body completo nel file assoluto `$RUNNER_TEMP/issue-fix-pr-body.md` (imposta `BODY_FILE` a quel path), senza passarlo inline:
               ```
               ## Implementato
               - <cosa fa il fix>
               ${{ steps.closing.outputs.closing_ref }}

               ## Non implementato (ancora)
               - <scope NON fatto> — <STATO LETTERALE>
               ```
               ${{ steps.body_contract.outputs.text }}
            10. La PR entra automaticamente in `pr-review-loop` → review → `## LGTM` → `auto-merge-on-lgtm`. NON mergiare a mano.

            **Constraint:**
            - Changes chirurgiche, root-cause, una issue alla volta.
            - Mai toccare file fuori scope della issue — **eccetto i sibling della STESSA classe del bug** (#6, passo 3): quelli SONO in scope e vanno sweepati nella stessa PR. "Fuori scope" = un'altra feature/area, NON un file gemello con lo stesso antipattern (es. fixare il bullet-idiom in 1 parser e lasciarlo rotto negli altri 16 = fix incompleto, non "rispetto dello scope").
            - **CODE vs DATA — no scroll dei blob (ISSUES.md → "CODE vs DATA", mirror #1096 del reviewer):** i file rigenerati `data/**` (job JSON, snapshot, translation-cache, blog-articles), `public/**` (asset), `reports/**`, `_newsletter_variants/**` NON sono code da leggere riga-per-riga. Se la root cause è un drift di output dati → fixa il CODE che li genera (parser/crawler/build-plugin), non `cat`/scorrere il blob né editarlo a mano. Campione → `Read` mirato (offset/limit). `rg`/`grep` scopati al code: `rg <pattern> scripts build-plugins components services -g '!data/**' -g '!public/**' -g '!reports/**'` — cercare nei blob dati = token bruciati. Eccezione: un `data/**` config/fixture checked-in editato a mano dal fix.
            - Mai disabilitare AdSense Auto Ads (non-negotiable #7).
            - Mai committare path home assoluti o email personali (Privacy).
            - Se la root cause non è determinabile con confidenza → NON forzare un fix; posta su issue "Root cause non determinata: <cosa hai trovato>. Serve indagine umana." rimuovi nulla e TERMINA senza PR.
            - Se il fix richiede una credenziale, USALA: Remote Config è caricato in questo run (decisione del 2026-08-24). Termina con `blocked-secrets` solo se la variabile che ti serve è davvero vuota in `process.env`, e nominala.
            - **Telemetria outcome (OBBLIGATORIO):** ogni volta che termini, l'ULTIMO commento che posti sulla issue DEVE iniziare con un marker HTML su riga propria: `<!-- FIX_OUTCOME: <code> -->`. `<code>` ∈ `pr-created` (PR aperta) · `blocked-workflows-scope` · `blocked-secrets` · `blocked-admin-settings` · `no-root-cause` · `overlap-skip` · `pr-already-open` · `already-fixed` · `revenue-tracker-manual`. Se apri una PR (passo 9) e non posti altri commenti, aggiungi comunque un commento col solo marker `<!-- FIX_OUTCOME: pr-created -->`. Il lessons-harvester aggrega questi marker per rilevare classi di blocco ricorrenti e proporre migliorie ai doc/prompt (vedi ISSUES.md → "Auto-improvement loop").

      - name: Salva il lavoro parziale (WIP checkpoint deterministico, zero-Claude)
        # PERCHÉ ESISTE (misurato il 2026-08-24). Il checkpoint WIP c'era già —
        # ma come PASSO DEL PROMPT (passo 4), cioè affidato alla scelta
        # dell'agente. Un run che muore per `error_max_turns` muore proprio
        # quando non ha più turni per eseguirlo, quindi l'istruzione arriva
        # esattamente quando non può più essere seguita. Sulle 29 issue del sito
        # parcheggiate con verdetto `max-turns`, **20 non hanno alcun branch
        # `fix/issue-N` su origin**: il diff è morto col container, ed è lo
        # stesso modo in cui #4337 ha perso 71 turni e $6.58 di edit reali.
        #
        # Questo step è la metà deterministica: gira `if: always()`, dopo Claude
        # e prima di qualunque telemetria, quindi coglie l'albero di lavoro anche
        # quando la CLI è stata uccisa. La resume-logic del passo 1 del prompt
        # esiste già e sa riprendere da `fix/issue-N`: senza questo step non
        # aveva quasi mai un branch da riprendere.
        #
        # NON tocca niente quando c'è già una PR (il lavoro è consegnato) e
        # quando l'albero è pulito e non c'è nulla davanti a origin/main (non
        # c'era lavoro da salvare). Best-effort in senso stretto: qualunque
        # fallimento è un warning, mai un job rosso — un salvataggio mancato non
        # deve trasformare un run terminato in un run fallito.
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ env.APP_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          BRANCH="fix/issue-$ISSUE"

          PR_STATE=$(gh pr list --head "$BRANCH" --state all --json state             --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | length' 2>/dev/null || echo 0)
          if [ "${PR_STATE:-0}" != "0" ]; then
            echo "wip-salvage: PR già aperta/mergiata su $BRANCH → il lavoro è consegnato, niente da salvare."
            exit 0
          fi

          # Il branch di lavoro può non essere quello corrente se l'agente è
          # morto prima del checkout: in quel caso si crea qui.
          CUR=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo HEAD)
          if [ "$CUR" != "$BRANCH" ]; then
            git checkout -B "$BRANCH" >/dev/null 2>&1 || true
          fi

          DIRTY=$(git status --porcelain 2>/dev/null | head -c 1)
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ -z "$DIRTY" ] && [ "${AHEAD:-0}" = "0" ]; then
            echo "wip-salvage: albero pulito e 0 commit davanti a origin/main → nessun lavoro da salvare."
            exit 0
          fi

          if [ -n "$DIRTY" ]; then
            # `git add -A` e non un elenco: qui non si sa cosa l'agente ha
            # toccato, ed è proprio ciò che va conservato. Il checkout di questo
            # job non è sparse (lo è solo nei worktree locali), quindi non c'è
            # il rischio di perdere modifiche fuori dal cono.
            git add -A
            git commit -q -m "wip(issue-$ISSUE): checkpoint automatico di un run terminato senza PR"               -m "Salvato da issue-fix.yml (step deterministico), non dall'agente: il run è finito senza aprire una PR e senza eseguire il checkpoint del prompt — il caso tipico è error_max_turns, che finisce i turni proprio prima di poterlo fare."               -m "Run: $RUN_URL" || echo "wip-salvage: commit vuoto o rifiutato, continuo."
          fi

          # Ri-applica l'identità di push: dopo claude-code-action il remote può
          # portare la sua credenziale, e l'extraheader di actions/checkout ha
          # comunque la precedenza sull'URL (stessa trappola documentata in
          # 'Configure git identity').
          if [ -n "${APP_TOKEN:-}" ]; then
            git config --unset-all http."https://github.com/".extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
          fi

          if git push -u origin "$BRANCH" 2>&1 | tail -3; then
            SHA=$(git rev-parse --short HEAD)
            FILES=$(git diff --name-only origin/main..HEAD | head -20)
            N=$(git diff --name-only origin/main..HEAD | wc -l | tr -d ' ')
            echo "wip-salvage: $BRANCH pushato ($N file, $SHA)."
            {
              echo "💾 **Lavoro parziale salvato** (step deterministico di \`issue-fix\`, zero-Claude)"
              echo
              echo "Questo run è terminato senza aprire una PR, quindi il diff che aveva in mano sarebbe morto col container. È stato committato e pushato su \`$BRANCH\` (\`$SHA\`, $N file):"
              echo
              echo '```'
              echo "$FILES"
              echo '```'
              echo
              echo "Il prossimo tentativo **riprende da qui** invece di ripartire da zero (resume-logic del fixer). Se il diff non è pertinente, il fixer lo scarta da sé con un \`git reset --hard origin/main\`."
              echo
              echo "Run: $RUN_URL"
            } > /tmp/wip-note.md
            gh issue comment "$ISSUE" --body-file /tmp/wip-note.md >/dev/null 2>&1               || echo "::warning::wip-salvage: commento sulla issue non postato (il branch però è salvo)."
          else
            echo "::warning::wip-salvage: push di $BRANCH fallito — il lavoro resta solo nel container e andrà perso."
          fi

      - name: Mark autonomous PR provenance (zero-Claude)
        # `fix/*` identifies the deterministic fixer path. Persist the same
        # provenance label explicitly so downstream reviewer/fixer jobs do not
        # have to guess from the owner author alone. The local `/fix-issue`
        # command applies this label after its own PR creation.
        if: always() && steps.claim.outputs.claim_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --repo "$REPO" --head "fix/issue-$ISSUE" --state open --json number,createdAt \
            --jq 'sort_by(.createdAt) | last | .number // empty' 2>/dev/null || true)
          if [ -z "${PR:-}" ]; then
            echo "provenance: nessuna PR aperta su fix/issue-$ISSUE da marcare."
            exit 0
          fi
          gh label create agent:autofix --repo "$REPO" --color 1d76db \
            --description 'PR prodotta dal loop autonomo issue-fix' --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$REPO" --add-label agent:autofix
          echo "provenance: PR #$PR marcata agent:autofix."

      - name: Claude usage metrics
        # Run only when the Claude fallback actually ran and produced an execution file.
        if: always() && steps.claude_review.outputs.claude_used == 'true' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        # Exact token/cost for this run (replaces estimates). Writes a table to
        # the run Step Summary + a grep-able CLAUDE_USAGE line to the log.
        # Best-effort: never fails the job.
        run: node scripts/ci/claude-usage-summary.mjs "${{ steps.claude_review.outputs.execution_file }}" "issue-fix"

      - name: Mark Claude terminal outcome (granular telemetry, pre-backstop)
        # Quando la run Claude muore PRIMA di poter postare il proprio verdetto,
        # NON lascia un marker FIX_OUTCOME → il backstop sotto posta un generico
        # `no-pr-unspecified` che il drainer IGNORA (BACKSTOP_MARKER) → l'item
        # viene trattato come orfano ri-tentabile e ri-accodato fino a
        # MAX_ATTEMPTS. Questo step emette il marker GRANULARE (senza
        # BACKSTOP_MARKER → il drainer lo VEDE) così il recupero è corretto per
        # causa. Gira PRIMA del backstop, che quindi trova il marker e si salta.
        #
        # Due terminal outcome, entrambi deterministici dall'execution file:
        #  • `error_max_turns` → marker `max-turns`: il budget di turni è esaurito
        #    in modo riproducibile → il drainer parka subito con `needs-human`.
        #  • HTTP 429 (quota Max esaurita) → marker `rate-limited` + beacon
        #    `<!-- QUOTA_RESETS_AT: … -->`. **È il caso dominante e prima non era
        #    coperto**: misurato 2026-08-05 sulle 61 run fallite della finestra
        #    7gg, 60 sono 429 e ZERO sono error_max_turns. Il payload di un 429
        #    porta `"subtype": "success"` con `is_error: true`, quindi il vecchio
        #    gate subtype-only non scattava mai e la issue finiva ri-accodata 3×
        #    contro la stessa quota esaurita → `fu-parked` → age-out close, senza
        #    che nessun agent l'avesse mai letta (0 turni, $0). Catena assorbente
        #    completa in scripts/ci/claude-rate-limit.mjs.
        #
        # Gli altri failure (5xx transienti, crash infra) restano SENZA marker →
        # legittimamente ri-tentabili dal rescue. Nessuna falsa escalation.
        # Best-effort, mai fa fallire il job.
        if: always() && steps.claude_review.outputs.claude_used == 'true' && steps.claude_review.outcome == 'failure' && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          EXEC_FILE: ${{ steps.claude_review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: issue-fix
        run: node scripts/ci/mark-claude-terminal-outcome.mjs

      - name: Emit FIX_OUTCOME telemetry (deterministic backstop)
        # Skip on short-circuit: the pre-flight gate already posted the granular
        # `<!-- FIX_OUTCOME: already-fixed -->` marker (preflight) or
        # `<!-- FIX_OUTCOME: blocked-workflows-scope -->` marker (scope_guard, #4227);
        # this coarse backstop would otherwise post `no-pr-unspecified` and poison the
        # lessons-harvester signal. (The step's own `HAS` check below is belt-and-
        # suspenders for the same reason — this `if:` avoids the extra `gh` round-trip.)
        # The agent SHOULD post a granular `<!-- FIX_OUTCOME: <code> -->` marker,
        # but prompt-emitted markers are unreliable (observed: #974 ran with the
        # marker prompt on main yet posted none). This backstop guarantees the
        # lessons-harvester always has a queryable marker: pr-created if this run
        # opened a PR on fix/issue-<N>, else a coarse no-pr-unspecified. It never
        # overwrites the agent's own granular marker. Best-effort: never fails.
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          HAS=$(gh issue view "$ISSUE" --json comments --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME:"))] | length' 2>/dev/null || echo 0)
          if [ "${HAS:-0}" != "0" ]; then
            echo "FIX_OUTCOME marker already present (agent-posted) — no backstop needed."
            exit 0
          fi
          PR=$(gh pr list --head "fix/issue-$ISSUE" --state open --json number,createdAt \
            --jq 'sort_by(.createdAt) | last | .number // empty' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then OUT=pr-created; else OUT=no-pr-unspecified; fi
          echo "FIX_OUTCOME issue=$ISSUE outcome=$OUT (deterministic backstop)"
          gh issue comment "$ISSUE" --body "$(printf '<!-- FIX_OUTCOME: %s -->\n_Outcome rilevato dal post-step deterministico (telemetria lessons-harvester)._' "$OUT")" || true

      # Colore del job = LAVORO reale del run, non l'exit della CLI Claude.
      #  • PR aperta o gia' MERGED per la issue (`fix/issue-<N>`)  → run SUCCESS
      #    (la PR e' in pr-review-loop / gia' mergiata). Vale ANCHE se la CLI e'
      #    morta `error_max_turns` DOPO `gh pr create` (false-failure: #1951 = 4/11
      #    fail avevano una PR, 3 gia' MERGED).
      #  • nessuna PR + CLI FAILED  → non-delivery reale (budget esaurito senza PR,
      #    oppure branch pushato ma PR mai aperta) → RED (segnale preservato per
      #    loop-health-report + followup-drainer). NON mascherato: il run non ha
      #    consegnato una PR.
      #  • nessuna PR + CLI SUCCESS → terminale pulito (capability-guard / overlap
      #    / already-fixed / no-root-cause: l'agent ha deciso di NON aprire PR) →
      #    GREEN, comportamento invariato vs oggi.
      # I fail infra a monte (npm ci, setup, pre-flight) restano RED da soli:
      # quegli step non hanno continue-on-error. Nessun gate abbassato: la PR
      # passa comunque dal reviewer (cfr. #2514 / #2288 — disambigua intenzionale
      # vs crash, colore != gate).
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CLAUDE_OUTCOME: ${{ steps.claude_review.outcome }}
        run: |
          set -uo pipefail
          # PR aperta o gia' mergiata sul branch di questa issue (head esatto).
          PR_STATE=$(gh pr list --head "fix/issue-$ISSUE" --state all --json number,state,createdAt \
            --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | sort_by(.createdAt) | last | .number // empty' 2>/dev/null || true)
          echo "issue=$ISSUE pr(head fix/issue-$ISSUE, open|merged)=${PR_STATE:-<none>} claude=$CLAUDE_OUTCOME"
          if [ -n "${PR_STATE:-}" ]; then
            echo "✓ PR #$PR_STATE esiste (open/merged) per la issue → run SUCCESS. Job verde anche se la CLI e' uscita '$CLAUDE_OUTCOME' (false-failure: lavoro consegnato)."
            exit 0
          fi
          if [ "$CLAUDE_OUTCOME" = "failure" ]; then
            # Quota esaurita (429): il job resta comunque RED — non e' un
            # successo e non ha consegnato niente, quindi nessun falso-verde
            # (Non-Negotiable #2, nessun error→warning). Cambia solo il MESSAGGIO:
            # attribuire questi run al "fixer che non sa fixare" e' una
            # misattribuzione che ha tenuto acceso l'allarme del tracker #1951 per
            # ≥7 report senza che nessuno risalisse alla causa. Claude non ha
            # eseguito (0 turni, $0): il recupero corretto e' aspettare la
            # finestra, non ri-tentare — e lo fa il marker `rate-limited` emesso
            # dallo step precedente, letto da followup-drainer.mjs.
            RL=$(gh issue view "$ISSUE" --json comments \
              --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME: rate-limited -->"))] | length' 2>/dev/null || echo 0)
            if [ "${RL:-0}" != "0" ]; then
              echo "::error::issue-fix #$ISSUE: run terminata su QUOTA Claude esaurita (HTTP 429) al primo turno — l'agent non ha letto la issue (0 turni, costo 0). Non e' un fallimento di diagnosi/fix: la issue e' stata ri-accodata SENZA consumare un tentativo e il drainer sospende le promozioni fino al reset. Job RED perche' nessuna PR e' stata consegnata (nessun falso-verde)."
              exit 1
            fi
            echo "::error::issue-fix #$ISSUE: nessuna PR aperta/mergiata e la CLI e' fallita ('$CLAUDE_OUTCOME') → non-delivery reale. Job RED (segnale preservato per loop-health + drainer)."
            exit 1
          fi
          echo "Nessuna PR ma la CLI e' uscita pulita ('$CLAUDE_OUTCOME') → terminale legittimo (blocked/already-fixed/no-root-cause). Job verde."

      - name: Release in-progress claim (zero-Claude, mutex)
        # Symmetric to the claim step above: runs on EVERY terminal path (success,
        # blocked-workflows-scope, already-resolved, error_max_turns, infra fail) so a
        # dead/failed run never leaves `agent:in-progress` stuck forever. Gated on
        # `claim_acquired=true` is stronger than `in_flight=false`: it proves
        # this run wrote and re-read the remote-owned claim. Never remove a
        # local claim, a contended claim, or a claim that this run did not own.
        if: always() && steps.claim.outputs.claim_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLAIM_ACTION: release
          CLAIM_OWNER: remote
        run: node scripts/ci/claim-issue-in-flight.mjs
