name: Loop fleet ledger reconcile

# Recupera gli eventi workflow_run persi o ritardati. Il job è un probe bounded:
# scarica artifact immutabili e può soltanto dispatchare il bridge revisionato.
# Non ha permessi contents/pull-requests e non scrive branch, main o superfici
# pubblicate. Usa un gruppo di concorrenza separato dal bridge: altrimenti un
# burst di workflow_run può occupare anche l'unica coda pending del probe e
# impedire al backstop di osservare proprio gli eventi persi.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo ispezione, senza dispatch del bridge'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: loop-fleet-ledger-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reconciliation probe
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/loop-fleet/ledger/
            /scripts/ci/loop-fleet-ledger-reconcile.mjs
            /scripts/lib/canonical-json-digest.mjs
            /.github/workflows/loop-fleet-ledger-reconcile.yml
          sparse-checkout-cone-mode: false
      - name: Overlay durable ledger branch
        env:
          LEDGER_BRANCH: ledger/loop-fleet
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "refs/heads/$LEDGER_BRANCH" >/dev/null 2>&1; then
            echo "::notice::durable ledger branch $LEDGER_BRANCH does not exist yet; using the in-tree ledger."
            exit 0
          fi
          git fetch --depth 1 origin "$LEDGER_BRANCH"
          mkdir -p data/loop-fleet/ledger
          git checkout FETCH_HEAD -- data/loop-fleet/ledger
          echo "::notice::overlaid data/loop-fleet/ledger from $LEDGER_BRANCH"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Reconcile missing immutable evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          LOOP_FLEET_RECONCILE_MAX_RUNS: '12'
          LOOP_FLEET_RECONCILE_MAX_DISPATCHES: '3'
        run: node scripts/ci/loop-fleet-ledger-reconcile.mjs --ledger-dir data/loop-fleet/ledger
