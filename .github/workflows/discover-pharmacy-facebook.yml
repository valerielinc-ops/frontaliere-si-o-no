name: discover-pharmacy-facebook

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-pharmacy-facebook
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Search configured pharmacies for Facebook candidates
        run: node scripts/discover-pharmacy-facebook.mjs --output "$RUNNER_TEMP/pharmacy-facebook-discovery.json"

      - name: Summarize discovery result
        run: |
          set -euo pipefail
          jq -r '.candidates[] | "- \(.pharmacyId): \(.status); candidates=\(.urls | length)"' "$RUNNER_TEMP/pharmacy-facebook-discovery.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.candidates | any(.status == "candidate_needs_identity_verification")' "$RUNNER_TEMP/pharmacy-facebook-discovery.json" >/dev/null; then
            echo "Candidate URLs need public identity verification; no unverified facts were published by this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload discovery report
        uses: actions/upload-artifact@v7
        with:
          name: pharmacy-facebook-discovery
          path: ${{ runner.temp }}/pharmacy-facebook-discovery.json
          retention-days: 30
