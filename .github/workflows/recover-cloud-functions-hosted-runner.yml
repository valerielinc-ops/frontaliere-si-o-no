name: Recover Cloud Functions deploy startup and runner failures

# Startup and hosted-runner allocation failures are reported before the deploy
# job can run its own failure/retry step. Observe the completed run from a
# separate workflow and replay only the exact platform signatures. API-only
# recovery keeps the source checkout out of the decision and never retries a
# Firebase/API failure.
on:
  workflow_run:
    workflows: [Deploy Cloud Functions]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  # Each source run has its own completion event. The deploy workflow itself
  # serializes production deploys; keeping recovery events independent avoids
  # dropping a later event behind an unrelated recovery job.
  group: recover-cloud-functions-hosted-runner-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'startup_failure') &&
      github.event.workflow_run.path == '.github/workflows/deploy-cloud-functions.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted recovery predicate
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/cloud-functions-hosted-runner-recovery.mjs
            scripts/ci/lib/workflow-run-list-recovery.mjs
            scripts/load-rc-env.mjs
            scripts/lib/fetch-with-ref-timeout.mjs
            scripts/lib/google-service-account-token.mjs
            scripts/lib/remote-config-template-url.mjs
          sparse-checkout-cone-mode: false

      - name: Prepare Firebase credentials for recovery API
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to load the recovery API token'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load recovery API token from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=GITHUB_PAT

      - name: Require recovery API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo '::error::GITHUB_PAT was not loaded from Remote Config; refusing to use the rate-limited installation token'
            exit 1
          fi

      - name: Retry only an unstarted or unassigned deploy
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { getOctokit } = require('@actions/github');
            const { pathToFileURL } = require('node:url');
            const { listRecentCloudFunctionsRuns, shouldRetryCloudFunctionsRun } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/cloud-functions-hosted-runner-recovery.mjs`,
            ).href);
            const recoveryToken = process.env.GITHUB_PAT;
            if (!recoveryToken) {
              throw new Error('GITHUB_PAT was not loaded from Remote Config; refusing recovery.');
            }
            // The ambient GITHUB_TOKEN is an installation token shared by the
            // repository's concurrent workflows. Use the long-lived PAT for
            // every recovery API call so a busy installation cannot make the
            // observer fail before it evaluates the startup signature.
            const recoveryGithub = getOctokit(recoveryToken);
            const run = context.payload.workflow_run;
            const runAttempt = run?.run_attempt;
            if (!Number.isSafeInteger(runAttempt) || runAttempt !== 1) {
              core.info(`Run ${run?.id || '<unknown>'} has no explicit first attempt; refusing recovery.`);
              return;
            }
            const jobs = await recoveryGithub.paginate(
              recoveryGithub.rest.actions.listJobsForWorkflowRunAttempt,
              {
                ...context.repo,
                run_id: Number(run.id),
                attempt_number: runAttempt,
                per_page: 100,
              },
            );
            const workflowRuns = await listRecentCloudFunctionsRuns({
              github: recoveryGithub,
              repo: context.repo,
              run,
              core,
            });
            const annotationsByJob = {};
            for (const job of jobs) {
              if (!Number.isSafeInteger(Number(job.id))) continue;
              annotationsByJob[String(job.id)] = await recoveryGithub.paginate(
                recoveryGithub.rest.checks.listAnnotations,
                {
                  ...context.repo,
                  check_run_id: Number(job.id),
                  per_page: 100,
                },
              );
            }
            if (!shouldRetryCloudFunctionsRun({ run, jobs, annotationsByJob, workflowRuns })) {
              core.info(`Run ${run.id} does not match the bounded startup/runner recovery signature.`);
              return;
            }
            core.warning(
              `Run ${run.id} failed before the deploy job could run; `
              + 'requesting one bounded replay of the same deploy run.',
            );
            await recoveryGithub.rest.actions.reRunWorkflow({
              ...context.repo,
              run_id: Number(run.id),
            });
