name: FB Articles Schedule

on:
  schedule:
    # Hourly at :22 — clear of the job scheduler's FB slots
    # (:05/:15/:25/:35/:45/:55) and the article-generation cron (:07/:37).
    # Articles are posted IMMEDIATELY (not via scheduled_publish_time), so the
    # minute only needs to avoid colliding with heavy concurrent workflows.
    # The recency window (FB_ARTICLE_MAX_AGE_DAYS) + per-run cap
    # (FB_ARTICLE_VOLUME) keep each run small, so an hourly cadence drains new
    # articles within ~1 h of generation without flooding the Page.
    - cron: '22 * * * *'
  workflow_dispatch:
    inputs:
      volume:
        description: 'Max articles to post this run'
        required: false
        default: '4'
        type: string
      max_age_days:
        description: 'Only consider articles dated within N days'
        required: false
        default: '2'
        type: string
      dry_run:
        description: 'Skip Graph API call (preview only)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      human_approval:
        description: 'Explicit human approval for scheduling Facebook posts.'
        required: false
        default: false
        type: boolean

# Serialize so two runs never post-and-commit the ledger concurrently (the
# only writer of data/fb-posted-articles.json — serialization makes ledger
# rebase conflicts essentially impossible; the resolver is belt-and-braces).
concurrency:
  group: fb-articles-schedule
  cancel-in-progress: false

permissions:
  contents: write  # to commit fb-posted-articles.json
  issues: write

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Require human approval for social side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: facebook-articles-post
        run: node scripts/ci/human-side-effect-gate.mjs
      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from RC
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Schedule FB articles
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' || steps.side_effect_gate.outputs.effective_dry_run == 'true'
        env:
          FB_ARTICLE_VOLUME: ${{ github.event.inputs.volume || '4' }}
          FB_ARTICLE_MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '2' }}
          DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
          ALLOW_SIDE_EFFECT: ${{ steps.side_effect_gate.outputs.allow_side_effect }}
          EFFECTIVE_DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
        run: node scripts/schedule-fb-articles-daily.mjs

      - name: Commit posted-articles tracking
        if: success() && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          set -euo pipefail
          # Same fix as linkedin-member-daily.yml (#6424): `git diff --quiet
          # <path>` on a path that has never existed exits 128, not 0/1, so a
          # failed/skipped post (no ledger write yet) would fall through into
          # `git add` on a missing pathspec and hard-fail the step. The file
          # is already tracked today, but the check is hardened to match the
          # rest of the ledger-commit class rather than leaving it a latent
          # trap for a future reset/rename.
          if [ ! -f data/fb-posted-articles.json ]; then
            echo "no ledger file written — nothing to commit"; exit 0
          fi
          git add data/fb-posted-articles.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(fb): track posted articles [skip ci]"
          # In-place resolver unions by article-id when another commit lands on
          # main mid-run, so the ledger commit is never lost (a lost commit
          # would let the next run re-post the same articles).
          bash scripts/lib/git-push-with-retry.sh \
            --in-place-resolver-cmd "node scripts/lib/resolve-fb-posted-articles-conflict.mjs && git add -A"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
