name: Crawler Group 01 (1 crawlers)
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: false
        default: ""
        type: string
concurrency:
  group: jobs-crawler-group-01
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_01:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          node scripts/load-rc-env.mjs
          echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-omniroute
      - uses: ./.github/actions/setup-claude-haiku-fallback
      - name: Run coop
        id: crawler-coop
        background: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-coop.txt
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOBS_CRAWLER_TIMEOUT_MS: ${{ github.event.inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_COOP_STRICT: ${{ github.event.inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ github.event.inputs.skip_ai_translation || '1' }}
          JOBS_HOUSEKEEPING_SCOPE: coop-ticino
          JOBS_SLICE_FILE: data/jobs/by-crawler/coop-ticino.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -uo pipefail
          set +e

          # ---- coop: run crawler (verbatim from original workflow) ----
          npm run jobs:update:coop
          crawler_exit=$?
          git_commit_exit=0

          # ---- coop: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- coop: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c 'bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Coop jobs (dedicated crawler)"'
            git_commit_exit=$?
          fi

          # ---- coop: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run coop" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run coop"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::coop: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ coop: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            exit 1
          fi
          exit 0
      - name: Wait for all crawlers in this group
        wait-all: true
      - name: Commit crawler group data atomically
        if: always()
        run: |-
          set +e
          bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 01 jobs"
          git_commit_exit=$?
          if [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::group commit: push lost the ref race after all retries (contention) on the final aggregated commit. Cycle lost, self-heals next scheduled run — group not failed (systemic class)."
            echo "⚠️ group commit: push contention loss (exit 42) — crawl data was fine, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$git_commit_exit"
      - name: Finalize crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        env:
          CRAWLER_GENERATION_GROUP: "01"
          CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token }}
          CRAWLER_GENERATION_CALLER_REPOSITORY: ${{ github.repository }}
          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ job.status }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"coop-ticino","primarySlice":"data/jobs/by-crawler/coop-ticino.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-01-terminal.json
        run: node scripts/crawler-group-generation-finalizer.mjs
      - name: Upload crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-01-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-01-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
