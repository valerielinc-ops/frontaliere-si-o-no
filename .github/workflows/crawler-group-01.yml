name: Crawler Group 01 (1 crawlers)
on:
  workflow_dispatch:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: true
        type: string
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
concurrency:
  group: jobs-crawler-group-01
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_01:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      DATA_PIPELINE_LEASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          node scripts/load-rc-env.mjs
          echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-01.yml
      - uses: ./.github/actions/setup-omniroute
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Launch coop
        id: crawler-launch-coop
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-coop.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_COOP_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '1' }}
          JOBS_HOUSEKEEPING_SCOPE: coop-ticino
          JOBS_SLICE_FILE: data/jobs/by-crawler/coop-ticino.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          AI_MODELS_PREFER: codex-cli/gpt-5.6-luna
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-01"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/coop.sh"
          launcher_path="$state_dir/coop.launcher.sh"
          worker_path="$state_dir/coop.worker.sh"
          log_path="$state_dir/coop.log"
          pid_path="$state_dir/coop.pid"
          status_path="$state_dir/coop.status"
          started_path="$state_dir/coop.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- coop: run crawler (verbatim from original workflow) ----
          npm run jobs:update:coop
          crawler_exit=$?
          git_commit_exit=0

          # ---- coop: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- coop: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Coop jobs (dedicated crawler)"'\''
            git_commit_exit=$?
          fi

          # ---- coop: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run coop" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run coop"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::coop: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ coop: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::coop: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ coop: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::coop: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ coop: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-01/coop.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-01/coop.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-01/coop.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-01/coop.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-01"
          worker_path="$RUNNER_TEMP/crawler-generation/group-01/coop.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-01/coop.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-01/coop.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-01/coop.started"
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            bash "$worker_path"
            exit $?
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$flock_exit"
                if ! [[ "$terminal_exit" =~ ^[1-9][0-9]*$ ]]; then terminal_exit=143; fi
                printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                printf '\''%s\n'\'' "$flock_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$flock_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Run coop
        id: crawler-coop
        if: always()
        continue-on-error: true
        env:
          CRAWLER_LAUNCH_OUTCOME: ${{ steps['crawler-launch-coop'].outcome }}
        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-01"
          status_file="$state_dir/coop.status"
          pid_file="$state_dir/coop.pid"
          log_file="$state_dir/coop.log"
          launch_outcome="${CRAWLER_LAUNCH_OUTCOME:-unknown}"
          if [ "$launch_outcome" != "success" ]; then
            echo "::error::coop: launch step outcome is $launch_outcome; detached crawler was not started"
            exit 1
          fi
          if [ ! -s "$status_file" ] && [ ! -s "$pid_file" ]; then
            echo "::error::coop: launch step succeeded but published neither status nor PID; refusing to wait for the group budget"
            exit 1
          fi
          deadline=$((SECONDS + 340 * 60))
          while [ ! -s "$status_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::coop: detached crawler did not publish a status before the 340 minute group budget"
              exit 1
            fi
            if [ -s "$pid_file" ]; then
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              if ! [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::coop: invalid detached crawler PID: $pid"
                exit 1
              fi
              if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null; then
                sleep 1
                if [ ! -s "$status_file" ]; then
                  echo "::error::coop: detached crawler exited without publishing its status"
                  exit 1
                fi
              fi
            fi
            sleep 2
          done
          if [ -f "$log_file" ]; then
            cat "$log_file"
          else
            echo "::error::coop: crawler log is missing"
            exit 1
          fi
          status="$(cat "$status_file" 2>/dev/null || true)"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "::error::coop: invalid crawler status: $status"
            exit 1
          fi
          exit "$status"
      - name: Aggregate crawler outcomes
        id: crawler_aggregate
        if: always()
        continue-on-error: true
        run: |-
          set -uo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-01"
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          output_file="${GITHUB_OUTPUT:-/dev/null}"
          success_count=0
          failure_count=0
          missing_count=0
          printf '%s\n' '### Crawler group 01 outcome' >> "$summary_file"
          printf '%s\n' '| Crawler | Outcome |' '| --- | --- |' >> "$summary_file"
          status_file="$state_dir/coop.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::coop: no terminal status was published"
            printf '%s\n' '| coop | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::coop: invalid terminal status: $status"
              printf '%s\n' '| coop | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| coop | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::coop: crawler exited with status $status"
              printf '| coop | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          printf '%s\n' "**Summary:** $success_count succeeded, $failure_count failed, $missing_count missing." >> "$summary_file"
          printf '%s\n' "success_count=$success_count" "failure_count=$failure_count" "missing_count=$missing_count" >> "$output_file"
          exit 0
      - name: Commit crawler group data atomically
        if: always() && inputs.generation_token != '' && job.status == 'success' && steps.crawler_group_setup.outcome == 'success'
        run: |-
          set +e
          bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 01 jobs"
          git_commit_exit=$?
          if [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::group commit: push lost the ref race after all retries (contention) on the final aggregated commit. Cycle lost, self-heals next scheduled run — group not failed (systemic class)."
            echo "⚠️ group commit: push contention loss (exit 42) — crawl data was fine, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::group commit: global data-pipeline lease is busy (exit 44); no group data was staged and the next scheduled cycle will retry — group not failed (systemic class)."
            echo "⚠️ group commit: global data-pipeline lease busy (exit 44) — group data not staged, group not failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$git_commit_exit"
      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then exit 0; fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Finalize crawler generation manifest (shadow)
        id: crawler-generation-finalizer
        if: always()
        continue-on-error: true
        env:
          CRAWLER_GENERATION_GROUP: "01"
          CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
          CRAWLER_GENERATION_CALLER_REPOSITORY: ${{ github.repository }}
          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ job.status }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"coop-ticino","primarySlice":"data/jobs/by-crawler/coop-ticino.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-01-terminal.json
          CRAWLER_GENERATION_LEDGER_PATH: data/crawler-generation-ledger.jsonl
        run: node scripts/crawler-group-generation-finalizer.mjs
      - name: Report crawler generation finalizer failure
        if: always() && steps.crawler-generation-finalizer.outcome == 'failure'
        continue-on-error: true
        run: |-
          echo "::error::crawler generation finalizer failed; ledger persistence skipped so a missing/partial manifest cannot be recorded as success"
          echo "❌ crawler generation finalizer failed; ledger persistence skipped (no false-success ledger entry)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Persist crawler generation ledger
        if: always() && steps.crawler-generation-finalizer.outcome == 'success'
        continue-on-error: true
        env:
          CRAWLER_GENERATION_RECEIPT_DIR: ""
          SKIP_AI_TRANSLATION: "1"
        run: |-
          set +e
          bash scripts/lib/git-commit-data.sh --extra-only "Record crawler generation ledger" data/crawler-generation-ledger.jsonl
          git_commit_exit=$?
          if [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::crawler generation ledger: push lost the ref race after all retries (contention); this cycle ledger entry was not committed and the next scheduled cycle records its own ledger state."
            echo "⚠️ crawler generation ledger: push contention loss (exit 42) — this cycle ledger entry was not committed; next scheduled cycle records its own state" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::crawler generation ledger: global data-pipeline lease is busy (exit 44); this cycle ledger entry was not committed and the next scheduled cycle records its own state."
            echo "⚠️ crawler generation ledger: global data-pipeline lease busy (exit 44) — this cycle ledger entry was not committed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if [ "$git_commit_exit" -ne 0 ]; then
            if [ "$git_commit_exit" -eq 43 ]; then
              echo "::error::crawler generation ledger: shared deferred-commit precondition failed (exit 43)"
              echo "❌ crawler generation ledger: shared deferred-commit precondition failed (exit 43)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            else
              echo "::error::crawler generation ledger persistence failed (exit $git_commit_exit)"
              echo "❌ crawler generation ledger persistence failed (exit $git_commit_exit)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          fi
          exit "$git_commit_exit"
      - name: Upload crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-01-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-01-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Fail crawler group after all member outcomes
        if: always()
        env:
          CRAWLER_AGGREGATE_OUTCOME: ${{ steps.crawler_aggregate.outcome }}
          CRAWLER_AGGREGATE_SUCCESS: ${{ steps.crawler_aggregate.outputs.success_count || 'invalid' }}
          CRAWLER_AGGREGATE_FAILURES: ${{ steps.crawler_aggregate.outputs.failure_count || 'invalid' }}
          CRAWLER_AGGREGATE_MISSING: ${{ steps.crawler_aggregate.outputs.missing_count || 'invalid' }}
        run: |-
          set -euo pipefail
          aggregate_outcome="${CRAWLER_AGGREGATE_OUTCOME:-failure}"
          success_count="${CRAWLER_AGGREGATE_SUCCESS:-invalid}"
          failure_count="${CRAWLER_AGGREGATE_FAILURES:-invalid}"
          missing_count="${CRAWLER_AGGREGATE_MISSING:-invalid}"
          if [ "$aggregate_outcome" != "success" ]; then
            echo "::error::crawler aggregate step did not complete; group failed after preserving already-running siblings"
            exit 1
          fi
          for count in "$success_count" "$failure_count" "$missing_count"; do
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::crawler aggregate produced an invalid count: $count"
              exit 1
            fi
          done
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ]; then
            echo "::error::crawler group completed with $success_count succeeded, $failure_count failed, $missing_count missing; healthy siblings were preserved, but the group remains failed until incomplete crawlers are recovered"
            exit 1
          fi
          echo "✅ all $success_count crawler members completed successfully"
      - name: Release cross-entry crawler live-run lease
        if: always() && env.CRAWLER_GROUP_LIVE_LEASE_OWNED == '1'
        continue-on-error: true
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-01.yml --release
