name: Send Newsletter

on:
  schedule:
    # Daily 03:33 UTC (05:33 CEST) — moved up 2h from 05:33 UTC per explicit owner request (2026-07-08).
    # Original 05:33 was tuned via PostHog click data to land ~25 min before peak read hour (06:00 UTC, 34 clicks/90d);
    # this 2h shift widens that lead to ~2h25m, so the peak-alignment rationale no longer holds as-is.
    #
    # #3798 Fase 1, re-audited 2026-08-05 — two corrections to the reasoning
    # above (the slot itself is unchanged; see send-job-alerts.yml for the full
    # audit and the numbers):
    #  * The nominal cron minute is not when this runs. GitHub's scheduled-
    #    dispatch backlog puts the real start at a median of 160m later
    #    (~06:13 UTC; p90 196m, max 209m over the last 28 scheduled runs). Any
    #    "lands N minutes before peak read hour" tuning has to be done against
    #    the effective start, not the crontab. As it happens the ~06:13
    #    effective start is close to the 06:00 UTC peak the original 05:33 was
    #    aiming for — the 2h shift was largely absorbed by the drift.
    #  * "Avoids :00/:15/:30/:45 which GitHub deprioritizes" is not supported by
    #    the data: median dispatch delay is 150m at :00, 149m at :15/:30/:45 and
    #    158m at off-minutes (n=1462 scheduled runs). The minute does not
    #    matter; the hour does.
    # Since per-user scheduling landed, the effective start matters far less
    # anyway: the provider holds each message until the subscriber's own hour
    # (scripts/lib/send-schedule.mjs), so this cron only decides when the
    # campaign is composed and enqueued.
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview, test or send'
        required: false
        default: 'test'
        type: choice
        options:
          - preview
          - test
          - send
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      subject:
        description: 'Subject override'
        required: false
        default: ''
        type: string
      sections:
        description: 'Comma-separated sections: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      section_order:
        description: 'Comma-separated section order: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      variant:
        description: 'Newsletter variant: jobs, tax, general, or auto (segmented)'
        required: false
        default: 'general'
        type: choice
        options:
          - jobs
          - tax
          - general
          - auto
      enhancements:
        description: 'Comma-separated extras: topJobs,clusterPages,evergreen'
        required: false
        default: 'topJobs,clusterPages,evergreen'
        type: string
      ab_test:
        description: 'A/B test subjects: SubjectA|||SubjectB (optional)'
        required: false
        default: ''
        type: string
      # maileroo is intentionally NOT selectable below (#3135 item 1): manual
      # force-select bypassed the cascade's quota/rotation to push mail
      # through a single provider on operator demand. Maileroo still
      # participates in the automatic `cascade` rotation
      # (scripts/lib/email-cascade.mjs) — that role is separate and is
      # DKIM/DMARC-aligned as of #3154 (root cause of #3066 fixed).
      provider:
        description: 'Email provider (cascade = multi-provider default)'
        required: false
        default: 'cascade'
        type: choice
        options:
          - cascade
          - mailgun
          - mailjet
          - mailtrap
          - resend
          - cloudflare

permissions:
  contents: read
  issues: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/packages/articles/content/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Same mechanism as generate-article.yml: tier-0 in NEWSLETTER_AI_CHAIN
      # (scripts/send-newsletter.mjs) by default since 2026-07-29
      # (AI_COMPETING_TIERS) — competes on real score instead of being
      # reached only after every free-tier model has failed. Extracted to a
      # shared composite action 2026-07-24 (was duplicated byte-for-byte with
      # generate-article.yml, then about to be copy-pasted into more
      # workflows for the fleet-wide rollout — see
      # .github/actions/setup-claude-haiku-fallback/action.yml for the full
      # rationale + incident history).
      - uses: ./.github/actions/setup-claude-haiku-fallback

      - name: Assemble jobs dataset from per-crawler slices
        continue-on-error: true
        run: node scripts/assemble-jobs-dataset.mjs 2>&1 || echo "⚠️ Jobs assembly failed — newsletter will proceed without job data"

      # Job popularity is refreshed once a day by refresh-job-popularity.yml
      # and committed to data/job-popularity.json. The newsletter reads the
      # file directly from the checked-out tree.

      - name: Run newsletter job
        env:
          EMAIL_PROVIDER: ${{ inputs.provider || 'cascade' }}
          NEWSLETTER_EXPERIMENTAL_MODE: false
          NEWSLETTER_ENABLE_SEND: true
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM || '' }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'test' }}
          TARGET: ${{ inputs.target_email || '' }}
          SUBJECT: ${{ inputs.subject || '' }}
          SECTIONS: ${{ inputs.sections || 'exchange,jobs,articles,fact,tool' }}
          SECTION_ORDER: ${{ inputs.section_order || 'exchange,jobs,articles,fact,tool' }}
          VARIANT: ${{ inputs.variant || 'general' }}
          ENHANCEMENTS: ${{ inputs.enhancements || 'topJobs,clusterPages,evergreen' }}
          AB_TEST: ${{ inputs.ab_test || '' }}
          # Auth for the opt-in Claude CLI Haiku fallback (tier-0 by default
          # since 2026-07-29 — see AI_COMPETING_TIERS in ai-models.mjs; see
          # "Setup Claude CLI Haiku fallback" step above). Harmless to always
          # pass: ai-models.mjs only offers the model when this AND the RC
          # flag are both set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SEGMENTED_FLAG=""
          VARIANT_FLAG="--variant $VARIANT"
          if [ "$VARIANT" = "auto" ]; then
            SEGMENTED_FLAG="--segmented"
            VARIANT_FLAG=""
          fi
          AB_TEST_FLAG=""
          if [ -n "$AB_TEST" ]; then
            AB_TEST_FLAG="--ab-test $AB_TEST"
          fi
          echo "📧 Running newsletter mode=$MODE target=$TARGET sections=$SECTIONS variant=$VARIANT segmented=$SEGMENTED_FLAG ab_test=$AB_TEST"

          if [ "$MODE" = "send" ]; then
            node scripts/send-newsletter.mjs --send --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG $SEGMENTED_FLAG $AB_TEST_FLAG --enhancements "$ENHANCEMENTS"
          elif [ "$MODE" = "preview" ]; then
            mkdir -p /tmp/newsletter-preview
            node scripts/send-newsletter.mjs --preview --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG --enhancements "$ENHANCEMENTS" > /tmp/newsletter-preview/index.html
            echo "Preview written to /tmp/newsletter-preview/index.html"
          else
            node scripts/send-newsletter.mjs --test --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG --enhancements "$ENHANCEMENTS"
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
