name: Send Newsletter

on:
  schedule:
    # Daily 03:33 UTC (05:33 CEST) — moved up 2h from 05:33 UTC per explicit owner request (2026-07-08).
    # Original 05:33 was tuned via PostHog click data to land ~25 min before peak read hour (06:00 UTC, 34 clicks/90d);
    # this 2h shift widens that lead to ~2h25m, so the peak-alignment rationale no longer holds as-is.
    # Avoids :00/:15/:30/:45 minute slots which GitHub Actions cron deprioritizes under load (silent skips).
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview, test or send'
        required: false
        default: 'test'
        type: choice
        options:
          - preview
          - test
          - send
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      subject:
        description: 'Subject override'
        required: false
        default: ''
        type: string
      sections:
        description: 'Comma-separated sections: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      section_order:
        description: 'Comma-separated section order: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      variant:
        description: 'Newsletter variant: jobs, tax, general, or auto (segmented)'
        required: false
        default: 'general'
        type: choice
        options:
          - jobs
          - tax
          - general
          - auto
      enhancements:
        description: 'Comma-separated extras: topJobs,clusterPages,evergreen'
        required: false
        default: 'topJobs,clusterPages,evergreen'
        type: string
      ab_test:
        description: 'A/B test subjects: SubjectA|||SubjectB (optional)'
        required: false
        default: ''
        type: string
      # maileroo is intentionally NOT selectable below (#3135 item 1): manual
      # force-select bypassed the cascade's quota/rotation to push mail
      # through a single provider on operator demand. Maileroo still
      # participates in the automatic `cascade` rotation
      # (scripts/lib/email-cascade.mjs) — that role is separate and is
      # DKIM/DMARC-aligned as of #3154 (root cause of #3066 fixed).
      provider:
        description: 'Email provider (cascade = multi-provider default)'
        required: false
        default: 'cascade'
        type: choice
        options:
          - cascade
          - mailgun
          - mailjet
          - mailtrap
          - resend
          - cloudflare

permissions:
  contents: read
  issues: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Same mechanism as generate-article.yml: absolute last resort in
      # NEWSLETTER_AI_CHAIN (scripts/send-newsletter.mjs), reached only after
      # every free-tier model has failed. Zero marginal cost — auth is
      # CLAUDE_CODE_OAUTH_TOKEN (same Max-plan subscription token already used
      # by pr-review-loop.yml/issue-fix.yml), never ANTHROPIC_API_KEY. Kill
      # switch: repo variable ENABLE_HAIKU_ARTICLE_FALLBACK=0 (Settings →
      # Secrets and variables → Actions → Variables) or the Remote Config flag
      # to '0' — either disables the setup below, ai-models.mjs then never
      # offers the model (getApiKeyForProvider(PROVIDER.CLAUDE_CLI) returns '').
      - name: Setup Claude CLI Haiku fallback
        if: env.ENABLE_HAIKU_ARTICLE_FALLBACK != '0' && vars.ENABLE_HAIKU_ARTICLE_FALLBACK != '0'
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "ENABLE_HAIKU_ARTICLE_FALLBACK=1" >> "$GITHUB_ENV"

      - name: Assemble jobs dataset from per-crawler slices
        continue-on-error: true
        run: node scripts/assemble-jobs-dataset.mjs 2>&1 || echo "⚠️ Jobs assembly failed — newsletter will proceed without job data"

      # Job popularity is refreshed once a day by refresh-job-popularity.yml
      # and committed to data/job-popularity.json. The newsletter reads the
      # file directly from the checked-out tree.

      - name: Run newsletter job
        env:
          EMAIL_PROVIDER: ${{ inputs.provider || 'cascade' }}
          NEWSLETTER_EXPERIMENTAL_MODE: false
          NEWSLETTER_ENABLE_SEND: true
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM || '' }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'test' }}
          TARGET: ${{ inputs.target_email || '' }}
          SUBJECT: ${{ inputs.subject || '' }}
          SECTIONS: ${{ inputs.sections || 'exchange,jobs,articles,fact,tool' }}
          SECTION_ORDER: ${{ inputs.section_order || 'exchange,jobs,articles,fact,tool' }}
          VARIANT: ${{ inputs.variant || 'general' }}
          ENHANCEMENTS: ${{ inputs.enhancements || 'topJobs,clusterPages,evergreen' }}
          AB_TEST: ${{ inputs.ab_test || '' }}
          # Auth for the opt-in Claude CLI Haiku last-resort fallback (see
          # "Setup Claude CLI Haiku fallback" step above). Harmless to always
          # pass: ai-models.mjs only offers the model when this AND the RC
          # flag are both set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SEGMENTED_FLAG=""
          VARIANT_FLAG="--variant $VARIANT"
          if [ "$VARIANT" = "auto" ]; then
            SEGMENTED_FLAG="--segmented"
            VARIANT_FLAG=""
          fi
          AB_TEST_FLAG=""
          if [ -n "$AB_TEST" ]; then
            AB_TEST_FLAG="--ab-test $AB_TEST"
          fi
          echo "📧 Running newsletter mode=$MODE target=$TARGET sections=$SECTIONS variant=$VARIANT segmented=$SEGMENTED_FLAG ab_test=$AB_TEST"

          if [ "$MODE" = "send" ]; then
            node scripts/send-newsletter.mjs --send --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG $SEGMENTED_FLAG $AB_TEST_FLAG --enhancements "$ENHANCEMENTS"
          elif [ "$MODE" = "preview" ]; then
            mkdir -p /tmp/newsletter-preview
            node scripts/send-newsletter.mjs --preview --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG --enhancements "$ENHANCEMENTS" > /tmp/newsletter-preview/index.html
            echo "Preview written to /tmp/newsletter-preview/index.html"
          else
            node scripts/send-newsletter.mjs --test --target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER" $VARIANT_FLAG --enhancements "$ENHANCEMENTS"
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
