name: Send Newsletter

on:
  schedule:
    # Daily 03:33 UTC (05:33 CEST) — moved up 2h from 05:33 UTC per explicit owner request (2026-07-08).
    # Original 05:33 was tuned via PostHog click data to land ~25 min before peak read hour (06:00 UTC, 34 clicks/90d);
    # this 2h shift widens that lead to ~2h25m, so the peak-alignment rationale no longer holds as-is.
    #
    # #3798 Fase 1, re-audited 2026-08-05 — two corrections to the reasoning
    # above (the slot itself is unchanged; see send-job-alerts.yml for the full
    # audit and the numbers):
    #  * The nominal cron minute is not when this runs. GitHub's scheduled-
    #    dispatch backlog puts the real start at a median of 160m later
    #    (~06:13 UTC; p90 196m, max 209m over the last 28 scheduled runs). Any
    #    "lands N minutes before peak read hour" tuning has to be done against
    #    the effective start, not the crontab. As it happens the ~06:13
    #    effective start is close to the 06:00 UTC peak the original 05:33 was
    #    aiming for — the 2h shift was largely absorbed by the drift.
    #  * "Avoids :00/:15/:30/:45 which GitHub deprioritizes" is not supported by
    #    the data: median dispatch delay is 150m at :00, 149m at :15/:30/:45 and
    #    158m at off-minutes (n=1462 scheduled runs). The minute does not
    #    matter; the hour does.
    # Since per-user scheduling landed, the effective start matters far less
    # anyway: the provider holds each message until the subscriber's own hour
    # (scripts/lib/send-schedule.mjs), so this cron only decides when the
    # campaign is composed and enqueued.
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview, test, send or dry-run (dry-run needs target_email and dry_run=false: builds one real email, calls no provider, writes nothing)'
        required: false
        default: 'test'
        type: choice
        options:
          - preview
          - test
          - send
          - dry-run
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      subject:
        description: 'Subject override'
        required: false
        default: ''
        type: string
      sections:
        description: 'Comma-separated sections: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      section_order:
        description: 'Comma-separated section order: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      variant:
        description: 'Newsletter variant: jobs, tax, general, or auto (segmented)'
        required: false
        default: 'general'
        type: choice
        options:
          - jobs
          - tax
          - general
          - auto
      enhancements:
        description: 'Comma-separated extras: topJobs,clusterPages,evergreen'
        required: false
        default: 'topJobs,clusterPages,evergreen'
        type: string
      ab_test:
        description: 'A/B test subjects: SubjectA|||SubjectB (optional)'
        required: false
        default: ''
        type: string
      # maileroo is intentionally NOT selectable below (#3135 item 1): manual
      # force-select bypassed the cascade's quota/rotation to push mail
      # through a single provider on operator demand. Maileroo still
      # participates in the automatic `cascade` rotation
      # (scripts/lib/email-cascade.mjs) — that role is separate and is
      # DKIM/DMARC-aligned as of #3154 (root cause of #3066 fixed).
      provider:
        description: 'Email provider (cascade = multi-provider default)'
        required: false
        default: 'cascade'
        type: choice
        options:
          - cascade
          - mailgun
          - mailjet
          - mailtrap
          - resend
          - cloudflare
  workflow_run:
    workflows:
      - Send Job Alert Emails
    types:
      - completed

permissions:
  contents: read
  issues: write
  actions: read

# GATE (perf-plan email senders, C3). A `workflow_run` fires for every completed
# "Send Job Alert Emails" run, but only the primary scheduled slot carries the
# handoff marker; the secondary slot (and every failed or manual completion) is
# INERT. Those inert runs used to pay a full checkout, `npm ci` and the dataset
# assembly before discovering they had nothing to do, and — worse — they sat in the
# workflow-level concurrency group, where GitHub keeps ONE pending run: an inert
# trigger could replace a legitimate pending one. Now a light `gate` job (no
# checkout, no Node) decides, and only a run that must proceed enters the
# `newsletter` concurrency group.
#
# The daily cron remains the safety net. The primary job-alert handoff enters the
# same serialized group, and cancel-in-progress=false preserves a queued
# fallback/resume instead of discarding an unfinished campaign. The sender's
# weekly campaign id plus campaign_sends ledger is the recipient-level
# idempotency key, so a second trigger resumes/skips rather than duplicating.

jobs:
  gate:
    # `workflow_run` fires for every completed source run, including failed
    # runs and manual dispatches. Only successful scheduled runs can carry the
    # primary handoff marker; keep the other events as a clean no-op before
    # any artifact lookup or checkout.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'schedule'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.newsletter_trigger.outputs.allow_run }}
      allow_workflow_run: ${{ steps.newsletter_trigger.outputs.allow_workflow_run }}
      trigger_key: ${{ steps.newsletter_trigger.outputs.trigger_key }}
    steps:
      # The primary marker is intentionally absent from the secondary
      # job-alert slot. Probe first so actions/download-artifact never emits a
      # misleading error annotation for that expected no-op.
      - name: Locate primary job-alert handoff
        id: locate_jobalert_handoff
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        env:
          HANDOFF_NAME: newsletter-handoff-${{ github.event.workflow_run.id }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid source workflow run id: ${process.env.SOURCE_RUN_ID}`);
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const handoff = artifacts.find(
              (artifact) => artifact.name === process.env.HANDOFF_NAME && !artifact.expired,
            );
            core.setOutput('found', handoff ? 'true' : 'false');
            core.info(
              handoff
                ? `Found ${process.env.HANDOFF_NAME} on source run ${runId}.`
                : `No ${process.env.HANDOFF_NAME} on source run ${runId}; treating it as an inert trigger.`,
            );

      - name: Download primary job-alert handoff
        id: download_jobalert_handoff
        if: github.event_name == 'workflow_run' && steps.locate_jobalert_handoff.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: newsletter-handoff-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/newsletter-handoff

      - name: Verify newsletter trigger
        id: newsletter_trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          HANDOFF_DOWNLOAD_OUTCOME: ${{ steps.download_jobalert_handoff.outcome || 'skipped' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event || '' }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "allow_run=true" >> "$GITHUB_OUTPUT"
            echo "allow_workflow_run=false" >> "$GITHUB_OUTPUT"
            echo "trigger_key=$(date -u +%F)" >> "$GITHUB_OUTPUT"
            echo "Newsletter trigger: $EVENT_NAME (cron/manual path)"
            exit 0
          fi

          handoff_file="$RUNNER_TEMP/newsletter-handoff/primary.json"
          if [ "$HANDOFF_DOWNLOAD_OUTCOME" != "success" ] || [ ! -s "$handoff_file" ]; then
            echo "::notice::No primary job-alert handoff found; this workflow_run stays inert."
            echo "allow_run=false" >> "$GITHUB_OUTPUT"
            echo "allow_workflow_run=false" >> "$GITHUB_OUTPUT"
            echo "trigger_key=workflow-run-$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_conclusion "$SOURCE_CONCLUSION" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_workflow "$SOURCE_WORKFLOW" \
            '(
              .schema_version == 1
              and .kind == "newsletter-jobalert-handoff"
              and .schedule == "33 0 * * *"
              and .source_workflow == "Send Job Alert Emails"
              and .source_workflow_path == ".github/workflows/send-job-alerts.yml"
              and .source_event == "schedule"
              and .source_conclusion == "success"
              and .source_run_id == $source_run_id
              and .source_run_attempt == $source_run_attempt
              and .source_branch == $source_branch
              and $source_event == "schedule"
              and $source_conclusion == "success"
              and $source_branch == "main"
              and $source_workflow == "Send Job Alert Emails"
              and (.newsletter_key | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
            )' "$handoff_file" >/dev/null 2>&1; then
            echo "::notice::Primary job-alert handoff failed validation; this workflow_run stays inert."
            echo "allow_run=false" >> "$GITHUB_OUTPUT"
            echo "allow_workflow_run=false" >> "$GITHUB_OUTPUT"
            echo "trigger_key=workflow-run-$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trigger_key="$(jq -r '.newsletter_key' "$handoff_file")"
          echo "allow_run=true" >> "$GITHUB_OUTPUT"
          echo "allow_workflow_run=true" >> "$GITHUB_OUTPUT"
          echo "trigger_key=$trigger_key" >> "$GITHUB_OUTPUT"
          echo "✅ Verified primary job-alert handoff for newsletter_key=$trigger_key (source run $SOURCE_RUN_ID)"


  newsletter:
    needs: gate
    # Only a run the gate let through (cron, manual, or a verified primary
    # handoff) is ever scheduled here: inert triggers never enter the group.
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Never two campaigns at once; cancel-in-progress=false queues a fallback or
    # resume instead of discarding an unfinished campaign.
    concurrency:
      group: newsletter
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # node_modules in cache (perf-plan email senders, A3): key on the lockfile and
      # the Node major, `npm ci` only on a miss (it cost 37-49 s on every run).
      - name: Setup Node.js and restore node_modules
        uses: ./.github/actions/npm-ci-cached

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      # Privilegio minimo (perf-plan email senders, C8): l'elenco e' quello che il
      # codice del job (sender, cascade, assemble, issue-creator, catena dei
      # provider LLM di ai-models.mjs e i passi di setup-omniroute /
      # setup-claude-haiku-fallback) legge davvero da `process.env`. Lo verifica
      # tests/email-senders-workflow-perimeter.test.ts: una chiave nuova letta dal
      # codice e non elencata qui fa fallire la CI, non il job in produzione, dove
      # un provider LLM senza chiave degraderebbe l'AI in silenzio.
      - name: Load secrets from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs --only-env=CEREBRAS_API_KEY,CF_ACCOUNT_ID,CF_API_TOKEN,CHUTES_API_KEY,CLOUDFLARE_EMAIL_API_TOKEN,COHERE_API_KEY,ENABLE_CODEX_ARTICLE_FALLBACK,ENABLE_HAIKU_ARTICLE_FALLBACK,ENABLE_OMNIROUTE_FALLBACK,FIREWORKS_API_KEY,GH_MODELS_PAT,GH_MODELS_PAT_2,GH_MODELS_PAT_3,GH_MODELS_PAT_4,GH_MODELS_PAT_5,GH_MODELS_PAT_6,GH_MODELS_PAT_7,GH_MODELS_PAT_8,GH_MODELS_PAT_9,GROQ_API_KEY,HUGGINGFACE_API_KEY,JOB_EMAIL_RANKING_AFFINITY_WEIGHT,JOB_EMAIL_RANKING_ENABLED,JOB_EMAIL_RANKING_IMPRESSIONS_MODE,JOB_EMAIL_RANKING_ROLLOUT,JOB_EMAIL_RANKING_TREATMENT,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,MISTRAL_API_KEY,NEWSLETTER_AUDIENCE_SCAN_MODE,NEWSLETTER_BATCH_BOOKKEEPING,NEWSLETTER_CAMPAIGN_CONTENT_FREEZE,NEWSLETTER_CONTENT_FREEZE_RATE_THRESHOLD_PCT,NEWSLETTER_FROM,NEWSLETTER_RESUME_RECEIPT_SCAN,NEWSLETTER_SECRET,NVIDIA_API_KEY,NVIDIA_NIM_API_KEY,OMNIROUTE_PROVIDER_ALLOWLIST,OMNIROUTE_PROVIDERS_JSON,OPENROUTER_API_KEY,PER_USER_SEND_TIME,RESEND_API_KEY,SAMBANOVA_API_KEY,TOGETHER_API_KEY,ZAI_API_KEY,ZHIPU_API_KEY

      # Frozen-content probe (perf-plan email senders, C4). setup-omniroute and
      # setup-claude-haiku-fallback cost ~111 s and exist only for the LLM calls of
      # Phase 2. When the current campaign already has valid frozen content for every
      # locale it needs, no LLM call will be made and the two setups are skipped.
      # The probe reads at most 4 frozen documents and the stored exchange rate; any
      # doubt or error answers "needs LLM", so the setups run exactly as before.
      - name: Probe frozen newsletter content
        id: content_probe
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'send' || inputs.mode || 'test' }}
        run: node scripts/newsletter-content-probe.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.content_probe.outputs.needs_llm != 'false'

      # ── Codex Luna Max article lane (ON by default, historical kill-switch '0') ──
      # The shared action exposes only a private broker socket to the
      # newsletter process.
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.content_probe.outputs.needs_llm != 'false'
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}

      # Content-addressed cache of the assembled dataset. The key is printed by
      # the assembler itself (.github/actions/assemble-jobs-cache-key): sha256
      # of every slice, of its local import closure, of the aux data files it
      # reads, of package-lock.json and of the Node major. It is the SAME value
      # the script checks before restoring, so a hit can only replay an output
      # built from byte-identical inputs; no restore-keys fallback. Measured
      # miss cost: 4m41 (run 35422626497).
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # The newsletter must still go out without job data (intended), but the
      # degradation must be VISIBLE: continue-on-error keeps the job going while
      # the step stays red in the UI, and the next step turns the failure into
      # a ::warning::, a step-summary line and a deduplicated issue. The former
      # `|| echo` swallowed the exit code and painted the step green.
      - name: Assemble jobs dataset from per-crawler slices
        id: assemble
        continue-on-error: true
        run: node scripts/assemble-jobs-dataset.mjs 2>&1

      - name: Report degraded newsletter (jobs assembly failed)
        if: steps.assemble.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          msg="Jobs assembly failed — the newsletter proceeds WITHOUT job data (run ${{ github.run_id }})"
          echo "::warning title=Newsletter degraded::$msg"
          {
            echo "### ⚠️ Newsletter degraded: jobs assembly failed"
            echo ""
            echo "$msg. See the log of step \"Assemble jobs dataset from per-crawler slices\"."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/lib/github-issue-creator.mjs \
            --title "Newsletter degraded: jobs assembly failed" \
            --description "## Newsletter inviata senza annunci
          Lo step \"Assemble jobs dataset from per-crawler slices\" e' fallito: la newsletter prosegue senza la sezione jobs (comportamento voluto), ma il fallimento va indagato.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Recovery mirror (model rpm-canary.yml): the title above is custom, so
      # close-recovered-failure-issues.mjs never sees it; the next newsletter
      # run whose assembly succeeds closes it. Best-effort, exits 0.
      - name: Resolve degraded-newsletter issue on green assembly
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Newsletter degraded: jobs assembly failed" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Save assemble-jobs cache
        if: steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # Job popularity is refreshed once a day by refresh-job-popularity.yml
      # and committed to data/job-popularity.json. The newsletter reads the
      # file directly from the checked-out tree.

      - name: Run newsletter job
        env:
          EMAIL_PROVIDER: ${{ inputs.provider || 'cascade' }}
          NEWSLETTER_EXPERIMENTAL_MODE: false
          NEWSLETTER_ENABLE_SEND: true
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM || '' }}
          # workflow_run reaches this step only with a verified primary handoff
          # (see the step's `if`), so it sends like the cron fallback. Without
          # it the handoff fell through to 'test': one email to the admin, and
          # the whole campaign waited for the late cron.
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'send' || inputs.mode || 'test' }}
          TARGET: ${{ inputs.target_email || '' }}
          SUBJECT: ${{ inputs.subject || '' }}
          SECTIONS: ${{ inputs.sections || 'exchange,jobs,articles,fact,tool' }}
          SECTION_ORDER: ${{ inputs.section_order || 'exchange,jobs,articles,fact,tool' }}
          VARIANT: ${{ inputs.variant || 'general' }}
          ENHANCEMENTS: ${{ inputs.enhancements || 'topJobs,clusterPages,evergreen' }}
          AB_TEST: ${{ inputs.ab_test || '' }}
          NEWSLETTER_TRIGGER_KEY: ${{ needs.gate.outputs.trigger_key || '' }}
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          AI_MODELS_PREFER: codex-cli/gpt-5.6-luna
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            MODE=preview
          fi
          segmented_display=""
          variant_args=(--variant "$VARIANT")
          if [ "$VARIANT" = "auto" ]; then
            segmented_display="--segmented"
            variant_args=(--segmented)
          fi
          ab_test_args=()
          if [ -n "$AB_TEST" ]; then
            ab_test_args=(--ab-test "$AB_TEST")
          fi
          echo "📧 Running newsletter mode=$MODE trigger_key=$NEWSLETTER_TRIGGER_KEY target=$TARGET sections=$SECTIONS variant=$VARIANT segmented=$segmented_display ab_test=$AB_TEST"

          common_args=(--target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER")

          if [ "$MODE" = "send" ]; then
            node scripts/send-newsletter.mjs --send "${common_args[@]}" "${variant_args[@]}" "${ab_test_args[@]}" --enhancements "$ENHANCEMENTS"
          elif [ "$MODE" = "dry-run" ]; then
            # One real email is built for $TARGET (Phase 1-5 with the frozen-content
            # lookup), no provider is called and nothing is persisted.
            node scripts/send-newsletter.mjs --dry-run "${common_args[@]}" "${variant_args[@]}" --enhancements "$ENHANCEMENTS"
          elif [ "$MODE" = "preview" ]; then
            mkdir -p /tmp/newsletter-preview
            node scripts/send-newsletter.mjs --preview "${common_args[@]}" "${variant_args[@]}" --enhancements "$ENHANCEMENTS" > /tmp/newsletter-preview/index.html
            echo "Preview written to /tmp/newsletter-preview/index.html"
          else
            node scripts/send-newsletter.mjs --test "${common_args[@]}" "${variant_args[@]}" --enhancements "$ENHANCEMENTS"
          fi

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            exit 0
          fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
            --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" \
            || echo "::warning::Codex auth broker cleanup did not complete"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
