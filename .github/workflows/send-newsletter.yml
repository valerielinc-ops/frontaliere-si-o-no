name: Send Newsletter

on:
  schedule:
    # Daily 03:33 UTC (05:33 CEST) — moved up 2h from 05:33 UTC per explicit owner request (2026-07-08).
    # Original 05:33 was tuned via PostHog click data to land ~25 min before peak read hour (06:00 UTC, 34 clicks/90d);
    # this 2h shift widens that lead to ~2h25m, so the peak-alignment rationale no longer holds as-is.
    #
    # #3798 Fase 1, re-audited 2026-08-05 — two corrections to the reasoning
    # above (the slot itself is unchanged; see send-job-alerts.yml for the full
    # audit and the numbers):
    #  * The nominal cron minute is not when this runs. GitHub's scheduled-
    #    dispatch backlog puts the real start at a median of 160m later
    #    (~06:13 UTC; p90 196m, max 209m over the last 28 scheduled runs). Any
    #    "lands N minutes before peak read hour" tuning has to be done against
    #    the effective start, not the crontab. As it happens the ~06:13
    #    effective start is close to the 06:00 UTC peak the original 05:33 was
    #    aiming for — the 2h shift was largely absorbed by the drift.
    #  * "Avoids :00/:15/:30/:45 which GitHub deprioritizes" is not supported by
    #    the data: median dispatch delay is 150m at :00, 149m at :15/:30/:45 and
    #    158m at off-minutes (n=1462 scheduled runs). The minute does not
    #    matter; the hour does.
    # Since per-user scheduling landed, the effective start matters far less
    # anyway: the provider holds each message until the subscriber's own hour
    # (scripts/lib/send-schedule.mjs), so this cron only decides when the
    # campaign is composed and enqueued.
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview, test or send'
        required: false
        default: 'test'
        type: choice
        options:
          - preview
          - test
          - send
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled with human approval.'
        required: false
        default: true
        type: boolean
      human_approval:
        description: 'Explicit human approval for sending the newsletter.'
        required: false
        default: false
        type: boolean
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      subject:
        description: 'Subject override'
        required: false
        default: ''
        type: string
      sections:
        description: 'Comma-separated sections: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      section_order:
        description: 'Comma-separated section order: exchange,articles,fact,tool'
        required: false
        default: 'exchange,articles,fact,tool'
        type: string
      variant:
        description: 'Newsletter variant: jobs, tax, general, or auto (segmented)'
        required: false
        default: 'general'
        type: choice
        options:
          - jobs
          - tax
          - general
          - auto
      enhancements:
        description: 'Comma-separated extras: topJobs,clusterPages,evergreen'
        required: false
        default: 'topJobs,clusterPages,evergreen'
        type: string
      ab_test:
        description: 'A/B test subjects: SubjectA|||SubjectB (optional)'
        required: false
        default: ''
        type: string
      # maileroo is intentionally NOT selectable below (#3135 item 1): manual
      # force-select bypassed the cascade's quota/rotation to push mail
      # through a single provider on operator demand. Maileroo still
      # participates in the automatic `cascade` rotation
      # (scripts/lib/email-cascade.mjs) — that role is separate and is
      # DKIM/DMARC-aligned as of #3154 (root cause of #3066 fixed).
      provider:
        description: 'Email provider (cascade = multi-provider default)'
        required: false
        default: 'cascade'
        type: choice
        options:
          - cascade
          - mailgun
          - mailjet
          - mailtrap
          - resend
          - cloudflare

permissions:
  contents: read
  issues: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require human approval for newsletter side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_TRUSTED_SCHEDULE: 'true'
          APPROVAL_SCOPE: newsletter-send
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      - name: Load secrets from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'

      # ── Codex Luna Max article lane (ON by default, historical kill-switch '0') ──
      # The shared action exposes only a private broker socket to the
      # newsletter process.
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}

      # Content-addressed cache of the assembled dataset. The key is printed by
      # the assembler itself (.github/actions/assemble-jobs-cache-key): sha256
      # of every slice, of its local import closure, of the aux data files it
      # reads, of package-lock.json and of the Node major. It is the SAME value
      # the script checks before restoring, so a hit can only replay an output
      # built from byte-identical inputs; no restore-keys fallback. Measured
      # miss cost: 4m41 (run 35422626497).
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # The newsletter must still go out without job data (intended), but the
      # degradation must be VISIBLE: continue-on-error keeps the job going while
      # the step stays red in the UI, and the next step turns the failure into
      # a ::warning::, a step-summary line and a deduplicated issue. The former
      # `|| echo` swallowed the exit code and painted the step green.
      - name: Assemble jobs dataset from per-crawler slices
        id: assemble
        continue-on-error: true
        run: node scripts/assemble-jobs-dataset.mjs 2>&1

      - name: Report degraded newsletter (jobs assembly failed)
        if: steps.assemble.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          msg="Jobs assembly failed — the newsletter proceeds WITHOUT job data (run ${{ github.run_id }})"
          echo "::warning title=Newsletter degraded::$msg"
          {
            echo "### ⚠️ Newsletter degraded: jobs assembly failed"
            echo ""
            echo "$msg. See the log of step \"Assemble jobs dataset from per-crawler slices\"."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/lib/github-issue-creator.mjs \
            --title "Newsletter degraded: jobs assembly failed" \
            --description "## Newsletter inviata senza annunci
          Lo step \"Assemble jobs dataset from per-crawler slices\" e' fallito: la newsletter prosegue senza la sezione jobs (comportamento voluto), ma il fallimento va indagato.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Recovery mirror (model rpm-canary.yml): the title above is custom, so
      # close-recovered-failure-issues.mjs never sees it; the next newsletter
      # run whose assembly succeeds closes it. Best-effort, exits 0.
      - name: Resolve degraded-newsletter issue on green assembly
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Newsletter degraded: jobs assembly failed" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Save assemble-jobs cache
        if: steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # Job popularity is refreshed once a day by refresh-job-popularity.yml
      # and committed to data/job-popularity.json. The newsletter reads the
      # file directly from the checked-out tree.

      - name: Run newsletter job
        env:
          EMAIL_PROVIDER: ${{ inputs.provider || 'cascade' }}
          NEWSLETTER_EXPERIMENTAL_MODE: false
          NEWSLETTER_ENABLE_SEND: true
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM || '' }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'test' }}
          TARGET: ${{ inputs.target_email || '' }}
          SUBJECT: ${{ inputs.subject || '' }}
          SECTIONS: ${{ inputs.sections || 'exchange,jobs,articles,fact,tool' }}
          SECTION_ORDER: ${{ inputs.section_order || 'exchange,jobs,articles,fact,tool' }}
          VARIANT: ${{ inputs.variant || 'general' }}
          ENHANCEMENTS: ${{ inputs.enhancements || 'topJobs,clusterPages,evergreen' }}
          AB_TEST: ${{ inputs.ab_test || '' }}
          ALLOW_SIDE_EFFECT: ${{ steps.side_effect_gate.outputs.allow_side_effect }}
          EFFECTIVE_DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          AI_MODELS_PREFER: codex-cli/gpt-5.6-luna
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            MODE=preview
          fi
          segmented_display=""
          variant_args=(--variant "$VARIANT")
          if [ "$VARIANT" = "auto" ]; then
            segmented_display="--segmented"
            variant_args=(--segmented)
          fi
          ab_test_args=()
          if [ -n "$AB_TEST" ]; then
            ab_test_args=(--ab-test "$AB_TEST")
          fi
          echo "📧 Running newsletter mode=$MODE target=$TARGET sections=$SECTIONS variant=$VARIANT segmented=$segmented_display ab_test=$AB_TEST"

          common_args=(--target-email "$TARGET" --subject "$SUBJECT" --sections "$SECTIONS" --section-order "$SECTION_ORDER")

          if [ "$MODE" = "send" ]; then
            node scripts/send-newsletter.mjs --send "${common_args[@]}" "${variant_args[@]}" "${ab_test_args[@]}" --enhancements "$ENHANCEMENTS"
          elif [ "$MODE" = "preview" ]; then
            mkdir -p /tmp/newsletter-preview
            node scripts/send-newsletter.mjs --preview "${common_args[@]}" "${variant_args[@]}" --enhancements "$ENHANCEMENTS" > /tmp/newsletter-preview/index.html
            echo "Preview written to /tmp/newsletter-preview/index.html"
          else
            node scripts/send-newsletter.mjs --test "${common_args[@]}" "${variant_args[@]}" --enhancements "$ENHANCEMENTS"
          fi

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            exit 0
          fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
            --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" \
            || echo "::warning::Codex auth broker cleanup did not complete"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
