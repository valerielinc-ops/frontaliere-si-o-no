name: GA4 Error Monitor

# Weekly watchdog for real-user JS errors from GA4. The implementation script
# keeps its historical `posthog-error-issue-sync.mjs` path for compatibility
# with existing monitor issue bodies and source-liveness checks, but it reads
# only GA4 `app_error`/`exception` events from the production host. PostHog is
# intentionally not queried.
#
# Scope boundary: this workflow only measures recurring GA4 error signatures
# and opens/reconciles backlog issues. It does not replace the full analytics
# report, which still owns Search Console and its top-50 snippet measurement,
# PageSpeed/CrUX, the complete GA4 traffic/funnel/error-health and SEO SERP
# report, indexing, Bing, Clarity, landing-value and application-funnel
# measurements, AI-channel history, and their persisted summaries/artifacts.
# The full report's app-error feeder remains separate because it consumes the
# richer saved report and applies its own recency, chunk-family and live-404
# reconciliation rules.
#
# Zero-Claude by design (pure node + the existing gh issue-creator) per the
# frugality rules in AGENTS.md — no claude-code-action, no Max-quota burn.
#
# Auth: the GA4 read-only service account comes from
# FIREBASE_SERVICE_ACCOUNT_JSON (step "Prepare Firebase credentials");
# other settings are loaded from Firebase Remote Config via
# scripts/load-rc-env.mjs.

on:
  schedule:
    # Weekly, Tuesday 07:25 UTC — offset from the full analytics report
    # (Monday 07:00, inside analytics.yml), and clear of every other 07:xx
    # Monday cron
    # (dmarc-monitor, app-auth-health-monitor, funnel-metrics-snapshot,
    # gsc-frontaliere-monitor all run Monday).
    - cron: '25 7 * * 2'
  workflow_dispatch:
    inputs:
      windowDays:
        description: 'Look-back window in days'
        required: false
        type: string
        default: '7'

concurrency:
  group: ga4-error-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # load-rc-env.mjs needs firebase-admin from node_modules to read
        # Remote Config; the monitor itself only uses node built-ins + gh CLI.
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      - name: Sync GA4 app_error issues to backlog
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_DAYS: ${{ inputs.windowDays || '7' }}
        run: node scripts/posthog-error-issue-sync.mjs
