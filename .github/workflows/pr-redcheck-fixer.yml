name: PR ❌ check fixer (bounded, red required check on bot PRs)

# Gemello di `pr-redflag-fixer.yml`, per il sintomo che quello NON copre.
#
# Il 🔴-fixer parte su `pull_request_review`: chiude i findings che il reviewer
# SCRIVE. Ma il reviewer legge il DIFF, non la CI — quindi una PR autonoma con un
# check required rosso e nessun 🔴 non ha alcun meccanismo che la guardi. Nessun
# workflow del repo si attiva su `check_suite`/`check_run` (verificato il
# 2026-08-23 su tutti i 210 workflow): la PR resta rossa finché un umano non ci
# inciampa.
#
# Misurato sul repo, ultime 100 run di `tests` su branch di PR: 51 branch, 11 con
# almeno un `tests` fallito, 10 tornati verdi da soli — il buco e' il residuo, ed
# e' reale. Il caso che l'ha reso visibile e' la PR #6296: il 🔴-fixer ha pushato
# la sua fix alle 03:39, quella fix ha rotto `monitor-issue-dedup`, il round cap
# e' scattato alle 04:12, e la PR e' rimasta rossa **20 ore** — rossa per colpa
# del commit del fixer stesso, con nessuno a guardare.
#
# NON agisce mai su PR scritte da umani, ne' su un rosso che non e' piu' quello
# della HEAD corrente (un rosso stantio non e' un difetto da fixare).
#
# ANTI-LOOP: marker `<!-- REDCHECK_FIX_ROUND: N -->`, cap 2 → `needs-human` e
# STOP senza Claude, identico al gemello e per la stessa ragione: non ripetere
# tentativi sullo stesso rosso quando il branch non sta avanzando.

on:
  workflow_run:
    workflows: ['tests']
    types: [completed]
    # `tests` gira anche su ogni push su main: senza questo filtro ogni sua
    # run creava una run di questo workflow poi `skipped` dal gate del job
    # (86 run in 4 ore, 64 skipped, misura del 2026-09-19). Su main non c'e'
    # nessuna PR da riparare. Il filtro e' sul branch, NON sull'evento: le
    # head rebasate arrivano da `workflow_dispatch` di `tests` sul branch
    # della PR e devono restare dentro.
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numero PR da riparare (bypassa il gate workflow_run)'
        required: true

# Serializzato per branch/PR: nel contesto `workflow_run` il numero non e'
# affidabile (`pull_requests` e' vuoto in diversi casi), mentre `head_branch`
# c'e' sempre. La cancellazione evita due writer body concorrenti; il wrapper
# esegue comunque il CAS body+post-read prima di una scrittura.
concurrency:
  group: body-revision-${{ github.event.workflow_run.head_branch || github.event.inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  # Preflight (no checkout, solo gh): risolve la PR dal `workflow_run` e applica
  # OGNI gate prima di spendere un checkout. actionable=false → skip verde,
  # nessun round consumato. Stessa forma del gemello.
  preflight:
    # `tests` gira su PR, ma anche via `workflow_dispatch` — e' cosi' che
    # `pr-autorebase.yml` ri-testa una head appena rebasata, perche' un push con
    # PAT su un branch di PR non ri-triggera affidabilmente i workflow
    # `pull_request`. Gatare sul solo `pull_request` lascerebbe quindi fuori
    # proprio i rossi delle head rebasate, che sono fra i piu' probabili.
    # Escluso invece `push`: su main non c'e' nessuna PR da riparare (e il
    # preflight lo confermerebbe comunque, non trovando PR aperte per il ramo).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      actionable: ${{ steps.pre.outputs.actionable }}
      pr_number: ${{ steps.pre.outputs.pr_number }}
      head_ref: ${{ steps.pre.outputs.head_ref }}
      head_sha: ${{ steps.pre.outputs.head_sha }}
      review_revision: ${{ steps.pre.outputs.review_revision }}
      failed_check_key: ${{ steps.pre.outputs.failed_check_key }}
      failed_run_id: ${{ steps.pre.outputs.failed_run_id }}
    steps:
      - name: PR actionable, and is the red still the HEAD's?
        id: pre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          skip() { echo "$1"; echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$DISPATCH_PR"
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq ".head.sha" 2>/dev/null || echo "")
            RUN_ID=$(gh run list --repo "$REPO" --workflow=tests.yml --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq "[.[] | select(.headSha==\"$HEAD_SHA\" and .conclusion==\"failure\")][0].databaseId" 2>/dev/null || echo "")
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              skip "Nessuna run tests fallita sulla HEAD di #$PR → niente da riparare (no-op)."
            fi
          else
            # `pull_requests` del workflow_run e' spesso vuoto: la via robusta e'
            # cercare la PR aperta con questo head branch.
            PR=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq "[.[] | select(.head.ref==\"$RUN_BRANCH\")][0].number" 2>/dev/null || echo "")
            if [ -z "$PR" ] || [ "$PR" = "null" ]; then
              skip "Nessuna PR aperta per il branch '$RUN_BRANCH' → skip (no-op)."
            fi
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR" 2>/dev/null || echo "")
          if [ -z "$pr" ]; then
            skip "PR #$PR non leggibile → skip (no-op)."
          fi

          state=$(printf '%s' "$pr" | jq -r '.state')
          draft=$(printf '%s' "$pr" | jq -r '.draft')
          author_type=$(printf '%s' "$pr" | jq -r '.user.type')
          author=$(printf '%s' "$pr" | jq -r '.user.login')
          head_ref=$(printf '%s' "$pr" | jq -r '.head.ref')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          review_revision=$(printf '%s' "$pr" | node -e 'const crypto=require("node:crypto");let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const body=JSON.parse(s).body ?? "";process.stdout.write("body:"+crypto.createHash("sha256").update(body,"utf8").digest("hex"));});')
          has_autofix=$(printf '%s' "$pr" | jq -r 'any(.labels[]?.name; . == "agent:autofix")')

          if [ "$state" != "open" ]; then
            skip "PR #$PR non piu' OPEN (state=$state) → gia' risolta, skip (no-op)."
          fi
          if [ "$draft" = "true" ]; then
            skip "PR #$PR e' draft → fuori scope (come ogni altro strato), skip (no-op)."
          fi

          # Scope: solo PR autonome. `fix/*`, il prefisso riservato
          # `automerge-*` e autore Bot restano compatibilità/provenienza
          # automatica; `agent:autofix` rende esplicita la provenienza delle PR
          # locali/aggregate che usano un altro branch.
          case "$head_ref" in
            fix/*|automerge-*) autonomous=true ;;
            *)
              if [ "$author_type" = "Bot" ] || [ "$has_autofix" = "true" ]; then
                autonomous=true
              else
                autonomous=false
              fi
              ;;
          esac
          if [ "$autonomous" != "true" ]; then
            skip "PR #$PR e' di un umano ($author, head '$head_ref') senza label agent:autofix → fuori scope per design, skip (no-op)."
          fi

          # Il rosso deve essere quello della HEAD CORRENTE. Un rosso su un SHA
          # superato e' gia' stato risolto da un push successivo, e "fixarlo"
          # significherebbe lavorare su una diagnosi vecchia — la trappola che
          # `frontaliere-gate-giudica-build-vecchia` descrive.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$RUN_SHA" != "$head_sha" ]; then
            skip "Il rosso e' del commit $RUN_SHA ma la HEAD e' $head_sha → rosso stantio, gia' superato da un push. Skip (no-op)."
          fi

          # La CI corrente deve essere DAVVERO rossa adesso: fra il trigger e qui
          # un re-run puo' aver rimesso verde, e allora non c'e' niente da fixare.
          if ! rollup=$(gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.conclusion=="failure") | .name] | sort | @json' 2>/dev/null); then
            echo "::error::Check-runs HEAD illeggibili: impossibile verificare quale rosso redcheck dovrebbe riparare."
            exit 1
          fi
          if ! printf '%s' "$rollup" | jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null 2>&1; then
            echo "::error::Check-runs HEAD hanno restituito una firma non interpretabile: stop fail-closed."
            exit 1
          fi
          if [ -z "$rollup" ] || [ "$rollup" = "[]" ]; then
            skip "Nessun check in stato failure sulla HEAD adesso → gia' rientrato, skip (no-op)."
          fi

          # `tests` è un job consolidato: il check-run rosso ha sempre il nome
          # del job, anche quando il rosso viene dal contratto del body o dal
          # gate di review. In quei due casi il redcheck-fixer non ha codice da
          # riparare: spendere Claude qui trasformerebbe un errore di processo
          # in una modifica arbitraria della PR. Leggiamo quindi la Jobs API
          # della run e classifichiamo gli step falliti, non solo il rollup.
          #
          # Fail-closed intenzionale: una risposta mancante, non JSON, senza il
          # job consolidato, senza steps o senza uno step failure verificabile
          # non autorizza il fixer. Un falso skip lascia il required check
          # visibile; un falso `actionable=true` spende Claude e può pushare.
          if ! jobs_json=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --paginate --slurp 2>/dev/null); then
            echo "::error::Jobs API della run tests illeggibile: impossibile distinguere body/review da test failure. Stop fail-closed."
            exit 1
          fi
          # The single-quoted node program intentionally contains template
          # expressions owned by JavaScript, not shell interpolation.
          # shellcheck disable=SC2016
          if ! failure_kind=$(printf '%s' "$jobs_json" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const BODY_CONTRACT_STEPS = new Set([
                // Current consolidated-job signature.
                "PR-body completeness + multi-issue Closes (no checkout, all events)",
                // Compatibility with the immediately preceding main topology.
                "PR-body completeness + multi-issue Closes (no checkout, pull requests)",
              ]);
              const REVIEW_STEPS = new Set([
                "Resolve review input revision (zero-agent)",
                "Re-review guard (skip Claude when no code changed since last LGTM)",
                "Re-review guard (one terminal verdict per HEAD)",
                "Determine review tier",
                "Prefetch review context (zero-Claude, saves turns)",
                "Run Claude review",
                "Run Codex " + "Luna Max review",
                "Fail on transient API error (no review posted)",
                "Validate deterministic review input marker",
                "Require approving Claude review",
                "Require approving Codex review",
                "Fail when required review gate is skipped",
              ]);
              const ACTIONABLE_STEPS = new Set([
                // Known code/test gates take priority when a later review gate
                // also fails: a real test/source failure must not be hidden by
                // the missing review verdict.
                "vitest related (PR diff)",
                "Collect independent source gates",
                "Run source guards in parallel",
              ]);
              const fail = (message) => {
                console.error(message);
                process.exit(1);
              };
              try {
                const pages = JSON.parse(raw);
                if (!Array.isArray(pages) || pages.length === 0) fail("Jobs API: pagine assenti o malformate");
                const jobs = pages.flatMap((page) => {
                  if (!page || !Array.isArray(page.jobs)) fail("Jobs API: pagina senza elenco jobs");
                  return page.jobs;
                });
                const vitestJobs = jobs.filter((job) => job && job.name === "vitest (unit + integration)");
                if (vitestJobs.length !== 1) fail(`Jobs API: attesi 1 job vitest consolidato, trovati ${vitestJobs.length}`);
                const [job] = vitestJobs;
                if (job.status !== "completed" || job.conclusion !== "failure") {
                  fail(`Jobs API: job vitest non è un failure completato (${job.status}/${job.conclusion})`);
                }
                if (!Array.isArray(job.steps)) fail("Jobs API: steps del job vitest assenti o malformati");
                const failedSteps = job.steps
                  .filter((step) => step && step.conclusion === "failure")
                  .map((step) => step.name)
                  .filter((name) => typeof name === "string" && name.length > 0);
                if (failedSteps.length === 0) fail("Jobs API: nessuno step failure verificabile nel job vitest");
                if (failedSteps.some((name) => ACTIONABLE_STEPS.has(name))) {
                  console.log("test-or-infra");
                  return;
                }
                if (failedSteps.some((name) => BODY_CONTRACT_STEPS.has(name))) {
                  console.log("body-contract");
                  return;
                }
                if (failedSteps.some((name) => REVIEW_STEPS.has(name))) {
                  console.log("review-gate");
                  return;
                }
                // A completed, named failure in the consolidated job is still
                // the redcheck signal (tsc, assemble, a newly added guard,
                // etc.). Do not enumerate every code gate here: a new step
                // must remain actionable, while a malformed job/steps payload
                // has already failed closed above.
                console.log("test-or-infra");
              } catch (error) {
                fail(`Jobs API: JSON non interpretabile (${error instanceof Error ? error.message : String(error)})`);
              }
            });
          '); then
            echo "::error::Failure signature della run tests illeggibile o inattesa. Stop fail-closed."
            exit 1
          fi
          case "$failure_kind" in
            body-contract)
              skip "Il failure di tests è il PR-body contract, non un test del codice → nessun redcheck-fixer (no-op)."
              ;;
            review-gate)
              skip "Il failure di tests è il review gate/input, non un test del codice → nessun redcheck-fixer (no-op)."
              ;;
            test-or-infra)
              echo "Failure verificato in uno step del job tests consolidato → redcheck-fixer azionabile."
              ;;
            *)
              echo "::error::Categoria failure tests inattesa: $failure_kind. Stop fail-closed."
              exit 1
              ;;
          esac

          # Non correre sopra il gemello: se il 🔴-fixer sta girando su questo
          # branch, il suo push arriverebbe sopra il nostro (o viceversa).
          busy=$(gh run list --repo "$REPO" --workflow=pr-redflag-fixer.yml --branch "$head_ref" \
            --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
            skip "Il 🔴-fixer sta gia' girando su '$head_ref' → skip per evitare una push race (no-op, si rivaluta al prossimo rosso)."
          fi

          echo "PR #$PR ('$head_ref') rossa su: $rollup → azionabile."
          {
            echo "actionable=true"
            echo "pr_number=$PR"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "review_revision=$review_revision"
            echo "failed_check_key=$rollup"
            echo "failed_run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

  redcheck-fix:
    needs: preflight
    if: needs.preflight.outputs.actionable == 'true'
    runs-on: ubuntu-latest
    # 30→40 (2026-07-17): headroom per il cap turni alzato 45→60.
    timeout-minutes: 40
    steps:
      # Resolve the runner-owned GitHub CLI before checking out the PR.  Every
      # later trusted-policy download uses this immutable absolute path, never
      # a PR-controlled `gh` shim placed on PATH.
      - name: Resolve trusted GitHub CLI (before PR checkout)
        id: trusted_gh
        run: |
          set -euo pipefail
          gh_bin="$(command -v gh || true)"
          if [ -z "$gh_bin" ] || [[ "$gh_bin" != /* ]] || [ ! -x "$gh_bin" ]; then
            echo "::error::GitHub CLI path non assoluto o non eseguibile: ${gh_bin:-missing}"
            exit 1
          fi
          gh_bin="$(realpath "$gh_bin")"
          case "$gh_bin" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "::error::GitHub CLI risolve in un path controllabile dalla PR: $gh_bin"
              exit 1
              ;;
          esac
          probe="$gh_bin"
          while [ "$probe" != '/' ]; do
            if [ -w "$probe" ]; then
              echo "::error::GitHub CLI o una directory del suo path è scrivibile dal runner: $probe"
              exit 1
            fi
            probe="$(dirname "$probe")"
          done
          printf 'path=%s\n' "$gh_bin" >> "$GITHUB_OUTPUT"
          git_bin="$(command -v git || true)"
          if [ -z "$git_bin" ] || [[ "$git_bin" != /* ]] || [ ! -x "$git_bin" ]; then
            echo "::error::Git path non assoluto o non eseguibile: ${git_bin:-missing}"
            exit 1
          fi
          git_bin="$(realpath "$git_bin")"
          case "$git_bin" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "::error::Git risolve in un path controllabile dalla PR: $git_bin"
              exit 1
              ;;
          esac
          probe="$git_bin"
          while [ "$probe" != '/' ]; do
            if [ -w "$probe" ]; then
              echo "::error::Git o una directory del suo path è scrivibile dal runner: $probe"
              exit 1
            fi
            probe="$(dirname "$probe")"
          done
          printf 'git_path=%s\n' "$git_bin" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.head_ref }}
          # Checkout 769-1379s su 3 run: il massimo è il 57% di un cap da 40min,
          # e il lavoro qui è un run Claude (costoso da buttare). Blobless partial
          # clone come issue-fix #4189, che è l'altro job Claude-driven con la
          # stessa forma. Sicuro: il fixer legge/scrive file dell'head e fa
          # `git merge origin/main` — servono i blob dei file toccati, non la
          # storia dei blob.
          filter: blob:none
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 15

      # The PR checkout is attacker-controlled. Claims are the zero-Claude
      # admission barrier, so load their complete import cone from trusted main
      # before evaluating the first claim.
      - name: Bootstrap trusted redcheck policy (no PR code)
        id: trusted_policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_REF: main
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
        run: |
          set -euo pipefail
          policy_root="${RUNNER_TEMP}/redcheck-trusted-policy-${GITHUB_RUN_ID}"
          rm -rf "$policy_root"
          mkdir -p "$policy_root"
          # Un 404 qui vuol dire «${POLICY_REF} non ha questo file», non «rete
          # giù»: il messaggio deve nominare file e ref, altrimenti il rosso
          # arriva come «gate saltato» e manda a cercare la causa altrove.
          download_main() {
            local path="$1"
            local destination="$policy_root/$path"
            mkdir -p "$(dirname "$destination")"
            if ! "$TRUSTED_GH_BIN" api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${POLICY_REF}" \
              --header 'Accept: application/vnd.github.raw+json' > "$destination" 2>"${destination}.err"; then
              echo "::error::policy fidata: '${path}' non scaricabile da ${POLICY_REF} — $(tr -d '\n' < "${destination}.err" | tail -c 300)"
              rm -f "$destination" "${destination}.err"
              exit 1
            fi
            rm -f "${destination}.err"
          }
          for trusted_path in \
            scripts/ci/pr-fixer-claim.mjs \
            scripts/ci/lib/pr-review-admission.mjs \
            scripts/ci/lib/review-input-revision.mjs \
            scripts/ci/lib/constants.mjs \
            scripts/ci/fetch-pr-files.mjs \
            scripts/ci/lib/fetchPrFiles.mjs \
            scripts/lib/int-from-env.mjs; do
            download_main "$trusted_path"
          done
          node --check "$policy_root/scripts/ci/pr-fixer-claim.mjs"
          node --check "$policy_root/scripts/ci/lib/pr-review-admission.mjs"
          node --check "$policy_root/scripts/ci/lib/review-input-revision.mjs"
          printf 'root=%s\n' "$policy_root" >> "$GITHUB_OUTPUT"

      - name: Claim redcheck PR + HEAD + failed check (zero-Claude)
        id: claim
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAIM_ACTION: acquire
          CLAIM_KIND: redcheck
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EVENT_KEY: tests-run:${{ needs.preflight.outputs.failed_run_id }}
          VERDICT_KEY: failed-checks:${{ needs.preflight.outputs.failed_check_key }}
          CHECK_FAILURE_KEY: ${{ needs.preflight.outputs.failed_check_key }}
          CLAIM_TTL_SEC: '3600'
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_POLICY_ROOT: ${{ steps.trusted_policy.outputs.root }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
        run: node "$TRUSTED_POLICY_ROOT/scripts/ci/pr-fixer-claim.mjs" --claim

      - name: Fail closed when redcheck claim is unreadable
        if: steps.claim.outputs.claim_error == 'true'
        run: |
          echo "::error::Claim redcheck PR+HEAD+failed-check illeggibile o non verificabile → nessun fixer Claude."
          exit 1

      - name: Skip already-consumed redcheck failure (zero-Claude)
        if: steps.claim.outputs.claim_allowed != 'true' && steps.claim.outputs.claim_error != 'true'
        run: echo "Rosso già acquisito per questa PR+HEAD+failed-check → nessun secondo round Claude."

      # Profilassi workflow-validation drift (anti-401): la GitHub App del reviewer
      # esige che `.github/workflows/pr-review-loop.yml` sul branch sia BYTE-IDENTICO
      # a `main`. Se `main` ha aggiornato un workflow di review DOPO il branch, la
      # re-review (ri-triggerata dal push del fix sotto) fallirebbe `401 Workflow
      # validation failed`, review vuota, niente `## LGTM`, niente auto-merge — e il
      # 🔴-fix risulterebbe RED senza colpa propria (osservato 2× nel campione 7gg).
      # Allineare i workflow PRIMA: `merge origin/main` no-op se già fresh; il merge
      # viaggia poi sul push del fix dell'agent. Su conflitto → abort + warning
      # (nessuna regressione: il branch resta com'era, comportamento pre-fix).
      - name: Align review workflows (merge origin/main, anti-401 drift)
        if: steps.claim.outputs.claim_allowed == 'true'
        run: |
          set -uo pipefail
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main" -q || true
          if git merge --no-edit -m "$(printf 'Merge origin/main into the PR branch (redcheck-fixer align)\n\nFixer: redcheck-align')" origin/main; then
            echo "✓ branch allineato a origin/main (workflow-validation drift evitato)."
          else
            echo "::warning::merge origin/main in conflitto → abort, branch invariato (no regressione; eventuale 401 drift resta possibile su questo branch)."
            git merge --abort || true
            # Prima del fix del refspec (#6074) `origin/main` non si risolveva mai
            # ("unknown revision"), quindi questo `--abort` era sempre un no-op su un
            # merge mai iniziato: il path di un conflitto GENUINO (MERGE_HEAD reale,
            # marker di conflitto nel worktree) non è mai stato esercitato in
            # produzione (#6089). `git merge --abort` è affidabile, ma qui non ci
            # affidiamo alla sua riuscita silenziosa: verifichiamo esplicitamente che
            # il worktree sia tornato pulito prima che gli step successivi (npm ci,
            # l'agent Claude) lo usino, e forziamo il reset se non lo è.
            if [ -n "$(git status --porcelain)" ]; then
              echo "::warning::worktree non pulito dopo merge --abort, forzo reset a HEAD."
              git reset --hard HEAD
              git clean -fd
            fi
          fi

      - name: Setup Node.js
        if: steps.claim.outputs.claim_allowed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.claim.outputs.claim_allowed == 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.claim.outputs.claim_allowed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; il push del fix userà GITHUB_TOKEN (non ri-triggera la re-review automatica)."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT)
        if: steps.claim.outputs.claim_allowed == 'true'
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      # Primary identity for the fix push below = GitHub App installation token
      # (`frontaliere-automation[bot]`): auto-mints, no expiry babysit, and its
      # push re-triggers pr-review-loop just like the PAT (no GITHUB_TOKEN
      # anti-recursion). Falls back to env.GITHUB_PAT (#2861/#2899).
      - name: Mint App token (primary identity, PAT fallback)
        if: steps.claim.outputs.claim_allowed == 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT (e' la cosa rotta). Scatta solo se
      # NESSUN token usabile (né App né PAT).
      - name: Alert token-down (dedup, zero-Claude)
        if: steps.claim.outputs.claim_allowed == 'true' && env.APP_TOKEN == '' && env.GITHUB_PAT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ── Round cap + capability guard (deterministico, prima di Claude) ────
      # Conta i marker `<!-- REDCHECK_FIX_ROUND: N -->` già sulla PR. A N>=2 →
      # escalation a needs-human, STOP senza Claude. Altrimenti incrementa.
      # Capability guard: se la PR tocca .github/workflows/** e non c'è nessun token
      # capace, il push verrebbe rifiutato (scope workflows) → skip senza bruciare
      # un turno.
      #
      # HAS_PAT accetta ORA anche APP_TOKEN. Fino al 2026-08-06 era legato al solo
      # GITHUB_PAT, e il commento lo giustificava con "la App installation token NON
      # ha lo scope workflows": era vero, ha smesso di esserlo quando alla App
      # `frontaliere-automation` è stato concesso `workflows: write`. Lasciarlo com'era
      # avrebbe fatto continuare a saltare i fix su .github/workflows/** con la
      # motivazione "serve un PAT abilitato" mentre il push sarebbe passato — cioè la
      # stessa capability sbloccata in un posto e ancora rifiutata nel gemello.
      #
      # Allineato al push step più sotto, che era già token-aware
      # (`env.APP_TOKEN || env.GITHUB_PAT`): erano i due lati della stessa decisione,
      # tenuti in disaccordo.
      #
      # 2026-08-08 (#5288): si legge la CAPACITÀ, non la presenza. Il conio riesce
      # (201, token valido) anche quando `workflows` è stato richiesto ma mai approvato
      # sull'installazione — in quel caso il permesso non compare fra i `permissions` e
      # `mint-app-token.mjs` scrive `APP_TOKEN_WORKFLOWS=false`. Con la vecchia
      # condizione questo guard avrebbe lasciato PROCEDERE un fix su
      # `.github/workflows/**` che il push avrebbe poi rifiutato: un turno Claude speso
      # per intero e buttato, che è esattamente ciò che il guard evita. Fail-closed:
      # variabile assente o diversa da 'true' → si ricade sul solo GITHUB_PAT.
      - name: Round cap + capability guard + tier
        id: guard
        if: steps.claim.outputs.claim_allowed == 'true'
        env:
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          TRUSTED_POLICY_ROOT: ${{ steps.trusted_policy.outputs.root }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          HAS_PAT: ${{ env.APP_TOKEN_WORKFLOWS == 'true' || env.GITHUB_PAT != '' }}
        run: |
          set -uo pipefail
          MAX_ROUNDS=2

          # Round corrente = numero di marker già presenti.
          if ! comments=$("$TRUSTED_GH_BIN" api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | .body] | join("\n")' 2>/dev/null); then
            echo "::error::Commenti PR illeggibili: impossibile verificare il round cap redcheck."
            exit 1
          fi
          ROUND=$(printf '%s' "$comments" | grep -oE 'REDCHECK_FIX_ROUND: [0-9]+' \
            | grep -oE '[0-9]+' | sort -rn | head -1 || true)
          ROUND=${ROUND:-0}
          NEXT=$((ROUND + 1))
          echo "Round ❌-check-fix correnti: $ROUND (cap $MAX_ROUNDS)"

          if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then
            echo "::warning::Round cap raggiunto ($ROUND >= $MAX_ROUNDS) → escalation needs-human, no Claude."
            # Idempotente: ogni nuova review/rosso oltre il cap ripassava di qui
            # e ripostava label+commento (5 volte su #9202, 4 su #9238). Si
            # posta una volta sola: il marker nascosto (o il testo storico,
            # per le PR escalate prima del marker) dice che e' gia' stato fatto.
            # Here-string, non `printf | grep -q`: con `pipefail` il SIGPIPE di
            # printf su un elenco commenti grande rendeva falso il guard e
            # ripostava l'escalation (review di #9283).
            if grep -qF '<!-- NEEDS_HUMAN_ESCALATION: redcheck -->' <<<"$comments" \
               || grep -qF '**needs-human** (auto): il ❌-check-fixer' <<<"$comments"; then
              echo "needs-human gia' escalato su questa PR → nessun nuovo label/commento."
            else
              "$TRUSTED_GH_BIN" pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-human" 2>/dev/null \
                || echo "label needs-human assente — creala: gh label create needs-human"
              "$TRUSTED_GH_BIN" pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- NEEDS_HUMAN_ESCALATION: redcheck -->\n🛑 **needs-human** (auto): il ❌-check-fixer ha già tentato %s round senza far tornare verde la CI. STOP automatico (anti-loop, nessun progresso). Serve revisione umana: apri il job fallito, leggi le righe \x60FAIL \x60 e applica il fix a mano.' "$ROUND")" \
                2>/dev/null || true
            fi
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # File cambiati dalla PR (per tier + capability guard). Fallback
          # GraphQL→REST/cap-100 + `expected`/`files_complete` sono nel CLI
          # condiviso `scripts/ci/fetch-pr-files.mjs` (issue #6233: prima erano
          # una reimplementazione shell inline, tenuta allineata a mano alla
          # stessa logica in `scripts/ci/pr-collision-detector.mjs` e nel
          # gemello `pr-review-loop.yml`).
          result=$(node "$TRUSTED_POLICY_ROOT/scripts/ci/fetch-pr-files.mjs" --repo "$REPO" --pr "$PR_NUMBER" 2>/dev/null || echo '{}')
          expected=$(echo "$result" | jq -r '.expected // 0')
          count=$(echo "$result" | jq -r '.count // 0')
          files_complete=$(echo "$result" | jq -r 'if .complete then 1 else 0 end')
          reason=$(echo "$result" | jq -r '.reason // "unknown"')
          files=$(echo "$result" | jq -r '(.files // [])[]')
          if [ "$files_complete" != "1" ]; then
            if [ "$reason" = "rest-hard-limit" ]; then
              echo "::warning::Elenco file INCOMPLETO ($count/$expected, causa: rest-hard-limit — tetto rigido di 3000 file della REST GitHub, non riparabile con retry) → capability guard e tier trattano la PR come se toccasse workflow + code funnel-critical."
            else
              echo "::warning::Elenco file INCOMPLETO ($count/$expected, causa: $reason) → capability guard e tier trattano la PR come se toccasse workflow + code funnel-critical."
            fi
          fi
          touches_wf=$(echo "$files" | grep -E '^\.github/workflows/' || true)
          # Elenco incompleto = «non lo so», e su un capability guard «non lo so»
          # deve pesare come «si'»: il costo di sbagliare in questa direzione e'
          # uno skip con commento, quello opposto e' un turno Claude bruciato e
          # un push che fallisce alla fine.
          if { [ -n "$touches_wf" ] || [ "$files_complete" != "1" ]; } && [ "$HAS_PAT" != "true" ]; then
            # Il commento deve dire QUALE dei due operandi ha fatto scattare lo
            # skip: affermare «la PR tocca i workflow» quando lo scatto viene
            # dall'elenco incompleto manda chi legge a cercare una modifica che
            # non c'e'.
            bt=$(printf '\x60')
            if [ -n "$touches_wf" ]; then
              skip_why="la PR tocca ${bt}.github/workflows/**${bt}"
            else
              skip_why="l'elenco file è incompleto, quindi non si può escludere che la PR tocchi ${bt}.github/workflows/**${bt}"
            fi
            echo "::warning::Skip capability workflows (causa: $skip_why), manca PAT (scope workflows) → push rifiutato, skip senza bruciare un turno Claude."
            "$TRUSTED_GH_BIN" pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "⏭️ 🔴-fixer skip: ${skip_why} e non è disponibile un PAT con scope ${bt}workflows${bt} → il push fallirebbe. Applicare il fix dei 🔴 a mano." \
              2>/dev/null || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tier (mirror di pr-review-loop / issue-fix): high se la PR
          # tocca CODE funnel-critical (tests/, build-plugins/, scripts/lib/,
          # services/seo*), normal altrimenti. Modello UNIFICATO gpt-5.6-luna
          # su entrambi i tier (Codex Luna Max, effort max); i tier
          # restano distinti solo per telemetria/prompt.
          crit=$(echo "$files" | grep -E '^(tests/|build-plugins/|scripts/lib/|services/seo)' || true)
          if [ -n "$crit" ] || [ "$files_complete" != "1" ]; then
            echo "tier=high"   >> "$GITHUB_OUTPUT"
            echo "model=gpt-5.6-luna"   >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
          fi

          # Posta/incrementa il marker round PRIMA di invocare Claude (così se la
          # run muore, il round è comunque contato → l'anti-loop tiene).
          if ! "$TRUSTED_GH_BIN" pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- REDCHECK_FIX_ROUND: %s -->\n_❌-check-fixer round %s/%s avviato (auto)._' "$NEXT" "$NEXT" "$MAX_ROUNDS")" \
            2>/dev/null; then
            echo "::error::Marker REDCHECK_FIX_ROUND non persistito: stop fail-closed prima di Claude."
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "round=$NEXT"  >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      # Push via App token (primario) / PAT (fallback) — ri-attiva pr-review-loop
      # = re-review. Senza nessuno dei due il push userebbe GITHUB_TOKEN e la
      # re-review non partirebbe (anti-ricorsione); il fix verrebbe comunque
      # committato. Esposto come remote authenticato.
      - name: Configure push remote (App token / PAT)
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true' && (env.APP_TOKEN != '' || env.GITHUB_PAT != '')
        env:
          PUSH_TOKEN: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          REPO: ${{ github.repository }}
        # Stessa classe del bug di pr-autorebase: `actions/checkout` persiste
        # `http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>`,
        # che sovrascrive lo `x-access-token:<token>` del remote set-url → il `git
        # push origin` si autenticherebbe come github-actions[bot] (action_required,
        # no re-review). Azzerare l'extraheader prima del set-url forza l'uso
        # dell'App token/PAT.
        run: |
          git config --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"

      # SHA di partenza (post-merge origin/main, pre-Codex): il classify finale lo
      # confronta con la HEAD remota dopo Claude per capire se il round ha davvero
      # pushato un fix → un round che pusha un fix è SUCCESS anche se la run Claude
      # è poi morta `error_max_turns` in cleanup (false-failure: 28% dei fail nel
      # campione 7gg pushavano un commit ma il job restava RED → failure-rate
      # gonfiato nel loop-health-report #1951).
      - name: Record base SHA (pre-Codex)
        id: base
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        env:
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Baseline commenti PRE-Claude (dopo il marker round appena postato dal
          # guard): serve al classify sotto per distinguere "Claude ha lasciato
          # una spiegazione" da "Claude non ha fatto/detto nulla" quando esce
          # 'success' senza push (issue #5534).
          n=$("$TRUSTED_GH_BIN" api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq 'length' 2>/dev/null || echo 0)
          echo "comments=${n:-0}" >> "$GITHUB_OUTPUT"

      # Contesto del rosso, deterministico e BOUNDED, prima di spendere un turno
      # Claude. Due ragioni per farlo qui e non nel prompt: il log di una run
      # `tests` e' decine di MB (farlo scaricare all'agente brucia turni di
      # setup, che e' il primo consumatore misurato in questo repo), e il filtro
      # giusto e' noto — solo le righe `FAIL `, perche' `cancelled` e le righe di
      # riepilogo si leggono come fallimenti e mandano la diagnosi fuori strada.
      - name: Collect failing check context (zero-Claude)
        id: ctx
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        env:
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ needs.preflight.outputs.failed_run_id }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/redcheck"
          mkdir -p "$OUT"

          # Solo i job FALLITI della run: `--log-failed` evita di scaricare
          # l'intero log della suite verde.
          "$TRUSTED_GH_BIN" run view "$FAILED_RUN_ID" --repo "$REPO" --log-failed > "$OUT/raw.log" 2>/dev/null || true
          if [ ! -s "$OUT/raw.log" ]; then
            echo "::warning::log della run $FAILED_RUN_ID non leggibile → l'agente dovra' ricavarsi il fallimento da solo."
            : > "$OUT/failing.txt"
          else
            # Il log CI porta gli escape ANSI come TESTO, non come byte: vanno
            # tolti o il grep sui nomi dei test non aggancia niente.
            sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\^\[\[[0-9;]*m//g' "$OUT/raw.log" > "$OUT/clean.log"
            {
              echo "### Test falliti (righe \`FAIL \`)"
              grep -E '(^|[[:space:]])FAIL ' "$OUT/clean.log" | sed 's/^[^\t]*\t[^\t]*\t[0-9T:.Z-]*//' | sort -u | head -40
              echo
              echo "### Riepilogo vitest"
              grep -E 'Test Files|Tests  ' "$OUT/clean.log" | sort -u | head -10
              echo
              echo "### Estratto attorno al primo fallimento"
              grep -n -m1 -E '(^|[[:space:]])FAIL ' "$OUT/clean.log" | cut -d: -f1 | while read -r n; do
                sed -n "$((n)),$((n+120))p" "$OUT/clean.log"
              done
            } > "$OUT/failing.txt" 2>/dev/null || true
          fi

          # Cap duro: il contesto non deve diventare esso stesso il consumatore
          # di turni che questo step esiste per evitare.
          head -c 24000 "$OUT/failing.txt" > "$OUT/failing.trim" 2>/dev/null || : > "$OUT/failing.trim"
          mv "$OUT/failing.trim" "$OUT/failing.txt"
          echo "contesto raccolto: $(wc -c < "$OUT/failing.txt") byte, $(grep -c 'FAIL ' "$OUT/failing.txt" 2>/dev/null || echo 0) righe FAIL."
          sed -n '1,25p' "$OUT/failing.txt"

      - name: Install deterministic PR body gate
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/pr-body-gate-bin"
          mkdir -p "$gate_dir"
          ln -sf "$GITHUB_WORKSPACE/scripts/gh-pr-body-check.mjs" "$gate_dir/gh"
          echo "$gate_dir" >> "$GITHUB_PATH"
          echo "PR_BODY_GATE_BIN=$gate_dir" >> "$GITHUB_ENV"

      - name: Run Codex Luna Max ❌-check-fix
        id: codex_fix
        if: steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        # Tetto sullo step, stessa ragione del Checkout qui sopra: senza, l'unico
        # limite era il cap del job e la run moriva `cancelled`, che NON fa
        # scattare nessun `if: failure()` e si vede solo dallo scan periodico
        # (`scripts/ci/scan-job-timeouts.mjs`) — issue #7310, run 33851702755:
        # Claude a 2140s dentro un job da 40min, ucciso senza diagnosi propria.
        # 30min lasciano allo step un margine reale (il setup pre-Codex misurato
        # su quella run è 276s) e ~5min di coda agli step `if: always()` che
        # classificano l'esito, invece di consumarli tutti e finire nel buco.
        # Con il `continue-on-error` qui sotto lo scadere del tetto non tinge il
        # job di rosso da sé: consegna la decisione a `Classify outcome`, che
        # guarda il LAVORO (commit pushato sulla PR) e non l'exit della CLI —
        # cioè il contratto che il `cancelled` scavalcava del tutto.
        timeout-minutes: 30
        # Non far fallire il job sull'exit non-zero della action: lo `Classify
        # outcome` finale decide il colore in base al LAVORO reale (commit pushato),
        # non al subtype della CLI. Un error_max_turns DOPO un push valido non è un
        # fallimento del round. I fail genuini (nessun push) vengono ri-marcati RED
        # dal classify → il segnale "non-progress" resta visibile nel loop-health.
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          PR_TITLE: ${{ needs.preflight.outputs.pr_number }}
          REPO: ${{ github.repository }}
          PR_BODY_EXPECTED_REVISION: ${{ needs.preflight.outputs.review_revision }}
          FIX_TIER: ${{ steps.guard.outputs.tier }}
          FIX_ROUND: ${{ steps.guard.outputs.round }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          # Auth via subscription Max (zero API cost). MAI ANTHROPIC_API_KEY.
          # `github_token` alimenta gli helper provider-neutral di quota/delivery;
          # resta allineato alla catena App/PAT del push, ma non è il bridge Codex.
          github_token: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          # Il bridge host-side `gh`/Git può eseguire anche operazioni mutanti: passa solo
          # l'identità operativa App/PAT. L'action esistente fa fail-closed prima di
          # `codex exec` se l'input è vuoto; il token resta fuori dall'ambiente del modello.
          codex_github_token: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          # Le review/PR autonome sono di claude[bot] / github-actions[bot] /
          # frontaliere-automation[bot] (App): le PR aggiornate via App token
          # triggerano con actor = l'App → senza whitelist la action aborta
          # "non-human actor: frontaliere-automation" (exit 1). Mai `*`.
          # 30->45 (misurato 06-12): 25 fail vs 20 success in 7gg, TUTTI
          # error_max_turns al cap 30 (run 27390252111/27375482475/27373263097)
          # = peggior failure-rate del loop; ogni fail brucia ~8-14min di run
          # senza commit e lascia il rosso alla escalation needs-human.
          # 2026-07-02: --dangerously-skip-permissions sostituisce --allowedTools scoped
          # (rationale completo: post-merge-followup.yml action-input comment, stesso
          # fix, evita drift tra copie duplicate).
          # 45->60 (2026-07-17, owner): bump fleet-wide di tutti i cap max-turns
          # Claude dopo l'ennesimo error_max_turns (pr-review-loop run 29556645538).
          prompt: |
            Il branch è già checkoutato sulla head della PR #${{ needs.preflight.outputs.pr_number }}, che ha un **check required ROSSO**.

            **Obiettivo:** far tornare verde la CI su questo branch, senza indebolire nulla. NON mergiare.

            **Il contesto del fallimento è GIÀ stato raccolto** (zero-Claude) in `$RUNNER_TEMP/redcheck/failing.txt`: nomi dei test falliti, riepilogo vitest, ed estratto attorno al primo fallimento. **Leggilo con `Read` come PRIMA cosa.** Non rieseguire `gh run view --log`: è lo stesso output, pesa decine di MB, e scaricarlo è il primo consumatore di turni misurato in questo repo.

            **REGOLA #0, che viene prima di ogni altra: non si fa passare un test indebolendolo.**
            È il modo ovvio e sbagliato di chiudere questo task, ed è vietato da AGENTS.md non-negotiable #1. Concretamente, NON puoi:
            - cancellare, rinominare, o mettere `.skip`/`.todo` su un test o un `it`/`describe`;
            - rilassare un'asserzione perché "tanto il valore nuovo è quello giusto" (soglia alzata, `toBe` → `toBeGreaterThan`, regex allargata, `expect` rimossa);
            - allargare un ratchet, un floor, o un budget per accogliere una regressione;
            - aggiungere un file a un'allowlist **solo** per zittire il guard.
            Se la strada giusta ti sembra una di queste, quasi sempre significa che è il **codice della PR** a essere sbagliato: fixa quello.

            **L'unica eccezione, e va guadagnata:** alcuni guard di questo repo dichiarano ESSI STESSI una via di uscita sanzionata (es. `RAW_CREATE_ALLOWED` in `tests/monitor-issue-dedup.test.ts`, che nel proprio commento ammette «route it through the helper, **or** add it with a reason that has been verified against the code»). Puoi usarla solo se: (a) il guard la documenta esplicitamente nel proprio sorgente, (b) verifichi la condizione **contro il codice**, non contro l'intento, e (c) scrivi nel commento *quale* codice hai letto e *cosa* ti garantisce. Se non puoi fare tutte e tre, non è la tua strada.

            **Metodo:**
            - Capisci PERCHÉ fallisce prima di toccare qualcosa. Le due diagnosi possibili sono opposte: «il codice della PR viola un invariante reale» (→ fixa il codice) oppure «l'invariante ha una via di uscita dichiarata che questo caso soddisfa» (→ vedi l'eccezione sopra).
            - Riproduci in locale prima di fixare: `npx vitest run <file-del-test>`. Un fix non riprodotto non è un fix.
            - **Verifica che il rosso sia davvero della PR.** Se lo stesso test fallisce anche su `main` (`git fetch origin main && git stash && git checkout FETCH_HEAD -- <file>`, o più semplicemente controlla se il test tocca file che la PR non ha cambiato), allora è un rosso EREDITATO: commenta dicendolo, con la prova, e TERMINA senza toccare la PR. Ripararlo qui lo nasconderebbe invece di risolverlo.
            - Fix CHIRURGICO alla CLASSE del difetto (AGENTS.md #6): se il fallimento segnala un pattern, `rg` i sibling e sweepa l'intera classe nella STESSA commit, o giustifica ogni sibling non toccato in `## Non implementato (ancora)`.
            - Mai disabilitare AdSense Auto Ads (#7). Mai path home assoluti o email personali (Privacy).
            - CODE vs DATA: non scorrere i blob `data/**`/`public/**`; fixa il CODE che li genera.
            - Rilancia il test dopo il fix, e verifica che sia verde, prima di committare.

            **Chiusura:**
            - Commit con l'identity già configurata (Valerie Linc <valerielinc@gmail.com>), messaggio conventional.
            - Ogni commit porta il trailer `Fixer: redcheck-round-${{ steps.guard.outputs.round }}` (`git commit -m "<messaggio>" --trailer "Fixer: redcheck-round-${{ steps.guard.outputs.round }}"`): l'identity e' la stessa degli agenti locali e il trailer e' l'unico modo di distinguere i tuoi push.
            - Push sullo stesso branch: `git push origin HEAD:${{ needs.preflight.outputs.head_ref }}`. Il remote `origin` è già autenticato → ri-attiva `tests` e `pr-review-loop`.
            - Aggiorna il body della PR: scrivi il testo completo nel file assoluto `$RUNNER_TEMP/pr-redcheck-pr-body.md` (imposta `BODY_FILE` a quel path), esegui `node scripts/ci/pr-body-check-gate.mjs --body-file "$BODY_FILE"` e solo con exit 0 chiama `gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"`. Non usare un body inline: il wrapper deterministico su `gh` blocca ogni riscrittura senza body-file o con body non conforme prima della chiamata remota. Mantieni `## Implementato` (aggiungi cosa hai riparato e perché il test falliva) + `## Non implementato (ancora)`, con lo stato letterale su ogni bullet: `in questa PR` / `PR concatenata #N` / `per scelta` / `by construction` / `falso positivo` / `blocked: <causa esterna reale>`. Le deroghe decisionali (`per scelta`, `by construction`, `falso positivo`, `blocked: decisione del proprietario`) devono includere nello stesso bullet `**Motivo:** <causa concreta>. **Prossimo passo:** <azione concreta>.`; una deroga nuda o generica viene bloccata. Se stai solo rimandando il lavoro, usa `PR concatenata #N` o `blocked: <causa esterna reale>`.

            **Constraint:**
            - SOLO il check rosso. Non rifare la PR, non drive-by, non "già che ci sono".
            - Se non è fixabile con confidenza (root cause non chiara, serve giudizio umano, o l'unica via sarebbe indebolire un gate) → commenta «❌ check non auto-fixabile: <motivo>» e TERMINA senza commit. Il round cap porta a `needs-human` da solo: è l'esito giusto, non una sconfitta.
            - **Token-lever:** chiamate `gh`/lettura indipendenti vanno emesse in parallelo nello stesso messaggio, mai una per turno — un messaggio con più tool-call resta 1 turno.
            - Una sola passata: diagnostica, fixa, valida, committa, pusha, aggiorna il body, STOP.
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      # Colore del job = LAVORO reale del round, non l'exit della CLI Claude.
      #  • commit pushato sul branch della PR  → round SUCCESS (la re-review girerà;
      #    se 🔴 di nuovo, il round successivo o il round-cap → needs-human). Vale
      #    anche se Claude è morto error_max_turns DOPO il push (false-failure).
      #  • branch remoto avanzato da un altro writer dopo la baseline → run
      #    SUPERSEDED: il claim viene rilasciato e nessun round viene consumato.
      #  • nessun push + Claude FAILED          → non-progress reale → RED (segnale
      #    preservato per il loop-health-report + escalation round-cap).
      #  • nessun push + Claude SUCCESS + NUOVO commento → terminale pulito (es.
      #    "🔴 non auto-fixabile: <motivo>", come richiesto dal prompt) → GREEN.
      #  • nessun push + Claude SUCCESS + NESSUN commento → non-progress SILENZIOSO
      #    → RED. Prima del 2026-08-10 (issue #5534) questo caso era indistinguibile
      #    da un round che ha davvero lavorato: 'success' senza push e senza traccia
      #    usciva verde allo stesso modo di un fix pushato, e né stale-pr-rescuer né
      #    il round-cap potevano più raccoglierlo (un round "riuscito" non ri-arma
      #    niente). Il prompt chiede esplicitamente un commento quando non c'è nulla
      #    da pushare — un round che non lo rispetta non è un terminale legittimo,
      #    è lo stesso buco della PR #142 del repo gemello.
      # I fail infra a monte (npm ci, setup, load-rc) restano RED da soli: quegli
      # step non hanno continue-on-error. Mai fa-passare un gate: il round non ha
      # gate, è telemetria di colore (cfr. #2288, disambigua intenzionale vs crash).
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.guard.outputs.proceed == 'true' && steps.claim.outputs.claim_allowed == 'true'
        env:
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          HEAD_REF: ${{ needs.preflight.outputs.head_ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_COMMENTS: ${{ steps.base.outputs.comments }}
          ACTION_OUTCOME: ${{ steps.codex_fix.outcome }}
        run: |
          set -uo pipefail
          HEAD_NOW=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin "$HEAD_REF" -q 2>/dev/null || true
          REMOTE_SHA=$(git rev-parse "origin/$HEAD_REF" 2>/dev/null || echo "")
          echo "base=$BASE_SHA local=$HEAD_NOW remote=$REMOTE_SHA action=$ACTION_OUTCOME"
          if [ -n "$HEAD_NOW" ] && [ -n "$BASE_SHA" ] && [ "$HEAD_NOW" != "$BASE_SHA" ] && [ "$REMOTE_SHA" = "$HEAD_NOW" ]; then
            # Osservatore del trailer: gli hook sono disattivati per costruzione
            # nel sandbox Codex (`sanitize-git-config.mjs` toglie core.hooksPath),
            # quindi il trailer lo scrive l'agente e qui si misura se c'e'.
            MISSING=$(git log --format='%H %(trailers:key=Fixer,valueonly,separator=%x2C)' "$BASE_SHA..$HEAD_NOW" 2>/dev/null | awk 'NF < 2 {print $1}' | tr '\n' ' ')
            if [ -n "$MISSING" ]; then
              echo "::warning::Commit del fixer senza trailer 'Fixer: redcheck-round-N': $MISSING"
            fi
            echo "✓ Fix pushato questo round (HEAD avanzato e presente su origin/$HEAD_REF) → round SUCCESS. Job verde anche se l'azione è uscita '$ACTION_OUTCOME'."
            exit 0
          fi
          if [ -n "$HEAD_NOW" ] && [ -n "$BASE_SHA" ] && [ -n "$REMOTE_SHA" ] \
             && [ "$REMOTE_SHA" != "$BASE_SHA" ] && [ "$REMOTE_SHA" != "$HEAD_NOW" ]; then
            if [ -n "${GITHUB_ENV:-}" ]; then
              echo 'CLAIM_STATUS=released' >> "$GITHUB_ENV"
            fi
            echo "⚠️ Branch avanzato da un altro writer dopo l'avvio del round (base=$BASE_SHA local=$HEAD_NOW remote=$REMOTE_SHA) → run SUPERSEDED; claim rilasciato, nessun round consumato."
            exit 0
          fi
          if [ "$ACTION_OUTCOME" = "failure" ]; then
            echo "::error::❌-check-fix: nessun commit pushato e l'azione è fallita ('$ACTION_OUTCOME') → non-progress reale. Job RED (segnale preservato; round-cap → needs-human a N>=2)."
            exit 1
          fi
          NOW_COMMENTS=$("$TRUSTED_GH_BIN" api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq 'length' 2>/dev/null || echo "${BASE_COMMENTS:-0}")
          if [ "${NOW_COMMENTS:-0}" -le "${BASE_COMMENTS:-0}" ]; then
            echo "::error::❌-check-fix: nessun commit pushato, l'azione è uscita '$ACTION_OUTCOME', e nessun commento nuovo a spiegare perché (comments $BASE_COMMENTS→$NOW_COMMENTS) → non-progress SILENZIOSO, non un terminale legittimo. Job RED (segnale preservato; round-cap → needs-human a N>=2)."
            exit 1
          fi
          echo "Nessun push ma l'azione è terminata pulita ('$ACTION_OUTCOME') con una spiegazione nuova sulla PR → terminale legittimo (es. non auto-fixabile). Job verde."
          exit 0

      # The fixer action and npm lifecycle scripts ran from the PR checkout.
      # Re-materialize the claim helper from main before the final mutation.
      - name: Refresh trusted redcheck policy before finalize
        id: trusted_policy_final
        if: always() && steps.claim.outputs.claim_acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_REF: main
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
        run: |
          set -euo pipefail
          policy_root="${RUNNER_TEMP}/redcheck-trusted-policy-final-${GITHUB_RUN_ID}"
          rm -rf "$policy_root"
          mkdir -p "$policy_root"
          # Un 404 qui vuol dire «${POLICY_REF} non ha questo file», non «rete
          # giù»: il messaggio deve nominare file e ref, altrimenti il rosso
          # arriva come «gate saltato» e manda a cercare la causa altrove.
          download_main() {
            local path="$1"
            local destination="$policy_root/$path"
            mkdir -p "$(dirname "$destination")"
            if ! "$TRUSTED_GH_BIN" api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${POLICY_REF}" \
              --header 'Accept: application/vnd.github.raw+json' > "$destination" 2>"${destination}.err"; then
              echo "::error::policy fidata: '${path}' non scaricabile da ${POLICY_REF} — $(tr -d '\n' < "${destination}.err" | tail -c 300)"
              rm -f "$destination" "${destination}.err"
              exit 1
            fi
            rm -f "${destination}.err"
          }
          for trusted_path in \
            scripts/ci/pr-fixer-claim.mjs \
            scripts/ci/lib/pr-review-admission.mjs \
            scripts/ci/lib/review-input-revision.mjs \
            scripts/ci/lib/constants.mjs \
            scripts/lib/int-from-env.mjs; do
            download_main "$trusted_path"
          done
          node --check "$policy_root/scripts/ci/pr-fixer-claim.mjs"
          node --check "$policy_root/scripts/ci/lib/pr-review-admission.mjs"
          node --check "$policy_root/scripts/ci/lib/review-input-revision.mjs"
          printf 'root=%s\n' "$policy_root" >> "$GITHUB_OUTPUT"

      - name: Finalize redcheck PR + HEAD + failed check claim
        if: always() && steps.claim.outputs.claim_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAIM_ACTION: finalize
          CLAIM_KIND: redcheck
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EVENT_KEY: tests-run:${{ needs.preflight.outputs.failed_run_id }}
          VERDICT_KEY: failed-checks:${{ needs.preflight.outputs.failed_check_key }}
          CHECK_FAILURE_KEY: ${{ needs.preflight.outputs.failed_check_key }}
          CLAIM_TOKEN: ${{ steps.claim.outputs.claim_token }}
          PROCEED: ${{ steps.guard.outputs.proceed }}
          ACTION_OUTCOME: ${{ steps.codex_fix.outcome }}
          EXEC_FILE: ''
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_POLICY_ROOT: ${{ steps.trusted_policy_final.outputs.root }}
          TRUSTED_GH_BIN: ${{ steps.trusted_gh.outputs.path }}
        run: node "$TRUSTED_POLICY_ROOT/scripts/ci/pr-fixer-claim.mjs" --claim
