name: Traffic Data Freshness Check

on:
  schedule:
    - cron: '0 * * * *'  # Hourly — only DISPATCHES the scheduler when stale, so
                         # volume stays low; the check itself is a cheap ~30s no-op.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Check data freshness
        id: check
        run: |
          CURRENT_HOUR=$(date -u +%H)
          # SELF-HEAL window 05:00-20:00 UTC (covers morning commute ≈ 07:00 CEST):
          # a stale snapshot here re-dispatches the scheduler so commuters still get
          # fresh data. Overnight is intentionally skipped to conserve HERE quota.
          if [ "$CURRENT_HOUR" -lt 5 ] || [ "$CURRENT_HOUR" -ge 20 ]; then
            echo "Outside peak hours, skipping freshness check"
            echo "STALE=false" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            echo "THRESHOLD_MINUTES=0" >> "$GITHUB_OUTPUT"
            echo "PAGEABLE=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ISSUE-PAGEABLE window: only ≥08:00 UTC is a stale reading GUARANTEED to
          # be a real freeze. Before 08:00 the scheduler's morning ramp (*/30 4-7)
          # may not have LANDED yet (GitHub delivers crons 10-60+ min late), so a
          # stale snapshot is expected lag — NOT a bug. In that window we self-heal
          # silently and never open an issue (the cause of the #2617 false page:
          # 674-min "stale" at 06:30 Mon after the weekend gap, before the lagged
          # morning collection arrived). Single source of truth: isStalenessCheckActive()
          # in scripts/check-border-data-health.mjs — the sibling watchdog was fixed
          # the same way at 08:00 (#2587/#2599). Reusing it keeps the 08:00 boundary
          # drift-proof by-construction (no duplicated hour literal). If the gate
          # errors, it fails CLOSED (PAGEABLE=false) — safe: no false page, and the
          # 6h border-watchdog backstop still catches a truly frozen pipeline.
          if node -e "import('./scripts/check-border-data-health.mjs').then(m => process.exit(m.isStalenessCheckActive(Date.now()) ? 0 : 1)).catch(() => process.exit(1))"; then
            echo "PAGEABLE=true" >> "$GITHUB_OUTPUT"
            echo "In issue-pageable window (≥08:00 UTC) — a stale reading is a real freeze."
          else
            echo "PAGEABLE=false" >> "$GITHUB_OUTPUT"
            echo "In commute self-heal window (05:00-08:00 UTC) — stale self-heals silently, no issue."
          fi

          FILE="data/border-wait-current.json"
          if [ ! -f "$FILE" ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=File missing" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_MODIFIED=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('$FILE', 'utf8'));
            const ts = data.updatedAt || data.lastUpdate || data[Object.keys(data)[0]]?.lastUpdate;
            console.log(ts || '');
          ")

          if [ -z "$LAST_MODIFIED" ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=No lastUpdate field found" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_MINUTES=$(node -e "
            const ts = '$LAST_MODIFIED';
            const age = (Date.now() - new Date(ts).getTime()) / 60000;
            console.log(Math.round(age));
          ")

          echo "Data age: ${AGE_MINUTES} minutes"
          echo "AGE_MINUTES=${AGE_MINUTES}" >> "$GITHUB_OUTPUT"

          # Threshold is day-of-week aware: traffic-scheduler.yml only runs every
          # 4h on weekends (vs every 30min at weekday peaks), so a flat 90-min
          # threshold would page on every single weekend slot. Single source of
          # truth: staleThresholdMinutesFor() in scripts/check-border-data-health.mjs
          # (reuses the same module as the PAGEABLE gate above).
          THRESHOLD_MIN=$(node -e "
            import('./scripts/check-border-data-health.mjs').then((m) => {
              console.log(m.staleThresholdMinutesFor(Date.now()));
            });
          ")
          echo "THRESHOLD_MINUTES=${THRESHOLD_MIN}" >> "$GITHUB_OUTPUT"

          if [ "$AGE_MINUTES" -gt "$THRESHOLD_MIN" ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=Data is ${AGE_MINUTES} minutes old (threshold: ${THRESHOLD_MIN} min)" >> "$GITHUB_OUTPUT"
          else
            echo "STALE=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Self-heal (only when stale) ─────────────────────────────────────
      # Dispatch traffic-scheduler so the next hourly check sees recovered data
      # and auto-closes the issue. MUST dispatch via GITHUB_PAT (Remote Config),
      # NOT secrets.GITHUB_TOKEN: a workflow_dispatch authenticated by
      # GITHUB_TOKEN does NOT trigger the target workflow (GitHub anti-recursion),
      # so the old GITHUB_TOKEN dispatch silently no-op'd and never healed.
      # The heavy plumbing (npm ci + Firebase + RC) is gated on STALE so healthy
      # hourly runs stay a cheap ~30s checkout+check.
      - name: Setup Node.js
        if: steps.check.outputs.STALE == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.STALE == 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.check.outputs.STALE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.check.outputs.STALE == 'true'
        run: node scripts/load-rc-env.mjs

      # Primary identity for the self-heal dispatch below = GitHub App
      # installation token (`frontaliere-automation[bot]`): auto-mints, no expiry
      # babysit, and its dispatch re-triggers traffic-scheduler.yml just like the
      # PAT (no GITHUB_TOKEN anti-recursion). Falls back to env.GITHUB_PAT
      # (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        if: steps.check.outputs.STALE == 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Fail LOUD if neither identity loaded. load-rc-env.mjs exits 0 even when
      # Firebase auth fails (creds expired, network, RC downtime) WITHOUT setting
      # GITHUB_PAT, and mint-app-token.mjs exits 0 without APP_TOKEN on any App
      # credential/API issue → trigger-self.sh would then find no token and
      # silently skip (exit 0) — the exact no-op #1104 claimed to fix. Failing
      # here surfaces the regression to the owner (red run + failure issue)
      # instead of letting the watchdog quietly degrade. The page's OWN
      # traffic-scheduler cron + runtime-fetch fallback stay intact, so the
      # funnel never stops — but the self-heal reliability is now observable,
      # not assumed (issue #1106 item 1).
      - name: Verify token loaded (fail-loud guard)
        if: steps.check.outputs.STALE == 'true'
        run: |
          if [ -z "${APP_TOKEN:-}" ] && [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::Neither APP_TOKEN nor GITHUB_PAT set — App-token mint and load-rc-env.mjs both failed. Self-heal dispatch would silently no-op (the regression #1104 addressed). Check App credentials/installation and Firebase SA credentials / RC availability."
            {
              echo "### ⚠️ Self-heal token load FAILED"
              echo ""
              echo "Neither \`APP_TOKEN\` (mint-app-token.mjs) nor \`GITHUB_PAT\` (load-rc-env.mjs) is set."
              echo "The traffic-scheduler self-heal dispatch would have silently no-op'd."
              echo "Page funnel is protected by traffic-scheduler cron + runtime fetch, but the watchdog needs attention."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Token present (APP_TOKEN or GITHUB_PAT) — self-heal dispatch can proceed."

      - name: Self-heal — dispatch traffic-scheduler (via App token/PAT)
        if: steps.check.outputs.STALE == 'true'
        continue-on-error: true
        env:
          # trigger-self.sh resolves TOKEN="${GITHUB_PAT:-${GH_TOKEN:-}}" — override
          # with the App token when minted (primary identity), PAT otherwise.
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          WORKFLOW_FILE: traffic-scheduler.yml
          SELF_TRIGGER_REASON: freshness_self_heal
        run: bash scripts/lib/trigger-self.sh

      # Auto-close confirmed + pending stale issues when data recovers.
      - name: Auto-close stale issues on recovery
        if: steps.check.outputs.STALE == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGE_MINUTES: ${{ steps.check.outputs.AGE_MINUTES }}
          THRESHOLD_MINUTES: ${{ steps.check.outputs.THRESHOLD_MINUTES }}
        run: |
          for LABEL in "traffic-stale" "traffic-stale-pending"; do
            for NUM in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
              gh issue comment "$NUM" --body "Data recovered. Latest snapshot is ${AGE_MINUTES} minutes old (threshold ${THRESHOLD_MINUTES} min). Auto-closing."
              gh issue close "$NUM" --reason completed
              echo "Closed issue #$NUM (label=$LABEL)"
            done
          done

      # Debounced opener: first stale reading → pending. Second consecutive → promote to confirmed.
      # Gated on PAGEABLE so we only ever open/promote an issue ≥08:00 UTC, once the
      # morning collection ramp has certainly landed — staleness before then is
      # expected cron-lag, already self-healed above, and must NOT raise a page.
      - name: Open / debounce stale issue
        if: steps.check.outputs.STALE == 'true' && steps.check.outputs.PAGEABLE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.check.outputs.REASON }}
        run: |
          # Issue #6667 item 3 (follow-up of #6648, same idiom as
          # publisher-jobs-sync.yml): "at most one open issue per label"
          # isn't enforced by anything here — unlike publisher-jobs-sync.yml/
          # refresh-thin-promotions.yml, this workflow has NO `concurrency:`
          # group at all, so a manual dispatch racing the hourly cron could
          # actually create two. Fetch the full set once and warn if the
          # invariant doesn't hold, instead of picking .[0] silently.
          CONFIRMED_JSON=$(gh issue list --label "traffic-stale" --state open --json number)
          CONFIRMED_COUNT=$(echo "$CONFIRMED_JSON" | jq 'length')
          if [ "$CONFIRMED_COUNT" -gt 1 ]; then
            echo "::warning::${CONFIRMED_COUNT} open issues share label 'traffic-stale' — this workflow has no concurrency group, so the ≤1 invariant isn't guaranteed anywhere. Updating only the first."
          fi
          CONFIRMED=$(echo "$CONFIRMED_JSON" | jq -r '.[0].number // empty')
          if [ -n "$CONFIRMED" ]; then
            gh issue comment "$CONFIRMED" --body "Still stale at $(date -u +%FT%TZ) — ${REASON}. Self-heal dispatch attempted."
            echo "Updated existing confirmed issue #$CONFIRMED"
            exit 0
          fi

          PENDING_JSON=$(gh issue list --label "traffic-stale-pending" --state open --json number)
          PENDING_COUNT=$(echo "$PENDING_JSON" | jq 'length')
          if [ "$PENDING_COUNT" -gt 1 ]; then
            echo "::warning::${PENDING_COUNT} open issues share label 'traffic-stale-pending' — this workflow has no concurrency group, so the ≤1 invariant isn't guaranteed anywhere. Promoting only the first."
          fi
          PENDING=$(echo "$PENDING_JSON" | jq -r '.[0].number // empty')
          if [ -n "$PENDING" ]; then
            # 2nd consecutive stale → promote.
            gh issue edit "$PENDING" \
              --add-label "traffic-stale" --add-label "bug" \
              --remove-label "traffic-stale-pending" \
              --title "Traffic data is stale — cron may have failed"
            gh issue comment "$PENDING" --body "Confirmed: 2 consecutive freshness checks reported stale data. ${REASON}. Self-heal dispatched; check traffic-scheduler workflow for failures."
            echo "Promoted pending issue #$PENDING to confirmed"
            exit 0
          fi

          # First stale reading — open a pending issue. Will be auto-closed next run if data recovers.
          gh issue create \
            --title "[pending] Traffic data freshness — 1st stale reading" \
            --body "First stale reading detected at $(date -u +%FT%TZ). Reason: ${REASON}. Self-heal dispatched traffic-scheduler. This issue will be auto-closed on next freshness run if data recovers, or promoted to a confirmed bug if it remains stale." \
            --label "traffic-stale-pending"
          echo "Opened pending issue"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
