name: Traffic Data Freshness Check

on:
  schedule:
    - cron: '0 * * * *'  # Hourly — only DISPATCHES the scheduler when stale, so
                         # volume stays low; the check itself is a cheap ~30s no-op.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check data freshness
        id: check
        run: |
          CURRENT_HOUR=$(date -u +%H)
          # Active window 05:00-20:00 UTC (covers morning commute ≈ 07:00 CEST).
          # Overnight is intentionally skipped to conserve HERE quota.
          if [ "$CURRENT_HOUR" -lt 5 ] || [ "$CURRENT_HOUR" -ge 20 ]; then
            echo "Outside peak hours, skipping freshness check"
            echo "STALE=false" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE="data/border-wait-current.json"
          if [ ! -f "$FILE" ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=File missing" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_MODIFIED=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('$FILE', 'utf8'));
            const ts = data.updatedAt || data.lastUpdate || data[Object.keys(data)[0]]?.lastUpdate;
            console.log(ts || '');
          ")

          if [ -z "$LAST_MODIFIED" ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=No lastUpdate field found" >> "$GITHUB_OUTPUT"
            echo "AGE_MINUTES=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_MINUTES=$(node -e "
            const ts = '$LAST_MODIFIED';
            const age = (Date.now() - new Date(ts).getTime()) / 60000;
            console.log(Math.round(age));
          ")

          echo "Data age: ${AGE_MINUTES} minutes"
          echo "AGE_MINUTES=${AGE_MINUTES}" >> "$GITHUB_OUTPUT"

          if [ "$AGE_MINUTES" -gt 90 ]; then
            echo "STALE=true" >> "$GITHUB_OUTPUT"
            echo "REASON=Data is ${AGE_MINUTES} minutes old (threshold: 90 min)" >> "$GITHUB_OUTPUT"
          else
            echo "STALE=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Self-heal (only when stale) ─────────────────────────────────────
      # Dispatch traffic-scheduler so the next hourly check sees recovered data
      # and auto-closes the issue. MUST dispatch via GITHUB_PAT (Remote Config),
      # NOT secrets.GITHUB_TOKEN: a workflow_dispatch authenticated by
      # GITHUB_TOKEN does NOT trigger the target workflow (GitHub anti-recursion),
      # so the old GITHUB_TOKEN dispatch silently no-op'd and never healed.
      # The heavy plumbing (npm ci + Firebase + RC) is gated on STALE so healthy
      # hourly runs stay a cheap ~30s checkout+check.
      - name: Setup Node.js
        if: steps.check.outputs.STALE == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.STALE == 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.check.outputs.STALE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.check.outputs.STALE == 'true'
        run: node scripts/load-rc-env.mjs

      # Fail LOUD if the PAT didn't load. load-rc-env.mjs exits 0 even when
      # Firebase auth fails (creds expired, network, RC downtime) WITHOUT setting
      # GITHUB_PAT → trigger-self.sh would then find no token and silently skip
      # (exit 0) — the exact no-op #1104 claimed to fix. Failing here surfaces
      # the regression to the owner (red run + failure issue) instead of letting
      # the watchdog quietly degrade. The page's OWN traffic-scheduler cron +
      # runtime-fetch fallback stay intact, so the funnel never stops — but the
      # self-heal reliability is now observable, not assumed (issue #1106 item 1).
      - name: Verify PAT loaded (fail-loud guard)
        if: steps.check.outputs.STALE == 'true'
        run: |
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT not set after load-rc-env.mjs — Firebase/RC auth likely failed. Self-heal dispatch would silently no-op (the regression #1104 addressed). Check Firebase SA credentials / RC availability."
            {
              echo "### ⚠️ Self-heal PAT load FAILED"
              echo ""
              echo "\`GITHUB_PAT\` is unset after \`load-rc-env.mjs\` — Firebase/RC auth failed."
              echo "The traffic-scheduler self-heal dispatch would have silently no-op'd."
              echo "Page funnel is protected by traffic-scheduler cron + runtime fetch, but the watchdog needs attention."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GITHUB_PAT present — self-heal dispatch can proceed."

      - name: Self-heal — dispatch traffic-scheduler (via PAT)
        if: steps.check.outputs.STALE == 'true'
        continue-on-error: true
        env:
          # GITHUB_PAT is loaded into $GITHUB_ENV by the RC step above.
          WORKFLOW_FILE: traffic-scheduler.yml
          SELF_TRIGGER_REASON: freshness_self_heal
        run: bash scripts/lib/trigger-self.sh

      # Auto-close confirmed + pending stale issues when data recovers.
      - name: Auto-close stale issues on recovery
        if: steps.check.outputs.STALE == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGE_MINUTES: ${{ steps.check.outputs.AGE_MINUTES }}
        run: |
          for LABEL in "traffic-stale" "traffic-stale-pending"; do
            for NUM in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
              gh issue comment "$NUM" --body "Data recovered. Latest snapshot is ${AGE_MINUTES} minutes old (threshold 90 min). Auto-closing."
              gh issue close "$NUM" --reason completed
              echo "Closed issue #$NUM (label=$LABEL)"
            done
          done

      # Debounced opener: first stale reading → pending. Second consecutive → promote to confirmed.
      - name: Open / debounce stale issue
        if: steps.check.outputs.STALE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.check.outputs.REASON }}
        run: |
          CONFIRMED=$(gh issue list --label "traffic-stale" --state open --json number --jq '.[0].number')
          if [ -n "$CONFIRMED" ]; then
            gh issue comment "$CONFIRMED" --body "Still stale at $(date -u +%FT%TZ) — ${REASON}. Self-heal dispatch attempted."
            echo "Updated existing confirmed issue #$CONFIRMED"
            exit 0
          fi

          PENDING=$(gh issue list --label "traffic-stale-pending" --state open --json number --jq '.[0].number')
          if [ -n "$PENDING" ]; then
            # 2nd consecutive stale → promote.
            gh issue edit "$PENDING" \
              --add-label "traffic-stale" --add-label "bug" \
              --remove-label "traffic-stale-pending" \
              --title "Traffic data is stale — cron may have failed"
            gh issue comment "$PENDING" --body "Confirmed: 2 consecutive freshness checks reported stale data. ${REASON}. Self-heal dispatched; check traffic-scheduler workflow for failures."
            echo "Promoted pending issue #$PENDING to confirmed"
            exit 0
          fi

          # First stale reading — open a pending issue. Will be auto-closed next run if data recovers.
          gh issue create \
            --title "[pending] Traffic data freshness — 1st stale reading" \
            --body "First stale reading detected at $(date -u +%FT%TZ). Reason: ${REASON}. Self-heal dispatched traffic-scheduler. This issue will be auto-closed on next freshness run if data recovers, or promoted to a confirmed bug if it remains stale." \
            --label "traffic-stale-pending"
          echo "Opened pending issue"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
