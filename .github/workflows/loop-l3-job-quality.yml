name: Loop L3 job quality to apply

on:
  schedule:
    - cron: '57 8 * * *'
  push:
    branches: [main]
    paths:
      - 'data/jobs-crawler-summaries/by-crawler/**'
      - 'data/job-apply-outcome-baseline.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l3-job-quality.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l3-job-quality.yml'
  pull_request:
    paths:
      - 'data/jobs-crawler-summaries/by-crawler/**'
      - 'data/job-apply-outcome-baseline.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l3-job-quality.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l3-job-quality.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when the apply handoff is not trustworthy'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l3-job-quality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout job quality inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/jobs-crawler-summaries/by-crawler/
            /data/job-apply-outcome-baseline.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l3-job-quality.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/github-issue-creator.mjs
            /.github/workflows/loop-l3-job-quality.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Audit job quality to apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l3
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --apply --report-dir "$REPORT_DIR" --summary-dir data/jobs-crawler-summaries/by-crawler --outcomes data/job-apply-outcome-baseline.json)
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l3-job-quality.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l3-result.json" >/dev/null 2>&1; then
            echo 'L3 finding persisted as a deduplicated issue; invalid records remain runner-local and quarantined.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Record canonical L3 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l3
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L3 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L3 observation and actions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l3-job-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l3/
          retention-days: 90
          if-no-files-found: error
