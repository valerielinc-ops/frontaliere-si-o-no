name: Enable native auto-merge

# GitHub's native auto-merge owns the waiting/merge decision. This workflow
# only opts an eligible PR into that mechanism after the repository's explicit
# reviewer/check verdict; native merge still owns the final wait and merge.
# The required `vitest (unit + integration)` context is the complete `tests`
# job. The helper below additionally requires the latest reviewer-bot verdict
# to be anchored to the current HEAD, so an opening event cannot opt in an
# unreviewed PR.
on:
  # This workflow only calls the GitHub API and never executes PR code. Any
  # local source is checked out explicitly from trusted main below.
  # pull_request_target keeps the write permission available for fork PRs too.
  pull_request_target:
    # These events are observation/retry points only: the helper is fail-closed
    # until review and the required check both pass.
    types: [opened, edited, reopened, ready_for_review, synchronize]
  pull_request_review:
    # A later edit/dismissal invalidates a previously valid verdict too; the
    # same fail-closed gate must re-read the review/check pair and revoke any
    # persisted native opt-in.
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable:
    # Guard explicitly against non-PR dispatches. This keeps a malformed or
    # manually replayed push event from producing a failed empty run while
    # dereferencing pull_request fields that do not exist.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # Git is used instead of one Contents API request per helper. The ref is
      # pinned to trusted main, and the sparse/partial checkout contains only
      # the immutable source needed by the gate. No PR ref is ever checked out
      # or executed. A missing helper fails this run closed; retry workflow
      # ticks keep recovery automatic when the source is transiently absent.
      - name: Checkout trusted native auto-merge source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main
          path: native-automerge-main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/native-automerge-source.mjs
            /scripts/load-rc-env.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/ci/native-automerge-gate.mjs
            /scripts/ci/review-test-policy.mjs
            /scripts/ci/lib/automation-risk-policy.mjs
            /scripts/ci/lib/fetchPrFiles.mjs
            /scripts/ci/lib/vitestCheck.mjs
            /scripts/ci/lib/constants.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /data/loop-fleet/loop-registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate trusted native auto-merge source
        env:
          NATIVE_AUTOMERGE_SOURCE_ROOT: ${{ github.workspace }}/native-automerge-main
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/ci/native-automerge-source.mjs"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/load-rc-env.mjs"

      - name: Enable GitHub auto-merge after verified verdict
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_PAT" ]; then
            echo "GITHUB_PAT was not loaded from Remote Config" >&2
            exit 1
          fi
          pr_number="${PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ -n "${WORKFLOW_HEAD_SHA:-}" ]; then
            pr_number=$(GH_TOKEN="$GITHUB_PAT" gh api \
              "repos/$REPOSITORY/commits/$WORKFLOW_HEAD_SHA/pulls" --paginate --slurp \
              | jq -r '[add[] | select(.state == "open" and .base.ref == "main") | .number] | .[0] // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo 'Native auto-merge guard: no open main PR found for this event; no merge.'
            exit 0
          fi
          cd "$NATIVE_AUTOMERGE_SOURCE_ROOT"
          GH_TOKEN="$GITHUB_PAT" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
            "$REPOSITORY" "$pr_number"
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
