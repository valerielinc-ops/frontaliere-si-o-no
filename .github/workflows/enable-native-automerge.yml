name: Enable native auto-merge

# GitHub's native auto-merge owns the waiting/merge decision. This workflow
# only opts an eligible PR into that mechanism after the repository's explicit
# reviewer/check verdict; native merge still owns the final wait and merge.
# The required `vitest (unit + integration)` context is the complete `tests`
# job. The helper below additionally requires the latest reviewer-bot verdict
# to be anchored to the current HEAD, so an opening event cannot opt in an
# unreviewed PR.
# THE PER-PR EVENT TRIGGERS ARE GONE. The hot path now lives at the end of the
# required `tests` job (`.github/workflows/tests.yml`, step `Enable native
# auto-merge from the required job`), which already holds the review verdict and
# the run identity this gate needs — so the nine events that used to observe the
# same fail-closed verdict were nine separate runs each redoing the sparse
# checkout, Firebase, the Remote Config PAT and the review/check reads.
# Measured 2026-09-18 on the last 100 runs of this workflow: 49 `workflow_run`,
# 29 `pull_request_target`, 22 `pull_request_review`; 59 of the 79 runs queued on
# the account (75%) were this workflow, starving the `vitest` runs those same PRs
# were waiting for. The per-branch `concurrency` group added earlier deduplicates
# bursts on the SAME PR, not the volume across PRs: of 11 runs created after that
# push exactly one was cancelled.
#
# Perché ciascun tipo rimosso non perde nulla — verificato su `origin/main`,
# dove i tipi di `tests.yml` sono `[opened, synchronize, reopened,
# ready_for_review]`:
#   - `opened`, `reopened`, `ready_for_review`: sono tra i tipi di `tests`, che
#     riparte e concede dall'interno del job.
#   - `synchronize`: idem, e in più un push nuovo rimette il check required in
#     pending, quindi il native auto-merge si ferma da sé — la revoca è implicita
#     nel check required, non serve un evento che la esegua.
#   - `edited`: NON è tra i tipi di `tests` (rimosso di proposito: 38 delle 116
#     run su PR nascevano da un `edited` che lasciava l'HEAD identico). Resta
#     comunque rimovibile qui, ma per un altro motivo: un cambio di titolo o
#     descrizione non tocca né la review né i check, quindi non può in nessun
#     caso produrre una concessione che non ci fosse già.
#   - `pull_request_review: [submitted]`: la review ora è a monte, nello stesso
#     job che concede.
#   - `pull_request_review: [dismissed, edited]`: erano il solo caso in cui
#     l'LGTM decade senza che nulla rivaluti. La rivalutazione non sparisce, si
#     sposta sul cron sotto: `revalidateNativeAutoMerge` revoca l'opt-in quando
#     la coppia review/check non tiene più, entro 20 minuti invece che subito.
#
# The retry and revocation channel is NOT gone and is not per-PR:
# `retry-native-automerge.yml` runs `*/20 * * * *`, ONE run per tick for every
# open PR (up to 100), through this same helper — which also revokes an opt-in
# whose review/check pair no longer holds (a dismissed or edited review). The
# outside-diff review-gate exception, which structurally needs a COMPLETED run
# and therefore cannot be granted from inside the job, is served by that sweep.
#
# `workflow_dispatch` is kept so a single PR can still be re-evaluated by hand
# without waiting for the sweep. Removing this file has its own closing
# criterion (no orphan runs + green consumers in a real run) and is a separate
# change.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR aperta su main da rivalutare'
        required: true

concurrency:
  group: enable-native-automerge-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      # Git is used instead of one Contents API request per helper. The ref is
      # pinned to trusted main, and the sparse/partial checkout contains only
      # the immutable source needed by the gate. No PR ref is ever checked out
      # or executed. A missing helper fails this run closed; retry workflow
      # ticks keep recovery automatic when the source is transiently absent.
      - name: Checkout trusted native auto-merge source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main
          path: native-automerge-main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/native-automerge-source.mjs
            /scripts/load-rc-env.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/ci/native-automerge-gate.mjs
            /scripts/ci/review-test-policy.mjs
            /scripts/ci/lib/automation-risk-policy.mjs
            /scripts/ci/lib/fetchPrFiles.mjs
            /scripts/ci/lib/vitestCheck.mjs
            /scripts/ci/lib/constants.mjs
            /scripts/ci/lib/pr-review-admission.mjs
            /scripts/ci/lib/review-input-revision.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /data/loop-fleet/loop-registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate trusted native auto-merge source
        env:
          NATIVE_AUTOMERGE_SOURCE_ROOT: ${{ github.workspace }}/native-automerge-main
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/ci/native-automerge-source.mjs"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/load-rc-env.mjs"

      - name: Enable GitHub auto-merge after verified verdict
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_PAT" ]; then
            echo "GITHUB_PAT was not loaded from Remote Config" >&2
            exit 1
          fi
          pr_number="${PR_NUMBER:-}"
          # Un input a mano non è una prova: il gate rifiuta tutto ciò che non è
          # un numero di PR, e resta lui l'unico a decidere l'opt-in.
          if ! printf '%s' "$pr_number" | grep -qE '^[0-9]+$'; then
            echo "::error::pr_number non valido: serve il numero di una PR aperta su main."
            exit 1
          fi
          cd "$NATIVE_AUTOMERGE_SOURCE_ROOT"
          GH_TOKEN="$GITHUB_PAT" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
            "$REPOSITORY" "$pr_number"
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
