name: Enable native auto-merge

# GitHub's native auto-merge owns the waiting/merge decision. This workflow
# only opts an eligible PR into that mechanism; required checks and reviews are
# configured on the main branch ruleset, not reimplemented in Actions.
# The required `vitest (unit + integration)` context is the complete `tests`
# job, whose final review-gate step fails on a Claude `🔴 Important`; native
# auto-merge therefore cannot bypass the Claude decision.
on:
  # This workflow only calls the GitHub API and never executes PR code.
  # pull_request_target keeps the write permission available for fork PRs too.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout
        with:
          ref: main

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Enable GitHub auto-merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GITHUB_PAT" ]; then
            echo "GITHUB_PAT was not loaded from Remote Config" >&2
            exit 1
          fi
          GH_TOKEN="$GITHUB_PAT" gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch