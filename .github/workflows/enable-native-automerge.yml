name: Enable native auto-merge

# GitHub's native auto-merge owns the waiting/merge decision. This workflow
# only opts an eligible PR into that mechanism after the repository's explicit
# reviewer/check verdict; native merge still owns the final wait and merge.
# The required `vitest (unit + integration)` context is the complete `tests`
# job. The helper below additionally requires the latest reviewer-bot verdict
# to be anchored to the current HEAD, so an opening event cannot opt in an
# unreviewed PR.
on:
  # This workflow only calls the GitHub API and never executes PR code.
  # pull_request_target keeps the write permission available for fork PRs too.
  pull_request_target:
    # These events are observation/retry points only: the helper is fail-closed
    # until review and the required check both pass.
    types: [opened, edited, reopened, ready_for_review, synchronize]
  pull_request_review:
    # A later edit/dismissal invalidates a previously valid verdict too; the
    # same fail-closed gate must re-read the review/check pair and revoke any
    # persisted native opt-in.
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable:
    # Guard explicitly against non-PR dispatches. This keeps a malformed or
    # manually replayed push event from producing a failed empty run while
    # dereferencing pull_request fields that do not exist.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Static control-plane bootstrap guard (pre-existing, deny-by-default)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ -n "${EVENT_HEAD_SHA:-}" ]; then
            if ! pr_number=$(gh api "repos/$REPOSITORY/commits/$EVENT_HEAD_SHA/pulls" --paginate --slurp \
              | jq -r '[add[] | select(.state == "open" and .base.ref == "main") | .number] | .[0] // empty'); then
              echo "::error::control-plane bootstrap guard: PR metadata non verificabile; hard fail umano."
              exit 1
            fi
          fi
          if [ -z "$pr_number" ]; then
            echo 'control-plane bootstrap guard: nessuna PR associata; nessuna mutation.'
            exit 0
          fi
          if ! files=$(gh api "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" --paginate --jq '.[].filename'); then
            echo "::error::control-plane bootstrap guard: file-list PR #$pr_number non verificabile; hard fail umano."
            exit 1
          fi
          if [ -z "$files" ]; then
            echo "::error::control-plane bootstrap guard: file-list PR #$pr_number vuoto/non verificabile; hard fail umano."
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/actions/*|scripts/ci/*|scripts/lib/classify-issue.mjs|REVIEW.md)
                echo "::error::control-plane path $path in PR #$pr_number: bootstrap deny-by-default; serve approvazione umana."
                exit 1
                ;;
            esac
          done <<< "$files"
          echo "control-plane bootstrap guard: PR #$pr_number non modifica il control-plane staticamente."

      # This job needs only the Remote Config loader and its dependency-free
      # JWT helper. A git checkout still has to fetch the repository's large
      # tree before sparse checkout can select those files, so download the
      # raw files directly instead of initializing a repository.
      #
      # Two-step rollout: the gate is trusted only when it is already present
      # on main. If this workflow lands before the helper (or main is rolled
      # back to a version without it), the job is a successful no-op and never
      # enables native auto-merge.
      - name: Download trusted workflow helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/native-automerge-helpers"
          mkdir -p "$helper_dir/lib"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/load-rc-env.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$helper_dir/load-rc-env.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/lib/google-service-account-token.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$helper_dir/lib/google-service-account-token.mjs"
          # Keep the final extension while syntax-checking: Node otherwise
          # parses an `.tmp` file as CommonJS and rejects the helper exports.
          gate_tmp="$helper_dir/native-automerge-gate-check.mjs"
          policy_tmp="$helper_dir/review-test-policy-check.mjs"
          risk_tmp="$helper_dir/lib/automation-risk-policy-check.mjs"
          files_tmp="$helper_dir/lib/fetchPrFiles-check.mjs"
          vitest_tmp="$helper_dir/lib/vitestCheck-check.mjs"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/native-automerge-gate.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$gate_tmp" \
            && gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/review-test-policy.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$policy_tmp" \
            && gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/lib/automation-risk-policy.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$risk_tmp" \
            && gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/lib/fetchPrFiles.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$files_tmp" \
            && gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/lib/vitestCheck.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$vitest_tmp" \
            && [ -s "$gate_tmp" ] \
            && [ -s "$policy_tmp" ] \
            && [ -s "$risk_tmp" ] \
            && [ -s "$files_tmp" ] \
            && [ -s "$vitest_tmp" ] \
            && node --check "$gate_tmp" \
            && node --check "$policy_tmp" \
            && node --check "$risk_tmp" \
            && node --check "$files_tmp" \
            && node --check "$vitest_tmp" \
            && grep -q 'CONTROL_PLANE_GUARD_VERSION' "$risk_tmp" \
            && grep -q 'isControlPlanePath' "$risk_tmp"; then
            mv "$gate_tmp" "$helper_dir/native-automerge-gate.mjs"
            mv "$policy_tmp" "$helper_dir/review-test-policy.mjs"
            mv "$risk_tmp" "$helper_dir/lib/automation-risk-policy.mjs"
            mv "$files_tmp" "$helper_dir/lib/fetchPrFiles.mjs"
            mv "$vitest_tmp" "$helper_dir/lib/vitestCheck.mjs"
            gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ci/lib/constants.mjs?ref=main" \
              --header 'Accept: application/vnd.github.raw+json' \
              > "$helper_dir/lib/constants.mjs"
            echo "NATIVE_AUTOMERGE_BOOTSTRAP_READY=true" >> "$GITHUB_ENV"
            echo 'Native auto-merge gate bootstrap is present on main.'
          else
            rm -f "$gate_tmp" "$policy_tmp" "$risk_tmp" "$files_tmp" "$vitest_tmp" \
              "$helper_dir/native-automerge-gate.mjs" "$helper_dir/review-test-policy.mjs" \
              "$helper_dir/lib/automation-risk-policy.mjs" \
              "$helper_dir/lib/fetchPrFiles.mjs"
            echo "NATIVE_AUTOMERGE_BOOTSTRAP_READY=false" >> "$GITHUB_ENV"
            echo 'Native auto-merge gate is not installed on main; fail-closed no-op.'
          fi
          echo "NATIVE_AUTOMERGE_HELPER_DIR=$helper_dir" >> "$GITHUB_ENV"

      - name: Prepare Firebase credentials
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        run: node "$NATIVE_AUTOMERGE_HELPER_DIR/load-rc-env.mjs"

      - name: Enable GitHub auto-merge after verified verdict
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_PAT" ]; then
            echo "GITHUB_PAT was not loaded from Remote Config" >&2
            exit 1
          fi
          pr_number="${PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ -n "${WORKFLOW_HEAD_SHA:-}" ]; then
            pr_number=$(GH_TOKEN="$GITHUB_PAT" gh api \
              "repos/$REPOSITORY/commits/$WORKFLOW_HEAD_SHA/pulls" --paginate --slurp \
              | jq -r '[add[] | select(.state == "open" and .base.ref == "main") | .number] | .[0] // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo 'Native auto-merge guard: no open main PR found for this event; no merge.'
            exit 0
          fi
          GH_TOKEN="$GITHUB_PAT" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
            "$REPOSITORY" "$pr_number"
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
