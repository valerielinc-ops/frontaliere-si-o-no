name: Technical operations supervisor

# L11 della flotta: osserva OGNI workflow del repository, compresi quelli che
# non hanno "loop" nel nome, e controlla riferimenti tecnici e contratti di
# estrazione dati. Il report non riscrive codice o dati: con --issue consegna le
# prove al normale ciclo issue → PR → review → merge. La produzione dell'issue
# resta esplicita (schedule o dispatch): un push su main è solo osservazione.

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    # A reviewed ledger merge already passed L11; starting L11 again from its
    # own append-only evidence would create an unbounded PR chain. Mixed pushes
    # still run because paths-ignore applies only when every changed path is
    # ignored.
    paths-ignore:
      - 'data/loop-fleet/ledger/**'
  workflow_dispatch:
    inputs:
      report_issue:
        description: 'Persisti il report come issue deduplicata'
        required: false
        type: boolean
        default: false
  # Sulle PR L11 non apre issue (REPORT_ISSUE e' solo schedule/dispatch), non
  # e' un check richiesto e il ledger scarta le run `pull_request`: senza filtro
  # partiva su ogni PR (~15 run/ora, ognuna con npm ci e un artifact a 90
  # giorni). Resta solo dove la PR cambia cio' che L11 audita o il suo codice:
  # workflow/action, il motore dell'audit con il suo grafo di import, i
  # producer vincolati dal registry e il registry stesso. Un difetto indotto
  # altrove (es. uno script cancellato ma ancora referenziato) lo vede il push
  # su main, che resta senza filtro.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'scripts/ci/technical-operations-audit.mjs'
      - 'scripts/ci/loop-fleet-*.mjs'
      - 'scripts/ci/loop-l*.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-*.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - 'data/loop-fleet/loop-registry.json'
      - 'package-lock.json'

permissions:
  contents: read
  issues: write

concurrency:
  # I push ravvicinati su main sono osservazioni sostituibili: mantenere una
  # run per ogni commit alimenterebbe issue/PR concorrenti prima che la prova
  # precedente abbia potuto essere rimediata. Schedule, dispatch e PR restano
  # osservatori indipendenti e non si cancellano a vicenda.
  group: technical-operations-supervisor-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow inventory
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
            !/data/jobs-snapshots-history/
            !/data/orphan-enriched-data/
            !/data/all-known-job-slugs/
            !/public/data/
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/ci/loop-fleet-registry-audit.mjs
          sparse-checkout-cone-mode: false
      - name: Overlay durable ledger branch
        env:
          LEDGER_BRANCH: ledger/loop-fleet
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "refs/heads/$LEDGER_BRANCH" >/dev/null 2>&1; then
            echo "::notice::durable ledger branch $LEDGER_BRANCH does not exist yet; using the in-tree ledger."
            exit 0
          fi
          git fetch --depth 1 origin "$LEDGER_BRANCH"
          mkdir -p data/loop-fleet/ledger
          git checkout FETCH_HEAD -- data/loop-fleet/ledger
          echo "::notice::overlaid data/loop-fleet/ledger from $LEDGER_BRANCH"
      # Secondo (e ultimo) percorso del repo che gira su un ref di PR con una
      # cache npm: `pull_request` qui sopra è filtrato su `.github/workflows/**`
      # e `.github/actions/**`, quindi ogni PR che tocca un workflow faceva
      # scrivere a `setup-node` una copia da ~487 MB nello scope di
      # `refs/pull/<n>/merge`. Stessa classe di difetto di `ci-npm-setup`, e
      # quindi stessa correzione: si riusa la composite invece di duplicarne la
      # logica restore/save qui (AGENTS.md #6 — una costante duplicata in due
      # file è drift garantito). `npm-ci-args` esiste esattamente per questo
      # chiamante: l'install stretto con `--ignore-scripts` che lo step
      # «Install audit dependencies» faceva più sotto.
      - name: Setup Node.js + npm ci (install stretto, cache npm salvata solo su main)
        uses: ./.github/actions/ci-npm-setup
        with:
          npm-ci-args: '--ignore-scripts'

      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"

      - name: Audit all workflows and extraction contracts
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT_ISSUE: ${{ github.event_name == 'schedule' || inputs.report_issue == true }}
        run: |
          set +e
          set -o pipefail
          ARGS=(--report "$RUNNER_TEMP/technical-operations-audit.json")
          if [ "$REPORT_ISSUE" = "true" ]; then
            ARGS+=(--issue --strict)
          fi
          node scripts/ci/technical-operations-audit.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$(grep -E '^issue_reported=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" != "true" ]; then
            echo "Audit con errori non persistito: il supervisore deve restare rosso." >&2
            exit "$STATUS"
          fi

      - name: Record canonical L11 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L11 --report-dir "$REPORT_DIR" --report "$REPORT_DIR/technical-operations-audit.json" --registry data/loop-fleet/loop-registry.json

      - name: Upload complete audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technical-operations-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/technical-operations-audit.json
            ${{ runner.temp }}/l11-observation.json
            ${{ runner.temp }}/l11-decision.json
            ${{ runner.temp }}/l11-result.json
            ${{ runner.temp }}/loop-fleet-outcome.json
            ${{ runner.temp }}/loop-observations.jsonl
            ${{ runner.temp }}/loop-decisions.jsonl
            ${{ runner.temp }}/loop-health-history.jsonl
            ${{ runner.temp }}/lifecycle-events.jsonl
            ${{ runner.temp }}/loop-fleet-evidence.json
          retention-days: 90
          if-no-files-found: error
