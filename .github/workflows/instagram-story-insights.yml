name: Instagram Story insights

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: instagram-story-insights
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT_JSON is required for private Story insights.' >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Collect private first-hour and near-24h Story metrics
        shell: bash
        run: |
          set -euo pipefail
          rc_exports="$(env -u GITHUB_ENV node scripts/load-rc-env.mjs --only-env=INSTAGRAM_ACCESS_TOKEN,FB_PAGE_ACCESS_TOKEN)"
          eval "$rc_exports"
          node scripts/instagram-story-insights.mjs
