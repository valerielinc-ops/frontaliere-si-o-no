name: Send CompanyAlert Emails (immediate)

# CompanyAlert immediate cadence — issue #5012 phase 2.
#
# Trigger: explicit dispatch from the post-publish workflow after the live
# identity is verified, plus an hourly safety-net cron. The daily digest
# (send-job-alerts.yml, 00:33 UTC) cannot deliver "immediato (email per ogni
# nuovo job)".
#
# WHY NOT `push` ANY MORE (perf-plan email senders, point 1). The old trigger was a
# push filter on data/jobs/by-crawler/**: the commit the crawlers make when a new
# listing lands. That happens BEFORE the deploy publishes the pages, so an email
# could link a page that was not online yet, and the filter fired ~34 times a day
# (another ~35 runs cancelled). The workflow that carries the build is
# `Deploy to GitHub Pages` (deploy.yml), but it only BUILDS: the pages go online in
# `Publish to GitHub Pages (deploy + validate)` (deploy-publish.yml). Its
# post-publish job dispatches this workflow only after the live identity matches
# the published source SHA.
#
# Before claiming anything, the sender defers every job whose page is not in the
# build's manifest of published pages (scripts/lib/company-alert-publication-gate.mjs):
# not sent, not marked in sentJobIds, retried by the next run. The novelty window
# is 48 h (COMPANY_ALERT_IMMEDIATE_WINDOW_HOURS) so a delayed deploy cannot make a
# job fall out of it unsent.
#
# The hourly cron stays: a deploy can publish and still end red (a post-publish
# check), or an explicit dispatch can be skipped when Actions is congested. The
# sender is idempotent by construction (per-alert sentJobIds), so an extra run is
# free; on the cron path the per-page HTTP check answers when the manifest is not
# usable.
#
# REVERT (kill switch of the trigger, which cannot be a Remote Config flag because
# it lives in this YAML): restore the hourly schedule under `on:`. The filter
# itself switches off with COMPANY_ALERT_LIVE_LINK_FILTER=off.

on:
  schedule:
    # Hourly safety net at :41 — off the :00/:15/:30/:45 marks GitHub Actions
    # deprioritizes under load (same reasoning as send-job-alerts.yml's :33),
    # and clear of publisher-jobs-sync's */30.
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Limit send to a single email (test mode). Empty = all immediate CompanyAlerts.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build the emails but do not send.'
        required: false
        default: true
        type: boolean
      source_sha:
        description: 'Published source SHA to use for the dataset checkout.'
        required: false
        default: ''
        type: string
      source_run_id:
        description: 'Published source run ID for trigger evidence.'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  issues: write # github-issue-creator on failure

# GATE: explicit post-publish dispatches are admitted only after the caller's
# live-identity check; cron and manual runs proceed independently.
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: |
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "CompanyAlert trigger: $EVENT_NAME source_run=${SOURCE_RUN_ID:-none} source_sha=${SOURCE_SHA:-none}"

  send-company-alerts:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never two concurrent runs: both would read the same pre-send sentJobIds and
    # could mail the same job twice before either persists the dedup map. On the
    # real job, not the workflow, so an inert trigger never occupies the group.
    concurrency:
      group: company-alerts
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Post-publish dispatches pin the checkout to the source that was
          # verified live. Cron and manual runs keep the default ref (the tip of
          # main).
          ref: ${{ inputs.source_sha || github.sha }}

      # node_modules in cache (perf-plan email senders, A3/B4): chiave sul lockfile
      # e sulla major di Node, `npm ci` solo su miss. Il sender gira fino a ~37
      # volte al giorno e `npm ci` costava 37-49 s a ogni run.
      - name: Setup Node.js and restore node_modules
        uses: ./.github/actions/npm-ci-cached

      # Servono anche al dry run: il sender legge alert e consenso da Firestore
      # (solo letture) anche con --dry-run.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      # Privilegio minimo (perf-plan email senders, B4): l'elenco e' quello che il
      # codice del job (sender, cascade, assemble, issue-creator e le loro
      # importazioni) legge davvero da `process.env`. Lo verifica
      # tests/email-senders-workflow-perimeter.test.ts: una chiave nuova letta dal
      # codice e non elencata qui fa fallire la CI, non il job in produzione.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=CF_ACCOUNT_ID,CF_API_TOKEN,CLOUDFLARE_EMAIL_API_TOKEN,COMPANY_ALERT_IMMEDIATE_WINDOW_HOURS,COMPANY_ALERT_LIVE_LINK_FILTER,ENABLE_JOB_ALERTS,JOB_ALERT_LIVE_LINK_MANIFEST,JOB_ALERT_LIVE_LINK_MANIFEST_MAX_AGE_HOURS,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,NEWSLETTER_SECRET,RESEND_API_KEY

      # data/jobs.json is gitignored — it is assembled from the committed
      # by-crawler slices. The sender reads firstSeenAt off it.
      # Content-addressed cache of the assembled dataset. The key is printed by
      # the assembler itself (.github/actions/assemble-jobs-cache-key): sha256
      # of every slice, of its local import closure, of the aux data files it
      # reads, of package-lock.json and of the Node major. It is the SAME value
      # the script checks before restoring, so a hit can only replay an output
      # built from byte-identical inputs; no restore-keys fallback. Measured
      # miss cost: 4m41 (run 35422626497).
      #
      # ACTIVE-ONLY, NO SUMMARIES (perf-plan email senders, B1). The sender reads
      # ONE file, data/jobs.json: never expired-jobs.json, `previousSlugs` or the
      # crawler summaries. In a full assembly the expired archive and the slug
      # reconciliation took 499 s of a 633 s miss and the summaries wrote ~111
      # `crawler-quality-scores` documents; `--active-only --no-summaries` skips
      # both. The flags MUST be identical in the key action and in the assemble
      # step, or every run misses the cache
      # (tests/send-company-alerts-workflow.test.ts).
      #
      # The key still hashes the expired slices ON PURPOSE: the active assembly
      # reads them to carry `firstSeenAt` forward for a re-published job
      # (carryForwardFirstSeenAt, archivedJobs), and `firstSeenAt` is exactly the
      # novelty field this sender selects on. Dropping them from the key would
      # allow a false HIT.
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --active-only --no-summaries

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Assemble jobs dataset
        id: assemble
        run: node scripts/assemble-jobs-dataset.mjs --active-only --no-summaries

      - name: Save assemble-jobs cache
        if: steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-send-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # Dry run (input dry_run, default true per i dispatch manuali): costruisce le
      # email con i dati di produzione e stampa destinatari/sezioni e la riga
      # COMPANYALERT_METRICS, senza reclamare ne' inviare nulla (solo letture).
      - name: Build CompanyAlert emails without sending (dry run)
        if: inputs.dry_run == true || inputs.dry_run == 'true'
        env:
          ENABLE_JOB_ALERTS: 'true'
          TARGET_EMAIL: ${{ inputs.target_email }}
        run: |
          node scripts/send-company-alerts.mjs --dry-run

      - name: Send CompanyAlert emails
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        continue-on-error: true
        id: send
        env:
          ENABLE_JOB_ALERTS: 'true'
          TARGET_EMAIL: ${{ inputs.target_email }}
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: |
          node scripts/send-company-alerts.mjs

      - name: Report failure to GitHub Issues
        if: steps.send.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## CompanyAlert immediate send fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Il rosso del run, DOPO l'apertura della issue: `continue-on-error` sullo
      # step di invio tiene vivo il job perche' il reporter possa girare, non per
      # dichiarare verde un run fallito. `close-recovered-failure-issues.yml`
      # chiude `CI Failure: <workflow>` sulla premessa «ultimo run completato
      # success dopo l'apertura»: con un run verde per costruzione la issue si
      # chiude come recuperata al giro dopo, guasto ancora in piedi. Stesso idiom
      # di `location-quality-audit.yml` (#7379, item 3).
      - name: Fail job if the send step failed
        if: steps.send.outcome == 'failure'
        run: |
          echo "::error::invio CompanyAlert fallito — vedi l'issue aperta sopra."
          exit 1
