name: Cloud Function Errors Monitor

# Reads ERROR-or-worse entries of the Cloud Functions from Cloud Logging
# (read-only) and keeps one stable backlog issue per failing function, closed
# after one complete clean measurement (scripts/cloud-function-error-issue-sync.mjs).
# Complements cloudflare-worker-errors (edge) and cf-5xx-monitor (zone): until
# this workflow nothing watched the functions' own logs.
#
# Needs the service account of FIREBASE_SERVICE_ACCOUNT_JSON to hold
# roles/logging.viewer on the project. Without it the read answers 403, the run
# fails red and is reported as a workflow failure: it never closes issues.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours (maximum 72)'
        required: false
        type: string
        default: '24'
      min_errors:
        description: 'Minimum errors per function to open/reconfirm an issue'
        required: false
        type: string
        default: '5'

concurrency:
  group: cloud-function-errors-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/url-first-seen/
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load Remote Config secrets
        run: node scripts/load-rc-env.mjs

      - name: Require backlog write token
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config — cannot create or reconcile backlog issues. The workflow token is intentionally not a fallback because it suppresses downstream issues.opened triage."
            exit 1
          fi
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"

      - name: Sync Cloud Function errors to backlog
        env:
          GH_REPO: ${{ github.repository }}
          CF_FUNCTION_ERRORS_HOURS: ${{ inputs.hours || '24' }}
          CF_FUNCTION_ERRORS_MIN_COUNT: ${{ inputs.min_errors || '5' }}
        run: node scripts/cloud-function-error-issue-sync.mjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          Il monitor non ha potuto leggere Cloud Logging (permesso roles/logging.viewer mancante sul service account, API o credenziali): nessuna issue è stata chiusa o annotata.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Riproduci:** \`node scripts/cloud-function-error-issue-sync.mjs --dry-run\` con \`GOOGLE_APPLICATION_CREDENTIALS\`." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
