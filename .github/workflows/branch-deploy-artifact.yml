name: Branch-deploy Pages from artifact
# Outage experiment: download a prior run's github-pages artifact, unpack it,
# and orphan-force-push to a branch (default gh-pages-artifact) WITHOUT a
# rebuild. Tests whether the ~8.5GB / 1.27M-file site survives a git push and
# whether branch-serving can publish it. Does NOT switch the Pages source.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose github-pages artifact to deploy'
        required: true
      branch:
        description: 'Target branch'
        required: false
        default: 'gh-pages-artifact'
permissions:
  contents: write
  actions: read
jobs:
  branch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: Download github-pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: dl
      - name: Unpack + orphan force-push to branch
        env:
          BR: ${{ inputs.branch }}
        run: |
          set -uo pipefail
          mkdir -p site && tar -xf dl/artifact.tar -C site && rm -rf dl
          echo "unpacked: $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"
          cd site
          touch .nojekyll
          git init -q
          git checkout -q -b "$BR"
          git config user.email "deploy-bot@frontaliereticino.ch"
          git config user.name "deploy-bot"
          git add -A
          git commit -qm "branch-deploy from artifact (run ${{ inputs.run_id }})"
          echo "committed; pushing $(git rev-list --count HEAD) commit, this may be large…"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$BR" 2>&1 | tail -20
          echo "✅ push completed to branch $BR"
