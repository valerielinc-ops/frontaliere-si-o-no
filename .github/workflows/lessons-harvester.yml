name: Lessons harvester (auto-improve agent docs)

# Daily self-improvement loop: aggregate recurring reviewer findings + issue-fix
# blocked-outcomes (deterministic, zero Claude), drop anything already in the
# doc-contracts, and — only when a GENUINELY NEW recurring pattern survives —
# spend ONE Claude turn to draft a surgical rule addition and open a docs PR.
# Human-gated: the PR is never auto-merged (instructions are high-leverage).
# Contract: ISSUES.md → "Auto-improvement loop (lessons-harvester)".

on:
  schedule:
    - cron: '17 5 * * *' # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Lookback window in days (default 14).'
        required: false
        default: '14'
      threshold:
        description: 'Min recurrences to count a cluster (default 3).'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: lessons-harvester
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # 12→18 (2026-07-17): headroom per il cap turni alzato 20→30.
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # One pending proposal at a time: if a harvest PR is already open and
      # awaiting human review, don't pile up a duplicate every day.
      - name: Guard — existing open proposal
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --state open --search 'head:lessons/auto-harvest' --json number --jq 'length')
          echo "open_proposals=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "A harvest proposal PR is already open — skipping today's run."
          fi

      - name: Aggregate recurring patterns (deterministic, zero Claude)
        id: harvest
        if: steps.guard.outputs.open_proposals == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '14' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '3' }}
          HARVEST_OUT: harvest-clusters.json
          # Escalation issues are filed deterministically BY THIS SCRIPT (canonical
          # title + code-level dedup) — no Claude turn, no LLM title drift.
          HARVEST_EMIT_ESCALATIONS: 'true'
        run: node scripts/ci/harvest-agent-lessons.mjs

      - name: Setup Headroom compression proxy
        if: steps.guard.outputs.open_proposals == '0' && steps.harvest.outputs.has_novel == 'true'
        uses: ./.github/actions/setup-headroom

      - name: Draft doc-rule proposal (Claude — only if NOVEL patterns)
        # Escalations are auto-filed by the harvest step above → Claude is spent
        # ONLY when a genuinely-new (novel) recurring pattern needs a doc rule.
        if: steps.guard.outputs.open_proposals == '0' && steps.harvest.outputs.has_novel == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Schedule/manual-dispatch → actor umano (owner) oggi, ma stesso
          # class-fix dei sibling: se un'automation interna dispatchasse questo
          # workflow via GITHUB_TOKEN (actor `github-actions[bot]`) o via App token
          # (actor `frontaliere-automation[bot]`) senza whitelist, claude-code-action
          # aborterebbe "non-human actor". Mai `*`.
          allowed_bots: "github-actions[bot], claude[bot], frontaliere-automation[bot]"
          show_full_output: true
          # 2026-07-02: ROLLBACK di --dangerously-skip-permissions (rationale completo:
          # post-merge-followup.yml claude_args comment) — issue #3269: sui trigger
          # schedule/workflow_dispatch il flag non produce mai bypassPermissions
          # (permissionMode resta "default", quasi ogni Bash bloccato); i workflow con
          # trigger workflow_run/issues invece funzionano con la stessa config identica.
          # 20→30 (2026-07-17, owner): bump fleet-wide di tutti i cap max-turns Claude.
          # Modello → claude-sonnet-5 (owner 2026-07-17: mai claude-sonnet-4-6).
          claude_args: "--max-turns 30 --model claude-sonnet-5 --allowedTools 'Bash(gh:*),Bash(git:*),Bash(node:*),Read,Grep,Glob,Edit,Write'"
          prompt: |
            Sei l'agent di **auto-improvement** dei doc-contract per agenti. Obiettivo: dai pattern RICORRENTI rilevati, proporre miglioramenti CHIRURGICI alle istruzioni (AGENTS.md / ISSUES.md / REVIEW.md / FOLLOWUP.md) così che reviewer/fixer smettano di ripetere lo stesso problema → turnaround più basso.

            **Bootstrap:**
            1. Leggi `harvest-clusters.json` (output deterministico di `scripts/ci/harvest-agent-lessons.mjs`). Due tipi di cluster azionabili:
               - `"novel": true` → pattern ricorrente NON ancora documentato → serve una regola preventiva nuova.
               - `"recurringDespiteRule": true` → pattern GIÀ documentato ma che **ricorre comunque** ≥ soglia×fattore-efficacia → la prosa NON sta funzionando. NON aggiungere un'altra riga: la regola c'è già. Questo va ESCALATO a un fix STRUTTURALE (vedi sotto).
               Ignora i cluster senza nessuno dei due flag (volume operativo / sotto-soglia).
            2. Leggi `AGENTS.md`, `ISSUES.md`, `REVIEW.md`, `FOLLOWUP.md` (il loro stile è terse-italiano; rispettalo).

            **Per ogni cluster `novel`:**
            - `reviewer-finding/<bucket>` (es. ×N review con 🔴/🟡 sullo stesso tema) → gli agent producono ripetutamente codice che il reviewer corregge sullo stesso punto. Aggiungi una regola PREVENTIVA nel posto giusto (di solito AGENTS.md non-negotiables/Build-And-Test, o REVIEW.md, o il prompt che genera quel codice).
            - `reviewer-finding/fp:<...>` (fingerprint catch-all) → pattern nuovo non ancora in tassonomia: valuta se è un tema reale; se sì, regola preventiva E considera di proporre un bucket esplicito in `harvest-agent-lessons.mjs` (questo È codice → vedi escalation).
            - `fix-outcome/<code>` (es. ×N issue-fix bloccati con lo stesso `<code>`) → il fixer sbatte sullo stesso muro. Affina la regola in ISSUES.md → "Abort senza PR" o il capability-guard.

            **Cluster `recurringDespiteRule` (escalation — la prosa ha fallito):**
            - Le issue di escalation sono GIÀ create deterministicamente dallo step harvest (titolo canonico `escalation(harvester): <source>/<bucket> ricorre nonostante regola` + dedup a livello codice). NON aprirle tu — duplicheresti.
            - NON scrivere nemmeno un'altra regola `.md` sullo stesso tema: la regola c'è già, il fix vero è strutturale e va all'owner via la issue auto-creata. Ignora questi cluster e concentrati solo sui `novel`.

            **Vincoli (CRITICI):**
            - CHIRURGICO: poche righe, nello stile esistente. No drive-by, no riscritture. AGENTS.md è iniettato ogni sessione → ogni riga costa token: massima densità.
            - DEDUP: se rileggendo i doc la regola è di fatto già presente (anche con parole diverse) → NON aggiungerla. Meglio zero modifiche che rumore.
            - Se NESSUN cluster `novel` produce una regola nuova utile → **NON aprire PR**, esci. Va benissimo "niente da migliorare oggi". (Le escalation sono già gestite dallo step harvest, non da te.)
            - Mai abbassare gate/quality. Nel ramo PR: SOLO file `.md`. Il fix strutturale di un'escalation si propone via la issue auto-creata, non si committa qui.

            **Se (e solo se) hai ≥1 regola `novel` nuova utile → apri una PR doc:**
            1. `git config user.name "Valerie Linc"; git config user.email "valerielinc@gmail.com"`.
            2. `git checkout -b lessons/auto-harvest-$(date -u +%Y%m%d)`.
            3. Applica gli edit `.md` (Edit/Write). Nessun path home assoluto, nessuna email personale.
            4. Commit conventional (`docs(process): auto-harvested lessons — <temi>`). In fondo: `Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>`.
            5. `git push -u origin HEAD`.
            6. `gh pr create` con body OBBLIGATORIO:
               ```
               ## Implementato
               - <regola aggiunta> ← cluster <source/bucket> ×<count> (es. PR/issue #...)
               ## Non implementato (ancora)
               - <cluster scartati> — per scelta: <già coperto / troppo vago / volume non-istruzione>
               ```
               Lo stato letterale (`per scelta` qui, o `in questa PR` / `PR concatenata #N` /
               `by construction` / `blocked: <causa>`) è obbligatorio su ogni bullet: senza,
               `scripts/ci/followup-has-candidates.mjs` riapre il cluster scartato come issue.
               Aggiungi in fondo: "⚠️ Proposta auto-generata dal lessons-harvester. Human-gated: rivedere prima di mergere. Se modifica `.github/workflows/` non è prevista (solo `.md`)."
            7. NON mergiare. È una proposta: la rivede un umano.

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
