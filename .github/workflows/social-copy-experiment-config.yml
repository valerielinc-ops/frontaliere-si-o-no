name: Social Copy Experiment Config

on:
  schedule:
    - cron: '41 6 * * 0'
  push:
    branches: [main]
    paths:
      - .github/workflows/social-copy-experiment-config.yml
      - scripts/social-copy/prune-assignment-history.mjs
      - scripts/lib/firebase-social-copy-assignment.mjs
      - scripts/social-copy/experiment-protocol.mjs
      - scripts/lib/social-copy-experiment-runner.mjs
      - scripts/lib/social-experiment-protocol.mjs
      - scripts/lib/social-copy-pack.mjs
      - scripts/experiments/social-copy-rc.mjs
      - data/social-copy-packs/current.json
  workflow_dispatch:

concurrency:
  group: social-copy-experiment-config
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A full checkout materializes the repository's 6.8 GB generated
          # corpus before this five-minute job can start. Keep the runtime
          # inputs explicit: the social protocol reads code, npm manifests,
          # social ledgers/pack data and the shared runtime data, but never
          # the image/article and historical cache buckets below.
          sparse-checkout: |
            /package.json
            /package-lock.json
            /packages/*/package.json
            /scripts/
            /build-plugins/
            /docs/
            /data/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
            /data/jobs/
            /public/data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Freeze qualified cohorts and reconcile Firebase Remote Config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LINKEDIN_MEMBER_POST_ANALYTICS_STORAGE_APPROVED: ${{ vars.LINKEDIN_MEMBER_POST_ANALYTICS_STORAGE_APPROVED }}
        run: node scripts/experiments/social-copy-rc.mjs

      - name: Prune assignment records beyond experiment retention
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/social-copy/prune-assignment-history.mjs
