name: Recover Lost previousSlugs

# Runs every 12 hours. Scans the last 24h of per-crawler slice history for
# previousSlugs entries that were silently dropped, then backfills them
# from git history with original locale attribution. It then RE-SCANS the
# repaired tree, and only what is still unreachable after that can cross the
# tripwire threshold and open a GitHub issue (the writer fix should keep losses
# ~0; any spike means a regression).
#
# The re-scan is not optional bookkeeping (#5348): the tripwire used to read the
# PRE-backfill count, so it reported as "auto-recovery could not restore them"
# precisely the slugs recovery had just restored, and could never decay below
# threshold no matter how well recovery worked.
#
# Why 12h cadence: matches the writer-fix observability budget — within
# a deploy cycle, a regression cannot pile up more than half a day of
# losses before this job catches and reports it. Recovery is non-destructive
# (only ADDS to previousSlugs[ByLocale]).
#
# Manual run: workflow_dispatch with an optional --since override and
# --dry-run for safe inspection without committing.

on:
  schedule:
    # 02:00 and 14:00 UTC daily — off the peak crawler windows so we read
    # quiescent slices and don't race with concurrent crawler commits.
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Scan window (e.g. "24 hours ago", "7 days ago")'
        required: false
        default: '24 hours ago'
        type: string
      dry_run:
        description: 'Inspect only — do not commit recovered slugs'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      tripwire_threshold:
        # Counted against recoverable_slugs (slugs still unreachable today),
        # NOT the far larger total_lost. The old default of 10 was calibrated
        # for that older, noisier number; carrying it over to this one would
        # have silenced #5229 itself, whose 9 permanently-lost URLs sit just
        # under it. A still-missing slug is an indexed URL serving 404, so the
        # bar belongs near zero — 3 absorbs the odd job deleted between scan
        # and cross-reference without swallowing a real regression.
        description: 'Open GH issue if slugs STILL missing after recovery exceed this'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: recover-prev-slugs
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--disable-warning=DEP0040 --disable-warning=DEP0169'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The scan walks per-slice git history. Use full clone so commits
          # in the window are reachable (default fetch-depth=1 makes git log
          # return empty).
          fetch-depth: 0
          # NIENTE `filter: blob:none` qui, ed è il caso in cui la cura generale
          # sarebbe VELENO. `scan-prev-slug-losses.mjs` non si limita a camminare
          # i commit: legge il CONTENUTO di ogni versione storica via
          # `createCatFileBatch` (`git cat-file --batch`, riga ~241) per ogni
          # coppia (commit, slice) su una finestra di 60 giorni e 569 file slice.
          # Sotto blobless quei blob non esistono in locale e ognuno diventa un
          # lazy-fetch a sé: è esattamente la classe di stallo da partial clone
          # documentata in pr-review-loop.yml (11 minuti su un solo Checkout).
          # Stesso motivo per cui non si può usare sparse-checkout: actions/checkout
          # lo implementa attivando `--filter=blob:none`.
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/packages/articles/content/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/evidence-index.json
            !/data/health-premiums/
          sparse-checkout-cone-mode: false
        # Il tetto resta comunque utile: Checkout misurato 744-1115s su 10 run
        # (fino al 74% di un cap da 25min) e un fetch degenere qui ucciderebbe il
        # job `cancelled`, invisibile agli `if: failure()`. 21min stanno sopra il
        # massimo osservato. NB: il tetto NON è la soluzione di questo workflow —
        # vedi `## Non implementato` della PR: 3 run su 12 sono già `cancelled` e
        # in run 30733696350 a morire è stato lo step di backfill, non il Checkout.
        timeout-minutes: 21

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # #5348 residuo genuino: due record con lo STESSO `.id` (dedicated-crawler
      # stable id) possono coesistere in una slice — es. banca-cler.json teneva
      # sia la variante URL /de/bank-cler/... sia /it/banca-cler/... per la
      # stessa candidatura Cler, con cronologie previousSlugs indipendenti e
      # mutuamente inconsapevoli. `scripts/reconcile-duplicate-stable-id-jobs.mjs`
      # esiste già (issue #4603) proprio per questo caso ed è idempotente, ma
      # non era mai stato collegato a nessun workflow: restava un cleanup manuale
      # mai eseguito. Girare PRIMA dello scan/backfill è ciò che chiude #5348 —
      # il backfill's `resolveRecoveryTarget()` fa da redirect fra i duplicati
      # (bySuffixHash "first-wins" contro byId "last-wins" sullo stesso array),
      # quindi lo slug recuperato finisce sull'oggetto duplicato SBAGLIATO e il
      # ri-scan post-backfill lo trova ancora mancante — nessuna quantità di
      # backfill può sanare una perdita che vive nella duplicazione stessa.
      - name: Reconcile duplicate stable-id job records
        id: reconcile
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prev-slug-recovery
          APPLY_FLAG="--apply"
          if [ "$DRY_RUN" = "true" ]; then APPLY_FLAG=""; fi
          node scripts/reconcile-duplicate-stable-id-jobs.mjs $APPLY_FLAG \
            | tee /tmp/prev-slug-recovery/reconcile-report.txt
          # Fail-loud, not fail-silent (#5954): a future format change in
          # reconcile-duplicate-stable-id-jobs.mjs's summary line, made without
          # touching this workflow, must not fall back to reconciled_dropped=0
          # and silently suppress the "Commit and push restored slices" gate
          # below. Two drift shapes, both checked: no line matches the
          # Applied:/Dry-run: prefix at all, or a line matches the prefix but
          # not the full "N duplicate-id group(s), M record(s)..." shape sed
          # extracts the count from (sed then passes the unmatched line
          # through untouched, which is not a valid integer either).
          summary_line=$(grep -E '^(Applied|Dry-run):' /tmp/prev-slug-recovery/reconcile-report.txt || true)
          if [ -z "$summary_line" ]; then
            echo "::error::reconcile-duplicate-stable-id-jobs.mjs report has no Applied:/Dry-run: summary line — output format drift? Failing loud instead of silently reporting reconciled_dropped=0 (which would suppress the commit gate below)."
            exit 1
          fi
          reconciled_dropped=$(printf '%s\n' "$summary_line" \
            | sed -E 's/^[A-Za-z-]+: [0-9]+ duplicate-id group\(s\), ([0-9]+) record.*/\1/')
          if ! [[ "$reconciled_dropped" =~ ^[0-9]+$ ]]; then
            echo "::error::reconcile-duplicate-stable-id-jobs.mjs summary line did not match the expected \"<Applied|Dry-run>: N duplicate-id group(s), M record(s)...\" format: \"$summary_line\" — failing loud instead of silently reporting reconciled_dropped=0 (which would suppress the commit gate below)."
            exit 1
          fi
          echo "reconciled_dropped=${reconciled_dropped}" >> "$GITHUB_OUTPUT"
          {
            echo "## Duplicate stable-id reconciliation"
            echo ""
            echo '```'
            cat /tmp/prev-slug-recovery/reconcile-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan for lost previousSlugs
        id: scan
        env:
          SCAN_SINCE: ${{ github.event.inputs.since || '24 hours ago' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prev-slug-recovery
          node scripts/scan-prev-slug-losses.mjs \
            --since "$SCAN_SINCE" \
            --out /tmp/prev-slug-recovery/recoverable.json \
            --events-out /tmp/prev-slug-recovery/events.jsonl \
            | tee /tmp/prev-slug-recovery/scan-report.txt
          # Extract counts for downstream steps. sed already isolates the bare
          # number from the "totalLost": N, line — piping that through
          # `jq '.totalLost'` (a JSON-object accessor) errors on a bare
          # number and silently falls back to total_lost=0 via the `||`,
          # which permanently disabled the tripwire below.
          total_lost=$(grep -E '^\s*"totalLost"' /tmp/prev-slug-recovery/scan-report.txt | head -1 | sed 's/.*: //;s/,//') || total_lost=0
          recoverable_jobs=$(jq 'length' /tmp/prev-slug-recovery/recoverable.json)
          recoverable_slugs=$(jq '[.[].slugs|length]|add // 0' /tmp/prev-slug-recovery/recoverable.json)
          echo "total_lost=${total_lost}" >> "$GITHUB_OUTPUT"
          echo "recoverable_jobs=${recoverable_jobs}" >> "$GITHUB_OUTPUT"
          echo "recoverable_slugs=${recoverable_slugs}" >> "$GITHUB_OUTPUT"
          {
            echo "## Scan summary"
            echo ""
            echo "Window: \`${SCAN_SINCE}\`"
            echo "- total lost (in window): **${total_lost}**"
            echo "- recoverable jobs: **${recoverable_jobs}**"
            echo "- recoverable slugs: **${recoverable_slugs}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Backfill recoverable slugs
        if: steps.scan.outputs.recoverable_slugs != '0'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          node scripts/backfill-prev-slugs-from-loss-events.mjs \
            --input /tmp/prev-slug-recovery/recoverable.json \
            $DRY_RUN_FLAG \
            | tee -a /tmp/prev-slug-recovery/scan-report.txt
          {
            echo ""
            echo "## Backfill result"
            echo ""
            echo '```'
            tail -10 /tmp/prev-slug-recovery/scan-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push restored slices
        if: (steps.scan.outputs.recoverable_slugs != '0' || steps.reconcile.outputs.reconciled_dropped != '0') && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG="🛟 Recover ${{ steps.scan.outputs.recoverable_slugs }} previousSlugs across ${{ steps.scan.outputs.recoverable_jobs }} jobs"
          if [ "${{ steps.reconcile.outputs.reconciled_dropped }}" != "0" ]; then
            COMMIT_MSG="$COMMIT_MSG + reconciled ${{ steps.reconcile.outputs.reconciled_dropped }} duplicate-id record(s)"
          fi
          bash scripts/lib/git-commit-data.sh --slice-only "$COMMIT_MSG"

      # Il tripwire deve misurare il residuo DOPO il recupero, e fino al 2026-08-08
      # misurava quello prima (#5348). Questo step ri-esegue lo STESSO scanner sul
      # working tree già ripristinato e committato, così `pre` e `post` vengono dallo
      # stesso strumento e sono direttamente confrontabili.
      #
      # Perché un ri-scan e non un contatore derivato dentro il backfill: il conteggio
      # derivato (`considerati - ripristinati`) è un PROXY dell'irraggiungibilità, e
      # divergerebbe in silenzio dalla semantica che il tripwire dichiara — slug
      # denylistati (decontaminazione voluta), slug già presenti sul target, redirect
      # verso un altro job finirebbero contati come «non ripristinati» pur essendo
      # raggiungibili. `scan-prev-slug-losses.mjs` invece incrocia col working tree e
      # risponde alla domanda vera: quali slug non sono raggiungibili da nessuna parte
      # oggi.
      #
      # E soprattutto: gira DOPO il commit. Il body della issue nomina il merge 3-way di
      # `scripts/lib/git-commit-data.sh` («runs after node exits») come una delle due
      # classi note di perdita che sfuggono alla guardia di scrittura. Un conteggio
      # calcolato dentro il processo Node non potrebbe vederle per costruzione; un
      # ri-scan post-commit sì. Costo misurato: ~38s su un job che ne usa ~16 di 25min
      # (run 31236737581), e solo quando c'è stato davvero qualcosa da recuperare.
      - name: Re-scan after backfill (residuo reale post-recupero)
        id: rescan
        # Un `if:` esplicito porta con se' un `success()` implicito, quindi un
        # crash qui SALTEREBBE il tripwire sotto — che ha l'`if:` identico — e
        # il fail-safe dichiarato («step saltato, crash infra → ricade sul PRE»)
        # non verrebbe mai raggiunto proprio nello scenario che nomina: job
        # rosso, nessuna issue aperta, nessun `::warning::`.
        #
        # `continue-on-error` invece di `always()` sul tripwire: lascia intatte
        # entrambe le espressioni `if:`, quindi
        # `tests/recover-prev-slugs-tripwire.test.ts` («rescan.if === tripwire.if»)
        # resta verde, e un rescan fallito produce `conclusion: success` → il
        # tripwire parte con `POST_LOST` non impostato → esegue il ramo di
        # fallback sul conteggio PRE, che e' esattamente il comportamento voluto.
        continue-on-error: true
        if: steps.scan.outputs.recoverable_slugs != '0' && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          SCAN_SINCE: ${{ github.event.inputs.since || '24 hours ago' }}
        run: |
          set -euo pipefail
          node scripts/scan-prev-slug-losses.mjs \
            --since "$SCAN_SINCE" \
            --out /tmp/prev-slug-recovery/recoverable-post.json \
            --events-out /tmp/prev-slug-recovery/events-post.jsonl \
            | tee /tmp/prev-slug-recovery/rescan-report.txt
          still_lost=$(jq '[.[].slugs|length]|add // 0' /tmp/prev-slug-recovery/recoverable-post.json)
          echo "still_lost=${still_lost}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## Post-backfill re-scan"
            echo ""
            echo "- recoverable slugs BEFORE backfill: **${{ steps.scan.outputs.recoverable_slugs }}**"
            echo "- still missing AFTER backfill:      **${still_lost}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trip the writer-regression wire
        if: steps.scan.outputs.recoverable_slugs != '0' && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD: ${{ github.event.inputs.tripwire_threshold || '3' }}
          TOTAL: ${{ steps.scan.outputs.total_lost }}
          # Conteggio PRE-backfill: non decide più nulla, ma resta loggato accanto al
          # post. Se il fix fosse sbagliato è il confronto fra i due a dirlo, ed è
          # l'unico rischio serio qui — perdere il segnale su una regressione vera.
          PRE_LOST: ${{ steps.scan.outputs.recoverable_slugs }}
          POST_LOST: ${{ steps.rescan.outputs.still_lost }}
          WINDOW: ${{ github.event.inputs.since || '24 hours ago' }}
        run: |
          set -euo pipefail
          # Il residuo POST-recupero è ciò su cui si decide (#5348). Prima si leggeva
          # `steps.scan.outputs.recoverable_slugs`, cioè il conteggio PRE-backfill: nel
          # run 31236737581 lo scan trovava 11 slug recuperabili, il backfill ne
          # ripristinava 10 (commit 0163c80652), e il tripwire rileggeva comunque 11 →
          # issue «auto-recovery could not restore them» con residuo reale 1, sotto la
          # soglia di 3. Nessuna regressione del writer: nei due commit incolpati
          # (8e5b71b65d, d0c479a3cf) il journal mostra `slug-preservation-guard` attivo
          # e i drop attribuiti a `cleanPreviousSlugsPerLocale` (dedup legittimo di
          # self-redirect). Il wire non poteva scendere sotto soglia per costruzione:
          # misurava un numero che il recupero non tocca.
          #
          # FAIL-SAFE verso l'allarme: se il ri-scan non ha prodotto un conteggio
          # (step saltato, crash infra), si ricade sul PRE — cioè sul comportamento
          # precedente. Un falso positivo costa una issue da chiudere; perdere il
          # segnale su una regressione vera costa slug indicizzati che servono 404.
          STILL_LOST="${POST_LOST:-}"
          if [ -z "$STILL_LOST" ]; then
            echo "::warning::post-backfill re-scan produced no count — falling back to the pre-backfill count (${PRE_LOST}). Conservative: never lose the regression signal."
            STILL_LOST="$PRE_LOST"
            RECOVERABLE_JSON=/tmp/prev-slug-recovery/recoverable.json
            EVENTS_JSONL=/tmp/prev-slug-recovery/events.jsonl
          else
            RECOVERABLE_JSON=/tmp/prev-slug-recovery/recoverable-post.json
            EVENTS_JSONL=/tmp/prev-slug-recovery/events-post.jsonl
          fi
          # Entrambi i conteggi, sempre, anche quando non si apre nulla: è il confronto
          # a rendere diagnosticabile un eventuale errore in questo stesso fix.
          echo "previousSlugs recovery — recoverable BEFORE backfill: ${PRE_LOST}; still missing AFTER: ${STILL_LOST} (threshold ${THRESHOLD}, ${TOTAL} loss events in window)"
          # Trip on what is STILL missing, not on `total_lost` (issue #5229).
          #
          # `total_lost` counts loss EVENTS in the window's git history, which
          # makes it unfit for the job in two ways. It keeps counting losses a
          # later commit — or an earlier run of this very workflow — already
          # healed; and it cannot decay, because the window is wall-clock while
          # the history inside it is immutable, so a fix merged mid-window
          # still leaves the pre-fix half of that window re-reported for the
          # next 24h. #5229 fired at 52 with 44 of those predating the very fix
          # it was blaming and 43 already healed, and it re-listed five of the
          # exact commits #5157 had already named. A wire that re-fires on
          # evidence of a fixed bug trains its readers to close it unread.
          #
          # `recoverable_slugs` is cross-referenced against the working tree, so
          # it counts only slugs no longer reachable anywhere today. It decays
          # to 0 once a fix lands, which is the property a tripwire has to have —
          # ma solo se lo si legge DOPO il recupero, che è il fix di #5348.
          if [ "$STILL_LOST" -le "$THRESHOLD" ]; then
            echo "Still-missing $STILL_LOST slugs — under threshold ($THRESHOLD), no issue."
            exit 0
          fi
          echo "🚨 Tripwire: $STILL_LOST slugs still missing (threshold $THRESHOLD; $TOTAL loss events in window)"
          # Name only the commits behind the STILL-MISSING slugs. Listing every
          # commit in the window buries the few that matter under the many that
          # were healed, and sends the next reader `git show`-ing innocent ones.
          # I file sono quelli del ri-scan POST-backfill: usare quelli pre-backfill
          # nominerebbe anche i commit dietro gli slug appena ripristinati, cioè
          # esattamente i «già guariti» che questo blocco esiste per escludere.
          jq -r '.[] as $r | $r.slugs[] | "\($r.file) \($r.jobId) \(.)"' \
            "$RECOVERABLE_JSON" | sort -u \
            > /tmp/prev-slug-recovery/still-lost-keys.txt
          top_commits=$(jq -r '. as $e | $e.lost[] | "\($e.file) \($e.jobId) \(.) \($e.commit)"' \
              "$EVENTS_JSONL" 2>/dev/null \
            | awk 'NR==FNR { keep[$1 " " $2 " " $3]=1; next } (($1 " " $2 " " $3) in keep) { print $4 }' \
                /tmp/prev-slug-recovery/still-lost-keys.txt - \
            | sort | uniq -c | sort -rn | head -10 \
            | awk '{ printf "- `%s` (%s unhealed)\n", $2, $1 }')
          body=$(cat <<EOF
          **${STILL_LOST}** previousSlugs entries dropped inside the **${WINDOW}** window are
          still unreachable — measured by re-running the scanner AFTER auto-recovery
          committed, so these are the ones recovery genuinely could not restore.
          (Auto-recovery started from ${PRE_LOST} recoverable; ${TOTAL} loss events were
          seen in the window overall, the remainder were already healed.)

          Threshold is ${THRESHOLD}. Anything above means a slug-mutation path is escaping
          BOTH \`addPreviousSlugForLocale\` / \`captureLostSlugs\` AND the write-boundary
          guard in \`scripts/lib/slug-preservation-guard.mjs\`.

          ## Commits behind the still-missing slugs

          ${top_commits}

          ## Next steps

          1. Read the scan + backfill output in [run #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          2. \`git show <commit>\` each commit above and look for a slug-mutation path
             that reaches a slice WITHOUT passing \`writeJsonAtomic\` — the guard only
             sees writes that go through it. Two known classes: the 3-way JSON merge in
             \`scripts/lib/git-commit-data.sh\` (runs after node exits) and any direct
             \`fs.writeFileSync\` to \`data/jobs/by-crawler/\`.
          3. Re-run \`scripts/scan-prev-slug-losses.mjs\` locally and confirm the
             recoverable count — not the total — reaches 0.

          Auto-recovery has already restored what it could. This issue tracks the
          regression that caused the loss, not the recovery itself.
          EOF
          )
          node scripts/lib/github-issue-creator.mjs \
            --title "previousSlugs writer regression detected" \
            --description "$body" \
            --priority 2 \
            --label bug \
            --label seo \
            --label crawlers \
            --workflow "${{ github.workflow }}"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recover-prev-slugs-scan-${{ github.run_id }}
          path: /tmp/prev-slug-recovery/
          retention-days: 14
