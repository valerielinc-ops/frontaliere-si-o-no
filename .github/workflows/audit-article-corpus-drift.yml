name: Audit Article Corpus Drift (weekly, read-only)

# Issue #5444 — step 1 was "does it pass on a clean CI checkout, and at what
# false-positive rate?". It has now run for real (run 31369064388,
# 2026-08-10, section=all sample_size=15, ~5m33s end to end) and the answer
# changed what step 2 means. Numbers first, then why this file now schedules
# itself but STILL does not open issues.
#
# THE REAL RUN, read as a histogram (never as pass/fail — see below):
#   120 locale checks (30 articles x 4 locales), 0 operational noise: 0
#   render-failure, 0 fetch-or-liveness, 0 unrecognized-verdicts, 0
#   no-locale-verdicts. Every precondition #5444 worried about — ASSET_CDN,
#   TZ, hero images materialised by a non-sparse checkout — held. That part
#   of the question is answered and closed.
#   28/120 genuinely ok. 92/120 content-mismatch, and — this is the part a
#   bare percentage hides — they are NOT one failure mode:
#     - 71/92 (77%) are the related-articles cross-link block reordering.
#       check-article-byte-identity.mjs's own header already names this a
#       KNOWN EXPECTED divergence: buildRelatedArticlesHtml slots the newest
#       corpus article into every sibling's candidate list, so re-rendering
#       an old article against TODAY's source tree almost always produces a
#       different pick than what was live at publish time. There is no
#       "correct" side to fix — both picks were right for their moment — and
#       the design (fast-publish deliberately does not re-render siblings,
#       see rerender-article-corpus.yml) makes this permanent, not a bug to
#       chase out. Expect this category on close to every future run too.
#     - 12/92 are a genuine renderer inconsistency: `og:image:height` differs
#       between the fast path (probes the real on-disk image — 1200, 824,
#       1600 across three sampled articles) and live (a constant 675 on all
#       three, while `og:image:width` agrees at 1200 on both sides). One side
#       is wrong for non-16:9 hero images; not yet triaged which.
#     - 8/92 are `wordCount` inside the NewsArticle JSON-LD disagreeing (538
#       vs 561) for a byte-identical `articleBody` string — a determinism bug
#       in the counting step, not a content difference.
#     - 1/92 is a genuine content edit that never reached the live page: the
#       source meta description was corrected ("lo stipendio" -> the grammar
#       fix), live still serves the pre-fix text.
#   Full per-locale diagnostics for all 30 sampled articles are in this run's
#   `article-corpus-drift-report` artifact. Filed as a follow-up: the
#   og:image:height and wordCount findings (see the PR that wired this
#   schedule for the issue number).
#
# WHAT THIS MEANS FOR "cron it or delete it": neither cleanly. Deleting would
# throw away the only probe that has ever looked at the ARTICLE-PAGE plane
# (the hub/archive plane is covered twice daily by
# article-hub-landing-watchdog.yml — a different surface, see that file) and
# it just found two real, previously-unknown defects on its first real run.
# But wiring `content-mismatch` straight into
# scripts/lib/github-issue-creator.mjs, as originally planned, would open or
# comment on an issue on ~77% of ALL FUTURE RUNS FOREVER for a category
# nobody can act on — the exact "cries wolf until everyone tunes it out"
# failure this repo has already paid for once (alert-pat-down.mjs, #5432:
# an unclosable issue from a title the closer script's regex could never
# match). So:
#   • `schedule:` IS added below — the "never scheduled" gap #5444 opened
#     with is closed. This now runs weekly and its histogram + full report
#     artifact are one click away for anyone who wants to check the
#     non-noise categories by hand.
#   • NO scripts/lib/github-issue-creator.mjs, and NO `issues: write`,
#     STILL. Auto-filing only becomes safe once `content-mismatch` stops
#     conflating "corpus grew, expected" with "genuine drift" — i.e. once the
#     categorizer gains a related-articles-only tolerated class the same way
#     `ok-cf-bot-script-only` already exists for the Cloudflare bot-fight
#     script. That is real, separate, safety-argued work (the existing two
#     normalizations each shipped with their own proof they cannot mask a
#     genuine value change — see check-article-byte-identity.mjs) — not
#     something to bolt on speculatively in the same change that decided
#     whether this runs at all.
#
# WHY THIS IS NOT JUST `run: node script.mjs` — the preconditions #5444 flags,
# and where each is actually satisfied (traced, not assumed):
#   • ASSET_CDN set BEFORE build-plugins/constants.ts is first imported, and
#     TZ pinned to UTC. NOT this workflow's job: the chain
#     audit-article-corpus-drift.mjs → check-article-byte-identity.mjs →
#     publish-article-fast.mjs calls `pinRenderEnv()`
#     (scripts/lib/render-and-push-hubs.mjs:82-85) before its first dynamic
#     import, which assigns both unconditionally. Setting them here as well
#     would be theatre, and setting them to something ELSE would be a bug.
#   • HERO IMAGES ON DISK. This one IS this workflow's job, and it is the
#     reason a plain checkout matters: publish-article-fast.mjs symlinks
#     `public/images` into its scratch dist dir so resolveImagePath's
#     existence checks resolve. The false positive recorded in
#     audit-article-corpus-drift.mjs's own header came from a sparse worktree
#     that lacked one hero image. `actions/checkout@v5` with no sparse config
#     materialises public/ in full, which is precisely what a laptop cannot
#     cheaply do — the argument for answering this question on a runner.
#
# READ-ONLY, verified rather than hoped: the render writes to a scratch dir
# that check-article-byte-identity.mjs deletes in its `finally`, compares
# against production over `curl`, and pushes nothing. The CDN offload
# (scripts/offload-generated-images-cdn.mjs) only REWRITES text in that
# scratch dist; every R2 PUT lives in workflow steps of
# fast-publish-article.yml (upload-cdn-file.sh / publish-edge-files.mjs) that
# this file does not have. No shard deploy keys are referenced here either.

on:
  schedule:
    # Weekly, not daily: the script's own header calls out "run periodically
    # (e.g. weekly cron)" as the intended cadence for this sampling design —
    # coverage is probabilistic (~corpusSize/sampleSize runs before a given
    # article is ever sampled), so a tighter cadence buys little while
    # spending more curl traffic against production for no gain. Sunday
    # 05:10 UTC: clear of audit-404-risk's 06:00 daily and the hub watchdog's
    # 06:40/18:40 twice-daily slots.
    - cron: '10 5 * * 0'
  workflow_dispatch:
    inputs:
      section:
        description: 'Section to sample'
        type: choice
        options:
          - all
          - frontaliere
          - svizzera
        default: all
      sample_size:
        description: 'Articles sampled PER SECTION (script default is 20; 10 keeps a first look in the low minutes)'
        type: string
        default: '10'
      only_ids:
        description: 'Comma-separated article ids — bypasses random sampling entirely (for re-checking a specific offender)'
        type: string
        default: ''

# contents: read and nothing else. See the header: no issue is opened from
# here — content-mismatch still conflates expected corpus-growth noise with
# genuine drift, so there is nothing yet an automated reporter could file
# that a human wouldn't have to re-triage from scratch anyway.
permissions:
  contents: read

concurrency:
  group: audit-article-corpus-drift
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # Two `npx` spawns per sampled article (the drift script spawns
    # check-article-byte-identity.mjs, which spawns publish-article-fast.mjs)
    # plus up to 4 live curls each. Measured on run 31369064388 (section=all
    # sample_size=15, 30 articles): 5m33s checkout-to-finish, ~2m36s of that
    # inside the audit itself. 45m stays generous for a cold npx cache or a
    # slow production response, not because the steady-state cost is close.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # NOT sparse, on purpose — public/images must be on disk. See header.
          # Nothing here pushes, so the checkout credential is dead weight.
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Tolerant, exactly like rerender-article-corpus.yml and
      # fast-publish-article.yml: absent credentials degrade to a warning.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON not set — the Remote Config load below will be limited"
          fi

      # Loaded so the render environment MATCHES the one that produced the live
      # bytes this audit diffs against (fast-publish-article.yml loads the same
      # keys before calling the identical render path). Without it, a provider
      # key that changes rendered output would show up as drift that is really
      # an environment gap, not a template one — see the header for the
      # categories run 31369064388 actually found once this precondition held.
      # It grants no write path: the upload steps live in that workflow, not
      # this one. Deliberately NO `npm ci` — everything runs under `npx tsx`,
      # same posture as rerender-article-corpus.yml.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # continue-on-error so that a divergent verdict still reaches the summary
      # and the artifact below. The real exit code is re-applied at the end.
      - name: Run the drift audit
        id: audit
        continue-on-error: true
        env:
          INPUT_SECTION: ${{ inputs.section }}
          INPUT_SAMPLE_SIZE: ${{ inputs.sample_size }}
          INPUT_ONLY_IDS: ${{ inputs.only_ids }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/drift"
          ARGS=(--section "${INPUT_SECTION:-all}"
                --sample-size "${INPUT_SAMPLE_SIZE:-10}"
                --report "$RUNNER_TEMP/drift/report.json")
          if [ -n "${INPUT_ONLY_IDS:-}" ]; then
            ARGS+=(--only-ids "$INPUT_ONLY_IDS")
          fi
          # Pinned to the tsx major package.json declares, like every other
          # un-installed path in this repo. NOTE: the drift script's own two
          # inner spawns still say bare `npx -y tsx` — unpinned. Left alone:
          # changing the script's own spawns is a separate code change, not
          # something to fold into the trigger this file is deciding.
          npx -y tsx@4 scripts/audit-article-corpus-drift.mjs "${ARGS[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit with the script's own code, NOT the echo's. Without this line
          # the step's last command is a successful `echo` and the step is
          # always green — which would make `steps.audit.outcome` useless and
          # silently disable the re-apply step at the bottom of this job.
          exit $code

      # THE POINT OF THE RUN. A bare pass/fail is not the deliverable — the
      # CATEGORY HISTOGRAM is, because the script's notion of "ok" is broader
      # than "verified identical":
      #   ok                     — genuinely identical (byte-identical, or so
      #                            once `<head>`'s `<meta>` tags are put in a
      #                            canonical order — #5444; values are still
      #                            compared exactly), the only category that
      #                            proves anything
      #   ok-cf-bot-script-only  — identical except Cloudflare's bot-fight
      #                            <script>, a known edge-injected diff
      #   render-failure         — the render never produced a verdict
      #   fetch-or-liveness      — the live fetch was not 200
      #   content-mismatch / no-locale-verdicts / unrecognized-verdicts
      #                          — the three DIVERGENT_CATEGORIES that fail
      # render-failure and fetch-or-liveness are counted NOT divergent, so a
      # PASS whose histogram is mostly those two verified nothing at all. That
      # distinction is the whole reason to look at a real run before cronning
      # this, and it is what "false-positive rate" actually means here.
      - name: Summarise the verdict
        if: always()
        # Inputs reach the shell as DATA through `env:`, never as script text —
        # `${{ }}` inside `run:` is substituted before the shell sees it, so a
        # free-text input would be executable. Enforced by
        # tests/workflow-input-injection.test.ts (#5032).
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          INPUT_SECTION: ${{ inputs.section }}
          INPUT_SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          set -uo pipefail
          REPORT="$RUNNER_TEMP/drift/report.json"
          {
            echo "### audit-article-corpus-drift"
            echo
            echo "- outcome: \`${AUDIT_OUTCOME:-unknown}\`"
            echo "- section: \`${INPUT_SECTION:-all}\` · sample size/section: \`${INPUT_SAMPLE_SIZE:-10}\`"
            echo
            if [ ! -s "$REPORT" ]; then
              echo "**No report was written** — the script died before finishing. The step log above is the only evidence."
              exit 0
            fi
            jq -r '.sections | to_entries[] |
              "#### \(.key)",
              "",
              "- corpus: \(.value.corpusSize) articles · sampled: \(.value.sampled)",
              "- counted ok: \(.value.okCount) · counted divergent: \(.value.failCount)",
              ""' "$REPORT"
            echo "#### Category histogram (all sections)"
            echo
            echo "| category | n | counts as |"
            echo "|---|---|---|"
            # $c/$n are bound BEFORE the `if`: inside `[…] | index(.c)` the `.`
            # is the literal array, not the histogram row, and `.c` against an
            # array is a hard jq error ("Cannot index array with string").
            jq -r '
              [.sections[].results[].category] | group_by(.) |
              map({c: .[0], n: length}) | sort_by(-.n) | .[] |
              .c as $c | .n as $n |
              "| \($c) | \($n) | \(if (["content-mismatch","no-locale-verdicts","unrecognized-verdicts"] | index($c)) then "**DIVERGENT**" else "ok" end) |"
            ' "$REPORT"
            echo
            VERIFIED="$(jq -r '[.sections[].results[] | select(.category == "ok")] | length' "$REPORT")"
            TOTAL="$(jq -r '[.sections[].results[]] | length' "$REPORT")"
            echo "**Genuinely verified identical: ${VERIFIED}/${TOTAL}.** Anything short of this is not drift — it is the audit failing to observe."
            echo
            echo "\"Identical\" here means byte-identical, or byte-identical once the \`<meta>\` tags inside \`<head>\` are put in a canonical order (#5444: the two render paths emit the same tags in a different sequence — same tags, same values). Values are still compared exactly; only ordering is ignored."
            echo
            echo "#### Non-clean articles"
            echo
            jq -r '[.sections | to_entries[] | .key as $s | .value.results[] | select(.category != "ok")] as $bad |
              if ($bad | length) == 0 then "None — every sampled article came back identical."
              else (["| article | category | locale verdicts |","|---|---|---|"] + [$bad[] |
                "| \(.articleId) | \(.category) | \(.localeVerdicts | to_entries | map("\(.key)=\(.value)") | join(" "))|"])[]
              end' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      # The full per-article breakdown, so a follow-up question does not cost a
      # second run against production. Same lesson as the audit-reports
      # artifact on validate-dist.
      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: article-corpus-drift-report
          path: ${{ runner.temp }}/drift/report.json
          if-no-files-found: warn
          retention-days: 14

      # Truthful run colour. Red here means "read the histogram", not
      # "production is broken" — and with no issue reporter and no generic
      # failure watcher in this repo (verified: every "Workflow Failure:" issue
      # comes from an explicit github-issue-creator.mjs step), a red run has no
      # side effect beyond its own X.
      - name: Re-apply the audit's exit code
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "::notice::The audit reported divergence — see the category histogram in the run summary before concluding anything."
          exit 1
