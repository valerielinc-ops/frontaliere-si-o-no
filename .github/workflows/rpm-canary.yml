name: rpm-canary

# Daily AdSense canary for revenue per page view and ad request coverage.
# It measures only the latest settled day, writes status-only issues, and
# uses both a moving comparison and a fixed coverage floor. See
# scripts/lib/canaryRpmClassify.mjs for the classifier.
#
# Why daily (not hourly): AdSense daily data is only available ~10h
# after UTC midnight. Hourly cadence would burn API quota on identical
# numbers; the goal is "detect within 24h of impact," not real-time.

on:
  schedule:
    # Daily at 10:00 UTC — yesterday's AdSense data is settled by then.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      ratio_floor:
        description: 'Alert if RPM < (ratio_floor × baseline). Default 0.65.'
        required: false
        default: '0.65'
        type: string
      absolute_floor:
        description: 'Alert if RPM < absolute_floor CHF. Default 1.0.'
        required: false
        default: '1.0'
        type: string
      earnings_floor:
        description: 'Only alert if earnings also < (earnings_floor × baseline earnings). Default 0.65.'
        required: false
        default: '0.65'
        type: string
      coverage_floor:
        description: 'Alert if the trailing-window average AD_REQUESTS_COVERAGE < coverage_floor (fraction 0..1). Not baseline-relative — a fixed floor. Default 0.45.'
        required: false
        default: '0.45'
        type: string
      coverage_sustain_days:
        description: 'Consecutive fully-closed days averaged for the coverage floor check. Default 3.'
        required: false
        default: '3'
        type: string

concurrency:
  group: rpm-canary
  cancel-in-progress: true

jobs:
  probe:
    name: Probe AdSense RPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # load-rc-env.mjs imports `firebase-admin` to talk to Remote Config;
      # without npm deps it falls back to "no secrets loaded" and the
      # AdSense call later errors with "missing OAuth credentials". Same
      # install pattern as revenue-monitor.yml (`--ignore-scripts` since
      # we don't need postinstall hooks for this read-only canary).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config (AdSense + GSC tokens)
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Run RPM canary
        id: canary
        continue-on-error: true
        env:
          RATIO_FLOOR: ${{ github.event.inputs.ratio_floor || '0.65' }}
          ABSOLUTE_FLOOR: ${{ github.event.inputs.absolute_floor || '1.0' }}
          EARNINGS_FLOOR: ${{ github.event.inputs.earnings_floor || '0.65' }}
          COVERAGE_FLOOR: ${{ github.event.inputs.coverage_floor || '0.45' }}
          COVERAGE_SUSTAIN_DAYS: ${{ github.event.inputs.coverage_sustain_days || '3' }}
        run: |
          set -o pipefail
          node scripts/canary-rpm.mjs \
            --json \
            --ratio-floor="$RATIO_FLOOR" \
            --absolute-floor="$ABSOLUTE_FLOOR" \
            --earnings-floor="$EARNINGS_FLOOR" \
            --coverage-floor="$COVERAGE_FLOOR" \
            --coverage-sustain-days="$COVERAGE_SUSTAIN_DAYS" \
            > rpm-canary-result.json 2> rpm-canary.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Append private-data status to job log
        if: always()
        run: echo 'RPM canary completed; financial measurements are withheld from the public run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build issue body
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/build-rpm-canary-issue-body.mjs rpm-canary-result.json > rpm-canary-issue-body.md

      - name: Open GitHub issue on regression
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/lib/github-issue-creator.mjs \
            --title "RPM canary: AdSense RPM crash detected" \
            --description-file rpm-canary-issue-body.md \
            --priority 1 \
            --label Bug \
            --label rpm-canary \
            --label revenue \
            --workflow "rpm-canary"

      # Recovery mirror: on a clean probe, close the canonical open issue this
      # canary opened (custom title → NOT covered by close-recovered-failure-issues.mjs,
      # which only matches the generic `Workflow|Crawler|CI Failure: <name>` prefixes,
      # nor by any sibling --resolve step). Without this the regression issue stays
      # open forever after RPM recovers. Best-effort, always exits 0.
      - name: Resolve open issue on green
        if: steps.canary.outcome == 'success' && steps.canary.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "RPM canary: AdSense RPM crash detected" \
            --workflow "rpm-canary" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail the workflow if a regression was detected
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        run: |
          echo "::error::AdSense monitoring regression detected — see the status-only GitHub issue"
          exit 1
