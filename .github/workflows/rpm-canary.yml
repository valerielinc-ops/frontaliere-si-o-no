name: rpm-canary

# AdSense RPM crash detector — the "watch on the effect" companion to
# `article-content-canary.yml` (which watches the cause).
#
# Runs once a day, pulls daily PAGE_VIEWS_RPM via the AdSense API, and
# opens a deduplicated GitHub issue only when the latest fully-closed
# day's RPM is down AND earnings confirm it:
#   - RPM < 65% of the trailing 7-day baseline (T-9..T-3) OR < 1.00 CHF, AND
#   - earnings < 65% of the baseline earnings.
#
# The earnings gate kills false alarms from page-view spikes: RPM is
# earnings ÷ page views, so a traffic spike with healthy earnings halves
# RPM without losing a cent (issue #2176, 2026-06-15..17). A real incident
# collapses earnings too, so the catch is preserved. The still-open current
# UTC day is never measured (its earnings aren't settled). See
# scripts/lib/canaryRpmClassify.mjs for the unit-tested classifier.
#
# Catches ANY revenue-affecting regression within ~24h — article stubs,
# ads.txt issues, AdSense policy hits, ad slot misconfig, demand drops.
# Incident 2026-05-28 (3.04 → 1.74 CHF/day) would have triggered the
# morning of 2026-05-28: both RPM and earnings cratered (stubs served no ads).
#
# Why daily (not hourly): AdSense daily data is only available ~10h
# after UTC midnight. Hourly cadence would burn API quota on identical
# numbers; the goal is "detect within 24h of impact," not real-time.

on:
  schedule:
    # Daily at 10:00 UTC — yesterday's AdSense data is settled by then.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      ratio_floor:
        description: 'Alert if RPM < (ratio_floor × baseline). Default 0.65.'
        required: false
        default: '0.65'
        type: string
      absolute_floor:
        description: 'Alert if RPM < absolute_floor CHF. Default 1.0.'
        required: false
        default: '1.0'
        type: string
      earnings_floor:
        description: 'Only alert if earnings also < (earnings_floor × baseline earnings). Default 0.65.'
        required: false
        default: '0.65'
        type: string

concurrency:
  group: rpm-canary
  cancel-in-progress: true

jobs:
  probe:
    name: Probe AdSense RPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # load-rc-env.mjs imports `firebase-admin` to talk to Remote Config;
      # without npm deps it falls back to "no secrets loaded" and the
      # AdSense call later errors with "missing OAuth credentials". Same
      # install pattern as revenue-monitor.yml (`--ignore-scripts` since
      # we don't need postinstall hooks for this read-only canary).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config (AdSense + GSC tokens)
        continue-on-error: true
        run: node scripts/load-rc-env.mjs

      - name: Run RPM canary
        id: canary
        continue-on-error: true
        env:
          RATIO_FLOOR: ${{ github.event.inputs.ratio_floor || '0.65' }}
          ABSOLUTE_FLOOR: ${{ github.event.inputs.absolute_floor || '1.0' }}
          EARNINGS_FLOOR: ${{ github.event.inputs.earnings_floor || '0.65' }}
        run: |
          set -o pipefail
          node scripts/canary-rpm.mjs \
            --json \
            --ratio-floor="$RATIO_FLOOR" \
            --absolute-floor="$ABSOLUTE_FLOOR" \
            --earnings-floor="$EARNINGS_FLOOR" \
            > rpm-canary-result.json 2> rpm-canary.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload canary result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpm-canary-${{ github.run_id }}
          path: |
            rpm-canary-result.json
            rpm-canary.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Append summary to job log
        if: always()
        run: |
          if [ -s rpm-canary-result.json ]; then
            echo "## RPM canary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat rpm-canary-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build issue body
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/build-rpm-canary-issue-body.mjs rpm-canary-result.json > rpm-canary-issue-body.md

      - name: Open GitHub issue on regression
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/lib/github-issue-creator.mjs \
            --title "RPM canary: AdSense RPM crash detected" \
            --description "$(cat rpm-canary-issue-body.md)" \
            --priority 1 \
            --label Bug \
            --label rpm-canary \
            --label revenue \
            --workflow "rpm-canary"

      # Recovery mirror: on a clean probe, close the canonical open issue this
      # canary opened (custom title → NOT covered by close-recovered-failure-issues.mjs,
      # which only matches the generic `Workflow|Crawler|CI Failure: <name>` prefixes,
      # nor by any sibling --resolve step). Without this the regression issue stays
      # open forever after RPM recovers. Best-effort, always exits 0.
      - name: Resolve open issue on green
        if: steps.canary.outcome == 'success' && steps.canary.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "RPM canary: AdSense RPM crash detected" \
            --workflow "rpm-canary" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail the workflow if RPM regression detected
        if: steps.canary.outcome == 'failure' || steps.canary.outputs.exit_code == '1'
        run: |
          echo "::error::AdSense RPM regression detected — see GitHub issue + artifact"
          exit 1
