name: Reconcile HERE Usage Budget

# Reads HERE's real billed routing usage (Cost Management Usage API) and seeds
# the Firestore budget counter (meta/hereTransactionBudget) so the pre-run guard
# in trafficSchedulerCore.js gates on the real month-to-date spend, not just the
# attempts it counted since deploy. Closes the drift from mid-month rollout and
# HERE-side retries. See scripts/reconcile-here-usage.mjs.
#
# Requires OAuth credentials in Remote Config: HERE_OAUTH_KEY_ID,
# HERE_OAUTH_KEY_SECRET, HERE_REALM_ID. Until those are provisioned the job
# skips cleanly (exit 2 → treated as no-op, not a failure).

on:
  pull_request:
    paths:
      - '.github/workflows/here-usage-reconcile.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Twice daily (UTC). Usage data lags, so a morning + evening read keeps the
    # counter aligned without hammering the API.
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      set:
        description: 'Manual seed: month-to-date transactions from the Usage Dashboard (leave empty for live API mode)'
        required: false
        default: ''

concurrency:
  group: here-usage-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # This job only needs firebase-admin for Remote Config and the Firestore
      # seed. Installing the whole site tree pulls in unrelated native/AI/UI
      # packages and was the source of the 8-minute timeout (issue #17692).
      - name: Install firebase-admin (for Remote Config and Firestore)
        run: |
          npm install --prefix "$RUNNER_TEMP/firebase-admin-deps" --no-save --ignore-scripts --no-fund --no-audit firebase-admin@14.5.0
          ln -s "$RUNNER_TEMP/firebase-admin-deps/node_modules" node_modules

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Reconcile HERE usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_SET: ${{ github.event.inputs.set }}
        run: |
          args=(--alert)
          if [ -n "$MANUAL_SET" ]; then
            args+=(--set "$MANUAL_SET")
          fi
          set +e
          node scripts/reconcile-here-usage.mjs "${args[@]}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::notice::HERE OAuth credentials not provisioned yet — reconciliation skipped (no-op)."
            exit 0
          fi
          exit $code

  install-benchmark:
    if: github.event_name == 'pull_request'
    name: install benchmark (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [full, isolated]
    runs-on: ubuntu-latest
    # The production job remains capped at eight minutes. The benchmark gets
    # enough room to finish the old full install, while the isolated path
    # below enforces that same eight-minute budget explicitly.
    timeout-minutes: 15
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Measure dependency installation
        id: measure
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          if [ "$MODE" = full ]; then
            # This is the former production install, measured on a fresh runner.
            npm ci --no-fund --no-audit
          else
            npm install --prefix "$RUNNER_TEMP/firebase-admin-deps" --no-save --ignore-scripts --no-fund --no-audit firebase-admin@14.5.0
            cd "$RUNNER_TEMP/firebase-admin-deps"
            node --input-type=module -e "await import('firebase-admin/app')"
          fi
          finished=$(date +%s)
          elapsed=$((finished - started))
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo "## HERE dependency install benchmark"
            echo ""
            echo "| mode | seconds | runner | head |"
            echo "| --- | ---: | --- | --- |"
            echo "| $MODE | $elapsed | $RUNNER_OS / $RUNNER_ARCH | $GITHUB_SHA |"
            echo ""
            echo "The isolated mode must stay below the production eight-minute budget; both modes run on fresh runners."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = isolated ] && [ "$elapsed" -ge 480 ]; then
            echo "::error::isolated firebase-admin install exceeded the eight-minute production budget (${elapsed}s)"
            exit 1
          fi
