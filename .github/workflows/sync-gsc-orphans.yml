name: Sync GSC Orphan Job Slugs

# Runs twice a week to keep orphan data synchronized with Google Search Console.
# Also triggered after translate-pending completes (new jobs may create new orphans).
on:
  schedule:
    - cron: '30 14 * * 0'  # Sunday at 14:30 UTC
    - cron: '30 14 * * 3'  # Wednesday at 14:30 UTC
  workflow_run:
    workflows: ['Translate Pending Jobs']
    types: [completed]
  workflow_dispatch:
    inputs:
      enable_url_inspection:
        description: 'Enable URL Inspection API (500 req cap, uses daily quota)'
        required: false
        type: boolean
        default: false
      enable_wayback:
        description: 'Enable Wayback Machine lookups (slow, unreliable)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: false

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync-orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # Primary identity for the deploy dispatch below = GitHub App installation
      # token (`frontaliere-automation[bot]`): auto-mints, no expiry babysit, and
      # its dispatch re-triggers deploy.yml just like the PAT (no GITHUB_TOKEN
      # anti-recursion). Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Sync GSC orphan slugs + enrich
        run: |
          node scripts/sync-gsc-orphans.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          ENABLE_URL_INSPECTION: ${{ inputs.enable_url_inspection == true && '1' || '0' }}
          ENABLE_WAYBACK: ${{ inputs.enable_wayback == true && '1' || '0' }}

      - name: Assemble jobs dataset (needed by reconcile)
        if: ${{ inputs.dry_run != true }}
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Reconcile orphan + expired slugs with active jobs
        if: ${{ inputs.dry_run != true }}
        run: node scripts/reconcile-job-slugs.mjs

      - name: Mine all job slugs for comprehensive coverage
        if: ${{ inputs.dry_run != true }}
        run: node scripts/mine-all-job-slugs.mjs

      - name: Canton-aware migration of slug registry (keep registry invariant pre-commit)
        if: ${{ inputs.dry_run != true }}
        # mine-all-job-slugs writes every entry under the legacy TI section.
        # Rewrite entries attributable to live non-TI jobs to their canton-aware
        # paths BEFORE committing to main (bot-direct-to-main gate, same
        # rationale as the prune step below): an unmigrated registry bakes
        # TI canonicals into dist soft-landings and turns gate:seo-source red
        # post-merge (run 27352608929). Needs data/jobs.json (assembled above).
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: Prune non-resolving 404-compat paths (keep test invariant green)
        if: ${{ inputs.dry_run != true }}
        # Gate bot-direct-to-main against the committed-snapshot invariant
        # (tests/search-console-compat.test.ts): drop any appended path the
        # resolver can't map BEFORE commit, so main never goes red on a raw
        # data dump (observed 2026-06-02: a sync commit froze the drain ~83min).
        # Needs data/jobs.json (assembled above); self-skips if missing.
        run: npx tsx scripts/prune-404-compat-paths.ts

      # #4248: the workflow was red for three weeks and the badge said so, but
      # what the failure COST was invisible — the pipeline kept computing soft
      # landings and `git push` kept throwing them away. Measure the backlog
      # (what this run computed vs what main actually has) BEFORE the commit, so
      # a future "green but reconciling nothing" regression shows up as a
      # growing number instead of a silent one. Never fails the job: it is
      # telemetry, and the commit below is the step that matters.
      - name: Report orphan reconciliation backlog
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: node scripts/report-orphan-reconciliation.mjs

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        id: commit
        run: |
          SKIP_AI_TRANSLATION=1 bash scripts/lib/git-commit-data.sh --slice-only \
            "chore: sync GSC orphan slugs and reconcile job data" \
            data/orphan-enriched-data \
            data/orphan-reconciliation-history.json \
            data/orphan-indexed-job-slugs.json \
            data/gsc-orphan-queries.json \
            data/url-inspection-results.json \
            data/all-known-job-slugs \
            data/seo-404-compat
        env:
          SKIP_AI_TRANSLATION: '1'
          # #4162: il job (30min) veniva cancellato per timeout DENTRO questo step.
          # sync-gsc-orphans.mjs è veloce (~104s); il tempo se ne va tutto nella
          # push-contention war di git-commit-data.sh (path sequenziale
          # commit_isolated_from_worktree) contro le push concorrenti dei ~crawler
          # su main. Col default MAX_PUSH_ATTEMPTS=14 + backoff escalante
          # (5,10,…,65s + jitter) il loop di retry dura ~24min sotto contention e
          # sfora il budget job PRIMA di poter ritornare 42 (contention-exhausted)
          # → il soft-fail sequenziale (exit 42 → exit 0, già presente in
          # git-commit-data.sh righe ~1038) NON scatta mai perché il job viene
          # killato a metà loop. Abbassare il tetto SOLO per questo caller (env,
          # zero modifiche allo script condiviso dai 40+ crawler) fa concludere il
          # loop in ~5-6min anche sotto contention: su perdita-race ritorna 42 →
          # soft exit 0 (i dati si auto-guariscono al prossimo run schedulato
          # bi-settimanale), mentre un fallimento NON-contention (auth/rete/hook)
          # ritorna comunque exit 1 → job rosso → issue di failure (semantica
          # exit-code preservata, nessun mascheramento di errori reali — perciò
          # NON uso continue-on-error, che ingoierebbe anche gli exit 1 genuini).
          # 8 tentativi = ~8 chance di vincere la ref-race, con margine ampio
          # sotto i 30min.
          MAX_PUSH_ATTEMPTS: '8'

      - name: Trigger deploy if data changed
        if: steps.commit.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          # Check if tracking or compat data changed (new soft-landing pages needed)
          TRACKING_CHANGES=$(git diff HEAD~1 --name-only -- data/all-known-job-slugs data/seo-404-compat | wc -l)
          CRAWLER_CHANGES=$(git diff HEAD~1 --name-only -- data/jobs/by-crawler/ | wc -l)
          ORPHAN_CHANGES=$(git diff HEAD~1 --name-only -- data/orphan-enriched-data | wc -l)

          if [ "$CRAWLER_CHANGES" -gt 0 ] || [ "$TRACKING_CHANGES" -gt 0 ]; then
            echo "🚀 Job data changed (crawler: $CRAWLER_CHANGES, tracking: $TRACKING_CHANGES) — triggering deploy"
            # Hard-fail by design (no `|| true`, #6936): a failed dispatch
            # here fails the job, caught by "Report failure to GitHub Issues"
            # below — that GitHub issue IS this caller's recovery net
            # (auto-triage picks it up), so silencing it would just hide a
            # real deploy gap.
            bash scripts/lib/trigger-deploy.sh
          elif [ "$ORPHAN_CHANGES" -gt 0 ]; then
            echo "📝 Only orphan enrichment metadata changed — deploy not strictly needed"
            echo "   (soft-landing pages will use enriched data on next regular deploy)"
          else
            echo "📭 No meaningful data changes — skipping deploy"
          fi
        env:
          # trigger-deploy.sh resolves TOKEN="${GITHUB_PAT:-${GH_TOKEN:-}}" — override
          # with the App token when minted (primary identity), PAT otherwise (#2861
          # item 1). GITHUB_PAT itself è caricato in $GITHUB_ENV dallo step
          # "load-rc-env" (Firebase RC, non un Actions secret — `secrets.GH_PAT` non
          # esiste). NON shadoware con secrets.*: altrimenti trigger-deploy.sh gira
          # con token vuoto e il deploy non parte (cfr. #878).
          GITHUB_PAT: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
