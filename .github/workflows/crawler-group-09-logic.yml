          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/air-zermatt.sh"
          launcher_path="$state_dir/air-zermatt.launcher.sh"
          worker_path="$state_dir/air-zermatt.worker.sh"
          log_path="$state_dir/air-zermatt.log"
          pid_path="$state_dir/air-zermatt.pid"
          status_path="$state_dir/air-zermatt.status"
          started_path="$state_dir/air-zermatt.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- air-zermatt: run crawler (verbatim from original workflow) ----
          npm run jobs:update:air-zermatt
          crawler_exit=$?
          git_commit_exit=0

          # ---- air-zermatt: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- air-zermatt: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "Auto-update Air Zermatt AG jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- air-zermatt: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run air-zermatt" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run air-zermatt"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::air-zermatt: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ air-zermatt: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::air-zermatt: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ air-zermatt: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::air-zermatt: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ air-zermatt: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          worker_path="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/air-zermatt.started"
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            bash "$worker_path"
            exit $?
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$flock_exit"
                if ! [[ "$terminal_exit" =~ ^[1-9][0-9]*$ ]]; then terminal_exit=143; fi
                printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                printf '\''%s\n'\'' "$flock_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$flock_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
