      - name: Launch air-zermatt
        id: crawler-launch-air-zermatt
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-air-zermatt.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_AIR_ZERMATT_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
