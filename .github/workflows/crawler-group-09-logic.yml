# Crawler Group 09 logic — reusable workflow (on: workflow_call).
#
# Physically hosted here (frontaliere-si-o-no) as the single source of
# the crawling logic — but invoked cross-repo from a minimal caller
# workflow physically hosted in frontaliere-articles (account
# nanakokyobashi-rgb), so the RUN and its concurrency-pool consumption
# are billed against nanako's separate, less-saturated pool instead of
# valerielinc-ops' saturated ~20-concurrent-job Free-plan pool.
#
# Structure validated by the crawler-group-23 pilot
# (frontaliere-si-o-no#6485 -> reverted #6517 -> #6520 /
# frontaliere-articles#594 -> #600 -> #602), dispatch-tested for real
# before this batch migrated the remaining 22 groups + translate-pending.yml
# on top of it. A composite action was tried first and reverted: its
# step schema rejects the background:/wait-all: pair every crawler-group
# workflow needs to run its crawlers in parallel ("Unexpected value
# 'background'" at workflow-load time, before a single step runs). A
# reusable workflow avoids that: workflow_call defines a FULL job, so it
# keeps the same step schema as a normal job (background/wait-all
# included) and the real secrets context.
#
# The crawler steps below are a straight copy of this group's own
# committed crawler-group-NN.yml (same source kept, disabled, for
# rollback). Only two things differ from that body: (1) the first step
# is a public/anonymous checkout of this repo instead of the implicit
# "checkout whatever repo this job is already running in" — a
# workflow_call job's workspace starts empty regardless of which repo's
# workflow called it, and it must start anonymous because the caller's
# own ambient token is scoped to frontaliere-articles, not this repo;
# (2) each crawler step's own `GH_TOKEN` env line is dropped (it would
# shadow the GITHUB_PAT-derived one bootstrapped below with the wrong,
# read-only ambient token). CODEX_AUTH_BROKER_SOCKET and
# FIREBASE_SERVICE_ACCOUNT_JSON are read via the normal secrets context,
# unchanged — the caller passes them explicitly through this workflow's
# declared workflow_call secrets.

name: Crawler Group 09 logic (reusable workflow)
on:
  workflow_call:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: false
        type: string
        default: ""
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false
      CODEX_AUTH_JSON:
        required: false
permissions:
  contents: read
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_09:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      DATA_PIPELINE_LEASE: "1"
    steps:
      - name: Checkout frontaliere-si-o-no (public, read-only)
        uses: actions/checkout@v5
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare Firebase credentials (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "ℹ️ Firebase secrets not set — crawler will use file config only."
            exit 0
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 27 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-09.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-omniroute@main
      - id: setup_claude_haiku_fallback
        uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-claude-haiku-fallback@main
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Launch solina
        id: crawler-launch-solina
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-solina.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_SOLINA_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: solina
          JOBS_SLICE_FILE: data/jobs/by-crawler/solina.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/solina.sh"
          launcher_path="$state_dir/solina.launcher.sh"
          worker_path="$state_dir/solina.worker.sh"
          log_path="$state_dir/solina.log"
          pid_path="$state_dir/solina.pid"
          status_path="$state_dir/solina.status"
          started_path="$state_dir/solina.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- solina: run crawler (verbatim from original workflow) ----
          node scripts/update-solina-jobs.mjs
          crawler_exit=$?
          git_commit_exit=0

          # ---- solina: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- solina: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Solina jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- solina: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run solina" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run solina"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::solina: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ solina: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::solina: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ solina: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::solina: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ solina: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-09/solina.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/solina.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/solina.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/solina.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          worker_path="$RUNNER_TEMP/crawler-generation/group-09/solina.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/solina.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/solina.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/solina.started"
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            bash "$worker_path"
            exit $?
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$flock_exit"
                if ! [[ "$terminal_exit" =~ ^[1-9][0-9]*$ ]]; then terminal_exit=143; fi
                printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                printf '\''%s\n'\'' "$flock_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$flock_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch spital-muri
        id: crawler-launch-spital-muri
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-spital-muri.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_SPITAL_MURI_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: spital-muri
          JOBS_SLICE_FILE: data/jobs/by-crawler/spital-muri.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/spital-muri.sh"
          launcher_path="$state_dir/spital-muri.launcher.sh"
          worker_path="$state_dir/spital-muri.worker.sh"
          log_path="$state_dir/spital-muri.log"
          pid_path="$state_dir/spital-muri.pid"
          status_path="$state_dir/spital-muri.status"
          started_path="$state_dir/spital-muri.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- spital-muri: run crawler (verbatim from original workflow) ----
          node scripts/update-spital-muri-jobs.mjs
          crawler_exit=$?
          git_commit_exit=0

          # ---- spital-muri: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- spital-muri: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update SPITAL_MURI jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- spital-muri: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 43 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            node scripts/lib/github-issue-creator.mjs \
              --title "Crawler Failure: Run spital-muri" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run spital-muri"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::spital-muri: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ spital-muri: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::spital-muri: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ spital-muri: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::spital-muri: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ spital-muri: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.started"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$worker_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          worker_path="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.worker.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.status.tmp.$$"
          started_file="$RUNNER_TEMP/crawler-generation/group-09/spital-muri.started"
          max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-4}"
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            printf '\''1\n'\'' > "$status_tmp"
            mv "$status_tmp" "$status_file"
            exit 1
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            bash "$worker_path"
            exit $?
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/slot-${slot_index}.lock"
              flock -n "$slot_path" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                exit 0
              fi
              if [ -s "$status_file" ]; then
                status="$(cat "$status_file" 2>/dev/null || true)"
                if [[ "$status" =~ ^[0-9]+$ ]]; then exit "$status"; fi
                printf '\''1\n'\'' > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit 1
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$flock_exit"
                if ! [[ "$terminal_exit" =~ ^[1-9][0-9]*$ ]]; then terminal_exit=143; fi
                printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                printf '\''%s\n'\'' "$flock_exit" > "$status_tmp"
                mv "$status_tmp" "$status_file"
                exit "$flock_exit"
              fi
            done
            sleep 1
          done' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch localsearch
        id: crawler-launch-localsearch
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-localsearch.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_LOCALSEARCH_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: localsearch
          JOBS_SLICE_FILE: data/jobs/by-crawler/localsearch.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-09"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/localsearch.sh"
          launcher_path="$state_dir/localsearch.launcher.sh"
          worker_path="$state_dir/localsearch.worker.sh"
          log_path="$state_dir/localsearch.log"
          pid_path="$state_dir/localsearch.pid"
          status_path="$state_dir/localsearch.status"
          started_path="$state_dir/localsearch.started"
          rm -f "$script_path" "$launcher_path" "$worker_path" "$log_path" "$pid_path" "$status_path" "$started_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- localsearch: run crawler (verbatim from original workflow) ----
          node scripts/update-localsearch-jobs.mjs
          crawler_exit=$?
          git_commit_exit=0

          # ---- localsearch: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs) || true
          fi

          # ---- localsearch: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update localsearch jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
