name: Weekly Analytics Report

on:
  schedule:
    # Every Monday at 07:00 UTC (09:00 CET)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Report period in days (default: 30)'
        required: false
        default: '30'
        type: string
      sections:
        description: 'Which reports to run (all, gsc, pagespeed, ga4, indexing, bing, clarity)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gsc
          - pagespeed
          - ga4
          - indexing
          - bing
          - clarity

concurrency:
  group: analytics-report
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "⚠️ Firebase secrets not set — secrets will not be loaded from Remote Config."
          fi
          if [ -f /tmp/firebase-sa.json ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute

      # ── Codex Luna Max article lane (ON by default, kill-switch '0') ────
      # Bounded Codex CLI broker used by ai-models.mjs for article generation.
      # The historical action path is retained for workflow compatibility.
      - id: setup_claude_haiku_fallback
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          # L'unica chiamata Codex (suggerimenti UX) arriva dopo PageSpeed, che
          # da solo dura fino a ~28 min: col TTL di 30 min il broker era gia'
          # scaduto (run 36437510390, broker pronto alle 14:44:12, ENOENT alle
          # 15:15:55). Un'ora copre il timeout del job; il cleanup lo chiude.
          broker_idle_ttl_ms: '3600000'

      - name: Run Analytics Report
        env:
          # Auth for the bounded Codex Luna Max article lane. Harmless to
          # always pass: ai-models.mjs only opens the broker when its gate is
          # enabled.
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          AI_MODELS_PREFER: codex-cli/gpt-6-luna
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DAYS: ${{ inputs.days || '30' }}
          INPUT_SECTIONS: ${{ inputs.sections || 'all' }}
        run: |
          DAYS="$INPUT_DAYS"
          SECTION="$INPUT_SECTIONS"

          mkdir -p reports

          args=(--days "$DAYS" --save)
          if [ "$SECTION" != "all" ]; then
            args+=("--$SECTION")
          fi

          echo "📊 Running analytics report ($SECTION, last $DAYS days)..."
          umask 077
          node scripts/analytics-report.mjs "${args[@]}" > "$RUNNER_TEMP/analytics-report.log" 2>&1
        continue-on-error: true

      - name: Measure top50 search snippets
        if: always() && (inputs.sections == 'all' || inputs.sections == 'gsc' || inputs.sections == '')
        env:
          GSC_TOP50_DEPLOYED_AT: ${{ vars.GSC_TOP50_DEPLOYED_AT }}
        run: |
          umask 077
          node scripts/gsc-page-query-export.mjs --top50-monitor --out=reports/gsc-top50-monitor > "$RUNNER_TEMP/gsc-top50-monitor.log" 2>&1

      - name: Measure observed application journeys
        if: always() && (inputs.sections == 'all' || inputs.sections == 'ga4' || inputs.sections == '')
        run: |
          mkdir -p reports
          umask 077
          node scripts/job-application-funnel-report.mjs > reports/job-application-funnel.json 2> "$RUNNER_TEMP/job-application-funnel.log"

      - name: Measure landing value by template
        # Valore/sessione per template (ricavo ads + candidature × valore di un
        # clic ads), organico, flotta headless esclusa: input delle priorità
        # SEO. Read-only; docs/analytics/ga4-misura-affidabile.md.
        if: always() && (inputs.sections == 'all' || inputs.sections == 'ga4' || inputs.sections == '')
        run: |
          mkdir -p reports
          umask 077
          node scripts/landing-value-report.mjs --out reports/landing-value-by-template.json > /dev/null 2> "$RUNNER_TEMP/landing-value-report.log"
        continue-on-error: true

      - name: Commit AI channel history
        # The report is intentionally allowed to finish with partial data, but
        # the history write must not disappear with the runner workspace.
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/ai-channel-history.jsonl
          if git diff --cached --quiet -- data/ai-channel-history.jsonl; then
            echo "No AI channel history changes to commit"
            exit 0
          fi

          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "data/ai-channel-history.jsonl" ]; then
            echo "::error::AI channel history step staged an unexpected path"
            git diff --cached --name-only
            exit 1
          fi

          git commit -m "chore(analytics): persist AI channel history [skip ci]"
          bash scripts/lib/git-push-with-retry.sh \
            --branch "$GITHUB_REF_NAME" \
            --in-place-resolver-cmd "source scripts/lib/resolve-append-conflicts.sh && resolve_append_conflicts && git add -- data/ai-channel-history.jsonl"

      - name: Sync app_error issues to backlog
        # Turns the errorHealth.appErrors block just computed above into
        # deduplicated GitHub issues (top offenders, threshold-gated) — see
        # scripts/app-error-issue-sync.mjs. Report-only: never fails the job.
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/app-error-issue-sync.mjs
        continue-on-error: true

      - name: Write status-only analytics summary
        if: always()
        run: echo 'Analytics processing completed; GA4 and monetization measurements are withheld from the public run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            exit 0
          fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
            --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" \
            || echo "::warning::Codex auth broker cleanup did not complete"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
