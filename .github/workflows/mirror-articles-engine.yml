name: Mirror the articles engine to the corpus repo

# The code half of the cycle, which has had no transport since the cutover.
#
# CLAUDE.md states the invariant this workflow restores: "il codice scende dal
# sito al corpus, i dati risalgono dal corpus al sito". The data direction is
# automated and healthy — nanako publishes JSON, sync-articles-sitemaps.yml and
# scripts/pull-articles-corpus.mjs pull it back. The code direction had exactly
# one carrier, mirror-articles-corpus.yml, and the 2026-08-02 cutover disabled
# it: that workflow does `rm -rf content && cp -R packages/articles/content`, so
# any automatic run now deletes every article nanako has generated. It was
# switched to dispatch-only for that reason and cannot be switched back.
#
# So from 2026-08-02 the engine had no way down, and nothing said so. Three
# engine PRs merged here on 2026-08-05 — #5101 (hero intrinsic width/height),
# #5107 (topical related-articles index), and the ARTICLE_FOOTER_ROOT portal
# target — never reached nanako. nanako is what renders article pages now, so
# every article published in between shipped from the pre-fix engine. Measured
# on production: `<main class="seo-static-content">` present, `<div
# id="footer-root"></div>` absent, which is precisely what
# audit:footer-root-presence counts and why its count went from 23 to 3608.
#
# The fix is not to re-enable the corpus mirror. It is to carry the ONLY thing
# this repo still owns — `engine/` — and to carry nothing else. Splitting the
# transport this way is what makes automation safe: the destructive half of the
# old mirror was entirely about `content/`, and this workflow may not touch
# `content/` at all. That is asserted below, at run time, on the staged diff.
#
# It is also what finally makes mirror-articles-corpus.yml deletable (#4974
# §5.7): today it has to stay because deleting it would remove the last
# code-shaped connection between the two repos, even though it is unusable.
#
# Why the engine is safe to drop into nanako wholesale:
# tests/packages-articles-confinement.test.ts proves — via the TypeScript AST,
# not regex — that nothing under packages/articles imports outside its own
# folder beyond Node builtins and its declared dependencies. Everything else
# arrives through SiteShellContract (engine/siteShell.ts), which nanako
# satisfies from its own host/ tree. A package that cannot reach back into the
# site is a package that can be copied into another repo unchanged.

on:
  push:
    branches: [main]
    paths:
      - 'packages/articles/engine/**'
      # index.ts and articleSections.ts are the package's own surface and the
      # old mirror carried them alongside engine/. Same set, minus content/.
      - 'packages/articles/index.ts'
      - 'packages/articles/articleSections.ts'
      - '.github/workflows/mirror-articles-engine.yml'

  # Safety net, and in practice load-bearing — the same lesson
  # mirror-articles-corpus.yml learned and wrote down before it was disabled.
  # A push made with the default GITHUB_TOKEN never triggers another workflow
  # (GitHub's anti-recursion rule), so the `push:` filter above misses any
  # engine change that lands from automation rather than from a human merge.
  # Without this schedule the drift this workflow exists to prevent would come
  # back through exactly the door it came through the first time.
  #
  # Cheap when there is nothing to do: the job exits at "engine already in
  # sync" without creating a branch or a PR.
  schedule:
    - cron: '19 */6 * * *' # off-hour, clear of the deploy cron and publish-api

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Stage and print the diff, push nothing.'
        type: boolean
        required: false
        default: false

# Serialised, never cancelled: two runs would each clone nanako, stage
# independently and force-push the same side branch, and the loser would
# silently overwrite the winner mid-flight.
concurrency:
  group: mirror-articles-engine
  cancel-in-progress: false

# Read-only against THIS repo. Every write happens inside a temp clone of
# nanako, authenticated with ARTICLES_REPO_PAT.
permissions:
  contents: read

env:
  # The branch this workflow owns outright in nanako. It is derived state:
  # rebuilt from origin/main + this repo's engine on every run, never edited by
  # hand, which is what makes the force-push below safe.
  TARGET_BRANCH: engine-lockstep-auto

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v5, not v4: v4's Node runtime gate fails on this runner image.
      #
      # Sparse, non-cone, anchored. This job reads packages/articles/engine and
      # two sibling files and nothing else; a full checkout materialises 14k
      # corpus files under packages/articles/content for no benefit, which is
      # the 17-minute checkout that had to be engineered out of
      # transport-generator-to-nanako.yml. Anchoring every pattern with a
      # leading slash matters: unanchored, `engine` in gitignore syntax matches
      # a directory of that name at any depth.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /packages/articles/engine/
            /packages/articles/index.ts
            /packages/articles/articleSections.ts
          sparse-checkout-cone-mode: false

      - name: Sanity - the engine actually materialised
        # A sparse pattern that selects nothing leaves an empty directory and
        # every later step still "succeeds": the copy copies nothing, the diff
        # is empty, and the run reports "already in sync" while the two repos
        # drift apart. That is the same silent-success shape this whole
        # workflow exists to remove, so it is checked rather than assumed.
        run: |
          set -euo pipefail
          count=$(find packages/articles/engine -type f | wc -l | tr -d ' ')
          echo "engine files checked out: $count"
          if [ "$count" -lt 5 ]; then
            echo "::error::sparse checkout produced $count engine file(s) — refusing to mirror an empty or truncated engine"
            exit 1
          fi
          if [ ! -f packages/articles/engine/siteShell.ts ]; then
            echo "::error::engine/siteShell.ts missing — the checkout is not the engine"
            exit 1
          fi

      - name: Stage the engine into a clone of the corpus repo
        id: stage
        env:
          PAT: ${{ secrets.ARTICLES_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::ARTICLES_REPO_PAT is not set — cannot mirror"
            exit 1
          fi

          work=$(mktemp -d)
          echo "work=$work" >> "$GITHUB_OUTPUT"

          # Always branch from nanako's CURRENT main, never from whatever the
          # side branch happens to hold. The side branch is derived state; if
          # it were continued instead, a run whose PR was never merged would
          # keep replaying an old base and the PR diff would drift away from
          # what merging it would actually do.
          git clone --depth 1 --branch main \
            "https://x-access-token:${PAT}@github.com/nanakokyobashi-rgb/frontaliere-articles.git" \
            "$work"

          # The whole safety argument, in three lines: engine/ is REPLACED,
          # content/ is not named, not read, and not written. The old mirror's
          # destructive step was `rm -rf content` — there is deliberately no
          # analogue here, and the guard below proves it on the actual diff
          # rather than trusting this comment.
          rm -rf "${work:?}/engine"
          cp -R packages/articles/engine "$work/engine"
          for f in index.ts articleSections.ts; do
            [ -f "packages/articles/$f" ] && cp "packages/articles/$f" "$work/$f"
          done

          cd "$work"
          git add -A

          if git diff --cached --quiet; then
            echo "engine already in sync — nothing to mirror"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # ── The guard that makes a `push:` trigger defensible ─────────────
          # Every staged path must be one this workflow is allowed to own. If a
          # future edit to the copy step above ever reaches content/, or the
          # corpus repo's package.json, or its workflows, the run dies here
          # instead of opening a PR that deletes articles. Fail-closed: an
          # unrecognised path is a stop, not a warning.
          bad=$(git diff --cached --name-only \
                | grep -vE '^(engine/|index\.ts$|articleSections\.ts$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::the engine mirror staged paths outside engine/ — refusing"
            echo "$bad" | sed 's/^/  offending: /'
            exit 1
          fi

          # The engine is a small, stable file set. Wholesale deletion means a
          # bad checkout upstream, not an intentional change, and a PR built
          # from it would read as a legitimate removal.
          deleted=$(git diff --cached --diff-filter=D --name-only | wc -l | tr -d ' ')
          echo "staged: $(git diff --cached --name-only | wc -l | tr -d ' ') path(s), $deleted deletion(s)"
          if [ "$deleted" -gt 3 ]; then
            echo "::error::mirror would delete $deleted engine file(s) — refusing, investigate upstream"
            git diff --cached --diff-filter=D --name-only | sed 's/^/  deleting: /'
            exit 1
          fi

          git diff --cached --stat | tail -20

      - name: Push the side branch and open the lockstep PR
        if: steps.stage.outputs.changed == 'true' && inputs.dry_run != true
        env:
          PAT: ${{ secrets.ARTICLES_REPO_PAT }}
          GH_TOKEN: ${{ secrets.ARTICLES_REPO_PAT }}
          # Read-only, and deliberately NOT the PAT: the commit range below is
          # read from THIS repo, and GITHUB_TOKEN already has `contents: read`
          # here. Reaching for the corpus PAT to read the site would widen its
          # blast radius for prose.
          SITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          WORK: ${{ steps.stage.outputs.work }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$WORK"

          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          git commit -q \
            -m "Lockstep engine/ with frontaliere-si-o-no@${SHA:0:8}" \
            -m "Automated engine-only mirror (frontaliere-si-o-no .github/workflows/mirror-articles-engine.yml). Carries packages/articles/engine plus index.ts and articleSections.ts, and nothing else — content/ is owned by this repo and is never touched. Merging republishes the data surface, because publish-api.yml watches engine/**."

          # Force, deliberately. TARGET_BRANCH is derived state owned solely by
          # this workflow and rebuilt from origin/main on every run, so there is
          # no history on it worth preserving and nothing else pushes to it.
          # --force-with-lease is the wrong tool here: it needs a remote-tracking
          # ref this fresh shallow clone does not have, and it would fail closed
          # on exactly the normal case (the branch moved because the previous
          # run put it there).
          git push --force origin "HEAD:${TARGET_BRANCH}"
          echo "pushed ${TARGET_BRANCH}"

          # ── Facts for the body, gathered before it is written ──────────────
          # What this PR actually changes in the corpus, read off the commit
          # that was just made rather than restated by hand.
          changed_paths=$(git show --name-only --format= HEAD | sed '/^$/d')
          n_changed=$(printf '%s\n' "$changed_paths" | sed '/^$/d' | wc -l | tr -d ' ')
          n_deleted=$(git show --name-status --format= HEAD | grep -c '^D' || true)

          # The site commits this PR is carrying. The boundary is not guessed:
          # every lockstep commit stamps `frontaliere-si-o-no@<sha8>` in its
          # subject, so the newest one already on this repo's engine/ history IS
          # the last thing that landed, and everything the site has done to the
          # mirrored paths since then is what this PR brings.
          #
          # Best-effort by design. This is PR prose, not a safety property: the
          # push has already happened by this point, so every call is guarded
          # and the whole thing degrades to the head commit alone rather than
          # failing a mirror that has done its real work.
          prev=$(gh api "repos/nanakokyobashi-rgb/frontaliere-articles/commits?path=engine&per_page=30" \
                   --jq '.[].commit.message' 2>/dev/null \
                 | grep -oiE 'frontaliere-si-o-no@[0-9a-f]{7,40}' | head -1 | cut -d@ -f2 || true)
          carried=''
          if [ -n "${prev:-}" ]; then
            carried=$(GH_TOKEN="$SITE_TOKEN" gh api \
                        "repos/${SITE_REPO}/commits?path=packages/articles/engine&sha=${SHA}&per_page=50" \
                        --jq '.[] | "\(.sha[0:8]) \(.commit.message | split("\n")[0])"' 2>/dev/null \
                      | awk -v p="$(printf '%s' "$prev" | cut -c1-8)" \
                            'index($0, p) == 1 { exit } n++ < 30 { print }' || true)
          fi
          if [ -z "${carried:-}" ]; then
            # fetch-depth is 1, so this is the one commit the checkout has — the
            # honest floor when the boundary cannot be read.
            carried=$(git -C "$GITHUB_WORKSPACE" log -1 --format='%h %s' 2>/dev/null || true)
          fi

          # ── The body ───────────────────────────────────────────────────────
          # `## Implementato` and `## Non implementato (ancora)` are not
          # decoration: nanako gates every PR body on them
          # (scripts/ci/pr-body-contract.mjs → scripts/lib/pr-body-sections-check.mjs,
          # the module this repo also ships). A body without them fails the
          # `contract` check, and a red check means the PR cannot auto-merge —
          # which means the engine keeps diverging, which is the exact failure
          # this workflow was created to end. Shipping a mirror that opens PRs
          # its own destination rejects is a mirror that does not deliver.
          #
          # Both headers must be LITERAL (`#{2,3}` + the exact wording, with
          # "(ancora)"), and each section needs real content — bare `- ` bullets
          # are rejected too. The first bullet under each is unconditional, so
          # the contract holds even when the lookups above return nothing.
          #
          # printf into a file, not a heredoc and not an inline --body.
          #
          # A heredoc cannot work here: its terminator must sit at column 0,
          # and column 0 ends this `run: |` block scalar, so the workflow
          # stops being parseable YAML. `<<-` does not rescue it either — it
          # strips leading TABS only, and YAML forbids tabs for indentation.
          # An inline --body has the same problem for its blank lines. Found
          # by running `bash -n` over every run block in this file rather
          # than by watching the step fail on the one run where drift exists.
          #
          # The markers below are load-bearing: tests/workflows/articles-engine-mirror.test.ts
          # slices exactly this region out and RUNS it under bash with stubbed
          # inputs, then feeds the output to the same checker nanako runs. Do
          # not remove them, and keep every input to the region a variable set
          # above it.
          # >>> pr-body >>>
          # awk, not `paste -sd', '`: paste reads its -d argument as a LIST of
          # delimiters to cycle through, so ', ' joins with a comma, then a
          # space, then a comma — a,b c,d. Reproduced on both BSD and GNU paste.
          #
          # And the cap lives inside awk rather than in a `head`: head closing
          # the pipe early SIGPIPEs its producer, which under `set -o pipefail`
          # is a non-zero pipeline and, under `set -e`, kills the step. Hit
          # exactly that — exit 141 — on a commit touching more paths than the
          # cap, while testing this block.
          paths_inline=$(printf '%s\n' "$changed_paths" \
                         | awk 'NF { n++; if (n <= 25) { printf "%s`%s`", sep, $0; sep = ", " } }
                                END { if (n > 25) printf ", and %d more", n - 25; print "" }')

          body=$(mktemp)
          printf '%s\n' \
            'Automated by `mirror-articles-engine.yml` in valerielinc-ops/frontaliere-si-o-no.' \
            '' \
            'The site owns `packages/articles/engine/`; this repo executes it. This PR' \
            'carries that folder down, and **only** that folder — `content/` belongs to' \
            'this repo and the mirror never touches it (asserted on the staged diff,' \
            'fail-closed).' \
            '' \
            "A PR rather than a direct push, so this repo's CI and the shell-contract" \
            'parity golden run before an engine change reaches the generator that' \
            'publishes articles. An open PR here means the two engines have diverged.' \
            '' \
            'Refs valerielinc-ops/frontaliere-si-o-no#4974' \
            '' \
            '## Implementato' \
            > "$body"
          printf -- '- Lockstep of `engine/` (plus `index.ts` and `articleSections.ts`) with valerielinc-ops/frontaliere-si-o-no@%s — %s path(s) updated in this repo, %s removed.\n' \
            "${SHA:0:8}" "$n_changed" "$n_deleted" >> "$body"
          if [ -n "${carried:-}" ]; then
            printf '%s\n' '- Site commits this PR carries down, newest first (paths `packages/articles/engine/`, `index.ts`, `articleSections.ts`):' >> "$body"
            printf '%s\n' "$carried" \
              | awk 'NF { s = $1; $1 = ""; sub(/^ /, ""); printf "  - `%s` — %s\n", s, $0 }' >> "$body"
          fi
          if [ -n "${paths_inline:-}" ]; then
            printf -- '- Paths updated here: %s\n' "$paths_inline" >> "$body"
          fi
          printf '%s\n' \
            '' \
            '## Non implementato (ancora)' \
            '- by construction: no live page is regenerated by this PR. Until it merges, this repo keeps rendering articles from the engine on `main`; merging triggers `publish-api.yml` (it watches `engine/**`), which rebuilds `dist/api/` and the CDN surface. Pages already published take the change at their next regeneration, not here.' \
            '- blocked: the boundary between the two repos. The `host/` half of `SiteShellContract` cannot travel with this PR — the fail-closed allowlist on the staged diff refuses every path outside `engine/`, `index.ts` and `articleSections.ts`, and `host/` lives in the site repo. If the diff above touches `engine/siteShell.ts`, its `host/` counterpart has to be shipped by hand in the same round from the site repo, or the engine raises `TypeError: <member> is not a function` at render time behind a green CI — `tests/packages-articles-confinement.test.ts` proves imports, and the contract has no import shape for it to see.' \
            '- by construction: `content/` is beyond the reach of this mirror — the same fail-closed allowlist refuses it. Corpus changes travel the other way, pulled back by `scripts/pull-articles-corpus.mjs`.' \
            >> "$body"
          # <<< pr-body <<<

          # One PR at a time. If one is already open this push updated it in
          # place, which is the desired behaviour: the open PR IS the drift
          # alarm, and a second one would split the signal. Its body is refreshed
          # rather than left alone: the branch is derived state rebuilt from
          # nanako's main on every run, so a body describing the previous run
          # describes a diff that no longer exists — and a stale body is how a
          # PR opened before this fix would keep failing `contract` forever.
          open=$(gh pr list --repo nanakokyobashi-rgb/frontaliere-articles \
                   --head "${TARGET_BRANCH}" --state open --json number \
                   --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "existing PR #$open updated in place"
            gh pr edit "$open" --repo nanakokyobashi-rgb/frontaliere-articles \
              --body-file "$body" \
              || echo "::warning::could not refresh the body of PR #$open — check it against the contract by hand"
          else
            gh pr create --repo nanakokyobashi-rgb/frontaliere-articles \
              --head "${TARGET_BRANCH}" --base main \
              --title "🔗 Lockstep engine/ with the site" \
              --body-file "$body"
          fi

      - name: Job summary
        if: always()
        env:
          CHANGED: ${{ steps.stage.outputs.changed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Articles engine mirror"
            echo
            if [ "${CHANGED:-}" = "true" ]; then
              if [ "${DRY_RUN:-}" = "true" ]; then
                echo "Engine drift detected — dry run, nothing pushed."
              else
                echo "Engine drift detected — pushed \`${TARGET_BRANCH}\` and opened/updated the lockstep PR."
              fi
            else
              echo "Engine in sync with the corpus repo. Nothing to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
