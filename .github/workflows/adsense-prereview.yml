name: AdSense Pre-Review Checklist

on:
  schedule:
    # Daily at 06:20 UTC
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Pages to audit, spread across every page family (default 400)'
        required: false
        default: '400'
        type: string
      strict:
        description: 'Fail workflow on blocking findings'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      base:
        description: 'Origin to audit (default production)'
        required: false
        default: 'https://frontaliereticino.ch'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  adsense-prereview:
    runs-on: ubuntu-latest
    # issue #4943: this job used to run the FULL 4-locale SSG build (free 25 GB
    # of disk, npm ci, assemble the jobs dataset, seo-build-data-prep, then
    # build-dist-multi-locale-merged) purely so the audit could read <=140 HTML
    # files out of dist/. That build is OOM-killed by the HOST — `Killed`, then
    # "The runner has received a shutdown signal", step reported as cancelled —
    # ~80 min in, on the FIRST locale, at RSS ~11.7 GB on a 16 GB runner. It had
    # not produced a report since 2026-07-07. Building each locale separately
    # (#4586) did not shed the memory; that composite action's own documented
    # revert trigger ("if a scheduled run still OOMs at/above ~11.7 GB, pursue
    # reducing the SEO page surface instead of retrying this knob") had fired.
    #
    # The audit now reads the LIVE SITE over HTTP instead. That is not a
    # workaround, it is the more faithful check: AdSense reviews the deployed
    # site, so this sees what its crawler sees — Worker routing, redirects and
    # real 404s included — none of which dist/ can show. No build, no npm ci
    # (the audit imports only Node builtins and two dependency-free local
    # modules), no disk pressure, no 20k-line Vite asset table truncating the
    # log. Runs in minutes.
    #
    # The composite action `build-dist-multi-locale-merged` was deleted with
    # #5169. When this comment was written it was kept because
    # cathedral-seo-gates-check.yml "genuinely needs a built dist" — true, but it
    # does not need to build that dist ITSELF: it now replays the one deploy.yml
    # already shipped. With both callers gone the action had no remaining use,
    # and leaving a build that the kernel OOM-killer took 9 times out of 10
    # lying around is an invitation to wire it back up.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run AdSense pre-review audit
        id: audit
        env:
          # Dispatch inputs reach the shell as DATA, never as script text
          # (${{ … }} is substituted before the shell parses the line).
          INPUT_SAMPLE: ${{ inputs.sample || '400' }}
          INPUT_STRICT: ${{ inputs.strict || 'true' }}
          INPUT_BASE: ${{ inputs.base || 'https://frontaliereticino.ch' }}
        run: |
          args=(--source live --base "$INPUT_BASE" --sample "$INPUT_SAMPLE" --save)
          if [ "$INPUT_STRICT" = "true" ]; then
            args+=(--strict)
          fi
          echo "Running Adsenses pre-review audit with ${#args[@]} arguments"
          set +e
          node scripts/adsense-prereview-audit.mjs "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Exit codes are contractual (see the audit script docblock):
          #   0 clean · 1 audit COULD NOT RUN (infra) · 2 blocking POLICY findings.
          # Both non-zero codes fail the job — a finding is never swallowed — but
          # only code 1 is a broken workflow worth filing a bug for. Code 2 means
          # the checklist did its job and the site has a policy problem to fix;
          # filing a daily "Workflow Failure" bug for that would be noise and
          # would bury the real signal.
          case "$code" in
            0)
              echo "✅ No blocking AdSense findings."
              ;;
            2)
              echo "::error title=AdSense policy findings::The checklist ran and found BLOCKING policy findings. See the job summary and the uploaded report — this is a site content/config problem, not a broken workflow."
              exit 2
              ;;
            *)
              echo "::error title=AdSense checklist could not run::The audit failed to execute (exit $code) — the site or its sitemaps were unreachable."
              exit "$code"
              ;;
          esac

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adsense-prereview-${{ github.run_number }}
          path: |
            reports/adsense-prereview-*.json
            reports/adsense-prereview-*.md
          retention-days: 90
          if-no-files-found: warn

      # Symmetric to both failure reporters below: when the checklist runs clean
      # again, close the canonical issue instead of leaving it open forever.
      # `CI Failure: <workflow>` is the title used by the central scanner and
      # the policy reporter; the legacy `Workflow Failure` title is resolved as
      # well so old threads do not survive a recovery.
      - name: Resolve the failure issue on a clean run
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --resolve
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --resolve

      # An audit that COULD NOT RUN is a workflow failure. It uses the same
      # canonical title as the central scanner so a race cannot create a
      # second thread.
      - name: Report audit execution failure to GitHub Issues
        if: failure() && steps.audit.outputs.code != '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

      # Exit code 2 is deliberately still a red gate: the checklist completed
      # and found a blocking AdSense policy defect. Report that expected red to
      # the SAME canonical issue, with the distinction explicit in the body,
      # instead of letting the scanner rediscover it as an unreported workflow
      # failure. This does not suppress Auto Ads or downgrade any finding.
      - name: Report blocking AdSense policy finding to GitHub Issues
        if: failure() && steps.audit.outputs.code == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: ${{ github.workflow }}" \
            --description "## AdSense policy finding
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}

          The audit completed successfully as a checklist and returned exit code 2 because it found blocking policy findings. This is an expected red gate for site content/configuration, not an audit execution failure. The uploaded JSON/Markdown report is authoritative; the AdSense and SEO gates remain enforced." \
            --priority 2 \
            --label automation \
            --label ci-failure \
            --workflow "${{ github.workflow }}"
