name: AdSense Pre-Review Checklist

on:
  schedule:
    # Daily at 06:20 UTC
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Sample pages to audit (default 140)'
        required: false
        default: '140'
        type: string
      strict:
        description: 'Fail workflow on blocking findings'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  adsense-prereview:
    runs-on: ubuntu-latest
    # Full SSG build (~43 min) + npm ci + dataset assemble + 140-page audit.
    # The old 45 min ceiling cancelled the build mid-SSG once it stopped failing
    # fast at config-load (see Build step note). 90 min leaves comfortable slack.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble jobs dataset from per-crawler slices
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Build
        # Use build:ci (12 GB heap, fits the 16 GB runner) — the same full-SSG
        # build the deploy pipeline runs. build:prod's 18 GB heap exceeds the
        # runner's physical RAM and was OOM-prone; it only ever "passed" here by
        # crashing earlier at config-load. Full SSG (no FAST_BUILD skips) so the
        # AdSense audit still inspects every production page type.
        run: npm run build:ci

      - name: Run AdSense pre-review audit
        run: |
          SAMPLE="${{ inputs.sample || '140' }}"
          STRICT="${{ inputs.strict || 'true' }}"
          FLAGS="--sample $SAMPLE --save"
          if [ "$STRICT" = "true" ]; then
            FLAGS="$FLAGS --strict"
          fi
          echo "Running: node scripts/adsense-prereview-audit.mjs $FLAGS"
          node scripts/adsense-prereview-audit.mjs $FLAGS

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adsense-prereview-${{ github.run_number }}
          path: |
            reports/adsense-prereview-*.json
            reports/adsense-prereview-*.md
          retention-days: 90

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
