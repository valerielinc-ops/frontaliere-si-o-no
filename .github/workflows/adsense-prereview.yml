name: AdSense Pre-Review Checklist

on:
  schedule:
    # Daily at 06:20 UTC
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Sample pages to audit (default 140)'
        required: false
        default: '140'
        type: string
      strict:
        description: 'Fail workflow on blocking findings'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  adsense-prereview:
    runs-on: ubuntu-latest
    # The audit needs the COMPLETE dist (homepage + blog + every landing type),
    # so it runs the monolith full SSG build — the same one deploy.yml's monolith
    # path runs, measured at ~143 min (deploy run 27822078795). The earlier 45→90
    # min ceilings cancelled the build mid-SSG (run 27935218721 cancelled at 87 min,
    # build still in_progress, no error); the sibling cathedral-seo-gates-check.yml
    # hits the same wall at 90 min. 180 min clears ~143 min with growth headroom.
    # (Auditing the deployed github-pages artifact instead was rejected: the
    # matrix deploy's artifact is per-locale/partial — missing homepage + blog —
    # so it produces all-FAIL false negatives. See ## Non implementato in the PR.)
    timeout-minutes: 180

    steps:
      # Free ~25-30 GB before the full SSG build emits dist/ (33k+ pages × 4
      # locales). ubuntu-latest ships ~14 GB free on / — the monolith build
      # fills it mid-Vite-emit and dies with "No space left on device", and the
      # worker dies before logs flush so the Build step log vanishes from the
      # archive (scheduled run 27952579135). deploy.yml's build job already does
      # this; mirror it here. Deletes only toolchains this repo never uses.
      - name: Free disk space (remove unused toolchains)
        shell: bash
        run: |
          echo "::group::Disk usage BEFORE cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          wait
          echo "::group::Disk usage AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble jobs dataset from per-crawler slices
        run: node scripts/assemble-jobs-dataset.mjs --stats

      # ── Pre-build data prep — MUST mirror deploy.yml's build job ──────────
      # The audit reads `dist/`, so this workflow must emit the SAME dist
      # deploy.yml ships. deploy dedups + migrates + cleans the dataset BEFORE
      # build:ci; building the RAW assembled set (~12.1k jobs × 4 locales)
      # OOMs the 16 GB runner (exit 134) before the audit runs (issue #2121).
      # The shared composite action keeps this in lockstep with deploy.yml and
      # cathedral-seo-gates-check.yml (the read-only sibling that audits the
      # same dist). None of its steps require secrets.
      - name: SEO build data-prep (shared with deploy.yml)
        uses: ./.github/actions/seo-build-data-prep

      # issue #4586: this used to be a single monolithic `npm run build:ci`
      # building all 4 locales in ONE Node process — heapUsed grew
      # monotonically across SSG phases (3.6GB → 11.7GB, run 29732063285)
      # and OOM-crashed (FatalProcessOutOfMemory, exit 134) before reaching
      # the audit step. Root-caused as live retention (forced GC at each
      # phase checkpoint reclaimed only ~13MB of ~11.7GB — not a leak, not a
      # missing heap flag) from the "company hub v2" SEO surface growth
      # (#4306/#4323, ~22k pages across it/en/de/fr). Structural fix: build
      # each locale SEPARATELY (same BUILD_LOCALE mechanism deploy.yml's
      # build-locale matrix already uses in production) and merge the 4
      # outputs into one dist/ tree — same code path, ~1/4 peak heap per
      # process, zero change to build-plugins/**. See the composite action
      # for the full diagnosis + revert trigger (unvalidated pre-merge —
      # cannot exercise a 180min workflow locally).
      - name: Build dist (per-locale, memory-bounded merge)
        uses: ./.github/actions/build-dist-multi-locale-merged

      - name: Run AdSense pre-review audit
        env:
          # Dispatch inputs reach the shell as DATA, never as script text
          # (${{ … }} is substituted before the shell parses the line).
          INPUT_SAMPLE: ${{ inputs.sample || '140' }}
          INPUT_STRICT: ${{ inputs.strict || 'true' }}
        run: |
          SAMPLE="$INPUT_SAMPLE"
          STRICT="$INPUT_STRICT"
          FLAGS="--sample $SAMPLE --save"
          if [ "$STRICT" = "true" ]; then
            FLAGS="$FLAGS --strict"
          fi
          echo "Running: node scripts/adsense-prereview-audit.mjs $FLAGS"
          node scripts/adsense-prereview-audit.mjs $FLAGS

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adsense-prereview-${{ github.run_number }}
          path: |
            reports/adsense-prereview-*.json
            reports/adsense-prereview-*.md
          retention-days: 90

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
