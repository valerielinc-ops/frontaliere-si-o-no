          if [ ! -s "$status_file" ] && [ ! -s "$pid_file" ]; then
            echo "::error::city-pop: launch step succeeded but published neither status nor PID; refusing to wait for the group budget"
            exit 1
          fi
          deadline=$((SECONDS + 340 * 60))
          while [ ! -s "$status_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::city-pop: detached crawler did not publish a status before the 340 minute group budget"
              exit 1
            fi
            if [ -s "$pid_file" ]; then
              pid="$(cat "$pid_file" 2>/dev/null || true)"
              if ! [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::city-pop: invalid detached crawler PID: $pid"
                exit 1
              fi
              if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null; then
                sleep 1
                if [ ! -s "$status_file" ]; then
                  echo "::error::city-pop: detached crawler exited without publishing its status"
                  exit 1
                fi
              fi
            fi
            sleep 2
          done
          if [ -f "$log_file" ]; then
            cat "$log_file"
          else
            echo "::error::city-pop: crawler log is missing"
            exit 1
          fi
          status="$(cat "$status_file" 2>/dev/null || true)"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "::error::city-pop: invalid crawler status: $status"
            exit 1
          fi
          exit "$status"
