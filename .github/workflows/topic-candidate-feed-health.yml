name: Candidate feed health and recovery

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.loop_clock != '' && format('Candidate feed health [loop-clock {0}]', inputs.loop_clock) || 'Candidate feed health' }}

on:
  schedule:
    # A native Actions clock keeps the existing feed health/recovery path live
    # if the external loop-clock dispatcher is temporarily unavailable. Space
    # the fallback away from its :35 UTC slots; health runs are idempotent.
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      loop_clock:
        description: 'Cloud Scheduler marker from the shared loop clock'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: topic-candidate-feed-health
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate the published feed and local source freshness
        id: feed
        run: node scripts/ci/candidate-feed-health.mjs

      - name: Re-mine stale or missing candidate source
        if: steps.feed.outputs.recovery_target == 'mine'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 2
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Bound the branch-filtered listing: GitHub can serve stale or
            // transient 5xx responses when an Actions history grows large.
            const created = new Date(Date.now() - 35 * 86_400_000).toISOString().slice(0, 10);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'topic-candidates-mining.yml',
              branch: 'main',
              created: `>=${created}`,
              per_page: 100,
            });
            const active = data.workflow_runs.some((run) =>
              ['queued', 'pending', 'in_progress', 'waiting', 'requested'].includes(run.status));
            if (active) {
              core.notice('Candidate mining is already queued or running; recovery is deferred to the next health check.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'topic-candidates-mining.yml',
              ref: 'main',
            });
            core.notice('Dispatched the existing topic miner for stale source data.');

      - name: Rebuild and republish a stale or missing CDN projection
        if: steps.feed.outputs.recovery_target == 'deploy'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 2
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // The recovery check only needs live candidates; keep the
            // branch-filtered listing bounded and retry transient 5xx errors.
            const created = new Date(Date.now() - 35 * 86_400_000).toISOString().slice(0, 10);
            const [build, publish] = await Promise.all([
              github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy.yml',
                branch: 'main',
                created: `>=${created}`,
                per_page: 100,
              }),
              github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'deploy-publish.yml',
                branch: 'main',
                created: `>=${created}`,
                per_page: 100,
              }),
            ]);
            const activeBuild = build.data.workflow_runs.some((run) =>
              ['queued', 'pending', 'in_progress', 'waiting', 'requested'].includes(run.status));
            const activePublish = publish.data.workflow_runs.some((run) =>
              ['queued', 'pending', 'in_progress', 'waiting', 'requested'].includes(run.status));
            if (activeBuild || activePublish) {
              core.notice('A Pages build or publish is already queued or running; recovery is deferred to the next health check.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            core.notice('Dispatched the existing Pages build and publish pipeline.');
