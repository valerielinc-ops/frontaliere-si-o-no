name: Loop L1 reliability

on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/error-triage-baseline.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l1-reliability.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l1-reliability.yml'
  pull_request:
    paths:
      - 'data/error-triage-baseline.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l1-reliability.mjs'
      - 'scripts/ci/export-loop-outcomes.mjs'
      - 'scripts/lib/ga4-service-account.mjs'
      - 'scripts/lib/analytics-settled-window.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/posthog-client.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/loop-fleet-outcome.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l1-reliability.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when telemetry is unusable'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l1-reliability
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reliability inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/error-triage-baseline.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l1-reliability.mjs
            /scripts/ci/export-loop-outcomes.mjs
            /scripts/lib/ga4-service-account.mjs
            /scripts/lib/analytics-settled-window.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/loop-fleet-outcome.mjs
            /scripts/lib/github-issue-creator.mjs
            /scripts/lib/posthog-client.mjs
            /.github/workflows/loop-l1-reliability.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start loop operational telemetry
        run: |
          {
            echo "LOOP_FLEET_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo 'LOOP_FLEET_QUOTA_UNITS=0'
            echo 'LOOP_FLEET_COLLISIONS=0'
            echo 'LOOP_FLEET_GATE_BYPASS=false'
          } >> "$GITHUB_ENV"
      - name: Prepare read-only Firebase credentials
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set; recording an explicitly unavailable telemetry outcome"
            echo 'LOOP_FLEET_L1_EXPORT_UNAVAILABLE=1' >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Export fresh L1 telemetry
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          output_path="$RUNNER_TEMP/error-triage-baseline.json"
          if [ "${LOOP_FLEET_L1_EXPORT_UNAVAILABLE:-0}" = '1' ]; then
            node scripts/ci/export-loop-outcomes.mjs --loop L1 --unavailable --out "$output_path" --reason 'Firebase read-only credentials unavailable'
            exit 0
          fi
          set +e
          node scripts/ci/export-loop-outcomes.mjs --loop L1 --input data/error-triage-baseline.json --out "$output_path"
          export_code=$?
          set -e
          if [ "$export_code" -ne 0 ]; then
            echo '::warning::L1 live telemetry export failed; recording an explicitly unavailable outcome'
            node scripts/ci/export-loop-outcomes.mjs --loop L1 --unavailable --out "$output_path" --reason 'live PostHog telemetry export failed'
          fi
      - name: Audit reliability telemetry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l1
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          telemetry_path=data/error-triage-baseline.json
          if [ "${{ github.event_name }}" != "pull_request" ]; then telemetry_path="$RUNNER_TEMP/error-triage-baseline.json"; fi
          args=(--json --apply --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json --telemetry "$telemetry_path")
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l1-reliability.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l1-result.json" >/dev/null 2>&1; then
            echo 'L1 finding persisted as a deduplicated issue; the source remains blocked for downstream decisions.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Record canonical L1 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l1
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L1 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L1 observation and decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l1-reliability-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l1/
          retention-days: 90
          if-no-files-found: error
