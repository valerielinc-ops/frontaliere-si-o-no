name: Batch FAQ Generation

on:
      # ── CUTOVER (issue #4974 item 3, §5.7) ──────────────────────────────
      # Disabled here because this producer now runs in
      # nanakokyobashi-rgb/frontaliere-articles, which owns the corpus. Leaving
      # both enabled would give the same files two writers and the last push
      # would win — the exact failure the migration exists to remove.
      #
      # workflow_dispatch is deliberately KEPT so this can still be run by hand
      # during the observation window if the nanako side needs to be compared
      # against it. Re-enabling means deleting these comment markers; it is not
      # a code change, which is what makes the rollback cheap.
  # schedule:  # DISABLED AT CUTOVER — see above
  # - cron: '30 0 * * *'  # Daily at 00:30 UTC (after Gemini quota reset)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of articles to process per run'
        required: false
        default: '200'
        type: string
      concurrency:
        description: 'Parallel articles (AI calls)'
        required: false
        default: '1'
        type: string
      skip_translate:
        description: 'Skip EN/DE/FR translation (Italian FAQ only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: batch-faq-articles
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  generate-faq:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Checkout 547-783s su 10 run, ma il cap e' 360min: il massimo e' il 4%
        # del budget. Nessun rischio timeout → NIENTE blob:none, solo il tetto.
        timeout-minutes: 25

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load RC secrets
        run: node scripts/load-rc-env.mjs

      # ── OmniRoute (ON by default, RC kill-switch ENABLE_OMNIROUTE_FALLBACK='0')
      # Self-hosted local AI gateway, offered in ai-models.mjs's DEFAULT_CHAIN
      # as AI_MODELS.OMNIROUTE_AUTO. See
      # .github/actions/setup-omniroute/action.yml for the full rationale.
      - uses: ./.github/actions/setup-omniroute

      # ── Claude CLI Haiku fallback (ON by default, kill-switch '0') ──────
      # Tier-0 in ai-models.mjs's DEFAULT_CHAIN by default since 2026-07-29
      # (AI_COMPETING_TIERS) — competes on real score instead of being
      # reached only after every free-tier model has failed. See
      # .github/actions/setup-claude-haiku-fallback/action.yml for the full
      # rationale + incident history.
      - uses: ./.github/actions/setup-claude-haiku-fallback

      # App installation token = primary push identity so the data commit on main
      # re-triggers deploy (GITHUB_TOKEN would not, anti-recursion). Falls back to
      # env.GITHUB_PAT. B2b tail migration.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Verify GH_MODELS_PAT is set
        run: |
          if [ -z "$GH_MODELS_PAT" ]; then
            echo "❌ GH_MODELS_PAT not loaded from Remote Config. Cannot call AI models."
            exit 1
          fi
          echo "✅ GH_MODELS_PAT loaded from Firebase Remote Config"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run batch FAQ generation
        id: faq
        env:
          # Auth for the opt-in Claude CLI Haiku fallback (tier-0 by default
          # since 2026-07-29 — see AI_COMPETING_TIERS in ai-models.mjs; see
          # "Setup Claude CLI Haiku fallback" step above). Harmless to always
          # pass: ai-models.mjs only offers the model when this AND the RC
          # flag are both set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_LIMIT: ${{ inputs.limit || '200' }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency || '1' }}
          INPUT_SKIP_TRANSLATE: ${{ inputs.skip_translate }}
        run: |
          ARGS=(--limit "$INPUT_LIMIT" --concurrency "$INPUT_CONCURRENCY")
          if [ "$INPUT_SKIP_TRANSLATE" = "true" ]; then
            ARGS+=(--skip-translate)
          fi

          echo "🚀 Running: node scripts/batch-add-faq-to-articles.mjs ${ARGS[*]}"
          node scripts/batch-add-faq-to-articles.mjs "${ARGS[@]}"

      - name: Fix FAQ locales (translate missing/wrong-locale FAQs)
        id: fix-locales
        run: |
          echo "🔍 Checking FAQ locale issues..."
          node scripts/fix-faq-locales.mjs --limit 500

      - name: Count modified files
        id: count
        run: |
          # Resolve through the symlink first: `git diff` on the historical path
          # reports nothing for edits written through it, so this gate would read
          # 0 on every run and the commit step below would never fire.
          BODY_PATH=$(node scripts/lib/git-add-resolved.mjs --print-only 'services/locales/blog-body/')
          MODIFIED=$(git diff --name-only -- "$BODY_PATH" | wc -l | tr -d ' ')
          echo "modified_count=$MODIFIED" >> "$GITHUB_OUTPUT"
          echo "📊 Modified blog body files: $MODIFIED"

      - name: Commit and push changes
        if: steps.count.outputs.modified_count != '0'
        run: |
          # git-add-resolved: services/locales/blog-body is a symlink into
          # packages/articles/content. `git add` on the symlink itself exits 0
          # having staged nothing — the symlink's blob is unchanged, and the
          # edited files live at the real path — so every refreshed FAQ body
          # would be dropped from the commit without any error.
          node scripts/lib/git-add-resolved.mjs services/locales/blog-body/
          git add -f data/batch-faq-progress.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          MODIFIED=${{ steps.count.outputs.modified_count }}
          git commit -m "❓ Auto-generated FAQ for ${MODIFIED} blog articles"

          # L'unset NON e' ridondante: `actions/checkout` (senza
          # `persist-credentials: false`) lascia
          #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
          # che ha la PRECEDENZA sullo `x-access-token:` qui sotto. Senza
          # toglierlo il push si autentica come GITHUB_TOKEN e il commit su main
          # NON ri-triggera il deploy — che e' l'unica ragione per cui questo
          # step conia il token della App (vedi il commento piu' sopra). Il
          # fallimento e' silenzioso: il push riesce, e manca solo il deploy.
          # Stessa causa e stesso rimedio in issue-fix.yml, pr-redflag-fixer.yml
          # e prospector-loop.yml.
          git config --unset-all "http.https://github.com/.extraheader" || true

          # Push with retry (handles concurrent pushes from other workflows)
          REMOTE_URL="https://x-access-token:${APP_TOKEN:-$GITHUB_PAT}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git push "$REMOTE_URL" HEAD:main; then
              echo "✅ Changes committed and pushed to main"
              exit 0
            fi
            echo "⚠️  Push attempt $attempt failed — rebasing..."
            # Abort a conflicting rebase so the next attempt starts clean
            # instead of wedging on "unmerged files".
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            sleep 3
          done
          echo "❌ Push failed after 3 attempts"
          exit 1

      - name: Trigger deploy
        if: steps.count.outputs.modified_count != '0'
        # Hard-fail by design (no `|| true`, #6936): a failed dispatch here
        # fails the job, caught by "Report failure to GitHub Issues" below —
        # that GitHub issue IS this caller's recovery net (auto-triage picks
        # it up), so silencing the failure would just hide a real deploy gap.
        run: bash scripts/lib/trigger-deploy.sh

      - name: Summary
        if: always()
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_LIMIT: ${{ inputs.limit || '50' }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency || '3' }}
          INPUT_SKIP_TRANSLATE: ${{ inputs.skip_translate || 'false' }}
        run: |
          echo "### Batch FAQ Generation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Articles limit**: $INPUT_LIMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Concurrency**: $INPUT_CONCURRENCY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip translate**: $INPUT_SKIP_TRANSLATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Modified files**: ${{ steps.count.outputs.modified_count || '0' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
