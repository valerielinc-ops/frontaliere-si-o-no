name: Update Switzerland Unemployment Rate

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Questo job non aveva NESSUN cap: senza `timeout-minutes` GitHub applica il
    # default di 6 ORE, quindi un Checkout impantanato (qui il costo dominante:
    # 478-858s misurati su 10 run) poteva restare appeso a consumare minuti
    # Actions senza mai fallire. 30min stanno larghi sul job osservato (max 869s
    # in totale) e mettono un limite dove non ce n'era.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Blobless partial clone (stessa cura di guard-data-integrity #4120 /
          # crawler-health-monitor #4380 / issue-fix #4189). Misurato su questo
          # repo, `fetch-depth: 0` SENZA filtro costa 478-858s qui; i sei job che
          # hanno già `blob:none` stanno a 77-518s con mediana ~150s contro ~600s
          # dei nove senza. Nessuno dei due gruppi usa sparse-checkout, quindi il
          # confronto è pulito: il filtro è la variabile. Sicuro qui perché il job
          # legge solo il working tree di HEAD e committa — nessuna lettura di
          # blob storici (che sotto `blob:none` sarebbe un lazy-fetch per oggetto).
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto sullo step: senza, un fetch degenere si prende l'intero budget e
        # il job muore `cancelled` — stato invisibile agli `if: failure()`, il
        # buco che scan-job-timeouts.mjs tappa solo a posteriori. Con il tetto è
        # un `failure` diagnosticabile. 18min stanno sopra il max osservato
        # (858s) anche se il filtro non rendesse nulla.
        timeout-minutes: 18

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Update unemployment dataset
        run: node scripts/update-switzerland-unemployment-rate.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- public/data/switzerland-unemployment-rate.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes in unemployment dataset."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📊 Unemployment data updated"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/switzerland-unemployment-rate.json
          git commit -m "chore(data): sync Switzerland unemployment rate (SECO)"

          # Centralized rebase-retry helper survives concurrent pushes from
          # other data-refresh workflows. On rebase conflict, re-fetch the
          # SECO dataset on top of the new base.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/update-switzerland-unemployment-rate.mjs && git add public/data/switzerland-unemployment-rate.json"

          # GITHUB_TOKEN pushes don't trigger other workflows — trigger deploy manually
          bash scripts/lib/trigger-deploy.sh || true

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

