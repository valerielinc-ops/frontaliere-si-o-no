name: Seed text-html-ratio baseline

# One-shot helper workflow: regenerates data/text-html-ratio-baseline.json
# against the latest deployed dist/, REHYDRATED to the full multi-locale prod
# site (see "Full-dist rehydrate" below), and uploads the JSON as an artifact.
#
# Why this exists
# ---------------
# `audit-text-html-ratio` is a per-feature ratchet. When a new markup-heavy
# feature ships (Ticino events hub + per-comune pages, statistics/author
# pages), its low text-to-HTML-ratio pages land in the `spa-locale`/`spa-other`
# catch-all buckets and trip the ratchet even though the pages are legitimate.
# The companion classifier fix (this PR) routes events into their own `eventi`
# bucket; this workflow then recomputes the baseline against a real prod dist
# so every bucket (the new `eventi` one included) gets accurate counts.
#
# Full-dist rehydrate (fix for issue #3104, mirrors PR #3108's proven method)
# -----------------------------------------------------------------------
# The `github-pages` artifact downloaded below is the IT-only monolith: once
# LOCALE_SHARDS_LIVE is on, `en`/`de`/`fr` (and, once TICINO_SHARD_LIVE is on,
# the Ticino per-locale subtrees) are stripped from it and published to
# separate `frontaliere-<locale>` / `frontaliere-ticino-<locale>` shard repos
# instead. Scanning the artifact alone silently undercounts ~77% of the site
# (confirmed on run 28615785292: 10,879 files scanned vs the previously
# committed baseline's 48,315 — missing the entire `spa-locale` bucket, i.e.
# every en/de/fr page, plus `career-landings`). Committing a baseline seeded
# from that incomplete scan would silently drop ratchet protection for those
# locales — forbidden by AGENTS.md (never lower a validation gate to unblock
# something). PR #3108 hit the exact same problem for the `eventi` bucket and
# fixed it by sourcing the reseed from a full rehydrated dist instead of the
# bare `github-pages` artifact; the "Rehydrate locale/Ticino shards" steps
# below apply that same fix here by reusing the identical rehydrate logic
# `post-deploy-validate-dist.yml` runs for every deploy (same artifact names,
# same git-clone fallback) so this workflow always scans the COMPLETE logical
# site, not just the IT monolith.
#
# NOTE: the sibling one-shot seed workflows (`seed-title-baselines.yml`,
# `seed-bfs-depth-baseline.yml`, `seed-orphan-pages-baseline.yml`) and
# `measure-deploy-delta.yml` still download ONLY the `github-pages` artifact
# and have the same locale-completeness gap — out of scope for this fix
# (tracked separately, see issue #3104 item 2), flagged here so it isn't
# silently lost.
#
# Usage
# -----
# 1. Trigger via "Run workflow" (workflow_dispatch) ON THIS BRANCH so the run
#    uses the updated classifier (the `eventi` bucket only exists here).
# 2. Download the `text-html-ratio-baseline-${{ github.run_id }}` artifact.
# 3. Replace, commit, push:
#       cp /tmp/text-html-ratio-baseline.json data/
#       git add data/text-html-ratio-baseline.json
#       git commit -m "chore(seo-gate): reseed text-html-ratio baseline (eventi bucket)"
#       git push

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: 'deploy.yml run id whose github-pages dist to audit. Leave empty to use the latest successful deploy.'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    # Was 25 — the locale/Ticino shard rehydrate below can fall back to
    # sequential git clones (~14min/locale, ~12min combined for the 4 Ticino
    # legs per post-deploy-validate-dist.yml's own measured worst case) when
    # the same-run tar artifacts are missing, so give it the same headroom.
    timeout-minutes: 60
    # Same walker family as the audits in post-deploy-validate-dist.yml, which
    # runs audit-text-html-ratio inside `npm run audit:all` at 4096. Mirror that
    # here so a manual reseed on a complete dist can't die on the default heap
    # (issue #4857).
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      # Reclaim disk before rehydrating the full multi-locale dist (~27 GB
      # once all locale/Ticino shards are restored, per
      # post-deploy-validate-dist.yml's own "Free disk space on runner" step,
      # mirrored verbatim here for the same reason).
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Resolve deploy run id
        id: latest
        run: |
          run_id="$INPUT_DEPLOY_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list \
              --workflow=deploy.yml \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          echo "Using deploy run: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}

      - name: Fetch github-pages artifact
        id: pages
        uses: ./.github/actions/fetch-pages-artifact
        with:
          run-id: ${{ steps.latest.outputs.run_id }}
          output-dir: /tmp/pages
          github-token: ${{ github.token }}

      - name: Extract dist/
        run: |
          set -e
          mkdir -p dist
          tar -xf "${{ steps.pages.outputs.tar-path }}" -C dist
          echo "Restored $(find dist -type f | wc -l) files into dist/; HTML: $(find dist -name '*.html' | wc -l)"

      # Rehydrate stripped en/de/fr locale subtrees so dist/ is the COMPLETE
      # logical site before the audit runs — otherwise the baseline below
      # would silently drop ratchet coverage for 3 of 4 locales (issue
      # #3104). Body now shared via scripts/lib/rehydrate-locale-shards.sh
      # (extracted issue #4828, AGENTS.md #6 — this step, the other 3
      # seed-*-baseline.yml siblings, and post-deploy-validate-dist.yml's
      # 3 jobs all inlined this exact loop before the extraction).
      - name: Rehydrate locale shards into dist/ (when sharding active)
        if: ${{ vars.LOCALE_SHARDS_LIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.latest.outputs.run_id }}
          LOCALE_SHARDS_LIVE: ${{ vars.LOCALE_SHARDS_LIVE }}
        run: bash scripts/lib/rehydrate-locale-shards.sh

      # Mirrors the locale rehydrate above for the carved-out canton-section
      # shards (all 27 sections — 22 cantons + ticino/svizzera/zurigo + the 2
      # article hubs). Slug map + fast-path/clone-fallback pattern mirrored
      # from post-deploy-validate-dist.yml's rehydrate_section().
      - name: Rehydrate section shards into dist/ (when active)
        if: ${{ vars.TICINO_SHARD_LIVE == 'true' || vars.SVIZZERA_SHARD_LIVE == 'true' || vars.ZURIGO_SHARD_LIVE == 'true' || vars.ARGOVIA_SHARD_LIVE == 'true' || vars.APPENZELLO_SHARD_LIVE == 'true' || vars.BASILEA_SHARD_LIVE == 'true' || vars.BERNA_SHARD_LIVE == 'true' || vars.FRIBURGO_SHARD_LIVE == 'true' || vars.GINEVRA_SHARD_LIVE == 'true' || vars.GLARONA_SHARD_LIVE == 'true' || vars.GRIGIONI_SHARD_LIVE == 'true' || vars.GIURA_SHARD_LIVE == 'true' || vars.LUCERNA_SHARD_LIVE == 'true' || vars.NEUCHATEL_SHARD_LIVE == 'true' || vars.NIDVALDO_SHARD_LIVE == 'true' || vars.OBVALDO_SHARD_LIVE == 'true' || vars.SCIAFFUSA_SHARD_LIVE == 'true' || vars.SOLETTA_SHARD_LIVE == 'true' || vars.SVITTO_SHARD_LIVE == 'true' || vars.TURGOVIA_SHARD_LIVE == 'true' || vars.URI_SHARD_LIVE == 'true' || vars.VAUD_SHARD_LIVE == 'true' || vars.VALLESE_SHARD_LIVE == 'true' || vars.ZUGO_SHARD_LIVE == 'true' || vars.SANGALLO_SHARD_LIVE == 'true' || vars.ARTICOLIFRONTALIERE_SHARD_LIVE == 'true' || vars.ARTICOLISVIZZERA_SHARD_LIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.latest.outputs.run_id }}
          TICINO_SHARD_LIVE: ${{ vars.TICINO_SHARD_LIVE }}
          SVIZZERA_SHARD_LIVE: ${{ vars.SVIZZERA_SHARD_LIVE }}
          ZURIGO_SHARD_LIVE: ${{ vars.ZURIGO_SHARD_LIVE }}
          ARGOVIA_SHARD_LIVE: ${{ vars.ARGOVIA_SHARD_LIVE }}
          APPENZELLO_SHARD_LIVE: ${{ vars.APPENZELLO_SHARD_LIVE }}
          BASILEA_SHARD_LIVE: ${{ vars.BASILEA_SHARD_LIVE }}
          BERNA_SHARD_LIVE: ${{ vars.BERNA_SHARD_LIVE }}
          FRIBURGO_SHARD_LIVE: ${{ vars.FRIBURGO_SHARD_LIVE }}
          GINEVRA_SHARD_LIVE: ${{ vars.GINEVRA_SHARD_LIVE }}
          GLARONA_SHARD_LIVE: ${{ vars.GLARONA_SHARD_LIVE }}
          GRIGIONI_SHARD_LIVE: ${{ vars.GRIGIONI_SHARD_LIVE }}
          GIURA_SHARD_LIVE: ${{ vars.GIURA_SHARD_LIVE }}
          LUCERNA_SHARD_LIVE: ${{ vars.LUCERNA_SHARD_LIVE }}
          NEUCHATEL_SHARD_LIVE: ${{ vars.NEUCHATEL_SHARD_LIVE }}
          NIDVALDO_SHARD_LIVE: ${{ vars.NIDVALDO_SHARD_LIVE }}
          OBVALDO_SHARD_LIVE: ${{ vars.OBVALDO_SHARD_LIVE }}
          SCIAFFUSA_SHARD_LIVE: ${{ vars.SCIAFFUSA_SHARD_LIVE }}
          SOLETTA_SHARD_LIVE: ${{ vars.SOLETTA_SHARD_LIVE }}
          SVITTO_SHARD_LIVE: ${{ vars.SVITTO_SHARD_LIVE }}
          TURGOVIA_SHARD_LIVE: ${{ vars.TURGOVIA_SHARD_LIVE }}
          URI_SHARD_LIVE: ${{ vars.URI_SHARD_LIVE }}
          VAUD_SHARD_LIVE: ${{ vars.VAUD_SHARD_LIVE }}
          VALLESE_SHARD_LIVE: ${{ vars.VALLESE_SHARD_LIVE }}
          ZUGO_SHARD_LIVE: ${{ vars.ZUGO_SHARD_LIVE }}
          SANGALLO_SHARD_LIVE: ${{ vars.SANGALLO_SHARD_LIVE }}
          ARTICOLIFRONTALIERE_SHARD_LIVE: ${{ vars.ARTICOLIFRONTALIERE_SHARD_LIVE }}
          ARTICOLISVIZZERA_SHARD_LIVE: ${{ vars.ARTICOLISVIZZERA_SHARD_LIVE }}
        run: bash scripts/lib/rehydrate-section-shards.sh

      - name: Report full rehydrated dist/ size
        run: |
          echo "Full dist/ after rehydrate: $(find dist -type f | wc -l) files; HTML: $(find dist -name '*.html' | wc -l)"
          df -h / | tail -1

      # A baseline is worse than an audit to get wrong: the section rehydrate
      # above is soft-fail by contract, and pages missing from dist/ simply
      # drop out of the seeded rate — locking in a ratio the next comparison
      # then treats as the accepted norm. Refuse to seed from a partial dist
      # (issue #4857).
      - name: Assert dist/ is the complete logical site
        run: node scripts/ci/assert-dist-complete.mjs

      - name: Generate text-html-ratio baseline
        run: |
          node scripts/audit-text-html-ratio.mjs \
            --write-baseline=data/text-html-ratio-baseline.json
          echo ""
          echo "==== text-html-ratio baseline preview (byFeature) ===="
          node -e "const b=require('./data/text-html-ratio-baseline.json');console.log(JSON.stringify({mode:b.mode,threshold:b.threshold,scanned:b.scanned,totalOffenders:b.totalOffenders,byFeature:b.byFeature},null,2))"

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: text-html-ratio-baseline-${{ github.run_id }}
          path: data/text-html-ratio-baseline.json
          retention-days: 14
          if-no-files-found: error

      - name: Echo download instructions
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "Baseline generated. Next steps:"
          echo "  gh run download ${{ github.run_id }} \\"
          echo "    --name text-html-ratio-baseline-${{ github.run_id }} --dir /tmp/"
          echo "  cp /tmp/text-html-ratio-baseline.json data/"
          echo "  git add data/text-html-ratio-baseline.json"
          echo "  git commit -m 'chore(seo-gate): reseed text-html-ratio baseline (eventi bucket)'"
          echo "  git push"
          echo "════════════════════════════════════════════════════════════════"
