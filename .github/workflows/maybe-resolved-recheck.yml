name: maybe-resolved recheck

# Zero-Claude: una issue `maybe-resolved` smentita dai fatti (ricorrenza `🔁`
# di autore fidato o riapertura DOPO l'ultima applicazione della label) perde
# la label e torna nel ciclo; ogni `maybe-resolved` aperta riceve una classe e
# il proprietario della prova che le manca, nello step summary.
# Non chiude MAI una issue. Vedi scripts/ci/maybe-resolved-recheck.mjs.

on:
  schedule:
    # Ogni 6 ore: una ricorrenza esce da `maybe-resolved` entro un tick.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Stampa inventario e rigetti senza mutare'
        required: false
        type: boolean
        default: true

concurrency:
  group: maybe-resolved-recheck
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Recheck maybe-resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/ci/maybe-resolved-recheck.mjs $ARGS
