name: Revenue signal monitor

# Hourly ad-revenue alarm on GA4, Italy + Switzerland only.
#
# The daily canaries (rpm-canary.yml, user-value-canary.yml) judge settled
# DAYS. On 2026-09-27 the Offerwall gate suppressed the CMP from 12h Zurich and
# ad revenue fell ~75% for six hours with sessions normal: a day-level canary
# sees that the next morning. Consent decisions and filled ads reach GA4 within
# the hour, so this monitor catches that class in ~2 h and opens a backlog issue
# (the channel the loop reads, not the step summary).
#
# Signals, each a ratio compared with the median of the same hours on the same
# weekday 1-3 weeks earlier (scripts/lib/revenue-signals.mjs, backtested on
# 2026-09-07..28: it fires on 09-09 18-22h, 09-12 23h and 09-27, silent otherwise):
#   consent  CMP decisions per session       < 0.40 of baseline, 1 run
#   fill     ad_filled per page view         < 0.35 of baseline, 2 runs
#   revenue  AdSense revenue per 1,000 pages < 0.50 of baseline, 2 runs (settled hours only)
#   traffic  human page views                < 0.50 of baseline, 2 runs
#
# Why hourly is not the quota waste the daily canaries warn about: it reads
# two small GA4 reports (~22 days x 24 rows) and never re-reads AdSense.
#
# The issue lifecycle, both halves here:
#   - status=alarm     → open or comment the fixed-title issue (dedup on the
#                        first 60 chars; issue-triage routes it by the
#                        `revenue` label, no fixer label set by hand);
#   - status=recovered → 24 consecutive runs without alarm: resolve it;
#   - a run that cannot measure (credentials, API) fails and reports as
#     `Workflow Failure: Revenue signal monitor`, closed by
#     close-recovered-failure-issues on the next green run — never as a
#     revenue alarm.

on:
  schedule:
    # :41 — the previous hour's events have mostly landed in GA4 by then.
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      current_hour:
        description: 'Replay: hour to evaluate as YYYYMMDDHH (Europe/Zurich). Empty = now.'
        required: false
        default: ''
        type: string

concurrency:
  group: revenue-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor revenue signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The GA4 helper needs only google-auth-library (23 packages, 2.4-3.1 s
      # cold, measured 2026-09-28) where the sibling canaries' `npm ci` installs
      # 1,384 in 13-26 s with a warm cache (rpm-canary runs 36327878228,
      # 36461800327). Isolated prefix + symlink so the dynamic import in
      # scripts/lib/ga4-service-account.mjs resolves it.
      - name: Install GA4 auth client
        run: |
          npm install --prefix "$RUNNER_TEMP/ga4-deps" --no-save --ignore-scripts --no-fund --no-audit google-auth-library@11.1.0 >/dev/null
          ln -s "$RUNNER_TEMP/ga4-deps/node_modules" node_modules

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Evaluate revenue signals
        id: monitor
        env:
          CURRENT_HOUR: ${{ github.event.inputs.current_hour }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(--out=revenue-signals.json --body-out=revenue-signals-issue.md)
          if [ -n "${CURRENT_HOUR:-}" ]; then args+=("--current-hour=$CURRENT_HOUR"); fi
          node scripts/monitor-revenue-signals.mjs "${args[@]}"

      - name: Append summary to job log
        if: always()
        run: |
          if [ -s revenue-signals.json ]; then
            {
              echo "## Revenue signals"
              echo '```json'
              cat revenue-signals.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the revenue issue
        if: steps.monitor.outputs.status == 'alarm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/lib/github-issue-creator.mjs \
            --title "Revenue ads: segnali orari sotto la baseline IT+CH" \
            --description "$(cat revenue-signals-issue.md)" \
            --priority 1 \
            --label Bug \
            --label revenue \
            --label revenue-signal-monitor \
            --workflow "${{ github.workflow }}"

      # Closing half: only after 24 consecutive runs without an alarm, so the
      # backlog has a day to verify the cause (a fixer may close it earlier).
      - name: Resolve the revenue issue after recovery
        if: steps.monitor.outputs.status == 'recovered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Revenue ads: segnali orari sotto la baseline IT+CH" \
            --workflow "${{ github.workflow }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          Il monitor revenue non ha potuto misurare (credenziali GA4, API o report troncato): nessun allarme revenue è stato valutato in questa run.
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Riproduci:** \`node scripts/monitor-revenue-signals.mjs\` con \`GOOGLE_APPLICATION_CREDENTIALS\`, script in \`scripts/monitor-revenue-signals.mjs\` e \`scripts/lib/revenue-signals.mjs\`." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
