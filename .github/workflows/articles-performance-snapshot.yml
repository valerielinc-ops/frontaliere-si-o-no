name: Articles Performance Snapshot
# Public runs no longer fetch, store, or publish article-level analytics.
# The full refresh remains available for the private operator environment.
on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC (before topic-candidates @ 22:00 Sun and before generator)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-performance-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report private data boundary
        run: node scripts/fetch-article-performance.mjs --status-only
