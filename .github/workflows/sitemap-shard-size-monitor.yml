name: sitemap-shard-size-monitor

# Weekly check that no sitemap shard is approaching Google's 50,000 URL cap.
# Fetches https://frontaliereticino.ch/sitemap-index.xml, walks every shard,
# and opens a GitHub issue (severity-tagged) when any shard exceeds 40k urls.
#
# Runs Mondays 08:00 UTC, after the GSC monitor has refreshed weekly metrics.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sitemap-shard-size-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # No `npm ci` — the script uses only the Node stdlib + native fetch.

      - name: Run sitemap shard size check
        id: check
        continue-on-error: true
        run: node scripts/check-sitemap-shard-size.mjs

      - name: Determine severity
        id: severity
        if: steps.check.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ ! -f data/sitemap-shard-size-report.json ]; then
            echo "Check failed but no report emitted; skipping issue creation."
            echo "severity=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          criticals=$(jq -r '.criticals | length' data/sitemap-shard-size-report.json)
          warnings=$(jq -r '.warnings | length' data/sitemap-shard-size-report.json)
          if [ "$criticals" -gt 0 ]; then
            echo "severity=critical" >> "$GITHUB_OUTPUT"
          elif [ "$warnings" -gt 0 ]; then
            echo "severity=warning" >> "$GITHUB_OUTPUT"
          else
            echo "severity=none" >> "$GITHUB_OUTPUT"
          fi

      # Ensure the labels exist with their colour/description before the issue
      # step. `github-issue-creator.mjs` creates anything missing on its own, but
      # only with defaults — this keeps the severity labels distinguishable in
      # the backlog (#4598 kept the create call from crashing the job; the
      # helper's exit-0 contract now guarantees that structurally).
      - name: Ensure labels exist
        if: steps.check.outcome == 'failure' && steps.severity.outputs.severity != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "sitemap-shard-warning" --color "FBCA04" \
            --description "sitemap-shard-size-monitor: shard >=40k urls" --force 2>/dev/null || true
          gh label create "sitemap-shard-critical" --color "D93F0B" \
            --description "sitemap-shard-size-monitor: shard >=45k urls" --force 2>/dev/null || true

      - name: Open issue for oversized shards
        if: steps.check.outcome == 'failure' && steps.severity.outputs.severity != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SEVERITY: ${{ steps.severity.outputs.severity }}
        run: |
          set -euo pipefail
          report=data/sitemap-shard-size-report.json

          shardCount=$(jq -r '.shardCount' "$report")
          totalUrls=$(jq -r '.totalUrls' "$report")
          warnings=$(jq -r '.warnings | join(", ")' "$report")
          criticals=$(jq -r '.criticals | join(", ")' "$report")

          # Stable titles: the shard COUNT used to sit at ~char 31, inside the
          # 60-char window the dedup matches on, so a run that went from 2 to 3
          # oversized shards opened a second issue for the same condition. The
          # count moves into the body (and into the per-shard table below, which
          # is where triage actually reads it).
          if [ "$SEVERITY" = "critical" ]; then
            label="sitemap-shard-critical"
            title="[sitemap-shard-size] CRITICAL: shard(s) at or above 45k urls"
            priority=2
            flaggedCount=$(jq -r '.criticals | length' "$report")
          else
            label="sitemap-shard-warning"
            title="[sitemap-shard-size] WARNING: shard(s) at or above 40k urls"
            priority=3
            flaggedCount=$(jq -r '.warnings | length' "$report")
          fi

          # Build a markdown table of every flagged shard.
          flagged=$(jq -r '
            .shards
            | map(select(.warning or .critical))
            | sort_by(-.urlCount)
            | map("| `\(.filename)` | \(.urlCount) | \(if .critical then "CRITICAL" elif .warning then "warning" else "ok" end) |")
            | join("\n")
          ' "$report")

          body=$(cat <<EOF
          Weekly sitemap shard size monitor flagged **${flaggedCount}** **$SEVERITY** shard(s).

          - Total shards: ${shardCount}
          - Total urls across all shards: ${totalUrls}
          - Warning shards (≥40,000): ${warnings:-none}
          - Critical shards (≥45,000): ${criticals:-none}
          - Google hard cap: 50,000 urls per sitemap file

          | Shard | URL count | Severity |
          |---|---:|---|
          ${flagged}

          Workflow run: ${GITHUB_SERVER_URL:-https://github.com}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID:-}
          Source data: \`data/sitemap-shard-size-report.json\` (artifact below).
          Detection script: \`scripts/check-sitemap-shard-size.mjs\`

          Triage:
          1. Identify which build plugin emits the flagged shard (e.g. \`sitemap-jobs-*.xml\` → job-board pages).
          2. Reshard: split by city/canton/sector/locale or paginate the underlying source.
          3. Rebuild + redeploy and confirm the shard drops below 40k on the next monitor run.
          EOF
          )

          # `github-issue-creator.mjs` (ISSUES.md dedup a monte) replaces both the
          # raw create AND the hand-rolled title match above: it dedups on the
          # stable title and comments the recurrence on the canonical issue, so
          # a shard that stays oversized week after week reads as one thread
          # instead of N issues. It always exits 0, which also removes the
          # `set -euo pipefail` hazard the previous raw `gh` call carried (#4598).
          node scripts/lib/github-issue-creator.mjs \
            --title "$title" \
            --description "$body" \
            --priority "$priority" \
            --label "$label" \
            --workflow "${{ github.workflow }}"

      # Closer half (#5437 — both titles above had none). Both titles resolve
      # from THIS RUN'S REPORT CONTENT, not from the derived `severity` output.
      # `criticals`/`warnings` are independent per-shard arrays
      # (scripts/check-sitemap-shard-size.mjs ~140-145 — a shard lands in
      # exactly one of the two, mutually exclusive), so a single run can have
      # criticals.length > 0 (severity=='critical') AND warnings.length > 0 at
      # the same time, on different shards. Gating on the dominant severity
      # string — as this step used to — made that combination skip the step
      # ENTIRELY: the WARNING title was then neither refreshed nor resolved,
      # stuck open until a fully clean run that may never come while another
      # shard stays chronically critical (review finding on #5802). Reading
      # `.criticals`/`.warnings` straight from the report resolves each title
      # independently: a shard sliding back under its OWN threshold recovers
      # its title regardless of what any other shard is doing. The race this
      # step was written to avoid still holds: while `warnings` is non-empty
      # the open step above is actively refreshing that title in the same run,
      # so it is correctly left alone here.
      - name: Resolve shard-size issues no longer applicable
        if: steps.check.outcome == 'success' || steps.severity.outputs.severity != 'none'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          report=data/sitemap-shard-size-report.json
          title_critical="[sitemap-shard-size] CRITICAL: shard(s) at or above 45k urls"
          title_warning="[sitemap-shard-size] WARNING: shard(s) at or above 40k urls"

          criticals=0
          warnings=0
          if [ -f "$report" ]; then
            criticals=$(jq -r '.criticals | length' "$report")
            warnings=$(jq -r '.warnings | length' "$report")
          fi

          if [ "$criticals" -eq 0 ]; then
            node scripts/lib/github-issue-creator.mjs --resolve \
              --title "$title_critical" \
              --workflow "${{ github.workflow }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "$warnings" -eq 0 ]; then
            node scripts/lib/github-issue-creator.mjs --resolve \
              --title "$title_warning" \
              --workflow "${{ github.workflow }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sitemap-shard-size-report
          path: data/sitemap-shard-size-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job if any shard exceeded thresholds
        id: failgate
        if: steps.check.outcome == 'failure'
        run: |
          echo "Sitemap shard size check exited non-zero — see report + issue above."
          exit 1

      - name: Report unexpected failure to GitHub Issues
        # Fire on a muted failure: either the job failed BEFORE/OUTSIDE the
        # detection fail-gate (failgate skipped), OR the check exited non-zero
        # but emitted no report → severity=none → "Open issue" skipped yet
        # failgate still fired. Both leave ZERO condition issue → report it.
        if: failure() && (steps.failgate.conclusion != 'failure' || steps.severity.outputs.severity == 'none')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito (crash pre/fuori detection)
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}
          Nota: il monitor è fallito prima/fuori dallo step di detection — nessuna issue di condizione è stata aperta." \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
