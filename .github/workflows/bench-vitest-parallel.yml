name: bench-vitest-parallel
# BANCO TEMPORANEO, non va mergiato: misura se riparallelizzare la suite di
# `tests.yml` accorcia il verdetto ora che l'account è su GitHub Pro (40 job
# concorrenti invece di 20). Tutte le varianti girano sullo stesso commit e
# nella stessa finestra, così la deriva della CI condivisa si annulla per
# costruzione invece di doverla stimare.
#
# Selezioni reali prese dagli artifact `shard-timing-related` di tests.yml:
#   large  = 948 file (run 36668332924, vicina al p90 dei file selezionati)
#   medium = 203 file (run 36685278187)
# Stesso checkout, stesso setup, stesso assemble e stesse env dello step
# `vitest related (PR diff)`; cambiano solo --maxWorkers e --shard.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-vitest-parallel.yml'
      - '.github/bench/**'

permissions:
  contents: read

concurrency:
  group: bench-vitest-parallel-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  bench:
    name: bench ${{ matrix.sel }} w${{ matrix.workers }} shard ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sel: large, workers: 2, shard: 1, shards: 1 }
          - { sel: large, workers: 3, shard: 1, shards: 1 }
          - { sel: large, workers: 4, shard: 1, shards: 1 }
          - { sel: large, workers: 2, shard: 1, shards: 2 }
          - { sel: large, workers: 2, shard: 2, shards: 2 }
          - { sel: large, workers: 2, shard: 1, shards: 4 }
          - { sel: large, workers: 2, shard: 2, shards: 4 }
          - { sel: large, workers: 2, shard: 3, shards: 4 }
          - { sel: large, workers: 2, shard: 4, shards: 4 }
          - { sel: medium, workers: 2, shard: 1, shards: 1 }
          - { sel: medium, workers: 4, shard: 1, shards: 1 }
    env:
      NODE_COMPILE_CACHE: node_modules/.cache/node-compile
    steps:
      - run: git config --global checkout.workers 0

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /.github/
            /.githooks/
            /build-plugins/
            /components/
            /functions/
            /hooks/
            /infra/
            /scripts/
            /server/
            /services/
            /tests/
            /packages/*/engine/
            /packages/*/src/
            /packages/*/tests/
            /packages/articles/content/blog-articles-data.ts
            /packages/articles/content/swiss-articles-data.ts
            /packages/articles/content/blogArticleIds.ts
            /packages/articles/content/routerBlogData.ts
            /packages/articles/content/routerSwissData.ts
            /packages/articles/content/blogImageCdnMirror.ts
            /packages/articles/content/blog-meta-*.ts
            /packages/articles/content/seo/seo-blog*.ts
            /packages/articles/content/blog-body/*/assistente-ai-frontalieri.ts
            /packages/articles/content/blog-body/de/simulazione-fiscale-frontaliere-2026.ts
            /packages/articles/content/blog-body/en/simulazione-fiscale-frontaliere-2026.ts
            /packages/articles/content/blog-body/fr/simulazione-fiscale-frontaliere-2026.ts
            /packages/articles/content/blog-body/it/simulazione-fiscale-frontaliere-2026.ts
            /packages/articles/content/blog-body-ch/de/naturalizzazione-canton-san-gallo-procedura.ts
            /packages/articles/content/blog-body-ch/de/tassi-interesse-svizzera-bassi.ts
            /packages/articles/content/seo/seoMetadataType.ts
            /packages/articles/index.ts
            /packages/articles/articleSections.ts
            /data/
            !/data/translation-cache/
            !/data/orphan-enriched-data/
            !/data/jobs-snapshots-history/
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/evidence-index.json
            /data/blog-articles-data.ts
            /data/swiss-articles-data.ts
            /data/fuel-prices.json
            /public/
            !/public/images/
            /public/data/fuel-prices.json
            /public/images/brands/
            /public/images/authors/
            /*.cjs
            /*.js
            /*.json
            /*.md
            /*.mjs
            /*.ts
            /*.tsx
            /*.yaml
            /*.yml
            /*.config.*
            /docs/FIX-ISSUE-COMMAND.md
            /docs/preferred-sources-checklist.md
            /docs/ads-placement-longform.md
            /docs/editorial-longform-audit.md
            /index.html
            /index.css
            /firestore.rules
            /storage.rules
            /.gitignore
            /.npmrc
            /package-lock.json
            /package.json
            /tsconfig*.json
            /vitest.config.ts
            /REVIEW.md
            /AGENTS.md
          sparse-checkout-cone-mode: false

      - name: Setup Node.js + npm ci
        uses: ./.github/actions/ci-npm-setup

      - name: Restore Vitest/Vite transform cache (read-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.vite-independent
            node_modules/.vite-dependent
            node_modules/.cache/node-compile
            .cache/vitest-related
          key: vitest-transform-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', '.github/workflows/tests.yml') }}
          restore-keys: |
            vitest-transform-${{ runner.os }}-

      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --stats

      - name: Restore assemble-jobs output (read-only)
        if: ${{ steps.assemble_cache_key.outputs.key != '' }}
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-

      - name: Assemble + migrate
        run: |
          node scripts/assemble-jobs-dataset.mjs --stats
          node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: Runner shape
        run: |
          nproc
          free -m

      - name: vitest ${{ matrix.sel }} w${{ matrix.workers }} shard ${{ matrix.shard }}/${{ matrix.shards }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITEST_SKIP_LIVE_DATA: 'true'
          VITEST_SKIP_CORPUS_WIDE: 'true'
          VITEST_CACHE_DIR: node_modules/.vite-related
          SEL_FILE: .github/bench/vitest-sel-${{ matrix.sel }}.txt
          WORKERS: ${{ matrix.workers }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          SAMPLE_MEM_DURING_INTERVAL_S: '2'
        run: |
          set -uo pipefail
          mapfile -t files < "$SEL_FILE"
          echo "files=${#files[@]} workers=$WORKERS shard=$SHARD"
          start=$(date +%s)
          scripts/ci/sample-mem-during.sh -- node node_modules/vitest/vitest.mjs run --passWithNoTests \
            --maxWorkers="$WORKERS" --pool=forks --shard="$SHARD" \
            --reporter=default --reporter=json --outputFile=bench-report.json \
            "${files[@]}"
          status=$?
          end=$(date +%s)
          echo "[bench] sel=${{ matrix.sel }} workers=$WORKERS shard=$SHARD wall_s=$((end - start)) exit=$status"
          exit 0

      - name: Upload bench report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.sel }}-w${{ matrix.workers }}-s${{ matrix.shard }}of${{ matrix.shards }}
          path: bench-report.json
          if-no-files-found: warn
          retention-days: 5
