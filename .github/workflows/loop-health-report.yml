# Osservabilità deterministica del loop autonomo (ZERO-Claude).
#
# Il ciclo osserva→fixa→valida del loop (review/issue-fix/followup/rescuer)
# finora richiedeva un'analisi manuale multi-ora per misurare failure-rate,
# overhead review e zombie (fatta il 2026-06-12 → tuning #1919/#1926). Questo
# cron la automatizza: report settimanale con soglie ⚠️, postato come commento
# su una issue-tracker permanente — il lessons-harvester e l'owner hanno i
# numeri senza spendere un token Claude.
#
# Validazione tuning: dopo un cambio ai cap/gate (es. turn-cap bump #1919) il
# primo report dice se il failure-rate è sceso o se va revertato (revert-trigger
# dichiarati nei PR body).
name: Loop health report (zero-Claude)

on:
  schedule:
    # Daily 05:45 UTC (era weekly): una regressione del loop (failure-rate,
    # zombie) a cadenza settimanale brucerebbe quota per giorni prima della
    # detection. Il report è zero-Claude e costa ~1min di runner → daily è
    # gratis e chiude il ciclo misura→correggi entro 24h. Dopo il
    # lessons-harvester (05:17) così l'harvest è già visibile.
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Finestra di osservazione in giorni'
        required: false
        type: string
        default: '7'
      no_post:
        description: 'Solo stdout, niente commento sulla issue tracker'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  # gh run list legge le Actions API: read è implicito nel GITHUB_TOKEN.
  actions: read
  pull-requests: read

concurrency:
  group: loop-health-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Compute and post loop health report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_DAYS: ${{ github.event.inputs.days || '7' }}
          INPUT_NO_POST: ${{ github.event.inputs.no_post }}
        run: |
          set -euo pipefail
          ARGS=(--days "$INPUT_DAYS")
          if [ "$INPUT_NO_POST" = "true" ]; then
            ARGS+=(--no-post)
          fi
          node scripts/ci/loop-health-report.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
