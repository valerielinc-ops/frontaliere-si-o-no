name: Backfill Expired Jobs From History

# Recovers job content for "empty orphan" soft-landing pages.
#
# When a job disappears from a crawler's source (listing pulled, PDF removed) or
# its slug churns, it can drop out of the by-crawler slice WITHOUT being archived
# into data/jobs/expired/by-crawler/. Google keeps the old URL indexed, so the
# soft-landing page renders with only a slug-derived title and NO description —
# thin content with zero SEO value. `scripts/backfill-expired-from-history.mjs`
# walks git history, finds those dropped jobs by id, and re-archives the most
# recent version (full title/description/salary/slugByLocale) into the expired
# slice. The build plugin (jobsSeoPagesPlugin) then resolves the orphan slug to
# that recovered content via its slug-variant index — including the long tail
# beyond the 5000-entry expired-jobs.json cap, which it now reads from the
# uncapped per-crawler slices directly.
#
# Needs full git history (fetch-depth: 0) — the by-crawler slices are walked
# commit-by-commit. Runs monthly as a safety net; the crawler pipeline archives
# most drops in real time, so each run typically recovers only the few that
# slipped through since the last one.
on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of each month, 04:00 UTC
  workflow_dispatch:
    inputs:
      max_commits:
        description: 'Cap history depth per slice (0 = unbounded)'
        required: false
        type: string
        default: '0'
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: true
      crawler_keys:
        description: 'Optional comma/newline-separated crawler keys for a bounded batch.'
        required: false
        type: string
        default: ''
      history_since:
        description: 'Walk only commits newer than this git date (default 45 days ago; "all" = unbounded).'
        required: false
        type: string
        default: '45 days ago'

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  # The failure reporter below opens/comments the canonical issue. Without
  # this scope an explicit permissions block zeroes `issues`, and run
  # 35988019883 (2026-09-24) got `HTTP 403: Resource not accessible by
  # integration` on createIssue — silent, because the step is continue-on-error.
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The full assembly keeps the active dataset and the uncapped expired
    # slices in memory together. Node's default heap (about 4 GiB) is not
    # enough for the current archive; keep the validation fail-closed while
    # giving the final derived-data gate an explicit CI ceiling; success and
    # peak RSS remain post-merge measurements.
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'

    steps:
      - name: Checkout (full commit/tree history — slice blobs prefetched per batch below)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
        timeout-minutes: 40

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials for push auth
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Recover dropped jobs and repair active firstSeenAt metadata (checkpointed batches)
        id: backfill
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          MAX_COMMITS: ${{ inputs.max_commits || '0' }}
          CRAWLER_KEYS: ${{ inputs.crawler_keys || '' }}
          HISTORY_SINCE: ${{ inputs.history_since || '45 days ago' }}
          # Each checkpoint runs the cheap raw-slice gate before publishing;
          # the full assembly + focused test gate runs only at final completion.
          # Run 43822512261 published 16-crawler checkpoints 33:55 and 32:43
          # apart (07:54→08:27→09:00 UTC), reaching cursor assura-ch at key 48.
          # Eight is a conservative checkpoint granularity chosen to reduce
          # work between durable boundaries, not a linear runtime estimate or
          # proof that the full workset fits the 120-minute job budget. The
          # elapsed_seconds metric measures each batch from prefetch through
          # gates and push; total-job duration still requires a completed run.
          BACKFILL_CHECKPOINT_BATCH_SIZE: '8'
          # The crawler workset is larger than one Actions job. Leave enough
          # headroom for the final checkpoint, push, and runner teardown, then
          # queue the next serial run with the durable cursor instead of
          # letting GitHub cancel the job at its two-hour ceiling.
          BACKFILL_RUN_BUDGET_SECONDS: '3600'
          BACKFILL_PROGRESS_PATH: .github/backfill-expired-from-history-progress.tsv
        # The history walk writes each expired slice atomically, but the old
        # one-shot invocation only committed after the whole walk and the test
        # gate. A timeout or a later unrelated test failure therefore discarded
        # every slice produced earlier in the run. Process one crawler at a
        # time, push a small batch, and keep an EXIT trap for a partial batch:
        # the next run sees the already-enriched slices on main and naturally
        # resumes from the first unfinished crawler.
        run: |
          set -euo pipefail

          write_continuation_output() {
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              printf 'continuation_required=%s\n' "$1" >> "$GITHUB_OUTPUT"
            fi
          }

          checkpoint_batch_size="${BACKFILL_CHECKPOINT_BATCH_SIZE:-8}"
          case "$checkpoint_batch_size" in
            ''|*[!0-9]*|0)
              echo "::error::BACKFILL_CHECKPOINT_BATCH_SIZE must be a positive integer"
              exit 2
              ;;
          esac

          run_budget_seconds="${BACKFILL_RUN_BUDGET_SECONDS:-3600}"
          case "$run_budget_seconds" in
            ''|*[!0-9]*|0)
              echo "::error::BACKFILL_RUN_BUDGET_SECONDS must be a positive integer"
              exit 2
              ;;
          esac

          if [ -n "$CRAWLER_KEYS" ]; then
            keys="$(printf '%s\n' "$CRAWLER_KEYS" | sed 's/[[:space:],][[:space:],]*/\n/g' | sed '/^$/d' | sort -u)"
          else
            keys="$(find data/jobs/by-crawler -maxdepth 1 -type f -name '*.json' -print | sed 's#^.*/##; s#\.json$##' | sort -u)"
          fi

          if [ -z "$keys" ]; then
            echo 'ℹ️ No crawler slices matched; nothing to backfill.'
            write_continuation_output false
            exit 0
          fi

          progress_path="${BACKFILL_PROGRESS_PATH:-.github/backfill-expired-from-history-progress.tsv}"
          # The durable cursor is valid only for the exact history snapshot
          # that produced it. A crawler-only hash would incorrectly resume a
          # pass started with (for example) 45 days ago after a later run
          # requested all history, permanently skipping older records. Keep
          # both the requested expression and its resolved immutable cutoff in
          # the descriptor; recovery reuses the persisted cutoff instead of
          # evaluating a relative date against a newer wall clock.
          backfill_scope_version='history-backfill-scope-v3'
          backfill_max_commits="${MAX_COMMITS:-0}"
          backfill_history_input="${HISTORY_SINCE:-45 days ago}"
          request_scope_hash="$({
            printf '%s\n' "$backfill_scope_version"
            printf 'max_commits=%s\n' "$backfill_max_commits"
            printf 'history_since_input=%s\n' "$backfill_history_input"
            printf 'keys:\n%s\n' "$keys"
          } | git hash-object --stdin)"
          last_completed_key=''
          saved_workset=''
          saved_last=''
          saved_status=''
          saved_request_scope=''
          saved_history_since=''
          if [ -f "$progress_path" ]; then
            if ! IFS=$'\t' read -r saved_workset saved_last saved_status saved_request_scope saved_history_since < "$progress_path"; then
              echo "::error::Invalid backfill progress file: $progress_path"
              exit 2
            fi
            case "$saved_status" in
              active|complete) ;;
              *)
                echo "::error::Unknown backfill progress status '$saved_status' in $progress_path"
                exit 2
                ;;
            esac
          fi

          # Resolve the input once. A recovery of the same active scope must
          # use the persisted cutoff, not re-evaluate e.g. "45 days ago".
          if [ "$saved_status" = 'active' ] && [ "$saved_request_scope" = "$request_scope_hash" ]; then
            case "$saved_history_since" in
              all|????-??-??T??:??:??Z)
                backfill_history_since="$saved_history_since"
                ;;
              *)
                echo "::error::Active backfill progress has no valid immutable history cutoff: $progress_path"
                exit 2
                ;;
            esac
          else
            case "$backfill_history_input" in
              ''|all)
                backfill_history_since='all'
                ;;
              *)
                if ! backfill_history_since="$(date -u -d "$backfill_history_input" '+%Y-%m-%dT%H:%M:%SZ')"; then
                  echo "::error::Unable to resolve HISTORY_SINCE='$backfill_history_input' to an immutable UTC cutoff"
                  exit 2
                fi
                ;;
            esac
          fi
          export HISTORY_SINCE="$backfill_history_since"
          workset_hash="$({
            printf '%s\n' "$backfill_scope_version"
            printf 'max_commits=%s\n' "$backfill_max_commits"
            printf 'history_since_input=%s\n' "$backfill_history_input"
            printf 'history_since_resolved=%s\n' "$backfill_history_since"
            printf 'keys:\n%s\n' "$keys"
          } | git hash-object --stdin)"
          echo "Backfill scope: version=$backfill_scope_version max_commits=$backfill_max_commits history_since_input=$backfill_history_input history_since_resolved=$backfill_history_since workset_hash=$workset_hash"

          # A completed workset starts a new monthly/manual pass. An active
          # workset is the durable cursor left by a failed or cancelled run;
          # skip only the keys confirmed by a pushed checkpoint.
          # Bash treats tab as IFS whitespace and collapses an empty middle
          # field. Persist '-' for an empty cursor so a progress line always
          # round-trips as exactly five fields.
          if [ "$saved_status" = 'active' ] && [ "$saved_workset" = "$workset_hash" ] && [ "$saved_last" != '-' ]; then
            if ! printf '%s\n' "$keys" | grep -Fx "$saved_last" >/dev/null; then
              echo "::error::Backfill progress cursor '$saved_last' is not in the current crawler workset."
              exit 2
            fi
            last_completed_key="$saved_last"
            keys="$(awk -v marker="$saved_last" '$0 == marker { found=1; next } found' <<< "$keys")"
            echo "♻️ Resuming after durable crawler checkpoint: $saved_last"
          elif [ "$saved_status" = 'active' ] && [ -n "$saved_workset" ] && [ "$saved_workset" != "$workset_hash" ]; then
            echo 'ℹ️ Backfill scope/workset changed; starting a fresh cursor.'
          elif [ "$saved_status" = 'complete' ]; then
            echo 'ℹ️ Previous crawler workset completed; starting a fresh pass.'
          fi

          checkpoint_count=0
          checkpoint_active=0
          checkpoint_failed=0
          checkpoint_batch_number=0
          checkpoint_batch_started_at=0
          checkpoint_batch_timing_active=0

          report_checkpoint_timing() {
            timing_outcome="$1"
            if [ "$checkpoint_batch_timing_active" -eq 1 ]; then
              checkpoint_elapsed_seconds=$((SECONDS - checkpoint_batch_started_at))
              echo "⏱️ Backfill checkpoint batch ${checkpoint_batch_number}: crawlers=${checkpoint_count} elapsed_seconds=${checkpoint_elapsed_seconds} outcome=${timing_outcome}"
              checkpoint_batch_timing_active=0
            fi
          }

          has_dirty_checkpoint() {
            git status --porcelain -- data/jobs/by-crawler data/jobs/expired/by-crawler "$progress_path" | grep . >/dev/null
          }

          checkpoint() {
            checkpoint_final="${1:-0}"
            if [ "$checkpoint_active" -eq 1 ]; then
              return 0
            fi
            checkpoint_active=1
            echo "🧷 Validating and checkpointing recovered slices (crawler keys: $checkpoint_count; final=$checkpoint_final)"
            checkpoint_status='active'
            mkdir -p "$(dirname "$progress_path")"
            checkpoint_cursor="${last_completed_key:--}"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$workset_hash" "$checkpoint_cursor" "$checkpoint_status" \
              "$request_scope_hash" "$backfill_history_since" > "$progress_path"
            # Intermediate checkpoints only need the raw slice contract. The
            # assembled artifacts are deploy-derived and rebuilding them here
            # was the dominant cost of run 43874484314: every eight-crawler
            # batch repeated the full expired archive reconciliation, then the
            # focused test gate, before pushing the same small slice delta.
            # Keeping this gate fail-closed preserves safe recovery without
            # making the 120-minute run budget proportional to the number of
            # checkpoints.
            checkpoint_keys="${batch_crawler_keys:-${CRAWLER_KEYS:-}}"
            if ! CRAWLER_KEYS="$checkpoint_keys" node scripts/ci/validate-backfill-checkpoint.mjs; then
              report_checkpoint_timing 'failed-raw-slice-validation'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            if [ "$checkpoint_final" = '1' ]; then
              # The final checkpoint is the only promotion to `complete`.
              # Keep the cursor `active` while the expensive derived-data gate
              # runs, so a failure or timeout resumes the same workset instead
              # of falsely starting a fresh pass.
              echo '🔒 Final backfill gate: assembling derived artifacts and running test:backfill once.'
              if ! node scripts/assemble-jobs-dataset.mjs; then
                report_checkpoint_timing 'failed-assemble'
                checkpoint_failed=1
                checkpoint_active=0
                return 1
              fi
              if ! npm run test:backfill; then
                report_checkpoint_timing 'failed-test'
                checkpoint_failed=1
                checkpoint_active=0
                return 1
              fi
              # Assembly can repair an expired route in-place. Re-run the raw
              # gate after it so the completion commit covers exactly the tree
              # that passed the derived-data test.
              if ! CRAWLER_KEYS='' node scripts/ci/validate-backfill-checkpoint.mjs; then
                report_checkpoint_timing 'failed-final-raw-slice-validation'
                checkpoint_failed=1
                checkpoint_active=0
                return 1
              fi
              if ! node scripts/audit-expired-at-parsable.mjs; then
                report_checkpoint_timing 'failed-final-audit-gate'
                checkpoint_failed=1
                checkpoint_active=0
                return 1
              fi
              checkpoint_status='complete'
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$workset_hash" "$checkpoint_cursor" "$checkpoint_status" \
                "$request_scope_hash" "$backfill_history_since" > "$progress_path"
            fi
            checkpoint_tmp_dir="${RUNNER_TEMP:-/tmp}"
            if ! checkpoint_output="$(mktemp "$checkpoint_tmp_dir/backfill-checkpoint-output.XXXXXX")"; then
              echo '::error::Unable to allocate the checkpoint outcome file.'
              report_checkpoint_timing 'failed-checkpoint-output'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            checkpoint_message='chore(data): checkpoint history backfill slices for resumable recovery'
            if [ "$checkpoint_status" = 'complete' ]; then
              checkpoint_message='chore(data): complete history backfill after final data gate'
            fi
            if ! GITHUB_OUTPUT="$checkpoint_output" SKIP_AI_TRANSLATION=1 bash scripts/lib/git-commit-data.sh --slice-only \
              "$checkpoint_message" \
              "$progress_path"; then
              rm -f "$checkpoint_output"
              report_checkpoint_timing 'failed-push'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            # A false marker is a valid no-op only when this batch left neither
            # an expired slice nor its durable cursor dirty. In particular, a
            # busy shared writer (or any other path that returns success
            # without a push) must not make us reset the batch counter and lose
            # the workspace-only checkpoint.
            checkpoint_dirty=0
            if has_dirty_checkpoint; then
              checkpoint_dirty=1
            fi
            if grep -q '^has_changes=true$' "$checkpoint_output"; then
              if ! git fetch --no-tags origin main || ! git reset --hard origin/main; then
                rm -f "$checkpoint_output"
                echo '::error::Checkpoint was reported as persisted but the workspace could not be aligned to origin/main.'
                report_checkpoint_timing 'failed-align-main'
                checkpoint_failed=1
                checkpoint_active=0
                return 1
              fi
            elif grep -q '^has_changes=false$' "$checkpoint_output" && [ "$checkpoint_dirty" -eq 0 ]; then
              :
            else
              rm -f "$checkpoint_output"
              echo '::error::Checkpoint did not prove that the dirty batch was persisted.'
              report_checkpoint_timing 'failed-persistence-proof'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            rm -f "$checkpoint_output"
            report_checkpoint_timing "$checkpoint_status"
            checkpoint_count=0
            checkpoint_active=0
          }

          on_exit() {
            status=$?
            trap - EXIT
            # If the node process or a later shell command fails, persist every
            # completed atomic slice still dirty in the workspace before the
            # runner disappears. A failed push remains a real failure; the next
            # invocation retries the same bounded batch.
            if [ "$status" -ne 0 ] && [ "$checkpoint_failed" -eq 0 ] && { [ "$checkpoint_count" -gt 0 ] || has_dirty_checkpoint; }; then
              echo '⚠️ Backfill failed; attempting one last durable slice checkpoint.'
              if ! checkpoint; then
                echo '::error::Unable to persist the partial backfill checkpoint.'
              fi
            elif [ "$status" -ne 0 ] && [ "$checkpoint_batch_timing_active" -eq 1 ]; then
              report_checkpoint_timing 'failed-before-crawler-checkpoint'
            fi
            exit "$status"
          }
          trap on_exit EXIT

          on_signal() {
            signal_status="$1"
            trap - EXIT TERM INT
            # GitHub timeout/cancel sends SIGTERM while the crawler process is
            # running. Bash may execute this trap after that child exits, which
            # is the last reliable chance to publish completed atomic slices.
            if [ "$checkpoint_active" -eq 0 ] && [ "$checkpoint_failed" -eq 0 ] && { [ "$checkpoint_count" -gt 0 ] || has_dirty_checkpoint; }; then
              echo '⚠️ Backfill interrupted; attempting a durable checkpoint before exit.'
              if ! checkpoint; then
                echo '::error::Unable to persist the interrupted backfill checkpoint.'
              fi
            elif [ "$checkpoint_batch_timing_active" -eq 1 ]; then
              if [ "$checkpoint_active" -eq 1 ]; then
                report_checkpoint_timing 'interrupted-during-checkpoint'
              else
                report_checkpoint_timing 'interrupted-before-crawler-checkpoint'
              fi
            fi
            exit "$signal_status"
          }
          trap 'on_signal 143' TERM
          trap 'on_signal 130' INT

          if [ -z "$keys" ]; then
            # The prior attempt persisted the last key but was interrupted
            # before it could mark the workset complete.
            checkpoint 1
            echo '✅ History backfill already had a durable cursor for every requested crawler.'
            exit 0
          fi

          mapfile -t key_list <<< "$keys"
          key_total="${#key_list[@]}"
          continuation_required=0
          for ((batch_start=0; batch_start<key_total; batch_start+=checkpoint_batch_size)); do
            if [ "$batch_start" -gt 0 ] && [ "$SECONDS" -ge "$run_budget_seconds" ]; then
              echo "⏭️ Backfill run budget reached after the last durable checkpoint; queueing the remaining crawler workset."
              continuation_required=1
              break
            fi
            batch_keys=("${key_list[@]:batch_start:checkpoint_batch_size}")
            batch_size="${#batch_keys[@]}"
            checkpoint_batch_number=$((checkpoint_batch_number + 1))
            checkpoint_batch_started_at=$SECONDS
            checkpoint_batch_timing_active=1
            batch_crawler_keys=''
            printf -v batch_crawler_keys '%s,' "${batch_keys[@]}"
            batch_crawler_keys="${batch_crawler_keys%,}"
            echo "📦 Prefetching history for crawler batch $((batch_start + 1))-$((batch_start + batch_size))/$key_total"
            CRAWLER_KEYS="$batch_crawler_keys" node scripts/ci/prefetch-history-blobs.mjs

            for key in "${batch_keys[@]}"; do
              [ -n "$key" ] || continue
              echo "──── Backfilling crawler: $key ────"
              CRAWLER_KEYS="$key" node scripts/backfill-expired-from-history.mjs
              last_completed_key="$key"
              checkpoint_count=$((checkpoint_count + 1))
            done
            checkpoint
          done

          if [ "$continuation_required" -eq 1 ]; then
            if [ -z "${GITHUB_PAT:-}" ]; then
              echo '::error::GITHUB_PAT is empty; cannot dispatch the next durable backfill run.'
              exit 1
            fi
            GH_TOKEN="$GITHUB_PAT" gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/backfill-expired-from-history.yml/dispatches" \
              -f ref=main \
              -f 'inputs[dry_run]=false' \
              -f "inputs[max_commits]=$MAX_COMMITS" \
              -f "inputs[crawler_keys]=$CRAWLER_KEYS" \
              -f "inputs[history_since]=$HISTORY_SINCE"
            write_continuation_output true
            echo '✅ Remaining history backfill queued from the durable cursor.'
            exit 0
          fi

          checkpoint 1
          write_continuation_output false
          echo '✅ History backfill completed with durable checkpoints.'

      - name: Reassemble dataset (so the test gate has data/jobs.json; not committed)
        if: steps.backfill.outputs.continuation_required == 'false' && inputs.dry_run != true && inputs.dry_run != 'true'
        # Regenerates the assembled artifacts (data/jobs.json, expired-jobs.json)
        # that the vitest gate reads. These are deploy-assembled, not committed by
        # the --slice-only checkpoint commits above. We deliberately do NOT run
        # reconcile-job-slugs.mjs here: it mutates the funnel-critical tracked
        # registry (data/orphan-indexed-job-slugs.json) which --slice-only would
        # write-then-discard, and reconciliation is the sync-gsc-orphans pipeline's
        # job — this workflow only recovers expired slice content.
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Test gate (bot-direct-to-main — validate before deploy)
        id: backfill_tests
        if: steps.backfill.outputs.continuation_required == 'false' && inputs.dry_run != true && inputs.dry_run != 'true'
        # A workflow that pushes data straight to main is held to the same
        # relevant-test policy as a PR (AGENTS.md). The full suite is not the
        # gate here: its unrelated corpus/environment tests can fail after the
        # backfill is already correct and would turn a persisted checkpoint
        # into a red run while blocking its deploy. This focused gate covers the
        # recovered archive/assembly invariants and the no-repeat alert ledger.
        # Measurement on 2026-09-24 with the 11-file gate: the concurrent
        # invocation hit 3 x 15s subprocess timeouts; --maxWorkers=1 passed
        # all 312 tests in 71.73s. Keep the serial setting until a new run
        # demonstrates that parallelism is safe for these subprocess tests.
        run: npm run test:backfill

      - name: Record self-driven deploy handoff after validated backfill
        if: steps.backfill.outcome == 'success' && steps.backfill.outputs.continuation_required == 'false' && steps.backfill_tests.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true'
        # Do not gate this on has_changes: a previous attempt may have pushed
        # its raw checkpoint and failed only in the final derived-data gate. A
        # clean rerun must still leave the completed data for deploy.yml's
        # self-driven schedule.
        run: echo '✅ Backfill committato; la coda deploy self-driven lo prenderà al prossimo tick.'

      # ─── Perche' questo step esiste ────────────────────────────────────────
      # Il reporter qui sotto e' `run: node scripts/lib/github-issue-creator.mjs`,
      # cioe' vive nell'albero che il Checkout materializza. Quando e' il Checkout
      # A FALLIRE, quel file non esiste e il reporter muore con
      # `Cannot find module .../scripts/lib/github-issue-creator.mjs` — e
      # `continue-on-error: true` fa risultare lo step `success`, quindi il
      # fallimento della rete di sicurezza e' INVISIBILE nella lista degli step.
      # MISURA: 0 issue sulla run rossa 33490566667 (2026-09-01, Checkout morto a 20 min
      # con 19m50s di fetch) = 415 h di silenzio su un cron MENSILE, dove la
      # prossima occasione di accorgersene sarebbe il 2026-10-01.
      #
      # Il recupero va in un path SEPARATO, non nel workspace: un Checkout morto
      # in timeout lascia l'albero PARZIALE, e un secondo checkout sullo stesso
      # path lo ripulirebbe o litigherebbe con quello che c'e' gia'.
      # `sparse-checkout: scripts/lib` basta, e non e' una stima: la chiusura
      # degli import di github-issue-creator.mjs e' UN SOLO file, con soli
      # builtin di node e zero dipendenze npm (misurata il 2026-09-19), quindi
      # niente `npm ci` e niente `setup-node` da rifare.
      #
      # Perche' inline in due file invece di una composite action condivisa
      # (AGENTS.md #6): una composite LOCALE non e' risolvibile senza checkout —
      # e' il commento di .github/actions/report-failure/action.yml a dirlo,
      # «lo step deve stare DOPO un actions/checkout». Una action che serve
      # proprio quando il checkout e' fallito non puo' vivere nel repo:
      # by construction, qui l'unica forma possibile e' `actions/checkout`.
      - name: Recover the failure reporter (when the checkout is what failed)
        if: failure()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .reporter
          sparse-checkout: scripts/lib

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rilievo 🔴 della review: senza questo, `repoFlag()` in
          # github-issue-creator.mjs rende `[]` (riga 175) e `apiRepoPath()`
          # lascia i placeholder `{owner}/{repo}` (riga 560), che `gh` risolve
          # dal REMOTE GIT DELLA CWD. Se il Checkout fallito non ha lasciato un
          # `.git` usabile, il reporter non sa su quale repo scrivere e la rete
          # di sicurezza non parte — cioe' il reporter di recupero aveva la
          # stessa dipendenza implicita dal checkout che stava riparando, un
          # livello piu' in basso. Con GH_REPO esplicito non dipende piu' da
          # nessun albero.
          GH_REPO: ${{ github.repository }}
        run: |
          # L'albero puo' essere assente (Checkout fallito) o parziale: usa la
          # copia recuperata solo se la canonica non c'e'.
          SCRIPT=scripts/lib/github-issue-creator.mjs
          [ -f "$SCRIPT" ] || SCRIPT=.reporter/scripts/lib/github-issue-creator.mjs
          # Se anche il recupero e' fallito, questo step sotto
          # `continue-on-error: true` risulterebbe `success` senza aver
          # riportato niente — il «no-report riuscito in silenzio», che e'
          # esattamente il difetto di partenza spostato di un passo. Un
          # `::error::` lascia un'annotation visibile sulla run, e la issue la
          # apre comunque la rete centrale (scripts/ci/scan-unreported-failures.mjs).
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::reporter di fallimento non raggiungibile: ne' scripts/lib/ ne' .reporter/scripts/lib/ esistono. Nessuna issue aperta da questo workflow; la copertura resta su unreported-failure-issues.yml."
            exit 0
          fi
          node "$SCRIPT" \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
