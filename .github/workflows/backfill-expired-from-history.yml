name: Backfill Expired Jobs From History

# Recovers job content for "empty orphan" soft-landing pages.
#
# When a job disappears from a crawler's source (listing pulled, PDF removed) or
# its slug churns, it can drop out of the by-crawler slice WITHOUT being archived
# into data/jobs/expired/by-crawler/. Google keeps the old URL indexed, so the
# soft-landing page renders with only a slug-derived title and NO description —
# thin content with zero SEO value. `scripts/backfill-expired-from-history.mjs`
# walks git history, finds those dropped jobs by id, and re-archives the most
# recent version (full title/description/salary/slugByLocale) into the expired
# slice. The build plugin (jobsSeoPagesPlugin) then resolves the orphan slug to
# that recovered content via its slug-variant index — including the long tail
# beyond the 5000-entry expired-jobs.json cap, which it now reads from the
# uncapped per-crawler slices directly.
#
# Needs full git history (fetch-depth: 0) — the by-crawler slices are walked
# commit-by-commit. Runs monthly as a safety net; the crawler pipeline archives
# most drops in real time, so each run typically recovers only the few that
# slipped through since the last one.
on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of each month, 04:00 UTC
  workflow_dispatch:
    inputs:
      max_commits:
        description: 'Cap history depth per slice (0 = unbounded)'
        required: false
        type: string
        default: '0'
      dry_run:
        description: 'Dry run (no file writes, just report)'
        required: false
        type: boolean
        default: true
      human_approval:
        description: 'Explicit human approval for expired-job writer side effects.'
        required: false
        type: boolean
        default: false
      crawler_keys:
        description: 'Optional comma/newline-separated crawler keys for a bounded batch.'
        required: false
        type: string
        default: ''

concurrency:
  group: jobs-data-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (full history — required to walk by-crawler slices)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        #
        # Il tetto era 20min, tarato sull'UNICA run completata disponibile
        # (Checkout 166s il 2026-06-15, 3% di un cap da 90min). Quei 166s non
        # descrivono piu' il repo: la run 33490566667 (2026-09-01) e' morta
        # proprio qui, e il log dice che il tetto ha tagliato il FETCH, non il
        # checkout dell'albero — `git fetch` dalle 09:07:33 alle 09:27:23, cioe'
        # 19m50s dei 20min, e il `git checkout` dietro era al 11% (4526/41140
        # file) dopo pochi secondi, quindi avrebbe finito in ~100s. Il tetto
        # stava sotto il costo intrinseco del fetch: non e' severita', e' un
        # rosso che nessuna modifica al repo puo' togliere.
        #
        # Perche' si alza il tetto invece di ridurre il fetch — le due cure
        # abituali sono entrambe escluse, misurate:
        #  - `filter: blob:none` e' VELENO qui, per la stessa ragione scritta nel
        #    Checkout di recover-prev-slugs.yml: `backfill-expired-from-history.mjs`
        #    non cammina solo i commit, legge il CONTENUTO di ogni revisione con
        #    `git show <sha>:<path>` (una per commit, fino a ~640 per slice su 596
        #    slice). Con un clone blobless ognuna di quelle letture e' un
        #    lazy-fetch di rete.
        #  - restringere la finestra (`--shallow-since`) non compra niente: la
        #    history di questo repo e' TUTTA recente dopo il rewrite del
        #    2026-05-27, 117'771 commit su main di cui 96'198 negli ultimi 3
        #    mesi. Tagliare a 3 mesi togliere il 18% del fetch, non il costo.
        # Resta quindi il tetto, alzato al costo reale con margine: 40min contro
        # i 19m50s+ misurati. Il budget del job (90min) lo assorbe — l'ultima run
        # riuscita ha speso 25m30s in TOTALE (walk 12m41s, reassemble 45s,
        # npm test 7m51s, commit 1m04s), quindi 40 + ~23 = ~63min.
        timeout-minutes: 40

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Require human approval for expired-job writer side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          # Senza questa riga il cron di questo workflow e' VERDE E INERTE.
          # scripts/ci/human-side-effect-gate.mjs:180 calcola
          # `isTrustedScheduleEvent = eventName === 'schedule' &&
          # APPROVAL_TRUSTED_SCHEDULE === 'true'`, e alla riga 214 un evento che
          # non e' ne' dispatch ne' schedule fidato aggiunge
          # `event-not-workflow-dispatch` alle `reasons` -> diniego. Un diniego
          # «exits successfully so the workflow can finish quietly» (riga 34 di
          # quello script), e ogni step di scrittura di questo workflow e'
          # condizionato a `allow_side_effect == 'true'`: quindi il cron del
          # 2026-10-01 sarebbe risultato `success` avendo backfillato ZERO
          # expired job. Non e' un'ipotesi: `grep -c APPROVAL_TRUSTED_SCHEDULE`
          # su questo file rendeva 0, mentre 19 workflow fratelli lo dichiarano
          # (recover-prev-slugs.yml:170, send-job-alerts.yml,
          # refresh-plate-auctions.yml e altri 16) — quindi e' il pattern
          # stabilito del repo, non un privilegio inventato per questo caso.
          #
          # Questa riga ABILITA SCRITTURE SU `main` DA CRON: il percorso di
          # questo workflow fa `git-commit-data.sh --slice-only` con push
          # diretto su main e poi `trigger-deploy.sh`. Il gate resta comunque
          # l'unico cancello (run_attempt == 1, nonce monouso, e `dry_run`
          # continua a valere sul dispatch manuale).
          APPROVAL_TRUSTED_SCHEDULE: 'true'
          APPROVAL_SCOPE: backfill-expired-from-history
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials for push auth
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Recover dropped jobs from history into expired slices (checkpointed batches)
        id: backfill
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          MAX_COMMITS: ${{ inputs.max_commits || '0' }}
          CRAWLER_KEYS: ${{ inputs.crawler_keys || '' }}
          BACKFILL_CHECKPOINT_BATCH_SIZE: '16'
        # The history walk writes each expired slice atomically, but the old
        # one-shot invocation only committed after the whole walk and the test
        # gate. A timeout or a later unrelated test failure therefore discarded
        # every slice produced earlier in the run. Process one crawler at a
        # time, push a small batch, and keep an EXIT trap for a partial batch:
        # the next run sees the already-enriched slices on main and naturally
        # resumes from the first unfinished crawler.
        run: |
          set -euo pipefail

          checkpoint_batch_size="${BACKFILL_CHECKPOINT_BATCH_SIZE:-16}"
          case "$checkpoint_batch_size" in
            ''|*[!0-9]*|0)
              echo "::error::BACKFILL_CHECKPOINT_BATCH_SIZE must be a positive integer"
              exit 2
              ;;
          esac

          if [ -n "$CRAWLER_KEYS" ]; then
            keys="$(printf '%s\n' "$CRAWLER_KEYS" | sed 's/[[:space:],][[:space:],]*/\n/g' | sed '/^$/d' | sort -u)"
          else
            keys="$(find data/jobs/by-crawler -maxdepth 1 -type f -name '*.json' -print | sed 's#^.*/##; s#\.json$##' | sort -u)"
          fi

          if [ -z "$keys" ]; then
            echo 'ℹ️ No crawler slices matched; nothing to backfill.'
            exit 0
          fi

          checkpoint_count=0
          checkpoint_active=0
          checkpoint_failed=0

          has_dirty_expired_slices() {
            git status --porcelain -- data/jobs/expired/by-crawler | rg -q '.'
          }

          checkpoint() {
            if [ "$checkpoint_active" -eq 1 ]; then
              return 0
            fi
            checkpoint_active=1
            echo "🧷 Checkpointing recovered slices (batch size: $checkpoint_count)"
            # Keep the durable checkpoint fail-closed: every changed archive
            # must still be valid JSON with an orderable expiredAt before it
            # reaches main. The broader focused suite runs after all batches.
            if ! node scripts/audit-expired-at-parsable.mjs; then
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            if ! checkpoint_output="$(mktemp)"; then
              echo '::error::Unable to allocate the checkpoint outcome file.'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            if ! GITHUB_OUTPUT="$checkpoint_output" SKIP_AI_TRANSLATION=1 bash scripts/lib/git-commit-data.sh --slice-only \
              "chore(data): checkpoint history backfill slices for resumable recovery"; then
              rm -f "$checkpoint_output"
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            # git-commit-data.sh deliberately returns 0 when the shared writer
            # lease stays busy, even though it has not persisted anything.
            # Require its explicit outcome marker so a checkpoint can never be
            # reported as successful while the partial slices would disappear
            # with the runner workspace.
            if ! rg -q '^has_changes=(true|false)$' "$checkpoint_output"; then
              rm -f "$checkpoint_output"
              echo '::error::Checkpoint command returned without a persistence outcome.'
              checkpoint_failed=1
              checkpoint_active=0
              return 1
            fi
            rm -f "$checkpoint_output"
            checkpoint_count=0
            checkpoint_active=0
          }

          on_exit() {
            status=$?
            trap - EXIT
            # If the node process or a later shell command fails, persist every
            # completed atomic slice still dirty in the workspace before the
            # runner disappears. A failed push remains a real failure; the next
            # invocation retries the same bounded batch.
            if [ "$status" -ne 0 ] && [ "$checkpoint_failed" -eq 0 ] && has_dirty_expired_slices; then
              echo '⚠️ Backfill failed; attempting one last durable slice checkpoint.'
              if ! checkpoint; then
                echo '::error::Unable to persist the partial backfill checkpoint.'
              fi
            fi
            exit "$status"
          }
          trap on_exit EXIT

          while IFS= read -r key; do
            [ -n "$key" ] || continue
            echo "──── Backfilling crawler: $key ────"
            CRAWLER_KEYS="$key" node scripts/backfill-expired-from-history.mjs
            checkpoint_count=$((checkpoint_count + 1))
            if [ "$checkpoint_count" -ge "$checkpoint_batch_size" ]; then
              checkpoint
            fi
          done <<< "$keys"

          checkpoint
          echo '✅ History backfill completed with durable checkpoints.'

      - name: Reassemble dataset (so the test gate has data/jobs.json; not committed)
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        # Regenerates the assembled artifacts (data/jobs.json, expired-jobs.json)
        # that the vitest gate reads. These are deploy-assembled, not committed by
        # the --slice-only checkpoint commits above. We deliberately do NOT run
        # reconcile-job-slugs.mjs here: it mutates the funnel-critical tracked
        # registry (data/orphan-indexed-job-slugs.json) which --slice-only would
        # write-then-discard, and reconciliation is the sync-gsc-orphans pipeline's
        # job — this workflow only recovers expired slice content.
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Test gate (bot-direct-to-main — validate before deploy)
        id: backfill_tests
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        # A workflow that pushes data straight to main is held to the same
        # relevant-test policy as a PR (AGENTS.md). The full suite is not the
        # gate here: its unrelated corpus/environment tests can fail after the
        # backfill is already correct and would turn a persisted checkpoint
        # into a red run while blocking its deploy. This focused gate covers the
        # recovered archive/assembly invariants and the no-repeat alert ledger.
        # Measurement on 2026-09-24 with the 11-file gate: the concurrent
        # invocation hit 3 x 15s subprocess timeouts; --maxWorkers=1 passed
        # all 312 tests in 71.73s. Keep the serial setting until a new run
        # demonstrates that parallelism is safe for these subprocess tests.
        run: npm run test:backfill

      - name: Trigger deploy after validated backfill
        if: steps.backfill.outcome == 'success' && steps.backfill_tests.outcome == 'success' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        # Hard-fail by design (no `|| true`, #6936): a failed dispatch here
        # fails the job, caught by "Report failure to GitHub Issues" below —
        # that GitHub issue IS this caller's recovery net (auto-triage picks
        # it up), so silencing the failure would just hide a real deploy gap.
        # Do not gate this on has_changes: a previous attempt may have pushed
        # its checkpoint and failed only in the test/deploy tail. A clean rerun
        # must still publish the already-persisted data.
        run: bash scripts/lib/trigger-deploy.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # ─── Perche' questo step esiste ────────────────────────────────────────
      # Il reporter qui sotto e' `run: node scripts/lib/github-issue-creator.mjs`,
      # cioe' vive nell'albero che il Checkout materializza. Quando e' il Checkout
      # A FALLIRE, quel file non esiste e il reporter muore con
      # `Cannot find module .../scripts/lib/github-issue-creator.mjs` — e
      # `continue-on-error: true` fa risultare lo step `success`, quindi il
      # fallimento della rete di sicurezza e' INVISIBILE nella lista degli step.
      # MISURA: 0 issue sulla run rossa 33490566667 (2026-09-01, Checkout morto a 20 min
      # con 19m50s di fetch) = 415 h di silenzio su un cron MENSILE, dove la
      # prossima occasione di accorgersene sarebbe il 2026-10-01.
      #
      # Il recupero va in un path SEPARATO, non nel workspace: un Checkout morto
      # in timeout lascia l'albero PARZIALE, e un secondo checkout sullo stesso
      # path lo ripulirebbe o litigherebbe con quello che c'e' gia'.
      # `sparse-checkout: scripts/lib` basta, e non e' una stima: la chiusura
      # degli import di github-issue-creator.mjs e' UN SOLO file, con soli
      # builtin di node e zero dipendenze npm (misurata il 2026-09-19), quindi
      # niente `npm ci` e niente `setup-node` da rifare.
      #
      # Perche' inline in due file invece di una composite action condivisa
      # (AGENTS.md #6): una composite LOCALE non e' risolvibile senza checkout —
      # e' il commento di .github/actions/report-failure/action.yml a dirlo,
      # «lo step deve stare DOPO un actions/checkout». Una action che serve
      # proprio quando il checkout e' fallito non puo' vivere nel repo:
      # by construction, qui l'unica forma possibile e' `actions/checkout`.
      - name: Recover the failure reporter (when the checkout is what failed)
        if: failure()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          path: .reporter
          sparse-checkout: scripts/lib

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rilievo 🔴 della review: senza questo, `repoFlag()` in
          # github-issue-creator.mjs rende `[]` (riga 175) e `apiRepoPath()`
          # lascia i placeholder `{owner}/{repo}` (riga 560), che `gh` risolve
          # dal REMOTE GIT DELLA CWD. Se il Checkout fallito non ha lasciato un
          # `.git` usabile, il reporter non sa su quale repo scrivere e la rete
          # di sicurezza non parte — cioe' il reporter di recupero aveva la
          # stessa dipendenza implicita dal checkout che stava riparando, un
          # livello piu' in basso. Con GH_REPO esplicito non dipende piu' da
          # nessun albero.
          GH_REPO: ${{ github.repository }}
        run: |
          # L'albero puo' essere assente (Checkout fallito) o parziale: usa la
          # copia recuperata solo se la canonica non c'e'.
          SCRIPT=scripts/lib/github-issue-creator.mjs
          [ -f "$SCRIPT" ] || SCRIPT=.reporter/scripts/lib/github-issue-creator.mjs
          # Se anche il recupero e' fallito, questo step sotto
          # `continue-on-error: true` risulterebbe `success` senza aver
          # riportato niente — il «no-report riuscito in silenzio», che e'
          # esattamente il difetto di partenza spostato di un passo. Un
          # `::error::` lascia un'annotation visibile sulla run, e la issue la
          # apre comunque la rete centrale (scripts/ci/scan-unreported-failures.mjs).
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::reporter di fallimento non raggiungibile: ne' scripts/lib/ ne' .reporter/scripts/lib/ esistono. Nessuna issue aperta da questo workflow; la copertura resta su unreported-failure-issues.yml."
            exit 0
          fi
          node "$SCRIPT" \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
