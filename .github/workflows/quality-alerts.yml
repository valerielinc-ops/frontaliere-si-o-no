name: Quality alerts
on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC, after evidence + tune
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Run quality alerts
        id: alerts
        run: |
          # quality-alerts.mjs exits with a DISTINCT code (8 = ALERT_SIGNAL_EXIT)
          # when a fresh P0/P1 alert is active. That non-zero exit turns the job
          # red on purpose so GitHub's native workflow-failure email reaches the
          # maintainer — it is the alert delivery channel, NOT an infra bug.
          # Capture the code so the "Report failure" step can tell that
          # intentional signal apart from a genuine crash (exit 1) and avoid
          # filing a spurious "Workflow Failure" bug issue for every alert (#2288).
          set +e
          node scripts/quality-alerts.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Commit alert state
        if: always()
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@frontaliereticino.ch"
          # Stage modified state files BEFORE rebase so rebase doesn't fail
          # on unstaged changes from the alerts runner.
          git add data/alert-snoozes.json data/quality-alerts-history.jsonl 2>/dev/null || true
          git pull --rebase --autostash origin main
          if git diff --cached --quiet; then
            echo "No alert state changes to commit"
            exit 0
          fi
          git commit -m "chore(alerts): $(date -u +%Y-%m-%d)"
          # Retry-on-rebase loop (closes #798). The previous
          # `git push origin main || true` silently swallowed every
          # rejection — even legitimate non-fast-forward races against
          # concurrent producers (crawlers, fuel, weather, refreshers).
          # When silenced, alerts-bot snooze + history rows were lost
          # without surfacing in the workflow log. Mirror the pattern
          # from refresh-thin-promotions.yml (#794), dist-history
          # (#804), and gsc-frontaliere-monitor (#805).
          bash scripts/lib/configure-main-push-auth.sh
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed quality-alerts state."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main
            if ! git -c rebase.autoStash=true rebase origin/main; then
              echo "⚠️ Rebase conflict on alert state files — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving alert state uncommitted."
          exit 1

      - name: Report failure to GitHub Issues
        # Skip when the failure is an intentional quality alert (exit code 8 =
        # ALERT_SIGNAL_EXIT): the red job + native email are the alert channel,
        # not an infra bug. Any other failure (genuine crash = 1, or an earlier
        # step like npm ci where exit_code is unset) still files the bug issue.
        if: failure() && steps.alerts.outputs.exit_code != '8'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
