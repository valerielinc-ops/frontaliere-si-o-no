name: Translation Scheduler v2 (shadow)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      enable_generation:
        description: 'Enable the zero-cost provider for this observed run'
        required: false
        default: false
        type: boolean
      max_units:
        description: 'Maximum translation units for this run'
        required: false
        default: '25'
        type: string

permissions:
  contents: write
  # The shadow lane had no failure reporting at all, which is why it ran red on
  # every single run from its first (2026-09-12) to 2026-09-18 without anyone
  # being told. `github-issue-creator.mjs` dedups on a stable title, so a
  # recurring failure comments on one canonical issue instead of opening 20.
  issues: write

concurrency:
  group: translation-scheduler-v2-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSLATION_SHADOW_ENABLE_GENERATION: ${{ vars.TRANSLATION_SHADOW_ENABLE_GENERATION || '0' }}
      TRANSLATION_SHADOW_MAX_JOBS: '250'
      TRANSLATION_SHADOW_MAX_UNITS: ${{ inputs.max_units || '25' }}
    steps:
      - name: Check out source data and runtime
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bounded scheduler shadow cycle
        env:
          TRANSLATION_SHADOW_REPORT_PATH: ${{ runner.temp }}/translation-scheduler-v2-report.json
        run: |
          if [ "${{ inputs.enable_generation }}" = "true" ]; then
            export TRANSLATION_SHADOW_ENABLE_GENERATION=1
          fi
          node scripts/translation-schedule-run-v2.mjs --shadow --report "$TRANSLATION_SHADOW_REPORT_PATH"

      # The runner can only commit to refs/heads/translation-state-v2. This
      # assertion makes an accidental main-worktree write a hard failure.
      - name: Assert main worktree is unchanged
        run: |
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

      - name: Upload scheduler metrics
        uses: actions/upload-artifact@v7
        with:
          name: translation-scheduler-v2-shadow
          path: ${{ env.TRANSLATION_SHADOW_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 14

      # A shadow lane is an observation instrument: a red run means it observed
      # nothing, so the silence is the whole failure. No `|| cancelled()` here —
      # `cancelled()` is reconciled by job-timeout-monitor, and folding it in
      # would page on every routine supersede.
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Translation scheduler v2 shadow lane is failing" \
            --description "The shadow lane failed and produced no scheduler report, so the translation queue went unobserved for this cycle.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Where to start
          - The scanner reads every real slice in \`data/jobs/by-crawler/\`. That directory also holds crawler scratch companions that are **not** slices (\`<key>-locale-cache.json\`, \`<key>.json.cleanup-tmp.json\`); anything enumerating it must filter through \`isSliceFile\` from \`scripts/lib/crawler-slice-files.mjs\`. A hand-rolled \`.endsWith('.json')\` is the bug this lane died of for its first 20 runs.
          - Reproduce locally with \`npx vitest run tests/translation-schedule-run-v2.test.ts\`, which pins the scratch-companion case.
          - This lane never writes \`main\`; a failure is an observation gap, never data loss. Do not silence the error to get a green run — the report is the deliverable.

          Issue auto-resolves on the next green shadow run." \
            --priority 2 \
            --label automation \
            --workflow "${{ github.workflow }}"

      # Closer half, so a recovered lane does not leave a stale open issue.
      - name: Resolve issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "Translation scheduler v2 shadow lane is failing" \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
