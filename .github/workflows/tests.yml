name: tests
run-name: "Code checks and review · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.event.action || github.event_name }}"

# One required check owns checkout, source guards, typecheck, Vitest and review.
# The PR body contract is a step of this code run. A second model review is
# admitted only for a new HEAD, so metadata churn cannot manufacture
# contradictory reviews on one commit. Labels remain non-triggering.
# Keep the job name aligned with the ruleset and scripts/ci/lib/constants.mjs.
#
# `edited` NON e' fra i tipi: un cambio di titolo o descrizione lascia l'HEAD
# identico, quindi rieseguire l'intera run rimisura codice che non e' cambiato.
# Misurato il 2026-09-18 sulle ultime 200 run: 38 delle 116 run su PR (33%)
# nascono da un `edited`, 14 minuti di mediana l'una, 8 ore di CI in quella
# sola finestra. La review non veniva comunque rifatta — il `Re-review guard`
# salta quando esiste gia' una review terminale sulla HEAD — quindi quelle run
# rimisuravano soltanto i test.
#
# Il caso che `edited` copriva resta coperto: se la run fallisce sul contratto
# del body o sul gate della review, `retry-code-check-after-body-edit.yml`
# riesegue QUELLA run quando la descrizione viene corretta, e solo allora.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required checks are evaluated on the merge queue ref, not on the PR event.
  merge_group:
  # Kept available for manual diagnostics and recovery runs.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR to validate when recovering a missing code run'
        type: string
        required: false
      head_sha:
        description: 'Exact PR head SHA for trusted recovery dispatches'
        type: string
        required: false

# Union of the three original workflows' `permissions:` (tests.yml itself had
# none — it inherited the repo default — so this is now the explicit floor):
#   pr-collision-detector.yml: contents:read, pull-requests:write, issues:write
#   pr-body-contract.yml:      contents:read, pull-requests:write, issues:read
# `issues: write` (the more permissive of `write`/`read`) covers both.
permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  id-token: write
  # Lettura: l'ultimo step del job di esecuzione legge gli step del job STESSO
  # dalla jobs API per scrivere nello Step Summary quale famiglia ha fatto
  # rosso. Scrittura: serve a UNA sola chiamata, il self-cancel della run
  # superata (`Watch for a superseded PR head`): POST
  # actions/runs/<questa run>/cancel e nient'altro. `write` include `read`.
  actions: write

# Questo workflow serve sia le PR sia i segnali di salute di main/merge queue.
# Le chiavi separano le PR per numero+HEAD e nessuna run viene cancellata: un
# verdetto in volo resta osservabile, mentre i gate exact-head ignorano quello
# eventualmente stantio.
#
#   Each PR/head has its own lane. Reviews for different PRs, and reviews for
#   different heads of the same PR during an autorebase, can proceed together;
#   an older run is never cancelled while it may still be reading or posting a
#   review. The exact-head review gate and native auto-merge ignore old verdicts.
#   Duplicate runs for the same PR/head remain serialized by this group and the
#   review claim ledger.
#
#   The trusted loop-fleet bridge also uses this non-cancelling policy: its
#   append-only pushes and pull_request.edited body churn must leave the bounded
#   ledger review alive until it publishes on the exact HEAD. The ledger scope
#   classifier and its metadata checks remain the authority for that fast path.
#
#   Direct pushes to main and merge queues retain their own SHA in the fallback
#   portion of the key, so every emitted source-gate verdict remains observable.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Unconditional job: admitted code events must always produce a real verdict.
  vitest:
    name: vitest (unit + integration)
    runs-on: ubuntu-latest
    # Letti dal job `post-review` (vedi `Decide post-review follow-up`).
    outputs:
      automerge: ${{ steps.post_review.outputs.automerge }}
      autorebase: ${{ steps.post_review.outputs.autorebase }}
      pr_number: ${{ steps.post_review.outputs.pr_number }}
    # 60 min. NON è il vecchio 30 lasciato lì: il job fuso paga in SERIE ciò che
    # quattro job pagavano in parallelo. Somma dei massimi osservati citati in
    # questo file: checkout profilo `contract` 420s + `npm ci` ~60s + detector
    # collision 449s + body-contract/source-guard ~90s + `tsc` 33s + catena
    # vitest 950s ≈ 2000s ≈ 33 min. 60 = 1,8x quel caso peggiore, con lo stesso
    # criterio (≈2x il massimo osservato) usato per i tetti che questo file ha
    # già ritarato. Un tetto sotto la somma non discrimina un guasto: fabbrica
    # un `cancelled`, che nessun `if: failure()` vede e che `gh pr checks` legge
    # come fail bloccando l'auto-merge di PR sane.
    timeout-minutes: 360
    # Node 22 compila il bytecode dei moduli esternalizzati una sola volta e
    # lo riusa nei worker Vitest e nei run successivi. La directory viene
    # salvata nella cache sotto; senza questa env il compile cache resta
    # disabilitato anche se il runner conserva la directory.
    env:
      NODE_COMPILE_CACHE: node_modules/.cache/node-compile
      # Keep review classification aligned with the former pr-review-loop.
      # This is consumed by both the re-review guard and tier selection.
      NONCODE_RE: '^(data/|public/|reports/|_newsletter_variants/|docs/)|(^|/)(package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock)$|\\.(snap|png|jpe?g|webp|gif|svg|ico|woff2?)$'
    steps:
      - name: PR-body completeness + multi-issue Closes (no checkout, all events)
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        id: body_contract
        uses: actions/github-script@v8
        with:
          script: |
            const STICKY = '<!-- pr-body-contract -->';
            const prNumber = Number(context.payload.pull_request?.number || context.payload.inputs?.pr_number);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) throw new Error('Invalid PR number');
            const { data: currentPr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const body = currentPr.body || '';

            // --- 1) Required headers (REVIEW.md completeness contract) ---------------
            // Literal headers required by REVIEW.md. Tolerate trailing text on the
            // same line (e.g. "## Non implementato (ancora)"); require start-of-line.
            const hasImpl = /^\s{0,3}#{2,3}\s+Implementato\b/im.test(body);
            const hasNon  = /^\s{0,3}#{2,3}\s+Non implementato\b/im.test(body);
            const missing = [];
            if (!hasImpl) missing.push('`## Implementato`');
            if (!hasNon)  missing.push('`## Non implementato (ancora)`');

            // --- 1b) Section CONTENT quality (escalation #3250, bucket
            // `reviewer-finding/pr-body-contract` 6x/14d) -------------------------
            // Header PRESENCE alone isn't enough: the PR template leaves bare `- `
            // placeholder bullets in both sections, and a fixer that submits
            // without filling them passes this gate but still draws a reviewer
            // 🔴 finding — wasting a review cycle. Mirrors
            // scripts/lib/pr-body-sections-check.mjs (own unit tests); keep the
            // two in sync on rule changes.
            const extractSection = (text, headerRe) => {
              const m = headerRe.exec(text);
              if (!m) return null;
              const rest = text.slice(m.index + m[0].length);
              const nextHeading = /\n(?=#{1,6}[ \t])/.exec(rest);
              return nextHeading ? rest.slice(0, nextHeading.index) : rest;
            };
            const stripNonContent = (t) => String(t ?? '')
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/<!--[\s\S]*?-->/g, ' ');
            const isSubstantiveBullet = (line) => line.replace(/^[ \t]*[-*+][ \t]*/, '').trim().length > 0;
            const hasMeaningfulContent = (raw) => stripNonContent(raw).split('\n').some((line) => {
              const t = line.trim();
              if (!t) return false;
              if (/^#{1,6}[ \t]/.test(t)) return false;
              if (/^[-*+](?:[ \t]|$)/.test(t)) return isSubstantiveBullet(t);
              return true;
            });
            const hasOnlyBareBullets = (raw) => {
              const lines = stripNonContent(raw).split('\n').filter((l) => l.trim().length > 0);
              if (lines.length === 0) return false;
              return lines.every((line) => {
                const t = line.trim();
                if (/^#{1,6}[ \t]/.test(t)) return true;
                if (/^[-*+][ \t]?$/.test(t)) return true;
                if (/^[-*+][ \t]/.test(t)) return false;
                return true;
              });
            };
            const hasNessuno = (raw) => /\bnessun[oa]?\b/i.test(stripNonContent(raw));
            const topLevelBullets = (raw) => {
              const bullets = [];
              let current = null;
              for (const line of stripNonContent(raw).split('\n')) {
                if (/^[ \t]*[-*+][ \t]+\S/.test(line)) {
                  if (current) bullets.push(current);
                  current = { index: bullets.length + 1, text: line.trim() };
                } else if (current && line.trim()) {
                  current.text += ` ${line.trim()}`;
                }
              }
              if (current) bullets.push(current);
              return bullets;
            };

            // A decision is a valid terminal deferral only when the body makes
            // it auditable by a later maintainer. Keep this check in the
            // no-checkout body gate as well as in the corpus validator:
            // `per scelta`/`by construction` without a concrete reason and a
            // concrete next step used to look closed while silently dropping
            // the work from follow-up.
            const DECISION_RE = /\bby construction\b|\bper (?:scelta|costruzione|design)\b|(?:è|e')\s+una\s+decisione\b|\bdi proposito\b|\bdeliberat\w*|\bblocked\s*:\s*(?:decisione del proprietario|owner decision)\b|(?<!\bnon\s+(?:è|sono|erano)\s+(?:un\s+|una\s+)?)\bfalso\s+positivo\b|(?<!\bnot\s+(?:a\s+)?)\bfalse\s+positive\b/iu;
            const DECISION_REASON_RE = /\b(?:motivo|ragione|reason)\s*:\s*(.+?)(?=\s+\b(?:prossimo\s+passo|next\s+step|azione\s+successiva)\s*:|$)/iu;
            const DECISION_NEXT_STEP_RE = /\b(?:prossimo\s+passo|next\s+step|azione\s+successiva)\s*:\s*(.+)$/iu;
            const DECISION_PLACEHOLDER_RE = /(?:^|[\s:;,.!?()\[\]{}—–-])(?:<[^>]+>|\.\.\.|tbd|n\/a|da\s+(?:definire|decidere|valutare|fare))(?=$|[\s:;,.!?()\[\]{}—–-])/iu;
            const stripDecisionFormatting = (value) => String(value ?? '').replace(/[*_~`]/gu, '');
            const concreteDecisionValue = (value) => {
              const clean = stripDecisionFormatting(value).replace(/\s+/gu, ' ').trim();
              return clean.length >= 8
                && !DECISION_PLACEHOLDER_RE.test(clean)
                && /[\p{L}\p{N}]/u.test(clean);
            };
            const decisionDeferralViolation = (raw) => {
              const clean = stripDecisionFormatting(stripNonContent(raw));
              if (!DECISION_RE.test(clean)) return null;
              const reason = clean.match(DECISION_REASON_RE)?.[1]?.trim() || '';
              const nextStep = clean.match(DECISION_NEXT_STEP_RE)?.[1]?.trim() || '';
              if (concreteDecisionValue(reason) && concreteDecisionValue(nextStep)) return null;
              return 'una deroga `per scelta`/`by construction`/`falso positivo` deve contenere `**Motivo:** <causa concreta>. **Prossimo passo:** <azione concreta>`.';
            };

            const sectionViolations = [];
            const decisionViolations = [];
            if (hasImpl) {
              const implementedSection = extractSection(body, /^\s{0,3}#{2,3}\s+Implementato[^\n]*/im) ?? '';
              if (!hasMeaningfulContent(implementedSection)) {
                sectionViolations.push(hasOnlyBareBullets(implementedSection)
                  ? '`## Implementato` contiene solo bullet placeholder vuoti (`- `) non compilati.'
                  : '`## Implementato` è vuota.');
              }
            }
            if (hasNon) {
              const nonImplementedSection = extractSection(body, /^\s{0,3}#{2,3}\s+Non implementato[^\n]*/im) ?? '';
              if (!hasNessuno(nonImplementedSection) && !hasMeaningfulContent(nonImplementedSection)) {
                sectionViolations.push(hasOnlyBareBullets(nonImplementedSection)
                  ? '`## Non implementato (ancora)` contiene solo bullet placeholder vuoti (`- `) non compilati.'
                  : '`## Non implementato (ancora)` è vuota.');
              }
              // Decision deferrals belong to the work-owed section. Keep the
              // source variable explicit: using the same short name as the
              // Implementato block made this gate easy to misread and review.
              for (const bullet of topLevelBullets(nonImplementedSection)) {
                const decisionViolation = decisionDeferralViolation(bullet.text);
                if (decisionViolation) {
                  decisionViolations.push(`Voce ${bullet.index}: ${decisionViolation}`);
                }
              }
            }

            // --- 2) Multi-issue Closes on one line (GitHub closes only the first) ----
            // Mirror of scripts/lib/pr-body-closes-check.mjs (see tests). A closing
            // keyword governing the first ref, then ≥1 MORE refs chained by list
            // separators only (space/comma/colon/semicolon/&/"and") → the extras are
            // silently ignored by GitHub. A ref after a sentence boundary or real
            // words (`Closes #12. See also #99`) is a cross-ref, not flagged.
            const REF = '(?:[\\w.-]+\\/[\\w.-]+)?#\\d+';
            const SEP = '(?:\\s*(?:,|:|;|&|\\band\\b)?\\s*)';
            const CHAIN = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\b\\s*(${REF})((?:${SEP}${REF})+)`,
              'gi',
            );
            const closesViolations = [];
            body.split(/\r?\n/).forEach((line, i) => {
              CHAIN.lastIndex = 0;
              const m = CHAIN.exec(line);
              if (!m) return;
              const nums = (m[0].match(new RegExp(REF, 'g')) || [])
                .map((r) => r.match(/#(\d+)/)[1]);
              if (nums.length >= 2) closesViolations.push({ line: i + 1, text: line.trim(), nums });
            });

            // --- 2b) Closure intent expressed with a keyword GitHub ignores ---------
            // Mirror of scripts/lib/pr-body-closes-check.mjs `lineIntentRefs` /
            // `effectiveRefs` (tests/pr-body-closes-check.test.ts is the source of
            // truth for the rule). GitHub honors ONLY close/closes/closed,
            // fix/fixes/fixed, resolve/resolves/resolved — an Italian verb ("Chiude
            // #N", "Chiusa da #N", "Risolve #N") or an English gerund ("Closing #N")
            // reads as closure to a human and closes NOTHING: the issue stays open
            // forever with the fix already on `main`. The detection already existed
            // in the lib (reused by the deterministic review/merge gates)
            // but never reached a PR opened through the normal `## LGTM` review path
            // — real recurrence (issue #5784): PR #5776 said `Chiude #5725` and #5725
            // stayed open until closed by hand; same shape on #5724, near-miss on
            // #5774. This block closes that gap for every PR, not just drift-fallback
            // ones.
            // Masks fenced/inline code + HTML comments FIRST, same reason as check 3
            // below: GitHub does not act on a keyword inside code formatting, and a
            // body that merely DOCUMENTS the bug (this one, or the PR template) would
            // otherwise false-positive on itself. Newlines survive the mask (blanks
            // replace non-newline chars) so line numbers still point at the real line.
            const maskQuotedKeepLines = (t) => String(t || '').replace(
              /```[\s\S]*?```|~~~[\s\S]*?~~~|<!--[\s\S]*?-->|`[^`\n]*`/g,
              (m) => m.replace(/[^\n]/g, ' '),
            );
            const MD_GAP = '(?:[^\\S\\n]|[:*_`\\[])*';
            const EFFECTIVE_RE = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\b${MD_GAP}(${REF})`, 'gi');
            // The Italian verbs (measured recurrence) plus the English near-misses
            // that share the failure mode. Deliberately NOT here: `addresses`, `see`,
            // `related to`, `refs`, `part of` — those mean "connected to", and
            // flagging them would punish a body that legitimately just NAMES an
            // issue without intending to close it.
            const INTENT_KW =
              '(?:chiud(?:e|ono|er[àa]|iamo)|chius[aoie]|risolv(?:e|ono|iamo)|risolt[aoie]|' +
              'fixa(?:ta|to)?|corregg(?:e|ono)|corrett[aoie]|' +
              'closing|fixing|resolving|solves|solved|completes|completed)';
            // A PAST-TENSE report ("già chiusa da #66", "was fixed by #66") states
            // something ELSE already closed the ref — not this PR's intent.
            const PAST_REPORT_RE = /\b(?:gi[àa]'?|already|was|were|sono\s+stat[ei]|[èe]'?\s+stat[ao])\s*$/i;
            // A NEGATED report ("non chiusi: #849 resta aperta") states the ref
            // stays OPEN — the opposite of an intent. Without it this check tells
            // the author to close an issue the same sentence declares open.
            // `\p{L}` with `u`, not `\w`: `\w` is ASCII and `non è chiusa #849`
            // broke the chain at the accent. The lookahead keeps `Non solo
            // chiude #12` reportable — that phrasing concedes the closure.
            const NEG_REPORT_RE = /\b(?:non|n[éè]|not|never|mai|senza|without)(?!\s+(?:solo|soltanto|only)\b)(?:\s+[\p{L}\p{N}_'’]+){0,2}\s*$/iu;
            const INTENT_FILLER = "(?:\\s+(?:da|by|the|la|il|lo|le|gli|l'|anche|definitivamente|finalmente|completamente|parzialmente))*";
            const INTENT_RE = new RegExp(`\\b(${INTENT_KW})\\b${INTENT_FILLER}${MD_GAP}(${REF})`, 'gi');

            const maskedBodyForIntent = maskQuotedKeepLines(body);
            const willCloseRefs = new Set();
            for (const m of maskedBodyForIntent.matchAll(new RegExp(EFFECTIVE_RE.source, EFFECTIVE_RE.flags))) {
              willCloseRefs.add(m[1].toLowerCase());
            }
            const rawBodyLinesForIntent = body.split(/\r?\n/);
            const intentViolations = [];
            const intentReported = new Set();
            maskedBodyForIntent.split(/\r?\n/).forEach((mline, i) => {
              for (const m of mline.matchAll(new RegExp(INTENT_RE.source, INTENT_RE.flags))) {
                const ref = m[2];
                const before = mline.slice(Math.max(0, m.index - 24), m.index);
                if (PAST_REPORT_RE.test(before)) continue; // "già chiusa da #66" ≠ intent
                if (NEG_REPORT_RE.test(before)) continue; // "non chiusi: #849" ≠ intent
                if (willCloseRefs.has(ref.toLowerCase())) continue; // a real keyword already reaches it
                if (intentReported.has(ref.toLowerCase())) continue; // one report per ref
                intentReported.add(ref.toLowerCase());
                intentViolations.push({ line: i + 1, text: (rawBodyLinesForIntent[i] ?? mline).trim(), ref, keyword: m[1] });
              }
            });

            // --- 3) Closes #N targeting a multi-item follow-up aggregate ------------
            // `Closes #N` is GitHub-native and fires on MERGE, BYPASSING the
            // reconcile multi-item-auto-close veto (FOLLOWUP.md — that veto lives in
            // the daily cron, not in the merge-close path). Closing a 5-item aggregate
            // because ONE item was fixed (the fixer circuit-breaker does 1 item/run)
            // marks residual work COMPLETED while items stay due (real recurrence:
            // #3050 fixed item 5/5 yet `Closes #3036` closed the 5-item aggregate).
            // FULL mirror of isAggregate() — single source scripts/ci/check-issue-already-resolved.mjs:
            // an explicit "N item(s) deferred" count is authoritative once present
            // (a single-item follow-up whose title merely contains the ordinary word
            // "batch"/"sweep"/"bulk" — e.g. "1 item deferred ... batch backfill..." —
            // must not be misclassified as an aggregate, #3378); the sweep/batch/bulk
            // keyword fallback only applies when NO count is stated (aggregates that
            // enumerate N targets WITHOUT the count, e.g. "Sweep: ~30 crawlers" #1826).
            const isAggregateTitleBody = (t, b) => {
              function stripFencedBlocks(text) {
                const lines = String(text || '').split('\n');
                const out = [];
                let fence = null;
                let fenceStart = -1;
                for (let i = 0; i < lines.length; i++) {
                  const line = lines[i];
                  const match = /^([ \t]*)(`{3,}|~{3,})/.exec(line);
                  if (fence) {
                    const closes = match
                      && match[2][0] === fence.char
                      && match[2].length >= fence.length
                      && match[1].length >= fence.indent;
                    if (closes) fence = null;
                    continue;
                  }
                  if (match) {
                    fence = { char: match[2][0], length: match[2].length, indent: match[1].length };
                    fenceStart = i;
                    continue;
                  }
                  out.push(line);
                }
                return fence ? [...out, ...lines.slice(fenceStart)].join('\n') : out.join('\n');
              }
              function maskInlineCodeSpans(text) {
                return String(text || '').replace(/(`+)([^`\n]*?)\1/g, (span) => span.replace(/[^\n]/g, ' '));
              }
              function isBoldTitleLead(rest, lines = [], start = 0) {
                const bold = /^\*\*(?![ \t])(?:[^*]|\*(?!\*))+\*\*/;
                let candidate = String(rest || '');
                if (bold.test(candidate)) return true;
                for (let i = start; i < lines.length; i++) {
                  const line = lines[i];
                  if (/^[ \t]*(?:\d+[.)]|[-*])[ \t]+/.test(line)) break;
                  candidate += '\n' + line;
                  if (bold.test(candidate)) return true;
                }
                return false;
              }
              function hasEnumeratedItems(body) {
                const clean = stripFencedBlocks(body);
                if ((clean.match(/^#{2,3}[ \t]*(?:Item[ \t]*)?(?!\d{4}\b)\d+[ \t]*[.)—–]/gim) || []).length >= 2) return true;
                const lines = clean.split('\n');
                let ordered = 0;
                let bullets = 0;
                for (let i = 0; i < lines.length; i++) {
                  const orderedMatch = /^[ \t]*\d+[.)][ \t]+(.*)$/.exec(lines[i]);
                  if (orderedMatch && isBoldTitleLead(orderedMatch[1], lines, i + 1)) ordered++;
                  const bulletMatch = /^[-*][ \t]+(?:\[[ xX]\][ \t]*)?(.*)$/.exec(lines[i]);
                  if (bulletMatch && isBoldTitleLead(bulletMatch[1], lines, i + 1)) bullets++;
                }
                return ordered >= 2 || bullets >= 2;
              }
              const title = maskInlineCodeSpans(stripFencedBlocks(t));
              const m = title.match(/\b(\d+)\s+items?\s+deferred\b/i);
              if (m) return Number(m[1]) >= 2;
              const bodyText = maskInlineCodeSpans(stripFencedBlocks(b));
              if (/\b(?:sweep|batch|bulk)\b/i.test(title + '\n' + bodyText)) return true;
              return hasEnumeratedItems(b);
            };
            // Strip code-formatted text first: GitHub does NOT honour a closing
            // keyword inside a fenced block or inline `code` span, so neither should
            // we — otherwise a body that merely DISCUSSES `Closes #N` (docs, this very
            // PR, a fix-instruction example) false-positives. Real fixer closes are
            // plain text on their own line.
            const bodyNoCode = body
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/`[^`\n]*`/g, ' ');
            // In-repo closing refs only (bare `#N`; owner/repo#N never auto-closes here).
            // `:?` tolerates the colon form `Closes: #N`, which GitHub also honours.
            const CLOSE_SINGLE = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+#(\d+)\b/gi;
            const closingNums = [...new Set([...bodyNoCode.matchAll(CLOSE_SINGLE)].map((m) => m[1]))];

            const { owner, repo } = context.repo;
            const issue_number = prNumber;

            // --- 1c) ADVISORY: funnel-critical files changed but never cited in the
            // body (#6301, reproduced on #6279: the diff touched
            // `.github/workflows/prospector-loop.yml` and the body never named it in
            // any section — neither this gate nor scripts/lib/pr-body-sections-check.mjs
            // compared the diff's file list against the body text, only checked that
            // `## Implementato` had SOME content. Uses `pulls.listFiles` (no checkout
            // needed — unlike the sibling-check/below-floor-bridge steps further down,
            // which DO need the tree). Advisory only, same reasoning as the
            // bullet-without-state warning in pr-body-sections-check.mjs: promoting
            // straight to blocking risks repeating the 2026-08-12 13h stall documented
            // there, before PR bodies reliably cite every touched file.
            const FUNNEL_CRITICAL_PATH_RE = /^\.github\/workflows\//;
            let uncitedFiles = [];
            try {
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: issue_number, per_page: 100,
              });
              uncitedFiles = prFiles
                .map((f) => f.filename)
                .filter((p) => FUNNEL_CRITICAL_PATH_RE.test(p))
                .filter((p) => !body.includes(p) && !body.includes(p.split('/').pop()));
            } catch (e) {
              core.info(`uncited-files check: skip (${e.status || e.message})`);
            }
            const advisoryParts = [];
            if (uncitedFiles.length) {
              advisoryParts.push(
                `⚠️ **File funnel-critical non citati nel body** (issue #6301, advisory — non blocca) — ` +
                `il diff modifica ${uncitedFiles.length} file sotto \`.github/workflows/**\` che il body non menziona ` +
                `(né per path né per basename):\n\n` +
                uncitedFiles.map((p) => `- \`${p}\``).join('\n') + '\n\n' +
                `Aggiungi un bullet in \`## Implementato\` che li cita (recidiva reale: PR #6279, ` +
                `\`.github/workflows/prospector-loop.yml\` modificato e mai menzionato, flaggato dal reviewer solo dopo il fatto).`,
              );
            }

            // Fetch each closed issue; flag the multi-item follow-up aggregates.
            // Proceed-safe: any API error → skip that ref (never block on infra).
            const aggregateCloseViolations = [];
            for (const num of closingNums) {
              try {
                const { data: iss } = await github.rest.issues.get({
                  owner, repo, issue_number: Number(num),
                });
                if (iss.pull_request) continue; // a PR ref, not a tracking issue
                const labels = (iss.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
                if (!labels.includes('follow-up')) continue;
                if (isAggregateTitleBody(iss.title || '', iss.body || '')) {
                  aggregateCloseViolations.push({ num, title: iss.title || '' });
                }
              } catch (e) {
                core.info(`aggregate-close check: skip #${num} (${e.status || e.message})`);
              }
            }

            // Find a prior sticky comment to update (avoid comment spam on edits).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c => (c.body || '').includes(STICKY));

            const upsert = async (b) => {
              if (prior) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body: b });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: b });
              }
            };

            // --- All-clear (violations) — advisories can still be present -----------
            if (missing.length === 0 && sectionViolations.length === 0 && decisionViolations.length === 0 && closesViolations.length === 0 && intentViolations.length === 0 && aggregateCloseViolations.length === 0) {
              const okBody = `${STICKY}\n✅ **PR-body contract OK** — sezioni obbligatorie presenti e compilate, nessun \`Closes\` multi-issue su una riga, nessuna keyword di chiusura inefficace, nessun \`Closes\` su follow-up aggregata.`
                + (advisoryParts.length ? `\n\n${advisoryParts.join('\n\n')}` : '');
              // Solo un prior da aggiornare, oppure un advisory reale da segnalare per
              // la prima volta: un all-clear puro (nessun prior, nessun advisory) non
              // vale un commento nuovo.
              if (prior || advisoryParts.length) {
                await upsert(okBody);
              }
              core.info(`PR body contract satisfied.${advisoryParts.length ? ' (advisory: uncited files)' : ''}`);
              return;
            }

            // --- Build the verdict --------------------------------------------------
            const parts = [STICKY];
            const fails = [];
            if (missing.length) {
              parts.push(
                `🔴 **PR-body contract** — mancano: ${missing.join(', ')}.\n\n` +
                `Il completeness contract (REVIEW.md / AGENTS.md § Workflow) richiede i due header letterali ` +
                `\`## Implementato\` e \`## Non implementato (ancora)\`. ` +
                `Header alternativi (\`## Fix\`, \`## Verify\`, \`## Effetto\`) non contano.`,
              );
              fails.push(`missing section(s): ${missing.join(', ')}`);
            }
            if (sectionViolations.length) {
              parts.push(
                `🔴 **Sezione presente ma vuota** (escalation #3250, bucket \`reviewer-finding/pr-body-contract\`) — ` +
                `header letterale trovato ma senza contenuto sostanziale (solo bullet placeholder \`- \` del template):\n\n` +
                sectionViolations.map((m) => `- ${m}`).join('\n') + '\n\n' +
                `Scrivi almeno un bullet concreto in \`## Implementato\`; in \`## Non implementato (ancora)\` scrivi ` +
                `"Nessuno" (task completo, AGENTS.md #8) oppure elenca gli item residui con stato/next-step.`,
              );
              fails.push(`empty section(s): ${sectionViolations.length}`);
            }
            if (decisionViolations.length) {
              parts.push(
                `🔴 **Deroga decisionale non specifica** — una voce in ` +
                `\`## Non implementato (ancora)\` usa uno stato terminale senza ` +
                `una causa e un'azione verificabili nello stesso bullet:\n\n` +
                decisionViolations.map((m) => `- ${m}`).join('\n') + '\n\n' +
                `Completa la voce con \`**Motivo:** <causa concreta>. **Prossimo passo:** ` +
                `<azione concreta>\`.`,
              );
              fails.push(`decision deferral(s): ${decisionViolations.join('; ')}`);
            }
            if (closesViolations.length) {
              const lines = closesViolations
                .map((v) => `- L${v.line}: \`${v.text}\` → chiude solo #${v.nums[0]}, ignora #${v.nums.slice(1).join(', #')}`)
                .join('\n');
              parts.push(
                `🔴 **Closes multi-issue su una riga** — GitHub chiude SOLO la prima issue dopo una keyword ` +
                `(\`Closes\`/\`Fixes\`/\`Resolves\`); le altre restano aperte e vanno chiuse a mano (cfr. PR #1320: 9 issue su una riga → 8 rimaste aperte).\n\n` +
                `${lines}\n\n` +
                `Fix: una keyword per issue, una per riga:\n\`\`\`\nCloses #${closesViolations[0].nums[0]}\nCloses #${closesViolations[0].nums[1]}\n\`\`\``,
              );
              fails.push(`multi-issue Closes line(s): ${closesViolations.map((v) => `L${v.line}`).join(', ')}`);
            }
            if (intentViolations.length) {
              const lines = intentViolations
                .map((v) => `- L${v.line}: \`${v.text}\` → \`${v.keyword} ${v.ref}\` non chiude niente`)
                .join('\n');
              parts.push(
                `🔴 **Keyword di chiusura inefficace** (issue #5784) — GitHub riconosce SOLO ` +
                `\`close/closes/closed\`, \`fix/fixes/fixed\`, \`resolve/resolves/resolved\`; un verbo italiano ` +
                `(\`chiude\`/\`chiusa\`/\`risolve\`/\`fixa\`...) o l'inglese al gerundio (\`closing\`/\`fixing\`) è prosa ` +
                `e non chiude nulla — l'issue resta aperta con la fix già su \`main\` (recidiva reale: PR #5776 → ` +
                `#5725 rimasta aperta finché non è stata chiusa a mano; stesso difetto su #5724, quasi su #5774).\n\n` +
                `${lines}\n\n` +
                `Fix: usa la keyword inglese per ognuno, es. \`Closes ${intentViolations[0].ref}\`. Se non intendevi ` +
                `chiudere quella issue (solo nominarla), usa \`Refs\`/\`Vedi\` invece di un verbo di chiusura.`,
              );
              fails.push(`ineffective closing keyword: ${intentViolations.map((v) => `L${v.line}`).join(', ')}`);
            }
            if (aggregateCloseViolations.length) {
              const lines = aggregateCloseViolations
                .map((v) => `- \`Closes #${v.num}\` → #${v.num} è una follow-up **aggregata multi-item** ("${v.title.slice(0, 80)}")`)
                .join('\n');
              parts.push(
                `🔴 **Closes su follow-up aggregata multi-item** — \`Closes #N\` è GitHub-native e chiude #N al MERGE, ` +
                `bypassando il veto multi-item-auto-close di \`FOLLOWUP.md\` (che vive nel cron \`reconcile\`, non nel path Closes-on-merge). ` +
                `Il fixer lavora 1 item/run (circuit-breaker): un fix parziale NON deve chiudere l'aggregata, gli altri item restano dovuti ` +
                `(recidiva #3050 → #3036: item 5/5 fixato ma l'issue 5-item chiusa COMPLETED).\n\n${lines}\n\n` +
                `Fix: togli la keyword di chiusura e usa un **progress-ref** senza \`Closes/Fixes/Resolves\` ` +
                `(es. \`Addresses item N di #${aggregateCloseViolations[0].num}\`). Chiudi l'aggregata SOLO quando TUTTI gli item sono fatti, elencandoli in \`## Implementato\`.`,
              );
              fails.push(`Closes on multi-item aggregate: #${aggregateCloseViolations.map((v) => v.num).join(', #')}`);
            }
            // Advisory, NON entra in `fails`/`setFailed` — vedi il commento sul blocco
            // che calcola `advisoryParts` più sopra.
            if (advisoryParts.length) parts.push(...advisoryParts);
            parts.push(`Aggiorna la PR description (vedi \`.github/pull_request_template.md\`) — il prossimo run sul codice rivalida la descrizione corrente.`);

            await upsert(parts.join('\n\n'));
            core.setFailed(`PR body contract: ${fails.join('; ')}`);

      # The bounded ledger candidate is classified before checkout. Its policy
      # and every dependency it needs are downloaded from `main`, never read
      # from the untrusted PR tree. A trusted, exact ledger-only result posts
      # the required check and skips the checkout/npm/test path below; mixed or
      # known non-matches stay on the ordinary path, while unverifiable input
      # fails closed.
      - name: Bootstrap trusted bounded-ledger policy (no checkout)
        id: ledger_policy
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.user.type == 'Bot' && github.event.pull_request.user.login == 'frontaliere-automation[bot]' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'chore/loop-fleet-ledger' || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L0-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L1-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L2-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L3-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L4-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L5-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L6-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L7-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L8-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L9-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L10-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-L11-') || startsWith(github.head_ref, 'chore/loop-fleet-ledger-lifecycle-')) && steps.body_contract.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy_root="${RUNNER_TEMP}/ledger-fast-policy"
          mkdir -p "$policy_root/scripts/ci/lib" "$policy_root/scripts/lib" "$policy_root/functions/src" "$policy_root/data/loop-fleet"
          download_main() {
            local path="$1"
            local destination="$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${POLICY_REF}" \
              --header 'Accept: application/vnd.github.raw+json' \
              > "$destination"
          }
          download_main package.json "$policy_root/package.json"
          download_main scripts/ci/review-test-policy.mjs "$policy_root/scripts/ci/review-test-policy.mjs"
          download_main scripts/ci/lib/fetchPrFiles.mjs "$policy_root/scripts/ci/lib/fetchPrFiles.mjs"
          download_main scripts/lib/loop-fleet-contract.mjs "$policy_root/scripts/lib/loop-fleet-contract.mjs"
          download_main scripts/ci/mint-app-token.mjs "$policy_root/scripts/ci/mint-app-token.mjs"
          download_main scripts/lib/githubApiHeaders.mjs "$policy_root/scripts/lib/githubApiHeaders.mjs"
          download_main functions/src/githubApiHeaders.js "$policy_root/functions/src/githubApiHeaders.js"
          download_main data/loop-fleet/loop-registry.json "$policy_root/data/loop-fleet/loop-registry.json"
          echo "POLICY_ROOT=$policy_root" >> "$GITHUB_ENV"
          node --check "$policy_root/scripts/ci/review-test-policy.mjs"

      # This step runs before checkout/npm ci. Exit 10 is a complete known
      # non-match and deliberately falls through to the ordinary path; every
      # other non-zero result is unverifiable and fails closed.
      - name: Classify bounded loop-fleet ledger path
        id: ledger_scope
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_policy.outcome == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          result=$(LOOP_FLEET_REGISTRY_PATH="$POLICY_ROOT/data/loop-fleet/loop-registry.json" node "$POLICY_ROOT/scripts/ci/review-test-policy.mjs" ledger-check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$result"
          case "$status" in
            0)
              echo 'ledger_only=true' >> "$GITHUB_OUTPUT"
              echo 'ledger_status=eligible' >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo 'ledger_only=false' >> "$GITHUB_OUTPUT"
              echo 'ledger_status=not-ledger-only' >> "$GITHUB_OUTPUT"
              echo 'Ledger fast path non applicabile: il percorso ordinario resta attivo.'
              ;;
            *)
              echo "::error::ledger fast path non verificabile (exit $status): job fail-closed."
              exit "$status"
              ;;
          esac

      - name: Mint GitHub App token for bounded ledger review
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only == 'true' && !cancelled() }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node "$POLICY_ROOT/scripts/ci/mint-app-token.mjs"

      # This is the required tests job itself, not a companion check. The
      # policy helper rechecks HEAD, metadata, complete file-list and JSONL
      # immediately before the review mutation.
      - name: Publish bounded ledger-only automatic LGTM
        id: ledger_review
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::bounded ledger review requires the allowlisted App token; no review was posted"
            exit 1
          fi
          LOOP_FLEET_REGISTRY_PATH="$POLICY_ROOT/data/loop-fleet/loop-registry.json" \
            GH_TOKEN="$APP_TOKEN" node "$POLICY_ROOT/scripts/ci/review-test-policy.mjs" ledger-post

      # ── Una run superata muore subito ────────────────────────────────────
      #
      # Misurato il 2026-09-19 sulle ultime 200 run: 23 run PR sono state
      # superate da un nuovo push mentre giravano, 21 delle quali DOPO l'avvio
      # (quindi un controllo della HEAD solo prima del checkout ne avrebbe
      # prese 2). Arrivavano fino a `Resolve PR from pull request`, che fallisce
      # su «PR head changed»: 271 minuti di runner buttati in circa 7 ore.
      #
      # PERCHE' NON `cancel-in-progress`. Il gruppo di concorrenza resta per
      # PR+HEAD e non cancellante (vedi il blocco `concurrency:` e #8862): una
      # cancellazione nativa arriva in QUALSIASI step, compreso
      # `pr-autorebase.mjs`, che lavora su fino a 10 PR ALTRUI e ha una sezione
      # critica non atomica `gh pr close` + `gh pr reopen` — un cancel fra le
      # due lascia chiusa la PR di qualcun altro. Qui invece la run si cancella
      # DA SOLA e solo in una finestra nota: dal checkout fino allo step
      # `Stop superseded-head watcher`, che precede `Resolve PR` e quindi review,
      # autorebase e opt-in all'auto-merge. Oltre quello stop nessun cancel
      # viene piu' chiesto; se uno era gia' partito, la HEAD era gia' cambiata e
      # `Resolve PR` fallisce comunque, quindi nessuno step con effetti esterni
      # parte.
      #
      # Il controllo usa `git ls-remote` su refs/pull/N/head (protocollo git,
      # fuori dal rate limit REST del GITHUB_TOKEN); l'unica chiamata REST e' il
      # cancel. Una run `cancelled` non suona allarmi: il redcheck-fixer parte
      # solo su `failure`, scan-unreported-failures ignora `cancelled`,
      # scan-job-timeouts pretende l'annotazione di timeout, e
      # `Classify cancelled run` la etichetta `superseded` nello Step Summary.
      - name: Start superseded-head watcher
        id: head_watch
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRN: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          WATCH_INTERVAL_S: '15'
        run: |
          set -euo pipefail
          [[ "$PRN" =~ ^[1-9][0-9]*$ ]] || { echo "::warning::PR number non valido: watcher non avviato."; exit 0; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::HEAD non valida: watcher non avviato."; exit 0; }
          dir="${RUNNER_TEMP}/head-watch"
          mkdir -p "$dir"
          # Il watcher lavora da RUNNER_TEMP, non dal workspace: dopo il
          # checkout il workspace e' un repo con il suo
          # `http.https://github.com/.extraheader`, che si SOMMA a quello
          # passato qui e manda due Authorization. Misurato sulla run
          # 35460312069: dopo il checkout nessuna lettura della ref e' andata a
          # buon fine e la run superata e' arrivata a `Resolve PR`.
          cat > "$dir/watch.sh" <<'WATCH_EOF'
          set -u
          cd "$WATCH_DIR" || exit 0
          failures=0
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          while [ ! -e "$WATCH_DIR/stop" ]; do
            sleep "$WATCH_INTERVAL_S"
            [ -e "$WATCH_DIR/stop" ] && exit 0
            if ! line=$(git ls-remote "https://github.com/${REPO}.git" "refs/pull/${PRN}/head" 2>"$WATCH_DIR/ls-remote.err"); then
              failures=$((failures + 1))
              # La prima e poi ogni decima: il log resta leggibile.
              if [ $((failures % 10)) -eq 1 ]; then
                echo "$(date -u +%FT%TZ) ls-remote fallito ($failures): $(head -c 300 "$WATCH_DIR/ls-remote.err")"
              fi
              continue
            fi
            current=${line%%[[:space:]]*}
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || continue
            [ "$current" = "$HEAD_SHA" ] && continue
            [ -e "$WATCH_DIR/stop" ] && exit 0
            printf '%s\n' "$current" > "$WATCH_DIR/superseded-by"
            echo "$(date -u +%FT%TZ) PR #$PRN head ${HEAD_SHA:0:12} -> ${current:0:12}: cancel della run $RUN_ID"
            gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/cancel" --silent || echo "cancel non riuscito"
            exit 0
          done
          WATCH_EOF
          WATCH_DIR="$dir" nohup setsid bash "$dir/watch.sh" > "$dir/watch.log" 2>&1 < /dev/null &
          printf '%s\n' "$!" > "$dir/pid"
          echo "Watcher avviato sulla HEAD ${HEAD_SHA:0:12} di PR #$PRN (ogni ${WATCH_INTERVAL_S}s)."

      # `git checkout` scrive l'albero con un thread solo per default (issue
      # #6152). Misurato in locale sull'albero pieno di questo repo: 51,0s ->
      # 37,4s (-27%) impostando `checkout.workers 0` (= usa tutti i core).
      # `actions/checkout` esegue un `git checkout` normale e rispetta la config
      # globale, quindi basta impostarla PRIMA del passo. Rischio zero: non
      # cambia cosa viene scaricato o scritto, solo quanti thread lo scrivono.
      - run: git config --global checkout.workers 0
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}

      # CHECKOUT UNICO per tutte e quattro le famiglie del percorso ordinario;
      # il ledger-only verificato sopra lo salta deliberatamente. Il perché di questo
      # profilo esatto — albero pieno + storia profonda + `tree:0` — sta in
      # «Il checkout: uno solo» nella testata. In breve: i source guard del
      # contract diffano a tre punti e senza storia non hanno un merge-base
      # (`resolve-merge-base.mjs` andrebbe in blocking-skip, issue #5195, cioè
      # il guard direbbe «NON ESEGUITO» a ogni run); vitest vuole l'albero
      # intero; `fetch-depth: 0` senza `filter:` sarebbe il clone da 15 GB.
      #
      # `tree:0` invece di `blob:none` (2026-09-19). Il grafo dei commit resta
      # completo (123.789 commit, 32 MB), quindi merge-base, `rev-list --count`,
      # il `git merge` e il push di `pr-autorebase.mjs` funzionano come prima; a
      # non arrivare piu' sono gli 1,22 milioni di tree storici, cioe' il grosso
      # dei ~414 MB che `blob:none` scaricava a ogni run. I tree che servono
      # davvero (HEAD, base, merge-base) arrivano pigri e a lotti: misurato su
      # un clone treeless di questo repo, `ls-tree -r` di un commit = 2 fetch,
      # 1 s; `diff` fra commit distanti 300 = 4 fetch, 5 s; `merge-tree` di un
      # ramo 750 commit indietro = 5 fetch, 3 s; push del merge risultante = 0
      # fetch. Cio' che NON si puo' fare qui e' una storia per path
      # (`git log -- <path>`, `rev-list -- <path>`): 186 fetch in 120 s senza
      # finire. Nessuno step di questo job, e nessuno script o test che il job
      # esegue sul repo reale, lo fa; `tests/ci-tests-treeless-checkout.test.ts`
      # tiene l'elenco degli script chiamati sotto quel vincolo.
      #
      # NB: con `fetch-depth: 0` `actions/checkout` scarica tutta la storia del
      # ref che gli è stato chiesto, ma NON crea `refs/remotes/origin/<base>` —
      # per questo gli step che ne hanno bisogno continuano a fare il fetch
      # esplicito con il refspec di destinazione (issue #6058). Quel fetch ora è
      # quasi gratis: i commit ci sono già, manca solo il NOME.
      - uses: actions/checkout@v5
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        with:
          fetch-depth: 0
          filter: tree:0
          # Allowlist non-cone: il job usa tsc e Vitest con riferimenti runtime
          # che il profilo statico non può chiudere in modo affidabile.
          sparse-checkout: |
            /.github/
            /.githooks/
            /build-plugins/
            /components/
            /functions/
            /hooks/
            /infra/
            /scripts/
            /server/
            /services/
            /tests/
            /packages/*/engine/
            /packages/*/src/
            /packages/*/tests/
            # These are the two symlink targets needed by tsc and the related
            # import graph. Keep them file-scoped: including the parent
            # `packages/articles/content/` would materialize the full article
            # corpus in this CI checkout.
            /packages/articles/content/blog-articles-data.ts
            /packages/articles/content/swiss-articles-data.ts
            /packages/articles/content/blogArticleIds.ts
            /packages/articles/content/routerBlogData.ts
            /packages/articles/content/routerSwissData.ts
            /packages/articles/content/blogImageCdnMirror.ts
            /packages/articles/content/blog-meta-*.ts
            /packages/articles/content/seo/seo-blog*.ts
            # Runtime reads selected by the related-test graph when locale
            # bundles change. The services/locales/blog-body symlink is in the
            # checkout, but its corpus target is otherwise excluded.
            /packages/articles/content/blog-body/*/assistente-ai-frontalieri.ts
            /packages/articles/content/blog-body-ch/de/naturalizzazione-canton-san-gallo-procedura.ts
            /packages/articles/content/blog-body-ch/de/tassi-interesse-svizzera-bassi.ts
            # Type-only dependency imported by the SEO modules above; keep it
            # file-scoped so the article corpus remains excluded.
            /packages/articles/content/seo/seoMetadataType.ts
            /packages/articles/index.ts
            /packages/articles/articleSections.ts
            /data/
            !/data/translation-cache/
            !/data/orphan-enriched-data/
            !/data/jobs-snapshots-history/
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/evidence-index.json
            # related-search-candidates.json e slug-registry.json restano IN
            # checkout: due test del suite blocking li leggono da filesystem
            # con un path runtime (resolve(__dirname, ...)), invisibile
            # all'analisi statica degli import di verify-checkout-profiles.mjs
            # (lo stesso "punto cieco" gia' documentato per npm-run-chain in
            # checkout-profile-analyzer.mjs:199-205, issue #6234). Escluderli
            # qui fa fallire SEMPRE tests/seo/related-search-clusters-emitted.test.ts
            # e tests/seo/cathedral-slug-registry-canton-backfill.test.ts non
            # appena il selettore related li sceglie — indipendentemente dal
            # contenuto del diff — bloccando PR che non c'entrano nulla con
            # questi due file (osservato su PR #6661/#6662, 2026-08-29).
            /public/
            !/public/images/
            # Stesso punto cieco di related-search-candidates.json/slug-registry.json
            # sopra: send-job-alerts.mjs (usato dal test email di alert lavoro)
            # fa fs.readdirSync('public/images/brands') a module-load per
            # costruire la mappa slug->logo — un path runtime,
            # invisibile a verify-checkout-profiles.mjs. Con la directory esclusa il
            # readdirSync fallisce (try/catch silenzioso -> Map vuota) e OGNI test
            # "brand logo" del file fallisce, indipendentemente dal diff (osservato
            # su #6682 e #6686, 2026-08-30, nessuno dei due tocca questo codice).
            # Piccolo: 483 file, ~1.2 MB — nulla a che vedere con le decine di GB
            # di public/images/ escluse per il resto.
            /public/images/brands/
            /*.cjs
            /*.js
            /*.json
            /*.md
            /*.mjs
            /*.ts
            /*.tsx
            /*.yaml
            /*.yml
            /*.config.*
            # Stesso punto cieco di related-search-candidates.json sopra: due test
            # leggono un doc sotto /docs/ (bucket escluso, 108 MB/706 file) con un
            # path runtime — invisibile a verify-checkout-profiles.mjs. `/*.md`
            # sopra copre i doc di root (ISSUES.md, REVIEW.md, ecc., osservato
            # rosso su #6699 2026-08-30: readFileSync ISSUES.md ENOENT), ma
            # docs/FIX-ISSUE-COMMAND.md resta sotto il bucket escluso senza
            # questo carve-out puntuale.
            /docs/FIX-ISSUE-COMMAND.md
            /docs/preferred-sources-checklist.md
            # Stesso punto cieco: tests/longform-docs-match-renderer.test.ts
            # legge questi due doc con `readFileSync(join(process.cwd(), rel))`
            # — un path runtime, invisibile all'analisi statica degli import.
            # E' l'invariante doc<->renderer di #7359 (cap/gap/soglia H2 citati
            # nella prosa devono coincidere con services/articleAdDensity.ts):
            # senza il carve-out il file muore in import con ENOENT e il job
            # esce rosso con «no tests» (osservato su #7555, 2026-09-05).
            /docs/ads-placement-longform.md
            /docs/editorial-longform-audit.md
            # Runtime `fs.readFileSync(ROOT, 'index.html'/'index.css')` reads in
            # tests/bfs-depth-hub-link-coverage.test.ts and tests/events-card-atoms.test.ts
            # — invisible to verifyCheckoutProfiles' import-graph analysis (it only
            # resolves static imports, not runtime path strings), so this gap
            # shipped silently until the sparse profile actually excluded them.
            /index.html
            /index.css
            # Several related tests read this root file at runtime rather than
            # importing it, so the dependency is invisible to the graph.
            /firestore.rules
            /storage.rules
            /.gitignore
            /.npmrc
            /package-lock.json
            /package.json
            /tsconfig*.json
            /vitest.config.ts
            # The reviewer must be able to read the two repository contracts;
            # keep them explicit so this job still excludes unrelated docs and
            # the full article corpus.
            /REVIEW.md
            /AGENTS.md
          sparse-checkout-cone-mode: false

      # UNA sola invocazione (erano tre) nel percorso ordinario; il ledger-only
      # verificato sopra salta anche questa installazione. Niente `--ignore-scripts`: lo usava il
      # solo job `collision`, che non eseguiva codice del repo; qui la stessa
      # install serve a `tsc` e a vitest, che le dipendenze complete le vogliono.
      - name: Setup Node.js + npm ci (una volta per tutte e quattro le famiglie)
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        uses: ./.github/actions/ci-npm-setup

      - name: Cache Vitest/Vite transform cache
        id: vitest-cache
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules/.vite-independent
            node_modules/.vite-dependent
            node_modules/.cache/node-compile
            .cache/vitest-related
          key: vitest-transform-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', '.github/workflows/tests.yml') }}
          restore-keys: |
            vitest-transform-${{ runner.os }}-

      - name: Cache TypeScript incremental state
        # `tsc --noEmit` mantiene il controllo completo, ma riusa il grafo e
        # le diagnostiche dei file invariati tra run dello stesso ramo. Il
        # compilatore verifica hash/opzioni prima del riuso; la cache è quindi
        # una misura di performance, non una scorciatoia del gate.
        id: tsc-cache
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/tsc
          key: tsc-incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'scripts/ci/check-typecheck-baseline.mjs') }}
          restore-keys: |
            tsc-incremental-${{ runner.os }}-

      # --- Source guards share the code checkout ----------------------------
      # Qui stava un secondo `actions/checkout@v5` (`fetch-depth: 0`,
      # `filter: blob:none`, `ref: head.sha`) tutto per questi guard. È stato
      # RIMOSSO perché il checkout condiviso in testa al job porta già la storia
      # profonda che il diff a tre punti richiede — è lo stesso profilo, promosso
      # da questa famiglia a tutto il job.
      #
      # Una differenza reale, e va detta: quel checkout prendeva `ref:
      # ${{ github.event.pull_request.head.sha }}`, il condiviso prende il ref di
      # default, cioè il merge ref della PR. Per i guard è equivalente o meglio:
      # il merge-base fra il commit di merge e `origin/<base>` è la punta di
      # base, quindi `origin/<base>...HEAD` resta esattamente il diff della PR, e
      # l'albero scandito è il risultato MERGIATO invece dell'head crudo.
      # `!cancelled()` così girano anche dopo un `setFailed` del body-contract
      # (sono cancelli indipendenti).
      # Sibling-class surfacer (zero-agent, ADVISORY — never fails). Il finding
      # reviewer più ricorrente dopo il body-contract è il 🔴 "stesso antipattern
      # nel file gemello" (sibling-class-fix). check-sibling-patterns.mjs calcola
      # i candidati in modo deterministico; lo step posta una sticky comment così
      # (a) l'autore la vede PRIMA della review, (b) il reviewer non rifà la grep.
      - name: Surface sibling candidates
        id: sib
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (!cancelled() && github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Explicit destination refspec (sibling of issue #6058, tests.yml): a
          # bare `git fetch origin "$BASE_REF"` only updates FETCH_HEAD, never
          # `refs/remotes/origin/$BASE_REF` — this checkout is of the PR head
          # SHA (`ref: ${{ github.event.pull_request.head.sha }}` above), so
          # that ref was never created either. `--base "origin/$BASE_REF"`
          # below therefore never resolved, and resolve-merge-base.mjs's
          # blocking-skip (issue #5195) fired on every run instead of the
          # sibling analysis actually running.
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" --quiet || true
          node scripts/ci/check-sibling-patterns.mjs --base "origin/$BASE_REF" --json > sibling-report.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('sibling-report.json','utf8'));
            console.log('candidates=' + r.candidates.length);
          " >> "$GITHUB_OUTPUT"
      - name: Post sibling-check comment (advisory)
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (!cancelled() && github.event_name == 'pull_request') }}
        # ADVISORY: posta un commento sticky, non decide nulla. Senza le due
        # righe qui sotto una 500 TRANSITORIA dell'API GitHub sulla
        # `listComments` faceva fallire lo step e con lui l'INTERO job
        # `contract` — cioe' il gate di merge — su una PR il cui body era
        # gia' conforme. Misurato il 2026-08-12: #5663 e #5667 rosse nello
        # stesso minuto con `HttpError: fetch failed / status: 500` su
        # GET /issues/<n>/comments. Costo reale: un giro di review in piu',
        # che qui vuole una vitest da ~18 minuti, ed e' una delle vie per cui
        # una PR sana finisce etichettata `stale-review`.
        #
        # `retries` copre il caso transitorio: github-script NON esenta i 5xx
        # (retry-exempt-status-codes = 400/401/403/404/422), quindi una 500
        # viene ritentata. `continue-on-error` e' la rete sotto: nemmeno un
        # guasto persistente dell'API deve poter arrossare un gate di merge
        # per un commento consultivo.
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const STICKY = '<!-- sibling-check -->';
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('sibling-report.json', 'utf8'));
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c => (c.body || '').includes(STICKY));

            // Issue #5195: `skipped` = l'analisi NON è girata (merge-base non
            // calcolabile). Cadeva nel ramo `!candidates.length` e postava
            // «✅ Sibling-check OK», cioè un all-clear affermativo per uno sweep
            // mai eseguito — il reviewer smetteva di cercare proprio quando
            // nessuno aveva guardato. Ramo esplicito e sticky sempre creato.
            if (report.skipped) {
              const body = `${STICKY}\n🚫 **Sibling-check NON ESEGUITO** — \`${report.reason || 'merge-base non calcolabile'}\` ` +
                `(base \`${report.base}\`). Nessun file gemello è stato verificato: **non è un via libera**. ` +
                `Il sweep AGENTS.md #6 va fatto a mano su questa PR, oppure rilancia il job con una base risolvibile.`;
              if (prior) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              core.warning(`sibling-check skipped: ${report.reason || 'unresolvable-merge-base'} — nessun sibling verificato.`);
              return;
            }

            if (!report.candidates.length) {
              // All-clear: aggiorna lo sticky se esisteva (diff cambiato), mai crearne uno nuovo.
              if (prior) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id,
                  body: `${STICKY}\n✅ **Sibling-check OK** — nessun file gemello non toccato condivide i costrutti modificati da questo diff.`,
                });
              }
              core.info('No sibling candidates.');
              return;
            }

            const TOP = 10;
            // I candidati arrivano gia' ordinati forte-prima (check-sibling-patterns,
            // 2026-09-05), quindi questi TOP 10 sono i piu' agganciati e non i primi
            // in ordine alfabetico. `[debole]` = un solo identificatore nudo condiviso:
            // resta da guardare, ma e' il secchio dove sta quasi tutto il rumore.
            const rows = report.candidates.slice(0, TOP).map(c =>
              `- ${c.strength ? '**[' + c.strength + ']** ' : ''}\`${c.file}\` — costrutti condivisi: ${c.tokens.slice(0, 5).map(t => '\`' + t + '\`').join(', ')}`
            ).join('\n');
            const more = report.candidates.length > TOP
              ? `\n…e altri ${report.candidates.length - TOP} candidati (run locale: \`node scripts/ci/check-sibling-patterns.mjs\`).`
              : '';
            const body = [
              STICKY,
              `⚠️ **Sibling-check** (advisory, euristico — AGENTS.md #6 / bucket \`sibling-class-fix\`): ` +
              `${report.candidates.length} file NON toccati da questa PR condividono costrutti che il diff modifica. ` +
              `Per ciascuno: stesso antipattern? → fix nella STESSA PR, oppure giustifica in \`## Non implementato\`.`,
              rows + more,
              `_Candidati ≠ verdetto: il token-match surfaca, non conferma. Ricalcolato a ogni push._`,
            ].join('\n\n');

            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Below-floor-bridge surfacer (zero-agent, ADVISORY — never fails; issue
      # #3659, escalated bucket reviewer-finding/canonical-sitemap). The ONE
      # sub-pattern of that bucket with a proven, prose-didn't-prevent-it
      # recurrence (#3594's own reviewer found 5 more untouched sibling loops
      # in the same file after the fix pattern was introduced): a canton-scoped
      # SSG generation loop that `continue`s past a job-count floor/threshold
      # without emitting the documented noindex bridge (AGENTS.md § Static SEO
      # Pages). check-below-floor-bridge.mjs surfaces candidates deterministically
      # (scans the FULL current content of touched build-plugins/*.ts files, not
      # just the diff hunk — the recurrence was caught in untouched siblings of a
      # touched file) plus a self-map drift check (new bridge call added without
      # touching searchConsoleCompat.ts).
      - name: Surface below-floor-bridge candidates
        id: bfb
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (!cancelled() && github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Explicit destination refspec (sibling of issue #6058, tests.yml): a
          # bare `git fetch origin "$BASE_REF"` only updates FETCH_HEAD, never
          # `refs/remotes/origin/$BASE_REF` — this checkout is of the PR head
          # SHA (`ref: ${{ github.event.pull_request.head.sha }}` above), so
          # that ref was never created either. `--base "origin/$BASE_REF"`
          # below therefore never resolved, and resolve-merge-base.mjs's
          # blocking-skip (issue #5195) fired on every run instead of the
          # sibling analysis actually running.
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" --quiet || true
          node scripts/ci/check-below-floor-bridge.mjs --base "origin/$BASE_REF" --json > below-floor-bridge-report.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('below-floor-bridge-report.json','utf8'));
            console.log('gapFiles=' + r.gapsByFile.length);
          " >> "$GITHUB_OUTPUT"
      - name: Post below-floor-bridge comment (advisory)
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (!cancelled() && github.event_name == 'pull_request') }}
        # Stessa classe dello step sibling-check qui sopra, stessa fix: e'
        # advisory, quindi non deve poter far cadere il gate `contract`.
        # Tenerne uno solo protetto lascerebbe la meta' del difetto in piedi.
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const STICKY = '<!-- below-floor-bridge-check -->';
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('below-floor-bridge-report.json', 'utf8'));
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c => (c.body || '').includes(STICKY));

            const hasGaps = report.gapsByFile && report.gapsByFile.length > 0;
            const selfMap = report.selfMap;

            // Issue #5195, stesso difetto del sibling-check qui sopra.
            if (report.skipped) {
              const body = `${STICKY}\n🚫 **Below-floor-bridge check NON ESEGUITO** — \`${report.reason || 'merge-base non calcolabile'}\` ` +
                `(base \`${report.base}\`). Nessun loop è stato analizzato: **non è un via libera**.`;
              if (prior) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              core.warning(`below-floor-bridge skipped: ${report.reason || 'unresolvable-merge-base'}.`);
              return;
            }

            if (!hasGaps && !selfMap) {
              if (prior) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id,
                  body: `${STICKY}\n✅ **Below-floor-bridge check OK** — nessun loop canton-scoped con floor/soglia + \`continue\` senza bridge, nessun nuovo bridge senza tocco a \`searchConsoleCompat.ts\`.`,
                });
              }
              core.info('No below-floor-bridge candidates.');
              return;
            }

            const gapRows = (report.gapsByFile || []).map(f =>
              `- \`${f.file}\`\n${f.gaps.map(g => `  - L${g.line}: \`${g.guard}\``).join('\n')}`
            ).join('\n');
            const selfMapRow = selfMap ? `\n\n⚠️ ${selfMap.message}` : '';
            const body = [
              STICKY,
              `⚠️ **Below-floor-bridge check** (advisory, euristico — AGENTS.md § Static SEO Pages / issue #3659): ` +
              (hasGaps ? `${report.gapsByFile.length} file con possibile below-floor-bridge omission.` : ''),
              gapRows + selfMapRow,
              `Il guard salta la pagina senza emettere un bridge noindex? → estendi renderBelowFloorBridge/emit*BelowFloorBridge ` +
              `+ il self-map in \`searchConsoleCompat.ts\` nella STESSA PR, oppure giustifica in \`## Non implementato\`.`,
              `_Candidato ≠ verdetto: regex-match, non AST. Ricalcolato a ogni push._`,
            ].join('\n\n');

            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # These source gates are independent and have no outputs consumed by
      # later steps. Run them concurrently inside one documented `run` step;
      # `continue-on-error` lets the remaining diagnostics run, while the
      # collector near the end makes any failure blocking.
      - name: Run source guards in parallel
        id: source-guards
        continue-on-error: true
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && !cancelled() && steps.body_contract.outcome != 'failure' }}
        env:
          RUN_BROWSER_GRAPH: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_WEBHOOK_BOUNDARY: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_ADSENSE: ${{ steps.body_contract.outcome != 'failure' && github.event_name == 'pull_request' }}
          RUN_LOOKBEHIND: ${{ steps.body_contract.outcome != 'failure' && github.event_name == 'pull_request' }}
          RUN_NUMBER_ENV_FALLBACK: ${{ steps.body_contract.outcome != 'failure' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group') }}
        run: |
          set +e
          state_dir="${RUNNER_TEMP}/tests-source-guards"
          mkdir -p "$state_dir"
          pids=()
          labels=()
          start_gate() {
            local label="$1"
            shift
            "$@" > "$state_dir/$label.log" 2>&1 &
            pids+=("$!")
            labels+=("$label")
          }
          if [ "$RUN_BROWSER_GRAPH" = "true" ]; then
            start_gate browser-graph node scripts/ci/assert-browser-graph-node-free.mjs
          fi
          if [ "$RUN_WEBHOOK_BOUNDARY" = "true" ]; then
            start_gate webhook-boundary node scripts/ci/assert-webhook-ranking-imports.mjs
          fi
          if [ "$RUN_ADSENSE" = "true" ]; then
            start_gate adsense node scripts/ci/check-cls-ad-slots.mjs
          fi
          if [ "$RUN_LOOKBEHIND" = "true" ]; then
            start_gate lookbehind node scripts/ci/check-client-lookbehind.mjs
          fi
          if [ "$RUN_NUMBER_ENV_FALLBACK" = "true" ]; then
            start_gate number-env-fallback node scripts/ci/check-number-env-fallback.mjs
          fi
          failures=0
          for i in "${!pids[@]}"; do
            status=0
            wait "${pids[$i]}" || status=$?
            echo "[${labels[$i]}] exit=$status"
            cat "$state_dir/${labels[$i]}.log"
            if [ "$status" -ne 0 ]; then
              failures=1
            fi
          done
          exit "$failures"

      # Blocking gate (escalation #1954, bucket reviewer-finding/cls-layout 6×/14d):
      # forbid hard-coded AdSense <ins> in build-plugins. Only adSlotHtml() may emit
      # the raw ad markup; its min-height/format come from the registry
      # services/adsenseSlots.ts so the reserved space matches the real ad unit →
      # zero CLS (the #1910 280-vs-400px regression). Zero-Claude, exits 1 on
      # violation. Also covered by tests/check-cls-ad-slots.test.ts in the vitest gate.
      # Gli ultimi due gate sono script node indipendenti fra loro e da tutto il
      # resto: non producono output consumati da altri step, leggono solo il
      # working tree e il loro unico effetto è far fallire il job. Girano quindi
      # in `background:` sovrapposti ai due "Post ... comment" sopra, che sono
      # I/O verso l'API GitHub. Un gate rosso fa comunque fallire il job (stesso
      # comportamento verificato live su post-deploy-validate-live, probe run
      # 28352247167); il `wait-all` sotto li rijoina prima della fine del job.
      # Blocking gate (#1996 → #1999): forbid regex lookbehind ((?<=/(?<!) in
      # client-bundled source. Older Safari/WebKit throws "invalid group specifier
      # name" at parse time → crashed job-detail render for Google Jobs traffic (lost
      # ad impressions). build-plugins/ + scripts/ are build-time (Node) → exempt.
      # Comment-aware; zero-Claude. Also covered by tests/check-client-lookbehind.test.ts.
      # Blocking gate (#7300 → #7344): forbid `Number(process.env.X || N)`. The
      # fallback INSIDE Number() only applies when the variable is unset, so a
      # non-numeric value yields NaN — which never throws and quietly removes
      # caps, concurrency limits and deadlines. `Number(process.env.X) || N` is
      # fine (NaN is falsy there). Correct form: intFromEnv() from
      # scripts/lib/int-from-env.mjs. Comment-aware; zero-Claude. Also covered
      # by tests/int-from-env.test.ts.
      # NB: niente `if:` qui, ed è una constatazione, non una dimenticanza. Un
      # primo tentativo gli aveva messo la stessa condizione dei due
      # `background:` qui sopra (rijoinare solo ciò che si è forkato, dato che
      # nel job fuso questo step gira anche su push mentre prima il job
      # `contract` era `pull_request`-only). GitHub ha rifiutato l'intero file:
      # run 32936857718, `failure` con ZERO job, cioè la firma del workflow
      # invalido. Uno step `wait-all` accetta `name` e `wait-all`, non `if`.
      # Il join a vuoto su push è comunque innocuo: senza step in background da
      # attendere non c'è niente da aspettare.
      #
      # Quella lezione ora ha un guard, invece di vivere solo in questo
      # commento: `tests/workflow-background-wait-schema.test.ts` rifiuta
      # qualunque chiave diversa da `name`/`wait-all` su uno step di join, su
      # TUTTI i workflow (51 join e 1.223 `background:` su 245 file, misurato
      # 2026-08-26). Serviva un guard proprio perché nessuno degli attrezzi che
      # si usano per validare un workflow in locale conosce queste due chiavi:
      # actionlint, un `YAML.parse` e lo schema JSON di Actions tacciono tutti
      # su un file che GitHub rifiuterà, e il rifiuto non arriva come errore di
      # sintassi ma come una run `failure` con ZERO job — cioè, su questo file,
      # il gate di merge che semplicemente non esiste per quel commit.
      # ══════════════════════════════════════════════════════════════════════
      # FAMIGLIA 2/4 — typecheck (ex job `typecheck (tsc --noEmit)`, #5540)
      # Vite compila con esbuild, che le annotazioni di tipo le RIMUOVE senza
      # verificarle: senza questo gate un errore di tipo attraversa build, deploy
      # e produzione senza un solo segnale. Il gate NON è a zero — confronta con
      # `data/typecheck-baseline.json` e fallisce solo su un errore NUOVO fuori
      # da `tests/` (razionale completo nella testata dello script).
      #
      # Era un job a sé «perché infilarlo dentro vitest farebbe dipendere l'unico
      # segnale che governa l'auto-merge da un secondo attrezzo» (#5540). Quella
      # dipendenza ora è VOLUTA e su decisione del proprietario: è precisamente
      # ciò che rende il typecheck bloccante per la prima volta (issue #5552).
      # `tests/typecheck-gate-wired.test.ts` fissa il nuovo contratto.
      #
      # NODE_OPTIONS è a livello STEP, non di job: `tsc` tiene l'intero program
      # in memoria (4,4 GB di RSS misurati sull'albero completo) e su un job a sé
      # la variabile stava sul job. Metterla sul job fuso la imporrebbe anche a
      # vitest, che oggi gira senza — un cambio di comportamento non richiesto.
      #
      # È IN `background:`, ed è il primo di un gruppo di sei cancelli
      # deterministici che girano tutti insieme invece che in fila. 67s
      # misurati su run 32939112340, cioè il 6,3% del job e il terzo costo dopo
      # il checkout (254s) e i due gruppi vitest (678s). Niente lo trattiene in
      # un ordine: legge solo i sorgenti, non scrive niente che un altro step
      # consumi, e il suo unico effetto è far fallire il job.
      #
      # NON C'È UN JOIN INTERMEDIO A CHIUDERLO PRIMA DELLA SUITE, ed è una
      # scelta di principio: un `wait-all` esprime una DIPENDENZA fra task, non
      # una precauzione. Fra questi sei cancelli e l'assemble non c'è nessuna
      # dipendenza — l'assemble non legge niente che loro producano — quindi un
      # join lì in mezzo direbbe il falso sul grafo e ritarderebbe la suite per
      # una ragione che non è sua. Vengono rijoinati in fondo, insieme agli
      # altri background, dal «Wait for background vitest + memory sampler».
      #
      # La conseguenza va detta, perché è reale e accettata: `tsc` tiene 4,4 GB
      # di RSS, il runner ne ha 16, e ora quei 4,4 GB stanno accanto ai DUE
      # pool di vitest invece che da soli. Un campionatore di `MemAvailable`
      # era stato aggiunto per rendere quel margine un numero, ed era stato
      # tolto (follow-up #6573): era uno step in background con un timer
      # proprio (350 `sleep 5`, ~29 min), quindi a suite rossa teneva il job
      # appeso al join per la durata del suo `sleep` invece di morire subito
      # col resto. Il rifacimento (`scripts/ci/sample-mem-during.sh`) avvolge
      # il comando osservato invece di girargli accanto: il sampler è un
      # processo separato che muore nell'istante in cui `wait` sul PID di
      # `tsc` sblocca — successo o fallimento — non dopo un conteggio fisso di
      # iterazioni. Il numero finisce nel log come `[mem-sample] MemAvailable
      # min=…MB max=…MB`.
      # ══════════════════════════════════════════════════════════════════════
      - name: Start independent source gates
        id: independent-gates
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && !cancelled() && steps.body_contract.outcome != 'failure' }}
        env:
          RUN_TSC: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_AUDIT_MARKERS: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_ACTION_RUNTIMES: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_INPUT_INJECTION: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_LOCALE_SEGMENTS: ${{ steps.body_contract.outcome != 'failure' }}
          RUN_EVERGREEN_TOPICS: ${{ steps.body_contract.outcome != 'failure' }}
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/tests-independent-gates"
          mkdir -p "$state_dir"
          expected_labels=()
          if [ "$RUN_TSC" = "true" ]; then
            expected_labels+=(tsc)
          fi
          if [ "$RUN_AUDIT_MARKERS" = "true" ]; then
            expected_labels+=(audit-markers)
          fi
          if [ "$RUN_ACTION_RUNTIMES" = "true" ]; then
            expected_labels+=(action-runtimes)
          fi
          if [ "$RUN_INPUT_INJECTION" = "true" ]; then
            expected_labels+=(input-injection)
          fi
          if [ "$RUN_LOCALE_SEGMENTS" = "true" ]; then
            expected_labels+=(locale-segments)
          fi
          if [ "$RUN_EVERGREEN_TOPICS" = "true" ]; then
            expected_labels+=(evergreen-topics)
          fi
          if [ "${#expected_labels[@]}" -eq 0 ]; then
            echo "::error::independent gate roster is empty"
            exit 1
          fi
          # Write the expected roster before launching anything. If a launcher
          # fails between fork and PID registration, the collector still
          # knows which gate was required and cannot mistake an empty/partial
          # observed roster for a successful run.
          printf '%s\n' "${expected_labels[@]}" > "$state_dir/expected-labels"
          start_gate() {
            local label="$1"
            local command="$2"
            local script="$state_dir/$label.sh"
            cat > "$script" <<EOF
          set +e
          $command
          status=\$?
          status_tmp="$state_dir/$label.status.tmp.\$\$"
          printf '%s\\n' "\$status" > "\$status_tmp"
          mv "\$status_tmp" "$state_dir/$label.status"
          exit "\$status"
          EOF
            chmod +x "$script"
            if command -v setsid >/dev/null 2>&1; then
              # GNU setsid forks when the caller is a process-group leader;
              # --wait keeps the recorded PID alive until the wrapper writes
              # its status file, so the collector cannot mistake that fork
              # for a vanished gate.
              nohup setsid --wait bash "$script" > "$state_dir/$label.log" 2>&1 < /dev/null &
            else
              nohup bash "$script" > "$state_dir/$label.log" 2>&1 < /dev/null &
            fi
            printf '%s\n' "$!" > "$state_dir/$label.pid"
          }
          if [ "$RUN_TSC" = "true" ]; then
            start_gate tsc 'env NODE_OPTIONS=--max-old-space-size=8192 bash scripts/ci/sample-mem-during.sh -- npm run typecheck:gate'
          fi
          if [ "$RUN_AUDIT_MARKERS" = "true" ]; then
            start_gate audit-markers 'npm run audit:no-merge-markers'
          fi
          if [ "$RUN_ACTION_RUNTIMES" = "true" ]; then
            start_gate action-runtimes 'npm run lint:gha-node-runtime'
          fi
          if [ "$RUN_INPUT_INJECTION" = "true" ]; then
            start_gate input-injection 'npm run lint:workflow-input-injection'
          fi
          if [ "$RUN_LOCALE_SEGMENTS" = "true" ]; then
            start_gate locale-segments 'npm run lint:hardcoded-locale-segments'
          fi
          if [ "$RUN_EVERGREEN_TOPICS" = "true" ]; then
            start_gate evergreen-topics 'npm run check:evergreen-comune-topics'
          fi

      # ══════════════════════════════════════════════════════════════════════
# FAMIGLIA 3/4 — vitest related + i lint deterministici che le
      # stavano davanti. È la fetta lunga del job; `!cancelled()` sul primo step
      # perché un rosso in un'altra famiglia non deve nascondere il verdetto
      # dei test.
      #
      # STA PRIMA DELLA FAMIGLIA COLLISION DI PROPOSITO: quella carica i
      # segreti di Remote Config in `$GITHUB_ENV`, che vale per ogni step
      # SUCCESSIVO del job, e questa suite ha test che asseriscono il
      # comportamento a ambiente PULITO. Il perché per esteso, con la misura,
      # sta sulla testata della famiglia 4/4.
      #
      # I CINQUE LINT QUI SOTTO SONO IN `background:`, insieme al `tsc` della
      # famiglia 2/4: sei cancelli deterministici che girano tutti in parallelo
      # invece che in fila. Nessuno dei sei consuma l'output di un altro — sono
      # script node che leggono il working tree e il cui unico effetto è far
      # fallire il job — quindi l'ordine fra loro non porta informazione.
      #
      # In fila costavano 78s (67 di `tsc` + 8+0+1+0+1 di lint, run
      # 32939112340). Ora non costano NIENTE di wall proprio: non c'è un join
      # che li chiuda prima della suite, quindi si sovrappongono all'assemble e
      # a entrambi i gruppi vitest, e vengono rijoinati in fondo al job
      # insieme agli altri background. La regola applicata qui, e che vale per
      # ogni `wait-all` di questo file: si aspetta un task solo quando se ne
      # consuma il RISULTATO. Fra questi sei e la suite non c'è consumo, solo
      # coesistenza.
      #
      # Il costo accettato è diagnostico, non di correttezza: un lint rosso non
      # ferma più il job sulla riga che lo ha causato, emerge al join finale.
      # In cambio un solo giro mostra TUTTI i cancelli rossi invece del primo
      # soltanto — su una catena che prima falliva a cascata, sono rerun in
      # meno. Un cancello rosso resta bloccante: il job fallisce comunque.
      #
      # I due step successivi ai lint hanno invece una dipendenza VERA, ed è la
      # ragione per cui l'ordine qui non è libero: "Fetch base ref" crea
      # `refs/remotes/origin/<base>` per NOME, e sia il gate factuality sia il
      # fallback `git merge-base` dello step corpus-wide lo risolvono per nome.
      # "Decide i gate corpus-wide" scrive poi `skip` su `$GITHUB_OUTPUT`, letto
      # da ENTRAMBI i vitest: un `$GITHUB_OUTPUT` scritto da uno step in
      # background non ha una semantica di raccolta documentata, quindi quello
      # step resta in primo piano per costruzione, non per prudenza.
      # ══════════════════════════════════════════════════════════════════════
      - name: Fetch base ref for the factuality diff
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        # Explicit destination refspec (issue #6058): a bare `git fetch origin
        # <branch>` only updates FETCH_HEAD, it does NOT create the
        # remote-tracking ref `refs/remotes/origin/<branch>`, and
        # `actions/checkout` does not create it either (it fetches the PR merge
        # ref, not `+refs/heads/*`). The gate below reads
        # `origin/${{ github.base_ref || 'main' }}` BY NAME, so the ref has to
        # exist. `|| true`: if it fails the gate degrades to a loud no-op rather
        # than failing the job.
        #
        # `--depth=50` RIMOSSO con la fusione dei quattro job, e non è un
        # ripulisti cosmetico: il checkout condiviso ora è `fetch-depth: 0`,
        # cioè NON shallow, e `git fetch --depth=<n>` su un repo completo non è
        # inerte — scrive `.git/shallow` e TRONCA la storia a quella profondità.
        # Avrebbe re-shallowato il repo a metà job, sotto i piedi del
        # `git merge-base` che gli step più in basso usano come fallback. Senza
        # `--depth` il fetch è quasi gratis: i commit ci sono già dal checkout,
        # qui manca solo il NOME del ref.
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}" || true

      - name: Gate factuality of changed articles
        # Deterministic guard (incident 2026-07-28, article
        # `frontalieri-altre-tasse-2026`): fails if an article body touched by
        # this PR has a blocking factuality defect — broken arithmetic, a tax at
        # or above gross income, the same scenario answered differently in two
        # sections, an invented institution, or contradictory dates for one norm.
        #
        # The same gates run inside create-article.mjs, which covers the LLM
        # generation path the incident came from. This step is the backstop for
        # every OTHER way a body reaches main: hand edits, repair scripts and the
        # other generators. Zero model calls, so it cannot fail open.
        #
        # Each failure prints the required correction. Fix the content — never
        # loosen a threshold or delete the passage to get the gate green.
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        run: node scripts/audit-article-factuality.mjs --changed origin/${{ github.base_ref || 'main' }}

      - name: Collect changed paths (corpus gates delegated to frontaliere-articles)
        # ─── LO SPLIT CORPUS-WIDE (registro: scripts/ci/corpus-wide-tests.mjs)
        #
        # Sette file di test costano 201,4s misurati (run 32172467043): il 20,1%
        # del tempo-file della suite per l'1,2% dei test. Non sono lenti per
        # test — `tests/seo-completeness.test.ts` ne fa 65.750 in 21s — sono
        # lenti perché iterano sull'intero corpus (~14.748 file) o rendono una
        # sezione. Il costo è O(corpus) e cresce da solo a ogni articolo
        # pubblicato, quindi il problema peggiora mentre nessuno tocca niente.
        #
        # NON sono stati tolti né allentati (Non-Negotiable #1). Girano:
        #   - QUI, bloccanti e identici a prima, quando il diff tocca i dati che
        #     scandiscono o il codice che li rende — cioè quando sono il gate
        #     che serve. La decisione è PER-TEST: un diff su
        #     `data/jobs/by-crawler/**` (il caso più frequente del repo) tiene
        #     bloccante il solo `job-locale-consistency`, non tutti e sette;
        #   - su main, sempre, in `.github/workflows/corpus-wide-gates.yml`, che
        #     a rosso apre una issue `Workflow Failure: corpus-wide gates`
        #     chiusa dal reconciler orario `close-recovered-failure-issues.yml`.
        #
        # I rami `push` e `merge_group` producono il proprio diff con l'API
        # compare: non hanno un numero di PR associato, ma ricevono la STESSA
        # valutazione per-diff. Prima di questa configurazione un push che non
        # toccava affatto il corpus faceva
        # comunque ripartire tutti e sette i gate O(corpus) dentro `tests.yml`,
        # e una deriva pura
        # del DATO (es. job-locale-consistency, 25744/77967 = 33,02% contro il
        # tetto 33,00%, misurato 2026-08-24) rendeva rosso il check bloccante
        # `vitest (unit + integration)` su main — il segnale che AGENTS.md
        # tratta come priorità assoluta — per un difetto già tracciato
        # altrove: `corpus-wide-gates.yml` misura questi stessi sette gate in
        # modo indipendente e aveva già aperto la issue #6315 sullo stesso
        # identico fallimento. Duplicare il rosso su `tests.yml` non aggiunge
        # copertura: aggiunge un secondo posto dove main sembra rotto, e uno
        # che — a differenza di corpus-wide-gates.yml — non ha un reconciler
        # `close-recovered-failure-issues` che lo richiuda da solo al verde.
        #
        # FAIL-SAFE: qualunque errore o risposta troncata viene propagato in
        # `changed-paths-status.txt`; related interpreta `error`/`partial` come
        # richiesta di suite completa. Solo un elenco vuoto con stato
        # `complete` può legittimamente produrre zero test.
        id: corpus
        # I gate che scansionano l'intero corpus appartengono al repository
        # `nanakokyobashi-rgb/frontaliere-articles`, che li esegue nel proprio
        # workflow post-merge. Questo step non li esegue: raccoglie il diff e
        # calcola soltanto la lista di test da escludere dal related run.
        # Deve restare attivo perché `run-related-tests.mjs` consuma sempre
        # `changed-paths.txt`, anche quando tutti i gate corpus-wide sono
        # delegati.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # I path toccati arrivano dall'API della PR, non da `git diff`, e la
          # ragione è MISURATA su questa stessa PR (run 32182836022): la prima
          # stesura usava `git merge-base HEAD origin/$BASE_REF` e stampava
          # «merge-base non risolta», cioè non escludeva niente.
          #
          # Perché: allora `actions/checkout@v5` faceva qui un fetch shallow
          # (`fetch-depth: 1`) e NON creava il remote-tracking ref
          # `refs/remotes/origin/main`; due storie shallow possono per giunta
          # non avere una base comune entro la profondità fetchata. L'API non ha
          # nessuno di questi problemi: risponde con l'elenco esatto dei file
          # della PR, senza storia locale.
          #
          # Dalla fusione dei quattro job il checkout è `fetch-depth: 0` e lo
          # step della factuality qui sopra crea `origin/<base>` per nome, per
          # cui il fallback `git merge-base` sotto ORA risolve davvero invece di
          # essere un ramo morto. L'API resta comunque la via primaria: è esatta
          # e non dipende dalla storia locale. Lo stato separato impedisce che
          # un guasto diventi un falso diff vuoto.
          : > changed-paths.txt
          printf '%s\n' unknown > changed-paths-status.txt
          cap=3000
          if [ -n "$PR_NUMBER" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate -q '.[].filename' > changed-paths.txt 2>/dev/null; then
              printf '%s\n' complete > changed-paths-status.txt
            else
              : > changed-paths.txt
              printf '%s\n' error > changed-paths-status.txt
            fi
          elif { [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; } \
            || { [ "$GITHUB_EVENT_NAME" = "merge_group" ] && [ -n "$MERGE_GROUP_BASE_SHA" ]; }; then
            # `compare` invece di `pulls/<n>/files`: un push a main non ha una
            # PR associata (o non è quella che ci interessa — un push può
            # arrivare anche da un commit diretto di un bot/crawler), e una
            # merge queue non ha un numero di PR associato, ma in entrambi i
            # casi
            # confronta comunque due SHA con la stessa identica API, senza
            # bisogno di storia locale. NIENTE `--paginate` qui: la risposta
            # è UN oggetto (nessun Link header da seguire), quindi sarebbe
            # inerte — e la documentazione GitHub (Compare two commits,
            # "Working with large comparisons") dichiara che `files` copre
            # SOLO la prima pagina e si ferma a 300 file, senza un campo di
            # troncamento nel payload. `pulls/<n>/files` è tutt'altro
            # endpoint, paginato per davvero, con un cap più alto (3000):
            # da qui il `cap` per-ramo sotto, review-finding #6339 su questa
            # stessa PR — con la soglia unica ereditata dal ramo PR (3000) un
            # push che tocca più di 300 file (i backfill/migrate su
            # `data/jobs/**` li toccano regolarmente) sarebbe finito sotto
            # quella soglia con un `changed-paths.txt` già troncato in
            # silenzio, ed è esattamente lo scenario che il controllo sotto
            # dichiara di coprire.
            cap=300
            compare_base="$BEFORE_SHA"
            if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
              compare_base="$MERGE_GROUP_BASE_SHA"
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/compare/${compare_base}...${AFTER_SHA}" \
              -q '.files[].filename' > changed-paths.txt 2>/dev/null; then
              printf '%s\n' complete > changed-paths-status.txt
            else
              : > changed-paths.txt
              printf '%s\n' error > changed-paths-status.txt
            fi
          elif [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            # Un evento merge queue senza base_sha non è un diff vuoto: è una
            # misura non disponibile e deve restare fail-safe per il related
            # runner, che lo promuove alla suite completa.
            : > changed-paths.txt
            printf '%s\n' error > changed-paths-status.txt
          else
            printf '%s\n' complete > changed-paths-status.txt
          fi
          if [ ! -s changed-paths.txt ] && [ -n "$PR_NUMBER" ]; then
            echo "API senza risposta utile → fallback su git"
            base="$(git merge-base HEAD "origin/${BASE_REF}" 2>/dev/null || true)"
            if [ -n "$base" ]; then
              if git diff --name-only "$base" HEAD > changed-paths.txt 2>/dev/null; then
                printf '%s\n' complete > changed-paths-status.txt
              else
                : > changed-paths.txt
                printf '%s\n' error > changed-paths-status.txt
              fi
            else
              printf '%s\n' error > changed-paths-status.txt
            fi
          fi
          count="$(wc -l < changed-paths.txt | tr -d ' ')"
          echo "path toccati: $count"
          if [ "$count" = "0" ]; then
            echo "elenco vuoto → related-only senza candidati Vitest"
            exit 0
          fi
          # Sia `pulls/<n>/files` che `compare` troncano su un diff enorme
          # (rispondono 200 con una lista PARZIALE, non un errore, e senza un
          # campo che dichiari il troncamento) — il fail-safe sul fallimento
          # non lo copre: un path corpus caduto oltre il taglio non entra nella
          # selezione related. La soglia
          # è quella del ramo che ha prodotto `changed-paths.txt` ($cap,
          # impostato sopra): 3000 per `pulls/<n>/files` (verificato, quella
          # API pagina per davvero), 300 per `compare` (documentato, "Working
          # with large comparisons": copre solo la prima pagina e non va
          # oltre). Usare 3000 anche sul ramo `compare` — la versione
          # precedente di questo step lo faceva — lascerebbe passare
          # indisturbato un push fra 300 e 2999 file con `changed-paths.txt`
          # già troncato, cioè esattamente il rischio che questo controllo
          # esiste per intercettare. Sopra la soglia si rinuncia a decidere e
          # mantiene comunque il comportamento related-only sul diff disponibile.
          if [ "$count" -ge "$cap" ]; then
            printf '%s\n' partial > changed-paths-status.txt
            echo "elenco al cap dell'API ($count >= $cap): fallback conservativo alla suite completa"
            exit 0
          fi
          decision="$(node scripts/ci/corpus-wide-tests.mjs --gha-output < changed-paths.txt || true)"
          printf '%s\n' "$decision"
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Decide whether dataset assembly is required
        id: assemble
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        # The selector reuses run-related-tests.mjs's real related graph and
        # scripts/ci/dataset-dependent-tests.mjs's existing partition. Its
        # output is only a scheduling decision; the blocking Vitest invocation
        # remains the step below. Any selector error is execution-safe: an
        # unknown answer writes required=true and keeps the gate conservative.
        env:
          CHANGED_PATHS_STATUS_FILE: changed-paths-status.txt
          VITEST_SKIP_CORPUS_WIDE: 'true'
        run: |
          set -euo pipefail
          if node scripts/ci/run-related-tests.mjs --select-only; then
            :
          else
            echo "::warning::related selection could not classify the diff; running Assemble + migrate conservatively"
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (steps.assemble.outputs.required == 'true') }}
        # The assembler prints the key it checks itself: a hashFiles() over a
        # subset of its inputs gave exact hits on stale directories, whose save
        # actions/cache then skipped. See the action for the full reason.
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --stats

      - name: Cache assemble-jobs output
        if: ${{ (steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (steps.assemble.outputs.required == 'true')) && steps.assemble_cache_key.outputs.key != '' }}
        # Mirrors deploy.yml's identical step. assemble-jobs-dataset.mjs has a
        # content-addressable cache under .cache/assemble-jobs (keyed on a
        # sha256 of every slice file, of the assembler's import closure and aux
        # data inputs, + an internal output-version) that restores
        # the assembled outputs in ~0.3s instead of re-running the ~52s
        # assembly. The script's internal version+fingerprint guarantees
        # correctness, so the restore-keys cascade cannot replay a stale
        # jobs.json across slice or assembler changes (cache-miss → full
        # assembly → fresh snapshot).
        uses: actions/cache@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-

      - name: Assemble + migrate
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (steps.assemble.outputs.required == 'true') }}
        # Condizionale, con esecuzione FOREGROUND quando serve. La misura
        # storica (~326s, run 32959864544) che giustificava la posizione
        # foreground presupponeva che "Obsolete pre-assemble test slot" fosse
        # attivo come gruppo background; oggi quello step ha `if: ${{ false }}`.
        # Non c'è quindi più lavoro indipendente dietro cui nascondere il costo:
        # per i diff che richiedono il dataset è wall esposta, mentre i diff
        # classificati indipendenti saltano sia assemble sia migrate.
        #
        # Ed è la differenza che conta: uno step foreground è l'UNICA forma di
        # sincronizzazione SELETTIVA di questo runner. La sua fine gate lo step
        # successivo — "vitest run (test che leggono il dataset)", che dipende
        # davvero da data/jobs.json + slug registry — e per costruzione non può
        # catturare nient'altro. Un `wait-all` messo qui, invece, avrebbe
        # raccolto anche il gruppo indipendente ancora in volo (non ha un join
        # selettivo, verificato: 51 join in 245 workflow, nessuna forma
        # «aspetta solo l'assemble»), rimettendo i due gruppi vitest in fila.
        #
        # Il migrate è concatenato nello stesso `run:`: dipende SOLO da
        # data/jobs.json, mai dai test. bash -eo pipefail (default degli step)
        # aborta prima del migrate se l'assemble è rosso, e uno step foreground
        # rosso ferma il job qui — fail-fast, prima del gruppo dipendente.
        #
        # STORIA DELLA SECONDA METÀ DEL JOB (2026-08-26), perché è cambiata
        # quattro volte in un giorno e senza questo paragrafo sembra indecisione:
        #
        #   1. Sovrapposizione vitest↔vitest introdotta: anche il gruppo
        #      indipendente in background, per farlo correre insieme al
        #      dipendente (entrambi CPU-bound).
        #   2. Revertita: sul run 32948270917 ha fatto scadere
        #      `tests/orphan-enriched-store.test.ts` — timeout a 15s DENTRO una
        #      scansione filesystem, mai arrivato all'assert. La contesa sulle
        #      4 vCPU, prevista come rischio nel PR body, si era materializzata.
        #   3. Reintrodotta con DUE mitigazioni esplicite invece di evitare la
        #      coppia rischiosa — e restano entrambe attive oggi:
        #      (a) quel test ha ora un `timeout` PER-TEST a 180s (il default
        #          globale di 15s resta invariato per gli altri 1.357);
        #      (b) quel test è stato reso ~18x più economico con un pre-filtro
        #          `includes()` prima del parse AST: 7 file parsati invece di
        #          4.918, scan da 3.802ms a 208ms, test da 7.363ms a ~300-980ms
        #          in isolamento locale.
        #      Le due si compensano: il test è molto più veloce E la soglia che
        #      lo giudica è molto più larga.
        #      MA quella forma metteva l'assemble in `background:` seguito da un
        #      `wait-all` DEDICATO piazzato PRIMA del gruppo indipendente, per
        #      impedire al join di catturarlo. Il join quindi attendeva
        #      l'assemble per intero, in una finestra dove NIENTE gli girava
        #      accanto: i ~326s dell'assemble (run 32959864544) da nascosti
        #      erano diventati esposti, sommati davanti a tutto il resto, e il
        #      totale rischiava di essere PEGGIORE del baseline sequenziale.
        #   4. Forma storica finale: il gruppo indipendente parte per PRIMO e
        #      in background, l'assemble torna foreground senza join, e il
        #      dipendente lo segue in fila. Un solo `wait-all`, in fondo.
        #      Quella forma nascondeva l'assemble perché il gruppo esisteva;
        #      oggi il gruppo è disattivato e la condizione sopra evita di
        #      pagare l'assemble sui diff che non selezionano test dipendenti.
        #
        # Il baseline sequenziale contro cui si misura l'overlap è 678s (run
        # 32939112340, verde) per lo span «indipendenti start → dataset end».
        run: |
          node scripts/assemble-jobs-dataset.mjs --stats
          node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: vitest related (PR diff)
        id: vitest_related
        if: ${{ steps.body_contract.outcome != 'failure' && steps.ledger_scope.outputs.ledger_only != 'true' }}
        # FOREGROUND, dopo "Assemble + migrate": i test scelti dal grafo
        # possono leggere i dataset generati. Questo è l'unico invocatore di
        # Vitest del job PR; `run-related-tests.mjs` usa il related graph e un
        # fallback conservativo quando il percorso non è rappresentabile. Il
        # predicato Assemble è l'input del consumer: se dice `false`, il run
        # resta attivo ma viene confinato ai test indipendenti; se manca,
        # l'espressione applica il default fail-safe `true`, mentre un valore
        # inatteso interrompe il consumer invece di usare output non assemblati.
        env:
          ASSEMBLE_REQUIRED: ${{ steps.assemble.outputs.required || 'true' }}
          # Vitest 4's related graph can exceed Node's default 4GB heap in this
          # repository. Keep the graph bounded to one fork and leave headroom
          # on the hosted runner; this does not change the related-only scope.
          NODE_OPTIONS: --max-old-space-size=8192
          VITEST_SKIP_LIVE_DATA: 'true'
          VITEST_MAX_WORKERS: 1
          # Un file sorgente senza edge di import statico verso nessun test
          # (script CLI mai `import`-ato, es. scripts/prospect-validate.mjs)
          # fa scattare in run-related-tests.mjs il fallback "nessun edge →
          # tutta la suite": ~1900 file invece di pochi. Il cap a 1 worker
          # sopra era tarato sul caso comune (grafo related piccolo, poche
          # decine di file); su ~1900 file indipendenti lo stesso cap li
          # serializza su un solo core (osservato: >30 min, PR #6661,
          # 2026-08-30). VITEST_MAX_WORKERS_FALLBACK si applica SOLO quando
          # run-related-tests.mjs segnala di aver usato quel fallback — il
          # percorso related-only comune resta invariato a 1 worker.
          VITEST_MAX_WORKERS_FALLBACK: 3
          VITEST_POOL: forks
          VITEST_CACHE_DIR: node_modules/.vite-related
          CHANGED_PATHS_STATUS_FILE: changed-paths-status.txt
          VITEST_SKIP_CORPUS_WIDE: 'true'
          VITEST_REPORT_FILE: shard-timing-related.json
        run: |
          set -euo pipefail
          case "$ASSEMBLE_REQUIRED" in
            true)
              node scripts/ci/run-related-tests.mjs --reporter=default --reporter=json --outputFile="$VITEST_REPORT_FILE"
              ;;
            false)
              VITEST_DATASET_GROUP=independent \
                node scripts/ci/run-related-tests.mjs --reporter=default --reporter=json --outputFile="$VITEST_REPORT_FILE"
              ;;
            *)
              echo "::error::unexpected Assemble + migrate decision: $ASSEMBLE_REQUIRED"
              exit 1
              ;;
          esac

      # Collect the detached gate processes after the Vitest run. Each process
      # publishes an atomic status file; a missing status from a dead process is
      # a failure, and a non-zero status remains blocking.
      - name: Collect independent source gates
        id: collect-independent-gates
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && always() }}
        run: |
          set +e
          state_dir="${RUNNER_TEMP}/tests-independent-gates"
          failures=0
          if [ "${{ steps.source-guards.outcome }}" = "failure" ]; then
            echo "source guards failed"
            failures=1
          fi
          if [ "${{ steps.independent-gates.outcome }}" != "skipped" ]; then
            expected_file="$state_dir/expected-labels"
            if [ ! -s "$expected_file" ]; then
              echo "::error::independent gate expected roster is missing or empty"
              failures=1
            else
              while IFS= read -r label; do
                [ -n "$label" ] || {
                  echo "::error::independent gate expected roster contains an empty label"
                  failures=1
                  continue
                }
                status_file="$state_dir/$label.status"
                pid_file="$state_dir/$label.pid"
                if [ ! -s "$pid_file" ]; then
                  echo "::error::$label did not publish a PID"
                  failures=1
                fi
                gate_waited=0
                gate_wait_limit=300
                launcher_gone_reported=0
                while [ ! -s "$status_file" ]; do
                  if [ ! -s "$pid_file" ]; then
                    echo "::error::$label cannot be monitored because its PID is missing"
                    failures=1
                    break
                  fi
                  if [ "$gate_waited" -ge "$gate_wait_limit" ]; then
                    echo "::error::$label did not publish a status within ${gate_wait_limit}s"
                    echo "[$label] launcher log:"
                    cat "$state_dir/$label.log" 2>/dev/null || true
                    failures=1
                    break
                  fi
                  pid="$(cat "$pid_file" 2>/dev/null || true)"
                  if ! printf '%s\n' "$pid" | grep -Eq '^[0-9]+$'; then
                    echo "::error::$label published an invalid launcher PID: $pid"
                    echo "[$label] launcher log:"
                    cat "$state_dir/$label.log" 2>/dev/null || true
                    failures=1
                    break
                  fi
                  # The launcher PID is advisory: setsid can hand the actual
                  # wrapper to a child while that child still writes status.
                  # Wait on the atomic status file, but keep the wait bounded.
                  if ! kill -0 "$pid" 2>/dev/null && [ "$launcher_gone_reported" -eq 0 ]; then
                    echo "::warning::$label launcher PID ended; waiting for the wrapper status file up to ${gate_wait_limit}s"
                    launcher_gone_reported=1
                  fi
                  sleep 1
                  gate_waited=$((gate_waited + 1))
                done
                if [ -s "$status_file" ]; then
                  status="$(cat "$status_file" 2>/dev/null || true)"
                  echo "[$label] exit=$status"
                  cat "$state_dir/$label.log" 2>/dev/null || true
                  case "$status" in
                    ''|*[!0-9]*)
                      echo "::error::$label published an invalid exit status: $status"
                      failures=1
                      ;;
                    0) ;;
                    *) failures=1 ;;
                  esac
                fi
              done < "$expected_file"
            fi
          else
            echo "independent gate step skipped; no detached gates were expected"
          fi
          exit "$failures"

      # Il salvataggio post-job di `actions/cache` non parte quando uno step
      # successivo fallisce (per esempio Vitest): TSC può essere verde, ma la
      # sua cache resterebbe vuota. Salviamo subito dopo il join, anche se il
      # verdetto complessivo del job è già destinato al rosso.
      - name: Save TypeScript incremental state
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && steps.tsc-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v5
        with:
          path: .cache/tsc
          key: tsc-incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'scripts/ci/check-typecheck-baseline.mjs') }}

      - name: Save Vitest related graph
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && steps.vitest-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.vite-independent
            node_modules/.vite-dependent
            node_modules/.cache/node-compile
            .cache/vitest-related
          key: vitest-transform-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', '.github/workflows/tests.yml') }}

      - name: Upload related test timing
        # always() so we still collect timings when the run is red (a slow test
        # that times out is exactly the data point we want for re-balancing).
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-timing-related
          path: shard-timing-related.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Report Vitest failures on PR
        # The Vitest step can fail before the review chain; this reporter must
        # still run and must never mask the original gate.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) && steps.vitest_related.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          VITEST_REPORT_FILES: shard-timing-related.json
        run: node scripts/ci/report-vitest-failure.mjs

      # Chiude la finestra di self-cancel PRIMA di review, autorebase e
      # auto-merge (vedi `Start superseded-head watcher`). `always()`: va chiusa
      # anche dopo un rosso, perche' gli step `always()` a valle non devono
      # poter essere interrotti a meta'.
      - name: Stop superseded-head watcher
        if: ${{ always() && steps.body_contract.outcome != 'failure' && steps.head_watch.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          dir="${RUNNER_TEMP}/head-watch"
          touch "$dir/stop"
          pid=$(cat "$dir/pid" 2>/dev/null || true)
          if [[ "$pid" =~ ^[0-9]+$ ]]; then
            kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
          fi
          cat "$dir/watch.log" 2>/dev/null || true
          if [ -s "$dir/superseded-by" ]; then
            echo "::notice::PR head superata da $(head -c 12 "$dir/superseded-by"): run cancellata dal watcher."
          fi

      - name: Resolve PR from pull request
        id: resolve
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRN: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          [[ "$PRN" =~ ^[1-9][0-9]*$ ]] || exit 1
          meta=$(gh pr view "$PRN" --repo "$REPO" --json isDraft,title,labels,headRefOid)
          [ "$(echo "$meta" | jq -r '.headRefOid')" = "$HEAD_SHA" ] || { echo "::error::PR head changed; this run cannot review it."; exit 1; }
          stale_review=$(echo "$meta" | jq -r 'any(.labels[]?; .name == "stale-review")')
          echo "stale_review=$stale_review" >> "$GITHUB_OUTPUT"
          is_draft=$(echo "$meta" | jq -r '.isDraft // false')
          title=$(echo "$meta" | jq -r '.title // ""')
          if [ "$is_draft" = "true" ]; then
            echo "PR #$PRN è draft → skip review."
            { echo "pr_number=$PRN"; echo "should_review=false"; echo "head_sha=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "pr_number=$PRN"
            echo "should_review=true"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "title<<__TITLE_EOF__"
            echo "$title"
            echo "__TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Risolto PR #$PRN (draft=$is_draft) sulla head $HEAD_SHA."

      - name: Re-review guard (one terminal verdict per HEAD)
        id: guard
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (steps.resolve.outputs.should_review == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Count every terminal managed review on this HEAD, not only LGTM.
          # An `edited` body/title event must not launch a second model review
          # on the same SHA (PRs #9066/#9074: LGTM then 🔴 Important).
          reviews=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null || echo '[]')
          # Unica eccezione: un verdetto NON approvante sulla HEAD e un body
          # corretto dopo di esso (retry-code-check-after-body-edit.yml riesegue
          # questa run) ammettono una review `minimal` sul body invece di
          # costringere l'autore a un commit vuoto, che comprava una review
          # piena. `lastEditedAt` e' l'ultima modifica del body; vuoto = mai
          # modificato, e l'eccezione non scatta.
          # shellcheck disable=SC2016 # $owner/$name/$number sono variabili GraphQL, non shell.
          body_edited_at=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){lastEditedAt}}}' \
            -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.lastEditedAt // empty' 2>/dev/null || true)
          decision=$(printf '%s' "$reviews" | node scripts/ci/lib/pr-review-admission.mjs skip --head "$HEAD_SHA" --body-edited-at "${body_edited_at:-none}")
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Determine review tier
        id: tier
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REPO: ${{ github.repository }}
          BODY_REREVIEW: ${{ steps.guard.outputs.body_rereview }}
        # Tier high (gpt-5.6-luna, max-turns 60, adversarial pass): toccato CODE
        # funnel-critical — test gate, workflow CI, build-plugin SEO, o script
        # che mutano/emettono dati indicizzati (crawler/parser/adapter, backfill,
        # migrate, assemble dataset, sitemap/canonical/slug/structured-data).
        # Bug in questi path = falso senso di sicurezza che si propaga su ogni
        # merge, quindi probing rigoroso paga. Tier normal 15->25 (misurato: 13
        # run/7gg morti al cap senza postare review,
        # es. run 27345572135/27340191180 - review intera bruciata + PR ferma
        # fino al rescuer). Tier normal (Codex Luna Max, cap 35) per
        # tutto il resto, inclusi gli script NON-funnel: `scripts/{ci,dev,evals}/`
        # (helper CI/dev) e gli audit/report read-only (`audit-*`, `analytics*`,
        # `*-report` — non mutano l'indice, verificano soltanto). Vedi REVIEW.md
        # → "Tier review".
        #
        # CODE vs DATA: il tier si decide SOLO sui file code. I file dati/static
        # rigenerati (NONCODE_RE) NON sono reviewabili come code → non escalano il
        # tier e una PR data/docs-only resta normal (Codex posta comunque
        # `## LGTM` → auto-merge). Questo evita che 50 `data/jobs/*.json`
        # rigenerati da un crawler trascinino sul tier high o gonfino il diff.
        #
        # Budget 25→40: con l'espansione del contratto (REVIEW.md no-short-circuit
        # su tier high + step 7 perf-claim + escalation ❓ funnel-critical, sopra
        # il cross-file `rg` probing + adversarial check già presenti) il pass
        # tier-high su un diff reale sforava i 25 turni e terminava
        # `error_max_turns` SENZA postare review (PR #838, num_turns=26) — peggio
        # del process gate, perché niente LGTM → PR bloccata e zero finding.
        # Budget 40→60 (2026-07-17, owner): tier high morto di nuovo al cap 40
        # senza verdetto su PR #4324 (run 29556645538) — stessa classe #838.
        # Bump fleet-wide di tutti i tier (cap = anti-runaway sopra il p99 dei
        # run sani, non budget di lavoro; un run che muore al cap brucia la
        # quota intera e lascia la PR ferma, peggio di qualche turno in più).
        # 40 turni ≈ ~5.5 min; 60 ≈ ~8.5 min. Timeout 15min→360min (2026-07-17,
        # #4341): era il vincolo più stretto, uccideva review a metà pass
        # (num_turns morto ma minuti di CI esauriti prima) — vedi job timeout-minutes.
        run: |
          set -euo pipefail
          # Effort per tier: `max` solo dove il contratto chiede probing
          # avversario sull'intero contributo funnel-critical (high,
          # high-mega); `high` per minimal/incremental/normal, che leggono un
          # body, un delta o codice non funnel. Il tier cambiava solo lo
          # scope mentre l'action passava sempre `model_reasoning_effort=max`.
          set_tier() {
            local effort=high
            case "$1" in high|high-mega) effort=max ;; esac
            {
              echo "tier=$1"
              echo "model=$2"
              echo "max_turns=$3"
              echo "effort=$effort"
            } >> "$GITHUB_OUTPUT"
            echo "Review tier: $1 ($2, max-turns $3, effort $effort)"
          }
          # Body corretto sulla stessa HEAD dopo un verdetto non approvante
          # (vedi il guard): il codice e' identico per costruzione, quindi
          # si rigiudica solo il body e i 🔴 di codice restano aperti.
          if [ "${BODY_REREVIEW:-}" = "true" ]; then
            echo "code_unchanged_since=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "Body modificato dopo un verdetto non approvante sulla stessa HEAD → tier minimal (solo body)."
            set_tier minimal gpt-5.6-luna 12
            exit 0
          fi
          # File cambiati dalla PR (per tier). Fallback GraphQL→REST/cap-100 +
          # `expected`/`files_complete` sono nel CLI condiviso
          # `scripts/ci/fetch-pr-files.mjs` (issue #6233: prima erano una
          # reimplementazione shell inline, tenuta allineata a mano alla
          # stessa logica nel gemello `pr-redflag-fixer.yml`).
          result=$(node scripts/ci/fetch-pr-files.mjs --repo "$REPO" --pr "$PR_NUMBER" 2>/dev/null || echo '{}')
          expected=$(echo "$result" | jq -r '.expected // 0')
          count=$(echo "$result" | jq -r '.count // 0')
          files_complete=$(echo "$result" | jq -r 'if .complete then 1 else 0 end')
          reason=$(echo "$result" | jq -r '.reason // "unknown"')
          files=$(echo "$result" | jq -r '(.files // [])[]')
          # Guard PR vuota (rebase-only, base == head): files vuoto. Default tier
          # normal: reviewer posta comunque `## LGTM` (no finding) e auto-merge
          # scatta.
          # `&& files_complete = 1` non e' ridondante: elenco vuoto puo' voler
          # dire «zero file davvero» oppure «i due fetch sono andati muti», e i
          # `2>/dev/null || true` sopra rendono i due casi indistinguibili sullo
          # stdout. Con `changedFiles` a dire 183 e `count` a 0, senza questa
          # congiunzione lo step stampava «rebase-only» — falso — e sceglieva
          # `normal`, scavalcando il guard di incompletezza dieci righe sotto.
          if [ -z "$files" ] && [ "$files_complete" = "1" ]; then
            echo "Empty file list (rebase-only or empty PR)."
            set_tier normal gpt-5.6-luna 35
            exit 0
          fi
          # Elenco incompleto: il tier NON si decide su un campione. Senza questo
          # guard il degrado non è monotono e può finire SOTTO la baseline che il
          # fallback voleva alzare: bastano >100 file non-code in testa
          # all'alfabeto (`data/`, `public/`) perché `code_files` esca vuoto, il
          # ramo `minimal` dichiari «no reviewable code touched» — falso — e una
          # PR che tocca `scripts/` o `src/` passi con 12 turni, senza
          # adversarial check, chiudendo con `## LGTM` e auto-merge.
          if [ "$files_complete" != "1" ]; then
            if [ "$reason" = "rest-hard-limit" ]; then
              echo "Elenco file INCOMPLETO ($count/$expected, causa: rest-hard-limit — tetto rigido di 3000 file della REST GitHub, non riparabile con retry) → tier high forzato: niente minimal, niente decisione funnel su un campione."
            else
              echo "Elenco file INCOMPLETO ($count/$expected, causa: $reason) → tier high forzato: niente minimal, niente decisione funnel su un campione."
            fi
            set_tier high gpt-5.6-luna 60
            exit 0
          fi
          # Strip DATA/static: il tier si decide solo sul CODE.
          if printf '%s' "$result" | node scripts/ci/review-test-policy.mjs only; then
            if node scripts/ci/review-test-policy.mjs check; then
              set_tier tests-only none 0
            else
              # Includes a rename from application code or an uncertain snapshot.
              set_tier high gpt-5.6-luna 60
            fi
            exit 0
          fi
          code_files=$(echo "$files" | node scripts/ci/review-test-policy.mjs filter | grep -vE "$NONCODE_RE" || true)
          if [ -z "$code_files" ]; then
            # Token-lever: una PR data/docs-only (zero code) non ha contributo
            # code-reviewable — l'unica cosa da verificare è il completeness
            # contract del body. Tier `minimal`: Codex Luna Max + cap 12 (8→12
            # nel bump fleet-wide 2026-07-17, il revert-trigger pre-dichiarato) +
            # prompt corto che SALTA la lettura di REVIEW.md, il cross-file
            # probing e l'adversarial check (tutti no-op senza code). Posta
            # comunque `## LGTM` come claude-bot → auto-merge invariato.
            # 12 turni bastano con margine per: leggi body+files, valida
            # contract, posta review (~4-6 turni osservati). REVERT-TRIGGER: se
            # compaiono `error_max_turns` sul tier minimal → bump 12→16.
            echo "Data/docs-only PR (no reviewable code touched) → tier minimal."
            set_tier minimal gpt-5.6-luna 12
            exit 0
          fi
          # funnel_crit <file-list> → exit 0 se la lista contiene CODE funnel-critical
          # (test/CI/build-plugin, o script che mutano/emettono l'indice — tutto
          # scripts/ ECCETTO gli helper non-funnel {ci,dev,evals}/ e gli audit/report
          # read-only). Usato sia per il tier full sia per il delta incrementale.
          funnel_crit() {
            local fs="$1" a b
            a=$(echo "$fs" | grep -E '^(tests/|\.github/workflows/|build-plugins/)' || true)
            b=$(echo "$fs" | grep -E '^scripts/' | grep -vE '^scripts/(ci|dev|evals)/' | grep -viE '(audit|analytics|report)' || true)
            [ -n "$a$b" ]
          }

          # (Rimossa 2026-07-17 la variante crawler_parser_only del 2026-06-30:
          # discriminava SOLO il modello sui diff crawler/parser-only — e il
          # modello è ora UNIFICATO gpt-5.6-luna
          # su ogni tier per decisione owner. Stesso scope e stessi turni.)

          # ── Incremental re-review (token-lever): se esiste GIÀ una review Claude su
          # un commit precedente, valuta SOLO il delta dei file della PR dall'ultimo
          # commit reviewato, non l'intera PR. Il grosso del contributo era già stato
          # reviewato; ri-leggerlo per intero a ogni fix-push brucia token (osservato
          # su #3038: review Opus full ripetute sullo stesso codice). Modello per
          # criticità del DELTA: funnel-critical → tier high/gpt-5.6-luna (rigore,
          # scope ridotto); altrimenti tier incremental (modello sempre gpt-5.6-luna). Prima review /
          # nessun commit precedente / delta vuoto
          # → review piena (sotto). La guardia a monte copre già il caso
          # "stesso input di review"; qui il contributo È cambiato, ma in modo
          # incrementale. Il prompt resta autorizzato a Read/grep i file pieni per il
          # contesto → le interazioni col code non-toccato restano coglibili.
          lastRev=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '[.[] | select((.user.login // "" | test("^(claude\\[bot\\]|frontaliere-automation\\[bot\\])$";"i")))] | last | .commit_id // empty' 2>/dev/null || true)
          if [ -n "$lastRev" ] && [ "$lastRev" != "$HEAD_SHA" ]; then
            delta_code=$(gh api "repos/$REPO/compare/$lastRev...$HEAD_SHA" --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null \
              | grep -Fxf <(echo "$code_files") || true)
            if [ -n "$delta_code" ]; then
              echo "incremental_base=$lastRev" >> "$GITHUB_OUTPUT"
              echo "Incremental re-review: solo il delta dei file PR da $lastRev:"; echo "$delta_code"
              if funnel_crit "$delta_code"; then
                # Keep the historical 35-turn safety margin until a live run
                # proves that the stricter delta-scoped prompt is safe below it.
                set_tier incremental-high gpt-5.6-luna 35
              else
                # Mantieni il cap storico di 35: il bundle riduce il contesto e
                # i turni medi, ma non deve trasformare un delta complesso in un
                # max_turns senza ancora avere una misura live sufficiente.
                set_tier incremental gpt-5.6-luna 35
              fi
              exit 0
            fi
            # Nessun file code della PR e' cambiato dall'ultima review: merge
            # di main, commit vuoto o sola metadata. Se anche il fingerprint
            # del contributo (3-dot vs merge-base, righe +/- dei soli file
            # code: la stessa funzione del review gate) e' identico, il
            # verdetto precedente si riusa: LGTM → carry-forward senza modello,
            # verdetto non approvante → minimal che riporta i 🔴 aperti.
            # Fingerprint non calcolabile o diverso → review piena, come prima.
            fp_head=$(node scripts/ci/pr-contribution-fingerprint.mjs "$HEAD_SHA" 2>/dev/null || echo NULL)
            fp_prior=$(node scripts/ci/pr-contribution-fingerprint.mjs "$lastRev" 2>/dev/null || echo NULL)
            carry=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null \
              | node scripts/ci/lib/review-carry-forward.mjs decide --head "$HEAD_SHA" --prior-commit "$lastRev" \
                  --fp-head "$fp_head" --fp-prior "$fp_prior" || echo 'carry_tier=full')
            carry_tier=$(printf '%s\n' "$carry" | sed -n 's/^carry_tier=//p' | tail -n 1)
            case "$carry_tier" in
              carry-forward)
                printf '%s\n' "$carry" | grep -E '^carry_(prior_review|prior_commit|fingerprint)=' >> "$GITHUB_OUTPUT"
                echo "Nessun delta-code e contributo identico alla review LGTM su $lastRev → carry-forward senza modello."
                set_tier carry-forward none 0
                exit 0
                ;;
              minimal)
                echo "code_unchanged_since=$lastRev" >> "$GITHUB_OUTPUT"
                echo "Nessun delta-code e contributo identico a un verdetto non approvante su $lastRev → tier minimal (body + 🔴 riportati)."
                set_tier minimal gpt-5.6-luna 12
                exit 0
                ;;
            esac
            echo "Nessun delta-code nei file PR dall'ultima review, ma contributo non verificabile o cambiato → review piena."
          fi

          # CODE funnel-critical → high (full scope, 60 turni), altrimenti normal
          # (35 turni). Modello UNIFICATO gpt-5.6-luna su OGNI tier (owner
          # effort max).
          #
          # high-mega (2026-07-17, analisi Fable-5): la coda di PR sovradimensionate
          # (crawler-batch multi-file: #3428 x6 morti, #3355 x5, #3450 x4) muore
          # ripetutamente anche al cap alto e in 2 casi (#3428, #3450) è finita
          # MERGIATA dall'owner senza NESSUNA review mai postata — il gate LGTM
          # degradato a no-review-at-all esattamente sulle PR funnel-critical più
          # grandi. Soglia dimensionale separata dal budget-per-complessità
          # ordinario: non un bump generico, isola la coda misurata.
          code_file_count=$(echo "$code_files" | grep -c . || true)
          if funnel_crit "$code_files"; then
            if [ "$code_file_count" -ge 25 ]; then
              set_tier high-mega gpt-5.6-luna 90
            else
              set_tier high gpt-5.6-luna 60
            fi
          else
            set_tier normal gpt-5.6-luna 35
          fi

      - name: Prefetch review context (zero-Claude, saves turns)
        id: prefetch
        # Gira su TUTTI i tier, `minimal` compreso. Fino alla #6205 questo step
        # era saltato su `minimal` («non legge mai $CTX_DIR»), ma quella stessa
        # PR ha riscritto il prompt `minimal` perche' leggesse `pr.json` e
        # `files.txt`: l'ordine puntava a due file che su quel tier nessuno
        # scriveva, `mkdir -p` compreso. Il reviewer restava senza `title`/`body`
        # — l'unico input del suo compito — e con il divieto esplicito di
        # ripiegare su `gh pr view --json files`. Il risparmio non era nelle tre
        # `gh` call (puro bash, zero Claude) ma nel `gh pr diff`, che su una PR
        # data-only puo' essere enorme: quello resta saltato, sotto.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.tier.outputs.tier != 'tests-only' && steps.tier.outputs.tier != 'ledger-only' && steps.tier.outputs.tier != 'carry-forward' && steps.body_contract.outcome != 'failure' && (steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true') }}
        # Fetch una volta sola, PRIMA che Claude parta, ciò che il prompt gli
        # farebbe rifare turno-per-turno (osservato in 3/3 transcript morti
        # error_max_turns analizzati 2026-07-17: `gh pr view`, `gh pr diff`, il
        # compare incrementale rieseguito 2-3x con --jq diversi, il fetch dello
        # sticky sibling-check — 5-8 turni di setup misurati su un cap di 25).
        # Zero costo Claude: puro bash. Il prompt sotto legge questi file con
        # `Read` invece di rieseguire le stesse `gh` call a ogni turno.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
          REPO: ${{ github.repository }}
          CTX_DIR: ${{ runner.temp }}/review-ctx
          TIER: ${{ steps.tier.outputs.tier }}
          CODE_UNCHANGED_SINCE: ${{ steps.tier.outputs.code_unchanged_since }}
          BODY_CONTRACT_OUTCOME: ${{ steps.body_contract.outcome }}
          REVIEW_DIFF_EXCLUSIONS: data,public,reports,_newsletter_variants,docs
        run: |
          set -uo pipefail
          mkdir -p "$CTX_DIR"
          # `files` esce dal payload GraphQL: è il campo che mente (null sopra il
          # diff oversize, troncato a 100 sopra i 100 file — vedi lo step tier).
          # Il reviewer legge `pr.json` e ha l'ordine esplicito di NON rieseguire
          # `gh pr view`, quindi si sarebbe fidato di una lista corta senza
          # potersene accorgere. L'elenco vero sta in `files.txt`, dalla REST che
          # in quella banda pagina davvero.
          gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body,labels > "$CTX_DIR/pr.json" \
            || echo '{}' > "$CTX_DIR/pr.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            > "$CTX_DIR/files.txt" 2>/dev/null || : > "$CTX_DIR/files.txt"
          # A re-review must see open Important findings from the whole bot-review
          # history, not only the immediately previous body. The gate persists the
          # same path+line anchors; this zero-Claude render gives the reviewer the
          # state it must carry forward before it can write `## LGTM`.
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp \
            > "$CTX_DIR/reviews.json" 2>/dev/null || echo '[]' > "$CTX_DIR/reviews.json"
          node --input-type=module - "$CTX_DIR/reviews.json" > "$CTX_DIR/inherited-findings.md" <<'NODE' || echo 'Sezione storica non disponibile.' > "$CTX_DIR/inherited-findings.md"
          import { readFileSync } from 'node:fs';
          import { historicalImportantFindings } from './scripts/ci/review-gate.mjs';

          const pages = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const findings = historicalImportantFindings(pages, { includeLatest: true });
          if (findings.length === 0) {
            console.log('Nessun finding Important storico ancora aperto.');
          } else {
            for (const finding of findings) {
              const anchors = finding.citations.map((citation) =>
                `${citation.path}${citation.line ? `:L${citation.line}` : ''}`,
              ).join(', ');
              console.log(`- Open Important (${anchors || 'anchor non risolvibile'}):`);
              console.log(finding.text);
              console.log('');
            }
          }
          NODE
          # `minimal` = PR data/docs-only, ZERO code: il diff esce vuoto per
          # costruzione (gli `--exclude` coprono proprio quei path) e il fetch
          # su una PR da migliaia di file dati non e' gratis. Il file esiste
          # comunque, cosi' un `Read` non fallisce.
          # Su una review incrementale il diff completo è inutile e può essere
          # enorme: il bundle contiene solo delta.patch, che è la superficie
          # realmente da rivalutare rispetto alla precedente review.
          if [ "${TIER:-}" = "minimal" ]; then
            : > "$CTX_DIR/diff.patch"
          else
            # Resolve/hydrate the complete scoped patch on the host. A missing
            # patch must fail here, not force the model to rebuild it via API.
            node scripts/ci/prefetch-review-diff.mjs || exit 1
          fi
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body // "" | contains("<!-- sibling-check -->"))] | last | .body // empty' \
            > "$CTX_DIR/sibling-check.md" 2>/dev/null || true
          # Claude non ha bisogno dell'elenco completo dei file dati/statici:
          # per la review servono il body, il diff code e i file code toccati.
          # Tenere fuori i path rigenerati riduce il contesto senza alterare la
          # decisione del tier, gia' calcolata sopra sul payload REST completo.
          node scripts/ci/review-test-policy.mjs filter < "$CTX_DIR/files.txt" | grep -vE "$NONCODE_RE" > "$CTX_DIR/code-files.txt" || : > "$CTX_DIR/code-files.txt"
          if [ -n "${INCREMENTAL_BASE:-}" ]; then
            # Incremental Claude context is strictly delta-scoped. The full PR
            # list remains available only to the zero-Claude tier calculation.
            node scripts/ci/review-test-policy.mjs filter < "$CTX_DIR/delta-files.txt" | grep -vE "$NONCODE_RE" > "$CTX_DIR/review-code-files.txt" || : > "$CTX_DIR/review-code-files.txt"
          else
            cp "$CTX_DIR/code-files.txt" "$CTX_DIR/review-code-files.txt"
          fi
          # The sibling check is advisory and is already posted separately.
          # Repeating its potentially large sticky comment in every
          # incremental context caused needless reads and token usage.
          if [ -n "${INCREMENTAL_BASE:-}" ]; then
            printf '%s\n' 'Advisory sibling-check omitted for incremental review; inspect it only if the supplied delta directly intersects a flagged pattern.' \
              > "$CTX_DIR/sibling-signal.md"
          else
            cp "$CTX_DIR/sibling-check.md" "$CTX_DIR/sibling-signal.md" 2>/dev/null \
              || echo "No sibling-check signal available." > "$CTX_DIR/sibling-signal.md"
          fi
          # Unico input Claude: assembla una fotografia deterministica del
          # contesto già raccolto, così il reviewer fa un solo Read iniziale e
          # non ricostruisce il contesto con gh/grep in turni successivi.
          {
            echo "# PR review bundle"
            echo
            echo "## Metadata"
            echo "- PR: #$PR_NUMBER"
            echo "- HEAD: $HEAD_SHA"
            echo "- Tier: ${TIER:-unknown}"
            echo "- Incremental base: ${INCREMENTAL_BASE:-none}"
            echo "- Changed file entries: $(wc -l < "$CTX_DIR/files.txt")"
            echo "- Changed code file entries (full PR, tier only): $(wc -l < "$CTX_DIR/code-files.txt")"
            echo "- Review code file entries (delta-scoped when incremental): $(wc -l < "$CTX_DIR/review-code-files.txt")"
            echo "- Code diff lines: $(wc -l < "$CTX_DIR/diff.patch")"
            echo
            echo "## PR metadata"
            cat "$CTX_DIR/pr.json"
            echo
            if [ -n "${CODE_UNCHANGED_SINCE:-}" ]; then
              echo "## Code contribution unchanged"
              echo "The PR code contribution is identical to the one reviewed at ${CODE_UNCHANGED_SINCE} (same contribution fingerprint, no PR code file changed since). This is a body-only re-review: judge only the PR body, carry every historical code Important below verbatim with its anchor, and never write \`Fix di\` for a code anchor."
              echo
            fi
            echo "## Deterministic body contract"
            if [ "${BODY_CONTRACT_OUTCOME:-}" = "success" ]; then
              echo "✅ passed on the current body (sections, bullet states, Motivo/Prossimo passo, placeholders, Closes). The body cannot produce a 🔴 Important in this review: at most a 🟡 Nit anchored as \`PR body:L<n>\`."
            else
              echo "Verdict unavailable (${BODY_CONTRACT_OUTCOME:-unknown}): apply the REVIEW.md body rules."
            fi
            echo
            echo "## Historical open Important findings"
            cat "$CTX_DIR/inherited-findings.md"
            echo
            echo "## Changed code-file list"
            cat "$CTX_DIR/review-code-files.txt"
            echo
            echo "## Code-only diff"
            cat "$CTX_DIR/diff.patch"
            echo
            echo "## Incremental delta"
            if [ -f "$CTX_DIR/delta.patch" ]; then cat "$CTX_DIR/delta.patch"; else echo "No incremental base: this is a full review."; fi
            echo
            echo "## Sibling-check signal"
            cat "$CTX_DIR/sibling-signal.md"
          } > "$CTX_DIR/review-bundle.md"
          echo "Prefetched review context in $CTX_DIR:"
          ls -la "$CTX_DIR"

      - name: Mint GitHub App token for Codex review
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.tier.outputs.tier != 'ledger-only' && steps.body_contract.outcome != 'failure' && (steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true') }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Publish automatic LGTM for a tests-only PR
        id: test_only_review
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && success() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.tier.outputs.tier == 'tests-only' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: node scripts/ci/review-test-policy.mjs post

      - name: Publish carry-forward LGTM (code contribution unchanged)
        id: carry_forward_review
        # Zero modello: il tier step ha provato che nessun file code della PR
        # e' cambiato dall'ultima review LGTM e che il fingerprint del
        # contributo e' identico. Lo script rilegge PR e review, rifa' la
        # stessa verifica e pubblica sulla HEAD esatta con il token App (la
        # stessa identita' del reviewer). Il review gate sotto la riverifica
        # da capo; senza token App lo step fallisce e il gate resta rosso.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && success() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.tier.outputs.tier == 'carry-forward' }}
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          CARRY_PRIOR_REVIEW: ${{ steps.tier.outputs.carry_prior_review }}
          CARRY_PRIOR_COMMIT: ${{ steps.tier.outputs.carry_prior_commit }}
          CARRY_FINGERPRINT: ${{ steps.tier.outputs.carry_fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::Token App assente: il carry-forward non puo' pubblicare con l'identita' del reviewer. Rilancia la run."
            exit 1
          fi
          GH_TOKEN="$APP_TOKEN" node scripts/ci/lib/review-carry-forward.mjs post

      - name: Run Codex Luna Max review
        # Tetto sullo step (classe #7310: nessun tetto sotto il cap del job →
        # morte `cancelled` che nessun `if: failure()` vede). Qui il cap del job
        # è 360min ed è CONDIVISO con la suite vitest: un reviewer appeso se la
        # mangerebbe tutta. 45min sono ~10x il massimo misurato sulle ultime 6
        # run (91-263s), quindi non tocca nessuna review reale; con il
        # `continue-on-error` sotto, lo scadere non tinge il job di rosso.
        timeout-minutes: 45
        id: codex_review
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.tier.outputs.tier != 'tests-only' && steps.tier.outputs.tier != 'ledger-only' && steps.tier.outputs.tier != 'carry-forward' && steps.body_contract.outcome != 'failure' && (steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true') }}
        # Don't let a hard action failure abort the job before the guard below
        # can classify it — the guard decides whether to fail loudly.
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
        with:
          # `github_token` alimenta gli helper provider-neutral della action e
          # conserva il fallback lifecycle; il bridge host-side della review
          # può postare una review che riattiva auto-merge e quindi usa solo
          # App/PAT. Il mint fallisce soft, ma il bridge resta fail-closed.
          github_token: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          codex_github_token: ${{ env.APP_TOKEN || env.GITHUB_PAT }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          review_marker: '<!-- CODEX_FALLBACK_REVIEW -->'
          # Per-tier effort from the tier step; `max` when the tier step did
          # not emit one, so a missing output never lowers the effort.
          reasoning_effort: ${{ steps.tier.outputs.effort || 'max' }}
          # Le PR fix-issue possono essere aperte da `claude[bot]`: senza whitelist
          # il lane Codex abortisce ("non-human actor"). Whitelist esplicita
          # (hardening #898): mai `*`. `claude[bot]` copre le PR fix-issue;
          # `github-actions[bot]` copre eventuali PR aperte da automation interna
          # (run 26621967484 era exit 1 col precedente vincolo non-human-actor).
          # `frontaliere-automation[bot]` (App): sotto pull_request l'actor della
          # review = l'actor del run di `tests` → su una PR la cui ultima push
          # viene dall'App (redflag-fixer / issue-fix) `github.actor`
          # è l'App-bot; senza whitelist la review abortirebbe "non-human actor".
          # Owner-approved 2026-07-01: `--dangerously-skip-permissions` sostituisce
          # l'`--allowedTools` scoped precedente. Il reviewer restava bloccato su
          # probing esplorativo legittimo (es. testare `${!key_var}` indirect
          # expansion in un tmp script durante la review di PR #3180, bash -n
          # syntax-check) fuori dall'allowlist gh/rg/git/Read/Grep/Glob — si
          # arrangiava sempre (review completa comunque postata), ma su richiesta
          # esplicita si rimuove il vincolo così Claude ha accesso pieno.
          # Rischio noto e accettato: reviewer gira su OGNI PR (incluse quelle
          # aperte da bot/automation) con GITHUB_TOKEN pull-requests:write +
          # issues:write, senza restrizione su Bash/Write/Edit.
          prompt: |
            Test files are excluded from review by owner policy: do not read, probe or raise findings on tests, including during cross-file analysis.
            Report the exact workflow tier `${{ steps.tier.outputs.tier }}` in Scope; this classifies review scope, not model reasoning effort.
            PR review automation for #${{ steps.resolve.outputs.pr_number }} (HEAD ${{ steps.resolve.outputs.head_sha }}), tier ${{ steps.tier.outputs.tier }}.

            Read `REVIEW.md` first; it is the single source of truth for severity, scope, required checks, and output format. Do not read `AGENTS.md` unless REVIEW.md explicitly requires a specific rule.

            The deterministic review bundle is already prepared in `${{ runner.temp }}/review-ctx/`: `review-bundle.md` is the primary input and includes PR metadata, historical open Important findings with their path+line anchors, the review-scoped code-file list, code-only diff, incremental delta (when present), and sibling signal. Generated data/static paths are intentionally omitted from the bundle. Read it before using GitHub or repository tools. Do not repeat `gh pr view`, `gh pr diff`, or `gh api compare` unless the bundle explicitly reports that a section is incomplete.

            If `INCREMENTAL_BASE` is set, review only the delta and its interactions, but do not treat the prior Codex review as permission to erase an open Important finding. The bundle's historical section is authoritative: if a cited anchor is unchanged or the delta is only a base alignment, carry that finding into this review with the same path and line and do not append `## LGTM`; if the cited code was actually fixed, write `Fix di \`path:L<line>\`: ok.` for every cited anchor before allowing `Important: 0` and `## LGTM`. For an Important without a file citation, carry it unless it is explicitly resolved with `Fix di \`<normalized finding text>\`: ok.` (omit inner backticks). A merge-only delta can never resolve a prior Important by silence. If the bundle says the code contribution is unchanged, post a short review only when the historical section has no open Important findings.

            If the bundle has a `## Code contribution unchanged` section, the code has not changed since that review: re-judge only the PR body, carry every historical code Important verbatim with the same path and line, never write `Fix di` for a code anchor, and resolve a PR-body Important only when the current body fixes it.

            If the bundle identifies a historical Important on the PR body with an anchor `PR body:L<n>`, its resolution MUST be written exactly as `Fix di \`PR body:L<n>\`: ok.` (one line per anchor), before `Important: 0` and `## LGTM`; never replace that metadata anchor with a prose paraphrase. For an Important without a file or PR-body anchor, use the normalized finding text required above, inside the confirmation backticks.

            Review in one pass with a hard repository-tool budget: read the two contract files and the bundle, then use at most one batched read/search call for direct delta interactions. Never scan the whole repository, enumerate all siblings, or re-fetch the PR through GitHub. Validate the body contract, inspect only concrete interactions, verify declared performance claims against supplied evidence, and stop probing once the verdict is determined. Do not invent missing-test findings. Use sibling candidates as leads, not verdicts. For high tiers, include exactly three concise unresolved items in `## Adversarial check`; they must be real unverified risks, not generic missing coverage. Every non-funnel `❓ q:` in that section MUST end with the exact disposition `— deferred, non funnel-critical.`. The words `report-only`, `deferred`, or `non-funnel-critical` inside the question do not dispose it; a funnel-critical question must be promoted to `🔴 Important` instead.

            **PR body: one source of truth.** The deterministic body contract (`scripts/lib/pr-body-sections-check.mjs`, step `PR-body completeness`) already validated sections, bullet states, `Motivo`/`Prossimo passo`, placeholders and `Closes`; its verdict is in the bundle under `## Deterministic body contract`. When it is ✅, do not re-validate those rules and never emit a `🔴 Important` about the body: a doubt about those rules is at most a `🟡 Nit` anchored as `PR body:L<n>`, and the review gate declassifies such a 🔴 on a green contract anyway. REVIEW.md step 7 (a perf claim without a baseline) is not a contract rule and still applies. The states it accepts in `## Non implementato (ancora)` — `in questa PR`, `PR concatenata #N`, `per scelta`, `by construction`, `blocked: decisione del proprietario` (the five `CLOSING_STATES` of `scripts/ci/followup-has-candidates.mjs`) and any other `blocked: <causa>`, which keeps the task open without blocking the PR — are valid, e su quelli **non si emette 🔴**. A `PR concatenata` without `#N` is not a state and the contract already rejects it (non passa). Re-raising a 🔴 on a bullet the contract accepted deadlocks the loop: the fixer declines with a reason, the round cap trips, and `needs-human` lands with the wrong diagnosis on a PR that has nothing to fix. Tier `minimal` carries the same rule: check that both sections exist and that **nessun placeholder vuoto** (`TBD`, `N/A`, empty bullet) fills them — but a bullet closed with specific fields **non è un finding**.

            Post exactly one review with `gh pr review ${PR_NUMBER} --comment --body ...`. End with `## LGTM` only when there is no open `🔴 Important`, no unresolved funnel-critical question, and the bundle/body contract is valid. If uncertain, emit `❓ q:`; never use `## LGTM` beside an unresolved Important finding. Work read-only: do not edit files, commit, push, run npm, or run tests. Batch independent reads/searches in one tool call and stop immediately after posting the review.
      - name: Fail on transient API error (no review posted)
        id: review_abort
        # The Codex lane can exit 0 even when the model run ABORTED on a
        # transient provider error WITHOUT posting a review. The job then
        # looks green but no `## LGTM`/finding was written → the PR silently
        # stalls (observed PR #2340, API 500 mid-run). Classify from the exec log:
        #  - max_turns (terminal_reason) → FAIL LOUDLY + PR comment: MUST be
        #    checked BEFORE the 429 heuristic below. Root cause (PR #3555/#3556,
        #    2026-07-05): the bare `rate[ _-]?limit` alternative in the 429 regex
        #    matches ANY occurrence of that substring in the exec file — which
        #    includes benign per-request rate-limit-headroom metadata present on
        #    EVERY call, success or not. Combined with `is_error:true` (also set
        #    generically on a max_turns abort), a review that simply ran out of
        #    turns (tier high, 40, turns=41 observed) was silently misclassified
        #    as a 429 and downgraded to a warning — job stayed green, zero review
        #    posted, no signal anything was wrong. max_turns is a different
        #    failure mode (this PR's diff was too large/complex for the turn
        #    budget, not a global-quota event) — failing loud here carries no
        #    quota-storm risk, and posting a PR comment surfaces it even to
        #    someone only watching the PR (not the Actions log).
        #  - 5xx / overloaded / server_error → FAIL LOUDLY (red + re-runnable):
        #    the server recovers fast, an immediate re-run is useful.
        #  - 429 (quota / rate_limit) → FAIL LOUDLY. The review gate would be
        #    red anyway because no `## LGTM` exists; this step makes the cause
        #    queryable in the Jobs API so `stale-pr-rescuer` can re-run the
        #    completed run. There is no shared quota lease or admission cap:
        #    independent PR+HEAD reviews remain concurrent.
        # `set -uo pipefail` (NOT -e): grep in conditionals must not abort.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.tier.outputs.tier != 'tests-only' && steps.tier.outputs.tier != 'ledger-only' && steps.tier.outputs.tier != 'carry-forward' && steps.body_contract.outcome != 'failure' && (always() && !cancelled() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          REVIEW_OUTCOME: ${{ steps.codex_review.outcome }}
          EXEC_FILE: ${{ steps.codex_review.outputs.execution_file }}
          CODEX_PRIMARY_SUCCESS: ${{ steps.codex_review.outputs.primary_success }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          REVIEW_MAX_TURNS: ${{ steps.tier.outputs.max_turns }}
        run: |
          set -uo pipefail
          if [ "${CODEX_PRIMARY_SUCCESS:-false}" = 'true' ]; then
            echo "Codex primary riuscito: il controllo dell'execution file di fallback non si applica perché non è stato eseguito."
            exit 0
          fi
          # max_turns FIRST — see rationale above. Must win over the 429 regex.
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ] \
             && grep -qE '"terminal_reason"[[:space:]]*:[[:space:]]*"max_turns"' "${EXEC_FILE}"; then
            # 2026-07-17 (analisi Fable-5, 112 morti storiche): arricchisce il
            # comment con tier/cap/turni-usati — prima era un blob opaco che non
            # diceva NULLA su quanto ci si era avvicinati al cap né su quale tier
            # era coinvolto, rendendo impossibile per un umano giudicare a colpo
            # d'occhio se sia un caso marginale (1 turno sopra cap) o un pattern
            # ricorrente su una PR sovradimensionata (i dati mostrano che quel
            # secondo caso è quasi-deterministico su retry: split la PR, non
            # ri-lanciare all'infinito).
            NUM_TURNS=$(grep -oE '"num_turns"[[:space:]]*:[[:space:]]*[0-9]+' "${EXEC_FILE}" | tail -1 | grep -oE '[0-9]+' || true)
            # The Markdown backticks and Unicode punctuation are intentional
            # literal content for the issue comment.
            # shellcheck disable=SC2016,SC1112
            BODY=$(printf '⚠️ **Review automatica fallita** (`terminal_reason=max_turns`, tier `%s`, cap %s turni, turni usati %s): Claude ha esaurito il budget di turni prima di poter postare un verdetto (`## LGTM` / 🔴). Nessuna review è stata pubblicata su questa PR — auto-merge non può scattare finché non ce n’è una.\n\nLog del run: %s\n\nPer sbloccare:\n- rilancia il job (rerun del run `tests` più recente di questa PR fa ripartire anche `pr-review-loop`), oppure\n- esegui la review in locale: checkout del branch, poi lancia la review con lo stesso contratto di `REVIEW.md` sul diff verso `main` (es. skill `/code-review` a effort alto) prima di mergiare a mano.\n\nSe questa PR ha già avuto una morte `max_turns` in precedenza, un retry raramente basta — dato osservato: le morti ripetute sono quasi tutte su PR con molti file indipendenti in un unico batch; valuta di splittarla in PR più piccole.' "${REVIEW_TIER:-?}" "${REVIEW_MAX_TURNS:-?}" "${NUM_TURNS:-?}" "$RUN_URL")
            gh pr comment "$PR_NUMBER" --body "$BODY" || echo "::warning::gh pr comment fallito (non bloccante)."
            echo "::error::Codex review hit its turn cap (tier=${REVIEW_TIER:-?}, cap=${REVIEW_MAX_TURNS:-?}, turns=${NUM_TURNS:-?}) without posting a review — re-run this job, or split the PR if this recurs."
            exit 1
          fi
          # 429 / rate-limit: use the central detector and fail explicitly. The
          # completed failed run is the durable signal for stale-pr-rescuer;
          # there is no shared quota lease or concurrency veto.
          DECISION=$(GITHUB_OUTPUT=/dev/null EXEC_FILE="${EXEC_FILE:-}" PREFLIGHT_BLOCKED=false FALLBACK_ATTEMPTED=false node scripts/ci/claude-codex-fallback.mjs 2>/dev/null || true)
          if printf '%s\n' "$DECISION" | grep -q '^rate_limited=true$'; then
            echo "::error::Claude review aborted on a 429 (quota/rate-limit) without posting a review — failing so stale-pr-rescuer can re-run the completed run. No shared quota lease blocked this review."
            exit 1
          fi
          if [ "${REVIEW_OUTCOME}" = "failure" ]; then
            echo "::error::Codex review action failed (outcome=failure) — re-run this job."
            exit 1
          fi
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ]; then
            if grep -qE '"is_error"[[:space:]]*:[[:space:]]*true' "${EXEC_FILE}" \
               && grep -qiE '"api_error_status"[[:space:]]*:[[:space:]]*5[0-9][0-9]|overloaded|server_error|internal server error|api error: 5' "${EXEC_FILE}"; then
              echo "::error::Codex review aborted on a transient 5xx API error without posting a review — re-run this job."
              exit 1
            fi
          fi
          echo "Review step completed without an unrecovered transient API error."
      - name: Require approving Codex review
        id: review_gate
        # Must still run when codex_review has outcome=failure (continue-on-error
        # 429/action crash). Skipping here left the required check green with
        # zero bot reviews on HEAD (PR #7635): no LGTM, nothing red, auto-merge
        # parked forever. Fail this step when HEAD has no valid LGTM.
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && !cancelled() && steps.resolve.outputs.should_review == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODEX_FALLBACK_EVIDENCE_FILE: ${{ steps.codex_review.outputs.fallback_evidence_file }}
          # Single source of truth for the PR body: a model 🔴 anchored only on
          # `PR body:L<n>` does not block when this contract passed.
          BODY_CONTRACT_OUTCOME: ${{ steps.body_contract.outcome }}
        run: |
          set -euo pipefail
          # Il gate autorevole resta questo step required; la decisione è
          # estratta in un modulo testabile che verifica la coppia review/check
          # sulla HEAD corrente, la classificazione fail-closed e il conio della
          # follow-up aggregata. Corre anche quando la guardia salta il model
          # reviewer: deve valutare il verdetto già presente sulla HEAD.
          node scripts/ci/review-gate.mjs

      # GitHub può pubblicare `skipped` per uno step controllato da `if:` e
      # trattarlo come verde nel ruleset. Il gate sopra deve aver valutato la
      # review anche quando il model reviewer è stato saltato; se quel
      # percorso è stato saltato, trasformiamo l'assenza di verdetto in un
      # rosso reale. Il job non ha condizioni che possano saltarlo.
      - name: Fail when required review gate is skipped
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && !cancelled() && steps.resolve.outputs.should_review == 'true' && steps.review_gate.outcome == 'skipped') }}
        run: |
          echo "::error::Required review gate was skipped on a pull request; no approving review verdict was evaluated."
          exit 1

      # ── Cosa fare dopo la review: lo decide il job required, lo fa un altro ─
      #
      # Autorebase e opt-in all'auto-merge nativo stavano QUI, in coda al job
      # required: 46-88 s dentro `vitest (unit + integration)` (misurato il
      # 2026-09-19, es. run 35456925413: rebase 83 s + opt-in 8 s) che tenevano
      # il check giallo dopo che test e review avevano gia' deciso. Ora questo
      # step calcola soltanto le due decisioni, con le STESSE condizioni che
      # quegli step portavano, e le pubblica come output del job; il job
      # `post-review` (in fondo al file) le esegue dopo, con `needs: vitest`.
      #
      # `job.status` e' letto qui, dopo il review gate e il suo guard sullo
      # skip: da questo punto in poi solo step `continue-on-error` possono
      # girare, quindi il verdetto che il job pubblichera' e' gia' questo.
      - name: Decide post-review follow-up
        id: post_review
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && !cancelled()) }}
        continue-on-error: true
        env:
          AUTOMERGE: ${{ job.status == 'success' && steps.review_gate.outputs.approved == 'true' && steps.resolve.outputs.pr_number != '' }}
          AUTOREBASE: ${{ (job.status == 'success' && steps.review_gate.outputs.approved == 'true') || (steps.resolve.outputs.stale_review == 'true' && steps.resolve.outcome == 'success' && steps.guard.outcome == 'success' && steps.tier.outcome == 'success' && steps.prefetch.outcome == 'success' && steps.codex_review.outcome == 'success' && steps.review_abort.outcome == 'success' && steps.review_gate.outcome == 'failure') }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          automerge=false
          autorebase=false
          [ "$AUTOMERGE" = "true" ] && [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] && automerge=true
          [ "$AUTOREBASE" = "true" ] && autorebase=true
          {
            echo "automerge=$automerge"
            echo "autorebase=$autorebase"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "post-review: automerge=$automerge autorebase=$autorebase pr=${PR_NUMBER:-none}"

      - name: Classify cancelled run
        if: ${{ always() && cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          classification='cancelled_external'
          if [ -n "${PR_NUMBER:-}" ] && current_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid 2>/dev/null)"; then
            if [ -n "$current_sha" ] && [ "$current_sha" != "$HEAD_SHA" ]; then
              classification='superseded'
            fi
          fi
          {
            echo '### tests run cancellata'
            echo "- Classificazione: **$classification**"
            echo "- HEAD osservata: \`${HEAD_SHA:0:12}\`"
            echo '- Le fasi di report, remediation e review sono state saltate perché la run è stata cancellata.'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "::notice::tests run classified as $classification; no failure report or remediation was attempted"

      # ULTIMO step del job, e deve restarlo: legge l'esito di tutti quelli
      # sopra. `always()` non è decorativo — un `if:` che nomina uno step senza
      # `always()` non parte MAI dopo un fallimento, ed è esattamente dopo un
      # fallimento che questo step ha qualcosa da dire.
      #
      # `continue-on-error: true` è il fail-soft: il segnalatore non può
      # aggiungere un rosso al job che sta descrivendo, nemmeno crashando.
      - name: Explain the job verdict in the run summary
        if: ${{ steps.ledger_scope.outputs.ledger_only != 'true' && steps.body_contract.outcome != 'failure' && (always() && !cancelled()) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Il verdetto del JOB, non degli step. Sette step qui dentro sono
          # `continue-on-error: true` (i due commenti advisory, i due `Mint …
          # token`, `Run Codex Luna Max review`, le metriche e questo stesso step): il
          # loro rosso NON tinge il job, e senza questa variabile il summary
          # scriverebbe un ❌ in cima alla pagina di una run verde. `job.status`
          # è leggibile mentre il job gira e vale `success` proprio quando a
          # fallire è stato solo uno step `continue-on-error`.
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/explain-job-verdict.mjs

  # ══════════════════════════════════════════════════════════════════════════
  # Autorebase e opt-in all'auto-merge nativo, FUORI dal check required.
  #
  # Il check `vitest (unit + integration)` diventa verde (o rosso) appena test
  # e review hanno deciso; questo job parte dopo, solo se il job required ha
  # pubblicato una delle due decisioni, e non puo' colorare la run:
  # `continue-on-error: true` a livello di job impedisce che un suo errore
  # faccia fallire la run (e quindi che il redcheck-fixer o
  # scan-unreported-failures lo leggano come un rosso della PR).
  #
  # Cosa cambia rispetto a quando stava in coda al job required:
  #   - l'opt-in usa il percorso ORDINARIO del gate (check required completato
  #     e `success` sulla HEAD), lo stesso di `retry-native-automerge.yml`,
  #     invece del percorso in-job che confermava un check ancora in volo;
  #   - l'opt-in viene PRIMA dell'autorebase: e' il passo che il merge aspetta,
  #     l'autorebase riguarda le altre PR (la propria la rimanda finche' questa
  #     run e' in volo, `testsRunInFlightOnHead`);
  #   - token App e `pr-autorebase.mjs` arrivano da `main`, non dall'albero
  #     della PR: prima una PR poteva eseguire la propria versione modificata
  #     dello sweeper, che lavora su fino a 10 PR altrui, con il token App.
  # ══════════════════════════════════════════════════════════════════════════
  post-review:
    name: post-review (auto-merge opt-in + autorebase)
    needs: vitest
    if: ${{ always() && (needs.vitest.outputs.automerge == 'true' || needs.vitest.outputs.autorebase == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Anche ogni step e' `continue-on-error`: il check-run di questo job resta
    # verde e nessun consumatore che legge «un check rosso sulla PR» lo scambia
    # per un guasto della PR.
    continue-on-error: true
    steps:
      # Storia completa dei commit per i merge dell'autorebase, nessun tree
      # storico (stesso profilo `tree:0` del job required).
      - name: Checkout trusted main for autorebase and token minting
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: main
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /functions/src/githubApiHeaders.js
            /data/loop-fleet/
            /packages/*/package.json
            /package.json
            /package-lock.json
            /.npmrc
          sparse-checkout-cone-mode: false

      # Il token App e' l'identita' primaria; senza, l'opt-in viene saltato e
      # l'autorebase ripiega su GITHUB_TOKEN (fail-soft, come prima).
      - name: Mint post-review App token
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # ── Opt-in al native auto-merge, dopo il job required ────────────────
      #
      # PERCHÉ QUI. `enable-native-automerge.yml` aveva nove trigger per PR (5
      # `pull_request_target` + 3 `pull_request_review` + 1 `workflow_run`), e
      # ognuno era un run separato che rifaceva da zero checkout sparse,
      # Firebase, PAT da Remote Config e riletta di review e check via API.
      # Misurato il 2026-09-18 sulle ultime 100 run di quel workflow: 49
      # `workflow_run`, 29 `pull_request_target`, 22 `pull_request_review`; e
      # 59 delle 79 run in coda sull'account (75%) erano quel workflow, cioè
      # affamavano proprio i run `vitest` che stavano aspettando. Il
      # `concurrency` per-branch introdotto prima deduplica le raffiche sulla
      # STESSA PR e non il volume fra PR diverse: su 11 run create dopo quel
      # push una sola è stata cancellata.
      #
      # ESCALATION DI PRIVILEGIO — il motivo per cui il workflow era separato.
      # Il gate NON può essere eseguito dall'albero della PR con un token che
      # può mergiare, altrimenti una PR potrebbe modificare il proprio gate e
      # auto-mergiarsi. Questo job non ha l'head della PR in checkout, ma il
      # gate resta nel suo cono dedicato e validato. La sorgente
      # arriva quindi dallo stesso checkout `ref: main` sparse/blobless usato da
      # `enable-native-automerge.yml` e `retry-native-automerge.yml`, ed è
      # validata file per file da `native-automerge-source.mjs` prima che una
      # riga venga importata. Nessun path della PR entra in quel cono.
      - name: Checkout trusted native auto-merge source
        if: ${{ needs.vitest.outputs.automerge == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main
          path: native-automerge-main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/ci/native-automerge-source.mjs
            /scripts/ci/native-automerge-gate.mjs
            /scripts/ci/review-test-policy.mjs
            /scripts/ci/lib/automation-risk-policy.mjs
            /scripts/ci/lib/fetchPrFiles.mjs
            /scripts/ci/lib/vitestCheck.mjs
            /scripts/ci/lib/constants.mjs
            /scripts/ci/lib/pr-review-admission.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /data/loop-fleet/loop-registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Profilo `in-job`: la lista senza i due file di Remote Config, che
      # questo chiamante non usa (usa l'App token). Nome storico: il profilo
      # serve ai chiamanti dentro tests.yml, ed e' un SOTTOINSIEME dichiarato
      # in `native-automerge-source.mjs`.
      - name: Validate trusted native auto-merge source
        if: ${{ needs.vitest.outputs.automerge == 'true' }}
        continue-on-error: true
        env:
          NATIVE_AUTOMERGE_SOURCE_ROOT: ${{ github.workspace }}/native-automerge-main
          NATIVE_AUTOMERGE_SOURCE_PROFILE: in-job
        run: node "$NATIVE_AUTOMERGE_SOURCE_ROOT/scripts/ci/native-automerge-source.mjs"

      # IDENTITÀ DEL TOKEN — e perché NON è il `GITHUB_PAT` di Remote Config.
      # L'opt-in event-driven carica il PAT con il loader Remote Config di
      # `scripts/`, ma quel loader non può entrare in questo workflow (il suo
      # nome è deliberatamente assente da questo file): scrive ~92 variabili su
      # `$GITHUB_ENV`, visibili a OGNI step successivo dello stesso job, e nel
      # job fuso aveva reso rossi 14 test su 11 file (run 32937626053, tutti
      # quelli che asseriscono un ambiente pulito). L'invariante è difesa per
      # costruzione da `tests/ci-vitest-check-name.test.ts` («nessun segreto di
      # Remote Config viene caricato in questo workflow») e non si abbassa; il
      # PAT non esiste come Actions secret (`secrets.GITHUB_PAT` è vuoto — due
      # commenti in monitor-gsc-seo.yml e generate-article.yml avvisano proprio
      # di questo). Resta l'App token già presente nel job.
      #
      # L'App token NON è `secrets.GITHUB_TOKEN`: gli eventi scritti da
      # `github-actions[bot]` non avviano altri workflow (anti-recursion), e
      # sopra il merge di `main` c'è il deploy. Misurato il 2026-09-18 sulle
      # ultime 100 run del repo: 15 sono state innescate da
      # `frontaliere-automation[bot]`, cioè gli eventi di quell'identità creano
      # run. Se `mint-app-token.mjs` non ha prodotto un token (è
      # `continue-on-error`), l'opt-in viene SALTATO: nessun ripiego su
      # `GITHUB_TOKEN`, e `retry-native-automerge.yml` ritenta col PAT entro 20
      # minuti.
      #
      # `continue-on-error: true` non è cosmetico: un 5xx dell'API durante
      # l'opt-in non può tingere di rosso `vitest`, perché quel rosso bloccherebbe
      # il merge di OGNI PR del repo. Il prezzo è che un opt-in fallito non ha un
      # evento che lo riprovi: lo riprende `retry-native-automerge.yml`, cron
      # `*/20 * * * *`, UNA run per tick per tutte le PR aperte (fino a 100),
      # che passa per questo stesso gate e sa anche revocare un opt-in non più
      # valido. Quello, non il fan-out per-evento, è il canale di ritentativo.
      #
      # Nessun flag «i test sono passati»: qui il check required e' gia'
      # COMPLETATO, e il gate lo verifica da solo via API (ultimo check
      # `vitest (unit + integration)` sulla HEAD = `success`, step
      # `Require approving Codex review` = `success`), come fa il retry.
      - name: Enable native auto-merge after the required job
        if: ${{ needs.vitest.outputs.automerge == 'true' }}
        continue-on-error: true
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.vitest.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${NATIVE_AUTOMERGE_HELPER_DIR:-}" ] || [ -z "${NATIVE_AUTOMERGE_SOURCE_ROOT:-}" ]; then
            echo "::warning::sorgente native auto-merge da main non validata; nessun opt-in — retry-native-automerge.yml ritenta entro 20 min."
            exit 0
          fi
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::warning::App token assente; nessun opt-in (nessun ripiego su GITHUB_TOKEN, che non risveglierebbe il deploy) — retry-native-automerge.yml ritenta entro 20 min."
            exit 0
          fi
          cd "$NATIVE_AUTOMERGE_SOURCE_ROOT"
          GH_TOKEN="$APP_TOKEN" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
            "$REPOSITORY" "$PR_NUMBER"

      # `pr-autorebase.mjs` importa `typescript` (duplicateDeclarations), quindi
      # serve l'install; `--ignore-scripts` perche' nessun postinstall serve a
      # uno sweeper che fa solo git e API.
      - name: Setup Node.js + npm ci for autorebase
        if: ${{ needs.vitest.outputs.autorebase == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/ci-npm-setup
        with:
          npm-ci-args: --ignore-scripts

      - name: Rebase near-merge PRs after review or stale rescue
        if: ${{ needs.vitest.outputs.autorebase == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: 'false'
        run: node scripts/ci/pr-autorebase.mjs
