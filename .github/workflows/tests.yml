name: tests

# Runs the full vitest suite on every PR + every push to main as a BLOCKING
# CI gate. Before this workflow existed, vitest tests were never run in CI —
# regression gates like `tests/build-plugins/criticalCssRootHeight.test.ts`
# (added in PR #294) landed already-failing without anyone noticing, and the
# `#root{min-height:100vh}` bug hit production for 24h until manual report.
#
# Footprint: this used to fan out a 4-shard matrix + aggregator (5 runners per
# PR). It now runs the suite in a SINGLE job. On the Free plan the whole
# account shares a ~20 concurrent-job pool, and a per-PR fan-out of test shards
# starved the PR pipeline (auto-merge, Claude review, pr-body-contract) behind
# queued crawler runs — PRs sat un-dequeued. Collapsing to one runner frees 4
# slots per PR.
#
# MEASURED, not estimated (CI run 28099661052, full ~847-file suite on one
# 4-vCPU runner): vitest 366s + setup/assemble/lint overhead → 536s total job
# wall (~8.9 min). The `pool: 'threads'` worker pool (below) parallelises files
# across the runner's 4 vCPUs, so wall ≈ work/4 — NOT the 4×164s≈656s an
# additive per-shard model predicts (536s is ~1.9× a single shard's ~281s, not
# 4×). 536s lands inside the ~10 min Claude review window (`pr-review-loop`), so
# the review stays the gating slice and the vitest check costs the PR ~zero
# extra wall time. The same measured run completed every heavy source-scan guard
# (no-inlanguage, cathedral-no-ti-hardcodes, …) with no per-test timeout.
#
# Behaviour-preserving: every test still runs, no test is skipped and no
# threshold is relaxed — only the parallelism (wall-time, not coverage) changed.
#
# Tests that read data/jobs.json (gitignored): the assemble step regenerates
# it from the per-slice files committed under data/jobs-by-slice/.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatchable so pr-autorebase.yml can re-run vitest on a freshly-rebased PR
  # head: a PAT push to a PR branch does NOT reliably re-trigger `pull_request`
  # workflows (observed: rebased heads of #1587/#1526 got zero check-runs), so
  # the autorebase explicitly dispatches this on the branch ref. The run's
  # `vitest (unit + integration)` check-run lands on the branch head SHA (= PR
  # head), satisfying auto-merge-eval gate 3, and its `workflow_run: completed`
  # re-fires auto-merge-on-lgtm. No Claude review is re-run (auto-merge-eval
  # carries the existing ## LGTM forward across a pure main-merge rebase).
  workflow_dispatch:

# Cancel in-progress runs for the same ref so superseded commits don't waste
# the runner pool (matches deploy.yml's behaviour).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job, full suite. The job name `vitest (unit + integration)` is
  # LOAD-BEARING: auto-merge-on-lgtm's "Block merge if vitest gate is RED" step
  # keys on it (`select(.name == "vitest (unit + integration)")`), as do
  # auto-merge-eval gate 3 and pr-autorebase's workflow_dispatch expectation.
  # Do NOT rename.
  vitest:
    name: vitest (unit + integration)
    runs-on: ubuntu-latest
    # 20 min (was 15 at 4 shards): the single runner now executes all ~847 test
    # files. The measured job wall is 536s (run 28099661052), so 1200s is a ~2.2×
    # headroom against a slow-runner spike — wide enough to keep a transient slow
    # run from going RED on a JOB timeout instead of a real failure. (Per-test
    # timeouts are unchanged from vitest.config.ts and were not hit in the
    # measured run.)
    timeout-minutes: 20
    steps:
      # NIENTE `sparse-checkout` qui, ed è una scelta MISURATA, non un'omissione.
      # Questo checkout è un fetch bulk shallow (`fetch-depth: 1` implicito, no
      # `filter:`) e costa 75s (run 30355205859). Impostare `sparse-checkout`
      # porterebbe actions/checkout su `--filter=blob:none`, convertendo quel
      # singolo trasferimento in migliaia di lazy-fetch on-demand: provato su
      # questa stessa PR (run 30361290650) il Checkout è salito a 169s, +125%,
      # mangiandosi il guadagno dello split sotto.
      #
      # Regola generale ricavata dal confronto: lo sparse-checkout conviene solo
      # dove il partial clone è GIÀ in uso — in pr-body-contract.yml, che ha
      # `filter: blob:none`, escludere public/images/{events,blog} ha portato il
      # Checkout da ~200s (280/141/177s su tre run) a 77s. Qui no.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Audit no merge conflict markers
        # 0-tolerance gate: blocks any commit that contains unresolved
        # <<<<<<< / ======= / >>>>>>> markers. Added after the 2026-05-21
        # incident where 92 job slice files were committed with raw
        # `git stash pop` conflicts and silently dropped ~3.5k jobs from
        # production via assemble-jobs-dataset.mjs.
        run: npm run audit:no-merge-markers

      - name: Lint GHA action Node runtimes
        # Deterministic guardrail (issue #787, follow-up of #779): fails if any
        # first-party actions/* step is pinned to a major whose bundled Node
        # runtime is node16/node20. GitHub defaults the runner to Node 24 on
        # 2026-06-02 and removes node20 on 2026-09-16 — deprecated actions
        # accumulate as annotations then hard-fail, which on this repo blocks
        # the deploy. Catch the regression here instead of reactively (#779).
        run: npm run lint:gha-node-runtime

      - name: Lint hardcoded locale segments
        # Deterministic guard (escalation #1529, reviewer-finding/i18n-naming):
        # fails if a language segment (/de/, /fr/, /it/, /en/) is hardcoded as a
        # string LITERAL inside a dynamically-built URL/path in scripts/**,
        # build-plugins/** or components/** — instead of using the locale var
        # (`${locale}` / `perLocaleSlug[locale]`). The reviewer flagged this 🔴
        # 11×/14d because the path breaks on every locale != the hardcoded one.
        # Catch it BEFORE the PR reaches review (zero-Claude). New legit cases:
        # annotate with `// locale-segment-ok: <reason>` or rebaseline post-review.
        run: npm run lint:hardcoded-locale-segments

      - name: Fetch base ref for the factuality diff
        # The main checkout is shallow (fetch-depth: 1), so the base commit is
        # not present and the gate below would silently no-op. A depth-50 fetch
        # of just the base branch is enough to resolve a merge base for a normal
        # PR, and costs a couple of seconds. `|| true`: if it fails the gate
        # degrades to a loud no-op rather than failing the job.
        run: git fetch --no-tags --depth=50 origin "${{ github.base_ref || 'main' }}" || true

      - name: Gate factuality of changed articles
        # Deterministic guard (incident 2026-07-28, article
        # `frontalieri-altre-tasse-2026`): fails if an article body touched by
        # this PR has a blocking factuality defect — broken arithmetic, a tax at
        # or above gross income, the same scenario answered differently in two
        # sections, an invented institution, or contradictory dates for one norm.
        #
        # The same gates run inside create-article.mjs, which covers the LLM
        # generation path the incident came from. This step is the backstop for
        # every OTHER way a body reaches main: hand edits, repair scripts and the
        # other generators. Zero model calls, so it cannot fail open.
        #
        # Each failure prints the required correction. Fix the content — never
        # loosen a threshold or delete the passage to get the gate green.
        run: node scripts/audit-article-factuality.mjs --changed origin/${{ github.base_ref || 'main' }}

      - name: Cache assemble-jobs output
        # Mirrors deploy.yml's identical step. assemble-jobs-dataset.mjs has a
        # content-addressable cache under .cache/assemble-jobs (keyed on a
        # sha256 of every slice file + an internal output-version) that restores
        # the assembled outputs in ~0.3s instead of re-running the ~52s
        # assembly. The script's internal version+fingerprint guarantees
        # correctness, so the restore-keys cascade cannot replay a stale
        # jobs.json across slice or assembler changes (cache-miss → full
        # assembly → fresh snapshot).
        uses: actions/cache@v5
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ hashFiles('scripts/assemble-jobs-dataset.mjs', 'scripts/lib/parse-job-slices-worker.mjs', 'data/jobs/by-crawler/**/*.json', 'data/jobs/expired/by-crawler/**/*.json', 'data/jobs-crawler-summaries/by-crawler/**/*.json') }}
          restore-keys: |
            assemble-jobs-${{ runner.os }}-

      - name: Assemble data/jobs.json (background)
        # BACKGROUND: l'assemble è costato 133s e 155s nelle ultime due run
        # verdi (30355205859 / 30357073975) e la sua cache sopra è di fatto
        # sempre un miss — la key include hashFiles('data/jobs/by-crawler/**')
        # e i crawler riscrivono le slice decine di volte al giorno, per cui la
        # key non ricentra mai; la cascata restore-keys recupera un archivio con
        # fingerprint diverso e lo script riassembla comunque. Ci si mette pure
        # la quota cache del repo satura (9.54GB/10GB, 12 cache attive): la LRU
        # evicta prima che una key si ripresenti. Erano ~140s in coda a vitest.
        #
        # Solo 586 dei 1358 file di test leggono i suoi output: gli altri 772
        # girano nello step sotto MENTRE questo lavora, e il `wait-all` li
        # rijoina prima degli step che il dataset lo richiedono davvero. Il
        # gruppo indipendente dura molto più dei ~140s dell'assemble, quindi
        # l'assemble sparisce interamente dal wall del job.
        #
        # DEVE restare uno step `run:` — `background:` su uno step `uses:` non
        # è supportato e rompe l'intero file workflow (incidente PR #4777).
        #
        # Nota: esercita solo assembleJobsDataset() (legge+aggrega le slice
        # committate), mai writeJobsCrawlerSlice() o le guard shrink/boilerplate
        # (quelle girano solo dentro update-<company>-jobs.mjs), quindi non
        # serve GH_TOKEN / issues:write.
        id: assemble
        background: true
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: vitest run (test che non leggono il dataset)
        # VITEST_DATASET_GROUP=independent → vitest.config.ts esclude i file
        # classificati da scripts/ci/dataset-dependent-tests.mjs. La partizione
        # è calcolata dal sorgente a ogni run (mai una lista committata da
        # tenere in sync) ed è verificata disgiunta e completa: 772 + 586 =
        # 1358 = suite intera. La classificazione è volutamente conservativa,
        # quindi un test nuovo che legge il dataset finisce in questo gruppo
        # solo se NON tocca il filesystem — al più perde parallelismo.
        #
        # Il json reporter alimenta scripts/ci/generate-shard-weights.mjs via
        # refresh-shard-weights.yml, che scarica `shard-timing-*` con una glob
        # (progettata per i 4 shard di un tempo) → due file sono già supportati.
        env:
          VITEST_DATASET_GROUP: independent
        run: npm test -- --reporter=default --reporter=json --outputFile=shard-timing-1.json

      - name: Wait for background assemble
        wait-all: true

      - name: Migrate canton-aware tracking
        # cathedral-expired-tracking-canton asserts non-TI tracking entries use
        # canton-aware section paths. The migration is idempotent. Legge
        # data/jobs.json (quindi sta dietro il wait-all) e RISCRIVE
        # data/all-known-job-slugs.json — per questo quel file è fra gli output
        # tracciati dal classificatore: chi lo legge deve girare qui sotto, non
        # nel gruppo indipendente dove sarebbe ancora la versione committata.
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: vitest run (test che leggono il dataset)
        env:
          VITEST_DATASET_GROUP: dependent
        run: npm test -- --reporter=default --reporter=json --outputFile=shard-timing-2.json

      - name: Upload test timing
        # always() so we still collect timings when the run is red (a slow test
        # that times out is exactly the data point we want for re-balancing).
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-timing-1
          path: shard-timing-1.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test timing (dataset group)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-timing-2
          path: shard-timing-2.json
          retention-days: 7
          if-no-files-found: ignore
