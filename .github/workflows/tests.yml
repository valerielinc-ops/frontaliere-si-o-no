name: tests

# Runs the full vitest suite on every PR + every push to main as a BLOCKING
# CI gate. Before this workflow existed, vitest tests were never run in CI —
# regression gates like `tests/build-plugins/criticalCssRootHeight.test.ts`
# (added in PR #294) landed already-failing without anyone noticing, and the
# `#root{min-height:100vh}` bug hit production for 24h until manual report.
#
# Wall time: the vitest portion alone was ~408s on a single runner (the full
# job ~8-13 min) and was the dominant slice of the auto-merge wait — every PR
# blocks on the `vitest (unit + integration)` check before auto-merge-on-lgtm
# proceeds. The suite (~744 files, `isolate:true` → +30% but deterministic) is
# now SHARDED across 4 parallel runners via `vitest run --shard=i/4`, cutting
# the vitest portion to ~1/4 (~100s) so wall drops to ~3 min. This is a public
# repo → parallel runner minutes are free, so the 4× setup duplication costs
# $0. Sharding is behaviour-preserving: every file still runs, split
# deterministically by hash; no test is skipped and no threshold is relaxed.
#
# Tests that read data/jobs.json (gitignored): the assemble step regenerates
# it from the per-slice files committed under data/jobs-by-slice/.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatchable so pr-autorebase.yml can re-run vitest on a freshly-rebased PR
  # head: a PAT push to a PR branch does NOT reliably re-trigger `pull_request`
  # workflows (observed: rebased heads of #1587/#1526 got zero check-runs), so
  # the autorebase explicitly dispatches this on the branch ref. The run's
  # `vitest (unit + integration)` check-run lands on the branch head SHA (= PR
  # head), satisfying auto-merge-eval gate 3, and its `workflow_run: completed`
  # re-fires auto-merge-on-lgtm. No Claude review is re-run (auto-merge-eval
  # carries the existing ## LGTM forward across a pure main-merge rebase).
  workflow_dispatch:

# Cancel in-progress runs for the same ref so superseded commits don't waste
# the runner pool (matches deploy.yml's behaviour).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each shard runs ~1/4 of the test files in parallel. fail-fast:false so a
  # red shard does NOT cancel its siblings — one run surfaces the full failure
  # set instead of forcing re-runs to discover the next failing file.
  vitest-shard:
    name: vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Audit no merge conflict markers
        # 0-tolerance gate: blocks any commit that contains unresolved
        # <<<<<<< / ======= / >>>>>>> markers. Added after the 2026-05-21
        # incident where 92 job slice files were committed with raw
        # `git stash pop` conflicts and silently dropped ~3.5k jobs from
        # production via assemble-jobs-dataset.mjs.
        run: npm run audit:no-merge-markers

      - name: Lint GHA action Node runtimes
        # Deterministic guardrail (issue #787, follow-up of #779): fails if any
        # first-party actions/* step is pinned to a major whose bundled Node
        # runtime is node16/node20. GitHub defaults the runner to Node 24 on
        # 2026-06-02 and removes node20 on 2026-09-16 — deprecated actions
        # accumulate as annotations then hard-fail, which on this repo blocks
        # the deploy. Catch the regression here instead of reactively (#779).
        run: npm run lint:gha-node-runtime

      - name: Assemble data/jobs.json
        # Several tests read data/jobs.json (job-locale-completeness,
        # job-cross-locale-guard, sitemap-slug-integrity, search-console-compat,
        # cathedral-expired-tracking-canton). The file is gitignored — generate
        # it from committed per-slice files before running the suite.
        run: node scripts/assemble-jobs-dataset.mjs --stats

      - name: Migrate canton-aware tracking
        # cathedral-expired-tracking-canton asserts non-TI tracking entries use
        # canton-aware section paths. The migration is idempotent.
        run: node scripts/migrate-all-known-job-slugs-canton-aware.mjs

      - name: vitest run (shard ${{ matrix.shard }}/4)
        run: npm test -- --shard=${{ matrix.shard }}/4

  # Aggregator gate. Preserves the EXACT check-run name every downstream
  # consumer keys on — auto-merge-on-lgtm's "Block merge if vitest gate is RED"
  # step (`select(.name == "vitest (unit + integration)")`), auto-merge-eval
  # gate 3, and pr-autorebase's workflow_dispatch expectation. Green ONLY when
  # all 4 shards are green; any shard failure/cancellation makes this RED, so
  # the merge gate behaves identically to the old single-job version.
  vitest:
    name: vitest (unit + integration)
    runs-on: ubuntu-latest
    needs: vitest-shard
    if: ${{ always() }}
    steps:
      - name: Fail unless every shard is green
        run: |
          result='${{ needs.vitest-shard.result }}'
          echo "aggregated shard result: '$result'"
          if [ "$result" != "success" ]; then
            echo "::error::one or more vitest shards did not succeed (result='$result') — gate is RED"
            exit 1
          fi
          echo "all 4 vitest shards green — gate is GREEN"
