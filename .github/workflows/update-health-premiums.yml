name: Update Health Insurance Premiums (UFSP/BAG)

on:
  schedule:
    # Weekly on Sunday at 04:15 UTC
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled with human approval.'
        required: false
        default: true
        type: boolean
      human_approval:
        description: 'Explicit human approval for health-premium publication writes.'
        required: false
        default: false
        type: boolean

concurrency:
  group: health-premiums
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update-health-premiums:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
        # Tetto sullo step: senza, un Checkout impantanato consuma l'intero
        # budget del job e questo muore `cancelled` — stato invisibile agli
        # `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori (stesso bug class di #5659, vedi update-fuel-prices.yml).
        # 5min stanno sopra il massimo osservato sui run sani (56-136s su 8
        # run, ~23% del cap da 10min) con ampio margine, e sotto il cap del
        # job. NIENTE `filter: blob:none`: con `fetch-depth: 1` e' un
        # peggioramento misurato (+125% su tests.yml, vedi #5164).
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require human approval for health-premium side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: update-health-premiums
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install xlsx + adm-zip parsers
        # xlsx parses the priminfo region workbook; adm-zip is required for
        # the F2-A3 historical backfill path (ZIPped archive years).
        run: npm install xlsx adm-zip

      - name: Fetch health premiums
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/fetch-health-premiums.mjs

      - name: Validate generated health premiums
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/validate-health-premiums.mjs

      - name: Prepare Firebase credentials for push auth
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Commit and push if changed
        id: commit
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # F2-A3 multi-year storage: stage both the year-scoped directory and
          # the legacy flat aliases the fetch script keeps refreshing.
          git add data/health-premiums data/health-premiums.json public/data/health-premiums public/data/health-premiums.json
          if git diff --cached --quiet; then
            echo "ℹ️ No health premium changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🏥 Auto-update health insurance premiums (UFSP/BAG)"
            # Centralized rebase-retry helper survives concurrent pushes from
            # other data-refresh workflows. On rebase conflict, re-fetch
            # premiums on the new base before retrying.
            bash scripts/lib/git-push-with-retry.sh \
              --regenerate-cmd "node scripts/fetch-health-premiums.mjs && node scripts/validate-health-premiums.mjs && git add data/health-premiums data/health-premiums.json public/data/health-premiums public/data/health-premiums.json"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Trigger deploy after data push (GITHUB_TOKEN pushes don't trigger workflows)
      - name: Prepare Firebase credentials
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin for Remote Config
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: npm install firebase-admin

      - name: Load secrets from Remote Config
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Trigger deploy workflow
        if: steps.commit.outputs.has_changes == 'true' && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: bash scripts/lib/trigger-deploy.sh || true

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
