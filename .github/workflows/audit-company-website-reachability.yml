name: Audit company website reachability (daily)

# The crawler registry is a published input: a company website that stops
# answering must make the CI monitor red before the unreachable-host count can
# silently grow. The committed ceiling is the measured post-#7009 baseline;
# the full JSON report is retained as the evidence packet for each run.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-company-website-reachability
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit published company websites
        run: |
          mkdir -p /tmp/company-website-reachability
          node scripts/audit-company-website-reachability.mjs \
            --json=/tmp/company-website-reachability/report.json \
            --concurrency=6 \
            --timeout-ms=15000

      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: company-website-reachability-report
          path: /tmp/company-website-reachability/report.json
          if-no-files-found: ignore
