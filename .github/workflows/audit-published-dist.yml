name: Audit Published Dist (async)

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: 'Source build run ID whose published dist is audited'
        required: true
        type: string
      shard_artifact_run_id:
        description: 'Publisher run ID containing the published shard artifacts'
        required: true
        type: string
      deploy_ref:
        description: 'Exact source build commit containing the audit scripts'
        required: true
        type: string
      audit_sample_salt:
        description: 'Publisher run number used to rotate the audit sample'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate source and publisher identity
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          SHARD_ARTIFACT_RUN_ID: ${{ inputs.shard_artifact_run_id }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          AUDIT_SAMPLE_SALT: ${{ inputs.audit_sample_salt }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::deploy_run_id must contain only decimal digits'; exit 1; }
          [[ "$SHARD_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::shard_artifact_run_id must contain only decimal digits'; exit 1; }
          [[ "$DEPLOY_REF" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::deploy_ref must be a 40-character lowercase commit SHA'; exit 1; }
          [[ "$AUDIT_SAMPLE_SALT" =~ ^[0-9]+$ ]] || { echo '::error::audit_sample_salt must contain only decimal digits'; exit 1; }

  report:
    needs: [validate-inputs]
    if: ${{ needs.validate-inputs.result == 'success' }}
    uses: ./.github/workflows/audit-dist-from-run.yml
    with:
      deploy_run_id: ${{ inputs.deploy_run_id }}
      shard_artifact_run_id: ${{ inputs.shard_artifact_run_id }}
      deploy_ref: ${{ inputs.deploy_ref }}
      audit_sample_rate: '0.25'
      audit_sample_salt: ${{ inputs.audit_sample_salt }}
      audits: >-
        audit:all,audit:hreflang,audit:max-bfs-depth,
        audit:orphan-sitemap-pages,validate:jobs-quality,
        audit:discover-eligibility,report:job-title-locale,
        report:meta-description,validate:page-seo,validate:og-images,
        audit:canonical-trailing-slash,audit:news-sitemap,audit:spa-bundle-injection,gate:dist-quality
      audit_all_audits: >-
        text-html-ratio,title-length,title-no-disambig-hash,
        h1-title-duplicates,content-duplicates,faqpage-validity,
        image-object-license,
        no-literal-markdown,breadcrumb-coverage,single-h1-per-page,
        duplicate-structured-data,link-anchor-text,duplicate-meta-description,
        information-gain,page-weight,salary-landing-template
    secrets: inherit
    permissions:
      contents: read
      actions: read
