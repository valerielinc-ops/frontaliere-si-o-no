name: Monitor SEO CTR by Template

on:
  schedule:
    # Weekly: Sunday 16:00 UTC (after monitor-gsc-seo.yml @ 15:00)
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      measure_cardinality:
        description: >-
          Solo misura: righe pagina×query filtrate e non filtrate per ogni
          famiglia e alias, con i tempi. Nessuno state, nessuna issue, nessun
          commit; rosso se un alias filtrato raggiunge il tetto.
        type: boolean
        default: false

# The measurement run gets its own group: it must neither cancel a real
# monitor run nor be cancelled by one.
concurrency:
  group: monitor-seo-ctr-by-template${{ inputs.measure_cardinality && '-measure' || '' }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    if: ${{ !inputs.measure_cardinality }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Firebase SA credentials — monitor will skip GSC checks"
          fi

      # GITHUB_PAT = the identity actually honoured by main's "main required
      # CI checks" ruleset bypass_actors on a direct git push (issue #6325
      # sibling class: the App installation token minted below alone gets a
      # HARD GH013 rejection on all 40 retry attempts when pushing to main —
      # observed on this exact workflow, run 33330172555). Loading GITHUB_PAT
      # here matches every other main-writing data-refresh workflow;
      # configure-main-push-auth.sh (invoked by git-push-with-retry.sh below)
      # already prefers it over APP_TOKEN. Missing from Remote Config → falls
      # back to APP_TOKEN exactly as before (no regression).
      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      # Primary identity for issue creation = GitHub App installation token
      # (`frontaliere-automation[bot]`); PAT fallback. Same pattern as
      # monitor-gsc-seo.yml / seo-serp-autopilot.yml.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run SEO CTR-by-template monitor
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
        # `npx --no-install tsx`, not `node`: scripts/lib/seo-ctr-curve.mjs imports
        # services/router.ts and build-plugins/fuelDailyData.ts for the
        # canton/fuel slug mappings the auto-classifier needs (issue #7174),
        # and those TS sources use extensionless relative specifiers that
        # bare node cannot resolve (ERR_MODULE_NOT_FOUND on services/i18n).
        run: npx --no-install tsx scripts/monitor-seo-ctr-by-template.mjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Commit monitor state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Two outputs, both must be committed: the run state AND any family the
          # discovery pass auto-classified (issue #7174). A registration left in
          # the runner's filesystem is a registration that never happened — the
          # next run rediscovers the same segment forever.
          for f in data/seo-ctr-monitor-state.json scripts/lib/seo-ctr-auto-families.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(seo): update CTR-by-template monitor state"
          # Pin the SHA of the commit we just made: the regenerate-cmd below
          # runs inside the helper AFTER `git rebase --abort` + `git reset --hard`,
          # both of which push new reflog entries, so a reflog position is not a stable
          # handle on this commit (issue #7389).
          COMMIT_SHA="$(git rev-parse HEAD)"

          bash scripts/lib/git-push-with-retry.sh \
            --branch "$GITHUB_REF_NAME" \
            --regenerate-cmd "bash scripts/lib/restore-generated-files.sh --commit $COMMIT_SHA --checkout data/seo-ctr-monitor-state.json --merge-array scripts/lib/seo-ctr-auto-families.json; git add data/seo-ctr-monitor-state.json scripts/lib/seo-ctr-auto-families.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"

  # Pre-merge proof for the query prefilter (scripts/lib/perf-sources/gsc.mjs,
  # fetchGscPageQueryRows): read-only by construction — contents: read, no
  # issue token, no commit step, no failure issue. The red of this job is
  # the result, not an incident to report.
  measure-cardinality:
    if: ${{ inputs.measure_cardinality }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::No Firebase SA credentials — the measurement cannot run"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Measure prefilter cardinality per family and alias
        run: npx --no-install tsx scripts/monitor-seo-ctr-by-template.mjs --measure-cardinality

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
