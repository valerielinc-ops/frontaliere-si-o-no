name: Monitor SEO CTR by Template

on:
  schedule:
    # Weekly: Sunday 16:00 UTC (after monitor-gsc-seo.yml @ 15:00)
    - cron: '0 16 * * 0'
  workflow_dispatch: {}

concurrency:
  group: monitor-seo-ctr-by-template
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Firebase SA credentials — monitor will skip GSC checks"
          fi

      # Primary identity for issue creation = GitHub App installation token
      # (`frontaliere-automation[bot]`); PAT fallback. Same pattern as
      # monitor-gsc-seo.yml / seo-serp-autopilot.yml.
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Run SEO CTR-by-template monitor
        env:
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/monitor-seo-ctr-by-template.mjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      - name: Commit monitor state
        if: always()
        run: |
          if [ ! -f data/seo-ctr-monitor-state.json ]; then
            echo "No state file generated; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/seo-ctr-monitor-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(seo): update CTR-by-template monitor state"

          bash scripts/lib/git-push-with-retry.sh \
            --branch "$GITHUB_REF_NAME" \
            --regenerate-cmd "git checkout HEAD@{1} -- data/seo-ctr-monitor-state.json 2>/dev/null || true; git add data/seo-ctr-monitor-state.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
