name: Loop fleet independent lifecycle observer

# Reconstructs only GitHub-observable downstream lifecycle events. The
# observer validates and appends those events to the durable ledger branch; it
# never pushes main, publishes data, or calls a commercial/communication API.
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize with the durable ledger bridge because both may update the same
# append-only ledger branch. Neither workflow can write main directly.
concurrency:
  group: loop-fleet-durable-ledger
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lifecycle contract
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /data/loop-fleet/loop-registry.json
            /data/loop-fleet/ledger/
            /scripts/ci/observe-loop-fleet-lifecycle.mjs
            /scripts/ci/append-loop-fleet-lifecycle.mjs
            /scripts/ci/mint-app-token.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/githubApiHeaders.mjs
            /scripts/lib/google-service-account-token.mjs
            /functions/src/githubApiHeaders.js
            /scripts/load-rc-env.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Observe PR, Actions and post-merge evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-lifecycle-observer
        run: |
          set -euo pipefail
          node scripts/ci/observe-loop-fleet-lifecycle.mjs \
            --registry data/loop-fleet/loop-registry.json \
            --ledger-dir data/loop-fleet/ledger \
            --out-dir "$REPORT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload lifecycle observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loop-fleet-lifecycle-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-lifecycle-observer/
          retention-days: 90
          if-no-files-found: error

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Firebase service account is unavailable; durable lifecycle-ledger branch writes will fail closed."
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load reviewed write credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Mint App token for the durable ledger branch
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Persist lifecycle evidence to durable branch
        env:
          EVENT_FILE: ${{ runner.temp }}/loop-fleet-lifecycle-observer/lifecycle-events.jsonl
        run: |
          set -euo pipefail
          remote_timeout_seconds=90
          bounded_remote() {
            local operation="${1:-remote-command}"
            local status
            if timeout --signal=TERM --kill-after=10s "${remote_timeout_seconds}s" "$@"; then
              return 0
            else
              status=$?
            fi
            echo "::error::remote operation '${operation}' failed or exceeded ${remote_timeout_seconds}s (status ${status})" >&2
            return "$status"
          }
          export GIT_TERMINAL_PROMPT=0
          export GH_PAGER=cat
          if [ ! -s "$EVENT_FILE" ]; then
            echo 'No new independently observed lifecycle events; no PR update needed.'
            exit 0
          fi

          write_token="${APP_TOKEN:-${GITHUB_PAT:-}}"
          if [ -z "$write_token" ]; then
            echo '::error::No reviewed App/PAT token; refusing to push the durable ledger branch.'
            exit 1
          fi
          export GH_TOKEN="$write_token"

          git config user.name 'frontaliere-automation[bot]'
          git config user.email '41898282+frontaliere-automation[bot]@users.noreply.github.com'
          bounded_remote git fetch origin main
          git checkout --detach origin/main

          ledger_branch='ledger/loop-fleet'
          ledger_worktree="${RUNNER_TEMP}/loop-fleet-ledger-worktree"
          ledger_start='origin/main'
          if bounded_remote git ls-remote --exit-code --heads origin "refs/heads/$ledger_branch" >/dev/null 2>&1; then
            bounded_remote git fetch origin "$ledger_branch"
            ledger_start="origin/$ledger_branch"
          fi
          # Keep validators and the registry from the current main checkout;
          # only the append-only ledger is opened in the durable worktree.
          # When the branch is absent this seeds it from main's ledger history.
          git worktree add --no-checkout -B ledger-work "$ledger_worktree" "$ledger_start"
          git -C "$ledger_worktree" checkout -- data/loop-fleet/ledger/
          git -C "$ledger_worktree" ls-files --error-unmatch data/loop-fleet/ledger/ >/dev/null
          ledger_dir="$ledger_worktree/data/loop-fleet/ledger"

          for attempt in 1 2 3 4 5; do
            # Re-apply the observed batch against the current tip every
            # attempt; the lifecycle appender is idempotent by recordId and
            # fails closed on conflicting duplicates.
            node scripts/ci/append-loop-fleet-lifecycle.mjs \
              --events-file "$EVENT_FILE" \
              --ledger-dir "$ledger_dir" \
              --registry data/loop-fleet/loop-registry.json

            if git -C "$ledger_worktree" diff --quiet -- data/loop-fleet/ledger \
                && [ -z "$(git -C "$ledger_worktree" ls-files --others --exclude-standard data/loop-fleet/ledger)" ]; then
              echo 'Observed lifecycle events are already present in the durable ledger; nothing to append.'
              exit 0
            fi
            git -C "$ledger_worktree" add data/loop-fleet/ledger
            git -C "$ledger_worktree" commit -m "chore(loop-fleet): persist observed lifecycle evidence from run ${GITHUB_RUN_ID}"
            basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            if GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}" \
              bounded_remote git -C "$ledger_worktree" push origin "HEAD:refs/heads/$ledger_branch"; then
              unset basic_auth
              exit 0
            fi
            unset basic_auth
            if bounded_remote git fetch origin "$ledger_branch"; then
              # Rebase only the isolated ledger worktree onto the fetched tip;
              # the main worktree keeps the current validator and registry.
              git -C "$ledger_worktree" checkout -B ledger-work "origin/$ledger_branch"
            else
              bounded_remote git fetch origin main
              git -C "$ledger_worktree" checkout -B ledger-work origin/main
            fi
            git -C "$ledger_worktree" checkout -- data/loop-fleet/ledger/
            sleep $((attempt * 3))
          done
          echo "::error::could not append the observed lifecycle batch to $ledger_branch after 5 attempts"
          exit 1

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
