name: Loop fleet independent lifecycle observer

# Reconstructs only GitHub-observable downstream lifecycle events. The
# observer is read-only; persistence, when needed, goes through the same
# reviewed ledger branch/PR used by the durable evidence bridge.
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize with the durable ledger bridge because both may update the same
# reviewed ledger branch. Neither workflow can write main directly.
concurrency:
  group: loop-fleet-durable-ledger
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lifecycle contract
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /data/loop-fleet/loop-registry.json
            /data/loop-fleet/ledger/
            /scripts/ci/observe-loop-fleet-lifecycle.mjs
            /scripts/ci/append-loop-fleet-lifecycle.mjs
            /scripts/ci/loop-fleet-epoch-policy.mjs
            /scripts/ci/mint-app-token.mjs
            /scripts/ci/pr-body-check-gate.mjs
            /scripts/ci/lib/hook-exit-codes.mjs
            /scripts/ci/lib/hook-target-cwd.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/githubApiHeaders.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/lib/pr-body-sections-check.mjs
            /scripts/ci/lib/false-positive-declaration.mjs
            /functions/src/githubApiHeaders.js
            /scripts/load-rc-env.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Observe PR, Actions and post-merge evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-lifecycle-observer
        run: |
          set -euo pipefail
          node scripts/ci/observe-loop-fleet-lifecycle.mjs \
            --registry data/loop-fleet/loop-registry.json \
            --ledger-dir data/loop-fleet/ledger \
            --out-dir "$REPORT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload lifecycle observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loop-fleet-lifecycle-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-lifecycle-observer/
          retention-days: 90
          if-no-files-found: error

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Firebase service account is unavailable; reviewed lifecycle PR writes will fail closed."
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load reviewed write credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Mint App token for the reviewed PR path
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Persist lifecycle evidence through a reviewed PR
        env:
          EVENT_FILE: ${{ runner.temp }}/loop-fleet-lifecycle-observer/lifecycle-events.jsonl
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_timeout_seconds=90
          bounded_remote() {
            local operation="${1:-remote-command}"
            local status
            if timeout --signal=TERM --kill-after=10s "${remote_timeout_seconds}s" "$@"; then
              return 0
            else
              status=$?
            fi
            echo "::error::remote operation '${operation}' failed or exceeded ${remote_timeout_seconds}s (status ${status})" >&2
            return "$status"
          }
          export GIT_TERMINAL_PROMPT=0
          export GH_PAGER=cat
          if [ ! -s "$EVENT_FILE" ]; then
            echo 'No new independently observed lifecycle events; no PR update needed.'
            exit 0
          fi

          write_token="${APP_TOKEN:-${GITHUB_PAT:-}}"
          if [ -z "$write_token" ]; then
            echo '::error::No reviewed App/PAT token; refusing to push a lifecycle ledger branch or open a PR.'
            exit 1
          fi
          export GH_TOKEN="$write_token"

          git config user.name 'frontaliere-automation[bot]'
          git config user.email '41898282+frontaliere-automation[bot]@users.noreply.github.com'
          bounded_remote git fetch origin main
          git checkout --detach origin/main

          base_branch='chore/loop-fleet-ledger'
          open_pr_record=$(bounded_remote gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number,headRefName,baseRefName,createdAt \
            --jq 'map(select(.baseRefName == "main" and .headRefName == "chore/loop-fleet-ledger")) | sort_by(.number) | if length == 0 then "" else .[-1] | [(.number | tostring), .headRefName, .createdAt] | @tsv end')
          open_pr=''
          open_branch=''
          open_created_at=''
          if [ -n "$open_pr_record" ]; then
            IFS=$'\t' read -r open_pr open_branch open_created_at <<<"$open_pr_record"
          fi
          branch="$base_branch"
          base_branch_ref=''
          if [ -z "$open_pr" ]; then
            base_branch_ref=$(bounded_remote git ls-remote --heads origin "refs/heads/$base_branch")
          fi
          merged_dir="$RUNNER_TEMP/loop-fleet-lifecycle-merged"
          rm -rf "$merged_dir"
          mkdir -p "$merged_dir"

          if [ -n "$open_pr" ]; then
            bounded_remote git fetch origin "$open_branch"
            if git cat-file -e "origin/$open_branch:data/loop-fleet/ledger/lifecycle-events.jsonl" 2>/dev/null; then
              git show "origin/$open_branch:data/loop-fleet/ledger/lifecycle-events.jsonl" > "$merged_dir/lifecycle-events.jsonl"
            fi
          elif [ -n "$base_branch_ref" ]; then
            branch="${base_branch}-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          # The lifecycle observer writes the same reviewed ledger surface as
          # the durable bridge, so it also needs a bounded update epoch.
          if [ -n "$open_pr" ]; then
            epoch_batch_count=$(git log "origin/$open_branch" --format='%s' --not origin/main \
              | awk '/^chore\(loop-fleet\): persist / { count += 1 } END { print count + 0 }')
            epoch_age_minutes=''
            if [ -n "$open_created_at" ]; then
              created_epoch=$(date -d "$open_created_at" +%s 2>/dev/null || true)
              now_epoch=$(date +%s)
              if [ -n "$created_epoch" ] && [ "$now_epoch" -ge "$created_epoch" ]; then
                epoch_age_minutes=$(( (now_epoch - created_epoch) / 60 ))
              fi
            fi
            epoch_decision=$(node scripts/ci/loop-fleet-epoch-policy.mjs \
              --open-pr true \
              --batch-count "$epoch_batch_count" \
              --age-minutes "$epoch_age_minutes")
            if [ "$(jq -r '.allow' <<<"$epoch_decision")" != 'true' ]; then
              reason=$(jq -r '.reason' <<<"$epoch_decision")
              echo "::notice::lifecycle ledger epoch frozen for PR #$open_pr ($reason); events will be recovered after the PR terminal event."
              exit 0
            fi
          fi

          node scripts/ci/append-loop-fleet-lifecycle.mjs \
            --events-file "$EVENT_FILE" \
            --ledger-dir "$merged_dir" \
            --registry data/loop-fleet/loop-registry.json

          if [ -n "$open_pr" ]; then
            git checkout -b "$branch" "origin/$open_branch"
          else
            git checkout -b "$branch"
          fi
          mkdir -p data/loop-fleet/ledger
          cp "$merged_dir/lifecycle-events.jsonl" data/loop-fleet/ledger/lifecycle-events.jsonl

          if git diff --quiet -- data/loop-fleet/ledger/lifecycle-events.jsonl \
              && [ -z "$(git ls-files --others --exclude-standard data/loop-fleet/ledger/lifecycle-events.jsonl)" ]; then
            echo 'Observed lifecycle events are already present on the reviewed branch.'
            exit 0
          fi

          git add data/loop-fleet/ledger/lifecycle-events.jsonl
          git commit -m 'chore(loop-fleet): persist observed lifecycle evidence'
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}" \
            bounded_remote git push --set-upstream origin "$branch"
          unset basic_auth

          body="$RUNNER_TEMP/loop-fleet-lifecycle-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated from an independent GitHub PR/Actions lifecycle observation run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato
          - In questa PR persiste gli eventi downstream verificati indipendentemente: PR aperta, test conclusi, review `## LGTM`, merge e verifica post-merge sullo SHA del merge.
          - In questa PR conserva l’identità della run dell’osservatore, il riferimento alla PR/run GitHub e la deduplicazione append-only; non ricostruisce rollback o decisioni locali.

          ## Non implementato (ancora)
          - Rollback e stop di dominio richiedono una prova esplicita e un owner autorizzato — blocked: questo osservatore legge GitHub e non inventa eventi terminali né mutazioni di dominio.
          - Scritture dirette su main, corpus, shard, contenuti pubblicati, prezzi, commissioni, partner, subscription, advertising layout, outreach e revenue restano disabilitate — per scelta: la persistenza passa soltanto dalla PR ledger revisionata.
          EOF
          node scripts/ci/pr-body-check-gate.mjs --body-file "$body"
          if [ -n "$open_pr" ]; then
            bounded_remote gh pr edit "$open_pr" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            bounded_remote gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title 'chore(loop-fleet): persist observed lifecycle evidence' \
              --body-file "$body"
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
