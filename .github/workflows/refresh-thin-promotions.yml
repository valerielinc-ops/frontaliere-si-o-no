name: Refresh thin-page promotions

# Self-healing feedback loop for tiered emission (artifact-shrink Fase 1).
# Polls PostHog + GA4 for `thin_page_view` events emitted by App.tsx when
# window.__THIN_SHELL__ is set on a thinned static page. Any URL hit gets
# committed into data/thin-page-promotions-active.json; the next deploy's
# trafficEvidenceFilter sees it and falls back to 'full' for that URL.
#
# Cadence: every hour at :15. Cheap (two API calls), idempotent — when
# nothing fresh lands the active.json file is left unchanged so no commit
# happens.
#
# Secrets pattern mirrors build-evidence-and-tune.yml: the only GH-Actions
# secret needed is FIREBASE_SERVICE_ACCOUNT_JSON. All other env vars
# (POSTHOG_PERSONAL_API_KEY, POSTHOG_PROJECT_ID, POSTHOG_HOST,
# GA4_PROPERTY_ID) are loaded from Firebase Remote Config at workflow
# runtime via scripts/load-rc-env.mjs, which writes them to $GITHUB_ENV.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Polling window in hours (default 24)'
        required: false
        default: '24'
      active_window_days:
        description: 'Active rollup window in days (default 30)'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: refresh-thin-promotions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 (full history) is required for the rebase-retry
          # loop in the "Commit if changed" step (added #794, closes #799).
          # `fetch-depth: 1` ran shallow with only HEAD; on bursts of ≥20
          # parallel commits to main (crawlers + scheduled refreshers +
          # post-merge auto-commits) the rebase parent may live past the
          # shallow horizon, causing `git rebase origin/main` to fail with
          # "fatal: shallow file has changed since we read it" or worse.
          # Full clone is ~10 s extra on this repo and removes the entire
          # class of "shallow + burst" rebase failures.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # POSTHOG_* + GA4_PROPERTY_ID are populated via load-rc-env above.
      # No explicit `env:` here — that would shadow RC values with empty
      # GitHub secret refs. FIREBASE_SERVICE_ACCOUNT_JSON / GOOGLE_APPLICATION_CREDENTIALS
      # already in env from the first step.
      - name: Fetch thin-page promotions
        run: |
          node scripts/fetch-thin-page-promotions.mjs \
            --window-hours="${{ github.event.inputs.window_hours || '24' }}" \
            --active-window-days="${{ github.event.inputs.active_window_days || '30' }}"

      # Single-writer invariant (see #794/#801): this is the ONLY automated writer of
      # data/thin-page-promotions-*.json + .jsonl — a new writer would break the rebase-retry loop.
      # .github/CODEOWNERS requires owner review to edit the EXISTING writer surface
      # (this workflow + the fetch script + the data files) in a PR. It does NOT gate
      # this job.s own direct-push to main, nor a brand-new writer added as new files;
      # branch protection "Require review from Code Owners" is the enforcement for those.
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/thin-page-promotions-active.json data/thin-page-promotions.jsonl; then
            echo "no change"
            exit 0
          fi
          git config user.name "thin-promotions-bot"
          git config user.email "thin-promotions-bot@frontaliereticino.ch"
          git add data/thin-page-promotions-active.json data/thin-page-promotions.jsonl
          git commit -m "chore(thin-promotions): refresh self-heal feedback (last hour)"
          # Retry-on-rebase: many scheduled workflows push to main concurrently
          # (crawlers, fuel, weather, etc.); a non-fast-forward push is the
          # expected failure mode, NOT a code bug. Mirror the rebase loop used
          # by crawler-health-monitor.yml so a parallel push between our fetch
          # and push does not fail the entire run.
          MAX_ATTEMPTS=5
          BACKOFF_BASE=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if git push origin HEAD:main; then
              echo "✅ Pushed thin-promotions refresh."
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetch + rebase, then retry…"
            git fetch origin main || true  # tolerate transient net failure; rebase below will signal staleness
            if ! git rebase origin/main; then
              echo "⚠️ Rebase conflict on data/thin-page-promotions-*.json — aborting and resetting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((BACKOFF_BASE * attempt))
            attempt=$((attempt + 1))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts — leaving change uncommitted."
          exit 1
