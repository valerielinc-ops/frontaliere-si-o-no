name: Refresh thin-page promotions

# Self-healing feedback loop for tiered emission (artifact-shrink Fase 1).
# Polls PostHog + GA4 for `thin_page_view` events emitted by App.tsx when
# window.__THIN_SHELL__ is set on a thinned static page, PLUS GSC
# page-level impressions (issue #4407 — catches pages Google has shown
# but that never got a click, which the click-based signals can never
# reach). Any URL hit gets committed into
# data/thin-page-promotions-active.json; the next deploy's
# trafficEvidenceFilter sees it and falls back to 'full' for that URL.
#
# Cadence: every hour at :15. Cheap (a handful of API calls — GSC reuses
# the same GOOGLE_APPLICATION_CREDENTIALS already prepared for GA4 below,
# no new secret), idempotent — when nothing fresh lands the active.json
# file is left unchanged so no commit happens.
#
# Secrets pattern mirrors build-evidence-and-tune.yml: the only GH-Actions
# secret needed is FIREBASE_SERVICE_ACCOUNT_JSON (doubles as the GSC
# credential — see project memory). All other env vars
# (POSTHOG_PERSONAL_API_KEY, POSTHOG_PROJECT_ID, POSTHOG_HOST,
# GA4_PROPERTY_ID) are loaded from Firebase Remote Config at workflow
# runtime via scripts/load-rc-env.mjs, which writes them to $GITHUB_ENV.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Polling window in hours (default 24)'
        required: false
        default: '24'
      active_window_days:
        description: 'Active rollup window in days (default 30)'
        required: false
        default: '30'

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-thin-promotions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 (full history) is required for the rebase-retry
          # loop in the "Commit if changed" step (added #794, closes #799).
          # `fetch-depth: 1` ran shallow with only HEAD; on bursts of ≥20
          # parallel commits to main (crawlers + scheduled refreshers +
          # post-merge auto-commits) the rebase parent may live past the
          # shallow horizon, causing `git rebase origin/main` to fail with
          # "fatal: shallow file has changed since we read it" or worse.
          # NOTE: the "~10s extra" below was true when this comment was
          # written; the repo has since grown to ~1.36GB/868k objects
          # (#4380/#4266/#4120) so blob:none below is load-bearing, not
          # just an optimization — full history + blobs risks exceeding
          # the 10-min timeout-minutes budget on this same 10-min-timeout
          # class of workflow.
          # Full clone is ~10 s extra on this repo and removes the entire
          # class of "shallow + burst" rebase failures.
          fetch-depth: 0
          # Blobless partial clone (same fix as guard-data-integrity.yml
          # #4120 / crawler-health-monitor.yml #4380): keeps full commit/tree
          # history for the rebase-retry loop above while deferring blob
          # content download until a file is actually touched.
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Ha gia' blob:none e i numeri lo confermano: Checkout 110-253s su 10 run,
        # max = 42% di un cap da 10min. Nessun altro cambio, solo il tetto.
        timeout-minutes: 7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # POSTHOG_* + GA4_PROPERTY_ID are populated via load-rc-env above.
      # No explicit `env:` here — that would shadow RC values with empty
      # GitHub secret refs. FIREBASE_SERVICE_ACCOUNT_JSON / GOOGLE_APPLICATION_CREDENTIALS
      # already in env from the first step.
      - name: Fetch thin-page promotions
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_WINDOW_HOURS: ${{ github.event.inputs.window_hours || '24' }}
          INPUT_ACTIVE_WINDOW_DAYS: ${{ github.event.inputs.active_window_days || '30' }}
        run: |
          set -uo pipefail
          # The script's own exit-code contract (see its header comment):
          # 0 ok, 3 partial (one/two of the three feeds — posthog/ga4/gsc —
          # errored transiently, promotions still written to disk), 2 fatal
          # (all three errored). Capture rc without `set -e` aborting the
          # step (same pattern as cf-otto-route-monitor.yml), because a
          # single feed's transient network blip (issue #5568: "gsc error:
          # page: fetch failed") is expected hourly noise, not a workflow
          # failure — treating exit 3 as a step failure skipped the
          # downstream "Commit if changed" step entirely, silently
          # dropping the promotions this run already computed, and fired a
          # GitHub issue for a non-fatal, self-describing condition.
          node scripts/fetch-thin-page-promotions.mjs \
            --window-hours="$INPUT_WINDOW_HOURS" \
            --active-window-days="$INPUT_ACTIVE_WINDOW_DAYS" && rc=0 || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=thin-promotions partial feed failure::one or two of posthog/ga4/gsc errored this run (see data/thin-page-promotions.jsonl 'errors' field) — promotions from the remaining feed(s) were still written."
            exit 0
          fi
          exit "$rc"

      # Single-writer invariant (see #794/#801): this is the ONLY automated writer of
      # data/thin-page-promotions-*.json + .jsonl — a new writer would break the rebase-retry loop.
      # .github/CODEOWNERS requires owner review to edit the EXISTING writer surface
      # (this workflow + the fetch script + the data files) in a PR. It does NOT gate
      # this job.s own direct-push to main, nor a brand-new writer added as new files;
      # branch protection "Require review from Code Owners" is the enforcement for those.
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/thin-page-promotions-active.json data/thin-page-promotions.jsonl; then
            echo "no change"
            exit 0
          fi
          git config user.name "thin-promotions-bot"
          git config user.email "thin-promotions-bot@frontaliereticino.ch"
          git add data/thin-page-promotions-active.json data/thin-page-promotions.jsonl
          git commit -m "chore(thin-promotions): refresh self-heal feedback (last hour)"
          # Centralized rebase-retry helper (survives concurrent pushes from other
          # workflows) instead of a bespoke inline loop — see
          # scripts/lib/git-push-with-retry.sh, already used by
          # ai-visibility-check.yml / cathedral-noindex-flip.yml / crawl-events.yml.
          # No --regenerate-cmd / --in-place-resolver-cmd needed: this workflow is
          # the single writer of these two files (see comment above), so a real
          # rebase conflict should never occur — the helper's default abort-on-
          # conflict fallback matches this step's previous behavior.
          bash scripts/lib/git-push-with-retry.sh

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
