name: Refresh thin-page promotions

# Self-healing feedback loop for tiered emission (artifact-shrink Fase 1).
# Polls PostHog + GA4 for `thin_page_view` events emitted by App.tsx when
# window.__THIN_SHELL__ is set on a thinned static page, PLUS GSC
# page-level impressions (issue #4407 — catches pages Google has shown
# but that never got a click, which the click-based signals can never
# reach). Any URL hit gets committed into
# data/thin-page-promotions-active.json; the next deploy's
# trafficEvidenceFilter sees it and falls back to 'full' for that URL.
#
# Cadence: every hour at :15. Cheap (a handful of API calls — GSC reuses
# the same GOOGLE_APPLICATION_CREDENTIALS already prepared for GA4 below,
# no new secret), idempotent — when nothing fresh lands the active.json
# file is left unchanged so no commit happens.
#
# Secrets pattern mirrors build-evidence-and-tune.yml: the only GH-Actions
# secret needed is FIREBASE_SERVICE_ACCOUNT_JSON (doubles as the GSC
# credential — see project memory). All other env vars
# (POSTHOG_PERSONAL_API_KEY, POSTHOG_PROJECT_ID, POSTHOG_HOST,
# GA4_PROPERTY_ID) are loaded from Firebase Remote Config at workflow
# runtime via scripts/load-rc-env.mjs, which writes them to $GITHUB_ENV.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Polling window in hours (default 24)'
        required: false
        default: '24'
      active_window_days:
        description: 'Active rollup window in days (default 30)'
        required: false
        default: '30'

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-thin-promotions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised 10 -> 20 (issue #5810, chronic recurrence across #4160..#5754):
    # the "Commit if changed" step's fetch+rebase+push retry loop already
    # budgets 40 attempts (git-push-with-retry.sh, #4557) to survive main's
    # write contention, but every one of the six recorded recurrences shows
    # that step running the FULL remaining job budget and getting cancelled
    # mid-loop (attempt ~20-26/40), never exhausting its own attempt cap.
    # The binding constraint was wall-clock, not attempt count. Contention
    # clusters in the ~1-2h tail of orchestrate-crawlers' twice-daily dispatch
    # (09:00/21:00 UTC, main sees a push every ~5-8s during that window) and
    # this hourly job's actual start time drifts under GitHub Actions queueing
    # load, so it regularly lands inside that tail. 20 min gives the existing
    # 40-attempt budget realistic room to land a push outside the convoy's
    # cadence instead of being cut off partway through.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 (full history) is required for the rebase-retry
          # loop in the "Commit if changed" step (added #794, closes #799).
          # `fetch-depth: 1` ran shallow with only HEAD; on bursts of ≥20
          # parallel commits to main (crawlers + scheduled refreshers +
          # post-merge auto-commits) the rebase parent may live past the
          # shallow horizon, causing `git rebase origin/main` to fail with
          # "fatal: shallow file has changed since we read it" or worse.
          # NOTE: the "~10s extra" below was true when this comment was
          # written; the repo has since grown to ~1.36GB/868k objects
          # (#4380/#4266/#4120) so blob:none below is load-bearing, not
          # just an optimization — full history + blobs risks exceeding
          # the 10-min timeout-minutes budget on this same 10-min-timeout
          # class of workflow.
          # Full clone is ~10 s extra on this repo and removes the entire
          # class of "shallow + burst" rebase failures.
          fetch-depth: 0
          # Blobless partial clone (same fix as guard-data-integrity.yml
          # #4120 / crawler-health-monitor.yml #4380): keeps full commit/tree
          # history for the rebase-retry loop above while deferring blob
          # content download until a file is actually touched.
          filter: blob:none
          # The repository ruleset requires the vitest check for ordinary
          # pushes. This scheduled writer uses the owner PAT, which is an
          # explicit ruleset bypass actor; do not leave checkout's
          # GITHUB_TOKEN extraheader in front of it.
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto Checkout (classe #5145/#5144/#5162): senza, un fetch degenere
        # consuma l'intero budget e il job muore `cancelled` — stato invisibile
        # agli `if: failure()`, il buco che scan-job-timeouts.mjs tappa solo a
        # posteriori. Col tetto e' un `failure` diagnosticabile.
        # Ha gia' blob:none e i numeri lo confermano: Checkout 110-253s su 10 run,
        # max = 42% di un cap da 10min. Nessun altro cambio, solo il tetto.
        timeout-minutes: 7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Prepare Firebase service-account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # POSTHOG_* + GA4_PROPERTY_ID are populated via load-rc-env above.
      # No explicit `env:` here — that would shadow RC values with empty
      # GitHub secret refs. FIREBASE_SERVICE_ACCOUNT_JSON / GOOGLE_APPLICATION_CREDENTIALS
      # already in env from the first step.
      - name: Fetch thin-page promotions
        env:
          # Dispatch inputs reach the shell as DATA, never as script text.
          INPUT_WINDOW_HOURS: ${{ github.event.inputs.window_hours || '24' }}
          INPUT_ACTIVE_WINDOW_DAYS: ${{ github.event.inputs.active_window_days || '30' }}
        run: |
          set -uo pipefail
          # The script's own exit-code contract (see its header comment):
          # 0 ok, 3 partial (one/two of the three feeds — posthog/ga4/gsc —
          # errored transiently, promotions still written to disk), 2 fatal
          # (all three errored). Capture rc without `set -e` aborting the
          # step (same pattern as cf-otto-route-monitor.yml), because a
          # single feed's transient network blip (issue #5568: "gsc error:
          # page: fetch failed") is expected hourly noise, not a workflow
          # failure — treating exit 3 as a step failure skipped the
          # downstream "Commit if changed" step entirely, silently
          # dropping the promotions this run already computed, and fired a
          # GitHub issue for a non-fatal, self-describing condition.
          node scripts/fetch-thin-page-promotions.mjs \
            --window-hours="$INPUT_WINDOW_HOURS" \
            --active-window-days="$INPUT_ACTIVE_WINDOW_DAYS" && rc=0 || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=thin-promotions partial feed failure::one or two of posthog/ga4/gsc errored this run (see data/thin-page-promotions.jsonl 'errors' field) — promotions from the remaining feed(s) were still written."
            exit 0
          fi
          exit "$rc"

      # Single-writer invariant (see #794/#801): this is the ONLY automated writer of
      # data/thin-page-promotions-*.json + .jsonl — a new writer would break the rebase-retry loop.
      # .github/CODEOWNERS requires owner review to edit the EXISTING writer surface
      # (this workflow + the fetch script + the data files) in a PR. It does NOT gate
      # this job.s own direct-push to main, nor a brand-new writer added as new files;
      # branch protection "Require review from Code Owners" is the enforcement for those.
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/thin-page-promotions-active.json data/thin-page-promotions.jsonl; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "thin-promotions-bot"
          git config user.email "thin-promotions-bot@frontaliereticino.ch"
          git add data/thin-page-promotions-active.json data/thin-page-promotions.jsonl
          git commit -m "chore(thin-promotions): refresh self-heal feedback (last hour)"
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config — cannot bypass the main CI ruleset for this scheduled writer"
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # Centralized rebase-retry helper (survives concurrent pushes from other
          # workflows) instead of a bespoke inline loop — see
          # scripts/lib/git-push-with-retry.sh, already used by
          # ai-visibility-check.yml / cathedral-noindex-flip.yml / crawl-events.yml.
          # No --regenerate-cmd / --in-place-resolver-cmd needed: this workflow is
          # the single writer of these two files (see comment above), so a real
          # rebase conflict should never occur — the helper's default abort-on-
          # conflict fallback matches this step's previous behavior.
          #
          # --soft-fail-exhausted (issue #5568, recurring): the retry cap here has
          # already been raised 4x on the shared helper for this same symptom
          # (5->10->15->25->40, #3784/#4026/#4190/#4562) without ending the
          # recurrence — the real defect isn't an insufficient attempt budget, it's
          # treating an exhausted push as job-fatal for data that is a rolling
          # window (window-hours=24, re-derived hourly from GA4/GSC/PostHog): a
          # missed commit during the twice-daily crawler-dispatch convoy just
          # delays this run's delta by ~1h, the next run's overlapping 24h window
          # recaptures it. Warn + exit 0 instead of failing the job and reopening
          # this issue for an expected, self-healing contention blip.
          #
          # push_exhausted output (review round 2, PR #6296): --soft-fail-exhausted
          # makes exhaustion invisible to `if: failure()` by design (that's the
          # point), but that means nothing observes a *recurring* exhaustion either
          # — the ::warning:: only lands in a log nobody scans. Capture the
          # helper's own exhaustion message (not just its exit code, which is 0 in
          # both the "pushed fine" and "soft-failed" cases) so the next step can
          # debounce an alert on 2 consecutive occurrences.
          set +e
          PUSH_LOG=$(bash scripts/lib/git-push-with-retry.sh --soft-fail-exhausted 2>&1)
          rc=$?
          set -e
          echo "$PUSH_LOG"
          if echo "$PUSH_LOG" | grep -q '::warning::Failed to push after'; then
            echo "push_exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_exhausted=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # Debounced alert (same pattern as traffic-data-freshness.yml's
      # "Open / debounce stale issue"): a single soft-fail is expected
      # self-healing contention noise (see comment above), but 2 CONSECUTIVE
      # exhaustions mean the ~1h recapture assumption isn't holding and
      # data/thin-page-promotions-active.json is going stale for longer than
      # planned — that's worth a human looking, without paging on every blip.
      - name: Debounce push-retry-exhausted alert
        if: steps.commit.outputs.push_exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "thin-promotions-push-exhausted" --color "D93F0B" \
            --description "refresh-thin-promotions push retries exhausted on consecutive runs" --force 2>/dev/null || true
          gh label create "thin-promotions-push-exhausted-pending" --color "FBCA04" \
            --description "refresh-thin-promotions push retries exhausted once — debouncing" --force 2>/dev/null || true

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Issue #6667 item 3 (follow-up of #6648, same idiom as
          # publisher-jobs-sync.yml): "at most one open issue per label"
          # isn't enforced by anything but this workflow's own concurrency
          # group. Fetch the full set once and warn if the invariant doesn't
          # hold, instead of picking .[0] silently.
          CONFIRMED_JSON=$(gh issue list --label "thin-promotions-push-exhausted" --state open --json number)
          CONFIRMED_COUNT=$(echo "$CONFIRMED_JSON" | jq 'length')
          if [ "$CONFIRMED_COUNT" -gt 1 ]; then
            echo "::warning::${CONFIRMED_COUNT} open issues share label 'thin-promotions-push-exhausted' — this ≤1 invariant is only guaranteed by this workflow's own concurrency group, not enforced elsewhere. Updating only the first."
          fi
          CONFIRMED=$(echo "$CONFIRMED_JSON" | jq -r '.[0].number // empty')
          if [ -n "$CONFIRMED" ]; then
            gh issue comment "$CONFIRMED" --body "Still exhausting push retries as of $(date -u +%FT%TZ) — ${RUN_URL}."
            echo "Updated existing confirmed issue #$CONFIRMED"
            exit 0
          fi

          PENDING_JSON=$(gh issue list --label "thin-promotions-push-exhausted-pending" --state open --json number)
          PENDING_COUNT=$(echo "$PENDING_JSON" | jq 'length')
          if [ "$PENDING_COUNT" -gt 1 ]; then
            echo "::warning::${PENDING_COUNT} open issues share label 'thin-promotions-push-exhausted-pending' — this ≤1 invariant is only guaranteed by this workflow's own concurrency group, not enforced elsewhere. Promoting only the first."
          fi
          PENDING=$(echo "$PENDING_JSON" | jq -r '.[0].number // empty')
          if [ -n "$PENDING" ]; then
            gh issue edit "$PENDING" \
              --add-label "thin-promotions-push-exhausted" --add-label "bug" \
              --remove-label "thin-promotions-push-exhausted-pending" \
              --title "refresh-thin-promotions: push retries exhausted on consecutive runs"
            gh issue comment "$PENDING" --body "Confirmed: 2 consecutive runs exhausted push retries (--soft-fail-exhausted). data/thin-page-promotions-active.json may be stale beyond the ~1h recapture window this flag assumes. ${RUN_URL}."
            echo "Promoted pending issue #$PENDING to confirmed"
            exit 0
          fi

          gh issue create \
            --title "[pending] refresh-thin-promotions: push retries exhausted — 1st occurrence" \
            --body "Push retries exhausted (--soft-fail-exhausted) at $(date -u +%FT%TZ). ${RUN_URL}. Expected occasional contention noise that self-heals via the next hourly run's overlapping 24h window — this issue auto-closes on recovery, or promotes to confirmed if the very next run exhausts retries again." \
            --label "thin-promotions-push-exhausted-pending"
          echo "Opened pending issue"

      # Mirrors the auto-close half of traffic-data-freshness.yml's debounce:
      # a run that actually pushes (changed=true) without exhausting retries
      # means the contention cleared — retire any open pending/confirmed alert.
      - name: Auto-close push-retry-exhausted issues on recovery
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.push_exhausted == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for LABEL in "thin-promotions-push-exhausted" "thin-promotions-push-exhausted-pending"; do
            for NUM in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
              gh issue comment "$NUM" --body "Push succeeded on the next run. Auto-closing."
              gh issue close "$NUM" --reason completed
              echo "Closed issue #$NUM (label=$LABEL)"
            done
          done

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
