name: Resync CDN article chunks

# Manual lever to bring the CDN's article chunks back in sync with `main`
# without waiting for a full deploy.
#
# Why it exists: publish-article-chunks.mjs normally runs inside
# fast-publish-article.yml, i.e. only when an article is published. If the CDN
# and `main` ever diverge for another reason — a failed upload, a partial run,
# or (2026-07-29, #4881) a bug that published the registry without its
# translations — there was no way to force a resync short of a full deploy,
# which can take hours and is frequently superseded by newer runs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the chunks without uploading'
        type: boolean
        default: false

concurrency:
  group: resync-cdn-article-chunks
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: shard-secrets-overflow
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON unset — Remote Config secrets unavailable"
          fi

      - name: Load secrets from Remote Config (R2 + CF)
        run: node scripts/load-rc-env.mjs

      # A resync writes BOTH section registries, so acquire both R2 leases in
      # the stable order used by the lock helper. This participates in the same
      # mutex as fast-publish without using a GitHub section concurrency group
      # that could cancel a pending article run.
      - name: Acquire article chunk section locks
        id: acquire_chunk_locks
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          LOCK_OWNER: resync-${{ github.run_id }}/${{ github.run_attempt }}
        run: node scripts/lib/r2-section-lock.mjs acquire --section frontaliere,svizzera --owner "$LOCK_OWNER"

      # The lock prevents overlap with fast-publish, but this checkout may
      # have been created before a newer main commit. Never let a serialized
      # resync replace both registries with that older snapshot.
      - name: Check resync source is current
        id: check_chunk_source
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.acquire_chunk_locks.outcome == 'success'
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT="$(node scripts/lib/article-chunk-publish-freshness.mjs --source-sha "$SOURCE_SHA" --main-sha "$MAIN_SHA")"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "true" ]; then
            echo "Resync source $SOURCE_SHA is current on main"
          else
            echo "::notice::Skipping stale article chunk resync from $SOURCE_SHA; current origin/main is $MAIN_SHA"
          fi

      # Publish the named-export registry and all of its translation/slug
      # companions in strict mode. The script validates the standalone ESM
      # contract, observes each R2 upload's success marker, and requires the
      # targeted purge before declaring the resync complete (#5819).
      - name: Publish article chunks
        if: inputs.dry_run == true || inputs.dry_run == 'true' || (steps.acquire_chunk_locks.outcome == 'success' && steps.check_chunk_source.outputs.current == 'true')
        run: |
          npx -y tsx@4 scripts/publish-article-chunks.mjs --strict ${{ inputs.dry_run && '--dry-run' || '' }}

      # Release both leases even when strict publication fails. If the runner
      # is interrupted before this post-step, the lock helper's lease expires
      # after 30 minutes and another run can safely take it over with If-Match.
      - name: Release article chunk section locks
        if: always() && steps.acquire_chunk_locks.outcome == 'success'
        env:
          LOCK_OWNER: resync-${{ github.run_id }}/${{ github.run_attempt }}
        run: node scripts/lib/r2-section-lock.mjs release --section frontaliere,svizzera --owner "$LOCK_OWNER"
