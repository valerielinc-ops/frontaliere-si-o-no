name: GCP Cost Monitor

# Guard on Google Cloud usage that becomes part of the bill
# (scripts/monitor-gcp-costs.mjs). Each run reads Cloud Monitoring for the
# previous 24 hours, opens or updates one stable-title status issue when a
# driver crosses its threshold, and resolves it once every driver is back under.
#
# The punctual trigger is Cloud Scheduler, every 6 hours at 01:23, 07:23,
# 13:23 and 19:23 UTC: dispatchGcpCostMonitor in functions/index.js
# (functions/src/gcpCostMonitorDispatch.js) sends a workflow_dispatch with no
# inputs, so `dry_run` keeps its `false` default and the issue is written.
#
# The native cron below is an independent safety net. It runs if Cloud
# Scheduler or the dispatch function is unavailable. The rolling window and
# stable issue title make repeated runs idempotent.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only (no issue written)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: monitor-gcp-costs
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The script only uses Node built-ins and scripts/lib helpers, so no
      # `npm ci`. Missing credentials make the script exit non-zero on purpose:
      # a cost monitor that skips silently is the failure it exists for.
      - name: Run GCP cost monitor
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          umask 077
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/monitor-gcp-costs.mjs --dry-run > "$RUNNER_TEMP/gcp-cost-monitor.log" 2>&1
          else
            node scripts/monitor-gcp-costs.mjs > "$RUNNER_TEMP/gcp-cost-monitor.log" 2>&1
          fi

      - name: Write status-only cost summary
        if: always()
        run: echo 'GCP cost monitor completed; usage and billing measurements are withheld from the public run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
