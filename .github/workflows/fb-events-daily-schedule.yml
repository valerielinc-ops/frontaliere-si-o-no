name: FB Events Schedule

# Posts the soonest upcoming events (all cantons with live event data) to the
# Facebook Page, geo-anchored per comune (chained feature on #2963, generalized
# to every canton in #3647 — F5/5 of #3125). Posts immediately (low volume),
# linking to our /eventi/<cantone>/<comune>/ landing pages (TI kept at its
# original /eventi/ticino/<comune>/) to drive the SEO funnel. On the Friday
# weekend-digest run, posts one roundup per canton that has weekend events
# (Ticino first), instead of one per event.

on:
  schedule:
    # Twice daily at :50 — a free minute clear of the job FB slots
    # (:05/:15/:25/:35/:45/:55), the article cron (:22) and article-gen
    # (:07/:37). Runs after the 05:40 events crawl has refreshed data/events.json.
    - cron: '50 8,16 * * *'
  workflow_dispatch:
    inputs:
      volume:
        description: 'Max events to post this run'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Skip Graph API call (preview only)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      human_approval:
        description: 'Explicit human approval for scheduling Facebook posts.'
        required: false
        default: false
        type: boolean

# Serialize so two runs never post-and-commit the ledger concurrently (the only
# writer of data/fb-posted-events.json).
concurrency:
  group: fb-events-schedule
  cancel-in-progress: false

permissions:
  contents: write  # to commit fb-posted-events.json
  issues: write

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Require human approval for social side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: facebook-events-post
        run: node scripts/ci/human-side-effect-gate.mjs
      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from RC
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Post FB events
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' || steps.side_effect_gate.outputs.effective_dry_run == 'true'
        env:
          FB_EVENT_VOLUME: ${{ github.event.inputs.volume || '3' }}
          DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
          ALLOW_SIDE_EFFECT: ${{ steps.side_effect_gate.outputs.allow_side_effect }}
          EFFECTIVE_DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
        run: node scripts/schedule-fb-events-daily.mjs

      - name: Commit posted-events tracking
        if: success() && steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fb-posted-events.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "📅 Track posted FB events"
          bash scripts/lib/git-push-with-retry.sh
