name: Republish Pages from prior run artifact
# Outage recovery: redeploy an already-built site WITHOUT a ~50-min rebuild.
# Downloads a prior run's github-pages artifact, RE-CREATES it as a valid Pages
# artifact via upload-pages-artifact (a plain upload-artifact is rejected by the
# Pages deployment API with 404), then publishes via the Pages API with NO
# action-level cancel (the 13GB sync exceeds deploy-pages' 10-min cap).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose github-pages artifact to republish'
        required: true
permissions:
  pages: write
  id-token: write
  actions: read
jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Download prior github-pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: dl
      - name: Unpack artifact tar into a directory
        run: |
          mkdir -p site
          tar -xf dl/artifact.tar -C site
          echo "unpacked $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"
      - name: Re-create as a valid Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Publish via Pages API (no cancel, extended)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          art=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages")][0].id // empty')
          oidc=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
                  -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')
          if [ -z "$art" ] || [ -z "$oidc" ]; then echo "::error::missing artifact ($art) or OIDC"; exit 1; fi
          ver="republish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "creating Pages deployment version=${ver} artifact=${art}"
          resp=$(printf '{"artifact_id":%s,"pages_build_version":"%s","oidc_token":"%s"}' "$art" "$ver" "$oidc" \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input -)
          echo "create response: $resp"
          surl=$(printf '%s' "$resp" | jq -r '.status_url // empty')
          [ -z "$surl" ] && { echo "::error::no status_url in response"; exit 1; }
          deadline=$(( $(date +%s) + 40*60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            st=$(gh api "$surl" --jq '.status // empty' 2>/dev/null || echo "")
            echo "$(date -u +%H:%M:%S) status=${st:-<none>}"
            case "$st" in
              succeed) echo "✅ republished via no-cancel API"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error) echo "::error::failed: $st"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::not succeeded within 40 min"; exit 1
