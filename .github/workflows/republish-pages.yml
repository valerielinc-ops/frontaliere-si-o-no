name: Republish Pages from artifact
# Outage recovery tool: re-publish an ALREADY-BUILT github-pages artifact
# without the ~50-min rebuild. Standalone (no validate/false-green logic) so a
# single deploy-pages attempt either really publishes (<10-min server-side) or
# fails cleanly — dispatch repeatedly until one lands. Reuse the artifact_id from
# a recent successful build's `github-pages` artifact.
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'github-pages artifact id to (re)publish'
        required: true
permissions:
  pages: write
  id-token: write
jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - name: Deploy existing artifact to Pages
        id: dep
        uses: actions/deploy-pages@v5
        with:
          artifact_id: ${{ inputs.artifact_id }}
          timeout: 600000
          error_count: 100
