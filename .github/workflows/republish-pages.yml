name: Republish Pages from prior run artifact
# Outage recovery: redeploy an already-built github-pages artifact from a prior
# run WITHOUT a ~50-min rebuild. Downloads the artifact cross-run, re-uploads it
# in-run, then publishes via the Pages API with NO action-level cancel (the
# 13GB server-side sync routinely exceeds deploy-pages' 10-min cap). Dispatch
# with run_id of a completed build whose CDN assets are still live (additive CDN).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose github-pages artifact to republish'
        required: true
permissions:
  pages: write
  id-token: write
  actions: read
jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Download github-pages artifact from prior run
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: dl
      - name: Re-upload as this run's github-pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dl/artifact.tar
          retention-days: 1
      - name: Publish via Pages API (no cancel, extended)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          art=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages")][0].id // empty')
          oidc=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
                  -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')
          if [ -z "$art" ] || [ -z "$oidc" ]; then echo "::error::missing artifact ($art) or OIDC token"; exit 1; fi
          ver="republish-${GITHUB_RUN_ID}"
          echo "creating Pages deployment version=${ver} artifact=${art}"
          printf '{"artifact_id":%s,"pages_build_version":"%s","oidc_token":"%s"}' "$art" "$ver" "$oidc" \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input -
          deadline=$(( $(date +%s) + 40*60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            st=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${ver}" --jq '.status // empty' 2>/dev/null || echo "")
            echo "$(date -u +%H:%M:%S) status=${st:-<none>}"
            case "$st" in
              succeed) echo "✅ republished (no-cancel API)"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error) echo "::error::publish failed: $st"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::not succeeded within 40 min"; exit 1
