name: Publisher Ad Blast (targeted newsletter)

# Sends a targeted newsletter blast for newly-paid SPONSORED ads to matching
# subscribers (idempotent via blastSentAt). Free ads are never blasted.
# Manual + daily; the script enforces per-ad + per-run caps (free-tier ESP safety).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (log audience, do not send)'
        type: boolean
        default: true
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC

concurrency:
  group: publisher-blast
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publisher-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config (RESEND_API_KEY)
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Run blast
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: |
          node scripts/blast-publisher-ads.mjs --send

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
