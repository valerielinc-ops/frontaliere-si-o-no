name: Publisher Ad Blast (targeted newsletter)

# CHANNEL-STATUS: suspended
#
# Disabled on 2026-08-12 by the owner. The reason at the time was the one this
# channel had carried in the registry since #5712: third-party advertising is a
# different PURPOSE from editorial content, and no consent formula this site
# collected admitted it — `consentCategory: null`. It was the only active
# workflow able to mail subscribers under no consent.
#
# Measured before disabling it: zero paid ads in `publisher_jobs` (tier
# sponsored/azienda with status paid), zero already blasted, zero pending. The
# channel had never sent anything and had nothing to send, so switching it off
# removed a path, not a sold service — the path that would have mailed
# unconsented subscribers the moment somebody paid.
#
# THAT REASON HAS BEEN ANSWERED, AND THIS COMMENT IS NOT THE PLACE TO RE-DECIDE
# IT. The owner ruled on 2026-08-13 (#5759): advertising is its own consent
# category, named on /comunicazioni/, collected as an opt-out with a
# per-channel switch — so `consentCategory: 'advertising'` in
# services/communicationChannels.ts, not `null`. And on 2026-08-14: the
# disclosure reaches the whole list, including subscribers whose stored proof
# predates it. Both are written up where they are enforced —
# `consentCoversAdvertising` in services/publisherBlastMatch.mjs.
#
# So what still stops this workflow is NOT an open consent question. It is a
# separate decision the owner has not taken: whether to run a paid-ad channel
# at all. Leaving the old sentence here would have sent whoever re-enables it
# looking for a ruling that already exists, and possibly to make it again.
#
# Same mechanism as send-daily-brief.yml: `disabled_manually` is a flag on the
# Actions API and changes no byte of this repo, so the suspension is declared
# in the channel registry and anchored here.
# `tests/consent-shown-at-signup.test.ts` fails unless the marker and the
# declared `status` agree IN BOTH DIRECTIONS — re-enabling means deleting this
# comment, and the test then stays red until the registry says `live` again.
#
# Do not delete it as tidying.

# Sends a targeted newsletter blast for newly-paid SPONSORED ads to matching
# subscribers (idempotent via blastSentAt). Free ads are never blasted.
# Manual + daily; the script enforces per-ad + per-run caps (free-tier ESP safety).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (log audience, do not send)'
        type: boolean
        default: true
      human_approval:
        description: 'Explicit human approval for the publisher blast.'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC

concurrency:
  group: publisher-blast
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publisher-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require human approval for blast side effects
        id: side_effect_gate
        env:
          APPROVAL_ACTOR_TYPE: ${{ github.event.sender.type || '' }}
          APPROVAL_CONSENT: ${{ inputs.human_approval }}
          APPROVAL_DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL_SCOPE: publisher-blast
        run: node scripts/ci/human-side-effect-gate.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config (RESEND_API_KEY)
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' && steps.side_effect_gate.outputs.effective_dry_run != 'true'
        run: node scripts/load-rc-env.mjs

      - name: Run blast
        if: steps.side_effect_gate.outputs.allow_side_effect == 'true' || steps.side_effect_gate.outputs.effective_dry_run == 'true'
        env:
          ALLOW_SIDE_EFFECT: ${{ steps.side_effect_gate.outputs.allow_side_effect }}
          EFFECTIVE_DRY_RUN: ${{ steps.side_effect_gate.outputs.effective_dry_run }}
        run: |
          if [ "$ALLOW_SIDE_EFFECT" = "true" ] && [ "$EFFECTIVE_DRY_RUN" = "false" ]; then
            node scripts/blast-publisher-ads.mjs --send
          else
            node scripts/blast-publisher-ads.mjs
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
