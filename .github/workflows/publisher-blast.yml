name: Publisher Ad Blast (targeted newsletter)

# CHANNEL-STATUS: suspended
#
# Disabled on 2026-08-12 by the owner. The reason is the one this channel has
# carried in the registry since #5712: third-party advertising is a different
# PURPOSE from editorial content, and no consent formula this site collects
# admits it — `consentCategory: null` in services/communicationChannels.ts.
# It was the only active workflow able to mail subscribers under no consent.
#
# Measured before disabling it: zero paid ads in `publisher_jobs` (tier
# sponsored/azienda with status paid), zero already blasted, zero pending. The
# channel had never sent anything and had nothing to send, so switching it off
# removed a path, not a sold service — the path that would have mailed
# unconsented subscribers the moment somebody paid.
#
# Same mechanism as send-daily-brief.yml: `disabled_manually` is a flag on the
# Actions API and changes no byte of this repo, so the suspension is declared
# in the channel registry and anchored here.
# `tests/consent-shown-at-signup.test.ts` fails unless the marker and the
# declared `status` agree IN BOTH DIRECTIONS — re-enabling means deleting this
# comment, and the test then stays red until the registry says `live` again.
#
# Do not delete it as tidying. Re-enabling this one also needs the owner to
# decide the consent question first.

# Sends a targeted newsletter blast for newly-paid SPONSORED ads to matching
# subscribers (idempotent via blastSentAt). Free ads are never blasted.
# Manual + daily; the script enforces per-ad + per-run caps (free-tier ESP safety).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (log audience, do not send)'
        type: boolean
        default: true
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC

concurrency:
  group: publisher-blast
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publisher-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config (RESEND_API_KEY)
        run: node scripts/load-rc-env.mjs

      - name: Run blast
        run: |
          # Scheduled runs always send; manual runs honor the dry_run input (default true).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            node scripts/blast-publisher-ads.mjs --send
          else
            node scripts/blast-publisher-ads.mjs
          fi

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
