name: Instagram Daily/Weekly Broadcast

# Instagram Business account carousel posts (scripts/post-to-instagram.mjs):
#   • daily  08:20 UTC → top-5 most-clicked JOBS + top-5 most-read ARTICLES
#            (5 min after linkedin-member-daily.yml's 08:15, same GA4 window,
#            staggered so the two don't contend for the same runner minute)
#   • weekly Mon 07:05 UTC → top-5 fastest DOGANE (5 min after Telegram's own
#            weekly border digest, same data source, same reasoning)
#
# Same dual-cron/mode-select shape as telegram-channel-broadcast.yml.
#
# Live posts use the official Instagram Graph API only. Missing publishing
# credentials fail visibly; the old browser queue is policy-held and cannot
# silently turn a green workflow into a non-publication.
#
# workflow_dispatch defaults to dry_run=true (preview only). Scheduled runs
# post for real, subject to the credentials being present.

on:
  schedule:
    - cron: '20 8 * * *'  # daily job/article carousels
    - cron: '5 7 * * 1'   # weekly dogane carousel (Monday)
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to one slot (weekly border only makes sense on-demand)'
        required: false
        default: ''
        type: string
      date:
        description: 'UTC day to report on (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Preview only (no Instagram API call)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
concurrency:
  group: instagram-daily-broadcast
  cancel-in-progress: false

permissions:
  contents: write  # commit data/instagram-posted.json
  issues: write

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    environment: social-production
    runs-on: ubuntu-latest
    # Same budget as linkedin-member-daily.yml / telegram-channel-broadcast.yml
    # — full checkout + assemble-jobs-dataset for the job slot.
    timeout-minutes: 20
    env:
      APPROVAL_TRUSTED_SCHEDULE: 'true'
      # Weekly cron ⇒ border; daily cron / manual ⇒ input (empty = article+job).
      ONLY: ${{ github.event.inputs.only || (github.event.schedule == '5 7 * * 1' && 'border' || '') }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      REPORT_DATE: ${{ github.event.inputs.date || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from RC
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: >-
          node scripts/load-rc-env.mjs
          --only-env=INSTAGRAM_ACCESS_TOKEN,INSTAGRAM_BUSINESS_ACCOUNT_ID,INSTAGRAM_CAROUSEL_BACKGROUND_AB_ENABLED,INSTAGRAM_CAROUSEL_BACKGROUND_AB_ROLLOUT_PERCENT,INSTAGRAM_CAROUSEL_BACKGROUND_AB_VARIANTS,INSTAGRAM_CAROUSEL_BACKGROUND_AB_EXPLORATION_PERCENT,INSTAGRAM_CAROUSEL_BACKGROUND_AB_WINNERS,INSTAGRAM_AUTONOMOUS_EXPLORATION_PERCENT,INSTAGRAM_AUTONOMOUS_CREATIVE_WINNERS,INSTAGRAM_INSIGHTS_AUTONOMOUS_DECISIONS_ENABLED,SOCIAL_COPY_EXPERIMENT_CONFIG,GA4_PROPERTY_ID,R2_BUCKET,R2_S3_ENDPOINT,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY
          --include-social-secrets

      # Monday reserves the two-post cadence for the weekly border carousel
      # and the scheduled Reel; Friday reserves it for one article carousel
      # and the Reel. Both schedules are UTC and run before this daily job.
      - name: Reserve daily cadence for scheduled Reel slots
        id: reserve_daily_cadence
        if: github.event_name == 'schedule' && github.event.schedule == '20 8 * * *'
        shell: bash
        run: |
          set -euo pipefail
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo 'article_only=false' >> "$GITHUB_OUTPUT"
          case "$(date -u +%u)" in
            1) echo 'skip=true' >> "$GITHUB_OUTPUT" ;;
            5)
              echo 'article_only=true' >> "$GITHUB_OUTPUT"
              echo 'ONLY=article' >> "$GITHUB_ENV"
              ;;
          esac

      - name: Require Instagram Graph publishing credentials
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.reserve_daily_cadence.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test -n "${INSTAGRAM_ACCESS_TOKEN:-}" || { echo '::error::Instagram Graph token is absent; complete Meta app review and configure SERVER_INSTAGRAM_ACCESS_TOKEN in Remote Config.'; exit 1; }
          test -n "${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}" || { echo '::error::Instagram business account ID is absent from Remote Config.'; exit 1; }

      - name: Verify Instagram Graph account readiness
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.reserve_daily_cadence.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Load probe-only credentials into this shell, not later workflow steps.
          eval "$(GITHUB_ENV= node scripts/load-rc-env.mjs --only-env=FB_PAGE_ID,FB_USER_ACCESS_TOKEN --include-social-secrets)"
          if [ -n "${FB_USER_ACCESS_TOKEN:-}" ]; then printf '::add-mask::%s\n' "$FB_USER_ACCESS_TOKEN"; fi
          READY_CHANNELS="$(node scripts/check-social-publish-readiness.mjs --ready-channels)"
          case " $READY_CHANNELS " in
            *" instagram "*) echo 'Instagram Graph account readiness verified.' ;;
            *) echo '::error::Instagram readiness probe did not verify the linked Page, content grant, publisher-token identity, and account ID.'; exit 1 ;;
          esac
          unset FB_PAGE_ID FB_USER_ACCESS_TOKEN

      # Only needed for the job slot — same reasoning as linkedin-member-daily.yml:
      # without it the poster skips the job slot rather than guessing.
      - name: Compute assemble-jobs cache key
        id: assemble_cache_key
        if: steps.reserve_daily_cadence.outputs.skip != 'true' && steps.reserve_daily_cadence.outputs.article_only != 'true' && env.ONLY != 'article' && env.ONLY != 'border' && env.INSTAGRAM_ACCESS_TOKEN != ''
        uses: ./.github/actions/assemble-jobs-cache-key
        with:
          args: --no-summaries

      - name: Restore assemble-jobs cache
        id: assemble_cache
        if: steps.reserve_daily_cadence.outputs.skip != 'true' && steps.reserve_daily_cadence.outputs.article_only != 'true' && env.ONLY != 'article' && env.ONLY != 'border' && env.INSTAGRAM_ACCESS_TOKEN != '' && steps.assemble_cache_key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      - name: Assemble jobs dataset
        id: assemble
        if: steps.reserve_daily_cadence.outputs.skip != 'true' && steps.reserve_daily_cadence.outputs.article_only != 'true' && env.ONLY != 'article' && env.ONLY != 'border' && env.INSTAGRAM_ACCESS_TOKEN != ''
        run: node scripts/assemble-jobs-dataset.mjs --no-summaries

      - name: Save assemble-jobs cache
        if: steps.reserve_daily_cadence.outputs.skip != 'true' && steps.reserve_daily_cadence.outputs.article_only != 'true' && env.ONLY != 'article' && env.ONLY != 'border' && env.INSTAGRAM_ACCESS_TOKEN != '' && steps.assemble.outcome == 'success' && steps.assemble_cache_key.outputs.key != '' && steps.assemble_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/assemble-jobs
          key: assemble-jobs-${{ runner.os }}-${{ steps.assemble_cache_key.outputs.key }}

      # NB: each flag is appended with an `if`, never with `[ c ] && ARGS+=…`
      # — see linkedin-member-daily.yml's identical comment for why.
      - name: Post to Instagram
        if: inputs.dry_run != true && inputs.dry_run != 'true' && steps.reserve_daily_cadence.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' || (github.event_name == 'schedule' && env.APPROVAL_TRUSTED_SCHEDULE != 'true') }}
          ALLOW_SIDE_EFFECT: ${{ github.event_name != 'schedule' || env.APPROVAL_TRUSTED_SCHEDULE == 'true' }}
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' || (github.event_name == 'schedule' && env.APPROVAL_TRUSTED_SCHEDULE != 'true') }}
        run: |
          set -euo pipefail
          # The publisher repeats the readiness check at its own boundary.
          # Keep verifier credentials scoped to this shell, and load them only
          # for a live publish.
          if [ "$ALLOW_SIDE_EFFECT" = "true" ] && [ "$EFFECTIVE_DRY_RUN" != "true" ]; then
            eval "$(GITHUB_ENV= node scripts/load-rc-env.mjs --only-env=FB_PAGE_ID,FB_USER_ACCESS_TOKEN --include-social-secrets)"
            if [ -n "${FB_USER_ACCESS_TOKEN:-}" ]; then printf '::add-mask::%s\n' "$FB_USER_ACCESS_TOKEN"; fi
          fi
          ARGS=()
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$ONLY" ]; then ARGS+=("--only=$ONLY"); fi
          if [ -n "$REPORT_DATE" ]; then ARGS+=("--date=$REPORT_DATE"); fi
          npx --no-install tsx scripts/post-to-instagram.mjs ${ARGS[@]+"${ARGS[@]}"}
          unset FB_PAGE_ID FB_USER_ACCESS_TOKEN

      - name: Commit posted ledger
        if: success() && inputs.dry_run != true && inputs.dry_run != 'true' && steps.reserve_daily_cadence.outputs.skip != 'true' && (github.event_name != 'schedule' || env.APPROVAL_TRUSTED_SCHEDULE == 'true')
        run: |
          set -euo pipefail
          # Same fix as linkedin-member-daily.yml (#6424): `git diff --quiet
          # <path>` on a path that has never existed exits 128, not 0/1, so a
          # failed/skipped post (no ledger write yet) fell through into
          # `git add` on a missing pathspec and hard-failed the step.
          files=()
          for f in data/instagram-posted.json; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "no ledger or queue file written — nothing to commit"; exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "no ledger changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(instagram): track posted and queued carousel content [skip ci]"
          # The stats assembly step can leave an untracked file in the checkout.
          # Preserve it while rebasing, and fail the workflow if the ledger
          # cannot be persisted: a green run with a lost queue hides content.
          bash scripts/lib/git-push-with-retry.sh \
            --max-attempts 20 \
            --stash-dirty

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
