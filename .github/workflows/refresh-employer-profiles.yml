name: Refresh Employer Profiles

# Regenerates data/employer-profiles.json (the FACTUAL dataset behind the
# evergreen /aziende/<slug>/ pages, build-plugins/employerProfilePagesPlugin.ts)
# from the current active-job corpus + hiring history, and commits it to main
# when it drifts. Keeps the committed snapshot fresh WITHOUT a blocking
# staleness gate on the PR path (a hard `--check` gate would turn main red on
# every daily crawler push, since the corpus changes constantly — issue #1035
# class). Reviewer follow-up on PR #4511.

on:
  workflow_dispatch:
  schedule:
    # Twice a week, off-peak (04:40 UTC Mon+Thu) to avoid deploy/cron contention.
    - cron: '40 4 * * 1,4'

permissions:
  contents: write
  issues: write     # for github-issue-creator on failure

concurrency:
  group: refresh-employer-profiles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assemble active-job corpus
        run: node scripts/assemble-jobs-dataset.mjs

      - name: Regenerate employer-profiles dataset
        run: node scripts/build-employer-profiles.mjs --stats && node scripts/build-employer-profiles.mjs

      # Validate the regenerated dataset BEFORE committing (bot-direct-to-main =
      # same invariant gate as a PR): the compat self-map + plugin emit must
      # stay green so a refresh can never poison main with a dataset that
      # breaks the committed-snapshot tests.
      - name: Validate dataset (compat self-map + plugin emit)
        run: npx vitest run tests/employer-profile-pages.test.ts tests/search-console-compat.test.ts

      # load-rc-env.mjs needs GOOGLE_APPLICATION_CREDENTIALS to authenticate
      # to Remote Config (scripts/load-rc-env.mjs:479-482 exits 0 as a no-op
      # otherwise); this workflow never set it before, which made the step
      # below inert. Same pattern as monitor-seo-ctr-by-template.yml.
      - name: Write Service Account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Firebase SA credentials — GITHUB_PAT load will be a no-op"
          fi

      # GITHUB_PAT = the identity actually honoured by main's "main required
      # CI checks" ruleset bypass_actors on a direct git push (issue #6325:
      # the App installation token minted below alone got a HARD GH013
      # rejection on all 40 retry attempts — no "Bypassed rule violations"
      # — while every other main-writing data-refresh workflow that loads
      # GITHUB_PAT here succeeds). configure-main-push-auth.sh already
      # prefers GITHUB_PAT over APP_TOKEN; loading it here is the only
      # change needed. Missing from Remote Config → falls back to APP_TOKEN
      # exactly as before (no regression).
      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      # App installation token = secondary push identity fallback if
      # GITHUB_PAT above is unavailable. git-push-with-retry.sh picks up
      # APP_TOKEN automatically when set. Missing App creds → APP_TOKEN
      # unset, push falls back to the ambient credential (no regression).
      - name: Mint App token (push identity for the ruleset bypass)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      - name: Commit and push employer-profiles snapshot
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          # Commit ONLY the dataset — assemble-jobs mutates other tracked data
          # files (expired-jobs/stats-history) that are NOT this workflow's
          # concern; leave them uncommitted in the runner.
          git add data/employer-profiles.json
          git diff --cached --quiet && echo "No employer-profiles changes to commit" && exit 0
          git commit -m "chore(data): refresh employer-profiles snapshot [skip ci]"
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/assemble-jobs-dataset.mjs && node scripts/build-employer-profiles.mjs && git add data/employer-profiles.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "CI Failure: Refresh Employer Profiles" \
            --description "Employer-profiles refresh failed. Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
