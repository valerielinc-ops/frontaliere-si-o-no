            exit 1
          fi
          if [ ! -s "$status_file" ] && [ ! -s "$pid_file" ]; then
            echo "::error::roche: launch step succeeded but published neither status nor PID; refusing to wait for the group budget"
            exit 1
          fi
          deadline=$((SECONDS + 340 * 60))
