name: Post-deploy Publish (side-effects + mark good)

# Reusable workflow called from deploy-publish.yml as the `publish` job
# (was deploy.yml before the build/publish split).
# Runs ONLY when build + deploy + validate-dist + validate-live have all
# succeeded — i.e. the new dist is live AND has passed every gate. This
# is the right place for IRREVERSIBLE side-effects:
#
#   - Sync previous-slug-winners.json (git push)
#   - Post to LinkedIn + Reddit (workflow_dispatch only). Facebook moved to the
#     standalone scheduled poster: .github/workflows/fb-articles-daily-schedule.yml
#   - Submit URLs to Google Indexing API + IndexNow + GSC
#   - Mark this run as last_known_good (rollback target)
#
# Previously these lived inside `validate-live`. Problem: validate-live
# completed BEFORE validate-dist (which holds the SEO ratchet gates). If
# validate-dist failed AFTER validate-live succeeded, rollback fired but
# Facebook/LinkedIn had already announced URLs that now point to the
# rolled-back dist (mismatch or 404). IndexNow had pinged Bing on the
# bad-dist URLs, baking the bad version into search engines.
#
# Inputs match validate-live (deploy_run_id + deploy_event_name).
on:
  workflow_call:
    inputs:
      deploy_run_id:
        description: 'Run ID of the calling deploy workflow run.'
        required: true
        type: string
      deploy_event_name:
        description: 'github.event_name from the caller (workflow_dispatch / push / etc.)'
        required: true
        type: string
      deploy_ref:
        description: 'Commit SHA of the build the artifacts came from. Pass when the caller runs at a different SHA than the build (e.g. deploy-publish.yml on workflow_run). Empty = checkout the caller default.'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for git push in sync-previous-slug-winners
      actions: read     # for download-artifact same-run
      issues: write     # for github-issue-creator on publish failure
    steps:
      - name: Checkout (build SHA via deploy_ref, else caller default)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Firebase secrets not set — registry operations will be skipped."
          fi

      # Hydrate the runner env with secrets pulled from Firebase Remote
      # Config so the social-media post steps below see FB / LinkedIn /
      # Reddit tokens as `process.env.*`.
      - name: Load secrets from Remote Config (FB + LinkedIn + Reddit tokens)
        run: node scripts/load-rc-env.mjs

      # Small JSON artifacts only — NO github-pages download here. All keyed on
      # `deploy_run_id` (the BUILD run); run-id + token makes the fetch work both
      # same-run (legacy caller) and cross-run (deploy-publish.yml workflow_run).
      - name: Download pre-deploy sitemap snapshot (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: pre-deploy-snapshot-${{ inputs.deploy_run_id }}
          path: /tmp/pre-deploy-snapshot
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous-slug winners (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: winners-${{ inputs.deploy_run_id }}
          path: /tmp/winners
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download sitemaps bundle (pre-deploy + new + build-id)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sitemaps-${{ inputs.deploy_run_id }}
          path: /tmp/sitemaps-bundle
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Master jobs.json (titleByLocale/slugByLocale) is GITIGNORED and
      # stripped from the Pages artifact (jobsJsonDistCleanupPlugin, PR #712),
      # so it is NOT present in this checkout. The Google Indexing API job
      # submitter (submit-google-indexing-jobs.js) reads public/data/jobs.json
      # to build per-job board URLs — without this it logs "Unable to read
      # jobs.json" and silently skips submission on every deploy. Restore it
      # from the same dedicated artifact post-deploy-validate-dist uses.
      # continue-on-error: profile_sequential builds don't upload it, and the
      # submitter already exits 0 gracefully when jobs.json is absent.
      - name: Download master jobs.json (for indexing API)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: jobs-master-${{ inputs.deploy_run_id }}
          path: /tmp/jobs-master
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage downloaded data files
        run: |
          if [ -f /tmp/sitemaps-bundle/pre-deploy-sitemap-urls.json ]; then
            cp /tmp/sitemaps-bundle/pre-deploy-sitemap-urls.json /tmp/pre-deploy-sitemap-urls.json
          elif [ -f /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json ]; then
            cp /tmp/pre-deploy-snapshot/pre-deploy-sitemap-urls.json /tmp/pre-deploy-sitemap-urls.json
          fi
          if [ -f /tmp/winners/previous-slug-winners.json ]; then
            cp /tmp/winners/previous-slug-winners.json data/previous-slug-winners.json
          fi
          # Expose master jobs.json to the indexing API submitter, which
          # reads public/data/jobs.json (same staging as post-deploy-validate-dist).
          if [ -f /tmp/jobs-master/jobs.json ]; then
            mkdir -p public/data
            cp -f /tmp/jobs-master/jobs.json public/data/jobs.json
            echo "[jobs-master] staged public/data/jobs.json ($(wc -c < public/data/jobs.json) bytes)"
          else
            echo "[jobs-master] artifact not present — indexing API job submit will skip"
          fi

      - name: Sync previous-slug winners registry
        # The build in deploy.yml may update data/previous-slug-winners.json.
        # The updated file is downloaded from the winners artifact above.
        # If it changed relative to HEAD, commit and push it here.
        if: success()
        # continue-on-error: matches every sibling step in this job. Without
        # it, a genuine stash-pop conflict (see the `exit 1` path below) would
        # hard-fail this step and skip the downstream success()-gated steps
        # (last-known-good marker, indexing API submit, LinkedIn/Reddit,
        # IndexNow) over an unrelated winners-registry stash conflict on an
        # otherwise-good deploy (review on PR #3445, round 2, 2026-07-04).
        # The `::error::` annotation already gives visibility without the
        # added blast radius.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet data/previous-slug-winners.json; then
            echo "[previous-slug-winners] no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previous-slug-winners.json
          git commit -m "chore(seo): sync previous-slug winners registry"
          # Same silent-stash-pop anti-pattern flagged in PR #3445 (review
          # 2026-07-04): `|| true` on push tolerated the benign "nothing to
          # stash" case, but also swallowed real push failures, and `|| true`
          # on pop masked a genuine pop-conflict — leaving the working tree
          # mid-conflict while the job's downstream steps (indexing API
          # submit, LinkedIn/Reddit, IndexNow) ran on incomplete state with no
          # signal. Only pop-guard when something was actually stashed; a real
          # pop failure now fails the job loudly instead of continuing silent.
          # `stashed` is derived from `git status --porcelain` BEFORE the
          # stash (like scripts/lib/git-push-with-retry.sh's --stash-dirty),
          # not by string-matching stash's human-readable output — the prior
          # version's "No local changes to save" match would misfire on a
          # runner-image git wording/locale change (review round 2 nit).
          stashed=0
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --keep-index --include-untracked -m "validation-build-tree"
            stashed=1
          fi
          bash scripts/lib/git-push-with-retry.sh \
            --in-place-resolver-cmd "node scripts/lib/resolve-winners-conflict.mjs && git add -A"
          if [ "$stashed" = "1" ]; then
            if ! git stash pop; then
              echo "::error::Failed to restore stashed validation-build-tree state after push-retry; stash left in stack for manual recovery"
              exit 1
            fi
          fi

      - name: Read deploy metadata from Firestore
        id: deploy-meta
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(node scripts/deploy-registry.mjs get \
            --run-id="${{ inputs.deploy_run_id }}" 2>/dev/null || echo '{}')
          echo "data=$DATA" >> "$GITHUB_OUTPUT"

      - name: Wait for live article metadata
        if: |
          success() &&
          inputs.deploy_event_name == 'workflow_dispatch' &&
          fromJson(steps.deploy-meta.outputs.data || '{}').articleUrl != null
        id: wait_live_meta
        continue-on-error: true
        env:
          ARTICLE_URL: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleUrl }}
          OG_TITLE: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogTitle }}
          OG_IMAGE: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogImage }}
        run: |
          node scripts/wait-for-live-article-meta.mjs \
            "$ARTICLE_URL" \
            "$OG_TITLE" \
            "$OG_IMAGE"

      # NOTE: Facebook article posting is NOT here anymore. It moved to the
      # standalone scheduled poster (.github/workflows/fb-articles-daily-schedule.yml
      # → scripts/schedule-fb-articles-daily.mjs), which posts new articles
      # independently of the deploy path and dedups via data/fb-posted-articles.json.
      # This decouples FB announcements from the workflow_dispatch+articleId gate
      # that left articles created outside that exact path unposted. LinkedIn and
      # Reddit still post here (per-deploy, workflow_dispatch only).

      - name: Post to LinkedIn Company Page
        if: |
          success() &&
          inputs.deploy_event_name == 'workflow_dispatch' &&
          fromJson(steps.deploy-meta.outputs.data || '{}').articleId != null &&
          steps.wait_live_meta.outcome == 'success'
        continue-on-error: true
        env:
          ARTICLE_ID: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleId }}
          ARTICLE_URL: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleUrl }}
          OG_TITLE: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogTitle }}
          OG_DESCRIPTION: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogDescription }}
          ARTICLE_CATEGORY: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleCategory }}
        run: |
          node scripts/post-to-linkedin.mjs \
            "$ARTICLE_ID" \
            "$ARTICLE_URL" \
            "$OG_TITLE" \
            "$OG_DESCRIPTION" \
            "$ARTICLE_CATEGORY"

      - name: Post to Reddit Communities
        if: |
          success() &&
          inputs.deploy_event_name == 'workflow_dispatch' &&
          fromJson(steps.deploy-meta.outputs.data || '{}').articleId != null &&
          steps.wait_live_meta.outcome == 'success'
        continue-on-error: true
        env:
          ARTICLE_ID: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleId }}
          ARTICLE_URL: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleUrl }}
          OG_TITLE: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogTitle }}
          OG_DESCRIPTION: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').ogDescription }}
          ARTICLE_CATEGORY: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleCategory }}
        run: |
          node scripts/post-to-reddit.mjs \
            "$ARTICLE_ID" \
            "$ARTICLE_URL" \
            "$OG_TITLE" \
            "$OG_DESCRIPTION" \
            "$ARTICLE_CATEGORY"

      - name: Restore indexing API daily tracker
        id: indexing-cache
        uses: actions/cache@v5
        with:
          path: /tmp/indexing-api-submitted-today.json
          key: indexing-api-${{ github.run_id }}
          restore-keys: |
            indexing-api-

      - name: Post-deploy indexing (parallel)
        if: success()
        continue-on-error: true
        timeout-minutes: 5
        env:
          ARTICLE_URL: ${{ fromJson(steps.deploy-meta.outputs.data || '{}').articleUrl }}
          # gh CLI (scripts/lib/github-issue-creator.mjs, used by
          # verify-post-deploy-seo.mjs) only honors GH_TOKEN/GITHUB_TOKEN —
          # without this, post-deploy SEO regressions never opened an issue
          # (PR #3322 review, same class as monitor-gsc-job-indexation.mjs).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          timeout 90 node scripts/submit-google-indexing-jobs.js &
          PID_GOOGLE=$!
          timeout 90 node scripts/submit-indexnow.js &
          PID_INDEXNOW=$!
          timeout 180 node scripts/submit-google-indexing.js &
          PID_GSC=$!
          timeout 90 node scripts/verify-post-deploy-seo.mjs &
          PID_SEO=$!
          timeout 90 npx tsx scripts/monitor-ti-sector-coverage.mjs &
          PID_TI_SECTOR=$!

          FAIL=0
          wait $PID_GOOGLE  || { echo "⚠️ Google Indexing API failed"; FAIL=1; }
          wait $PID_INDEXNOW || { echo "⚠️ IndexNow submission failed"; FAIL=1; }
          wait $PID_GSC     || { echo "⚠️ GSC submission failed"; FAIL=1; }
          wait $PID_SEO     || { echo "⚠️ Post-deploy SEO verification failed"; FAIL=1; }
          wait $PID_TI_SECTOR || { echo "⚠️ TI sector coverage check failed"; FAIL=1; }

          if [ $FAIL -ne 0 ]; then
            echo "::warning::Some post-deploy indexing steps failed (non-blocking)"
          fi
          echo "✅ Post-deploy indexing complete"

      # Last step: register the run as last_known_good in the deploy
      # registry. Must come AFTER side-effects so a partial publish
      # failure (FB token revoked, IndexNow 5xx, etc.) doesn't poison
      # the rollback target — but since each side-effect step is
      # `continue-on-error: true`, this step runs even when one of them
      # fails. That's intentional: a deploy that survived dist+live
      # gates is "good enough" to roll back to even if FB/LI API hiccups.
      - name: Mark this deploy as last_known_good
        if: success()
        run: |
          node scripts/deploy-registry.mjs set-good \
            --run-id="${{ github.run_id }}" \
            --sha="${{ github.sha }}"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Standard "Workflow Failure: <name>" prefix so the central reconciler
          # (close-recovered-failure-issues.mjs) auto-closes on recovery; <name> equals
          # name: so gh run list -w resolves the run. (Was the non-standard literal
          # "Publish post-deploy fallita" -> failure issue stayed orphan on green.)
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: Post-deploy Publish (side-effects + mark good)" \
            --description "## Publish post-deploy fallita
          **Deploy run:** https://github.com/${{ github.repository }}/actions/runs/${{ inputs.deploy_run_id }}
          **Publish run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **SHA:** ${{ github.sha }}

          Side-effects (FB/LinkedIn/IndexNow) o marking last_known_good fallito.
          Il deploy resta live (validate-dist + validate-live già passati)." \
            --priority 2 \
            --label Bug \
            --workflow "Post-deploy Publish (side-effects + mark good)"
