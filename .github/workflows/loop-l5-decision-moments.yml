name: Loop L5 decision moments

on:
  schedule:
    - cron: '23 10 * * *'
  push:
    branches: [main]
    paths:
      - 'data/fuel-prices.json'
      - 'data/border-wait-current.json'
      - 'data/pharmacies-ticino.json'
      - 'data/pharmacy-duties-ticino.json'
      - 'data/decision-moment-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l5-decision-moments.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l5-decision-moments.yml'
  pull_request:
    paths:
      - 'data/fuel-prices.json'
      - 'data/border-wait-current.json'
      - 'data/pharmacies-ticino.json'
      - 'data/pharmacy-duties-ticino.json'
      - 'data/decision-moment-outcomes.json'
      - 'data/loop-fleet/loop-registry.json'
      - 'scripts/ci/loop-l5-decision-moments.mjs'
      - 'scripts/ci/record-loop-fleet-evidence.mjs'
      - 'scripts/lib/loop-fleet-contract.mjs'
      - 'scripts/lib/github-issue-creator.mjs'
      - '.github/workflows/loop-l5-decision-moments.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Create/update one deduplicated issue when a decision surface is not safe'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-l5-decision-moments
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout decision surface inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/fuel-prices.json
            /data/border-wait-current.json
            /data/pharmacies-ticino.json
            /data/pharmacy-duties-ticino.json
            /data/decision-moment-outcomes.json
            /data/loop-fleet/loop-registry.json
            /scripts/ci/loop-l5-decision-moments.mjs
            /scripts/ci/record-loop-fleet-evidence.mjs
            /scripts/lib/loop-fleet-contract.mjs
            /scripts/lib/github-issue-creator.mjs
            /.github/workflows/loop-l5-decision-moments.yml
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Audit decision moments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.issue == true }}
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l5
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          args=(--json --apply --report-dir "$REPORT_DIR" --fuel data/fuel-prices.json --border data/border-wait-current.json --pharmacies data/pharmacies-ticino.json --duties data/pharmacy-duties-ticino.json --outcomes data/decision-moment-outcomes.json --registry data/loop-fleet/loop-registry.json)
          if [ "$ISSUE_ENABLED" = "true" ]; then
            args+=(--issue --strict)
          else
            args+=(--dry-run)
          fi
          set +e
          node scripts/ci/loop-l5-decision-moments.mjs "${args[@]}" | tee "$REPORT_DIR/cli-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
          run_code=${PIPESTATUS[0]}
          set -e
          if [ "$run_code" -ne 0 ] && jq -e '(.issued == true and .ok == false)' "$REPORT_DIR/l5-result.json" >/dev/null 2>&1; then
            echo 'L5 finding persisted; only reversible stale-label and review-only bridge recommendations were produced.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$run_code" -ne 0 ]; then
            exit "$run_code"
          fi
      - name: Validate runner-local L5 outcome export
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l5
        run: |
          test -s "$REPORT_DIR/l5-outcome.json"
          jq -e '(.loopId == "L5" and (.status | type) == "string" and (.independent | type) == "boolean" and (.metrics | type) == "object" and .safeToAct == false and .publishedDataUntouched == true)' "$REPORT_DIR/l5-outcome.json" >/dev/null
      - name: Record canonical L5 evidence
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/loop-fleet-l5
        run: node scripts/ci/record-loop-fleet-evidence.mjs --loop L5 --report-dir "$REPORT_DIR" --registry data/loop-fleet/loop-registry.json
      - name: Upload L5 observation and actions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-l5-decision-moments-${{ github.run_id }}
          path: ${{ runner.temp }}/loop-fleet-l5/
          retention-days: 90
          if-no-files-found: error
