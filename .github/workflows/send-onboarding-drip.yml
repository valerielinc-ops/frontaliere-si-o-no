name: Send Onboarding Drip

on:
  schedule:
    # Daily 04:23 UTC (06:23 CEST) — after the weekly newsletter (03:33 UTC)
    # and before job-alerts (05:00 UTC). Off the :00/:15/:30/:45 minute slots
    # GitHub Actions deprioritizes under load. The scheduled run always SENDS
    # (that is the point of the drip); manual dispatch defaults to a dry-run.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (scan only), test (one send to target), or send'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - test
          - send
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      test_step:
        description: 'Drip step to render in test mode (0-3)'
        required: false
        default: '0'
        type: string
      max:
        description: 'Max emails this run'
        required: false
        default: '200'
        type: string

concurrency:
  group: send-onboarding-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Run onboarding drip
        env:
          MODE: ${{ github.event.inputs.mode || 'send' }}
          TARGET: ${{ github.event.inputs.target_email || '' }}
          TEST_STEP: ${{ github.event.inputs.test_step || '0' }}
          MAX: ${{ github.event.inputs.max || '200' }}
        run: |
          echo "📧 Onboarding drip mode=$MODE max=$MAX"
          if [ "$MODE" = "send" ]; then
            node scripts/send-onboarding-drip.mjs --send --max "$MAX"
          elif [ "$MODE" = "test" ]; then
            if [ -z "$TARGET" ]; then echo "❌ test mode requires target_email"; exit 1; fi
            node scripts/send-onboarding-drip.mjs --test --target-email "$TARGET" --test-step "$TEST_STEP"
          else
            node scripts/send-onboarding-drip.mjs --dry-run --max "$MAX"
          fi
