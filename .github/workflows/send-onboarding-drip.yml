name: Send Onboarding Drip

on:
  schedule:
    # Daily 04:23 UTC (06:23 CEST) — after the weekly newsletter (03:33 UTC)
    # and before job-alerts (05:00 UTC). Off the :00/:15/:30/:45 minute slots
    # GitHub Actions deprioritizes under load. The scheduled run always SENDS
    # (that is the point of the drip); manual dispatch defaults to a dry-run.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (scan only), test (one send to target), or send'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - test
          - send
      target_email:
        description: 'Recipient for test mode'
        required: false
        default: ''
        type: string
      test_step:
        description: 'Drip step to render in test mode (0-3)'
        required: false
        default: '0'
        type: string
      max:
        description: 'Max emails this run (empty = no cap, only the provider quota)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Keep the run preview-only unless explicitly disabled.'
        required: false
        default: true
        type: boolean
concurrency:
  group: send-onboarding-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    # It had none (perf-plan email senders, E3): the job takes ~8 minutes, so 30 is a
    # generous bound that still frees the runner if a provider call hangs.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      # node_modules in cache (perf-plan email senders, A3/E3): key on the lockfile and
      # the Node major, `npm ci` only on a miss.
      - name: Setup Node.js and restore node_modules
        uses: ./.github/actions/npm-ci-cached

      # Also for the dry run: the scan reads the subscribers from Firestore (reads only).
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON missing"
            exit 1
          fi

      # Least privilege (perf-plan email senders, E3): only the keys the job's code reads
      # from `process.env`. Enforced by tests/email-senders-workflow-perimeter.test.ts.
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs --only-env=CF_ACCOUNT_ID,CF_API_TOKEN,CLOUDFLARE_EMAIL_API_TOKEN,MAILEROO_ACCOUNT_API_KEY,MAILEROO_API_KEY,MAILEROO_NEWSLETTER_API_KEY,MAILEROO_TRANSACTIONAL_API_KEY,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILTRAP_API_TOKEN,NEWSLETTER_FROM,NEWSLETTER_SECRET,PER_USER_SEND_TIME,RESEND_API_KEY

      # Dry run (input dry_run, default true for manual dispatches): builds the queue and
      # prints DRIP_METRICS, with no provider call and no write (reads only).
      - name: Scan onboarding drip without sending (dry run)
        if: inputs.dry_run == true || inputs.dry_run == 'true'
        run: node scripts/send-onboarding-drip.mjs --dry-run

      - name: Run onboarding drip
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        env:
          MODE: ${{ github.event.inputs.mode || 'send' }}
          TARGET: ${{ github.event.inputs.target_email || '' }}
          TEST_STEP: ${{ github.event.inputs.test_step || '0' }}
          MAX: ${{ github.event.inputs.max || '' }}
          ALLOW_SIDE_EFFECT: 'true'
          EFFECTIVE_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: |
          if [ "$ALLOW_SIDE_EFFECT" != "true" ] || [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            MODE=dry-run
          fi
          echo "📧 Onboarding drip mode=$MODE max=$MAX"
          if [ "$MODE" = "send" ]; then
            node scripts/send-onboarding-drip.mjs --send --max "$MAX"
          elif [ "$MODE" = "test" ]; then
            if [ -z "$TARGET" ]; then echo "❌ test mode requires target_email"; exit 1; fi
            node scripts/send-onboarding-drip.mjs --test --target-email "$TARGET" --test-step "$TEST_STEP"
          else
            node scripts/send-onboarding-drip.mjs --dry-run --max "$MAX"
          fi
