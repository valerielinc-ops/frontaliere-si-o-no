name: Validate modified workflows

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/validate-modified-workflows.mjs'
      - 'scripts/ci/line-at.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: modified workflows valid
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.contracts.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Validate workflow contracts
        id: contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/validate-modified-workflows.mjs

      - name: actionlint modified workflows
        if: steps.contracts.outputs.files != ''
        uses: raven-actions/actionlint@v2.2.0
        with:
          files: ${{ steps.contracts.outputs.files }}
          shellcheck: false
          pyflakes: false

  checkout_measurement:
    name: issue-fix checkout measurement
    needs: validate
    if: ${{ github.event_name == 'pull_request' && needs.validate.result == 'success' && contains(needs.validate.outputs.files, '.github/workflows/issue-fix.yml') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The baseline and sparse profiles use the same ref, history depth, and
      # blob filter. Only the working-tree population differs.
      - name: Full checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          path: checkout-full

      - name: Issue-fix sparse checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          path: checkout-sparse
          sparse-checkout: |
            /.github/
            /.codex/
            /.claude/
            /build-plugins/
            /components/
            /docs/
            /functions/
            /hooks/
            /infra/
            /packages/
            /scripts/
            /server/
            /services/
            /tests/
            /.*
            /*.cjs
            /*.css
            /*.csv
            /*.html
            /*.js
            /*.json
            /*.lock
            /*.mjs
            /*.md
            /*.scss
            /*.ts
            /*.tsx
            /*.txt
            /*.yaml
            /*.yml
            /data/canton-municipalities.json
            /data/swiss-canton-salary-index.json
            /data/swiss-locality-postal-codes.json
            /data/swiss-postal-code-index.json
          sparse-checkout-cone-mode: false

      - name: Measure same-HEAD checkout populations
        run: node checkout-full/scripts/ci/measure-checkout-profile.mjs checkout-full checkout-sparse
