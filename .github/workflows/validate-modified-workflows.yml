name: Validate modified workflows

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/validate-modified-workflows.mjs'
      - 'scripts/ci/line-at.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: modified workflows valid
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      files: ${{ steps.contracts.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Validate workflow contracts
        id: contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/validate-modified-workflows.mjs

      - name: actionlint modified workflows
        if: steps.contracts.outputs.files != ''
        uses: raven-actions/actionlint@v2.2.0
        with:
          files: ${{ steps.contracts.outputs.files }}
          shellcheck: false
          pyflakes: false

  checkout_measurement:
    name: issue-fix checkout measurement
    needs: validate
    if: ${{ github.event_name == 'pull_request' && needs.validate.result == 'success' && contains(needs.validate.outputs.files, '.github/workflows/issue-fix.yml') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The baseline and sparse profiles use the same ref, history depth, and
      # blob filter. Only the working-tree population differs.
      - name: Full checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          path: checkout-full

      - name: Issue-fix sparse checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          path: checkout-sparse
          sparse-checkout: |
            /.github/
            /.codex/
            /.claude/
            /build-plugins/
            /components/
            /docs/
            /functions/
            /hooks/
            /infra/
            /packages/
            /scripts/
            /server/
            /services/
            /tests/
            /.*
            /*.cjs
            /*.css
            /*.csv
            /*.html
            /*.js
            /*.json
            /*.lock
            /*.mjs
            /*.md
            /*.scss
            /*.ts
            /*.tsx
            /*.txt
            /*.yaml
            /*.yml
            /data/canton-municipalities.json
            /data/canton-url-slugs.json
            /data/profession-landing-routes.json
            /data/swiss-canton-salary-index.json
            /data/swiss-locality-postal-codes.json
            /data/swiss-postal-code-index.json
          sparse-checkout-cone-mode: false

      - name: Measure same-HEAD checkout populations
        run: node checkout-full/scripts/ci/measure-checkout-profile.mjs checkout-full checkout-sparse

  source_liveness_measurement:
    name: source-liveness checkout measurement
    needs: validate
    if: ${{ github.event_name == 'pull_request' && needs.validate.result == 'success' && contains(needs.validate.outputs.files, '.github/workflows/source-liveness.yml') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Keep the parent and HEAD measurements on the same runner and use the
      # exact checkout profiles from the two revisions. Each revision also has
      # a full checkout pair so the sparse reduction is independently visible.
      - name: Full checkout parent
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          fetch-depth: 1
          path: source-liveness-parent-full

      - name: Sparse checkout parent
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          fetch-depth: 1
          path: source-liveness-parent-sparse
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/url-first-seen/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Full checkout HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
          filter: blob:none
          path: source-liveness-head-full

      - name: Sparse checkout HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
          filter: blob:none
          path: source-liveness-head-sparse
          sparse-checkout: |
            /.npmrc
            /package.json
            /package-lock.json
            /scripts/load-rc-env.mjs
            /scripts/check-source-liveness.mjs
            /scripts/lib/fetch-with-ref-timeout.mjs
            /scripts/lib/remote-config-template-url.mjs
            /scripts/lib/google-service-account-token.mjs
            /scripts/lib/source-liveness.mjs
            /scripts/lib/int-from-env.mjs
            /scripts/lib/monitor-scheda.mjs
            /scripts/lib/posthog-client.mjs
            /scripts/lib/ga4-service-account.mjs
            /scripts/lib/analytics-settled-window.mjs
            /scripts/lib/github-issue-creator.mjs
          sparse-checkout-cone-mode: false

      - name: Measure parent and HEAD checkout populations
        run: |
          node source-liveness-parent-full/scripts/ci/measure-source-liveness-checkout.mjs \
            source-liveness-parent-full \
            source-liveness-parent-sparse \
            source-liveness-head-full \
            source-liveness-head-sparse
