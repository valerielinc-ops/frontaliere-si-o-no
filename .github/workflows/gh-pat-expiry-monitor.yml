name: GH_PAT Expiry Monitor

# Watchdog for the GH_PAT (stored in Firebase Remote Config, loaded via
# scripts/load-rc-env.mjs). The PAT powers the auto-merge cascade dispatch
# (auto-merge-on-lgtm.yml → post-merge-followup), discover-404s.yml and
# sync-gsc-orphans.yml deploy triggers. If it silently expires, every
# post-LGTM-merge dispatch and deploy trigger starts failing with a red X and
# the follow-up triage evaporates (issue #840 / regression of #836's fix).
#
# This monitor covers TWO failure modes:
#
#   1. LOAD-FAILURE (urgent, "loop is DOWN right now") — the PAT is empty in the
#      environment (RC outage, missing Firebase SA, deleted GITHUB_PAT param) or
#      present-but-invalid (expired/revoked → `gh api user` fails). When this
#      happens the whole autonomous agent loop silently degrades to inert:
#      issue-triage.yml, auto-merge-on-lgtm.yml, recycle-stale-prs.yml and
#      followup-drainer.yml all fall back to GITHUB_TOKEN (no cascade) with only
#      a `::warning::GITHUB_PAT assente` that nobody reads. We turn that silent
#      degradation into ONE deduplicated `priority:urgent` issue
#      ("Agent loop down: GITHUB_PAT failed to load") and auto-CLOSE it the
#      moment the PAT authenticates again (recovery). Max one open alert at a
#      time → no spam.
#
#   2. EXPIRY-NEAR (high, "rotate soon") — the PAT authenticates fine but its
#      `github-authentication-token-expiration` header shows it lapses within
#      EXPIRY_WARN_DAYS (default 30). We open (or dedup-comment on) a separate
#      `priority:high` rotation-reminder issue.
#
# The two alerts have DISTINCT stable titles so dedup is independent: an open
# "loop down" urgent issue never collides with the "rotate soon" reminder.
#
# Zero-Claude by design (pure bash + the existing node issue-creator) per the
# frugality rules in AGENTS.md — no claude-code-action, no extra Max-quota burn.
#
# NB labels (2026-06-04, aggiornato 2026-07-05): gli alert NON portano
# `follow-up`/`crawler` (eviterebbe comunque la route IMMEDIATA crawler, ma qui
# è soprattutto per chiarezza di categoria). Solo `automation` + il priority
# label da --priority. Dal 2026-07-05 classify-issue.mjs NON produce più
# route:none/autofix:false per nessuna categoria: un titolo non-crawler/non-
# follow-up cade in `other` → `agent:fix-queued` come ogni altra categoria, e
# il drainer lo promuove come tutti gli altri. Un run di fix su un PAT-down/
# expiry-near non ha comunque nulla da fixare in codice (richiede rotazione
# credenziali) → il capability-guard generico di `issue-fix.yml` lo aborta al
# turno ~1 con `blocked-secrets` (NON_RETRYABLE → park immediato, no retry
# sprecati). Nessuna azione richiesta qui: è il comportamento atteso, non un
# bug — vedi `ISSUES.md` → "Abort senza PR".

on:
  schedule:
    # Daily at 06:30 UTC — well clear of the GSC-quota windows. Daily (not
    # weekly) because a LOAD-FAILURE means the agent loop is DOWN right now; a
    # week of silent inertia is unacceptable. The expiry-near issue dedups, so
    # the extra cadence costs nothing for that path.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Warn if the PAT expires within this many days'
        required: false
        type: string
        default: '30'

# Serialize so a manual run never races the scheduled one.
concurrency:
  group: gh-pat-expiry-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load RC secrets
        # Loads GITHUB_PAT from Firebase Remote Config into $GITHUB_ENV so the
        # next step can authenticate `gh` as the PAT (same mechanism used by
        # discover-404s.yml / sync-gsc-orphans.yml). NON shadoware con
        # secrets.* — `secrets.GH_PAT` non esiste, il PAT vive solo in RC.
        run: node scripts/load-rc-env.mjs

      - name: Check PAT load-failure + expiry
        id: patcheck
        env:
          WARN_DAYS: ${{ inputs.warn_days || '30' }}
          # GH_REPO is consumed by github-issue-creator.mjs for the --repo flag.
          GH_REPO: ${{ github.repository }}
          # GH_TOKEN for the recovery `gh issue` close/list calls below. Those
          # only touch THIS repo's issues, so the default Actions token (issues:
          # write, granted above) is correct — do NOT use the PAT (it may be the
          # very thing that's broken).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Stable alert titles (dedup keys) ──────────────────────────────
          LOAD_FAIL_TITLE="Agent loop down: GITHUB_PAT failed to load"
          EXPIRY_TITLE="GH_PAT expiry warning: rotate the Remote Config PAT"

          # ── Phase 1: classify PAT health ──────────────────────────────────
          LOAD_FAILED=false
          LOAD_FAIL_REASON=""
          EXPIRY=""

          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT not present in environment — Remote Config load failed or the PAT param is missing. The agent loop is inert until restored."
            LOAD_FAILED=true
            LOAD_FAIL_REASON="GITHUB_PAT is **empty** in the workflow environment — \`scripts/load-rc-env.mjs\` did not provide it. Likely causes: Firebase Remote Config outage, missing/invalid Firebase service-account (\`FIREBASE_SERVICE_ACCOUNT_JSON\`), or the \`GITHUB_PAT\` RC param was deleted."
          else
            LOGIN="$(GH_TOKEN="$GITHUB_PAT" gh api user --jq '.login' 2>/dev/null || true)"
            if [ -z "$LOGIN" ]; then
              echo "::error::GITHUB_PAT is set but failed to authenticate (\`gh api user\` returned nothing) — token expired or revoked."
              LOAD_FAILED=true
              LOAD_FAIL_REASON="GITHUB_PAT **is present but failed to authenticate** — \`gh api user\` returned nothing. The token is almost certainly **expired or revoked**."
            else
              echo "✅ PAT authenticates as '$LOGIN'."
              HEADERS="$(GH_TOKEN="$GITHUB_PAT" gh api -i / 2>/dev/null || true)"
              # `|| true` obbligatorio: con `set -euo pipefail` un grep senza
              # match (PAT classic SENZA header expiration = il caso normale)
              # esce 1 e uccide lo script PRIMA di ogni alert/recovery — il
              # monitor e' morto cosi' a OGNI run dal 2026-06-01 al 06-12,
              # in silenzio (vedi fix + self-alert in fondo al workflow).
              EXPIRY="$(printf '%s\n' "$HEADERS" \
                | { grep -i '^github-authentication-token-expiration:' || true; } \
                | head -n1 \
                | sed -E 's/^[^:]+:[[:space:]]*//' \
                | tr -d '\r')"
            fi
          fi

          echo "LOAD_FAILED=${LOAD_FAILED} | expiry header: '${EXPIRY:-<none>}'"

          # ── Phase 2: LOAD-FAILURE urgent alert (open) or recovery (close) ──
          if [ "$LOAD_FAILED" = "true" ]; then
            echo "::error::Opening/refreshing the urgent 'agent loop down' alert."

            LOAD_DESC="$(printf '%s\n' \
              "## 🚨 Agent loop is DOWN — GITHUB_PAT failed to load" \
              "" \
              "$LOAD_FAIL_REASON" \
              "" \
              "### Impact (silent until now)" \
              "The whole autonomous agent loop depends on \`GITHUB_PAT\` (Firebase Remote" \
              "Config \`GITHUB_PAT\` param, loaded by \`scripts/load-rc-env.mjs\`). With it" \
              "missing/invalid these workflows degrade to **inert** with only a" \
              "\`::warning::GITHUB_PAT assente\` nobody reads:" \
              "- \`issue-triage.yml\` — routing inerte, \`agent:fix\` non applicato" \
              "- \`auto-merge-on-lgtm.yml\` — merge via GITHUB_TOKEN, **nessun cascade** (deploy/followup non partono)" \
              "- \`recycle-stale-prs.yml\` — re-queue \`agent:fix\` SALTATO" \
              "- \`followup-drainer.yml\` / \`post-merge-followup.yml\` — triage perso" \
              "- \`discover-404s.yml\` / \`sync-gsc-orphans.yml\` — deploy trigger rotti" \
              "" \
              "### Action" \
              "1. Verify Firebase RC is reachable and the \`GITHUB_PAT\` param exists + is non-empty." \
              "2. If expired/revoked, generate a fresh PAT (scopes: at least \`repo\` + \`workflow\`) and update the \`GITHUB_PAT\` RC param." \
              "3. Re-run the **GH_PAT Expiry Monitor** workflow — it will **auto-close this issue** once the PAT authenticates again." \
              "" \
              "_Filed automatically by the GH_PAT Expiry Monitor workflow._")"

            node scripts/lib/github-issue-creator.mjs \
              --title "$LOAD_FAIL_TITLE" \
              --description "$LOAD_DESC" \
              --priority 1 \
              --label automation \
              --workflow "GH_PAT Expiry Monitor"

            echo "intentional_fail=true" >> "$GITHUB_OUTPUT"
            echo "::error::GITHUB_PAT load-failure detected — failing the run after filing the urgent alert."
            exit 1
          fi

          # Recovery: close any open load-failure alert (idempotent).
          OPEN_LOAD_ALERT="$(gh issue list \
            --state open \
            --search "in:title \"${LOAD_FAIL_TITLE}\"" \
            --limit 10 \
            --json number,title \
            --jq "[.[] | select(.title == \"${LOAD_FAIL_TITLE}\")][0].number" \
            2>/dev/null || true)"
          if [ -n "$OPEN_LOAD_ALERT" ] && [ "$OPEN_LOAD_ALERT" != "null" ]; then
            echo "Recovery: closing open load-failure alert #${OPEN_LOAD_ALERT}."
            gh issue comment "$OPEN_LOAD_ALERT" \
              --body "✅ Recovery — GITHUB_PAT authenticated successfully on the latest GH_PAT Expiry Monitor run. The agent loop is back. Auto-closing." \
              || true
            gh issue close "$OPEN_LOAD_ALERT" --reason completed || true
          fi

          # ── Phase 3: EXPIRY-NEAR rotation reminder (PAT authenticates) ────
          NOW_EPOCH="$(date -u +%s)"
          SHOULD_WARN=false
          WARN_REASON=""
          EXPIRY_DISPLAY="${EXPIRY:-unknown}"

          if [ -z "$EXPIRY" ]; then
            echo "✅ Authenticated PAT reports no expiry (classic no-expiration token). No expiry warning needed."
          else
            EXPIRY_EPOCH="$(date -u -d "$EXPIRY" +%s 2>/dev/null || true)"
            if [ -z "$EXPIRY_EPOCH" ]; then
              echo "::warning::Could not parse expiry timestamp '$EXPIRY' — skipping numeric comparison."
            else
              DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
              echo "PAT expires in ${DAYS_LEFT} day(s) (warn threshold: ${WARN_DAYS})."
              EXPIRY_DISPLAY="$EXPIRY (${DAYS_LEFT} day(s) left)"
              if [ "$DAYS_LEFT" -le "$WARN_DAYS" ]; then
                SHOULD_WARN=true
                WARN_REASON="GITHUB_PAT expires in **${DAYS_LEFT} day(s)** (on \`${EXPIRY}\`), within the ${WARN_DAYS}-day warning window. Rotate it in Firebase Remote Config (\`GITHUB_PAT\` param) before it lapses to keep the auto-merge cascade and deploy triggers working."
              fi
            fi
          fi

          if [ "$SHOULD_WARN" != "true" ]; then
            echo "✅ No expiry warning needed."
            exit 0
          fi

          echo "::warning::Opening/refreshing a GH_PAT expiry warning issue."

          DESCRIPTION="$(printf '%s\n' \
            "## ⚠️ GH_PAT expiry / health warning" \
            "" \
            "$WARN_REASON" \
            "" \
            "**Detected expiry:** \`${EXPIRY_DISPLAY}\`" \
            "" \
            "### Why this matters" \
            "The \`GITHUB_PAT\` (Firebase Remote Config \`GITHUB_PAT\` param, loaded by" \
            "\`scripts/load-rc-env.mjs\`) drives:" \
            "- the post-LGTM cascade dispatch in \`auto-merge-on-lgtm.yml\` → \`post-merge-followup.yml\`" \
            "- the deploy triggers in \`discover-404s.yml\` and \`sync-gsc-orphans.yml\`" \
            "" \
            "If it expires, those dispatches fail silently (red X, no retry) and follow-up" \
            "triage is lost — the same failure mode #836 fixed, via a different channel." \
            "" \
            "### Action" \
            "1. Generate a fresh PAT with the same scopes (at minimum \`repo\` + \`workflow\`)." \
            "2. Update the \`GITHUB_PAT\` parameter in Firebase Remote Config." \
            "3. Close this issue once rotated." \
            "" \
            "_Filed automatically by the GH_PAT Expiry Monitor workflow._")"

          node scripts/lib/github-issue-creator.mjs \
            --title "$EXPIRY_TITLE" \
            --description "$DESCRIPTION" \
            --priority 2 \
            --label automation \
            --workflow "GH_PAT Expiry Monitor"

      # Secondo presidio credenziali, stessa famiglia del PAT-down: una deploy
      # key di shard definita a DUE livelli (repo-level + environment
      # `shard-secrets-overflow`) fa vincere sempre quella dell'environment, per
      # precedenza GitHub. Chi ripara la key sbagliata crede di aver risolto e
      # il push continua a fallire — incidente 2026-07-30, `uri-it` fermo 3
      # giorni con la remediation del 28 lug resa inerte dallo shadowing e il
      # deploy verde. Serve il PAT (leggere i NOMI dei secret e' API admin-only,
      # `GITHUB_TOKEN` non basta); i valori non vengono mai letti.
      - name: Check shard deploy-key secret shadowing (dedup, zero-Claude)
        continue-on-error: true
        env:
          # $GITHUB_PAT arriva dal $GITHUB_ENV dello step "Load RC secrets"
          # (stessa convenzione dello step patcheck qui sopra: nessun mapping
          # esplicito, il PAT vive solo in Remote Config).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          rc=0
          OUT="$(node scripts/ci/check-shard-secret-shadowing.mjs --strict 2>&1)" || rc=$?
          printf '%s\n' "$OUT"
          if [ "$rc" -eq 0 ]; then
            echo "✅ nessuno shadowing di deploy key shard."
            exit 0
          fi
          DESCRIPTION="$(printf '%s\n' \
            "## 🔴 Deploy key di shard definita a due livelli (shadowing)" \
            "" \
            '```' \
            "$OUT" \
            '```' \
            "" \
            "### Perche' e' bloccante" \
            "GitHub risolve \`secrets.X\` con precedenza **environment > repository**." \
            "Il job \`build-locale\` di \`deploy.yml\` dichiara \`environment: shard-secrets-overflow\`," \
            "quindi per ogni nome presente ai due livelli la CI legge **solo** la copia" \
            "dell'environment: rigenerare la key e salvarla a livello repo e' un **no-op" \
            "silenzioso**. E' esattamente come \`uri-it\` e' rimasto fermo 3 giorni con il" \
            "deploy verde (run 30522223432)." \
            "" \
            "### Azione" \
            "1. Tieni UNA sola copia del secret: quella nell'environment \`shard-secrets-overflow\`." \
            "2. Aggiorna quella copia con il valore della key che ha davvero write sul repo shard." \
            "3. Cancella la copia repo-level (libera anche uno slot sul cap di 100 secret/repo)." \
            "" \
            "_Filed automatically by the GH_PAT Expiry Monitor workflow._")"
          node scripts/lib/github-issue-creator.mjs \
            --title "Shard deploy-key secret shadowed by the shard-secrets-overflow environment" \
            --description "$DESCRIPTION" \
            --priority 2 \
            --label automation \
            --workflow "GH_PAT Expiry Monitor"

      # Watcher-del-watcher: il monitor e' l'unico presidio del PAT-down, ma se
      # CRASHA per un bug proprio (es. pipeline EXPIRY sotto pipefail, rotto
      # in silenzio 2026-06-01->06-12) nessuno se ne accorge e tutta la
      # rilevazione+recovery e' morta. Su failure NON intenzionale → issue
      # dedup (titolo stabile, github-issue-creator) cosi' il loop issue-fix
      # o l'owner la vedono subito. GH_TOKEN = GITHUB_TOKEN (il PAT potrebbe
      # essere proprio la cosa rotta).
      - name: Self-alert on monitor crash (dedup, zero-Claude)
        # Gate su patcheck.conclusion: un flake infra (npm ci, setup-node,
        # load RC) farebbe failure()=true con patcheck SKIPPED → issue
        # depistante "monitor crashed" per una causa transiente. Alert solo se
        # e' davvero lo step di check a fallire in modo non-intenzionale.
        if: failure() && steps.patcheck.conclusion == 'failure' && steps.patcheck.outputs.intentional_fail != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "PAT monitor crashed: gh-pat-expiry-monitor failing" \
            --description "Il run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} e' FALLITO senza passare dal path intenzionale di PAT-down ('intentional_fail' assente). Significa che il monitor stesso e' rotto: finche' non viene fixato, NESSUNO rileva un PAT-down ne' auto-chiude l'alert canonico. Storico: un bug pipefail l'ha tenuto rosso in silenzio dal 2026-06-01 al 06-12. Leggi il log del run e fixa la root cause." \
            --priority 2 \
            --label automation \
            --workflow "GH_PAT Expiry Monitor"

      # Closer half of the step above (#5437 — the class of issue nobody could
      # ever close). Negation of the self-alert condition: runs whenever
      # patcheck did NOT crash on its own bug — either the healthy path or the
      # intentional PAT-down path (patcheck failed ON PURPOSE, intentional_fail
      # =true), both meaning "the monitor itself works". `always()` so this is
      # reached even after patcheck's intentional `exit 1`.
      - name: Resolve self-alert crash issue when the monitor itself is healthy
        if: always() && !(failure() && steps.patcheck.conclusion == 'failure' && steps.patcheck.outputs.intentional_fail != 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/lib/github-issue-creator.mjs --resolve \
            --title "PAT monitor crashed: gh-pat-expiry-monitor failing" \
            --workflow "GH_PAT Expiry Monitor" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
