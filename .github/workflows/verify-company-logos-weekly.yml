name: Verify Company Logos (weekly)

# Assembles the canonical dataset, resolves every effective logo through the
# same resolver used by the renderers, and probes the resulting local and
# external references. Writes broken ones to data/company-logos-broken.json;
# the companion audit workflow opens the actionable issue.
#
# Runs every Sunday 04:00 UTC.

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the guard active for the initial run and for rebase retries.
      COMPANY_LOGO_AUDIT_MIN_JOBS: '1000'
      COMPANY_LOGO_AUDIT_ASSET_BASE_URL: https://cdn.frontaliereticino.ch
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Checkout 68-728s su 10 run: il massimo è il 61% di un cap da 20min.
          # Blobless partial clone come guard-data-integrity #4120 (mediana ~150s
          # nei job filtrati contro ~600s in quelli non filtrati, senza sparse da
          # nessuna parte). Sicuro: il job verifica i loghi e committa, non legge
          # blob storici.
          filter: blob:none
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Firebase credentials for push auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for a direct main push"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load push credentials from Remote Config
        run: node scripts/load-rc-env.mjs

      - name: Assemble canonical jobs dataset
        run: node scripts/assemble-jobs-dataset.mjs --no-summaries

      - name: Verify company logos
        run: npx tsx scripts/verify-company-logos.mjs

      - name: Commit + push broken-logos report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-logos-broken.json
          if git diff --cached --quiet; then
            echo "No company-logo changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh company-logos broken-URL report"

          # Centralized rebase-retry helper survives concurrent scheduled
          # pushes. On rebase conflict, regenerate the broken-logos report
          # against the rebased base.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "npx tsx scripts/verify-company-logos.mjs; git add data/company-logos-broken.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
