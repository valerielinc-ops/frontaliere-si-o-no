name: Verify Company Logos (weekly)

# Probes every unique companyLogo URL referenced in data/jobs.json and
# data/jobs/by-crawler/*.json and writes broken ones to
# data/company-logos-broken.json. Follow-up fix: replace broken ones with
# the local /icons/company-placeholder.svg (handled at render time by
# services/logoService.ts::handleCompanyLogoError).
#
# Runs every Sunday 04:00 UTC.

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Checkout 68-728s su 10 run: il massimo è il 61% di un cap da 20min.
          # Blobless partial clone come guard-data-integrity #4120 (mediana ~150s
          # nei job filtrati contro ~600s in quelli non filtrati, senza sparse da
          # nessuna parte). Sicuro: il job verifica i loghi e committa, non legge
          # blob storici.
          filter: blob:none
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/translation-cache/
            !/packages/articles/content/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify company logos
        run: node scripts/verify-company-logos.mjs

      - name: Commit + push broken-logos report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-logos-broken.json
          if git diff --cached --quiet; then
            echo "No company-logo changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh company-logos broken-URL report"

          # Centralized rebase-retry helper survives concurrent scheduled
          # pushes. On rebase conflict, regenerate the broken-logos report
          # against the rebased base.
          bash scripts/lib/git-push-with-retry.sh \
            --regenerate-cmd "node scripts/verify-company-logos.mjs || true; git add data/company-logos-broken.json"

      - name: Report failure to GitHub Issues
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/lib/github-issue-creator.mjs \
            --title "Workflow Failure: ${{ github.workflow }}" \
            --description "## Workflow fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** ${{ github.event_name }}
          **Ref:** ${{ github.ref_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "${{ github.workflow }}"
