        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-18-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-18-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
