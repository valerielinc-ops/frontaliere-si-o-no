            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run amina-bank"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::amina-bank: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ amina-bank: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::amina-bank: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ amina-bank: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
            exit 1
          fi
          exit 0' > "$script_path"
          # shellcheck disable=SC2016,SC1003
          printf '%s\n' 'set +e
          script_path="$RUNNER_TEMP/crawler-generation/group-18/amina-bank.sh"
          status_file="$RUNNER_TEMP/crawler-generation/group-18/amina-bank.status"
          status_tmp="$RUNNER_TEMP/crawler-generation/group-18/amina-bank.status.tmp.$$"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$status_tmp"
          mv "$status_tmp" "$status_file"
          exit "$crawler_exit"' > "$launcher_path"
          if command -v setsid >/dev/null 2>&1; then
            nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
