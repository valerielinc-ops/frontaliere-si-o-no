name: Lighthouse CI

# Post-deploy performance gate on the 6 representative page templates flagged
# by Semrush Site Audit (2026-04-24) as "slow" pages.
#
# Budgets are defined in lighthouserc.json (MOBILE, the gate that decides) and
# lighthouserc.desktop.json (desktop, kept for coverage) — the single source of
# truth. Do NOT duplicate the numeric thresholds here: they drift (an old copy
# claimed perf>=0.85 / CLS<0.1 / TBT<200 while the file enforced perf>=0.60 /
# CLS<2.0 / TBT<700) and a stale copy misleads whoever triages a regression.
# Read the files for the live numbers.
#
# ⚠️ MOBILE is the form factor that decides. Until 2026-08-07 this workflow ran
# `preset: desktop` ONLY, so the gate had never produced a mobile number in its
# life — while Google ranks and PageSpeed reports on mobile. That blind spot has
# a real cost on record: a CLS fix validated on desktop alone looked like an
# improvement and regressed the article template from 75 to 55 on mobile (FCP
# 1.9s → 12.1s). It was reverted. A mobile leg would have caught it pre-merge.
# The matrix below runs mobile + desktop as separate legs with separate tracked
# issues, so a mobile-only regression can never again hide behind a green desktop.
#
# Audits PRODUCTION live (https://frontaliereticino.ch). The audit measures the
# DEPLOYED site, so it only makes sense to run it AFTER a deploy has propagated
# — never on a PR (the PR build is never live; a pre-merge run just re-measures
# already-deployed prod). Triggers:
#   - workflow_run on "Publish to GitHub Pages (deploy + validate)" completed →
#     runs only when that publish concluded `success` (its validate-live job
#     waits for the new build-id to go live, so prod reflects this deploy). The
#     build/publish split moved deploy+validate out of "Deploy to GitHub Pages"
#     (now build-only) into deploy-publish.yml, so we key on the publish run —
#     keying on the build run would audit prod BEFORE the new dist went live.
#   - schedule (daily 04:17 UTC) → the SAFETY NET, and the reason this workflow
#     produces numbers at all. The workflow_run trigger above is necessary but
#     NOT sufficient: it fires only when deploy-publish concludes `success`, and
#     measured 2026-08-07 that has not happened in its last 40 runs (23
#     cancelled, 3 failure, 14 skipped). Upstream, deploy.yml is cancelled 50 of
#     its last 60 runs — by design, since `pages-build-run` uses GitHub's
#     1-running + 1-pending cap and a deploy burst drops the superseded middle.
#     Net effect: the audit's own last run was 2026-06-22 and every one of its
#     last 6 runs concluded `skipped`. A post-deploy gate chained behind a
#     workflow that never concludes `success` is a gate that never measures
#     anything. The cron decouples the signal from that chain — prod is prod
#     whether or not a deploy landed, so a daily audit is always meaningful.
#   - workflow_dispatch for manual re-runs.
#
# Outcome handling (the audit stays NON-blocking — there is nothing to block
# post-deploy; the signal is durable, not a red check):
#   - Regression (budget exceeded) → open/refresh a deduped GitHub issue so the
#     regression is tracked instead of decaying into a silent red check.
#   - Recovery (audit passes again) → auto-resolve that canonical issue.
#   - Prod unreachable (Cloudflare 429/1027 / 5xx) → skip the audit + ::warning::
#     (no issue, no red), same self-healing behavior as before.

on:
  workflow_run:
    workflows: ["Publish to GitHub Pages (deploy + validate)"]
    types: [completed]
  schedule:
    # Daily 04:17 UTC — off the busy 07:xx monitor cron band, and low-traffic so
    # the Cloudflare edge is least likely to 429 the runner IP.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize: a burst of deploys must not race multiple audits opening/closing
# the same canonical issue concurrently.
concurrency:
  group: lighthouse-ci
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # probe: ask production ONCE whether it is reachable, and from which URLs.
  #
  # This is deliberately its own job rather than a step inside `lighthouse`.
  # The audit matrix has two legs (mobile + desktop); as a step it ran once per
  # leg, doubling the datacenter-IP curl traffic against prod to 2 x 6 URLs x up
  # to 4 attempts = 48 requests per run. That is precisely the traffic shape the
  # comment below blames for the historical Cloudflare 429/1027 failures — the
  # probe could have started causing the very condition it exists to detect.
  # One job, one probe, both legs consume the same answer.
  # ───────────────────────────────────────────────────────────────────────
  probe:
    runs-on: ubuntu-latest
    # 20 min, sized on the retry loop's WORST case, which is a total outage —
    # precisely the case this job exists to report. 6 URLs x (4 attempts x
    # `curl --max-time 25` + 3 x `sleep 12` between them) = 6 x 136s ≈ 13.6 min.
    # A tighter budget would have GitHub kill the job before it reaches the
    # `run_audit=false` + `::warning::` write below; `lighthouse` needs this job,
    # and its `if:` carries no `always()`, so the audit would then be skipped
    # silently — the exact failure mode the probe is meant to make loud. When the
    # probe was a step inside the 45-min `lighthouse` job it inherited that
    # headroom; as its own job it needs its own.
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      run_audit: ${{ steps.probe.outputs.run_audit }}
      urls: ${{ steps.probe.outputs.urls }}
    steps:
      # Probe production reachability BEFORE running Lighthouse.
      #
      # Lighthouse audits live prod. When prod is unreachable from the GitHub
      # Actions datacenter IP — most notably HTTP 429 (Cloudflare "rate
      # limited", error 1027) — LHCI 'collect' aborts on the very first
      # request and the whole job goes red. Historically this failed 8/8 runs:
      # the apex was being intercepted by a Cloudflare edge worker
      # (SearchAtlas "otto-pixel-worker" on a `frontaliereticino.ch/*` catch-all
      # route) whose rate-limiter/backend 429'd & 504'd datacenter traffic.
      #
      # The probe makes the gate self-healing: if prod cannot be reached after
      # retries we SKIP the audit (job concludes success, no issue is opened)
      # and emit a loud ::warning:: instead of a perpetual red. When prod serves
      # 200 the audit runs for real and genuine regressions still surface.
      # Audits only the subset of URLs that actually return 200, so one
      # transient bad URL no longer blanks the whole run.
      - name: Probe production reachability
        id: probe
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          URLS="
            https://frontaliereticino.ch/
            https://frontaliereticino.ch/cerca-lavoro-ticino/
            https://frontaliereticino.ch/aziende-che-assumono/ticino/settimana-corrente/
            https://frontaliereticino.ch/prezzi-diesel/chiasso/oggi/
            https://frontaliereticino.ch/premi-cassa-malati/ticino/
            https://frontaliereticino.ch/traffico-dogane/chiasso-brogeda/oggi/
          "
          ATTEMPTS=4
          reachable=""
          for url in $URLS; do
            for i in $(seq 1 $ATTEMPTS); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 25 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "probe OK   $url"
                reachable="$reachable$url"$'\n'
                break
              fi
              echo "probe $code $url (attempt $i/$ATTEMPTS)"
              [ "$i" -lt "$ATTEMPTS" ] && sleep 12
            done
          done
          if [ -z "$reachable" ]; then
            echo "::warning title=Lighthouse skipped::Production is unreachable (likely Cloudflare 429/1027 or 5xx). Skipping the audit this run instead of emitting a perpetual red check. Investigate edge/CDN if this persists."
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
            { echo "urls<<__EOF__"; printf '%s' "$reachable"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    needs: probe
    runs-on: ubuntu-latest
    # 45 min, measured — NOT a guess. 6 URLs x numberOfRuns:3 costs ~4-5 min per
    # URL on a runner (mobile leg, 2026-08-07: 10:42:39 → 11:00:06 for 5 URLs),
    # so one leg needs ~27 min of collection plus checkout/setup. The probe is no
    # longer part of this budget — it is its own job now (see `probe` above).
    #
    # The previous value was 15, which this job could never finish in: a run
    # dispatched 2026-08-07 was still on URL 5 of 6 at the 20-minute mark. So
    # even on the days the deploy chain did fire, the audit would have been
    # cancelled mid-collection — GitHub reports a `timeout-minutes` overrun as
    # `cancelled`, which is indistinguishable at a glance from the concurrency
    # cancellations upstream. Two independent faults were hiding each other.
    timeout-minutes: 45
    # Only audit after a SUCCESSFUL deploy (prod now reflects the new build), or
    # on the daily cron / a manual dispatch. A failed/cancelled deploy left prod
    # on the old build — auditing it via workflow_run would measure something
    # this run did not produce; the cron measures prod-as-it-is, which is always
    # a valid question to ask.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    # Mobile and desktop are separate legs with separate configs and separate
    # tracked issues. fail-fast: false — a mobile regression must not cancel the
    # desktop leg (or vice versa); both signals are wanted every run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - form_factor: mobile
            config: ./lighthouserc.json
          - form_factor: desktop
            config: ./lighthouserc.desktop.json

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # checkout sparse: generato da scripts/ci/apply-checkout-profiles.mjs
          sparse-checkout: |
            /*
            !/public/images/
            !/data/jobs/
            !/data/seo-404-compat/
            !/data/translation-cache/
            !/packages/articles/content/
            !/data/all-known-job-slugs/
            !/data/orphan-enriched-data/
            !/docs/
            !/public/data/
            !/data/related-search-candidates.json
            !/data/cf-hot-404s.json
            !/data/jobs-ai-cache.json
            !/data/dist-size-history.jsonl
            !/data/jobs-stats-history.json
            !/data/url-first-seen.json
            !/data/jobs-snapshots-history/
            !/data/slug-registry.json
            !/data/evidence-index.json
            !/data/health-premiums/
            !/data/jobs-crawler-summaries/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run Lighthouse CI against production
        id: lhci
        # continue-on-error: a budget breach must NOT fail the job — it is
        # surfaced as a tracked issue (next step), not as a red check that would
        # decay into noise. The job stays green; the issue is the durable signal.
        continue-on-error: true
        if: needs.probe.outputs.run_audit == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          # URLs come from the reachability probe above: only paths that returned
          # 200 are audited (Lighthouse aborts the whole run on any 404/redirect
          # — see issue diagnosed 2026-05-26 where 4/6 stale slugs 404'd and
          # blanked every audit incl. CLS).
          urls: ${{ needs.probe.outputs.urls }}
          # lhci rejects both budgetPath + configPath:assert.assertions
          # ("Cannot use both budgets AND assertions"). Assertions in the config
          # supersede budgets — they cover the same timings plus category-level
          # scores (perf/seo/a11y). lighthouse-budget.json is kept for reference
          # but no longer wired. Config is per-matrix-leg: lighthouserc.json is
          # MOBILE, lighthouserc.desktop.json is desktop.
          configPath: ${{ matrix.config }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse reports on regression
        if: steps.lhci.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          # Per-leg name: two matrix legs uploading the same artifact name would
          # collide (upload-artifact v4+ errors on a duplicate name).
          name: lighthouse-reports-${{ matrix.form_factor }}
          path: .lighthouseci/
          retention-days: 7

      # Regression → open (or refresh, via stable-title dedup) a tracked issue.
      # NOT auto-routed to the CI fixer (no `agent:fix`): a perf regression is
      # strategic — owner/agent triages it manually (AGENTS.md: only crawler /
      # follow-up are auto-routable). Labelled funnel-monetization (CLS gates
      # AdSense RPM) + funnel-seo (category SEO score gates indexability).
      # --reopen-within-hours 6: prod CWV are noisy and every deploy re-audits,
      # so the gate flaps (fail → recovery closes → fail again). Without it the
      # second fail finds no OPEN issue and coins a duplicate; 6h lets it reopen
      # the canonical issue instead (matches the other post-deploy reporters in
      # deploy.yml / post-deploy-validate-*.yml). Paired with the resolve step.
      - name: Open issue on regression
        if: needs.probe.outputs.run_audit == 'true' && steps.lhci.outcome == 'failure'
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # `workflow_run.html_url` only exists on the workflow_run trigger. On
          # the daily cron and on a manual dispatch there is no triggering
          # deploy at all, and labelling those "manual dispatch" indiscriminately
          # sent whoever triaged the issue looking for a deploy that never
          # existed. Name the actual trigger instead.
          case "${{ github.event_name }}" in
            workflow_run) TRIGGER="${{ github.event.workflow_run.html_url }}" ;;
            schedule)     TRIGGER="scheduled daily audit (cron 17 4 * * *) — no triggering deploy" ;;
            *)            TRIGGER="manual dispatch — no triggering deploy" ;;
          esac
          node scripts/lib/github-issue-creator.mjs \
            --title "Lighthouse regression on production (${{ matrix.form_factor }})" \
            --priority 2 \
            --label funnel-monetization \
            --label funnel-seo \
            --workflow "Lighthouse CI" \
            --reopen-within-hours 6 \
            --description "Lighthouse audit (**${{ matrix.form_factor }}**) exceeded a budget on https://frontaliereticino.ch.

          **Budgets:** defined in \`${{ matrix.config }}\` (assert.assertions) — read the file for the live thresholds; they are deliberately not duplicated here to avoid drift.

          **Form factor:** \`${{ matrix.form_factor }}\`. Mobile and desktop are tracked as two separate issues on purpose — they regress independently, and a desktop-only green has already hidden a mobile regression once (article template 75 → 55, FCP 1.9s → 12.1s). Mobile is the form factor Google ranks on: treat a mobile regression as the higher priority of the two.

          **Why it matters (funnel):** the CLS budget guards AdSense RPM (layout shift → revenue loss); the SEO category score gates organic indexability.

          **Audit run:** $RUN_URL (Lighthouse reports artifact attached to the run; public HTML report linked in the LHCI step log).
          **Triggered by:** ${TRIGGER}

          **Next step:** open the run, read the per-URL assertion failures (which template + which metric), reproduce locally / via audit replay, fix the root cause. This issue auto-closes when a later post-deploy audit passes again."

      # Recovery → auto-close the canonical issue so a fixed gate doesn't leave a
      # stale open issue (mirror of the failure reporter; best-effort, exits 0).
      - name: Resolve issue on recovery
        if: needs.probe.outputs.run_audit == 'true' && steps.lhci.outcome == 'success'
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "Lighthouse regression on production (${{ matrix.form_factor }})" \
            --workflow "Lighthouse CI" \
            --run-url "$RUN_URL"
