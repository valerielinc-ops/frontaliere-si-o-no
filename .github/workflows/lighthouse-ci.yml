name: Lighthouse CI

# Post-deploy performance gate on the 6 representative page templates flagged
# by Semrush Site Audit (2026-04-24) as "slow" pages.
#
# Budgets are defined in lighthouserc.json (assert.assertions) — the single
# source of truth. Do NOT duplicate the numeric thresholds here: they drift
# (the old copy claimed perf>=0.85 / CLS<0.1 / TBT<200 while the file actually
# enforces perf>=0.60 / CLS<2.0 / TBT<700) and a stale copy misleads whoever
# triages a regression. Read the file for the live numbers.
#
# Audits PRODUCTION live (https://frontaliereticino.ch). The audit measures the
# DEPLOYED site, so it only makes sense to run it AFTER a deploy has propagated
# — never on a PR (the PR build is never live; a pre-merge run just re-measures
# already-deployed prod). Triggers:
#   - workflow_run on "Publish to GitHub Pages (deploy + validate)" completed →
#     runs only when that publish concluded `success` (its validate-live job
#     waits for the new build-id to go live, so prod reflects this deploy). The
#     build/publish split moved deploy+validate out of "Deploy to GitHub Pages"
#     (now build-only) into deploy-publish.yml, so we key on the publish run —
#     keying on the build run would audit prod BEFORE the new dist went live.
#   - workflow_dispatch for manual re-runs.
#
# Outcome handling (the audit stays NON-blocking — there is nothing to block
# post-deploy; the signal is durable, not a red check):
#   - Regression (budget exceeded) → open/refresh a deduped GitHub issue so the
#     regression is tracked instead of decaying into a silent red check.
#   - Recovery (audit passes again) → auto-resolve that canonical issue.
#   - Prod unreachable (Cloudflare 429/1027 / 5xx) → skip the audit + ::warning::
#     (no issue, no red), same self-healing behavior as before.

on:
  workflow_run:
    workflows: ["Publish to GitHub Pages (deploy + validate)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize: a burst of deploys must not race multiple audits opening/closing
# the same canonical issue concurrently.
concurrency:
  group: lighthouse-ci
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only audit after a SUCCESSFUL deploy (prod now reflects the new build),
    # or on a manual dispatch. A failed/cancelled deploy left prod on the old
    # build — auditing it would measure something this run did not produce.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Probe production reachability BEFORE running Lighthouse.
      #
      # Lighthouse audits live prod. When prod is unreachable from the GitHub
      # Actions datacenter IP — most notably HTTP 429 (Cloudflare "rate
      # limited", error 1027) — LHCI 'collect' aborts on the very first
      # request and the whole job goes red. Historically this failed 8/8 runs:
      # the apex was being intercepted by a Cloudflare edge worker
      # (SearchAtlas "otto-pixel-worker" on a `frontaliereticino.ch/*` catch-all
      # route) whose rate-limiter/backend 429'd & 504'd datacenter traffic.
      #
      # The probe makes the gate self-healing: if prod cannot be reached after
      # retries we SKIP the audit (job concludes success, no issue is opened)
      # and emit a loud ::warning:: instead of a perpetual red. When prod serves
      # 200 the audit runs for real and genuine regressions still surface.
      # Audits only the subset of URLs that actually return 200, so one
      # transient bad URL no longer blanks the whole run.
      - name: Probe production reachability
        id: probe
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          URLS="
            https://frontaliereticino.ch/
            https://frontaliereticino.ch/cerca-lavoro-ticino/
            https://frontaliereticino.ch/aziende-che-assumono/ticino/settimana-corrente/
            https://frontaliereticino.ch/prezzi-diesel/chiasso/oggi/
            https://frontaliereticino.ch/premi-cassa-malati/ticino/
            https://frontaliereticino.ch/traffico-dogane/chiasso-brogeda/oggi/
          "
          ATTEMPTS=4
          reachable=""
          for url in $URLS; do
            for i in $(seq 1 $ATTEMPTS); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 25 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "probe OK   $url"
                reachable="$reachable$url"$'\n'
                break
              fi
              echo "probe $code $url (attempt $i/$ATTEMPTS)"
              [ "$i" -lt "$ATTEMPTS" ] && sleep 12
            done
          done
          if [ -z "$reachable" ]; then
            echo "::warning title=Lighthouse skipped::Production is unreachable (likely Cloudflare 429/1027 or 5xx). Skipping the audit this run instead of emitting a perpetual red check. Investigate edge/CDN if this persists."
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
            { echo "urls<<__EOF__"; printf '%s' "$reachable"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Lighthouse CI against production
        id: lhci
        # continue-on-error: a budget breach must NOT fail the job — it is
        # surfaced as a tracked issue (next step), not as a red check that would
        # decay into noise. The job stays green; the issue is the durable signal.
        continue-on-error: true
        if: steps.probe.outputs.run_audit == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          # URLs come from the reachability probe above: only paths that returned
          # 200 are audited (Lighthouse aborts the whole run on any 404/redirect
          # — see issue diagnosed 2026-05-26 where 4/6 stale slugs 404'd and
          # blanked every audit incl. CLS).
          urls: ${{ steps.probe.outputs.urls }}
          # lhci rejects both budgetPath + configPath:assert.assertions
          # ("Cannot use both budgets AND assertions"). Assertions in
          # lighthouserc.json supersede budgets — they cover the same
          # timings plus category-level scores (perf/seo/a11y).
          # lighthouse-budget.json is kept for reference but no longer wired.
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse reports on regression
        if: steps.lhci.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

      # Regression → open (or refresh, via stable-title dedup) a tracked issue.
      # NOT auto-routed to the CI fixer (no `agent:fix`): a perf regression is
      # strategic — owner/agent triages it manually (AGENTS.md: only crawler /
      # follow-up are auto-routable). Labelled funnel-monetization (CLS gates
      # AdSense RPM) + funnel-seo (category SEO score gates indexability).
      # --reopen-within-hours 6: prod CWV are noisy and every deploy re-audits,
      # so the gate flaps (fail → recovery closes → fail again). Without it the
      # second fail finds no OPEN issue and coins a duplicate; 6h lets it reopen
      # the canonical issue instead (matches the other post-deploy reporters in
      # deploy.yml / post-deploy-validate-*.yml). Paired with the resolve step.
      - name: Open issue on regression
        if: steps.probe.outputs.run_audit == 'true' && steps.lhci.outcome == 'failure'
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_URL="${{ github.event.workflow_run.html_url }}"
          node scripts/lib/github-issue-creator.mjs \
            --title "Lighthouse regression on production" \
            --priority 2 \
            --label funnel-monetization \
            --label funnel-seo \
            --workflow "Lighthouse CI" \
            --reopen-within-hours 6 \
            --description "Post-deploy Lighthouse audit exceeded a budget on https://frontaliereticino.ch.

          **Budgets:** defined in lighthouserc.json (assert.assertions) — read the file for the live thresholds; they are deliberately not duplicated here to avoid drift.

          **Why it matters (funnel):** the CLS budget guards AdSense RPM (layout shift → revenue loss); the SEO category score gates organic indexability.

          **Audit run:** $RUN_URL (Lighthouse reports artifact attached to the run; public HTML report linked in the LHCI step log).
          **Triggering deploy:** ${DEPLOY_URL:-manual dispatch}

          **Next step:** open the run, read the per-URL assertion failures (which template + which metric), reproduce locally / via audit replay, fix the root cause. This issue auto-closes when a later post-deploy audit passes again."

      # Recovery → auto-close the canonical issue so a fixed gate doesn't leave a
      # stale open issue (mirror of the failure reporter; best-effort, exits 0).
      - name: Resolve issue on recovery
        if: steps.probe.outputs.run_audit == 'true' && steps.lhci.outcome == 'success'
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/lib/github-issue-creator.mjs \
            --resolve \
            --title "Lighthouse regression on production" \
            --workflow "Lighthouse CI" \
            --run-url "$RUN_URL"
