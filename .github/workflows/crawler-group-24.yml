              echo "::error::lwphr: invalid terminal status: $status"
              printf '%s\n' '| lwphr | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 143 ]; then
              echo "::warning::lwphr: runner shutdown recorded as systemic outcome (exit 143); no per-crawler issue filed"
              printf '%s\n' '| lwphr | systemic runner shutdown (143) |' >> "$summary_file"
              systemic_count=$((systemic_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| lwphr | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::lwphr: crawler exited with status $status"
              printf '| lwphr | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          status_file="$state_dir/sunrise.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::sunrise: no terminal status was published"
            printf '%s\n' '| sunrise | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::sunrise: invalid terminal status: $status"
              printf '%s\n' '| sunrise | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 143 ]; then
              echo "::warning::sunrise: runner shutdown recorded as systemic outcome (exit 143); no per-crawler issue filed"
              printf '%s\n' '| sunrise | systemic runner shutdown (143) |' >> "$summary_file"
              systemic_count=$((systemic_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| sunrise | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::sunrise: crawler exited with status $status"
              printf '| sunrise | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          status_file="$state_dir/knowledge-lab.status"
          if [ ! -s "$status_file" ]; then
            echo "::warning::knowledge-lab: no terminal status was published"
            printf '%s\n' '| knowledge-lab | missing status |' >> "$summary_file"
            missing_count=$((missing_count + 1))
          else
            status="$(cat "$status_file" 2>/dev/null || true)"
            if ! [[ "$status" =~ ^[0-9]+$ ]]; then
              echo "::error::knowledge-lab: invalid terminal status: $status"
              printf '%s\n' '| knowledge-lab | invalid status |' >> "$summary_file"
              failure_count=$((failure_count + 1))
            elif [ "$status" -eq 143 ]; then
              echo "::warning::knowledge-lab: runner shutdown recorded as systemic outcome (exit 143); no per-crawler issue filed"
              printf '%s\n' '| knowledge-lab | systemic runner shutdown (143) |' >> "$summary_file"
              systemic_count=$((systemic_count + 1))
            elif [ "$status" -eq 0 ]; then
              printf '%s\n' '| knowledge-lab | success |' >> "$summary_file"
              success_count=$((success_count + 1))
            else
              echo "::error::knowledge-lab: crawler exited with status $status"
              printf '| knowledge-lab | failed (%s) |\n' "$status" >> "$summary_file"
              failure_count=$((failure_count + 1))
            fi
          fi
          printf '%s\n' "**Summary:** $success_count succeeded, $failure_count failed, $missing_count missing, $systemic_count systemic." >> "$summary_file"
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ] || [ "$systemic_count" -gt 0 ]; then
            wait_outcome=failure
          else
            wait_outcome=success
          fi
          printf '%s\n' "success_count=$success_count" "failure_count=$failure_count" "missing_count=$missing_count" "systemic_count=$systemic_count" "wait_outcome=$wait_outcome" >> "$output_file"
          exit 0
      - name: Commit crawler group data atomically
        if: always() && inputs.generation_token != '' && job.status == 'success' && steps.crawler_group_setup.outcome == 'success' && steps.crawler_aggregate.outcome == 'success'
        run: |-
          set +e
          commit_attempt=1
          commit_max_attempts=3
          while true; do
            bash scripts/lib/git-commit-data.sh --group-batch "Auto-update crawler group 24 jobs"
            git_commit_exit=$?
            if [ "$git_commit_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; then
            echo "::error::group commit failed (exit $git_commit_exit); token-bound output was not published"
            echo "❌ group commit failed (exit $git_commit_exit)" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            if [ "$commit_attempt" -ge "$commit_max_attempts" ]; then
              echo "::error::group commit: same-generation retry budget exhausted after $commit_attempt/$commit_max_attempts attempts (exit $git_commit_exit)"
              echo "❌ group commit: same-generation retry budget exhausted (exit $git_commit_exit); group remains failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            retry_delay=$((commit_attempt * 15))
            echo "::warning::group commit: retryable commit exit $git_commit_exit; retrying the same generation in $retry_delay seconds (attempt $commit_attempt/$commit_max_attempts)"
            echo "⚠️ group commit: retrying the same generation after exit $git_commit_exit in $retry_delay seconds" >> "$GITHUB_STEP_SUMMARY"
            sleep "$retry_delay"
            commit_attempt=$((commit_attempt + 1))
          done
      - name: Save crawler AI cache
        if: always() && hashFiles('.cache/jobs-ai-cache.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-24-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save per-company translation cache
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-24-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then exit 0; fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Finalize crawler generation manifest (shadow)
        id: crawler-generation-finalizer
        if: always()
        continue-on-error: true
        env:
          CRAWLER_GENERATION_GROUP: "24"
          CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
          CRAWLER_GENERATION_CALLER_REPOSITORY: ${{ github.repository }}
          CRAWLER_GENERATION_CALLER_RUN_ID: ${{ github.run_id }}
          CRAWLER_GENERATION_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CRAWLER_GENERATION_WAIT_OUTCOME: ${{ steps.crawler_aggregate.outputs.wait_outcome || 'failure' }}
          CRAWLER_GENERATION_EXPECTED_CRAWLERS: '[{"crawlerId":"anicura","primarySlice":"data/jobs/by-crawler/anicura.json"},{"crawlerId":"capri-holdings","primarySlice":"data/jobs/by-crawler/capri-holdings.json"},{"crawlerId":"cnp","primarySlice":"data/jobs/by-crawler/cnp.json"},{"crawlerId":"confederazione-ticino","primarySlice":"data/jobs/by-crawler/confederazione-ticino.json"},{"crawlerId":"fachkraft","primarySlice":"data/jobs/by-crawler/fachkraft.json"},{"crawlerId":"fisba","primarySlice":"data/jobs/by-crawler/fisba.json"},{"crawlerId":"fondation-domus","primarySlice":"data/jobs/by-crawler/fondation-domus.json"},{"crawlerId":"knowledge-lab","primarySlice":"data/jobs/by-crawler/knowledge-lab.json"},{"crawlerId":"lwphr","primarySlice":"data/jobs/by-crawler/lwphr.json"},{"crawlerId":"mcdonald-s-switzerland","primarySlice":"data/jobs/by-crawler/mcdonald-s-switzerland.json"},{"crawlerId":"pole-sante-pays-enhaut","primarySlice":"data/jobs/by-crawler/pole-sante-pays-enhaut.json"},{"crawlerId":"postfinance","primarySlice":"data/jobs/by-crawler/postfinance.json"},{"crawlerId":"protectas","primarySlice":"data/jobs/by-crawler/protectas.json"},{"crawlerId":"sunrise-sede-ticino","primarySlice":"data/jobs/by-crawler/sunrise-sede-ticino.json"},{"crawlerId":"tpl-lugano","primarySlice":"data/jobs/by-crawler/tpl-lugano.json"},{"crawlerId":"tsmg","primarySlice":"data/jobs/by-crawler/tsmg.json"}]'
          CRAWLER_GENERATION_OUTPUT: ${{ runner.temp }}/crawler-generation/crawler-group-24-terminal.json
          CRAWLER_GENERATION_LEDGER_PATH: data/crawler-generation-ledger.jsonl
        run: node scripts/crawler-group-generation-finalizer.mjs
      - name: Report crawler generation finalizer failure
        if: always() && steps.crawler-generation-finalizer.outcome == 'failure'
        continue-on-error: true
        run: |-
          echo "::error::crawler generation finalizer failed; ledger persistence skipped so a missing/partial manifest cannot be recorded as success"
          echo "❌ crawler generation finalizer failed; ledger persistence skipped (no false-success ledger entry)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Persist crawler generation ledger
        if: always() && steps.crawler-generation-finalizer.outcome == 'success'
        env:
          CRAWLER_GENERATION_RECEIPT_DIR: ""
          SKIP_AI_TRANSLATION: "1"
        run: |-
          set +e
          commit_attempt=1
          commit_max_attempts=3
          while true; do
            bash scripts/lib/git-commit-data.sh --extra-only "Record crawler generation ledger" data/crawler-generation-ledger.jsonl
            git_commit_exit=$?
            if [ "$git_commit_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$git_commit_exit" -ne 42 ] && [ "$git_commit_exit" -ne 44 ]; then
              if [ "$git_commit_exit" -eq 43 ]; then
                echo "::error::crawler generation ledger: shared deferred-commit precondition failed (exit 43)"
                echo "❌ crawler generation ledger: shared deferred-commit precondition failed (exit 43)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::crawler generation ledger persistence failed (exit $git_commit_exit)"
                echo "❌ crawler generation ledger persistence failed (exit $git_commit_exit)" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit "$git_commit_exit"
            fi
            if [ "$commit_attempt" -ge "$commit_max_attempts" ]; then
              echo "::error::crawler generation ledger: same-generation retry budget exhausted after $commit_attempt/$commit_max_attempts attempts (exit $git_commit_exit)"
              echo "❌ crawler generation ledger: same-generation retry budget exhausted (exit $git_commit_exit); group remains failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$git_commit_exit"
            fi
            retry_delay=$((commit_attempt * 15))
            echo "::warning::crawler generation ledger: retryable commit exit $git_commit_exit; retrying the same generation in $retry_delay seconds (attempt $commit_attempt/$commit_max_attempts)"
            echo "⚠️ crawler generation ledger: retrying the same generation after exit $git_commit_exit in $retry_delay seconds" >> "$GITHUB_STEP_SUMMARY"
            sleep "$retry_delay"
            commit_attempt=$((commit_attempt + 1))
          done
      - name: Upload crawler generation manifest (shadow)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: crawler-group-24-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/crawler-generation/crawler-group-24-terminal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Fail crawler group after all member outcomes
        if: always()
        env:
          CRAWLER_AGGREGATE_OUTCOME: ${{ steps.crawler_aggregate.outcome }}
          CRAWLER_AGGREGATE_SUCCESS: ${{ steps.crawler_aggregate.outputs.success_count || 'invalid' }}
          CRAWLER_AGGREGATE_FAILURES: ${{ steps.crawler_aggregate.outputs.failure_count || 'invalid' }}
          CRAWLER_AGGREGATE_MISSING: ${{ steps.crawler_aggregate.outputs.missing_count || 'invalid' }}
          CRAWLER_AGGREGATE_SYSTEMIC: ${{ steps.crawler_aggregate.outputs.systemic_count || '0' }}
        run: |-
          set -euo pipefail
          aggregate_outcome="${CRAWLER_AGGREGATE_OUTCOME:-failure}"
          success_count="${CRAWLER_AGGREGATE_SUCCESS:-invalid}"
          failure_count="${CRAWLER_AGGREGATE_FAILURES:-invalid}"
          missing_count="${CRAWLER_AGGREGATE_MISSING:-invalid}"
          systemic_count="${CRAWLER_AGGREGATE_SYSTEMIC:-0}"
          if [ "$aggregate_outcome" != "success" ]; then
            echo "::error::crawler aggregate step did not complete; group failed after preserving already-running siblings"
            exit 1
          fi
          for count in "$success_count" "$failure_count" "$missing_count" "$systemic_count"; do
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::crawler aggregate produced an invalid count: $count"
              exit 1
            fi
          done
          if [ "$failure_count" -gt 0 ] || [ "$missing_count" -gt 0 ]; then
            echo "::error::crawler group completed with $success_count succeeded, $failure_count failed, $missing_count missing, $systemic_count systemic; healthy siblings were preserved, but the group remains failed until incomplete crawlers are recovered"
            exit 1
          fi
          if [ "$systemic_count" -gt 0 ]; then
            echo "::error::crawler group interrupted: $systemic_count member(s) stopped by a runner shutdown (exit 143) before completing; $success_count succeeded and were preserved, no per-crawler issue filed (systemic class), and the interrupted crawlers keep their previous data until the next wave"
            exit 1
          fi
          echo "✅ all $success_count crawler members completed successfully; $systemic_count systemic outcomes recorded"
      - name: Release cross-entry crawler live-run lease
        if: always() && env.CRAWLER_GROUP_LIVE_LEASE_OWNED == '1'
        continue-on-error: true
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-24.yml --release
