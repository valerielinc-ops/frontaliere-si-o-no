            echo "⚠️ crawler generation ledger: retrying the same generation after exit $git_commit_exit in $retry_delay seconds" >> "$GITHUB_STEP_SUMMARY"
            sleep "$retry_delay"
            commit_attempt=$((commit_attempt + 1))
