name: sync-pharmacies-border

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pharmacy-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Firebase credentials for PR publishing
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — cannot load GITHUB_PAT for the pharmacy refresh PR"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load publishing credentials from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Fetch and stage Ticino duties for atomic finalization
        continue-on-error: true
        env:
          PHARMACY_DUTY_STAGE_DIR: ${{ runner.temp }}/pharmacy-duty-stage
        run: node scripts/sync-pharmacy-duties.mjs
      - name: Fetch Geneva duty release
        id: geneva
        continue-on-error: true
        run: |
          set +e
          node scripts/import-pharmacy-duties-geneva.mjs
          geneva_exit=$?
          set -e
          echo "exit=$geneva_exit" >> "$GITHUB_OUTPUT"
          echo "unexpected=false" >> "$GITHUB_OUTPUT"
          case "$geneva_exit" in
            0) echo "Geneva duty release is fresh and publishable." ;;
            1) echo "Geneva duty importer reported a data-quality diagnostic; committing its fail-closed snapshot for the health monitor." ;;
            *) echo "unexpected=true" >> "$GITHUB_OUTPUT"; echo "::error::Geneva duty importer failed unexpectedly with exit=$geneva_exit"; exit 1 ;;
          esac
      - name: Fail on unexpected Geneva importer failure
        if: steps.geneva.outputs.unexpected == 'true'
        run: exit 1
      - name: Fetch verified Swiss canton duty release
        id: swiss_cantons
        continue-on-error: true
        run: |
          set +e
          node scripts/import-pharmacy-duties-swiss-cantons.mjs
          swiss_exit=$?
          set -e
          echo "exit=$swiss_exit" >> "$GITHUB_OUTPUT"
          echo "unexpected=false" >> "$GITHUB_OUTPUT"
          case "$swiss_exit" in
            0) echo "Swiss canton duty release is fresh and publishable." ;;
            1) echo "Swiss canton duty importer reported a data-quality diagnostic; committing its fail-closed snapshot for the health monitor." ;;
            *) echo "unexpected=true" >> "$GITHUB_OUTPUT"; echo "::error::Swiss canton duty importer failed unexpectedly with exit=$swiss_exit"; exit 1 ;;
          esac
      - name: Fail on unexpected Swiss canton importer failure
        if: steps.swiss_cantons.outputs.unexpected == 'true'
        run: exit 1
      - name: Import and finalize official border catalogue release
        env:
          PHARMACY_DUTY_STAGE_DIR: ${{ runner.temp }}/pharmacy-duty-stage
        run: npm run pharmacies:import
      - name: Validate border catalogue
        run: npm run pharmacies:check
      - name: Open PR with atomic catalogue-duty-status snapshots
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/pharmacies-ticino-complete.json data/pharmacies-italy-border.json data/pharmacy-duties-ticino.json data/pharmacy-duties-ticino-status.json data/pharmacy-duties-geneva.json data/pharmacy-duties-geneva-status.json data/pharmacy-duties-swiss-cantons.json data/pharmacy-sources-registry.json; then
            echo "No cross-border pharmacy data changes."
            exit 0
          fi
          body="$RUNNER_TEMP/pharmacy-border-refresh-pr-body.md"
          cat > "$body" <<EOF
          Auto-generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ## Implementato

          - Publishes the validated atomic cross-border pharmacy catalogue and duty/status snapshots through a PR so the required Vitest check runs before they reach main.

          ## Non implementato (ancora)

          Nessuno — all generated snapshots in this run are validated before publication.
          EOF
          bash scripts/lib/open-data-refresh-pr.sh \
            --path data/pharmacies-ticino-complete.json \
            --path data/pharmacies-italy-border.json \
            --path data/pharmacy-duties-ticino.json \
            --path data/pharmacy-duties-ticino-status.json \
            --path data/pharmacy-duties-geneva.json \
            --path data/pharmacy-duties-geneva-status.json \
            --path data/pharmacy-duties-swiss-cantons.json \
            --path data/pharmacy-sources-registry.json \
            --branch chore/refresh-pharmacies-border \
            --commit-message "chore(data): refresh atomic cross-border pharmacy release" \
            --title "chore(data): refresh atomic cross-border pharmacy release" \
            --body-file "$body"
