# AUTO-GENERATED — do not edit by hand.
# Source: node scripts/generate-crawler-group-workflows.mjs
# Regenerate after adding/removing/renaming a crawler (edit the crawler's
# own script + npm script, re-run: node scripts/extract-crawler-manifest.mjs
# && node scripts/generate-crawler-group-workflows.mjs).
#
# Group 19 members (26): triaplus, sygnum, spitex-zuerich, spital-muri, smg-swiss-marketplace-group, spital-zollikerberg, sbb, spital-limmattal, volg, klinik-susenberg, tinext, mistral-ai, spitaeler-schaffhausen, hermes, giorgio-armani, clinique-de-genolier, kzu, cerbios-pharma, hornbach, chopard, citta-di-locarno, breitling, clinica-holistica-engiadina, colin-cie, cham-swiss-properties, badrutts-palace
#
# Each "Crawler: ..." step below is a background:true composite shell
# script that runs that ONE crawler's own install/prep/run/housekeeping/
# commit/error-report sequence, spliced verbatim from its former dedicated
# workflow file (data/crawler-manifest.json) — commit-and-push and error-
# reporting mechanisms are UNCHANGED per crawler, just co-located in one
# job so the group holds a single GitHub Actions concurrent-job slot
# instead of one slot per crawler.

name: Crawler Group 19 (26 crawlers)
on:
  workflow_dispatch: null
concurrency:
  group: crawler-group-19
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  run-crawler-group-19:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: "Crawler: Update Triaplus Jobs (Dedicated)"
        id: crawler-triaplus
        background: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-triaplus.txt
        run: |-
          set +e  # composite emulates per-step continue-on-error/if:failure(); no global -e
          __STEP_FAILED=0
          __GITHUB_ENV_FILE="/tmp/gh-env-triaplus.sh"
          : > "$__GITHUB_ENV_FILE"

          echo "::group::Install dependencies"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            npm ci
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            __STEP_FAILED=1
            echo "::error::Install dependencies failed (exit $__THIS_STEP_EXIT)"
          fi
          echo "::endgroup::"

          echo "::group::Prepare Firebase credentials (optional)"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            export FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
              printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            else
              echo "ℹ️ Firebase secrets not set — crawler will use file config only."
              exit 0
            fi
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            __STEP_FAILED=1
            echo "::error::Prepare Firebase credentials (optional) failed (exit $__THIS_STEP_EXIT)"
          fi
          echo "::endgroup::"

          echo "::group::Load secrets from Remote Config"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            node scripts/load-rc-env.mjs
            echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            __STEP_FAILED=1
            echo "::error::Load secrets from Remote Config failed (exit $__THIS_STEP_EXIT)"
          fi
          echo "::endgroup::"

          echo "::group::Run dedicated TRIAPLUS crawler"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            export JOBS_CRAWLER_TIMEOUT_MS="${{ github.event.inputs.timeout_ms || '' }}"
            export JOBS_CRAWLER_USE_FIRESTORE_CONFIG="1"
            export JOBS_TRIAPLUS_STRICT="${{ github.event.inputs.strict_localization || '1' }}"
            export CRAWLER_SLICE_ONLY="1"
            export SKIP_AI_TRANSLATION="${{ github.event.inputs.skip_ai_translation || '0' }}"
            node scripts/update-triaplus-jobs.mjs
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            __STEP_FAILED=1
            echo "::error::Run dedicated TRIAPLUS crawler failed (exit $__THIS_STEP_EXIT)"
          fi
          echo "::endgroup::"

          echo "::group::Housekeeping — remove expired job listings (scoped)"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            export JOBS_HOUSEKEEPING_SCOPE="triaplus"
            export JOBS_SLICE_FILE="data/jobs/by-crawler/triaplus.json"
            node scripts/cleanup-jobs.mjs
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            echo "::warning::Housekeeping — remove expired job listings (scoped) failed (exit $__THIS_STEP_EXIT) — continue-on-error, not failing the crawler"
          fi
          echo "::endgroup::"

          echo "::group::Commit and push"
          (
            export GITHUB_ENV="$__GITHUB_ENV_FILE"
            export SKIP_AI_TRANSLATION="${{ github.event.inputs.skip_ai_translation || '0' }}"
            bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update TRIAPLUS jobs (dedicated crawler)" data/jobs-crawler-adapters/
          )
          __THIS_STEP_EXIT=$?
          set -a; source "$__GITHUB_ENV_FILE"; set +a
          if [ "$__THIS_STEP_EXIT" != "0" ]; then
            __STEP_FAILED=1
            echo "::error::Commit and push failed (exit $__THIS_STEP_EXIT)"
          fi
          echo "::endgroup::"

          echo "::group::Report failure to GitHub Issues"
          if [ "$__STEP_FAILED" != "0" ]; then
            (
              export GITHUB_ENV="$__GITHUB_ENV_FILE"
              export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
              node scripts/lib/github-issue-creator.mjs \
                --title "Crawler Failure: ${{ github.workflow }}" \
                --description "## Crawler fallito
              **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Branch:** ${{ github.ref_name }}
              **Trigger:** ${{ github.event_name }}" \
                --priority 2 \
                --label Bug \
                --workflow "${{ github.workflow }}"
            )
          else
            echo "(skipped — no prior failure in this crawler's steps)"
          fi
          echo "::endgroup::"

          rm -f "$__GITHUB_ENV_FILE"
          if [ "$__STEP_FAILED" != "0" ]; then
            exit 1
          fi
          exit 0
