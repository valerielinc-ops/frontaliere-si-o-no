# Crawler Group 17 logic — reusable workflow (on: workflow_call).
#
# Physically hosted here (frontaliere-si-o-no) as the single source of
# the crawling logic — but invoked cross-repo from a minimal caller
# workflow physically hosted in frontaliere-articles (account
# nanakokyobashi-rgb), so the RUN and its concurrency-pool consumption
# are billed against nanako's separate, less-saturated pool instead of
# valerielinc-ops' saturated ~20-concurrent-job Free-plan pool.
#
# Structure validated by the crawler-group-23 pilot
# (frontaliere-si-o-no#6485 -> reverted #6517 -> #6520 /
# frontaliere-articles#594 -> #600 -> #602), dispatch-tested for real
# before this batch migrated the remaining 22 groups + translate-pending.yml
# on top of it. A composite action was tried first and reverted: its
# step schema rejects the background:/wait-all: pair every crawler-group
# workflow needs to run its crawlers in parallel ("Unexpected value
# 'background'" at workflow-load time, before a single step runs). A
# reusable workflow avoids that: workflow_call defines a FULL job, so it
# keeps the same step schema as a normal job (background/wait-all
# included) and the real secrets context.
#
# The crawler steps below are a straight copy of this group's own
# committed crawler-group-NN.yml (same source kept, disabled, for
# rollback). The reusable workflow's cross-repo behavior is
# specified by the parity contract in scripts/generate-crawler-group-workflows.mjs.
# It uses shared Workday egress state, a credential-free checkout of this
# repository, a Remote Config write-auth bootstrap, absolute composite
# action references, and caller-scoped token removal. Inputs, secrets and
# permissions follow the same contract.

name: Crawler Group 17 logic (reusable workflow)
on:
  workflow_call:
    inputs:
      skip_ai_translation:
        description: Skip AI translation (1=yes, cache only)
        required: false
        default: "1"
        type: string
      generation_token:
        description: Explicit generation correlation token (shadow only)
        required: false
        type: string
        default: ""
      timeout_ms:
        description: Per-crawler timeout override in milliseconds (empty uses the crawler default)
        required: false
        default: ""
        type: string
      strict_localization:
        description: Require localized job data (empty uses the crawler default; 1=yes, 0=no)
        required: false
        default: ""
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false
      CODEX_AUTH_JSON:
        required: false
permissions:
  contents: read
env:
  NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
jobs:
  crawler_group_17:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CRAWLER_GENERATION_TOKEN: ${{ inputs.generation_token || format('{0}-{1}', github.run_id, github.run_attempt) }}
      CRAWLER_GENERATION_RECEIPT_DIR: crawler-generation/receipts
      CRAWLER_GROUP_COMMIT_DIR: crawler-generation/commit-batch
      CRAWLER_GROUP_MAX_PARALLEL: "4"
      AI_CACHE_PATH: .cache/jobs-ai-cache.json
    steps:
      - name: Configure shared Workday egress state
        shell: bash
        run: echo "WORKDAY_EGRESS_STATE_DIR=$RUNNER_TEMP/crawler-generation/workday-egress" >> "$GITHUB_ENV"
      - name: Checkout frontaliere-si-o-no (public, read-only)
        uses: actions/checkout@v7
        with:
          repository: valerielinc-ops/frontaliere-si-o-no
          fetch-depth: 50
          persist-credentials: false
      - name: Validate crawler generation token before crawling
        run: node scripts/check-crawler-generation-token.mjs
      - name: Restore crawler AI cache
        id: restore_crawler_ai_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/jobs-ai-cache.json
          key: jobs-ai-cache-v1-crawler-group-17-${{ github.repository }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-ai-cache-v1-crawler-group-17-${{ github.repository }}-${{ runner.os }}-
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore per-company translation cache
        id: translation_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/translation-cache
          key: translation-cache-v1-crawler-group-17-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-cache-v1-crawler-group-17-
      - name: Prepare per-company translation cache
        if: always()
        env:
          TRANSLATION_CACHE_MATCHED_KEY: ${{ steps.translation_cache_restore.outputs.cache-matched-key }}
        run: |-
          mkdir -p data/translation-cache
          if [ -n "$TRANSLATION_CACHE_MATCHED_KEY" ]; then
            echo "✅ Per-company translation cache restored: $TRANSLATION_CACHE_MATCHED_KEY"
            echo "translation-cache: hit ($TRANSLATION_CACHE_MATCHED_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Per-company translation cache miss; translations will repopulate it."
            echo "translation-cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare Firebase credentials and global data lease
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |-
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is required to acquire the global data pipeline lease; refusing to continue to shared crawler commits."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          echo "DATA_PIPELINE_LEASE=1" >> "$GITHUB_ENV"
      - name: Load secrets from Remote Config
        run: node scripts/load-rc-env.mjs
      - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
        run: |-
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 31 silent push failures."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
          echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"
      - name: "Guard: refuse a concurrent run of the other entry point"
        run: node scripts/check-crawler-group-live-run.mjs crawler-group-17.yml --repo valerielinc-ops/frontaliere-si-o-no --token-env GITHUB_PAT
      - uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-omniroute@main
      - id: setup_claude_haiku_fallback
        uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-claude-haiku-fallback@main
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Install shared crawler launcher
        run: |-
          # shellcheck disable=SC2016,SC1003
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-17"
          mkdir -p "$state_dir/slots"
          rm -f "$state_dir/worker.sh" "$state_dir/launcher.sh"
          printf '%s\n' 'set +e
          d="$CRAWLER_LAUNCH_DIR"
          s="$CRAWLER_LAUNCH_SLUG"
          script_path="$d/$s.sh"
          worker_status_file="$d/$s.worker.status"
          worker_status_tmp="$d/$s.worker.status.tmp.$$"
          started_file="$d/$s.started"
          if [ -n "${CRAWLER_LAUNCH_CRAWL_EXIT:-}" ]; then
            export CRAWLER_MEMBER_CRAWL_EXIT_FILE="$d/$CRAWLER_LAUNCH_CRAWL_EXIT"
          else
            unset CRAWLER_MEMBER_CRAWL_EXIT_FILE
          fi
          export CRAWLER_MEMBER_LOG_FILE="$d/$s.log"
          : > "$started_file"
          bash "$script_path"
          crawler_exit=$?
          printf '\''%s\n'\'' "$crawler_exit" > "$worker_status_tmp"
          mv -f "$worker_status_tmp" "$worker_status_file"
          exit "$crawler_exit"' > "$state_dir/worker.sh"
          printf '%s\n' 'set +e
          state_dir="$CRAWLER_LAUNCH_DIR"
          s="$CRAWLER_LAUNCH_SLUG"
          worker_path="$state_dir/worker.sh"
          status_file="$state_dir/$s.status"
          status_tmp="$state_dir/$s.status.tmp.$$"
          worker_status_file="$state_dir/$s.worker.status"
          started_file="$state_dir/$s.started"
          watchdog_file="$state_dir/$CRAWLER_LAUNCH_WATCHDOG_FILE"
          worker_watchdog_max=330
          worker_watchdog_minutes="${CRAWLER_WORKER_TIMEOUT_MINUTES:-$CRAWLER_LAUNCH_MINUTES}"
          if ! [[ "$worker_watchdog_minutes" =~ ^[1-9][0-9]*$ ]] || [ "$worker_watchdog_minutes" -gt "$worker_watchdog_max" ]; then
            echo "Invalid CRAWLER_WORKER_TIMEOUT_MINUTES: $worker_watchdog_minutes (must be <= $worker_watchdog_max; default $CRAWLER_LAUNCH_MINUTES)"
            worker_watchdog_minutes=$CRAWLER_LAUNCH_MINUTES
          fi
          classifyCrawlerTimeoutRace() {
            if [ "$1" = 124 ] || [ "$1" = 137 ]; then
              printf '\''%s\n'\'' "$1"
            elif [ -s "$worker_status_file" ]; then
              worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
              if [[ "$worker_status" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$worker_status"; else printf '\''%s\n'\'' 1; fi
            elif [ -e "$started_file" ]; then
              printf '\''%s\n'\'' 143
            elif [ "$1" = 0 ]; then
              printf '\''%s\n'\'' 1
            else
              if [[ "$1" =~ ^[0-9]+$ ]]; then printf '\''%s\n'\'' "$1"; else printf '\''%s\n'\'' 143; fi
            fi
          }
          resolveCrawlerTerminalStatus() {
            local wrapper_exit="$1"
            local worker_status=""
            local terminal_exit=""
            local watchdog_marker=1
            [ -s "$worker_status_file" ] && worker_status="$(cat "$worker_status_file" 2>/dev/null || true)"
            terminal_exit="$(classifyCrawlerTimeoutRace "$wrapper_exit")"
            if { [ "$wrapper_exit" = 124 ] || [ "$wrapper_exit" = 137 ]; } && { [ "$worker_status" = 1 ] || [ "$worker_status" = 124 ]; }; then watchdog_marker=0; fi
            if [ "$watchdog_marker" -eq 1 ]; then
              if [ "$terminal_exit" -eq 124 ] || [ "$terminal_exit" -eq 137 ]; then printf '\''%s\n'\'' "$worker_watchdog_minutes" > "$watchdog_file"; fi
            fi
            if ! { printf '\''%s\n'\'' "$terminal_exit" > "$status_tmp" && mv -f "$status_tmp" "$status_file"; } 2>/dev/null; then
              echo "::error::could not publish the crawler terminal status" >&2
              return 1
            fi
            printf '\''%s\n'\'' "$terminal_exit"
          }
          # A relay member takes a private one-process slot and starts as soon as it is
          # launched; its non-relay siblings use the group slot pool.
          if [ -n "${CRAWLER_LAUNCH_RELAY_SLOT:-}" ]; then
            max_parallel=1
          else
            max_parallel="${CRAWLER_GROUP_MAX_PARALLEL:-$CRAWLER_LAUNCH_PARALLEL}"
          fi
          if ! [[ "$max_parallel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CRAWLER_GROUP_MAX_PARALLEL: $max_parallel"
            terminal_exit="$(resolveCrawlerTerminalStatus 1)"
            exit "$terminal_exit"
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout command unavailable; refusing to run an unbounded crawler worker"
            terminal_exit="$(resolveCrawlerTerminalStatus 127)"
            exit "$terminal_exit"
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is unavailable; running this crawler without the group semaphore"
            timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
            flock_exit=$?
            terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
            exit "$terminal_exit"
          fi
          while :; do
            for slot_index in $(seq 1 "$max_parallel"); do
              slot_path="$state_dir/slots/${CRAWLER_LAUNCH_RELAY_SLOT:-slot-${slot_index}.lock}"
              flock -n "$slot_path" timeout --signal=TERM --kill-after=30s "${worker_watchdog_minutes}m" bash "$worker_path"
              flock_exit=$?
              if [ "$flock_exit" -eq 0 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -s "$worker_status_file" ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ -e "$started_file" ]; then
                # A worker that acquired a slot but disappeared before its atomic
                # status write must not be retried or waited on for the full budget.
                # Preserve the child status when available; 143 is the conventional
                # fallback for a SIGTERM from the runner/host.
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
              if [ "$flock_exit" -ne 1 ]; then
                terminal_exit="$(resolveCrawlerTerminalStatus "$flock_exit")"
                exit "$terminal_exit"
              fi
            done
            sleep 1
          done' > "$state_dir/launcher.sh"
          validateGeneratedWorkerScript() { [ -s "$1" ] && bash -n "$1"; }
          validateGeneratedWorkerScript "$state_dir/worker.sh" || exit 1
          validateGeneratedWorkerScript "$state_dir/launcher.sh" || exit 1
      - name: Confirm crawler shared setup succeeded
        id: crawler_group_setup
        run: "true"
      - name: Launch siemens-healthineers
        id: crawler-launch-siemens-healthineers
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-siemens-healthineers.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_SIEMENS_HEALTHINEERS_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: siemens-healthineers
          JOBS_SLICE_FILE: data/jobs/by-crawler/siemens-healthineers.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          # shellcheck disable=SC2016,SC1003
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-17"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/siemens-healthineers.sh"
          launcher_path="$state_dir/launcher.sh"
          log_path="$state_dir/siemens-healthineers.log"
          pid_path="$state_dir/siemens-healthineers.pid"
          status_path="$state_dir/siemens-healthineers.status"
          started_path="$state_dir/siemens-healthineers.started"
          watchdog_path="$state_dir/siemens-healthineers.watchdog"
          rm -f "$script_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$state_dir/siemens-healthineers.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- siemens-healthineers: run crawler (verbatim from original workflow) ----
          node scripts/update-siemens-healthineers-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::siemens-healthineers: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          housekeeping_exit=0
          report_exit=0

          # ---- siemens-healthineers: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs)
            housekeeping_exit=$?
          fi

          # ---- siemens-healthineers: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Siemens Healthineers jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- siemens-healthineers: Report failure to GitHub Issues (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
              --title "Crawler Failure: Run siemens-healthineers" \
              --description "## Crawler fallito
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}" \
              --priority 2 \
              --label Bug \
              --workflow "Run siemens-healthineers"
            report_exit=$?; [ "$report_exit" -eq 0 ] || echo "::error::alert reporter failed siemens-healthineers"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
            echo "::warning::siemens-healthineers: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
            echo "⚠️ siemens-healthineers: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 44 ]; then
            echo "::warning::siemens-healthineers: global data-pipeline lease is busy (exit 44); this writer staged nothing and will be retried by the next scheduled cycle — no per-crawler issue filed (systemic class)."
            echo "⚠️ siemens-healthineers: global data-pipeline lease busy (exit 44) — no data staged, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 43 ]; then
            echo "::error::siemens-healthineers: crawl OK but the crawler group'\''s shared deferred-commit precondition failed (exit 43). Group-wide fault, identical for every sibling — step stays red, no per-crawler issue filed (systemic class)."
            echo "❌ siemens-healthineers: shared group precondition failure (exit 43) — crawl was fine, no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 43
          fi
          if [ "$crawler_exit" -eq 143 ] || [ "$git_commit_exit" -eq 143 ]; then
            echo "::warning::siemens-healthineers: runner shutdown interrupted the crawler (exit 143); no per-crawler issue filed (systemic class)."
            echo "⚠️ siemens-healthineers: runner shutdown (exit 143) — no per-crawler issue filed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 143
          fi

          (( git_commit_exit == 45 )) && exit 45
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 44 && git_commit_exit != 143) )) || (( report_exit != 0 )); then
            exit 1
          fi
          exit 0' > "$script_path"
          export CRAWLER_LAUNCH_DIR="$state_dir" CRAWLER_LAUNCH_SLUG='siemens-healthineers'
          export CRAWLER_LAUNCH_MINUTES=175 CRAWLER_LAUNCH_PARALLEL=4
          export CRAWLER_LAUNCH_WATCHDOG_FILE='siemens-healthineers.watchdog'
          export CRAWLER_LAUNCH_CRAWL_EXIT='siemens-healthineers.crawl-exit'
          if command -v setsid >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup setsid bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          else
            env -u RUNNER_TRACKING_ID nohup bash "$launcher_path" > "$log_path" 2>&1 < /dev/null &
          fi
          launcher_pid=$!
          printf '%s\n' "$launcher_pid" > "$pid_path"
      - name: Launch proton
        id: crawler-launch-proton
        if: always() && steps.crawler_group_setup.outcome == 'success'
        continue-on-error: true
        env:
          SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-proton.txt
          JOBS_CRAWLER_TIMEOUT_MS: ${{ inputs.timeout_ms || '' }}
          JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
          JOBS_PROTON_STRICT: ${{ inputs.strict_localization || '1' }}
          CRAWLER_SLICE_ONLY: "1"
          SKIP_AI_TRANSLATION: ${{ inputs.skip_ai_translation || '0' }}
          JOBS_HOUSEKEEPING_SCOPE: proton
          JOBS_SLICE_FILE: data/jobs/by-crawler/proton.json
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |-
          # shellcheck disable=SC2016,SC1003
          set -euo pipefail
          state_dir="$RUNNER_TEMP/crawler-generation/group-17"
          mkdir -p "$state_dir/slots"
          script_path="$state_dir/proton.sh"
          launcher_path="$state_dir/launcher.sh"
          log_path="$state_dir/proton.log"
          pid_path="$state_dir/proton.pid"
          status_path="$state_dir/proton.status"
          started_path="$state_dir/proton.started"
          watchdog_path="$state_dir/proton.watchdog"
          rm -f "$script_path" "$log_path" "$pid_path" "$status_path" "$started_path" "$watchdog_path"
          rm -f "$state_dir/proton.crawl-exit"
          printf '%s\n' 'set -uo pipefail
          set +e

          # ---- proton: run crawler (verbatim from original workflow) ----
          node scripts/update-proton-jobs.mjs
          crawler_exit=$?
          if [ -n "${CRAWLER_MEMBER_CRAWL_EXIT_FILE:-}" ]; then
            crawl_exit_tmp="${CRAWLER_MEMBER_CRAWL_EXIT_FILE}.tmp.$$"
            if ! { printf '\''%s\n'\'' "$crawler_exit" > "$crawl_exit_tmp" && mv -f "$crawl_exit_tmp" "${CRAWLER_MEMBER_CRAWL_EXIT_FILE}"; } 2>/dev/null; then
              rm -f "$crawl_exit_tmp" 2>/dev/null
              echo "::warning::proton: could not record the crawl exit for the delivery gate; the finalizer will treat this member as unknown"
            fi
          fi
          git_commit_exit=0
          housekeeping_exit=0
          report_exit=0

          # ---- proton: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            (node scripts/cleanup-jobs.mjs)
            housekeeping_exit=$?
          fi

          # ---- proton: Commit and push (verbatim, only if crawler succeeded) ----
          if [ "$crawler_exit" -eq 0 ] && [ "$housekeeping_exit" -eq 0 ]; then
            CRAWLER_GROUP_DEFER_COMMIT=1 flock /tmp/crawler-group-git.lock -c '\''bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Proton jobs (dedicated crawler)" data/jobs-crawler-adapters/'\''
            git_commit_exit=$?
          fi

          # ---- proton: Report failure to GitHub Issue (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
          if (( (crawler_exit != 0 && crawler_exit != 143) || housekeeping_exit != 0 || (git_commit_exit != 0 && git_commit_exit != 42 && git_commit_exit != 43 && git_commit_exit != 44 && git_commit_exit != 45 && git_commit_exit != 143) )); then
            node scripts/lib/github-issue-creator.mjs --log-excerpt-file "${CRAWLER_MEMBER_LOG_FILE:-}" --require-persisted \
