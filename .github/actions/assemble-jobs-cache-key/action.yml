name: 'assemble-jobs cache key'
description: >-
  Prints the key under which scripts/assemble-jobs-dataset.mjs looks up and
  snapshots its output (.cache/assemble-jobs/<key>), for use as the
  actions/cache key of that directory.

  The full SHA-256 fingerprint covers every slice, the assembler's local import
  closure, auxiliary data, package-lock.json, the output version and Node major.
  The assembler also validates those values and the run mode in the restored
  manifest before copying any cached output. Workflows should restore exact
  keys only; a prefix match cannot be reused and only transfers stale data.

  Requires the checkout and `npm ci` (the assembler's module graph is loaded).
  When the key cannot be computed the output is empty: callers skip
  restore/save and the assembly runs uncached, with a ::warning::.
inputs:
  args:
    description: >-
      The assembler flags of the run the key is for (`--stats`,
      `--no-summaries`): they are part of the key.
    required: false
    default: ''
outputs:
  key:
    description: 'The full SHA-256 fingerprint and run mode; empty on failure.'
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        ASSEMBLE_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086 # ASSEMBLE_ARGS is a flag list by contract
        if key="$(node scripts/assemble-jobs-dataset.mjs --print-cache-key $ASSEMBLE_ARGS | tail -n 1)" \
          && printf '%s' "$key" | grep -Eq '^[0-9a-f]{64}_[a-z_]+$'; then
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "assemble-jobs cache key: $key"
        else
          echo "::warning::assemble-jobs cache key not computable — full assembly without cache"
        fi
