name: "Setup OmniRoute (self-hosted local AI gateway)"
description: >-
  Installs OmniRoute (Homebrew CLI, published to npm), starts it with a
  random INITIAL_PASSWORD, waits for readiness on
  http://localhost:20128, registers provider connections — the full set
  decrypted from a local OmniRoute install when OMNIROUTE_PROVIDERS_JSON is
  present in Remote Config (see scripts/sync-omniroute-providers-rc.mjs),
  else a small curated fallback from env (GROQ_API_KEY/OPENROUTER_API_KEY/
  GEMINI_API_KEY/MISTRAL_API_KEY — see scripts/ci/omniroute-poc-register.mjs),
  then sets OMNIROUTE_ENABLED=1 so scripts/lib/ai-models.mjs offers
  AI_MODELS.OMNIROUTE_AUTO (single "auto" routing-sentinel node — OmniRoute
  does its OWN internal provider fallback across whatever it has
  registered; we deliberately don't enumerate its providers as separate
  chain entries) for the rest of this job.
  Extracted from the original inline steps in
  .github/workflows/omniroute-poc.yml (PR #4797) so both that POC and any
  pilot workflow (see generate-company-parser.yml's omniroute_enabled
  input) share one implementation instead of copy-pasted bash drifting
  apart (AGENTS.md #6).
  Default-ON kill-switch (RC flag ENABLE_OMNIROUTE_FALLBACK='0' disables
  every step below, mirrors setup-claude-haiku-fallback's ENABLE_HAIKU_
  ARTICLE_FALLBACK gate) added when this action was rolled out from the two
  original pilot callers to every other workflow that runs an ai-models.mjs
  consumer script — a single RC flip now kills OmniRoute registration
  everywhere at once without editing each caller.
  Caller MUST run "node scripts/load-rc-env.mjs" before this action so both
  the kill-switch flag and the small curated provider keys are present in
  env. Callers that still want a narrower, explicit opt-in (e.g. a
  workflow_dispatch boolean) keep gating the `uses:` step itself with their
  own `if:` on top — this action's internal gate is additive, not a
  replacement.
  BUG THAT SHIPPED IN PR #4816, FIXED HERE: gating steps directly on
  `if: env.ENABLE_OMNIROUTE_FALLBACK != '0'` silently skips them whenever
  the RC param is genuinely absent (not merely empty) — confirmed live on
  main across every wired workflow (ENABLE_OMNIROUTE_FALLBACK was never in
  Remote Config, so load-rc-env.mjs never writes it to $GITHUB_ENV, so
  `env.ENABLE_OMNIROUTE_FALLBACK` is a true-unset key, and GitHub Actions'
  `!=` comparison then evaluates FALSE against '0', not TRUE — the inverse
  of what an empty-string operand would do). Same root cause already
  diagnosed for the `vars.*` context in translate-pending.yml's
  TRANSLATE_ARGOS_FIRST_DISABLE comment (run history there is the reason
  that gate reads `!= '1'`, not `!= '0'`); this file previously believed
  (wrongly) that `env.*` didn't share the `vars.*` quirk. Fix: resolve the
  default in bash BEFORE the `if:` sees it — `${ENABLE_OMNIROUTE_FALLBACK:-1}`
  correctly treats a true-unset shell var as `1`, sidestepping the
  expression-language coercion entirely — then gate on the already-resolved,
  always-non-empty OMNIROUTE_FALLBACK_GATE var instead of the raw RC var.
runs:
  using: "composite"
  steps:
    # Unconditional: resolves the RC flag's actual default (proceed) in
    # bash instead of GitHub Actions' `if:` expression language, which
    # evaluates a true-unset env.X as equal to '0' rather than as ''. See
    # the BUG note above.
    - name: Resolve OmniRoute fallback gate
      shell: bash
      run: echo "OMNIROUTE_FALLBACK_GATE=${ENABLE_OMNIROUTE_FALLBACK:-1}" >> "$GITHUB_ENV"

    # Resolves npm's real download/content-cache directory (documented
    # default ~/.npm, but read from npm's own config here instead of
    # assuming — npm config `cache` is user-overridable in .npmrc) so the
    # cache step below points at the directory that actually makes
    # `npm install -g` fast, not a guessed path.
    - name: Resolve npm cache dir
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      shell: bash
      run: echo "OMNIROUTE_NPM_CACHE_DIR=$(npm config get cache)" >> "$GITHUB_ENV"

    # Caches npm's download/content cache (tarballs + registry packuments),
    # NOT the global install target (`npm root -g`): that path lives under
    # Node's per-version hostedtoolcache directory, which would make this
    # cache silently stop paying off (never break, just go cold) the moment
    # any caller's node-version input changes — ~/.npm has no such
    # dependency, it's keyed only to $HOME, so this is the simpler, more
    # robust option of the two considered (see Install OmniRoute step below
    # for the rest of the rationale).
    - name: Cache OmniRoute npm download cache
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      uses: actions/cache@v5
      with:
        path: ${{ env.OMNIROUTE_NPM_CACHE_DIR }}
        key: omniroute-npm-cache-3.8.48-${{ runner.os }}

    # Version pinned to 3.8.48 — the version the previously-unpinned
    # `npm install -g omniroute` already resolves to today (verified live:
    # `npm view omniroute version` / registry dist-tags.latest = 3.8.48, and
    # independently confirmed in the "Setup OmniRoute" step log of run
    # 30286278791 — `marked@"^18.0.4" from omniroute@3.8.48`). This is a
    # stability pin, not an upgrade or downgrade: without it, "latest"
    # moving to a new release would both silently change the installed CLI
    # AND perpetually invalidate the cache key above (a moving key never
    # gets a warm hit). NOTE: an earlier draft of this task cited "16.2.10"
    # as the running version, sourced from a GitHub Actions "orphan process"
    # cleanup line ("Terminate orphan process: ... omniroute (v16.2.10)")
    # in that same run's log — that string is the omniroute *binary's own*
    # internal version banner, not the npm package version; 16.2.10 does not
    # exist as a published npm version of this package (confirmed against
    # the live registry) and pinning to it would hard-fail every install.
    # 3.8.48 is the correct, verified pin. --prefer-offline lets npm satisfy
    # the install from the cache above when warm, falling back to the
    # normal network install on any miss (first run, cache eviction, a
    # future version bump) — never a hard failure mode. --no-audit
    # --no-fund drop two more registry round-trips npm makes by default that
    # have no bearing on what gets installed.
    - name: Install OmniRoute
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      shell: bash
      run: OMNIROUTE_SKIP_POSTINSTALL=1 npm install -g omniroute@3.8.48 --prefer-offline --no-audit --no-fund

    - name: Start OmniRoute server
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      shell: bash
      run: |
        OMNI_PW="$(openssl rand -hex 20)"
        echo "::add-mask::$OMNI_PW"
        echo "OMNIROUTE_INITIAL_PASSWORD=$OMNI_PW" >> "$GITHUB_ENV"
        INITIAL_PASSWORD="$OMNI_PW" nohup omniroute > /tmp/omniroute.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:20128/api/settings/require-login >/dev/null; then
            echo "OmniRoute ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "OmniRoute did not become ready in time"
        cat /tmp/omniroute.log
        exit 1

    - name: Register OmniRoute providers (small curated set)
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      shell: bash
      run: node scripts/ci/omniroute-poc-register.mjs

    - name: Enable OmniRoute for the rest of this job
      if: env.OMNIROUTE_FALLBACK_GATE != '0'
      shell: bash
      run: echo "OMNIROUTE_ENABLED=1" >> "$GITHUB_ENV"

    # Unconditional (no `if:`) so it also fires when the steps above got
    # skipped — surfaces flag/registration desync directly in this run's
    # log instead of requiring a forensic dig through job.steps[].conclusion.
    - name: Diagnose OmniRoute fallback state
      shell: bash
      run: |
        echo "ENABLE_OMNIROUTE_FALLBACK=${ENABLE_OMNIROUTE_FALLBACK:-<unset>} (raw RC value)"
        echo "OMNIROUTE_FALLBACK_GATE=${OMNIROUTE_FALLBACK_GATE:-<unset>} (resolved gate)"
        echo "OMNIROUTE_ENABLED=${OMNIROUTE_ENABLED:-<unset>}"
        if command -v omniroute >/dev/null 2>&1; then
          echo "omniroute CLI: present"
        else
          echo "omniroute CLI: NOT on PATH — fallback will no-op if the runtime gate offers it this run"
        fi
