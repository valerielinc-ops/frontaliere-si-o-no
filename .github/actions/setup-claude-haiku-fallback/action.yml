name: "Setup Claude CLI Haiku fallback"
description: >-
  Installs @anthropic-ai/claude-code and forces ENABLE_HAIKU_ARTICLE_FALLBACK=1
  (RC kill-switch: set the Remote Config flag to '0' to disable this
  workflow). Model tier AI_MODELS.CLAUDE_CLI_HAIKU in scripts/lib/ai-models.mjs.
  Since 2026-07-29 (AI_COMPETING_TIERS default) this tier is tier-0 BY
  DEFAULT — it competes on real score against every free-tier model
  (sortChainByScore), no longer pinned below local/* or reached only after
  every other model has failed; capped at CLAUDE_CLI_MAX_CALLS_PER_RUN
  calls/run (default 25) since this quota is shared with
  pr-review-loop.yml/issue-fix.yml. Set AI_COMPETING_TIERS='' to restore the
  old pinned-last-resort behavior. Zero marginal cost: auth is
  CLAUDE_CODE_OAUTH_TOKEN (same Max-plan subscription token already used by
  pr-review-loop.yml/issue-fix.yml), never ANTHROPIC_API_KEY.
  Caller MUST run "node scripts/load-rc-env.mjs" before this action so
  env.ENABLE_HAIKU_ARTICLE_FALLBACK reflects Remote Config. Caller MUST also
  pass CLAUDE_CODE_OAUTH_TOKEN (sourced from secrets.CLAUDE_CODE_OAUTH_TOKEN)
  via env: on any step that actually invokes callLLM — ai-models.mjs only
  offers the model when both the flag AND the token are present
  (isClaudeCliFallbackEnabled/hasClaudeCodeOauthToken). Passing the token
  here is harmless even on steps that never reach the fallback tier.
  When Claude reports a real usage limit/HTTP 429, ai-models.mjs makes one
  indirect Codex CLI attempt using CODEX_AUTH_JSON from a temporary
  CODEX_HOME/auth.json; this action installs the pinned CLI needed for that
  path. Callers pass the optional secret through the codex_auth_json input;
  only the broker bootstrap step receives it, keeps it in broker memory, and
  exports a private Unix-socket path for the later fallback consumer.
  CORRECTED CLAIM (was wrong in this file since generate-article.yml run
  29676088799, propagated into setup-omniroute/action.yml via PR #4816):
  env.* is NOT immune to the null/unset->0 coercion previously blamed only
  on vars.* — `if: env.X != '0'` also evaluates FALSE when env.X was never
  set anywhere (confirmed live: this repo's RC value for
  ENABLE_HAIKU_ARTICLE_FALLBACK happens to be the explicit string 'true',
  so this action's gate has never actually exercised the true-unset path in
  production). Fixed below by resolving the default in bash — where
  `${ENABLE_HAIKU_ARTICLE_FALLBACK:-1}` unambiguously treats unset as
  `1` — before the `if:` expression ever sees it, same pattern as
  setup-omniroute/action.yml and translate-pending.yml's
  TRANSLATE_ARGOS_FIRST_DISABLE (`!= '1'`) gate.
inputs:
  codex_auth_json:
    description: >-
      Optional CODEX_AUTH_JSON secret. It is consumed only while bootstrapping
      the private broker; it is never exported to the job environment.
    required: false
outputs:
  codex_auth_broker_socket:
    description: >-
      Short-lived private Unix-socket endpoint for the one-shot Codex fallback.
      The endpoint is exposed only as an action output, never through
      GITHUB_ENV.
    value: ${{ steps.start_codex_auth_broker.outputs.socket }}
runs:
  using: "composite"
  steps:
    # Unconditional: resolves the RC flag's actual default (proceed) in
    # bash instead of GitHub Actions' `if:` expression language, which
    # evaluates a true-unset env.X as equal to '0' rather than as ''. See
    # the CORRECTED CLAIM note above.
    - name: Resolve Claude CLI Haiku fallback gate
      shell: bash
      run: echo "HAIKU_FALLBACK_GATE=${ENABLE_HAIKU_ARTICLE_FALLBACK:-1}" >> "$GITHUB_ENV"

    - name: Setup Claude CLI Haiku fallback
      if: env.HAIKU_FALLBACK_GATE != '0'
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        echo "ENABLE_HAIKU_ARTICLE_FALLBACK=1" >> "$GITHUB_ENV"

    # Keep the Codex binary outside the mutable checkout and out of the global
    # PATH. The broker receives this action-owned path plus its attestation;
    # consumer steps can only send a prompt over the socket and cannot replace
    # the binary with a pre-existing `codex` executable.
    - name: Install pinned Codex CLI for the indirect fallback
      id: install_codex_cli
      if: env.HAIKU_FALLBACK_GATE != '0' && inputs.codex_auth_json != ''
      shell: bash
      run: |
        set +e
        realpath_bin=''
        if [ -x /usr/bin/realpath ]; then
          realpath_bin=/usr/bin/realpath
        elif [ -x /bin/realpath ]; then
          realpath_bin=/bin/realpath
        fi
        workspace_root="${GITHUB_WORKSPACE:-${PWD:-$(pwd)}}"
        action_path="${GITHUB_ACTION_PATH:-${PWD:-$(pwd)}}"
        runner_tmp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        workspace_root="$([ -n "$realpath_bin" ] && "$realpath_bin" "$workspace_root" 2>/dev/null || true)"
        action_path="$([ -n "$realpath_bin" ] && "$realpath_bin" "$action_path" 2>/dev/null || true)"
        runner_tmp="$([ -n "$realpath_bin" ] && "$realpath_bin" "$runner_tmp" 2>/dev/null || true)"
        find_trusted_node() {
          local path_entry candidate resolved
          [ -n "$realpath_bin" ] || return 1
          [ -n "$workspace_root" ] || return 1
          [ -n "$action_path" ] || return 1
          [ -n "$runner_tmp" ] || return 1
          while IFS= read -r path_entry; do
            [ -n "$path_entry" ] || continue
            case "$path_entry" in
              /*) ;;
              *) continue ;;
            esac
            case "$path_entry" in
              /tmp|/tmp/*|"$workspace_root"|"$workspace_root"/*|"$action_path"|"$action_path"/*|"$runner_tmp"|"$runner_tmp"/*)
                continue
                ;;
            esac
            candidate="$path_entry/node"
            [ -f "$candidate" ] || continue
            [ -x "$candidate" ] || continue
            resolved="$("$realpath_bin" "$candidate" 2>/dev/null || true)"
            [ -n "$resolved" ] || continue
            case "$resolved" in
              /usr/bin/node|/usr/local/bin/node|/opt/hostedtoolcache/node/*/bin/node|/opt/homebrew/bin/node|/opt/homebrew/Cellar/node/*/bin/node|/usr/local/Cellar/node/*/bin/node)
                ;;
              *)
                continue
                ;;
            esac
            [ -f "$resolved" ] && [ -x "$resolved" ] || continue
            printf '%s' "$resolved"
            return 0
          done < <(printf '%s\n' "${PATH:-}" | /usr/bin/tr ':' '\n' 2>/dev/null)
          return 1
        }
        node_realpath="$(find_trusted_node || true)"
        if [ -z "$node_realpath" ]; then
          echo "::warning::Codex CLI install could not resolve a trusted Node runtime; Claude and the normal fallback cascade remain available"
          exit 0
        fi
        node_bin="$node_realpath"
        codex_prefix="$(mktemp -d "$runner_tmp/claude-haiku-codex-cli.XXXXXX")"
        if [ -z "$codex_prefix" ] || [ ! -d "$codex_prefix" ]; then
          echo "::warning::Codex CLI install could not allocate its credential-free temporary prefix; Claude and the normal fallback cascade remain available"
          exit 0
        fi
        chmod 700 "$codex_prefix"
        npm_home="$codex_prefix/npm-home"
        npm_cache="$codex_prefix/npm-cache"
        mkdir -p "$npm_home" "$npm_cache"
        chmod 700 "$npm_home" "$npm_cache"
        npmrc="$codex_prefix/npmrc"
        : > "$npmrc"
        chmod 600 "$npmrc"
        # Run npm with a throw-away environment. This strips all job-level
        # credentials (including GitHub and package-manager tokens) and keeps
        # user config/cache inside this action-owned temporary prefix.
        if ! env -i \
          PATH="$PATH" \
          HOME="$npm_home" \
          CI="true" \
          NPM_CONFIG_USERCONFIG="$npmrc" \
          npm_config_cache="$npm_cache" \
          npm install --prefix "$codex_prefix" --no-save --no-package-lock \
            --no-fund --no-audit @openai/codex@0.153.4; then
          echo "::warning::Codex CLI install failed; Claude and the normal fallback cascade remain available"
          rm -rf -- "$codex_prefix"
          exit 0
        fi
        codex_link="$codex_prefix/node_modules/.bin/codex"
        if [ ! -f "$codex_link" ] || [ ! -x "$codex_link" ]; then
          echo "::warning::Pinned Codex CLI did not expose an executable; Claude and the normal fallback cascade remain available"
          rm -rf -- "$codex_prefix"
          exit 0
        fi
        codex_realpath="$($node_bin -e 'console.log(require("node:fs").realpathSync(process.argv[1]))' "$codex_link" 2>/dev/null)"
        case "$codex_realpath" in
          "$codex_prefix"/*) ;;
          *)
            echo "::warning::Pinned Codex CLI resolved outside its temporary prefix; Claude and the normal fallback cascade remain available"
            rm -rf -- "$codex_prefix"
            exit 0
            ;;
        esac
        codex_version="$($codex_realpath --version 2>&1)"
        if ! printf '%s\n' "$codex_version" | grep -Eq '(^|[^0-9])0\.153\.4([^0-9]|$)'; then
          echo "::warning::Pinned Codex CLI version attestation failed; Claude and the normal fallback cascade remain available"
          rm -rf -- "$codex_prefix"
          exit 0
        fi
        codex_sha256="$($node_bin --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; console.log(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$codex_realpath" 2>/dev/null)"
        if ! printf '%s' "$codex_sha256" | grep -Eq '^[a-f0-9]{64}$'; then
          echo "::warning::Pinned Codex CLI digest attestation failed; Claude and the normal fallback cascade remain available"
          rm -rf -- "$codex_prefix"
          exit 0
        fi
        printf 'codex_bin=%s\n' "$codex_realpath" >> "$GITHUB_OUTPUT"
        printf 'codex_realpath=%s\n' "$codex_realpath" >> "$GITHUB_OUTPUT"
        printf 'codex_sha256=%s\n' "$codex_sha256" >> "$GITHUB_OUTPUT"
        printf 'codex_prefix=%s\n' "$codex_prefix" >> "$GITHUB_OUTPUT"
        printf 'node_realpath=%s\n' "$node_realpath" >> "$GITHUB_OUTPUT"
        echo "codex CLI installed and attested (0.153.4)"

    # Keep the subscription secret on this one action step. Only an explicit
    # AI consumer step receives the output socket path; unrelated housekeeping
    # steps do not inherit a broker capability.
    - name: Start Codex auth broker for the indirect fallback
      id: start_codex_auth_broker
      if: env.HAIKU_FALLBACK_GATE != '0' && inputs.codex_auth_json != '' && steps.install_codex_cli.outputs.codex_bin != ''
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex_auth_json }}
        CODEX_CLI_BIN: ${{ steps.install_codex_cli.outputs.codex_bin }}
        CODEX_CLI_REALPATH: ${{ steps.install_codex_cli.outputs.codex_realpath }}
        CODEX_CLI_SHA256: ${{ steps.install_codex_cli.outputs.codex_sha256 }}
        CODEX_CLI_PREFIX: ${{ steps.install_codex_cli.outputs.codex_prefix }}
        TRUSTED_NODE: ${{ steps.install_codex_cli.outputs.node_realpath }}
      run: |
        set +e
        node_bin="${TRUSTED_NODE:-}"
        case "$node_bin" in
          /usr/bin/node|/usr/local/bin/node|/opt/hostedtoolcache/node/*/bin/node|/opt/homebrew/bin/node|/opt/homebrew/Cellar/node/*/bin/node|/usr/local/Cellar/node/*/bin/node)
            ;;
          *)
            echo "::warning::Codex auth broker could not use its attested Node runtime; Claude and the normal fallback cascade remain available"
            exit 0
            ;;
        esac
        if [ ! -f "$node_bin" ] || [ ! -x "$node_bin" ] || [ -L "$node_bin" ]; then
          echo "::warning::Codex auth broker attested Node runtime is not a real executable; Claude and the normal fallback cascade remain available"
          exit 0
        fi
        # The secret is present in this step from the first shell instruction;
        # remove the job-controlled PATH before invoking any external helper.
        PATH='/usr/bin:/bin'
        export PATH
        auth_tmp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        auth_dir="$(mktemp -d "$auth_tmp/claude-haiku-codex-broker.XXXXXX")"
        if [ -z "$auth_dir" ] || [ ! -d "$auth_dir" ]; then
          echo "::warning::Codex auth broker could not allocate private runner temp space; Claude and the normal fallback cascade remain available"
          exit 0
        fi
        chmod 700 "$auth_dir"
        broker_socket="$auth_dir/auth.sock"
        auth_fifo="$auth_dir/auth.in"
        if ! mkfifo "$auth_fifo" || ! chmod 600 "$auth_fifo"; then
          echo "::warning::Codex auth broker could not allocate its private input channel; Claude and the normal fallback cascade remain available"
          rm -rf -- "$auth_dir"
          exit 0
        fi
        # The broker receives the credential only through the FIFO. Start it
        # with an empty environment so CODEX_AUTH_JSON from this step cannot
        # leak into the long-lived broker process or any diagnostics.
        nohup /usr/bin/env -i PATH="$PATH" "$node_bin" "$GITHUB_ACTION_PATH/codex-auth-broker.mjs" \
          --socket "$broker_socket" --ttl-ms 1800000 \
          --codex-bin "$CODEX_CLI_BIN" --codex-realpath "$CODEX_CLI_REALPATH" \
          --codex-sha256 "$CODEX_CLI_SHA256" --codex-prefix "$CODEX_CLI_PREFIX" \
          < "$auth_fifo" > /dev/null 2>&1 &
        broker_pid=$!
        if ! printf '%s' "$CODEX_AUTH_JSON" > "$auth_fifo"; then
          echo "::warning::Codex auth broker could not receive its credential; Claude and the normal fallback cascade remain available"
          kill "$broker_pid" 2>/dev/null || true
          rm -f -- "$auth_fifo" "$broker_socket"
          rm -rf -- "$CODEX_CLI_PREFIX"
          rmdir -- "$auth_dir" 2>/dev/null || true
          exit 0
        fi
        rm -f -- "$auth_fifo"
        broker_ready=0
        for _ in $(seq 1 50); do
          if [ -S "$broker_socket" ]; then broker_ready=1; break; fi
          if ! kill -0 "$broker_pid" 2>/dev/null; then break; fi
          sleep 0.1
        done
        if [ "$broker_ready" -ne 1 ]; then
          echo "::warning::Codex auth broker did not become ready; Claude and the normal fallback cascade remain available"
          kill "$broker_pid" 2>/dev/null || true
          rm -f -- "$auth_fifo" "$broker_socket"
          rm -rf -- "$CODEX_CLI_PREFIX"
          rmdir -- "$auth_dir" 2>/dev/null || true
          exit 0
        fi
        chmod 600 "$broker_socket"
        printf 'socket=%s\n' "$broker_socket" >> "$GITHUB_OUTPUT"
        unset CODEX_AUTH_JSON

    # Unconditional (no `if:`) so it also fires when the step above got
    # skipped — surfaces flag/binary desync directly in this run's log
    # instead of requiring a forensic dig through job.steps[].conclusion.
    - name: Diagnose Claude CLI Haiku fallback state
      shell: bash
      env:
        CODEX_CLI_BIN: ${{ steps.install_codex_cli.outputs.codex_bin }}
      run: |
        echo "ENABLE_HAIKU_ARTICLE_FALLBACK=${ENABLE_HAIKU_ARTICLE_FALLBACK:-<unset>} (raw RC value)"
        echo "HAIKU_FALLBACK_GATE=${HAIKU_FALLBACK_GATE:-<unset>} (resolved gate)"
        if command -v claude >/dev/null 2>&1; then
          echo "claude CLI: present ($(claude --version 2>&1 | head -1))"
        else
          echo "claude CLI: NOT on PATH — Haiku fallback will hit ENOENT if the runtime gate offers it this run"
        fi
        if [ -n "$CODEX_CLI_BIN" ]; then
          echo "codex CLI: attested at $CODEX_CLI_BIN (version 0.153.4)"
        else
          echo "codex CLI: unavailable or failed attestation — Claude usage-limit fallback will continue to the normal model chain"
        fi
