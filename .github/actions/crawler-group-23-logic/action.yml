name: "Crawler Group 23 logic (cross-repo execution pilot)"
description: >-
  The job body of Crawler Group 23 (28 dedicated job-board crawlers),
  extracted from .github/workflows/crawler-group-23.yml into a composite
  action so it can be invoked from a workflow physically hosted in
  frontaliere-articles (account nanakokyobashi-rgb) — moving THIS ONE
  group's Actions minutes off valerielinc-ops' saturated ~20-concurrent-job
  pool onto nanako's separate pool with more headroom — without duplicating
  ~1600 lines of per-crawler step bodies into a second copy that drifts out
  of sync. Single source of truth stays here, in frontaliere-si-o-no, same
  as every other crawler-group-*.yml (still auto-generated in place by
  scripts/generate-crawler-group-workflows.mjs — this action's crawler
  steps are a straight copy of that generator's output for group 23, hand-
  ported into composite-action shape; if the generator's crawler-step
  template changes, re-sync this file by hand until/unless the generator
  itself learns to emit composite-action YAML).
  Pilot for frontaliere-si-o-no#<PR_SITE> / frontaliere-articles#<PR_ARTICLES>
  — see the disabled original crawler-group-23.yml for rollback instructions.

  IMPORTANT — composite actions do NOT inherit the caller workflow's
  `secrets` context. Every secret this logic needs (FIREBASE_SERVICE_ACCOUNT_JSON,
  CLAUDE_CODE_OAUTH_TOKEN) MUST be passed explicitly via `inputs:` below —
  the caller passes them with `with:`, this file reads them via
  `${{ inputs.* }}`, never `${{ secrets.* }}` (which resolves empty here).
  GITHUB_PAT (write access to valerielinc-ops/frontaliere-si-o-no) is NOT an
  input: it is loaded at runtime from Firebase Remote Config by
  scripts/load-rc-env.mjs (same bridge every other workflow uses — see
  CLAUDE.md "Credenziali"), because the caller's own ambient
  `secrets.GITHUB_TOKEN` is scoped to frontaliere-articles and cannot write
  to a different repo/account.

  Caller contract: invoke this action as (effectively) the first step of a
  job — it performs its OWN checkout of frontaliere-si-o-no into
  $GITHUB_WORKSPACE (anonymous, read-only: the repo is public) and every
  later step (including the 28 crawler steps and the two nested setup-*
  composite actions) depends on that checkout being there. Any job-level
  `env:` the caller sets (e.g. NODE_OPTIONS) is visible to every step here
  automatically — a normal job's `env:` block is inherited by steps
  contributed by a composite action, no need to re-declare it inside this
  file.
inputs:
  firebase-sa:
    description: >-
      Value of the FIREBASE_SERVICE_ACCOUNT_JSON secret (optional — crawler
      falls back to file config when absent, same as the original workflow).
    required: false
    default: ""
  claude-code-oauth-token:
    description: >-
      Value of the CLAUDE_CODE_OAUTH_TOKEN secret. Used by the Claude CLI
      Haiku fallback tier (setup-claude-haiku-fallback) and passed to every
      crawler step's own env (AI model chain).
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # ── Bootstrap checkout #1: anonymous, read-only ─────────────────────────
    # frontaliere-si-o-no is PUBLIC, so an anonymous clone works for read.
    # `token: ''` is the documented way to force actions/checkout to skip
    # auth entirely (it would otherwise default to the CALLER's own
    # secrets.GITHUB_TOKEN — a token scoped to frontaliere-articles, i.e. the
    # WRONG repo/account here; passing it as an Authorization header against
    # a different repo risks a 401 instead of silently going anonymous).
    # This deliberately leaves NO persisted git credentials, so the
    # "Bootstrap write auth" step below must configure its own before any
    # step that pushes or opens issues.
    - name: Checkout frontaliere-si-o-no (public, read-only)
      uses: actions/checkout@v5
      with:
        repository: valerielinc-ops/frontaliere-si-o-no
        token: ""
        fetch-depth: 50

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "22"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Prepare Firebase credentials (optional)
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ inputs.firebase-sa }}
      run: |-
        if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
        else
          echo "ℹ️ Firebase secrets not set — crawler will use file config only."
          exit 0
        fi
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

    # Loads ~90 RC-mapped secrets into $GITHUB_ENV for every LATER step in
    # this job (including the 28 crawler steps below) — see
    # scripts/load-rc-env.mjs. Crucially this includes GITHUB_PAT, which the
    # next step turns into write access on frontaliere-si-o-no. $GITHUB_ENV
    # writes only become real env vars starting the NEXT step — GITHUB_PAT is
    # not usable as a shell variable within THIS step, hence the separate
    # bootstrap step right after.
    - name: Load secrets from Remote Config
      shell: bash
      run: node scripts/load-rc-env.mjs

    # ── Bootstrap checkout #2: reconfigure auth with GITHUB_PAT ─────────────
    # Chicken-and-egg, resolved: reading GITHUB_PAT from Remote Config needed
    # load-rc-env.mjs, which lives in this (just-checked-out) repo, which is
    # why the FIRST checkout above had to be anonymous/read-only. Now that
    # GITHUB_PAT is a real env var (persisted via $GITHUB_ENV in the PRIOR
    # step), reconfigure the remote so every later git push / gh call in this
    # job (crawler commits via scripts/lib/git-commit-data.sh, failure issues
    # via scripts/lib/github-issue-creator.mjs) authenticates as a token with
    # write access to valerielinc-ops/frontaliere-si-o-no — not the ambient
    # frontaliere-articles-scoped default token, and not the anonymous
    # checkout above.
    #
    # Belt-and-suspenders: git-commit-data.sh's own ensure_git_auth() already
    # reconfigures the same http.https://github.com/.extraheader from
    # $GH_TOKEN before every fetch/push attempt, so the explicit
    # `git remote set-url` below is redundant for THAT script specifically —
    # but github-issue-creator.mjs shells out to the `gh` CLI, which reads
    # $GH_TOKEN/$GH_REPO directly (it does NOT consult the git remote's
    # embedded credentials at all), so GH_TOKEN/GH_REPO must be exported
    # regardless. Doing both here removes any dependency on step ordering
    # inside git-commit-data.sh and fails loudly, not silently, if
    # GITHUB_PAT never made it out of Remote Config.
    - name: Bootstrap write auth for frontaliere-si-o-no (GITHUB_PAT from Remote Config)
      shell: bash
      run: |-
        if [ -z "${GITHUB_PAT:-}" ]; then
          echo "::error::GITHUB_PAT missing from Remote Config (RC_TO_ENV in scripts/load-rc-env.mjs) — cannot push crawler data to valerielinc-ops/frontaliere-si-o-no or file crawler-failure issues there. Aborting before any crawler runs so this fails loud, not as 28 silent push failures."
          exit 1
        fi
        git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/valerielinc-ops/frontaliere-si-o-no.git"
        echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"
        echo "GH_REPO=valerielinc-ops/frontaliere-si-o-no" >> "$GITHUB_ENV"

    # Cross-repo composite-action references (not local `./` paths): this
    # action itself is already being invoked cross-repo, so nested local
    # actions use the same explicit owner/repo/path@ref form for the same
    # reason — it sidesteps any ambiguity in how a composite action resolves
    # a NESTED local ("./...") action reference. Both nested actions only
    # touch the current $GITHUB_WORKSPACE (already the frontaliere-si-o-no
    # checkout from the first step above) and env vars via $GITHUB_ENV, no
    # other repo-relative assumption — read in full before reuse here.
    - uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-omniroute@main
    - uses: valerielinc-ops/frontaliere-si-o-no/.github/actions/setup-claude-haiku-fallback@main

    # ── 28 crawler steps below: verbatim port of crawler-group-23.yml's own
    # generated steps (scripts/generate-crawler-group-workflows.mjs), same
    # business logic / env vars / caps / thresholds. Structural changes only:
    # dedented one level (composite `runs.steps` vs a job's `jobs.<id>.steps`),
    # `shell: bash` added (composite run: steps have no implicit default
    # shell), the per-step `GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}` line
    # dropped (would shadow the job-wide GH_TOKEN/PAT bootstrapped above with
    # the wrong, frontaliere-articles-scoped token), and
    # `CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` swapped
    # for `${{ inputs.claude-code-oauth-token }}` (composite actions have no
    # `secrets` context at all).
    - name: Run rituals-cosmetics
      id: crawler-rituals-cosmetics
      background: true
      shell: bash
      env:
        SLUG_HISTORY_SUMMARY_FILE: /tmp/slug-history-summary-rituals-cosmetics.txt
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        JOBS_CRAWLER_TIMEOUT_MS: ${{ github.event.inputs.timeout_ms || '' }}
        JOBS_CRAWLER_USE_FIRESTORE_CONFIG: "1"
        JOBS_RITUALS_COSMETICS_STRICT: ${{ github.event.inputs.strict_localization || '1' }}
        CRAWLER_SLICE_ONLY: "1"
        SKIP_AI_TRANSLATION: ${{ github.event.inputs.skip_ai_translation || '0' }}
        JOBS_HOUSEKEEPING_SCOPE: rituals-cosmetics
        JOBS_SLICE_FILE: data/jobs/by-crawler/rituals-cosmetics.json
      run: |-
        set -uo pipefail
        set +e

        # ---- rituals-cosmetics: run crawler (verbatim from original workflow) ----
        node scripts/update-rituals-cosmetics-jobs.mjs
        crawler_exit=$?
        git_commit_exit=0

        # ---- rituals-cosmetics: Housekeeping — remove expired job listings (scoped) (verbatim, only if crawler succeeded) ----
        if [ "$crawler_exit" -eq 0 ]; then
          (node scripts/cleanup-jobs.mjs) || true
        fi

        # ---- rituals-cosmetics: Commit and push (verbatim, only if crawler succeeded) ----
        if [ "$crawler_exit" -eq 0 ]; then
          flock /tmp/crawler-group-git.lock -c 'bash scripts/lib/git-commit-data.sh --slice-only "💼 Auto-update Rituals Cosmetics Switzerland jobs (dedicated crawler)" data/jobs-crawler-adapters/'
          git_commit_exit=$?
        fi

        # ---- rituals-cosmetics: Report failure to GitHub Issue (verbatim except github.workflow -> literal per-crawler id, only on crawler OR commit failure) ----
        if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
          node scripts/lib/github-issue-creator.mjs \
            --title "Crawler Failure: Run rituals-cosmetics" \
            --description "## Crawler fallito
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}" \
            --priority 2 \
            --label Bug \
            --workflow "Run rituals-cosmetics"
        fi
        if [ "$crawler_exit" -eq 0 ] && [ "$git_commit_exit" -eq 42 ]; then
          echo "::warning::rituals-cosmetics: crawl OK but push lost the ref race after all retries (contention). Cycle lost, self-heals next scheduled run — no issue filed (systemic class)."
          echo "⚠️ rituals-cosmetics: push contention loss (exit 42) — crawl was fine, no issue filed" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$crawler_exit" -ne 0 ] || { [ "$git_commit_exit" -ne 0 ] && [ "$git_commit_exit" -ne 42 ]; }; then
          exit 1
        fi
        exit 0
    - name: Run ruag
