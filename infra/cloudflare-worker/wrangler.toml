# Cloudflare Worker config for the frontaliereticino.ch locale router.
# Deploy: `npx wrangler deploy` (or paste locale-router.js in the dashboard).
# Requires the zone frontaliereticino.ch to be on Cloudflare (NS moved) first.

name = "frontaliere-locale-router"
main = "locale-router.js"
compatibility_date = "2026-01-01"

# NOTE: routes carry a `request_limit_fail_open` flag that wrangler.toml CANNOT
# express (API-only). It MUST be true (a defence-in-depth fail-open: if the
# Worker ever errors or a daily cap is hit, the Worker is bypassed and the CDN
# cache serves apex-keyed pages instead of error 1027) —
# scripts/cf-locale-failover-setup.mjs asserts it after every deploy
# (deploy-worker.yml runs it; after a MANUAL `npx wrangler deploy`, run it too).
# NB: the account is on Workers Paid (10M req/mo included, overage ~$0.30/M), so
# the old free 100k/day invocation cap no longer binds — Worker-routed traffic
# volume is no longer a scoping constraint (the section routes below add three of
# the IT bulk's largest sections deliberately).
#
# The Worker is scoped to the locale paths PLUS the ticino/svizzera/zurigo section
# IT prefixes. The locale scope uses three exact patterns (subtree /*, bare, .html)
# so look-alikes like /enterprise never match; each section's IT scope uses one
# wildcard (see its comment below) so query-string hits are covered — a look-alike
# like /cerca-lavoro-ticino-altro matches that CF route but is rejected in-code.
# The in-code LOCALE_RE + matchSection are the authoritative matching guards.
# Non-section IT paths stay pure Cloudflare passthrough with no Worker subrequest.
#
# THE THREE `/xx.html` ROUTES STAY EXACT — DO NOT WILDCARD THEM.
# The EDGE_PUSHED_FILES routes further down were given a trailing `*` (see the
# /sitemap-blog-ch.xml comment for the full rationale) so a query string cannot
# change which origin answers. The same reasoning does NOT carry over here, and
# applying it would make things worse. Measured 2026-08-08:
#
#   /en.html  bare → 404      /en.html?cb=1 → 200
#   /de.html  bare → 404      /de.html?cb=1 → 200
#   /fr.html  bare → 404      /fr.html?cb=1 → 200
#
# The bare request is already routed here (these exact patterns), LOCALE_RE
# matches, and serveShard sends it to origin-{loc}, which has no such file —
# confirmed directly: origin-en.frontaliereticino.ch/en.html → 404 while
# origin-en.frontaliereticino.ch/index.html → 200. The 200 comes from the
# BYPASS: without the Worker the request lands on the Pages trunk, which does
# carry en.html. So here the query-string variant is the one that works, and
# wildcarding these routes would route it to the shard too and turn the last
# working variant into a third 404. The real defect is that the locale shards do
# not carry `<loc>.html`, or that the Worker does not fold `/en.html` onto the
# locale root — a Worker-code/shard-content fix, not a routing one. Left open
# deliberately; do not "make it consistent" by widening the route.
routes = [
  { pattern = "frontaliereticino.ch/en/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/en",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/en.html", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de.html", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr.html", zone_name = "frontaliereticino.ch" },
  # Ticino section (IT apex prefix) → origin-ticino-it (one shard repo per locale;
  # see locale-router.js SECTION_ORIGIN.ticino). The en/de/fr Ticino subpaths
  # (/en/find-jobs-ticino, /de/jobs-im-tessin, /fr/trouver-emploi-tessin) already
  # reach the Worker via the /en|/de|/fr routes above and are re-targeted to
  # origin-ticino-<loc> in-code (matchSection), so only the IT prefix needs a new
  # route here — the IT apex otherwise bypasses the Worker entirely.
  #
  # ONE wildcard `…/cerca-lavoro-ticino*` (NOT bare + /* + .html exact routes): a
  # CF route without a trailing `*` matches only the exact URL with NO query
  # string (#2611), so the busiest section's `?utm_*`/`?fbclid=` ad/social/
  # newsletter hits would bypass the Worker and — after the strip flip — 404 at
  # the apex. The wildcard covers the bare path, /, .html, deep paths, AND query
  # strings. Look-alikes like /cerca-lavoro-ticino-altro also match the CF route
  # but matchSection returns null for them in-code → harmless apex passthrough.
  # Same pattern as the disiscrivi-* proxies above.
  { pattern = "frontaliereticino.ch/cerca-lavoro-ticino*", zone_name = "frontaliereticino.ch" },
  # Svizzera section (IT apex prefix, nationwide aggregator) → origin-svizzera-it
  # (one shard repo per locale; see locale-router.js SECTION_ORIGIN.svizzera). Same
  # rationale as the Ticino route above: the en/de/fr svizzera subpaths
  # (/en/find-jobs-switzerland, /de/jobs-in-schweiz, /fr/trouver-emploi-suisse)
  # already reach the Worker via the /en|/de|/fr routes above and are re-targeted
  # to origin-svizzera-<loc> in-code (matchSection), so only the IT prefix needs a
  # new route here. Wildcard for the same reason as Ticino's: a CF route without a
  # trailing `*` matches only the exact URL with NO query string (#2611), and this
  # is a high-traffic section that gets `?utm_*`/`?fbclid=` ad/social/newsletter
  # hits. Look-alikes match the CF route but matchSection rejects them in-code.
  { pattern = "frontaliereticino.ch/cerca-lavoro-svizzera*", zone_name = "frontaliereticino.ch" },
  # Zurigo section (IT apex prefix, Zurich canton) → origin-zurigo-it (one shard
  # repo per locale; see locale-router.js SECTION_ORIGIN.zurigo). Same rationale as
  # the Ticino route above: the en/de/fr zurigo subpaths (/en/find-jobs-zurich,
  # /de/jobs-in-zurich, /fr/trouver-emploi-zurich) already reach the Worker via the
  # /en|/de|/fr routes above and are re-targeted to origin-zurigo-<loc> in-code
  # (matchSection), so only the IT prefix needs a new route here. Wildcard for the
  # same reason as Ticino's: a CF route without a trailing `*` matches only the
  # exact URL with NO query string (#2611), and this is a high-traffic section that
  # gets `?utm_*`/`?fbclid=` ad/social/newsletter hits. Look-alikes match the CF
  # route but matchSection rejects them in-code.
  { pattern = "frontaliereticino.ch/cerca-lavoro-zurigo*", zone_name = "frontaliereticino.ch" },
  # Remaining 22 canton sections + the 2 article hubs (all-cantons shard wave,
  # 2026-07-26): same rationale as Ticino/Svizzera/Zurigo above — one shard repo
  # per section per locale (see locale-router.js SECTION_ORIGIN/SECTION_ROUTES,
  # source of truth scripts/lib/section-shard-slugs.json). Only each section's IT
  # apex prefix needs its own route; en/de/fr subpaths already reach the Worker
  # via the /en|/de|/fr routes above and are re-targeted in-code (matchSection).
  # WILDCARD required per #2611 (a route without trailing `*` drops the query
  # string, breaking `?utm_*`/`?fbclid=` traffic) — look-alike paths match the CF
  # route but matchSection rejects them in-code, so it's a harmless passthrough.
  { pattern = "frontaliereticino.ch/cerca-lavoro-argovia*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-appenzello*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-basilea*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-berna*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-friburgo*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-ginevra*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-glarona*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-grigioni*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-giura*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-lucerna*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-neuchatel*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-nidvaldo*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-obvaldo*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-sciaffusa*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-soletta*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-svitto*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-turgovia*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-uri*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-vaud*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-vallese*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-zugo*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/cerca-lavoro-san-gallo*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/articoli-frontaliere*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/articoli-svizzera*", zone_name = "frontaliereticino.ch" },
  # Job-alert one-click unsubscribe (RFC 8058). Deliberate non-locale exception to
  # the "locale paths only" scoping above: the unsubscribe links + List-Unsubscribe
  # header in job-alert emails MUST live on the sending domain (frontaliereticino.ch)
  # or the URL↔From-domain mismatch trips spam filters. The Worker transparently
  # proxies this apex path to the jobAlertUnsubscribe Cloud Function (in-code
  # UNSUB_PROXIES branch — method + query + body preserved for the one-click POST).
  # Volume is tiny (a few clicks/day) so the extra Worker invocations are negligible.
  # WILDCARD is REQUIRED: a Cloudflare route WITHOUT a trailing `*` matches only the
  # exact URL with NO query string — but every emitted unsubscribe link carries
  # `?alertId=…&token=…`, so the bare/slash exact routes (#2611) silently missed all
  # real traffic (verified live: `/disiscrivi-alert/` → 400 from the function, but
  # `/disiscrivi-alert/?…` → apex 404). `…/disiscrivi-alert*` covers the bare + slash
  # forms with or without a query string; look-alike paths (e.g. /disiscrivi-alertX)
  # are rejected by the in-code unsubProxyOrigin guard → harmless passthrough.
  { pattern = "frontaliereticino.ch/disiscrivi-alert*", zone_name = "frontaliereticino.ch" },
  # Cold-email (employer outreach) one-click unsubscribe (RFC 8058). Same
  # deliberate non-locale exception as /disiscrivi-alert above: the unsubscribe
  # link + List-Unsubscribe header in cold-outreach emails MUST live on the
  # sending domain (frontaliereticino.ch) or the URL↔From-domain mismatch trips
  # spam filters. The Worker transparently proxies this apex path to the
  # outreachUnsubscribe Cloud Function (in-code UNSUB_PROXIES branch — method +
  # query + body preserved for the one-click POST). WILDCARD required: every
  # emitted link carries `?c=…&t=…`, so a non-wildcard route would silently miss
  # all real traffic (#2611). Look-alike paths rejected by the in-code guard.
  { pattern = "frontaliereticino.ch/disiscrivi-outreach*", zone_name = "frontaliereticino.ch" },
  # Newsletter one-click unsubscribe (RFC 8058). Same deliberate non-locale
  # exception as /disiscrivi-alert above: the List-Unsubscribe header in
  # newsletter emails MUST live on the sending domain (frontaliereticino.ch)
  # or the URL↔From-domain mismatch trips spam filters. Previously the header
  # pointed at the apex root (`/`), which Firebase Hosting's catch-all always
  # serves as the SPA (index.html) — the Cloud Function was never reached, and
  # the SPA itself rejects the plain token-only link for lack of an `ac`
  # autologin credential. This dedicated path bypasses both: the Worker
  # proxies it straight to the newsletterManageSubscription Cloud Function
  # (in-code UNSUB_PROXIES branch — method + query + body preserved for the
  # one-click POST). WILDCARD required: every emitted link carries
  # `?action=…&email=…&token=…`, so a non-wildcard route would silently miss
  # all real traffic (#2611). Look-alike paths rejected by the in-code guard.
  { pattern = "frontaliereticino.ch/disiscrivi-newsletter*", zone_name = "frontaliereticino.ch" },
  # Saved-jobs weekly digest one-click unsubscribe (RFC 8058). Same deliberate
  # non-locale exception as /disiscrivi-alert above: the List-Unsubscribe header
  # in digest emails MUST live on the sending domain (frontaliereticino.ch) or
  # the URL↔From-domain mismatch trips spam filters. The Worker proxies it
  # straight to the savedJobsDigestUnsubscribe Cloud Function (in-code
  # UNSUB_PROXIES branch — method + query + body preserved for the one-click
  # POST). Scoped to this channel only: it flips `users/{uid}.savedJobsDigest.
  # optedOut`, never `newsletter_subscribers` or `job_alert_subscribers/*`.
  # WILDCARD required: every emitted link carries `?uid=…&email=…&token=…`, so
  # a non-wildcard route would silently miss all real traffic (#2611).
  # Look-alike paths rejected by the in-code guard.
  { pattern = "frontaliereticino.ch/disiscrivi-promemoria-salvati*", zone_name = "frontaliereticino.ch" },
  # Pushable-origin edge file, rollout step 1 of N (issue #4881 Fase 3, see
  # locale-router.js EDGE_PUSHED_FILES). Adding the next pushed path is a
  # one-line addition here + one object-literal entry in EDGE_PUSHED_FILES, no
  # other code change.
  #
  # WILDCARD, and the reason is DIAGNOSTIC rather than traffic (this is the one
  # place on this list where those differ). These routes carried no trailing `*`
  # on the argument that "sitemap fetchers never append a query string, so there
  # is no real traffic to miss" — the traffic half of which is still true and
  # measured: Googlebot/GSC fetch these bare and get the Worker.
  #
  # What the old comment also claimed, and what is false, is that a query-string
  # look-alike bypassing the Worker is HARMLESS. Bypassing does not reach the
  # same bytes by another path — it reaches a DIFFERENT ORIGIN. Measured
  # 2026-08-08 on /sitemap-topics-frontaliere.xml:
  #
  #   bare    → cache-control: public, max-age=300            (Worker → R2)
  #   ?cb=1   → x-served-by: cache-mxp…, etag, max-age=600    (GitHub Pages)
  #
  # and the whole reason EDGE_PUSHED_FILES exists is that those two disagree:
  # #4974 measured the Pages copy serving sitemap-blog.xml with 15230→0 hreflang
  # alternates, and #5001 measured the apex topic sitemap announcing 36 page-N
  # URLs no shard had while missing 32 every shard did. The two agree only in
  # the window right after a full deploy; every fast publish reopens the gap.
  #
  # So without the wildcard, any cache-busted probe of these paths measures the
  # copy we deliberately stopped serving, and reports it as the live one. That
  # has already cost diagnosis time. The wildcard makes the routing independent
  # of the query string, which is the only way a probe and a user can be
  # guaranteed to be looking at the same file.
  #
  # Safe by construction, the same argument the /disiscrivi-* and section routes
  # above already make: servePushedEdgeFile is an EXACT-match lookup on
  # `EDGE_PUSHED_FILES[url.pathname]`, so a look-alike like
  # /sitemap-blog-ch.xml.bak matches this CF route, misses the table, and falls
  # through the dispatch chain to the very same apex passthrough that serves it
  # today. Fail-open on an R2 miss/timeout is unchanged. The extra Worker
  # invocations are negligible and, since the account moved to Workers Paid (see
  # the header note), volume is no longer a scoping constraint.
  { pattern = "frontaliereticino.ch/sitemap-blog-ch.xml*", zone_name = "frontaliereticino.ch" },
  # The other three apex sitemaps, registered for CORRECTNESS rather than
  # freshness (issue #4974): measured live against the exact commit the last
  # successful deploy built, the passthrough origin serves each of them stripped
  # of ALL its hreflang alternates — blog 15230→0, glossario 210→0, news 50→0 —
  # while /sitemap-blog-ch.xml above, served from this same edge origin, is
  # byte-identical to its committed copy. Same wildcard rationale as above —
  # and these three are the sharpest case for it, since the origin the query
  # string falls back to is precisely the one measured to strip the alternates.
  # sitemap-pages.xml is deliberately NOT here: it loses some (1480→190), not
  # all, which is a different signature.
  { pattern = "frontaliereticino.ch/sitemap-blog.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/sitemap-glossario.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/sitemap-news.xml*", zone_name = "frontaliereticino.ch" },
  # The ten RSS feeds. A route is REQUIRED alongside the EDGE_PUSHED_FILES
  # entry: without one the Worker never sees the request and the apex keeps
  # answering from Pages — an entry with no route is a 404 dressed up as a
  # publish bug, which is exactly what /sitemap-articles-archive.xml cost.
  { pattern = "frontaliereticino.ch/rss.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-it.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-en.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-de.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-fr.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-svizzera.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-svizzera-it.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-svizzera-en.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-svizzera-de.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/rss-svizzera-fr.xml*", zone_name = "frontaliereticino.ch" },
  # A route is REQUIRED, not just an EDGE_PUSHED_FILES entry: without one the
  # Worker never sees the request and the apex answers from Pages. Registering
  # /sitemap-articles-archive.xml in that map and uploading the R2 object left
  # it 404 for four hours — the object was there (200 on the CDN host), the
  # Worker was deployed with the entry, and nothing routed to it.
  { pattern = "frontaliereticino.ch/sitemap-articles-archive.xml*", zone_name = "frontaliereticino.ch" },
  # Article topic hubs (#5001), one file per section. Same "a route is REQUIRED"
  # lesson as the line above — an EDGE_PUSHED_FILES entry without a route is a
  # 404 that looks like a publish bug. Wildcard, same reason as every sitemap
  # route here; /sitemap-topics-frontaliere.xml is the path the bare-vs-?cb=1
  # origin split was measured on.
  { pattern = "frontaliereticino.ch/sitemap-topics-frontaliere.xml*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/sitemap-topics-svizzera.xml*", zone_name = "frontaliereticino.ch" },
  # Pushable-origin edge files, rollout step 2 (issue #4881 residual — llms.txt
  # family, see locale-router.js EDGE_PUSHED_FILES). Same wildcard rationale as
  # /sitemap-blog-ch.xml above. AI crawlers (GPTBot, ClaudeBot, PerplexityBot,
  # Google-Extended, ...) do fetch these bare, so as with the sitemaps the
  # wildcard is not about winning back traffic — it is about the query-string
  # variant not silently resolving to the other origin. /en/llms.txt,
  # /de/llms.txt, /fr/llms.txt need NO new route here — they already reach the
  # Worker via the /en|/de|/fr routes above (LOCALE_RE) and are deliberately NOT
  # in EDGE_PUSHED_FILES (see that table's comment for why).
  { pattern = "frontaliereticino.ch/llms.txt*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/llms-full.txt*", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/.well-known/llms.txt*", zone_name = "frontaliereticino.ch" },
  # NOTE: the /assets/* /data/* /og/* CDN-proxy routes were removed (2026-06-10).
  # Since #1665 the shard locale HTML references those static paths CDN-absolute
  # (cdn.frontaliereticino.ch/...), so the browser fetches them straight from the
  # CDN — they no longer hit the apex and need no Worker proxy. Keeping the routes
  # only burned ~10 needless Worker subrequests per shard pageview against the
  # free-tier 100k/day cap (the in-code CDN_PATHS branch was already dropped).
]

# Workers Logs (Observability). Persists per-request logs + console output + the
# request outcome (status, CPU, errors) to the dashboard (Workers & Pages →
# frontaliere-locale-router → Logs) with a short retention. Declared HERE (not via
# a one-off dashboard/API toggle) so every `wrangler deploy` keeps it on — an API
# PATCH would be wiped on the next deploy.
# head_sampling_rate = 1 logs 100% of invocations. The Worker now handles the
# en/de/fr shard traffic PLUS the ticino/svizzera/zurigo sections across all four
# locales (a chunk of the former IT bulk), so invocation volume is materially
# higher than before.
# 100% sampling is kept deliberately: on Workers Paid the Logs allowance has ample
# headroom, and full sampling preserves complete visibility into the shard 5xx /
# stale-if-error path (the exact path involved in the #3178 incident). If Logs
# volume ever approaches the plan allowance, lower this rate rather than dropping
# to zero — do NOT lose the 5xx visibility.
[observability]
enabled = true
head_sampling_rate = 1

