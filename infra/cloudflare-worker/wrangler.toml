# Cloudflare Worker config for the frontaliereticino.ch locale router.
# Deploy: `npx wrangler deploy` (or paste locale-router.js in the dashboard).
# Requires the zone frontaliereticino.ch to be on Cloudflare (NS moved) first.

name = "frontaliere-locale-router"
main = "locale-router.js"
compatibility_date = "2026-01-01"

# Scope the Worker to ONLY the locale paths so the IT bulk (~95% of traffic) is
# pure Cloudflare passthrough with no Worker subrequest. Three patterns per
# locale cover the subtree, the bare homepage path, and the .html homepage file
# without ever matching look-alikes like /enterprise (exact-match routes have no
# trailing wildcard). The in-code LOCALE_RE is the matching guard.
routes = [
  { pattern = "frontaliereticino.ch/en/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/en",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/en.html", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/de.html", zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr/*",    zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr",      zone_name = "frontaliereticino.ch" },
  { pattern = "frontaliereticino.ch/fr.html", zone_name = "frontaliereticino.ch" },
  # NOTE: the /assets/* /data/* /og/* CDN-proxy routes were removed (2026-06-10).
  # Since #1665 the shard locale HTML references those static paths CDN-absolute
  # (cdn.frontaliereticino.ch/...), so the browser fetches them straight from the
  # CDN — they no longer hit the apex and need no Worker proxy. Keeping the routes
  # only burned ~10 needless Worker subrequests per shard pageview against the
  # free-tier 100k/day cap (the in-code CDN_PATHS branch was already dropped).
]

# Workers Logs (Observability) — free tier. Persists per-request logs +
# console output + the request outcome (status, CPU, errors) to the dashboard
# (Workers & Pages → frontaliere-locale-router → Logs) with a short retention.
# Declared HERE (not via a one-off dashboard/API toggle) so every
# `wrangler deploy` keeps it on — an API PATCH would be wiped on the next deploy.
# head_sampling_rate = 1 logs 100% of invocations; the Worker only handles the
# en/de/fr shard traffic (well under the free 100k/day invocation cap), so full
# sampling stays within the free Workers Logs daily allowance and gives complete
# visibility into the shard 504 path (whether the origin retry / last-known-good
# fallback actually fires).
[observability]
enabled = true
head_sampling_rate = 1

