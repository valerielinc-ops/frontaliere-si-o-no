name: fixture-dual-declared
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fast, slow]
  workflow_call:
    inputs:
      mode:
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Do the thing
        run: node scripts/thing.mjs --mode "${{ inputs.mode }}"
