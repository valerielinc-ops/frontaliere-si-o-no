		"description": "Profil\n\nMcDonald\u2019s, the world\u2019s largest restaurant chain, is an innovative and people-oriented company backed by a leading multinational brand. Currently, there are 190 McDonald\u2019s restaurants in Switzerland, run by 46 independent entrepreneurs (franchisees). Because our business is growing fast, we are looking for talented people to strengthen our main offices that provide support to all restaurants. To complement its Development department based in Crissier, McDonald\u2019s Switzerland is looking to fill the role of :\nAsset Management & Real Estate Manager (100%)\nWe are looking for an experienced professional to strengthen our Development department. As Manager Asset Management & Real Estate, you take on a senior, strategic role at the heart of McDonald\u2019s real estate expansion in Switzerland. You are responsible for driving the nationwide real estate strategy, securing the long\u2011term growth of our restaurant portfolio, and optimizing our existing assets. Through your expertise, network, and leadership, you play a key role in shaping McDonald\u2019s presence on the Swiss market.\nKey Responsibilities\n\nLead Asset Management and Real Estate Expansion across Switzerland, managing and developing a team of four team members.\nDevelop and implement the real estate strategy, identify new sites, and maintain a solid and well\u2011structured project pipeline.\nAssess the suitability of land and properties, prepare revenue estimates, and ensure project profitability (ROI).\nOptimize the existing portfolio and lead negotiations related to new sites, renewals, relocations, or lease terminations.\nNegotiate, draft, and finalize contracts and official documents with partners and authorities.\nPrepare reports, market analyses, and present projects to the DMT Board for validation.\nRepresent McDonald\u2019s with external partners and maintain a strong network to support expansion activities.\n\n\nWhat You Need to Be Successful\n\n\u00a0\n\nUniversity or university of applied sciences degree in Real Estate or an equivalent qualification.\nSeveral years of successful experience in Real Estate expansion, site development, and\/or Asset Management; retail experience is a strong asset.\nProven leadership experience with the ability to motivate, structure, and develop a team.\nStrong knowledge of the Swiss real estate market and an established network, ideally within German-speaking Switzerland.\nExcellent negotiation skills and a proven ability to manage high-stake contractual discussions.\nStrong analytical ability, structured working style, and capacity to manage complex projects and priorities.\nProactive, solution-oriented mindset with strong planning abilities.\nWillingness and motivation to travel regularly throughout Switzerland.\nLanguages: Native German speaker with perfect command of English. French is a strong additional asset.\n\n\nWith us, you get the following benefits\n\n\u00a0\n\nFlexible working: the ability to work remotely to achieve the best possible balance between work and private life. Home Office is possible. Working hours are flexible in agreement with the leader, taking into account business and individual needs.\nMobility benefit associated with this position: company car or SBB season ticket or a travel allowance.\nBonus: a variable percentage based on performance and commercial results.\nActive talent management: targeted engagement in personal learning and skills development, on-site, via e-learning, or on the lively campus of Hamburger University in London, Paris, and Munich.\nEmployee well-being: contributions to wellness activities.\nAttractive discounts in our restaurants and food for employees.\nProgram packed with exclusive discounts on our partner platform, corporate benefits.\n\n\n",
