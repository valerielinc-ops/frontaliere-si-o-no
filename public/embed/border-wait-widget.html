<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Attese dogane live · Frontaliere Ticino widget</title>
<!--
  Frontaliere Ticino — embeddable border-wait widget (clone of the
  currency-widget.html pattern, see that file for the original).

  Purpose
  -------
  External sites (blogs, comuni di frontiera, forum pendolari) can <iframe>
  this file to show live wait times for the top-5 Ticino border crossings
  without pulling the full SPA. Every embed carries a visible attribution
  link back to frontaliereticino.ch (rel="noopener", NOT nofollow — the
  editorial link is the point).

  Data source
  -----------
  Reads /embed/border-wait-widget-data.json at load time. That file is a
  static snapshot of the same dataset build-plugins/borderWaitPagesPlugin.ts
  uses for the /traffico-dogane/ pages (data/border-wait-current.json,
  refreshed every 15-30min by .github/workflows/traffic-scheduler.yml) and is
  regenerated at every site build. The fallback markup below (baked-in
  values) keeps the widget working even when the fetch fails — e.g. before
  the first deploy, or if the file is temporarily unreachable. No runtime API
  keys, no Firebase Remote Config, no auth.

  Embed snippet (copy-paste for external sites):
  ----------------------------------------------
    <iframe
      src="https://frontaliereticino.ch/embed/border-wait-widget.html"
      title="Attese dogane live · Frontaliere Ticino"
      width="100%"
      height="360"
      loading="lazy"
      style="border:0;max-width:480px"
    ></iframe>
-->
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#ffffff;color:#0f172a;padding:0;line-height:1.45}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}}
  .card{max-width:480px;margin:0;padding:18px 20px;border:1px solid rgba(148,163,184,.35);border-radius:12px;background:rgba(248,250,252,.55)}
  @media (prefers-color-scheme:dark){.card{background:rgba(30,41,59,.4);border-color:rgba(148,163,184,.25)}}
  .brand{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748b;margin:0 0 10px}
  .brand b{color:#0f172a}
  @media (prefers-color-scheme:dark){.brand b{color:#e2e8f0}}
  .sub{font-size:13px;color:#475569;margin:0 0 12px}
  @media (prefers-color-scheme:dark){.sub{color:#94a3b8}}
  .rows{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.12)}
  .row .name{font-size:13px;font-weight:600;color:#0f172a}
  @media (prefers-color-scheme:dark){.row .name{color:#e2e8f0}}
  .row .wait{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.green{background:#16a34a}
  .dot.yellow{background:#eab308}
  .dot.red{background:#dc2626}
  .cta{display:inline-block;margin-top:2px;padding:9px 14px;border-radius:10px;background:#4f46e5;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
  .cta:hover{background:#4338ca}
  .src{font-size:11px;color:#94a3b8;margin:10px 0 0}
  .src a{color:inherit;text-decoration:underline}
</style>
</head>
<body>
<main class="card" aria-labelledby="widgetTitle">
  <p class="brand"><b>Frontaliere Ticino</b> · <span id="widgetTitle">attese dogane live</span></p>
  <p class="sub" id="asOf">fallback snapshot</p>
  <ul class="rows" id="rows" aria-label="Attese ai valichi principali">
    <li class="row"><span class="name">Chiasso Brogeda</span><span class="wait"><span class="dot green"></span>0 min</span></li>
    <li class="row"><span class="name">Chiasso Centro</span><span class="wait"><span class="dot green"></span>0 min</span></li>
    <li class="row"><span class="name">Gaggiolo</span><span class="wait"><span class="dot green"></span>0 min</span></li>
    <li class="row"><span class="name">Oria Gandria</span><span class="wait"><span class="dot green"></span>0 min</span></li>
    <li class="row"><span class="name">Ponte Tresa</span><span class="wait"><span class="dot green"></span>1 min</span></li>
  </ul>
  <a class="cta"
     href="https://frontaliereticino.ch/traffico-dogane/?utm_source=embed&amp;utm_medium=widget&amp;utm_campaign=border-wait"
     target="_top"
     rel="noopener">
    Vedi tutti i valichi &rsaquo;
  </a>
  <p class="src">
    Fonte:
    <a href="https://frontaliereticino.ch/traffico-dogane/?utm_source=embed&amp;utm_medium=widget&amp;utm_campaign=border-wait"
       target="_top"
       rel="noopener">frontaliereticino.ch</a>
  </p>
</main>
<script>
  // Fetch the live snapshot; fall back silently to the baked-in markup above
  // if the file is missing, the site is offline, or the request is blocked.
  (function () {
    var STATUS_LABEL = { green: 'scorrevole', yellow: 'rallentato', red: 'congestionato' };
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    try {
      fetch('/embed/border-wait-widget-data.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) return;
          if (data.updatedAt) {
            var a = document.getElementById('asOf');
            if (a) a.textContent = 'aggiornato al ' + data.updatedAt;
          }
          if (Array.isArray(data.crossings) && data.crossings.length > 0) {
            var rows = document.getElementById('rows');
            if (rows) {
              rows.innerHTML = data.crossings
                .map(function (c) {
                  var status = STATUS_LABEL[c.status] ? c.status : 'green';
                  var waitText = c.waitMinutes === null || c.waitMinutes === undefined
                    ? '—'
                    : c.waitMinutes + ' min';
                  return (
                    '<li class="row"><span class="name">' + escapeHtml(c.name) +
                    '</span><span class="wait"><span class="dot ' + status + '" title="' +
                    STATUS_LABEL[status] + '"></span>' + escapeHtml(waitText) + '</span></li>'
                  );
                })
                .join('');
            }
          }
        })
        .catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
